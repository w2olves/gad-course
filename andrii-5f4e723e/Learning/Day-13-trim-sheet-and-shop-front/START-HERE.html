<script id="data" type="application/json">{"learner": "ib-andrii-5f4e723e", "learnerName": {"en": "Andrii", "uk": "Андрій"}, "day": 13, "week": 3, "total": 60, "title": {"en": "Trim sheets: T_Trim_Harbour and your first shop front", "uk": "Трим-шити: T_Trim_Harbour і твій перший фасад крамниці"}, "theme": {"en": "Week 3: Surfaces", "uk": "Тиждень 3: Поверхні"}, "build": {"item": {"en": "T_Trim_Harbour, a trim sheet for the whole harbour, and SM_ShopFront_A built with it", "uk": "T_Trim_Harbour, трим-шит для всієї гавані, і зібраний з ним SM_ShopFront_A"}, "why": {"en": "A trim sheet is one texture of horizontal strips (fascia boards, stone, frames, planks, metal) that many pieces share, and each strip tiles: it repeats from left to right with no visible join. One trim and one material can dress the edges of a whole street, which saves memory and draw calls (a draw call is one 'draw this' order to the graphics card). Studios build harbour and city kits this way, and a shop front is the classic first test. Your fronts come back in district 1 (Day 42) and district 2 (Day 49).", "uk": "Трим-шит — це одна текстура з горизонтальних смуг (вивісні дошки, камінь, рами, дошки, метал), яку ділять між собою багато деталей, і кожна смуга тайлиться: повторюється зліва направо без помітного стику. Один трим і один матеріал можуть оздобити краї цілої вулиці, а це економить пам'ять і виклики малювання (draw call — це один наказ «намалюй це» для відеокарти). Студії так будують набори для гаваней і міст, а фасад крамниці — класичний перший тест. Твої фасади повернуться в районі 1 (День 42) і районі 2 (День 49)."}, "where": {"en": "Course/Day13 for the trim, its instance and the front; L_KitTest beside your small harbour building.", "uk": "Course/Day13 для триму, його інстанса й фасаду; L_KitTest поруч із твоєю маленькою будівлею в гавані."}, "spec": [{"en": "T_Trim_Harbour: 2048 x 2048 px, at the kit standard, so the sheet is 2 m wide and every 512 px is 50 cm. Picture it as a 2 x 2 m sheet of material samples cut into seven horizontal bands, like a striped flag. Each strip tiles left to right with no visible seam.", "uk": "T_Trim_Harbour: 2048 x 2048 px у стандарті набору, тож аркуш має 2 м завширшки, а кожні 512 px — це 50 см. Уяви його як аркуш зразків матеріалів 2 x 2 м, розрізаний на сім горизонтальних смуг, як смугастий прапор. Кожна смуга тайлиться зліва направо без помітного шва."}, {"en": "Seven strips from the top: 1 painted fascia board (the sign board above a shop; 512 px, 50 cm), 2 stone plinth (the base of a wall) and coping (the top stones of a quay wall; 512 px), 3 painted timber boards (256 px, 25 cm), 4 window-frame paint (256 px), 5 bare weathered planks (256 px), 6 galvanised metal (128 px, 12.5 cm), 7 black rubber (128 px).", "uk": "Сім смуг згори: 1 фарбована вивісна дошка (fascia, дошка над крамницею для вивіски; 512 px, 50 см), 2 кам'яний цоколь (нижня частина стіни) і парапет (верхні камені стінки набережної; 512 px), 3 фарбовані дерев'яні дошки (256 px, 25 см), 4 фарба віконних рам (256 px), 5 голі вивітрені дошки (256 px), 6 оцинкований метал (128 px, 12,5 см), 7 чорна гума (128 px)."}, {"en": "A strip table in trim_strips.md: strip, V range (V is the up direction of the UV square, 0 at the bottom, 1 at the top), real height and use.", "uk": "Таблиця смуг у trim_strips.md: смуга, діапазон V (V — напрямок угору в UV-квадраті, 0 унизу, 1 угорі), реальна висота й призначення."}, {"en": "SM_ShopFront_A: 4 m wide (two grid steps), 3 m tall like SM_Wall_2m and 0.3 m deep, with its front facing -Y like your walls. Pivot at the bottom left corner of its back face, so it can stand flat against any wall.", "uk": "SM_ShopFront_A: 4 м завширшки (два кроки сітки), 3 м заввишки, як SM_Wall_2m, і 0,3 м завглибшки, лицем у бік -Y, як твої стіни. Півот — у нижньому лівому куті задньої грані, щоб фасад міг стати впритул до будь-якої стіни."}, {"en": "Real parts: a shop window 2.2 m wide over a 50 cm stone plinth, and a door 1 m wide. Both are topped at 2.5 m by a 50 cm fascia board from 2.5 to 3 m (where a shop sign would go): exactly the height of strip 1. Openings are recessed 10 to 15 cm.", "uk": "Справжні частини: вітрина 2,2 м завширшки над кам'яним цоколем 50 см і двері 1 м завширшки. Над обома на висоті 2,5 м іде вивісна дошка 50 см, від 2,5 до 3 м (там, де була б вивіска): точно висота смуги 1. Отвори заглиблені на 10–15 см."}, {"en": "Four slots: Trim (MI_Trim_Harbour) for the long, thin parts; Plaster (MI_Plaster) for the big flat wall; Door (MI_Wood); Glass (MI_Glass). 5,000 triangles or fewer; UCX collision boxes as in Week 1.", "uk": "Чотири слоти: Trim (MI_Trim_Harbour) для довгих тонких частин; Plaster (MI_Plaster) для великої пласкої стіни; Door (MI_Wood); Glass (MI_Glass). Не більше 5 000 трикутників; коробки колізії UCX, як на Тижні 1."}, {"en": "Trim islands keep the kit density: a 50 cm part fills a 50 cm strip; thin parts use part of a strip; a strip is never squashed.", "uk": "Острівці на тримі зберігають щільність набору: частина 50 см заповнює смугу 50 см; тонкі частини займають частину смуги; смугу ніколи не стискають."}], "piece1": "the trim sheet and the shop window part of the front (shared with the lessons)", "piece2": {"en": "The door, fascia, sill, slots, collision and export of SM_ShopFront_A, on your own", "uk": "Двері, вивісна дошка, підвіконня, слоти, колізія та експорт SM_ShopFront_A, самостійно"}, "steps": [{"text": {"en": "Fill strips 1, 3 and 4 (fascia paint, timber boards, frame paint): a flat paint colour with a soft, low-opacity noise brush. For the boards, use your Day 12 wood with a paint-colour layer on top. Check: zoomed out to 25 %, each strip reads as its material.", "uk": "Заповни смуги 1, 3 і 4 (фарба вивісної дошки, дерев'яні дошки, фарба рам): рівний колір фарби плюс м'який пензель шуму з низькою непрозорістю. Для дощок візьми своє дерево з Дня 12 і шар кольору фарби зверху. Перевірка: при зменшенні до 25 % кожна смуга читається як свій матеріал."}, "lesson": 2}, {"text": {"en": "Fill strips 6 and 7 (galvanised metal, black rubber): a grey and a near-black with faint scratches and noise. Check: no strip is a perfectly flat colour.", "uk": "Заповни смуги 6 і 7 (оцинкований метал, чорна гума): сірий і майже чорний з ледь помітними подряпинами й шумом. Перевірка: жодна смуга не є ідеально рівним кольором."}, "lesson": 2}, {"text": {"en": "Seam check: press W in Krita (Wrap Around Mode), look along each strip's left-right join and clone out any hard line. Export T_Trim_Harbour.png again and Reimport it in Unreal. Check: no line shows where a strip repeats.", "uk": "Перевірка швів: натисни W у Krita (Wrap Around Mode), подивися вздовж стику ліво-право кожної смуги й затри клоном будь-яку різку лінію. Знову експортуй T_Trim_Harbour.png і зроби Reimport в Unreal. Перевірка: там, де смуга повторюється, лінії не видно."}, "lesson": 2}, {"text": {"en": "Finish trim_strips.md (strip 1 is at the top, so it has the highest V): strip number, V range (strip 1 is V 0.75 to 1.0, down to strip 7, V 0 to 0.0625), real height and use. Check: seven rows and no gaps between the V ranges.", "uk": "Заверши trim_strips.md (смуга 1 угорі, тож у неї найвищий V): номер смуги, діапазон V (смуга 1 — V від 0.75 до 1.0, і так униз до смуги 7, V від 0 до 0.0625), реальна висота й призначення. Перевірка: сім рядків і жодних проміжків між діапазонами V."}, "lesson": 1}, {"text": {"en": "Door: select the two door faces, inset them 5 cm (I, type 0.05) and push them in 10 cm (E, type -0.1). Check: from the side, the door sits 10 cm behind the wall face.", "uk": "Двері: виділи дві грані дверей, зроби Inset на 5 см (I, введи 0.05) і втисни їх на 10 см (E, введи -0.1). Перевірка: збоку видно, що двері стоять на 10 см глибше за площину стіни."}, "lesson": 3}, {"text": {"en": "Fascia: select the band of front faces between Z 2.5 and 3.0 m (the top 50 cm of the front) and push it out 5 cm (E, type 0.05). Check: from the side, the fascia stands out from the wall.", "uk": "Вивісна дошка: виділи смугу передніх граней між Z 2.5 і 3.0 м (верхні 50 см фасаду) і висунь її на 5 см (E, введи 0.05). Перевірка: збоку вивісна дошка виступає зі стіни."}, "lesson": 3}, {"text": {"en": "Sill (the ledge under a window): select the bottom face of the window frame and push it out 5 cm (E, 0.05). Check: in Material Preview, the sill casts a thin shadow line under the window.", "uk": "Підвіконня (виступ під вікном): виділи нижню грань віконної рами й висунь її на 5 см (E, 0.05). Перевірка: у Material Preview підвіконня кидає тонку лінію тіні під вікном."}, "lesson": 3}, {"text": {"en": "Slots: Plaster for the wall faces, Trim for the fascia, plinth, sill and frames, Door for the door, Glass for the pane. Check: each slot's Select button lights up only its faces.", "uk": "Слоти: Plaster для граней стіни, Trim для вивісної дошки, цоколю, підвіконня й рам, Door для дверей, Glass для шибки. Перевірка: кнопка Select кожного слота підсвічує лише його грані."}, "lesson": "D12.2"}, {"text": {"en": "Map the front: Smart UV Project, Average Islands Scale, scale all islands until the fascia fills strip 1's height, then move each part into its strip (fascia 1, plinth and sill 2, frames 4). Check: in Material Preview every part shows the right material at the same grain size as TD_Reference.", "uk": "Розклади фасад: Smart UV Project, Average Islands Scale, масштабуй усі острівці, доки вивісна дошка не заповнить висоту смуги 1, потім пересунь кожну частину в її смугу (вивісна дошка — 1, цоколь і підвіконня — 2, рами — 4). Перевірка: у Material Preview кожна частина показує правильний матеріал з тим самим розміром зерна, що й TD_Reference."}, "lesson": 4}, {"text": {"en": "Collision and export: two UCX boxes (UCX_SM_ShopFront_A_00 for the wall, UCX_SM_ShopFront_A_01 for the fascia), with the shop front's origin at the bottom left corner of its back face on the world origin. Keep 5,000 triangles or fewer (turn on Statistics in the Overlays menu), then export SM_ShopFront_A.fbx with your Week 1 settings. Check: in the export window, only SM_ShopFront_A and its two UCX boxes were selected, and Location reads 0, 0, 0.", "uk": "Колізія й експорт: дві коробки UCX (UCX_SM_ShopFront_A_00 для стіни, UCX_SM_ShopFront_A_01 для вивісної дошки), а початок координат фасаду — у нижньому лівому куті його задньої грані, на початку координат світу. Тримай не більше 5 000 трикутників (увімкни Statistics у меню Overlays), потім експортуй SM_ShopFront_A.fbx з налаштуваннями Тижня 1. Перевірка: у вікні експорту виділено лише SM_ShopFront_A і дві її коробки UCX, а Location показує 0, 0, 0."}, "lesson": "D11.4"}, {"text": {"en": "In Unreal import it into Course/Day13, set its four slots in the Static Mesh Editor, and place it in L_KitTest beside your harbour building, snapped to the grid, then press End. Check: it shows the trim, plaster, wood and glass, and nothing floats.", "uk": "В Unreal імпортуй його в Course/Day13, признач чотири слоти в Static Mesh Editor і постав фасад у L_KitTest поруч із будівлею гавані з прив'язкою до сітки, потім натисни End. Перевірка: видно трим, штукатурку, дерево й скло, і ніщо не висить у повітрі."}, "lesson": "D12.4"}, {"text": {"en": "Reuse the trim: in quaykit_day11.blend, give SM_QuayEdge_4m's top (coping) faces a new Trim slot (+, New, name Trim, with T_Trim_Harbour.png in its Base Color as in lesson 4), move their island into strip 2 without scaling, export, Reimport and set the slot. Check: the quay coping and the shop plinth show the same stone.", "uk": "Повторне використання триму: у quaykit_day11.blend признач верхнім граням (парапету) SM_QuayEdge_4m новий слот Trim (+, New, назва Trim, з T_Trim_Harbour.png у Base Color, як в уроці 4), пересунь їхній острівець у смугу 2 без масштабування, експортуй, зроби Reimport і признач слот. Перевірка: парапет набережної й цоколь крамниці показують той самий камінь."}, "lesson": 4}, {"text": {"en": "Before/after capture: the front before mapping (grey) and finished, from the same view. Then a 60-second clip flying past the front at 3 m. Save today's clip as flythrough_day13.mp4 and check that you also have trim_on_front.png and before_after_day13.png (each is described in today's hand-in list; take any you are missing now). Check: in the clip, the fascia, frames, plinth and wall read as different materials.", "uk": "Знімок «до/після»: фасад до розкладки (сірий) і готовий, з того самого ракурсу. Потім 60-секундний кліп прольоту повз фасад на висоті 3 м. Збережи сьогоднішній кліп як flythrough_day13.mp4 і перевір, що в тебе також є trim_on_front.png і before_after_day13.png (кожен описано в сьогоднішньому списку «Здати роботу»; зроби зараз ті, яких бракує). Перевірка: у кліпі вивісна дошка, рами, цоколь і стіна читаються як різні матеріали."}, "lesson": 4}]}, "lessons": [{"title": {"en": "Trim sheets: plan the strips", "uk": "Трим-шити: плануємо смуги"}, "minutes": 40, "goals": [{"en": "Explain a trim sheet: one texture of horizontal strips that tile left to right, shared by many pieces with one material.", "uk": "Поясни, що таке трим-шит: одна текстура з горизонтальних смуг, які тайляться зліва направо і які ділять між собою багато деталей з одним матеріалом."}, {"en": "Plan strip heights at the kit standard: 512 px is 50 cm, 256 px is 25 cm and 128 px is 12.5 cm, adding up to 2048 px (2 m). In real size: 50 + 50 + 25 + 25 + 25 + 12.5 + 12.5 = 200 cm.", "uk": "Сплануй висоти смуг у стандарті набору: 512 px — це 50 см, 256 px — 25 см, а 128 px — 12,5 см, разом 2048 px (2 м). У реальному розмірі: 50 + 50 + 25 + 25 + 25 + 12,5 + 12,5 = 200 см."}, {"en": "Set up a 2048 x 2048 canvas in Krita with guides and a flat colour block in each strip.", "uk": "Підготуй у Krita полотно 2048 x 2048 з напрямними й рівним блоком кольору в кожній смузі."}], "doalong": [{"en": "Find a real photo of a small harbour shop front on Wikimedia Commons (commons.wikimedia.org) and list the surfaces you see: fascia board, stone base, timber, frames, metal, rubber fenders. You see that a few surfaces repeat everywhere.", "uk": "Знайди на Wikimedia Commons (commons.wikimedia.org) справжнє фото фасаду маленької крамниці в гавані й випиши поверхні, які бачиш: вивісна дошка, кам'яна основа, дерево, рами, метал, гумові кранці. Ти бачиш, що кілька поверхонь повторюються всюди."}, {"en": "On paper, draw a square and label it 2 m x 2 m. Split it into seven bands from the top: 50, 50, 25, 25, 25, 12.5 and 12.5 cm, and write a surface in each (fascia, stone, timber boards, frame paint, planks, metal, rubber). You see your trim plan: one band is one strip, and the bands add up to 200 cm.", "uk": "На папері намалюй квадрат і підпиши його 2 м x 2 м. Поділи його згори на сім смуг: 50, 50, 25, 25, 25, 12,5 і 12,5 см, і впиши в кожну поверхню (вивісна дошка, камінь, дерев'яні дошки, фарба рам, дошки, метал, гума). Ти бачиш свій план триму: одна смуга — це одна смуга текстури, а разом вони дають 200 см."}, {"en": "Open Krita: File > New, Width 2048, Height 2048, then Create. Open Settings > Dockers > Grid and Guides. On its Grid tab, tick Show Grid and Snap to Grid, and set X spacing and Y spacing to 128 px (as on Day 4, where you used 100 px). Turn on View > Show Rulers and drag guides down from the top ruler onto the grid lines 4, 8, 10, 12, 14 and 15 squares down (512, 1024, 1280, 1536, 1792 and 1920 px). You see seven strips.", "uk": "Відкрий Krita: File > New, Width 2048, Height 2048, потім Create. Відкрий Settings > Dockers > Grid and Guides. На його вкладці Grid постав галочки Show Grid і Snap to Grid та задай X spacing і Y spacing 128 px (як на Дні 4, тільки там було 100 px). Увімкни View > Show Rulers і перетягни напрямні з верхньої лінійки на лінії сітки на 4, 8, 10, 12, 14 і 15 клітинок униз (512, 1024, 1280, 1536, 1792 і 1920 px). Ти бачиш сім смуг."}, {"en": "Pick the Fill tool (the paint bucket) and fill each strip with a flat colour for its surface: 1 fascia paint, 2 stone, 3 timber boards, 4 frame paint, 5 planks, 6 grey metal, 7 black rubber. You see a striped sheet like a flag.", "uk": "Вибери інструмент Fill (відро з фарбою) і заповни кожну смугу рівним кольором її поверхні: 1 фарба вивісної дошки, 2 камінь, 3 дерев'яні дошки, 4 фарба рам, 5 дошки, 6 сірий метал, 7 чорна гума. Ти бачиш смугастий аркуш, схожий на прапор."}, {"en": "File > Save As T_Trim_Harbour.kra in your Day13 folder. You see the name in Krita's title bar.", "uk": "File > Save As T_Trim_Harbour.kra у папку Day13. Ти бачиш назву в заголовку вікна Krita."}, {"en": "Start trim_strips.md: strip 1, V 0.75 to 1.0, 50 cm, painted fascia; continue down to strip 7, V 0 to 0.0625, 12.5 cm, black rubber. You see a table of seven rows.", "uk": "Почни trim_strips.md: смуга 1, V від 0.75 до 1.0, 50 см, фарбована вивісна дошка; і так униз до смуги 7, V від 0 до 0.0625, 12,5 см, чорна гума. Ти бачиш таблицю із семи рядків."}], "play": {"en": "Constraint challenge: the tutor names six harbour pieces (a bench, a shutter, a lamp post, a quay ladder, a door frame, a fender). I say which strips each would use. Any piece that needs a new strip costs a point.", "uk": "Виклик з обмеженням: тьютор називає шість деталей гавані (лавка, віконниця, ліхтарний стовп, драбина набережної, дверна рама, кранець). Я кажу, які смуги потрібні кожній. Кожна деталь, якій потрібна нова смуга, коштує бал."}, "video": {"url": "https://www.youtube.com/watch?v=ga89MuH_ubk", "title": "How to Make Game Assets in BLENDER Like The Pros With Trim Sheets!", "channel": "NoPoly", "length": "8:58", "search": "blender trim sheet game assets"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Trim sheets: plan the strips (Day 13, lesson 1 of 4).\nToday's build: T_Trim_Harbour, a trim sheet for the whole harbour, and SM_ShopFront_A built with it.\n\nBy the end of this lesson I can:\n1. Explain a trim sheet: one texture of horizontal strips that tile left to right, shared by many pieces with one material.\n2. Plan strip heights at the kit standard: 512 px is 50 cm, 256 px is 25 cm and 128 px is 12.5 cm, adding up to 2048 px (2 m). In real size: 50 + 50 + 25 + 25 + 25 + 12.5 + 12.5 = 200 cm.\n3. Set up a 2048 x 2048 canvas in Krita with guides and a flat colour block in each strip.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (Your kit now wears real materials from one master material, with instances for metal, wood, stone, plaster and glass.), what I will learn today (You make T_Trim_Harbour, a trim sheet of seven strips, and build SM_ShopFront_A, a 4 m shop front textured with it.), encourage me (Trim sheets are a studio favourite and learning them now puts you ahead; if a strip looks wrong, adjust it and carry on.), and share today's quote: \"Inspiration is for amateurs — the rest of us just show up and get to work.\" (Chuck Close).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 10: what does saving your harbour house as a Level Instance (LI_HarbourHouse) let you do later? | Day 7: where does a kit piece's pivot go, and why?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Constraint challenge: the tutor names six harbour pieces (a bench, a shutter, a lamp post, a quay ladder, a door frame, a fender). I say which strips each would use. Any piece that needs a new strip costs a point.\n6. Do-along on today's build (the trim sheet and the shop window part of the front (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Find a real photo of a small harbour shop front on Wikimedia Commons (commons.wikimedia.org) and list the surfaces you see: fascia board, stone base, timber, frames, metal, rubber fenders. You see that a few surfaces repeat everywhere.\n   - On paper, draw a square and label it 2 m x 2 m. Split it into seven bands from the top: 50, 50, 25, 25, 25, 12.5 and 12.5 cm, and write a surface in each (fascia, stone, timber boards, frame paint, planks, metal, rubber). You see your trim plan: one band is one strip, and the bands add up to 200 cm.\n   - Open Krita: File > New, Width 2048, Height 2048, then Create. Open Settings > Dockers > Grid and Guides. On its Grid tab, tick Show Grid and Snap to Grid, and set X spacing and Y spacing to 128 px (as on Day 4, where you used 100 px). Turn on View > Show Rulers and drag guides down from the top ruler onto the grid lines 4, 8, 10, 12, 14 and 15 squares down (512, 1024, 1280, 1536, 1792 and 1920 px). You see seven strips.\n   - Pick the Fill tool (the paint bucket) and fill each strip with a flat colour for its surface: 1 fascia paint, 2 stone, 3 timber boards, 4 frame paint, 5 planks, 6 grey metal, 7 black rubber. You see a striped sheet like a flag.\n   - File > Save As T_Trim_Harbour.kra in your Day13 folder. You see the name in Krita's title bar.\n   - Start trim_strips.md: strip 1, V 0.75 to 1.0, 50 cm, painted fascia; continue down to strip 7, V 0 to 0.0625, 12.5 cm, black rubber. You see a table of seven rows.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"How to Make Game Assets in BLENDER Like The Pros With Trim Sheets!\" by NoPoly: https://www.youtube.com/watch?v=ga89MuH_ubk\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Strips from photos, tiling left to right", "uk": "Смуги з фото, що тайляться зліва направо"}, "minutes": 40, "goals": [{"en": "Fill a strip from a photo texture scaled to the kit standard (a 50 cm stone is about 512 px long).", "uk": "Заповни смугу фототекстурою, масштабованою до стандарту набору (камінь 50 см має приблизно 512 px завдовжки)."}, {"en": "Make a strip tile left to right with Krita's Wrap Around Mode (W: the canvas repeats on every side) and the clone tool (a brush that copies one area onto another).", "uk": "Зроби так, щоб смуга тайлилася зліва направо, за допомогою Wrap Around Mode у Krita (W: полотно повторюється з усіх боків) та інструмента клонування (пензель, що копіює одну ділянку на іншу)."}, {"en": "Export the trim and make MI_Trim_Harbour from M_Master.", "uk": "Експортуй трим і створи MI_Trim_Harbour з M_Master."}], "doalong": [{"en": "In T_Trim_Harbour.kra, drag your Day 12 stone colour image from Explorer onto the canvas. You see it arrive as a new layer in the Layers panel (right side).", "uk": "У T_Trim_Harbour.kra перетягни зображення кольору каменю з Дня 12 з Explorer на полотно. Ти бачиш, що воно з'являється новим шаром на панелі Layers (праворуч)."}, {"en": "Press Ctrl+T (Transform). Drag a corner handle while holding Shift (to keep its shape) until one stone is about 400 to 600 px long, move it over strip 2, then press Enter. You see stone across strip 2 and beyond.", "uk": "Натисни Ctrl+T (Transform). Тягни кутовий маркер, тримаючи Shift (щоб зберегти пропорції), доки один камінь не матиме приблизно 400–600 px завдовжки, пересунь зображення на смугу 2, потім натисни Enter. Ти бачиш камінь на всю смугу 2 і далі."}, {"en": "Pick the Rectangular Selection tool and drag a box over strip 2 exactly, from guide to guide (with Snap to Grid on in the Grid and Guides docker, the box clicks onto the grid lines). Then Select > Invert Selection (Ctrl+Shift+I), press Delete and Select > Deselect (Ctrl+Shift+A). You see stone only inside strip 2.", "uk": "Вибери інструмент Rectangular Selection і протягни рамку точно по смузі 2, від напрямної до напрямної (коли в докері Grid and Guides увімкнено Snap to Grid, рамка прилипає до ліній сітки). Потім Select > Invert Selection (Ctrl+Shift+I), натисни Delete і Select > Deselect (Ctrl+Shift+A). Ти бачиш камінь лише всередині смуги 2."}, {"en": "Do the same with your Day 12 wood image for strip 5: rotate it (Ctrl+T, drag outside the box) so the planks run left to right, one plank about 150 to 200 px tall. You see boards running along strip 5.", "uk": "Зроби те саме із зображенням дерева з Дня 12 для смуги 5: поверни його (Ctrl+T, тягни за межами рамки), щоб дошки йшли зліва направо, кожна дошка приблизно 150–200 px заввишки. Ти бачиш дошки вздовж смуги 5."}, {"en": "Press W (Wrap Around Mode) and zoom out. Look at the left-right join of strips 2 and 5. In the Brush Presets panel pick the clone brush (Clone Tool), Ctrl+click on good stones to set the source, and paint over any hard line. Press W again to leave. You see no line where a strip repeats.", "uk": "Натисни W (Wrap Around Mode) і зменш масштаб. Подивися на стик ліво-право смуг 2 і 5. На панелі Brush Presets вибери пензель клонування (Clone Tool), Ctrl+клацни на гарному камінні, щоб задати джерело, і замалюй будь-яку різку лінію. Натисни W ще раз, щоб вийти. Там, де смуга повторюється, лінії не видно."}, {"en": "File > Export: T_Trim_Harbour.png. In Unreal import it into Course/Day13, then make MI_Trim_Harbour from M_Master with BaseColor T_Trim_Harbour and Roughness 0.65. You see the striped sheet on the preview sphere.", "uk": "File > Export: T_Trim_Harbour.png. В Unreal імпортуй його в Course/Day13, потім створи MI_Trim_Harbour з M_Master з BaseColor T_Trim_Harbour і Roughness 0.65. Ти бачиш смугастий аркуш на сфері попереднього перегляду."}], "play": {"en": "Repeat hunt: I send a screenshot of my trim in Wrap Around Mode. The tutor gets 30 seconds to point at a seam. If it can't, I score.", "uk": "Полювання на повтори: я надсилаю скриншот свого триму в Wrap Around Mode. Тьютор має 30 секунд, щоб показати на шов. Якщо не знаходить, бал мені."}, "video": {"search": "krita wrap around mode seamless texture"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Strips from photos, tiling left to right (Day 13, lesson 2 of 4).\nToday's build: T_Trim_Harbour, a trim sheet for the whole harbour, and SM_ShopFront_A built with it.\nEarlier today I already did: lesson 1 (Trim sheets: plan the strips). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Fill a strip from a photo texture scaled to the kit standard (a 50 cm stone is about 512 px long).\n2. Make a strip tile left to right with Krita's Wrap Around Mode (W: the canvas repeats on every side) and the clone tool (a brush that copies one area onto another).\n3. Export the trim and make MI_Trim_Harbour from M_Master.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Repeat hunt: I send a screenshot of my trim in Wrap Around Mode. The tutor gets 30 seconds to point at a seam. If it can't, I score.\n4. Do-along on today's build (the trim sheet and the shop window part of the front (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - In T_Trim_Harbour.kra, drag your Day 12 stone colour image from Explorer onto the canvas. You see it arrive as a new layer in the Layers panel (right side).\n   - Press Ctrl+T (Transform). Drag a corner handle while holding Shift (to keep its shape) until one stone is about 400 to 600 px long, move it over strip 2, then press Enter. You see stone across strip 2 and beyond.\n   - Pick the Rectangular Selection tool and drag a box over strip 2 exactly, from guide to guide (with Snap to Grid on in the Grid and Guides docker, the box clicks onto the grid lines). Then Select > Invert Selection (Ctrl+Shift+I), press Delete and Select > Deselect (Ctrl+Shift+A). You see stone only inside strip 2.\n   - Do the same with your Day 12 wood image for strip 5: rotate it (Ctrl+T, drag outside the box) so the planks run left to right, one plank about 150 to 200 px tall. You see boards running along strip 5.\n   - Press W (Wrap Around Mode) and zoom out. Look at the left-right join of strips 2 and 5. In the Brush Presets panel pick the clone brush (Clone Tool), Ctrl+click on good stones to set the source, and paint over any hard line. Press W again to leave. You see no line where a strip repeats.\n   - File > Export: T_Trim_Harbour.png. In Unreal import it into Course/Day13, then make MI_Trim_Harbour from M_Master with BaseColor T_Trim_Harbour and Roughness 0.65. You see the striped sheet on the preview sphere.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "A shop front on the grid: openings with depth", "uk": "Фасад крамниці на сітці: отвори з глибиною"}, "minutes": 40, "goals": [{"en": "Block a 4 m shop front at real size, with the pivot at the bottom left corner of its back face on the grid.", "uk": "Збери чорновий фасад крамниці 4 м у реальному розмірі, з півотом у нижньому лівому куті задньої грані на сітці."}, {"en": "Place loop cuts at exact positions with the sidebar's Median value.", "uk": "Став петльові розрізи (Loop Cut) у точні позиції через значення Median на бічній панелі."}, {"en": "Inset an opening (a ring of faces that becomes a frame) and push it in, so the wall has depth (the side faces of an opening are called reveals).", "uk": "Зроби Inset отвору (кільце граней, яке стане рамою) і втисни його, щоб стіна мала глибину (бічні грані отвору називають укосами)."}], "doalong": [{"en": "Open buildkit_day11.blend and save it as buildkit_day13.blend. Hide the other pieces (select them, press H; Alt+H shows them again). Add a cube and, in the sidebar (N) > Item, set Dimensions X 4 m, Y 0.3 m, Z 3 m; then Location X 2, Y -0.15 and Z 1.5. You see a slab whose bottom left corner at the back (the side away from you in the front view, Numpad 1) sits on the origin.", "uk": "Відкрий buildkit_day11.blend і збережи його як buildkit_day13.blend. Сховай інші деталі (виділи їх, натисни H; Alt+H знову їх показує). Додай куб і на бічній панелі (N) > Item задай Dimensions X 4 m, Y 0.3 m, Z 3 m; потім Location X 2, Y -0.15 і Z 1.5. Ти бачиш плиту, чий нижній лівий кут ззаду (бік, далекий від тебе у виді спереду, Numpad 1) стоїть на початку координат."}, {"en": "Name it SM_ShopFront_A. Shift+S > Cursor to World Origin, then Object > Set Origin > Origin to 3D Cursor, then Ctrl+A > All Transforms. You see the orange origin dot at the back corner.", "uk": "Назви її SM_ShopFront_A. Shift+S > Cursor to World Origin, потім Object > Set Origin > Origin to 3D Cursor, потім Ctrl+A > All Transforms. Ти бачиш помаранчеву точку початку координат у задньому куті."}, {"en": "Tab into Edit Mode. Press Ctrl+R over the top edge, click once, then right-click (the cut stays in the middle). In the sidebar's Median, with Global on, type X 0.3. Repeat for cuts at X 2.5, 2.8 and 3.8. You see four vertical lines on the front.", "uk": "Перейди в Edit Mode (Tab). Наведи курсор на верхнє ребро, натисни Ctrl+R, клацни один раз, потім клацни правою кнопкою (розріз лишається посередині). У Median на бічній панелі, з увімкненим Global, введи X 0.3. Повтори для розрізів на X 2.5, 2.8 і 3.8. Ти бачиш чотири вертикальні лінії на фасаді."}, {"en": "Ctrl+R over a vertical edge for a horizontal cut; set its Median Z to 0.5. Add another at Z 2.5. You see a grid on the front: plinth, window, door and the fascia band from 2.5 to 3 m.", "uk": "Ctrl+R над вертикальним ребром дає горизонтальний розріз; задай йому Median Z 0.5. Додай ще один на Z 2.5. Ти бачиш сітку на фасаді: цоколь, вікно, двері й смугу вивісної дошки від 2,5 до 3 м."}, {"en": "Press 3 for faces and, on the front (the side facing you in Numpad 1), click the face between X 0.3 and 2.5 and between Z 0.5 and 2.5: the window. Press I and type 0.05, Enter: this ring becomes the frame. You see a thin ring round a smaller face.", "uk": "Натисни 3 для граней і на передньому боці (тому, що дивиться на тебе в Numpad 1) клацни грань між X 0.3 і 2.5 та між Z 0.5 і 2.5: це вікно. Натисни I і введи 0.05, Enter: це кільце стане рамою. Ти бачиш тонке кільце навколо меншої грані."}, {"en": "With the inner face selected, press E and type -0.15, Enter. You see a recess with reveals; the back face will be the glass.", "uk": "Не знімаючи виділення з внутрішньої грані, натисни E і введи -0.15, Enter. Ти бачиш заглиблення з укосами; задня грань стане склом."}], "play": {"en": "Scale detective: the tutor describes a real shop front. Before measuring, I guess its window width and fascia height using the 1.8 m mannequin as a ruler. Within 20 cm scores.", "uk": "Детектив масштабу: тьютор описує справжній фасад крамниці. Ще до вимірювання я вгадую ширину вітрини й висоту вивісної дошки, використовуючи манекен 1,8 м як лінійку. Похибка до 20 см — бал."}, "video": {"url": "https://www.youtube.com/watch?v=Lxtkx18m5Hs", "title": "Blender Precision Modeling Tutorial / Modeling Practice 01", "channel": "3D Nato", "length": "10:56", "search": "blender precision modeling exact dimensions", "alt": {"url": "https://www.youtube.com/watch?v=Py-SwJwPgk0", "title": "Урок 3 / Основи Blender 5.1 / Моделювання та модифікатори", "channel": "Fun Open Source Українською"}}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: A shop front on the grid: openings with depth (Day 13, lesson 3 of 4).\nToday's build: T_Trim_Harbour, a trim sheet for the whole harbour, and SM_ShopFront_A built with it.\nEarlier today I already did: lesson 1 (Trim sheets: plan the strips); lesson 2 (Strips from photos, tiling left to right). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Block a 4 m shop front at real size, with the pivot at the bottom left corner of its back face on the grid.\n2. Place loop cuts at exact positions with the sidebar's Median value.\n3. Inset an opening (a ring of faces that becomes a frame) and push it in, so the wall has depth (the side faces of an opening are called reveals).\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Scale detective: the tutor describes a real shop front. Before measuring, I guess its window width and fascia height using the 1.8 m mannequin as a ruler. Within 20 cm scores.\n4. Do-along on today's build (the trim sheet and the shop window part of the front (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Open buildkit_day11.blend and save it as buildkit_day13.blend. Hide the other pieces (select them, press H; Alt+H shows them again). Add a cube and, in the sidebar (N) > Item, set Dimensions X 4 m, Y 0.3 m, Z 3 m; then Location X 2, Y -0.15 and Z 1.5. You see a slab whose bottom left corner at the back (the side away from you in the front view, Numpad 1) sits on the origin.\n   - Name it SM_ShopFront_A. Shift+S > Cursor to World Origin, then Object > Set Origin > Origin to 3D Cursor, then Ctrl+A > All Transforms. You see the orange origin dot at the back corner.\n   - Tab into Edit Mode. Press Ctrl+R over the top edge, click once, then right-click (the cut stays in the middle). In the sidebar's Median, with Global on, type X 0.3. Repeat for cuts at X 2.5, 2.8 and 3.8. You see four vertical lines on the front.\n   - Ctrl+R over a vertical edge for a horizontal cut; set its Median Z to 0.5. Add another at Z 2.5. You see a grid on the front: plinth, window, door and the fascia band from 2.5 to 3 m.\n   - Press 3 for faces and, on the front (the side facing you in Numpad 1), click the face between X 0.3 and 2.5 and between Z 0.5 and 2.5: the window. Press I and type 0.05, Enter: this ring becomes the frame. You see a thin ring round a smaller face.\n   - With the inner face selected, press E and type -0.15, Enter. You see a recess with reveals; the back face will be the glass.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Blender Precision Modeling Tutorial / Modeling Practice 01\" by 3D Nato: https://www.youtube.com/watch?v=Lxtkx18m5Hs\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Mapping onto trim strips", "uk": "Розкладка на смуги триму"}, "minutes": 40, "goals": [{"en": "Explain why trims cover long, thin parts (fascias, sills, frames) while big flat areas use a tiling material such as MI_Plaster.", "uk": "Поясни, чому трими покривають довгі тонкі частини (вивісні дошки, підвіконня, рами), а великі пласкі ділянки — тайловий матеріал на кшталт MI_Plaster."}, {"en": "Unwrap all faces together and scale every island at once until a 50 cm part fills a 50 cm strip: everything then has the kit density.", "uk": "Розгорни всі грані разом і масштабуй усі острівці одночасно, доки частина 50 см не заповнить смугу 50 см: тоді все має щільність набору."}, {"en": "Move islands into their strips with G, never S, using part of a strip for thin parts.", "uk": "Переміщуй острівці в їхні смуги клавішею G, ніколи не S, а для тонких частин використовуй частину смуги."}], "doalong": [{"en": "In Material Properties make four materials (+, then New, four times): Plaster, Trim, Door and Glass. In the Shading tab, wire T_Trim_Harbour.png into Trim's Base Color, your Day 12 plaster image into Plaster's and your wood image into Door's; make Glass a dark blue-grey. You see four slots.", "uk": "У Material Properties створи чотири матеріали (+, потім New, чотири рази): Plaster, Trim, Door і Glass. На вкладці Shading з'єднай T_Trim_Harbour.png з Base Color матеріалу Trim, зображення штукатурки з Дня 12 — з Base Color матеріалу Plaster, а зображення дерева — з Door; Glass зроби темним синьо-сірим. Ти бачиш чотири слоти."}, {"en": "Tab, press 3 for faces. Select the wall faces, click Plaster, Assign; the fascia band, plinth and window frame ring, Trim, Assign; the window's back face, Glass, Assign. You see the front in four materials.", "uk": "Tab, натисни 3 для граней. Виділи грані стіни, клацни Plaster, Assign; смугу вивісної дошки, цоколь і кільце віконної рами — Trim, Assign; задню грань вікна — Glass, Assign. Ти бачиш фасад у чотирьох матеріалах."}, {"en": "Press A, then U > Smart UV Project, OK. In the UV Editor press A, then Ctrl+A (Average Islands Scale). You see every island at the same scale.", "uk": "Натисни A, потім U > Smart UV Project, OK. В UV Editor натисни A, потім Ctrl+A (Average Islands Scale). Ти бачиш усі острівці в однаковому масштабі."}, {"en": "In the UV Editor's header, pick T_Trim_Harbour as the image to show. Keep all islands selected and press S until the fascia's long island is exactly as tall as strip 1 (50 cm on the model, 50 cm on the trim). You see the kit density on every island at once.", "uk": "У заголовку UV Editor вибери T_Trim_Harbour як зображення для показу. Не знімай виділення з усіх острівців і натискай S, доки довгий острівець вивісної дошки не стане точно такої висоти, як смуга 1 (50 см на моделі, 50 см на тримі). Ти бачиш щільність набору одразу на всіх острівцях."}, {"en": "In the 3D view select only the fascia faces; the UV Editor now shows only their island. Press A, then G to move it into strip 1 (press R 90 first if it stands upright). Tip: in the UV Editor's sidebar (N) > Image tab > UV Vertex, Y shows the middle of what you selected; type 0.875, the middle of strip 1, to drop it exactly. If you can't find it, move it by eye until no stone from strip 2 shows on the fascia. You see the painted fascia board on the model.", "uk": "У 3D-вікні виділи лише грані вивісної дошки; тепер UV Editor показує тільки їхній острівець. Натисни A, потім G, щоб пересунути його в смугу 1 (якщо він стоїть вертикально, спершу натисни R 90). Порада: на бічній панелі UV Editor (N) > вкладка Image > UV Vertex значення Y показує середину виділеного; введи 0.875, середину смуги 1, щоб поставити острівець точно. Якщо не знаходиш цього поля, пересувай на око, доки на вивісній дошці не зникне камінь зі смуги 2. Ти бачиш фарбовану вивісну дошку на моделі."}, {"en": "Do the same, with G only: the plinth into strip 2 (its middle is V 0.625), the frame faces into strip 4, using just part of its height. You see stone under the window and painted frames round it.", "uk": "Зроби те саме, лише клавішею G: цоколь — у смугу 2 (її середина V 0.625), грані рам — у смугу 4, використовуючи лише частину її висоти. Ти бачиш камінь під вікном і фарбовані рами навколо нього."}], "play": {"en": "Strip quiz: the tutor names ten parts of a harbour street (a fascia, a gutter, a fender, a sill, a quay coping, a door frame...). I give the strip number for each in 5 seconds, or say 'tiling material' for big flat areas.", "uk": "Вікторина смуг: тьютор називає десять частин вулиці в гавані (вивісна дошка, ринва, кранець, підвіконня, парапет набережної, дверна рама...). За 5 секунд я називаю номер смуги для кожної або кажу «тайловий матеріал» для великих пласких ділянок."}, "video": {"search": "blender trim sheet uv mapping modular building"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Mapping onto trim strips (Day 13, lesson 4 of 4).\nToday's build: T_Trim_Harbour, a trim sheet for the whole harbour, and SM_ShopFront_A built with it.\nEarlier today I already did: lesson 1 (Trim sheets: plan the strips); lesson 2 (Strips from photos, tiling left to right); lesson 3 (A shop front on the grid: openings with depth). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Explain why trims cover long, thin parts (fascias, sills, frames) while big flat areas use a tiling material such as MI_Plaster.\n2. Unwrap all faces together and scale every island at once until a 50 cm part fills a 50 cm strip: everything then has the kit density.\n3. Move islands into their strips with G, never S, using part of a strip for thin parts.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Strip quiz: the tutor names ten parts of a harbour street (a fascia, a gutter, a fender, a sill, a quay coping, a door frame...). I give the strip number for each in 5 seconds, or say 'tiling material' for big flat areas.\n4. Do-along on today's build (the trim sheet and the shop window part of the front (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - In Material Properties make four materials (+, then New, four times): Plaster, Trim, Door and Glass. In the Shading tab, wire T_Trim_Harbour.png into Trim's Base Color, your Day 12 plaster image into Plaster's and your wood image into Door's; make Glass a dark blue-grey. You see four slots.\n   - Tab, press 3 for faces. Select the wall faces, click Plaster, Assign; the fascia band, plinth and window frame ring, Trim, Assign; the window's back face, Glass, Assign. You see the front in four materials.\n   - Press A, then U > Smart UV Project, OK. In the UV Editor press A, then Ctrl+A (Average Islands Scale). You see every island at the same scale.\n   - In the UV Editor's header, pick T_Trim_Harbour as the image to show. Keep all islands selected and press S until the fascia's long island is exactly as tall as strip 1 (50 cm on the model, 50 cm on the trim). You see the kit density on every island at once.\n   - In the 3D view select only the fascia faces; the UV Editor now shows only their island. Press A, then G to move it into strip 1 (press R 90 first if it stands upright). Tip: in the UV Editor's sidebar (N) > Image tab > UV Vertex, Y shows the middle of what you selected; type 0.875, the middle of strip 1, to drop it exactly. If you can't find it, move it by eye until no stone from strip 2 shows on the fascia. You see the painted fascia board on the model.\n   - Do the same, with G only: the plinth into strip 2 (its middle is V 0.625), the frame faces into strip 4, using just part of its height. You see stone under the window and painted frames round it.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "T_Trim_Harbour.png and T_Trim_Harbour.kra, and trim_strips.md", "uk": "T_Trim_Harbour.png і T_Trim_Harbour.kra, а також trim_strips.md"}, {"en": "buildkit_day13.blend and SM_ShopFront_A.fbx (with its UCX boxes)", "uk": "buildkit_day13.blend і SM_ShopFront_A.fbx (з коробками UCX)"}, {"en": "trim_on_front.png (the front in Unreal with all four materials)", "uk": "trim_on_front.png (фасад в Unreal з усіма чотирма матеріалами)"}, {"en": "before_after_day13.png (the grey front and the finished front, same view)", "uk": "before_after_day13.png (сірий фасад і готовий фасад, той самий ракурс)"}, {"en": "flythrough_day13.mp4 (60 seconds at 3 m)", "uk": "flythrough_day13.mp4 (60 секунд на висоті 3 м)"}, {"en": "summary.md", "uk": "звіт дня (summary.md)"}], "goal": {"en": "By the end of today you have T_Trim_Harbour, a 2048 x 2048 trim sheet of seven strips, and SM_ShopFront_A, a 4 m shop front textured with it, standing in L_KitTest.", "uk": "Наприкінці сьогоднішнього дня в тебе є T_Trim_Harbour, трим-шит 2048 x 2048 із семи смуг, і SM_ShopFront_A, фасад крамниці завширшки 4 м, затекстурований ним, який стоїть у L_KitTest."}, "uses": [{"en": "Day 11: your UV skills, buildkit_day11.blend with TD_Reference, and the kit standard (1024 pixels per metre)", "uk": "День 11: твої навички UV, buildkit_day11.blend з TD_Reference і стандарт набору (1024 пікселі на метр)"}, {"en": "Day 12: M_Master, MI_Plaster, MI_Wood, MI_Glass, material slots and your Poly Haven stone and wood images", "uk": "День 12: M_Master, MI_Plaster, MI_Wood, MI_Glass, слоти матеріалів і твої зображення каменю й дерева з Poly Haven"}, {"en": "Day 9: SM_Wall_2m and its 3 m height, which the shop front matches", "uk": "День 9: SM_Wall_2m та її висота 3 м, під яку підганяється фасад крамниці"}], "quiz": [{"q": {"en": "What makes a trim sheet cheap to use?", "uk": "Чому трим-шит дешевий у використанні?"}, "options": [{"en": "Many pieces share one texture and one material", "uk": "Багато деталей ділять одну текстуру й один матеріал"}, {"en": "It has no colour", "uk": "У нього немає кольору"}, {"en": "It is always 512 px", "uk": "Він завжди 512 px"}, {"en": "It needs no UVs", "uk": "Йому не потрібні UV"}], "answer": 0, "explain": {"en": "One trim and one material can cover the edges of a whole street. The computer draws and stores less.", "uk": "Один трим і один матеріал можуть покрити краї цілої вулиці. Комп'ютер менше малює й менше зберігає."}}, {"q": {"en": "On your shop front, the window frame shows boards ten times wider than the fascia's. What went wrong?", "uk": "На твоєму фасаді віконна рама показує дошки вдесятеро ширші, ніж на вивісній дошці. Що пішло не так?"}, "options": [{"en": "The trim is the wrong file type", "uk": "Трим має неправильний тип файлу"}, {"en": "The frame's island was scaled on its own, so it lost the kit density", "uk": "Острівець рами масштабували окремо, тож він втратив щільність набору"}, {"en": "Metallic is too high", "uk": "Metallic зависокий"}, {"en": "The pivot is in the middle", "uk": "Півот посередині"}], "answer": 1, "explain": {"en": "Scale all islands together once, then only move them. Scaling one island alone changes its texel density.", "uk": "Масштабуй усі острівці разом один раз, потім лише переміщуй їх. Масштабування одного острівця окремо змінює його щільність текселів."}}, {"q": {"en": "At the kit standard, how tall is a 512 px strip in real life?", "uk": "Яку реальну висоту має смуга 512 px у стандарті набору?"}, "options": [{"en": "12.5 cm", "uk": "12,5 см"}, {"en": "25 cm", "uk": "25 см"}, {"en": "50 cm", "uk": "50 см"}], "answer": 2, "explain": {"en": "1024 pixels cover 1 m, so 512 pixels cover 50 cm.", "uk": "1024 пікселі покривають 1 м, тож 512 пікселів покривають 50 см."}}, {"q": {"en": "In Unreal, a thin vertical line appears every 2 m along your quay coping. What is the fix?", "uk": "В Unreal уздовж парапету набережної кожні 2 м з'являється тонка вертикальна лінія. Як це виправити?"}, "options": [{"en": "Turn the sun", "uk": "Повернути сонце"}, {"en": "Add more triangles to the coping", "uk": "Додати парапету трикутників"}, {"en": "Set Tiling to 0", "uk": "Поставити Tiling на 0"}, {"en": "Paint out the seam at the strip's left-right join in Wrap Around Mode, then export and reimport", "uk": "Замалювати шов на стику ліво-право смуги в Wrap Around Mode, потім експортувати й зробити Reimport"}], "answer": 3, "explain": {"en": "The trim is 2 m wide, so a seam at its edge repeats every 2 m. Fix the join in Krita, then reimport.", "uk": "Трим має 2 м завширшки, тож шов на його краю повторюється кожні 2 м. Виправ стик у Krita, потім зроби Reimport."}}, {"q": {"en": "Why is the shop's big flat wall in MI_Plaster and not on the trim?", "uk": "Чому велика пласка стіна крамниці в MI_Plaster, а не на тримі?"}, "options": [{"en": "A 3 m wall can't fit a 50 cm strip at the kit density; big areas need a tiling material", "uk": "Стіна 3 м не вміщується в смугу 50 см зі щільністю набору; великим ділянкам потрібен тайловий матеріал"}, {"en": "Plaster is cheaper than any trim", "uk": "Штукатурка дешевша за будь-який трим"}, {"en": "Trims can't be used on walls", "uk": "Трими не можна використовувати на стінах"}, {"en": "Unreal shows only one trim per level", "uk": "Unreal показує лише один трим на рівень"}], "answer": 0, "explain": {"en": "Trim strips repeat only from left to right. Big flat areas need a texture that tiles in both directions.", "uk": "Смуги триму повторюються лише зліва направо. Великим пласким ділянкам потрібна текстура, що тайлиться в обох напрямках."}}], "weekInfo": {"week": 3, "title": {"en": "Surfaces", "uk": "Поверхні"}, "goal": {"en": "By Friday you have your whole harbour kit unwrapped at one texel density, textured with M_Master instances and a trim sheet, weathered with painted wear masks and a Wear slider, and shown beside real harbour photos.", "uk": "До п'ятниці в тебе є весь портовий набір: розгорнутий з однією щільністю текселів, затекстурований інстансами M_Master і трим-шитом, зістарений намальованими масками зношеності й повзунком Wear і показаний поруч зі справжніми фото гавані."}, "skills": [{"en": "UV unwrapping with clean seams and consistent texel density for modular kits", "uk": "UV-розгортка з акуратними швами й однаковою щільністю текселів для модульних наборів"}, {"en": "PBR material authoring: master materials and material instances in Unreal Engine 5", "uk": "Створення PBR-матеріалів: майстер-матеріали та інстанси матеріалів в Unreal Engine 5"}, {"en": "Trim sheet design and UV layout for modular environment kits", "uk": "Дизайн трим-шитів і UV-розкладка для модульних наборів оточення"}, {"en": "Texture painting and parameter-driven weathering (wear masks on a second UV channel)", "uk": "Малювання текстур і зношеність, керована параметрами (маски зношеності на другому UV-каналі)"}, {"en": "Look-development review against real photo reference", "uk": "Перевірка вигляду (look development) за справжніми фото-референсами"}]}, "morning": {"sofar": {"en": "Your kit now wears real materials from one master material, with instances for metal, wood, stone, plaster and glass.", "uk": "Тепер твій набір вбраний у справжні матеріали з одного майстер-матеріалу, з інстансами для металу, дерева, каменю, штукатурки та скла."}, "today": {"en": "You make T_Trim_Harbour, a trim sheet of seven strips, and build SM_ShopFront_A, a 4 m shop front textured with it.", "uk": "Сьогодні ти робиш T_Trim_Harbour — трим-шит із семи смуг — і будуєш SM_ShopFront_A, 4-метрову вітрину крамниці, текстуровану ним."}, "cheer": {"en": "Trim sheets are a studio favourite and learning them now puts you ahead; if a strip looks wrong, adjust it and carry on.", "uk": "Трим-шити дуже люблять у студіях, і, опановуючи їх уже зараз, ти випереджаєш багатьох; якщо смуга виглядає не так, підправ її і йди далі."}, "quote": {"text": {"en": "Inspiration is for amateurs — the rest of us just show up and get to work.", "uk": "Натхнення — для аматорів. Решта з нас просто приходить і береться до роботи."}, "author": {"en": "Chuck Close", "uk": "Чак Клоуз"}, "source": "https://en.wikiquote.org/wiki/Chuck_Close"}}, "hasAssets": false, "workPath": "Work\\Assignment\\Day-13-trim-sheet-and-shop-front", "mapHref": "../../COURSE.html", "prevHref": "../Day-12-pbr-materials-m-master/START-HERE.html", "nextHref": "../Day-14-texture-painting-and-wear/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Krita, Blender and Unreal Engine 5.8. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me and don't write code. Keep me moving and make it feel like a game.\n\nToday I build on my own: The door, fascia, sill, slots, collision and export of SM_ShopFront_A, on your own.\nIt's part of: T_Trim_Harbour, a trim sheet for the whole harbour, and SM_ShopFront_A built with it (Course/Day13 for the trim, its instance and the front; L_KitTest beside your small harbour building.).\n\nSpec:\n- T_Trim_Harbour: 2048 x 2048 px, at the kit standard, so the sheet is 2 m wide and every 512 px is 50 cm. Picture it as a 2 x 2 m sheet of material samples cut into seven horizontal bands, like a striped flag. Each strip tiles left to right with no visible seam.\n- Seven strips from the top: 1 painted fascia board (the sign board above a shop; 512 px, 50 cm), 2 stone plinth (the base of a wall) and coping (the top stones of a quay wall; 512 px), 3 painted timber boards (256 px, 25 cm), 4 window-frame paint (256 px), 5 bare weathered planks (256 px), 6 galvanised metal (128 px, 12.5 cm), 7 black rubber (128 px).\n- A strip table in trim_strips.md: strip, V range (V is the up direction of the UV square, 0 at the bottom, 1 at the top), real height and use.\n- SM_ShopFront_A: 4 m wide (two grid steps), 3 m tall like SM_Wall_2m and 0.3 m deep, with its front facing -Y like your walls. Pivot at the bottom left corner of its back face, so it can stand flat against any wall.\n- Real parts: a shop window 2.2 m wide over a 50 cm stone plinth, and a door 1 m wide. Both are topped at 2.5 m by a 50 cm fascia board from 2.5 to 3 m (where a shop sign would go): exactly the height of strip 1. Openings are recessed 10 to 15 cm.\n- Four slots: Trim (MI_Trim_Harbour) for the long, thin parts; Plaster (MI_Plaster) for the big flat wall; Door (MI_Wood); Glass (MI_Glass). 5,000 triangles or fewer; UCX collision boxes as in Week 1.\n- Trim islands keep the kit density: a 50 cm part fills a 50 cm strip; thin parts use part of a strip; a strip is never squashed.\n\nMy checklist:\n1. Fill strips 1, 3 and 4 (fascia paint, timber boards, frame paint): a flat paint colour with a soft, low-opacity noise brush. For the boards, use your Day 12 wood with a paint-colour layer on top. Check: zoomed out to 25 %, each strip reads as its material. (from lesson 2)\n2. Fill strips 6 and 7 (galvanised metal, black rubber): a grey and a near-black with faint scratches and noise. Check: no strip is a perfectly flat colour. (from lesson 2)\n3. Seam check: press W in Krita (Wrap Around Mode), look along each strip's left-right join and clone out any hard line. Export T_Trim_Harbour.png again and Reimport it in Unreal. Check: no line shows where a strip repeats. (from lesson 2)\n4. Finish trim_strips.md (strip 1 is at the top, so it has the highest V): strip number, V range (strip 1 is V 0.75 to 1.0, down to strip 7, V 0 to 0.0625), real height and use. Check: seven rows and no gaps between the V ranges. (from lesson 1)\n5. Door: select the two door faces, inset them 5 cm (I, type 0.05) and push them in 10 cm (E, type -0.1). Check: from the side, the door sits 10 cm behind the wall face. (from lesson 3)\n6. Fascia: select the band of front faces between Z 2.5 and 3.0 m (the top 50 cm of the front) and push it out 5 cm (E, type 0.05). Check: from the side, the fascia stands out from the wall. (from lesson 3)\n7. Sill (the ledge under a window): select the bottom face of the window frame and push it out 5 cm (E, 0.05). Check: in Material Preview, the sill casts a thin shadow line under the window. (from lesson 3)\n8. Slots: Plaster for the wall faces, Trim for the fascia, plinth, sill and frames, Door for the door, Glass for the pane. Check: each slot's Select button lights up only its faces. (from day 12, lesson 2)\n9. Map the front: Smart UV Project, Average Islands Scale, scale all islands until the fascia fills strip 1's height, then move each part into its strip (fascia 1, plinth and sill 2, frames 4). Check: in Material Preview every part shows the right material at the same grain size as TD_Reference. (from lesson 4)\n10. Collision and export: two UCX boxes (UCX_SM_ShopFront_A_00 for the wall, UCX_SM_ShopFront_A_01 for the fascia), with the shop front's origin at the bottom left corner of its back face on the world origin. Keep 5,000 triangles or fewer (turn on Statistics in the Overlays menu), then export SM_ShopFront_A.fbx with your Week 1 settings. Check: in the export window, only SM_ShopFront_A and its two UCX boxes were selected, and Location reads 0, 0, 0. (from day 11, lesson 4)\n11. In Unreal import it into Course/Day13, set its four slots in the Static Mesh Editor, and place it in L_KitTest beside your harbour building, snapped to the grid, then press End. Check: it shows the trim, plaster, wood and glass, and nothing floats. (from day 12, lesson 4)\n12. Reuse the trim: in quaykit_day11.blend, give SM_QuayEdge_4m's top (coping) faces a new Trim slot (+, New, name Trim, with T_Trim_Harbour.png in its Base Color as in lesson 4), move their island into strip 2 without scaling, export, Reimport and set the slot. Check: the quay coping and the shop plinth show the same stone. (from lesson 4)\n13. Before/after capture: the front before mapping (grey) and finished, from the same view. Then a 60-second clip flying past the front at 3 m. Save today's clip as flythrough_day13.mp4 and check that you also have trim_on_front.png and before_after_day13.png (each is described in today's hand-in list; take any you are missing now). Check: in the clip, the fascia, frames, plinth and wall read as different materials. (from lesson 4)\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Andrii\nDay 13: Trim sheets: T_Trim_Harbour and your first shop front. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

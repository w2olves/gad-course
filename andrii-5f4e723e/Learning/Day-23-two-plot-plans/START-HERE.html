<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 23</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

<script id="data" type="application/json">{"learner": "ib-andrii-5f4e723e", "learnerName": {"en": "Andrii", "uk": "Андрій"}, "day": 23, "week": 5, "total": 60, "title": {"en": "Two plot plans: every item counted, lanes and cameras drawn", "uk": "Два плани ділянок: кожен об'єкт підраховано, коридори й камери намальовано"}, "theme": {"en": "Week 5: Your real place and your island on paper", "uk": "Тиждень 5: Твоє реальне місце і твій острів на папері"}, "build": {"item": {"en": "The plot plans for your two districts: plot_plan_d1.png and plot_plan_d2.png (800 x 800 px each, 4 px = 1 m), with their tables plot_plan_d1.md and plot_plan_d2.md", "uk": "Плани ділянок для двох районів: plot_plan_d1.png і plot_plan_d2.png (кожен 800 × 800 px, 4 px = 1 м) із таблицями plot_plan_d1.md і plot_plan_d2.md"}, "why": {"en": "On a real project nothing is placed until there is a written plan. A plan with numbers, such as '4 street trees in pits, 8 m apart', builds quickly and reads as a real place. Lanes drawn now stay open when the district fills up, and the five cameras are the shots you finish the course with.", "uk": "На справжньому проєкті нічого не ставлять, поки немає письмового плану. План із числами, як-от «4 вуличні дерева в лунках, через 8 м», швидко будується і виглядає як справжнє місце. Коридори, намальовані зараз, лишаються вільними, коли район заповниться. А п'ять камер — це кадри, якими ти завершиш курс."}, "next": {"en": "Tomorrow every row of your plans gets a source in your needs lists. On Day 41 plot_plan_d1 places district 1 item by item and your arrows become cameras C1 to C5; Day 48 does the same with plot_plan_d2.", "uk": "Завтра кожен рядок планів отримає джерело в списках потреб. У День 41 за plot_plan_d1 ти розставиш район 1 об'єкт за об'єктом, а стрілки стануть камерами C1–C5. У День 48 те саме буде з plot_plan_d2."}, "where": {"en": "Your two red 200 x 200 m districts on island_map.png: district 1, the waterfront, and district 2, the kind of place you chose on Day 22.", "uk": "Твої два червоні райони 200 × 200 м на island_map.png: район 1 — набережна, район 2 — тип місцевості, вибраний у День 22."}, "spec": [{"en": "intent.md first: about 5 lines per district on what it is, what goes where and why, and what the drone sees. You check it with the tutor against the five-point check.", "uk": "Спершу intent.md: близько 5 рядків на район — що це за місце, що де стоїть і чому, що бачить дрон. Ти перевіряєш його з тьютором за перевіркою з п'яти пунктів."}, {"en": "Two Krita files, plot_plan_d1.kra and plot_plan_d2.kra, each 800 x 800 px at 4 px = 1 m, north up. Each has a 50 m scale bar (200 px) and the island map's height on its bottom layer.", "uk": "Два файли Krita: plot_plan_d1.kra і plot_plan_d2.kra, кожен 800 × 800 px (4 px = 1 м), північ угорі. На кожному — шкала масштабу 50 м (200 px), а на нижньому шарі — висоти з мапи острова."}, {"en": "While you draw, show a 10 m grid (View > Show Grid, spacing 40 px, as on Day 4). The grid doesn't export, so write island metres from map_notes.md on the labels layer: at the corners and every 50 m.", "uk": "Поки малюєш, увімкни сітку 10 м (View > Show Grid, крок 40 px, як у День 4). Сітка не експортується. Тому на шарі labels підпиши острівні метри з map_notes.md: у кутах і через кожні 50 м."}, {"en": "Layers: base, water and shore, roads and paving, buildings, planting, furniture, lanes, cameras, labels.", "uk": "Шари: base, water and shore, roads and paving, buildings, planting, furniture, lanes, cameras, labels."}, {"en": "Every building as a labelled box with its use; roads and paths with their widths. Planting, furniture and boats as counted groups. District 2 needs only its five biggest groups today; you count its small props on Day 51.", "uk": "Кожна будівля — підписаний прямокутник із призначенням. Дороги й доріжки — з шириною. Рослини, вуличні меблі й човни — підраховані групи. Для району 2 сьогодні потрібні лише п'ять найбільших груп: дрібні пропси ти порахуєш у День 51."}, {"en": "Drone lanes at least 4 x 4 m: open corridors a drone can fly through. Draw them as bands with their heights, from the scenic route into and through each district. One landmark shows from each lane's start.", "uk": "Польотні коридори щонайменше 4 × 4 м — вільні проходи, крізь які може пролетіти дрон. Намалюй їх смугами з висотами: від мальовничого маршруту в кожен район і крізь нього. З початку кожного коридору видно один орієнтир."}, {"en": "Five cameras per district, C1 to C5: the approach, the buildings, the main feature, one wide view, one close on the ground. Each arrow has its height and the hero photo it matches.", "uk": "П'ять камер на район, C1–C5: C1 — підліт, C2 — будівлі, C3 — головний об'єкт, C4 — загальний план, C5 — близький план землі. Біля кожної стрілки — висота й ключове фото, якому камера відповідає."}, {"en": "Tables in the style of example-plot-plan.md: item, count, where (island metres), spacing or density, and a first source guess. Every count is a number. The rules check sits at the bottom: present day only, things where your photos put them, no straight lines in nature.", "uk": "Таблиці у стилі example-plot-plan.md: об'єкт, кількість, де (острівні метри), крок або щільність і перше припущення про джерело. Кожна кількість — число. Унизу кожної таблиці — перевірка трьох правил: усе з нашого часу; речі стоять там, де вони є на твоїх фото; у природі немає прямих ліній."}], "piece1": "district 1's plan, the waterfront (shared with the lessons)", "piece2": {"en": "District 2's plan, with its own character, on your own", "uk": "План району 2 з його власним характером — самостійно"}, "steps": [{"text": {"en": "Check: the files from today's lessons are in the day work folder (intent.md, plot_plan_d1.kra with its lanes and cameras started, plot_plan_d1.md and plot_plan_d2.kra). Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it. Then finish intent.md and fix every 'no' from the five-point check. Check: five 'yes' answers under each district's intent.", "uk": "Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: intent.md, plot_plan_d1.kra з початими коридорами й камерами, plot_plan_d1.md і plot_plan_d2.kra. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Потім допиши intent.md і виправ кожне «ні» з перевірки з п'яти пунктів. Перевірка: під задумом кожного району п'ять відповідей «так»."}, "lesson": 1}, {"text": {"en": "Finish plot_plan_d1.kra's frame: the 50 m scale bar, the north arrow, the layers, and island metres at the corners and every 50 m. Check: 200 px is 50 m, and the corner labels match map_notes.md.", "uk": "Заверши рамку plot_plan_d1.kra: шкала масштабу 50 м, стрілка півночі, шари й острівні метри в кутах і через кожні 50 м. Перевірка: 200 px — це 50 м, а підписи кутів збігаються з map_notes.md."}, "lesson": 2}, {"text": {"en": "District 1 buildings: every footprint as a labelled box with its use, such as a café, a shop or a harbour office. Check: every building has a door side facing a street or the quay.", "uk": "Будівлі району 1: кожен контур — підписаний прямокутник із призначенням, наприклад кафе, крамниця чи контора гавані. Перевірка: у кожної будівлі бік із дверима дивиться на вулицю або причал."}, "lesson": 1}, {"text": {"en": "District 1 roads, paving and the quay edge, each with its width. Check: the quay edge is straight where people built it, and the natural shore is broken.", "uk": "Дороги, мощення й край причалу в районі 1, кожне з шириною. Перевірка: край причалу прямий там, де його збудували люди, а природний берег нерівний."}, "lesson": 4}, {"text": {"en": "District 1 furniture, boats and planting as counted groups: benches, lamps, bins, mooring bollards, café tables, trees in pits. Check: every group has a number worked out from a length or an area.", "uk": "Вуличні меблі, човни й рослини району 1 — підрахованими групами: лавки, ліхтарі, урни, швартовні стовпчики, столики кафе, дерева в лунках. Перевірка: у кожної групи є число, обчислене з довжини або площі."}, "lesson": 2}, {"text": {"en": "District 1 lanes (at least 4 x 4 m, with heights) and cameras C1 to C5, each matched to a hero photo. Check: every lane is 16 px wide or more, and every camera names a photo.", "uk": "Коридори району 1 (щонайменше 4 × 4 м, із висотами) і камери C1–C5, кожна зіставлена з ключовим фото. Перевірка: кожен коридор має 16 px завширшки або більше, і біля кожної камери названо фото."}, "lesson": 3}, {"text": {"en": "Finish plot_plan_d1.md: every item as a row (item, count, where, spacing or density, first source guess) and the rules check at the bottom. Check: no row says 'some' or 'a few', and every row has a source guess.", "uk": "Заверши plot_plan_d1.md: кожен об'єкт — рядок (об'єкт, кількість, де, крок або щільність, перше припущення про джерело), а внизу — перевірка правил. Перевірка: жоден рядок не каже «трохи» чи «кілька», і в кожному є припущення про джерело."}, "lesson": 2}, {"text": {"en": "In plot_plan_d2.kra, draw district 2's buildings and roads by its kind of place. Check: the layout follows the slope, the point or the valley, as your district 2 photos do.", "uk": "У plot_plan_d2.kra намалюй будівлі й дороги району 2 відповідно до його типу місцевості. Перевірка: розкладка йде за схилом, мисом чи долиною, як на твоїх фото району 2."}, "lesson": 4}, {"text": {"en": "District 2 planting and props: only its five biggest groups, counted, with natural ground left irregular. Its small props wait for Day 51. Check: five counted groups, with clumps and gaps, and straight lines only where people built something.", "uk": "Рослини й пропси району 2: лише п'ять найбільших груп, підрахованих, а природна земля лишається нерівною. Дрібні пропси чекають на День 51. Перевірка: п'ять підрахованих груп, є скупчення й прогалини, а прямі лінії — лише там, де щось збудували люди."}, "lesson": 4}, {"text": {"en": "District 2 lanes and cameras C1 to C5, each matched to a hero photo. Check: one landmark shows from the start of each lane.", "uk": "Коридори й камери C1–C5 району 2, кожна камера зіставлена з ключовим фото. Перевірка: з початку кожного коридору видно один орієнтир."}, "lesson": 3}, {"text": {"en": "Write plot_plan_d2.md with its rules check. Check: the same columns as district 1, and every count is a number.", "uk": "Напиши plot_plan_d2.md із перевіркою правил. Перевірка: ті самі стовпці, що й для району 1, і кожна кількість — число."}, "lesson": 2}, {"text": {"en": "Save both .kra files and export plot_plan_d1.png and plot_plan_d2.png. Scale a copy of each to 200 x 200 px and lay it over its red box on island_map.png. Check: each PNG reopens at 800 x 800 px, and its coast and roads meet the island map's within a few metres.", "uk": "Збережи обидва файли .kra й експортуй plot_plan_d1.png і plot_plan_d2.png. Зменш копію кожного до 200 × 200 px і поклади на його червоний квадрат на island_map.png. Перевірка: кожен PNG знову відкривається з розміром 800 × 800 px, а його берег і дороги збігаються з мапою острова з точністю до кількох метрів."}, "lesson": 1}, {"text": {"en": "Report and hand-in: click Copy the day report at the bottom of the page, paste it into a new chat and answer. Open summary.md in Notepad, press Ctrl+End, paste the answer and press Ctrl+S. Then drag the files on the Hand in list into your hand-in folder. Check: every name shows in the folder, each with a size.", "uk": "Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: кожна назва зі списку є в папці, у кожної є розмір."}, "lesson": "D0.1"}], "assets": ["island12/example-plot-plan.md", "island12/free-packs-list.md"]}, "lessons": [{"title": {"en": "What a plot plan holds: the example plan", "uk": "Що містить план ділянки: зразковий план"}, "minutes": 40, "goals": [{"en": "Explain a plot plan: a top-down drawing of one area at a known scale, plus a table. Together they say what goes where, how many and from where.", "uk": "Пояснювати, що таке план ділянки: креслення однієї ділянки згори у відомому масштабі плюс таблиця. Разом вони кажуть, що де стоїть, скільки цього і звідки воно."}, {"en": "Read example-plot-plan.md and name what makes it buildable. Find the fault it records: a van placed by eye on the grass, not in its bay.", "uk": "Читати example-plot-plan.md і називати, що робить план придатним для будівництва. Знаходити записану в ньому помилку: фургон поставлено на око на траві, а не на його місці для паркування."}, {"en": "Turn a vague note into a plan line: 'some trees' becomes '4 street trees in pits, 8 m apart, two kinds mixed'.", "uk": "Перетворювати розмиту нотатку на рядок плану: «трохи дерев» стає «4 вуличні дерева в лунках, через 8 м, два види вперемішку»."}], "doalong": [{"en": "Open example-plot-plan.md from today's assets and read 'What plan.png shows'. List every kind of information it holds. You should have about eight items, such as the scale bar, car bays, planting, lanes and cameras.", "uk": "Відкрий example-plot-plan.md із сьогоднішніх assets і прочитай розділ «What plan.png shows» («Що показує plan.png»). Випиши всі види інформації, які він містить. Має вийти близько восьми пунктів, наприклад шкала масштабу, місця для паркування, рослини, коридори й камери."}, {"en": "Find the van in its table and read 'The recorded fault'. Write in one line how a top view laid over the plan would have caught it. You should see why every item gets coordinates.", "uk": "Знайди фургон у таблиці й прочитай розділ «The recorded fault» («Записана помилка»). Одним рядком напиши, як вид згори, накладений на план, допоміг би її помітити. Звідси видно, навіщо кожному об'єкту координати."}, {"en": "Pick five table rows and say for each: what, how many, where, how dense and from where. You should find no row that says 'some'.", "uk": "Вибери п'ять рядків таблиці й для кожного скажи: що, скільки, де, наскільки щільно і звідки. У жодному рядку немає слова «трохи»."}, {"en": "Rewrite three vague notes as plan lines: 'a few benches', 'flowers by the café', 'some boats'. You should have three lines, each with a number, a place and a kind.", "uk": "Перепиши три розмиті нотатки як рядки плану: «кілька лавок», «квіти біля кафе», «трохи човнів». Має вийти три рядки, у кожному число, місце й вид."}, {"en": "Write intent.md: about 5 lines per district. Paste it into your tutor chat with the five-point check and fix every 'no'. The five checks: open lanes, real counts, nothing wrongly in water, planting as the photos show, and everything fits 200 x 200 m. You should see five 'yes' answers per district.", "uk": "Напиши intent.md: близько 5 рядків на район. Встав його в чат із тьютором разом із перевіркою з п'яти пунктів і виправ кожне «ні». П'ять пунктів: вільні коридори, справжні кількості, нічого зайвого у воді, рослини як на фото, усе вміщається в 200 × 200 м. Має вийти п'ять відповідей «так» на район."}], "play": {"en": "Plan detective: the tutor leaves three items out of its description of the example's table. I find what's missing by checking the plan's picture description against the table.", "uk": "Детектив плану: тьютор пропускає три об'єкти, коли описує таблицю зразка. Я знаходжу, чого бракує, звіряючи опис малюнка плану з таблицею."}, "video": {"search": "level design top down map layout plan"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Що містить план ділянки: зразковий план (Day 23, lesson 1 of 4). Today's build: Плани ділянок для двох районів: plot_plan_d1.png і plot_plan_d2.png (кожен 800 × 800 px, 4 px = 1 м) із таблицями plot_plan_d1.md і plot_plan_d2.md.\nWhat I already know: День 22: island_map.kra і map_notes.md із двома червоними районами й мальовничим маршрутом; День 21: твої фото й ключові фото в references.md; Дні 1–13: твій власний набір (стовпчик, лавка, ліхтарний стовп, урна, настил пірса, причал, поруччя, деталі стін і фасад крамниці) як перші джерела.\n\nBy the end of this lesson I can:\n1. Пояснювати, що таке план ділянки: креслення однієї ділянки згори у відомому масштабі плюс таблиця. Разом вони кажуть, що де стоїть, скільки цього і звідки воно.\n2. Читати example-plot-plan.md і називати, що робить план придатним для будівництва. Знаходити записану в ньому помилку: фургон поставлено на око на траві, а не на його місці для паркування.\n3. Перетворювати розмиту нотатку на рядок плану: «трохи дерев» стає «4 вуличні дерева в лунках, через 8 м, два види вперемішку».\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: Твій острів уже існує на папері: мапа в масштабі з узбережжям, дорогами, мальовничим маршрутом і двома районами. Today: Сьогодні ти малюєш план ділянки для кожного району: кожен предмет пораховано, польотні коридори мають висоти, а п'ять камер підібрано до ключових фото. One encouraging line: Рахувати — копітка робота, що згодом заощаджує дні, тож бери по одному району й попроси тьютора перевірити твої числа.); 2 lines on why today matters and where it comes back, in plain words (from this: На справжньому проєкті нічого не ставлять, поки немає письмового плану. План із числами, як-от «4 вуличні дерева в лунках, через 8 м», швидко будується і виглядає як справжнє місце. Коридори, намальовані зараз, лишаються вільними, коли район заповниться. А п'ять камер — це кадри, якими ти завершиш курс. It comes back: Завтра кожен рядок планів отримає джерело в списках потреб. У День 41 за plot_plan_d1 ти розставиш район 1 об'єкт за об'єктом, а стрілки стануть камерами C1–C5. У День 48 те саме буде з plot_plan_d2.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-23-two-plot-plans exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (план району 1, набережна (разом з уроками)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Відкрий example-plot-plan.md із сьогоднішніх assets і прочитай розділ «What plan.png shows» («Що показує plan.png»). Випиши всі види інформації, які він містить. Має вийти близько восьми пунктів, наприклад шкала масштабу, місця s dense, and a tidy garden stays tidy.", "uk": "Садити рослини за фото: ті види, крок і щільність, що на твоїх фото. Густі чагарники лишаються густими, охайний сад — охайним."}, {"en": "Apply 'no straight lines in nature'. Shores, banks and plant groups are irregular; only things people built, like walls, quays, fields and roads, may be straight.", "uk": "Застосовувати правило «у природі немає прямих ліній». Береги, схили біля води й групи рослин нерівні. Прямими можуть бути лише речі, збудовані людьми: стіни, причали, поля, дороги."}], "doalong": [{"en": "Open your district 2 photos side by side. List the five things that make its character, for example terraces, white walls, steps, olive trees and a church tower. You should have five words.", "uk": "Відкрий фото району 2 поруч. Випиши п'ять речей, які творять його характер, наприклад тераси, білі стіни, сходи, оливи й церковна вежа. Має вийти п'ять слів."}, {"en": "Make plot_plan_d2.kra the same way as district 1: Save As, crop and scale to 800 x 800. On the buildings layer draw its buildings as labelled boxes where your photos put them. You should see buildings follow the slope or the track, never a grid dropped on a hill.", "uk": "Зроби plot_plan_d2.kra так само, як для району 1: Save As, обрізати й змінити розмір до 800 × 800. На шарі buildings намалюй будівлі підписаними прямокутниками там, де вони є на фото. Будівлі йдуть за схилом чи стежкою, а не сіткою, кинутою на пагорб."}, {"en": "On the base layer, colour every area by type: water, rock, road, yard or garden, field, wild ground. You should see no blank area left.", "uk": "На шарі base розфарбуй кожну ділянку за типом: вода, камінь, дорога, подвір'я чи сад, поле, дика земля. Порожніх ділянок не лишається."}, {"en": "Fill wild ground with planting groups drawn as irregular blobs, each with its kind and count. Mix two kinds and never plant in rows. You should see clumps and gaps, like your photos.", "uk": "Заповни дику землю групами рослин — нерівними плям  step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}], "handin": [{"en": "summary.md", "uk": "summary.md (звіт дня)"}, {"en": "plot_plan_d1.png and plot_plan_d1.md (→ Day 24)", "uk": "plot_plan_d1.png і plot_plan_d1.md (план району 1) (→ День 24)"}, {"en": "plot_plan_d2.png and plot_plan_d2.md (→ Day 24)", "uk": "plot_plan_d2.png і plot_plan_d2.md (план району 2) (→ День 24)"}], "goal": {"en": "By the end of today you have plot_plan_d1.png and plot_plan_d2.png, with items counted, drone lanes with heights, and five cameras matched to hero photos.", "uk": "До кінця дня в тебе є plot_plan_d1.png і plot_plan_d2.png: об'єкти підраховано, польотні коридори мають висоти, а п'ять камер зіставлено з ключовими фото."}, "uses": [{"en": "Day 22: island_map.kra and map_notes.md with your two red districts and the scenic route", "uk": "День 22: island_map.kra і map_notes.md із двома червоними районами й мальовничим маршрутом"}, {"en": "Day 21: your photos and hero photos in references.md", "uk": "День 21: твої фото й ключові фото в references.md"}, {"en": "Days 1 to 13: your own kit (bollard, bench, lamp post, bin, pier deck, quay edge, railing, wall pieces and shop front) as first sources", "uk": "Дні 1–13: твій власний набір (стовпчик, лавка, ліхтарний стовп, урна, настил пірса, причал, поруччя, деталі стін і фасад крамниці) як перші джерела"}], "quiz": [{"q": {"en": "Your promenade is 90 m long and you want a bench every 15 m. How many benches go in the table?", "uk": "Твоя прогулянкова набережна має 90 м завдовжки, і ти хочеш лавку через кожні 15 м. Скільки лавок іде в таблицю?"}, "options": [{"en": "3", "uk": "3"}, {"en": "6", "uk": "6"}, {"en": "15", "uk": "15"}, {"en": "90", "uk": "90"}], "answer": 1, "explain": {"en": "90 ÷ 15 = 6. Counting along a length turns 'a few benches' into a number you can place.", "uk": "90 ÷ 15 = 6. Підрахунок уздовж довжини перетворює «кілька лавок» на число, яке можна розставити."}}, {"q": {"en": "A planting bed is 12 x 6 m and the shrubs sit 1.5 m apart. About how many shrubs?", "uk": "Клумба має 12 × 6 м, а кущі ростуть через 1,5 м. Скільки приблизно кущів?"}, "options": [{"en": "About 32", "uk": "Близько 32"}, {"en": "About 8", "uk": "Близько 8"}, {"en": "About 72", "uk": "Близько 72"}, {"en": "About 108", "uk": "Близько 108"}], "answer": 0, "explain": {"en": "Area ÷ (spacing x spacing): 72 ÷ 2.25 = 32.", "uk": "Площа ÷ (крок × крок): 72 ÷ 2,25 = 32."}}, {"q": {"en": "Your lane A runs along the café fronts at 3 m, under the parasols. What's wrong?", "uk": "Твій коридор A проходить уздовж фасадів кафе на висоті 3 м, під парасолями. Що не так?"}, "options": [{"en": "Nothing: low lanes look exciting.", "uk": "Нічого: низькі коридори виглядають захопливо."}, {"en": "Lanes may only fly over water.", "uk": "Коридори можуть проходити лише над водою."}, {"en": "Lanes must be at least 4 x 4 m and clear of parasols, awnings and lamp heads, so raise it to 6 to 10 m.", "uk": "Коридор має бути щонайменше 4 × 4 м і вільний від парасоль, маркіз і голівок ліхтарів, тож підніми його до 6–10 м."}], "answer": 2, "explain": {"en": "A drone in that lane would hit the parasols. Lanes stay open above street clutter.", "uk": "Дрон у такому коридорі врізався б у парасолі. Коридори лишаються вільними над вуличними речами."}}, {"q": {"en": "Why does each camera C1 to C5 name a hero photo?", "uk": "Навіщо біля кожної камери C1–C5 названо ключове фото?"}, "options": [{"en": "The tutor needs a file name.", "uk": "Тьютору потрібна назва файлу."}, {"en": "Photos make the plan look nicer.", "uk": "Фото роблять план гарнішим."}, {"en": "Cameras without photos don't render.", "uk": "Камери без фото не рендеряться."}, {"en": "Your final screenshots will stand beside those photos, so each camera must show the same kind of view.", "uk": "Твої фінальні скриншоти стоятимуть поруч із цими фото, тож кожна камера має показувати такий самий вид."}], "answer": 3, "explain": {"en": "Matching views is how you prove your district looks like the real place.", "uk": "Збіг видів доводить, що твій район схожий на справжнє місце."}}, {"q": {"en": "Your farm-valley plan has a ruler-straight row of 20 trees along the stream bank. Pass or foul?", "uk": "На твоєму плані долини з фермами 20 дерев стоять рівним, як по лінійці, рядом уздовж берега струмка. Зараховано чи порушення?"}, "options": [{"en": "Pass: farms are tidy.", "uk": "Зараховано: ферми охайні."}, {"en": "Foul: a stream bank is natural, so trees there grow in irregular groups; only trees people planted on purpose, like an orchard, stand in rows.", "uk": "Порушення: берег струмка природний, тож дерева там ростуть нерівними групами. Рядами стоять лише дерева, які люди посадили навмисно, як-от сад."}, {"en": "Pass, if all the trees are one kind.", "uk": "Зараховано, якщо всі дерева одного виду."}], "answer": 1, "explain": {"en": "Nature has no straight lines. A row along a natural bank is the first thing the eye notices as fake.", "uk": "У природі немає прямих ліній. Ряд уздовж природного берега — перше, що око помічає як несправжнє."}}], "weekInfo": {"week": 5, "title": {"en": "Your real place and your island on paper", "uk": "Твоє реальне місце і твій острів на папері"}, "goal": {"en": "By Friday you have a complete planning pack: one real coastal place with 15 credited photos, island_map.png to scale with two red 200 x 200 m districts and the scenic route, two counted plot plans, two needs lists, reviewed free packs, and the Electric Dreams download under way.", "uk": "До п'ятниці в тебе є повний пакет планування: одне реальне прибережне місце з 15 фото з рядками авторства; island_map.png у масштабі з двома червоними районами 200 × 200 м і мальовничим маршрутом; два плани ділянок із підрахованими об'єктами; два списки потреб; оглянуті безкоштовні паки. Завантаження Electric Dreams уже триває."}, "skills": [{"en": "Reference research and image licensing (Creative Commons) for production art", "uk": "Пошук референсів і ліцензування зображень (Creative Commons) для продакшн-арту"}, {"en": "Scaled world maps from OpenStreetMap data, with districts, roads and flight routes", "uk": "Мапи світу в масштабі за даними OpenStreetMap: райони, дороги й маршрути польотів"}, {"en": "Plot plans with item counts, camera positions and drone lanes for level layout", "uk": "Плани ділянок із підрахунком об'єктів, позиціями камер і польотними коридорами для планування рівня"}, {"en": "Asset sourcing: needs lists, Fab licence checks and best-pieces reviews", "uk": "Пошук асетів: списки потреб, перевірка ліцензій на Fab і огляд найкращих деталей паків"}, {"en": "Pre-production review: consistency checks and a one-page planning board", "uk": "Перевірка планів перед виробництвом (препродакшн): узгоджені числа й аркуш планування на одну сторінку"}]}, "morning": {"sofar": {"en": "Your island exists on paper: a map to scale with a coast, roads, a scenic route and two districts.", "uk": "Твій острів уже існує на папері: мапа в масштабі з узбережжям, дорогами, мальовничим маршрутом і двома районами."}, "today": {"en": "You draw a plot plan for each district, with every item counted, drone lanes with heights, and five cameras matched to your hero photos.", "uk": "Сьогодні ти малюєш план ділянки для кожного району: кожен предмет пораховано, польотні коридори мають висоти, а п'ять камер підібрано до ключових фото."}, "cheer": {"en": "Counting is careful work that saves days later, so take one district at a time and ask your tutor to check your numbers.", "uk": "Рахувати — копітка робота, що згодом заощаджує дні, тож бери по одному району й попроси тьютора перевірити твої числа."}, "quote": {"text": {"en": "Make big plans; aim high in hope and work.", "uk": "Складай великі плани; цілься високо — і в надії, і в праці."}, "author": {"en": "Daniel Burnham", "uk": "Деніел Бернем"}, "source": "https://en.wikiquote.org/wiki/Daniel_Burnham"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-23-two-plot-plans", "mapHref": "../../COURSE.html", "prevHref": "../Day-22-island-map-to-scale/START-HERE.html", "nextHref": "../Day-24-needs-lists-and-free-packs/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Krita. I am a beginner on Day 23. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me and don't write code.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: План району 2 з його власним характером — самостійно.\nIt's part of: Плани ділянок для двох районів: plot_plan_d1.png і plot_plan_d2.png (кожен 800 × 800 px, 4 px = 1 м) із таблицями plot_plan_d1.md і plot_plan_d2.md (Твої два червоні райони 200 × 200 м на island_map.png: район 1 — набережна, район 2 — тип місцевості, вибраний у День 22.).\nWhy it matters: На справжньому проєкті нічого не ставлять, поки немає письмового плану. План із числами, як-от «4 вуличні дерева в лунках, через 8 м», швидко будується і виглядає як справжнє місце. Коридори, намальовані зараз, лишаються вільними, коли район заповниться. А п'ять камер — це кадри, якими ти завершиш курс. It comes back: Завтра кожен рядок планів отримає джерело в списках потреб. У День 41 за plot_plan_d1 ти розставиш район 1 об'єкт за об'єктом, а стрілки стануть камерами C1–C5. У День 48 те саме буде з plot_plan_d2.\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-23-two-plot-plans (on the drive I chose on Day 0).\nWhat I already know: День 22: island_map.kra і map_notes.md із двома червоними районами й мальовничим маршрутом; День 21: твої фото й ключові фото в references.md; Дні 1–13: твій власний набір (стовпчик, лавка, ліхтарний стовп, урна, настил пірса, причал, поруччя, деталі стін і фасад крамниці) як перші джерела; today's lessons: Що містить план ділянки: зразковий план; Підрахунок об'єктів; Польотні коридори, орієнтири й п'ять камер; Район із власним характером. Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- Спершу intent.md: близько 5 рядків на район — що це за місце, що де стоїть і чому, що бачить дрон. Ти перевіряєш його з тьютором за перевіркою з п'яти пунктів.\n- Два файли Krita: plot_plan_d1.kra і plot_plan_d2.kra, кожен 800 × 800 px (4 px = 1 м), північ угорі. На кожному — шкала масштабу 50 м (200 px), а на нижньому шарі — висоти з мапи острова.\n- Поки малюєш, увімкни сітку 10 м (View > Show Grid, крок 40 px, як у День 4). Сітка не експортується. Тому на шарі labels підпиши острівні метри з map_notes.md: у кутах і через кожні 50 м.\n- Шари: base, water and shore, roads and paving, buildings, planting, furniture, lanes, cameras, labels.\n- Кожна будівля — підписаний прямокутник із призначенням. Дороги й доріжки — з шириною. Рослини, вуличні меблі й човни — підраховані групи. Для району 2 сьогодні потрібні лише п'ять найбільших груп: дрібні пропси ти порахуєш у День 51.\n- Польотні коридори щонайменше 4 × 4 м — вільні проходи, крізь які може пролетіти дрон. Намалюй їх смугами з висотами: від мальовничого маршруту в кожен район і крізь нього. З початку кожного коридору видно один орієнтир.\n- П'ять камер на район, C1–C5: C1 — підліт, C2 — будівлі, C3 — головний об'єкт, C4 — загальний план, C5 — близький план землі. Біля кожної стрілки — висота й ключове фото, якому камера відповідає.\n- Таблиці у стилі example-plot-plan.md: об'єкт, кількість, де (острівні метри), крок або щільність і перше припущення про джерело. Кожна кількість — число. Унизу кожної таблиці — перевірка трьох правил: усе з нашого часу; речі стоять там, де вони є на твоїх фото; у природі немає прямих ліній.\n\nMy checklist (the same numbers show on my course page):\n1. Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: intent.md, plot_plan_d1.kra з початими коридорами й камерами, plot_plan_d1.md і plot_plan_d2.kra. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Потім допиши intent.md і виправ кожне «ні» з перевірки з п'яти пунктів. Перевірка: під задумом кожного району п'ять відповідей «так». (from lesson 1)\n2. Заверши рамку plot_plan_d1.kra: шкала масштабу 50 м, стрілка півночі, шари й острівні метри в кутах і через кожні 50 м. Перевірка: 200 px — це 50 м, а підписи кутів збігаються з map_notes.md. (from lesson 2)\n3. Будівлі району 1: кожен контур — підписаний прямокутник із призначенням, наприклад кафе, крамниця чи контора гавані. Перевірка: у кожної будівлі бік із дверима дивиться на вулицю або причал. (from lesson 1)\n4. Дороги, мощення й край причалу в районі 1, кожне з шириною. Перевірка: край причалу прямий там, де його збудували люди, а природний берег нерівний. (from lesson 4)\n5. Вуличні меблі, човни й рослини району 1 — підрахованими групами: лавки, ліхтарі, урни, швартовні стовпчики, столики кафе, дерева в лунках. Перевірка: у кожної групи є число, обчислене з довжини або площі. (from lesson 2)\n6. Коридори району 1 (щонайменше 4 × 4 м, із висотами) і камери C1–C5, кожна зіставлена з ключовим фото. Перевірка: кожен коридор має 16 px завширшки або більше, і біля кожної камери названо фото. (from lesson 3)\n7. Заверши plot_plan_d1.md: кожен об'єкт — рядок (об'єкт, кількість, де, крок або щільність, перше припущення про джерело), а внизу — перевірка правил. Перевірка: жоден рядок не каже «трохи» чи «кілька», і в кожному є припущення про джерело. (from lesson 2)\n8. У plot_plan_d2.kra намалюй будівлі й дороги району 2 відповідно до його типу місцевості. Перевірка: розкладка йде за схилом, мисом чи долиною, як на твоїх фото району 2. (from lesson 4)\n9. Рослини й пропси району 2: лише п'ять найбільших груп, підрахованих, а природна земля лишається нерівною. Дрібні пропси чекають на День 51. Перевірка: п'ять підрахованих груп, є скупчення й прогалини, а прямі лінії — лише там, де щось збудували люди. (from lesson 4)\n10. Коридори й камери C1–C5 району 2, кожна камера зіставлена з ключовим фото. Перевірка: з початку кожного коридору видно один орієнтир. (from lesson 3)\n11. Напиши plot_plan_d2.md із перевіркою правил. Перевірка: ті самі стовпці, що й для району 1, і кожна кількість — число. (from lesson 2)\n12. Збережи обидва файли .kra й експортуй plot_plan_d1.png і plot_plan_d2.png. Зменш копію кожного до 200 × 200 px і поклади на його червоний квадрат на island_map.png. Перевірка: кожен PNG знову відкривається з розміром 800 × 800 px, а його берег і дороги збігаються з мапою острова з точністю до кількох метрів. (from lesson 1)\n13. Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: кожна назва зі списку є в папці, у кожної є розмір. (from day 0, lesson 1)\n\nHow to help: ask which step number I'm on, then give me only the next step: the exact clicks and what I should see. When I send a screenshot, compare it with my reference, my sizes and the spec, and name one thing to fix at a time.\nCheck every save and export by reopening it before we move on:\n- a .md or .txt: open it with Notepad; the text is there, and the name doesn't end in .md.txt\nWhen I write \"готово\", and in any case before the day ends, check with me one item at a time (yes/no): each spec point, then each file on my hand-in list, ready in my day work folder (skip summary.md: the day report writes it next):\n1. plot_plan_d1.png і plot_plan_d1.md (план району 1) (→ День 24)\n2. plot_plan_d2.png і plot_plan_d2.md (план району 2) (→ День 24)\nFinish with a short list of anything missing, and one line on where this work comes back and what it will look like there. Then tell me the order for the end of the day: first the day report (the Copy the day report button at the bottom of my course page) into summary.md, and only then hand in all the files on the list, summary.md too.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; rubric = таблиця оцінювання; see-why-fix note = нотатка «бачу, чому, як виправити»; checklist = чек-лист; credits line = рядок авторства; reference photo / hero photo = фото-референс / ключове фото; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; grid = сітка (тільки grid, ніколи mesh); vertex / edge / face = вершина / ребро / грань; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); UV unwrap / UV layout / seam / UV island = розгортка / розкладка / шов / UV-острівець; texel density / checker pattern = щільність текселів / шахівниця; level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; collision / UCX collision box = колізія / блок UCX; volume (PCG Volume, Post Process Volume) = об'єм; drone flight corridor = польотний коридор; kit / kit piece / part of one object = набір / деталь / частина; map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; district / plot / plot plan = район / ділянка / план ділянки; harbour / quay / waterfront / pier = гавань / причал / набережна / пірс; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; shop front / shop window = фасад крамниці / вітрина; vista / blockout / landmark = панорама / блокаут / орієнтир; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; hero shot = головний кадр (hero shot).\n\nStart by asking for my best reference photo. Then, one at a time, my sizes and my step number.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender.", "reportPrompt function vid(v){if(!v)return '';const link=v.url?'<a href="'+esc(v.url)+'" target="_blank" rel="noopener">'+esc(x(v.title)||v.url)+'</a>'+(v.channel?' <span class="muted">· '+esc(v.channel)+(v.length?' · '+esc(v.length):'')+'</span>':''):'';const s=v.search?'<a href="https://www.youtube.com/results?search_query='+encodeURIComponent(v.search)+'" target="_blank" rel="noopener">'+u('noVid')+': '+esc(v.search)+'</a>':'';const alt=v.alt&&v.alt.url?'<br><span class="eyebrow">UA</span> <a href="'+esc(v.alt.url)+'" target="_blank" rel="noopener">'+esc(v.alt.title||v.alt.url)+'</a>'+(v.alt.channel?' <span class="muted">· '+esc(v.alt.channel)+'</span>':''):'';return '<div class="vid well">'+kn('play')+'<div><b>'+u('more')+'?</b><br>'+(link||s)+alt+(link&&s?'<br><span class="muted" style="font-size:14px">'+s+'</span>':'')+'</div></div>'}
function morning(){const m=D.morning;if(!m)return '';const q=m.quote||{};
 let shelf='';if(D.day>0){shelf='<div class="shelf" aria-hidden="true">';let g='';for(let d=0;d<D.day;d++){let p=0;try{p=(JSON.parse(localStorage.getItem('devteam:'+D.learner+':'+d))||{}).pct||0}catch(e){}g+='<i class="'+(p>=1?'d':'')+(d>0&&d%5===0?' bs':'')+'"></i>';if(d%5===0||d===D.day-1){shelf+='<span class="wkg">'+g+'</span>';g=''}}shelf+='</div>'}
 const qt=lang==='uk'&&q.original?q.original:x(q.text);
 return '<section class="card glass morning"><div class="mgrid">'+(m.sofar?'<div>'+lab(u('sofar'),'gold')+shelf+'<p class="mtxt">'+lk(x(m.sofar))+'</p></div>':'')+(m.today?'<div>'+lab(u('todayL'))+'<p class="mtxt">'+lk(x(m.today))+'</p></div>':'')+'</div>'+(m.cheer?'<p class="cheer">'+esc(x(m.cheer))+'</p>':'')+(qt?'<figure class="quote well">'+kn('quote')+'<blockquote>'+esc(qt)+'</blockquote>'+(q.author?'<figcaption>'+esc(x(q.author))+'</figcaption>':'')+'</figure>':'')+'</section>'}
function setLang(l){lang=l;try{localStorage.setItem('devteam:lang',lang)}catch(e){};render()}
function toggleLang(){setLang(lang==='uk'?'en':'uk')}
/* keep open sections and keyboard focus across re-renders */
const openD=new Set();
function tg(e){if(e.open)openD.add(e.id);else openD.delete(e.id)}
const op=id=>openD.has(id)?' open':'';
function render(){const ae=document.activeElement,fid=ae&&(ae.id||(ae.getAttribute('data-th')?'th-'+ae.getAttribute('data-th'):ae.getAttribute('lang')&&ae.closest('.seg')?'lg-'+ae.getAttribute('lang'):''));
 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);
 const b=D.build,P=Math.round(prog()*100);
 document.getElementById('top').innerHTML='<div class="topin glass"><a class="maplink" href="'+esc(D.mapHref)+'">'+kn('map')+u('map')+'</a><div class="crumb"><b>'+esc(x(D.learnerName))+'</b><span>'+u('week')+' '+D.week+'</span><span>'+u('day')+' '+D.day+' '+u('of')+' '+D.total+'</span></div>'+controls(lang,'setLang')+'</div><div class="tline"><i style="width:'+P+'%"></i></div>';
 const state=w=>w<D.week?'b':w===D.week?'n':'p';
 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 let wk='';if(D.weekInfo){const w=D.weekInfo;wk='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}
 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p>'+(b.next?'<div class="back well">'+kn('arrow')+'<div><b>'+u('comes')+'</b><br>'+lk(x(b.next))+'</div></div>':'')+'<div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.assetFiles&&D.assetFiles.length?'<p class="files">'+ic('folder')+'<span>'+u('filesL')+' '+D.assetFiles.map(f=>'<a href="assets/'+encodeURIComponent(f)+'" target="_blank" rel="noopener">'+esc(f)+'</a>').join(', ')+'</span></p>':D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+=handinCard();h+=beforeCard();
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div><label class="rcpt" for="r'+i+'"><span class="eyebrow">'+u('rcpt')+'</span><textarea id="r'+i+'" rows="2" placeholder="'+esc(u('rcptPh'))+'" oninput="st.r'+i+'=this.value;save()">'+esc(st['r'+i]||'')+'</textarea></label>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+hList()+chkList()+(hasClip?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<h3>1 · '+u('copyR')+'</h3><p class="muted">'+u('report')+'</p><div class="row"><button class="btn ghost" onclick="cp(reportText())">'+ic('copy')+u('copyR')+'</button></div><h3>2 · '+u('ship')+'</h3>'+hf()+'<p class="muted" style="margin:12px 0 0">'+u('hNote')+'</p></section>';
 h+=qCard();h+=wk;
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();
</script>

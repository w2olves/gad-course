<script id="data" type="application/json">{"learner": "ib-andrii-5f4e723e", "learnerName": {"en": "Andrii", "uk": "Андрій"}, "day": 2, "week": 1, "total": 60, "title": {"en": "The park bench: Edit Mode, loop cuts, extrude and inset", "uk": "Паркова лавка: Edit Mode, петлеві розрізи, extrude та inset"}, "theme": {"en": "Week 1: Blender from zero", "uk": "Тиждень 1: Blender з нуля"}, "build": {"item": {"en": "SM_Bench: a park bench with metal side frames and timber slats (narrow wooden boards)", "uk": "SM_Bench: паркова лавка з металевими боковинами й дерев'яними планками (вузькими дерев'яними дошками)"}, "why": {"en": "Benches show the scale of a place at a glance, because everyone knows how high a seat is: about 0.45 m. If your seat is 0.6 m, every player feels something is wrong. Extrude, inset and loop cut are the everyday tools of every 3D artist, and studios expect them in any art test (the modelling task a studio sets job applicants).", "uk": "Лавки з першого погляду показують масштаб місця, бо всі знають, яка висота сидіння: близько 0.45 м. Якщо твоє сидіння на висоті 0.6 м, кожен гравець відчуває, що щось не так. Extrude, inset і loop cut — щоденні інструменти кожного 3D-художника, і студії очікують їх у будь-якому арт-тесті (тестовому завданні з моделювання, яке студія дає кандидатам на роботу)."}, "where": {"en": "Your island's waterfront promenade (a wide path along the sea for walking, in district 1), facing the sea. On Friday it joins your street set in Course/Day05.", "uk": "Прогулянкова набережна твого острова (широка доріжка вздовж моря для прогулянок, у районі 1); лавка стоїть обличчям до моря. У п'ятницю вона приєднається до твого вуличного набору в Course/Day05."}, "spec": [{"en": "Real sizes from a maker's product sheet or measured photos, written in bench_sizes.md: about 1.8 m long, seat height about 0.45 m, seat depth about 0.4 m, top of the back about 0.8 m.", "uk": "Реальні розміри з технічного листа виробника або з обмірних фото, записані в bench_sizes.md: близько 1.8 м завдовжки, висота сидіння близько 0.45 м, глибина сидіння близько 0.4 м, верх спинки на висоті близько 0.8 м."}, {"en": "Two side frames, each made from one cube with loop cuts and extrude: a front leg, a back leg and a back post that leans back.", "uk": "Дві боковини, кожна з одного куба за допомогою loop cut і extrude: передня ніжка, задня ніжка і задня стійка, нахилена назад."}, {"en": "At least four seat slats and three back slats, each about 0.08 m wide with gaps of about 2 cm; the back slats follow the lean of the back posts.", "uk": "Щонайменше чотири планки сидіння і три планки спинки, кожна приблизно 0.08 м завширшки, з проміжками близько 2 см; планки спинки йдуть за нахилом задніх стійок."}, {"en": "One object named SM_Bench, with its origin at the base centre on Z = 0 and all transforms applied.", "uk": "Один об'єкт із назвою SM_Bench, з origin у центрі основи на Z = 0 і всіма застосованими трансформаціями."}, {"en": "3,000 triangles or fewer.", "uk": "3 000 трикутників або менше."}, {"en": "In Unreal (Course/Day02), it stands on the floor beside the mannequin and the bollard, and the seat reaches about the mannequin's knee.", "uk": "В Unreal (Course/Day02) лавка стоїть на підлозі поруч із манекеном і стовпчиком, а сидіння сягає приблизно коліна манекена."}], "piece1": "a practice block bench: one seat block with four legs pulled out with loop cuts and extrude (in the lessons)", "piece2": {"en": "SM_Bench: the park bench with side frames, slats and a backrest, on your own", "uk": "SM_Bench: паркова лавка з боковинами, планками і спинкою, самостійно"}, "steps": [{"text": {"en": "Find a park bench product sheet (makers publish drawings with sizes) or two Commons photos you can measure as on Day 1. Write the parts list with sizes in bench_sizes.md and credit any photo in credits.md. Check: length, seat height, seat depth, back height and slat width are all written down.", "uk": "Знайди технічний лист паркової лавки (виробники публікують креслення з розмірами) або два фото з Commons, які можна виміряти, як у День 1. Запиши список частин із розмірами в bench_sizes.md і вкажи кожне фото в credits.md. Перевірка: довжину, висоту сидіння, глибину сидіння, висоту спинки й ширину планки записано."}, "lesson": 4}, {"text": {"en": "Open bench_day2.blend from Lesson 4 (Units: Metric, 1.0) and hide the slats while you build the frames (select them, press H). Side frame: add a cube with Dimensions 0.06 x 0.5 x 0.06 m, apply the scale, and move it to X -0.8 and Z 0.38 (G X -0.8, G Z 0.38). Check: in the side view (Numpad 3), a short bar floats about 0.4 m above the grid.", "uk": "Відкрий bench_day2.blend з Уроку 4 (Units: Metric, 1.0) і сховай планки, поки будуєш боковини (виділи їх, натисни H). Боковина: додай куб із Dimensions 0.06 x 0.5 x 0.06 м, застосуй масштаб і перемісти його на X -0.8 і Z 0.38 (G X -0.8, G Z 0.38). Перевірка: на виді збоку (Numpad 3) короткий брусок висить приблизно на 0.4 м над сіткою підлоги."}, "lesson": "D1.3"}, {"text": {"en": "Tab into Edit Mode and add 2 loop cuts across the bar's length (Ctrl+R on a long edge, scroll to 2, click, right-click). Select each new loop and set its Median Y in the sidebar (Global) to -0.19 and 0.19. Check: from below (Ctrl+Numpad 7), the bottom face shows a small square at each end.", "uk": "Перейди в Edit Mode (Tab) і додай 2 петлеві розрізи впоперек довжини бруска (Ctrl+R на довгому ребрі, прокрути до 2, клацни, клацни правою кнопкою). Виділи кожну нову петлю й задай її Median Y на бічній панелі (Global): -0.19 і 0.19. Перевірка: знизу (Ctrl+Numpad 7) на нижній грані видно маленький квадрат на кожному кінці."}, "lesson": 2}, {"text": {"en": "Select the two small end squares on the bottom (face select, Shift+click), press E, type 0.35 and press Enter. Check: two legs reach down to the grid line in the side view.", "uk": "Виділи два маленькі квадрати на кінцях знизу (виділення граней, Shift+клацання), натисни E, введи 0.35 і натисни Enter. Перевірка: на виді збоку дві ніжки сягають лінії сітки."}, "lesson": 3}, {"text": {"en": "Back post: select the small square on top of the back end (the end at +Y), press E, type 0.4 and press Enter, then type G Y 0.08 Enter to lean the new top back. Tab out. Check: from the side, the frame looks like an h with a leaning back.", "uk": "Задня стійка: виділи маленький квадрат зверху на задньому кінці (кінець на +Y), натисни E, введи 0.4 і натисни Enter, а тоді введи G Y 0.08 Enter, щоб нахилити новий верх назад. Вийди з Edit Mode (Tab). Перевірка: збоку боковина схожа на літеру h із нахиленою спинкою."}, "lesson": 3}, {"text": {"en": "Second frame: Shift+D, then X 1.6 Enter. Check: two frames 1.6 m apart, both standing on the grid.", "uk": "Друга боковина: Shift+D, потім X 1.6 Enter. Перевірка: дві боковини на відстані 1.6 м одна від одної, обидві стоять на сітці підлоги."}, "lesson": "D1.1"}, {"text": {"en": "Seat slats: press Alt+H to show the four slats from Lesson 4, select them and type G Y -0.2 Enter, so the first one sits at Y -0.2. (Skipped the lesson? Make them now: a cube 1.8 x 0.08 x 0.04 m, scale applied, at Z 0.43 and Y -0.2, then Shift+D, Y 0.1 Enter, and Shift+R twice.) Check: four slats lie on the frames with even 2 cm gaps, their tops at 0.45 m.", "uk": "Планки сидіння: натисни Alt+H, щоб показати чотири планки з Уроку 4, виділи їх і введи G Y -0.2 Enter, щоб перша опинилася на Y -0.2. (Пропущено урок? Зроби їх зараз: куб 1.8 x 0.08 x 0.04 м, масштаб застосовано, на Z 0.43 і Y -0.2, потім Shift+D, Y 0.1 Enter і двічі Shift+R.) Перевірка: чотири планки лежать на боковинах із рівними проміжками 2 см, а їхній верх на висоті 0.45 м."}, "lesson": 4}, {"text": {"en": "Back slats: start from your Lesson 4 back slat (or a new cube 1.8 x 0.03 x 0.08 m), set it against the front of the back posts at about 0.55 m high; lean it with R X and a typed angle (try 12, or -12 if it leans forwards), then copy it up twice with Shift+D and small G Z and G Y moves. Check: from the side, three back slats follow the lean of the posts with no slat floating in the air.", "uk": "Планки спинки: почни зі своєї планки спинки з Уроку 4 (або з нового куба 1.8 x 0.03 x 0.08 м), приклади її до передньої сторони задніх стійок на висоті приблизно 0.55 м; нахили її через R X і введений кут (спробуй 12 або -12, якщо вона нахиляється вперед), а тоді скопіюй її двічі вгору через Shift+D і невеликі рухи G Z і G Y. Перевірка: збоку три планки спинки йдуть за нахилом стійок, і жодна планка не висить у повітрі."}, "lesson": 4}, {"text": {"en": "Look at the side view beside your photo and fix any gap between slats and frames with small typed moves. Check: every slat touches a frame, and the outline matches your photo.", "uk": "Порівняй вид збоку зі своїм фото й виправ будь-яку щілину між планками й боковинами невеликими введеними рухами. Перевірка: кожна планка торкається боковини, а силует збігається з твоїм фото."}, "lesson": "D1.3"}, {"text": {"en": "Join all parts (A, then Ctrl+J) and rename the object SM_Bench. Check: the Outliner shows one object with that exact name.", "uk": "Об'єднай усі частини (A, потім Ctrl+J) і перейменуй об'єкт на SM_Bench. Перевірка: Outliner показує один об'єкт саме з такою назвою."}, "lesson": "D1.4"}, {"text": {"en": "Origin to the base centre on Z = 0 (Shift+S > Cursor to World Origin, then Object > Set Origin > Origin to 3D Cursor) and Ctrl+A > All Transforms. Check: Location 0, 0, 0, Rotation 0, Scale 1, and Dimensions about 1.8 x 0.55 x 0.8 m (or your own sizes).", "uk": "Origin — у центр основи на Z = 0 (Shift+S > Cursor to World Origin, потім Object > Set Origin > Origin to 3D Cursor), і Ctrl+A > All Transforms. Перевірка: Location 0, 0, 0, Rotation 0, Scale 1, а Dimensions приблизно 1.8 x 0.55 x 0.8 м (або твої власні розміри)."}, "lesson": "D1.4"}, {"text": {"en": "Read Triangles in Statistics and write it in bench_sizes.md. Check: 3,000 triangles or fewer.", "uk": "Прочитай Triangles у Statistics і запиши число в bench_sizes.md. Перевірка: 3 000 трикутників або менше."}, "lesson": "D1.4"}, {"text": {"en": "Export SM_Bench.glb (selected only), import it into Course/Day02 in IslandCourse, and place it beside the mannequin and your bollard with End. Take unreal_bench.png. Check: the seat is about at the mannequin's knee.", "uk": "Експортуй SM_Bench.glb (лише виділене), імпортуй його в Course/Day02 в IslandCourse і постав поруч із манекеном і своїм стовпчиком за допомогою End. Зроби unreal_bench.png. Перевірка: сидіння приблизно на рівні коліна манекена."}, "lesson": "D0.3"}, {"text": {"en": "Captures. First before_after_day2.png: open your photo (double-click it), press Win+Left so it fills the left half of the screen, click Blender and press Win+Right, show the side view of your bench, then press Win+Shift+S and capture the whole screen. Then clip_day2.mp4, about 60 seconds: orbit the bench in Blender, then walk the mannequin past the bench and the bollard in Unreal. Win+Alt+R records only one program window, so for a clip that moves between Blender and Unreal open Snipping Tool, click Record and drag a box over the whole screen. Rename the clip clip_day2.mp4. Check: both files are in today's Work folder.", "uk": "Знімки й запис. Спершу before_after_day2.png: відкрий своє фото (двічі клацни на ньому), натисни Win+Left, щоб воно зайняло ліву половину екрана, клацни на Blender і натисни Win+Right, покажи вид лавки збоку, тоді натисни Win+Shift+S і зніми весь екран. Потім clip_day2.mp4, близько 60 секунд: обертай вид навколо лавки в Blender, а тоді проведи манекен повз лавку й стовпчик в Unreal. Win+Alt+R записує лише одне вікно програми, тож для кліпу, який переходить між Blender і Unreal, відкрий Snipping Tool, натисни Record і обведи рамкою весь екран. Перейменуй кліп на clip_day2.mp4. Перевірка: обидва файли лежать у сьогоднішній папці Work."}, "lesson": "D0.1"}]}, "lessons": [{"title": {"en": "Edit Mode: selecting points, edges and faces", "uk": "Edit Mode: виділяємо точки, ребра й грані"}, "minutes": 40, "goals": [{"en": "Select in Edit Mode with vertex, edge and face modes (1, 2, 3), Shift+click, a dragged box, and A or Alt+A.", "uk": "Виділяти в Edit Mode в режимах вершин, ребер і граней (1, 2, 3), через Shift+клацання, рамкою та клавішами A або Alt+A."}, {"en": "See through the model with X-ray (Alt+Z) to select the back, and select a whole edge loop with Alt+click.", "uk": "Дивитися крізь модель у режимі X-ray (Alt+Z), щоб виділяти задню частину, і виділяти цілу петлю ребер через Alt+клацання."}, {"en": "Move, rotate and scale selected parts with G, R and S, the same keys as for whole objects.", "uk": "Переміщати, обертати й масштабувати виділені частини клавішами G, R і S — тими самими, що й для цілих об'єктів."}], "doalong": [{"en": "New General file; save it as practice_day2.blend. Click the cube and press Tab: Edit Mode. You see black dots (vertices) and lines (edges). Press 1, 2 and 3 and watch the three small selection icons in the viewport header change.", "uk": "Новий файл General; збережи його як practice_day2.blend. Клацни на кубі й натисни Tab: це Edit Mode. Ти бачиш чорні точки (вершини) і лінії (ребра). Натискай 1, 2 і 3 і стеж, як змінюються три маленькі значки виділення в заголовку 3D Viewport."}, {"en": "Press 3 (face select) and click the top face: it turns orange. Type G Z 0.5 Enter: the top rises and the cube becomes a tall box.", "uk": "Натисни 3 (виділення граней) і клацни на верхню грань: вона стає помаранчевою. Введи G Z 0.5 Enter: верх піднімається, і куб перетворюється на високий брусок."}, {"en": "Press Alt+A to select nothing. Drag a box around the top half with the left mouse button: only the faces you can see get selected. Press Alt+Z for X-ray (see-through view) and drag again: the back faces are selected too. Press Alt+Z again to turn X-ray off.", "uk": "Натисни Alt+A, щоб зняти виділення. Обведи рамкою верхню половину, утримуючи ліву кнопку миші: виділяються лише ті грані, які ти бачиш. Натисни Alt+Z, щоб увімкнути X-ray (вид наскрізь), і обведи ще раз: тепер виділяються й задні грані. Натисни Alt+Z ще раз, щоб вимкнути X-ray."}, {"en": "Press 2 (edge select) and Alt+click one of the side edges: a whole ring of edges is selected. This ring is called an edge loop. Type S 0.8 Enter: the box gets a narrow waist.", "uk": "Натисни 2 (виділення ребер) і Alt+клацни одне з бічних ребер: виділяється ціле кільце ребер. Таке кільце називається петлею ребер (edge loop). Введи S 0.8 Enter: брусок отримує вузьку талію."}, {"en": "Press Ctrl+Z until the cube is a plain cube again, then Tab back to Object Mode. Remember: Edit Mode changes the shape; Object Mode moves the whole object.", "uk": "Натискай Ctrl+Z, доки куб знову не стане звичайним кубом, а тоді через Tab повернись в Object Mode. Запам'ятай: Edit Mode змінює форму, а Object Mode рухає весь об'єкт."}], "play": {"en": "Select-o-matic: the tutor calls out a selection ('the bottom face', 'all four top edges', 'one corner vertex', 'the whole back half'); I make it and send a screenshot within 30 seconds each.", "uk": "Виділяй-о-мат: тьютор називає виділення («нижня грань», «усі чотири верхні ребра», «одна кутова вершина», «уся задня половина»); я роблю кожне й надсилаю скриншот, на кожне — до 30 секунд."}, "video": {"search": "blender edit mode select vertices edges faces beginner", "alt": {"url": "https://www.youtube.com/watch?v=li0AMSd8_C4", "title": "НАВІГАЦІЯ в Blender Українською", "channel": "Stanisslayer"}}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Edit Mode: selecting points, edges and faces (Day 2, lesson 1 of 4).\nToday's build: SM_Bench: a park bench with metal side frames and timber slats (narrow wooden boards).\n\nBy the end of this lesson I can:\n1. Select in Edit Mode with vertex, edge and face modes (1, 2, 3), Shift+click, a dragged box, and A or Alt+A.\n2. See through the model with X-ray (Alt+Z) to select the back, and select a whole edge loop with Alt+click.\n3. Move, rotate and scale selected parts with G, R and S, the same keys as for whole objects.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (You have a working path from Blender to Unreal and your first real prop, SM_Bollard, measured from photos.), what I will learn today (You learn Edit Mode, loop cuts, extrude and inset, and shape SM_Bench, a park bench with slats and a leaning backrest.), encourage me (Edit Mode is a new way of thinking, and you have all day to get used to it; any part left unfinished simply waits for tomorrow.), and share today's quote: \"One could describe Design as a plan for arranging elements to accomplish a particular purpose.\" (Charles Eames).\n2. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n3. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n4. Game for this lesson: Select-o-matic: the tutor calls out a selection ('the bottom face', 'all four top edges', 'one corner vertex', 'the whole back half'); I make it and send a screenshot within 30 seconds each.\n5. Do-along on today's build (a practice block bench: one seat block with four legs pulled out with loop cuts and extrude (in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - New General file; save it as practice_day2.blend. Click the cube and press Tab: Edit Mode. You see black dots (vertices) and lines (edges). Press 1, 2 and 3 and watch the three small selection icons in the viewport header change.\n   - Press 3 (face select) and click the top face: it turns orange. Type G Z 0.5 Enter: the top rises and the cube becomes a tall box.\n   - Press Alt+A to select nothing. Drag a box around the top half with the left mouse button: only the faces you can see get selected. Press Alt+Z for X-ray (see-through view) and drag again: the back faces are selected too. Press Alt+Z again to turn X-ray off.\n   - Press 2 (edge select) and Alt+click one of the side edges: a whole ring of edges is selected. This ring is called an edge loop. Type S 0.8 Enter: the box gets a narrow waist.\n   - Press Ctrl+Z until the cube is a plain cube again, then Tab back to Object Mode. Remember: Edit Mode changes the shape; Object Mode moves the whole object.\n6. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n7. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Loop cuts: new edges exactly where you need them", "uk": "Loop cut: нові ребра саме там, де вони потрібні"}, "minutes": 40, "goals": [{"en": "Add loop cuts with Ctrl+R, choose how many with the mouse wheel, and set their exact position in the sidebar.", "uk": "Додавати петлеві розрізи через Ctrl+R, вибирати їхню кількість коліщатком миші й задавати точне положення на бічній панелі."}, {"en": "Explain why you need a loop cut before you can pull a leg or an arm out of a block.", "uk": "Пояснювати, чому потрібен петлевий розріз, перш ніж витягнути ніжку чи руку з бруска."}, {"en": "Plan where cuts go on a real object from its sizes.", "uk": "Планувати за розмірами справжнього об'єкта, де на ньому пройдуть розрізи."}], "doalong": [{"en": "Practice seat: select the cube, set Dimensions 1.2 x 0.4 x 0.06 m, press Ctrl+A > Scale, and type G Z 0.42 Enter: the seat floats with its top at 0.45 m.", "uk": "Тренувальне сидіння: виділи куб, задай Dimensions 1.2 x 0.4 x 0.06 м, натисни Ctrl+A > Scale і введи G Z 0.42 Enter: сидіння висить у повітрі, а його верх на висоті 0.45 м."}, {"en": "Tab into Edit Mode. Hover the mouse over one of the long edges and press Ctrl+R: a yellow line shows where the cut will go, across the seat. Scroll the wheel to show 2 cuts, click once, then right-click so they stay where they are. You see two new edge loops.", "uk": "Перейди в Edit Mode (Tab). Наведи мишу на одне з довгих ребер і натисни Ctrl+R: жовта лінія показує, де пройде розріз упоперек сидіння. Прокрути коліщатко, щоб було 2 розрізи, клацни один раз, а тоді клацни правою кнопкою, щоб вони лишилися на місці. Ти бачиш дві нові петлі ребер."}, {"en": "Press 2 and Alt+click the left new loop. In the sidebar (N) > Item, click Global. Median is the middle point of what you selected. Click the Median X box, type -0.5 and press Enter: the loop jumps to 10 cm from the end. Set the right loop to 0.5 the same way.", "uk": "Натисни 2 і Alt+клацни ліву нову петлю. На бічній панелі (N) > Item натисни Global. Median — це середня точка виділеного. Клацни поле Median X, введи -0.5 і натисни Enter: петля перестрибує на 10 см від краю. Так само встанови праву петлю на 0.5."}, {"en": "Hover over a short edge, press Ctrl+R, scroll to 2 cuts, click and right-click. Set these two loops' Median Y to -0.15 and 0.15.", "uk": "Наведи мишу на коротке ребро, натисни Ctrl+R, прокрути до 2 розрізів, клацни і клацни правою кнопкою. Встанови для цих двох петель Median Y -0.15 і 0.15."}, {"en": "Press Ctrl+Numpad 7 to look from below: the bottom face is now split, with a small square at each corner. These four squares become the legs in the next lesson. Save.", "uk": "Натисни Ctrl+Numpad 7, щоб подивитися знизу: нижню грань тепер поділено, і в кожному куті є маленький квадрат. На наступному уроці ці чотири квадрати стануть ніжками. Збережи."}], "play": {"en": "Cut planner: the tutor names three objects (a table, a door frame, a window with four panes); I say where I'd put loop cuts and how many, then I cut one of them on a cube and send a screenshot.", "uk": "Планувальник розрізів: тьютор називає три об'єкти (стіл, дверна рама, вікно з чотирма шибками); я кажу, де мають пройти петлеві розрізи і скільки їх, а тоді роблю розрізи для одного з них на кубі й надсилаю скриншот."}, "video": {"search": "blender loop cut and slide beginner"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Loop cuts: new edges exactly where you need them (Day 2, lesson 2 of 4).\nToday's build: SM_Bench: a park bench with metal side frames and timber slats (narrow wooden boards).\nEarlier today I already did: lesson 1 (Edit Mode: selecting points, edges and faces). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Add loop cuts with Ctrl+R, choose how many with the mouse wheel, and set their exact position in the sidebar.\n2. Explain why you need a loop cut before you can pull a leg or an arm out of a block.\n3. Plan where cuts go on a real object from its sizes.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Cut planner: the tutor names three objects (a table, a door frame, a window with four panes); I say where I'd put loop cuts and how many, then I cut one of them on a cube and send a screenshot.\n4. Do-along on today's build (a practice block bench: one seat block with four legs pulled out with loop cuts and extrude (in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Practice seat: select the cube, set Dimensions 1.2 x 0.4 x 0.06 m, press Ctrl+A > Scale, and type G Z 0.42 Enter: the seat floats with its top at 0.45 m.\n   - Tab into Edit Mode. Hover the mouse over one of the long edges and press Ctrl+R: a yellow line shows where the cut will go, across the seat. Scroll the wheel to show 2 cuts, click once, then right-click so they stay where they are. You see two new edge loops.\n   - Press 2 and Alt+click the left new loop. In the sidebar (N) > Item, click Global. Median is the middle point of what you selected. Click the Median X box, type -0.5 and press Enter: the loop jumps to 10 cm from the end. Set the right loop to 0.5 the same way.\n   - Hover over a short edge, press Ctrl+R, scroll to 2 cuts, click and right-click. Set these two loops' Median Y to -0.15 and 0.15.\n   - Press Ctrl+Numpad 7 to look from below: the bottom face is now split, with a small square at each corner. These four squares become the legs in the next lesson. Save.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Extrude and inset: pulling new shapes out of faces", "uk": "Extrude та inset: витягуємо нові форми з граней"}, "minutes": 40, "goals": [{"en": "Extrude (E) selected faces to pull out new geometry, and type the distance.", "uk": "Видавлювати (extrude, E) виділені грані, щоб витягти нову геометрію, і вводити відстань."}, {"en": "Inset (I) a face to make a border inside it, and type the width.", "uk": "Робити inset (I) — рамку всередині грані — і вводити її ширину."}, {"en": "Build legs from the corner squares, and know what to do when an extrude goes wrong.", "uk": "Будувати ніжки з кутових квадратів і знати, що робити, коли extrude йде не так."}], "doalong": [{"en": "In practice_day2.blend, Tab into Edit Mode, press 3, turn on X-ray (Alt+Z), look from below (Ctrl+Numpad 7) and Shift+click the four corner squares.", "uk": "У practice_day2.blend перейди в Edit Mode (Tab), натисни 3, увімкни X-ray (Alt+Z), подивися знизу (Ctrl+Numpad 7) і через Shift+клацання виділи чотири кутові квадрати."}, {"en": "Press E, type 0.39 and press Enter: four legs grow down to the ground. Press Numpad 1 for the front view: the leg bottoms touch the grid line.", "uk": "Натисни E, введи 0.39 і натисни Enter: чотири ніжки виростають донизу до землі. Натисни Numpad 1 для виду спереду: низ ніжок торкається лінії сітки."}, {"en": "Press Alt+Z to leave X-ray and Alt+A to select nothing. Click the top face of the seat. Press I, type 0.03 and press Enter: a 3 cm border appears inside the face. That is an inset.", "uk": "Натисни Alt+Z, щоб вийти з X-ray, і Alt+A, щоб зняти виділення. Клацни на верхню грань сидіння. Натисни I, введи 0.03 і натисни Enter: усередині грані з'являється рамка 3 см. Це і є inset."}, {"en": "With the inner face still selected, press E, type -0.01 and press Enter: the middle sinks 1 cm, like a tray. Press Ctrl+Z twice to undo the tray; you only needed to see how inset and extrude work together.", "uk": "Поки внутрішня грань ще виділена, натисни E, введи -0.01 і натисни Enter: середина просідає на 1 см, як у таці. Натисни Ctrl+Z двічі, щоб скасувати тацю: тобі треба було лише побачити, як inset і extrude працюють разом."}, {"en": "If an extrude ever makes a strange spike, press Ctrl+Z at once and check which faces were selected. Tab out and save: you have a practice block bench, 0.45 m high, made from one cube.", "uk": "Якщо extrude колись зробить дивний шпичак, одразу натисни Ctrl+Z і перевір, які грані були виділені. Вийди з Edit Mode (Tab) і збережи: у тебе є тренувальна лавка-брусок, 0.45 м заввишки, зроблена з одного куба."}], "play": {"en": "Extrude race: from a fresh cube the tutor asks for a letter T, then a step, then a little table; I make each in 3 minutes and send a screenshot, and the tutor scores how clean each shape is.", "uk": "Перегони extrude: зі свіжого куба тьютор просить зробити літеру T, потім сходинку, потім маленький столик; я роблю кожну форму за 3 хвилини й надсилаю скриншот, а тьютор оцінює, наскільки чиста кожна форма."}, "video": {"search": "blender extrude and inset faces beginner", "alt": {"url": "https://www.youtube.com/watch?v=Py-SwJwPgk0", "title": "Урок 3 / Основи Blender 5.1 / Моделювання та модифікатори", "channel": "Fun Open Source Українською"}}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Extrude and inset: pulling new shapes out of faces (Day 2, lesson 3 of 4).\nToday's build: SM_Bench: a park bench with metal side frames and timber slats (narrow wooden boards).\nEarlier today I already did: lesson 1 (Edit Mode: selecting points, edges and faces); lesson 2 (Loop cuts: new edges exactly where you need them). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Extrude (E) selected faces to pull out new geometry, and type the distance.\n2. Inset (I) a face to make a border inside it, and type the width.\n3. Build legs from the corner squares, and know what to do when an extrude goes wrong.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Extrude race: from a fresh cube the tutor asks for a letter T, then a step, then a little table; I make each in 3 minutes and send a screenshot, and the tutor scores how clean each shape is.\n4. Do-along on today's build (a practice block bench: one seat block with four legs pulled out with loop cuts and extrude (in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - In practice_day2.blend, Tab into Edit Mode, press 3, turn on X-ray (Alt+Z), look from below (Ctrl+Numpad 7) and Shift+click the four corner squares.\n   - Press E, type 0.39 and press Enter: four legs grow down to the ground. Press Numpad 1 for the front view: the leg bottoms touch the grid line.\n   - Press Alt+Z to leave X-ray and Alt+A to select nothing. Click the top face of the seat. Press I, type 0.03 and press Enter: a 3 cm border appears inside the face. That is an inset.\n   - With the inner face still selected, press E, type -0.01 and press Enter: the middle sinks 1 cm, like a tray. Press Ctrl+Z twice to undo the tray; you only needed to see how inset and extrude work together.\n   - If an extrude ever makes a strange spike, press Ctrl+Z at once and check which faces were selected. Tab out and save: you have a practice block bench, 0.45 m high, made from one cube.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "From product sheet to bench: parts, slats and the backrest", "uk": "Від технічного листа до лавки: частини, планки і спинка"}, "minutes": 40, "goals": [{"en": "Turn a product sheet or photos into a parts list with sizes.", "uk": "Перетворювати технічний лист або фото на список частин із розмірами."}, {"en": "Make repeated slats with Shift+D, typed moves and Shift+R (repeat the last action).", "uk": "Робити однакові планки через Shift+D, введені рухи й Shift+R (повторити останню дію)."}, {"en": "Tilt a backrest with R, an axis and a typed angle, and check the shape from the side.", "uk": "Нахиляти спинку через R, вісь і введений кут та перевіряти форму збоку."}], "doalong": [{"en": "Search the web for a park bench product sheet (makers publish drawings with sizes), or measure two Commons photos as on Day 1. Write the parts list in bench_sizes.md: length, seat height, seat depth, back height and slat width.", "uk": "Пошукай в інтернеті технічний лист паркової лавки (виробники публікують креслення з розмірами) або виміряй два фото з Commons, як у День 1. Запиши список частин у bench_sizes.md: довжина, висота сидіння, глибина сидіння, висота спинки й ширина планки."}, {"en": "New file (File > New > General, delete the cube, check Units) and save it as bench_day2.blend in today's Work folder. Add a cube for one seat slat: Dimensions 1.8 x 0.08 x 0.04 m, Ctrl+A > Scale, then G Z 0.43 Enter: the slat's top is at 0.45 m.", "uk": "Новий файл (File > New > General, видали куб, перевір Units): збережи його як bench_day2.blend у сьогоднішній папці Work. Додай куб для однієї планки сидіння: Dimensions 1.8 x 0.08 x 0.04 м, Ctrl+A > Scale, потім G Z 0.43 Enter: верх планки на висоті 0.45 м."}, {"en": "Press Shift+D, then Y, type 0.1 and press Enter: a second slat sits 10 cm behind the first, with a 2 cm gap. Press Shift+R: Blender repeats the last action and a third slat appears. Press Shift+R again for a fourth.", "uk": "Натисни Shift+D, потім Y, введи 0.1 і натисни Enter: друга планка лягає на 10 см позаду першої, з проміжком 2 см. Натисни Shift+R: Blender повторює останню дію, і з'являється третя планка. Натисни Shift+R ще раз — ось і четверта."}, {"en": "Add one back slat: Dimensions 1.8 x 0.03 x 0.08 m, scale applied, at about 0.6 m high behind the seat. Type R X 12 Enter and look from the side (Numpad 3); if it leans forwards, press Ctrl+Z and try R X -12.", "uk": "Додай одну планку спинки: Dimensions 1.8 x 0.03 x 0.08 м, масштаб застосовано, на висоті приблизно 0.6 м позаду сидіння. Введи R X 12 Enter і подивися збоку (Numpad 3); якщо вона нахиляється вперед, натисни Ctrl+Z і спробуй R X -12."}, {"en": "Look at the side view beside your photo: does it already read as a bench? Save. This afternoon you add the frames and finish it.", "uk": "Порівняй вид збоку зі своїм фото: це вже схоже на лавку? Збережи. Після обіду ти додаси боковини й завершиш її."}], "play": {"en": "Spot the wrong bench: the tutor describes three benches (seat 0.6 m high; back slats leaning forwards; slats with no gaps); I say what a player would feel about each one, and I check my own bench for the same faults.", "uk": "Знайди неправильну лавку: тьютор описує три лавки (сидіння на висоті 0.6 м; планки спинки нахилені вперед; планки без проміжків); я кажу, що відчує гравець від кожної, і перевіряю свою лавку на ті самі помилки."}, "video": {"search": "blender park bench modeling beginner"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: From product sheet to bench: parts, slats and the backrest (Day 2, lesson 4 of 4).\nToday's build: SM_Bench: a park bench with metal side frames and timber slats (narrow wooden boards).\nEarlier today I already did: lesson 1 (Edit Mode: selecting points, edges and faces); lesson 2 (Loop cuts: new edges exactly where you need them); lesson 3 (Extrude and inset: pulling new shapes out of faces). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Turn a product sheet or photos into a parts list with sizes.\n2. Make repeated slats with Shift+D, typed moves and Shift+R (repeat the last action).\n3. Tilt a backrest with R, an axis and a typed angle, and check the shape from the side.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Spot the wrong bench: the tutor describes three benches (seat 0.6 m high; back slats leaning forwards; slats with no gaps); I say what a player would feel about each one, and I check my own bench for the same faults.\n4. Do-along on today's build (a practice block bench: one seat block with four legs pulled out with loop cuts and extrude (in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Search the web for a park bench product sheet (makers publish drawings with sizes), or measure two Commons photos as on Day 1. Write the parts list in bench_sizes.md: length, seat height, seat depth, back height and slat width.\n   - New file (File > New > General, delete the cube, check Units) and save it as bench_day2.blend in today's Work folder. Add a cube for one seat slat: Dimensions 1.8 x 0.08 x 0.04 m, Ctrl+A > Scale, then G Z 0.43 Enter: the slat's top is at 0.45 m.\n   - Press Shift+D, then Y, type 0.1 and press Enter: a second slat sits 10 cm behind the first, with a 2 cm gap. Press Shift+R: Blender repeats the last action and a third slat appears. Press Shift+R again for a fourth.\n   - Add one back slat: Dimensions 1.8 x 0.03 x 0.08 m, scale applied, at about 0.6 m high behind the seat. Type R X 12 Enter and look from the side (Numpad 3); if it leans forwards, press Ctrl+Z and try R X -12.\n   - Look at the side view beside your photo: does it already read as a bench? Save. This afternoon you add the frames and finish it.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "bench_day2.blend and practice_day2.blend (your working files)", "uk": "bench_day2.blend і practice_day2.blend (твої робочі файли)"}, {"en": "bench_sizes.md (the parts list with sizes, the triangle count and your sources)", "uk": "bench_sizes.md (список частин із розмірами, кількість трикутників і твої джерела)"}, {"en": "SM_Bench.glb", "uk": "SM_Bench.glb"}, {"en": "before_after_day2.png (your photo beside the same side view of your bench)", "uk": "before_after_day2.png (твоє фото поруч із тим самим видом лавки збоку)"}, {"en": "unreal_bench.png (the bench beside the mannequin and the bollard)", "uk": "unreal_bench.png (лавка поруч із манекеном і стовпчиком)"}, {"en": "clip_day2.mp4 (60 seconds)", "uk": "clip_day2.mp4 (60 секунд)"}, {"en": "summary.md", "uk": "summary.md"}], "goal": {"en": "By the end of today you have SM_Bench, a park bench with two side frames, seat slats and a leaning backrest at its real size, shaped with Edit Mode tools.", "uk": "До кінця дня в тебе є SM_Bench — паркова лавка з двома боковинами, планками сидіння і нахиленою спинкою в реальному розмірі, сформована інструментами Edit Mode."}, "uses": [{"en": "Day 1: adding shapes, Dimensions, typed moves, joining, the origin at the base and the SM_ name", "uk": "День 1: додавання форм, Dimensions, введені рухи, об'єднання, origin в основі та назва SM_"}, {"en": "Day 0: Edit Mode and vertex, edge and face select", "uk": "День 0: Edit Mode і виділення вершин, ребер і граней"}], "quiz": [{"q": {"en": "You want to pull four legs down from a seat block, but its bottom is one big face. What do you do first?", "uk": "Ти хочеш витягнути чотири ніжки вниз із бруска сидіння, але його низ — одна велика грань. Що зробити спершу?"}, "options": [{"en": "Extrude the whole bottom face", "uk": "Видавити всю нижню грань"}, {"en": "Add loop cuts so each leg gets its own small face", "uk": "Додати петлеві розрізи, щоб кожна ніжка мала свою маленьку грань"}, {"en": "Press Shade Auto Smooth", "uk": "Натиснути Shade Auto Smooth"}, {"en": "Scale the block", "uk": "Масштабувати брусок"}], "answer": 1, "explain": {"en": "Extrude works on the faces you select. Loop cuts make the small corner faces that become the legs.", "uk": "Extrude працює з гранями, які ти виділяєш. Петлеві розрізи створюють маленькі кутові грані, які стають ніжками."}}, {"q": {"en": "You select a face and press I, then type 0.03. What happens?", "uk": "Ти виділяєш грань, натискаєш I і вводиш 0.03. Що відбувається?"}, "options": [{"en": "The face moves 3 cm up", "uk": "Грань піднімається на 3 см"}, {"en": "The object gets 3 % bigger", "uk": "Об'єкт стає на 3 % більшим"}, {"en": "A 3 cm border appears inside the face", "uk": "Усередині грані з'являється рамка 3 см"}], "answer": 2, "explain": {"en": "Inset makes a smaller face inside the selected one, with a border of the width you type.", "uk": "Inset робить меншу грань усередині виділеної, з рамкою тієї ширини, яку ти вводиш."}}, {"q": {"en": "Your bench's back slats lean forwards over the seat. What is the quickest fix?", "uk": "Планки спинки твоєї лавки нахилені вперед над сидінням. Як найшвидше це виправити?"}, "options": [{"en": "Rotate them the other way with R X and the opposite angle", "uk": "Обернути їх в інший бік через R X і протилежний кут"}, {"en": "Delete the bench and start again", "uk": "Видалити лавку й почати знову"}, {"en": "Add more loop cuts", "uk": "Додати більше петлевих розрізів"}, {"en": "Apply the scale", "uk": "Застосувати масштаб"}], "answer": 0, "explain": {"en": "A minus sign flips the rotation. Typing R X -12 instead of R X 12 leans the slats back.", "uk": "Знак мінус змінює напрям обертання. Якщо ввести R X -12 замість R X 12, планки нахиляться назад."}}, {"q": {"en": "You drag a box over the top half of a cube in Edit Mode, but the back faces are not selected. Why?", "uk": "Ти обводиш рамкою верхню половину куба в Edit Mode, але задні грані не виділяються. Чому?"}, "options": [{"en": "Edit Mode cannot select back faces", "uk": "Edit Mode не вміє виділяти задні грані"}, {"en": "You are in Object Mode", "uk": "Ти в Object Mode"}, {"en": "X-ray is off, so only the faces you can see are selected", "uk": "X-ray вимкнено, тож виділяються лише ті грані, які ти бачиш"}], "answer": 2, "explain": {"en": "Without X-ray, a box selects only what faces you. Alt+Z turns X-ray on so the box reaches the back.", "uk": "Без X-ray рамка виділяє лише те, що повернуто до тебе. Alt+Z вмикає X-ray, і рамка дістає до задньої частини."}}, {"q": {"en": "A player says your bench 'feels like a children's bench'. Which size should you check first?", "uk": "Гравець каже, що твоя лавка «ніби дитяча». Який розмір перевірити спершу?"}, "options": [{"en": "The triangle count", "uk": "Кількість трикутників"}, {"en": "The seat height against about 0.45 m", "uk": "Висоту сидіння: чи близька вона до 0.45 м"}, {"en": "The slat colour", "uk": "Колір планок"}, {"en": "The file name", "uk": "Назву файлу"}], "answer": 1, "explain": {"en": "Everyone knows how high a seat is. A seat far below 0.45 m reads as a toy or a children's bench.", "uk": "Усі знають, яка висота сидіння. Сидіння, набагато нижче за 0.45 м, сприймається як іграшка або дитяча лавка."}}], "weekInfo": {"week": 1, "title": {"en": "Blender from zero: props at real size", "uk": "Blender з нуля: пропси в реальному розмірі"}, "goal": {"en": "By Friday you have a street-prop set (bollard, bench, lamp post and bin) that you modelled yourself from real photos, exported clean with collision and simple materials, standing at real scale in Unreal.", "uk": "До п'ятниці в тебе є набір вуличних пропсів (стовпчик, лавка, ліхтарний стовп і урна), змодельований власноруч за справжніми фото, чисто експортований із колізією та простими матеріалами, і він стоїть в Unreal у реальному масштабі."}, "skills": [{"en": "3D modelling in Blender from measured photos and drawings", "uk": "3D-моделювання в Blender за обмірними фото й кресленнями"}, {"en": "Hard-surface modelling with Edit Mode tools and modifiers (extrude, inset, loop cut, Array, Mirror, Bevel, Solidify)", "uk": "Hard-surface моделювання (тверді поверхні) інструментами Edit Mode і модифікаторами (extrude, inset, loop cut, Array, Mirror, Bevel, Solidify)"}, {"en": "Game-ready export: real-world scale, pivots, applied transforms, UCX collision and FBX", "uk": "Експорт, готовий до гри: реальний масштаб, півоти, застосовані трансформації, колізія UCX і FBX"}, {"en": "Measured elevation drawings in Krita", "uk": "Обмірні креслення (вид спереду й збоку) у Krita"}, {"en": "Props to a triangle budget with industry naming (SM_, M_, UCX_)", "uk": "Пропси в межах бюджету трикутників і з галузевими назвами (SM_, M_, UCX_)"}]}, "morning": {"sofar": {"en": "You have a working path from Blender to Unreal and your first real prop, SM_Bollard, measured from photos.", "uk": "У тебе вже є робочий шлях з Blender в Unreal і перший справжній пропс, SM_Bollard, виміряний за фотографіями."}, "today": {"en": "You learn Edit Mode, loop cuts, extrude and inset, and shape SM_Bench, a park bench with slats and a leaning backrest.", "uk": "Сьогодні ти опановуєш Edit Mode (режим редагування), loop cuts, extrude та inset і формуєш SM_Bench — паркову лаву з рейками та нахиленою спинкою."}, "cheer": {"en": "Edit Mode is a new way of thinking, and you have all day to get used to it; any part left unfinished simply waits for tomorrow.", "uk": "Edit Mode — це новий спосіб мислення, і на звикання в тебе цілий день; усе, що залишиться незавершеним, просто почекає до завтра."}, "quote": {"text": {"en": "One could describe Design as a plan for arranging elements to accomplish a particular purpose.", "uk": "Дизайн можна описати як план упорядкування елементів для досягнення певної мети."}, "author": {"en": "Charles Eames", "uk": "Чарльз Імз"}, "source": "https://en.wikiquote.org/wiki/Charles_Eames"}}, "hasAssets": false, "workPath": "Work\\Assignment\\Day-02-bench", "mapHref": "../../COURSE.html", "prevHref": "../Day-01-bollard/START-HERE.html", "nextHref": "../Day-03-railing-and-lamp-post/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Blender (and a quick look in Unreal Engine 5.8). I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me and don't write code. Keep me moving and make it feel like a game.\n\nToday I build on my own: SM_Bench: the park bench with side frames, slats and a backrest, on your own.\nIt's part of: SM_Bench: a park bench with metal side frames and timber slats (narrow wooden boards) (Your island's waterfront promenade (a wide path along the sea for walking, in district 1), facing the sea. On Friday it joins your street set in Course/Day05.).\n\nSpec:\n- Real sizes from a maker's product sheet or measured photos, written in bench_sizes.md: about 1.8 m long, seat height about 0.45 m, seat depth about 0.4 m, top of the back about 0.8 m.\n- Two side frames, each made from one cube with loop cuts and extrude: a front leg, a back leg and a back post that leans back.\n- At least four seat slats and three back slats, each about 0.08 m wide with gaps of about 2 cm; the back slats follow the lean of the back posts.\n- One object named SM_Bench, with its origin at the base centre on Z = 0 and all transforms applied.\n- 3,000 triangles or fewer.\n- In Unreal (Course/Day02), it stands on the floor beside the mannequin and the bollard, and the seat reaches about the mannequin's knee.\n\nMy checklist:\n1. Find a park bench product sheet (makers publish drawings with sizes) or two Commons photos you can measure as on Day 1. Write the parts list with sizes in bench_sizes.md and credit any photo in credits.md. Check: length, seat height, seat depth, back height and slat width are all written down. (from lesson 4)\n2. Open bench_day2.blend from Lesson 4 (Units: Metric, 1.0) and hide the slats while you build the frames (select them, press H). Side frame: add a cube with Dimensions 0.06 x 0.5 x 0.06 m, apply the scale, and move it to X -0.8 and Z 0.38 (G X -0.8, G Z 0.38). Check: in the side view (Numpad 3), a short bar floats about 0.4 m above the grid. (from day 1, lesson 3)\n3. Tab into Edit Mode and add 2 loop cuts across the bar's length (Ctrl+R on a long edge, scroll to 2, click, right-click). Select each new loop and set its Median Y in the sidebar (Global) to -0.19 and 0.19. Check: from below (Ctrl+Numpad 7), the bottom face shows a small square at each end. (from lesson 2)\n4. Select the two small end squares on the bottom (face select, Shift+click), press E, type 0.35 and press Enter. Check: two legs reach down to the grid line in the side view. (from lesson 3)\n5. Back post: select the small square on top of the back end (the end at +Y), press E, type 0.4 and press Enter, then type G Y 0.08 Enter to lean the new top back. Tab out. Check: from the side, the frame looks like an h with a leaning back. (from lesson 3)\n6. Second frame: Shift+D, then X 1.6 Enter. Check: two frames 1.6 m apart, both standing on the grid. (from day 1, lesson 1)\n7. Seat slats: press Alt+H to show the four slats from Lesson 4, select them and type G Y -0.2 Enter, so the first one sits at Y -0.2. (Skipped the lesson? Make them now: a cube 1.8 x 0.08 x 0.04 m, scale applied, at Z 0.43 and Y -0.2, then Shift+D, Y 0.1 Enter, and Shift+R twice.) Check: four slats lie on the frames with even 2 cm gaps, their tops at 0.45 m. (from lesson 4)\n8. Back slats: start from your Lesson 4 back slat (or a new cube 1.8 x 0.03 x 0.08 m), set it against the front of the back posts at about 0.55 m high; lean it with R X and a typed angle (try 12, or -12 if it leans forwards), then copy it up twice with Shift+D and small G Z and G Y moves. Check: from the side, three back slats follow the lean of the posts with no slat floating in the air. (from lesson 4)\n9. Look at the side view beside your photo and fix any gap between slats and frames with small typed moves. Check: every slat touches a frame, and the outline matches your photo. (from day 1, lesson 3)\n10. Join all parts (A, then Ctrl+J) and rename the object SM_Bench. Check: the Outliner shows one object with that exact name. (from day 1, lesson 4)\n11. Origin to the base centre on Z = 0 (Shift+S > Cursor to World Origin, then Object > Set Origin > Origin to 3D Cursor) and Ctrl+A > All Transforms. Check: Location 0, 0, 0, Rotation 0, Scale 1, and Dimensions about 1.8 x 0.55 x 0.8 m (or your own sizes). (from day 1, lesson 4)\n12. Read Triangles in Statistics and write it in bench_sizes.md. Check: 3,000 triangles or fewer. (from day 1, lesson 4)\n13. Export SM_Bench.glb (selected only), import it into Course/Day02 in IslandCourse, and place it beside the mannequin and your bollard with End. Take unreal_bench.png. Check: the seat is about at the mannequin's knee. (from day 0, lesson 3)\n14. Captures. First before_after_day2.png: open your photo (double-click it), press Win+Left so it fills the left half of the screen, click Blender and press Win+Right, show the side view of your bench, then press Win+Shift+S and capture the whole screen. Then clip_day2.mp4, about 60 seconds: orbit the bench in Blender, then walk the mannequin past the bench and the bollard in Unreal. Win+Alt+R records only one program window, so for a clip that moves between Blender and Unreal open Snipping Tool, click Record and drag a box over the whole screen. Rename the clip clip_day2.mp4. Check: both files are in today's Work folder. (from day 0, lesson 1)\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Andrii\nDay 2: The park bench: Edit Mode, loop cuts, extrude and inset. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 if(D.weekInfo){const w=D.weekInfo;h+='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}
 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p><div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+list(D.handin,'ul','ticks')+'<p class="path">'+ic('folder')+'<span>'+u('shipTo')+' <code>'+esc(D.workPath)+'</code></span></p>'+(D.lessons.length?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<p class="muted">'+u('report')+'</p><div class="row"><button class="btn s" onclick="cp(D.reportPrompt)">'+ic('copy')+u('copyR')+'</button></div></section>';
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();
</script>

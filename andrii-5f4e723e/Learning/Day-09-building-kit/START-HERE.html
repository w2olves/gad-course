<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 9</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

 м заввишки й 0,2 м завтовшки, лінія сітки проходить посередині стіни. Зовнішній бік дивиться в -Y у Blender (+Y в Unreal). Origin унизу центральної лінії стіни на її початку (X = 0, Y = 0, Z = 0)."}, {"en": "SM_Wall_2m (plain); SM_Wall_Window (a 1.0 x 1.2 m window with its sill at 0.9 m, a timber frame and a glass panel); SM_Wall_Door (a 1.0 x 2.1 m door with a frame and a door leaf standing open).", "uk": "SM_Wall_2m (проста); SM_Wall_Window (вікно 1,0 × 1,2 м із підвіконням на висоті 0,9 м, дерев'яною рамою й скляною панеллю); SM_Wall_Door (двері 1,0 × 2,1 м із коробкою та відчиненим дверним полотном)."}, {"en": "SM_Wall_Corner: a 0.24 x 0.24 x 3 m corner post (a pilaster) centred on the grid point, covering the join where two walls meet.", "uk": "SM_Wall_Corner: кутова стійка (пілястра) 0,24 × 0,24 × 3 м, центром на точці сітки. Вона закриває стик, де сходяться дві стіни."}, {"en": "Roof pieces for a 4 m wide house with a 30-degree pitch (slope): SM_Roof_2m (a panel 2 m along the ridge, its pivot on the ridge line) and SM_Roof_Gable_4m (the triangle of wall under each end of the roof). The roof goes on in Friday's Boss.", "uk": "Деталі даху для будинку завширшки 4 м з ухилом 30 градусів. SM_Roof_2m — панель 2 м уздовж гребеня, з origin на лінії гребеня. SM_Roof_Gable_4m — трикутник стіни під кожним кінцем даху. Дах ставиш у п'ятницю, у День боса."}, {"en": "Openings cut with the Boolean modifier; UCX boxes leave the window and door open; plain materials M_Plaster, M_Timber, M_Glass (dark, Roughness 0.05) and M_RoofTile.", "uk": "Прорізи вирізано модифікатором Boolean; блоки UCX лишають вікно й двері відкритими. Прості матеріали M_Plaster, M_Timber, M_Glass (темний, Roughness 0.05) і M_RoofTile."}, {"en": "Every piece exported from the world origin, under 2,000 triangles; Nanite on for every piece in Unreal (5.8 turns it on at import).", "uk": "Кожну деталь експортовано з центру світу, менше 2 000 трикутників. В Unreal Nanite увімкнено для кожної деталі (5.8 вмикає його під час імпорту)."}, {"en": "In Unreal (Course/Day09, level L_Day09): the walls of a 4 x 6 m house with a door, at least three windows and four corner posts, no gaps, and the door leaf and the deep side of each window frame inside.", "uk": "В Unreal (Course/Day09, рівень L_Day09): стіни будинку 4 × 6 м із дверима, щонайменше трьома вікнами й чотирма кутовими стійками, без щілин. Дверне полотно й глибокий бік кожної віконної рами — усередині."}], "piece1": "SM_Wall_2m, SM_Wall_Window and SM_Roof_2m (in the lessons)", "piece2": {"en": "SM_Wall_Door, SM_Wall_Corner and SM_Roof_Gable_4m, then the walls of the test house, on your own", "uk": "SM_Wall_Door, SM_Wall_Corner і SM_Roof_Gable_4m, а потім стіни тестового будинку, самостійно"}, "steps": [{"text": {"en": "Check: the files from today's lessons are in the day work folder (buildkit_day9.blend with SM_Wall_2m, SM_Wall_Window, SM_Roof_2m and the gable, and their FBX files), and Unreal has the level L_Day09. Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it.", "uk": "Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: buildkit_day9.blend із SM_Wall_2m, SM_Wall_Window, SM_Roof_2m і фронтоном та їхні файли FBX, а в Unreal є рівень L_Day09. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде."}, "lesson": 1}, {"text": {"en": "SM_Wall_Door: copy SM_Wall_2m in place (Shift+D, right-click) and rename it. Cut the door with a Boolean (Difference) using a cutter 1.0 x 0.5 x 2.2 m at X 1, Z 1.0, then apply it and delete the cutter. Check: a clean doorway, open at the bottom, 1 m wide and 2.1 m tall.", "uk": "SM_Wall_Door: скопіюй SM_Wall_2m на місці (Shift+D, клацання правою кнопкою) і перейменуй копію. Виріж двері модифікатором Boolean (Difference) з різаком 1.0 × 0.5 × 2.2 м на X 1, Z 1.0. Застосуй модифікатор і видали різак. Перевірка: чистий дверний проріз, відкритий знизу, 1 м завширшки й 2,1 м заввишки."}, "lesson": 2}, {"text": {"en": "Door frame: two jambs 0.06 x 0.12 x 2.1 m at X 0.53 and X 1.47, Z 1.05, and a head 0.88 x 0.12 x 0.06 m at X 1, Z 2.07, all in M_Timber. Check: from the front, the frame fills the edges of the opening.", "uk": "Дверна коробка: два бічні бруски 0.06 × 0.12 × 2.1 м на X 0.53 і X 1.47, Z 1.05 і верхній брусок 0.88 × 0.12 × 0.06 м на X 1, Z 2.07, усі в M_Timber. Перевірка: спереду коробка заповнює краї прорізу."}, "lesson": "D1.3"}, {"text": {"en": "Door leaf, standing open at a right angle on the inside (+Y), so the mannequin can walk through: 0.05 x 0.88 x 2.04 m at X 0.585, Y 0.54, Z 1.02, in M_Timber. Join the frame and the leaf into the wall. Check: from above, the open leaf stands beside the left jamb.", "uk": "Дверне полотно, відчинене під прямим кутом усередину (+Y), щоб манекен міг пройти: 0.05 × 0.88 × 2.04 м на X 0.585, Y 0.54, Z 1.02, у M_Timber. Приєднай коробку й полотно до стіни. Перевірка: згори відчинене полотно стоїть біля лівого бічного бруска."}, "lesson": "D1.3"}, {"text": {"en": "Collision for the openings: three UCX boxes on SM_Wall_Door (left, right, above the door) and four on SM_Wall_Window (left, right, below the sill, above the window). Press Ctrl+S. Check: in X-ray (Alt+Z, or the header button), the openings have no box in them.", "uk": "Колізія для прорізів: три блоки UCX на SM_Wall_Door (ліворуч, праворуч і над дверима) і чотири на SM_Wall_Window (ліворуч, праворуч, під підвіконням і над вікном). Натисни Ctrl+S. Перевірка: у режимі X-ray (Alt+Z або кнопка в заголовку) у прорізах немає блоків."}, "lesson": "D4.3"}, {"text": {"en": "SM_Wall_Corner: a cube 0.24 x 0.24 x 3 m, scale applied, moved up 1.5 m; origin at its bottom centre on the world origin; M_Plaster; one UCX box. Check: from above, the post is centred on the world origin and 2 cm wider than the wall on each side.", "uk": "SM_Wall_Corner: куб 0.24 × 0.24 × 3 м, масштаб застосовано, піднятий на 1,5 м. Origin унизу по центру, у центрі світу. Матеріал M_Plaster, один блок UCX. Перевірка: згори стійка стоїть центром у центрі світу й на 2 см ширша за стіну з кожного боку."}, "lesson": 1}, {"text": {"en": "SM_Roof_Gable_4m: finish the lesson's triangle (top points welded with M > By Distance). Put its origin on the world origin, give it M_Plaster and one UCX box (a copy of the gable is a fine convex shape). Check: Location 0, 0, 0, and the apex is 1.15 m above the bottom at X 2.", "uk": "SM_Roof_Gable_4m: заверши трикутник з уроку (верхні точки зварено: M > By Distance). Постав його origin у центр світу, дай M_Plaster і один блок UCX — копія фронтона цілком годиться як опукла форма. Перевірка: Location 0, 0, 0, а вершина трикутника на 1,15 м вище низу, на X 2."}, "lesson": 3}, {"text": {"en": "Check every building piece: Location 0, 0, 0, the origin on its pivot, under 2,000 triangles, the name following the pattern. Write the check in kit_rules.md. Check: six pieces, all yes.", "uk": "Перевір кожну деталь для будівель: Location 0, 0, 0, origin стоїть за правилом, менше 2 000 трикутників, назва за шаблоном. Запиши цю перевірку в kit_rules.md. Перевірка: шість деталей, усюди «так»."}, "lesson": "D8.1"}, {"text": {"en": "Export SM_Wall_Door, SM_Wall_Corner and SM_Roof_Gable_4m as FBX, one at a time, each with its UCX boxes. Then export SM_Wall_Window again, now with its four UCX boxes, over its FBX. Press Ctrl+S. Check: each file is 10 KB or more.", "uk": "Експортуй SM_Wall_Door, SM_Wall_Corner і SM_Roof_Gable_4m у FBX по одному, кожен із його блоками UCX. Потім ще раз експортуй SM_Wall_Window — тепер із чотирма блоками UCX — поверх її FBX. Натисни Ctrl+S. Перевірка: кожен файл має 10 КБ або більше."}, "lesson": "D4.4"}, {"text": {"en": "Import the three into Course/Day09 with your checklist. In Unreal, right-click SM_Wall_Window > Reimport. Check: each shows a picture, and Nanite Visualization > Overview shows all six pieces in colour (Unreal 5.8 turns Nanite on at import).", "uk": "Імпортуй ці три в Course/Day09 за своїм чек-листом. В Unreal клацни правою кнопкою SM_Wall_Window > Reimport. Перевірка: у кожного є картинка, а в Nanite Visualization > Overview усі шість деталей кольорові (Unreal 5.8 вмикає Nanite під час імпорту)."}, "lesson": "D8.3"}, {"text": {"en": "Walls in L_Day09, in cm; the house runs from Y 0 to -600, because Unreal mirrors Blender's Y. Front, Rotation Z 0: SM_Wall_Door at 0, 0, 0, SM_Wall_Window at 200, 0, 0. Left side, Rotation Z 90, X 0: SM_Wall_2m at Y -600, SM_Wall_Window at Y -400, SM_Wall_2m at Y -200. Check: an L of walls.", "uk": "Стіни в L_Day09, у сантиметрах. Будинок іде від Y 0 до -600, бо Unreal віддзеркалює вісь Y з Blender. Перед, Rotation Z 0: SM_Wall_Door на 0, 0, 0, SM_Wall_Window на 200, 0, 0. Лівий бік, Rotation Z 90, X 0: SM_Wall_2m на Y -600, SM_Wall_Window на Y -400, SM_Wall_2m на Y -200. Перевірка: стіни утворюють літеру L."}, "lesson": 4}, {"text": {"en": "Right side, Rotation Z -90, X 400: SM_Wall_2m at Y 0, SM_Wall_Window at Y -200, SM_Wall_2m at Y -400. Back, Rotation Z 180, Y -600: SM_Wall_2m at X 400 and X 200. SM_Wall_Corner at (0, 0), (400, 0), (0, -600) and (400, -600). Press Ctrl+S. Check: a closed box of walls with a post at each corner.", "uk": "Правий бік, Rotation Z -90, X 400: SM_Wall_2m на Y 0, SM_Wall_Window на Y -200, SM_Wall_2m на Y -400. Зад, Rotation Z 180, Y -600: SM_Wall_2m на X 400 і X 200. SM_Wall_Corner на (0, 0), (400, 0), (0, -600) і (400, -600). Натисни Ctrl+S. Перевірка: замкнена коробка стін зі стійкою в кожному куті."}, "lesson": 4}, {"text": {"en": "Fly round at 2 m from every join, then take house_front.png. Check: no gaps or flicker, and the open door leaf and the deep side of every window frame are inside. One outside? That wall faces the wrong way: add 180 to its Rotation Z and snap it back to its corner.", "uk": "Облети будинок на відстані 2 м від кожного стику, потім зроби скриншот house_front.png. Перевірка: немає щілин чи мерехтіння, а відчинене дверне полотно й глибокий бік кожної віконної рами — усередині. Щось виходить назовні? Ця стіна стоїть задом наперед: додай 180 до її Rotation Z і знову прив'яжи до її кута."}, "lesson": "D7.4"}, {"text": {"en": "Save check: close Blender and reopen buildkit_day9.blend. Report and hand-in: click Copy the day report at the bottom of the page, paste it into a new chat and answer. Open summary.md in Notepad, press Ctrl+End, paste the answer and press Ctrl+S. Then drag the files on the Hand in list into your hand-in folder. Check: all six pieces are in the Outliner, and every name shows in the folder, each with a size.", "uk": "Перевір збереження: закрий Blender і знову відкрий buildkit_day9.blend. Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: усі шість деталей є в Outliner, а кожна назва зі списку є в папці, у кожної є розмір."}, "lesson": "D0.1"}]}, "lessons": [{"title": {"en": "A wall kit: storey height, thickness and the wall rule", "uk": "Набір стін: висота поверху, товщина і правило стін"}, "minutes": 40, "goals": [{"en": "Explain a storey (one floor of a building, here 3 m) and why every wall shares one height and thickness.", "uk": "Пояснювати, що таке поверх (тут 3 м) і чому всі стіни мають однакову висоту й товщину."}, {"en": "Model SM_Wall_2m to the wall rule, with its pivot on the grid line at its start.", "uk": "Моделювати SM_Wall_2m за правилом стін, з origin на лінії сітки на її початку."}, {"en": "Plan how walls meet at corners: a corner post slightly wider than the wall hides the join.", "uk": "Планувати, як стіни сходяться в кутах: кутова стійка, трохи ширша за стіну, ховає стик."}], "doalong": [{"en": "Find two photos of present-day small harbour houses on Commons (plaster walls, timber windows, tiled roofs); save them in refs and credit them in credits.md.", "uk": "Знайди на Commons два фото сучасних невеликих будинків біля гавані: тиньковані стіни, дерев'яні вікна, черепичні дахи. Збережи їх у refs і додай рядки авторства в credits.md."}, {"en": "New file buildkit_day9.blend, snapping on. Add a cube, set Dimensions 2 x 0.2 x 3 m and apply the scale, then type G X 1 and G Z 1.5. The wall runs from X 0 to 2, stands on Z 0, and sits across the Y = 0 line (from -0.1 to 0.1).", "uk": "Створи новий файл buildkit_day9.blend і ввімкни прив'язку. Додай куб, задай Dimensions X 2, Y 0.2, Z 3 і застосуй масштаб. Потім введи G X 1 і G Z 1.5. Стіна йде від X 0 до 2, стоїть на Z 0 і перетинає лінію Y = 0 (від -0,1 до 0,1)."}, {"en": "Shift+S > Cursor to World Origin, then Object > Set Origin > Origin to 3D Cursor: the pivot is at the bottom of the wall's centre line at its start. Name it SM_Wall_2m.", "uk": "Shift+S > Cursor to World Origin, потім Object > Set Origin > Origin to 3D Cursor. Тепер origin унизу центральної лінії стіни на її початку. Назви стіну SM_Wall_2m."}, {"en": "Plan the corner: when a wall along X meets a wall along Y on the same grid point, their ends overlap and leave a small notch on the outside. Write in kit_rules.md: SM_Wall_Corner is a 0.24 x 0.24 m post centred on the grid point, 2 cm wider than the wall on each side, so it covers the join.", "uk": "Сплануй кут. Коли стіна вздовж X зустрічається зі стіною вздовж Y в одній точці сітки, їхні кінці накладаються й лишають ззовні маленьку виїмку. Запиши в kit_rules.md: SM_Wall_Corner — стійка 0,24 × 0,24 м центром на точці сітки, на 2 см ширша за стіну з кожного боку. Так вона закриває стик."}, {"en": "Material: M_Plaster, a warm off-white or a colour from your photos, Roughness 0.9, Metallic 0. Add one UCX box the size of the wall, named UCX_SM_Wall_2m_00, with the wall's origin.", "uk": "Матеріал M_Plaster: теплий молочно-білий або колір із твоїх фото, Roughness 0.9, Metallic 0. Додай один блок UCX розміром зі стіну з назвою UCX_SM_Wall_2m_00 і з origin стіни."}], "play": {"en": "House count: the tutor describes three houses (4 x 6 m with one door and three windows; 4 x 4 m with two doors; 4 x 8 m with five windows); I count the wall pieces, corner posts and roof pieces each one needs.", "uk": "Порахуй будинки: тьютор описує три будинки (4 × 6 м з одними дверима й трьома вікнами; 4 × 4 м із двома дверима; 4 × 8 м із п'ятьма вікнами). Я рахую, скільки кожному потрібно деталей стін, кутових стійок і деталей даху."}, "video": {"search": "modular building kit walls on a grid blender beginner"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Набір стін: висота поверху, товщина і правило стін (Day 9, lesson 1 of 4). Today's build: Твій набір для будівель: стіни, прорізи, кутова стійка й деталі даху для невеликих будинків біля гавані.\nWhat I already know: День 8: шаблон назв, рішення щодо Nanite і прив'язка до вершин у наборі; День 7: сітка, правило origin, експорт із центру світу і з'єднання в Unreal; День 4: блоки UCX і експорт FBX; День 3: Solidify і Bevel; День 2: Inset.\n\nBy the end of this lesson I can:\n1. Пояснювати, що таке поверх (тут 3 м) і чому всі стіни мають однакову висоту й товщину.\n2. Моделювати SM_Wall_2m за правилом стін, з origin на лінії сітки на її початку.\n3. Планувати, як стіни сходяться в кутах: кутова стійка, трохи ширша за стіну, ховає стик.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: У твоєму наборі для гавані вже шість деталей, від краю причалу до сходів, і для кожної записано рішення: Nanite чи LOD. Today: Сьогодні ти робиш невеликий набір для будинків — три стінові деталі, кутову стійку, панель даху й фронтон — і без щілин стикуєш в Unreal стіни будинку 4 × 6 м. One encouraging line: Будинок — це стіни й отвори на сітці, а всі потрібні інструменти ти вже знаєш; дах з'явиться в п'ятницю, у День боса.); 2 lines on why today matters and where it comes back, in plain words (from this: Більшість будинків у портовому містечку — прості коробки з дверима, вікнами й двосхилим дахом. Набір стін на сітці 2 м із поверхом 3 м збирає будь-який із них. Так студії заповнюють цілі містечка, не моделюючи кожен будинок вручну. It comes back: У п'ятницю цей будинок стане LI_HarbourHouse, у День 42 — рядом крамниць району 1, а в День 48 — будиночками району 2.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-09-building-kit exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (SM_Wall_2m, SM_Wall_Window і SM_Roof_2m (на уроках)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact click  decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}], "handin": [{"en": "summary.md", "uk": "summary.md (звіт дня)"}, {"en": "buildkit_day9.blend: your building kit, which gets its ridge on Friday (→ Day 10)", "uk": "buildkit_day9.blend (твій набір для будівель, який у п'ятницю отримає гребінь) (→ День 10)"}, {"en": "house_front.png: the walls with no gaps, the door leaf inside (proof)", "uk": "house_front.png (стіни без щілин, дверне полотно всередині) (доказ)"}], "goal": {"en": "By the end of today you have a building kit on your grid (three wall pieces, a corner post, a roof panel and a gable) and the walls of a 4 x 6 m house snapped together in Unreal.", "uk": "До кінця дня в тебе є набір для будівель на твоїй сітці: три деталі стін, кутова стійка, панель даху й фронтон. В Unreal з них зібрано стіни будинку 4 × 6 м."}, "uses": [{"en": "Day 8: the naming pattern, Nanite decisions and vertex snapping to a kit", "uk": "День 8: шаблон назв, рішення щодо Nanite і прив'язка до вершин у наборі"}, {"en": "Day 7: the grid, the pivot rule, exporting from the world origin and snapping in Unreal", "uk": "День 7: сітка, правило origin, експорт із центру світу і з'єднання в Unreal"}, {"en": "Day 4: UCX boxes and the FBX export", "uk": "День 4: блоки UCX і експорт FBX"}, {"en": "Day 3: Solidify and Bevel", "uk": "День 3: Solidify і Bevel"}, {"en": "Day 2: inset", "uk": "День 2: Inset"}], "quiz": [{"q": {"en": "For a 4 m wide house with a 30-degree roof, about how high is the ridge above the wall tops?", "uk": "Наскільки приблизно гребінь вищий за верх стін у будинку завширшки 4 м із дахом під 30 градусів?"}, "options": [{"en": "0.5 m", "uk": "0,5 м"}, {"en": "1.15 m", "uk": "1,15 м"}, {"en": "2 m", "uk": "2 м"}, {"en": "4 m", "uk": "4 м"}], "answer": 1, "explain": {"en": "Half the width (2 m) times about 0.58 (the slope of 30 degrees) is about 1.15 m.", "uk": "Половина ширини (2 м), помножена приблизно на 0,58 (схил під 30 градусів), дає близько 1,15 м."}}, {"q": {"en": "Your door wall's collision blocks the doorway when you walk the mannequin into it. What do you fix?", "uk": "Ти ведеш манекена в двері, а колізія стіни з дверима перекриває проріз. Що виправити?"}, "options": [{"en": "Use three UCX boxes around the opening instead of one box over the whole wall", "uk": "Поставити три блоки UCX навколо прорізу замість одного блока на всю стіну"}, {"en": "Set Fallback Collision Type to Box when you import", "uk": "Під час імпорту поставити Fallback Collision Type на Box"}, {"en": "Remove the door frame", "uk": "Прибрати дверну коробку"}], "answer": 0, "explain": {"en": "Collision follows your UCX boxes. Boxes left, right and above the opening keep the doorway walkable.", "uk": "Колізія повторює твої блоки UCX. Блоки ліворуч, праворуч і над прорізом лишають двері прохідними."}}, {"q": {"en": "What does the Boolean modifier with Difference do?", "uk": "Що робить модифікатор Boolean у режимі Difference?"}, "options": [{"en": "It joins two objects into one", "uk": "Об'єднує два об'єкти в один"}, {"en": "It mirrors an object", "uk": "Віддзеркалює об'єкт"}, {"en": "It cuts the cutter's shape out of the object", "uk": "Вирізає форму різака з об'єкта"}], "answer": 2, "explain": {"en": "Difference subtracts the cutter. Apply it, then delete the cutter.", "uk": "Difference віднімає різак. Застосуй модифікатор, а потім видали різак."}}, {"q": {"en": "Two walls meet at a corner and leave a small notch on the outside. What does your kit use to hide it?", "uk": "Дві стіни сходяться в куті й лишають ззовні маленьку виїмку. Чим твій набір її ховає?"}, "options": [{"en": "A thicker wall", "uk": "Товстішою стіною"}, {"en": "A corner post 2 cm wider than the wall on each side", "uk": "Кутовою стійкою, на 2 см ширшою за стіну з кожного боку"}, {"en": "A decal", "uk": "Декаллю"}], "answer": 1, "explain": {"en": "SM_Wall_Corner covers the join and its faces stand slightly proud, so nothing flickers.", "uk": "SM_Wall_Corner закриває стик, а її грані трохи виступають, тож нічого не мерехтить."}}, {"q": {"en": "You turn a wall 180 degrees in Unreal and it now sits outside the house. Why?", "uk": "Ти повертаєш стіну на 180 градусів в Unreal, і тепер вона стоїть поза будинком. Чому?"}, "options": [{"en": "Its pivot is at its start, so after the turn it runs the other way from the same point", "uk": "Її origin на початку стіни, тож після повороту вона йде від тієї самої точки в інший бік"}, {"en": "Nanite moved it", "uk": "Її перемістив Nanite"}, {"en": "The wall is too thick", "uk": "Стіна надто товста"}], "answer": 0, "explain": {"en": "A piece turns around its pivot. After 180 degrees it runs in the opposite direction, so move it 200 cm or snap it to the right corner.", "uk": "Деталь обертається навколо свого origin. Після повороту на 180 градусів вона йде в протилежному напрямку, тож посунь її на 200 см або прив'яжи до потрібного кута."}}], "weekInfo": {"week": 2, "title": {"en": "Modular kits", "uk": "Модульні набори"}, "goal": {"en": "By Friday you have your own harbour and building kit on a metric grid, and L_KitTest: a quay, a pier and a harbour house built from it in Unreal, with the house saved as a Level Instance.", "uk": "До п'ятниці в тебе є власний набір для гавані й будівель на метричній сітці. Із нього в Unreal зібрано рівень L_KitTest: причал, пірс і будинок біля гавані, а будинок збережено як Level Instance."}, "skills": [{"en": "Modular kit design on a metric grid with consistent pivots", "uk": "Дизайн модульного набору на метричній сітці з однаковими origin"}, {"en": "Unreal Engine 5 level assembly: import pipeline, exact placement and snapping", "uk": "Збирання рівня в Unreal Engine 5: імпорт, точне розміщення та прив'язка (snapping)"}, {"en": "Nanite versus LOD decisions for real-time performance", "uk": "Вибір між Nanite і LOD заради продуктивності в реальному часі"}, {"en": "Level Instances for reusable building sets", "uk": "Level Instance для будівель, які ставлять багато разів"}, {"en": "Content Browser organisation and industry naming conventions (SM_, M_, MI_, T_, L_)", "uk": "Порядок у Content Browser і галузеві правила назв (SM_, M_, MI_, T_, L_)"}]}, "morning": {"sofar": {"en": "Your harbour kit has six pieces, from the quay edge to the steps, each with a written Nanite or LOD decision.", "uk": "У твоєму наборі для гавані вже шість деталей, від краю причалу до сходів, і для кожної записано рішення: Nanite чи LOD."}, "today": {"en": "You make a small building kit (three wall pieces, a corner post, a roof panel and a gable) and snap the walls of a 4 x 6 m house together in Unreal, with no gaps.", "uk": "Сьогодні ти робиш невеликий набір для будинків — три стінові деталі, кутову стійку, панель даху й фронтон — і без щілин стикуєш в Unreal стіни будинку 4 × 6 м."}, "cheer": {"en": "A house is walls and openings on a grid, and you already know the tools; the roof goes on at Friday's Boss.", "uk": "Будинок — це стіни й отвори на сітці, а всі потрібні інструменти ти вже знаєш; дах з'явиться в п'ятницю, у День боса."}, "quote": {"text": {"en": "Form ever follows function, and this is the law.", "uk": "Форма завжди слідує за функцією, і це закон."}, "author": {"en": "Louis Sullivan", "uk": "Луїс Салліван"}, "source": "https://en.wikiquote.org/wiki/Louis_Sullivan"}}, "hasAssets": false, "workPath": "Work\\Assignment\\Day-09-building-kit", "mapHref": "../../COURSE.html", "prevHref": "../Day-08-kit-railing-steps-corner/START-HERE.html", "nextHref": "../Day-10-boss-kit-test/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Blender and Unreal Engine 5.8. I am a beginner on Day 9. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me and don't write code.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: SM_Wall_Door, SM_Wall_Corner і SM_Roof_Gable_4m, а потім стіни тестового будинку, самостійно.\nIt's part of: Твій набір для будівель: стіни, прорізи, кутова стійка й деталі даху для невеликих будинків біля гавані (Набережна твого острова (район 1), а згодом і район 2: портові контори, крамниці й будинки. Сьогодні — тестовий будинок у Course/Day09.).\nWhy it matters: Більшість будинків у портовому містечку — прості коробки з дверима, вікнами й двосхилим дахом. Набір стін на сітці 2 м із поверхом 3 м збирає будь-який із них. Так студії заповнюють цілі містечка, не моделюючи кожен будинок вручну. It comes back: У п'ятницю цей будинок стане LI_HarbourHouse, у День 42 — рядом крамниць району 1, а в День 48 — будиночками району 2.\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-09-building-kit (on the drive I chose on Day 0).\nWhat I already know: День 8: шаблон назв, рішення щодо Nanite і прив'язка до вершин у наборі; День 7: сітка, правило origin, експорт із центру світу і з'єднання в Unreal; День 4: блоки UCX і експорт FBX; День 3: Solidify і Bevel; День 2: Inset; today's lessons: Набір стін: висота поверху, товщина і правило стін; Прорізи: модифікатор Boolean для вікон і дверей; Деталі даху: ухил, панель, гребінь і фронтон; Тестуємо набір для будівель в Unreal. Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- Правило стін (у kit_rules.md): стіни 2 м завдовжки, 3 м заввишки й 0,2 м завтовшки, лінія сітки проходить посередині стіни. Зовнішній бік дивиться в -Y у Blender (+Y в Unreal). Origin унизу центральної лінії стіни на її початку (X = 0, Y = 0, Z = 0).\n- SM_Wall_2m (проста); SM_Wall_Window (вікно 1,0 × 1,2 м із підвіконням на висоті 0,9 м, дерев'яною рамою й скляною панеллю); SM_Wall_Door (двері 1,0 × 2,1 м із коробкою та відчиненим дверним полотном).\n- SM_Wall_Corner: кутова стійка (пілястра) 0,24 × 0,24 × 3 м, центром на точці сітки. Вона закриває стик, де сходяться дві стіни.\n- Деталі даху для будинку завширшки 4 м з ухилом 30 градусів. SM_Roof_2m — панель 2 м уздовж гребеня, з origin на лінії гребеня. SM_Roof_Gable_4m — трикутник стіни під кожним кінцем даху. Дах ставиш у п'ятницю, у День боса.\n- Прорізи вирізано модифікатором Boolean; блоки UCX лишають вікно й двері відкритими. Прості матеріали M_Plaster, M_Timber, M_Glass (темний, Roughness 0.05) і M_RoofTile.\n- Кожну деталь експортовано з центру світу, менше 2 000 трикутників. В Unreal Nanite увімкнено для кожної деталі (5.8 вмикає його під час імпорту).\n- В Unreal (Course/Day09, рівень L_Day09): стіни будинку 4 × 6 м із дверима, щонайменше трьома вікнами й чотирма кутовими стійками, без щілин. Дверне полотно й глибокий бік кожної віконної рами — усередині.\n\nMy checklist (the same numbers show on my course page):\n1. Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: buildkit_day9.blend із SM_Wall_2m, SM_Wall_Window, SM_Roof_2m і фронтоном та їхні файли FBX, а в Unreal є рівень L_Day09. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. (from lesson 1)\n2. SM_Wall_Door: скопіюй SM_Wall_2m на місці (Shift+D, клацання правою кнопкою) і перейменуй копію. Виріж двері модифікатором Boolean (Difference) з різаком 1.0 × 0.5 × 2.2 м на X 1, Z 1.0. Застосуй модифікатор і видали різак. Перевірка: чистий дверний проріз, відкритий знизу, 1 м завширшки й 2,1 м заввишки. (from lesson 2)\n3. Дверна коробка: два бічні бруски 0.06 × 0.12 × 2.1 м на X 0.53 і X 1.47, Z 1.05 і верхній брусок 0.88 × 0.12 × 0.06 м на X 1, Z 2.07, усі в M_Timber. Перевірка: спереду коробка заповнює краї прорізу. (from day 1, lesson 3)\n4. Дверне полотно, відчинене під прямим кутом усередину (+Y), щоб манекен міг пройти: 0.05 × 0.88 × 2.04 м на X 0.585, Y 0.54, Z 1.02, у M_Timber. Приєднай коробку й полотно до стіни. Перевірка: згори відчинене полотно стоїть біля лівого бічного бруска. (from day 1, lesson 3)\n5. Колізія для прорізів: три блоки UCX на SM_Wall_Door (ліворуч, праворуч і над дверима) і чотири на SM_Wall_Window (ліворуч, праворуч, під підвіконням і над вікном). Натисни Ctrl+S. Перевірка: у режимі X-ray (Alt+Z або кнопка в заголовку) у прорізах немає блоків. (from day 4, lesson 3)\n6. SM_Wall_Corner: куб 0.24 × 0.24 × 3 м, масштаб застосовано, піднятий на 1,5 м. Origin унизу по центру, у центрі світу. Матеріал M_Plaster, один блок UCX. Перевірка: згори стійка стоїть центром у центрі світу й на 2 см ширша за стіну з кожного боку. (from lesson 1)\n7. SM_Roof_Gable_4m: заверши трикутник з уроку (верхні точки зварено: M > By Distance). Постав його origin у центр світу, дай M_Plaster і один блок UCX — копія фронтона цілком годиться як опукла форма. Перевірка: Location 0, 0, 0, а вершина трикутника на 1,15 м вище низу, на X 2. (from lesson 3)\n8. Перевір кожну деталь для будівель: Location 0, 0, 0, origin стоїть за правилом, менше 2 000 трикутників, назва за шаблоном. Запиши цю перевірку в kit_rules.md. Перевірка: шість деталей, усюди «так». (from day 8, lesson 1)\n9. Експортуй SM_Wall_Door, SM_Wall_Corner і SM_Roof_Gable_4m у FBX по одному, кожен із його блоками UCX. Потім ще раз експортуй SM_Wall_Window — тепер із чотирма блоками UCX — поверх її FBX. Натисни Ctrl+S. Перевірка: кожен файл має 10 КБ або більше. (from day 4, lesson 4)\n10. Імпортуй ці три в Course/Day09 за своїм чек-листом. В Unreal клацни правою кнопкою SM_Wall_Window > Reimport. Перевірка: у кожного є картинка, а в Nanite Visualization > Overview усі шість деталей кольорові (Unreal 5.8 вмикає Nanite під час імпорту). (from day 8, lesson 3)\n11. Стіни в L_Day09, у сантиметрах. Будинок іде від Y 0 до -600, бо Unreal віддзеркалює вісь Y з Blender. Перед, Rotation Z 0: SM_Wall_Door на 0, 0, 0, SM_Wall_Window на 200, 0, 0. Лівий бік, Rotation Z 90, X 0: SM_Wall_2m на Y -600, SM_Wall_Window на Y -400, SM_Wall_2m на Y -200. Перевірка: стіни утворюють літеру L. (from lesson 4)\n12. Правий бік, Rotation Z -90, X 400: SM_Wall_2m на Y 0, SM_Wall_Window на Y -200, SM_Wall_2m на Y -400. Зад, Rotation Z 180, Y -600: SM_Wall_2m на X 400 і X 200. SM_Wall_Corner на (0, 0), (400, 0), (0, -600) і (400, -600). Натисни Ctrl+S. Перевірка: замкнена коробка стін зі стійкою в кожному куті. (from lesson 4)\n13. Облети будинок на відстані 2 м від кожного стику, потім зроби скриншот house_front.png. Перевірка: немає щілин чи мерехтіння, а відчинене дверне полотно й глибокий бік кожної віконної рами — усередині. Щось виходить назовні? Ця стіна стоїть задом наперед: додай 180 до її Rotation Z і знову прив'яжи до її кута. (from day 7, lesson 4)\n14. Перевір збереження: закрий Blender і знову відкрий buildkit_day9.blend. Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: усі шість деталей є в Outliner, а кожна назва зі списку є в папці, у кожної є розмір. (from day 0, lesson 1)\n\nHow to help: ask which step number I'm on, then give me only the next step: the exact clicks and what I should see. When I send a screenshot, compare it with my reference, my sizes and the spec, and name one thing to fix at a time.\nCheck every save and export by reopening it before we move on:\n- a .blend: close Blender, double-click the file in today's day work folder (GAD\\Day-09-building-kit), and the model is there (an empty grid means the wrong file was saved)\n- a .md or .txt: open it with Notepad; the text is there, and the name doesn't end in .md.txt\nWhen I write \"готово\", and in any case before the day ends, check with me one item at a time (yes/no): each spec point, then each file on my hand-in list, ready in my day work folder (skip summary.md: the day report writes it next):\n1. buildkit_day9.blend (твій набір для будівель, який у п'ятницю отримає гребінь) (→ День 10)\n2. house_front.png (стіни без щілин, дверне полотно всередині) (доказ)\nFinish with a short list of anything missing, and one line on where this work comes back and what it will look like there. Then tell me the order for the end of the day: first the day report (the Copy the day report button at the bottom of my course page) into summary.md, and only then hand in all the files on the list, summary.md too.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say ep number.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender.", "reportPrompt": "Help me write today's report for summary.md. I write it before I hand in. Talk to me in simple Ukrainian, and never use gendered forms about me. Keep the English labels below exactly; the text after each label may be Ukrainian.\nAsk me one thing at a time, and skip whatever I've already pasted below:\n1. My lesson summaries («Засвоєно» / «Було важко»), or which lessons I skipped.\n2. My first score in the page's \"Check yourself\" quiz.\n3. How far the build got: done, partly or blocked (if blocked, where).\n4. My hand-in list, one item at a time (skip summary.md): is the file ready in my day work folder (GAD\\Day-09-building-kit)? (yes/no)\n   - buildkit_day9.blend (твій набір для будівель, який у п'ятницю отримає гребінь) (→ День 10)\n   - house_front.png (стіни без щілин, дверне полотно всередині) (доказ)\n5. The checks: my .blend reopens with the model inside.\n6. One question for Thalia (about any day; start with the day number), or \"none\".\n7. About how many hours today took.\nThen give me the finished report in one block I can copy:\n\nTeam summary, <date>, Andrii\nDay 9: A small building kit: walls, a window, a door and a roof. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nReady to hand in: <tick each item of today's list: ✓ name, or ✗ name and why it isn't ready>\nMissing: <files not ready, or \"none\">\nChecks: <blend reopens: ok, or what's wrong>\nQuestion for Thalia: <Day N: one line, or \"none\">\nHours: <about N>\nTo revisit: <the «Було важко» lines>\n\nThen tell me: open summary.md in today's day work folder (GAD\\Day-09-building-kit) function vid(v){if(!v)return '';const link=v.url?'<a href="'+esc(v.url)+'" target="_blank" rel="noopener">'+esc(x(v.title)||v.url)+'</a>'+(v.channel?' <span class="muted">· '+esc(v.channel)+(v.length?' · '+esc(v.length):'')+'</span>':''):'';const s=v.search?'<a href="https://www.youtube.com/results?search_query='+encodeURIComponent(v.search)+'" target="_blank" rel="noopener">'+u('noVid')+': '+esc(v.search)+'</a>':'';const alt=v.alt&&v.alt.url?'<br><span class="eyebrow">UA</span> <a href="'+esc(v.alt.url)+'" target="_blank" rel="noopener">'+esc(v.alt.title||v.alt.url)+'</a>'+(v.alt.channel?' <span class="muted">· '+esc(v.alt.channel)+'</span>':''):'';return '<div class="vid well">'+kn('play')+'<div><b>'+u('more')+'?</b><br>'+(link||s)+alt+(link&&s?'<br><span class="muted" style="font-size:14px">'+s+'</span>':'')+'</div></div>'}
function morning(){const m=D.morning;if(!m)return '';const q=m.quote||{};
 let shelf='';if(D.day>0){shelf='<div class="shelf" aria-hidden="true">';let g='';for(let d=0;d<D.day;d++){let p=0;try{p=(JSON.parse(localStorage.getItem('devteam:'+D.learner+':'+d))||{}).pct||0}catch(e){}g+='<i class="'+(p>=1?'d':'')+(d>0&&d%5===0?' bs':'')+'"></i>';if(d%5===0||d===D.day-1){shelf+='<span class="wkg">'+g+'</span>';g=''}}shelf+='</div>'}
 const qt=lang==='uk'&&q.original?q.original:x(q.text);
 return '<section class="card glass morning"><div class="mgrid">'+(m.sofar?'<div>'+lab(u('sofar'),'gold')+shelf+'<p class="mtxt">'+lk(x(m.sofar))+'</p></div>':'')+(m.today?'<div>'+lab(u('todayL'))+'<p class="mtxt">'+lk(x(m.today))+'</p></div>':'')+'</div>'+(m.cheer?'<p class="cheer">'+esc(x(m.cheer))+'</p>':'')+(qt?'<figure class="quote well">'+kn('quote')+'<blockquote>'+esc(qt)+'</blockquote>'+(q.author?'<figcaption>'+esc(x(q.author))+'</figcaption>':'')+'</figure>':'')+'</section>'}
function setLang(l){lang=l;try{localStorage.setItem('devteam:lang',lang)}catch(e){};render()}
function toggleLang(){setLang(lang==='uk'?'en':'uk')}
/* keep open sections and keyboard focus across re-renders */
const openD=new Set();
function tg(e){if(e.open)openD.add(e.id);else openD.delete(e.id)}
const op=id=>openD.has(id)?' open':'';
function render(){const ae=document.activeElement,fid=ae&&(ae.id||(ae.getAttribute('data-th')?'th-'+ae.getAttribute('data-th'):ae.getAttribute('lang')&&ae.closest('.seg')?'lg-'+ae.getAttribute('lang'):''));
 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);
 const b=D.build,P=Math.round(prog()*100);
 document.getElementById('top').innerHTML='<div class="topin glass"><a class="maplink" href="'+esc(D.mapHref)+'">'+kn('map')+u('map')+'</a><div class="crumb"><b>'+esc(x(D.learnerName))+'</b><span>'+u('week')+' '+D.week+'</span><span>'+u('day')+' '+D.day+' '+u('of')+' '+D.total+'</span></div>'+controls(lang,'setLang')+'</div><div class="tline"><i style="width:'+P+'%"></i></div>';
 const state=w=>w<D.week?'b':w===D.week?'n':'p';
 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 let wk='';if(D.weekInfo){const w=D.weekInfo;wk='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}
 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p>'+(b.next?'<div class="back well">'+kn('arrow')+'<div><b>'+u('comes')+'</b><br>'+lk(x(b.next))+'</div></div>':'')+'<div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.assetFiles&&D.assetFiles.length?'<p class="files">'+ic('folder')+'<span>'+u('filesL')+' '+D.assetFiles.map(f=>'<a href="assets/'+encodeURIComponent(f)+'" target="_blank" rel="noopener">'+esc(f)+'</a>').join(', ')+'</span></p>':D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+=handinCard();h+=beforeCard();
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div><label class="rcpt" for="r'+i+'"><span class="eyebrow">'+u('rcpt')+'</span><textarea id="r'+i+'" rows="2" placeholder="'+esc(u('rcptPh'))+'" oninput="st.r'+i+'=this.value;save()">'+esc(st['r'+i]||'')+'</textarea></label>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+hList()+chkList()+(hasClip?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<h3>1 · '+u('copyR')+'</h3><p class="muted">'+u('report')+'</p><div class="row"><button class="btn ghost" onclick="cp(reportText())">'+ic('copy')+u('copyR')+'</button></div><h3>2 · '+u('ship')+'</h3>'+hf()+'<p class="muted" style="margin:12px 0 0">'+u('hNote')+'</p></section>';
 h+=qCard();h+=wk;
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();
</script>

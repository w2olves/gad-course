<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 19</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

<script id="data" type="application/json">{"learner": "ib-andrii-5f4e723e", "learnerName": {"en": "Andrii", "uk": "Андрій"}, "day": 19, "week": 4, "total": 60, "title": {"en": "Light and atmosphere: Lumen, sky, fog, exposure and two composed cameras", "uk": "Світло й атмосфера: Lumen, небо, туман, експозиція і дві скомпоновані камери"}, "theme": {"en": "Week 4: The Unreal look", "uk": "Тиждень 4: Вигляд в Unreal"}, "build": {"item": {"en": "L_HarbourCorner: your kit lit by a written light recipe, with two composed cameras", "uk": "L_HarbourCorner: твій набір, освітлений за записаним рецептом світла, з двома скомпонованими камерами"}, "why": {"en": "Today your harbour gets golden evening light, soft haze over the water and two cameras that frame it like a postcard. Studios write the light down as a recipe of numbers, so any artist can rebuild it and every shot matches.", "uk": "Сьогодні твоя гавань отримує золоте вечірнє світло, м'який серпанок над водою і дві камери, які беруть її в кадр, як листівку. Студії записують світло як рецепт із чисел, щоб будь-який художник міг його відтворити, а кожен кадр збігався з іншими."}, "next": {"en": "L_HarbourCorner becomes Friday's Boss scene, shot from C1 and C2. Your light_recipe.md starts the island's light: Day 30 takes its EV100, and Day 32 grows it for the whole island.", "uk": "L_HarbourCorner стане сценою п'ятничного Дня боса з кадрами з C1 і C2. Твій light_recipe.md — початок світла острова: у День 30 з нього знадобиться EV100, а у День 32 рецепт пошириться на весь острів."}, "where": {"en": "A new level, L_HarbourCorner, in Course/Day19.", "uk": "Новий рівень L_HarbourCorner у Course/Day19."}, "spec": [{"en": "L_HarbourCorner (File > New Level > Basic) with your dressed kit and the Land block copied in from L_KitTest. The new Floor is the sea bed at Z -400. Water at Z -100, 1 m below the quay top, fills every open side.", "uk": "L_HarbourCorner (File > New Level > Basic) з наповненим набором і блоком Land, скопійованими з L_KitTest. Нова підлога Floor — це морське дно на Z -400. Вода на Z -100, на 1 м нижче верху причалу, заповнює кожен відкритий бік."}, {"en": "The outdoor set: Directional Light (the sun), Sky Light, Sky Atmosphere and Exponential Height Fog, with Lumen for bounced light and reflections.", "uk": "Комплект зовнішнього освітлення: Directional Light (сонце), Sky Light, Sky Atmosphere і Exponential Height Fog, з Lumen для відбитого світла й віддзеркалень."}, {"en": "Golden light: the sun about 10 to 20 degrees above the horizon, coming from the side of your main view.", "uk": "Золоте світло: сонце приблизно на 10–20 градусів над горизонтом, світить збоку від твого головного ракурсу."}, {"en": "Exposure locked: a Post Process Volume with Infinite Extent (Unbound) on, and Min EV100 = Max EV100.", "uk": "Експозицію зафіксовано: Post Process Volume з увімкненим Infinite Extent (Unbound), а Min EV100 = Max EV100."}, {"en": "light_recipe.md with every number: sun rotation and intensity, Sky Light intensity, fog density and height falloff, EV100 and white balance Temp. A higher Temp warms the picture.", "uk": "light_recipe.md з усіма числами: Rotation та Intensity сонця, Intensity у Sky Light, Fog Density і Fog Height Falloff, EV100 і Temp балансу білого. Вищий Temp робить картинку теплішою."}, {"en": "Two Cine Camera Actors with a 16:9 filmback, each composed on thirds and locked. C1 is low along the quay: 2 to 6 m up, 24 mm. C2 is high and wide: 25 to 30 m up, 18 to 24 mm.", "uk": "Дві Cine Camera Actor з Filmback 16:9, кожна скомпонована за третинами й заблокована. C1 — низько вздовж причалу: 2–6 м над ним, 24 мм. C2 — високо й широко: 25–30 м угору, 18–24 мм."}, {"en": "A repeat check: the light rebuilt from light_recipe.md alone, in a copy of the level, matches the original from C1.", "uk": "Тест повторюваності: світло, відтворене лише за light_recipe.md у копії рівня, збігається з оригіналом з C1."}], "piece1": "the sun, sky and fog, and camera C1 (shared with the lessons)", "piece2": {"en": "Exposure, the recipe, camera C2 and the repeat check, on your own", "uk": "Експозиція, рецепт, камера C2 і тест повторюваності, самостійно"}, "steps": [{"text": {"en": "Check: the files from today's lessons are in the day work folder (light_recipe.md with your fog numbers). Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it. L_HarbourCorner holds your kit, the water and camera C1.", "uk": "Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: light_recipe.md з числами туману. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. L_HarbourCorner містить твій набір, воду й камеру C1."}, "lesson": 1}, {"text": {"en": "Finish the level: the Land block's top is level with the deck at Z 0, and the Floor is at Z -400. Older Unreal (4.27) or weak PC: hide VolumetricCloud with its eye icon; see the weak-PC section of ACCOUNTS-AND-INSTALLS.html. Check: from 2 m the land meets the quay with no step and no gap.", "uk": "Заверши рівень: верх блоку Land урівень із настилом на Z 0, а Floor стоїть на Z -400. Старіший Unreal (4.27) або слабкий ПК: сховай VolumetricCloud значком ока, див. розділ «Слабкий ПК» на сторінці ACCOUNTS-AND-INSTALLS.html. Перевірка: з 2 м суша сходиться з причалом без сходинки й без щілини."}, "lesson": 1}, {"text": {"en": "Water: the Water Body Lake, or the dark plane, is at least 80 x 80 m at Z -100. It runs under the Land block and fills every open side. If the lake stutters, use the plane. Check: from the quay at 2 m, the water meets the wall with no gap.", "uk": "Вода: Water Body Lake або темна площина щонайменше 80 × 80 м на Z -100. Вона заходить під блок Land і заповнює кожен відкритий бік. Якщо озеро смикається, бери площину. Перевірка: з причалу на висоті 2 м вода сходиться зі стіною без щілини."}, "lesson": 1}, {"text": {"en": "Golden light: hold Ctrl+L and move the mouse until the sun is 10 to 20 degrees high and rakes across the shop front. Write its Rotation in light_recipe.md. Older Unreal (4.27) or weak PC: with Lumen off, raise the Sky Light's Intensity a little so shade isn't black. Check: long shadows, and the trim and wear catch the light.", "uk": "Золоте світло: тримай Ctrl+L і веди мишею, доки сонце не підніметься на 10–20 градусів і не світитиме навскіс по фасаду крамниці. Запиши його Rotation у light_recipe.md. Старіший Unreal (4.27) або слабкий ПК: якщо Lumen вимкнено, трохи підніми Intensity у Sky Light, щоб тінь не була чорною. Перевірка: тіні довгі, а трим і зношеність ловлять світло."}, "lesson": 1}, {"text": {"en": "Fog: set Fog Density and Fog Height Falloff so the far side of the water softens but keeps its shape. Check: from C2's height, near things are darker and sharper than far things.", "uk": "Туман: задай Fog Density і Fog Height Falloff так, щоб дальній берег води пом'якшився, але зберіг форму. Перевірка: з висоти C2 близькі об'єкти темніші й чіткіші за далекі."}, "lesson": 2}, {"text": {"en": "Post Process Volume: Infinite Extent (Unbound) on, and Min EV100 = Max EV100 where white walls are bright but keep their texture. Then nudge Temp from 6500 in steps of about 250. Check: the brightness no longer changes from sun into shade, and whites are never orange or blue.", "uk": "Post Process Volume: увімкни Infinite Extent (Unbound) і постав Min EV100 = Max EV100 на значенні, за якого білі стіни яскраві, але зберігають текстуру. Потім змінюй Temp від 6500 кроками приблизно по 250. Перевірка: яскравість більше не змінюється, коли летиш із сонця в тінь, а білий ніколи не стає помаранчевим чи синім."}, "lesson": 3}, {"text": {"en": "Complete light_recipe.md with every number from today, plus the sun's Intensity and the Sky Light's Intensity. Check: nothing in the recipe says 'about' or 'some'.", "uk": "Доповни light_recipe.md усіма сьогоднішніми числами, а також Intensity сонця й Intensity у Sky Light. Перевірка: у рецепті немає слів «приблизно» чи «трохи»."}, "lesson": 3}, {"text": {"en": "C1: the quay edge as a leading line into the frame, the shop front on a third, the horizon level (Roll 0). Lock it. Check: on a copy of its screenshot with thirds lines drawn in Krita, the shop front sits on a line.", "uk": "C1: край причалу — провідна лінія в кадр, фасад крамниці — на третині, горизонт рівний (Roll 0). Заблокуй камеру. Перевірка: на копії скриншота з лініями третин, намальованими в Krita, фасад стоїть на лінії."}, "lesson": 4}, {"text": {"en": "C2: a second Cine Camera Actor 25 to 30 m up, at 18 to 24 mm. Frame the whole kit and the water, with the sky in the top third. Lock it. Check: the pier, building and water all read in a 3-second look.", "uk": "C2: друга Cine Camera Actor на висоті 25–30 м, 18–24 мм. Вмісти в кадр увесь набір і воду, а небо — у верхню третину. Заблокуй камеру. Перевірка: пірс, будівлю й воду можна прочитати за 3 секунди."}, "lesson": 4}, {"text": {"en": "Pilot each camera, press G and take harbour_C1.png and harbour_C2.png (Win+Shift+S). Weak PC: switch Scalability to High for these shots, then back to Medium, and write that in light_recipe.md. Check: both shots are in the day work folder.", "uk": "Керуй кожною камерою (Pilot), натисни G, зроби скриншоти (Win+Shift+S) і збережи як harbour_C1.png і harbour_C2.png. Слабкий ПК: для цих кадрів перемкни Scalability на High, потім назад на Medium, і запиши це в light_recipe.md. Перевірка: обидва кадри лежать у робочій папці дня."}, "lesson": 4}, {"text": {"en": "Gold (optional): the repeat check. Duplicate L_HarbourCorner as L_HarbourCorner_LightTest, reset the sun, Sky Light, fog and post-process values and rebuild them from light_recipe.md alone. Put both C1 shots side by side as c1_match.png. Check: they look like the same photo.", "uk": "Золото (за бажанням): тест повторюваності. Зроби копію L_HarbourCorner (Duplicate) з назвою L_HarbourCorner_LightTest, скинь значення сонця, Sky Light, туману й постобробки й відтвори їх лише за light_recipe.md. Постав обидва кадри C1 поруч і збережи як c1_match.png. Перевірка: вони виглядають як одне фото."}, "lesson": 3}, {"text": {"en": "Report and hand-in: click Copy the day report at the bottom of the page, paste it into a new chat and answer. Open summary.md in Notepad, press Ctrl+End, paste the answer and press Ctrl+S. Then drag the files on the Hand in list into your hand-in folder. Check: every name shows in the folder, each with a size.", "uk": "Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: кожна назва зі списку є в папці, у кожної є розмір."}, "lesson": "D0.1"}]}, "lessons": [{"title": {"en": "The outdoor light set and the time of day", "uk": "Комплект зовнішнього освітлення й час доби"}, "minutes": 40, "goals": [{"en": "Name the outdoor light set and its jobs. Directional Light is the sun, and Sky Light is soft light from the whole sky. Sky Atmosphere colours the sky, and Exponential Height Fog is haze.", "uk": "Називати комплект зовнішнього освітлення і роль кожного елемента. Directional Light — це сонце, а Sky Light — м'яке світло від усього неба. Sky Atmosphere забарвлює небо, а Exponential Height Fog — це серпанок."}, {"en": "Explain Lumen: Unreal's live system for light that bounces and for reflections. Older Unreal (4.27) or weak PC: Lumen off works too; shade is just flatter.", "uk": "Пояснювати, що таке Lumen: система Unreal, яка наживо рахує відбите світло й віддзеркалення. Старіший Unreal (4.27) або слабкий ПК: з вимкненим Lumen теж можна працювати, просто тіні пласкіші."}, {"en": "Move the sun and see how the time of day changes the mood and the textures.", "uk": "Пересувати сонце й бачити, як час доби змінює настрій і текстури."}, {"en": "Explain why a low sun looks good: long shadows, warm light, and texture lit from the side.", "uk": "Пояснювати, чому низьке сонце виглядає гарно: довгі тіні, тепле світло й текстура, освітлена збоку."}], "doalong": [{"en": "Open L_KitTest. In the Outliner Ctrl+click your kit, LI_HarbourHouse, the Land block, shop front, awning, paving plane, decals and props. Leave out the Floor, lights, sky and fog. Press Ctrl+C. You see them all highlighted.", "uk": "Відкрий L_KitTest. В Outliner клацни з Ctrl на деталі набору, LI_HarbourHouse, блок Land, фасад крамниці, маркізу, площину з бруківкою, декалі й пропси. Не бери Floor, світло, небо й туман. Натисни Ctrl+C. Усе вибране підсвічено."}, {"en": "File > New Level > Basic (Default on 4.27), then File > Save Current Level As: L_HarbourCorner in Course/Day19. Press Ctrl+V. You see your kit in the same places, under a new sky.", "uk": "File > New Level > Basic (у 4.27 — Default), потім File > Save Current Level As: L_HarbourCorner у Course/Day19. Натисни Ctrl+V. Твій набір стоїть на тих самих місцях, під новим небом."}, {"en": "Click the new level's Floor and type -400 into Location Z: it becomes the sea bed. You see the quay wall reach down below the land.", "uk": "Клацни на Floor нового рівня й введи -400 у Location Z: це морське дно. Стінка причалу тепер сягає нижче суші."}, {"en": "Window > Place Actors, search Water Body Lake and drag it in beside the quay. Widen it and set Location Z to -100. Trouble? Use a big Plane at Z -100 with a dark blue-green M_Master instance (Roughness 0.05). You see water against your quay.", "uk": "Window > Place Actors, знайди Water Body Lake і перетягни його поруч із причалом. Розшир його й постав Location Z на -100. Проблеми? Візьми велику Plane на Z -100 з темним синьо-зеленим інстансом M_Master (Roughness 0.05). Вода підходить до причалу."}, {"en": "Window > Env. Light Mixer shows the sun, Sky Light, Sky Atmosphere and fog in one panel. Hold Ctrl+L and move the mouse: sun high (noon), then low (Rotation Y about -15). You see flat light at noon and long shadows when low.", "uk": "Window > Env. Light Mixer показує на одній панелі сонце, Sky Light, Sky Atmosphere і туман. Тримай Ctrl+L і веди мишею: сонце високо (полудень), потім низько (Rotation Y приблизно -15). Опівдні світло пласке, а коли сонце низько, тіні довгі."}, {"en": "Turn the sun so it comes from the side of your shop front. You see the trim, frames and wear stand out: this is raking light.", "uk": "Поверни сонце так, щоб воно світило збоку фасаду крамниці. Трим, рами й зношеність стають помітними: це світло навскіс."}], "play": {"en": "Time detective: I send three screenshots at different sun heights. The tutor guesses the time of day from the shadows. Then we swap roles.", "uk": "Детектив часу: я надсилаю три скриншоти з різною висотою сонця. Тьютор вгадує час доби за тінями. Потім ми міняємося ролями."}, "video": {"search": "unreal engine 5 lumen basics outdoor lighting", "alt": {"url": "https://www.youtube.com/watch?v=985erJx5e1o", "title": "Освітлення в Unreal Engine 5 для новачків!", "channel": "3DV Unreal Engine Archviz Academy"}}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Комплект зовнішнього освітлення й час доби (Day 19, lesson 1 of 4). Today's build: L_HarbourCorner: твій набір, освітлений за записаним рецептом світла, з двома скомпонованими камерами.\nWhat I already know: Дні 10–18: L_KitTest з наповненим набором (причал, пірс, сходи, поручні, LI_HarbourHouse, SM_ShopFront_A, маркіза, бруківка, декалі й пропси); Дні 12–18: твої матеріали, палітра, безшовні текстури й декалі — тепер світло показує їх у всій красі; День 15: підбір ракурсу, сонце (Ctrl+L) і закладки.\n\nBy the end of this lesson I can:\n1. Називати комплект зовнішнього освітлення і роль кожного елемента. Directional Light — це сонце, а Sky Light — м'яке світло від усього неба. Sky Atmosphere забарвлює небо, а Exponential Height Fog — це серпанок.\n2. Пояснювати, що таке Lumen: система Unreal, яка наживо рахує відбите світло й віддзеркалення. Старіший Unreal (4.27) або слабкий ПК: з вимкненим Lumen теж можна працювати, просто тіні пласкіші.\n3. Пересувати сонце й бачити, як час доби змінює настрій і текстури.\n4. Пояснювати, чому низьке сонце виглядає гарно: довгі тіні, тепле світло й текстура, освітлена збоку.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: Твій набір має матеріали, зношеність, справжню палітру, безшовні текстури й декалі, що показують, де були вода й колеса. Today: Сьогодні ти освітлюєш L_HarbourCorner низьким золотим світлом — Lumen, небо, туман, експозиція, — записуєш кожне число в рецепт світла й компонуєш дві камери. One encouraging line: Світло змінює сцену за хвилину, тож пробуй вільно: записаний рецепт завжди поверне вигляд, який тобі подобається.); 2 lines on why today matters and where it comes back, in plain words (from this: Сьогодні твоя гавань отримує золоте вечірнє світло, м'який серпанок над водою і дві камери, які беруть її в кадр, як листівку. Студії записують світло як рецепт із чисел, щоб будь-який художник міг його відтворити, а кожен кадр збігався з іншими. It comes back: L_HarbourCorner стане сценою п'ятничного Дня боса з кадрами з C1 і C2. Твій light_recipe.md — початок світла острова: у День 30 з нього знадобиться EV100, а у День 32 рецепт пошириться на весь острів.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-19-light-atmosphere-cameras exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (сонце, небо й туман, а також камера C1 (спільні з уроками)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Відкрий L_KitTest. В Outliner клацни з Ctrl на деталі набору, LI_HarbourHouse, блок Land, фасад крамниці, маркізу, площину з бруківкою, декалі й пропси. Не бери Floor, світло, небо й туман. Натисни Ctrl+C. Усе вибране підсвічено.\n   2. File > New Level > Basic (у 4.27 — Default), потім File > Save Current Level As: L_HarbourCorner у Course/Day19. Натисни Ctrl+V. Твій набір стоїть на тих самих місцях, під новим небом.\n   3. Клацни на Floor нового рівня й введи -400 у Location Z: це морське дно. Стінка причалу тепер сягає нижче суші. [screenshot]\n   4. Window > Place Actors, знайди Water Body Lake і перетягни його поруч із причалом. Розшир його й постав Location Z на -100. Проблеми? Візьми велику Plane на Z -100 з темним синьо-зеленим інстансом M_Master (Roughness 0.05). Вода підходить до причалу.\n   5. Window > Env. Light Mixer показує на одній панелі сонце, Sky Light, Sky Atmosphere і туман. Тримай Ctrl+L і веди мишею: сонце високо (полудень), потім низько (Rotation Y приблизно -15). Опівдні світло пласке, а коли сонце низько, тіні довгі.\n   6. Поверни сонце так, щоб воно світило збоку фасаду крамниці. Трим, рами й зношеність стають помітними: це світло навскіс. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Детектив часу: я надсилаю три скриншоти з різною висотою сонця. Тьютор вгадує час доби за тінями. Потім ми міняємося ролями. Otherwise skip it.\n6. Review: ask me these questions from earlier days, one at a time, and correct me kindly: Day 16: why do you sample a colour from a blurred photo, and from the lit side? | Day 13: why are the shop front's openings recessed 10 to 15 cm?\n7. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n8. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a res вітло."}], "doalong": [{"en": "Window > Place Actors, search Post Process Volume and drag it in. In Details, tick Infinite Extent (Unbound). You see no change yet: the volume now covers the whole level.", "uk": "Window > Place Actors, знайди Post Process Volume і перетягни його в рівень. У Details увімкни Infinite Extent (Unbound). Поки що змін не видно: тепер об'єм покриває весь рівень."}, {"en": "Type EV100 in the Details search box. Tick Min EV100 and Max EV100 and type the same number in both. EV100 is Unreal's exposure number: a higher number makes the picture darker. You see the brightness stop changing as you fly.", "uk": "Введи EV100 у поле пошуку Details. Увімкни Min EV100 і Max EV100 і введи в обидва однакове число. EV100 — це число експозиції в Unreal: що воно більше, то темніша картинка. Під час польоту яскравість більше не змінюється."}, {"en": "Too white? Raise both numbers by 1. Too dark? Lower them by 1. Stop when white walls are bright but keep their texture. You see the stone and plaster texture on a sunlit wall.", "uk": "Забагато білого? Підніми обидва числа на 1. Затемно? Зменш на 1. Зупинись, коли білі стіни яскраві, але зберігають текстуру. На освітленій сонцем стіні видно текстуру каменю й штукатурки."}, {"en": "Type Temp in the Details search box and tick Temp. Leave Temperature Type at White Balance. Raise Temp about 250 above its default (6500): you see the picture warm a little. Lower it 250 below: you see it cool. Keep a gentle value.", "uk": "Введи Temp у поле пошуку Details і увімкни прапорець Temp. Temperature Type лиши на White Balance. Підніми Temp приблизно на 250 вище типового значення (6500): картинка трохи теплішає. Опусти на 250 нижче: картинка холоднішає. Лиши м'яке значення."}, {"en": "Look at Bloom Intensity and Vignette Intensity and keep them low or at their defaults. You see sun glints glow softly, not smear.", "uk": "Подивися на Bloom Intensity і Vignette Intensity і тримай їх низькими або з типовими значеннями. Сонячні відблиски м'яко світяться, а не розмазуються."}, {"en": "Add to light_recipe.md: the sun's Rotation and Intensity, the Sky Light's Intensity, the fog numbers, EV100 and Temp. You see every number in one place.", "uk": "Додай у light_recipe.md: Rotation та Intensity сонця, Intensity у Sky Light, числа туману, EV100 і Temp. Усі числа тепер в одному місці."}], "play": {"en": "One photo or two: I describe two screenshots of the same view. The tutor says whether they could be the same photograph. I change one number at a time until it says yes.", "uk": "Одне фото чи два: я описую два скриншоти того самого ракурсу. Тьютор каже, чи це може бути та сама фотографія. Я змінюю по одному числу, доки тьютор не скаже «так»."}, "video": {"search": "unreal engine 5 post process volume exposure min max ev100"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Постобробка (Post-process): фіксація експозиції й м'яка кольорокорекція (Day 19, lesson 3 of 4). Today's build: L_HarbourCorner: твій набір, освітлений за записаним рецептом світла, з двома скомпонованими камерами.\nWhat I already know: Дні 10–18: L_KitTest з наповненим набором (причал, пірс, с rainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}, {"title": {"en": "Cameras and composition", "uk": "Камери й композиція"}, "minutes": 40, "goals": [{"en": "Place a Cine Camera Actor, a camera with real lens settings, and pilot it. Set a 16:9 filmback and a focal length: 18 to 24 mm is wide, 35 mm is normal. Then lock it.", "uk": "Ставити Cine Camera Actor — камеру зі справжніми налаштуваннями об'єктива — і керувати нею (Pilot). Задавати Filmback 16:9 і фокусну відстань: 18–24 мм — ширококутний об'єктив, 35 мм — нормальний. Потім блокувати камеру."}, {"en": "Compose with the rule of thirds: put the subject on lines that split the frame into thirds. Add a leading line that guides the eye, keep foreground, middle and background clear, and keep the horizon level.", "uk": "Компонувати за правилом третин: об'єкт зйомки — на лініях, що ділять кадр на третини. Додавати провідну лінію, яка веде погляд, тримати чіткими передній, середній і задній плани, а горизонт — рівним."}, {"en": "Put the strongest contrast where you want the eye to go: on your subject.", "uk": "Ставити найсильніший контраст туди, куди має піти погляд: на об'єкт зйомки."}], "doalong": [{"en": "Window > Place Actors > Cinematic > Cine Camera Actor: drag it in and rename it C1 in the Outliner. You see a camera icon in the level.", "uk": "Window > Place Actors > Cinematic > Cine Camera Actor: перетягни камеру в рівень і перейменуй на C1 в Outliner. На рівні з'являється значок камери."}, {"en": "Right-click C1 > Pilot 'C1'. Fly low (2 to 6 m up) looking along the quay edge, then click the eject button at the top left of the viewport. You see the camera stay where you left it.", "uk": "Клацни правою кнопкою на C1 > Pilot 'C1'. Пролети низько (2–6 м над причалом), дивлячись уздовж його краю, потім клацни кнопку виходу (eject) угорі ліворуч у в'юпорті. Камера лишається на місці."}, {"en": "In Details > Filmback choose a 16:9 preset and set Current Focal Length to 24. You see the frame shape in the small camera preview.", "uk": "У Details > Filmback вибери шаблон 16:9 і постав Current Focal Length на 24. Форму кадру видно в маленькому вікні перегляду камери."}, {"en": "Pilot again and move until the shop front sits on a thirds line and the quay edge runs into the frame. Keep the horizon level (Rotation Roll 0). You see a picture with one clear subject.", "uk": "Знову керуй камерою (Pilot) і рухайся, доки фасад крамниці не стане на лінію третин, а край причалу не поведе в кадр. Тримай горизонт рівним (Rotation Roll 0). Має вийти кадр з одним чітким об'єктом зйомки."}, {"en": "Right-click C1 > Transform > Lock Actor Movement. You see that C1 can no longer be moved by accident.", "uk": "Клацни правою кнопкою на C1 > Transform > Lock Actor Movement. Тепер C1 не зсунеш випадково."}], "play": {"en": "Critique duel: I send my C1 shot. The tutor names one composition fault. I fix it and send it again for a score out of 10. Best of three.", "uk": "Дуель критиків: я надсилаю свій кадр з C1. Тьютор називає одну ваду композиції. Я виправляю її й надсилаю знову для оцінки з 10. Гра до двох перемог із трьох."}, "video": {"url": "https://www.youtube.com/watch?v=CW8hDvJOwGM", "title": "Unreal Engine 5 Cinematic Camera Tutorial for Beginners STEP BY STEP", "channel": "EZ Unreal", "length": "7:46", "search": "unreal engine 5 cine camera actor"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Камери й композиція (Day 19, lesson 4 of 4). Today's build: L_HarbourCorner: твій набір, освітлений за записаним рецептом світла, з двома скомпонованими камерами.\nWhat I already know: Дні 10–18: L_KitTest з наповненим набором (причал, пірс, сходи, поручні, LI_HarbourHouse, SM_ShopFront_A, маркіза, бруківка, декалі й пропси); Дні 12–18: твої матеріали, палітра, безшовні текстури й декалі — тепер світло показує їх у всій красі; День 15: підбір ракурсу, сонце (Ctrl+L) і закладки.\nEarlier today I already did: lesson 1 (Комплект зовнішнього освітлення й час доби); lesson 2 (Атмосфера: туман, серпанок і глибина); lesson 3 (Постобробка (Post-process): фіксація експозиції й м'яка кольорокорекція). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Ставити Cine Camera Actor — камеру зі справжніми налаштуваннями об'єктива — і керувати нею (Pilot). Задавати Filmback 16:9 і фокусну відстань: 18–24 мм — ширококутний об'єктив, 35 мм — нормальний. Потім блокувати камеру.\n2. Компонувати за правилом третин: об'єкт зйомки — на лініях, що ділять кадр на третини. Додавати провідну лінію, яка веде погляд, тримати чіткими передній, середній і задній плани, а горизонт — рівним.\n3. Ставити найсильніший контраст туди, куди має піти погляд: на об'єкт зйомки.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: 2 lines on why today matters and where it comes back, in plain words (from this: Сьогодні твоя гавань отримує золоте вечірнє світло, м'який серпанок над водою і дві камери, які беруть її в кадр, як листівку. Студії записують світло як рецепт із чисел, щоб будь-який художник міг його відтворити, а кожен кадр збігався з іншими. It comes back: L_HarbourCorner стане сценою п'ятничного Дня боса з кадрами з C1 і C2. Твій light_recipe.md — початок світла острова: у День 30 з нього знадобиться EV100, а у День 32 рецепт пошириться на весь острів.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-19-light-atmosphere-cameras exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (сонце, небо й туман, а також камера C1 (спільні з уроками)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Window > Place Actors > Cinematic > Cine Camera Actor: перетягни камеру в рівень і перейменуй на C1 в Outliner. На рівні з'являється значок камери.\n   2. Клацни правою кнопкою на C1 > Pilot 'C1'. Пролети низько (2–6 м над причалом), дивлячись уздовж його краю, потім клацни кнопку виходу (eject) угорі ліворуч у в'юпорті. Камера лишається на місці.\n   3. У Details > Filmback вибери шаблон 16:9 і постав Current Focal Length на 24. Форму кадру видно в маленькому вікні перегляду камери. [screenshot]\n   4. Знову керуй камерою (Pilot) і рухайся, доки фасад крамниці не стане на лінію третин, а край причалу не поведе в кадр. Тримай горизонт рівним (Rotation Roll 0). Має вийти кадр з одним чітким об'єктом зйомки.\n   5. Клацни правою кнопкою на C1 > Transform > Lock Actor Movement. Тепер C1 не зсунеш випадково. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Дуель критиків: я надсилаю свій кадр з C1. Тьютор називає одну ваду композиції. Я виправляю її й надсилаю знову для оцінки з 10. Гра до двох перемог із трьох. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\nIf I want to go deeper, recommend this free video: \"Unreal Engine 5 Cinematic Camera Tutorial for Beginners STEP BY STEP\" by EZ Unreal: https://www.youtube.com/watch?v=CW8hDvJOwGM\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); File Explorer = Провідник; vertex / edge / face = вершина / ребро / грань; origin (and kit pivot) = origin — точка, за яку об'єкт ставлять і обертають; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); UV unwrap / UV layout / seam / UV island = розгортка / розкладка / шов / UV-острівець; level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; collision / UCX collision box = колізія / блок UCX; volume (PCG Volume, Post Process Volume) = об'єм; kit / kit piece / part of one object = набір / деталь / частина; district / plot / plot plan = район / ділянка / план ділянки; harbour / quay / waterfront / pier = гавань / причал / набережна / пірс; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; shop front / shop window = фасад крамниці / вітрина; trim sheet / decal = трим-шит / декаль; wear / worn edges / salt line = зношеність / стерті краї / сольова лінія; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ; shot set = серія кадрів.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}], "handin": [{"en": "summary.md", "uk": "summary.md (звіт дня)"}, {"en": "light_recipe.md: every number of your light (→ Day 30)", "uk": "light_recipe.md (усі числа твого світла) (→ День 30)"}, {"en": "harbour_C2.png from the locked high camera (→ Day 20)", "uk": "harbour_C2.png (кадр із заблокованої високої камери) (→ День 20)"}, {"en": "harbour_C1.png from the locked low camera (proof)", "uk": "harbour_C1.png (кадр із заблокованої низької камери) (доказ)"}], "goal": {"en": "By the end of today L_HarbourCorner holds your kit and water, lit by a written recipe for low golden light. Two Cine Cameras give composed, repeatable shots.", "uk": "До кінця дня L_HarbourCorner містить твій набір і воду, освітлені за записаним рецептом низького золотого світла. Дві Cine Camera дають скомпоновані кадри, які можна повторити."}, "uses": [{"en": "Days 10 to 18: L_KitTest with your dressed kit (quay, pier, steps, railings, LI_HarbourHouse, SM_ShopFront_A, awning, paving, decals and props)", "uk": "Дні 10–18: L_KitTest з наповненим набором (причал, пірс, сходи, поручні, LI_HarbourHouse, SM_ShopFront_A, маркіза, бруківка, декалі й пропси)"}, {"en": "Days 12 to 18: your materials, palette, seamless textures and decals, which the light now shows off", "uk": "Дні 12–18: твої матеріали, палітра, безшовні текстури й декалі — тепер світло показує їх у всій красі"}, {"en": "Day 15: matching a view, the sun (Ctrl+L) and bookmarks", "uk": "День 15: підбір ракурсу, сонце (Ctrl+L) і закладки"}], "quiz": [{"q": {"en": "Which actor gives the scene haze and depth?", "uk": "Який актор дає сцені серпанок і глибину?"}, "options": [{"en": "Directional Light", "uk": "Directional Light"}, {"en": "Sky Light", "uk": "Sky Light"}, {"en": "Exponential Height Fog", "uk": "Exponential Height Fog"}, {"en": "Post Process Volume", "uk": "Post Process Volume"}], "answer": 2, "explain": {"en": "Exponential Height Fog makes far things lighter and softer, as real air does.", "uk": "Exponential Height Fog робить далекі об'єкти світлішими й м'якшими, як справжнє повітря."}}, {"q": {"en": "At noon your harbour looks flat and the textures don't show. What helps most?", "uk": "Опівдні твоя гавань виглядає пласкою, і текстур не видно. Що допоможе найбільше?"}, "options": [{"en": "Lower the sun to 10 to 20 degrees and bring it from the side", "uk": "Опустити сонце до 10–20 градусів і направити його збоку"}, {"en": "Raise Metallic on every material", "uk": "Підняти Metallic на кожному матеріалі"}, {"en": "Add fog until the scene is white", "uk": "Додавати туман, доки сцена не стане білою"}, {"en": "Make every texture brighter", "uk": "Зробити кожну текстуру яскравішою"}], "answer": 0, "explain": {"en": "Low side light makes long shadows and rakes across surfaces, so texture and shape show.", "uk": "Низьке бічне світло дає довгі тіні й ковзає по поверхнях, тож видно текстуру й форму."}}, {"q": {"en": "Flying from shade into sun, the picture keeps getting brighter and darker, so your shots never match. What is the fix?", "uk": "Коли летиш із тіні на сонце, картинка постійно стає то яскравішою, то темнішою, тож кадри ніколи не збігаються. Як це виправити?"}, "options": [{"en": "Delete the Sky Light", "uk": "Видалити Sky Light"}, {"en": "A Post Process Volume with Infinite Extent and Min EV100 = Max EV100", "uk": "Post Process Volume з Infinite Extent і Min EV100 = Max EV100"}, {"en": "Turn off Lumen", "uk": "Вимкнути Lumen"}], "answer": 1, "explain": {"en": "Unreal changes exposure by itself, like an eye. Locking Min and Max to one value stops it.", "uk": "Unreal сам змінює експозицію, як око. Якщо зафіксувати Min і Max на одному значенні, це припиняється."}}, {"q": {"en": "What is a leading line in a shot?", "uk": "Що таке провідна лінія в кадрі?"}, "options": [{"en": "The horizon at the very top", "uk": "Горизонт у самому верху"}, {"en": "A line drawn on the screen in the editor", "uk": "Лінія, намальована на екрані в редакторі"}, {"en": "A red line marking a drone lane", "uk": "Червона лінія, що позначає коридор для дрона"}, {"en": "A line in the scene, like a quay edge, that guides the eye to the subject", "uk": "Лінія в сцені, як-от край причалу, що веде погляд до об'єкта зйомки"}], "answer": 3, "explain": {"en": "Lines in the scene pull the eye along them. Aim them at your subject.", "uk": "Лінії в сцені ведуть погляд уздовж себе. Спрямовуй їх на свій об'єкт зйомки."}}, {"q": {"en": "In C2 the far shore is as dark and sharp as the pier in front. What adds depth?", "uk": "У C2 дальній берег такий самий темний і чіткий, як пірс попереду. Що додасть глибини?"}, "options": [{"en": "More triangles on the far shore", "uk": "Більше трикутників на дальньому березі"}, {"en": "A little more fog density, so far things get lighter and softer", "uk": "Трохи більша густина туману (Fog Density), щоб далекі об'єкти стали світлішими й м'якшими"}, {"en": "A longer focal length", "uk": "Довша фокусна відстань"}], "answer": 1, "explain": {"en": "Real air softens distant things. A little more fog gives the eye near, middle and far.", "uk": "Справжнє повітря пом'якшує далекі об'єкти. Трохи більше туману дає оку близький, середній і дальній плани."}}], "weekInfo": {"week": 4, "title": {"en": "The Unreal look", "uk": "Вигляд в Unreal"}, "goal": {"en": "By Friday you have a lit, dressed 30 x 30 m harbour corner built from your own kit, with colours from real photos, seamless textures, decals, a written light recipe and two composed camera shots.", "uk": "До п'ятниці в тебе є освітлений і наповнений куточок гавані 30 × 30 м, зібраний з твого власного набору: кольори зі справжніх фото, безшовні текстури, декалі, записаний рецепт світла й два скомпоновані кадри з камер."}, "skills": [{"en": "Colour palettes sampled from real photographs for consistent art direction", "uk": "Кольорові палітри, взяті зі справжніх фотографій, для цілісного художнього стилю"}, {"en": "Seamless tiling texture creation at real-world scale", "uk": "Створення безшовних тайлових текстур у реальному масштабі"}, {"en": "Decal-based weathering and environmental storytelling in Unreal Engine 5", "uk": "Зношеність декалями й розповідь через оточення (environmental storytelling) в Unreal Engine 5"}, {"en": "Lumen lighting, atmosphere and post-process exposure for outdoor scenes", "uk": "Освітлення Lumen, атмосфера, експозиція й постобробка (post-process) для сцен просто неба"}, {"en": "Shot composition with Cine Camera Actors", "uk": "Композиція кадру з Cine Camera Actor"}]}, "morning": {"sofar": {"en": "Your kit has materials, wear, a real palette, seamless textures and decals that show where water and wheels have been.", "uk": "Твій набір має матеріали, зношеність, справжню палітру, безшовні текстури й декалі, що показують, де були вода й колеса."}, "today": {"en": "You light L_HarbourCorner for low golden light with Lumen, sky, fog and exposure, write every number into your light recipe, and compose two cameras.", "uk": "Сьогодні ти освітлюєш L_HarbourCorner низьким золотим світлом — Lumen, небо, туман, експозиція, — записуєш кожне число в рецепт світла й компонуєш дві камери."}, "cheer": {"en": "Light can change a scene in a minute, so play freely; your written recipe always brings you back to a look you like.", "uk": "Світло змінює сцену за хвилину, тож пробуй вільно: записаний рецепт завжди поверне вигляд, який тобі подобається."}, "quote": {"text": {"en": "An artist should be open on all sides to every kind of light and darkness.", "uk": "Митець має відкриватися з усіх боків назустріч будь-якому світлу й будь-якій темряві."}, "author": {"en": "John Steinbeck", "uk": "Джон Стейнбек"}, "source": "https://en.wikiquote.org/wiki/John_Steinbeck"}}, "hasAssets": false, "workPath": "Work\\Assignment\\Day-19-light-atmosphere-cameras", "mapHref": "../../COURSE.html", "prevHref": "../Day-18-decals-salt-algae-puddles-tracks/START-HERE.html", "nextHref": "../Day-20-boss-harbour-corner/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8 and Krita. I am a beginner on Day 19. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me and don't write code.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: Експозиція, рецепт, камера C2 і тест повторюваності, самостійно.\nIt's part of: L_HarbourCorner: твій набір, освітлений за записаним рецептом світла, з двома скомпонованими камерами (Новий рівень L_HarbourCorner у Course/Day19.).\nWhy it matters: Сьогодні твоя гавань отримує золоте вечірнє світло, м'який серпанок над водою і дві камери, які беруть її в кадр, як листівку. Студії записують світло як рецепт із чисел, щоб будь-який художник міг його відтворити, а кожен кадр збігався з іншими. It comes back: L_HarbourCorner стане сценою п'ятничного Дня боса з кадрами з C1 і C2. Твій light_recipe.md — початок світла острова: у День 30 з нього знадобиться EV100, а у День 32 рецепт пошириться на весь острів.\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-19-light-atmosphere-cameras (on the drive I chose on Day 0).\nWhat I already know: Дні 10–18: L_KitTest з наповненим набором (причал, пірс, сходи, поручні, LI_HarbourHouse, SM_ShopFront_A, маркіза, бруківка, декалі й пропси); Дні 12–18: твої матеріали, палітра, безшовні текстури й декалі — тепер світло показує їх у всій красі; День 15: підбір ракурсу, сонце (Ctrl+L) і закладки; today's lessons: Комплект зовнішнього освітлення й час доби; Атмосфера: туман, серпанок і глибина; Постобробка (Post-process): фіксація експозиції й м'яка кольорокорекція; Камери й композиція. Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- L_HarbourCorner (File > New Level > Basic) з наповненим набором і блоком Land, скопійованими з L_KitTest. Нова підлога Floor — це морське дно на Z -400. Вода на Z -100, на 1 м нижче верху причалу, заповнює кожен відкритий бік.\n- Комплект зовнішнього освітлення: Directional Light (сонце), Sky Light, Sky Atmosphere і Exponential Height Fog, з Lumen для відбитого світла й віддзеркалень.\n- Золоте світло: сонце приблизно на 10–20 градусів над горизонтом, світить збоку від твого головного ракурсу.\n- Експозицію зафіксовано: Post Process Volume з увімкненим Infinite Extent (Unbound), а Min EV100 = Max EV100.\n- light_recipe.md з усіма числами: Rotation та Intensity сонця, Intensity у Sky Light, Fog Density і Fog Height Falloff, EV100 і Temp балансу білого. Вищий Temp робить картинку теплішою.\n- Дві Cine Camera Actor з Filmback 16:9, кожна скомпонована за третинами й заблокована. C1 — низько вздовж причалу: 2–6 м над ним, 24 мм. C2 — високо й широко: 25–30 м угору, 18–24 мм.\n- Тест повторюваності: світло, відтворене лише за light_recipe.md у копії рівня, збігається з оригіналом з C1.\n\nMy checklist (the same numbers show on my course page):\n1. Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: light_recipe.md з числами туману. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. L_HarbourCorner містить твій набір, воду й камеру C1. (from lesson 1)\n2. Заверши рівень: верх блоку Land урівень із настилом на Z 0, а Floor стоїть на Z -400. Старіший Unreal (4.27) або слабкий ПК: сховай VolumetricCloud значком ока, див. розділ «Слабкий ПК» на сторінці ACCOUNTS-AND-INSTALLS.html. Перевірка: з 2 м суша сходиться з причалом без сходинки й без щілини. (from lesson 1)\n3. Вода: Water Body Lake або темна площина щонайменше 80 × 80 м на Z -100. Вона заходить під блок Land і заповнює кожен відкритий бік. Якщо озеро смикається, бери площину. Перевірка: з причалу на висоті 2 м вода сходиться зі стіною без щілини. (from lesson 1)\n4. Золоте світло: тримай Ctrl+L і веди мишею, доки сонце не підніметься на 10–20 градусів і не світитиме навскіс по фасаду крамниці. Запиши його Rotation у light_recipe.md. Старіший Unreal (4.27) або слабкий ПК: якщо Lumen вимкнено, трохи підніми Intensity у Sky Light, щоб тінь не була чорною. Перевірка: тіні довгі, а трим і зношеність ловлять світло. (from lesson 1)\n5. Туман: задай Fog Density і Fog Height Falloff так, щоб дальній берег води пом'якшився, але зберіг форму. Перевірка: з висоти C2 близькі об'єкти темніші й чіткіші за далекі. (from lesson 2)\n6. Post Process Volume: увімкни Infinite Extent (Unbound) і постав Min EV100 = Max EV100 на значенні, за якого білі стіни яскраві, але зберігають текстуру. Потім змінюй Temp від 6500 кроками приблизно по 250. Перевірка: яскравість більше не змінюється, коли летиш із сонця в тінь, а білий ніколи не стає помаранчевим чи синім. (from lesson 3)\n7. Доповни light_recipe.md усіма сьогоднішніми числами, а також Intensity сонця й Intensity у Sky Light. Перевірка: у рецепті немає слів «приблизно» чи «трохи». (from lesson 3)\n8. C1: край причалу — провідна лінія в кадр, фасад крамниці — на третині, горизонт рівний (Roll 0). Заблокуй камеру. Перевірка: на копії скриншота з лініями третин, намальованими в Krita, фасад стоїть на лінії. (from lesson 4)\n9. C2: друга Cine Camera Actor на висоті 25–30 м, 18–24 мм. Вмісти в кадр увесь набір і воду, а небо — у верхню третину. Заблокуй камеру. Перевірка: пірс, будівлю й воду можна прочитати за 3 секунди. (from lesson 4)\n10. Керуй кожною камерою (Pilot), натисни G, зроби скриншоти (Win+Shift+S) і збережи як harbour_C1.png і harbour_C2.png. Слабкий ПК: для цих кадрів перемкни Scalability на High, потім назад на Medium, і запиши це в light_recipe.md. Перевірка: обидва кадри лежать у робочій папці дня. (from lesson 4)\n11. Золото (за бажанням): тест повторюваності. Зроби копію L_HarbourCorner (Duplicate) з назвою L_HarbourCorner_LightTest, скинь значення сонця, Sky Light, туману й постобробки й відтвори їх лише за light_recipe.md. Постав обидва кадри C1 поруч і збережи як c1_match.png. Перевірка: вони виглядають як одне фото. (from lesson 3)\n12. Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: кожна назва зі списку є в папці, у кожної є розмір. (from day 0, lesson 1)\n\nHow to help: ask which step number I'm on, then give me only the next step: the exact clicks and what I should see. When I send a screenshot, compare it with my reference, my sizes and the spec, and name one thing to fix at a time.\nCheck every save and export by reopening it before we move on:\n- a .md or .txt: open it with Notepad; the text is there, and the name doesn't end in .md.txt\nWhen I write \"готово\", and in any case before the day ends, check with me one item at a time (yes/no): each spec point, then each file on my hand-in list, ready in my day work folder (skip summary.md: the day report writes it next):\n1. light_recipe.md (усі числа твого світла) (→ День 30)\n2. harbour_C2.png (кадр із заблокованої високої камери) (→ День 20)\n3. harbour_C1.png (кадр із заблокованої низької камери) (доказ)\nFinish with a short list of anything missing, and one line on where this work comes back and what it will look like there. Then tell me the order for the end of the day: first the day report (the Copy the day report button at the bottom of my course page) into summary.md, and only then hand in all the files on the list, summary.md too.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; checklist = чек-лист; reference photo / hero photo = фото-референс / ключове фото; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); File Explorer = Провідник; vertex / edge / face = вершина / ребро / грань; origin (and kit pivot) = origin — точка, за яку об'єкт ставлять і обертають; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); UV unwrap / UV layout / seam / UV island = розгортка / розкладка / шов / UV-острівець; level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; collision / UCX collision box = колізія / блок UCX; volume (PCG Volume, Post Process Volume) = об'єм; keep-out zone / footprint test / grounding = зона-виняток / тест опори / посадка на ґрунт; kit / kit piece / part of one object = набір / деталь / частина; map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; harbour / quay / waterfront / pier = гавань / причал / набережна / пірс; shop front / shop window = фасад крамниці / вітрина; trim sheet / decal = трим-шит / декаль; wear / worn edges / salt line = зношеність / стерті краї / сольова лінія; locked camera / locked exposure = заблокована камера / зафіксована експозиція; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; hero shot = головний кадр (hero shot); proof (picture) = доказ; shot set = серія кадрів.\n\nStart by asking for my best reference photo. Then, one at a time, my sizes and my step number.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into s function seg(str,cls){str=String(str);const W=15,H=26,t=2.8,g=.9,P={a:[[g+t/2,0],[W-g-t/2,0],[W-g-t,t],[g+t,t]],d:[[g+t,H-t],[W-g-t,H-t],[W-g-t/2,H],[g+t/2,H]],g:[[g+t,H/2-t/2],[W-g-t,H/2-t/2],[W-g-t/2,H/2],[W-g-t,H/2+t/2],[g+t,H/2+t/2],[g+t/2,H/2]],f:[[0,g+t/2],[t,g+t],[t,H/2-g-t/2],[t/2,H/2-g],[0,H/2-g-t/2]],b:[[W,g+t/2],[W,H/2-g-t/2],[W-t/2,H/2-g],[W-t,H/2-g-t/2],[W-t,g+t]],e:[[0,H/2+g+t/2],[t/2,H/2+g],[t,H/2+g+t/2],[t,H-g-t],[0,H-g-t/2]],c:[[W,H/2+g+t/2],[W,H-g-t/2],[W-t,H-g-t],[W-t,H/2+g+t/2],[W-t/2,H/2+g]]};
 let x=0,o='';for(const ch of str){if(ch===' '){x+=8;continue}if(ch==='/'){o+='<path class="on" d="M'+(x+9)+' 2L'+(x+2)+' '+(H-2)+'L'+(x+4.5)+' '+(H-2)+'L'+(x+11.5)+' 2Z"/>';x+=15;continue}const on=SEG[ch]||'';
  for(const k of 'abcdefg')o+='<polygon class="'+(on.includes(k)?'on':'gh')+'" points="'+P[k].map(p=>(p[0]+x).toFixed(1)+','+p[1].toFixed(1)).join(' ')+'"/>';x+=W+5}

function island(state,pct,label){
 const cx=300,cy=205,R=172,TAU=Math.PI*2;

 const pt=(t,s,k)=>{const r=rad(t,s,k||0);return [cx+r*Math.cos(t),cy+r*Math.sin(t)*.78]};
 const f=n=>n.toFixed(1);
 const smooth=(P,closed)=>{let d='M'+f(P[0][0])+' '+f(P[0][1]);const n=P.length,g=i=>P[closed?(i+n)%n:Math.max(0,Math.min(n-1,i))];
  for(let i=0;i<(closed?n:n-1);i++){const p0=g(i-1),p1=g(i),p2=g(i+1),p3=g(i+2);d+='C'+f(p1[0]+(p2[0]-p0[0])/6)+' '+f(p1[1]+(p2[1]-p0[1])/6)+' '+f(p2[0]-(p3[0]-p1[0])/6)+' '+f(p2[1]-(p3[1]-p1[1])/6)+' '+f(p2[0])+' '+f(p2[1])}return d+(closed?'Z':'')};
 const ring=(s,k)=>{const P=[];for(let i=0;i<64;i++)P.push(pt(i/64*TAU,s,k));return smooth(P,true)};
 let o='<path class="c0" d="'+ring(1,0)+'"/>';
 [.84,.69,.55,.42,.3,.19,.1].forEach((s,k)=>o+='<path class="c" d="'+ring(s,k+1)+'"/>');
 const t0=-2.2,turns=1.55,wp=w=>{const t=(w-1)/11;return {a:t0+t*turns*TAU,s:1.1-t*.98}};
 const P=[],D=[];let last=0;for(let w=1;w<=12;w++)if(state(w)!=='p')last=w;
 for(let i=0;i<=110;i++){const t=i/110,a=t0+t*turns*TAU,s=1.1-t*.98,q=pt(a,s,0);P.push(q);if(last&&t<=(last-1)/11+1e-9)D.push(q)}
 o+='<path class="rt" d="'+smooth(P,false)+'"/>';

 for(let w=1;w<=12;w++){const c=state(w),{a,s}=wp(w),q=pt(a,s,0),lx=q[0]+(Math.cos(a)>=0?15:-15),an=Math.cos(a)>=0?'start':'end';
  o+='<g class="w '+c+'">'+(c==='n'?'<circle class="halo" cx="'+f(q[0])+'" cy="'+f(q[1])+'" r="12"/>':'')+'<circle class="dot" cx="'+f(q[0])+'" cy="'+f(q[1])+'" r="'+(c==='p'?4.5:c==='n'?8:6)+'"/><text x="'+f(lx)+'" y="'+f(q[1]+5.5)+'" text-anchor="'+an+'">'+String(w).padStart(2,'0')+'</text></g>'}

 s+='<circle class="face" cx="200" cy="200" r="168"/><circle class="track" cx="200" cy="200" r="176"/>';
 s+='<circle class="arc" cx="200" cy="200" r="176" stroke="url(#'+id+'g)" stroke-dasharray="'+(C*p).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 200 200)"/>';

 if(label)s+='<text class="rimt"><textPath href="#'+id+'" startOffset="25%" text-anchor="middle">'+label+'</textPath></text>';

 return s+'</svg>'}

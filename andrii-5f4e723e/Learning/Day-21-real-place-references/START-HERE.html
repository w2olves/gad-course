<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 21</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

day work folder.", "uk": "IslandCourse: новий рівень Content/Island/Preview/L_IslandPreview. У робочій папці дня (Day21) лежать osm_view.png, твоє фото, map_notes.md і island_map.kra. Файл credits.md лишається в папці GAD на ПК, на рівень вище за робочу папку дня."}, "spec": [{"en": "L_IslandPreview: a Plane at 0, 0, 0 with Scale 2000, 2000, 1, the 2 x 2 km sea your island sits in, and a Cine Camera CAM_Preview.", "uk": "L_IslandPreview: Plane у 0, 0, 0 зі Scale 2000, 2000, 1 — море 2 × 2 км, у якому стоїть твій острів, — і Cine Camera CAM_Preview."}, {"en": "Your real place: a present-day small island or coastal town 0.5 to 3 km across, or a 1 km stretch of a longer coast. It has a harbour and a second kind of place: a hillside village, a lighthouse headland or a farm valley.", "uk": "Твоє реальне місце: сучасний невеликий острів чи прибережне містечко завширшки 0,5–3 км або 1-кілометрова ділянка довшого узбережжя. Там є гавань і другий тип місцевості: село на схилі, мис із маяком або долина з фермами."}, {"en": "osm_view.png, an OpenStreetMap screenshot with its scale bar, draped on a Plane at true size beside the mannequin, with its OpenStreetMap line in credits.md.", "uk": "osm_view.png — скриншот OpenStreetMap зі шкалою масштабу, натягнутий на Plane у справжньому розмірі поруч із манекеном. У credits.md є його рядок OpenStreetMap."}, {"en": "map_notes.md, the one notes file for this week: the place's name, metres per pixel of osm_view.png, and its longest axis in metres.", "uk": "map_notes.md — один файл нотаток на весь тиждень: назва місця, метри на піксель для osm_view.png і найдовша вісь у метрах."}, {"en": "One photo of the place you like, from any source, kept private as your reference; no credit line is needed.", "uk": "Одне фото місця, яке тобі подобається, з будь-якого джерела. Воно лишається твоїм особистим референсом, тож рядок авторства не потрібен."}, {"en": "island_map.kra: 2000 x 2000 px at 1 px = 1 m, with the layers sea, guide, land, height, water, districts, roads, route, labels and scale_north. Today it holds the guide and your island's coast, 0.9 to 1.2 km long, with two bays and two headlands.", "uk": "island_map.kra: 2000 × 2000 px у масштабі 1 px = 1 м, шари sea, guide, land, height, water, districts, roads, route, labels і scale_north. Сьогодні в ньому шар guide і узбережжя острова завдовжки 0,9–1,2 км із двома затоками й двома мисами."}], "piece1": "the preview level and your real place draped at true size (shared with the lessons)", "piece2": {"en": "Your island's coast, drawn to scale, on your own", "uk": "Узбережжя твого острова в масштабі — самостійно"}, "steps": [{"text": {"en": "Check: the files from today's lessons are in the day work folder (osm_view.png, map_notes.md and your photo), and L_IslandPreview in IslandCourse holds the sea and your real place. Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it. Check: L_IslandPreview opens with both Planes.", "uk": "Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: osm_view.png, map_notes.md і твоє фото. L_IslandPreview в IslandCourse має містити море й твоє реальне місце. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Перевірка: L_IslandPreview відкривається з обома Plane."}, "lesson": 1}, {"text": {"en": "Test the drape: drop a 1 m cube at each end of your place's longest axis and read the length with a middle-mouse drag in the Top view. Check: it matches the longest axis in map_notes.md within about 10 %; if not, fix the Plane's Scale.", "uk": "Перевір накладену мапу: постав куб 1 м на кожен кінець найдовшої осі місця й на виді Top протягни середньою кнопкою миші, щоб прочитати довжину. Перевірка: вона відрізняється від найдовшої осі в map_notes.md не більш ніж приблизно на 10 %. Якщо більше, виправ Scale площини."}, "lesson": 4}, {"text": {"en": "Play (Alt+P) and walk your mannequin onto the real quay, then pilot CAM_Preview along the coast at 30 m. Check: a car or a boat on the photo would fit beside the mannequin at its real size.", "uk": "Запусти Play (Alt+P) і проведи манекен на справжній причал, а потім пролети камерою CAM_Preview уздовж узбережжя на висоті 30 м. Перевірка: автомобіль чи човен на фото помістився б поруч із манекеном у справжньому розмірі."}, "lesson": 4}, {"text": {"en": "In Krita make island_map.kra: 2000 x 2000 px, the ten layers, the sea filled, a 100 px scale bar and a north arrow. Check: the rulers (View > Show Rulers) read 2000 on both edges.", "uk": "Зроби в Krita island_map.kra: 2000 × 2000 px, десять шарів, залите море, шкала масштабу 100 px і стрілка півночі. Перевірка: лінійки (View > Show Rulers) по обох краях доходять до 2000."}, "lesson": 3}, {"text": {"en": "Put osm_view.png on the guide layer at true scale: Ctrl+T, scale = metres per pixel x 100 %. Set it to 30 % and lock it. Check: the longest axis is as many pixels long as it is metres.", "uk": "Поклади osm_view.png на шар guide у справжньому масштабі: Ctrl+T, масштаб = метри на піксель × 100 %. Постав непрозорість 30 % і заблокуй шар. Перевірка: у найдовшій осі стільки пікселів, скільки метрів."}, "lesson": 3}, {"text": {"en": "Paint your island's land, 0.9 to 1.2 km across, shaped from the guide but changed into your own. Check: the Measure tool reads 900 to 1200 px along the longest axis.", "uk": "Намалюй сушу свого острова завширшки 0,9–1,2 км: за формою шару guide, але перероблену на твою власну. Перевірка: інструмент Measure показує 900–1200 px уздовж найдовшої осі."}, "lesson": 3}, {"text": {"en": "Shape the coast: two or three bays and two headlands. Mark beaches in sheltered bays and cliffs on headlands facing the open sea, then save (Ctrl+S). Check: no straight stretch is longer than about 50 px, and island_map.kra reopens with the coast.", "uk": "Сформуй узбережжя: дві-три затоки й два миси. Познач пляжі в захищених затоках і скелі на мисах, відкритих до моря, потім збережи (Ctrl+S). Перевірка: жодна пряма ділянка не довша за 50 px, а island_map.kra знову відкривається з узбережжям."}, "lesson": 3}, {"text": {"en": "Proof: pilot CAM_Preview to 30 m over the real harbour with the mannequin on the quay and save preview_day21.png (Win+Shift+S). Press Ctrl+S in Unreal. Check: the picture shows the quay and the mannequin at true size.", "uk": "Доказ: підніми CAM_Preview на 30 м над справжньою гаванню, де на причалі стоїть манекен, і збережи preview_day21.png (Win+Shift+S). Натисни Ctrl+S в Unreal. Перевірка: на зображенні видно причал і манекен у справжньому розмірі."}, "lesson": 4}, {"text": {"en": "Report and hand-in: click Copy the day report at the bottom of the page, paste it into a new chat and answer. Open summary.md in Notepad, press Ctrl+End, paste the answer and press Ctrl+S. Then drag the files on the Hand in list into your hand-in folder. Check: every name shows in the folder, each with a size.", "uk": "Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: кожна назва зі списку є в папці, у кожної є розмір."}, "lesson": "D0.1"}], "assets": ["island12/credits-template.md"]}, "lessons": [{"title": {"en": "Your island's sea in Unreal", "uk": "Море твого острова в Unreal"}, "minutes": 40, "goals": [{"en": "Make a preview level where you see your island at real size before the terrain week.", "uk": "Створювати макет острова — рівень, де видно острів у справжньому розмірі ще до тижня рельєфу."}, {"en": "Feel big scale: a 2 km sea, a 1 km island, a drone at 150 m.", "uk": "Відчувати великий масштаб: море 2 км, острів 1 км, дрон на висоті 150 м."}, {"en": "Pilot a Cine Camera to a typed height.", "uk": "Піднімати Cine Camera на введену висоту й керувати нею."}], "doalong": [{"en": "In IslandCourse choose File > New Level > Basic and save it as L_IslandPreview in a new folder, Content/Island/Preview. Older Unreal (4.27) or weak PC: choose Default instead of Basic. You should see L_IslandPreview in the title bar.", "uk": "В IslandCourse вибери File > New Level > Basic і збережи рівень як L_IslandPreview у новій папці Content/Island/Preview. Старіший Unreal (4.27) або слабкий ПК: замість Basic вибери Default. У заголовку вікна — L_IslandPreview."}, {"en": "Delete the Floor. Place Actors > Shapes > Plane, Location 0, 0, 0, Scale 2000, 2000, 1. You should see a flat square 2 km across: your island's whole world.", "uk": "Видали Floor. Place Actors > Shapes > Plane, Location 0, 0, 0, Scale 2000, 2000, 1. З'являється рівний квадрат 2 км завширшки — увесь світ твого острова."}, {"en": "Press Play (Alt+P) and run from the middle towards an edge for 30 seconds, then press Esc. You should see the edge still far away: 1 km is a long walk.", "uk": "Натисни Play (Alt+P) і 30 секунд біжи від середини до краю, потім натисни Esc. Край досі далеко: 1 км — це довга дорога пішки."}, {"en": "Place Actors > Cinematic > Cine Camera Actor, name it CAM_Preview and set Location Z to 15000 (150 m). Right-click it > Pilot. You should see the whole square from drone height.", "uk": "Place Actors > Cinematic > Cine Camera Actor, назви її CAM_Preview і постав Location Z 15000 (150 м). Клацни її правою кнопкою > Pilot. Увесь квадрат видно з висоти дрона."}, {"en": "Click the eject button at the top left of the viewport and press Ctrl+S. You should see no star on the level's tab.", "uk": "Клацни кнопку виходу з пілотування вгорі ліворуч у в'юпорті й натисни Ctrl+S. На вкладці рівня немає зірочки."}], "play": {"en": "Scale guess: the tutor names five things (a fishing boat, a lighthouse, a church, a quay, a ferry). I guess how many would fit across my 2 km sea, then check one with a scaled cube.", "uk": "Вгадай масштаб: тьютор називає п'ять речей (рибальський човен, маяк, церкву, причал, пором). Я вгадую, скільки їх поміститься впоперек мого моря 2 км, а потім перевіряю одну кубом потрібного розміру."}, "video": {"search": "unreal engine 5 scale units metres beginner"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Море твого острова в Unreal (Day 21, lesson 1 of 4). Today's build: L_IslandPreview — макет острова: рівень із морем 2 км і твоїм реальним місцем, накладеним на нього в справжньому розмірі, а також island_map.kra з узбережжям твого острова.\nWhat I already know: День 16: palette_<place>.png, названий за твоїм улюбленим місцем, із запасним варіантом, записаним у кутку; День 0: проєкт IslandCourse і манекен як твоя лінійка.\n\nBy the end of this lesson I can:\n1. Створювати макет острова — рівень, де видно острів у справжньому розмірі ще до тижня рельєфу.\n2. Відчувати великий масштаб: море 2 км, острів 1 км, дрон на висоті 150 м.\n3. Піднімати Cine Camera на введену висоту й керувати нею.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: Чотири тижні — і в тебе є набір для гавані з текстурами й зношеністю та освітлений куточок гавані 30 × 30 м, повністю твоєї роботи. Today: Сьогодні ти розстеляєш море 2 км у власному рівні L_IslandPreview в Unreal, кладеш на нього своє справжнє місце на узбережжі в реальному розмірі й пролітаєш над ним, а тоді малюєш у масштабі узбережжя свого острова. One encouraging line: Побачити справжню гавань у реальному розмірі поруч із манекеном — чудова мить, тож політай навколо й відчуй масштаб.); 2 lines on why today matters and where it comes back, in plain words (from this: Сьогодні ти пролітаєш над справжньою гаванню на висоті дрона у власному рівні й починаєш свій острів. Реальне місце дає розміри, яких не вигадаєш, як-от ширину входу в гавань. Студії завжди перевіряють масштаб саме так, ще до будівництва. It comes back: Завтра на мапі з'являться пагорби, два райони й маршрут прольоту, і вона ляже на те саме море. До п'ятниці там стоятиме весь острів як макет, крізь який можна пролетіти, а в День 26 мапа стане справжнім рельєфом.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-21-real-place-references exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (макет острова і твоє реальне місце в справжньому розмірі (разом з уроками)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. В IslandCourse вибери File > New Level > Basic і збережи рівень як L_IslandPreview у новій папці Content/Island/Preview. Старіший Unreal (4.27) або слабкий ПК: замість Basic вибери Default. У заголовку вікна — L_IslandPreview.\n   2. Видали Floor. Place Actors > Shapes > Plane, Location 0, 0, 0, Scale 2000, 2000, 1. З'являється рівний квадрат 2 км завширшки — увесь світ твого острова.\n   3. Натисни Play (Alt+P) і 30 секунд біжи від середини до краю, потім натисни Esc. Край досі далеко: 1 км — це довга дорога пішки. [screenshot]\n   4. Place Actors > Cinematic > Cine Camera Actor, назви її CAM_Preview і постав Location Z 15000 (150 м). Клацни її правою кнопкою > Pilot. Увесь квадрат видно з висоти дрона.\n   5. Клацни кнопку виходу з пілотування вгорі ліворуч у в'юпорті й натисни Ctrl+S. На вкладці рівня немає зірочки. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Вгадай масштаб: тьютор називає п'ять речей (рибальський човен, маяк, церкву, причал, пором). Я вгадую, скільки їх поміститься впоперек мого моря 2 км, а потім перевіряю одну кубом потрібного розміру. Otherwise skip it.\n6. Review: ask me these questions from earlier days, one at a time, and correct me kindly: Day 18: why is a salt-line decal cheaper than painting the salt line into every wall texture? | Day 16: why is a sunlit white wall's base colour not pure white?\n7. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n8. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; review (by tutor or art director) = огляд; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); File Explorer = Провідник; vertex / edge / face = вершина / ребро / грань; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; kit / kit piece / part of one object = набір / деталь / частина; map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; district / plot / plot plan = район / ділянка / план ділянки; harbour / quay / waterfront / pier = гавань / причал / набережна / пірс; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; trim sheet / decal = трим-шит / декаль; wear / worn edges / salt line = зношеність / стерті краї / сольова лінія; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ; shot set = серія кадрів.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}, {"title": {"en": "Your real place on OpenStreetMap", "uk": "Твоє реальне місце на OpenStreetMap"}, "minutes": 40, "goals": [{"en": "Explain why a world built on a real place looks believable: real places give true sizes, shapes and reasons.", "uk": "Пояснювати, чому світ, побудований на реальному місці, виглядає правдоподібно: реальні місця дають справжні розміри, форми й причини."}, {"en": "Choose a place by three rules: 0.5 to 3 km across, a harbour, and a second kind of place (a hillside village, a lighthouse headland or a farm valley).", "uk": "Вибирати місце за трьома правилами: 0,5–3 км завширшки, є гавань і другий тип місцевості (село на схилі, мис із маяком або долина з фермами)."}, {"en": "Take a map picture with its scale bar and read metres per pixel from it.", "uk": "Знімати зображення мапи зі шкалою масштабу й обчислювати за ним метри на піксель."}], "doalong": [{"en": "Open palette_<place>.png: its name is your favourite place, and the runner-up is in its corner. Search the favourite on openstreetmap.org and zoom until it fills the screen. You should see a harbour and the town round it.", "uk": "Відкрий palette_<place>.png: його назва — це твоє улюблене місце, а запасний варіант записано в кутку. Знайди улюблене місце на openstreetmap.org і наближай, поки воно не заповнить екран. Видно гавань і містечко навколо."}, {"en": "Check the rules: 0.5 to 3 km across (or pick a 1 km stretch of a longer coast), a harbour, and a second kind of place. If it fails, try the runner-up. You should be able to point at both kinds of place.", "uk": "Перевір правила: 0,5–3 км завширшки (або вибери 1-кілометрову ділянку довшого узбережжя), є гавань і другий тип місцевості. Якщо місце не підходить, спробуй запасний варіант. Покажи на мапі обидва типи місцевості."}, {"en": "Zoom so the place, some sea and the scale bar (bottom left) all show. Press Win+Shift+S and drag a box over it. In Krita choose Edit > Paste into New Image and export it to Day21 as osm_view.png. You should see the map and its scale bar.", "uk": "Наблизь так, щоб було видно місце, трохи моря й шкалу масштабу (унизу ліворуч). Натисни Win+Shift+S і обведи рамкою. У Krita вибери Edit > Paste into New Image і експортуй у Day21 як osm_view.png. Має вийти мапа зі шкалою масштабу."}, {"en": "Pick the Measure tool, set Pixels in Tool Options and drag along the scale bar. Divide its metres by its pixels, then measure the longest axis. Write the place's name, metres per pixel and longest axis in a new file, map_notes.md. You should have three lines.", "uk": "Вибери інструмент Measure, у Tool Options постав Pixels і протягни вздовж шкали масштабу. Поділи її метри на пікселі, потім виміряй найдовшу вісь. Запиши назву місця, метри на піксель і найдовшу вісь у новий файл map_notes.md. Має вийти три рядки."}, {"en": "Open credits.md in GAD on your PC (copy credits-template.md there from today's assets if you have none) and add: 'osm_view.png: map data © OpenStreetMap contributors, https://www.openstreetmap.org/copyright'. You should see the line.", "uk": "Відкрий credits.md у папці GAD на ПК (якщо його немає, скопіюй туди credits-template.md із сьогоднішніх assets) і додай: «osm_view.png: map data © OpenStreetMap contributors, https://www.openstreetmap.org/copyright». Рядок з'являється у файлі."}], "play": {"en": "Place pitch: I pitch my place to the tutor in 60 seconds. It asks three hard questions (too big? where is the harbour? where is the second district?) and I answer each with a fact from the map.", "uk": "Презентація місця: я за 60 секунд презентую тьютору своє місце. Він ставить три складні запитання (чи не завелике? де гавань? де другий район?), і я відповідаю на кожне фактом із мапи."}, "video": {"search": "openstreetmap beginner guide how to use the map"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Твоє реальне місце на OpenStreetMap (Day 21, lesson 2 of 4). Today's build: L_IslandPreview — макет острова: рівень із морем 2 км і твоїм реальним місцем, накладеним на нього в справжньому розмірі, а також island_map.kra з узбережжям твого острова.\nWhat I already know: День 16: palette_<place>.png, названий за твоїм улюбленим місцем, із запасним варіантом, записаним у кутку; День 0: проєкт IslandCourse і манекен як твоя лінійка.\nEarlier today I already did: lesson 1 (Море твого острова в Unreal). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Пояснювати, чому світ, побудований на реальному місці, виглядає правдоподібно: реальні місця дають справжні розміри, форми й причини.\n2. Вибирати місце за трьома правилами: 0,5–3 км завширшки, є гавань і другий тип місцевості (село на схилі, мис із маяком або долина з фермами).\n3. Знімати зображення мапи зі шкалою масштабу й обчислювати за ним метри на піксель.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: 2 lines on why today matters and where it comes back, in plain words (from this: Сьогодні ти пролітаєш над справжньою гаванню на висоті дрона у власному рівні й починаєш свій острів. Реальне місце дає розміри, яких не вигадаєш, як-от ширину входу в гавань. Студії завжди перевіряють масштаб саме так, ще до будівництва. It comes back: Завтра на мапі з'являться пагорби, два райони й маршрут прольоту, і вона ляже на те саме море. До п'ятниці там стоятиме весь острів як макет, крізь який можна пролетіти, а в День 26 мапа стане справжнім рельєфом.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-21-real-place-references exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (макет острова і твоє реальне місце в справжньому розмірі (разом з уроками)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Відкрий palette_<place>.png: його назва — це твоє улюблене місце, а запасний варіант записано в кутку. Знайди улюблене місце на openstreetmap.org і наближай, поки воно не заповнить екран. Видно гавань і містечко навколо.\n   2. Перевір правила: 0,5–3 км завширшки (або вибери 1-кілометрову ділянку довшого узбережжя), є гавань і другий тип місцевості. Якщо місце не підходить, спробуй запасний варіант. Покажи на мапі обидва типи місцевості.\n   3. Наблизь так, щоб було видно місце, трохи моря й шкалу масштабу (унизу ліворуч). Натисни Win+Shift+S і обведи рамкою. У Krita вибери Edit > Paste into New Image і експортуй у Day21 як osm_view.png. Має вийти мапа зі шкалою масштабу. [screenshot]\n   4. Вибери інструмент Measure, у Tool Options постав Pixels і протягни вздовж шкали масштабу. Поділи її метри на пікселі, потім виміряй найдовшу вісь. Запиши назву місця, метри на піксель і найдовшу вісь у новий файл map_notes.md. Має вийти три рядки.\n   5. Відкрий credits.md у папці GAD на ПК (якщо його немає, скопіюй туди credits-template.md із сьогоднішніх assets) і додай: «osm_view.png: map data © OpenStreetMap contributors, https://www.openstreetmap.org/copyright». Рядок з'являється у файлі. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Презентація місця: я за 60 секунд презентую тьютору своє місце. Він ставить три складні запитання (чи не завелике? де гавань? де другий район?), і я відповідаю на кожне фактом із мапи. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; see-why-fix note = нотатка «бачу, чому, як виправити»; credits line = рядок авторства; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); File Explorer = Провідник; vertex / edge / face = вершина / ребро / грань; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; kit / kit piece / part of one object = набір / деталь / частина; map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; district / plot / plot plan = район / ділянка / план ділянки; harbour / quay / waterfront / pier = гавань / причал / набережна / пірс; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; trim sheet / decal = трим-шит / декаль; wear / worn edges / salt line = зношеність / стерті краї / сольова лінія; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}, {"title": {"en": "A map canvas at real scale", "uk": "Полотно для мапи в реальному масштабі"}, "minutes": 40, "goals": [{"en": "Set up a Krita canvas where 1 pixel is 1 metre: 2000 x 2000 px for a 2 x 2 km square, north up.", "uk": "Налаштовувати полотно Krita, де 1 піксель — це 1 метр: 2000 × 2000 px для квадрата 2 × 2 км, північ угорі."}, {"en": "Use map coordinates: the centre is (0, 0), X grows east and Y grows south. So X = pixel across - 1000, and Y = pixel down - 1000.", "uk": "Користуватися координатами мапи: центр — (0, 0), X зростає на схід, а Y — на південь. Отже, X = піксель по горизонталі − 1000, а Y = піксель по вертикалі − 1000."}, {"en": "Draw a coast like a real one: headlands and bays, beaches in sheltered bays, cliffs facing the open sea.", "uk": "Малювати узбережжя, як справжнє: миси й затоки, пляжі в захищених затоках, скелі проти відкритого моря."}], "doalong": [{"en": "In Krita: File > New, 2000 x 2000 px. Add layers sea, guide, land, height, water, districts, roads, route, labels and scale_north, and save it in the day work folder as island_map.kra. You should see ten named layers.", "uk": "У Krita: File > New, 2000 × 2000 px. Додай шари sea, guide, land, height, water, districts, roads, route, labels і scale_north і збережи файл у робочій папці дня як island_map.kra. Має вийти десять названих шарів."}, {"en": "Fill the sea layer pale blue. On scale_north, hold Shift and draw a 100 px line labelled '100 m', and an N arrow at the top right. You should see a scale bar and a north arrow.", "uk": "Залий шар sea блідо-блакитним. На шарі scale_north утримуй Shift і проведи лінію 100 px із підписом «100 м», а вгорі праворуч намалюй стрілку N. Має вийти: є шкала масштабу і стрілка півночі."}, {"en": "Choose View > Show Rulers and find 1000 on both: that point is (0, 0). A point at 1300 across and 700 down is X 300, Y -300. You should be able to read any point in metres.", "uk": "Вибери View > Show Rulers і знайди 1000 на обох лінійках: ця точка — (0, 0). Точка 1300 по горизонталі і 700 по вертикалі — це X 300, Y −300. Тепер будь-яку точку можна прочитати в метрах."}, {"en": "Drag osm_view.png onto the guide layer, press Ctrl+T and scale it by metres per pixel x 100 %. Set it to 30 % and lock it. You should see your real place at true size.", "uk": "Перетягни osm_view.png на шар guide, натисни Ctrl+T і зміни масштаб на «метри на піксель × 100 %». Постав непрозорість 30 % і заблокуй шар. Реальне місце лежить у справжньому розмірі."}, {"en": "On the land layer, paint a first rough island with a hard round brush, following the guide where you like it. You should see an island near the middle of the sea.", "uk": "На шарі land намалюй перший грубий острів твердим круглим пензлем, ідучи за шаром guide там, де тобі подобається. Має вийти острів біля середини моря."}], "play": {"en": "Coordinate quick-fire: the tutor reads me ten pixel positions; I give each as X and Y in metres within 10 seconds. A wrong sign on Y costs double.", "uk": "Бліц координат: тьютор зачитує мені десять позицій у пікселях. Я називаю кожну як X і Y у метрах за 10 секунд. Неправильний знак у Y коштує подвійно."}, "video": {"url": "https://www.youtube.com/watch?v=W0d6635Rits", "title": "Unreal Engine Co-ordinates Explained", "channel": "HyperDev", "length": "3:24", "search": "unreal engine coordinates explained units"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a змірі.\n   5. На шарі land намалюй перший грубий острів твердим круглим пензлем, ідучи за шаром guide там, де тобі подобається. Має вийти острів біля середини моря. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Бліц координат: тьютор зачитує мені десять позицій у пікселях. Я називаю кожну як X і Y у метрах за 10 секунд. Неправильний знак у Y коштує подвійно. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\nIf I want to go deeper, recommend this free video: \"Unreal Engine Co-ordinates Explained\" by HyperDev: https://www.youtube.com/watch?v=W0d6635Rits\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; p ість / стерті краї / сольова лінія; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ; shot set = серія кадрів.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}, {"title": {"en": "Your real place in Unreal at true size", "uk": "Твоє реальне місце в Unreal у справжньому розмірі"}, "minutes": 40, "goals": [{"en": "Turn a picture into a material: import it as a texture and right-click > Create Material.", "uk": "Робити з зображення матеріал: імпортувати його як текстуру й клацнути правою кнопкою > Create Material."}, {"en": "Size a Plane in real metres: the basic Plane is 1 m, so Scale 800 makes it 800 m.", "uk": "Задавати розмір Plane у справжніх метрах: базовий Plane має 1 м, тож Scale 800 робить його 800 м."}, {"en": "Read one photo for scale: a storey is about 3 m, a door 2.1 m and a person 1.7 m.", "uk": "Читати масштаб з одного фото: поверх — близько 3 м, двері — 2,1 м, людина — 1,7 м."}], "doalong": [{"en": "Drag osm_view.png into Content/Island/Preview, right-click it > Create Material, and save. You should see a material with your map on its icon.", "uk": "Перетягни osm_view.png у Content/Island/Preview, клацни правою кнопкою > Create Material і збережи. На значку матеріалу видно твою мапу."}, {"en": "Place a Plane at Location 0, 0, 10. Set Scale X to the picture's width in metres (its pixels x metres per pixel) and Scale Y to its height. Drop the material on it. You should see your real place lying on the sea.", "uk": "Постав Plane у Location 0, 0, 10. Постав Scale X рівним ширині зображення в метрах (пікселі × метри на піксель), а Scale Y — його висоті. Перетягни на нього матеріал. Реальне місце лежить на морі."}, {"en": "In the Top view, make the map read right: north at the top. Turn it with Rotation Z 90, 180 or 270, or type a minus before

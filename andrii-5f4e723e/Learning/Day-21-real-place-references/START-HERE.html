to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Твоє реальне місце в Unreal у справжньому розмірі (Day 21, lesson 4 of 4). Today's build: L_IslandPreview — макет острова: рівень із морем 2 км і твоїм реальним місцем, накладеним на нього в справжньому розмірі, а також island_map.kra з узбережжям твого острова.\nWhat I already know: День 16: palette_<place>.png, названий за твоїм улюбленим місцем, із запасним варіантом, записаним у кутку; День 0: проєкт IslandCourse і манекен як твоя лінійка.\nEarlier today I already did: lesson 1 (Море твого острова в Unreal); lesson 2 (Твоє реальне місце на OpenStreetMap); lesson 3 (Полотно для мапи в реальному масштабі). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Робити з зображення матеріал: імпортувати його як текстуру й клацнути правою кнопкою > Create Material.\n2. Задавати розмір Plane у справжніх метрах: базовий Plane має 1 м, тож Scale 800 робить його 800 м.\n3. Читати масштаб з одного фото: поверх — близько 3 м, двері — 2,1 м, людина — 1,7 м.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: 2 lines on why today matters and where it comes back, in plain words (from this: Сьогодні ти пролітаєш над справжньою гаванню на висоті дрона у власному рівні й починаєш свій острів. Реальне місце дає розміри, яких не вигадаєш, як-от ширину входу в гавань. Студії завжди перевіряють масштаб саме так, ще до будівництва. It comes back: Завтра на мапі з'являться пагорби, два райони й маршрут прольоту, і вона ляже на те саме море. До п'ятниці там стоятиме весь острів як макет, крізь який можна пролетіти, а в День 26 мапа стане справжнім рельєфом.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-21-real-place-references exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (макет острова і твоє реальне місце в справжньому розмірі (разом з уроками)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Перетягни osm_view.png у Content/Island/Preview, клацни правою кнопкою > Create Material і збережи. На значку матеріалу видно твою мапу.\n   2. Постав Plane у Location 0, 0, 10. Постав Scale X рівним ширині зображення в метрах (пікселі × метри на піксель), а Scale Y — його висоті. Перетягни на нього матеріал. Реальне місце лежить на морі. [screenshot]\n   3. Перемкнися на вид Top і зроби, щоб мапа читалася правильно: північ угорі. Поверни її полем Rotation Z на 90, 180 чи 270 або допиши мінус перед Scale X, якщо написи дзеркальні. Назви вулиць читаються.\n   4. Знайди одне фото набережної цього місця, яке тобі подобається, на будь-якому сайті й збережи в Day21. Це твій особистий референс, тож рядок авторства не потрібен. Порахуй поверхи однієї будівлі, помнож на 3 м і додай її висоту в map_notes.md. Має вийти одна висота в метрах. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Фотодетектив: тьютор називає предмет (швартовний стовпчик, маркізу кафе, драбину на причалі). Я знаходжу його на своєму фото чи накладеній мапі за 15 секунд і вгадую його розмір. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; credits line = рядок авторства; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); File Explorer = Провідник; vertex / edge / face = вершина / ребро / грань; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; kit / kit piece / part of one object = набір / деталь / частина; map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; district / plot / plot plan = район / ділянка / план ділянки; harbour / quay / waterfront / pier = гавань / причал / набережна / пірс; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; trim sheet / decal = трим-шит / декаль; wear / worn edges / salt line = зношеність / стерті краї / сольова лінія; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}], "handin": [{"en": "summary.md", "uk": "summary.md (звіт дня)"}, {"en": "osm_view.png (→ Day 22)", "uk": "osm_view.png (мапа місця) (→ День 22)"}, {"en": "island_map.kra with your coast (→ Day 22)", "uk": "island_map.kra (мапа з узбережжям) (→ День 22)"}, {"en": "preview_day21.png: your real harbour at true size with the mannequin (proof)", "uk": "preview_day21.png (справжня гавань у справжньому розмірі з манекеном) (доказ)"}], "goal": {"en": "By the end of today your real coastal place lies at true size in your own preview level in Unreal, and the coast of your own island is drawn to scale.", "uk": "До кінця дня твоє реальне прибережне місце лежить у справжньому розмірі у твоєму макеті острова в Unreal, а узбережжя твого власного острова намальовано в масштабі."}, "uses": [{"en": "Day 16: palette_<place>.png, named for your favourite place, with the runner-up written in a corner", "uk": "День 16: palette_<place>.png, названий за твоїм улюбленим місцем, із запасним варіантом, записаним у кутку"}, {"en": "Day 0: the IslandCourse project and the mannequin as your ruler", "uk": "День 0: проєкт IslandCourse і манекен як твоя лінійка"}], "quiz": [{"q": {"en": "Your favourite place from Day 16 is a coastal city 12 km long. What do you do?", "uk": "Твоє улюблене місце з Дня 16 — прибережне місто завдовжки 12 км. Що ти робиш?"}, "options": [{"en": "Drop it at once.", "uk": "Одразу відкидаю його."}, {"en": "Shrink the whole city to 1 km on your map.", "uk": "Зменшую все місто до 1 км на мапі."}, {"en": "Pick a 1 km stretch of its coast that has a harbour and a second kind of place.", "uk": "Вибираю 1-кілометрову ділянку узбережжя, де є гавань і другий тип місцевості."}, {"en": "Use the whole city: bigger is better.", "uk": "Беру все місто: що більше, то краще."}], "answer": 2, "explain": {"en": "The island is 0.9 to 1.2 km across, so a 1 km stretch keeps real sizes. Shrinking a whole city makes its streets and houses far too small.", "uk": "Острів має від 0,9 до 1,2 км завширшки, тож 1-кілометрова ділянка зберігає реальні розміри. Якщо зменшити все місто, його вулиці й будинки стануть надто малими."}}, {"q": {"en": "You put a photo on a sheet that you will show. Which of these licences rules it out?", "uk": "Ти ставиш фото на аркуш, який показуватимеш. Яка з цих ліцензій це забороняє?"}, "options": [{"en": "CC BY-SA 4.0", "uk": "CC BY-SA 4.0"}, {"en": "Public domain", "uk": "Суспільне надбання"}, {"en": "CC BY-NC 2.0", "uk": "CC BY-NC 2.0"}, {"en": "CC BY 3.0", "uk": "CC BY 3.0"}], "answer": 2, "explain": {"en": "NC means non-commercial only. Your portfolio is professional work, so the course skips NC photos.", "uk": "NC означає лише некомерційне використання. Твоє портфоліо — це професійна робота, тому курс пропускає фото з NC."}}, {"q": {"en": "A photo's page says 'Uploaded by MapFan22' and 'Author: Ana Kovač'. Whose name goes in credits.md?", "uk": "На сторінці фото написано «Uploaded by MapFan22» і «Author: Ana Kovač». Чиє ім'я йде в credits.md?"}, "options": [{"en": "Ana Kovač, the author.", "uk": "Ana Kovač, авторка."}, {"en": "MapFan22, the uploader.", "uk": "MapFan22, той, хто завантажив."}, {"en": "Nobody: Commons photos are free.", "uk": "Нічиє: фото з Commons безкоштовні."}, {"en": "Wikimedia Commons.", "uk": "Wikimedia Commons."}], "answer": 0, "explain": {"en": "You credit the person who made the photo. The uploader only put it online.", "uk": "Ти вказуєш людину, яка зробила фото. Той, хто завантажив, лише виклав його в мережу."}}, {"q": {"en": "In one of your photos a harbour building has 4 storeys. About how tall is it?", "uk": "На одному з твоїх фото будівля в гавані має 4 поверхи. Яка її приблизна висота?"}, "options": [{"en": "About 6 m", "uk": "Близько 6 м"}, {"en": "About 12 m", "uk": "Близько 12 м"}, {"en": "About 25 m", "uk": "Близько 25 м"}, {"en": "About 40 m", "uk": "Близько 40 м"}], "answer": 1, "explain": {"en": "A storey is about 3 m, so 4 storeys are about 12 m. Storeys, doors and people are your scale clues.", "uk": "Поверх — це близько 3 м, тож 4 поверхи — близько 12 м. Поверхи, двері й люди — твої підказки масштабу."}}, {"q": {"en": "Your reference photo comes from a travel blog. When does it need a credit line?", "uk": "Твоє фото-референс узяте з туристичного блогу. Коли йому потрібен рядок авторства?"}, "options": [{"en": "Always, even if you only look at it.", "uk": "Завжди, навіть якщо ти лише дивишся на нього."}, {"en": "Never: blog photos are free.", "uk": "Ніколи: фото з блогів безкоштовні."}, {"en": "Only if it is bigger than 1920 px.", "uk": "Лише якщо воно більше за 1920 px."}, {"en": "Only if you put it on a sheet or in your portfolio, and then it must have an allowed licence.", "uk": "Лише якщо ти ставиш його на аркуш чи в портфоліо — і тоді в нього має бути дозволена ліцензія."}], "answer": 3, "explain": {"en": "A private reference is just for your eyes. A photo you show needs an allowed licence and a line in credits.md.", "uk": "Особистий референс — лише для твоїх очей. Фото, яке ти показуєш, потребує дозволеної ліцензії й рядка в credits.md."}}], "weekInfo": {"week": 5, "title": {"en": "Your island, fast: a map, two sketches and a preview in Unreal", "uk": "Твій острів, швидко: мапа, два ескізи й макет острова в Unreal"}, "goal": {"en": "By Friday your island stands as a preview in Unreal: island_map.png to scale with two red districts and the scenic route, both districts greyboxed at real size from quick sketches, a test corner dressed with free packs, and Electric Dreams downloading.", "uk": "До п'ятниці твій острів стоїть в Unreal як макет острова: island_map.png у масштабі з двома червоними районами й мальовничим маршрутом, обидва райони зі швидких ескізів зібрано із сірих блоків у справжньому розмірі, пробний куточок прикрашено безкоштовними паками, а Electric Dreams завантажується."}, "skills": [{"en": "Scaled world maps from OpenStreetMap data, with districts, roads and a flight route", "uk": "Мапи світу в масштабі за даними OpenStreetMap: райони, дороги й маршрут прольоту"}, {"en": "Quick district sketches with counts, drone lanes and camera positions", "uk": "Швидкі ескізи районів із підрахунками, польотними коридорами й позиціями камер"}, {"en": "Greyboxing at real scale in Unreal: a district in plain boxes you can walk and fly through", "uk": "Сірі блоки (greybox) у справжньому масштабі в Unreal: район із простих блоків, яким можна пройти й пролетіти"}, {"en": "Asset sourcing: Fab licences, free packs and a pack's best pieces in a dressed test corner", "uk": "Пошук асетів: ліцензії Fab, безкоштовні паки й найкращі деталі пака в прикрашеному пробному куточку"}, {"en": "Preview shots, a fly-over clip and a studio-style review", "uk": "Кадри макета острова, кліп прольоту й огляд у стилі студії"}]}, "morning": {"sofar": {"en": "In four weeks you have built a harbour kit, given it textures and wear, and lit a 30 x 30 m harbour corner made entirely from your own work.", "uk": "Чотири тижні — і в тебе є набір для гавані з текстурами й зношеністю та освітлений куточок гавані 30 × 30 м, повністю твоєї роботи."}, "today": {"en": "You lay a 2 km sea in your own preview level in Unreal, drape your real coastal place on it at true size and fly over it, then draw your own island's coast to scale.", "uk": "Сьогодні ти розстеляєш море 2 км у власному рівні L_IslandPreview в Unreal, кладеш на нього своє справжнє місце на узбережжі в реальному розмірі й пролітаєш над ним, а тоді малюєш у масштабі узбережжя свого острова."}, "cheer": {"en": "Seeing a real harbour at true size beside the mannequin is a great moment, so fly around it and enjoy the scale.", "uk": "Побачити справжню гавань у реальному розмірі поруч із манекеном — чудова мить, тож політай навколо й відчуй масштаб."}, "quote": {"text": {"en": "Research is formalized curiosity. It is poking and prying with a purpose.", "uk": "Дослідження — це впорядкована цікавість. Це допитливе нишпорення з певною метою."}, "author": {"en": "Zora Neale Hurston", "uk": "Зора Ніл Герстон"}, "source": "https://en.wikiquote.org/wiki/Zora_Neale_Hurston"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-21-real-place-references", "mapHref": "../../COURSE.html", "prevHref": "../Day-20-boss-harbour-corner/START-HERE.html", "nextHref": "../Day-22-island-map-to-scale/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine (5.8, or 4.27), OpenStreetMap and Krita. I am a beginner on Day 21. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me and don't write code.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: Узбережжя твого острова в масштабі — самостійно.\nIt's part of: L_IslandPreview — макет острова: рівень із морем 2 км і твоїм реальним місцем, накладеним на нього в справжньому розмірі, а також island_map.kra з узбережжям твого острова (IslandCourse: новий рівень Content/Island/Preview/L_IslandPreview. У робочій папці дня (Day21) лежать osm_view.png, твоє фото, map_notes.md і island_map.kra. Файл credits.md лишається в папці GAD на ПК, на рівень вище за робочу папку дня.).\nWhy it matters: Сьогодні ти пролітаєш над справжньою гаванню на висоті дрона у власному рівні й починаєш свій острів. Реальне місце дає розміри, яких не вигадаєш, як-от ширину входу в гавань. Студії завжди перевіряють масштаб саме так, ще до будівництва. It comes back: Завтра на мапі з'являться пагорби, два райони й маршрут прольоту, і вона ляже на те саме море. До п'ятниці там стоятиме весь острів як макет, крізь який можна пролетіти, а в День 26 мапа стане справжнім рельєфом.\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-21-real-place-references (on the drive I chose on Day 0).\nWhat I already know: День 16: palette_<place>.png, названий за твоїм улюбленим місцем, із запасним варіантом, записаним у кутку; День 0: проєкт IslandCourse і манекен як твоя лінійка; today's lessons: Море твого острова в Unreal; Твоє реальне місце на OpenStreetMap; Полотно для мапи в реальному масштабі; Твоє реальне місце в Unreal у справжньому розмірі. Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- L_IslandPreview: Plane у 0, 0, 0 зі Scale 2000, 2000, 1 — море 2 × 2 км, у якому стоїть твій острів, — і Cine Camera CAM_Preview.\n- Твоє реальне місце: сучасний невеликий острів чи прибережне містечко завширшки 0,5–3 км або 1-кілометрова ділянка довшого узбережжя. Там є гавань і другий тип місцевості: село на схилі, мис із маяком або долина з фермами.\n- osm_view.png — скриншот OpenStreetMap зі шкалою масштабу, натягнутий на Plane у справжньому розмірі поруч із манекеном. У credits.md є його рядок OpenStreetMap.\n- map_notes.md — один файл нотаток на весь тиждень: назва місця, метри на піксель для osm_view.png і найдовша вісь у метрах.\n- Одне фото місця, яке тобі подобається, з будь-якого джерела. Воно лишається твоїм особистим референсом, тож рядок авторства не потрібен.\n- island_map.kra: 2000 × 2000 px у масштабі 1 px = 1 м, шари sea, guide, land, height, water, districts, roads, route, labels і scale_north. Сьогодні в ньому шар guide і узбережжя острова завдовжки 0,9–1,2 км із двома затоками й двома мисами.\n\nMy checklist (the same numbers show on my course page):\n1. Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: osm_view.png, map_notes.md і твоє фото. L_IslandPreview в IslandCourse має містити море й твоє реальне місце. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Перевірка: L_IslandPreview відкривається з обома Plane. (from lesson 1)\n2. Перевір накладену мапу: постав куб 1 м на кожен кінець найдовшої осі місця й на виді Top протягни середньою кнопкою миші, щоб прочитати довжину. Перевірка: вона відрізняється від найдовшої осі в map_notes.md не більш ніж приблизно на 10 %. Якщо більше, виправ Scale площини. (from lesson 4)\n3. Запусти Play (Alt+P) і проведи манекен на справжній причал, а потім пролети камерою CAM_Preview уздовж узбережжя на висоті 30 м. Перевірка: автомобіль чи човен на фото помістився б поруч із манекеном у справжньому розмірі. (from lesson 4)\n4. Зроби в Krita island_map.kra: 2000 × 2000 px, десять шарів, залите море, шкала масштабу 100 px і стрілка півночі. Перевірка: лінійки (View > Show Rulers) по обох краях доходять до 2000. (from lesson 3)\n5. Поклади osm_view.png на шар guide у справжньому масштабі: Ctrl+T, масштаб = метри на піксель × 100 %. Постав непрозорість 30 % і заблокуй шар. Перевірка: у найдовшій осі стільки пікселів, скільки метрів. (from lesson 3)\n6. Намалюй сушу свого острова завширшки 0,9–1,2 км: за формою шару guide, але перероблену на твою власну. Перевірка: інструмент Measure показує 900–1200 px уздовж найдовшої осі. (from lesson 3)\n7. Сформуй узбережжя: дві-три затоки й два миси. Познач пляжі в захищених затоках і скелі на мисах, відкритих до моря, потім збережи (Ctrl+S). Перевірка: жодна пряма ділянка не довша за 50 px, а island_map.kra знову відкривається з узбережжям. (from lesson 3)\n8. Доказ: підніми CAM_Preview на 30 м над справжньою гаванню, де на причалі стоїть манекен, і збережи preview_day21.png (Win+Shift+S). Натисни Ctrl+S в Unreal. Перевірка: на зображенні видно причал і манекен у справжньому розмірі. (from lesson 4)\n9. Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: кожна назва зі списку є в папці, у кожної є розмір. (from day 0, lesson 1)\n\nHow to help: ask which step number I'm on, then give me only the next step: the exact clicks and what I should see. When I send a screenshot, compare it with my reference, my sizes and the spec, and name one thing to fix at a time.\nCheck every save and export by reopening it before we move on:\n- a .md or .txt: open it with Notepad; the text is there, and the name doesn't end in .md.txt\nWhen I write \"готово\", and in any case before the day ends, check with me one item at a time (yes/no): each spec point, then each file on my hand-in list, ready in my day work folder (skip summary.md: the day report writes it next):\n1. osm_view.png (мапа місця) (→ День 22)\n2. island_map.kra (мапа з узбережжям) (→ День 22)\n3. preview_day21.png (справжня гавань у справжньому розмірі з манекеном) (доказ)\nFinish with a short list of anything missing, and one line on where this work comes back and what it will look like there. Then tell me the order for the end of the day: first the day report (the Copy the day report button at the bottom of my course page) into summary.md, and only then hand in all the files on the list, summary.md too.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in  s+='<circle class="face" cx="200" cy="200" r="168"/><circle class="track" cx="200" cy="200" r="176"/>';
 s+='<circle class="arc" cx="200" cy="200" r="176" stroke="url(#'+id+'g)" stroke-dasharray="'+(C*p).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 200 200)"/>';
 if(p>0){const A=-Math.PI/2+p*TAU;s+='<circle class="knob'+(p<1?' go':'')+'" cx="'+(200+176*Math.cos(A)).toFixed(1)+'" cy="'+(200+176*Math.sin(A)).toFixed(1)+'" r="7"/>'}

 if(r.length)t+='\n\nMy lesson summaries, pasted from my course page:\n'+r.join('\n');

<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 51</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

<script id="data" type="application/json">{"learner": "ib-andrii-5f4e723e", "learnerName": {"en": "Andrii", "uk": "Андрій"}, "day": 51, "week": 11, "total": 60, "title": {"en": "District 2: the landmark, fences and props that tell its story", "uk": "Район 2: орієнтир, паркани й пропси, що розповідають його історію"}, "theme": {"en": "Week 11: District 2 finished", "uk": "Тиждень 11: район 2 завершено"}, "build": {"item": {"en": "SM_Landmark in its place, PCG fence runs along the land, furniture placed by use, repeated sets packed as instances, and three small stories", "uk": "SM_Landmark на своєму місці, лінії парканів із PCG уздовж рельєфу, вуличні меблі, розставлені за призначенням, повторювані комплекти, запаковані як інстанси, і три маленькі історії"}, "why": {"en": "Today district 2 gets the tower pilots will steer by, and the benches, fences and little stories that make it feel lived in. Studios place props by use and repeat them as instances, so a district looks real from 10 m and still runs fast.", "uk": "Сьогодні район 2 отримує вежу, за якою кермуватимуть пілоти, а ще лавки, паркани й маленькі історії, завдяки яким він виглядає обжитим. Студії розставляють пропси за призначенням і повторюють їх як інстанси. Так район виглядає справжнім з 10 м і при цьому працює швидко."}, "next": {"en": "The landmark becomes a turn marker on your scenic flight on Day 57 and can be a detail shot in your portfolio on Day 59. Your props are judged beside your photos on Day 54, and budget.md feeds the whole-island test on Day 56.", "uk": "Орієнтир стане точкою повороту на твоєму мальовничому прольоті в День 57, а в День 59 може стати детальним кадром у портфоліо. Твої пропси порівнюють із твоїми фото в День 54, а budget.md потрібен для тесту всього острова в День 56."}, "where": {"en": "L_Island, district 2 (about 200 x 200 m). Work at the landmark's spot from Day 32, along the streets and paths, at the field edges and at the square or viewpoint.", "uk": "L_Island, район 2 (близько 200 × 200 м). Працюй на місці орієнтира з Дня 32, уздовж вулиць і стежок, на краях полів і на площі чи оглядовому майданчику."}, "spec": [{"en": "SM_Landmark: district 2's lighthouse, chapel tower, barn or silo, 15 to 25 m tall, modelled simply in Blender with UCX boxes. It replaces the Day 32 blockout, on DL_Landmarks with HLOD Layer HLOD_Merged.", "uk": "SM_Landmark — маяк, вежа каплиці, стодола чи силос району 2, 15–25 м заввишки, просто змодельований у Blender з блоками UCX. Він замінює блокаут із Дня 32 і лежить на DL_Landmarks, а його HLOD Layer — HLOD_Merged."}, {"en": "PCG_FenceAlongSpline: a fence or wall piece from a free pack or your kit (SM_Railing_2m) placed along a spline. At least three runs follow the land, with no floating posts.", "uk": "PCG_FenceAlongSpline — секція паркану чи муру з паку або з твого набору (SM_Railing_2m), розставлена вздовж сплайна. Щонайменше три лінії йдуть за рельєфом, і жоден стовпчик не висить у повітрі."}, {"en": "Your Week 1 benches, lamp posts, bins and bollards placed by use. Benches face a view, bins stand beside benches and doors, and lamps keep their heads out of the drone lanes.", "uk": "Твої лавки, ліхтарні стовпи, урни й стовпчики з 1-го тижня, розставлені за призначенням. Лавки дивляться на краєвид, урни стоять біля лавок і дверей, а плафони ліхтарів не заходять у польотні коридори."}, {"en": "One repeated set packed as a Packed Level Actor and placed 4 or more times, and three small stories.", "uk": "Один повторюваний комплект, запакований як Packed Level Actor і поставлений 4 чи більше разів, і три маленькі історії."}, {"en": "Today's props in the Outliner folder D2_Props, adding no more than about 10 % to the GPU time at D2_C4.", "uk": "Сьогоднішні пропси — у папці D2_Props в Outliner; з камери D2_C4 вони додають до часу GPU не більше ніж близько 10 %."}, {"en": "Gold (optional): model your own fence panel (2.5 m long, 1.2 m high) and use it in the graph.", "uk": "Золото (за бажанням): змоделюй власну секцію паркану (2,5 м завдовжки, 1,2 м заввишки) і використай її в графі."}], "piece1": "the landmark and your first fence run", "piece2": {"en": "Every other fence run, prop and small story, on your own", "uk": "Усі інші лінії парканів, пропси й маленькі історії — самостійно"}, "steps": [{"text": {"en": "Check: the files from today's lessons are in the day work folder (landmark.blend, SM_Landmark.fbx; in Unreal: SM_Landmark, PCG_FenceAlongSpline, PLA_PicnicSet). Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it.", "uk": "Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: landmark.blend, SM_Landmark.fbx, а в Unreal — SM_Landmark, PCG_FenceAlongSpline, PLA_PicnicSet. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде."}, "lesson": 1}, {"text": {"en": "Finish SM_Landmark in Blender: add the top (a lantern room or a roof) and a door and windows (inset faces or thin dark boxes). Run Smart UV Project and assign your M_Master instances. Save, close Blender and double-click landmark.blend. Check: the landmark and its UCX boxes are in the Outliner.", "uk": "Доведи SM_Landmark у Blender до кінця. Додай верх (скляний ліхтар маяка або дах), двері й вікна (грані з Inset або тонкі темні пластини). Запусти Smart UV Project і признач свої інстанси M_Master. Збережи, закрий Blender і двічі клацни landmark.blend. Перевірка: орієнтир і його блоки UCX є в Outliner."}, "lesson": 1}, {"text": {"en": "Export SM_Landmark.fbx again (Path Mode Auto, Embed Textures off, Selected Objects) and reimport it. Delete the Day 32 blockout, and put the landmark on DL_Landmarks with HLOD Layer HLOD_Merged. Older Unreal (4.27) or weak PC: skip HLOD Layer. Check: the .fbx is 10 KB or more, and you can pick the landmark out from 300 m.", "uk": "Знову експортуй SM_Landmark.fbx (Path Mode Auto, Embed Textures вимкнено, Selected Objects) і імпортуй його повторно. Видали блокаут із Дня 32 і поклади орієнтир на DL_Landmarks з HLOD Layer HLOD_Merged. Старіший Unreal (4.27) або слабкий ПК: пропусти HLOD Layer. Перевірка: .fbx важить 10 КБ або більше, а з 300 м орієнтир легко впізнати."}, "lesson": 1}, {"text": {"en": "Add two or more fence runs with PCG_FenceAlongSpline, as in lesson 2: one Empty Actor with a Spline and a PCG component each. Drop every point with End. Older Unreal (4.27) or weak PC: place the pieces by hand, end to end. Check: at 2 m no post floats or sinks more than 5 cm.", "uk": "Додай дві чи більше ліній паркану графом PCG_FenceAlongSpline, як в уроці 2: на кожну — один Empty Actor зі Spline і компонентом PCG. Кожну точку опусти клавішею End. Старіший Unreal (4.27) або слабкий ПК: розстав секції вручну, впритул одна до одної. Перевірка: з 2 м жоден стовпчик не висить і не заглиблений більш ніж на 5 см."}, "lesson": 2}, {"text": {"en": "Place your Week 1 benches, bins and lamp posts by use, plus any free-pack props from district 2's Pieces in map_notes.md, and move them into D2_Props. Check: every bench faces a view, and every bin is within 3 m of a bench or a door.", "uk": "Розстав за призначенням свої лавки, урни й ліхтарні стовпи з 1-го тижня, а також пропси з паків із розділу Pieces району 2 в map_notes.md. Перенеси їх у D2_Props. Перевірка: кожна лавка дивиться на краєвид, а кожна урна стоїть не далі ніж за 3 м від лавки чи дверей."}, "lesson": 3}, {"text": {"en": "Place PLA_PicnicSet (or your own set) 4 or more times, each copy turned a little, none in a drone lane. Older Unreal (4.27) or weak PC: group each set with Ctrl+G instead. Check: the Outliner shows PLA_ actors in D2_Props, not loose meshes.", "uk": "Постав PLA_PicnicSet (або свій комплект) 4 чи більше разів. Кожну копію трохи поверни, і жодну не став у польотний коридор. Старіший Unreal (4.27) або слабкий ПК: натомість згрупуй кожен комплект клавішами Ctrl+G. Перевірка: Outliner показує в D2_Props актори PLA_, а не окремі меші."}, "lesson": 4}, {"text": {"en": "Place three small stories, such as a gate left open with a bucket or a bike by a door. Then slide LaneGauge along every drone lane. Check: the tutor finds all three stories from a 10 m screenshot, and the cube touches nothing.", "uk": "Розмісти три маленькі історії, наприклад відчинені ворота з відром або велосипед біля дверей. Потім проведи LaneGauge уздовж кожного польотного коридору. Перевірка: тьютор знаходить усі три історії за скриншотом з 10 м, а куб нічого не торкається."}, "lesson": 3}, {"text": {"en": "Measure the cost: stat unit from D2_C4 with the D2_Props folder shown, then hidden (its eye icon). Check: the props add no more than about 10 % to the GPU time, and both numbers are in budget.md.", "uk": "Виміряй ціну пропсів: stat unit з камери D2_C4, спершу з показаною папкою D2_Props, потім із прихованою (значок з оком). Перевірка: пропси додають до часу GPU не більше ніж близько 10 %, і обидва числа записано в budget.md."}, "lesson": 4}, {"text": {"en": "Proof picture: in Krita, put a 300 m shot of the landmark beside a 10 m shot of a bench group and a fence run. Save it as day51_proof.png. Then choose File > Save All. Check: the level tab shows no star (*), and the picture is clear at 100 % zoom.", "uk": "Картинка-доказ: у Krita постав поруч кадр орієнтира з 300 м і кадр групи лавок та лінії паркану з 10 м. Збережи її як day51_proof.png. Потім вибери File > Save All. Перевірка: на вкладці рівня немає зірочки (*), а картинка чітка в масштабі 100 %."}, "lesson": 1}, {"text": {"en": "Report and hand-in: click Copy the day report at the bottom of the page, paste it into a new chat and answer. Open summary.md in Notepad, press Ctrl+End, paste the answer and press Ctrl+S. Then drag the files on the Hand in list into your hand-in folder. Check: every name shows in the folder, each with a size.", "uk": "Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: кожна назва зі списку є в папці, у кожної є розмір."}, "lesson": 4}], "assets": ["island12/free-packs-list.md", "island12/credits-template.md"]}, "lessons": [{"title": {"en": "Your landmark in Blender", "uk": "Твій орієнтир у Blender"}, "minutes": 40, "goals": [{"en": "Explain what a landmark does: it gives pilots a point to fly toward and makes a district easy to remember.", "uk": "Пояснювати, що робить орієнтир: дає пілотам точку, до якої летіти, і допомагає запам'ятати район."}, {"en": "Model your Day 32 blockout simply in Blender, at real size, with tools you already know.", "uk": "Моделювати свій блокаут із Дня 32 у Blender просто, у справжньому розмірі, знайомими інструментами."}, {"en": "Make it stand out from far away by its height, shape or colour.", "uk": "Робити орієнтир помітним здалеку завдяки висоті, формі чи кольору."}], "doalong": [{"en": "In Blender add a cylinder with 16 vertices (Shift+A > Mesh > Cylinder, then set Vertices in the panel at the bottom left). For a barn, add a cube instead. You should see one new object.", "uk": "У Blender додай циліндр із 16 вершинами: Shift+A > Mesh > Cylinder, потім задай Vertices на панелі внизу ліворуч. Для стодоли додай натомість куб. З'являється один новий об'єкт."}, {"en": "In the N panel, type the base width and a height of 15 to 25 m into Dimensions, then press Ctrl+A > Scale. You should see Dimensions that match.", "uk": "На панелі N введи в Dimensions ширину основи й висоту 15–25 м, потім натисни Ctrl+A > Scale. Має вийти: Dimensions збігаються."}, {"en": "In Edit Mode, Alt+click an edge of the top ring, press S, type 0.8 and press Enter. You should see a gently tapering tower.", "uk": "У Edit Mode клацни з Alt на ребро верхнього кільця, натисни S, введи 0.8 і натисни Enter. Вежа плавно звужується догори."}, {"en": "Add the top: a shorter cylinder for a lantern room, or a cone for a pointed roof (Shift+A > Mesh > Cone). You should see the outline from your photo.", "uk": "Додай верх: нижчий циліндр для ліхтаря маяка або конус для гострого даху (Shift+A > Mesh > Cone). Має вийти силует із твого фото."}, {"en": "Set the origin to the bottom centre (as on Day 4) and add UCX boxes UCX_SM_Landmark_00 and _01. Save landmark.blend in the day work folder. You should see the file there.", "uk": "Постав origin у центр низу, як у День 4, і додай блоки UCX: UCX_SM_Landmark_00 і _01. Збережи landmark.blend у робочій папці дня. Файл з'являється в папці."}, {"en": "Export SM_Landmark.fbx (Path Mode Auto, Embed Textures off, Limit to > Selected Objects). Its size in File Explorer should be 10 KB or more. Import it into Content/Island/District2 and drag it onto the blockout's spot. You should see it stand above the houses.", "uk": "Експортуй SM_Landmark.fbx (Path Mode Auto, Embed Textures вимкнено, Limit to > Selected Objects). У Провіднику (File Explorer) файл має важити 10 КБ або більше. Імпортуй його в Content/Island/District2 і перетягни на місце блокауту. Орієнтир височіє над будинками."}], "play": {"en": "Silhouette test: I describe my landmark's outline in one sentence. The tutor guesses which landmark it is; a right guess means the shape reads.", "uk": "Тест силуету: я описую силует свого орієнтира одним реченням. Тьютор вгадує, що це за орієнтир. Правильна здогадка означає, що форма читається."}, "video": {"url": "https://www.youtube.com/watch?v=10cbOga7V_M", "title": "Landmarks 🇬🇧 [~LEVEL DESIGN #21]", "channel": "Mina Pêcheux", "length": "5:32", "search": "level design landmarks sightlines"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Твій орієнтир у Blender (Day 51, lesson 1 of 4). Today's build: SM_Landmark на своєму місці, лінії парканів із PCG уздовж рельєфу, вуличні меблі, розставлені за призначенням, повторювані комплекти, запаковані як інстанси, і три маленькі історії.\nWhat I already know: День 50: район 2, зібраний у L_Island, його камери D2_C1–D2_C5 і budget.md; День 32: landmarks.md і блокаут орієнтира району 2; День 49: блокаут твого орієнтира, перевірений з 300 м (landmark_300m.png); День 22: plot_plan_d2.png (підписи з кількістю, місця й польотний коридор), виправлений у День 23; День 24: розділ Pieces району 2 в map_notes.md і вибрані тобою паки; День 5: твої вуличні пропси (SM_Bollard, SM_Bench, SM_LampPost, SM_Bin); День 43: Packed Level Actor, розстановка за призначенням і LaneGauge (твій куб-калібр 4 × 4 × 4 м); День 38: актори зі сплайном і Spline Sampler; День 33: DL_District2, DL_Landmarks і HLOD_Merged.\n\nBy the end of this lesson I can:\n1. Пояснювати, що робить орієнтир: дає пілотам точку, до якої летіти, і допомагає запам'ятати район.\n2. Моделювати свій блокаут із Дня 32 у Blender просто, у справжньому розмірі, знайомими інструментами.\n3. Робити орієнтир помітним здалеку завдяки висоті, формі чи кольору.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: Десять тижнів позаду: на острові два райони — завершена набережна й другий район із дорогами та стежками до кожних дверей. Today: Сьогодні ти моделюєш свій орієнтир у Blender і ставиш його на місце, а тоді додаєш паркани, що йдуть за рельєфом, пропси, розміщені за призначенням, і три маленькі історії. One encouraging line: Пропси підказують гостям, де вони опинилися, тож нехай характер твого району веде кожен твій вибір.); 2 lines on why today matters and where it comes back, in plain words (from this: Сьогодні район 2 отримує вежу, за якою кермуватимуть пілоти, а ще лавки, паркани й маленькі історії, завдяки яким він виглядає обжитим. Студії розставляють пропси за призначенням і повторюють їх як інстанси. Так район виглядає справжнім з 10 м і при цьому працює швидко. It comes back: Орієнтир стане точкою повороту на твоєму мальовничому прольоті в День 57, а в День 59 може стати детальним кадром у портфоліо. Твої пропси порівнюють із твоїми фото в День 54, а budget.md потрібен для тесту всього острова в День 56.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-51-district2-props-and-furniture exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (орієнтир і твоя перша лінія паркану). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. У Blender додай циліндр із 16 вершинами: Shift+A > Mesh > Cylinder, потім задай Vertices на панелі внизу ліворуч. Для стодоли додай натомість куб. З'являється один новий об'єкт.\n   2. На панелі N введи в Dimensions ширину основи й висоту 15–25 м, потім натисни Ctrl+A > Scale. Має вийти: Dimensions збігаються.\n   3. У Edit Mode клацни з Alt на ребро верхнього кільця, натисни S, введи 0.8 і натисни Enter. Вежа плавно звужується догори. [screenshot]\n   4. Додай верх: нижчий циліндр для ліхтаря маяка або конус для гострого даху (Shift+A > Mesh > Cone). Має вийти силует із твого фото.\n   5. Постав origin у центр низу, як у День 4, і додай блоки UCX: UCX_SM_Landmark_00 і _01. Збережи landmark.blend у робочій папці дня. Файл з'являється в папці.\n   6. Експортуй SM_Landmark.fbx (Path Mode Auto, Embed Textures вимкнено, Limit to > Selected Objects). У Провіднику (File Explorer) файл має важити 10 КБ або більше. Імпортуй його в Content/Island/District2 і перетягни на місце блокауту. Орієнтир височіє над будинками. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Тест силуету: я описую силует свого орієнтира одним реченням. Тьютор вгадує, що це за орієнтир. Правильна здогадка означає, що форма читається. Otherwise skip it.\n6. Review: ask me these questions from earlier days, one at a time, and correct me kindly: Day 48: what is the difference between a Level Instance and a Packed Level Actor, and when do you use each? | Day 43: why do 40 copies of one chair cost less as instances than as 40 separate actors?\n7. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n8. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\nIf I want to go deeper, recommend this free video: \"Landmarks 🇬🇧 [~LEVEL DESIGN #21]\" by Mina Pêcheux: https://www.youtube.com/watch?v=10cbOga7V_M\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / try. З'єднай Input, три вузли й Output саме в такому порядку. Має вийти один ланцюжок зліва направо."}, {"en": "Click the Add button > Basic > Empty Actor and name it FenceRun_01. In Details click + Add > Spline, then + Add > PCG, and set the PCG component's Graph. You should see a short spline.", "uk": "Клацни кнопку Add > Basic > Empty Actor і назви його FenceRun_01. У Details клацни + Add > Spline, потім + Add > PCG. У компоненті PCG задай поле Graph. З'являється короткий сплайн."}, {"en": "Select the spline's end point, Alt+drag to add points along a field edge, then click Generate. You should see pieces along the line. Standing across it? Add Transform Points with Rotation Min Z and Max Z both 90.", "uk": "Виділи кінцеву точку сплайна і тягни з Alt, щоб додати точки вздовж краю поля. Потім клацни Generate. Уздовж лінії з'являються секції. Стоять упоперек? Додай Transform Points і задай Rotation Min Z і Max Z по 90."}, {"en": "Click each spline point and press End to drop it; if one doesn't move, drag it down with the blue Z arrow. You should see the run hug the ground.", "uk": "Клацни кожну точку сплайна й натисни End, щоб опустити її. Якщо точка не рухається, стягни її вниз синьою стрілкою Z. Лінія щільно лягає на землю."}], "play": {"en": "Fence inspector: I describe my first run's ends, corners and steepest stretch; the tutor asks where a post might float or a piece might cut into the slope, and I check each place.", "uk": "Інспектор парканів: я описую кінці, кути й найкрутішу ділянку своєї першої лінії. Тьютор питає, де стовпчик може висіти в повітрі або секція врізатися в схил, а я перевіряю кожне місце."}, "video": {"search": "unreal engine 5 pcg spline sampler fence along spline"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5. d/District2/Props. You should see one PLA_PicnicSet in the Outliner.", "uk": "Виділи меші комплекту, клацни правою кнопкою > Level > Create Packed Level Actor і прийми запропоновані налаштування. Збережи його як PLA_PicnicSet у Content/Island/District2/Props. В Outliner з'являється один PLA_PicnicSet."}, {"en": "Place three more copies, each turned a little, none in a drone lane, and move all four into D2_Props. You should see four sets in the district.", "uk": "Постав ще три копії, кожну трохи повернуту, жодну — в польотному коридорі. Перенеси всі чотири в D2_Props. Має вийти чотири комплекти в районі."}, {"en": "Pilot D2_C4, open the console (the key left of 1, or the Cmd box at the bottom left) and type stat unit. Write Frame and GPU in budget.md. You should see the numbers at the top right.", "uk": "Стань у камеру D2_C4 (правою кнопкою > Pilot) і відкрий консоль: клавіша ліворуч від 1 або поле Cmd унизу ліворуч. Введи stat unit. Запиши Frame і GPU в budget.md. Числа з'являються вгорі праворуч."}, {"en": "Click the eye icon next to the D2_Props folder to hide it, and read GPU again. You should see the props vanish and the GPU time drop; write it down.", "uk": "Клацни значок з оком біля папки D2_Props, щоб приховати її, і знову прочитай GPU. Пропси зникають, а час GPU падає; запиши нове число."}], "play": {"en": "Cost challenge: 40 chairs for less than 1 ms more GPU time than none; the tutor checks my stat unit numbers.", "uk": "Виклик на ціну: 40 стільців мають додати менше ніж 1 мс часу GPU порівняно зі сценою без них. Тьютор перевіряє мої числа stat unit."}, "video": {"url": "https://www.youtube.com/watch?v=pWgVa_8885U", "title": "Unreal Engine 5 Tutorial - Level Design Tools - Packed Level Actors", "channel": "JBarlowTraining", "length": "6:47", "search": "unreal engine 5 packed level actors"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Інстансинг і ціна пропсів (мікроурок) (Day 51, lesson 4 of 4). Today's build: SM_Landmark на своєму місці, лінії парканів із PCG уздовж рельєфу, вуличні меблі, розставлені за призначенням, повторювані комплекти, запаковані як інстанси, і три маленькі історії.\nWhat I already know: День 50: район 2, зібраний у L_Island, його камери D2_C1–D2_C5 і budget.md; День 32: landmarks.md і блокаут орієнтира району 2; День 49: блокаут твого орієнтира, перевірений з 300 м (landmark_300m.png); День 22: plot_plan_d2.png (підписи з кількістю, місця й польотний коридор), виправлений у День 23; День 24: розділ Pieces району 2 в map_notes.md і вибрані тобою паки; День 5: твої вуличні пропси (SM_Bollard, SM_Bench, SM_LampPost, SM_Bin); День 43: Packed Level Actor, розстановка за призначенням і LaneGauge (твій куб-калібр 4 × 4 × 4 м); День 38: актори зі сплайном і Spline Sampler; День 33: DL_District2, DL_Landmarks і HLOD_Merged.\nEarlier today I already did: lesson 1 (Твій орієнтир у Blender); lesson 2 (Паркани й мури вздовж сплайна з PCG); lesson 3 (Розстановка за призначенням (мікроурок)). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Ще раз пояснювати інстансинг: Unreal малює багато копій одного меша за один раз, тож 50 копій коштують ненабагато більше, ніж одна.\n2. Робити Packed Level Actor з повторюваного комплекту. Packed Level Actor — це група мешів, збережена як один актор.\n3. Вимірювати ціну пропсів командою stat unit: раз із показаними пропсами, раз із прихованими, з тієї самої камери.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: 2 lines on why today matters and where it comes back, in plain words (from this: Сьогодні район 2 отримує вежу, за якою кермуватимуть пілоти, а ще лавки, паркани й маленькі історії, завдяки яким він виглядає обжитим. Студії розставляють пропси за призначенням і повторюють їх як інстанси. Так район виглядає справжнім з 10 м і при цьому працює швидко. It comes back: Орієнтир стане точкою повороту на твоєму мальовничому прольоті в День 57, а в День 59 може стати детальним кадром у портфоліо. Твої пропси порівнюють із твоїми фото в День 54, а budget.md потрібен для тесту всього острова в День 56.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-51-district2-props-and-furniture exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (орієнтир і твоя перша лінія паркану). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Збери на землі один комплект: стіл для пікніка й дві лавки, столик кав'ярні й чотири стільці або три тюки сіна. Комплект стоїть на землі.\n   2. Виділи меші комплекту, клацни правою кнопкою > Level > Create Packed Level Actor і прийми запропоновані налаштування. Збережи його як PLA_PicnicSet у Content/Island/District2/Props. В Outliner з'являється один PLA_PicnicSet.\n   3. Постав ще три копії, кожну трохи повернуту, жодну — в польотному коридорі. Перенеси всі чотири в D2_Props. Має вийти чотири комплекти в районі. [screenshot]\n   4. Стань у камеру D2_C4 (правою кнопкою > Pilot) і відкрий консоль: клавіша ліворуч від 1 або поле Cmd унизу ліворуч. Введи stat unit. Запиши Frame і GPU в budget.md. Числа з'являються вгорі праворуч.\n   5. Клацни значок з оком біля папки D2_Props, щоб приховати її, і знову прочитай GPU. Пропси зникають, а час GPU падає; запиши нове число. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Виклик на ціну: 40 стільців мають додати менше ніж 1 мс часу GPU порівняно зі сценою без них. Тьютор перевіряє мої числа stat unit. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\nIf I want to go deeper, recommend this free video: \"Unreal Engine 5 Tutorial - Level Design Tools - Packed Level Actors\" by JBarlowTraining: https://www.youtube.com/watch?v=pWgVa_8885U\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); File Explorer = Провідник; mesh = меш; vertex / edge / face = вершина / ребро / грань; origin (and kit pivot) = origin — точка, за яку об'єкт ставлять і обертають; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; collision / UCX collision box = колізія / блок UCX; material instance / child instance = інстанс / дочірній інстанс; material slot / node / pin = слот матеріалу / вузол / вхід; drone flight corridor = польотний коридор; keep-out zone / footprint test / grounding = зона-виняток / тест опори / посадка на ґрунт; kit / kit piece / part of one object = набір / деталь / частина; map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; district / plot / plot plan = район / ділянка / план ділянки; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; vista / blockout / landmark = панорама / блокаут / орієнтир; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}], "handin": [{"en": "summary.md", "uk": "summary.md (звіт дня)"}, {"en": "landmark.blend: your landmark model, listed in your hand-over notes (→ Day 59)", "uk": "landmark.blend (модель орієнтира; увійде в нотатки до пакета передачі) (→ День 59)"}, {"en": "budget.md with the props' cost from D2_C4 (→ Day 56)", "uk": "budget.md (ціна пропсів, виміряна з камери D2_C4) (→ День 56)"}, {"en": "day51_proof.png: the landmark from 300 m beside a bench group and a fence run from 10 m (proof)", "uk": "day51_proof.png (орієнтир із 300 м поруч із групою лавок і лінією паркану з 10 м) (доказ)"}], "goal": {"en": "By the end of today district 2 has its landmark, modelled in Blender. It also has fence runs that follow the land, props placed by use and three small stories.", "uk": "Наприкінці дня в районі 2 є орієнтир, змодельований у Blender. Ще в ньому є лінії парканів, що йдуть за рельєфом, пропси, розставлені за призначенням, і три маленькі історії."}, "uses": [{"en": "Day 50: district 2 built in L_Island, its cameras D2_C1 to D2_C5, and budget.md", "uk": "День 50: район 2, зібраний у L_Island, його камери D2_C1–D2_C5 і budget.md"}, {"en": "Day 32: landmarks.md and district 2's landmark blockout", "uk": "День 32: landmarks.md і блокаут орієнтира району 2"}, {"en": "Day 49: your landmark blockout, checked from 300 m (landmark_300m.png)", "uk": "День 49: блокаут твого орієнтира, перевірений з 300 м (landmark_300m.png)"}, {"en": "Day 22: plot_plan_d2.png (count labels, spots and the drone lane), fixed on Day 23", "uk": "День 22: plot_plan_d2.png (підписи з кількістю, місця й польотний коридор), виправлений у День 23"}, {"en": "Day 24: district 2's Pieces in map_notes.md and your free-pack picks", "uk": "День 24: розділ Pieces району 2 в map_notes.md і вибрані тобою паки"}, {"en": "Day 5: your street props (SM_Bollard, SM_Bench, SM_LampPost, SM_Bin)", "uk": "День 5: твої вуличні пропси (SM_Bollard, SM_Bench, SM_LampPost, SM_Bin)"}, {"en": "Day 43: Packed Level Actors, set dressing by use, and LaneGauge (your 4 x 4 x 4 m gauge cube)", "uk": "День 43: Packed Level Actor, розстановка за призначенням і LaneGauge (твій куб-калібр 4 × 4 × 4 м)"}, {"en": "Day 38: spline actors and the Spline Sampler", "uk": "День 38: актори зі сплайном і Spline Sampler"}, {"en": "Day 33: DL_District2, DL_Landmarks and HLOD_Merged", "uk": "День 33: DL_District2, DL_Landmarks і HLOD_Merged"}], "quiz": [{"q": {"en": "Your fence posts float 20 cm above a dip between two spline points. What is the most likely cause?", "uk": "Стовпчики твого паркану висять на 20 см над западиною між двома точками сплайна. Яка найімовірніша причина?"}, "options": [{"en": "The Spline Sampler's Distance Increment is too small", "uk": "Distance Increment у Spline Sampler замалий"}, {"en": "The spline points aren't snapped to the ground, so the line crosses the dip in a straight line", "uk": "Точки сплайна не опущено на землю, тож лінія перетинає западину навпростець"}, {"en": "The fence mesh has no UCX collision", "uk": "У меша паркану немає колізії UCX"}, {"en": "The PCG graph has no Output node", "uk": "У PCG-графі немає вузла Output"}], "answer": 1, "explain": {"en": "The pieces follow the spline, not the land. Snap the points to the floor and add a point where the ground bends.", "uk": "Секції йдуть за сплайном, а не за рельєфом. Опусти точки на землю й додай точку там, де земля змінює нахил."}}, {"q": {"en": "Which group of props says 'farm valley' most clearly from 30 m?", "uk": "Яка група пропсів найчіткіше каже «фермерська долина» з 30 м?"}, "options": [{"en": "Café tables, parasols and a bus shelter", "uk": "Столики кав'ярні, парасольки й автобусна зупинка"}, {"en": "A rope fence, an information panel and a viewpoint bench", "uk": "Мотузяна огорожа, інформаційний стенд і лавка на оглядовому майданчику"}, {"en": "Field gates, wooden fences and round hay bales", "uk": "Польові ворота, дерев'яні паркани й круглі тюки сіна"}, {"en": "Garden walls, steps and window boxes", "uk": "Садові мури, сходи й квіткові ящики на вікнах"}], "answer": 2, "explain": {"en": "Character props tell a visitor what kind of place this is. Gates, field fences and bales belong to farmland.", "uk": "Характерні пропси підказують відвідувачу, що це за місце. Ворота, польові паркани й тюки сіна бувають на фермах."}}, {"q": {"en": "What does a Packed Level Actor do?", "uk": "Що робить Packed Level Actor?"}, "options": [{"en": "It saves a group of meshes as one actor and draws the repeated meshes as instances", "uk": "Зберігає групу мешів як один актор і малює повторювані меші як інстанси"}, {"en": "It hides a group from the drone", "uk": "Ховає групу від дрона"}, {"en": "It merges the group's textures into one texture", "uk": "Зливає текстури групи в одну текстуру"}], "answer": 0, "explain": {"en": "Packing a set makes every copy cheap to draw, because repeated meshes are drawn together as instances.", "uk": "Коли комплект запаковано, кожну копію малювати дешево: однакові меші малюються разом як інстанси."}}, {"q": {"en": "With the D2_Props folder shown, GPU time is 13.2 ms; hidden, it's 11.0 ms. Does that meet today's 10 % rule?", "uk": "Коли папка D2_Props показана, час GPU — 13,2 мс, а коли прихована — 11,0 мс. Чи виконано сьогоднішнє правило 10 %?"}, "options": [{"en": "Yes: it adds only 2.2 ms", "uk": "Так: додається лише 2,2 мс"}, {"en": "Yes: hiding a layer always saves about 2 ms", "uk": "Так: приховування шару завжди економить близько 2 мс"}, {"en": "No: delete every prop", "uk": "Ні: видали всі пропси"}, {"en": "No: it adds 20 %, so pack more repeats and remove props no camera or flight ever sees", "uk": "Ні: додається 20 %, тож запакуй більше повторів і прибери пропси, яких не бачить жодна камера чи проліт"}], "answer": 3, "explain": {"en": "2.2 ms on top of 11.0 ms is 20 %. Pack repeats into Packed Level Actors and remove props nobody can see.", "uk": "2,2 мс понад 11,0 мс — це 20 %. Запакуй повтори в Packed Level Actor і прибери пропси, яких ніхто не бачить."}}, {"q": {"en": "A bench stands in the middle of a lawn, facing a blank wall. What's wrong with it?", "uk": "Лавка стоїть посеред газону, повернута до глухої стіни. Що з нею не так?"}, "options": [{"en": "Nothing: benches can stand anywhere", "uk": "Нічого: лавки можуть стояти де завгодно"}, {"en": "It's placed without a use: a bench should face a view or a path where people sit and watch, with a bin nearby", "uk": "Її поставлено без призначення: лавка має дивитися на краєвид чи стежку, де люди сидять і спостерігають, а поруч має бути урна"}, {"en": "It should be a Packed Level Actor", "uk": "Вона має бути Packed Level Actor"}], "answer": 1, "explain": {"en": "Set dressing by use places props the way people really use them. A bench facing a wall tells no story.", "uk": "Розстановка за призначенням ставить пропси так, як ними справді користуються люди. Лавка, повернута до стіни, не розповідає жодної історії."}}], "weekInfo": {"week": 11, "title": {"en": "District 2 finished", "uk": "Район 2 завершено"}, "goal": {"en": "By Friday you have district 2 finished: furnished, planted, weathered and joined to the island, with five final shots per district beside real photos.", "uk": "До п'ятниці район 2 завершено: облаштовано, засаджено, зістарено й з'єднано з островом, а по п'ять фінальних кадрів кожного району стоять поруч зі справжніми фото."}, "skills": [{"en": "Set dressing and prop placement by use for open-world districts", "uk": "Наповнення сцени (set dressing) і розстановка пропсів за призначенням у районах відкритого світу"}, {"en": "Spline-based PCG for fences, walls and hedgerows in Unreal Engine 5", "uk": "PCG на сплайнах для парканів, мурів і живоплотів в Unreal Engine 5"}, {"en": "Foliage and decal passes that age a scene believably", "uk": "Рослини й декалі, які правдоподібно старять сцену"}, {"en": "Lighting recipes and exposure control across a whole open world", "uk": "Рецепти світла й контроль експозиції для всього відкритого світу"}, {"en": "Art review against photo reference in r1/r2 rounds", "uk": "Огляд роботи за фото-референсами в раундах r1/r2"}]}, "morning": {"sofar": {"en": "Ten weeks in, your island has two districts: a finished waterfront and a second district with roads and paths to every door.", "uk": "Десять тижнів позаду: на острові два райони — завершена набережна й другий район із дорогами та стежками до кожних дверей."}, "today": {"en": "You model your landmark in Blender and set it in place, then add fences that follow the land, props placed by use and three small stories.", "uk": "Сьогодні ти моделюєш свій орієнтир у Blender і ставиш його на місце, а тоді додаєш паркани, що йдуть за рельєфом, пропси, розміщені за призначенням, і три маленькі історії."}, "cheer": {"en": "Props tell a visitor where they are, so let your district's character guide every choice you make.", "uk": "Пропси підказують гостям, де вони опинилися, тож нехай характер твого району веде кожен твій вибір."}, "quote": {"text": {"en": "Instructions for living a life: Pay attention. Be astonished. Tell about it.", "uk": "Інструкція, як прожити життя: звертай увагу. Дивуйся. Розповідай про це."}, "author": {"en": "Mary Oliver", "uk": "Мері Олівер"}, "source": "https://en.wikiquote.org/wiki/Mary_Oliver"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-51-district2-props-and-furniture", "mapHref": "../../COURSE.html", "prevHref": "../Day-50-boss-district2-built/START-HERE.html", "nextHref": "../Day-52-district2-planting-grime-light/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Blender and Unreal Engine 5.8. I am a beginner on Day 51. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me and don't write code.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: Усі інші лінії парканів, пропси й маленькі історії — самостійно.\nIt's part of: SM_Landmark на своєму місці, лінії парканів із PCG уздовж рельєфу, вуличні меблі, розставлені за призначенням, повторювані комплекти, запаковані як інстанси, і три маленькі історії (L_Island, район 2 (близько 200 × 200 м). Працюй на місці орієнтира з Дня 32, уздовж вулиць і стежок, на краях полів і на площі чи оглядовому майданчику.).\nWhy it matters: Сьогодні район 2 отримує вежу, за якою кермуватимуть пілоти, а ще лавки, паркани й маленькі історії, завдяки яким він виглядає обжитим. Студії розставляють пропси за призначенням і повторюють їх як інстанси. Так район виглядає справжнім з 10 м і при цьому працює швидко. It comes back: Орієнтир стане точкою повороту на твоєму мальовничому прольоті в День 57, а в День 59 може стати детальним кадром у портфоліо. Твої пропси порівнюють із твоїми фото в День 54, а budget.md потрібен для тесту всього острова в День 56.\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-51-district2-props-and-furniture (on the drive I chose on Day 0).\nWhat I already know: День 50: район 2, зібраний у L_Island, його камери D2_C1–D2_C5 і budget.md; День 32: landmarks.md і блокаут орієнтира району 2; День 49: блокаут твого орієнтира, перевірений з 300 м (landmark_300m.png); День 22: plot_plan_d2.png (підписи з кількістю, місця й польотний коридор), виправлений у День 23; День 24: розділ Pieces району 2 в map_notes.md і вибрані тобою паки; День 5: твої вуличні пропси (SM_Bollard, SM_Bench, SM_LampPost, SM_Bin); День 43: Packed Level Actor, розстановка за призначенням і LaneGauge (твій куб-калібр 4 × 4 × 4 м); День 38: актори зі сплайном і Spline Sampler; День 33: DL_District2, DL_Landmarks і HLOD_Merged; today's lessons: Твій орієнтир у Blender; Паркани й мури вздовж сплайна з PCG; Розстановка за призначенням (мікроурок); Інстансинг і ціна пропсів (мікроурок). Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- SM_Landmark — маяк, вежа каплиці, стодола чи силос району 2, 15–25 м заввишки, просто змодельований у Blender з блоками UCX. Він замінює блокаут із Дня 32 і лежить на DL_Landmarks, а його HLOD Layer — HLOD_Merged.\n- PCG_FenceAlongSpline — секція паркану чи муру з паку або з твого набору (SM_Railing_2m), розставлена вздовж сплайна. Щонайменше три лінії йдуть за рельєфом, і жоден стовпчик не висить у повітрі.\n- Твої лавки, ліхтарні стовпи, урни й стовпчики з 1-го тижня, розставлені за призначенням. Лавки дивляться на краєвид, урни стоять біля лавок і дверей, а плафони ліхтарів не заходять у польотні коридори.\n- Один повторюваний комплект, запакований як Packed Level Actor і поставлений 4 чи більше разів, і три маленькі історії.\n- Сьогоднішні пропси — у папці D2_Props в Outliner; з камери D2_C4 вони додають до часу GPU не більше ніж близько 10 %.\n- Золото (за бажанням): змоделюй власну секцію паркану (2,5 м завдовжки, 1,2 м заввишки) і використай її в графі.\n\nMy checklist (the same numbers show on my course page):\n1. Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: landmark.blend, SM_Landmark.fbx, а в Unreal — SM_Landmark, PCG_FenceAlongSpline, PLA_PicnicSet. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. (from lesson 1)\n2. Доведи SM_Landmark у Blender до кінця. Додай верх (скляний ліхтар маяка або дах), двері й вікна (грані з Inset або тонкі темні пластини). Запусти Smart UV Project і признач свої інстанси M_Master. Збережи, закрий Blender і двічі клацни landmark.blend. Перевірка: орієнтир і його блоки UCX є в Outliner. (from lesson 1)\n3. Знову експортуй SM_Landmark.fbx (Path Mode Auto, Embed Textures вимкнено, Selected Objects) і імпортуй його повторно. Видали блокаут із Дня 32 і поклади орієнтир на DL_Landmarks з HLOD Layer HLOD_Merged. Старіший Unreal (4.27) або слабкий ПК: пропусти HLOD Layer. Перевірка: .fbx важить 10 КБ або більше, а з 300 м орієнтир легко впізнати. (from lesson 1)\n4. Додай дві чи більше ліній паркану графом PCG_FenceAlongSpline, як в уроці 2: на кожну — один Empty Actor зі Spline і компонентом PCG. Кожну точку опусти клавішею End. Старіший Unreal (4.27) або слабкий ПК: розстав секції вручну, впритул одна до одної. Перевірка: з 2 м жоден стовпчик не висить і не заглиблений більш ніж на 5 см. (from lesson 2)\n5. Розстав за призначенням свої лавки, урни й ліхтарні стовпи з 1-го тижня, а також пропси з паків із розділу Pieces району 2 в map_notes.md. Перенеси їх у D2_Props. Перевірка: кожна лавка дивиться на краєвид, а кожна урна стоїть не далі ніж за 3 м від лавки чи дверей. (from lesson 3)\n6. Постав PLA_PicnicSet (або свій комплект) 4 чи більше разів. Кожну копію трохи поверни, і жодну не став у польотний коридор. Старіший Unreal (4.27) або слабкий ПК: натомість згрупуй кожен комплект клавішами Ctrl+G. Перевірка: Outliner показує в D2_Props актори PLA_, а не окремі меші. (from lesson 4)\n7. Розмісти три маленькі історії, наприклад відчинені ворота з відром або велосипед біля дверей. Потім проведи LaneGauge уздовж кожного польотного коридору. Перевірка: тьютор знаходить усі три історії за скриншотом з 10 м, а куб нічого не торкається. (from lesson 3)\n8. Виміряй ціну пропсів: stat unit з камери D2_C4, спершу з показаною папкою D2_Props, потім із прихованою (значок з оком). Перевірка: пропси додають до часу GPU не більше ніж близько 10 %, і обидва числа записано в budget.md. (from lesson 4)\n9. Картинка-доказ: у Krita постав поруч кадр орієнтира з 300 м і кадр групи лавок та лінії паркану з 10 м. Збережи її як day51_proof.png. Потім вибери File > Save All. Перевірка: на вкладці рівня немає зірочки (*), а картинка чітка в масштабі 100 %. (from lesson 1)\n10. Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: кожна назва зі списку є в папці, у кожної є розмір. (from lesson 4)\n\nHow to help: ask which step number I'm on, then give me only the next step: the exact clicks and what I should see. When I send a screenshot, compare it with my reference, my sizes and the spec, and name one thing to fix at a time.\nCheck every save and export by reopening it before we move on:\n- a .blend: close Blender, double-click the file in today's day work folder (GAD\\Day-51-district2-props-and-furniture), and the model is there (an empty grid means the wrong file was saved)\n- a .md or .txt: open it with Notepad; the text is there, and the name doesn't end in .md.txt\nWhen I write \"готово\", and in any case before the day ends, check with me one item at a time (yes/no): each spec point, then each file on my hand-in list, ready in my day work folder (skip summary.md: the day report writes it next):\n1. landmark.blend (модель орієнтира; увійде в нотатки до пакета передачі) (→ День 59)\n2. budget.md (ціна пропсів, виміряна з камери D2_C4) (→ День 56)\n3. day51_proof.png (орієнтир із 300 м поруч із групою лавок і лінією паркану з 10 м) (доказ)\nFinish with a short list of anything missing, and one line on where this work comes back and what it will look like there. Then tell me the order for the end of the day: first the day report (the Copy the day report button at the bottom of my course page) into summary.md, and only then hand in all the files on the list, summary.md too.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; review (by tutor or art director) = огляд; see-why-fix note = нотатка «бачу, чому, як виправити»; checklist = чек-лист; reference photo / hero photo = фото-референс / ключове фото; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); File Explorer = Провідник; mesh = меш; grid = сітка (тільки grid, ніколи mesh); vertex / edge / face = вершина / ребро / грань; origin (and kit pivot) = origin — точка, за яку об'єкт ставлять і обертають; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; collision / UCX collision box = колізія / блок UCX; material instance / child instance = інстанс / дочірній інстанс; material slot / node / pin = слот матеріалу / вузол / вхід; drone flight corridor = польотний коридор; keep-out zone / footprint test / grounding = зона-виняток / тест опори / посадка на ґрунт; kit / kit piece / part of one object = набір / деталь / частина; map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; district /

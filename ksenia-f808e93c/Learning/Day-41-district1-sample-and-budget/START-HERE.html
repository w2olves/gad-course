<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 41</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

island metres. Below them, every row of plot_plan_d1.md inside the box: item, count, place in metres, source. At the bottom, your verdict: three keep-or-change lines and one cost line.", "uk": "sample.md: чотири кути квадрата 60 × 60 м в острівних метрах. Під ними — кожен рядок plot_plan_d1.md, що потрапляє в квадрат: що, скільки, де (у метрах), звідки. Унизу — твій вердикт: три рядки «лишити чи змінити» і один рядок про вартість."}, {"en": "In L_Island, on DL_District1 (your Day 33 Data Layer, made current): four 1 m corner markers, and every sample item at its plan coordinates. Location in centimetres = island metres x 100. Nothing extra: if the plan is wrong, change the plan first.", "uk": "У L_Island, на DL_District1 (Data Layer з Дня 33, зроблений поточним): чотири кутові маркери по 1 м і кожен елемент пробної ділянки на координатах з плану. Location у сантиметрах = острівні метри × 100. Нічого зайвого: якщо план хибний, спершу зміни план."}, {"en": "Pieces: your quay and pier kit along the water and two or three buildings (LI_HarbourHouse from Day 10, kit walls or a pack building). Add a few Week 1 props and pack plants. Every base touches the ground.", "uk": "Деталі: твій набір причалу й пірса вздовж води і дві-три будівлі — LI_HarbourHouse з Дня 10, стіни з набору або будівля з пака. Додай кілька пропсів з 1-го тижня і рослини з паків. Кожна основа торкається землі."}, {"en": "Five Cine Cameras for the whole district, placed from the camera arrows on plot_plan_d1.png and locked. C1 is the approach, C2 the buildings, C3 the main feature, C4 one wide view and C5 close on the ground. The names don't clash with your Day 30 cameras, CAM_Island_C1 to CAM_Island_C3. At least two of the five see the sample.", "uk": "П'ять камер Cine Camera, C1–C5, для всього району. Постав їх за стрілками камер на plot_plan_d1.png і заблокуй. C1 — підліт, C2 — будівлі, C3 — головний об'єкт, C4 — загальний план, C5 — близький план землі. Назви не збігаються з камерами острова з Дня 30 (CAM_Island_C1–CAM_Island_C3). Принаймні дві з п'яти камер бачать пробну ділянку."}, {"en": "budget.md: the target is an average frame under 16.6 ms and a 95th percentile under 33.3 ms, at 1920 x 1080. Write the settings: Play in a New Editor Window at 1920 x 1080, Engine Scalability High. Then write stat unit (Frame, Game, Draw, GPU) at three spots: the launch point, C4 and the widest view.", "uk": "budget.md: ціль — середній кадр до 16,6 мс і 95-й перцентиль до 33,3 мс при 1920 × 1080. Запиши налаштування: Play у New Editor Window при 1920 × 1080, Engine Scalability High. Потім запиши stat unit (Frame, Game, Draw, GPU) у трьох місцях: у точці старту, на місці C4 і в точці з найширшим видом."}, {"en": "stat gpu at the widest view: its five biggest lines in budget.md. stat gpu splits the graphics card's time into jobs, such as shadows or light.", "uk": "stat gpu у точці з найширшим видом: п'ять найбільших рядків у budget.md. stat gpu ділить час відеокарти на завдання, як-от тіні чи світло."}, {"en": "A CSV capture of a 60-second flight through the sample: a file with the time of every frame. In a free spreadsheet, the average and the 95th percentile of frame time and GPU time, written in budget.md. The 95th percentile is the time that only the slowest 5 % of frames go over.", "uk": "CSV-запис 60-секундного прольоту над пробною ділянкою — файл із часом кожного кадру. У безкоштовній таблиці порахуй середнє і 95-й перцентиль для часу кадру й часу GPU і запиши їх у budget.md. 95-й перцентиль — це час, який перевищують лише 5 % найповільніших кадрів."}, {"en": "sample_board.png: two engine shots of the sample beside two reference photos. Your verdict lines in sample.md answer one question: does the recipe work, with room in the budget for the whole district?", "uk": "sample_board.png: два кадри пробної ділянки з рушія поруч із двома фото-референсами. Рядки вердикту в sample.md відповідають на одне запитання: чи працює рецепт і чи лишається в бюджеті місце для всього району?"}], "piece1": "the sample box, its corner markers and the first building, placed with the tutor", "piece2": {"en": "The rest of the sample, the budget and the CSV capture, on your own", "uk": "Решта пробної ділянки, бюджет і CSV-запис — самостійно"}, "steps": [{"text": {"en": "Check: the files from today's lessons are in the day work folder (sample.md, budget.md and csv_chart.png; in L_Island, cameras C1 to C5 and the four corner markers). Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it. Then finish sample.md with every plan row inside the box. Check: each row has a count and a place in metres.", "uk": "Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: sample.md, budget.md і csv_chart.png, а в L_Island — камери C1–C5 і чотири кутові маркери. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Потім доповни sample.md кожним рядком плану всередині квадрата. Перевірка: у кожного рядка є кількість і місце в метрах."}, "lesson": 1}, {"text": {"en": "Load district 1's region and make DL_District1 the current Data Layer. Look at the four corner markers in a Top view. Check: each marker sits within 0.5 m of its box corner on the plan.", "uk": "Завантаж область району 1 і зроби DL_District1 поточним Data Layer. Подивись на чотири кутові маркери з виду Top. Перевірка: кожен маркер стоїть не далі ніж за 0,5 м від кута квадрата на плані."}, "lesson": 2}, {"text": {"en": "Look through C1 to C5 one by one (right-click > Pilot). Check: each camera shows what its arrow and hero photo promise, and a locked camera doesn't move when you drag it.", "uk": "Подивись по черзі через C1–C5 (клацни правою кнопкою > Pilot). Перевірка: кожна камера показує те, що обіцяють її стрілка і ключове фото, а заблокована камера не рухається, коли її тягнеш."}, "lesson": 1}, {"text": {"en": "Quay and pier: lay SM_QuayEdge_4m along the sample's water edge, and SM_PierDeck_4m where the plan puts the pier. Check: from 2 m there is no gap between pieces, and the tops are level.", "uk": "Причал і пірс: поклади SM_QuayEdge_4m уздовж краю води на пробній ділянці, а SM_PierDeck_4m — там, де на плані пірс. Перевірка: з 2 м між деталями немає щілин, а верхи на одній висоті."}, "lesson": 2}, {"text": {"en": "Buildings: place two or three at their plan coordinates (LI_HarbourHouse, kit walls or a pack building). Press End and sink the low side. Check: all four corners touch the ground when you look from 2 m.", "uk": "Будівлі: постав дві-три на координати з плану (LI_HarbourHouse, стіни з набору або будівля з пака). Натисни End і занур нижчий бік. Перевірка: з 2 м видно, що всі чотири кути торкаються землі."}, "lesson": 2}, {"text": {"en": "Props and plants: a few Week 1 props and pack plants at their plan places. Press Ctrl+S. Check: a low side view shows no floating base, and the star (*) on the L_Island tab has gone.", "uk": "Пропси й рослини: кілька пропсів з 1-го тижня і рослини з паків на місцях з плану. Натисни Ctrl+S. Перевірка: на низькому боковому виді жодна основа не висить, а зірочка (*) на вкладці L_Island зникла."}, "lesson": 2}, {"text": {"en": "Copy the stat unit and memory lines from boss_day40.md (Day 40) into budget.md as your starting point. Set Engine Scalability to High and the play window to 1920 x 1080; write the target and both settings. Weak PC: Medium, or High with r.ScreenPercentage 67, named in budget.md (Weak PC section of ACCOUNTS-AND-INSTALLS.html). Check: budget.md has a target line and a settings line.", "uk": "Скопіюй рядки stat unit і пам'яті з boss_day40.md (День 40) у budget.md — це твоя відправна точка. Постав Engine Scalability на High, а вікно Play — 1920 × 1080. Запиши ціль і обидва налаштування. Слабкий ПК: Medium або High з r.ScreenPercentage 67 — запиши вибране в budget.md (див. розділ «Слабкий ПК» на сторінці ACCOUNTS-AND-INSTALLS.html). Перевірка: у budget.md є рядок цілі й рядок налаштувань."}, "lesson": 3}, {"text": {"en": "In Play (New Editor Window), fly with your Day 33 set-up. Run stat unit at the launch point, at C4's spot and at the widest view. Write Frame, Game, Draw and GPU for each. Check: three rows of four numbers in budget.md.", "uk": "У Play (New Editor Window) літай із налаштуванням з Дня 33. Запусти stat unit у точці старту, на місці C4 і в точці з найширшим видом. Для кожного місця запиши Frame, Game, Draw і GPU. Перевірка: у budget.md три рядки по чотири числа."}, "lesson": 3}, {"text": {"en": "Run stat gpu at the widest view and write its five biggest lines in budget.md. Check: you can name the job that costs the most.", "uk": "Запусти stat gpu в точці з найширшим видом і запиши п'ять найбільших рядків у budget.md. Перевірка: ти можеш назвати найдорожче завдання."}, "lesson": 3}, {"text": {"en": "CSV capture again, now through the whole sample: type csvprofile start, fly 60 seconds through the sample, then type csvprofile stop. Work out the average and the 95th percentile as in lesson 4: =AVERAGE(B2:B1800) and =PERCENTILE(B2:B1800;95/100), with your own column letter and last row. Check: four numbers in milliseconds in budget.md, for frame time and GPU time.", "uk": "CSV-запис ще раз, тепер із повною пробною ділянкою: введи csvprofile start, пролети 60 секунд над пробною ділянкою, потім введи csvprofile stop. Порахуй середнє і 95-й перцентиль, як в уроці 4: =AVERAGE(B2:B1800) і =PERCENTILE(B2:B1800;95/100), зі своєю літерою стовпця й останнім рядком. Перевірка: у budget.md чотири числа в мілісекундах — для часу кадру й часу GPU."}, "lesson": 4}, {"text": {"en": "Shoot the sample again, now complete, from the two cameras that see it (HighResShot 1920x1080). In Krita, put each beside its nearest reference photo and export sample_board.png. Write your verdict at the bottom of sample.md: three keep-or-change lines and the cost line. Check: sample_board.png opens and shows two pairs, engine shot left and photo right.", "uk": "Зніми пробну ділянку ще раз, тепер повну, з двох камер, які її бачать (HighResShot 1920x1080). У Krita постав кожен кадр поруч із найближчим фото-референсом і експортуй sample_board.png. Унизу sample.md запиши вердикт: три рядки «лишити чи змінити» і рядок про вартість. Перевірка: sample_board.png відкривається, на ньому дві пари — кадр із рушія ліворуч, фото праворуч."}, "lesson": 4}, {"text": {"en": "Paste sample_board.png and sample.md into the tutor chat, and add any note you accept. Check: sample.md ends with yes or no to 'the recipe works'.", "uk": "Встав sample_board.png і sample.md у чат із тьютором і допиши нотатки, які приймаєш. Перевірка: sample.md закінчується відповіддю «так» чи «ні» на «рецепт працює»."}, "lesson": 4}, {"text": {"en": "Report and hand-in: click Copy the day report at the bottom of the page, paste it into a new chat and answer. Open summary.md in Notepad, press Ctrl+End, paste the answer and press Ctrl+S. Then drag the files on the Hand in list into your hand-in folder. Check: every name shows in the folder, each with a size.", "uk": "Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: кожна назва зі списку є в папці, у кожної є розмір."}, "lesson": "D0.1"}], "assets": ["island12/example-plot-plan.md"]}, "lessons": [{"title": {"en": "The sample plot: test the recipe small", "uk": "Пробна ділянка: перевір рецепт у малому"}, "minutes": 40, "goals": [{"en": "Explain why a studio builds a small sample first: it tests the look and the cost while changes are still cheap.", "uk": "Пояснювати, навіщо студія спершу будує малу пробну ділянку: вона перевіряє вигляд і вартість, поки зміни ще дешеві."}, {"en": "Choose a 60 x 60 m slice that holds every kind of item your district has.", "uk": "Вибирати шматок 60 × 60 м, у якому є всі види елементів твого району."}, {"en": "Place the district's five review cameras C1 to C5 from your Day 23 camera arrows, so every later review is shot from the same places.", "uk": "Ставити п'ять камер огляду району, C1–C5, за стрілками камер з Дня 23, щоб кожен наступний огляд знімати з тих самих місць."}], "doalong": [{"en": "Open plot_plan_d1.png in Krita. In the Layers docker (right side), click the + button to add a layer and name it sample. You should see your plan with an empty layer on top.", "uk": "Відкрий plot_plan_d1.png у Krita. У докері Layers (праворуч) клацни кнопку +, щоб додати шар, і назви його sample. Має вийти: твій план із порожнім шаром зверху."}, {"en": "Pick the Rectangle tool (Toolbox, left side). Draw a square 240 px wide over a slice with water, buildings, a street and planting. Your plan has 4 px per metre, so 240 px is 60 m. Check the width with the Measure tool. You should see one square that holds every kind of item.", "uk": "Вибери інструмент Rectangle (Toolbox, ліворуч). Намалюй квадрат шириною 240 px над шматком, де є вода, будівлі, вулиця й рослини. На твоєму плані 4 px на метр, тож 240 px — це 60 м. Перевір ширину інструментом Measure. Має вийти один квадрат, у якому є всі види елементів."}, {"en": "Write sample.md: the four corners in island metres (read them on the grid labels), then copy every row of plot_plan_d1.md that falls inside the box. You should see a short table where every count is a number.", "uk": "Напиши sample.md: чотири кути в острівних метрах (зчитай їх із підписів сітки). Потім скопіюй кожен рядок plot_plan_d1.md, що потрапляє в квадрат. Має вийти коротка таблиця, де кожна кількість — число."}, {"en": "In Unreal, open L_Island and load only district 1: Window > World Partition > World Partition Editor, drag a box over district 1, right-click > Load Region From Selection (as on Day 33). You should see district 1 in the viewport and the rest unloaded.", "uk": "В Unreal відкрий L_Island і завантаж лише район 1: Window > World Partition > World Partition Editor. Обведи рамкою район 1, клацни правою кнопкою > Load Region From Selection (як у День 33). У в'юпорті тепер район 1, а решту вивантажено."}, {"en": "In the main toolbar click Add (the cube with a +) > Cinematic > Cine Camera Actor. Drop it near your C1 arrow and rename it C1 (F2). You should see C1 in the Outliner.", "uk": "На головній панелі інструментів клацни Add (куб із +) > Cinematic > Cine Camera Actor. Постав камеру біля стрілки C1 і перейменуй на C1 (F2). C1 з'являється в Outliner."}, {"en": "Right-click C1 > Pilot 'C1'. Move with the mouse and W, A, S, D until the view matches the arrow, its height and its hero photo. Click the eject button at the top left of the viewport. You should see the camera keep that view.", "uk": "Клацни правою кнопкою C1 > Pilot 'C1'. Рухайся мишею і клавішами W, A, S, D, поки вид не збігатиметься зі стрілкою, її висотою і ключовим фото. Клацни кнопку виходу (Eject) угорі ліворуч у в'юпорті. Камера зберігає цей вид."}, {"en": "Repeat for C2 to C5. Then right-click each camera > Transform > Lock Actor Movement. You should see that a locked camera doesn't move when you try to drag it.", "uk": "Повтори для C2–C5. Потім клацни правою кнопкою кожну камеру > Transform > Lock Actor Movement. Заблокована камера не рухається, коли пробуєш її тягнути."}], "play": {"en": "Recipe guess: I describe my sample box to the tutor. It guesses which three things will be hardest to get right. After the build I tell it whether it was right.", "uk": "Вгадай рецепт: я описую тьютору свій квадрат пробної ділянки. Він вгадує, які три речі буде найважче зробити як слід. Після самостійної роботи я кажу йому, чи він вгадав."}, "video": {"url": "https://www.youtube.com/watch?v=CW8hDvJOwGM", "title": "Unreal Engine 5 Cinematic Camera Tutorial for Beginners STEP BY STEP", "channel": "EZ Unreal", "length": "7:46", "search": "unreal engine 5 cine camera actor"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Пробна ділянка: перевір рецепт у малому (Day 41, lesson 1 of 4). Today's build: Пробна ділянка району 1 розміром 60 × 60 м, розставлена за plot_plan_d1.png, і budget.md: скільки мілісекунд коштує ця ділянка твоєму ПК.\nWhat I already know: День 23: plot_plan_d1.png і plot_plan_d1.md — твій план ділянки з підрахунками для району 1, зі стрілками камер C1–C5; День 24: список потреб для району 1 і вибрані тобою безкоштовні паки; День 20: твій освітлений куточок гавані — набір, матеріали й світло, які вже спрацювали; Дні 7–10: твій набір: SM_QuayEdge_4m, SM_PierDeck_4m, деталі стін і LI_HarbourHouse (Level Instance з Дня 10); День 22 і День 26: острівні метри (X на схід, Y на південь від центру мапи) і L_Island із центром у (0, 0); День 33: DL_District1 і налаштування польоту в Play. Дні 38–40: L_Island, наповнений PCG, з KO_District1 (зоною-винятком навколо району 1) і boss_day40.md (stat unit і пам'ять на CAM_Wide).\n\nBy the end of this lesson I can:\n1. Пояснювати, навіщо студія спершу будує малу пробну ділянку: вона перевіряє вигляд і вартість, поки зміни ще дешеві.\n2. Вибирати шматок 60 × 60 м, у якому є всі види елементів твого району.\n3. Ставити п'ять камер огляду району, C1 icks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Відкрий plot_plan_d1.png у Krita. У докері Layers (праворуч) клацни кнопку +, щоб додати шар, і назви його sample. Має вийти: твій план із порожнім шаром зверху.\n   2. Вибери інструмент Rectangle (Toolbox, ліворуч). Намалюй квадрат шириною 240 px над шматком, де є вода, будівлі, вулиця й рослини. На твоєму плані 4 px на метр, тож 240 px — це 60 м. Перевір ширину інструментом Measure. Має вийти один квадрат, у якому є всі види елементів.\n   3. Напиши sample.md: чотири кути в острівних метрах (зчитай їх із підписів сітки). Потім скопіюй кожен рядок plot_plan_d1.md, що потрапляє в квадрат. Має вийти коротка таблиця, де кожна кількість — число.\n   4. В Unreal відкрий L_Island і завантаж лише район 1: Window > World Partition > World Partition Editor. Обведи рамкою район 1, клацни правою кнопкою > Load Region From Selection (як у День 33). У в'юпорті тепер район 1, а решту вивантажено. [screenshot]\n   5. На головній панелі інструментів клацни Add (куб із +) > Cinematic > Cine Camera Actor. Постав камеру біля стрілки C1 і перейменуй на C1 (F2). C1 з'являється в Outliner.\n   6. Клацни правою кнопкою C1 > Pilot 'C1'. Рухайся мишею і клавішами W, A, S, D, поки вид не збігатиметься зі стрілкою, її висотою і ключовим фото. Клацни кнопку виходу (Eject) угорі ліворуч у в'юпорті. Камера зберігає цей вид.\n   7. Повтори для C2–C5. Потім клацни правою кнопкою кожну камеру > Transform > Lock Actor Movement. Заблокована камера не рухається, коли пробуєш її тягнути. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Вгадай рецепт: я описую  lesson 3 (Бюджет кадру: stat unit і stat gpu). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Записувати весь проліт, а не одну мить. CSV-запис — це файл, де на кожен кадр один рядок, а на кожен вимір часу — один стовпець. Його вмикають командою csvprofile start і вимикають csvprofile stop.\n2. Читати CSV-запис у безкоштовній таблиці. =AVERAGE() дає типовий кадр. =PERCENTILE(діапазон;95/100) дає 95-й перцентиль: його перевищують лише 5 % найповільніших кадрів. Це ті ривки, які відчуває пілот.\n3. Оцінювати пробну ділянку двома способами: поруч із фото-референсами і за бюджетом.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: 2 lines on why today matters and where it comes back, in plain words (from this: Студії спершу перевіряють малий шматок, а вже потім будують цілий район. Пробна ділянка показує, чи працюють твій набір, паки й світло в справжньому масштабі і скільки вони коштують. Якщо гальмує вже 60 × 60 м, ти дізнаєшся про це сьогодні, а не на 12-му тижні. It comes back: Завтра пробна ділянка виросте в увесь район 1, а камери C1–C5 зніматимуть кожен огляд району 1. budget.md зростатиме до Дня 56 і там стане доказом бюджету в портфоліо.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-41-district1-sample-and-budget exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (Квадрат пробної ділянки, його кутові маркери й перша будівля — разом із тьютором). M запиши три рядки «лишити чи змінити». Одним поглядом видно, що в рецепті вже вдалося. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Полювання на піки: я кажу тьютору, де на моєму графіку піки. Він ставить три запитання про те, що там було на екрані, і разом ми називаємо ймовірну причину. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\nIf I want to go deeper, recommend this free video: \"Level Streaming: Profiling And Performance Optimization. Ep.2 Perf Test And CSV Profiler\" by UsefulCode: https://www.youtube.com/watch?v=Bzf35Aa-M1s\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; rubric = таблиця оцінювання; review (by tutor or art director) = огляд; credits line = рядок авторства; reference photo / hero photo = фото-референс / ключове фото; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); default value = типове значення; File Explorer = Провідник; grid = сітка (тільки grid, ніколи mesh); vertex / edge / face = вершина / ребро / грань; world origin / 3D cursor = центр світу / 3D-курсор; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; kit / kit piece / part of one object = набір / деталь / частина; map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; district / plot / plot plan = район / ділянка / план ділянки; harbour / quay / waterfront / pier = гавань / причал / набережна / пірс; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; locked camera / locked exposure = заблокована камера / зафіксована експозиція; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}], "handin": [{"en": "summary.md", "uk": "summary.md (звіт дня)"}, {"en": "budget.md: the target, the settings, stat unit, stat gpu and the CSV numbers (→ Day 43)", "uk": "budget.md (ціль, налаштування, stat unit, stat gpu і числа з CSV) (→ День 43)"}, {"en": "sample.md with your verdict lines (→ Day 42)", "uk": "sample.md (з рядками вердикту) (→ День 42)"}, {"en": "sample_board.png: two sample shots beside two reference photos (proof)", "uk": "sample_board.png (два кадри пробної ділянки поруч із двома фото-референсами) (доказ)"}], "goal": {"en": "By the end of today you have a 60 x 60 m waterfront sample in L_Island, and budget.md with its cost in milliseconds.", "uk": "Наприкінці дня в тебе є пробна ділянка набережної 60 × 60 м у L_Island і budget.md з її вартістю в мілісекундах."}, "uses": [{"en": "Day 23: plot_plan_d1.png and plot_plan_d1.md, your counted plan for district 1, with its camera arrows C1 to C5", "uk": "День 23: plot_plan_d1.png і plot_plan_d1.md — твій план ділянки з підрахунками для району 1, зі стрілками камер C1–C5"}, {"en": "Day 24: your district 1 needs list and the free packs you picked", "uk": "День 24: список потреб для району 1 і вибрані тобою безкоштовні паки"}, {"en": "Day 20: your lit harbour corner (the kit, materials and light that already worked)", "uk": "День 20: твій освітлений куточок гавані — набір, матеріали й світло, які вже спрацювали"}, {"en": "Days 7 to 10: your kit (SM_QuayEdge_4m, SM_PierDeck_4m, the wall pieces and LI_HarbourHouse, your Day 10 Level Instance)", "uk": "Дні 7–10: твій набір: SM_QuayEdge_4m, SM_PierDeck_4m, деталі стін і LI_HarbourHouse (Level Instance з Дня 10)"}, {"en": "Days 22 and 26: island metres (X east, Y south from the map centre) and L_Island centred on (0, 0)", "uk": "День 22 і День 26: острівні метри (X на схід, Y на південь від центру мапи) і L_Island із центром у (0, 0)"}, {"en": "Day 33: DL_District1 and the flying Play set-up; Days 38 to 40: L_Island dressed by PCG, with KO_District1, the keep-out round district 1, and boss_day40.md (stat unit and memory at CAM_Wide)", "uk": "День 33: DL_District1 і налаштування польоту в Play. Дні 38–40: L_Island, наповнений PCG, з KO_District1 (зоною-винятком навколо району 1) і boss_day40.md (stat unit і пам'ять на CAM_Wide)"}], "quiz": [{"q": {"en": "Why do you build a 60 x 60 m sample before the whole 200 x 200 m district?", "uk": "Навіщо будувати пробну ділянку 60 × 60 м перед цілим районом 200 × 200 м?"}, "options": [{"en": "It is faster to light a small area", "uk": "Малу площу швидше освітлити"}, {"en": "It tests the look and the cost of the recipe before days go into placing", "uk": "Вона перевіряє вигляд і вартість рецепта, перш ніж на розміщення підуть дні"}, {"en": "Unreal can't load a 200 m district at once", "uk": "Unreal не може завантажити район 200 м одразу"}, {"en": "The tutor can only review small areas", "uk": "Тьютор може оглядати лише малі площі"}], "answer": 1, "explain": {"en": "The sample is a cheap test of the whole recipe. If the look or the cost is wrong, you lose an afternoon, not a week.", "uk": "Пробна ділянка — дешева перевірка всього рецепта. Якщо вигляд чи вартість не ті, ти втрачаєш пів дня, а не тиждень."}}, {"q": {"en": "stat unit shows Frame 21 ms, Game 6 ms, Draw 7 ms and GPU 20 ms. What limits your frame?", "uk": "stat unit показує Frame 21 мс, Game 6 мс, Draw 7 мс і GPU 20 мс. Що обмежує твій кадр?"}, "options": [{"en": "The game logic", "uk": "Логіка гри"}, {"en": "The CPU preparing the picture (Draw)", "uk": "Процесор, що готує картинку (Draw)"}, {"en": "The graphics card (GPU)", "uk": "Відеокарта (GPU)"}, {"en": "The hard drive", "uk": "Жорсткий диск"}], "answer": 2, "explain": {"en": "The slowest of Game, Draw and GPU sets the frame. Here the GPU takes 20 ms, so the graphics card is the limit.", "uk": "Кадр задає найповільніший із Game, Draw і GPU. Тут GPU займає 20 мс, тож обмеження — відеокарта."}}, {"q": {"en": "Your target is 60 frames a second. What is the most an average frame may take?", "uk": "Твоя ціль — 60 кадрів на секунду. Скільки щонайбільше може тривати середній кадр?"}, "options": [{"en": "16.6 ms", "uk": "16,6 мс"}, {"en": "33.3 ms", "uk": "33,3 мс"}, {"en": "60 ms", "uk": "60 мс"}, {"en": "6 ms", "uk": "6 мс"}], "answer": 0, "explain": {"en": "One second is 1,000 ms; 1,000 divided by 60 is about 16.6 ms per frame.", "uk": "Одна секунда — це 1000 мс; 1000, поділене на 60, — це приблизно 16,6 мс на кадр."}}, {"q": {"en": "Your CSV average frame time is 14 ms, but the 95th percentile is 38 ms. What does that tell you?", "uk": "У твоєму CSV середній час кадру 14 мс, але 95-й перцентиль — 38 мс. Що це означає?"}, "options": [{"en": "Everything is fine because the average is under budget", "uk": "Усе гаразд, бо середнє вкладається в бюджет"}, {"en": "Most frames are fine, but some hitches go over 33.3 ms and a pilot will feel them", "uk": "Більшість кадрів у нормі, але деякі ривки перевищують 33,3 мс, і пілот їх відчує"}, {"en": "The CSV file is broken", "uk": "Файл CSV зламаний"}, {"en": "The graphics card is idle", "uk": "Відеокарта простоює"}], "answer": 1, "explain": {"en": "The average hides the slow frames. A 95th percentile over 33.3 ms means stutters a pilot notices.", "uk": "Середнє ховає повільні кадри. 95-й перцентиль понад 33,3 мс означає ривки, які пілот помічає."}}, {"q": {"en": "Your plan puts a building at island X 240 m, Y -360 m. L_Island is centred on (0, 0) with the same axis directions. What do you type into Location?", "uk": "На твоєму плані будівля стоїть в острівних X 240 м, Y -360 м. Центр L_Island — у (0, 0), осі напрямлені так само. Що ти вводиш у Location?"}, "options": [{"en": "X 240, Y -360", "uk": "X 240, Y -360"}, {"en": "X 2400, Y -3600", "uk": "X 2400, Y -3600"}, {"en": "X -24000, Y 36000", "uk": "X -24000, Y 36000"}, {"en": "X 24000, Y -36000", "uk": "X 24000, Y -36000"}], "answer": 3, "explain": {"en": "Unreal works in centimetres, so multiply island metres by 100: 240 m is 24000 and -360 m is -36000. The signs stay, because the axes match.", "uk": "Unreal працює в сантиметрах, тож множ острівні метри на 100: 240 м — це 24000, а -360 м — це -36000. Знаки не змінюються, бо осі збігаються."}}], "weekInfo": {"week": 9, "title": {"en": "District 1: the waterfront", "uk": "Район 1: набережна"}, "goal": {"en": "By Friday you have district 1, your waterfront, built from your plan and measured against a frame budget, with five screenshots beside your reference photos.", "uk": "До п'ятниці в тебе є район 1 — твоя набережна, збудована за планом і виміряна бюджетом кадру, з п'ятьма скриншотами поруч із фото-референсами."}, "skills": [{"en": "Set dressing a 200 x 200 m district from a counted plot plan in Unreal Engine 5", "uk": "Наповнення сцени (set dressing) району 200 × 200 м за планом ділянки з підрахунками в Unreal Engine 5"}, {"en": "Performance budgeting with stat unit, stat gpu and CSV profiling", "uk": "Бюджет продуктивності: stat unit, stat gpu і CSV-профілювання"}, {"en": "Modular building assembly with Level Instances and Packed Level Actors", "uk": "Збирання модульних будівель із Level Instance і Packed Level Actor"}, {"en": "Decal and material-wear storytelling for realistic environments", "uk": "Розповідь через декалі та зношеність матеріалів для реалістичного оточення"}, {"en": "Art review against reference photographs with located see-why-fix notes", "uk": "Огляд роботи за фото-референсами: нотатки «бачу, чому, як виправити» з точним місцем"}]}, "morning": {"sofar": {"en": "Eight weeks in, your whole island is dressed by PCG, from forest to shoreline, on land and water you shaped yourself.", "uk": "Вісім тижнів позаду: PCG наповнив увесь острів, від лісу до берегової лінії, на землі й воді, створених твоїми руками."}, "today": {"en": "You build a 60 x 60 m sample of your waterfront from your plan and measure in milliseconds what it costs your PC.", "uk": "Сьогодні ти будуєш за планом пробну ділянку набережної 60 × 60 м і вимірюєш у мілісекундах, скільки вона коштує твоєму ПК."}, "cheer": {"en": "A sample is a safe place to test, so try things freely; the numbers only tell you what to do next.", "uk": "Пробна ділянка — безпечне місце для експериментів, тож пробуй вільно: числа лише підкажуть наступний крок."}, "quote": {"text": {"en": "I have always been more interested in experiment, than in accomplishment.", "uk": "Мене завжди більше цікавив експеримент, ніж досягнення."}, "author": {"en": "Orson Welles", "uk": "Орсон Веллс"}, "source": "https://en.wikiquote.org/wiki/Orson_Welles"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-41-district1-sample-and-budget", "mapHref": "../../COURSE.html", "prevHref": "../Day-40-boss-whole-island-pcg/START-HERE.html", "nextHref": "../Day-42-district1-buildings-and-fronts/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8, Krita and a free spreadsheet. I am a beginner on Day 41. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me and don't write code.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: Решта пробної ділянки, бюджет і CSV-запис — самостійно.\nIt's part of: Пробна ділянка району 1 розміром 60 × 60 м, розставлена за plot_plan_d1.png, і budget.md: скільки мілісекунд коштує ця ділянка твоєму ПК (Усередині району 1 — червоний квадрат 200 × 200 м на island_map.png. Вибери на plot_plan_d1.png шматок 60 × 60 м із типовою сумішшю: причал, дві-три будівлі, вулиця й рослини.).\nWhy it matters: Студії спершу перевіряють малий шматок, а вже потім будують цілий район. Пробна ділянка показує, чи працюють твій набір, паки й світло в справжньому масштабі і скільки вони коштують. Якщо гальмує вже 60 × 60 м, ти дізнаєшся про це сьогодні, а не на 12-му тижні. It comes back: Завтра пробна ділянка виросте в увесь район 1, а камери C1–C5 зніматимуть кожен огляд району 1. budget.md зростатиме до Дня 56 і там стане доказом бюджету в портфоліо.\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-41-district1-sample-and-budget (on the drive I chose on Day 0).\nWhat I already know: День 23: plot_plan_d1.png і plot_plan_d1.md — твій план ділянки з підрахунками для району 1, зі стрілками камер C1–C5; День 24: список потреб для району 1 і вибрані тобою безкоштовні паки; День 20: твій освітлений куточок гавані — набір, матеріали й світло, які вже спрацювали; Дні 7–10: твій набір: SM_QuayEdge_4m, SM_PierDeck_4m, деталі стін і LI_HarbourHouse (Level Instance з Дня 10); День 22 і День 26: острівні метри (X на схід, Y на південь від центру мапи) і L_Island із центром у (0, 0); День 33: DL_District1 і налаштування польоту в Play. Дні 38–40: L_Island, наповнений PCG, з KO_District1 (зоною-винятком навколо району 1) і boss_day40.md (stat unit і пам'ять на CAM_Wide); today's lessons: Пробна ділянка: перевір рецепт у малому; Точне розміщення за планом на великому острові; Бюджет кадру: stat unit і stat gpu; CSV-запис і вердикт пробної ділянки. Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- sample.md: чотири кути квадрата 60 × 60 м в острівних метрах. Під ними — кожен рядок plot_plan_d1.md, що потрапляє в квадрат: що, скільки, де (у метрах), звідки. Унизу — твій вердикт: три рядки «лишити чи змінити» і один рядок про вартість.\n- У L_Island, на DL_District1 (Data Layer з Дня 33, зроблений поточним): чотири кутові маркери по 1 м і кожен елемент пробної ділянки на координатах з плану. Location у сантиметрах = острівні метри × 100. Нічого зайвого: якщо план хибний, спершу зміни план.\n- Деталі: твій набір причалу й пірса вздовж води і дві-три будівлі — LI_HarbourHouse з Дня 10, стіни з набору або будівля з пака. Додай кілька пропсів з 1-го тижня і рослини з паків. Кожна основа торкається землі.\n- П'ять камер Cine Camera, C1–C5, для всього району. Постав їх за стрілками камер на plot_plan_d1.png і заблокуй. C1 — підліт, C2 — будівлі, C3 — головний об'єкт, C4 — загальний план, C5 — близький план землі. Назви не збігаються з камерами острова з Дня 30 (CAM_Island_C1–CAM_Island_C3). Принаймні дві з п'яти камер бачать пробну ділянку.\n- budget.md: ціль — середній кадр до 16,6 мс і 95-й перцентиль до 33,3 мс при 1920 × 1080. Запиши налаштування: Play у New Editor Window при 1920 × 1080, Engine Scalability High. Потім запиши stat unit (Frame, Game, Draw, GPU) у трьох місцях: у точці старту, на місці C4 і в точці з найширшим видом.\n- stat gpu у точці з найширшим видом: п'ять найбільших рядків у budget.md. stat gpu ділить час відеокарти на завдання, як-от тіні чи світло.\n- CSV-запис 60-секундного прольоту над пробною ділянкою — файл із часом кожного кадру. У безкоштовній таблиці порахуй середнє і 95-й перцентиль для часу кадру й часу GPU і запиши їх у budget.md. 95-й перцентиль — це час, який перевищують лише 5 % найповільніших кадрів.\n- sample_board.png: два кадри пробної ділянки з рушія поруч із двома фото-референсами. Рядки вердикту в sample.md відповідають на одне запитання: чи працює рецепт і чи лишається в бюджеті місце для всього району?\n\nMy checklist (the same numbers show on my course page):\n1. Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: sample.md, budget.md і csv_chart.png, а в L_Island — камери C1–C5 і чотири кутові маркери. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Потім доповни sample.md кожним рядком плану всередині квадрата. Перевірка: у кожного рядка є кількість і місце в метрах. (from lesson 1)\n2. Завантаж область району 1 і зроби DL_District1 поточним Data Layer. Подивись на чотири кутові маркери з виду Top. Перевірка: кожен маркер стоїть не далі ніж за 0,5 м від кута квадрата на плані. (from lesson 2)\n3. Подивись по черзі через C1–C5 (клацни правою кнопкою > Pilot). Перевірка: кожна камера показує те, що обіцяють її стрілка і ключове фото, а заблокована камера не рухається, коли її тягнеш. (from lesson 1)\n4. Причал і пірс: поклади SM_QuayEdge_4m уздовж краю води на пробній ділянці, а SM_PierDeck_4m — там, де на плані пірс. Перевірка: з 2 м між деталями немає щілин, а верхи на одній висоті. (from lesson 2)\n5. Будівлі: постав дві-три на координати з плану (LI_HarbourHouse, стіни з набору або будівля з пака). Натисни End і занур нижчий бік. Перевірка: з 2 м видно, що всі чотири кути торкаються землі. (from lesson 2)\n6. Пропси й рослини: кілька пропсів з 1-го тижня і рослини з паків на місцях з плану. Натисни Ctrl+S. Перевірка: на низькому боковому виді жодна основа не висить, а зірочка (*) на вкладці L_Island зникла. (from lesson 2)\n7. Скопіюй рядки stat unit і пам'яті з boss_day40.md (День 40) у budget.md — це твоя відправна точка. Постав Engine Scalability на High, а вікно Play — 1920 × 1080. Запиши ціль і обидва налаштування. Слабкий ПК: Medium або High з r.ScreenPercentage 67 — запиши вибране в budget.md (див. розділ «Слабкий ПК» на сторінці ACCOUNTS-AND-INSTALLS.html). Перевірка: у budget.md є рядок цілі й рядок налаштувань. (from lesson 3)\n8. У Play (New Editor Window) літай із налаштуванням з Дня 33. Запусти stat unit у точці старту, на місці C4 і в точці з найширшим видом. Для кожного місця запиши Frame, Game, Draw і GPU. Перевірка: у budget.md три рядки по чотири числа. (from lesson 3)\n9. Запусти stat gpu в точці з найширшим видом і запиши п'ять найбільших рядків у budget.md. Перевірка: ти можеш назвати найдорожче завдання. (from lesson 3)\n10. CSV-запис ще раз, тепер із повною пробною ділянкою: введи csvprofile start, пролети 60 секунд над пробною ділянкою, потім введи csvprofile stop. Порахуй середнє і 95-й перцентиль, як в уроці 4: =AVERAGE(B2:B1800) і =PERCENTILE(B2:B1800;95/100), зі своєю літерою стовпця й останнім рядком. Перевірка: у budget.md чотири числа в мілісекундах — для часу кадру й часу GPU. (from lesson 4)\n11. Зніми пробну ділянку ще раз, тепер повну, з двох камер, які її бачать (HighResShot 1920x1080). У Krita постав кожен кадр поруч із найближчим фото-референсом і експортуй sample_board.png. Унизу sample.md запиши вердикт: три рядки «лишити чи змінити» і рядок про вартість. Перевірка: sample_board.png відкривається, на ньому дві пари — кадр із рушія ліворуч, фото праворуч. (from lesson 4)\n12. Встав sample_board.png і sample.md у чат із тьютором і допиши нотатки, які приймаєш. Перевірка: sample.md закінчується відповіддю «так» чи «ні» на «рецепт працює». (from lesson 4)\n13. Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: кожна назва зі списку є в папці, у кожної є розмір. (from day 0, lesson 1)\n\nHow to help: ask which step number I'm on, then give me only the next step: the exact clicks and what I should see. When I send a screenshot, compare it with my reference, my sizes and the spec, and name one thing to fix at a time.\nCheck every save and export by reopening it before we move on:\n- a .md or .txt: open it with Notepad; the text is there, and the name doesn't end in .md.txt\nWhen I write \"готово\", and in any case before the day ends, check with me one item at a time (yes/no): each spec point, then each file on my hand-in list, ready in my day work folder (skip summary.md: the day report writes it next):\n1. budget.md (ціль, налаштування, stat unit, stat gpu і числа з CSV) (→ День 43)\n2. sample.md (з рядками вердикту) (→ День 42)\n3. sample_board.png (два кадри пробної ділянки поруч із двома фото-референсами) (доказ)\nFinish with a short list of anything missing, and one line on where this work comes back and what it will look like there. Then tell me the order for the end of the day: first the day report (the Copy the day report button at the bottom of my course page) into summary.md, and only then hand in all the files on the list, summary.md too.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; rubric = таблиця оцінювання; review (by tutor or art director) = огляд; see-why-fix note = нотатка «бачу, чому, як виправити»; checklist = чек-лист; credits line = рядок авторства; reference photo / hero photo = фото-референс / ключове фото; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); default value = типове значення; grid = сітка (тільки grid, ніколи mesh); vertex / edge / face = вершина / ребро / грань; world origin / 3D cursor = центр світу / 3D-курсор; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; collision / UCX collision box = колізія / блок UCX; volume (PCG Volume, Post Process Volume) = об'єм; kit / kit piece / part of one object = набір / деталь / частина; map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; district / plot / plot plan = район / ділянка / план ділянки; harbour / quay / waterfront / pier = гавань / причал / набережна / пірс; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; locked camera / locked exposure = заблокована камера / зафіксована експозиція; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; hero shot = головний кадр (hero shot); proof (picture) = доказ; shot set = серія кадрів.\n\nStart by asking for my best reference photo. Then, one at a time, my sizes and my step number.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender.", "reportPrompt": "Help me write today's report for summary.md. I write it before I hand in. Talk to me in simple Ukrainian, and never use gendered forms about me. Keep the English labels below exactly; the text after each label may be Ukrainian.\nAsk me one thing at a time, and skip whatever I've already pasted below:\n1. My lesson summaries («Засвоєно» / «Було важко»), or which lessons I skipped.\n2. My first score in the page's \"Check yourself\" quiz.\n3. How far the build got: done, partly or blocked (if blocked, where).\n4. My hand-in list, one item at a time (skip summary.md): is the file ready in my day work folder (GAD\\Day-41-district1-sample-and-budget)? (yes/no)\n   - budget.md (ціль, налаштування, stat unit, stat gpu і числа з CSV) (→ День 43)\n   - sample.md (з рядками вердикту) (→ День 42)\n   - sample_board.png (два кадри пробної ділянки поруч із двома фото-референсами) (доказ)\n5. One question for Thalia (about any day; start with the day number), or \"none\".\n6. Whether I fixed an earlier day today (which day and what), or \"no\".\n7. About how many hours today took.\nThen give me the finished report in one block I can copy:\n\nTeam summary, <date>, Ksenia\nDay 41: District 1 sample plot and your frame budget. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nReady to hand in: <tick each item of today's list: ✓ name, or ✗ name and why it isn't ready>\nMissing: <files not ready, or \"none\">\nFixed: <Day N: what I fixed (the fixed files are in that day's hand-in folder), or \"none\">\nQuestion for Thalia: <Day N: one line, or \"none\">\nHours: <about N>\nTo revisit: <the «Було важко» lines>\n\nThen tell me: open summary.md in today's day work folder (GAD\\Day-41-district1-sample-and-budget) with Notepad (right-click > Open with > Notepad; if there is no summary.md yet, make it: right-click > New > Text Document, named summary.md). Press Ctrl+End, paste the report below anything already there, and save with Ctrl+S. Never delete or paste over what is already in the file. Only then hand in all the files on the list, summary.md too, with the Open my hand-in folder button on the page.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт д const SEG={0:'abcdef',1:'bc',2:'abged',3:'abgcd',4:'fgbc',5:'afgcd',6:'afgedc',7:'abc',8:'abcdefg',9:'abcdfg'};
function seg(str,cls){str=String(str);const W=15,H=26,t=2.8,g=.9,P={a:[[g+t/2,0],[W-g-t/2,0],[W-g-t,t],[g+t,t]],d:[[g+t,H-t],[W-g-t,H-t],[W-g-t/2,H],[g+t/2,H]],g:[[g+t,H/2-t/2],[W-g-t,H/2-t/2],[W-g-t/2,H/2],[W-g-t,H/2+t/2],[g+t,H/2+t/2],[g+t/2,H/2]],f:[[0,g+t/2],[t,g+t],[t,H/2-g-t/2],[t/2,H/2-g],[0,H/2-g-t/2]],b:[[W,g+t/2],[W,H/2-g-t/2],[W-t/2,H/2-g],[W-t,H/2-g-t/2],[W-t,g+t]],e:[[0,H/2+g+t/2],[t/2,H/2+g],[t,H/2+g+t/2],[t,H-g-t],[0,H-g-t/2]],c:[[W,H/2+g+t/2],[W,H-g-t/2],[W-t,H-g-t],[W-t,H/2+g+t/2],[W-t/2,H/2+g]]};
 let x=0,o='';for(const ch of str){if(ch===' '){x+=8;continue}if(ch==='/'){o+='<path class="on" d="M'+(x+9)+' 2L'+(x+2)+' '+(H-2)+'L'+(x+4.5)+' '+(H-2)+'L'+(x+11.5)+' 2Z"/>';x+=15;continue}const on=SEG[ch]||'';
  for(const k of 'abcdefg')o+='<polygon class="'+(on.includes(k)?'on':'gh')+'" points="'+P[k].map(p=>(p[0]+x).toFixed(1)+','+p[1].toFixed(1)).join(' ')+'"/>';x+=W+5}
 return '<svg class="seg7'+(cls?' '+cls:'')+'" viewBox="-1 -1 '+(x-3)+' '+(H+2)+'" aria-hidden="true" focusable="false"><g transform="skewX(-6) translate(2 0)">'+o+'</g></svg>'}

function island(state,pct,label){
 const cx=300,cy=205,R=172,TAU=Math.PI*2;
 const rad=(t,s,k)=>R*s*(1+.11*Math.sin(2*t+.6+k*.05)+.07*Math.sin(3*t+1.9-k*.08)+.045*Math.sin(5*t+.3+k*.11)+.02*Math.sin(7*t+2.2));
 const pt=(t,s,k)=>{const r=rad(t,s,k||0);return [cx+r*Math.cos(t),cy+r*Math.sin(t)*.78]};
 const f=n=>n.toFixed(1);
 const smooth=(P,closed)=>{let d='M'+f(P[0][0])+' '+f(P[0][1]);const n=P.length,g=i=>P[closed?(i+n)%n:Math.max(0,Math.min(n-1,i))];
  for(let i=0;i<(closed?n:n-1);i++){const p0=g(i-1),p1=g(i),p2=g(i+1),p3=g(i+2);d+='C'+f(p1[0]+(p2[0]-p0[0])/6)+' '+f(p1[1]+(p2[1]-p0[1])/6)+' '+f(p2[0]-(p3[0]-p1[0])/6)+' '+f(p2[1]-(p3[1]-p1[1])/6)+' '+f(p2[0])+' '+f(p2[1])}return d+(closed?'Z':'')};
 const ring=(s,k)=>{const P=[];for(let i=0;i<64;i++)P.push(pt(i/64*TAU,s,k));return smooth(P,true)};
 let o='<path class="c0" d="'+ring(1,0)+'"/>';
 [.84,.69,.55,.42,.3,.19,.1].forEach((s,k)=>o+='<path class="c" d="'+ring(s,k+1)+'"/>');
 const t0=-2.2,turns=1.55,wp=w=>{const t=(w-1)/11;return {a:t0+t*turns*TAU,s:1.1-t*.98}};
 const P=[],D=[];let last=0;for(let w=1;w<=12;w++)if(state(w)!=='p')last=w;
 for(let i=0;i<=110;i++){const t=i/110,a=t0+t*turns*TAU,s=1.1-t*.98,q=pt(a,s,0);P.push(q);if(last&&t<=(last-1)/11+1e-9)D.push(q)}
 o+='<path class="rt" d="'+smooth(P,false)+'"/>';
 if(D.length>1)o+='<path class="rtd" d="'+smooth(D,false)+'"/>';
 for(let w=1;w<=12;w++){const c=state(w),{a,s}=wp(w),q=pt(a,s,0),lx=q[0]+(Math.cos(a)>=0?15:-15),an=Math.cos(a)>=0?'start':'end';
  o+='<g class="w '+c+'">'+(c==='n'?'<circle class="halo" cx="'+f(q[0])+'" cy="'+f(q[1])+'" r="12"/>':'')+'<circle class="dot" cx="'+f(q[0])+'" cy="'+f(q[1])+'" r="'+(c==='p'?4.5:c==='n'?8:6)+'"/><text x="'+f(lx)+'" y="'+f(q[1]+5.5)+'" text-anchor="'+an+'">'+String(w).padStart(2,'0')+'</text></g>'}
 /* the dial around it: a ring with the progress arc and a label running along the rim */

 let s='<svg class="dial" viewBox="0 0 400 400" aria-hidden="true" focusable="false"><defs><linearGradient id="'+id+'g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--acc2)"/><stop offset="1" style="stop-color:var(--acc)"/></linearGradient><path id="'+id+'" d="M200 200m-191 0a191 191 0 1 1 382 0a191 191 0 1 1-382 0"/></defs>';
 s+='<circle class="face" cx="200" cy="200" r="168"/><circle class="track" cx="200" cy="200" r="176"/>';
 s+='<circle class="arc" cx="200" cy="200" r="176" stroke="url(#'+id+'g)" stroke-dasharray="'+(C*p).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 200 200)"/>';
 if(p>0){const A=-Math.PI/2+p*TAU;s+='<circle class="knob'+(p<1?' go':'')+'" cx="'+(200+176*Math.cos(A)).toFixed(1)+'" cy="'+(200+176*Math.sin(A)).toFixed(1)+'" r="7"/>'}
 if(label)s+='<text class="rimt"><textPath href="#'+id+'" startOffset="25%" text-anchor="middle">'+label+'</textPath></text>';
 s+='<svg class="topo" x="40" y="62" width="320" height="276" viewBox="40 20 520 370">'+o+'</svg>';
 return s+'</svg>'}

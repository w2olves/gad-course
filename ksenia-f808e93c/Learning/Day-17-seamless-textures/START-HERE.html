<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 17</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

c_A_D. A second colourway, T_AwningFabric_B_D, is Gold.", "uk": "Кожна текстура має 2048 × 2048 px і покриває 2 × 2 м (стандарт набору): T_Paving_D, T_RoofTile_D і T_AwningFabric_A_D. Другий варіант кольорів, T_AwningFabric_B_D, — для Золота."}, {"en": "Paving from a real straight-on photo (yours or Wikimedia Commons), made seamless; roof tile and fabric drawn in Krita with Wrap Around Mode.", "uk": "Бруківка — зі справжнього фото, знятого прямо (твого або з Wikimedia Commons) і зробленого безшовним. Черепицю й тканину намальовано в Krita у Wrap Around Mode."}, {"en": "True sizes: a paving stone about 10 to 20 cm, roof tile rows 25 cm (256 px), awning stripes 25 cm (256 px).", "uk": "Справжні розміри: камінь бруківки приблизно 10–20 см, ряди черепиці 25 см (256 px), смуги маркізи 25 см (256 px)."}, {"en": "No visible seam, blotch or light-to-dark gradient when tiled 4 x 4; colours from your Day 16 palette.", "uk": "Жодного помітного шва, плями чи переходу від світлого до темного при тайлінгу 4 × 4. Кольори — з твоєї палітри з Дня 16."}, {"en": "Instances of M_Master: MI_Paving, MI_RoofTile (Day 12's instance, now textured) and MI_AwningFabric_A, with Tiling set so one texture covers 2 m.", "uk": "Інстанси M_Master: MI_Paving, MI_RoofTile (інстанс із Дня 12, тепер із текстурою) і MI_AwningFabric_A, з таким Tiling, щоб одна текстура покривала 2 м."}, {"en": "SM_Awning_A: a 2.4 x 1.2 m awning sloped about 15 degrees, with a 25 cm front flap and one UCX box. It is unwrapped at the kit standard. Its back edge hangs just under the fascia (2.5 m up), so its flap ends about 1.95 m up.", "uk": "SM_Awning_A: маркіза 2,4 × 1,2 м з нахилом близько 15 градусів, переднім клапаном 25 см і одним блоком UCX. Її розгорнуто за стандартом набору. Задній край висить одразу під вивісною дошкою (на висоті 2,5 м), тож клапан закінчується приблизно на висоті 1,95 м."}, {"en": "The five faults are checked on every texture with the build coach: seam, blotch, gradient, wrong size and colour outside the palette.", "uk": "Кожну текстуру перевірено разом із тьютором-помічником на п'ять вад: шов, пляма, градієнт, неправильний розмір і колір поза палітрою."}], "piece1": "the paving (shared with the lessons)", "piece2": {"en": "The roof tile finished, the awning fabric and SM_Awning_A, on your own", "uk": "Готова черепиця, тканина маркізи й SM_Awning_A, самостійно"}, "steps": [{"text": {"en": "Check: the files from today's lessons are in the day work folder (T_Paving_D.kra, T_Paving_D.png and T_RoofTile_D.kra). Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it. MI_Paving is on the test plane in L_KitTest.", "uk": "Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: T_Paving_D.kra, T_Paving_D.png і T_RoofTile_D.kra. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. MI_Paving лежить на тестовій площині в L_KitTest."}, "lesson": 1}, {"text": {"en": "Finish the roof tile: vary each tile a little from your palette's roof colour. Then Image > Offset Image by 1024 x 1024, clone out the cross and export T_RoofTile_D.png. Check: on the wrapped canvas (W) you can't find the repeat in 10 seconds.", "uk": "Заверши черепицю: зроби кожну черепичину трохи іншою, відштовхуючись від кольору даху з палітри. Потім Image > Offset Image, X 1024 і Y 1024, затри клоном хрест і експортуй T_RoofTile_D.png. Перевірка: на полотні з повтором (W) ти не знаходиш повтор за 10 секунд."}, "lesson": 3}, {"text": {"en": "Awning fabric: a new 2048 x 2048 canvas with eight stripes of 256 px (25 cm) in two palette colours. Add a faint criss-cross weave on a layer at 5 to 10 % opacity. Export T_AwningFabric_A_D.png. Check: zoomed out to 10 %, the stripes read and nothing blotches.", "uk": "Тканина маркізи: нове полотно 2048 × 2048 з вісьмома смугами по 256 px (25 см) двох кольорів палітри. Додай ледь помітне переплетення на шарі з непрозорістю 5–10 %. Експортуй T_AwningFabric_A_D.png. Перевірка: при масштабі 10 % смуги читаються, і плям немає."}, "lesson": 3}, {"text": {"en": "Awning model in a new Blender file: a Plane scaled to 2.4 x 1.2 m and tilted about 15 degrees. Extrude its front edge 25 cm down as the flap, then add a Solidify modifier of about 2 cm and apply it. Check: in the sidebar (N), Dimensions X reads 2.4 m.", "uk": "Модель маркізи в новому файлі Blender: Plane, масштабована до 2,4 × 1,2 м і нахилена приблизно на 15 градусів. Видави її передній край на 25 см униз — це клапан. Потім додай модифікатор Solidify приблизно 2 см і застосуй його. Перевірка: на бічній панелі (N) Dimensions X показує 2.4 m."}, "lesson": "D3.4"}, {"text": {"en": "Name it SM_Awning_A and put its origin at the back top corner, on the world origin, as on Day 7. Add one box over the slope, UCX_SM_Awning_A_00. Check: the orange origin dot sits at the back top corner.", "uk": "Назви її SM_Awning_A і постав origin у задній верхній кут, у центр світу, як у День 7. Додай один блок над схилом, UCX_SM_Awning_A_00. Перевірка: помаранчева точка origin стоїть у задньому верхньому куті."}, "lesson": "D7.2"}, {"text": {"en": "Append TD_Reference and unwrap the awning at the kit standard, with the stripes running down the slope. Save it as awning_day17.blend. Check: its checker squares match TD_Reference.", "uk": "Додай TD_Reference (File > Append) і розгорни маркізу за стандартом набору, щоб смуги йшли вниз по схилу. Збережи як awning_day17.blend. Перевірка: її клітинки шахівниці збігаються з TD_Reference."}, "lesson": "D11.4"}, {"text": {"en": "Close Blender and reopen awning_day17.blend, then export SM_Awning_A.fbx with its UCX box. Import it into Course/Day17 and set its slot to MI_AwningFabric_A. Check: the FBX is 10 KB or more, and beside the mannequin the awning is 2.4 m wide.", "uk": "Закрий Blender і знову відкрий awning_day17.blend, потім експортуй SM_Awning_A.fbx з блоком UCX. Імпортуй його в Course/Day17 і признач слоту MI_AwningFabric_A. Перевірка: FBX має 10 КБ або більше, а поруч із манекеном маркіза має 2,4 м завширшки."}, "lesson": "D11.4"}, {"text": {"en": "Open MI_RoofTile: tick BaseColor and pick T_RoofTile_D, and set Tint back to white. Leave Tiling at 1: kit roof UVs are already at the kit standard. Put it on the Roof slot of your roof pieces; no roof yet? Put it on a second 4 m test plane at Tiling 2. Check: from 10 m, tile rows run level.", "uk": "Відкрий MI_RoofTile: увімкни BaseColor, вибери T_RoofTile_D і поверни Tint на білий. Tiling лиши 1: UV дахів набору вже за стандартом набору. Признач інстанс слоту Roof на деталях даху. Даху ще немає? Признач його другій тестовій площині 4 м із Tiling 2. Перевірка: з 10 м ряди черепиці лежать рівно."}, "lesson": 4}, {"text": {"en": "Hang an awning over the window of SM_ShopFront_A in L_KitTest. Check: its back edge touches the front just under the fascia, with no gap, and the mannequin fits under it.", "uk": "Повісь маркізу над вітриною SM_ShopFront_A в L_KitTest. Перевірка: задній край торкається фасаду одразу під вивісною дошкою, без щілини, і манекен уміщується під маркізою."}, "lesson": 4}, {"text": {"en": "From 10 m, take tiling_test_10m.png: the paving plane, the roof tile on a roof or test plane, and the awning, with the mannequin in view. Check: today's proof picture is in your day work folder, and no seam or repeat shows.", "uk": "З 10 м зроби скриншот і збережи як tiling_test_10m.png: площина з бруківкою, черепиця на даху чи тестовій площині й маркіза, а в кадрі — манекен. Перевірка: сьогоднішній знімок-доказ лежить у робочій папці дня, і не видно ні шва, ні повтору."}, "lesson": 4}, {"text": {"en": "Gold (optional): swap the stripe colours for another palette pair as T_AwningFabric_B_D and make MI_AwningFabric_B. Put it on a second awning copy in Details > Materials. A colourway is one of the few right uses of a per-copy material. Check: the two awnings look as if one maker made them.", "uk": "Золото (за бажанням): заміни кольори смуг на іншу пару з палітри, збережи як T_AwningFabric_B_D і створи MI_AwningFabric_B. Признач його другій копії маркізи в Details > Materials. Варіант кольорів — один із небагатьох випадків, коли матеріал на окремій копії доречний. Перевірка: дві маркізи виглядають як вироби одного майстра."}, "lesson": 4}, {"text": {"en": "Report and hand-in: click Copy the day report at the bottom of the page, paste it into a new chat and answer. Open summary.md in Notepad, press Ctrl+End, paste the answer and press Ctrl+S. Then drag the files on the Hand in list into your hand-in folder. Check: every name shows in the folder, each with a size.", "uk": "Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: кожна назва зі списку є в папці, у кожної є розмір."}, "lesson": "D0.1"}], "assets": ["island12/credits-template.md"]}, "lessons": [{"title": {"en": "Real size, and a photo turned into a texture", "uk": "Реальний розмір і фото, що стає текстурою"}, "minutes": 40, "goals": [{"en": "Plan a texture at real size: 2048 px covers 2 m, so 1 cm is about 10 px.", "uk": "Планувати текстуру в справжньому розмірі: 2048 px покривають 2 м, тож 1 см — це приблизно 10 px."}, {"en": "Pick a photo that can tile: taken straight down or straight on, in even light, with no shadows of people or cars.", "uk": "Вибирати фото, яке можна затайлити: зняте прямо згори або прямо спереду, за рівномірного світла, без тіней людей чи машин."}, {"en": "Crop and straighten it in Krita to a square with the right number of stones.", "uk": "Обрізати й вирівнювати фото в Krita до квадрата з правильною кількістю каменів."}], "doalong": [{"en": "In L_KitTest drag a Plane (Place Actors > Shapes) onto the Land block behind the quay. Set Scale 4, 4, 1 and Location Z 1. You see a 4 m test plane waiting for its paving.", "uk": "У L_KitTest перетягни Plane (Place Actors > Shapes) на блок Land за причалом. Постав Scale 4, 4, 1 і Location Z 1. Має вийти тестова площина 4 м, яка чекає на бруківку."}, {"en": "Find a straight-on photo of real paving on Wikimedia Commons, or take one yourself from standing height, in shade. Credit it in credits.md. You see an evenly lit photo of stones.", "uk": "Знайди на Wikimedia Commons фото справжньої бруківки, зняте прямо, або зроби фото з висоти свого зросту, у тіні. Запиши його в credits.md. Має вийти рівномірно освітлене фото каменів."}, {"en": "Open it in Krita and pick the Crop tool. In Tool Options tick Ratio and set it to 1:1, then drag a square over the most even part and press Enter. You see a square of paving.", "uk": "Відкрий його в Krita й вибери інструмент Crop. У Tool Options увімкни Ratio і постав 1:1, потім протягни квадрат по найрівнішій частині й натисни Enter. Має вийти квадрат бруківки."}, {"en": "If the stone rows lean or narrow, press Ctrl+T, choose Perspective in Tool Options and drag the corners until the rows run straight. Press Enter. You see rows parallel to the edges.", "uk": "Якщо ряди каменів нахиляються чи звужуються, натисни Ctrl+T, вибери Perspective у Tool Options і тягни кути, доки ряди не стануть прямими. Натисни Enter. Ряди паралельні краям."}, {"en": "Count the stones across: at about 12 cm each, 2 m holds about 16. Image > Scale Image To New Size: 2048 x 2048 px, then crop again until about the right number fit. You see the right number of stones.", "uk": "Порахуй камені впоперек: якщо кожен приблизно 12 см, на 2 м їх уміщується близько 16. Image > Scale Image To New Size: 2048 × 2048 px, потім знову обріж, доки не вміститься приблизно потрібна кількість. Має вийти правильна кількість каменів."}, {"en": "File > Save As: T_Paving_D.kra in the day work folder. You see the name in the title bar.", "uk": "File > Save As: T_Paving_D.kra у робочій папці дня. Назва з'являється в рядку заголовка."}], "play": {"en": "Scale detective: the tutor names five surfaces (cobbles, bricks, roof tiles, deck planks, a woven mat). I say how many fit across a 2 m texture. Within 20 % scores.", "uk": "Детектив масштабу: тьютор називає п'ять поверхонь (бруківка, цегла, черепиця, дошки настилу, плетений килимок). Я кажу, скільки їх уміщується впоперек текстури 2 м. Похибка до 20 % — бал."}, "video": {"url": "https://www.youtube.com/watch?v=ZBj0azGxLxQ", "title": "How to Create Seamless Textures in GIMP in 2 Minutes", "channel": "MrWonderHow", "length": "2:28 (the same idea works in Krita)", "search": "krita seamless texture wrap around mode"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Реальний розмір і фото, що стає текстурою (Day 17, lesson 1 of 4). Today's build: Три безшовні текстури для гавані: бруківка, черепиця й тканина маркізи.\nWhat I already know: День 16: твій аркуш палітри й палітра Krita; День 11: стандарт набору (2048 px = 2 м) і TD_Reference; День 12: параметр Tiling у M_Master; День 13: Wrap Around Mode і Clone Tool у Krita, а також SM_ShopFront_A; День 10: твої деталі даху, якщо вони є.\n\nBy the end of this lesson I can:\n1. Планувати текстуру в справжньому розмірі: 2048 px покривають 2 м, тож 1 см — це приблизно 10 px.\n2. Вибирати фото, яке можна затайлити: зняте прямо згори або прямо спереду, за рівномірного світла, без тіней людей чи машин.\n3. Обрізати й вирівнювати фото в Krita до квадрата з правильною кількістю каменів.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: У тебе є палітра зі справжнього місця на узбережжі, і твій набір для гавані вже має її кольори в Unreal. Today: Сьогодні ти робиш три безшовні текстури — для мощення, черепиці й тканини маркізи — і перевіряєш їх у реальному розмірі в Unreal. One encouraging line: Художники з текстур роками вчаться ховати повтори, тож тішся кожним швом, який сьогодні зникне.); 2 lines on why today matters and where it comes back, in plain words (from this: Сьогодні ти робиш бруківку, черепицю й смугасту маркізу, які повторюються без кінця й без помітного стику, і вішаєш справжню маркізу на свою крамницю. Шов, що повторюється кожні 2 м, — перше, що покаже кадр із дрона, тому студіям потрібні люди, які вміють робити текстури, що чисто тайляться. It comes back: MI_Paving вимостить п'ятничний куточок гавані й вулиці району 1 у День 42, а MI_RoofTile і SM_Awning_A вдягнуть п'ятничну будівлю. Відтепер кожна твоя текстура проходить ту саму перевірку на п'ять вад.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-17-seamless-textures exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (бруківка (спільна з уроками)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. У L_KitTest перетягни Plane (Place Actors > Shapes) на блок Land за причалом. Постав Scale 4, 4, 1 і Location Z 1. Має вийти тестова площина 4 м, яка чекає на бруківку.\n   2. Знайди на Wikimedia Commons фото справжньої бруківки, зняте прямо, або зроби фото з висоти свого зросту, у тіні. Запиши його в credits.md. Має вийти рівномірно освітлене фото каменів.\n   3. Відкрий його в Krita й вибери інструмент Crop. У Tool Options увімкни Ratio і постав 1:1, потім протягни квадрат по найрівнішій частині й натисни Enter. Має вийти квадрат бруківки. [screenshot]\n   4. Якщо ряди каменів нахиляються чи звужуються, натисни Ctrl+T, вибери Perspective у Tool Options і тягни кути, доки ряди не стануть прямими. Натисни Enter. Ряди паралельні краям.\n   5. Порахуй камені впоперек: якщо кожен приблизно 12 см, на 2 м їх уміщується близько 16. Image > Scale Image To New Size: 2048 × 2048 px, потім знову обріж, доки не вміститься приблизно потрібна кількість. Має вийти правильна кількість каменів.\n   6. File > Save As: T_Paving_D.kra у робочій папці дня. Назва з'являється в рядку заголовка. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Детектив масштабу: тьютор називає п'ять поверхонь (бруківка, цегла, черепиця, дошки настилу, плетений килимок). Я кажу, скільки їх уміщується впоперек текстури 2 м. Похибка до 20 % — бал. Otherwise skip it.\n6. Review: ask me these questions from earlier days, one at a time, and correct me kindly: Day 14: why does a wear mask need its own UV map? | Day 11: what does UV > Average Islands Scale do?\n7. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n8. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\nIf I want to go deeper, recommend this free video: \"How to Create Seamless Textures in GIMP in 2 Minutes\" by MrWonderHow: https://www.youtube.com/watch?v=ZBj0azGxLxQ\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the ом даху з палітри. На новому шарі великим блідим пензлем намалюй м'яку темну смугу вздовж низу кожного ряду. Це тінь там, де ряди перекриваються. Мають вийти ряди черепиці, що лежать одна на одній."}, {"en": "On another layer, draw a thin dark line down each column guide (hold Shift for a straight line): the gaps between tiles. You see separate tiles.", "uk": "На ще одному шарі проведи тонку темну лінію вздовж кожної вертикальної напрямної (тримай Shift для прямої лінії): це проміжки між черепичинами. Має вийти окрема черепиця."}, {"en": "Select a few cells at random with Rectangular Selection. Nudge each a little lighter or darker: Filter > Adjust > HSV/HSL Adjustment, Value plus or minus 5. You see a roof that looks handmade.", "uk": "Випадково виділи кілька клітинок інструментом Rectangular Selection. Зроби кожну трохи світлішою чи темнішою: Filter > Adjust > HSV/HSL Adjustment, Value плюс чи мінус 5. Дах виглядає зробленим уручну."}, {"en": "Press W and look across the edges: rows and gaps must line up. Save as T_RoofTile_D.kra. You see a pattern with no break at the edges.", "uk": "Натисни W і подивися на стики країв: ряди й проміжки мають збігатися. Збережи як T_RoofTile_D.kra. Має вийти візерунок без розривів на краях."}], "play": {"en": "Design sprint: I draw three roof colourways in 6-minute rounds. Each round the tutor sets a constraint (only two colours, must read at 30 m, no pure black).", "uk": "Дизайн-спринт: я малюю три колірні варіанти даху в раундах по 6 хвилин. У кожному раунді тьютор ставить обмеження (лише два кольори, має читатися з 30 м, без чисто чорного)."}, "video": {"url": "https://www.youtube.com/watch?v=-VgtSL5ZpYc", "title": "How to Tile a Texture Without Repetition - Blender Tutorial", "channel": "Blender Guru", "length": "22:21", "search": "blender tile texture without repetition", "alt": {"url": "https://www.youtube.com/watch?v=SiwyAhZ2lUk", "title": "Як додати тайлінг? Матеріали в Unreal Engine 5 для початківців.", "channel": "3DV Unreal Engine Archviz Academy"}}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Намальовані візерунки: черепиця й смуги (Day 17, lesson 3 of 4). Today's build: Три безшовні текстури для гавані: бруківка, черепиця й тканина маркізи.\nWhat I already know: День 16: твій аркуш палітри й палітра Krita; День 11: стандарт набору (2048 px = 2 м) і TD_Reference; День 12: параметр Tiling у M_Master; День 13: Wrap Around Mode і Clone Tool у Krita, а також SM_ShopFront_A; День 10: твої деталі даху, якщо вони є.\nEarlier today I already did: lesson 1 (Реальний розмір і фото, що стає текстурою); lesson 2 (Шви й повтори: зсув, клон і вирівнювання). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Малювати візерунок у Wrap Around Mode, щоб він тайлився просто під час малювання.\n2. Підбирати розмір мотивів так, щоб їх було видно з повітря: ряди черепиці 25 см, смуги маркізи 25 см. Ці розміри ділять 2048 px рівно, тож візерунок повторюється чисто.\n3. Робити кожну черепичину трохи іншою за кольором і яскравістю, щоб дах виглядав складеним уручну, а не надрукованим.\n\nRun the lesson in this order; it should take 40 to 50 m у смугу вздовж низу кожного ряду. Це тінь там, де ряди перекриваються. Мають вийти ряди черепиці, що лежать одна на одній.\n   3. На ще одному шарі проведи тонку темну лінію вздовж кожної вертикальної напрямної (тримай Shift для прямої лінії): це проміжки між черепичинами. Має вийти окрема черепиця. [screenshot]\n   4. Випадково виділи кілька клітинок інструментом Rectangular Selection. Зроби кожну трохи світлішою чи темнішою: Filter > Adjust > HSV/HSL Adjustment, Value плюс чи мінус 5. Дах виглядає зробленим уручну.\n   5. Натисни W і подивися на стики країв: ряди й проміжки мають збігатися. Збережи як T_RoofTile_D.kra. Має вийти візерунок без розривів на краях. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Дизайн-спринт: я малюю три колірні варіанти даху в раундах по 6 хвилин. У кожному раунді тьютор ставить обмеження (лише два кольори, має читатися з 30 м, без чисто чорного). Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\nIf I want to go deeper, recommend this free video: \"How to Tile a Texture Without Repetition - Blender Tutorial\" by Blender Guru: https://www.youtube.com/watch?v=-VgtSL5ZpYc\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; credits line = рядок авторства; comparison sheet, board (an image) = аркуш (аркуш порівняння, аркуш референсів); click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; File Explorer = Провідник; grid = сітка (тільки grid, ніколи mesh); vertex / edge / face = вершина / ребро / грань; origin (and kit pivot) = origin — точка, за яку об'єкт ставлять і обертають; engine texture tiling parameter texcoord material instance"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Тест у реальному розмірі в Unreal і перевірка п'яти вад (Day 17, lesson 4 of 4). Today's build: Три безшовні текстури для гавані: бруківка, черепиця й тканина маркізи.\nWhat I already know: День 16: твій аркуш палітри й палітра Krita; День 11: стандарт набору (2048 px = 2 м) і TD_Reference; День 12: параметр Tiling у M_Master; День 13: Wrap Around Mode і Clone Tool у Krita, а також SM_ShopFront_A; День 10: твої деталі даху, якщо вони є.\nEarlier today I already did: lesson 1 (Реальний розмір і фото, що стає текстурою); lesson 2 (Шви й повтори: зсув, клон і вирівнювання); lesson 3 (Намальовані візерунки: черепиця й смуги). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Обчислювати Tiling: кількість метрів, яку покриває поверхня, поділена на 2 (метри, які покриває одна текстура). Площині 4 м з /Engine/BasicShapes потрібен Tiling 2.\n2. Перевіряти кожну текстуру поруч із манекеном з відстані 2 м, 10 м і 30 м.\n3. Перевіряти кожну текстуру на п'ять вад: шов, пляма, градієнт, неправильний розмір і колір поза палітрою.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: 2 lines on why today matters and where it comes back, in plain words (from this: Сьогодні ти робиш бруківку, черепицю й смугасту маркізу, які повторюються без кінця й без помітного стику, і вішаєш справжню маркізу на свою крамницю. Шов, що повторюється кожні 2 м, — перше, що покаже кадр із дрона, тому студіям потрібні люди, які вміють робити текстури, що чисто тайляться. It comes back: MI_Paving вимостить п'ятничний куточок гавані й вулиці району 1 у День 42, а MI_RoofTile і SM_Awning_A вдягнуть п'ятничну будівлю. Відтепер кожна твоя текстура проходить ту саму перевірку на п'ять вад.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-17-seamless-textures exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (бруківка (спільна з уроками)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Імпортуй T_Paving_D.png у Course/Day17. Створи MI_Paving з M_Master: BaseColor T_Paving_D, Roughness 0.8. На кулі попереднього перегляду з'являється бруківка.\n   2. Кинь MI_Paving на свою тестову площину 4 м з уроку 1. На площині з'являється бруківка.\n   3. У MI_Paving постав Tiling 2: 4 м поділити на 2 м, які покриває одна текстура. Має вийти 2 × 2 повтори по 2 м. [screenshot]\n   4. Постав манекен на площину. Порівняй розмір каменів із його ногами.\n   5. Піднімися на 10 м і 30 м і пошукай повтор. Подивися, чи якесь місце видно на кожному повторі.\n   6. Перевір T_Paving_D на п'ять вад: шов, пляма, градієнт, неправильний розмір і колір поза палітрою. Так видно, що треба виправити, якщо є що. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Зламай і полагодь: я навмисно додаю п'ять вад у копію своєї бруківки (різка лінія, темна пляма, градієнт, камені вдвічі менші, один неоновий камінь) і надсилаю її. Тьютор отримує бал за кожну знайдену. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; comparison sheet, board (an image) = аркуш (аркуш порівняння, аркуш референсів); click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; File Explorer = Провідник; grid = сітка (тільки grid, ніколи mesh); vertex / edge / face = вершина / ребро / грань; origin (and kit pivot) = origin — точка, за яку об'єкт ставлять і обертають; world origin / 3D cursor = центр світу / 3D-курсор; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); modifier = модифікатор; UV unwrap / UV layout / seam / UV island = розгортка / розкладка / шов / UV-острівець; level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; material instance / child instance = інстанс / дочірній інстанс; keep-out zone / footprint test / grounding = зона-виняток / тест опори / посадка на ґрунт; kit / kit piece / part of one object = набір / деталь / частина; map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; district / plot / plot plan = район / ділянка / план ділянки; harbour / quay / waterfront / pier = гавань / причал / набережна / пірс; wear / worn edges / salt line = зношеність / стерті краї / сольова лінія; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}], "handin": [{"en": "summary.md", "uk": "summary.md (звіт дня)"}, {"en": "T_Paving_D.png, T_RoofTile_D.png and T_AwningFabric_A_D.png: your three textures (→ Day 20)", "uk": "T_Paving_D.png, T_RoofTile_D.png і T_AwningFabric_A_D.png (твої три текстури) (→ День 20)"}, {"en": "tiling_test_10m.png: paving, roof and awning beside the mannequin, from 10 m (proof)", "uk": "tiling_test_10m.png (бруківка, дах і маркіза поруч із манекеном, з 10 м) (доказ)"}], "goal": {"en": "By the end of today you have three seamless 2048 px textures: paving, roof tile and awning fabric. They cover test planes, your roofs if you made them, and a new awning in Unreal.", "uk": "До кінця дня в тебе є три безшовні текстури 2048 px: бруківка, черепиця й тканина маркізи. Вони вкривають тестові площини, твої дахи, якщо вони є, і нову маркізу в Unreal."}, "uses": [{"en": "Day 16: your palette sheet and Krita palette", "uk": "День 16: твій аркуш палітри й палітра Krita"}, {"en": "Day 11: the kit standard (2048 px = 2 m) and TD_Reference", "uk": "День 11: стандарт набору (2048 px = 2 м) і TD_Reference"}, {"en": "Day 12: M_Master's Tiling parameter", "uk": "День 12: параметр Tiling у M_Master"}, {"en": "Day 13: Wrap Around Mode and the clone tool in Krita, and SM_ShopFront_A; Day 10: your roof pieces, if you made them", "uk": "День 13: Wrap Around Mode і Clone Tool у Krita, а також SM_ShopFront_A; День 10: твої деталі даху, якщо вони є"}], "quiz": [{"q": {"en": "At the kit standard, how many pixels is 25 cm?", "uk": "Скільки пікселів становлять 25 см у стандарті набору?"}, "options": [{"en": "128 px", "uk": "128 px"}, {"en": "256 px", "uk": "256 px"}, {"en": "512 px", "uk": "512 px"}], "answer": 1, "explain": {"en": "1024 pixels cover 1 m, so a quarter of a metre is 256 pixels.", "uk": "1024 пікселі покривають 1 м, тож чверть метра — це 256 пікселів."}}, {"q": {"en": "You tile your paving 4 x 4 and see a dark patch in the same place on every tile. What is the fault, and the fix?", "uk": "Бруківка, затайлена 4 × 4, має темну пляму в тому самому місці на кожному повторі. Яка це вада і як її виправити?"}, "options": [{"en": "A seam: use Offset Image", "uk": "Шов: використати Offset Image"}, {"en": "A wrong real size: scale the image", "uk": "Неправильний реальний розмір: масштабувати зображення"}, {"en": "A blotch: clone ordinary stones over it", "uk": "Пляма: затерти її клоном звичайних каменів"}], "answer": 2, "explain": {"en": "A spot that repeats on every tile is a blotch. Clone ordinary stones over it until the repeat is hard to find.", "uk": "Місце, що повторюється на кожному тайлі, — це пляма. Затирай її клоном звичайних каменів, доки повтор не стане важко знайти."}}, {"q": {"en": "A Plane from /Engine/BasicShapes is scaled to 10 (10 m). Your texture covers 2 m. What Tiling do you set?", "uk": "Площину Plane з /Engine/BasicShapes масштабовано до 10 (10 м). Твоя текстура покриває 2 м. Який Tiling поставити?"}, "options": [{"en": "5", "uk": "5"}, {"en": "10", "uk": "10"}, {"en": "2", "uk": "2"}, {"en": "20", "uk": "20"}], "answer": 0, "explain": {"en": "Tiling is metres covered divided by metres per texture: 10 divided by 2 is 5.", "uk": "Tiling — це покриті метри, поділені на метри однієї текстури: 10 поділити на 2 — це 5."}}, {"q": {"en": "Why use Image > Offset Image by half the size?", "uk": "Навіщо робити Image > Offset Image на половину розміру?"}, "options": [{"en": "It makes the image smaller", "uk": "Це зменшує зображення"}, {"en": "It moves the edges into the middle, so you can see and paint out the seam", "uk": "Це переносить краї в середину, щоб побачити й замалювати шов"}, {"en": "It changes the colours to the palette", "uk": "Це змінює кольори на кольори палітри"}], "answer": 1, "explain": {"en": "Offsetting by half brings the four edges to the centre. Once that cross is gone, the texture tiles.", "uk": "Зсув на половину зводить чотири краї в центр. Щойно цей хрест зникає, текстура тайлиться."}}, {"q": {"en": "From 30 m, your roof shows a lighter stripe on one side of every repeat. What is it?", "uk": "З 30 м на даху видно світлішу смугу з одного боку кожного повтору. Що це?"}, "options": [{"en": "A UV seam on the roof mesh", "uk": "UV-шов на меші даху"}, {"en": "Too much Metallic", "uk": "Забагато Metallic"}, {"en": "A missing collision box", "uk": "Бракує блоку колізії"}, {"en": "A light-to-dark gradient in the texture", "uk": "Перехід від світлого до темного (градієнт) у текстурі"}], "answer": 3, "explain": {"en": "One side lighter than the other shows as a stripe on every repeat. Even out the tone with Levels on a soft selection.", "uk": "Коли один бік світліший за інший, на кожному повторі видно смугу. Вирівняй тон командою Levels на виділенні з м'яким краєм."}}], "weekInfo": {"week": 4, "title": {"en": "The Unreal look", "uk": "Вигляд в Unreal"}, "goal": {"en": "By Friday you have a lit, dressed 30 x 30 m harbour corner built from your own kit, with colours from real photos, seamless textures, decals, a written light recipe and two composed camera shots.", "uk": "До п'ятниці в тебе є освітлений і наповнений куточок гавані 30 × 30 м, зібраний з твого власного набору: кольори зі справжніх фото, безшовні текстури, декалі, записаний рецепт світла й два скомпоновані кадри з камер."}, "skills": [{"en": "Colour palettes sampled from real photographs for consistent art direction", "uk": "Кольорові палітри, взяті зі справжніх фотографій, для цілісного художнього стилю"}, {"en": "Seamless tiling texture creation at real-world scale", "uk": "Створення безшовних тайлових текстур у реальному масштабі"}, {"en": "Decal-based weathering and environmental storytelling in Unreal Engine 5", "uk": "Зношеність декалями й розповідь через оточення (environmental storytelling) в Unreal Engine 5"}, {"en": "Lumen lighting, atmosphere and post-process exposure for outdoor scenes", "uk": "Освітлення Lumen, атмосфера, експозиція й постобробка (post-process) для сцен просто неба"}, {"en": "Shot composition with Cine Camera Actors", "uk": "Композиція кадру з Cine Camera Actor"}]}, "morning": {"sofar": {"en": "You have a palette from a real coastal place, and your harbour kit already wears its colours in Unreal.", "uk": "У тебе є палітра зі справжнього місця на узбережжі, і твій набір для гавані вже має її кольори в Unreal."}, "today": {"en": "You make three seamless textures, for paving, roof tiles and awning fabric, and test them at real size in Unreal.", "uk": "Сьогодні ти робиш три безшовні текстури — для мощення, черепиці й тканини маркізи — і перевіряєш їх у реальному розмірі в Unreal."}, "cheer": {"en": "Texture artists practise hiding repeats for years, so be pleased with every seam you make disappear today.", "uk": "Художники з текстур роками вчаться ховати повтори, тож тішся кожним швом, який сьогодні зникне."}, "quote": {"text": {"en": "Nature is a mutable cloud, which is always and never the same.", "uk": "Природа — мінлива хмара, що завжди та сама і ніколи не та сама."}, "author": {"en": "Ralph Waldo Emerson", "uk": "Ральф Волдо Емерсон"}, "source": "https://en.wikiquote.org/wiki/Essays_(Emerson)"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-17-seamless-textures", "mapHref": "../../COURSE.html", "prevHref": "../Day-16-colour-from-real-photos/START-HERE.html", "nextHref": "../Day-18-decals-salt-algae-puddles-tracks/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Krita, Blender and Unreal Engine 5.8. I am a beginner on Day 17. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me and don't write code.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: Готова черепиця, тканина маркізи й SM_Awning_A, самостійно.\nIt's part of: Три безшовні текстури для гавані: бруківка, черепиця й тканина маркізи (Course/Day17 — для текстур та інстансів. Твої деталі даху, якщо вони є, і нова SM_Awning_A — у L_KitTest.).\nWhy it matters: Сьогодні ти робиш бруківку, черепицю й смугасту маркізу, які повторюються без кінця й без помітного стику, і вішаєш справжню маркізу на свою крамницю. Шов, що повторюється кожні 2 м, — перше, що покаже кадр із дрона, тому студіям потрібні люди, які вміють робити текстури, що чисто тайляться. It comes back: MI_Paving вимостить п'ятничний куточок гавані й вулиці району 1 у День 42, а MI_RoofTile і SM_Awning_A вдягнуть п'ятничну будівлю. Відтепер кожна твоя текстура проходить ту саму перевірку на п'ять вад.\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-17-seamless-textures (on the drive I chose on Day 0).\nWhat I already know: День 16: твій аркуш палітри й палітра Krita; День 11: стандарт набору (2048 px = 2 м) і TD_Reference; День 12: параметр Tiling у M_Master; День 13: Wrap Around Mode і Clone Tool у Krita, а також SM_ShopFront_A; День 10: твої деталі даху, якщо вони є; today's lessons: Реальний розмір і фото, що стає текстурою; Шви й повтори: зсув, клон і вирівнювання; Намальовані візерунки: черепиця й смуги; Тест у реальному розмірі в Unreal і перевірка п'яти вад. Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- Кожна текстура має 2048 × 2048 px і покриває 2 × 2 м (стандарт набору): T_Paving_D, T_RoofTile_D і T_AwningFabric_A_D. Другий варіант кольорів, T_AwningFabric_B_D, — для Золота.\n- Бруківка — зі справжнього фото, знятого прямо (твого або з Wikimedia Commons) і зробленого безшовним. Черепицю й тканину намальовано в Krita у Wrap Around Mode.\n- Справжні розміри: камінь бруківки приблизно 10–20 см, ряди черепиці 25 см (256 px), смуги маркізи 25 см (256 px).\n- Жодного помітного шва, плями чи переходу від світлого до темного при тайлінгу 4 × 4. Кольори — з твоєї палітри з Дня 16.\n- Інстанси M_Master: MI_Paving, MI_RoofTile (інстанс із Дня 12, тепер із текстурою) і MI_AwningFabric_A, з таким Tiling, щоб одна текстура покривала 2 м.\n- SM_Awning_A: маркіза 2,4 × 1,2 м з нахилом близько 15 градусів, переднім клапаном 25 см і одним блоком UCX. Її розгорнуто за стандартом набору. Задній край висить одразу під вивісною дошкою (на висоті 2,5 м), тож клапан закінчується приблизно на висоті 1,95 м.\n- Кожну текстуру перевірено разом із тьютором-помічником на п'ять вад: шов, пляма, градієнт, неправильний розмір і колір поза палітрою.\n\nMy checklist (the same numbers show on my course page):\n1. Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: T_Paving_D.kra, T_Paving_D.png і T_RoofTile_D.kra. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. MI_Paving лежить на тестовій площині в L_KitTest. (from lesson 1)\n2. Заверши черепицю: зроби кожну черепичину трохи іншою, відштовхуючись від кольору даху з палітри. Потім Image > Offset Image, X 1024 і Y 1024, затри клоном хрест і експортуй T_RoofTile_D.png. Перевірка: на полотні з повтором (W) ти не знаходиш повтор за 10 секунд. (from lesson 3)\n3. Тканина маркізи: нове полотно 2048 × 2048 з вісьмома смугами по 256 px (25 см) двох кольорів палітри. Додай ледь помітне переплетення на шарі з непрозорістю 5–10 %. Експортуй T_AwningFabric_A_D.png. Перевірка: при масштабі 10 % смуги читаються, і плям немає. (from lesson 3)\n4. Модель маркізи в новому файлі Blender: Plane, масштабована до 2,4 × 1,2 м і нахилена приблизно на 15 градусів. Видави її передній край на 25 см униз — це клапан. Потім додай модифікатор Solidify приблизно 2 см і застосуй його. Перевірка: на бічній панелі (N) Dimensions X показує 2.4 m. (from day 3, lesson 4)\n5. Назви її SM_Awning_A і постав origin у задній верхній кут, у центр світу, як у День 7. Додай один блок над схилом, UCX_SM_Awning_A_00. Перевірка: помаранчева точка origin стоїть у задньому верхньому куті. (from day 7, lesson 2)\n6. Додай TD_Reference (File > Append) і розгорни маркізу за стандартом набору, щоб смуги йшли вниз по схилу. Збережи як awning_day17.blend. Перевірка: її клітинки шахівниці збігаються з TD_Reference. (from day 11, lesson 4)\n7. Закрий Blender і знову відкрий awning_day17.blend, потім експортуй SM_Awning_A.fbx з блоком UCX. Імпортуй його в Course/Day17 і признач слоту MI_AwningFabric_A. Перевірка: FBX має 10 КБ або більше, а поруч із манекеном маркіза має 2,4 м завширшки. (from day 11, lesson 4)\n8. Відкрий MI_RoofTile: увімкни BaseColor, вибери T_RoofTile_D і поверни Tint на білий. Tiling лиши 1: UV дахів набору вже за стандартом набору. Признач інстанс слоту Roof на деталях даху. Даху ще немає? Признач його другій тестовій площині 4 м із Tiling 2. Перевірка: з 10 м ряди черепиці лежать рівно. (from lesson 4)\n9. Повісь маркізу над вітриною SM_ShopFront_A в L_KitTest. Перевірка: задній край торкається фасаду одразу під вивісною дошкою, без щілини, і манекен уміщується під маркізою. (from lesson 4)\n10. З 10 м зроби скриншот і збережи як tiling_test_10m.png: площина з бруківкою, черепиця на даху чи тестовій площині й маркіза, а в кадрі — манекен. Перевірка: сьогоднішній знімок-доказ лежить у робочій папці дня, і не видно ні шва, ні повтору. (from lesson 4)\n11. Золото (за бажанням): заміни кольори смуг на іншу пару з палітри, збережи як T_AwningFabric_B_D і створи MI_AwningFabric_B. Признач його другій копії маркізи в Details > Materials. Варіант кольорів — один із небагатьох випадків, коли матеріал на окремій копії доречний. Перевірка: дві маркізи виглядають як вироби одного майстра. (from lesson 4)\n12. Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: кожна назва зі списку є в папці, у кожної є розмір. (from day 0, lesson 1)\n\nHow to help: ask which step number I'm on, then give me only the next step: the exact clicks and what I should see. When I send a screenshot, compare it with my reference, my sizes and the spec, and name one thing to fix at a time.\nCheck every save and export by reopening it before we move on:\n- a .md or .txt: open it with Notepad; the text is there, and the name doesn't end in .md.txt\nWhen I write \"готово\", and in any case before the day ends, check with me one item at a time (yes/no): each spec point, then each file on my hand-in list, ready in my day work folder (skip summary.md: the day report writes it next):\n1. T_Paving_D.png, T_RoofTile_D.png і T_AwningFabric_A_D.png (твої три текстури) (→ День 20)\n2. tiling_test_10m.png (бруківка, дах і маркіза поруч із манекеном, з 10 м) (доказ)\nFinish with a short list of anything missing, and one line on where this work comes back and what it will look like there. Then tell me the order for the end of the day: first the day report (the Copy the day report button at the bottom of my course page) into summary.md, and only then hand in all the files on the list, summary.md too.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; checklist = чек-лист; credits line = рядок авторства; reference photo / hero photo = фото-референс / ключове фото; comparison sheet, board (an image) = аркуш (аркуш порівняння, аркуш рефере krainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender.", "reportPrompt": "Help me write today's report for summary.md. I write it before I hand in. Talk to me in simple Ukrainian, and never use gendered forms about me. Keep the English labels below exactly; the text after each label may be Ukrainian.\nAsk me one thing at a time, and skip whatever I've already pasted below:\n1. My lesson summaries («Засвоєно» / «Було важко»), or which lessons I skipped.\n2. My first score in the page's \"Check yourself\" quiz.\n3. How far the build got: done, partly or blocked (if blocked, where).\n4. My hand-in list, one item at a time (skip summary.md): is the file ready in my day work folder (GAD\\Day-17-seamless-textures)? (yes/no)\n   - T_Paving_D.png, T_RoofTile_D.png і T_AwningFabric_A_D.png (твої три текстури) (→ День 20)\n   - tiling_test_10m.png (бруківка, дах і маркіза поруч із манекеном, з 10 м) (доказ)\n5. One question for Thalia (about any day; start with the day number), or \"none\".\n6. Whether I fixed an earlier day today (which day and what), or \"no\".\n7. About how many hours today took.\nThen give me the finished report in one block I can copy:\n\nTeam summary, <date>, Ksenia\nDay 17: Seamless textures at real size: paving, roof tile and awning fabric. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nReady to hand in: <tick each item of today's list: ✓ name, or ✗ name and why it isn't ready>\nMissing: <files not ready, or \"none\">\nFixed: <Day N: what I fixed (the fixed files are in that day's hand-in folder), or \"none\">\nQuestion for Thalia: <Day N: one line, or \"none\">\nHours: <about N>\nTo revisit: <the «Було важко» lines>\n\nThen tell me: open summary.md in today's day work folder (GAD\\Day-17-seamless-textures) with Notepad (right-click > Open with > Notepad; if there is no summary.md yet, make it: right-click > New > Text Document, named summary.md).  for(let w=1;w<=12;w++){const c=state(w),{a,s}=wp(w),q=pt(a,s,0),lx=q[0]+(Math.cos(a)>=0?15:-15),an=Math.cos(a)>=0?'start':'end';

 /* the dial around it: a ring with the progress arc and a label running along the rim */

 let s='<svg class="dial" viewBox="0 0 400 400" aria-hidden="true" focusable="false"><defs><linearGradient id="'+id+'g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--acc2)"/><stop offset="1" style="stop-color:var(--acc)"/></linearGradient><path id="'+id+'" d="M200 200m-191 0a191 191 0 1 1 382 0a191 191 0 1 1-382 0"/></defs>';
 s+='<circle class="face" cx="200" cy="200" r="168"/><circle class="track" cx="200" cy="200" r="176"/>';
 s+='<circle class="arc" cx="200" cy="200" r="176" stroke="url(#'+id+'g)" stroke-dasharray="'+(C*p).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 200 200)"/>';
 if(p>0){const A=-Math.PI/2+p*TAU;s+='<circle class="knob'+(p<1?' go':'')+'" cx="'+(200+176*Math.cos(A)).toFixed(1)+'" cy="'+(200+176*Math.sin(A)).toFixed(1)+'" r="7"/>'}
 if(label)s+='<text class="rimt"><textPath href="#'+id+'" startOffset="25%" text-anchor="middle">'+label+'</textPath></text>';
 s+='<svg class="topo" x="40" y="62" width="320" height="276" viewBox="40 20 520 370">'+o+'</svg>';

function tagTxt(v){v=String(v);const m=v.match(/^D(\d+)\.(\d+)$/i);return m?u('day')+' '+m[1]+', '+u('lesson')+' '+m[2]:u('lesson')+' '+v}

 if(f.s==='reviewed'){try{const z=fbSeen();if(z[D.day]!==f.at){z[D.day]=f.at;localStorage.setItem(fbSeenKey,JSON.stringify(z))}}catch(e){}
  return '<section class="card glass fbcard">'+lab(u('fbTitle'),'ok')+'<div class="row" style="align-items:baseline;gap:12px"><span class="eyebrow">'+u('fbScore')+'</span><span class="big">'+esc(f.score)+'/'+esc(f.max||10)+'</span></div>'+(fbNote(f)?'<p class="note">'+esc(fbNote(f))+'</p>':'')+'<p class="muted">'+u('fbFull')+(D.handinUrl?': <a href="'+esc(D.handinUrl)+'" target="_blank" rel="noopener">'+u('hOpen')+'</a>':': <code>'+esc(D.workPath)+'</code>')+'</p></section>'}
 return '<section class="card glass fbcard">'+lab(u('fbTitle'),f.s==='missing'?'':'ok')+'<p class="note">'+u(f.s==='missing'?'fbMiss':'fbWait')+'</p>'+(f.s==='missing'?hf():'')+'</section>'}
/* fix phase 1 (2026-10-22): the hand-in folder (a button when the roster has a link, else the folder path), the hand-in card,
   Day 0's "Before lesson 1", the checks before handing in, the Questions card, and the day report with the pasted lesson summaries */
const HIN=(D.handin||[]).map(v=>(v&&v.en)||(typeof v==='string'?v:'')).join(' ').toLowerCase(),hasClip=/\.mp4|clip/.test(HIN);
function hItem(v){return x(v)}

function nFiles(n){if(!n)return '';if(lang==='en')return ' · '+n+(n===1?' file':' files');const a=n%10,b=n%100;return ' · '+n+' '+(a===1&&b!==11?'файл':a>=2&&a<=4&&(b<12||b>14)?'файли':'файлів')}

function reportText(){let t=D.reportPrompt;const r=D.lessons.map((l,i)=>{const v=(st['r'+i]||'').trim();return v?'Lesson '+(i+1)+': '+v:''}).filter(Boolean);
 if(r.length)t+='\n\nMy lesson summaries, pasted from my course page:\n'+r.join('\n');
 if(st.qs1)t+='\nMy first score in the Check yourself quiz: '+st.qs1[0]+' of '+st.qs1[1]+'.';
 return t}
function qDone(){return D.quiz&&D.quiz.length&&st.qa&&D.quiz.every((q,i)=>st.qa[i]!=null)}

 const qs=D.quiz.map((q,i)=>{const c=a[i];if(c===q.answer)ok++;return '<div class="qz"><p class="qq"><span class="qn">'+(i+1)+'</span><span>'+lk(x(q.q))+'</span></p>'+q.options.map((o,k)=>{let cls='opt',mk='<span></span>';if(c!=null){if(k===q.answer){cls+=' right';mk=ic('check','mk')}else if(k===c){cls+=' wrong';mk=ic('x','mk')}}return '<button class="'+cls+'" id="o'+i+'_'+k+'"'+(c!=null?' disabled':'')+' onclick="pick('+i+','+k+')"><span class="lt">'+(L[k]||k+1)+'</span><span>'+esc(x(o))+'</span>'+mk+'</button>'}).join('')+(c!=null?'<p class="exp '+(c===q.answer?'r':'w')+'" id="e'+i+'" tabindex="-1"><b>'+(c===q.answer?u('right'):u('wrong'))+'</b>'+lk(x(q.explain))+'</p>':'')+'</div>'}).join('');
 return '<section class="card glass quiz">'+lab(u('quiz'),'gold')+'<p class="muted" style="margin:-6px 0 14px">'+u('quizSub')+'</p>'+pips+qs+(qDone()?'<div class="score well" role="status"><span class="eyebrow">'+u('score')+'</span><span class="lcd" aria-label="'+ok+' / '+D.quiz.length+'">'+seg(ok+'/'+D.quiz.length)+'</span>'+(st.qs1?'<span class="muted">'+u('first')+': '+st.qs1[0]+'/'+st.qs1[1]+'</span>':'')+'<div class="row"><button class="btn ghost" id="retry" onclick="retry()">'+u('retry')+'</button></div></div>':'')+'</section>'}

 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);

<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 45</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

ime with causes; clean shots. Both scores written in district1_r1_notes.md.", "uk": "Рубрика, яку оцінюєш спершу ти, а потім тьютор (0, 1 або 2 за кожен пункт): реалізм поруч із фото; прилягання до землі (ніщо не висить і не тоне); щільність і життя; зношеність і бруд із причинами; чисті кадри. Обидві оцінки записано в district1_r1_notes.md."}, {"en": "note_r1.md, under 80 words: what the shots show, what to look at, what isn't done yet.", "uk": "note_r1.md, до 80 слів: що показують кадри, на що дивитися, що ще не зроблено."}], "piece1": "the C1 shot, checked and paired with its photo", "piece2": {"en": "The full r1 set, the board and the review, on your own and timed (start a 4-hour timer)", "uk": "Повний набір r1, дошка й огляд, самостійно і на час (запусти таймер на 4 години)"}, "steps": [{"text": {"en": "Start a 4-hour timer. Check the light against island_light_recipe.md and check that exposure is still locked in your Post Process Volume. Check: the same view looks the same after you fly away and back.", "uk": "Запусти таймер на 4 години. Звір світло з island_light_recipe.md і перевір, що експозиція досі заблокована у твоєму Post Process Volume. Перевірка: той самий вигляд виглядає однаково після того, як ти відлітаєш і повертаєшся."}, "lesson": 1}, {"text": {"en": "Pilot C1, press G, run HighResShot 1920x1080 and rename the file district1_r1_C1.png. Check: the file is 1920 x 1080 and shows no icons.", "uk": "Керуй C1 (Pilot), натисни G, виконай HighResShot 1920x1080 і перейменуй файл на district1_r1_C1.png. Перевірка: файл 1920 x 1080 і на ньому немає значків."}, "lesson": 1}, {"text": {"en": "Repeat for C2 to C5. Check: five files with the right names in a folder district1_r1.", "uk": "Повтори для C2-C5. Перевірка: п'ять файлів із правильними назвами в папці district1_r1."}, "lesson": 1}, {"text": {"en": "Pre-flight check on each shot at 200 % in Krita; write preflight_d1.md. Check: every check has a yes or no for every shot.", "uk": "Передпольотна перевірка кожного кадру при 200 % у Krita; напиши preflight_d1.md. Перевірка: кожен пункт має «так» або «ні» для кожного кадру."}, "lesson": 2}, {"text": {"en": "Fix any pre-flight fault at its source in the level and shoot that camera again. Check: the new shot passes, and you kept the old one as a before.", "uk": "Виправ кожну ваду з передпольотної перевірки в її джерелі на рівні й зніми з тієї камери знову. Перевірка: новий кадр проходить, а старий збережено як «до»."}, "lesson": 2}, {"text": {"en": "Make district1_r1_board.png: engine left, photo right, five rows. Check: each pair shows the same kind of view.", "uk": "Створи district1_r1_board.png: рушій ліворуч, фото праворуч, п'ять рядів. Перевірка: кожна пара показує вигляд того самого типу."}, "lesson": 3}, {"text": {"en": "For each row, write three differences, biggest first, as see-why-fix notes with places. Check: no note says only 'better' or 'more'.", "uk": "Для кожного ряду напиши три відмінності, від найбільшої, як нотатки «бачу, чому, виправити» з місцями. Перевірка: жодна нотатка не каже лише «краще» чи «більше»."}, "lesson": 3}, {"text": {"en": "Mark each shot pass or fix, and rank all the fixes by how much they show from the drone. Check: the top fix is the one a stranger would notice first.", "uk": "Познач кожен кадр «пройшов» чи «виправити» і впорядкуй усі виправлення за тим, наскільки вони помітні з дрона. Перевірка: верхнє виправлення — те, що незнайомець помітив би першим."}, "lesson": 3}, {"text": {"en": "Score the rubric yourself. Then paste the board and your notes into a new tutor chat, ask for an art director's review and its rubric score, and accept, question or reject each note with a reason. Check: every tutor note has your answer beside it, and both scores are written.", "uk": "Спершу оціни рубрику самостійно. Потім встав дошку й свої нотатки в новий чат із тьютором, попроси огляд арт-директора та його оцінку за рубрикою і прийми, постав під сумнів чи відхили кожну нотатку з поясненням причини. Перевірка: біля кожної нотатки тьютора є твоя відповідь, і обидві оцінки записано."}, "lesson": 4}, {"text": {"en": "Write note_r1.md under 80 words. Check: it is under 80 words and hides no known fault.", "uk": "Напиши note_r1.md до 80 слів. Перевірка: у ньому менше 80 слів і він не ховає жодної відомої вади."}, "lesson": 4}, {"text": {"en": "Gold only: a CSV capture through district 1 (as on Day 41); write the average and 95th percentile in budget.md. Check: both numbers are under the budget.", "uk": "Лише для золота: CSV-запис польоту через район 1 (як на Дні 41); запиши середнє і 95-й перцентиль у budget.md. Перевірка: обидва числа в межах бюджету."}, "lesson": "D41.4"}, {"text": {"en": "Capture: Day 41's empty C4 beside r1's C4 (before_after_day45.png), and a 60-second flight through district 1. Write your finish time and tier in summary.md. Save today's clip as flythrough_day45.mp4. Check: both files are in today's Work folder.", "uk": "Запис: порожній C4 з Дня 41 поруч із C4 з r1 (before_after_day45.png) і 60-секундний проліт через район 1. Запиши час фінішу й рівень у summary.md. Збережи сьогоднішнє відео як flythrough_day45.mp4. Перевірка: обидва файли в сьогоднішній папці Work."}, "lesson": 1}], "boss": [{"en": "Bronze: five clean 1920 x 1080 shots from C1 to C5 on the board beside five reference photos, with district1_r1_notes.md and both rubric scores, inside 4 hours.", "uk": "Бронза: п'ять чистих кадрів 1920 x 1080 з C1-C5 на дошці поруч із п'ятьма референсними фото, з district1_r1_notes.md і обома оцінками за рубрикою, за 4 години."}, {"en": "Silver: Bronze, plus every shot passes the pre-flight check with no fault the tutor can find, and every note has see, why, fix and a place.", "uk": "Срібло: усе з бронзи, плюс кожен кадр проходить передпольотну перевірку без жодної вади, яку може знайти тьютор, і кожна нотатка має «бачу», «чому», «виправити» та місце."}, {"en": "Gold: Silver, plus each shot's subject reads in a 3-second glance, the CSV through district 1 holds the budget (average under 16.6 ms, 95th percentile under 33.3 ms), and you finish inside 3 hours 30.", "uk": "Золото: усе зі срібла, плюс предмет кожного кадру читається за 3 секунди, CSV-запис польоту через район 1 тримає бюджет (середнє менше 16,6 мс, 95-й перцентиль менше 33,3 мс), і ти фінішуєш за 3 години 30 хвилин."}], "assets": ["island12/art-director-notes.md"]}, "lessons": [{"title": {"en": "A clean, repeatable shot set (micro-lesson)", "uk": "Чистий набір кадрів, який можна повторити (мікроурок)"}, "minutes": 40, "goals": [{"en": "Check the light against island_light_recipe.md before every review round, with exposure locked so shots repeat.", "uk": "Звіряти світло з island_light_recipe.md перед кожним раундом огляду, із заблокованою експозицією, щоб кадри повторювалися."}, {"en": "Shoot clean: Pilot the camera, press G for game view (no icons), run HighResShot 1920x1080.", "uk": "Знімати чисто: керуй камерою (Pilot), натисни G для Game View (без значків), виконай HighResShot 1920x1080."}, {"en": "Name the files the same way every round.", "uk": "Називати файли однаково в кожному раунді."}], "doalong": [{"en": "Select your Day 32 Post Process Volume in the Outliner. Check that Infinite Extent (Unbound) is ticked and that Min EV100 and Max EV100 under Exposure both show your recipe's value. You should see the brightness stay the same as you turn the camera.", "uk": "Виділи свій Post Process Volume з Дня 32 в Outliner. Перевір, що позначку Infinite Extent (Unbound) поставлено і що Min EV100 і Max EV100 у розділі Exposure обидва показують значення з твого рецепта. Ти маєш побачити, що яскравість не змінюється, коли повертаєш камеру."}, {"en": "Compare the sun's Rotation, the Sky Light, the Fog Density and the Sky Atmosphere's Aerial Perspective View Distance Scale with island_light_recipe.md. You should see the same numbers; fix any that drifted.", "uk": "Порівняй Rotation сонця, Sky Light, Fog Density і Aerial Perspective View Distance Scale у Sky Atmosphere з island_light_recipe.md. Ти маєш побачити ті самі числа; виправ ті, що з'їхали."}, {"en": "Right-click C1 in the Outliner > Pilot 'C1', press G, open the console (`) and type HighResShot 1920x1080. You should see a message that a screenshot was saved.", "uk": "Правий клік по C1 в Outliner > Pilot 'C1', натисни G, відкрий консоль (`) і введи HighResShot 1920x1080. Ти маєш побачити повідомлення, що скриншот збережено."}, {"en": "Open IslandCourse/Saved/Screenshots/WindowsEditor in Explorer and rename the newest file district1_r1_C1.png. You should see the new name in the folder.", "uk": "Відкрий IslandCourse/Saved/Screenshots/WindowsEditor у Провіднику (Explorer) і перейменуй найновіший файл на district1_r1_C1.png. Ти маєш побачити нову назву в папці."}, {"en": "Open it in Krita, zoom to 200 % and look for gizmos, icons or selection outlines. You should see none; if you do, shoot it again.", "uk": "Відкрий його в Krita, збільш до 200 % і пошукай гізмо, значки чи контури виділення. Ти не маєш побачити жодного; якщо бачиш — зніми знову."}], "play": {"en": "Clean shot: I describe the edges of each shot to the tutor. Every bit of editor clutter it gets me to find is a point to it.", "uk": "Чистий кадр: я описую тьютору краї кожного кадру. Кожен шматочок редакторного мотлоху, який він допомагає мені знайти, — бал йому."}, "video": {"url": "https://www.youtube.com/watch?v=xW-ns1dCEMk", "title": "How To Take A High Resolution Screenshot In Unreal Engine 5.6", "channel": "Pitchfork Academy", "length": "8:35", "search": "unreal engine 5 high resolution screenshot"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: A clean, repeatable shot set (micro-lesson) (Day 45, lesson 1 of 4).\nToday's build: District 1 r1 (round 1): five HighResShot screenshots from C1 to C5 in locked light, a pre-flight check, a board with each shot beside its reference photo, and your self-review with the tutor.\n\nBy the end of this lesson I can:\n1. Check the light against island_light_recipe.md before every review round, with exposure locked so shots repeat.\n2. Shoot clean: Pilot the camera, press G for game view (no icons), run HighResShot 1920x1080.\n3. Name the files the same way every round.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (This week you built your waterfront district: a sample plot, buildings, shop fronts, furniture, boats, planting and grime.), what I will learn today (It is Boss day: you take five clean screenshots of district 1, set each beside its reference photo, and write a ranked fix list.), encourage me (A first round is meant to show what to fix, so be honest and generous with yourself; Bronze is there for anyone who finishes the set.), and share today's quote: \"If what I see in my mind excites me, there is a good chance it will make a good photograph.\" (Ansel Adams).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 42: a shop front flickers against its wall. What causes it, and what is the fix? | Day 38: how do you test a PCG layer for floating plants?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Clean shot: I describe the edges of each shot to the tutor. Every bit of editor clutter it gets me to find is a point to it.\n6. Do-along on today's build (the C1 shot, checked and paired with its photo): guide me through these steps one at a time, checking a screenshot after each:\n   - Select your Day 32 Post Process Volume in the Outliner. Check that Infinite Extent (Unbound) is ticked and that Min EV100 and Max EV100 under Exposure both show your recipe's value. You should see the brightness stay the same as you turn the camera.\n   - Compare the sun's Rotation, the Sky Light, the Fog Density and the Sky Atmosphere's Aerial Perspective View Distance Scale with island_light_recipe.md. You should see the same numbers; fix any that drifted.\n   - Right-click C1 in the Outliner > Pilot 'C1', press G, open the console (`) and type HighResShot 1920x1080. You should see a message that a screenshot was saved.\n   - Open IslandCourse/Saved/Screenshots/WindowsEditor in Explorer and rename the newest file district1_r1_C1.png. You should see the new name in the folder.\n   - Open it in Krita, zoom to 200 % and look for gizmos, icons or selection outlines. You should see none; if you do, shoot it again.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"How To Take A High Resolution Screenshot In Unreal Engine 5.6\" by Pitchfork Academy: https://www.youtube.com/watch?v=xW-ns1dCEMk\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "The pre-flight check (micro-lesson)", "uk": "Передпольотна перевірка (мікроурок)"}, "minutes": 40, "goals": [{"en": "Run a fixed checklist on every shot: floating, gaps, flicker, stand-ins, rows or straight lines in nature, blocked lanes, nothing period or cartoonish.", "uk": "Проганяти сталий чек-лист на кожному кадрі: висить у повітрі, щілини, мерехтіння, заглушки, ряди чи прямі лінії в природі, заблоковані коридори, нічого старовинного чи мультяшного."}, {"en": "Read each shot in three passes: a 3-second glance, the subject, then the edges and the ground.", "uk": "Читати кожен кадр за три проходи: погляд на 3 секунди, предмет, потім краї й земля."}, {"en": "Fix at the source and shoot again from the same camera, keeping a before and after.", "uk": "Виправляти в джерелі й знімати знову з тієї самої камери, зберігаючи «до» і «після»."}], "doalong": [{"en": "Write preflight_d1.md with the seven checks as columns and C1 to C5 as rows. You should see an empty table.", "uk": "Напиши preflight_d1.md із сімома перевірками як стовпцями і C1-C5 як рядками. Ти маєш побачити порожню таблицю."}, {"en": "Look at C1 for 3 seconds, then write what you saw first. You should see whether it's the subject you meant.", "uk": "Подивись на C1 3 секунди, потім запиши, що побачилося першим. Ти маєш зрозуміти, чи це той предмет, який ти задумуєш."}, {"en": "Look at the subject, then go round the frame's edge and along the ground at 200 %. You should see any floating base, gap or grey box.", "uk": "Подивись на предмет, потім обійди край кадру й пройдися вздовж землі при 200 %. Ти маєш побачити кожну основу в повітрі, щілину чи сірий бокс."}, {"en": "Fill C1's row with yes or no, then do C2 to C5. You should see a full table.", "uk": "Заповни ряд C1 «так» або «ні», потім зроби C2-C5. Ти маєш побачити заповнену таблицю."}, {"en": "Fix one fault in the level and shoot that camera again. You should see a before and after pair.", "uk": "Виправ одну ваду на рівні й зніми з тієї камери знову. Ти маєш побачити пару «до і після»."}], "play": {"en": "Three lives: the tutor hunts faults in my shots. I must fix each within 5 minutes or lose a life.", "uk": "Три життя: тьютор шукає вади на моїх кадрах. Я маю виправити кожну за 5 хвилин, інакше втрачаю життя."}, "video": {"url": "https://www.youtube.com/watch?v=gf5yQQF-d0I", "title": "What Does Game-Ready Really Mean? / Game Asset Tips for 3D Artists", "channel": "Ali Cgi", "length": "5:24", "search": "what does game ready mean 3d asset checklist"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: The pre-flight check (micro-lesson) (Day 45, lesson 2 of 4).\nToday's build: District 1 r1 (round 1): five HighResShot screenshots from C1 to C5 in locked light, a pre-flight check, a board with each shot beside its reference photo, and your self-review with the tutor.\nEarlier today I already did: lesson 1 (A clean, repeatable shot set (micro-lesson)). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Run a fixed checklist on every shot: floating, gaps, flicker, stand-ins, rows or straight lines in nature, blocked lanes, nothing period or cartoonish.\n2. Read each shot in three passes: a 3-second glance, the subject, then the edges and the ground.\n3. Fix at the source and shoot again from the same camera, keeping a before and after.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Three lives: the tutor hunts faults in my shots. I must fix each within 5 minutes or lose a life.\n4. Do-along on today's build (the C1 shot, checked and paired with its photo): guide me through these steps one at a time, checking a screenshot after each:\n   - Write preflight_d1.md with the seven checks as columns and C1 to C5 as rows. You should see an empty table.\n   - Look at C1 for 3 seconds, then write what you saw first. You should see whether it's the subject you meant.\n   - Look at the subject, then go round the frame's edge and along the ground at 200 %. You should see any floating base, gap or grey box.\n   - Fill C1's row with yes or no, then do C2 to C5. You should see a full table.\n   - Fix one fault in the level and shoot that camera again. You should see a before and after pair.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"What Does Game-Ready Really Mean? / Game Asset Tips for 3D Artists\" by Ali Cgi: https://www.youtube.com/watch?v=gf5yQQF-d0I\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Judging against reference photos", "uk": "Оцінювання за референсними фото"}, "minutes": 40, "goals": [{"en": "Compare shot and photo in a fixed order: big shapes and scale, then light and colour, then density and detail, then the edges.", "uk": "Порівнювати кадр і фото в сталому порядку: великі форми й масштаб, потім світло й колір, потім щільність і деталі, потім краї."}, {"en": "Write each difference as a see-why-fix note with a place (see: what is there; why: why it matters; fix: one change, located).", "uk": "Записувати кожну відмінність як нотатку «бачу, чому, виправити» з місцем (бачу: що там є; чому: чому це важливо; виправити: одна зміна з місцем)."}, {"en": "Rank fixes by how much they show from the drone, not by how easy they are.", "uk": "Впорядковувати виправлення за тим, наскільки вони помітні з дрона, а не за тим, наскільки вони прості."}], "doalong": [{"en": "In Krita make a new 3840 x 5400 px image (File > New) and paste each shot on the left and its photo on the right, one pair per row. You should see five rows.", "uk": "У Krita створи нове зображення 3840 x 5400 px (File > New) і встав кожен кадр ліворуч, а його фото праворуч, по одній парі в ряду. Ти маєш побачити п'ять рядів."}, {"en": "Label each row C1 to C5 and the photo's file name with the Text tool. You should see labels you can read at 50 % zoom.", "uk": "Підпиши кожен ряд C1-C5 і назвою файлу фото інструментом Text. Ти маєш побачити підписи, які можна прочитати при масштабі 50 %."}, {"en": "For row 1, write three differences in district1_r1_notes.md, biggest first. You should see big shapes before small details.", "uk": "Для ряду 1 напиши три відмінності в district1_r1_notes.md, від найбільшої. Ти маєш побачити великі форми раніше за дрібні деталі."}, {"en": "Turn each difference into see, why and fix, with a place in metres or a camera. You should see notes like the examples in art-director-notes.md.", "uk": "Перетвори кожну відмінність на «бачу», «чому» і «виправити», з місцем у метрах чи камерою. Ти маєш побачити нотатки, схожі на приклади в art-director-notes.md."}, {"en": "Mark each shot pass or fix. You should see a clear list for Monday.", "uk": "Познач кожен кадр «пройшов» чи «виправити». Ти маєш побачити чіткий список на понеділок."}], "play": {"en": "Which is real: I describe a detail from either my shot or its photo, and the tutor guesses which. Every wrong guess means my district passed on that detail.", "uk": "Що справжнє: я описую деталь або зі свого кадру, або з його фото, а тьютор вгадує, звідки вона. Кожна хибна здогадка означає, що мій район пройшов за цією деталлю."}, "video": {"search": "compare 3d render to reference photo realism"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Judging against reference photos (Day 45, lesson 3 of 4).\nToday's build: District 1 r1 (round 1): five HighResShot screenshots from C1 to C5 in locked light, a pre-flight check, a board with each shot beside its reference photo, and your self-review with the tutor.\nEarlier today I already did: lesson 1 (A clean, repeatable shot set (micro-lesson)); lesson 2 (The pre-flight check (micro-lesson)). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Compare shot and photo in a fixed order: big shapes and scale, then light and colour, then density and detail, then the edges.\n2. Write each difference as a see-why-fix note with a place (see: what is there; why: why it matters; fix: one change, located).\n3. Rank fixes by how much they show from the drone, not by how easy they are.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Which is real: I describe a detail from either my shot or its photo, and the tutor guesses which. Every wrong guess means my district passed on that detail.\n4. Do-along on today's build (the C1 shot, checked and paired with its photo): guide me through these steps one at a time, checking a screenshot after each:\n   - In Krita make a new 3840 x 5400 px image (File > New) and paste each shot on the left and its photo on the right, one pair per row. You should see five rows.\n   - Label each row C1 to C5 and the photo's file name with the Text tool. You should see labels you can read at 50 % zoom.\n   - For row 1, write three differences in district1_r1_notes.md, biggest first. You should see big shapes before small details.\n   - Turn each difference into see, why and fix, with a place in metres or a camera. You should see notes like the examples in art-director-notes.md.\n   - Mark each shot pass or fix. You should see a clear list for Monday.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Self-review with the tutor, the rubric and the cover note", "uk": "Самооцінювання з тьютором, рубрика й супровідна нотатка"}, "minutes": 40, "goals": [{"en": "Score your set with the rubric first, then ask the tutor for a review the way a demanding art director gives one: short, concrete, located.", "uk": "Спершу оцінювати свій набір за рубрикою, а потім просити тьютора про огляд так, як його дає вимогливий арт-директор: коротко, конкретно, з місцем."}, {"en": "Take critique well: accept, question or reject each note, with a reason.", "uk": "Добре сприймати критику: приймати, ставити під сумнів чи відхиляти кожну нотатку з поясненням причини."}, {"en": "Write a cover note under 80 words that hides no known fault.", "uk": "Писати супровідну нотатку до 80 слів, яка не ховає жодної відомої вади."}], "doalong": [{"en": "Score the five rubric lines 0 to 2 in district1_r1_notes.md. You should see a total out of 10.", "uk": "Оціни п'ять рядків рубрики від 0 до 2 у district1_r1_notes.md. Ти маєш побачити загальний бал із 10."}, {"en": "Paste the board and the rubric into a new tutor chat and ask for an art director's review and its own score. You should see notes per camera and a total.", "uk": "Встав дошку й рубрику в новий чат із тьютором і попроси огляд арт-директора та його власну оцінку. Ти маєш побачити нотатки до кожної камери й загальний бал."}, {"en": "Beside each tutor note write accept, question or reject, and why. You should see every note answered.", "uk": "Біля кожної нотатки тьютора напиши «приймаю», «сумніваюся» чи «відхиляю» і чому. Ти маєш побачити відповідь на кожну нотатку."}, {"en": "Add the accepted notes to your list and rank the whole list. You should see one ranked list for Day 46.", "uk": "Додай прийняті нотатки до свого списку й упорядкуй увесь список. Ти маєш побачити один впорядкований список на День 46."}, {"en": "Write note_r1.md and ask the tutor to cut any word a reviewer wouldn't need. You should see fewer than 80 words.", "uk": "Напиши note_r1.md і попроси тьютора викреслити кожне слово, яке рецензентові не потрібне. Ти маєш побачити менше 80 слів."}], "play": {"en": "Word budget: I send the tutor my note, and it removes any sentence a reviewer wouldn't need. Each removal costs me a point.", "uk": "Бюджет слів: я надсилаю тьютору свою нотатку, а він прибирає кожне речення, яке рецензентові не потрібне. Кожне вилучення коштує мені бала."}, "video": {"url": "https://www.youtube.com/watch?v=JcqG3dILKZY", "title": "How to Give a Professional Design Critique (Step by Step)", "channel": "Lindsay Marsh", "length": "11:43", "search": "how to take design critique feedback"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Self-review with the tutor, the rubric and the cover note (Day 45, lesson 4 of 4).\nToday's build: District 1 r1 (round 1): five HighResShot screenshots from C1 to C5 in locked light, a pre-flight check, a board with each shot beside its reference photo, and your self-review with the tutor.\nEarlier today I already did: lesson 1 (A clean, repeatable shot set (micro-lesson)); lesson 2 (The pre-flight check (micro-lesson)); lesson 3 (Judging against reference photos). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Score your set with the rubric first, then ask the tutor for a review the way a demanding art director gives one: short, concrete, located.\n2. Take critique well: accept, question or reject each note, with a reason.\n3. Write a cover note under 80 words that hides no known fault.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Word budget: I send the tutor my note, and it removes any sentence a reviewer wouldn't need. Each removal costs me a point.\n4. Do-along on today's build (the C1 shot, checked and paired with its photo): guide me through these steps one at a time, checking a screenshot after each:\n   - Score the five rubric lines 0 to 2 in district1_r1_notes.md. You should see a total out of 10.\n   - Paste the board and the rubric into a new tutor chat and ask for an art director's review and its own score. You should see notes per camera and a total.\n   - Beside each tutor note write accept, question or reject, and why. You should see every note answered.\n   - Add the accepted notes to your list and rank the whole list. You should see one ranked list for Day 46.\n   - Write note_r1.md and ask the tutor to cut any word a reviewer wouldn't need. You should see fewer than 80 words.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"How to Give a Professional Design Critique (Step by Step)\" by Lindsay Marsh: https://www.youtube.com/watch?v=JcqG3dILKZY\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "district1_r1/ (district1_r1_C1.png to district1_r1_C5.png and note_r1.md)", "uk": "district1_r1/ (від district1_r1_C1.png до district1_r1_C5.png і note_r1.md)"}, {"en": "district1_r1_board.png", "uk": "district1_r1_board.png"}, {"en": "preflight_d1.md", "uk": "preflight_d1.md"}, {"en": "district1_r1_notes.md (your notes, the tutor's notes, both rubric scores and the ranked fix list)", "uk": "district1_r1_notes.md (твої нотатки, нотатки тьютора, обидві оцінки за рубрикою і впорядкований список виправлень)"}, {"en": "Boss evidence: your finish time and tier (Bronze, Silver or Gold) in summary.md, and budget.md if you went for Gold", "uk": "Докази Дня боса: твій час фінішу й рівень (Бронза, Срібло чи Золото) у summary.md і budget.md, якщо ти йдеш на золото"}, {"en": "before_after_day45.png (Day 41's empty C4 beside r1's C4)", "uk": "before_after_day45.png (порожній C4 з Дня 41 поруч із C4 з r1)"}, {"en": "flythrough_day45.mp4 (60 seconds through district 1)", "uk": "flythrough_day45.mp4 (60 секунд через район 1)"}, {"en": "summary.md", "uk": "звіт дня (summary.md)"}], "goal": {"en": "By the end of today you have five clean screenshots of district 1 from C1 to C5, each beside its reference photo on one board, with your own located notes and a ranked fix list for Monday.", "uk": "Наприкінці дня в тебе є п'ять чистих скриншотів району 1 з C1-C5, кожен поруч зі своїм референсним фото на одній дошці, з твоїми власними прив'язаними до місця нотатками і впорядкованим списком виправлень на понеділок."}, "uses": [{"en": "Days 41 to 44: district 1, built, furnished, planted and aged", "uk": "Дні 41-44: район 1, збудований, облаштований, засаджений і зістарений"}, {"en": "Day 41: the five locked cameras C1 to C5 and budget.md", "uk": "День 41: п'ять заблокованих камер C1-C5 і budget.md"}, {"en": "Day 21: your 15 reference photos", "uk": "День 21: твої 15 референсних фото"}, {"en": "Day 32: island_light_recipe.md (your light recipe, grown from Day 30's sky_recipe.md) and the Post Process Volume with locked exposure", "uk": "День 32: island_light_recipe.md (твій рецепт світла, що виріс із sky_recipe.md з Дня 30) і Post Process Volume із заблокованою експозицією"}, {"en": "Day 19: Post Process Volumes and exposure", "uk": "День 19: Post Process Volumes і експозиція"}], "quiz": [{"q": {"en": "Why build a 60 x 60 m sample before the full district (Day 41)?", "uk": "Навіщо будувати пробну ділянку 60 x 60 м перед повним районом (День 41)?"}, "options": [{"en": "To test the recipe's look and cost while changes are cheap", "uk": "Щоб перевірити вигляд і вартість рецепта, поки зміни дешеві"}, {"en": "Because a district must be built in 60 m squares", "uk": "Бо район треба будувати квадратами по 60 м"}, {"en": "To avoid using Data Layers", "uk": "Щоб не використовувати Data Layers"}, {"en": "Because the sample becomes the whole district", "uk": "Бо пробна ділянка стає цілим районом"}], "answer": 0, "explain": {"en": "The sample tests the kit, packs, density, light and cost on a small area first.", "uk": "Пробна ділянка спершу перевіряє модульний набір, паки, щільність, світло й вартість на малій площі."}}, {"q": {"en": "stat unit shows Game 18 ms, Draw 6 ms and GPU 11 ms. What limits the frame?", "uk": "stat unit показує Game 18 мс, Draw 6 мс і GPU 11 мс. Що обмежує кадр?"}, "options": [{"en": "The graphics card", "uk": "Відеокарта"}, {"en": "The game logic (Game)", "uk": "Логіка гри (Game)"}, {"en": "Drawing preparation (Draw)", "uk": "Підготовка до малювання (Draw)"}, {"en": "Nothing; it is under budget", "uk": "Ніщо; усе в межах бюджету"}], "answer": 1, "explain": {"en": "The slowest of the three sets the frame: here the game logic at 18 ms, which is over 16.6 ms.", "uk": "Кадр задає найповільніший із трьох: тут логіка гри з 18 мс, а це більше за 16,6 мс."}}, {"q": {"en": "On Day 42, why do the shop fronts stay outside the house types' Level Instances?", "uk": "Чому на Дні 42 фасади крамниць стоять поза Level Instances типів будинків?"}, "options": [{"en": "Fronts can't be inside a Level Instance", "uk": "Фасади не можуть бути всередині Level Instance"}, {"en": "So the frame time drops", "uk": "Щоб зменшився час кадру"}, {"en": "So each copy of a house can have its own front and colour", "uk": "Щоб кожна копія будинку могла мати власний фасад і колір"}, {"en": "So the fronts cast no shadows", "uk": "Щоб фасади не відкидали тіней"}], "answer": 2, "explain": {"en": "Everything inside a Level Instance is the same in every copy. Separate fronts let each shop differ.", "uk": "Усе всередині Level Instance однакове в кожній копії. Окремі фасади дають кожній крамниці відрізнятися."}}, {"q": {"en": "You set a boat's Z to the water surface, and it sinks up to its seats. What is the likely cause?", "uk": "Ти ставиш Z човна на рівень поверхні води, а він тоне до сидінь. Яка ймовірна причина?"}, "options": [{"en": "The water is too deep", "uk": "Вода надто глибока"}, {"en": "The boat has no UCX box", "uk": "Човен не має бокса UCX"}, {"en": "The origin is at the top of the hull instead of at the waterline", "uk": "Опорна точка вгорі корпусу, а не на ватерлінії"}, {"en": "The material is translucent", "uk": "Матеріал напівпрозорий"}], "answer": 2, "explain": {"en": "The typed Z puts the origin on the water. An origin at the top edge pushes the whole hull under.", "uk": "Введений Z ставить на воду опорну точку. Опорна точка на верхньому краї штовхає весь корпус під воду."}}, {"q": {"en": "Where do algae and salt lines belong in a harbour?", "uk": "Де місце водоростям і сольовим лініям у гавані?"}, "options": [{"en": "On the quay walls along the waterline, with breaks", "uk": "На стінах причалу вздовж ватерлінії, з розривами"}, {"en": "On the roofs", "uk": "На дахах"}, {"en": "Evenly on every wall in the district", "uk": "Рівномірно на кожній стіні району"}, {"en": "On the promenade paving", "uk": "На мощенні променаду"}], "answer": 0, "explain": {"en": "Grime goes where its cause is. The sea wets and stains the walls it reaches.", "uk": "Бруд іде туди, де його причина. Море мочить і плямує ті стіни, до яких досягає."}}, {"q": {"en": "Why lock exposure before shooting a review set?", "uk": "Навіщо блокувати експозицію перед зйомкою набору для огляду?"}, "options": [{"en": "It makes the shots brighter", "uk": "Від цього кадри яскравіші"}, {"en": "It saves memory", "uk": "Це заощаджує пам'ять"}, {"en": "It is needed for HighResShot to work", "uk": "Без цього не працює HighResShot"}, {"en": "So every round looks the same and only your work changes between shots", "uk": "Щоб кожен раунд виглядав однаково і між кадрами змінювалася лише твоя робота"}], "answer": 3, "explain": {"en": "Auto exposure changes brightness as the view changes. Locked exposure makes before and after pairs honest.", "uk": "Автоекспозиція змінює яскравість, коли змінюється вигляд. Заблокована експозиція робить пари «до і після» чесними."}}, {"q": {"en": "Your own note says 'C2 feels empty'. How do you make it useful?", "uk": "Твоя власна нотатка каже: «C2 здається порожнім». Як зробити її корисною?"}, "options": [{"en": "Leave it; the tutor will fix it", "uk": "Залишити; тьютор виправить"}, {"en": "Rewrite it as see, why and fix with a place: 'See: the promenade at (40, 12) m has no benches. Why: it reads as unused. Fix: the plan's 6 bench sets, facing the sea.'", "uk": "Переписати як «бачу, чому, виправити» з місцем: «Бачу: на променаді в (40, 12) м немає лавок. Чому: він виглядає незатребуваним. Виправити: 6 наборів лавок із плану, лицем до моря.»"}, {"en": "Delete it", "uk": "Видалити її"}, {"en": "Change it to 'C2 needs to be better'", "uk": "Змінити на «C2 треба зробити кращим»"}], "answer": 1, "explain": {"en": "A useful note says what is there, why it matters and exactly what to change, where.", "uk": "Корисна нотатка каже, що там є, чому це важливо і що саме змінити та де."}}, {"q": {"en": "In what order do you compare a shot with its reference photo?", "uk": "У якому порядку ти порівнюєш кадр із його референсним фото?"}, "options": [{"en": "Edges, then colour, then big shapes", "uk": "Краї, потім колір, потім великі форми"}, {"en": "Density first, then nothing else", "uk": "Спершу щільність, а більше нічого"}, {"en": "Big shapes and scale, then light and colour, then density and detail, then the edges", "uk": "Великі форми й масштаб, потім світло й колір, потім щільність і деталі, потім краї"}, {"en": "Whatever catches your eye", "uk": "Що впаде в око"}], "answer": 2, "explain": {"en": "A fixed order catches the biggest problems first and stops you polishing details on a wrong shape.", "uk": "Сталий порядок спершу ловить найбільші проблеми й не дає шліфувати деталі на неправильній формі."}}], "weekInfo": {"week": 9, "title": {"en": "District 1: the waterfront", "uk": "Район 1: набережна"}, "goal": {"en": "By Friday you have district 1, your waterfront, built from your plan with your own kit, props, boats, plants and decals, measured against a frame budget, and five screenshots that stand beside your reference photos.", "uk": "До п'ятниці в тебе є район 1, твоя набережна, збудований за твоїм планом із твого власного модульного набору, пропсів, човнів, рослин і декалей, перевірений бюджетом кадру, та п'ять скриншотів, які витримують порівняння з твоїми референсними фото."}, "skills": [{"en": "Set dressing a 200 x 200 m district from a counted plot plan in Unreal Engine 5", "uk": "Наповнення сцени (set dressing) району 200 x 200 м за планом розміщення з підрахунками в Unreal Engine 5"}, {"en": "Performance budgeting with stat unit, stat gpu and CSV profiling", "uk": "Бюджет продуктивності зі stat unit, stat gpu і CSV-профілюванням"}, {"en": "Modular building assembly with Level Instances and Packed Level Actors", "uk": "Збирання модульних будівель за допомогою Level Instances і Packed Level Actors"}, {"en": "Decal and material-wear storytelling for realistic environments", "uk": "Розповідь через декалі та зношеність матеріалів для реалістичного оточення"}, {"en": "Art review against reference photographs with located see-why-fix notes", "uk": "Арт-рев'ю за референсними фото з прив'язаними до місця нотатками «що бачу, чому, як виправити»"}]}, "morning": {"sofar": {"en": "This week you built your waterfront district: a sample plot, buildings, shop fronts, furniture, boats, planting and grime.", "uk": "Цього тижня виріс твій район набережної: зразкова ділянка, будівлі, вітрини, меблі, човни, рослини й бруд."}, "today": {"en": "It is Boss day: you take five clean screenshots of district 1, set each beside its reference photo, and write a ranked fix list.", "uk": "Сьогодні День боса: ти робиш п'ять чистих скриншотів району 1, ставиш кожен поруч із його референсним фото й пишеш список виправлень за пріоритетом."}, "cheer": {"en": "A first round is meant to show what to fix, so be honest and generous with yourself; Bronze is there for anyone who finishes the set.", "uk": "Перший раунд для того й існує, щоб показати, що виправити, тож оцінюй чесно й стався до себе з добротою; Бронза чекає на кожного, хто завершить цей набір кадрів."}, "quote": {"text": {"en": "If what I see in my mind excites me, there is a good chance it will make a good photograph.", "uk": "Якщо те, що я бачу в уяві, мене захоплює, є добрий шанс, що з цього вийде добра фотографія."}, "author": {"en": "Ansel Adams", "uk": "Ансел Адамс"}, "source": "https://en.wikiquote.org/wiki/Ansel_Adams"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-45-boss-district1-r1", "mapHref": "../../COURSE.html", "prevHref": "../Day-44-district1-planting-grime-decals/START-HERE.html", "nextHref": "../Day-46-district1-r2-fixes/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8 and Krita. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me and don't write code. Keep me moving and make it feel like a game.\n\nToday I build on my own: The full r1 set, the board and the review, on your own and timed (start a 4-hour timer).\nIt's part of: District 1 r1 (round 1): five HighResShot screenshots from C1 to C5 in locked light, a pre-flight check, a board with each shot beside its reference photo, and your self-review with the tutor (District 1, from the five locked cameras C1 to C5.).\n\nSpec:\n- The light checked against island_light_recipe.md (Day 32: the sun's rotation, Sky Light, fog, Sky Atmosphere and the exposure value), with exposure still locked in your Post Process Volume (Min EV100 = Max EV100), so every round looks the same and only your work changes.\n- district1_r1_C1.png to district1_r1_C5.png: HighResShot 1920x1080 (a console command that saves a clean screenshot at that size), in game view, with no editor icons.\n- preflight_d1.md: every shot checked for seven faults: floating, gaps, flicker, stand-ins (grey boxes or placeholders), rows or straight lines in nature, blocked lanes, and anything not present day.\n- district1_r1_board.png: five rows, the engine shot on the left and the nearest reference photo on the right, labelled C1 to C5.\n- district1_r1_notes.md: per shot, pass or fix, with see-why-fix notes (what you see, why it matters, the fix with a place in metres or a camera); then the tutor's notes as a second opinion; then the fixes ranked by how much they show from the drone.\n- The rubric, scored by you and then by the tutor (0, 1 or 2 each): realism beside the photos; grounding (nothing floats or sinks); density and life; wear and grime with causes; clean shots. Both scores written in district1_r1_notes.md.\n- note_r1.md, under 80 words: what the shots show, what to look at, what isn't done yet.\n\nMy checklist:\n1. Start a 4-hour timer. Check the light against island_light_recipe.md and check that exposure is still locked in your Post Process Volume. Check: the same view looks the same after you fly away and back. (from lesson 1)\n2. Pilot C1, press G, run HighResShot 1920x1080 and rename the file district1_r1_C1.png. Check: the file is 1920 x 1080 and shows no icons. (from lesson 1)\n3. Repeat for C2 to C5. Check: five files with the right names in a folder district1_r1. (from lesson 1)\n4. Pre-flight check on each shot at 200 % in Krita; write preflight_d1.md. Check: every check has a yes or no for every shot. (from lesson 2)\n5. Fix any pre-flight fault at its source in the level and shoot that camera again. Check: the new shot passes, and you kept the old one as a before. (from lesson 2)\n6. Make district1_r1_board.png: engine left, photo right, five rows. Check: each pair shows the same kind of view. (from lesson 3)\n7. For each row, write three differences, biggest first, as see-why-fix notes with places. Check: no note says only 'better' or 'more'. (from lesson 3)\n8. Mark each shot pass or fix, and rank all the fixes by how much they show from the drone. Check: the top fix is the one a stranger would notice first. (from lesson 3)\n9. Score the rubric yourself. Then paste the board and your notes into a new tutor chat, ask for an art director's review and its rubric score, and accept, question or reject each note with a reason. Check: every tutor note has your answer beside it, and both scores are written. (from lesson 4)\n10. Write note_r1.md under 80 words. Check: it is under 80 words and hides no known fault. (from lesson 4)\n11. Gold only: a CSV capture through district 1 (as on Day 41); write the average and 95th percentile in budget.md. Check: both numbers are under the budget. (from day 41, lesson 4)\n12. Capture: Day 41's empty C4 beside r1's C4 (before_after_day45.png), and a 60-second flight through district 1. Write your finish time and tier in summary.md. Save today's clip as flythrough_day45.mp4. Check: both files are in today's Work folder. (from lesson 1)\n\nToday is a BOSS build: help me keep time against the tiers below. Tiers:\n- Bronze: five clean 1920 x 1080 shots from C1 to C5 on the board beside five reference photos, with district1_r1_notes.md and both rubric scores, inside 4 hours.\n- Silver: Bronze, plus every shot passes the pre-flight check with no fault the tutor can find, and every note has see, why, fix and a place.\n- Gold: Silver, plus each shot's subject reads in a 3-second glance, the CSV through district 1 holds the budget (average under 16.6 ms, 95th percentile under 33.3 ms), and you finish inside 3 hours 30.\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me and tell me which tier I reached.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Ksenia\nDay 45: Boss: district 1 r1, five screenshots beside your reference photos. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; boss tier: <bronze / silver / gold / none>; quiz: <score> of 8\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p><div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+list(D.handin,'ul','ticks')+'<p class="path">'+ic('folder')+'<span>'+u('shipTo')+' <code>'+esc(D.workPath)+'</code></span></p>'+(D.lessons.length?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<p class="muted">'+u('report')+'</p><div class="row"><button class="btn s" onclick="cp(D.reportPrompt)">'+ic('copy')+u('copyR')+'</button></div></section>';
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();

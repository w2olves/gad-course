<script id="data" type="application/json">{"learner": "ib-ksenia-f808e93c", "learnerName": {"en": "Ksenia", "uk": "Ксенія"}, "day": 11, "week": 3, "total": 60, "title": {"en": "UVs on your kit: seams, unwrapping and texel density", "uk": "UV на твоєму наборі: шви, розгортка й щільність текселів"}, "theme": {"en": "Week 3: Surfaces", "uk": "Тиждень 3: Поверхні"}, "build": {"item": {"en": "UVs for the whole harbour kit and the four street props, at one texel density", "uk": "UV для всього портового набору й чотирьох вуличних пропсів з однією щільністю текселів"}, "why": {"en": "A texture is an image wrapped onto a model, and UVs tell it where to sit. Without good UVs a texture smears or stretches. Today every piece gets a clean unwrap, with seams where nobody looks and one pixel size per metre. Studios check this first, because a kit where one wall has giant stones and the next has tiny ones looks broken from any distance.", "uk": "Текстура — це зображення, обгорнуте навколо моделі, а UV підказують, де саме вона лежить. Без добрих UV текстура розмазується або розтягується. Сьогодні кожна деталь отримує чисту розгортку зі швами там, куди ніхто не дивиться, і одним розміром пікселя на метр. Студії перевіряють це насамперед, бо набір, де на одній стіні велетенське каміння, а на сусідній дрібне, виглядає зламаним з будь-якої відстані."}, "where": {"en": "Your three kit .blend files (saved with Day 11 names), your prop .blend files, and a new check level, L_UVCheck, in Course/Day11. The same pieces build your island's waterfront in Week 9.", "uk": "Три файли набору .blend (збережені з назвами Дня 11), файли .blend твоїх пропсів і новий рівень для перевірки, L_UVCheck, у Course/Day11. Ці самі деталі стануть набережною твого острова на Тижні 9."}, "spec": [{"en": "Kit standard: 1024 pixels per metre. With a 2048 x 2048 texture, one UV square covers 2 x 2 m of the model.", "uk": "Стандарт набору: 1024 пікселі на метр. З текстурою 2048 x 2048 один UV-квадрат покриває 2 x 2 м моделі."}, {"en": "Every piece is unwrapped with seams on hidden edges (the back, the bottom, inside corners), and no checker square is stretched.", "uk": "Кожна деталь розгорнута зі швами на прихованих ребрах (ззаду, знизу, у внутрішніх кутах), і жодна клітинка шахівниці не розтягнута."}, {"en": "Every piece shows the same checker square size as a 2 x 2 m reference plane (TD_Reference).", "uk": "На кожній деталі клітинки такого самого розміру, як на опорній площині 2 x 2 м (TD_Reference)."}, {"en": "Wood grain runs along planks and rails; stone rows run level.", "uk": "Волокна деревини йдуть уздовж дощок і поручнів; ряди каменю лежать рівно."}, {"en": "UV islands may run past the edge of the UV square: tiling textures simply repeat. (For painting, on Day 14, you make a second map where everything stays inside.)", "uk": "UV-острівці можуть виходити за край UV-квадрата: тайлові текстури просто повторюються. (Для малювання, на Дні 14, ти робиш другу розгортку, де все лишається всередині.)"}, {"en": "Each piece is exported again as FBX over its old file, with the same name and settings, and reimported in Unreal. Today every piece wears the checker material UVGrid; tomorrow it gets proper surface materials.", "uk": "Кожну деталь знову експортовано у FBX поверх старого файлу з тією самою назвою й налаштуваннями та повторно імпортовано (Reimport) в Unreal. Сьогодні на кожній деталі матеріал-шахівниця UVGrid; завтра вона отримає справжні матеріали поверхні."}, {"en": "In L_UVCheck every piece wears M_UVCheck, and the squares are the same size everywhere.", "uk": "У L_UVCheck на кожній деталі M_UVCheck, і клітинки скрізь однакового розміру."}], "piece1": "SM_Wall_2m, SM_QuayEdge_4m and SM_PierDeck_4m (shared with the lessons)", "piece2": {"en": "The rest of the kit and the four street props, on your own", "uk": "Решта набору й чотири вуличні пропси, самостійно"}, "steps": [{"text": {"en": "Open your three Week 2 kit files one at a time and save each with a Day 11 name (File > Save As): quaykit_day11.blend (you did this one in the lessons), railing_day11.blend and buildkit_day11.blend. TD_Reference and UVGrid are already in quaykit_day11.blend and buildkit_day11.blend; bring them into railing_day11.blend with File > Append, as in lesson 4. In every piece you unwrap today, remove the old material slots (minus button) and pick UVGrid (ball icon). Check: in Material Preview, each file shows TD_Reference with even, square checkers beside the piece you work on.", "uk": "Відкрий по черзі три файли набору з Тижня 2 і збережи кожен з назвою Дня 11 (File > Save As): quaykit_day11.blend (цей уже готовий з уроків), railing_day11.blend і buildkit_day11.blend. TD_Reference і UVGrid уже є в quaykit_day11.blend і buildkit_day11.blend; додай їх у railing_day11.blend через File > Append, як в уроці 4. На кожній деталі, яку сьогодні розгортаєш, прибери старі слоти матеріалів (кнопка «мінус») і вибери UVGrid (іконка кульки). Перевірка: у Material Preview кожен файл показує TD_Reference з рівними квадратними клітинками поруч із деталлю, над якою ти працюєш."}, "lesson": 3}, {"text": {"en": "SM_Wall_Window (in buildkit_day11.blend): give it the UVGrid material, mark seams on the back corners and around the inside of the window opening, then press U > Unwrap. Check: with Display Stretch on, the faces stay blue, with no green or red.", "uk": "SM_Wall_Window (у buildkit_day11.blend): признач їй матеріал UVGrid, познач шви на задніх кутах і всередині віконного отвору, потім натисни U > Unwrap. Перевірка: з увімкненим Display Stretch грані лишаються синіми, без зеленого чи червоного."}, "lesson": 2}, {"text": {"en": "SM_Wall_Door: unwrap it the same way. Put the seam inside the door opening, where a camera rarely looks. Check: no stretched squares on the front face or inside the door opening.", "uk": "SM_Wall_Door: розгорни так само. Шов постав усередині дверного отвору, куди камера рідко зазирає. Перевірка: жодних розтягнутих клітинок на передній грані чи всередині дверного отвору."}, "lesson": 2}, {"text": {"en": "SM_Steps: seams along the back and the hidden side edges, then U > Unwrap. Check: each step's top shows square checkers in neat rows.", "uk": "SM_Steps: шви вздовж задніх і прихованих бічних ребер, потім U > Unwrap. Перевірка: верх кожної сходинки показує квадратні клітинки рівними рядами."}, "lesson": 2}, {"text": {"en": "SM_Railing_2m and SM_RailingPost (in railing_day11.blend): select all, U > Smart UV Project (Island Margin 0.02). In the UV Editor, rotate the long rail islands (R 90) so they lie flat left to right. Check: the rails and the post show square checkers in long, straight rows.", "uk": "SM_Railing_2m і SM_RailingPost (у railing_day11.blend): виділи все, U > Smart UV Project (Island Margin 0.02). В UV Editor поверни довгі острівці поручня (R 90), щоб вони лежали горизонтально, зліва направо. Перевірка: на поручнях і стійці квадратні клітинки йдуть довгими рівними рядами."}, "lesson": 4}, {"text": {"en": "SM_QuayCorner_Out (in quaykit_day11.blend) and SM_Wall_Corner, SM_Roof_2m, SM_Roof_Ridge_2m and SM_Roof_Gable_4m (in buildkit_day11.blend): seams where nobody looks, or Smart UV Project for simple blocks. Check: no stretched squares on any face a drone camera will see.", "uk": "SM_QuayCorner_Out (у quaykit_day11.blend) і SM_Wall_Corner, SM_Roof_2m, SM_Roof_Ridge_2m та SM_Roof_Gable_4m (у buildkit_day11.blend): шви там, куди ніхто не дивиться, або Smart UV Project для простих блоків. Перевірка: жодних розтягнутих клітинок на гранях, які побачить камера дрона."}, "lesson": 4}, {"text": {"en": "Density pass on the whole kit: for each piece, select all its islands, UV > Average Islands Scale, then press S and scale until its squares match TD_Reference. Check: each piece, shown on its own with the others hidden, has the same square size as TD_Reference beside it. (You compare the whole row side by side in Unreal at the end.)", "uk": "Прохід по щільності для всього набору: для кожної деталі виділи всі її острівці, UV > Average Islands Scale, потім натисни S і масштабуй, доки клітинки не збігатимуться з TD_Reference. Перевірка: кожна деталь, показана окремо (решту приховано), має клітинки того самого розміру, що й TD_Reference поруч. (Увесь ряд поруч ти порівнюєш в Unreal наприкінці.)"}, "lesson": 3}, {"text": {"en": "Grain pass: for each wooden or stone piece, look at the checker rows in the 3D view. Rotate islands with R 90 in the UV Editor where planks or stone rows would run the wrong way. Check: you can say, for each piece, which way its planks or stone rows run.", "uk": "Прохід по волокнах: для кожної дерев'яної чи кам'яної деталі подивися на ряди клітинок у 3D-вікні. Поверни острівці через R 90 в UV Editor там, де дошки чи ряди каменю йшли б не в той бік. Перевірка: для кожної деталі ти можеш сказати, в який бік ідуть її дошки чи ряди каменю."}, "lesson": 3}, {"text": {"en": "The four street props: open the newest .blend of each (the file you exported its FBX from on Day 4 or 5). Remove the old material slots and pick UVGrid, as for the kit. Smart UV Project, then scale to the square size of TD_Reference (append TD_Reference with File > Append, or make a new 2 m plane). Save each file. Check: bollard, bench, lamp post and bin all show the same square size.", "uk": "Чотири вуличні пропси: відкрий найновіший .blend кожного (файл, з якого на Дні 4 чи 5 був експорт FBX). Прибери старі слоти матеріалів і вибери UVGrid, як для набору. Smart UV Project, потім масштабуй до розміру клітинок TD_Reference (додай TD_Reference через File > Append або створи нову площину 2 м). Збережи кожен файл. Перевірка: стовпчик, лавка, ліхтарний стовп і урна мають клітинки однакового розміру."}, "lesson": 4}, {"text": {"en": "Export every kit piece and prop again as FBX over its old file, with the same names and settings as before (each piece with its UCX boxes, from the world origin; TD_Reference not selected). Check: in Windows Explorer, the FBX files show today's date.", "uk": "Знову експортуй кожну деталь набору й кожен пропс у FBX поверх старого файлу, з тими самими назвами й налаштуваннями, що й раніше (кожну деталь з її UCX-коробками, від початку координат світу; TD_Reference не виділено). Перевірка: у Windows Explorer (Провідник) файли FBX мають сьогоднішню дату."}, "lesson": 4}, {"text": {"en": "In Unreal, right-click each mesh in the Content Browser > Reimport. If a window about material slots opens, accept it as it is: you set proper materials tomorrow. Then drag every kit piece and prop into L_UVCheck in a row and take a screenshot from 10 m (your before picture). Now drop M_UVCheck on each. Check: from 10 m the squares are the same size on every piece, and no piece shows stretched stripes.", "uk": "В Unreal клацни правою кнопкою кожну сітку в Content Browser > Reimport. Якщо відкриється вікно про слоти матеріалів, прийми його як є: справжні матеріали ти налаштуєш завтра. Потім перетягни всі деталі набору й пропси в L_UVCheck у ряд і зроби скриншот з 10 м (твоє фото «до»). Тепер перетягни M_UVCheck на кожну. Перевірка: з 10 м клітинки однакового розміру на кожній деталі, і жодна деталь не показує розтягнутих смуг."}, "lesson": 4}, {"text": {"en": "Before/after capture: put your before picture beside a screenshot from the same view with M_UVCheck on every piece. Then record a 60-second clip (Win+Alt+R) flying slowly along the row. Save today's clip as flythrough_day11.mp4 and check that you also have uv_layouts.png, kit_checker_row.png and before_after_day11.png (each is described in today's hand-in list; take any you are missing now). Check: the clip is about 60 seconds long and shows every piece.", "uk": "Знімок «до/після»: постав своє фото «до» поруч зі скриншотом з того самого ракурсу, де на кожній деталі M_UVCheck. Потім запиши 60-секундний кліп (Win+Alt+R), повільно пролітаючи вздовж ряду. Збережи сьогоднішній кліп як flythrough_day11.mp4 і перевір, що в тебе також є uv_layouts.png, kit_checker_row.png і before_after_day11.png (кожен описано в сьогоднішньому списку «Здати роботу»; зроби зараз ті, яких бракує). Перевірка: кліп триває близько 60 секунд і показує кожну деталь."}, "lesson": 4}]}, "lessons": [{"title": {"en": "What UVs are, and the checker test", "uk": "Що таке UV, і тест шахівницею"}, "minutes": 40, "goals": [{"en": "Explain UVs in one sentence: the flat pattern of a 3D surface, like a cardboard box cut open and laid flat, so a texture (an image wrapped onto the model) knows where to sit.", "uk": "Поясни UV одним реченням: пласка викрійка 3D-поверхні, як розрізана й розкладена картонна коробка, щоб текстура (зображення, обгорнуте навколо моделі) знала, де їй лежати."}, {"en": "Open the UV Editing workspace and read a piece's islands (the separate flat pieces of the pattern) inside the UV square.", "uk": "Відкрий робочий простір UV Editing і розпізнай острівці деталі (окремі пласкі шматки викрійки) всередині UV-квадрата."}, {"en": "Make a 2048 x 2048 UV grid image and a checker material, and spot stretched squares on a model.", "uk": "Створи зображення UV Grid 2048 x 2048 і матеріал-шахівницю та знайди розтягнуті клітинки на моделі."}], "doalong": [{"en": "Open quaykit_day8.blend (your Day 8 quay file) and save it as quaykit_day11.blend (File > Save As). Click the UV Editing tab at the top of the Blender window (beside Layout and Modeling). You see two views: the UV Editor on the left and the 3D view on the right.", "uk": "Відкрий quaykit_day8.blend (твій файл набережної з Дня 8) і збережи його як quaykit_day11.blend (File > Save As). Клацни вкладку UV Editing угорі вікна Blender (поруч із Layout і Modeling). Ти бачиш два вікна: UV Editor ліворуч і 3D-вікно праворуч."}, {"en": "In the 3D view, click SM_QuayEdge_4m (if it is hidden, click its eye icon in the Outliner, top right), press Tab for Edit Mode, then A to select everything. You see flat shapes appear in the square on the left: these are its UV islands, and the square is the UV square (one copy of the texture).", "uk": "У 3D-вікні клацни SM_QuayEdge_4m (якщо її приховано, клацни іконку ока в Outliner, угорі праворуч), натисни Tab для Edit Mode (режим редагування), потім A, щоб виділити все. У квадраті ліворуч з'являються пласкі фігури: це її UV-острівці, а квадрат — це UV-квадрат (одна копія текстури)."}, {"en": "In the UV Editor's top menu, click Image > New. Name it uv_grid_2048, set Width and Height to 2048, Generated Type to UV Grid, and press OK. You see a checker image fill the UV square behind the islands.", "uk": "У верхньому меню UV Editor клацни Image > New. Назви зображення uv_grid_2048, задай Width і Height 2048, Generated Type — UV Grid, і натисни OK. Ти бачиш, як зображення-шахівниця заповнює UV-квадрат позаду острівців."}, {"en": "Press Tab to go back to Object Mode. In the Properties editor on the right, click Material Properties (the red ball icon). You see M_Stone, your Day 7 material, in the list. Press the minus (-) button beside the list to remove it, then press New; double-click the new name and call it UVGrid. You see one slot named UVGrid. (Tomorrow every piece gets proper surface materials.)", "uk": "Натисни Tab, щоб повернутися в Object Mode. У редакторі Properties праворуч клацни Material Properties (іконка червоної кульки). У списку ти бачиш M_Stone, свій матеріал з Дня 7. Натисни кнопку «мінус» (-) поруч зі списком, щоб прибрати його, потім натисни New; двічі клацни нову назву й назви матеріал UVGrid. Ти бачиш один слот з назвою UVGrid. (Завтра кожна деталь отримає справжні матеріали поверхні.)"}, {"en": "Click the Shading tab at the top. In the node area at the bottom (the Shader Editor), press Shift+A > Texture > Image Texture and click to place it. Pick uv_grid_2048 from its image list. Drag its yellow Color dot onto Base Color of the Principled BSDF node. You see a wire join the two nodes.", "uk": "Клацни вкладку Shading угорі. У зоні вузлів унизу (Shader Editor) натисни Shift+A > Texture > Image Texture і клацни, щоб розмістити вузол. Вибери uv_grid_2048 у його списку зображень. Перетягни жовту точку Color на Base Color вузла Principled BSDF. Ти бачиш, як дріт з'єднує два вузли."}, {"en": "In the 3D view press Z > Material Preview (a view that shows materials and textures). You see the checker on the wall. Write down any face where the squares are stretched into stripes, squashed or much bigger than elsewhere.", "uk": "У 3D-вікні натисни Z > Material Preview (режим, що показує матеріали й текстури). Ти бачиш шахівницю на стіні. Запиши кожну грань, де клітинки розтягнуті в смуги, сплющені або значно більші, ніж деінде."}, {"en": "Go back to the UV Editing tab. In the UV Editor click Image > Save As and save uv_grid_2048.png in your Day11 folder. You see the image name in the header with no asterisk (*), which means it is saved.", "uk": "Повернися на вкладку UV Editing. В UV Editor клацни Image > Save As і збережи uv_grid_2048.png у папку Day11. Ти бачиш назву зображення в заголовку без зірочки (*), а це означає, що його збережено."}], "play": {"en": "Box cutter: the tutor names five things (a cereal box, a drink can, a ball, a T-shirt, a 4 m pier deck). I say where I'd cut each one open so it lies flat, and the tutor scores how well my cuts are hidden.", "uk": "Різак для коробок: тьютор називає п'ять речей (коробку пластівців, бляшанку з напоєм, м'яч, футболку, настил пірса 4 м). Я кажу, де розрізати кожну, щоб вона лягла пласко, а тьютор оцінює, наскільки добре сховані мої розрізи."}, "video": {"url": "https://www.youtube.com/watch?v=XleO7DBm1Us", "title": "Blender 4.0: How to UV Unwrap Anything", "channel": "On Mars 3D", "length": "7:36", "search": "blender uv unwrap seams beginner", "alt": {"url": "https://www.youtube.com/watch?v=jsoDLpWBMyk", "title": "Урок 5 / Основи Blender 5.1 / UV-розгортка під текстурування", "channel": "Fun Open Source Українською"}}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: What UVs are, and the checker test (Day 11, lesson 1 of 4).\nToday's build: UVs for the whole harbour kit and the four street props, at one texel density.\n\nBy the end of this lesson I can:\n1. Explain UVs in one sentence: the flat pattern of a 3D surface, like a cardboard box cut open and laid flat, so a texture (an image wrapped onto the model) knows where to sit.\n2. Open the UV Editing workspace and read a piece's islands (the separate flat pieces of the pattern) inside the UV square.\n3. Make a 2048 x 2048 UV grid image and a checker material, and spot stretched squares on a model.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (In two weeks you have made four street props, a harbour kit, a building kit and L_KitTest, a whole quay assembled from your own pieces.), what I will learn today (You unwrap every kit piece and prop with clean seams at one texel density, so textures will sit evenly on all of them.), encourage me (UVs reward patience more than talent, so unwrap one piece at a time and let the checker squares tell you when it is right.), and share today's quote: \"Talent is a pursued interest. In other words, anything that you're willing to practice, you can do.\" (Bob Ross).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 8: in one sentence each, what does Nanite do, and what do classic LODs do? | Day 5: why did you stand your street props beside the 1.8 m mannequin and real photos?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Box cutter: the tutor names five things (a cereal box, a drink can, a ball, a T-shirt, a 4 m pier deck). I say where I'd cut each one open so it lies flat, and the tutor scores how well my cuts are hidden.\n6. Do-along on today's build (SM_Wall_2m, SM_QuayEdge_4m and SM_PierDeck_4m (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Open quaykit_day8.blend (your Day 8 quay file) and save it as quaykit_day11.blend (File > Save As). Click the UV Editing tab at the top of the Blender window (beside Layout and Modeling). You see two views: the UV Editor on the left and the 3D view on the right.\n   - In the 3D view, click SM_QuayEdge_4m (if it is hidden, click its eye icon in the Outliner, top right), press Tab for Edit Mode, then A to select everything. You see flat shapes appear in the square on the left: these are its UV islands, and the square is the UV square (one copy of the texture).\n   - In the UV Editor's top menu, click Image > New. Name it uv_grid_2048, set Width and Height to 2048, Generated Type to UV Grid, and press OK. You see a checker image fill the UV square behind the islands.\n   - Press Tab to go back to Object Mode. In the Properties editor on the right, click Material Properties (the red ball icon). You see M_Stone, your Day 7 material, in the list. Press the minus (-) button beside the list to remove it, then press New; double-click the new name and call it UVGrid. You see one slot named UVGrid. (Tomorrow every piece gets proper surface materials.)\n   - Click the Shading tab at the top. In the node area at the bottom (the Shader Editor), press Shift+A > Texture > Image Texture and click to place it. Pick uv_grid_2048 from its image list. Drag its yellow Color dot onto Base Color of the Principled BSDF node. You see a wire join the two nodes.\n   - In the 3D view press Z > Material Preview (a view that shows materials and textures). You see the checker on the wall. Write down any face where the squares are stretched into stripes, squashed or much bigger than elsewhere.\n   - Go back to the UV Editing tab. In the UV Editor click Image > Save As and save uv_grid_2048.png in your Day11 folder. You see the image name in the header with no asterisk (*), which means it is saved.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Blender 4.0: How to UV Unwrap Anything\" by On Mars 3D: https://www.youtube.com/watch?v=XleO7DBm1Us\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Seams and Unwrap", "uk": "Шви й Unwrap"}, "minutes": 40, "goals": [{"en": "Explain a seam: an edge where you cut the model open so its surface can lie flat; textures may show a small break there, so seams go where nobody looks.", "uk": "Поясни, що таке шов: ребро, по якому ти розрізаєш модель, щоб її поверхня лягла пласко; текстура може показати там невеликий розрив, тому шви ставлять там, куди ніхто не дивиться."}, {"en": "Mark seams on hidden edges (the back, the bottom, inside corners) and unwrap with U > Unwrap.", "uk": "Познач шви на прихованих ребрах (ззаду, знизу, у внутрішніх кутах) і розгорни через U > Unwrap."}, {"en": "Check stretching with the UV Editor's Display Stretch overlay, and fix a red face with one more seam.", "uk": "Перевір розтягнення накладкою Display Stretch в UV Editor і виправ червону грань ще одним швом."}], "doalong": [{"en": "SM_QuayEdge_4m wears UVGrid from lesson 1. Look at it in Material Preview (Z > Material Preview). You see faces where the squares stretch into stripes: Blender's first UVs were never planned for a texture.", "uk": "На SM_QuayEdge_4m матеріал UVGrid з уроку 1. Подивися на неї в Material Preview (Z > Material Preview). Ти бачиш грані, де клітинки розтягуються в смуги: перші UV від Blender ніхто не планував під текстуру."}, {"en": "Press Tab, then 2 on the top number row for edge select. Click the edges along the back and the bottom of the piece; hold Shift to add more. You see the chosen edges turn orange.", "uk": "Натисни Tab, потім 2 у верхньому ряду цифр для виділення ребер. Клацни ребра вздовж задньої й нижньої сторони деталі; тримай Shift, щоб додати ще. Ти бачиш, що вибрані ребра стають помаранчевими."}, {"en": "Right-click in the 3D view > Mark Seam (it is also in the Edge menu at the top). You see the edges turn red: these are your seams.", "uk": "Клацни правою кнопкою в 3D-вікні > Mark Seam (ця команда є також у меню Edge угорі). Ти бачиш, що ребра стають червоними: це твої шви."}, {"en": "Press A to select everything, then U > Unwrap. You see new islands in the UV Editor, opened along your red seams like a box laid flat.", "uk": "Натисни A, щоб виділити все, потім U > Unwrap. Ти бачиш нові острівці в UV Editor, розкриті вздовж твоїх червоних швів, як розкладена коробка."}, {"en": "At the top right of the UV Editor, open Overlays (the two overlapping circles) and tick Display Stretch. You see the islands coloured: blue is fine, green to red means stretched.", "uk": "Угорі праворуч в UV Editor відкрий Overlays (два кружечки, що перекриваються) і постав галочку Display Stretch. Ти бачиш острівці в кольорі: синій — усе гаразд, від зеленого до червоного — розтягнуто."}, {"en": "If a face is red, select one more edge near it, Mark Seam, then press A and U > Unwrap again. You see the red turn blue. (To remove a seam you didn't want, select it and choose Clear Seam.) Untick Display Stretch when you're done.", "uk": "Якщо грань червона, виділи ще одне ребро поруч, Mark Seam, потім натисни A і знову U > Unwrap. Ти бачиш, що червоне стає синім. (Щоб прибрати непотрібний шов, виділи його й вибери Clear Seam.) Коли закінчиш, зніми галочку Display Stretch."}], "play": {"en": "Seam hunt: the tutor describes a wall piece with five seams. I say which two are in bad places (across the front face, through the middle of a window) and where I'd move them.", "uk": "Полювання на шви: тьютор описує деталь стіни з п'ятьма швами. Я кажу, які два стоять у поганих місцях (через передню грань, посередині вікна) і куди їх перенести."}, "video": {"search": "blender mark seam unwrap display stretch"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Seams and Unwrap (Day 11, lesson 2 of 4).\nToday's build: UVs for the whole harbour kit and the four street props, at one texel density.\nEarlier today I already did: lesson 1 (What UVs are, and the checker test). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Explain a seam: an edge where you cut the model open so its surface can lie flat; textures may show a small break there, so seams go where nobody looks.\n2. Mark seams on hidden edges (the back, the bottom, inside corners) and unwrap with U > Unwrap.\n3. Check stretching with the UV Editor's Display Stretch overlay, and fix a red face with one more seam.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Seam hunt: the tutor describes a wall piece with five seams. I say which two are in bad places (across the front face, through the middle of a window) and where I'd move them.\n4. Do-along on today's build (SM_Wall_2m, SM_QuayEdge_4m and SM_PierDeck_4m (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - SM_QuayEdge_4m wears UVGrid from lesson 1. Look at it in Material Preview (Z > Material Preview). You see faces where the squares stretch into stripes: Blender's first UVs were never planned for a texture.\n   - Press Tab, then 2 on the top number row for edge select. Click the edges along the back and the bottom of the piece; hold Shift to add more. You see the chosen edges turn orange.\n   - Right-click in the 3D view > Mark Seam (it is also in the Edge menu at the top). You see the edges turn red: these are your seams.\n   - Press A to select everything, then U > Unwrap. You see new islands in the UV Editor, opened along your red seams like a box laid flat.\n   - At the top right of the UV Editor, open Overlays (the two overlapping circles) and tick Display Stretch. You see the islands coloured: blue is fine, green to red means stretched.\n   - If a face is red, select one more edge near it, Mark Seam, then press A and U > Unwrap again. You see the red turn blue. (To remove a seam you didn't want, select it and choose Clear Seam.) Untick Display Stretch when you're done.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Texel density: one pixel size for the whole kit", "uk": "Щільність текселів: один розмір пікселя для всього набору"}, "minutes": 40, "goals": [{"en": "Explain texel density: how many texture pixels cover one metre of the model (a texel is one texture pixel on a model), and why every kit piece needs the same one.", "uk": "Поясни щільність текселів: скільки пікселів текстури припадає на один метр моделі (тексель — це один піксель текстури на моделі), і чому всім деталям набору потрібна однакова щільність."}, {"en": "Set up the kit standard: 1024 pixels per metre, so one UV square of a 2048 texture covers 2 x 2 m, and make a 2 x 2 m reference plane that shows it.", "uk": "Налаштуй стандарт набору: 1024 пікселі на метр, тож один UV-квадрат текстури 2048 покриває 2 x 2 м, і зроби опорну площину 2 x 2 м, яка це показує."}, {"en": "Match a piece to the standard with Average Islands Scale and the S key, and turn islands so wood grain runs the right way.", "uk": "Підгони деталь під стандарт через Average Islands Scale і клавішу S та поверни острівці, щоб волокна деревини йшли в правильному напрямку."}], "doalong": [{"en": "In Object Mode press Shift+A > Mesh > Plane. Blender's plane is 2 x 2 m and its UVs fill the whole UV square. Name it TD_Reference (double-click its name in the Outliner, top right), give it the UVGrid material and move it (G) beside the kit. You see the checker at the kit standard.", "uk": "В Object Mode натисни Shift+A > Mesh > Plane. Площина Blender має розмір 2 x 2 м, і її UV заповнюють увесь UV-квадрат. Назви її TD_Reference (двічі клацни її назву в Outliner, угорі праворуч), признач їй матеріал UVGrid і пересунь (G) поруч із набором. Ти бачиш шахівницю в стандарті набору."}, {"en": "Select SM_PierDeck_4m. In Material Properties remove its old slot (minus), then click the ball icon beside New and pick UVGrid. Then mark its seams as in lesson 2, then Tab, A and U > Unwrap. You see its islands squeezed inside the UV square, too small.", "uk": "Виділи SM_PierDeck_4m. У Material Properties прибери її старий слот (мінус), потім клацни іконку кульки поруч із New і вибери UVGrid. Потім познач її шви, як в уроці 2, далі Tab, A і U > Unwrap. Ти бачиш, що її острівці стиснуті всередині UV-квадрата й замалі."}, {"en": "Move the mouse over the UV Editor, press A, then click UV > Average Islands Scale in the UV Editor's menu (or Ctrl+A). You see the islands resized so they match each other in size.", "uk": "Наведи мишу на UV Editor, натисни A, потім клацни UV > Average Islands Scale у меню UV Editor (або Ctrl+A). Ти бачиш, що острівці змінили розмір і тепер однакові за масштабом."}, {"en": "Keep the islands selected and the mouse over the UV Editor. Press S and drag (or type a number and Enter) until the deck's squares in the 3D view match TD_Reference. Islands may now go past the edge of the square. You see the same checker size on the deck and the plane.", "uk": "Не знімай виділення з острівців і тримай мишу над UV Editor. Натисни S і тягни (або введи число й Enter), доки клітинки настилу в 3D-вікні не збігатимуться з TD_Reference. Тепер острівці можуть виходити за край квадрата. Ти бачиш однаковий розмір клітинок на настилі й на площині."}, {"en": "Your deck top is 4 x 4 m, so its island should now be about two UV squares wide and two tall. Decide which way your planks run; if the checker rows run across them, press R 90 in the UV Editor. You see the rows line up with the planks.", "uk": "Верх твого настилу — 4 x 4 м, тож його острівець тепер має бути приблизно два UV-квадрати завширшки й два заввишки. Виріши, в який бік ідуть дошки; якщо ряди клітинок ідуть упоперек них, натисни R 90 в UV Editor. Ти бачиш, що ряди вирівнялися з дошками."}], "play": {"en": "Density detective: the tutor gives me five pieces with sizes (a 2 m wall, a 4 m deck, a 0.5 m bollard top, a 1 m step, a 6 m roof) and asks how many UV squares wide each island should be at the kit standard. I answer in 20 seconds each.", "uk": "Детектив щільності: тьютор дає мені п'ять деталей з розмірами (стіна 2 м, настил 4 м, верх стовпчика 0,5 м, сходинка 1 м, дах 6 м) і питає, скільки UV-квадратів завширшки має бути кожен острівець за стандартом набору. Я відповідаю за 20 секунд на кожну."}, "video": {"search": "texel density explained game art"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Texel density: one pixel size for the whole kit (Day 11, lesson 3 of 4).\nToday's build: UVs for the whole harbour kit and the four street props, at one texel density.\nEarlier today I already did: lesson 1 (What UVs are, and the checker test); lesson 2 (Seams and Unwrap). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Explain texel density: how many texture pixels cover one metre of the model (a texel is one texture pixel on a model), and why every kit piece needs the same one.\n2. Set up the kit standard: 1024 pixels per metre, so one UV square of a 2048 texture covers 2 x 2 m, and make a 2 x 2 m reference plane that shows it.\n3. Match a piece to the standard with Average Islands Scale and the S key, and turn islands so wood grain runs the right way.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Density detective: the tutor gives me five pieces with sizes (a 2 m wall, a 4 m deck, a 0.5 m bollard top, a 1 m step, a 6 m roof) and asks how many UV squares wide each island should be at the kit standard. I answer in 20 seconds each.\n4. Do-along on today's build (SM_Wall_2m, SM_QuayEdge_4m and SM_PierDeck_4m (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - In Object Mode press Shift+A > Mesh > Plane. Blender's plane is 2 x 2 m and its UVs fill the whole UV square. Name it TD_Reference (double-click its name in the Outliner, top right), give it the UVGrid material and move it (G) beside the kit. You see the checker at the kit standard.\n   - Select SM_PierDeck_4m. In Material Properties remove its old slot (minus), then click the ball icon beside New and pick UVGrid. Then mark its seams as in lesson 2, then Tab, A and U > Unwrap. You see its islands squeezed inside the UV square, too small.\n   - Move the mouse over the UV Editor, press A, then click UV > Average Islands Scale in the UV Editor's menu (or Ctrl+A). You see the islands resized so they match each other in size.\n   - Keep the islands selected and the mouse over the UV Editor. Press S and drag (or type a number and Enter) until the deck's squares in the 3D view match TD_Reference. Islands may now go past the edge of the square. You see the same checker size on the deck and the plane.\n   - Your deck top is 4 x 4 m, so its island should now be about two UV squares wide and two tall. Decide which way your planks run; if the checker rows run across them, press R 90 in the UV Editor. You see the rows line up with the planks.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Fast unwraps, export and the check in Unreal", "uk": "Швидкі розгортки, експорт і перевірка в Unreal"}, "minutes": 40, "goals": [{"en": "Bring TD_Reference into another file with File > Append, and use Smart UV Project (Blender cuts the model into islands for you) on small or blocky parts, then bring them to the kit standard.", "uk": "Додай TD_Reference в інший файл через File > Append і використовуй Smart UV Project (Blender сам розрізає модель на острівці) для дрібних чи брилоподібних частин, а потім підгони їх під стандарт набору."}, {"en": "Export over the old FBX file and use Reimport in Unreal, so the asset keeps its name, its place and every copy in your levels.", "uk": "Експортуй поверх старого файлу FBX і використай Reimport в Unreal, щоб асет зберіг назву, місце й усі свої копії на рівнях."}, {"en": "Check the kit in Unreal with a checker material made in one click.", "uk": "Перевір набір в Unreal матеріалом-шахівницею, створеним одним клацанням."}], "doalong": [{"en": "Save quaykit_day11.blend (Ctrl+S). Open buildkit_day9.blend and save it as buildkit_day11.blend. File > Append, open quaykit_day11.blend, double-click Object, pick TD_Reference and press Append. You see the checker plane arrive with its UVGrid material; move it (G X) about 3 m from the wall.", "uk": "Збережи quaykit_day11.blend (Ctrl+S). Відкрий buildkit_day9.blend і збережи його як buildkit_day11.blend. File > Append, відкрий quaykit_day11.blend, двічі клацни Object, вибери TD_Reference і натисни Append. Ти бачиш, що площина-шахівниця з'являється разом зі своїм матеріалом UVGrid; пересунь її (G X) приблизно на 3 м від стіни."}, {"en": "Select SM_Wall_2m, remove its old material slot (minus) and pick UVGrid (ball icon). Press Tab, A, then U > Smart UV Project; set Island Margin (the gap Blender leaves between islands) to 0.02 and press OK. You see many small islands packed in the UV square.", "uk": "Виділи SM_Wall_2m, прибери її старий слот матеріалу (мінус) і вибери UVGrid (іконка кульки). Натисни Tab, A, потім U > Smart UV Project; задай Island Margin (проміжок, який Blender лишає між острівцями) 0.02 і натисни OK. Ти бачиш багато маленьких острівців, щільно складених в UV-квадраті."}, {"en": "With the mouse over the UV Editor: A, then Ctrl+A (Average Islands Scale), then S until the squares match TD_Reference. You see the same square size on the wall and the plane.", "uk": "Тримаючи мишу над UV Editor: A, потім Ctrl+A (Average Islands Scale), потім S, доки клітинки не збігатимуться з TD_Reference. Ти бачиш однаковий розмір клітинок на стіні й на площині."}, {"en": "Back in Object Mode, select the wall and its UCX boxes (not TD_Reference). File > Export > FBX, use the same settings and the same file name as in Week 2, and press Export (yes to overwrite). You see the file's date change to today in Windows Explorer.", "uk": "Повернись в Object Mode і виділи стіну та її UCX-коробки (не TD_Reference). File > Export > FBX, використай ті самі налаштування й ту саму назву файлу, що й на Тижні 2, і натисни Export (так, перезаписати). Ти бачиш, що дата файлу у Windows Explorer змінилася на сьогоднішню."}, {"en": "In Unreal, find SM_Wall_2m in the Content Browser (bottom of the screen; Ctrl+Space opens it). Right-click it > Reimport. If a window about material slots opens, accept it as it is. You see a short message at the bottom right saying it was reimported.", "uk": "В Unreal знайди SM_Wall_2m у Content Browser (унизу екрана; Ctrl+Space відкриває його). Клацни її правою кнопкою > Reimport. Якщо відкриється вікно про слоти матеріалів, прийми його як є. Ти бачиш коротке повідомлення внизу праворуч про те, що асет повторно імпортовано."}, {"en": "Make the folder Course/Day11 (right-click Course > New Folder). Drag uv_grid_2048.png from Explorer into it in the Content Browser and rename it T_UVGrid (T_ means texture). Right-click it > Create Material and name the result M_UVCheck. You see a new material with a checker thumbnail.", "uk": "Створи папку Course/Day11 (правою кнопкою на Course > New Folder). Перетягни uv_grid_2048.png з Explorer у цю папку в Content Browser і перейменуй на T_UVGrid (T_ означає текстуру). Клацни правою кнопкою > Create Material і назви результат M_UVCheck. Ти бачиш новий матеріал із мініатюрою-шахівницею."}, {"en": "File > New Level > Basic, then File > Save Current Level As: L_UVCheck in Course/Day11. Drag SM_Wall_2m and SM_PierDeck_4m into the level and drop M_UVCheck onto each from the Content Browser. You see the same checker size on both.", "uk": "File > New Level > Basic, потім File > Save Current Level As: L_UVCheck у Course/Day11. Перетягни SM_Wall_2m і SM_PierDeck_4m на рівень і кинь на кожну M_UVCheck із Content Browser. Ти бачиш однаковий розмір клітинок на обох."}], "play": {"en": "Spot the odd one: I send a screenshot of six pieces in checkers. The tutor must find the piece with the wrong density in 30 seconds. If it can't, my kit passes.", "uk": "Знайди зайве: я надсилаю скриншот шести деталей у шахівниці. Тьютор має за 30 секунд знайти деталь із неправильною щільністю. Якщо не знаходить, мій набір проходить перевірку."}, "video": {"search": "unreal engine 5 reimport static mesh fbx"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Fast unwraps, export and the check in Unreal (Day 11, lesson 4 of 4).\nToday's build: UVs for the whole harbour kit and the four street props, at one texel density.\nEarlier today I already did: lesson 1 (What UVs are, and the checker test); lesson 2 (Seams and Unwrap); lesson 3 (Texel density: one pixel size for the whole kit). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Bring TD_Reference into another file with File > Append, and use Smart UV Project (Blender cuts the model into islands for you) on small or blocky parts, then bring them to the kit standard.\n2. Export over the old FBX file and use Reimport in Unreal, so the asset keeps its name, its place and every copy in your levels.\n3. Check the kit in Unreal with a checker material made in one click.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Spot the odd one: I send a screenshot of six pieces in checkers. The tutor must find the piece with the wrong density in 30 seconds. If it can't, my kit passes.\n4. Do-along on today's build (SM_Wall_2m, SM_QuayEdge_4m and SM_PierDeck_4m (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Save quaykit_day11.blend (Ctrl+S). Open buildkit_day9.blend and save it as buildkit_day11.blend. File > Append, open quaykit_day11.blend, double-click Object, pick TD_Reference and press Append. You see the checker plane arrive with its UVGrid material; move it (G X) about 3 m from the wall.\n   - Select SM_Wall_2m, remove its old material slot (minus) and pick UVGrid (ball icon). Press Tab, A, then U > Smart UV Project; set Island Margin (the gap Blender leaves between islands) to 0.02 and press OK. You see many small islands packed in the UV square.\n   - With the mouse over the UV Editor: A, then Ctrl+A (Average Islands Scale), then S until the squares match TD_Reference. You see the same square size on the wall and the plane.\n   - Back in Object Mode, select the wall and its UCX boxes (not TD_Reference). File > Export > FBX, use the same settings and the same file name as in Week 2, and press Export (yes to overwrite). You see the file's date change to today in Windows Explorer.\n   - In Unreal, find SM_Wall_2m in the Content Browser (bottom of the screen; Ctrl+Space opens it). Right-click it > Reimport. If a window about material slots opens, accept it as it is. You see a short message at the bottom right saying it was reimported.\n   - Make the folder Course/Day11 (right-click Course > New Folder). Drag uv_grid_2048.png from Explorer into it in the Content Browser and rename it T_UVGrid (T_ means texture). Right-click it > Create Material and name the result M_UVCheck. You see a new material with a checker thumbnail.\n   - File > New Level > Basic, then File > Save Current Level As: L_UVCheck in Course/Day11. Drag SM_Wall_2m and SM_PierDeck_4m into the level and drop M_UVCheck onto each from the Content Browser. You see the same checker size on both.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "quaykit_day11.blend, railing_day11.blend and buildkit_day11.blend (with TD_Reference) and your four prop .blend files", "uk": "quaykit_day11.blend, railing_day11.blend і buildkit_day11.blend (з TD_Reference) та чотири .blend-файли твоїх пропсів"}, {"en": "uv_grid_2048.png", "uk": "uv_grid_2048.png"}, {"en": "uv_layouts.png (the UV Editor for SM_Wall_Window, SM_QuayEdge_4m and SM_PierDeck_4m)", "uk": "uv_layouts.png (UV Editor для SM_Wall_Window, SM_QuayEdge_4m і SM_PierDeck_4m)"}, {"en": "kit_checker_row.png (every kit piece and prop in L_UVCheck, from 10 m)", "uk": "kit_checker_row.png (кожна деталь набору й кожен пропс у L_UVCheck, з 10 м)"}, {"en": "before_after_day11.png (the row in grey and in checkers, same view)", "uk": "before_after_day11.png (ряд у сірому й у шахівниці, той самий ракурс)"}, {"en": "flythrough_day11.mp4 (60 seconds)", "uk": "flythrough_day11.mp4 (60 секунд)"}, {"en": "summary.md", "uk": "звіт дня (summary.md)"}], "goal": {"en": "By the end of today you have every harbour kit piece and your four street props unwrapped with clean seams at one texel density, with same-size checker squares on all of them in Unreal.", "uk": "Наприкінці сьогоднішнього дня кожна деталь портового набору й чотири вуличні пропси мають розгортку з акуратними швами й однією щільністю текселів, а в Unreal на всіх них клітинки шахівниці однакового розміру."}, "uses": [{"en": "Days 7 to 9: your harbour kit (SM_QuayEdge_4m, SM_PierDeck_4m, SM_Steps, SM_QuayCorner_Out, SM_Railing_2m, SM_RailingPost, SM_Wall_2m, SM_Wall_Window, SM_Wall_Door, SM_Wall_Corner, SM_Roof_2m, SM_Roof_Ridge_2m and SM_Roof_Gable_4m) in quaykit_day8.blend, railing_day8.blend and buildkit_day9.blend", "uk": "Дні 7–9: твій портовий набір (SM_QuayEdge_4m, SM_PierDeck_4m, SM_Steps, SM_QuayCorner_Out, SM_Railing_2m, SM_RailingPost, SM_Wall_2m, SM_Wall_Window, SM_Wall_Door, SM_Wall_Corner, SM_Roof_2m, SM_Roof_Ridge_2m і SM_Roof_Gable_4m) у quaykit_day8.blend, railing_day8.blend і buildkit_day9.blend"}, {"en": "Day 10: L_KitTest, where the kit is assembled (the house is the Level Instance LI_HarbourHouse)", "uk": "День 10: L_KitTest, де зібрано набір (будинок — це Level Instance LI_HarbourHouse)"}, {"en": "Days 1 to 5: your four street props (SM_Bollard, SM_Bench, SM_LampPost and SM_Bin) and the newest .blend file of each", "uk": "Дні 1–5: твої чотири вуличні пропси (SM_Bollard, SM_Bench, SM_LampPost і SM_Bin) і найновіший .blend-файл кожного"}], "quiz": [{"q": {"en": "What are UVs?", "uk": "Що таке UV?"}, "options": [{"en": "The flat pattern of a 3D surface that tells a texture where to sit", "uk": "Пласка викрійка 3D-поверхні, яка підказує текстурі, де лежати"}, {"en": "The number of triangles in a model", "uk": "Кількість трикутників у моделі"}, {"en": "The light and shadow on a model", "uk": "Світло й тінь на моделі"}, {"en": "A kind of collision box", "uk": "Різновид коробки колізії"}], "answer": 0, "explain": {"en": "UVs are the model's surface laid flat. The texture is painted on that flat pattern and wraps back onto the model.", "uk": "UV — це поверхня моделі, розкладена пласко. Текстуру малюють на цій пласкій викрійці, і вона знову обгортає модель."}}, {"q": {"en": "Your wall's checker squares are long stripes on its side faces. What is the likely cause?", "uk": "Клітинки шахівниці на бічних гранях твоєї стіни — довгі смуги. Яка найімовірніша причина?"}, "options": [{"en": "The texture is too small", "uk": "Текстура замала"}, {"en": "The UVs on those faces are stretched: they need a seam and a new unwrap", "uk": "UV на цих гранях розтягнуті: потрібен шов і нова розгортка"}, {"en": "The wall has too many triangles", "uk": "У стіни забагато трикутників"}, {"en": "The material's colour is wrong", "uk": "Неправильний колір матеріалу"}], "answer": 1, "explain": {"en": "Stripes mean the UVs on those faces are squashed in one direction. A better seam and a new unwrap fix it.", "uk": "Смуги означають, що UV на цих гранях стиснуті в одному напрямку. Кращий шов і нова розгортка це виправлять."}}, {"q": {"en": "At the kit standard of 1024 pixels per metre, how much of the model does one UV square of a 2048 texture cover?", "uk": "За стандарту набору 1024 пікселі на метр, яку частину моделі покриває один UV-квадрат текстури 2048?"}, "options": [{"en": "1 x 1 m", "uk": "1 x 1 м"}, {"en": "4 x 4 m", "uk": "4 x 4 м"}, {"en": "2 x 2 m", "uk": "2 x 2 м"}], "answer": 2, "explain": {"en": "2048 pixels divided by 1024 pixels per metre is 2 m. So one UV square covers 2 x 2 m.", "uk": "2048 пікселів поділити на 1024 пікселі на метр — це 2 м. Тож один UV-квадрат покриває 2 x 2 м."}}, {"q": {"en": "In Unreal, the stone on your wall looks twice as big as the stone on your quay edge, with the same material. What do you fix?", "uk": "В Unreal каміння на твоїй стіні виглядає вдвічі більшим, ніж на краю набережної, хоча матеріал той самий. Що ти виправляєш?"}, "options": [{"en": "The texel density: scale the wall's islands to match TD_Reference", "uk": "Щільність текселів: масштабуй острівці стіни під TD_Reference"}, {"en": "The light: turn the sun", "uk": "Світло: поверни сонце"}, {"en": "The import: set Fallback Collision Type to Box", "uk": "Імпорт: постав Fallback Collision Type на Box"}, {"en": "Nothing: walls always look bigger", "uk": "Нічого: стіни завжди виглядають більшими"}], "answer": 0, "explain": {"en": "The same material at different sizes means the two pieces have different texel densities. Scale the islands until the checkers match.", "uk": "Той самий матеріал різного розміру означає, що дві деталі мають різну щільність текселів. Масштабуй острівці, доки клітинки не збігатимуться."}}, {"q": {"en": "Where should seams go?", "uk": "Де мають бути шви?"}, "options": [{"en": "Across the middle of the front face", "uk": "Посередині передньої грані"}, {"en": "Anywhere, because Unreal hides them", "uk": "Будь-де, бо Unreal їх ховає"}, {"en": "Only on the top face", "uk": "Лише на верхній грані"}, {"en": "On hidden edges: the back, the bottom and inside corners", "uk": "На прихованих ребрах: ззаду, знизу й у внутрішніх кутах"}], "answer": 3, "explain": {"en": "A texture can show a small break along a seam. Put seams where a camera rarely looks.", "uk": "Уздовж шва текстура може показати невеликий розрив. Став шви там, куди камера рідко зазирає."}}], "weekInfo": {"week": 3, "title": {"en": "Surfaces", "uk": "Поверхні"}, "goal": {"en": "By Friday you have your whole harbour kit unwrapped at one texel density, textured with M_Master instances and a trim sheet, weathered with painted wear masks and a Wear slider, and shown beside real harbour photos.", "uk": "До п'ятниці в тебе є весь портовий набір: розгорнутий з однією щільністю текселів, затекстурований інстансами M_Master і трим-шитом, зістарений намальованими масками зношеності й повзунком Wear і показаний поруч зі справжніми фото гавані."}, "skills": [{"en": "UV unwrapping with clean seams and consistent texel density for modular kits", "uk": "UV-розгортка з акуратними швами й однаковою щільністю текселів для модульних наборів"}, {"en": "PBR material authoring: master materials and material instances in Unreal Engine 5", "uk": "Створення PBR-матеріалів: майстер-матеріали та інстанси матеріалів в Unreal Engine 5"}, {"en": "Trim sheet design and UV layout for modular environment kits", "uk": "Дизайн трим-шитів і UV-розкладка для модульних наборів оточення"}, {"en": "Texture painting and parameter-driven weathering (wear masks on a second UV channel)", "uk": "Малювання текстур і зношеність, керована параметрами (маски зношеності на другому UV-каналі)"}, {"en": "Look-development review against real photo reference", "uk": "Перевірка вигляду (look development) за справжніми фото-референсами"}]}, "morning": {"sofar": {"en": "In two weeks you have made four street props, a harbour kit, a building kit and L_KitTest, a whole quay assembled from your own pieces.", "uk": "Два тижні — і в тебе вже чотири вуличні пропси, портовий набір, будівельний набір і L_KitTest, цілий причал, зібраний із твоїх власних частин."}, "today": {"en": "You unwrap every kit piece and prop with clean seams at one texel density, so textures will sit evenly on all of them.", "uk": "Сьогодні ти робиш UV-розгортку кожної частини набору й кожного пропса з чистими швами та однаковою тексельною щільністю, щоб текстури лягли на все рівно."}, "cheer": {"en": "UVs reward patience more than talent, so unwrap one piece at a time and let the checker squares tell you when it is right.", "uk": "UV-розгортка винагороджує терпіння більше, ніж талант, тож розгортай по одній частині, а квадратики чекера підкажуть, коли все правильно."}, "quote": {"text": {"en": "Talent is a pursued interest. In other words, anything that you're willing to practice, you can do.", "uk": "Талант — це інтерес, який ти плекаєш. Інакше кажучи, усе, у чому ти хочеш вправлятися, тобі під силу."}, "author": {"en": "Bob Ross", "uk": "Боб Росс"}, "source": "https://en.wikiquote.org/wiki/Bob_Ross"}}, "hasAssets": false, "workPath": "Work\\Assignment\\Day-11-uvs-on-the-kit", "mapHref": "../../COURSE.html", "prevHref": "../Day-10-boss-kit-test/START-HERE.html", "nextHref": "../Day-12-pbr-materials-m-master/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Blender and Unreal Engine 5.8. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me and don't write code. Keep me moving and make it feel like a game.\n\nToday I build on my own: The rest of the kit and the four street props, on your own.\nIt's part of: UVs for the whole harbour kit and the four street props, at one texel density (Your three kit .blend files (saved with Day 11 names), your prop .blend files, and a new check level, L_UVCheck, in Course/Day11. The same pieces build your island's waterfront in Week 9.).\n\nSpec:\n- Kit standard: 1024 pixels per metre. With a 2048 x 2048 texture, one UV square covers 2 x 2 m of the model.\n- Every piece is unwrapped with seams on hidden edges (the back, the bottom, inside corners), and no checker square is stretched.\n- Every piece shows the same checker square size as a 2 x 2 m reference plane (TD_Reference).\n- Wood grain runs along planks and rails; stone rows run level.\n- UV islands may run past the edge of the UV square: tiling textures simply repeat. (For painting, on Day 14, you make a second map where everything stays inside.)\n- Each piece is exported again as FBX over its old file, with the same name and settings, and reimported in Unreal. Today every piece wears the checker material UVGrid; tomorrow it gets proper surface materials.\n- In L_UVCheck every piece wears M_UVCheck, and the squares are the same size everywhere.\n\nMy checklist:\n1. Open your three Week 2 kit files one at a time and save each with a Day 11 name (File > Save As): quaykit_day11.blend (you did this one in the lessons), railing_day11.blend and buildkit_day11.blend. TD_Reference and UVGrid are already in quaykit_day11.blend and buildkit_day11.blend; bring them into railing_day11.blend with File > Append, as in lesson 4. In every piece you unwrap today, remove the old material slots (minus button) and pick UVGrid (ball icon). Check: in Material Preview, each file shows TD_Reference with even, square checkers beside the piece you work on. (from lesson 3)\n2. SM_Wall_Window (in buildkit_day11.blend): give it the UVGrid material, mark seams on the back corners and around the inside of the window opening, then press U > Unwrap. Check: with Display Stretch on, the faces stay blue, with no green or red. (from lesson 2)\n3. SM_Wall_Door: unwrap it the same way. Put the seam inside the door opening, where a camera rarely looks. Check: no stretched squares on the front face or inside the door opening. (from lesson 2)\n4. SM_Steps: seams along the back and the hidden side edges, then U > Unwrap. Check: each step's top shows square checkers in neat rows. (from lesson 2)\n5. SM_Railing_2m and SM_RailingPost (in railing_day11.blend): select all, U > Smart UV Project (Island Margin 0.02). In the UV Editor, rotate the long rail islands (R 90) so they lie flat left to right. Check: the rails and the post show square checkers in long, straight rows. (from lesson 4)\n6. SM_QuayCorner_Out (in quaykit_day11.blend) and SM_Wall_Corner, SM_Roof_2m, SM_Roof_Ridge_2m and SM_Roof_Gable_4m (in buildkit_day11.blend): seams where nobody looks, or Smart UV Project for simple blocks. Check: no stretched squares on any face a drone camera will see. (from lesson 4)\n7. Density pass on the whole kit: for each piece, select all its islands, UV > Average Islands Scale, then press S and scale until its squares match TD_Reference. Check: each piece, shown on its own with the others hidden, has the same square size as TD_Reference beside it. (You compare the whole row side by side in Unreal at the end.) (from lesson 3)\n8. Grain pass: for each wooden or stone piece, look at the checker rows in the 3D view. Rotate islands with R 90 in the UV Editor where planks or stone rows would run the wrong way. Check: you can say, for each piece, which way its planks or stone rows run. (from lesson 3)\n9. The four street props: open the newest .blend of each (the file you exported its FBX from on Day 4 or 5). Remove the old material slots and pick UVGrid, as for the kit. Smart UV Project, then scale to the square size of TD_Reference (append TD_Reference with File > Append, or make a new 2 m plane). Save each file. Check: bollard, bench, lamp post and bin all show the same square size. (from lesson 4)\n10. Export every kit piece and prop again as FBX over its old file, with the same names and settings as before (each piece with its UCX boxes, from the world origin; TD_Reference not selected). Check: in Windows Explorer, the FBX files show today's date. (from lesson 4)\n11. In Unreal, right-click each mesh in the Content Browser > Reimport. If a window about material slots opens, accept it as it is: you set proper materials tomorrow. Then drag every kit piece and prop into L_UVCheck in a row and take a screenshot from 10 m (your before picture). Now drop M_UVCheck on each. Check: from 10 m the squares are the same size on every piece, and no piece shows stretched stripes. (from lesson 4)\n12. Before/after capture: put your before picture beside a screenshot from the same view with M_UVCheck on every piece. Then record a 60-second clip (Win+Alt+R) flying slowly along the row. Save today's clip as flythrough_day11.mp4 and check that you also have uv_layouts.png, kit_checker_row.png and before_after_day11.png (each is described in today's hand-in list; take any you are missing now). Check: the clip is about 60 seconds long and shows every piece. (from lesson 4)\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Ksenia\nDay 11: UVs on your kit: seams, unwrapping and texel density. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);

const lk=s=>esc(s).replace(/https?:\/\/[^\s<']*[^\s<.,;:)']/g,m=>'<a href="'+m+'" target="_blank" rel="noopener">'+m+'</a>');
function list(a,tag,cls){return '<'+tag+(cls?' class="'+cls+'"':'')+'>'+(a||[]).map(i=>'<li>'+lk(x(i))+'</li>').join('')+'</'+tag+'>'}
const lab=(t,k)=>'<div class="lab'+(k?' k-'+k:'')+'"><span class="dotc"></span>'+t+'</div>';
const kn=n=>'<span class="kn">'+ic(n)+'</span>';
const slider=p=>'<div class="slider"><i style="width:calc('+p+'% - 6px)"></i><b style="left:clamp(13px,'+p+'%,calc(100% - 13px))"></b></div>';
function quiz(){if(!D.quiz||!D.quiz.length)return '';const a=st.qa||{};let ok=0;const L=u('letters');
 const pips='<div class="pips well" aria-hidden="true">'+D.quiz.map((q,i)=>'<i class="'+(a[i]==null?'':a[i]===q.answer?'r':'w')+'"></i>').join('')+'</div>';
 const qs=D.quiz.map((q,i)=>{const c=a[i];if(c===q.answer)ok++;return '<div class="qz"><p class="qq"><span class="qn">'+(i+1)+'</span><span>'+lk(x(q.q))+'</span></p>'+q.options.map((o,k)=>{let cls='opt',mk='<span></span>';if(c!=null){if(k===q.answer){cls+=' right';mk=ic('check','mk')}else if(k===c){cls+=' wrong';mk=ic('x','mk')}}return '<button class="'+cls+'" id="o'+i+'_'+k+'"'+(c!=null?' disabled':'')+' onclick="pick('+i+','+k+')"><span class="lt">'+(L[k]||k+1)+'</span><span>'+esc(x(o))+'</span>'+mk+'</button>'}).join('')+(c!=null?'<p class="exp '+(c===q.answer?'r':'w')+'" id="e'+i+'" tabindex="-1"><b>'+(c===q.answer?u('right'):u('wrong'))+'</b>'+lk(x(q.explain))+'</p>':'')+'</div>'}).join('');
 return '<section class="card glass quiz">'+lab(u('quiz'),'gold')+'<p class="muted" style="margin:-6px 0 14px">'+u('quizSub')+'</p>'+pips+qs+(qDone()?'<div class="score well" role="status"><span class="eyebrow">'+u('score')+'</span><span class="lcd" aria-label="'+ok+' / '+D.quiz.length+'">'+seg(ok+'/'+D.quiz.length)+'</span><div class="row"><button class="btn ghost" id="retry" onclick="retry()">'+u('retry')+'</button></div></div>':'')+'</section>'}
function vid(v){if(!v)return '';const link=v.url?'<a href="'+esc(v.url)+'" target="_blank" rel="noopener">'+esc(x(v.title)||v.url)+'</a>'+(v.channel?' <span class="muted">· '+esc(v.channel)+(v.length?' · '+esc(v.length):'')+'</span>':''):'';const s=v.search?'<a href="https://www.youtube.com/results?search_query='+encodeURIComponent(v.search)+'" target="_blank" rel="noopener">'+u('noVid')+': '+esc(v.search)+'</a>':'';const alt=v.alt&&v.alt.url?'<br><span class="eyebrow">UA</span> <a href="'+esc(v.alt.url)+'" target="_blank" rel="noopener">'+esc(v.alt.title||v.alt.url)+'</a>'+(v.alt.channel?' <span class="muted">· '+esc(v.alt.channel)+'</span>':''):'';return '<div class="vid well">'+kn('play')+'<div><b>'+u('more')+'?</b><br>'+(link||s)+alt+(link&&s?'<br><span class="muted" style="font-size:14px">'+s+'</span>':'')+'</div></div>'}
function morning(){const m=D.morning;if(!m)return '';const q=m.quote||{};
 let shelf='';if(D.day>0){shelf='<div class="shelf" aria-hidden="true">';let g='';for(let d=0;d<D.day;d++){let p=0;try{p=(JSON.parse(localStorage.getItem('devteam:'+D.learner+':'+d))||{}).pct||0}catch(e){}g+='<i class="'+(p>=1?'d':'')+(d>0&&d%5===0?' bs':'')+'"></i>';if(d%5===0||d===D.day-1){shelf+='<span class="wkg">'+g+'</span>';g=''}}shelf+='</div>'}
 const qt=lang==='uk'&&q.original?q.original:x(q.text);
 return '<section class="card glass morning"><div class="mgrid">'+(m.sofar?'<div>'+lab(u('sofar'),'gold')+shelf+'<p class="mtxt">'+lk(x(m.sofar))+'</p></div>':'')+(m.today?'<div>'+lab(u('todayL'))+'<p class="mtxt">'+lk(x(m.today))+'</p></div>':'')+'</div>'+(m.cheer?'<p class="cheer">'+esc(x(m.cheer))+'</p>':'')+(qt?'<figure class="quote well">'+kn('quote')+'<blockquote>'+esc(qt)+'</blockquote>'+(q.author?'<figcaption>'+esc(x(q.author))+'</figcaption>':'')+'</figure>':'')+'</section>'}
function setLang(l){lang=l;try{localStorage.setItem('devteam:lang',lang)}catch(e){};render()}
function toggleLang(){setLang(lang==='uk'?'en':'uk')}
/* keep open sections and keyboard focus across re-renders */
const openD=new Set();
function tg(e){if(e.open)openD.add(e.id);else openD.delete(e.id)}
const op=id=>openD.has(id)?' open':'';
function render(){const ae=document.activeElement,fid=ae&&(ae.id||(ae.getAttribute('data-th')?'th-'+ae.getAttribute('data-th'):ae.getAttribute('lang')&&ae.closest('.seg')?'lg-'+ae.getAttribute('lang'):''));
 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);
 const b=D.build,P=Math.round(prog()*100);
 document.getElementById('top').innerHTML='<div class="topin glass"><a class="maplink" href="'+esc(D.mapHref)+'">'+kn('map')+u('map')+'</a><div class="crumb"><b>'+esc(x(D.learnerName))+'</b><span>'+u('week')+' '+D.week+'</span><span>'+u('day')+' '+D.day+' '+u('of')+' '+D.total+'</span></div>'+controls(lang,'setLang')+'</div><div class="tline"><i style="width:'+P+'%"></i></div>';
 const state=w=>w<D.week?'b':w===D.week?'n':'p';
 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 if(D.weekInfo){const w=D.weekInfo;h+='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}
 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p><div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+list(D.handin,'ul','ticks')+'<p class="path">'+ic('folder')+'<span>'+u('shipTo')+' <code>'+esc(D.workPath)+'</code></span></p>'+(D.lessons.length?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<p class="muted">'+u('report')+'</p><div class="row"><button class="btn s" onclick="cp(D.reportPrompt)">'+ic('copy')+u('copyR')+'</button></div></section>';
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();
</script>

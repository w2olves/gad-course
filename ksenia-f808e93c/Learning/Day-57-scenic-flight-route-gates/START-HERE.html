<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 57</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

spec": [{"en": "flight_plan.md: 7 to 9 beats, each with what the viewer sees, the height and the seconds, adding up to about 2 minutes (for example: the reveal from the sea, the coast, district 1, the road, district 2, the landmark, the summit, the finale vista), plus your music choice (a licensed track, or 'no music').", "uk": "flight_plan.md: 7–9 бітів, у кожного — що бачить глядач, висота й секунди, разом приблизно 2 хвилини (наприклад: розкриття з моря, узбережжя, район 1, дорога, район 2, орієнтир, вершина, фінальний краєвид), плюс твій вибір музики (ліцензований трек або «без музики»)."}, {"en": "RT_Scenic tuned to the beats: at least one reveal (the island or a district appears from behind a ridge, a headland or trees), one scale contrast (low past something small, such as a boat or a bench, just before a wide view), a rhythm of wide and close views, 5 to 20 m in the districts and 30 to 80 m over the coast and the summit, and a finale on your widest vista with the haze showing the distance.", "uk": "RT_Scenic підлаштовано під біти: щонайменше одне розкриття (острів чи район з'являється з-за гребеня, мису чи дерев), один контраст масштабу (низько повз щось маленьке, як-от човен чи лавка, просто перед широким планом), ритм широких і близьких планів, 5–20 м у районах і 30–80 м над узбережжям і вершиною, і фінал на твоєму найширшому краєвиді, де серпанок показує відстань."}, {"en": "SM_Gate_4x4 modelled in Blender: a 5 x 5 m frame with a 4 x 4 m opening, posts and bars 0.5 m thick, origin at the bottom centre, four UCX boxes (UCX_SM_Gate_4x4_00 to _03). Placed along the route 30 to 80 m apart on open stretches and 15 to 40 m apart in the districts, each visible from the one before; the route, the gates and the gauge cube on the Data Layer asset DL_Routes.", "uk": "SM_Gate_4x4, змодельовані в Blender: рамка 5 x 5 м з отвором 4 x 4 м, стійки й перекладини завтовшки 0,5 м, origin внизу по центру, чотири бокси UCX (від UCX_SM_Gate_4x4_00 до _03). Розставлені вздовж маршруту через 30–80 м на відкритих ділянках і через 15–40 м у районах, кожні видно з попередніх; маршрут, ворота й куб-шаблон на асеті Data Layer DL_Routes."}, {"en": "One locked Cine Camera per beat, CAM_Beat_1 to CAM_Beat_N, framing that beat's key moment: a subject on a third, a foreground element, a level horizon.", "uk": "Одна зафіксована Cine Camera на кожен біт, від CAM_Beat_1 до CAM_Beat_N, що кадрує ключовий момент цього біту: головний об'єкт на лінії третин, елемент переднього плану, рівний горизонт."}, {"en": "LaneGauge passed at every gate and narrow spot; any prop moved for a cleaner frame moved 2 m at most and logged.", "uk": "LaneGauge проходить кожні ворота й кожне вузьке місце; кожен пропс, пересунутий заради чистішого кадру, пересунуто щонайбільше на 2 м і записано."}, {"en": "A practice run of the whole route recorded, with the places you hesitated marked and fixed.", "uk": "Записано тренувальний проліт усього маршруту, а місця, де ти вагаєшся, позначено й виправлено."}], "piece1": "the beat sheet, the reveal and the first gates", "piece2": {"en": "All the gates, the beat cameras and a practice run, on your own", "uk": "Усі ворота, камери бітів і тренувальний проліт — самостійно"}, "steps": [{"text": {"en": "Choose your music now, or decide on none: one track whose licence allows use in a video (for example CC BY or CC0 music on Wikimedia Commons), saved in today's Work folder, with its title, author, licence and link in credits.md. Check: credits.md has the music line, or flight_plan.md says 'no music'.", "uk": "Обери музику зараз або виріши обійтися без неї: один трек, ліцензія якого дозволяє використання у відео (наприклад, музика з ліцензією CC BY чи CC0 на Wikimedia Commons), збережений у сьогоднішній папці Work, з назвою, автором, ліцензією й посиланням у credits.md. Перевірка: у credits.md є рядок про музику, або у flight_plan.md написано «без музики»."}, "lesson": 1}, {"text": {"en": "Write flight_plan.md: 7 to 9 beats, each with what the viewer sees, the height and the seconds. Check: the seconds add up to between 110 and 130.", "uk": "Напиши flight_plan.md: 7–9 бітів, у кожного — що бачить глядач, висота й секунди. Перевірка: секунди разом дають від 110 до 130."}, "lesson": 1}, {"text": {"en": "Tune RT_Scenic to the beats: move points for one reveal, and set the heights for wide and close parts. Check: flying it, a ridge, headland or trees hide the view until the last moment.", "uk": "Підлаштуй RT_Scenic під біти: пересунь точки для одного розкриття й задай висоти для широких і близьких частин. Перевірка: під час прольоту гребінь, мис чи дерева ховають вид до останньої миті."}, "lesson": 1}, {"text": {"en": "Model SM_Gate_4x4 in Blender (30 minutes at most) with four UCX boxes (UCX_SM_Gate_4x4_00 to _03), export it, and import it into Content/Island/Routes. Check: beside the mannequin, the opening is a little more than twice the mannequin's height.", "uk": "Змоделюй SM_Gate_4x4 у Blender (щонайбільше 30 хвилин) з чотирма боксами UCX (від UCX_SM_Gate_4x4_00 до _03), експортуй та імпортуй у Content/Island/Routes. Перевірка: поруч із манекеном отвір трохи більший за подвійний зріст манекена."}, "lesson": 2}, {"text": {"en": "Place gates along the open stretches, 30 to 80 m apart, each facing along the route. Check: from each gate you can see the next one.", "uk": "Розстав ворота на відкритих ділянках через 30–80 м, кожні повернуті вздовж маршруту. Перевірка: з кожних воріт видно наступні."}, "lesson": 2}, {"text": {"en": "Place gates through both districts, 15 to 40 m apart. Check: no gate blocks a district's best view from a beat camera.", "uk": "Розстав ворота через обидва райони, через 15–40 м. Перевірка: жодні ворота не закривають найкращий вид району з камери біту."}, "lesson": 2}, {"text": {"en": "Make the Data Layer asset DL_Routes (as on Day 51) and put RT_Scenic, every gate and LaneGauge on it (select them, then right-click DL_Routes > Add Selected Actors to Selected Data Layers). Check: hiding DL_Routes hides all of them.", "uk": "Створи асет Data Layer DL_Routes (як у День 51) і поклади на нього RT_Scenic, усі ворота й LaneGauge (виділи їх, потім клацни правою кнопкою DL_Routes > Add Selected Actors to Selected Data Layers). Перевірка: приховування DL_Routes ховає їх усі."}, "lesson": "D51.1"}, {"text": {"en": "Place CAM_Beat_1 to CAM_Beat_N, one per beat, and frame each key moment. Check: each frame has a subject on a third, a foreground element and a level horizon.", "uk": "Розстав від CAM_Beat_1 до CAM_Beat_N, по одній на біт, і закадруй кожен ключовий момент. Перевірка: у кожному кадрі є головний об'єкт на лінії третин, елемент переднього плану й рівний горизонт."}, "lesson": 3}, {"text": {"en": "Clean each frame with small moves (props only, 2 m at most) and log them in change_list_d2.md (or change_list_d1.md for district 1). Check: every move is logged, and no building moved.", "uk": "Почисть кожен кадр невеликими переміщеннями (лише пропси, щонайбільше на 2 м) і запиши їх у change_list_d2.md (або change_list_d1.md для району 1). Перевірка: кожне переміщення записано, і жодна будівля не зрушила."}, "lesson": 3}, {"text": {"en": "Slide LaneGauge through every gate and narrow spot on the route. Check: it touches nothing anywhere.", "uk": "Проведи LaneGauge крізь кожні ворота й кожне вузьке місце на маршруті. Перевірка: він ніде нічого не торкається."}, "lesson": 4}, {"text": {"en": "Fly the whole route twice for practice and mark where you hesitated on a copy of island_map.png. Check: at least one mark, with a fix written beside it.", "uk": "Двічі пролети весь маршрут для тренування й познач на копії island_map.png, де ти вагаєшся. Перевірка: щонайменше одна позначка з записаним поруч виправленням."}, "lesson": 4}, {"text": {"en": "Fix the hesitations (a landmark, a moved gate, a gentler turn) and record one full practice run with Win+Alt+R. Check: the run passes through every gate.", "uk": "Виправ місця вагань (орієнтир, пересунуті ворота, плавніший поворот) і запиши один повний тренувальний проліт за допомогою Win+Alt+R. Перевірка: проліт проходить крізь усі ворота."}, "lesson": 4}, {"text": {"en": "Put your first screenshot through CAM_Beat_1 (from lesson 3, before you cleaned the frame) beside its final view as before_after_day57.png; the first 60 seconds of the practice run is today's clip. Save today's clip as flythrough_day57.mp4 and check that you also have SM_Gate_4x4.blend, beat_cameras.png and route_marks.png (each is described in today's hand-in list; take any you are missing now). Check: the pair shows your composition change.", "uk": "Постав свій перший скриншот крізь CAM_Beat_1 (з уроку 3, до того як ти почистиш кадр) поруч із його фінальним виглядом як before_after_day57.png; перші 60 секунд тренувального прольоту — це сьогоднішній кліп. Збережи сьогоднішній кліп як flythrough_day57.mp4 і перевір, що в тебе є також SM_Gate_4x4.blend, beat_cameras.png і route_marks.png (кожен описано в сьогоднішньому списку «Що здати»; зроби зараз ті, яких бракує). Перевірка: пара показує зміну твоєї композиції."}, "lesson": 3}]}, "lessons": [{"title": {"en": "A flight that tells the island's story", "uk": "Проліт, що розповідає історію острова"}, "minutes": 40, "goals": [{"en": "Plan a flight like a film: beats (short moments that each show one thing), a strong opening, a rhythm of wide and close views, and a finale on your widest vista.", "uk": "Планувати проліт як фільм: біти (короткі моменти, кожен з яких показує одну річ), сильний початок, ритм широких і близьких планів і фінал на найширшому краєвиді."}, {"en": "Use a reveal (hide the view behind a ridge, a headland or trees, then fly past it so the island appears) and scale contrast (fly low past something small, such as a boat or a bench, just before a wide view, so the island feels huge).", "uk": "Використовувати розкриття (сховати вид за гребенем, мисом чи деревами, потім пролетіти повз, щоб острів з'явився) і контраст масштабу (пролетіти низько повз щось маленьке, як-от човен чи лавка, просто перед широким планом, щоб острів здавався величезним)."}, {"en": "Use landmarks so the viewer always knows where they are: the lighthouse, the church tower, the big lone tree.", "uk": "Використовувати орієнтири, щоб глядач завжди знав, де він: маяк, церковна вежа, велике самотнє дерево."}, {"en": "Choose music for tomorrow's cut, or none: only a track whose licence allows use in a video, credited in credits.md.", "uk": "Обрати музику для завтрашнього монтажу або обійтися без неї: лише трек, ліцензія якого дозволяє використання у відео, з кредитом у credits.md."}], "doalong": [{"en": "Write beat 1 in flight_plan.md: what the viewer sees, the height and the seconds, for example 'Reveal: low over the sea past a moored boat, then the island rises behind the headland, 30 m, 12 s'. You should see one full beat.", "uk": "Запиши біт 1 у flight_plan.md: що бачить глядач, висота й секунди, наприклад: 'Розкриття: низько над морем повз пришвартований човен, потім острів здіймається з-за мису, 30 м, 12 с'. Ти бачиш один повний біт."}, {"en": "Write the other beats, with one scale contrast before a wide view, ending on your best vista. You should see 7 to 9 beats.", "uk": "Запиши інші біти, з одним контрастом масштабу перед широким планом, і закінчи найкращим краєвидом. Ти бачиш 7–9 бітів."}, {"en": "Add up the seconds. You should see a total between 110 and 130.", "uk": "Додай секунди. Ти бачиш загальну суму від 110 до 130."}, {"en": "On RT_Scenic, choose a place for the reveal and move a point so a ridge or headland hides the view until the last moment. You should see the island appear as you fly past.", "uk": "На RT_Scenic обери місце для розкриття й пересунь точку так, щоб гребінь чи мис ховав вид до останньої миті. Ти бачиш, як острів з'являється, коли пролітаєш повз."}, {"en": "Optional music: open commons.wikimedia.org, search for 'cinematic music' and choose the Audio tab. Open a track and read its Licensing section; use it only if it says CC BY or CC0 (public domain). Download it into today's Work folder and write its title, author, licence and link in credits.md. You should see one music line in credits.md, or write 'no music' in flight_plan.md. If your screen looks different, send the tutor a screenshot.", "uk": "Музика за бажанням: відкрий commons.wikimedia.org, знайди 'cinematic music' й обери вкладку Audio. Відкрий трек і прочитай розділ Licensing; використовуй його, лише якщо там написано CC BY або CC0 (суспільне надбання). Завантаж його в сьогоднішню папку Work і запиши назву, автора, ліцензію й посилання в credits.md. Ти бачиш один рядок про музику в credits.md — або напиши «без музики» у flight_plan.md. Якщо твій екран виглядає інакше, надішли тьюторові скриншот."}], "play": {"en": "Story test: I tell the tutor my beats in order; it says where it got bored and where it lost its way; each answer becomes a change.", "uk": "Тест історії: я по черзі розповідаю тьюторові свої біти; він каже, де йому стало нудно і де він загубився; кожна відповідь стає зміною."}, "video": {"url": "https://www.youtube.com/watch?v=5NFlDfyYNck", "title": "8 TIPS That ACTUALLY Improve Your Drone Photography!", "channel": "Sightseeing Stan", "length": "12:30", "search": "drone photography composition tips"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: A flight that tells the island's story (Day 57, lesson 1 of 4).\nToday's build: The scenic flight laid out: a beat sheet of about 2 minutes, RT_Scenic tuned to it, SM_Gate_4x4 gates along it, a locked camera framing each beat, and a practice run recorded.\n\nBy the end of this lesson I can:\n1. Plan a flight like a film: beats (short moments that each show one thing), a strong opening, a rhythm of wide and close views, and a finale on your widest vista.\n2. Use a reveal (hide the view behind a ridge, a headland or trees, then fly past it so the island appears) and scale contrast (fly low past something small, such as a boat or a bench, just before a wide view, so the island feels huge).\n3. Use landmarks so the viewer always knows where they are: the lighthouse, the church tower, the big lone tree.\n4. Choose music for tomorrow's cut, or none: only a track whose licence allows use in a video, credited in credits.md.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (Your finished island has a budget proof: the whole scenic route runs within your frame-time targets at 1920 x 1080.), what I will learn today (You plan the scenic flight beat by beat, place gates along the route, and lock a camera that frames the island at each beat.), encourage me (This is where your island becomes a story, so plan the flight you would most like to watch.), and share today's quote: \"If it can be written, or thought, it can be filmed.\" (Stanley Kubrick).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 54: why must r2 use the same cameras and light as r1? | Day 52: what does auto exposure do when you fly from a dark wood out over the bright sea?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Story test: I tell the tutor my beats in order; it says where it got bored and where it lost its way; each answer becomes a change.\n6. Do-along on today's build (the beat sheet, the reveal and the first gates): guide me through these steps one at a time, checking a screenshot after each:\n   - Write beat 1 in flight_plan.md: what the viewer sees, the height and the seconds, for example 'Reveal: low over the sea past a moored boat, then the island rises behind the headland, 30 m, 12 s'. You should see one full beat.\n   - Write the other beats, with one scale contrast before a wide view, ending on your best vista. You should see 7 to 9 beats.\n   - Add up the seconds. You should see a total between 110 and 130.\n   - On RT_Scenic, choose a place for the reveal and move a point so a ridge or headland hides the view until the last moment. You should see the island appear as you fly past.\n   - Optional music: open commons.wikimedia.org, search for 'cinematic music' and choose the Audio tab. Open a track and read its Licensing section; use it only if it says CC BY or CC0 (public domain). Download it into today's Work folder and write its title, author, licence and link in credits.md. You should see one music line in credits.md, or write 'no music' in flight_plan.md. If your screen looks different, send the tutor a screenshot.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"8 TIPS That ACTUALLY Improve Your Drone Photography!\" by Sightseeing Stan: https://www.youtube.com/watch?v=5NFlDfyYNck\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Gates along the route", "uk": "Ворота вздовж маршруту"}, "minutes": 40, "goals": [{"en": "Explain gates: frames the pilot flies through, which keep the flight on line and show the route in the game.", "uk": "Пояснити, що таке ворота: рамки, крізь які пролітає пілот; вони тримають політ на лінії й показують маршрут у грі."}, {"en": "Model SM_Gate_4x4 to spec, with four UCX boxes, because a collision box must be convex (no holes or dents): one box would fill the opening.", "uk": "Змоделювати SM_Gate_4x4 за вимогами, з чотирма боксами UCX, бо бокс колізії має бути опуклим (без отворів і вм'ятин): один бокс заповнив би отвір."}, {"en": "Space gates like a good track: 30 to 80 m apart on open stretches, 15 to 40 m in the districts, each visible from the one before, no blind turns.", "uk": "Розставляти ворота, як на добрій трасі: через 30–80 м на відкритих ділянках, через 15–40 м у районах, кожні видно з попередніх, без сліпих поворотів."}], "doalong": [{"en": "In Blender, make four boxes: two posts 0.5 x 0.5 x 5 m, and a top bar and a bottom bar 4 x 0.5 x 0.5 m between them; join them with Ctrl+J. You should see a 5 x 5 m frame with a 4 x 4 m opening.", "uk": "У Blender зроби чотири бокси: дві стійки 0,5 x 0,5 x 5 м і верхню й нижню перекладини 4 x 0,5 x 0,5 м між ними; об'єднай їх через Ctrl+J. Ти бачиш рамку 5 x 5 м з отвором 4 x 4 м."}, {"en": "Set the origin to the bottom centre (as on Day 4), add one UCX box over each post and each bar (named UCX_SM_Gate_4x4_00 to UCX_SM_Gate_4x4_03), and export SM_Gate_4x4.fbx. You should see the file in your export folder.", "uk": "Постав origin внизу по центру (як у День 4), додай по одному боксу UCX на кожну стійку й кожну перекладину (з назвами від UCX_SM_Gate_4x4_00 до UCX_SM_Gate_4x4_03) й експортуй SM_Gate_4x4.fbx. Ти бачиш файл у своїй папці експорту."}, {"en": "Import it into Content/Island/Routes and drag one into the level beside the mannequin. You should see an opening a little more than twice the mannequin's height.", "uk": "Імпортуй його в Content/Island/Routes і перетягни один екземпляр у рівень поруч із манекеном. Ти бачиш отвір, трохи більший за подвійний зріст манекена."}, {"en": "Place the first gate on RT_Scenic and turn it to face along the spline. You should see the route pass through the middle of the opening.", "uk": "Постав перші ворота на RT_Scenic і поверни їх уздовж сплайна. Ти бачиш, що маршрут проходить крізь середину отвору."}], "play": {"en": "Gate check: I describe the route gate by gate; the tutor 'flies' it and complains about every gate it can't see from the one before; each complaint becomes a fix.", "uk": "Перевірка воріт: я описую маршрут ворота за воротами; тьютор «пролітає» його й скаржиться на кожні ворота, яких не видно з попередніх; кожна скарга стає виправленням."}, "video": {"url": "https://www.youtube.com/watch?v=k1E6G_nuzAE", "title": "Happy flying #11 - How to design a GOOD FPV track", "channel": "UAVfutures", "length": "3:43", "search": "how to design a good fpv track"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Gates along the route (Day 57, lesson 2 of 4).\nToday's build: The scenic flight laid out: a beat sheet of about 2 minutes, RT_Scenic tuned to it, SM_Gate_4x4 gates along it, a locked camera framing each beat, and a practice run recorded.\nEarlier today I already did: lesson 1 (A flight that tells the island's story). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Explain gates: frames the pilot flies through, which keep the flight on line and show the route in the game.\n2. Model SM_Gate_4x4 to spec, with four UCX boxes, because a collision box must be convex (no holes or dents): one box would fill the opening.\n3. Space gates like a good track: 30 to 80 m apart on open stretches, 15 to 40 m in the districts, each visible from the one before, no blind turns.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Gate check: I describe the route gate by gate; the tutor 'flies' it and complains about every gate it can't see from the one before; each complaint becomes a fix.\n4. Do-along on today's build (the beat sheet, the reveal and the first gates): guide me through these steps one at a time, checking a screenshot after each:\n   - In Blender, make four boxes: two posts 0.5 x 0.5 x 5 m, and a top bar and a bottom bar 4 x 0.5 x 0.5 m between them; join them with Ctrl+J. You should see a 5 x 5 m frame with a 4 x 4 m opening.\n   - Set the origin to the bottom centre (as on Day 4), add one UCX box over each post and each bar (named UCX_SM_Gate_4x4_00 to UCX_SM_Gate_4x4_03), and export SM_Gate_4x4.fbx. You should see the file in your export folder.\n   - Import it into Content/Island/Routes and drag one into the level beside the mannequin. You should see an opening a little more than twice the mannequin's height.\n   - Place the first gate on RT_Scenic and turn it to face along the spline. You should see the route pass through the middle of the opening.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Happy flying #11 - How to design a GOOD FPV track\" by UAVfutures: https://www.youtube.com/watch?v=k1E6G_nuzAE\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Composition at drone height along a route", "uk": "Композиція на висоті дрона вздовж маршруту"}, "minutes": 40, "goals": [{"en": "Find each beat's key frame: the moment the subject is best placed in the view.", "uk": "Знаходити ключовий кадр кожного біту: мить, коли головний об'єкт найкраще стоїть у кадрі."}, {"en": "Use leading lines (the coast, a road, a wall, a river) that run towards the subject, and a foreground element that slides past for depth.", "uk": "Використовувати провідні лінії (берег, дорога, мур, річка), що ведуть до головного об'єкта, і елемент переднього плану, який пропливає повз для глибини."}, {"en": "Explain focal length: a lower number in mm gives a wider view (18 to 24 mm for landscapes), a higher number a closer one; use the same idea for every beat camera.", "uk": "Пояснити, що таке фокусна відстань: менше число в мм дає ширший вид (18–24 мм для краєвидів), більше — ближчий; використовувати той самий підхід для кожної камери біту."}], "doalong": [{"en": "Click the Add button > Cinematic > Cine Camera Actor, place it at beat 1's key moment, name it CAM_Beat_1, set Current Focal Length to 24 in Details, and lock it. You should see the beat's view through the camera.", "uk": "Натисни кнопку Add > Cinematic > Cine Camera Actor, постав її в ключовий момент біту 1, назви CAM_Beat_1, постав Current Focal Length на 24 у Details і заблокуй. Ти бачиш вид біту крізь камеру."}, {"en": "Take a screenshot through it and draw thirds lines over it in Krita. You should see where the subject sits.", "uk": "Зроби крізь неї скриншот і намалюй поверх нього лінії третин у Krita. Ти бачиш, де стоїть головний об'єкт."}, {"en": "Unlock it, pilot it so a leading line runs towards the subject, and lock it again. You should see the line lead your eye in.", "uk": "Розблокуй її, керуй нею через Pilot так, щоб провідна лінія вела до головного об'єкта, і знову заблокуй. Ти бачиш, як лінія веде погляд усередину кадру."}, {"en": "Move one prop up to 2 m to give a foreground element, and log the move. You should see more depth in the frame.", "uk": "Пересунь один пропс щонайбільше на 2 м, щоб отримати елемент переднього плану, і запиши переміщення. Ти бачиш більше глибини в кадрі."}], "play": {"en": "Critique duel: the tutor scores my CAM_Beat_1 out of 10 and names its weakest part; I get two tries to raise the score.", "uk": "Дуель критики: тьютор оцінює мою CAM_Beat_1 з 10 і називає її найслабше місце; у мене дві спроби підняти оцінку."}, "video": {"url": "https://www.youtube.com/watch?v=KyecOinBgMo", "title": "How I Find Camera Compositions in Unreal Engine 5", "channel": "Ted Mebratu", "length": "16:51", "search": "unreal engine 5 camera composition"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Composition at drone height along a route (Day 57, lesson 3 of 4).\nToday's build: The scenic flight laid out: a beat sheet of about 2 minutes, RT_Scenic tuned to it, SM_Gate_4x4 gates along it, a locked camera framing each beat, and a practice run recorded.\nEarlier today I already did: lesson 1 (A flight that tells the island's story); lesson 2 (Gates along the route). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Find each beat's key frame: the moment the subject is best placed in the view.\n2. Use leading lines (the coast, a road, a wall, a river) that run towards the subject, and a foreground element that slides past for depth.\n3. Explain focal length: a lower number in mm gives a wider view (18 to 24 mm for landscapes), a higher number a closer one; use the same idea for every beat camera.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Critique duel: the tutor scores my CAM_Beat_1 out of 10 and names its weakest part; I get two tries to raise the score.\n4. Do-along on today's build (the beat sheet, the reveal and the first gates): guide me through these steps one at a time, checking a screenshot after each:\n   - Click the Add button > Cinematic > Cine Camera Actor, place it at beat 1's key moment, name it CAM_Beat_1, set Current Focal Length to 24 in Details, and lock it. You should see the beat's view through the camera.\n   - Take a screenshot through it and draw thirds lines over it in Krita. You should see where the subject sits.\n   - Unlock it, pilot it so a leading line runs towards the subject, and lock it again. You should see the line lead your eye in.\n   - Move one prop up to 2 m to give a foreground element, and log the move. You should see more depth in the frame.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"How I Find Camera Compositions in Unreal Engine 5\" by Ted Mebratu: https://www.youtube.com/watch?v=KyecOinBgMo\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Flying it as a pilot (micro-lesson)", "uk": "Пролітаємо як пілот (мікроурок)"}, "minutes": 40, "goals": [{"en": "Know what a pilot needs: the next gate in view, landmarks at the turns, no blind 180-degree turns, enough space round the drone.", "uk": "Знати, що потрібно пілотові: наступні ворота в полі зору, орієнтири на поворотах, жодних сліпих розворотів на 180 градусів, досить простору навколо дрона."}, {"en": "Check clearance with LaneGauge at every gate and narrow spot.", "uk": "Перевіряти вільний простір за допомогою LaneGauge на кожних воротах і в кожному вузькому місці."}, {"en": "Practise a route until it flows, and fix the places you hesitate.", "uk": "Тренувати маршрут, доки він не стане плавним, і виправляти місця, де ти вагаєшся."}], "doalong": [{"en": "Slide LaneGauge through every gate on RT_Scenic. You should see it pass cleanly, or you note a clip.", "uk": "Проведи LaneGauge крізь кожні ворота на RT_Scenic. Ти бачиш, що він проходить чисто, — або записуєш місце зачіпу."}, {"en": "Slow the camera down (hold the right mouse button and roll the mouse wheel, as on Day 6), press G, hold the right mouse button and fly the route with W, A, S, D, E (up) and Q (down). If part of the route shows empty land, load its region first in the World Partition Editor (Load Region from Selection). You should see where you had to search for the next gate.", "uk": "Сповільни камеру (утримуй праву кнопку миші й крути коліщатко, як у День 6), натисни G, утримуй праву кнопку миші й пролети маршрут клавішами W, A, S, D, E (угору) і Q (униз). Якщо частина маршруту показує порожню землю, спершу завантаж її регіон у World Partition Editor (Load Region from Selection). Ти бачиш, де доводиться шукати наступні ворота."}, {"en": "Mark those places on a copy of island_map.png. You should see your marks.", "uk": "Познач ці місця на копії island_map.png. Ти бачиш свої позначки."}, {"en": "At the worst mark, move a gate or add a landmark (a tall tree, a flag, a bright roof). You should see the way on from there.", "uk": "Біля найгіршої позначки пересунь ворота або додай орієнтир (високе дерево, прапор, яскравий дах). Ти бачиш, куди летіти звідти."}], "play": {"en": "Lap race: three timed runs of the route; every missed gate costs 5 seconds; the tutor times me from my clip notes.", "uk": "Гонка на коло: три проходи маршруту на час; кожні пропущені ворота коштують 5 секунд; тьютор рахує мій час за нотатками до кліпу."}, "video": {"url": "https://www.youtube.com/watch?v=10cbOga7V_M", "title": "Landmarks 🇬🇧 [~LEVEL DESIGN #21]", "channel": "Mina Pêcheux", "length": "5:32", "search": "level design landmarks sightlines"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Flying it as a pilot (micro-lesson) (Day 57, lesson 4 of 4).\nToday's build: The scenic flight laid out: a beat sheet of about 2 minutes, RT_Scenic tuned to it, SM_Gate_4x4 gates along it, a locked camera framing each beat, and a practice run recorded.\nEarlier today I already did: lesson 1 (A flight that tells the island's story); lesson 2 (Gates along the route); lesson 3 (Composition at drone height along a route). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Know what a pilot needs: the next gate in view, landmarks at the turns, no blind 180-degree turns, enough space round the drone.\n2. Check clearance with LaneGauge at every gate and narrow spot.\n3. Practise a route until it flows, and fix the places you hesitate.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Lap race: three timed runs of the route; every missed gate costs 5 seconds; the tutor times me from my clip notes.\n4. Do-along on today's build (the beat sheet, the reveal and the first gates): guide me through these steps one at a time, checking a screenshot after each:\n   - Slide LaneGauge through every gate on RT_Scenic. You should see it pass cleanly, or you note a clip.\n   - Slow the camera down (hold the right mouse button and roll the mouse wheel, as on Day 6), press G, hold the right mouse button and fly the route with W, A, S, D, E (up) and Q (down). If part of the route shows empty land, load its region first in the World Partition Editor (Load Region from Selection). You should see where you had to search for the next gate.\n   - Mark those places on a copy of island_map.png. You should see your marks.\n   - At the worst mark, move a gate or add a landmark (a tall tree, a flag, a bright roof). You should see the way on from there.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Landmarks 🇬🇧 [~LEVEL DESIGN #21]\" by Mina Pêcheux: https://www.youtube.com/watch?v=10cbOga7V_M\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "flight_plan.md (beats, heights and seconds)", "uk": "flight_plan.md (біти, висоти й секунди)"}, {"en": "SM_Gate_4x4.blend and SM_Gate_4x4.fbx", "uk": "SM_Gate_4x4.blend і SM_Gate_4x4.fbx"}, {"en": "beat_cameras.png (a contact sheet of CAM_Beat_1 to CAM_Beat_N)", "uk": "beat_cameras.png (контактний аркуш від CAM_Beat_1 до CAM_Beat_N)"}, {"en": "route_marks.png (island_map.png with your hesitation marks and fixes)", "uk": "route_marks.png (island_map.png з твоїми позначками вагань і виправленнями)"}, {"en": "change_list_d2.md (and change_list_d1.md if you moved anything in district 1)", "uk": "change_list_d2.md (і change_list_d1.md, якщо ти щось пересуваєш у районі 1)"}, {"en": "before_after_day57.png and flythrough_day57.mp4 (the first 60 seconds of your practice run)", "uk": "before_after_day57.png і flythrough_day57.mp4 (перші 60 секунд твого тренувального прольоту)"}, {"en": "summary.md", "uk": "summary.md"}], "goal": {"en": "By the end of today you have the scenic flight planned beat by beat along RT_Scenic, with gates that keep the pilot on line and a locked camera at each beat framing the island at its best.", "uk": "До кінця дня ти маєш мальовничий проліт, розписаний біт за бітом уздовж RT_Scenic, з воротами, що тримають пілота на лінії, і зафіксованою камерою на кожному біті, яка показує острів у найкращому вигляді."}, "uses": [{"en": "Day 53: RT_Scenic and scenic_route.md", "uk": "День 53: RT_Scenic і scenic_route.md"}, {"en": "Day 32: your landmarks and vistas", "uk": "День 32: твої орієнтири й панорамні краєвиди"}, {"en": "Day 47: composition at drone height and the obvious route flown like a pilot", "uk": "День 47: композиція на висоті дрона й очевидний маршрут, пролетений як пілот"}, {"en": "Day 56: the route holds the frame budget", "uk": "День 56: маршрут вкладається в бюджет кадру"}, {"en": "Day 22: island_map.png", "uk": "День 22: island_map.png"}, {"en": "Day 51: how to make a Data Layer asset and make it current", "uk": "День 51: як створити асет Data Layer і зробити його поточним"}], "quiz": [{"q": {"en": "What is a 'reveal' in a flight?", "uk": "Що таке «розкриття» в прольоті?"}, "options": [{"en": "Switching the lights on", "uk": "Увімкнення світла"}, {"en": "Showing the map before the flight", "uk": "Показ мапи перед прольотом"}, {"en": "Flying backwards", "uk": "Політ задом наперед"}, {"en": "Hiding the view behind a ridge or trees, then flying past so the place appears", "uk": "Вид ховається за гребенем чи деревами, потім ти пролітаєш повз, і місце з'являється"}], "answer": 3, "explain": {"en": "A reveal makes the viewer wait for the view. It makes a place feel bigger and more exciting.", "uk": "Розкриття змушує глядача чекати на вид. Через це місце здається більшим і захопливішим."}}, {"q": {"en": "Your flight shows district 1 for 40 seconds from one height, and viewers get bored. What do you change?", "uk": "Твій проліт 40 секунд показує район 1 з однієї висоти, і глядачам стає нудно. Що ти змінюєш?"}, "options": [{"en": "Split it into shorter beats that alternate wide and close views, each under about 15 seconds", "uk": "Розбиваю його на коротші біти, що чергують широкі й близькі плани, кожен приблизно до 15 секунд"}, {"en": "Fly faster through everything", "uk": "Пролітаю все швидше"}, {"en": "Add more gates", "uk": "Додаю більше воріт"}], "answer": 0, "explain": {"en": "Rhythm keeps attention: short beats that change height and distance.", "uk": "Ритм тримає увагу: короткі біти, що змінюють висоту й відстань."}}, {"q": {"en": "Why does the gate need four UCX boxes, not one?", "uk": "Чому воротам потрібні чотири бокси UCX, а не один?"}, "options": [{"en": "Unreal allows only small boxes", "uk": "Unreal дозволяє лише маленькі бокси"}, {"en": "Four boxes look better", "uk": "Чотири бокси виглядають краще"}, {"en": "A collision box must be convex (no holes), so one box would block the opening", "uk": "Бокс колізії має бути опуклим (без отворів), тож один бокс заблокував би отвір"}], "answer": 2, "explain": {"en": "Collision boxes can't have holes. Four boxes, one per post and bar, leave the opening free.", "uk": "Бокси колізії не можуть мати отворів. Чотири бокси, по одному на кожну стійку й перекладину, залишають отвір вільним."}}, {"q": {"en": "A pilot keeps missing gate 9, which sits just after a sharp turn behind a barn. What is the best fix?", "uk": "Пілот раз у раз пропускає ворота 9, які стоять одразу після крутого повороту за коморою. Яке виправлення найкраще?"}, "options": [{"en": "Make the gate bigger than 4 x 4 m", "uk": "Зробити ворота більшими за 4 x 4 м"}, {"en": "Move the gate so it's visible from gate 8, or add a landmark at the turn", "uk": "Пересунути ворота так, щоб їх було видно з воріт 8, або додати орієнтир на повороті"}, {"en": "Remove the barn", "uk": "Прибрати комору"}], "answer": 1, "explain": {"en": "Each gate should be visible from the one before. A landmark tells the pilot where to turn.", "uk": "Кожні ворота мають бути видні з попередніх. Орієнтир підказує пілотові, де повертати."}}, {"q": {"en": "You found a great song on a website that shows no licence. Can you use it in your flight video?", "uk": "Ти знаходиш чудову пісню на сайті, де не вказано ліцензії. Чи можна використати її у відео прольоту?"}, "options": [{"en": "Yes, if you name the artist", "uk": "Так, якщо вказати виконавця"}, {"en": "Yes, if the video is shorter than 2 minutes", "uk": "Так, якщо відео коротше за 2 хвилини"}, {"en": "No: use only music whose licence allows use in a video (for example CC BY or CC0), credit it in credits.md, or use no music", "uk": "Ні: використовуй лише музику, ліцензія якої дозволяє використання у відео (наприклад, CC BY чи CC0), вказуй її в credits.md або обійдися без музики"}], "answer": 2, "explain": {"en": "No licence means no permission. Credit is not the same as permission.", "uk": "Немає ліцензії — немає дозволу. Вказати автора — не те саме, що отримати дозвіл."}}], "weekInfo": {"week": 12, "title": {"en": "The whole island, polished, flown and presented", "uk": "Увесь острів: шліфування, проліт і презентація"}, "goal": {"en": "By Friday you have the finished island: a budget proof at 1920 x 1080, a 2-minute scenic flight video through both districts, a hand-over pack with correct credits, and a portfolio ready for ArtStation with a CV skills list.", "uk": "До п'ятниці ти маєш готовий острів: доказ, що він вкладається в бюджет при 1920 x 1080, 2-хвилинне відео мальовничого прольоту крізь обидва райони, пакет для передачі з правильними кредитами (credits) і портфоліо, готове для ArtStation, зі списком навичок для резюме."}, "skills": [{"en": "Performance profiling with stat gpu and CSV captures to a 60 fps budget", "uk": "Профілювання продуктивності за допомогою stat gpu і CSV-записів під бюджет 60 fps"}, {"en": "Cull distances and HLODs for large World Partition worlds", "uk": "Відстані відсікання (cull distances) і HLOD для великих світів World Partition"}, {"en": "Cinematic flythroughs with Sequencer and Movie Render Queue, cut and encoded (H.264) in Blender's Video Sequencer", "uk": "Кінематографічні прольоти в Sequencer і Movie Render Queue, змонтовані й закодовані (H.264) у Video Sequencer у Blender"}, {"en": "Portfolio presentation: hero shots, breakdowns and before/after pairs", "uk": "Презентація портфоліо: головні кадри (hero shots), розбори (breakdowns) і пари «до/після»"}, {"en": "Production hand-over: documentation, dependency checks and licence-correct credits", "uk": "Передача проєкту: документація, перевірка залежностей і кредити з дотриманням ліцензій"}]}, "morning": {"sofar": {"en": "Your finished island has a budget proof: the whole scenic route runs within your frame-time targets at 1920 x 1080.", "uk": "Твій завершений острів має доказ бюджету: увесь мальовничий маршрут вкладається в цільовий час кадру при 1920 x 1080."}, "today": {"en": "You plan the scenic flight beat by beat, place gates along the route, and lock a camera that frames the island at each beat.", "uk": "Сьогодні ти плануєш мальовничий політ епізод за епізодом, ставиш ворота вздовж маршруту й фіксуєш камеру, що кадрує острів у кожному епізоді."}, "cheer": {"en": "This is where your island becomes a story, so plan the flight you would most like to watch.", "uk": "Саме тут твій острів стає історією, тож сплануй такий політ, який тобі найбільше хотілося б подивитися."}, "quote": {"text": {"en": "If it can be written, or thought, it can be filmed.", "uk": "Якщо це можна написати або подумати, це можна зняти."}, "author": {"en": "Stanley Kubrick", "uk": "Стенлі Кубрик"}, "source": "https://en.wikiquote.org/wiki/Stanley_Kubrick"}}, "hasAssets": false, "workPath": "Work\\Assignment\\Day-57-scenic-flight-route-gates", "mapHref": "../../COURSE.html", "prevHref": "../Day-56-whole-island-performance/START-HERE.html", "nextHref": "../Day-58-flight-takes-and-video-cut/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Blender, Krita and Unreal Engine 5.8. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me and don't write code. Keep me moving and make it feel like a game.\n\nToday I build on my own: All the gates, the beat cameras and a practice run, on your own.\nIt's part of: The scenic flight laid out: a beat sheet of about 2 minutes, RT_Scenic tuned to it, SM_Gate_4x4 gates along it, a locked camera framing each beat, and a practice run recorded (L_Island: the whole of RT_Scenic, from the launch point or the sea, through district 1, along the road, through district 2, out to the finale vista.).\n\nSpec:\n- flight_plan.md: 7 to 9 beats, each with what the viewer sees, the height and the seconds, adding up to about 2 minutes (for example: the reveal from the sea, the coast, district 1, the road, district 2, the landmark, the summit, the finale vista), plus your music choice (a licensed track, or 'no music').\n- RT_Scenic tuned to the beats: at least one reveal (the island or a district appears from behind a ridge, a headland or trees), one scale contrast (low past something small, such as a boat or a bench, just before a wide view), a rhythm of wide and close views, 5 to 20 m in the districts and 30 to 80 m over the coast and the summit, and a finale on your widest vista with the haze showing the distance.\n- SM_Gate_4x4 modelled in Blender: a 5 x 5 m frame with a 4 x 4 m opening, posts and bars 0.5 m thick, origin at the bottom centre, four UCX boxes (UCX_SM_Gate_4x4_00 to _03). Placed along the route 30 to 80 m apart on open stretches and 15 to 40 m apart in the districts, each visible from the one before; the route, the gates and the gauge cube on the Data Layer asset DL_Routes.\n- One locked Cine Camera per beat, CAM_Beat_1 to CAM_Beat_N, framing that beat's key moment: a subject on a third, a foreground element, a level horizon.\n- LaneGauge passed at every gate and narrow spot; any prop moved for a cleaner frame moved 2 m at most and logged.\n- A practice run of the whole route recorded, with the places you hesitated marked and fixed.\n\nMy checklist:\n1. Choose your music now, or decide on none: one track whose licence allows use in a video (for example CC BY or CC0 music on Wikimedia Commons), saved in today's Work folder, with its title, author, licence and link in credits.md. Check: credits.md has the music line, or flight_plan.md says 'no music'. (from lesson 1)\n2. Write flight_plan.md: 7 to 9 beats, each with what the viewer sees, the height and the seconds. Check: the seconds add up to between 110 and 130. (from lesson 1)\n3. Tune RT_Scenic to the beats: move points for one reveal, and set the heights for wide and close parts. Check: flying it, a ridge, headland or trees hide the view until the last moment. (from lesson 1)\n4. Model SM_Gate_4x4 in Blender (30 minutes at most) with four UCX boxes (UCX_SM_Gate_4x4_00 to _03), export it, and import it into Content/Island/Routes. Check: beside the mannequin, the opening is a little more than twice the mannequin's height. (from lesson 2)\n5. Place gates along the open stretches, 30 to 80 m apart, each facing along the route. Check: from each gate you can see the next one. (from lesson 2)\n6. Place gates through both districts, 15 to 40 m apart. Check: no gate blocks a district's best view from a beat camera. (from lesson 2)\n7. Make the Data Layer asset DL_Routes (as on Day 51) and put RT_Scenic, every gate and LaneGauge on it (select them, then right-click DL_Routes > Add Selected Actors to Selected Data Layers). Check: hiding DL_Routes hides all of them. (from day 51, lesson 1)\n8. Place CAM_Beat_1 to CAM_Beat_N, one per beat, and frame each key moment. Check: each frame has a subject on a third, a foreground element and a level horizon. (from lesson 3)\n9. Clean each frame with small moves (props only, 2 m at most) and log them in change_list_d2.md (or change_list_d1.md for district 1). Check: every move is logged, and no building moved. (from lesson 3)\n10. Slide LaneGauge through every gate and narrow spot on the route. Check: it touches nothing anywhere. (from lesson 4)\n11. Fly the whole route twice for practice and mark where you hesitated on a copy of island_map.png. Check: at least one mark, with a fix written beside it. (from lesson 4)\n12. Fix the hesitations (a landmark, a moved gate, a gentler turn) and record one full practice run with Win+Alt+R. Check: the run passes through every gate. (from lesson 4)\n13. Put your first screenshot through CAM_Beat_1 (from lesson 3, before you cleaned the frame) beside its final view as before_after_day57.png; the first 60 seconds of the practice run is today's clip. Save today's clip as flythrough_day57.mp4 and check that you also have SM_Gate_4x4.blend, beat_cameras.png and route_marks.png (each is described in today's hand-in list; take any you are missing now). Check: the pair shows your composition change. (from lesson 3)\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Ksenia\nDay 57: The scenic flight: a route that tells the island's story, gates and composition. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p><div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+list(D.handin,'ul','ticks')+'<p class="path">'+ic('folder')+'<span>'+u('shipTo')+' <code>'+esc(D.workPath)+'</code></span></p>'+(D.lessons.length?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<p class="muted">'+u('report')+'</p><div class="row"><button class="btn s" onclick="cp(D.reportPrompt)">'+ic('copy')+u('copyR')+'</button></div></section>';
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();

<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 14</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

<script id="data" type="application/json">{"learner": "ib-ivan-9ac02175", "learnerName": {"en": "Ivan", "uk": "Іван"}, "day": 14, "week": 3, "total": 60, "title": {"en": "Texture painting and wear: salt, sun and edges, with a Wear slider", "uk": "Малювання текстур і зношеність: сіль, сонце й краї, з повзунком Wear"}, "theme": {"en": "Week 3: Surfaces", "uk": "Тиждень 3: Поверхні"}, "build": {"item": {"en": "Wear masks painted in Blender and a Wear slider on the kit's instances", "uk": "Маски зношеності, намальовані в Blender, і повзунок Wear на інстансах набору"}, "why": {"en": "New paint and clean stone look like a toy from the air. A painted mask says where wear goes and a Wear slider says how much. A level designer then ages a piece with one slider instead of a new texture: fresh near the shops, old on the windy pier.", "uk": "Нова фарба й чистий камінь з повітря виглядають як іграшка. Намальована маска каже, де лежить зношеність, а повзунок Wear — скільки її. Тоді дизайнер рівнів старить деталь одним повзунком, а не новою текстурою: свіжа біля крамниць, стара на вітряному пірсі."}, "next": {"en": "The Wear slider ages your whole waterfront on Day 44 and district 2 on Day 52, and wear_map.md comes back on both days.", "uk": "Повзунок Wear додасть зношеності всій твоїй набережній у День 44 і району 2 у День 52, а wear_map.md знадобиться в обидва ці дні."}, "where": {"en": "L_KitTest: the quay edge and the pier deck. Two more pieces get wear on Friday.", "uk": "L_KitTest: край причалу й настил пірса. У п'ятницю зношеність отримають ще дві деталі."}, "spec": [{"en": "Each painted piece gets a second UV map named Paint (Smart UV Project: islands inside the square, none overlapping). The first map stays exactly as it is.", "uk": "Кожна розмальована деталь отримує другу UV-розгортку з назвою Paint (Smart UV Project: острівці всередині квадрата, без перекриттів). Перша розгортка лишається точно такою, як була."}, {"en": "A 1024 x 1024 mask per piece, T_<Piece>_Wear. A mask is a black-and-white image: white means worn, black means clean.", "uk": "Маска 1024 × 1024 на кожну деталь, T_<Piece>_Wear. Маска — це чорно-біле зображення: білий означає зношене, чорний — чисте."}, {"en": "Salt streaks rise 10 to 40 cm above the waterline (Z -1, 1 m below the deck top) on the quay's water face. The bottom 2 m stays clean: it is under water.", "uk": "Сольові патьоки піднімаються на 10–40 см над ватерлінією (Z -1, на 1 м нижче верху настилу) на боці причалу, що дивиться на воду. Нижні 2 м лишаються чистими: вони під водою."}, {"en": "Sun fade on top surfaces and edge wear on corners and walking lines; most of each mask stays black.", "uk": "Вигорання на верхніх поверхнях і стерті краї на кутах і на лініях, де ходять люди. Більша частина кожної маски лишається чорною."}, {"en": "M_Master gains four parameters: WearMask (read from UV channel 1, the Paint map), Wear (0 to 1), WornColour and WornRoughness.", "uk": "M_Master отримує чотири нові параметри: WearMask (читається з UV-каналу 1, розгортки Paint), Wear (від 0 до 1), WornColour і WornRoughness."}, {"en": "A child instance for each piece's main slot, MI_Stone_QuayEdge and MI_Wood_PierDeck, each with its own WearMask and Wear.", "uk": "Дочірній інстанс для головного слота кожної деталі, MI_Stone_QuayEdge і MI_Wood_PierDeck, кожен із власними WearMask і Wear."}, {"en": "Every painted image saved as a PNG and packed into the .blend before export. In Unreal, Generate Lightmap UVs is off on each painted mesh.", "uk": "Кожне намальоване зображення збережено як PNG і запаковано в .blend перед експортом. В Unreal на кожному розмальованому меші вимкнено Generate Lightmap UVs."}], "piece1": "SM_QuayEdge_4m: a salt line and worn coping (shared with the lessons)", "piece2": {"en": "SM_PierDeck_4m, its child instance and your Wear values, on your own", "uk": "SM_PierDeck_4m, його дочірній інстанс і твої значення Wear, самостійно"}, "steps": [{"text": {"en": "Check: the files from today's lessons are in the day work folder (quaykit_day14.blend with the Paint map, and T_QuayEdge_Wear.png). Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it. M_Master has its Wear parameters and MI_Stone_QuayEdge exists.", "uk": "Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: quaykit_day14.blend з розгорткою Paint і T_QuayEdge_Wear.png. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. M_Master має параметри зношеності, а MI_Stone_QuayEdge створено."}, "lesson": 1}, {"text": {"en": "Open two Wikimedia Commons photos of old timber decks and add them to credits.md. Find where they wear: the walking line, edges where boats rub, and a faded top. Check: you can point at three wear marks and name each cause.", "uk": "Відкрий два фото старих дерев'яних настилів з Wikimedia Commons і додай їх у credits.md. Знайди, де вони зношені: лінія, де ходять люди, краї, об які труться човни, і вигорілий верх. Перевірка: ти можеш показати три сліди зношеності й назвати причину кожного."}, "lesson": 2}, {"text": {"en": "SM_PierDeck_4m, in quaykit_day14.blend: add a UV map named Paint and Smart UV Project it, as in lesson 1. Check: in the UV Editor the Paint islands sit inside the square, none overlapping, and the first map is unchanged.", "uk": "SM_PierDeck_4m, у quaykit_day14.blend: додай UV-розгортку з назвою Paint і зроби для неї Smart UV Project, як в уроці 1. Перевірка: в UV Editor острівці Paint лежать усередині квадрата без перекриттів, а перша розгортка не змінилася."}, "lesson": 1}, {"text": {"en": "In the Texture Paint tab make a new image, T_PierDeck_Wear: 1024 x 1024, black, Alpha unticked, on the Paint map. Check: the deck turns black.", "uk": "У вкладці Texture Paint створи нове зображення T_PierDeck_Wear: 1024 × 1024, чорне, без прапорця Alpha, на розгортці Paint. Перевірка: настил стає чорним."}, "lesson": 1}, {"text": {"en": "Paint with a soft white brush: a faint sun fade over the top and a soft worn band along the walking line. Add edge wear where boats rub. Paint out stripes with black. Check: the band is soft and uneven, not a ruled stripe.", "uk": "Малюй м'яким білим пензлем: легке вигорання на верху і м'яку зношену смугу вздовж лінії, де ходять люди. Додай стерті краї там, де труться човни. Чорним прибери все, що схоже на рівні смуги. Перевірка: смуга м'яка й нерівна, не як під лінійку."}, "lesson": 2}, {"text": {"en": "Save the image at once: Image > Save As, T_PierDeck_Wear.png in the day work folder. Check: the Image menu shows no asterisk (*).", "uk": "Одразу збережи зображення: Image > Save As, T_PierDeck_Wear.png у робочу папку дня. Перевірка: біля меню Image немає зірочки (*)."}, "lesson": 3}, {"text": {"en": "File > External Data > Pack Resources, then File > Save. Close Blender and double-click quaykit_day14.blend. Check: SM_QuayEdge_4m and SM_PierDeck_4m are in the Outliner, and both masks still show their paint.", "uk": "File > External Data > Pack Resources, потім File > Save. Закрий Blender і двічі клацни на quaykit_day14.blend. Перевірка: SM_QuayEdge_4m і SM_PierDeck_4m є в Outliner, і обидві маски досі показують розпис."}, "lesson": 3}, {"text": {"en": "Export SM_PierDeck_4m with its UCX boxes over its FBX and Reimport it in Unreal. In its Static Mesh Editor, Generate Lightmap UVs must be off, as in lesson 3. Check: the FBX is 10 KB or more, and UV > UV Channel 1 shows the Paint layout.", "uk": "Експортуй SM_PierDeck_4m з блоками UCX поверх його FBX і зроби Reimport в Unreal. У його Static Mesh Editor Generate Lightmap UVs має бути вимкнено, як в уроці 3. Перевірка: FBX має 10 КБ або більше, а UV > UV Channel 1 показує розкладку Paint."}, "lesson": 3}, {"text": {"en": "Import T_PierDeck_Wear.png into Course/Day14. Check: it shows in the Content Browser at 1024 x 1024 (hover it).", "uk": "Імпортуй T_PierDeck_Wear.png у Course/Day14. Перевірка: текстура є в Content Browser і має 1024 × 1024 (наведи мишу)."}, "lesson": 3}, {"text": {"en": "Make MI_Wood_PierDeck: right-click MI_Wood > Create Material Instance. Tick WearMask (T_PierDeck_Wear) and Wear, and set it on the deck's Wood slot in the Static Mesh Editor. An error about the sampler type? Open the mask texture and tick sRGB. Check: dragging Wear from 0 to 1 ages the deck.", "uk": "Створи MI_Wood_PierDeck: клацни правою кнопкою на MI_Wood > Create Material Instance. Увімкни WearMask (T_PierDeck_Wear) і Wear та признач інстанс у слот Wood настилу в Static Mesh Editor. Помилка про тип семплера? Відкрий текстуру маски й увімкни прапорець sRGB. Перевірка: коли тягнеш Wear від 0 до 1, настил старіє."}, "lesson": 4}, {"text": {"en": "Set WornColour from your photos: a pale salt grey on MI_Stone_QuayEdge, a silver grey on MI_Wood_PierDeck; WornRoughness 0.9 on both. Check: at Wear 1 the worn parts look dry and faded, not dirty.", "uk": "Задай WornColour за своїми фото: блідий сольовий сірий на MI_Stone_QuayEdge, сріблясто-сірий на MI_Wood_PierDeck. WornRoughness 0.9 на обох. Перевірка: при Wear 1 зношені місця виглядають сухими й вигорілими, а не брудними."}, "lesson": 4}, {"text": {"en": "Choose Wear by exposure: quay edge and pier deck 0.7 to 0.8 (waves, salt and boats). Write both in wear_map.md, plus Friday's plan: the door wall 0.5, the shop front 0.4. Check: from 10 m the kit looks used, not dirty.", "uk": "Вибери Wear за тим, наскільки деталь відкрита негоді: край причалу й настил пірса — 0.7–0.8 (хвилі, сіль і човни). Запиши обидва значення у wear_map.md, а також план на п'ятницю: стіна з дверима 0.5, фасад крамниці 0.4. Перевірка: з 10 м набір виглядає вживаним, а не брудним."}, "lesson": 4}, {"text": {"en": "Take before_after_day14.png: L_KitTest from one view with every Wear at 0, then at your values, side by side. Check: today's proof picture is in your day work folder, and the salt shows just above the water.", "uk": "Зроби скриншот і збережи як before_after_day14.png: L_KitTest з одного ракурсу, з усіма Wear на 0 і з твоїми значеннями, поруч. Перевірка: сьогоднішній знімок-доказ лежить у робочій папці дня, а сіль видно трохи вище води."}, "lesson": 4}, {"text": {"en": "Report and hand-in: click Copy the day report at the bottom of the page, paste it into a new chat and answer. Open summary.md in Notepad, press Ctrl+End, paste the answer and press Ctrl+S. Then drag the files on the Hand in list into your hand-in folder. Check: every name shows in the folder, each with a size.", "uk": "Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: кожна назва зі списку є в папці, у кожної є розмір."}, "lesson": "D0.1"}]}, "lessons": [{"title": {"en": "A second UV map for painting", "uk": "Друга UV-розгортка для малювання"}, "minutes": 40, "goals": [{"en": "Explain why painting needs its own UVs: every island inside the square and none overlapping, so each spot on the model has its own pixels.", "uk": "Пояснювати, чому для малювання потрібні власні UV: кожен острівець усередині квадрата, і жоден не перекривається. Тож кожна точка моделі має власні пікселі."}, {"en": "Add a second UV map named Paint and unwrap it with Smart UV Project, leaving the first map untouched.", "uk": "Додавати другу UV-розгортку з назвою Paint і розгортати її командою Smart UV Project, не чіпаючи першої."}, {"en": "Set up Texture Paint mode (painting straight onto the model) with a new black image on the Paint map.", "uk": "Налаштовувати режим Texture Paint (малювання просто на моделі) з новим чорним зображенням на розгортці Paint."}], "doalong": [{"en": "Open quaykit_day11.blend and save it as quaykit_day14.blend. You see the new name in the title bar.", "uk": "Відкрий quaykit_day11.blend і збережи як quaykit_day14.blend. У рядку заголовка з'являється нова назва."}, {"en": "Select SM_QuayEdge_4m. In Object Data Properties (the green triangle icon), under UV Maps press +, then double-click the new map and name it Paint. Leave the camera icon on the first map. You see two maps.", "uk": "Виділи SM_QuayEdge_4m. В Object Data Properties (значок зеленого трикутника) у розділі UV Maps натисни +, потім двічі клацни на новій розгортці й назви її Paint. Значок камери лиши на першій розгортці. Має вийти дві розгортки."}, {"en": "Click Paint so it is active. Tab, A, then U > Smart UV Project, Island Margin 0.02, OK. You see islands packed inside the UV square, none overlapping.", "uk": "Клацни на Paint, щоб вона стала активною. Tab, A, потім U > Smart UV Project, Island Margin 0.02, OK. Острівці щільно лежать усередині UV-квадрата без перекриттів."}, {"en": "Click the first map and look at the UV Editor, then click Paint again. You see that each map keeps its own layout: your Day 11 UVs are unchanged.", "uk": "Клацни на першу розгортку й подивися в UV Editor, потім знову клацни на Paint. Кожна розгортка зберігає свою розкладку: твої UV з Дня 11 не змінилися."}, {"en": "Tab to Object Mode and click the Texture Paint tab. In the tool settings find Texture Slots, set Mode to Single Image and press New: T_QuayEdge_Wear, 1024 x 1024, black, Alpha unticked. You see the quay edge turn black.", "uk": "Перейди в Object Mode (Tab) і клацни вкладку Texture Paint. У налаштуваннях інструмента знайди Texture Slots, постав Mode на Single Image і натисни New: T_QuayEdge_Wear, 1024 × 1024, чорне, без прапорця Alpha. Край причалу стає чорним."}, {"en": "Set UV Map to Paint. Press X until the brush colour is white and drag one short stroke on the front face. You see the stroke on the model and in the Image Editor.", "uk": "Постав UV Map на Paint. Натискай X, доки колір пензля не стане білим, і проведи один короткий мазок по передній грані. Мазок з'являється на моделі й в Image Editor."}], "play": {"en": "Overlap hunt: the tutor describes three UV layouts (islands stacked on top of each other, islands outside the square, a clean pack). I say which one will paint correctly and why, in 30 seconds each.", "uk": "Полювання на перекриття: тьютор описує три UV-розкладки (острівці складені один на одного, острівці поза квадратом, чиста розкладка). За 30 секунд на кожну я кажу, яка з них правильно прийме розпис, і чому."}, "video": {"url": "https://www.youtube.com/watch?v=iwWoXMWzC_c", "title": "Blender 4.0 - Texture Painting quick start guide", "channel": "Jamie Dunbar", "length": "5:31", "search": "blender texture painting quick start"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Друга UV-розгортка для малювання (Day 14, lesson 1 of 4). Today's build: Маски зношеності, намальовані в Blender, і повзунок Wear на інстансах набору.\nWhat I already know: День 11: UV твого набору в quaykit_day11.blend (перша UV-розгортка лишається як є); День 12: M_Master та його інстанси MI_Stone і MI_Wood; День 13: MI_Trim_Harbour і слот Trim на бровці причалу, якщо Золото Дня 13 виконано.\n\nBy the end of this lesson I can:\n1. Пояснювати, чому для малювання потрібні власні UV: кожен острівець усередині квадрата, і жоден не перекривається. Тож кожна точка моделі має власні пікселі.\n2. Додавати другу UV-розгортку з назвою Paint і розгортати її командою Smart UV Project, не чіпаючи першої.\n3. Налаштовувати режим Texture Paint (малювання просто на моделі) з новим чорним зображенням на розгортці Paint.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: У тебе є текстурований набір для гавані, трим-шит і перший фасад крамниці, SM_ShopFront_A, який стоїть у L_KitTest. Today: Сьогодні ти малюєш на краї причалу й настилі пірса сліди солі, сонця й стерті краї та додаєш до M_Master повзунок Wear, який веде кожну деталь від нової до старої. One encouraging line: Зношеність вимагає спостережливості, а не досконалості: подивися на фото, трохи помалюй і подивися знову.); 2 lines on why today matters and where it comes back, in plain words (from this: Нова фарба й чистий камінь з повітря виглядають як іграшка. Намальована маска каже, де лежить зношеність, а повзунок Wear — скільки її. Тоді дизайнер рівнів старить деталь одним повзунком, а не новою текстурою: свіжа біля крамниць, стара на вітряному пірсі. It comes back: Повзунок Wear додасть зношеності всій твоїй набережній у День 44 і району 2 у День 52, а wear_map.md знадобиться в обидва ці дні.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-14-texture-painting-and-wear exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (SM_QuayEdge_4m: сольова лінія й стерта бровка (спільні з уроками)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Відкрий quaykit_day11.blend і збережи як quaykit_day14.blend. У рядку заголовка з'являється нова назва.\n   2. Виділи SM_QuayEdge_4m. В Object Data Properties (значок зеленого трикутника) у розділі UV Maps натисни +, потім двічі клацни на новій розгортці й назви її Paint. Значок камери лиши на першій розгортці. Має вийти дві розгортки.\n   3. Клацни на Paint, щоб вона стала активною. Tab, A, потім U > Smart UV Project, Island Margin 0.02, OK. Острівці щільно лежать усередині UV-квадрата без перекриттів. [screenshot]\n   4. Клацни на першу розгортку й подивися в UV Editor, потім знову клацни на Paint. Кожна розгортка зберігає свою розкладку: твої UV з Дня 11 не змінилися.\n   5. Перейди в Object Mode (Tab) і клацни вкладку Texture Paint. У налаштуваннях інструмента знайди Texture Slots, постав Mode на Single Image і натисни New: T_QuayEdge_Wear, 1024 × 1024, чорне, без прапорця Alpha. Край причалу стає чорним.\n   6. Постав UV Map на Paint. Натискай X, доки колір пензля не стане білим, і проведи один короткий мазок по передній грані. Мазок з'являється на моделі й в Image Editor. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Полювання на перекриття: тьютор описує три UV-розкладки (острівці складені один на одного, острівці поза квадратом, чиста розкладка). За 30 секунд на кожну я кажу, яка з них правильно прийме розпис, і чому. Otherwise skip it.\n6. Review: ask me these questions from earlier days, one at a time, and correct me kindly: Day 11: what is the kit standard texel density, and how much of the model does one UV square cover? | Day 8: why does every kit piece follow one naming pattern, such as SM_QuayEdge_4m?\n7. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n8. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\nIf I want to go deeper, recommend this free video: \"Blender 4.0 - Texture Painting quick start guide\" by Jamie Dunbar: https://www.youtube.com/watch?v=iwWoXMWzC_c\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file nam

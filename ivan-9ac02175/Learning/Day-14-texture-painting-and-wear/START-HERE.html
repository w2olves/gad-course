"en": "Reimport in Unreal and check that Generate Lightmap UVs is off, so Unreal can't overwrite your Paint map. Unreal calls that second map UV Channel 1; the first is UV Channel 0.", "uk": "Робити Reimport в Unreal і перевіряти, чи вимкнено Generate Lightmap UVs, щоб Unreal не переписав твою розгортку Paint. Unreal називає другу розгортку UV Channel 1, а першу — UV Channel 0."}], "doalong": [{"en": "Look at the Image menu in the Image Editor: Image* means unsaved. Click Image > Save. You see the asterisk disappear.", "uk": "Подивися на меню Image в Image Editor: Image* означає «не збережено». Клацни Image > Save. Зірочка зникає."}, {"en": "File > External Data > Pack Resources, then File > Save. Close Blender and open the file again. You see your paint still there.", "uk": "File > External Data > Pack Resources, потім File > Save. Закрий Blender і знову відкрий файл. Твій розпис на місці."}, {"en": "Select SM_QuayEdge_4m and its UCX boxes and export over its FBX with your usual settings; both UV maps go into the file. You see 10 KB or more in File Explorer.", "uk": "Виділи SM_QuayEdge_4m і його блоки UCX та експортуй поверх його FBX зі звичними налаштуваннями: обидві розгортки потрапляють у файл. У Провіднику (File Explorer) файл має 10 КБ або більше."}, {"en": "In Unreal right-click SM_QuayEdge_4m > Reimport, then double-click it. In LOD0 > Build Settings, check that Generate Lightmap UVs is unticked; if not, untick it and Apply Changes. You see the box unticked.", "uk": "В Unreal клацни правою кнопкою на SM_QuayEdge_4m > Reimport, потім двічі клацни на ньому. У LOD0 > Build Settings перевір, чи знято прапорець Generate Lightmap UVs. Якщо ні, зніми його й натисни Apply Changes. Прапорець знято."}, {"en": "Click UV in the toolbar and choose UV Channel 1. You see your Paint layout. A tightly packed layout means Generate Lightmap UVs is still on: it writes over your Paint map.", "uk": "Клацни UV на панелі інструментів і вибери UV Channel 1. Видно твою розкладку Paint. Якщо розкладка щільно запакована, Generate Lightmap UVs досі увімкнено: він переписує твою розгортку Paint."}, {"en": "Import T_QuayEdge_Wear.png into Course/Day14. You see the mask in the Content Browser at 1024 x 1024 (hover it).", "uk": "Імпортуй T_QuayEdge_Wear.png у Course/Day14. Маска є в Content Browser і має 1024 × 1024 (наведи мишу)."}], "play": {"en": "Disaster drill: the tutor has me paint a stroke on a scrap image, close Blender without saving and reopen it. Then I explain the save-and-pack rule in one sentence.", "uk": "Навчальна тривога: тьютор просить мене намалювати мазок на чорновому зображенні, закрити Blender без збереження й відкрити знову. Потім я пояснюю правило «збережи й запакуй» одним реченням."}, "video": {"url": "https://www.youtube.com/watch?v=SqwEGDIPTY8", "title": "How to Pack Files into Blender (Quick Tip)", "channel": "Ryan King Art", "length": "5:32", "search": "blender pack images file"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Збереження, пакування й дві UV-розгортки в Unreal (Day 14, lesson 3 of 4). Today's build: Маски зношеності, намальовані в Blender, і повзунок Wear на інстансах набору.\nWhat I already know: День 11: UV твого набору в quaykit_day11.blend (перша UV-розгортка лишається як є); День 12: M_Master та його інстанси MI_Stone і MI_Wood; День 13: MI_Trim_Harbour і слот Trim на бровці причалу, якщо Золото Дня 13 виконано.\nEarlier today I already did: lesson 1 (Друга UV-розгортка для малювання); lesson 2 (Читання зношеності й малювання солі, сонця й країв). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Знати, чому намальовані зображення зникають: незбережене зображення живе лише в пам'яті, а зірочка (*) біля меню Image означає «не збережено».\n2. Зберігати кожне зображення й пакувати його в .blend (File > External Data > Pack Resources), потім експортувати FBX з обома UV-розгортками.\n3. Робити Reimport в Unreal і перевіряти, чи вимкнено Generate Lightmap UVs, щоб Unreal не переписав твою розгортку Paint. Unreal називає другу розгортку UV Channel 1, а першу — UV Channel 0.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: 2 lines on why today matters and where it comes back, in plain words (from this: Нова фарба й чистий камінь з повітря виглядають як іграшка. Намальована маска каже, де лежить зношеність, а повзунок Wear — скільки її. Тоді дизайнер рівнів старить деталь одним повзунком, а не новою текстурою: свіжа біля крамниць, стара на вітряному пірсі. It comes back: Повзунок Wear додасть зношеності всій твоїй набережній у День 44 і району 2 у День 52, а wear_map.md знадобиться в обидва ці дні.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-14-texture-painting-and-wear exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (SM_QuayEdge_4m: сольова лінія й стерта бровка (спільні з уроками)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Подивися на меню Image в Image Editor: Image* означає «не збережено». Клацни Image > Save. Зірочка зникає.\n   2. File > External Data > Pack Resources, потім File > Save. Закрий Blender і знову відкрий файл. Твій розпис на місці.\n   3. Виділи SM_QuayEdge_4m і його блоки UCX та експортуй поверх його FBX зі звичними налаштуваннями: обидві розгортки потрапляють у файл. У Провіднику (File Explorer) файл має 10 КБ або більше. [screenshot]\n   4. В Unreal клацни правою кнопкою на SM_QuayEdge_4m > Reimport, потім двічі клацни на ньому. У LOD0 > Build Settings перевір, чи знято прапорець Generate Lightmap UVs. Якщо ні, зніми його й натисни Apply Changes. Прапорець знято.\n   5. Клацни UV на панелі інструментів і вибери UV Channel 1. Видно твою розкладку Paint. Якщо розкладка щільно запакована, Generate Lightmap UVs досі увімкнено: він переписує твою розгортку Paint.\n   6. Імпортуй T_QuayEdge_Wear.png у Course/Day14. Маска є в Content Browser і має 1024 × 1024 (наведи мишу). [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Навчальна тривога: тьютор просить мене намалювати мазок на чорновому зображенні, закрити Blender без збереження й відкрити знову. Потім я пояснюю правило «збережи й запакуй» одним реченням. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\nIf I want to go deeper, recommend this free video: \"How to Pack Files into Blender (Quick Tip)\" by Ryan King Art: https://www.youtube.com/watch?v=SqwEGDIPTY8\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; see-why-fix note = нотатка «бачу, чому, як виправити»; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); File Explorer = Провідник; mesh = меш; vertex / edge / face = вершина / ребро / грань; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); UV unwrap / UV layout / seam / UV island = розгортка / розкладка / шов / UV-острівець; texel density / checker pattern = щільність текселів / шахівниця; level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; collision / UCX collision box = колізія / блок UCX; material instance / child instance = інстанс / дочірній інстанс; material slot / node / pin = слот матеріалу / вузол / вхід; kit / kit piece / part of one object = набір / деталь / частина; map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; district / plot / plot plan = район / ділянка / план ділянки; harbour / quay / waterfront / pier = гавань / причал / набережна / пірс; shop front / shop window = фасад крамниці / вітрина; wear / worn edges / salt line = зношеність / стерті краї / сольова лінія; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}, {"title": {"en": "A Wear slider in M_Master", "uk": "Повзунок Wear у M_Master"}, "minutes": 40, "goals": [{"en": "Explain a Lerp node (linear interpolate): it blends input A into input B by Alpha. Alpha 0 gives A, 1 gives B and 0.5 a mix.", "uk": "Пояснювати, що робить вузол Lerp (linear interpolate): змішує вхід A зі входом B за значенням Alpha. Alpha 0 дає A, 1 дає B, а 0,5 — суміш."}, {"en": "Add WearMask (on UV channel 1), Wear, WornColour and WornRoughness to M_Master and blend them in with two Lerps.", "uk": "Додавати до M_Master параметри WearMask (на UV-каналі 1), Wear, WornColour і WornRoughness та вмішувати їх двома вузлами Lerp."}, {"en": "Make a child instance (an instance of an instance: it copies its parent and changes only a few values) for each painted piece.", "uk": "Створювати дочірній інстанс для кожної розмальованої деталі. Це інстанс інстансу: він копіює батьківський і змінює лише кілька значень."}], "doalong": [{"en": "Open M_Master. Add a Texture Sample (hold T, click), Convert to Parameter, name it WearMask and set its Texture to Black. Add a TexCoord (hold U, click) with Coordinate Index 1 and wire it into WearMask's UVs. You see a black preview.", "uk": "Відкрий M_Master. Додай Texture Sample (тримай T, клацни), Convert to Parameter, назви його WearMask і в Texture вибери Black. Додай TexCoord (тримай U, клацни) з Coordinate Index 1 і з'єднай його з UVs у WearMask. Попередній перегляд чорний."}, {"en": "Hold S and click for a Scalar Parameter, Wear (0). Add a Multiply: WearMask's R times Wear. This is the wear amount. You see a new Multiply node.", "uk": "Тримай S і клацни — з'явиться Scalar Parameter. Назви його Wear (0). Додай Multiply: R від WearMask, помножений на Wear. Це кількість зношеності. З'являється новий вузол Multiply."}, {"en": "Hold V and click for a Vector Parameter, WornColour (pale grey). Hold L and click for a Lerp: A the BaseColor-times-Tint Multiply, B WornColour, Alpha the wear amount. Wire it into Base Color. You see no change, because Wear is 0.", "uk": "Тримай V і клацни — з'явиться Vector Parameter WornColour (блідо-сірий). Тримай L і клацни — з'явиться Lerp: у A — Multiply з BaseColor і Tint, у B — WornColour, в Alpha — кількість зношеності. З'єднай його з Base Color. Нічого не змінюється, бо Wear дорівнює 0."}, {"en": "Add a Scalar Parameter WornRoughness (0.9) and a second Lerp: A Roughness, B WornRoughness, Alpha the wear amount, into Roughness. Apply and Save. You see the material compile with no errors.", "uk": "Додай Scalar Parameter WornRoughness (0.9) і другий Lerp: у A — Roughness, у B — WornRoughness, в Alpha — кількість зношеності. З'єднай його з Roughness. Apply і Save. Матеріал компілюється без помилок."}, {"en": "Right-click MI_Stone > Create Material Instance: MI_Stone_QuayEdge. Tick WearMask (T_QuayEdge_Wear) and Wear, and set it on SM_QuayEdge_4m's Stone slot. Drag Wear from 0 to 1. You see salt and worn edges where you painted.", "uk": "Клацни правою кнопкою на MI_Stone > Create Material Instance: MI_Stone_QuayEdge. Увімкни WearMask (T_QuayEdge_Wear) і Wear та признач інстанс у слот Stone на SM_QuayEdge_4m. Потягни Wear від 0 до 1. Сіль і стерті краї з'являються там, де їх намальовано."}, {"en": "Does your quay coping have a Trim slot (Day 13 Gold)? Make MI_Trim_QuayEdge from MI_Trim_Harbour the same way, with the same mask. You see the coping age too.", "uk": "Бровка причалу має слот Trim (Золото Дня 13)? Так само створи MI_Trim_QuayEdge з MI_Trim_Harbour, з тією самою маскою. Бровка теж старіє."}], "play": {"en": "Age guess: I set three pieces to secret Wear values. The tutor guesses each value from my screenshot. I score when it's within 0.2.", "uk": "Вгадай вік: я ставлю трьом деталям таємні значення Wear. Тьютор вгадує кожне значення з мого скриншота. Бал мені, якщо похибка не більше 0.2."}, "video": {"url": "https://www.youtube.com/watch?v=jEGeqewASV8", "title": "Scratch, Grime & Grunge Imperfections Textures In Unreal Engine 5 - Introduction & Master Material", "channel": "BuildGamesWithJon", "length": "18:24", "search": "unreal engine 5 grunge imperfections material"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Повзунок Wear у M_Master (Day 14, lesson 4 of 4). Today's build: Маски зношеності, намальовані в Blender, і повзунок Wear на інстансах набору.\nWhat I already know: День 11: UV твого набору в quaykit_day11.blend (перша UV-розгортка лишається як є); День 12: M_Master та його інстанси MI_Stone і MI_Wood; День 13: MI_Trim_Harbour і слот Trim на бровці причалу, якщо Золото Дня 13 виконано.\nEarlier today I already did: lesson 1 (Друга UV-розгортка для малювання); lesson 2 (Читання зношеності й малювання солі, сонця й країв); lesson 3 (Збереження, пакування й дві UV-розгортки в Unreal). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Пояснювати, що робить вузол Lerp (linear interpolate): змішує вхід A зі входом B за значенням Alpha. Alpha 0 дає A, 1 дає B, а 0,5 — суміш.\n2. Додавати до M_Master параметри WearMask (на UV-каналі 1), Wear, WornColour і WornRoughness та вмішувати їх двома вузлами Lerp.\n3. Створювати дочірній інстанс для кожної розмальованої деталі. Це інстанс інстансу: він копіює батьківський і змінює лише кілька значень.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: 2 lines on why today matters and where it comes back, in plain words (from this: Нова фарба й чистий камінь з повітря виглядають як іграшка. Намальована маска каже, де лежить зношеність, а повзунок Wear — скільки її. Тоді дизайнер рівнів старить деталь одним повзунком, а не новою текстурою: свіжа біля крамниць, стара на вітряному пірсі. It comes back: Повзунок Wear додасть зношеності всій твоїй набережній у День 44 і району 2 у День 52, а wear_map.md знадобиться в обидва ці дні.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-14-texture-painting-and-wear exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (SM_QuayEdge_4m: сольова лінія й стерта бровка (спільні з уроками)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Відкрий M_Master. Додай Texture Sample (тримай T, клацни), Convert to Parameter, назви його WearMask і в Texture вибери Black. Додай TexCoord (тримай U, клацни) з Coordinate Index 1 і з'єднай його з UVs у WearMask. Попередній перегляд чорний.\n   2. Тримай S і клацни — з'явиться Scalar Parameter. Назви його Wear (0). Додай Multiply: R від WearMask, помножений на Wear. Це кількість зношеності. З'являється новий вузол Multiply.\n   3. Тримай V і клацни — з'явиться Vector Parameter WornColour (блідо-сірий). Тримай L і клацни — з'явиться Lerp: у A — Multiply з BaseColor і Tint, у B — WornColour, в Alpha — кількість зношеності. З'єднай його з Base Color. Нічого не змінюється, бо Wear дорівнює 0. [screenshot]\n   4. Додай Scalar Parameter WornRoughness (0.9) і другий Lerp: у A — Roughness, у B — WornRoughness, в Alpha — кількість зношеності. З'єднай його з Roughness. Apply і Save. Матеріал компілюється без помилок.\n   5. Клацни правою кнопкою на MI_Stone > Create Material Instance: MI_Stone_QuayEdge. Увімкни WearMask (T_QuayEdge_Wear) і Wear та признач інстанс у слот Stone на SM_QuayEdge_4m. Потягни Wear від 0 до 1. Сіль і стерті краї з'являються там, де їх намальовано.\n   6. Бровка причалу має слот Trim (Золото Дня 13)? Так само створи MI_Trim_QuayEdge з MI_Trim_Harbour, з тією самою маскою. Бровка теж старіє. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Вгадай вік: я ставлю трьом деталям таємні значення Wear. Тьютор вгадує кожне значення з мого скриншота. Бал мені, якщо похибка не більше 0.2. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\nIf I want to go deeper, recommend this free video: \"Scratch, Grime & Grunge Imperfections Textures In Unreal Engine 5 - Introduction & Master Material\" by BuildGamesWithJon: https://www.youtube.com/watch?v=jEGeqewASV8\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); File Explorer = Провідник; mesh = меш; vertex / edge / face = вершина / ребро / грань; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); UV unwrap / UV layout / seam / UV island = розгортка / розкладка / шов / UV-острівець; texel density / checker pattern = щільність текселів / шахівниця; level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; grey box placeholder = сірий блок (заглушка); material instance / child instance = інстанс / дочірній інстанс; material slot / node / pin = слот матеріалу / вузол / вхід; kit / kit piece / part of one object = набір / деталь / частина; map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; district / plot / plot plan = район / ділянка / план ділянки; harbour / quay / waterfront / pier = гавань / причал / набережна / пірс; shop front / shop window = фасад крамниці / вітрина; wear / worn edges / salt line = зношеність / стерті краї / сольова лінія; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}], "handin": [{"en": "summary.md", "uk": "summary.md (звіт дня)"}, {"en": "quaykit_day14.blend, resources packed (proof)", "uk": "quaykit_day14.blend із запакованими ресурсами (доказ)"}, {"en": "wear_map.md: your Wear values and Friday's plan (→ Day 44)", "uk": "wear_map.md (твої значення Wear і план на п'ятницю) (→ День 44)"}, {"en": "before_after_day14.png: Wear 0 and your values, same view (proof)", "uk": "before_after_day14.png (Wear 0 і твої значення, той самий ракурс) (доказ)"}], "goal": {"en": "By the end of today the quay edge and the pier deck have painted wear masks. A Wear slider in M_Master ages each from new (0) to old (1) in L_KitTest.", "uk": "До кінця дня край причалу й настил пірса мають намальовані маски зношеності. Повзунок Wear у M_Master старить кожну з цих деталей у L_KitTest від нової (0) до старої (1)."}, "uses": [{"en": "Day 11: your kit's UVs in quaykit_day11.blend (the first UV map stays as it is)", "uk": "День 11: UV твого набору в quaykit_day11.blend (перша UV-розгортка лишається як є)"}, {"en": "Day 12: M_Master and its instances MI_Stone and MI_Wood", "uk": "День 12: M_Master та його інстанси MI_Stone і MI_Wood"}, {"en": "Day 13: MI_Trim_Harbour, and the Trim slot on your quay coping if you did Day 13's Gold", "uk": "День 13: MI_Trim_Harbour і слот Trim на бровці причалу, якщо Золото Дня 13 виконано"}], "quiz": [{"q": {"en": "Why does painting need a second UV map?", "uk": "Навіщо для малювання друга UV-розгортка?"}, "options": [{"en": "Unreal can only read two maps", "uk": "Unreal може читати лише дві розгортки"}, {"en": "The first map has too many triangles", "uk": "Перша розгортка має забагато трикутників"}, {"en": "Each spot needs its own pixels, so islands must sit inside the square with no overlaps", "uk": "Кожній точці потрібні власні пікселі, тож острівці мають лежати всередині квадрата без перекриттів"}, {"en": "Second maps are brighter", "uk": "Другі розгортки яскравіші"}], "answer": 2, "explain": {"en": "Your Day 11 map lets islands overlap and run outside the square, which is fine for tiling. A mask needs a unique spot for every part of the model.", "uk": "Твоя розгортка з Дня 11 дозволяє острівцям перекриватися й виходити за квадрат, і для тайлінгу це нормально. Масці потрібне унікальне місце для кожної частини моделі."}}, {"q": {"en": "You painted salt on the quay edge, closed Blender, and the next day the paint is gone. What happened?", "uk": "Сіль на краю причалу намальовано, Blender закрито, а наступного дня розпису немає. Що сталося?"}, "options": [{"en": "The FBX was too big", "uk": "FBX був завеликий"}, {"en": "Unreal deleted the UV map", "uk": "Unreal видалив UV-розгортку"}, {"en": "Smart UV Project erases paint", "uk": "Smart UV Project стирає розпис"}, {"en": "The image was never saved or packed: unsaved images live only in memory", "uk": "Зображення не збережено й не запаковано: незбережені зображення живуть лише в пам'яті"}], "answer": 3, "explain": {"en": "A painted image is not part of the .blend until you save it or pack it. Save, pack, then save the file.", "uk": "Намальоване зображення не є частиною .blend, доки ти його не збережеш або не запакуєш. Збережи, запакуй, потім збережи файл."}}, {"q": {"en": "In M_Master, what does the Lerp do with the wear amount?", "uk": "Що робить Lerp у M_Master з кількістю зношеності?"}, "options": [{"en": "It blends from the clean colour (A) to the worn colour (B) by the amount in Alpha", "uk": "Змішує чистий колір (A) зі зношеним (B) за значенням в Alpha"}, {"en": "It adds triangles where the wear is", "uk": "Додає трикутники там, де є зношеність"}, {"en": "It turns the mask into collision", "uk": "Перетворює маску на колізію"}], "answer": 0, "explain": {"en": "At wear amount 0 you get the clean colour; at 1, the worn colour. Values between mix the two.", "uk": "При кількості зношеності 0 виходить чистий колір, при 1 — зношений. Значення між ними змішують обидва."}}, {"q": {"en": "At Wear 1 your whole wall turns pale grey, not just the bottom. What is the likely cause?", "uk": "При Wear 1 уся стіна стає блідо-сірою, а не лише низ. Яка найімовірніша причина?"}, "options": [{"en": "Wear must never go above 0.5", "uk": "Wear ніколи не має перевищувати 0.5"}, {"en": "WearMask reads UV channel 0 instead of 1, or the mask is white everywhere", "uk": "WearMask читає UV-канал 0 замість 1, або маска скрізь біла"}, {"en": "The wall has no collision", "uk": "Стіна не має колізії"}, {"en": "The sun is too high", "uk": "Сонце надто високо"}], "answer": 1, "explain": {"en": "The mask should be mostly black. Check its TexCoord uses Coordinate Index 1 and that the painted image is mostly black.", "uk": "Маска має бути здебільшого чорною. Перевір, чи TexCoord маски має Coordinate Index 1 і чи намальоване зображення здебільшого чорне."}}, {"q": {"en": "Which piece should get the highest Wear?", "uk": "Якій деталі потрібен найвищий Wear?"}, "options": [{"en": "A wall in a sheltered back street", "uk": "Стіні в захищеному тихому провулку"}, {"en": "A new shop front by the square", "uk": "Новому фасаду крамниці біля площі"}, {"en": "The quay edge where waves splash and ropes rub", "uk": "Краю причалу, де б'ють хвилі й труться мотузки"}], "answer": 2, "explain": {"en": "Wear follows its cause. The quay edge meets water, salt and boats every day.", "uk": "Зношеність іде за своєю причиною. Край причалу щодня зустрічає воду, сіль і човни."}}], "weekInfo": {"week": 3, "title": {"en": "Surfaces", "uk": "Поверхні"}, "goal": {"en": "By Friday you have your whole harbour kit unwrapped at one texel density, textured with M_Master instances and a trim sheet, weathered with painted wear masks and a Wear slider, and shown beside real harbour photos.", "uk": "До п'ятниці весь твій набір для гавані має розгортку з однією щільністю текселів, інстанси M_Master і трим-шит, а також зношеність із намальованих масок і повзунок Wear. Набір показано поруч зі справжніми фото гавані."}, "skills": [{"en": "UV unwrapping with clean seams and consistent texel density for modular kits", "uk": "UV-розгортка з акуратними швами й однаковою щільністю текселів для модульних наборів"}, {"en": "PBR material authoring: master materials and material instances in Unreal Engine 5", "uk": "Створення PBR-матеріалів: майстер-матеріали та інстанси матеріалів в Unreal Engine 5"}, {"en": "Trim sheet design and UV layout for modular environment kits", "uk": "Дизайн трим-шитів і UV-розкладка для модульних наборів оточення"}, {"en": "Texture painting and parameter-driven weathering (wear masks on a second UV channel)", "uk": "Малювання текстур і зношеність, керована параметрами (маски зношеності на другій UV-розгортці)"}, {"en": "Look-development review against real photo reference", "uk": "Огляд вигляду (look development) за справжніми фото-референсами"}]}, "morning": {"sofar": {"en": "You have a textured harbour kit, a trim sheet and your first shop front, SM_ShopFront_A, standing in L_KitTest.", "uk": "У тебе є текстурований набір для гавані, трим-шит і перший фасад крамниці, SM_ShopFront_A, який стоїть у L_KitTest."}, "today": {"en": "You paint salt, sun and edge wear onto the quay edge and the pier deck, and add a Wear slider to M_Master that ages each piece from new to old.", "uk": "Сьогодні ти малюєш на краї причалу й настилі пірса сліди солі, сонця й стерті краї та додаєш до M_Master повзунок Wear, який веде кожну деталь від нової до старої."}, "cheer": {"en": "Wear asks for observation, not perfection: look at your photos, paint a little, and look again.", "uk": "Зношеність вимагає спостережливості, а не досконалості: подивися на фото, трохи помалюй і подивися знову."}, "quote": {"text": {"en": "A work-room should be like an old shoe; no matter how shabby, it's better than a new one.", "uk": "Робоча кімната має бути як старий черевик: хай яка вона пошарпана, вона все одно краща за нову."}, "author": {"en": "Willa Cather", "uk": "Вілла Кезер"}, "source": "https://en.wikiquote.org/wiki/Willa_Cather"}}, "hasAssets": false, "workPath": "Work\\Assignment\\Day-14-texture-painting-and-wear", "mapHref": "../../COURSE.html", "prevHref": "../Day-13-trim-sheet-and-shop-front/START-HERE.html", "nextHref": "../Day-15-boss-weathered-kit/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Blender and Unreal Engine 5.8. I am a beginner on Day 14. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me and don't write code.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: SM_PierDeck_4m, його дочірній інстанс і твої значення Wear, самостійно.\nIt's part of: Маски зношеності, намальовані в Blender, і повзунок Wear на інстансах набору (L_KitTest: край причалу й настил пірса. У п'ятницю зношеність отримають ще дві деталі.).\nWhy it matters: Нова фарба й чистий камінь з повітря виглядають як іграшка. Намальована маска каже, де лежить зношеність, а повзунок Wear — скільки її. Тоді дизайнер рівнів старить деталь одним повзунком, а не новою текстурою: свіжа біля крамниць, стара на вітряному пірсі. It comes back: Повзунок Wear додасть зношеності всій твоїй набережній у День 44 і району 2 у День 52, а wear_map.md знадобиться в обидва ці дні.\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-14-texture-painting-and-wear (on the drive I chose on Day 0).\nWhat I already know: День 11: UV твого набору в quaykit_day11.blend (перша UV-розгортка лишається як є); День 12: M_Master та його інстанси MI_Stone і MI_Wood; День 13: MI_Trim_Harbour і слот Trim на бровці причалу, якщо Золото Дня 13 виконано; today's lessons: Друга UV-розгортка для малювання; Читання зношеності й малювання солі, сонця й країв; Збереження, пакування й дві UV-розгортки в Unreal; Повзунок Wear у M_Master. Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- Кожна розмальована деталь отримує другу UV-розгортку з назвою Paint (Smart UV Project: острівці всередині квадрата, без перекриттів). Перша розгортка лишається точно такою, як була.\n- Маска 1024 × 1024 на кожну деталь, T_<Piece>_Wear. Маска — це чорно-біле зображення: білий означає зношене, чорний — чисте.\n- Сольові патьоки піднімаються на 10–40 см над ватерлінією (Z -1, на 1 м нижче верху настилу) на боці причалу, що дивиться на воду. Нижні 2 м лишаються чистими: вони під водою.\n- Вигорання на верхніх поверхнях і стерті краї на кутах і на лініях, де ходять люди. Більша частина кожної маски лишається чорною.\n- M_Master отримує чотири нові параметри: WearMask (читається з UV-каналу 1, розгортки Paint), Wear (від 0 до 1), WornColour і WornRoughness.\n- Дочірній інстанс для головного слота кожної деталі, MI_Stone_QuayEdge і MI_Wood_PierDeck, кожен із власними WearMask і Wear.\n- Кожне намальоване зображення збережено як PNG і запаковано в .blend перед експортом. В Unreal на кожному розмальованому меші вимкнено Generate Lightmap UVs.\n\nMy checklist (the same numbers show on my course page):\n1. Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: quaykit_day14.blend з розгорткою Paint і T_QuayEdge_Wear.png. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. M_Master має параметри зношеності, а MI_Stone_QuayEdge створено. (from lesson 1)\n2. Відкрий два фото старих дерев'яних настилів з Wikimedia Commons і додай їх у credits.md. Знайди, де вони зношені: лінія, де ходять люди, краї, об які труться човни, і вигорілий верх. Перевірка: ти можеш показати три сліди зношеності й назвати причину кожного. (from lesson 2)\n3. SM_PierDeck_4m, у quaykit_day14.blend: додай UV-розгортку з назвою Paint і зроби для неї Smart UV Project, як в уроці 1. Перевірка: в UV Editor острівці Paint лежать усередині квадрата без перекриттів, а перша розгортка не змінилася. (from lesson 1)\n4. У вкладці Texture Paint створи нове зображення T_PierDeck_Wear: 1024 × 1024, чорне, без прапорця Alpha, на розгортці Paint. Перевірка: настил стає чорним. (from lesson 1)\n5. Малюй м'яким білим пензлем: легке вигорання на верху і м'яку зношену смугу вздовж лінії, де ходять люди. Додай стерті краї там, де труться човни. Чорним прибери все, що схоже на рівні смуги. Перевірка: смуга м'яка й нерівна, не як під лінійку. (from lesson 2)\n6. Одразу збережи зображення: Image > Save As, T_PierDeck_Wear.png у робочу папку дня. Перевірка: біля меню Image немає зірочки (*). (from lesson 3)\n7. File > External Data > Pack Resources, потім File > Save. Закрий Blender і двічі клацни на quaykit_day14.blend. Перевірка: SM_QuayEdge_4m і SM_PierDeck_4m є в Outliner, і обидві маски досі показують розпис. (from lesson 3)\n8. Експортуй SM_PierDeck_4m з блоками UCX поверх його FBX і зроби Reimport в Unreal. У його Static Mesh Editor Generate Lightmap UVs має бути вимкнено, як в уроці 3. Перевірка: FBX має 10 КБ або більше, а UV > UV Channel 1 показує розкладку Paint. (from lesson 3)\n9. Імпортуй T_PierDeck_Wear.png у Course/Day14. Перевірка: текстура є в Content Browser і має 1024 × 1024 (наведи мишу). (from lesson 3)\n10. Створи MI_Wood_PierDeck: клацни правою кнопкою на MI_Wood > Create Material Instance. Увімкни WearMask (T_PierDeck_Wear) і Wear та признач інстанс у слот Wood настилу в Static Mesh Editor. Помилка про тип семплера? Відкрий текстуру маски й увімкни прапорець sRGB. Перевірка: коли тягнеш Wear від 0 до 1, настил старіє. (from lesson 4)\n11. Задай WornColour за своїми фото: блідий сольовий сірий на MI_Stone_QuayEdge, сріблясто-сірий на MI_Wood_PierDeck. WornRoughness 0.9 на обох. Перевірка: при Wear 1 зношені місця виглядають сухими й вигорілими, а не брудними. (from lesson 4)\n12. Вибери Wear за тим, наскільки деталь відкрита негоді: край причалу й настил пірса — 0.7–0.8 (хвилі, сіль і човни). Запиши обидва значення у wear_map.md, а також план на п'ятницю: стіна з дверима 0.5, фасад крамниці 0.4. Перевірка: з 10 м набір виглядає вживаним, а не брудним. (from lesson 4)\n13. Зроби скриншот і збережи як before_after_day14.png: L_KitTest з одного ракурсу, з усіма Wear на 0 і з твоїми значеннями, поруч. Перевірка: сьогоднішній знімок-доказ лежить у робочій папці дня, а сіль видно трохи вище води. (from lesson 4)\n14. Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: кожна назва зі списку є в папці, у кожної є розмір. (from day 0, lesson 1)\n\nHow to help: ask which step number I'm on, then give me only the next step: the exact clicks and what I should see. When I send a screenshot, compare it with my reference, my sizes and the spec, and name one thing to fix at a time.\nCheck every save and export by reopening it before we move on:\n- a .blend: close Blender, double-click the file in today's day work folder (GAD\\Day-14-texture-painting-and-wear), and the model is there (an empty grid means the wrong file was saved)\n- a .md or .txt: open it with Notepad; the text is there, and the name doesn't end in .md.txt\nWhen I write \"готово\", and in any case before the day ends, check with me one item at a time (yes/no): each spec point, then each file on my hand-in list, ready in my day work folder (skip summary.md: the day report writes it next):\n1. quaykit_day14.blend із запакованими ресурсами (доказ)\n2. wear_map.md (твої значення Wear і план на п'ятницю) (→ День 44)\n3. before_after_day14.png (Wear 0 і твої значення, той самий ракурс) (доказ)\nFinish with a short list of anything missing, and one line on where this work comes back and what it will look like there. Then tell me the order for the end of the day: first the day report (the Copy the day report button at the bottom of my course page) into summary.md, and only then hand in all the files on the list, summary.md too.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; checklist = чек-лист; reference photo / hero photo = фото-референс / ключове фото; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); File Explorer = Провідник; mesh = меш; grid = сітка (тільки grid, ніколи mesh); vertex / edge / face = вершина / ребро / грань; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); UV unwrap / UV layout / seam / UV island = розгортка / розкладка / шов / UV-острівець; texel density / checker pattern = щільність текселів / шахівниця; level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; collision / UCX collision box = колізія / блок UCX; grey box placeholder = сірий блок (заглушка); material instance / child instance = інстанс / дочірній інстанс; material slot / node / pin = слот матеріалу / вузол / вхід; kit / kit piece / part of one object = набір / деталь / частина; map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; district / plot / plot plan = район / ділянка / план ділянки; harbour / quay / waterfront / pier = гавань / причал / набережна / пірс; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; shop front / shop window = фасад крамниці / вітрина; wear / worn edges / salt line = зношеність / стерті краї / сольова лінія; vista / blockout / landmark = панорама / блокаут / орієнтир; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; hero shot = головний кадр (hero shot); proof (picture) = доказ.\n\nStart by asking for my best reference photo. Then, one at a time, my sizes and my step number.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imp function setLang(l){lang=l;try{localStorage.setItem('devteam:lang',lang)}catch(e){};render()}
function toggleLang(){setLang(lang==='uk'?'en':'uk')}
/* keep open sections and keyboard focus across re-renders */
const openD=new Set();
function tg(e){if(e.open)openD.add(e.id);else openD.delete(e.id)}
const op=id=>openD.has(id)?' open':'';
function render(){const ae=document.activeElement,fid=ae&&(ae.id||(ae.getAttribute('data-th')?'th-'+ae.getAttribute('data-th'):ae.getAttribute('lang')&&ae.closest('.seg')?'lg-'+ae.getAttribute('lang'):''));
 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);
 const b=D.build,P=Math.round(prog()*100);
 document.getElementById('top').innerHTML='<div class="topin glass"><a class="maplink" href="'+esc(D.mapHref)+'">'+kn('map')+u('map')+'</a><div class="crumb"><b>'+esc(x(D.learnerName))+'</b><span>'+u('week')+' '+D.week+'</span><span>'+u('day')+' '+D.day+' '+u('of')+' '+D.total+'</span></div>'+controls(lang,'setLang')+'</div><div class="tline"><i style="width:'+P+'%"></i></div>';
 const state=w=>w<D.week?'b':w===D.week?'n':'p';
 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 let wk='';if(D.weekInfo){const w=D.weekInfo;wk='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}
 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p>'+(b.next?'<div class="back well">'+kn('arrow')+'<div><b>'+u('comes')+'</b><br>'+lk(x(b.next))+'</div></div>':'')+'<div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.assetFiles&&D.assetFiles.length?'<p class="files">'+ic('folder')+'<span>'+u('filesL')+' '+D.assetFiles.map(f=>'<a href="assets/'+encodeURIComponent(f)+'" target="_blank" rel="noopener">'+esc(f)+'</a>').join(', ')+'</span></p>':D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+=handinCard();h+=beforeCard();
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div><label class="rcpt" for="r'+i+'"><span class="eyebrow">'+u('rcpt')+'</span><textarea id="r'+i+'" rows="2" placeholder="'+esc(u('rcptPh'))+'" oninput="st.r'+i+'=this.value;save()">'+esc(st['r'+i]||'')+'</textarea></label>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+hList()+chkList()+(hasClip?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<h3>1 · '+u('copyR')+'</h3><p class="muted">'+u('report')+'</p><div class="row"><button class="btn ghost" onclick="cp(reportText())">'+ic('copy')+u('copyR')+'</button></div><h3>2 · '+u('ship')+'</h3>'+hf()+'<p class="muted" style="margin:12px 0 0">'+u('hNote')+'</p></section>';
 h+=qCard();h+=wk;
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();
</script>

<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 32</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

/* the Done switch */
.sw{display:inline-flex;align-items:center;gap:12px;border:0;background:transparent;cursor:pointer;font:600 14px/1 var(--head);color:var(--muted);min-height:50px;padding:0 6px}

details{margin-top:22px;border-radius:20px;background:var(--well);box-shadow:var(--press);padding:0 18px}

.check input::after{content:"";width:10px;height:5px;border:solid #fff;border-width:0 0 2.2px 2.2px;transform:rotate(-45deg) translate(1px,-1px);opacity:0}

.check .ln{font:600 10.5px/1.3 var(--head);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);white-space:nowrap;margin-top:5px;padding:4px 9px;border-radius:999px;background:var(--well);box-shadow:var(--press)}

.opt:hover:not([disabled]){transform:translateY(-1px);color:var(--accT)}
.opt.right{box-shadow:var(--press);background:var(--okBg);border-color:rgba(74,222,128,.45)}.opt.right .lt{background:var(--okL);color:#fff;box-shadow:0 0 10px var(--okL)}.opt.right .mk{color:var(--ok)}

.exp{margin:10px 0 0 50px;font-size:15.5px;color:var(--muted)}

.score{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:32px;padding:18px 20px;border-radius:24px}

#toast{position:fixed;left:50%;bottom:28px;z-index:9;transform:translateX(-50%) translateY(16px);background:rgba(30,33,46,.82);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:#f4f5fa;border:1px solid rgba(255,255,255,.14);padding:13px 24px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none;font:600 14px/1.4 var(--head);max-width:min(92vw,560px);text-align:center;box-shadow:0 20px 40px -14px rgba(0,0,0,.5),0 0 24px var(--glow)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

 body{font-size:16.5px}

<script id="data" type="application/json">{"learner": "ib-ivan-9ac02175", "learnerName": {"en": "Ivan", "uk": "Іван"}, "day": 32, "week": 7, "total": 60, "title": {"en": "Island-scale light and haze, landmarks and vistas", "uk": "Світло й серпанок у масштабі острова, орієнтири й панорами"}, "theme": {"en": "Week 7: Roads, the big world and a first forest", "uk": "Тиждень 7: Дороги, великий світ і перший ліс"}, "build": {"item": {"en": "One island light recipe (sun, Lumen, sky, haze, clouds and locked exposure), three landmarks blocked out at true size where your map puts them, and three vista cameras along the scenic route", "uk": "Один рецепт острівного світла (сонце, Lumen, небо, серпанок, хмари й зафіксована експозиція), три орієнтири в грубих формах у справжньому розмірі там, де їх ставить твоя мапа, і три камери панорам уздовж мальовничого маршруту"}, "why": {"en": "At island scale, light and air do half the work: a low sun shapes the hills, and haze that grows with distance tells the eye how big the island is. Landmarks tell a viewer, or a pilot, where they are: a lighthouse, a church tower, a lone pine on a ridge. Vistas are the moments where the route opens and the island shows itself. Studios plan these early, because every later shot and the final flight are built around them.", "uk": "У масштабі острова світло й повітря роблять половину роботи: низьке сонце ліпить пагорби, а серпанок, що густішає з відстанню, підказує оку, який великий острів. Орієнтири кажуть глядачеві чи пілотові, де він: маяк, церковна вежа, самотня сосна на хребті. Панорами — це моменти, коли маршрут розкривається й острів показує себе. Студії планують їх рано, бо всі подальші кадри й фінальний політ будуються довкола них."}, "where": {"en": "L_Island: the whole island for the light; three landmarks from your map and photos (for example a lighthouse on a headland, a church tower in district 2, a lone tree on the ridge); three vista points along your scenic route.", "uk": "L_Island: увесь острів — для світла; три орієнтири з твоєї мапи й фото (наприклад, маяк на мисі, церковна вежа в районі 2, самотнє дерево на хребті); три точки панорам уздовж твого мальовничого маршруту."}, "spec": [{"en": "island_light_recipe.md, grown from your Day 30 sky_recipe.md (save a copy under the new name and add to it): the sun's rotation, the Sky Light (Real Time Capture on), Sky Atmosphere, Exponential Height Fog, Volumetric Cloud and the locked exposure, all as numbers, so anyone could rebuild the light.", "uk": "island_light_recipe.md, що виростає з твого sky_recipe.md з Дня 30 (збережи копію під новою назвою й доповнюй її): поворот сонця, Sky Light (Real Time Capture увімкнено), Sky Atmosphere, Exponential Height Fog, Volumetric Cloud і зафіксована експозиція, усе числами, щоб будь-хто міг відтворити світло."}, {"en": "Lumen on for light and reflections (Project Settings), checked, not changed.", "uk": "Lumen увімкнений для світла й відбиттів (Project Settings): перевірено, не змінено."}, {"en": "Haze that softens the coast 1 km away but keeps its shape; the near sea is never milky.", "uk": "Серпанок, що пом'якшує берег за 1 км, але зберігає його форму; близьке море ніколи не стає молочним."}, {"en": "Exposure locked with your Day 30 Post Process Volume (Infinite Extent ticked, Min EV100 = Max EV100), retuned for the island light; no second volume.", "uk": "Експозиція зафіксована твоїм Post Process Volume з Дня 30 (Infinite Extent увімкнено, Min EV100 = Max EV100), переналаштована під острівне світло; жодного другого volume."}, {"en": "Three landmarks blocked out at true size with basic shapes or your own kit: for example a lighthouse 15 to 25 m tall, a tower 20 to 30 m or a lone tree about 15 m. Each has a clear outline against sky or sea and stands on its map spot. landmarks.md lists each one's height and why it is there.", "uk": "Три орієнтири в грубих формах у справжньому розмірі з простих фігур або твого власного набору: наприклад, маяк заввишки 15–25 м, вежа 20–30 м або самотнє дерево близько 15 м. Кожен має чіткий силует на тлі неба чи моря й стоїть на своєму місці на мапі. landmarks.md містить висоту кожного й пояснення, чому він там."}, {"en": "Three Cine Cameras V1, V2 and V3 on the scenic route, 16:9, locked; each frames a landmark with a foreground, a middle and a far background; every landmark is seen from at least two vistas.", "uk": "Три Cine Cameras V1, V2 і V3 на мальовничому маршруті, 16:9, заблоковані; кожна кадрує орієнтир із переднім, середнім і далеким заднім планом; кожен орієнтир видно щонайменше з двох панорам."}, {"en": "stat unit read with and without the clouds; both GPU numbers in the recipe.", "uk": "stat unit зчитаний із хмарами й без них; обидва числа GPU записані в рецепті."}], "piece1": "the island light recipe", "piece2": {"en": "The landmarks and the three vistas, on your own", "uk": "Орієнтири й три панорами, самостійно"}, "steps": [{"text": {"en": "First save a copy of sky_recipe.md as island_light_recipe.md. Pilot your Day 30 camera CAM_Island_C3 and take a 'before' screenshot. Open Window > Env. Light Mixer and check L_Island has a sun, Sky Light, Sky Atmosphere, Exponential Height Fog and Volumetric Cloud; create any that are missing. Check: all five show in the mixer.", "uk": "Спершу збережи копію sky_recipe.md як island_light_recipe.md. Візьми керування (Pilot) своєю камерою CAM_Island_C3 з Дня 30 і зроби скріншот «до». Відкрий Window > Env. Light Mixer і перевір, що в L_Island є сонце, Sky Light, Sky Atmosphere, Exponential Height Fog і Volumetric Cloud; створи ті, яких бракує. Перевірка: усі п'ять видно в мікшері."}, "lesson": 1}, {"text": {"en": "Check Lumen in Project Settings and tick Real Time Capture on the Sky Light. Check: the shaded sides of hills show soft, bluish light, not black.", "uk": "Перевір Lumen у Project Settings і увімкни Real Time Capture на Sky Light. Перевірка: на затінених боках пагорбів м'яке синювате світло, а не чорнота."}, "lesson": 1}, {"text": {"en": "Set the sun for your place's best hour (25 to 35 degrees high), matched to your reference photos. Check: from high up, every hill has a lit side and a shaded side.", "uk": "Постав сонце на найкращу годину для твого місця (25–35 градусів над обрієм), звіривши з референсними фото. Перевірка: згори в кожного пагорба є освітлений і затінений бік."}, "lesson": 1}, {"text": {"en": "Retune the exposure lock on your Day 30 Post Process Volume (Min EV100 = Max EV100, always the same value) until the brightness matches your photos; don't add a second volume. Check: flying from the open sea into a valley no longer changes the brightness.", "uk": "Переналаштуй фіксацію експозиції на своєму Post Process Volume з Дня 30 (Min EV100 = Max EV100, завжди однакове значення), поки яскравість не збігатиметься з твоїми фото; не додавай другого volume. Перевірка: політ із відкритого моря в долину більше не змінює яскравості."}, "lesson": 1}, {"text": {"en": "Tune the haze with the Height Fog and the Sky Atmosphere until the coast 1 km away is softer and bluer than the near coast. Check: the far coast keeps its shape and the near sea is not milky.", "uk": "Налаштуй серпанок за допомогою Height Fog і Sky Atmosphere, поки берег за 1 км не стане м'якшим і синішим за близький берег. Перевірка: далекий берег зберігає форму, а близьке море не молочне."}, "lesson": 2}, {"text": {"en": "Read stat unit with the clouds hidden and shown, and write every number in island_light_recipe.md. Check: the recipe lists every light value and the clouds' GPU cost in ms.", "uk": "Зчитай stat unit із прихованими й показаними хмарами й запиши кожне число в island_light_recipe.md. Перевірка: у рецепті є кожне значення світла й вартість хмар для GPU в мс."}, "lesson": 2}, {"text": {"en": "Choose three landmarks from your map and photos and write landmarks.md (what, where, height, why). Check: each landmark has a map spot and a height.", "uk": "Вибери три орієнтири зі своєї мапи й фото і напиши landmarks.md (що, де, висота, чому). Перевірка: у кожного орієнтира є місце на мапі й висота."}, "lesson": 3}, {"text": {"en": "Block out the three landmarks at true size and put each on its spot. Check: from 1 km away, each shows as a clear shape against sky or sea.", "uk": "Збудуй три орієнтири в грубих формах у справжньому розмірі й постав кожен на його місце. Перевірка: з відстані 1 км кожен видно як чітку форму на тлі неба чи моря."}, "lesson": 3}, {"text": {"en": "Mark them on a copy of the map as landmarks_map.png. Check: the three landmarks are spread across the island, not bunched together.", "uk": "Познач їх на копії мапи як landmarks_map.png. Перевірка: три орієнтири розкидані по острову, а не скупчені разом."}, "lesson": 3}, {"text": {"en": "Place, set and lock V1, V2 and V3 on the scenic route, each framing a landmark with a foreground, a middle and a far background. Check: every landmark shows in at least two of the three vistas.", "uk": "Постав, налаштуй і заблокуй V1, V2 і V3 на мальовничому маршруті, кожну з орієнтиром у кадрі й переднім, середнім і далеким заднім планом. Перевірка: кожен орієнтир видно щонайменше у двох із трьох панорам."}, "lesson": 4}, {"text": {"en": "HighResShot 1920x1080 from V1, V2 and V3; in Krita put each beside a reference photo in vista_board.png. Check: the board shows three labelled pairs.", "uk": "HighResShot 1920x1080 з V1, V2 і V3; у Krita постав кожен кадр поруч із референсним фото у vista_board.png. Перевірка: на борді три підписані пари."}, "lesson": 4}, {"text": {"en": "Before/after capture: CAM_Island_C3 before and after the light recipe; then a 60-second clip along the scenic route at your recipe's light. Check: before_after_day32.png and flythrough_day32.mp4 are saved.", "uk": "Знімок до/після: CAM_Island_C3 до й після рецепта світла; потім 60-секундне відео вздовж мальовничого маршруту зі світлом за твоїм рецептом. Перевірка: before_after_day32.png і flythrough_day32.mp4 збережені."}, "lesson": "D31.4"}], "assets": ["island12/picture-brief-standard.md"]}, "lessons": [{"title": {"en": "Light for a whole island: sun, sky light and Lumen", "uk": "Світло для цілого острова: сонце, Sky Light і Lumen"}, "minutes": 40, "goals": [{"en": "Explain Lumen: Unreal's real-time light that bounces off surfaces and lights the shade, so shaded places look right at once, with nothing to pre-calculate.", "uk": "Пояснити Lumen: світло Unreal у реальному часі, що відбивається від поверхонь і освітлює тінь, тож затінені місця одразу виглядають правильно, без жодних попередніх розрахунків."}, {"en": "Set the sun for island scale: a low sun (25 to 35 degrees) shapes the hills and puts glints on the sea; a noon sun flattens everything.", "uk": "Поставити сонце для масштабу острова: низьке сонце (25–35 градусів) ліпить пагорби й дає відблиски на морі; полуденне сонце все сплющує."}, {"en": "Explain exposure (how bright the camera makes the picture) and retune your Day 30 lock, so every shot of the island repeats.", "uk": "Пояснити експозицію (наскільки яскравою камера робить картинку) й переналаштувати фіксацію з Дня 30, щоб кожен кадр острова повторювався."}], "doalong": [{"en": "Open Window > Env. Light Mixer. You see one row each for the sun (Directional Light), Sky Light, Sky Atmosphere, Height Fog and Volumetric Cloud; click Create for any that are missing.", "uk": "Відкрий Window > Env. Light Mixer. Ти бачиш по одному рядку для сонця (Directional Light), Sky Light, Sky Atmosphere, Height Fog і Volumetric Cloud; клікни Create для тих, яких бракує."}, {"en": "Open Edit > Project Settings, then Engine > Rendering, and find Dynamic Global Illumination Method and Reflection Method. You see Lumen in both; if not, set both to Lumen.", "uk": "Відкрий Edit > Project Settings, потім Engine > Rendering, і знайди Dynamic Global Illumination Method і Reflection Method. Ти бачиш Lumen в обох; якщо ні, встанови обидва на Lumen."}, {"en": "Select the Sky Light in the Outliner and tick Real Time Capture in Details. You see shaded slopes turn from dark grey to a soft, bluish light.", "uk": "Виділи Sky Light в Outliner і увімкни Real Time Capture в Details. Ти бачиш, як затінені схили з темно-сірих стають м'яко-синюватими."}, {"en": "Hold Ctrl+L and move the mouse to set the sun about 30 degrees high, from the side your best reference photos were lit. You see long shadows on the hills; write the sun's Rotation from Details.", "uk": "Затисни Ctrl+L і рухай мишею, щоб підняти сонце приблизно на 30 градусів з того боку, звідки освітлені твої найкращі референсні фото. Ти бачиш довгі тіні на пагорбах; запиши Rotation сонця з Details."}, {"en": "Select the Post Process Volume you placed on Day 30 (don't add a second one). Check that Infinite Extent (Unbound) is ticked; under Exposure change Min EV100 and Max EV100 together, always to the same value, until the island looks as bright as your photos. You see the brightness stay the same as you fly; write the value.", "uk": "Виділи Post Process Volume, який стоїть з Дня 30 (не додавай другого). Перевір, що Infinite Extent (Unbound) увімкнено; у розділі Exposure змінюй Min EV100 і Max EV100 разом, завжди на однакове значення, поки острів не стане таким яскравим, як на твоїх фото. Ти бачиш, що яскравість не змінюється під час польоту; запиши значення."}], "play": {"en": "Match the sun: the tutor describes the light in one of my reference photos (a low sun from the west, long shadows, bright glints); I set my sun and describe my screenshot until the tutor rates it 4 out of 5.", "uk": "Підбери сонце: тьютор описує світло на одному з моїх референсних фото (низьке сонце із заходу, довгі тіні, яскраві відблиски); я налаштовую своє сонце й описую свій скріншот, поки тьютор не оцінить його на 4 з 5."}, "video": {"url": "https://www.youtube.com/watch?v=fVg5ihB8Wdc", "title": "The 2025 Guide to Rendering in Unreal Engine 5", "channel": "William Faucher", "length": "13:05", "search": "unreal engine 5 rendering guide lumen"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Light for a whole island: sun, sky light and Lumen (Day 32, lesson 1 of 4).\nToday's build: One island light recipe (sun, Lumen, sky, haze, clouds and locked exposure), three landmarks blocked out at true size where your map puts them, and three vista cameras along the scenic route.\n\nBy the end of this lesson I can:\n1. Explain Lumen: Unreal's real-time light that bounces off surfaces and lights the shade, so shaded places look right at once, with nothing to pre-calculate.\n2. Set the sun for island scale: a low sun (25 to 35 degrees) shapes the hills and puts glints on the sea; a noon sun flattens everything.\n3. Explain exposure (how bright the camera makes the picture) and retune your Day 30 lock, so every shot of the island repeats.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (Your island has roads that follow the land, including a switchback climb that stays under a 10 % grade.), what I will learn today (You light the whole island with one recipe, add haze that shows distance, block out three landmarks and frame three vistas.), encourage me (Today light and haze make your island feel huge, so give yourself a moment to enjoy the view you created.), and share today's quote: \"The sky is the daily bread of the eyes.\" (Ralph Waldo Emerson).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 29: why must every point of a river be lower than the one before it? | Day 25: which four parts make up your planning pack?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Match the sun: the tutor describes the light in one of my reference photos (a low sun from the west, long shadows, bright glints); I set my sun and describe my screenshot until the tutor rates it 4 out of 5.\n6. Do-along on today's build (the island light recipe): guide me through these steps one at a time, checking a screenshot after each:\n   - Open Window > Env. Light Mixer. You see one row each for the sun (Directional Light), Sky Light, Sky Atmosphere, Height Fog and Volumetric Cloud; click Create for any that are missing.\n   - Open Edit > Project Settings, then Engine > Rendering, and find Dynamic Global Illumination Method and Reflection Method. You see Lumen in both; if not, set both to Lumen.\n   - Select the Sky Light in the Outliner and tick Real Time Capture in Details. You see shaded slopes turn from dark grey to a soft, bluish light.\n   - Hold Ctrl+L and move the mouse to set the sun about 30 degrees high, from the side your best reference photos were lit. You see long shadows on the hills; write the sun's Rotation from Details.\n   - Select the Post Process Volume you placed on Day 30 (don't add a second one). Check that Infinite Extent (Unbound) is ticked; under Exposure change Min EV100 and Max EV100 together, always to the same value, until the island looks as bright as your photos. You see the brightness stay the same as you fly; write the value.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"The 2025 Guide to Rendering in Unreal Engine 5\" by William Faucher: https://www.youtube.com/watch?v=fVg5ihB8Wdc\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Haze and clouds: showing how big the island is", "uk": "Серпанок і хмари: показати, який великий острів"}, "minutes": 40, "goals": [{"en": "Explain aerial perspective: real air makes far things lighter, bluer and softer, and that is how the eye judges distance.", "uk": "Пояснити повітряну перспективу: справжнє повітря робить далекі речі світлішими, синішими й м'якшими, і саме так око оцінює відстань."}, {"en": "Tune the Exponential Height Fog and the Sky Atmosphere so the far coast softens without turning the sea milky.", "uk": "Налаштувати Exponential Height Fog і Sky Atmosphere так, щоб далекий берег пом'якшувався, а море не ставало молочним."}, {"en": "Read what clouds and fog cost with stat unit, and write every number in a recipe.", "uk": "Зчитати вартість хмар і туману через stat unit і записати кожне число в рецепт."}], "doalong": [{"en": "Fly to 150 m over your harbour and look across the island to the far coast; press Ctrl+2 to bookmark the view. You see the near coast and the far coast in one picture.", "uk": "Підлети на 150 м над своєю гаванню й подивися через острів на далекий берег; натисни Ctrl+2, щоб зберегти закладку цього виду. Ти бачиш близький і далекий берег на одній картинці."}, {"en": "Select Exponential Height Fog; start from the Fog Density in your sky_recipe.md and raise it in small steps (0.005 at a time). You see the far coast fade while the near coast stays clear; stop when the far coast is softer but keeps its shape.", "uk": "Виділи Exponential Height Fog; почни з Fog Density зі свого sky_recipe.md і збільшуй її маленькими кроками (по 0.005). Ти бачиш, як далекий берег тьмяніє, а близький лишається чітким; зупинися, коли далекий берег м'якший, але зберігає форму."}, {"en": "Select Sky Atmosphere and raise Aerial Perspective View Distance Scale a little (for example from 1 to 2). You see the far hills turn lighter and bluer.", "uk": "Виділи Sky Atmosphere і трохи збільш Aerial Perspective View Distance Scale (наприклад, з 1 до 2). Ти бачиш, як далекі пагорби стають світлішими й синішими."}, {"en": "Press the ` key (left of 1) to open the console, type stat unit and press Enter. You see Frame, Game, Draw and GPU times in milliseconds (ms); write the GPU number.", "uk": "Натисни клавішу ` (ліворуч від 1), щоб відкрити консоль, введи stat unit і натисни Enter. Ти бачиш час Frame, Game, Draw і GPU в мілісекундах (мс); запиши число GPU."}, {"en": "Click the eye beside Volumetric Cloud in the Outliner to hide it, read GPU again, then show it. You see what the clouds cost; write both numbers and all your light values in island_light_recipe.md.", "uk": "Клікни око біля Volumetric Cloud в Outliner, щоб сховати хмари, знову зчитай GPU, потім покажи їх. Ти бачиш, скільки коштують хмари; запиши обидва числа й усі значення світла в island_light_recipe.md."}], "play": {"en": "Distance quiz: the tutor describes three screenshots ('the far hills as sharp as the near ones', 'everything past 500 m is white', 'the far coast a soft blue-grey'); I say which one has the right haze and which setting fixes the others.", "uk": "Вікторина відстані: тьютор описує три скріншоти («далекі пагорби такі ж різкі, як близькі», «усе далі за 500 м біле», «далекий берег м'яко-синьо-сірий»); я кажу, де правильний серпанок і яке налаштування виправляє інші."}, "video": {"url": "https://www.youtube.com/watch?v=SbxO-Z5rzwk", "title": "Tips for Sky Atmosphere & Fog - Unreal Engine 5 (& UE4)", "channel": "William Faucher", "length": "5:26", "search": "unreal engine 5 sky atmosphere fog tips"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Haze and clouds: showing how big the island is (Day 32, lesson 2 of 4).\nToday's build: One island light recipe (sun, Lumen, sky, haze, clouds and locked exposure), three landmarks blocked out at true size where your map puts them, and three vista cameras along the scenic route.\nEarlier today I already did: lesson 1 (Light for a whole island: sun, sky light and Lumen). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Explain aerial perspective: real air makes far things lighter, bluer and softer, and that is how the eye judges distance.\n2. Tune the Exponential Height Fog and the Sky Atmosphere so the far coast softens without turning the sea milky.\n3. Read what clouds and fog cost with stat unit, and write every number in a recipe.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Distance quiz: the tutor describes three screenshots ('the far hills as sharp as the near ones', 'everything past 500 m is white', 'the far coast a soft blue-grey'); I say which one has the right haze and which setting fixes the others.\n4. Do-along on today's build (the island light recipe): guide me through these steps one at a time, checking a screenshot after each:\n   - Fly to 150 m over your harbour and look across the island to the far coast; press Ctrl+2 to bookmark the view. You see the near coast and the far coast in one picture.\n   - Select Exponential Height Fog; start from the Fog Density in your sky_recipe.md and raise it in small steps (0.005 at a time). You see the far coast fade while the near coast stays clear; stop when the far coast is softer but keeps its shape.\n   - Select Sky Atmosphere and raise Aerial Perspective View Distance Scale a little (for example from 1 to 2). You see the far hills turn lighter and bluer.\n   - Press the ` key (left of 1) to open the console, type stat unit and press Enter. You see Frame, Game, Draw and GPU times in milliseconds (ms); write the GPU number.\n   - Click the eye beside Volumetric Cloud in the Outliner to hide it, read GPU again, then show it. You see what the clouds cost; write both numbers and all your light values in island_light_recipe.md.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Tips for Sky Atmosphere & Fog - Unreal Engine 5 (& UE4)\" by William Faucher: https://www.youtube.com/watch?v=SbxO-Z5rzwk\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Landmarks: how a viewer knows where they are", "uk": "Орієнтири: як глядач знає, де він"}, "minutes": 40, "goals": [{"en": "Explain a landmark: a tall or unusual thing seen from far away that tells people where they are; it is one of five things people read a place by (paths, edges, districts, meeting points and landmarks).", "uk": "Пояснити, що таке орієнтир: висока або незвичайна річ, видна здалеку, що каже людям, де вони; це одна з п'яти речей, за якими люди читають місце (шляхи, межі, райони, місця зустрічей і орієнтири)."}, {"en": "Size a landmark for 1 km: on a 1920 x 1080 screen, 1 m at 1 km is about 1 pixel, so a 20 m tower shows as about 20 pixels and a 3 m shelter as only 3.", "uk": "Підібрати розмір орієнтира для 1 км: на екрані 1920 x 1080 1 м на відстані 1 км — це приблизно 1 піксель, тож вежа 20 м виглядає як приблизно 20 пікселів, а укриття 3 м — лише як 3."}, {"en": "Place landmarks where they help: on headlands, ridges and the ends of roads, with an outline against sky or sea.", "uk": "Ставити орієнтири там, де вони допомагають: на мисах, хребтах і в кінці доріг, із силуетом на тлі неба чи моря."}], "doalong": [{"en": "Look through your reference photos and the map; list everything tall or unusual in your real place (a lighthouse, a church, a mast, a lone tree, a sea stack). You see a list of five or more candidates.", "uk": "Переглянь свої референсні фото й мапу; випиши все високе чи незвичайне у твоєму справжньому місці (маяк, церква, щогла, самотнє дерево, скеля-останець у морі). Ти бачиш список із п'яти чи більше кандидатів."}, {"en": "Pick three: one near each district and one on high ground between them. Write landmarks.md: what, where (x, y from the anel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Landmarks: how a viewer knows where they are (Day 32, lesson 3 of 4).\nToday's build: One island light recipe (sun, Lumen, sky, haze, clouds and locked exposure), three landmarks blocked out at true size where your map puts them, and three vista cameras along the scenic route.\nEarlier today I already did: lesson 1 (Light for a whole island: sun, sky light and Lumen); lesson 2 (Haze and clouds: showing how big the island is). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Explain a landmark: a tall or unusual thing seen from far away that tells people where they are; it is one of five things people read a place by (paths, edges, districts, meeting points and landmarks).\n2. Size a landmark for 1 km: on a 1920 x 1080 screen, 1 m at 1 km is about 1 pixel, so a 20 m tower shows as about 20 pixels and a 3 m shelter as only 3.\n3. Place landmarks where they help: on headlands, ridges and the ends of roads, with an outline against sky or sea.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Lost pilot: the tutor 'flies' over my island from my description and tells me where it would get lost; I add or move a landmark until it can always say where it is.\n4. Do-along on today's build (the island light recipe): guide me through these steps one at a time, checking a screenshot after each:\n   - Look through your reference photos and the map; list everything tall or unusual in your real place (a lighthouse, a church, a mast, a lone tree, a sea stack). You see a list of five or more candidates.\n   - Pick three: one near each district and one on high ground between them. Write landmarks.md: what, where (x, y from the map), height, and why there. You see three rows.\n   - Block out the first one at true size. For a lighthouse, drag a Cylinder from Place Actors > Shapes and set its Scale to 4, 4, 20 (4 m wide, 20 m tall). Add a Sphere on top and press End to drop it to the ground. You see a 20 m tower on its spot.\n   - Fly about 1 km away and look back. You see whether its outline reads against sky or sea; if it hides against a hill, move it or make it taller.\n   - Block out the other two the same way, with your own kit pieces where they fit. You see three landmarks on your island.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Landmarks 🇬🇧 [~LEVEL DESIGN #21]\" by Mina Pêcheux: https://www.youtube.com/watch?v=10cbOga7V_M\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Vistas: where the island shows itself", "uk": "Панорами: де острів показує себе"}, "minutes": 40, "goals": [{"en": "Explain a vista: a point on a route where the view opens up, framed with a foreground, a middle and a far background.", "uk": "Пояснити, що таке панорама: точка на маршруті, де відкривається вид, кадрований переднім, середнім і далеким заднім планом."}, {"en": "Use the island's own lines (the road, the coast, a river) to lead the eye to a landmark.", "uk": "Використовувати власні лінії острова (дорогу, берег, річку), щоб вести погляд до орієнтира."}, {"en": "Set, lock and shoot vista cameras: Pilot, a 16:9 filmback, Roll 0, then HighResShot 1920x1080.", "uk": "Ставити, блокувати й знімати камери панорам: Pilot, filmback 16:9, Roll 0, потім HighResShot 1920x1080."}], "doalong": [{"en": "Fly the scenic route from your map at 30 to 80 m. Mark three places where the view opens towards a landmark. You see three marks on the map.", "uk": "Пролети мальовничим маршрутом зі своєї мапи на висоті 30–80 м. Познач три місця, де відкривається вид на орієнтир. Ти бачиш три позначки на мапі."}, {"en": "In Place Actors open Cinematic and drag in a Cine Camera Actor; rename it V1. Right-click it > Pilot and fly to the first vista. You see the view through V1.", "uk": "У Place Actors відкрий Cinematic і перетягни Cine Camera Actor; перейменуй її на V1. Клікни її правою кнопкою > Pilot і підлети до першої панорами. Ти бачиш вид крізь V1."}, {"en": "In Details set the Filmback to a 16:9 preset and the Current Focal Length to 24 mm; put the landmark on a third line with something close in the foreground. Click the eject button (top left of the viewport) to stop piloting, then right-click V1 > Transform > Lock Actor Movement. You see V1 locked in place.", "uk": "У Details встанови Filmback на пресет 16:9 і Current Focal Length на 24 mm; постав орієнтир на лінію третин, а щось близьке — на передній план. Клікни кнопку eject (угорі ліворуч у в'юпорті), щоб припинити Pilot, потім клікни V1 правою кнопкою > Transform > Lock Actor Movement. Ти бачиш, що V1 заблокована на місці."}, {"en": "Make V2 and V3 the same way. You see three locked cameras on the route.", "uk": "Так само зроби V2 і V3. Ти бачиш три заблоковані камери на маршруті."}, {"en": "Pilot each camera, press G, open the console and type HighResShot 1920x1080. You see the files in IslandCourse/Saved/Screenshots/WindowsEditor; rename them island_V1.png to island_V3.png.", "uk": "Візьми керування (Pilot) кожною камерою, натисни G, відкрий консоль і введи HighResShot 1920x1080. Ти бачиш файли в IslandCourse/Saved/Screenshots/WindowsEditor; перейменуй їх на island_V1.png–island_V3.png."}], "play": {"en": "Vista judge: I describe each vista as foreground, middle and background; the tutor finds the weakest layer, and I fix it before the next round.", "uk": "Суддя панорам: я описую кожну панораму як передній, середній і задній план; тьютор знаходить найслабший шар, і я виправляю його до наступного раунду."}, "video": {"url": "https://www.youtube.com/watch?v=5NFlDfyYNck", "title": "8 TIPS That ACTUALLY Improve Your Drone Photography!", "channel": "Sightseeing Stan", "length": "12:30", "search": "drone photography composition tips"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Vistas: where the island shows itself (Day 32, lesson 4 of 4).\nToday's build: One island light recipe (sun, Lumen, sky, haze, clouds and locked exposure), three landmarks blocked out at true size where your map puts them, and three vista cameras along the scenic route.\nEarlier today I already did: lesson 1 (Light for a whole island: sun, sky light and Lumen); lesson 2 (Haze and clouds: showing how big the island is); lesson 3 (Landmarks: how a viewer knows where they are). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Explain a vista: a point on a route where the view opens up, framed with a foreground, a middle and a far background.\n2. Use the island's own lines (the road, the coast, a river) to lead the eye to a landmark.\n3. Set, lock and shoot vista cameras: Pilot, a 16:9 filmback, Roll 0, then HighResShot 1920x1080.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Vista judge: I describe each vista as foreground, middle and background; the tutor finds the weakest layer, and I fix it before the next round.\n4. Do-along on today's build (the island light recipe): guide me through these steps one at a time, checking a screenshot after each:\n   - Fly the scenic route from your map at 30 to 80 m. Mark three places where the view opens towards a landmark. You see three marks on the map.\n   - In Place Actors open Cinematic and drag in a Cine Camera Actor; rename it V1. Right-click it > Pilot and fly to the first vista. You see the view through V1.\n   - In Details set the Filmback to a 16:9 preset and the Current Focal Length to 24 mm; put the landmark on a third line with something close in the foreground. Click the eject button (top left of the viewport) to stop piloting, then right-click V1 > Transform > Lock Actor Movement. You see V1 locked in place.\n   - Make V2 and V3 the same way. You see three locked cameras on the route.\n   - Pilot each camera, press G, open the console and type HighResShot 1920x1080. You see the files in IslandCourse/Saved/Screenshots/WindowsEditor; rename them island_V1.png to island_V3.png.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"8 TIPS That ACTUALLY Improve Your Drone Photography!\" by Sightseeing Stan: https://www.youtube.com/watch?v=5NFlDfyYNck\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "island_light_recipe.md (every number, with the clouds' cost)", "uk": "island_light_recipe.md (кожне число, з вартістю хмар)"}, {"en": "landmarks.md and landmarks_map.png", "uk": "landmarks.md і landmarks_map.png"}, {"en": "island_V1.png, island_V2.png and island_V3.png (1920 x 1080)", "uk": "island_V1.png, island_V2.png і island_V3.png (1920 x 1080)"}, {"en": "vista_board.png (each vista beside a reference photo)", "uk": "vista_board.png (кожна панорама поруч із референсним фото)"}, {"en": "before_after_day32.png and flythrough_day32.mp4 (60 seconds along the scenic route)", "uk": "before_after_day32.png і flythrough_day32.mp4 (60 секунд уздовж мальовничого маршруту)"}, {"en": "summary.md", "uk": "звіт дня (summary.md)"}], "goal": {"en": "By the end of today you have L_Island lit by one written island light recipe, with haze that shows distance, three landmarks blocked out at true size, and three locked vista cameras that each frame a landmark.", "uk": "До кінця дня L_Island освітлений за одним записаним рецептом острівного світла, із серпанком, що показує відстань, трьома орієнтирами в грубих формах у справжньому розмірі й трьома заблокованими камерами панорам, кожна з яких кадрує орієнтир."}, "uses": [{"en": "Day 19: your light recipe and camera skills from the harbour corner", "uk": "День 19: твій рецепт світла й навички роботи з камерою з куточка гавані"}, {"en": "Day 30: sky_recipe.md, the Post Process Volume that locks exposure, and your locked drone cameras CAM_Island_C1 to CAM_Island_C3", "uk": "День 30: sky_recipe.md, Post Process Volume, що фіксує експозицію, і твої заблоковані камери дрона CAM_Island_C1–CAM_Island_C3"}, {"en": "Day 21: your reference photos of the real place", "uk": "День 21: твої референсні фото справжнього місця"}, {"en": "Day 22: island_map.png with the scenic route", "uk": "День 22: island_map.png із мальовничим маршрутом"}, {"en": "Day 31: the main road and the switchback climb", "uk": "День 31: головна дорога й підйом серпантином"}], "quiz": [{"q": {"en": "What is Lumen?", "uk": "Що таке Lumen?"}, "options": [{"en": "A plugin for water", "uk": "Плагін для води"}, {"en": "Unreal's real-time light that bounces off surfaces and lights the shade", "uk": "Світло Unreal у реальному часі, що відбивається від поверхонь і освітлює тінь"}, {"en": "A camera lens setting", "uk": "Налаштування об'єктива камери"}, {"en": "A kind of fog", "uk": "Різновид туману"}], "answer": 1, "explain": {"en": "Lumen bounces light in real time, so shade gets soft light from the sky and nearby surfaces at once, with nothing to pre-calculate.", "uk": "Lumen відбиває світло в реальному часі, тож тінь одразу отримує м'яке світло від неба й поверхонь поруч, без жодних попередніх розрахунків."}}, {"q": {"en": "From 150 m, your coast 1 km away looks as sharp and dark as the harbour below you. What should you change?", "uk": "З висоти 150 м берег за 1 км виглядає таким самим різким і темним, як гавань під тобою. Що варто змінити?"}, "options": [{"en": "Lower the sun to 5 degrees", "uk": "Опустити сонце до 5 градусів"}, {"en": "Turn off Lumen", "uk": "Вимкнути Lumen"}, {"en": "Raise the haze a little at a time: Height Fog density or the Sky Atmosphere's aerial perspective", "uk": "Потроху посилювати серпанок: густину Height Fog або повітряну перспективу Sky Atmosphere"}, {"en": "Raise the exposure", "uk": "Збільшити експозицію"}], "answer": 2, "explain": {"en": "Real air softens and blues far things. Without haze the island reads as a small model.", "uk": "Справжнє повітря пом'якшує далекі речі й робить їх синішими. Без серпанку острів читається як маленький макет."}}, {"q": {"en": "Your screenshots get brighter every time you fly from the open sea into a valley. What is the likely cause?", "uk": "Твої скріншоти світлішають щоразу, коли ти летиш із відкритого моря в долину. Яка ймовірна причина?"}, "options": [{"en": "Exposure is not locked", "uk": "Експозиція не зафіксована"}, {"en": "The fog is too thin", "uk": "Туман заслабкий"}, {"en": "The sun is too high", "uk": "Сонце зависоко"}, {"en": "The road is too wide", "uk": "Дорога заширока"}], "answer": 0, "explain": {"en": "With automatic exposure the camera adapts to each view. Locking Min EV100 and Max EV100 to one value on the Post Process Volume makes every shot repeat.", "uk": "З автоматичною експозицією камера підлаштовується під кожен вид. Якщо зафіксувати Min EV100 і Max EV100 на одному значенні в Post Process Volume, кожен кадр повторюється."}}, {"q": {"en": "You chose a 3 m bus shelter as a landmark, but nobody notices it from 1 km. Why?", "uk": "Твій орієнтир — автобусна зупинка заввишки 3 м, але з 1 км її ніхто не помічає. Чому?"}, "options": [{"en": "Lumen does not light small objects", "uk": "Lumen не освітлює малі об'єкти"}, {"en": "Landmarks must be red", "uk": "Орієнтири мають бути червоними"}, {"en": "It has no collision", "uk": "У неї немає колізії"}, {"en": "At 1 km it is only about 3 pixels tall on a 1080p screen, too small to read", "uk": "З 1 км вона заввишки лише приблизно 3 пікселі на екрані 1080p, замала, щоб її прочитати"}], "answer": 3, "explain": {"en": "At 1 km, 1 m is about 1 pixel. A landmark needs height and a clear outline, about 15 to 25 m or more.", "uk": "З 1 км 1 м — це приблизно 1 піксель. Орієнтирові потрібні висота й чіткий силует, приблизно 15–25 м або більше."}}, {"q": {"en": "What makes a good vista?", "uk": "Що робить панораму вдалою?"}, "options": [{"en": "A view straight down at the ground", "uk": "Вид прямо вниз на землю"}, {"en": "A view where the route opens up, with a foreground, a middle and a landmark in the background", "uk": "Вид, де маршрут розкривається, з переднім планом, середнім планом і орієнтиром на задньому плані"}, {"en": "Any view with thick fog", "uk": "Будь-який вид із густим туманом"}], "answer": 1, "explain": {"en": "Layers of depth and a landmark to look at make a view feel big and give the eye somewhere to go.", "uk": "Шари глибини й орієнтир, на який можна дивитися, роблять вид великим і дають оку куди йти."}}], "weekInfo": {"week": 7, "title": {"en": "Roads, the big world and a first forest", "uk": "Дороги, великий світ і перший ліс"}, "goal": {"en": "By Friday you have roads that follow the land, island-scale light with landmarks and vistas, L_Island organised with World Partition, Data Layers and HLODs, and a first PCG forest filling one valley.", "uk": "До п'ятниці в тебе є дороги, що йдуть за рельєфом, світло в масштабі острова з орієнтирами й панорамами, L_Island, упорядкований за допомогою World Partition, Data Layers і HLOD, і перший PCG-ліс, що заповнює одну долину."}, "skills": [{"en": "Landscape spline roads built to real grades in Unreal Engine 5", "uk": "Дороги зі сплайнів ландшафту зі справжніми ухилами в Unreal Engine 5"}, {"en": "World Partition, Data Layer and HLOD set-up for large open worlds", "uk": "Налаштування World Partition, Data Layers і HLOD для великих відкритих світів"}, {"en": "Atmosphere, light, landmarks and vistas for open-world composition", "uk": "Атмосфера, світло, орієнтири й панорами в композиції відкритого світу"}, {"en": "Reading production PCG graphs and migrating assets between Unreal projects", "uk": "Читання продакшн-графів PCG і перенесення асетів між проєктами Unreal"}]}, "morning": {"sofar": {"en": "Your island has roads that follow the land, including a switchback climb that stays under a 10 % grade.", "uk": "На твоєму острові є дороги, що йдуть за рельєфом, зокрема серпантин з ухилом менше 10 %."}, "today": {"en": "You light the whole island with one recipe, add haze that shows distance, block out three landmarks and frame three vistas.", "uk": "Сьогодні ти освітлюєш увесь острів одним рецептом, додаєш серпанок, що передає відстань, робиш блокаут трьох орієнтирів і компонуєш три краєвиди."}, "cheer": {"en": "Today light and haze make your island feel huge, so give yourself a moment to enjoy the view you created.", "uk": "Сьогодні світло й серпанок роблять твій острів величезним, тож подаруй собі хвилинку помилуватися краєвидом, який створено твоїми руками."}, "quote": {"text": {"en": "The sky is the daily bread of the eyes.", "uk": "Небо — щоденний хліб для очей."}, "author": {"en": "Ralph Waldo Emerson", "uk": "Ральф Волдо Емерсон"}, "source": "https://en.wikiquote.org/wiki/Ralph_Waldo_Emerson"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-32-island-light-landmarks-vistas", "mapHref": "../../COURSE.html", "prevHref": "../Day-31-roads-that-follow-the-land/START-HERE.html", "nextHref": "../Day-33-world-partition-data-layers-hlods/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8 and Krita. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me and don't write code. Keep me moving and make it feel like a game.\n\nToday I build on my own: The landmarks and the three vistas, on your own.\nIt's part of: One island light recipe (sun, Lumen, sky, haze, clouds and locked exposure), three landmarks blocked out at true size where your map puts them, and three vista cameras along the scenic route (L_Island: the whole island for the light; three landmarks from your map and photos (for example a lighthouse on a headland, a church tower in district 2, a lone tree on the ridge); three vista points along your scenic route.).\n\nSpec:\n- island_light_recipe.md, grown from your Day 30 sky_recipe.md (save a copy under the new name and add to it): the sun's rotation, the Sky Light (Real Time Capture on), Sky Atmosphere, Exponential Height Fog, Volumetric Cloud and the locked exposure, all as numbers, so anyone could rebuild the light.\n- Lumen on for light and reflections (Project Settings), checked, not changed.\n- Haze that softens the coast 1 km away but keeps its shape; the near sea is never milky.\n- Exposure locked with your Day 30 Post Process Volume (Infinite Extent ticked, Min EV100 = Max EV100), retuned for the island light; no second volume.\n- Three landmarks blocked out at true size with basic shapes or your own kit: for example a lighthouse 15 to 25 m tall, a tower 20 to 30 m or a lone tree about 15 m. Each has a clear outline against sky or sea and stands on its map spot. landmarks.md lists each one's height and why it is there.\n- Three Cine Cameras V1, V2 and V3 on the scenic route, 16:9, locked; each frames a landmark with a foreground, a middle and a far background; every landmark is seen from at least two vistas.\n- stat unit read with and without the clouds; both GPU numbers in the recipe.\n\nMy checklist:\n1. First save a copy of sky_recipe.md as island_light_recipe.md. Pilot your Day 30 camera CAM_Island_C3 and take a 'before' screenshot. Open Window > Env. Light Mixer and check L_Island has a sun, Sky Light, Sky Atmosphere, Exponential Height Fog and Volumetric Cloud; create any that are missing. Check: all five show in the mixer. (from lesson 1)\n2. Check Lumen in Project Settings and tick Real Time Capture on the Sky Light. Check: the shaded sides of hills show soft, bluish light, not black. (from lesson 1)\n3. Set the sun for your place's best hour (25 to 35 degrees high), matched to your reference photos. Check: from high up, every hill has a lit side and a shaded side. (from lesson 1)\n4. Retune the exposure lock on your Day 30 Post Process Volume (Min EV100 = Max EV100, always the same value) until the brightness matches your photos; don't add a second volume. Check: flying from the open sea into a valley no longer changes the brightness. (from lesson 1)\n5. Tune the haze with the Height Fog and the Sky Atmosphere until the coast 1 km away is softer and bluer than the near coast. Check: the far coast keeps its shape and the near sea is not milky. (from lesson 2)\n6. Read stat unit with the clouds hidden and shown, and write every number in island_light_recipe.md. Check: the recipe lists every light value and the clouds' GPU cost in ms. (from lesson 2)\n7. Choose three landmarks from your map and photos and write landmarks.md (what, where, height, why). Check: each landmark has a map spot and a height. (from lesson 3)\n8. Block out the three landmarks at true size and put each on its spot. Check: from 1 km away, each shows as a clear shape against sky or sea. (from lesson 3)\n9. Mark them on a copy of the map as landmarks_map.png. Check: the three landmarks are spread across the island, not bunched together. (from lesson 3)\n10. Place, set and lock V1, V2 and V3 on the scenic route, each framing a landmark with a foreground, a middle and a far background. Check: every landmark shows in at least two of the three vistas. (from lesson 4)\n11. HighResShot 1920x1080 from V1, V2 and V3; in Krita put each beside a reference photo in vista_board.png. Check: the board shows three labelled pairs. (from lesson 4)\n12. Before/after capture: CAM_Island_C3 before and after the light recipe; then a 60-second clip along the scenic route at your recipe's light. Check: before_after_day32.png and flythrough_day32.mp4 are saved. (from day 31, lesson 4)\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Ivan\nDay 32: Island-scale light and haze, landmarks and vistas. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p><div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+list(D.handin,'ul','ticks')+'<p class="path">'+ic('folder')+'<span>'+u('shipTo')+' <code>'+esc(D.workPath)+'</code></span></p>'+(D.lessons.length?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<p class="muted">'+u('report')+'</p><div class="row"><button class="btn s" onclick="cp(D.reportPrompt)">'+ic('copy')+u('copyR')+'</button></div></section>';
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();

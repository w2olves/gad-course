<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 55</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

бидва райони з їхніх десяти заблокованих камер, C1–C5 і D2_C1–D2_C5."}, "spec": [{"en": "A triage list in self_review_day55.md: every open issue marked must fix (broken, floating, blocking a lane), should fix or leave. Fix the musts first, 45 minutes at most.", "uk": "Список сортування в self_review_day55.md: кожна відкрита проблема позначена як «обов'язково» (зламане, висить у повітрі, блокує коридор), «бажано» чи «залишити». Спершу виправ обов'язкові, щонайбільше за 45 хвилин."}, {"en": "A final pass on both districts: nothing floating at 2 m, LaneGauge through every lane, and composition on all ten cameras.", "uk": "Остання перевірка обох районів: з 2 м ніщо не висить у повітрі, LaneGauge проходить кожен коридор, а композиція добра на всіх десяти камерах."}, {"en": "Ten final shots in the review exposure, taken in one sitting: d1_final_C1.png to d1_final_C5.png and d2_final_C1.png to d2_final_C5.png, 1920 x 1080, with no editor icons.", "uk": "Десять фінальних кадрів з експозицією для огляду, зняті за один раз: d1_final_C1.png–d1_final_C5.png і d2_final_C1.png–d2_final_C5.png, 1920 × 1080, без значків редактора."}, {"en": "final_board_d1.png and final_board_d2.png: engine left, photo right, five rows each, with a one-line caption per row.", "uk": "final_board_d1.png і final_board_d2.png: рушій ліворуч, фото праворуч, по п'ять рядів, під кожним рядом — підпис в один рядок."}, {"en": "self_review_day55.md: the triage, the rubric scores, the tutor's notes and your tier.", "uk": "self_review_day55.md: сортування, бали за таблицею оцінювання, нотатки тьютора й твоя медаль."}, {"en": "clip_day55.mp4: 30 to 60 seconds, under 50 MB at 1080p.", "uk": "clip_day55.mp4: 30–60 секунд, менше 50 МБ у 1080p."}], "piece1": "the triage and the musts", "piece2": {"en": "The final pass, ten final shots, two boards and your clip, timed (tiers)", "uk": "Остання перевірка, десять фінальних кадрів, два аркуші й твій кліп на час (медалі)"}, "steps": [{"text": {"en": "Check: the files from today's lessons are in the day work folder (self_review_day55.md with your triage, d1_final_C1.png, final_board_d1.png). Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it. Then start the clock: 3 hours 30 for Bronze.", "uk": "Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: self_review_day55.md зі списком сортування, d1_final_C1.png, final_board_d1.png. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Потім запусти таймер: 3 години 30 хвилин на Бронзу."}, "lesson": 1}, {"text": {"en": "Fix the musts, 15 minutes each at most and 45 minutes in all. Check: every must is ticked, or moved to 'should' with a reason.", "uk": "Виправ обов'язкові проблеми, щонайбільше по 15 хвилин на кожну й 45 хвилин загалом. Перевірка: кожну обов'язкову позначено ✓ або перенесено в «бажано» з причиною."}, "lesson": 1}, {"text": {"en": "Grounding and lanes in both districts: fly at 2 m along walls, fences and props, then slide LaneGauge through each lane. Check: nothing floats, and no lane is blocked.", "uk": "Посадка на ґрунт і коридори в обох районах: пролети на висоті 2 м уздовж мурів, парканів і пропсів, потім проведи LaneGauge крізь кожен коридор. Перевірка: нічого не висить у повітрі, і жоден коридор не заблоковано."}, "lesson": "D53.4"}, {"text": {"en": "Compose all ten cameras, C1 to C5 and D2_C1 to D2_C5: thirds lines, horizon, foreground, edges. Move props 2 m at most, never buildings. Check: each frame has a clear subject on a third and a level horizon.", "uk": "Скомпонуй усі десять камер, C1–C5 і D2_C1–D2_C5: лінії третин, горизонт, передній план, краї. Пропси пересувай щонайбільше на 2 м, будівлі — ніколи. Перевірка: у кожному кадрі є чіткий головний об'єкт на лінії третин і рівний горизонт."}, "lesson": 2}, {"text": {"en": "Check the light against island_light_recipe.md and switch on the review exposure. Older Unreal (4.27) or weak PC: shoot at Medium, or High with r.ScreenPercentage 50; Lumen off is fine. See Weak PC in ACCOUNTS-AND-INSTALLS.html. Check: every number matches the recipe.", "uk": "Звір світло з island_light_recipe.md і ввімкни експозицію для огляду. Старіший Unreal (4.27) або слабкий ПК: знімай на Medium або на High з r.ScreenPercentage 50; Lumen можна вимкнути; див. розділ «Слабкий ПК» на сторінці ACCOUNTS-AND-INSTALLS.html. Перевірка: кожне число збігається з рецептом."}, "lesson": 3}, {"text": {"en": "Take all ten final shots in one sitting, into folders final_d1 and final_d2. Check: ten files at 1920 x 1080, named d1_final_ and d2_final_, with no icons at 200 % zoom.", "uk": "Зніми всі десять фінальних кадрів за один раз, у папки final_d1 і final_d2. Перевірка: десять файлів 1920 × 1080 з назвами d1_final_ і d2_final_, без значків у масштабі 200 %."}, "lesson": 3}, {"text": {"en": "Make final_board_d1.png and final_board_d2.png with a one-line caption under each row. District 1 can reuse Day 45's Commons photos; for district 2 find five of a similar place, each with its line in credits.md. Check: each caption says what the shot shows in 12 words or fewer.", "uk": "Зроби final_board_d1.png і final_board_d2.png з підписом в один рядок під кожним рядом. Для району 1 можна знову взяти фото з Commons із Дня 45; для району 2 знайди п'ять фото схожого місця, кожне з рядком у credits.md. Перевірка: кожен підпис каже, що показує кадр, не більше ніж 12 словами."}, "lesson": 3}, {"text": {"en": "Self-review: score the rubric, then ask the tutor for its see-why-fix notes on both boards and for the nine pre-flight checks on every shot. Write both and your tier in self_review_day55.md. Check: five scores, the tutor's notes and a tier are written.", "uk": "Самоперевірка: оціни себе за таблицею оцінювання, потім попроси в тьютора нотатки «бачу, чому, як виправити» до обох аркушів і дев'ять передпольотних перевірок для кожного кадру. Запиши те й інше та свою медаль у self_review_day55.md. Перевірка: записано п'ять балів, нотатки тьютора й медаль."}, "lesson": 4}, {"text": {"en": "Record clip_day55.mp4 (Win+Alt+R). What to show: a slow fly-around of today's result from the camera angles on your sheet, then hold on the best view; 30 to 60 seconds, no music or editing needed. Then choose File > Save All. Check: the level tab shows no star (*), and the clip is under 50 MB (right-click > Properties). Bigger? Open it in Clipchamp > Export > 720p.", "uk": "Запиши clip_day55.mp4 (Win+Alt+R). Що показати: повільно пролети навколо сьогоднішнього результату з ракурсів камер на твоєму аркуші, потім затримайся на найкращому виді. 30–60 секунд, без музики й монтажу. Потім вибери File > Save All. Перевірка: на вкладці рівня немає зірочки (*), а кліп менший за 50 МБ (правою кнопкою > Властивості (Properties)). Більший? Відкрий його в Clipchamp > Export > 720p."}, "lesson": 3}, {"text": {"en": "Stop the timer: you give your finish time and tier in the day report. Report and hand-in: click Copy the day report at the bottom of the page, paste it into a new chat and answer. Open summary.md in Notepad, press Ctrl+End, paste the answer and press Ctrl+S. Then drag the files on the Hand in list into your hand-in folder. Check: every name shows in the folder, each with a size.", "uk": "Зупини таймер: час завершення й медаль ти назвеш у звіті дня. Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: кожна назва зі списку є в папці, у кожної є розмір."}, "lesson": 4}], "boss": [{"en": "Bronze: district 2 finished with every must fixed, ten final shots on two boards beside their photos, and your clip, inside 3 hours 30.", "uk": "Бронза: район 2 завершено, усі обов'язкові виправлення зроблено, десять фінальних кадрів стоять на двох аркушах поруч зі своїми фото, і є кліп — усе за 3 години 30 хвилин."}, {"en": "Silver: Bronze, plus every final shot passes the tutor's nine pre-flight checks and holds up beside its photo in a 3-second look. District 2 reads as a different place from district 1.", "uk": "Срібло: усе для Бронзи, а ще кожен фінальний кадр проходить дев'ять передпольотних перевірок тьютора й за 3 секунди погляду витримує порівняння зі своїм фото. Район 2 виглядає іншим місцем, ніж район 1."}, {"en": "Gold: Silver, plus the tutor, reviewing as a studio art director, finds no must-fix on either board, and you finish inside 3 hours.", "uk": "Золото: усе для Срібла, а ще тьютор в огляді арт-директора студії не знаходить на жодному аркуші обов'язкових виправлень, а ти завершуєш за 3 години."}], "assets": ["island12/art-director-notes.md"]}, "lessons": [{"title": {"en": "Boss briefing: good enough ships (micro-lesson)", "uk": "Інструктаж Дня боса: достатньо добре — значить, готово (мікроурок)"}, "minutes": 20, "goals": [{"en": "Explain triage: sorting issues fast into must fix (broken, floating, blocking a lane), should fix and leave.", "uk": "Пояснювати, що таке сортування: швидко розкласти проблеми на «обов'язково» (зламане, висить у повітрі, блокує коридор), «бажано» і «залишити»."}, {"en": "Fix the musts first, each with a time limit of 15 minutes or less.", "uk": "Спершу виправляти обов'язкові проблеми, на кожну — не більше 15 хв."}, {"en": "Stop when it looks and feels right: nothing new goes in today.", "uk": "Зупинятися, коли все виглядає й відчувається правильно: сьогодні нічого нового не додається."}], "doalong": [{"en": "Fly district 2 at 2 m and fix the first thing that floats or blocks a lane: your first must. You should see it sit right.", "uk": "Пролети над районом 2 на висоті 2 м і виправ першу річ, що висить у повітрі чи блокує коридор: це твоє перше обов'язкове виправлення. Має вийти: вона стоїть як слід."}, {"en": "List every other open issue from d2_notes.md under Triage in self_review_day55.md, and mark each must, should or leave. You should see three groups.", "uk": "Перелічи решту відкритих проблем із d2_notes.md під заголовком «Сортування» в self_review_day55.md і познач кожну: «обов'язково», «бажано» чи «залишити». Має вийти три групи."}, {"en": "Plan the day with times: musts, final pass, shots, boards, review, clip. You should see a plan that fits into 3 hours 30.", "uk": "Сплануй день за часом: обов'язкові виправлення, остання перевірка, кадри, аркуші, огляд, кліп. Має вийти план, що вкладається в 3 години 30 хвилин."}], "play": {"en": "Triage call: the tutor reads me eight issues fast; I say must, should or leave within 5 seconds each.", "uk": "Швидке сортування: тьютор швидко читає мені вісім проблем. На кожну я за 5 с кажу «обов'язково», «бажано» чи «залишити»."}, "video": {"search": "game development polish prioritization"}, "prompt": "You are my tutor for one 20-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Інструктаж Дня боса: достатньо добре — значить, готово (мікроурок) (Day 55, lesson 1 of 4). Today's build: Район 2, завершений після останнього сортування, і десять фінальних кадрів (по п'ять на район) в одному світлі, кожен поруч із відповідним справжнім фото.\nWhat I already know: День 54: кадри r2 і кожне ще відкрите виправлення в d2_notes.md; День 47: скомпоновані камери району 1, C1–C5; День 53: island_light_recipe.md і стики між районами.\n\nBy the end of this lesson I can:\n1. Пояснювати, що таке сортування: швидко розкласти проблеми на «обов'язково» (зламане, висить у повітрі, блокує коридор), «бажано» і «залишити».\n2. Спершу виправляти обов'язкові проблеми, на кожну — не більше 15 хв.\n3. Зупинятися, коли все виглядає й відчувається правильно: сьогодні нічого нового не додається.\n\nRun the lesson in this order; it should take 20 to 30 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: Цього тижня район 2 отримав орієнтир, меблі, рослини, зношеність, дорогу до району 1, одне світло острова й один раунд огляду з п'ятьма виправленнями. Today: Сьогодні День боса: ти завершуєш район 2, робиш десять фінальних кадрів, по п'ять на район, кожен поруч зі своїм справжнім фото, і записуєш короткий кліп для свого ролика прогресу. One encouraging line: Достатньо добре — можна випускати, і Бронза чекає на тебе; заверши, зніми й пишайся двома готовими районами.); 2 lines on why today matters and where it comes back, in plain words (from this: Це доказ тижня й серце твого портфоліо: два райони з різним характером, завершені в одному світлі. З цих десяти зображень арт-директор вирішує, чи вмієш ти доводити роботу до кінця, а не лише починати. Знати, коли зупинитися, — теж частина вміння. Достатньо добре, перевірено й чесно — значить, готово. It comes back: Десять фінальних кадрів потраплять на сторінку портфоліо в День 60, а d2_final_C4.png стане парою «до і після» в День 59. День 56 має зберегти цей вигляд, а clip_day55.mp4 увійде в ролик прогресу в День 60.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-55-boss-district2-finished exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (сортування й обов'язкові виправлення). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Пролети над районом 2 на висоті 2 м і виправ першу річ, що висить у повітрі чи блокує коридор: це твоє перше обов'язкове виправлення. Має вийти: вона стоїть як слід.\n   2. Перелічи решту відкритих проблем із d2_notes.md під заголовком «Сортування» в self_review_day55.md і познач кожну: «обов'язково», «бажано» чи «залишити». Має вийти три групи. [screenshot]\n   3. Сплануй день за часом: обов'язкові виправлення, остання перевірка, кадри, аркуші, огляд, кліп. Має вийти план, що вкладається в 3 години 30 хвилин. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Швидке сортування: тьютор швидко читає мені вісім проблем. На кожну я за 5 с кажу «обов'язково», «бажано» чи «залишити». Otherwise skip it.\n6. Review: ask me these questions from earlier days, one at a time, and correct me kindly: Day 53: which two exposure set-ups are in your light recipe, and when do you use each? | Day 46: what makes a before/after pair honest?\n7. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n8. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian):  in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; tier (Bronze, Silver, Gold) = медаль (Бронза, Срібло, Золото); lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; rubric = таблиця оцінювання; self-review = самоперевірка; review (by tutor or art director) = огляд; see-why-fix note = нотатка «бачу, чому, як виправити»; credits line = рядок авторства; comparison sheet, board (an image) = аркуш (аркуш порівняння, аркуш референсів); click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); File Explorer = Провідник; vertex / edge / face = вершина / ребро / грань; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; keep-out zone / footprint test / grounding = зона-виняток / тест опори / посадка на ґрунт; kit / kit piece / part of one object = набір / деталь / частина; district / plot / plot plan = район / ділянка / план ділянки; locked camera / locked exposure = заблокована камера / зафіксована експозиція; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ; shot set = серія кадрів.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}], "handin": [{"en": "summary.md with your finish time and tier", "uk": "summary.md (час завершення й медаль)"}, {"en": "final_board_d1.png: district 1's five final shots beside their photos (Boss)", "uk": "final_board_d1.png (п'ять фінальних кадрів району 1 поруч зі своїми фото) (День боса)"}, {"en": "final_board_d2.png: district 2's five final shots beside their photos (Boss)", "uk": "final_board_d2.png (п'ять фінальних кадрів району 2 поруч зі своїми фото) (День боса)"}, {"en": "self_review_day55.md: triage, rubric, the tutor's notes and your tier (Boss)", "uk": "self_review_day55.md (сортування, таблиця оцінювання, нотатки тьютора й медаль) (День боса)"}, {"en": "clip_day55.mp4: 30 to 60 seconds, under 50 MB, for your progress reel (Boss)", "uk": "clip_day55.mp4 (30–60 секунд, менше 50 МБ, для ролика прогресу) (День боса)"}], "goal": {"en": "By the end of today both districts are finished in one light. Ten final shots, five per district, stand beside their real photos on two final boards.", "uk": "Наприкінці дня обидва райони завершено в одному світлі. Десять фінальних кадрів, по п'ять на район, стоять поруч зі справжніми фото на двох фінальних аркушах."}, "uses": [{"en": "Day 54: the r2 shots and any fix still open in d2_notes.md", "uk": "День 54: кадри r2 і кожне ще відкрите виправлення в d2_notes.md"}, {"en": "Day 47: district 1's composed cameras C1 to C5", "uk": "День 47: скомпоновані камери району 1, C1–C5"}, {"en": "Day 53: island_light_recipe.md and the joins between the districts", "uk": "День 53: island_light_recipe.md і стики між районами"}], "quiz": [{"q": {"en": "Why do you run a fence along a spline with PCG instead of placing 60 panels by hand?", "uk": "Чому паркан ведуть уздовж сплайна з PCG, а не ставлять 60 секцій вручну?"}, "options": [{"en": "PCG fences can't float", "uk": "PCG-паркани не можуть висіти в повітрі"}, {"en": "One graph places every panel the same way and updates when you bend the spline", "uk": "Один граф ставить кожну секцію однаково й оновлюється, коли вигинаєш сплайн"}, {"en": "Hand-placed panels can't have collision", "uk": "Секції, поставлені вручну, не можуть мати колізії"}], "answer": 1, "explain": {"en": "A spline graph is quick to change: bend the spline and every panel follows.", "uk": "Граф на сплайні легко змінити: вигни сплайн — і кожна секція піде за ним."}}, {"q": {"en": "A lamp post's head sits inside a drone lane over the village path. What do you do?", "uk": "Плафон ліхтарного стовпа заходить у польотний коридор над сільською стежкою. Що робити?"}, "options": [{"en": "Move the lamp to the side of the path or use a shorter one, then test the lane with LaneGauge again", "uk": "Пересунути ліхтар убік від стежки або взяти нижчий, потім знову перевірити коридор кубом LaneGauge"}, {"en": "Leave it: lamps are thin", "uk": "Залишити: ліхтарі тонкі"}, {"en": "Raise the lane by 50 m", "uk": "Підняти коридор на 50 м"}], "answer": 0, "explain": {"en": "Lanes stay at least 4 x 4 m clear. Move the prop and prove it with LaneGauge.", "uk": "Коридори лишаються вільними щонайменше на 4 × 4 м. Пересунь пропс і доведи це кубом LaneGauge."}}, {"q": {"en": "Where does a damp, mossy band belong on a village wall?", "uk": "Де місце вологої смуги з мохом на сільській стіні?"}, "options": [{"en": "At head height on the sunny side", "uk": "На висоті голови на сонячному боці"}, {"en": "Only on the roof", "uk": "Лише на даху"}, {"en": "At the base, where rain splashes and water gathers", "uk": "Біля низу стіни, куди бризкає дощ і де збирається вода"}], "answer": 2, "explain": {"en": "Grime goes where its cause is. Water gathers and splashes at the foot of a wall.", "uk": "Бруд з'являється там, де його причина. Вода збирається й бризкає біля низу стіни."}}, {"q": {"en": "The review shot from C4 is brighter today than on Day 47, though nothing changed there. What do you check first?", "uk": "Кадр для огляду з камери C4 сьогодні світліший, ніж у День 47, хоча там нічого не змінилося. Що перевірити насамперед?"}, "options": [{"en": "The decals' Sort Order", "uk": "Sort Order декалей"}, {"en": "The road grade", "uk": "Ухил дороги"}, {"en": "The exposure: is the review set-up locked with the recipe's value?", "uk": "Експозицію: чи зафіксовано настройку для огляду на значенні з рецепта?"}, {"en": "The fence spline", "uk": "Сплайн паркану"}], "answer": 2, "explain": {"en": "With auto exposure the brightness drifts. The review set-up locks it, so shots stay comparable.", "uk": "З автоекспозицією яскравість гуляє. Настройка для огляду фіксує її, тож кадри можна порівнювати."}}, {"q": {"en": "What is a biome seam, and how should it look?", "uk": "Що таке стик біомів і як він має виглядати?"}, "options": [{"en": "A crack in the landscape: fill it", "uk": "Тріщина в ландшафті: заповни її"}, {"en": "Where a PCG biome meets hand-placed planting: a 20 to 40 m band where both mix in patches", "uk": "Місце, де PCG-біом зустрічає рослини, посаджені вручну: смуга 20–40 м, де обидва перемішуються плямами"}, {"en": "A line of one kind of plant that marks the border", "uk": "Лінія з рослин одного виду, що позначає межу"}], "answer": 1, "explain": {"en": "Real landscapes change gradually. A mixed band hides the join.", "uk": "Справжні ландшафти змінюються поступово. Змішана смуга ховає стик."}}, {"q": {"en": "A road leg climbs 9 m over 60 m. Is it OK?", "uk": "Відрізок дороги піднімається на 9 м на довжині 60 м. Чи це нормально?"}, "options": [{"en": "Yes: it's 6.7 %", "uk": "Так: це 6,7 %"}, {"en": "Yes: it's 9 %", "uk": "Так: це 9 %"}, {"en": "No: it's 15 %, so lengthen the road or add a hairpin", "uk": "Ні: це 15 %, тож подовж дорогу або додай серпантинний поворот"}], "answer": 2, "explain": {"en": "9 divided by 60 is 0.15, or 15 %. Island roads stay under 10 %.", "uk": "9 поділити на 60 — це 0,15, тобто 15 %. Дороги острова тримаються нижче 10 %."}}, {"q": {"en": "What makes a see-why-fix note useful?", "uk": "Що робить нотатку «бачу, чому, як виправити» корисною?"}, "options": [{"en": "It says what you see, why it matters and one fix with a place", "uk": "Вона каже, що ти бачиш, чому це важливо, і дає одне виправлення з місцем"}, {"en": "It is long and detailed", "uk": "Вона довга й докладна"}, {"en": "It praises the work first", "uk": "Вона спершу хвалить роботу"}], "answer": 0, "explain": {"en": "The builder must know exactly what to change and where.", "uk": "Той, хто будує, має точно знати, що змінити і де."}}, {"q": {"en": "An hour before the deadline, you notice a shrub poking slightly through a wall, visible only from 1 m and away from every camera. Must, should or leave?", "uk": "За годину до дедлайну видно кущ, що трохи стирчить крізь стіну. Його видно лише з 1 м, і він далеко від усіх камер. «Обов'язково», «бажано» чи «залишити»?"}, "options": [{"en": "Leave: no camera or lane sees it; write it under Triage in self_review_day55.md", "uk": "«Залишити»: його не бачить жодна камера й жоден коридор; запиши його під заголовком «Сортування» в self_review_day55.md"}, {"en": "Must: anything touching a wall is broken", "uk": "«Обов'язково»: усе, що торкається стіни, зламане"}, {"en": "Should: fix it before the musts", "uk": "«Бажано»: виправити його раніше за обов'язкові"}], "answer": 0, "explain": {"en": "Triage protects your time for what shows. Write it down and move on.", "uk": "Сортування береже твій час для того, що видно. Запиши й рухайся далі."}}], "weekInfo": {"week": 11, "title": {"en": "District 2 finished", "uk": "Район 2 завершено"}, "goal": {"en": "By Friday you have district 2 finished: furnished, planted, weathered and joined to the island, with five final shots per district beside real photos.", "uk": "До п'ятниці район 2 завершено: облаштовано, засаджено, зістарено й з'єднано з островом, а по п'ять фінальних кадрів кожного району стоять поруч зі справжніми фото."}, "skills": [{"en": "Set dressing and prop placement by use for open-world districts", "uk": "Наповнення сцени (set dressing) і розстановка пропсів за призначенням у районах відкритого світу"}, {"en": "Spline-based PCG for fences, walls and hedgerows in Unreal Engine 5", "uk": "PCG на сплайнах для парканів, мурів і живоплотів в Unreal Engine 5"}, {"en": "Foliage and decal passes that age a scene believably", "uk": "Рослини й декалі, які правдоподібно старять сцену"}, {"en": "Lighting recipes and exposure control across a whole open world", "uk": "Рецепти світла й контроль експозиції для всього відкритого світу"}, {"en": "Art review against photo reference in r1/r2 rounds", "uk": "Огляд роботи за фото-референсами в раундах r1/r2"}]}, "morning": {"sofar": {"en": "This week district 2 gained its landmark, furniture, planting, wear, a road to district 1, one island light and one review round with five fixes.", "uk": "Цього тижня район 2 отримав орієнтир, меблі, рослини, зношеність, дорогу до району 1, одне світло острова й один раунд огляду з п'ятьма виправленнями."}, "today": {"en": "It is Boss day: you finish district 2, take ten final shots, five per district, each beside its real photo, and fly a short clip for your progress reel.", "uk": "Сьогодні День боса: ти завершуєш район 2, робиш десять фінальних кадрів, по п'ять на район, кожен поруч зі своїм справжнім фото, і записуєш короткий кліп для свого ролика прогресу."}, "cheer": {"en": "Good enough ships, and Bronze is yours to claim; finish, shoot, and be proud of two complete districts.", "uk": "Достатньо добре — можна випускати, і Бронза чекає на тебе; заверши, зніми й пишайся двома готовими районами."}, "quote": {"text": {"en": "One can collect only a few, and they are more beautiful if they are few.", "uk": "Зібрати можна лише небагато, і вони прекрасніші, коли їх мало."}, "author": {"en": "Anne Morrow Lindbergh", "uk": "Енн Морроу Ліндберг"}, "source": "https://en.wikiquote.org/wiki/Anne_Morrow_Lindbergh"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-55-boss-district2-finished", "mapHref": "../../COURSE.html", "prevHref": "../Day-54-district2-r1-and-r2/START-HERE.html", "nextHref": "../Day-56-whole-island-performance/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Krita and Unreal Engine 5.8. I am a beginner on Day 55. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me and don't write code.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: Остання перевірка, десять фінальних кадрів, два аркуші й твій кліп на час (медалі).\nIt's part of: Район 2, завершений після останнього сортування, і десять фінальних кадрів (по п'ять на район) в одному світлі, кожен поруч із відповідним справжнім фото (L_Island: район 2 для останніх виправлень, потім обидва райони з їхніх десяти заблокованих камер, C1–C5 і D2_C1–D2_C5.).\nWhy it matters: Це доказ тижня й серце твого портфоліо: два райони з різним характером, завершені в одному світлі. З цих десяти зображень арт-директор вирішує, чи вмієш ти доводити роботу до кінця, а не лише починати. Знати, коли зупинитися, — теж частина вміння. Достатньо добре, перевірено й чесно — значить, готово. It comes back: Десять фінальних кадрів потраплять на сторінку портфоліо в День 60, а d2_final_C4.png стане парою «до і після» в День 59. День 56 має зберегти цей вигляд, а clip_day55.mp4 увійде в ролик прогресу в День 60.\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-55-boss-district2-finished (on the drive I chose on Day 0).\nWhat I already know: День 54: кадри r2 і кожне ще відкрите виправлення в d2_notes.md; День 47: скомпоновані камери району 1, C1–C5; День 53: island_light_recipe.md і стики між районами; today's lessons: Інструктаж Дня боса: достатньо добре — значить, готово (мікроурок); Композиція на десяти камерах (мікроурок); Десять фінальних кадрів за один раз (мікроурок); Самоперевірка з тьютором (мікроурок). Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- Список сортування в self_review_day55.md: кожна відкрита проблема позначена як «обов'язково» (зламане, висить у повітрі, блокує коридор), «бажано» чи «залишити». Спершу виправ обов'язкові, щонайбільше за 45 хвилин.\n- Остання перевірка обох районів: з 2 м ніщо не висить у повітрі, LaneGauge проходить кожен коридор, а композиція добра на всіх десяти камерах.\n- Десять фінальних кадрів з експозицією для огляду, зняті за один раз: d1_final_C1.png–d1_final_C5.png і d2_final_C1.png–d2_final_C5.png, 1920 × 1080, без значків редактора.\n- final_board_d1.png і final_board_d2.png: рушій ліворуч, фото праворуч, по п'ять рядів, під кожним рядом — підпис в один рядок.\n- self_review_day55.md: сортування, бали за таблицею оцінювання, нотатки тьютора й твоя медаль.\n- clip_day55.mp4: 30–60 секунд, менше 50 МБ у 1080p.\n\nMy checklist (the same numbers show on my course page):\n1. Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: self_review_day55.md зі списком сортування, d1_final_C1.png, final_board_d1.png. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Потім запусти таймер: 3 години 30 хвилин на Бронзу. (from lesson 1)\n2. Виправ обов'язкові проблеми, щонайбільше по 15 хвилин на кожну й 45 хвилин загалом. Перевірка: кожну обов'язкову позначено ✓ або перенесено в «бажано» з причиною. (from lesson 1)\n3. Посадка на ґрунт і коридори в обох районах: пролети на висоті 2 м уздовж мурів, парканів і пропсів, потім проведи LaneGauge крізь кожен коридор. Перевірка: нічого не висить у повітрі, і жоден коридор не заблоковано. (from day 53, lesson 4)\n4. Скомпонуй усі десять камер, C1–C5 і D2_C1–D2_C5: лінії третин, горизонт, передній план, краї. Пропси пересувай щонайбільше на 2 м, будівлі — ніколи. Перевірка: у кожному кадрі є чіткий головний об'єкт на лінії третин і рівний горизонт. (from lesson 2)\n5. Звір світло з island_light_recipe.md і ввімкни експозицію для огляду. Старіший Unreal (4.27) або слабкий ПК: знімай на Medium або на High з r.ScreenPercentage 50; Lumen можна вимкнути; див. розділ «Слабкий ПК» на сторінці ACCOUNTS-AND-INSTALLS.html. Перевірка: кожне число збігається з рецептом. (from lesson 3)\n6. Зніми всі десять фінальних кадрів за один раз, у папки final_d1 і final_d2. Перевірка: десять файлів 1920 × 1080 з назвами d1_final_ і d2_final_, без значків у масштабі 200 %. (from lesson 3)\n7. Зроби final_board_d1.png і final_board_d2.png з підписом в один рядок під кожним рядом. Для району 1 можна знову взяти фото з Commons із Дня 45; для району 2 знайди п'ять фото схожого місця, кожне з рядком у credits.md. Перевірка: кожен підпис каже, що показує кадр, не більше ніж 12 словами. (from lesson 3)\n8. Самоперевірка: оціни себе за таблицею оцінювання, потім попроси в тьютора нотатки «бачу, чому, як виправити» до обох аркушів і дев'ять передпольотних перевірок для кожного кадру. Запиши те й інше та свою медаль у self_review_day55.md. Перевірка: записано п'ять балів, нотатки тьютора й медаль. (from lesson 4)\n9. Запиши clip_day55.mp4 (Win+Alt+R). Що показати: повільно пролети навколо сьогоднішнього результату з ракурсів камер на твоєму аркуші, потім затримайся на найкращому виді. 30–60 секунд, без музики й монтажу. Потім вибери File > Save All. Перевірка: на вкладці рівня немає зірочки (*), а кліп менший за 50 МБ (правою кнопкою > Властивості (Properties)). Більший? Відкрий його в Clipchamp > Export > 720p. (from lesson 3)\n10. Зупини таймер: час завершення й медаль ти назвеш у звіті дня. Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: кожна назва зі списку є в папці, у кожної є розмір. (from lesson 4)\n\nToday is a BOSS build. Ask me what time I started; whenever I tell you the time, tell me which tier I'm on track for. At the end, ask my finish time. Tiers:\n- Бронза: район 2 завершено, усі обов'язкові виправлення зроблено, десять фінальних кадрів стоять на двох аркушах поруч зі своїми фото, і є кліп — усе за 3 години 30 хвилин.\n- Срібло: усе для Бронзи, а ще кожен фінальний кадр проходить дев'ять передпольотних перевірок тьютора й за 3 секунди погляду витримує порівняння зі своїм фото. Район 2 виглядає іншим місцем, ніж район 1.\n- Золото: усе для Срібла, а ще тьютор в огляді арт-директора студії не знаходить на жодному аркуші обов'язкових виправлень, а ти завершуєш за 3 години.\n\nHow to help: ask which step number I'm on, then give me only the next step: the exact clicks and what I should see. When I send a screenshot, compare it with my reference, my sizes and the spec, and name one thing to fix at a time.\nCheck every save and export by reopening it before we move on:\n- a .md or .txt: open it with Notepad; the text is there, and the name doesn't end in .md.txt\n- the clip: right-click > Properties shows 30 to 60 seconds and under 50 MB\nWhen I write \"готово\", and in any case before the day ends, check with me one item at a time (yes/no): each spec point, then each file on my hand-in list, ready in my day work folder (skip summary.md: the day report writes it next):\n1. final_board_d1.png (п'ять фінальних кадрів району 1 поруч зі своїми фото) (День боса)\n2. final_board_d2.png (п'ять фінальних кадрів району 2 поруч зі своїми фото) (День боса)\n3. self_review_day55.md (сортування, таблиця оцінювання, нотатки тьютора й медаль) (День боса)\n4. clip_day55.mp4 (30–60 секунд, менше 50 МБ, для ролика прогресу) (День боса)\nFinish with a short list of anything missing, the tier I reached, and one line on where this work comes back and what it will look like there. Then tell me the order for the end of the day: first the day report (the Copy the day report button at the bottom of my course page) into summary.md, and only then hand in all the files on the list, summary.md too.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; tier (Bronze, Silver, Gold) = медаль (Бронза, Срібло, Золото); day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; rubric = таблиця оцінювання; self-review = самоперевірка; review (by tutor or art director) = огляд; see-why-fix note = нотатка «бачу, чому, як виправити»; checklist = чек-лист; credits line = рядок авторства; reference photo / hero photo = фото-референс / ключове фото; comparison sheet, board (an image) = аркуш (аркуш порівняння, аркуш референсів); click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); vertex / edge / face = вершина / ребро / грань; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; collision / UCX collision box = колізія / блок UCX; material slot / node / pin = слот матеріалу / вузол / вхід; volume (PCG Volume, Post Process Volume) = об'єм; keep-out zone / footprint test / grounding = зона-виняток / тест опори / посадка на ґрунт; kit / kit piece / part of one object = набір / деталь / частина; district / plot / plot plan = район / ділянка / план ділянки; harbour / quay / waterfront / pier = гавань / причал / набережна / пірс; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; locked camera / locked exposure = заблокована камера / зафіксована експозиція; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; hero shot = головний кадр (hero shot); proof (picture) = доказ; shot set = серія кадрів.\n\nStart by asking for my best reference photo. Then, one at a time, my sizes and my step number.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender.", "reportPrompt": "Help me write today's report for summary.md. I write it before I hand in. Talk to me in simple Ukrainian, and never use gendered forms about me. Keep the English labels below exactly; the text after each label may be Ukrainian.\nAsk me one thing at a time, and skip whatever I've already pasted below:\n1. My lesson summaries («Засвоєно» / «Було важко»), or which lessons I skipped.\n2. My first score in the page's \"Check yourself\" quiz.\n3. How far the build got: done, partly or blocked (if blocked, where).\n4. The time I finished the Boss build (hh:mm).\n5. My hand-in list, one item at a time (skip summary.md): is the file ready in my day work folder (GAD\\Day-55-boss-district2-finished)? (yes/no)\n   - final_board_d1.png (п'ять фінальних кадрів району 1 поруч зі своїми фото) (День боса)\n   - final_board_d2.png (п'ять фінальних кадрів району 2 поруч зі своїми фото) (День боса)\n   - self_review_day55.md (сортування, таблиця оцінювання, нотатки тьютора й медаль) (День боса)\n   - clip_day55.mp4 (30–60 секунд, менше 50 МБ, для ролика прогресу) (День боса)\n6. The checks: my clip is under 50 MB.\n7. One question for Thalia (about any day; start with the day number), or \"none\".\n8. Whether I fixed an earlier day today (which day and what), or \"no\".\n9. About how many hours today took.\nThen give me the finished report in one block I can copy:\n\nTeam summary, <date>, Ivan\nDay 55: Boss: district 2 finished, and five final shots for each district. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; boss tier: <bronze / silver / gold / none>; quiz: <score> of 8\nFinish time: <hh:mm>\nReady to hand in: <tick each item of today's list: ✓ name, or ✗ name and why it isn't ready>\nMissing: <files not ready, or \"none\">\nFixed: <Day N: what I fixed (the fixed files are in that day's hand-in folder), or \"none\">\nChecks: <clip size: ok, or what's wrong>\nQuestion for Thalia: <Day N: one line, or \"none\">\nHours: <about N>\nTo revisit: <the «Було важко» lines>\n\nThen tell me: open summary.md in today's day work folder (GAD\\Day-55-boss-district2-finished) with Notepad (right-click > Open with > Notepad; if there is no summary.md yet, make it: right-click > New > Text Document, named summary.md). Press Ctrl+End, paste the report below anything already there, and save with Ctrl+S. Never delete or paste over what is already in the file. Only then hand in all the files on the list, summary.md too, with the Open my hand-in folder button on the page.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; tier (Bronze, Silver, Gold) = медаль (Бронза, Срібло, Золото); lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; rubric = таблиця оцінювання; self-review = самоперевірка; review (by tutor or art director) = огляд; see-why-fix note = нотатка «бачу, чому, як виправити»; comparison sheet, board (an image) = аркуш (аркуш порівняння, аркуш референсів); click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); vertex / edge / face = вершина / ребро / грань; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; keep-out zone / footprint test / grounding = зона-виняток / тест опори / посадка на ґрунт; district / plot / plot plan = район / ділянка / план ділянки; locked camera / locked exposure = заблокована камера / зафіксована експозиція; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.", "before": null, "handinUrl": "https://drive.google.com/drive/folders/1WWBzihiY7QTsjWV_6rhDSDu5cQbY_zEi", "assetFiles": ["art-director-notes.md"]}</script>

 for(let i=0;i<=110;i++){const t=i/110,a=t0+t*turns*TAU,s=1.1-t*.98,q=pt(a,s,0);P.push(q);if(last&&t<=(last-1)/11+1e-9)D.push(q)}
 o+='<path class="rt" d="'+smooth(P,false)+'"/>';
 if(D.length>1)o+='<path class="rtd" d="'+smooth(D,false)+'"/>';
 for(let w=1;w<=12;w++){const c=state(w),{a,s}=wp(w),q=pt(a,s,0),lx=q[0]+(Math.cos(a)>=0?15:-15),an=Math.cos(a)>=0?'start':'end';
  o+='<g class="w '+c+'">'+(c==='n'?'<circle class="halo" cx="'+f(q[0])+'" cy="'+f(q[1])+'" r="12"/>':'')+'<circle class="dot" cx="'+f(q[0])+'" cy="'+f(q[1])+'" r="'+(c==='p'?4.5:c==='n'?8:6)+'"/><text x="'+f(lx)+'" y="'+f(q[1]+5.5)+'" text-anchor="'+an+'">'+String(w).padStart(2,'0')+'</text></g>'}
 /* the dial around it: a ring with the progress arc and a label running along the rim */
 const C=2*Math.PI*176,p=Math.max(0,Math.min(1,pct||0)),id='rim'+Math.random().toString(36).slice(2,7);
 let s='<svg class="dial" viewBox="0 0 400 400" aria-hidden="true" focusable="false"><defs><linearGradient id="'+id+'g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--acc2)"/><stop offset="1" style="stop-color:var(--acc)"/></linearGradient><path id="'+id+'" d="M200 200m-191 0a191 191 0 1 1 382 0a191 191 0 1 1-382 0"/></defs>';
 s+='<circle class="face" cx="200" cy="200" r="168"/><circle class="track" cx="200" cy="200" r="176"/>';
 s+='<circle class="arc" cx="200" cy="200" r="176" stroke="url(#'+id+'g)" stroke-dasharray="'+(C*p).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 200 200)"/>';
 if(p>0){const A=-Math.PI/2+p*TAU;s+='<circle class="knob'+(p<1?' go':'')+'" cx="'+(200+176*Math.cos(A)).toFixed(1)+'" cy="'+(200+176*Math.sin(A)).toFixed(1)+'" r="7"/>'}
 if(label)s+='<text class="rimt"><textPath href="#'+id+'" startOffset="25%" text-anchor="middle">'+label+'</textPath></text>';
 s+='<svg class="topo" x="40" y="62" width="320" height="276" viewBox="40 20 520 370">'+o+'</svg>';
 return s+'</svg>'}

function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2600)}
async function cp(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e2){}a.remove()}toast(u('copied'))}
function tagTxt(v){v=String(v);const m=v.match(/^D(\d+)\.(\d+)$/i);return m?u('day')+' '+m[1]+', '+u('lesson')+' '+m[2]:u('lesson')+' '+v}
function fbCard(){const f=FB[D.day];if(!f)return '';
 if(f.s==='reviewed'){try{const z=fbSeen();if(z[D.day]!==f.at){z[D.day]=f.at;localStorage.setItem(fbSeenKey,JSON.stringify(z))}}catch(e){}
  return '<section class="card glass fbcard">'+lab(u('fbTitle'),'ok')+'<div class="row" style="align-items:baseline;gap:12px"><span class="eyebrow">'+u('fbScore')+'</span><span class="big">'+esc(f.score)+'/'+esc(f.max||10)+'</span></div>'+(fbNote(f)?'<p class="note">'+esc(fbNote(f))+'</p>':'')+'<p class="muted">'+u('fbFull')+(D.handinUrl?': <a href="'+esc(D.handinUrl)+'" target="_blank" rel="noopener">'+u('hOpen')+'</a>':': <code>'+esc(D.workPath)+'</code>')+'</p></section>'}
 return '<section class="card glass fbcard">'+lab(u('fbTitle'),f.s==='missing'?'':'ok')+'<p class="note">'+u(f.s==='missing'?'fbMiss':'fbWait')+'</p>'+(f.s==='missing'?hf():'')+'</section>'}
/* fix phase 1 (2026-10-22): the hand-in folder (a button when the roster has a link, else the folder path), the hand-in card,
   Day 0's "Before lesson 1", the checks before handing in, the Questions card, and the day report with the pasted lesson summaries */
const HIN=(D.handin||[]).map(v=>(v&&v.en)||(typeof v==='string'?v:'')).join(' ').toLowerCase(),hasClip=/\.mp4|clip/.test(HIN);
function hItem(v){return x(v)}
function hList(){return '<ul class="ticks">'+(D.handin||[]).map(v=>'<li>'+lk(hItem(v))+'</li>').join('')+'</ul>'}
const NFILES=new Set((HIN.match(/[\w-]+\.(?:blend|glb|fbx|png|jpe?g|md|txt|mp4|csv|zip|pdf|webp|kra|psd|tga|exr|json|py|uasset|umap)\b/g)||[])).size;
function nFiles(n){if(!n)return '';if(lang==='en')return ' · '+n+(n===1?' file':' files');const a=n%10,b=n%100;return ' · '+n+' '+(a===1&&b!==11?'файл':a>=2&&a<=4&&(b<12||b>14)?'файли':'файлів')}
function hf(){return D.handinUrl?'<div class="row"><a class="btn s" href="'+esc(D.handinUrl)+'" target="_blank" rel="noopener">'+ic('folder')+u('hOpen')+'</a></div>':'<p class="path">'+ic('folder')+'<span>'+u('hPath')+' <code>'+esc(D.workPath)+'</code></span></p>'}
function handinCard(){if(!D.handin||!D.handin.length)return '';return '<section class="card glass handin">'+lab(u('hTitle')+nFiles(NFILES),'ok')+hList()+hf()+'<p class="muted" style="margin:12px 0 0">'+u('hNote')+'</p></section>'}
function beforeCard(){if(!D.before||!D.before.length)return '';return '<section class="card glass before">'+lab(u('before'),'gold')+list(D.before,'ol','steps')+'</section>'}
function chkList(){const a=[];if(HIN.indexOf('.blend')>=0)a.push('chk1');if(/\.(glb|fbx)\b/.test(HIN))a.push('chk2');a.push('chk3');if(hasClip)a.push('chk4');return '<h3>'+u('chk')+'</h3><ol class="steps">'+a.map(k=>'<li>'+u(k)+'</li>').join('')+'</ol>'}
function qCard(){return '<section class="card glass qcard">'+lab(u('qTitle'))+'<ul class="ticks"><li>'+u('q1')+'</li><li>'+u('q2')+'</li><li>'+u('q3')+'</li><li>'+u('q4')+'</li><li>'+u('q5')+'</li></ul></section>'}
function reportText(){let t=D.reportPrompt;const r=D.lessons.map((l,i)=>{const v=(st['r'+i]||'').trim();return v?'Lesson '+(i+1)+': '+v:''}).filter(Boolean);
 if(r.length)t+='\n\nMy lesson summaries, pasted from my course page:\n'+r.join('\n');
 if(st.qs1)t+='\nMy first score in the Check yourself quiz: '+st.qs1[0]+' of '+st.qs1[1]+'.';
 return t}
function qDone(){return D.quiz&&D.quiz.length&&st.qa&&D.quiz.every((q,i)=>st.qa[i]!=null)}
function prog(){const Q=(D.quiz&&D.quiz.length)?1:0,L=D.lessons.length,C=D.build.steps.length;let n=0;D.lessons.forEach((l,i)=>{if(st['q'+i])n++});D.build.steps.forEach((s,i)=>{if(st['c'+i])n++});if(Q&&qDone())n++;return (L+C+Q)?n/(L+C+Q):0}
function qScore(){let n=0;D.quiz.forEach((q,i)=>{if((st.qa||{})[i]===q.answer)n++});return n}
function pick(i,k){st.qa=st.qa||{};if(st.qa[i]!=null)return;st.qa[i]=k;if(qDone()){st.qs=[qScore(),D.quiz.length];if(!st.qs1)st.qs1=st.qs.slice()}save();render();const e=document.getElementById('e'+i);if(e)e.focus({preventScroll:true})}
function retry(){st.qa={};delete st.qs;save();render();const e=document.getElementById('o0_0');if(e)e.focus()}
const isBoss=!!(D.build&&D.build.boss&&D.build.boss.length),isFin=D.day===D.total;
document.body.className=isFin?'fin':isBoss?'boss':'';
const lk=s=>esc(s).replace(/https?:\/\/[^\s<']*[^\s<.,;:)']/g,m=>'<a href="'+m+'" target="_blank" rel="noopener">'+m+'</a>');
function list(a,tag,cls){return '<'+tag+(cls?' class="'+cls+'"':'')+'>'+(a||[]).map(i=>'<li>'+lk(x(i))+'</li>').join('')+'</'+tag+'>'}
const lab=(t,k)=>'<div class="lab'+(k?' k-'+k:'')+'"><span class="dotc"></span>'+t+'</div>';
const kn=n=>'<span class="kn">'+ic(n)+'</span>';
const slider=p=>'<div class="slider"><i style="width:calc('+p+'% - 6px)"></i><b style="left:clamp(13px,'+p+'%,calc(100% - 13px))"></b></div>';
function quiz(){if(!D.quiz||!D.quiz.length)return '';const a=st.qa||{};let ok=0;const L=u('letters');
 const pips='<div class="pips well" aria-hidden="true">'+D.quiz.map((q,i)=>'<i class="'+(a[i]==null?'':a[i]===q.answer?'r':'w')+'"></i>').join('')+'</div>';
 const qs=D.quiz.map((q,i)=>{const c=a[i];if(c===q.answer)ok++;return '<div class="qz"><p class="qq"><span class="qn">'+(i+1)+'</span><span>'+lk(x(q.q))+'</span></p>'+q.options.map((o,k)=>{let cls='opt',mk='<span></span>';if(c!=null){if(k===q.answer){cls+=' right';mk=ic('check','mk')}else if(k===c){cls+=' wrong';mk=ic('x','mk')}}return '<button class="'+cls+'" id="o'+i+'_'+k+'"'+(c!=null?' disabled':'')+' onclick="pick('+i+','+k+')"><span class="lt">'+(L[k]||k+1)+'</span><span>'+esc(x(o))+'</span>'+mk+'</button>'}).join('')+(c!=null?'<p class="exp '+(c===q.answer?'r':'w')+'" id="e'+i+'" tabindex="-1"><b>'+(c===q.answer?u('right'):u('wrong'))+'</b>'+lk(x(q.explain))+'</p>':'')+'</div>'}).join('');
 return '<section class="card glass quiz">'+lab(u('quiz'),'gold')+'<p class="muted" style="margin:-6px 0 14px">'+u('quizSub')+'</p>'+pips+qs+(qDone()?'<div class="score well" role="status"><span class="eyebrow">'+u('score')+'</span><span class="lcd" aria-label="'+ok+' / '+D.quiz.length+'">'+seg(ok+'/'+D.quiz.length)+'</span>'+(st.qs1?'<span class="muted">'+u('first')+': '+st.qs1[0]+'/'+st.qs1[1]+'</span>':'')+'<div class="row"><button class="btn ghost" id="retry" onclick="retry()">'+u('retry')+'</button></div></div>':'')+'</section>'}
function vid(v){if(!v)return '';const link=v.url?'<a href="'+esc(v.url)+'" target="_blank" rel="noopener">'+esc(x(v.title)||v.url)+'</a>'+(v.channel?' <span class="muted">· '+esc(v.channel)+(v.length?' · '+esc(v.length):'')+'</span>':''):'';const s=v.search?'<a href="https://www.youtube.com/results?search_query='+encodeURIComponent(v.search)+'" target="_blank" rel="noopener">'+u('noVid')+': '+esc(v.search)+'</a>':'';const alt=v.alt&&v.alt.url?'<br><span class="eyebrow">UA</span> <a href="'+esc(v.alt.url)+'" target="_blank" rel="noopener">'+esc(v.alt.title||v.alt.url)+'</a>'+(v.alt.channel?' <span class="muted">· '+esc(v.alt.channel)+'</span>':''):'';return '<div class="vid well">'+kn('play')+'<div><b>'+u('more')+'?</b><br>'+(link||s)+alt+(link&&s?'<br><span class="muted" style="font-size:14px">'+s+'</span>':'')+'</div></div>'}
function morning(){const m=D.morning;if(!m)return '';const q=m.quote||{};
 let shelf='';if(D.day>0){shelf='<div class="shelf" aria-hidden="true">';let g='';for(let d=0;d<D.day;d++){let p=0;try{p=(JSON.parse(localStorage.getItem('devteam:'+D.learner+':'+d))||{}).pct||0}catch(e){}g+='<i class="'+(p>=1?'d':'')+(d>0&&d%5===0?' bs':'')+'"></i>';if(d%5===0||d===D.day-1){shelf+='<span class="wkg">'+g+'</span>';g=''}}shelf+='</div>'}
 const qt=lang==='uk'&&q.original?q.original:x(q.text);
 return '<section class="card glass morning"><div class="mgrid">'+(m.sofar?'<div>'+lab(u('sofar'),'gold')+shelf+'<p class="mtxt">'+lk(x(m.sofar))+'</p></div>':'')+(m.today?'<div>'+lab(u('todayL'))+'<p class="mtxt">'+lk(x(m.today))+'</p></div>':'')+'</div>'+(m.cheer?'<p class="cheer">'+esc(x(m.cheer))+'</p>':'')+(qt?'<figure class="quote well">'+kn('quote')+'<blockquote>'+esc(qt)+'</blockquote>'+(q.author?'<figcaption>'+esc(x(q.author))+'</figcaption>':'')+'</figure>':'')+'</section>'}

function toggleLang(){setLang(lang==='uk'?'en':'uk')}
/* keep open sections and keyboard focus across re-renders */
const openD=new Set();
function tg(e){if(e.open)openD.add(e.id);else openD.delete(e.id)}
const op=id=>openD.has(id)?' open':'';

 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);
 const b=D.build,P=Math.round(prog()*100);
 document.getElementById('top').innerHTML='<div class="topin glass"><a class="maplink" href="'+esc(D.mapHref)+'">'+kn('map')+u('map')+'</a><div class="crumb"><b>'+esc(x(D.learnerName))+'</b><span>'+u('week')+' '+D.week+'</span><span>'+u('day')+' '+D.day+' '+u('of')+' '+D.total+'</span></div>'+controls(lang,'setLang')+'</div><div class="tline"><i style="width:'+P+'%"></i></div>';
 const state=w=>w<D.week?'b':w===D.week?'n':'p';
 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 let wk='';if(D.weekInfo){const w=D.weekInfo;wk='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}

 h+=handinCard();h+=beforeCard();

 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];

 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+hList()+chkList()+(hasClip?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<h3>1 · '+u('copyR')+'</h3><p class="muted">'+u('report')+'</p><div class="row"><button class="btn ghost" onclick="cp(reportText())">'+ic('copy')+u('copyR')+'</button></div><h3>2 · '+u('ship')+'</h3>'+hf()+'<p class="muted" style="margin:12px 0 0">'+u('hNote')+'</p></section>';

 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();

<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 44</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

<script id="data" type="application/json">{"learner": "ib-ivan-9ac02175", "learnerName": {"en": "Ivan", "uk": "Іван"}, "day": 44, "week": 9, "total": 60, "title": {"en": "Planting, grime and decals: district 1 grows old", "uk": "Рослини, бруд і декалі: район 1 старіє"}, "theme": {"en": "Week 9: District 1: the waterfront", "uk": "Тиждень 9: Район 1: набережна"}, "build": {"item": {"en": "District 1 planted and aged: beds and street trees by hand, wild ground by your biome graph inside the district, the Wear slider set by exposure, and your Day 18 decals where their causes are", "uk": "Район 1 засаджений і зістарений: клумби й вуличні дерева вручну, дикі ділянки всередині району через твій граф біому, повзунок Wear за ступенем відкритості, і твої декалі з Дня 18 там, де їхні причини"}, "why": {"en": "A finished district that looks brand new reads as a model from the air. Plants make it look grown, and wear tells the eye where the sea reaches, where vans turn and where people walk. With the plants, decals and Wear slider you already have, the whole district ages in one day, at a cost you can measure.", "uk": "Готовий район, що виглядає новеньким, з повітря читається як макет. Рослини роблять його обжитим, а зношеність показує оку, куди досягає море, де розвертаються фургони і де ходять люди. З рослинами, декалями й повзунком Wear, які в тебе вже є, увесь район старіє за один день, і цю вартість можна виміряти."}, "where": {"en": "District 1: garden beds, street tree pits, wild ground between and behind the buildings, the quay walls, the road junctions and the busiest paving.", "uk": "Район 1: клумби, приствольні лунки вуличних дерев, дикі ділянки між будівлями й за ними, стіни причалу, перехрестя доріг і найлюдніше мощення."}, "spec": [{"en": "Beds and street trees placed by hand with the Foliage tool (Unreal's brush for painting or clicking plants into place) to the plan's counts, from your picked plant packs. Trees seated (the trunk flare, the wide foot of the trunk, meets the ground) and kept out of the drone lanes.", "uk": "Клумби й вуличні дерева, розміщені вручну інструментом Foliage (пензель Unreal, яким рослини малюють або ставлять клацанням) за кількостями з плану, з вибраних тобою паків рослин. Дерева посаджені правильно (комель, широка основа стовбура, сходиться з землею) і стоять поза коридорами дрона."}, {"en": "Wild ground inside district 1 (slopes behind the houses, gaps between yards) planted by a PCG Volume running PCG_D1_Wild: a copy of your biome graph whose area branch reads the tag KeepOutArea_D1 instead of KeepOutArea. Closed-loop keep-outs KO_D1Built01, 02 ... round buildings, yards and paving carry that tag, on DL_KeepOuts like your Day 38 keep-outs; the copy's KeepOut and KeepOutWide branches still keep roads and the corridor clear.", "uk": "Дикі ділянки всередині району 1 (схили за будинками, проміжки між подвір'ями), засаджені PCG Volume, що запускає PCG_D1_Wild: копію твого графа біому, гілка площ якої читає тег KeepOutArea_D1 замість KeepOutArea. Замкнені зони-винятки KO_D1Built01, 02 ... навколо будівель, подвір'їв і мощення мають цей тег і лежать на DL_KeepOuts, як твої зони-винятки з Дня 38; гілки KeepOut і KeepOutWide у копії й далі тримають вільними дороги й коридор."}, {"en": "Wear by exposure, written in your Day 14 wear_map.md: the Day 14 values on the mesh assets stay as the street default; quay-side and sheltered shop fronts get MI_Trim_ShopFront_Quay (0.6 to 0.8) or MI_Trim_ShopFront_Shelter (0.2) on their Trim slot; a house type that faces the sea gets a more-worn child of MI_Plaster_WallDoor inside its Level Instance. Only the six pieces with painted masks (Days 14 and 15) can wear; on pack buildings and unpainted pieces the slider does nothing.", "uk": "Зношеність за ступенем відкритості, записана у твоєму wear_map.md з Дня 14: значення з Дня 14 на асетах сіток лишаються стандартними для вулиці; фасади крамниць біля причалу та в затишку отримують MI_Trim_ShopFront_Quay (0,6-0,8) або MI_Trim_ShopFront_Shelter (0,2) у слоті Trim; тип будинку, що дивиться на море, отримує більш зношений дочірній інстанс MI_Plaster_WallDoor усередині свого Level Instance. Зношуватися можуть лише шість деталей із намальованими масками (Дні 14 і 15); на будівлях із паків і деталях без масок повзунок нічого не робить."}, {"en": "Day 18 decals where their causes are: algae and salt lines along every quay wall (with breaks), tyre tracks and a puddle at road junctions and delivery spots, and worn patches (MI_Decal_Worn, a child of MI_Decal_Puddle) at doors and benches. Vehicle marks stay on roads.", "uk": "Декалі з Дня 18 там, де їхні причини: водорості й сольові лінії вздовж кожної стіни причалу (з розривами), сліди шин і калюжа на перехрестях і в місцях доставки, затерті плями (MI_Decal_Worn, дочірній від MI_Decal_Puddle) біля дверей і лавок. Сліди машин лишаються на дорогах."}, {"en": "Fade Screen Size set on small decals (they fade out when they are tiny on screen); the decal count and stat unit from C4 in budget.md.", "uk": "Fade Screen Size, встановлений на малих декалях (вони зникають, коли на екрані стають крихітними); кількість декалей і stat unit з C4 у budget.md."}, {"en": "No straight lines in nature, no ruled grime lines, nothing floating.", "uk": "Жодних прямих ліній у природі, жодних рівних, як під лінійку, смуг бруду, нічого не висить у повітрі."}], "piece1": "the first garden bed and one quay wall", "piece2": {"en": "The rest of the planting and grime, on your own", "uk": "Решта рослин і бруду, самостійно"}, "steps": [{"text": {"en": "Screenshot C3 for your before picture. In the Foliage tool, add the plants your plan names as foliage types with scale ranges and Random Yaw. Check: each plant shows in the Foliage panel.", "uk": "Зроби скриншот C3 — це твоє фото «до». В інструменті Foliage додай рослини, які називає план, як типи рослинності (foliage types) з діапазонами масштабу й Random Yaw. Перевірка: кожна рослина видна на панелі Foliage."}, "lesson": 1}, {"text": {"en": "Paint every bed to the plan's counts: tall plants at the back, then the middle, then low plants at the front. Check: the Foliage panel's counts are within 10 % of the plan's.", "uk": "Засади кожну клумбу за кількостями з плану: високі рослини позаду, потім середні, потім низькі спереду. Перевірка: кількості на панелі Foliage відрізняються від плану не більш ніж на 10 %."}, "lesson": 1}, {"text": {"en": "Street trees at their plan points in Single mode, sunk until the trunk flare meets the ground, the pits dressed with low plants. Check: no root floats in a 2 m side view.", "uk": "Вуличні дерева на точках із плану в режимі Single, занурені, доки комель не зійдеться з землею, лунки вбрані низькими рослинами. Перевірка: на вигляді збоку з 2 м жоден корінь не висить у повітрі."}, "lesson": 1}, {"text": {"en": "Make PCG_D1_Wild (a copy of your biome graph with its KeepOutArea branch changed to KeepOutArea_D1) and draw closed-loop keep-outs KO_D1Built01, 02 ... round the buildings, yards and paving, tagged KeepOutArea_D1, on DL_KeepOuts with Is Spatially Loaded unticked. Check: the loops show in a Top view round every built area.", "uk": "Створи PCG_D1_Wild (копію свого графа біому, де гілку KeepOutArea змінено на KeepOutArea_D1) і намалюй замкнені зони-винятки KO_D1Built01, 02 ... навколо будівель, подвір'їв і мощення, з тегом KeepOutArea_D1, на DL_KeepOuts зі знятою позначкою Is Spatially Loaded. Перевірка: у вигляді Top петлі видно навколо кожної забудованої площі."}, "lesson": 2}, {"text": {"en": "A PCG Volume over each wild area running PCG_D1_Wild; Generate. Check: from 30 m no plant stands in a path, a yard or a house.", "uk": "PCG Volume над кожною дикою ділянкою, що запускає PCG_D1_Wild; Generate. Перевірка: з 30 м жодна рослина не стоїть на доріжці, у подвір'ї чи в будинку."}, "lesson": 2}, {"text": {"en": "Slide LaneGauge along the lanes past the new trees. Check: no crown touches the cube.", "uk": "Проведи LaneGauge уздовж коридорів повз нові дерева. Перевірка: жодна крона не торкається куба."}, "lesson": 2}, {"text": {"en": "Wear: give quay-side and sheltered shop fronts MI_Trim_ShopFront_Quay or MI_Trim_ShopFront_Shelter on their Trim slot, and a sea-facing house type a more-worn door-wall instance inside its Level Instance; update wear_map.md. Check: from 10 m the quay-side fronts look older than the sheltered ones.", "uk": "Зношеність: признач фасадам крамниць біля причалу та в затишку MI_Trim_ShopFront_Quay або MI_Trim_ShopFront_Shelter у слоті Trim, а типу будинку, що дивиться на море, — більш зношений інстанс стіни з дверима всередині його Level Instance; онови wear_map.md. Перевірка: з 10 м фасади біля причалу виглядають старшими за ті, що в затишку."}, "lesson": 4}, {"text": {"en": "Quay walls: algae and salt-line decals along every visible metre, with a break every few metres. Check: from 10 m the wall reads as old, not dirty.", "uk": "Стіни причалу: декалі водоростей і сольової лінії вздовж кожного видимого метра, з розривом через кожні кілька метрів. Перевірка: з 10 м стіна читається як стара, а не брудна."}, "lesson": 3}, {"text": {"en": "Roads: tyre tracks at junctions and delivery spots, one puddle where the road dips. Check: no vehicle mark on the promenade paving.", "uk": "Дороги: сліди шин на перехрестях і в місцях доставки, одна калюжа там, де дорога прогинається. Перевірка: на мощенні променаду немає слідів машин."}, "lesson": 3}, {"text": {"en": "Paving wear at shop doors, bench sets and the main walking line with MI_Decal_Worn. Check: from 10 m you can see where people walk.", "uk": "Затерте мощення біля дверей крамниць, наборів лавок і на головній пішохідній лінії з MI_Decal_Worn. Перевірка: з 10 м видно, де ходять люди."}, "lesson": 3}, {"text": {"en": "Fade Screen Size raised to 0.05 on small decals (as on Day 18); delete any decal no camera sees; count the decals in the Outliner. Check: small decals fade as you fly away.", "uk": "Fade Screen Size, піднятий до 0.05 на малих декалях (як на Дні 18); видали кожну декаль, якої не бачить жодна камера; порахуй декалі в Outliner. Перевірка: малі декалі зникають, коли ти відлітаєш."}, "lesson": 4}, {"text": {"en": "stat unit from C4; write the decal count and the GPU time in budget.md. Capture C3 before and after (before_after_day44.png) and a 60-second low flight along the quay and the streets. Save today's clip as flythrough_day44.mp4 and check that you also have planting_counts.md, beds_10m.png, quay_wall_10m.png and district1_30m.png (each is described in today's hand-in list; take any you are missing now). Check: still under your budget, and both files saved.", "uk": "stat unit з C4; запиши кількість декалей і час GPU в budget.md. Зніми C3 до і після (before_after_day44.png) і 60-секундний низький проліт уздовж причалу й вулиць. Збережи сьогоднішнє відео як flythrough_day44.mp4 і перевір, що в тебе також є planting_counts.md, beds_10m.png, quay_wall_10m.png і district1_30m.png (кожен описано в сьогоднішньому списку «Здати роботу»; яких бракує — зніми зараз). Перевірка: ти досі в межах бюджету, і обидва файли збережено."}, "lesson": 4}]}, "lessons": [{"title": {"en": "Planting a town by hand: the Foliage tool and street trees", "uk": "Озеленюємо місто вручну: інструмент Foliage і вуличні дерева"}, "minutes": 40, "goals": [{"en": "Choose the tool: the Foliage tool for designed beds and street trees placed to exact counts, PCG for wild ground.", "uk": "Обирати інструмент: Foliage для спроєктованих клумб і вуличних дерев із точними кількостями, PCG для диких ділянок."}, {"en": "Make foliage types (a plant mesh plus its painting settings) with scale ranges and Random Yaw, and paint a bed back to front.", "uk": "Створювати типи рослинності (сітка рослини плюс її налаштування малювання) з діапазонами масштабу й Random Yaw і засаджувати клумбу від заднього краю до переднього."}, {"en": "Seat a tree: the trunk flare meets the ground and the crown stays out of the lanes.", "uk": "Садити дерево правильно: комель сходиться з землею, а крона лишається поза коридорами."}], "doalong": [{"en": "Open the mode menu at the top left of the main toolbar and choose Foliage. You should see the Foliage panel with an empty list.", "uk": "Відкрий меню режимів угорі ліворуч на головній панелі інструментів і вибери Foliage. Ти маєш побачити панель Foliage з порожнім списком."}, {"en": "Drag two shrubs from your plant pack's folder in the Content Browser into the list. You should see two foliage types appear.", "uk": "Перетягни два кущі з папки свого паку рослин у Content Browser до списку. Ти маєш побачити, як з'являться два типи рослинності."}, {"en": "Click one type and set Scale X from 0.8 to 1.2, and tick Random Yaw (a random turn for each plant) if it is not ticked. Do the same for the other. You should see the settings in the panel below the list.", "uk": "Клацни один тип і встанови Scale X від 0.8 до 1.2, і постав позначку Random Yaw (випадковий поворот для кожної рослини), якщо її немає. Зроби те саме для іншого. Ти маєш побачити налаштування на панелі під списком."}, {"en": "Pick the Paint tool, set a small brush, and paint one bed: tall plants at the back, then the middle, then low plants at the front. You should see a layered bed with no bare soil showing.", "uk": "Вибери інструмент Paint, встанови маленький пензель і засади одну клумбу: високі рослини позаду, потім середні, потім низькі спереду. Ти маєш побачити багатоярусну клумбу без голої землі."}, {"en": "Switch to the Single tool and click a tree at its plan point. You should see one tree, not a scatter.", "uk": "Перемкнися на інструмент Single і клацни, щоб поставити дерево на його точку з плану. Ти маєш побачити одне дерево, а не розсип."}, {"en": "Go back to Selection mode, select the tree and lower it until the trunk flare meets the ground. You should see no floating root in a low side view.", "uk": "Повернися в режим Selection, виділи дерево й опускай його, доки комель не зійдеться з землею. Ти маєш побачити, що на низькому вигляді збоку корінь не висить у повітрі."}], "play": {"en": "Plan against planted: the tutor reads my plan's counts and I read the Foliage panel's. Within 10 % scores a point.", "uk": "План проти посадки: тьютор читає кількості з мого плану, а я — з панелі Foliage. Різниця в межах 10 % дає бал."}, "video": {"search": "unreal engine 5 foliage tool paint tutorial beginners"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Planting a town by hand: the Foliage tool and street trees (Day 44, lesson 1 of 4).\nToday's build: District 1 planted and aged: beds and street trees by hand, wild ground by your biome graph inside the district, the Wear slider set by exposure, and your Day 18 decals where their causes are.\n\nBy the end of this lesson I can:\n1. Choose the tool: the Foliage tool for designed beds and street trees placed to exact counts, PCG for wild ground.\n2. Make foliage types (a plant mesh plus its painting settings) with scale ranges and Random Yaw, and paint a bed back to front.\n3. Seat a tree: the trunk flare meets the ground and the crown stays out of the lanes.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (District 1 has buildings, shop fronts, your own street furniture as instanced sets, and a boat of your own moored three times.), what I will learn today (You plant beds, street trees and wild ground in district 1, and add grime and wear where water, wheels and feet would put them.), encourage me (Planting and grime make a place feel lived in, so work by cause and let your photos tell you when to stop.), and share today's quote: \"My work is loving the world. Here the sunflowers, there the hummingbird — equal seekers of sweetness.\" (Mary Oliver).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 41: your budget says 16.6 ms. What does that number mean? | Day 37: what makes the line between two biomes look natural?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Plan against planted: the tutor reads my plan's counts and I read the Foliage panel's. Within 10 % scores a point.\n6. Do-along on today's build (the first garden bed and one quay wall): guide me through these steps one at a time, checking a screenshot after each:\n   - Open the mode menu at the top left of the main toolbar and choose Foliage. You should see the Foliage panel with an empty list.\n   - Drag two shrubs from your plant pack's folder in the Content Browser into the list. You should see two foliage types appear.\n   - Click one type and set Scale X from 0.8 to 1.2, and tick Random Yaw (a random turn for each plant) if it is not ticked. Do the same for the other. You should see the settings in the panel below the list.\n   - Pick the Paint tool, set a small brush, and paint one bed: tall plants at the back, then the middle, then low plants at the front. You should see a layered bed with no bare soil showing.\n   - Switch to the Single tool and click a tree at its plan point. You should see one tree, not a scatter.\n   - Go back to Selection mode, select the tree and lower it until the trunk flare meets the ground. You should see no floating root in a low side view.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Wild ground inside the district with your biome graph", "uk": "Дикі ділянки всередині району з твоїм графом біому"}, "minutes": 40, "goals": [{"en": "Reuse your biome graph inside the district, where KO_District1 (Day 38) left the ground bare.", "uk": "Повторно використовувати свій граф біому всередині району, де KO_District1 (День 38) лишив землю голою."}, {"en": "Give the copy its own area tag, KeepOutArea_D1, so KO_District1 no longer empties it, while the road and corridor keep-outs still work.", "uk": "Давати копії власний тег площі, KeepOutArea_D1, щоб KO_District1 більше її не спустошував, а зони-винятки доріг і коридору й далі працювали."}, {"en": "Check the result from 30 m for rows, carpets and plants in paths.", "uk": "Перевіряти результат із 30 м: чи немає рядів, суцільних килимів і рослин на доріжках."}], "doalong": [{"en": "In the Content Browser, right-click the biome graph that grows round district 1 > Duplicate and name it PCG_D1_Wild. Open it and find the Day 38 area branch: the Get Spline Data node whose Actor Selection Tag is KeepOutArea. Change that tag to KeepOutArea_D1 and leave the KeepOut and KeepOutWide branches as they are. You should see KeepOutArea_D1 in that node's Details. (KO_District1 carries KeepOutArea, so it no longer empties this graph, while roads and the corridor stay clear.)", "uk": "У Content Browser правий клік по графу біому, що росте навколо району 1 > Duplicate і назви його PCG_D1_Wild. Відкрий його і знайди гілку площ із Дня 38: вузол Get Spline Data, у якого Actor Selection Tag дорівнює KeepOutArea. Зміни цей тег на KeepOutArea_D1, а гілки KeepOut і KeepOutWide залиш як є. Ти маєш побачити KeepOutArea_D1 у Details цього вузла. (KO_District1 має тег KeepOutArea, тож він більше не спустошує цей граф, а дороги й коридор лишаються вільними.)"}, {"en": "Make KO_D1Built01 as on Day 38: an Empty Actor with a Spline, its points round the nearest buildings, yards and paving, Closed Loop ticked and the tag KeepOutArea_D1 (Details > Actor > Tags). Put it on DL_KeepOuts and untick Is Spatially Loaded. You should see the closed loop in a Top view.", "uk": "Створи KO_D1Built01, як на Дні 38: Empty Actor зі Spline, його точки навколо найближчих будівель, подвір'їв і мощення, з позначкою Closed Loop і тегом KeepOutArea_D1 (Details > Actor > Tags). Поклади його на DL_KeepOuts і зніми позначку Is Spatially Loaded. Ти маєш побачити замкнену петлю у вигляді Top."}, {"en": "In Place Actors search PCG Volume and drag one over a wild area inside the district (a slope behind the houses, a gap between yards); scale it to fit and set its Graph to PCG_D1_Wild in Details. You should see its box over the bare ground.", "uk": "У Place Actors знайди PCG Volume і перетягни його на дику ділянку всередині району (схил за будинками, проміжок між подвір'ями); змасштабуй, щоб пасував, і встанови його Graph на PCG_D1_Wild у Details. Ти маєш побачити його коробку над голою землею."}, {"en": "Click Generate in its Details. You should see plants fill the box but leave the buildings, yards and paths clear.", "uk": "Натисни Generate у його Details. Ти маєш побачити, як рослини заповнюють коробку, але оминають будівлі, подвір'я й доріжки."}, {"en": "Fly to 30 m and screenshot; then slide LaneGauge along the nearest lane. You should see no plant in a path and no crown touching the cube.", "uk": "Підлети на 30 м і зроби скриншот; потім проведи LaneGauge уздовж найближчого коридору. Ти маєш побачити, що на доріжках немає рослин, а жодна крона не торкається куба."}], "play": {"en": "Rule referee: the tutor checks my 30 m screenshot for rows, carpets, floating plants and plants in paths. I fix each and resend.", "uk": "Суддя правил: тьютор перевіряє мій скриншот із 30 м на ряди, килими, рослини в повітрі й рослини на доріжках. Я виправляю кожну проблему й надсилаю знову."}, "video": {"url": "https://www.youtube.com/watch?v=Pa6Gt0fV8Oc", "title": "How to Create Paths in Your Forest Biome Using Splines & PCG | Unreal Engine 5", "channel": "All things GAME!", "length": "18:04", "search": "unreal engine pcg spline exclusion paths forest"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Wild ground inside the district with your biome graph (Day 44, lesson 2 of 4).\nToday's build: District 1 planted and aged: beds and street trees by hand, wild ground by your biome graph inside the district, the Wear slider set by exposure, and your Day 18 decals where their causes are.\nEarlier today I already did: lesson 1 (Planting a town by hand: the Foliage tool and street trees). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Reuse your biome graph inside the district, where KO_District1 (Day 38) left the ground bare.\n2. Give the copy its own area tag, KeepOutArea_D1, so KO_District1 no longer empties it, while the road and corridor keep-outs still work.\n3. Check the result from 30 m for rows, carpets and plants in paths.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Rule referee: the tutor checks my 30 m screenshot for rows, carpets, floating plants and plants in paths. I fix each and resend.\n4. Do-along on today's build (the first garden bed and one quay wall): guide me through these steps one at a time, checking a screenshot after each:\n   - In the Content Browser, right-click the biome graph that grows round district 1 > Duplicate and name it PCG_D1_Wild. Open it and find the Day 38 area branch: the Get Spline Data node whose Actor Selection Tag is KeepOutArea. Change that tag to KeepOutArea_D1 and leave the KeepOut and KeepOutWide branches as they are. You should see KeepOutArea_D1 in that node's Details. (KO_District1 carries KeepOutArea, so it no longer empties this graph, while roads and the corridor stay clear.)\n   - Make KO_D1Built01 as on Day 38: an Empty Actor with a Spline, its points round the nearest buildings, yards and paving, Closed Loop ticked and the tag KeepOutArea_D1 (Details > Actor > Tags). Put it on DL_KeepOuts and untick Is Spatially Loaded. You should see the closed loop in a Top view.\n   - In Place Actors search PCG Volume and drag one over a wild area inside the district (a slope behind the houses, a gap between yards); scale it to fit and set its Graph to PCG_D1_Wild in Details. You should see its box over the bare ground.\n   - Click Generate in its Details. You should see plants fill the box but leave ak, a dark patch, a tyre arc). I say its cause and where it belongs in my district.", "uk": "Причина й наслідок: тьютор називає слід (біла смуга, темна пляма, дуга від шини). Я кажу його причину і де йому місце в моєму районі."}, "video": {"url": "https://www.youtube.com/watch?v=ymg0btE24S0", "title": "UE5 Beginner Tutorial: Use DECALS To Add DIRT And GRUNGE To Your Game!", "channel": "Unreal Dev Hub", "length": "8:31", "search": "unreal engine 5 decals dirt grunge"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Grime where its cause is (Day 44, lesson 3 of 4).\nToday's build: District 1 planted and aged: beds and street trees by hand, wild ground by your biome graph inside the district, the Wear slider set by exposure, and your Day 18 decals where their causes are.\nEarlier today I already did: lesson 1 (Planting a town by hand: the Foliage tool and street trees); lesson 2 (Wild ground inside the district with your biome graph). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Put grime where its cause is: water (algae and salt lines), wheels (tyre tracks and puddles) and feet (worn paving).\n2. Reuse your four Day 18 decals (MI_Decal_SaltLine, MI_Decal_Algae, MI_Decal_Puddle, MI_Decal_TyreTrack), with child instances (a copy of a material instance that changes only a few settings) for new looks such as a worn patch.\n3. Break every grime line: no ruled edges.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the uld see them fade out when they get tiny on screen.\n   - In Play, run stat unit at C4's spot and at the quay at 2 m. You should see two GPU times to write in budget.md.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Scratch, Grime & Grunge Imperfections Textures In Unreal Engine 5 - Introduction & Master Material\" by BuildGamesWithJon: https://www.youtube.com/watch?v=jEGeqewASV8\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "planting_counts.md (the Foliage panel's counts beside the plan's)", "uk": "planting_counts.md (кількості з панелі Foliage поруч із кількостями з плану)"}, {"en": "wear_map.md (objects, Wear values and decals)", "uk": "wear_map.md (об'єкти, значення Wear і декалі)"}, {"en": "budget.md (decal count and stat unit at C4 and at the quay)", "uk": "budget.md (кількість декалей і stat unit на C4 та на причалі)"}, {"en": "beds_10m.png, quay_wall_10m.png and district1_30m.png", "uk": "beds_10m.png, quay_wall_10m.png і district1_30m.png"}, {"en": "before_after_day44.png (C3 before and after)", "uk": "before_after_day44.png (C3 до і після)"}, {"en": "flythrough_day44.mp4 (60 seconds low along the quay and the streets)", "uk": "flythrough_day44.mp4 (60 секунд низько вздовж причалу й вулиць)"}, {"en": "summary.md", "uk": "звіт дня (summary.md)"}], "goal": {"en": "By the end of today you have district 1 planted with beds, street trees and wild ground, and its quay, roads and fronts carrying wear and grime exactly where water, wheels and feet would put them.", "uk": "Наприкінці дня район 1 засаджений клумбами, вуличними деревами й дикими ділянками, а на його причалі, дорогах і фасадах є зношеність і бруд саме там, де їх лишили б вода, колеса й ноги."}, "uses": [{"en": "Day 43: the furnished district 1", "uk": "День 43: облаштований район 1"}, {"en": "Days 14 and 15: the Wear slider (wear masks painted on a second UV map for six pieces, their own instances such as MI_Trim_ShopFront_A, and wear_map.md)", "uk": "Дні 14 і 15: повзунок Wear (маски зношеності, намальовані на другій UV-мапі для шести деталей, їхні власні інстанси, як-от MI_Trim_ShopFront_A, і wear_map.md)"}, {"en": "Day 42: the shop fronts, each with its own Plaster colour, and the house types LI_HarbourHouse_A and _B", "uk": "День 42: фасади крамниць, кожен із власним кольором Plaster, і типи будинків LI_HarbourHouse_A і _B"}, {"en": "Day 18: your salt-line, algae, puddle and tyre-track decals", "uk": "День 18: твої декалі сольової лінії, водоростей, калюжі й слідів шин"}, {"en": "Days 36 to 38: your biome graphs and their keep-out branches (tags KeepOut, KeepOutArea and KeepOutWide; KO_District1 on DL_KeepOuts)", "uk": "Дні 36-38: твої графи біомів і їхні гілки зон-винятків (теги KeepOut, KeepOutArea і KeepOutWide; KO_District1 на DL_KeepOuts)"}, {"en": "Day 24: the plant packs you picked (Free Shrubs Pack, Free Nanite Plants sample)", "uk": "День 24: вибрані тобою паки рослин (Free Shrubs Pack, зразок Free Nanite Plants)"}], "quiz": [{"q": {"en": "Tyre marks appear on the promenade paving where no car can drive. What is wrong?", "uk": "Сліди шин з'являються на мощенні променаду, де жодна машина не проїде. Що не так?"}, "options": [{"en": "Nothing, because marks add realism anywhere", "uk": "Нічого, бо сліди додають реалізму будь-де"}, {"en": "The marks have no cause there; move them to the road junction and delivery spots", "uk": "У слідів там немає причини; перенеси їх на перехрестя і в місця доставки"}, {"en": "The decal's Sort Order is too high", "uk": "Sort Order у декалі зависокий"}, {"en": "The decal needs collision", "uk": "Декалі потрібна колізія"}], "answer": 1, "explain": {"en": "Grime must have a cause. Marks without one tell the viewer the scene was dressed, not lived in.", "uk": "Бруд мусить мати причину. Сліди без причини кажуть глядачеві, що сцену прикрасили, а не жили в ній."}}, {"q": {"en": "When do you use the Foliage tool instead of PCG?", "uk": "Коли брати інструмент Foliage замість PCG?"}, "options": [{"en": "For designed beds and street trees placed to exact counts", "uk": "Для спроєктованих клумб і вуличних дерев із точними кількостями"}, {"en": "For wild ground over many hectares", "uk": "Для диких ділянок на багатьох гектарах"}, {"en": "Never, because PCG always wins", "uk": "Ніколи, бо PCG завжди кращий"}, {"en": "Only for rocks", "uk": "Лише для каміння"}], "answer": 0, "explain": {"en": "Designed planting follows exact counts and places, which hand placement does best. PCG suits large natural areas.", "uk": "Спроєктоване озеленення йде за точними кількостями й місцями, і з цим найкраще впорається ручна розстановка. PCG пасує для великих природних площ."}}, {"q": {"en": "Your new PCG Volume inside district 1 generates nothing, but the same graph works elsewhere on the island. What is the likely cause?", "uk": "Твій новий PCG Volume усередині району 1 нічого не генерує, хоча той самий граф працює деінде на острові. Яка ймовірна причина?"}, "options": [{"en": "The volume is too small", "uk": "Об'єм замалий"}, {"en": "Plants can't grow near water", "uk": "Рослини не можуть рости біля води"}, {"en": "KO_District1 removes every point inside the district; the copy's area branch should read KeepOutArea_D1 instead", "uk": "KO_District1 прибирає кожну точку всередині району; гілка площ у копії має читати KeepOutArea_D1"}, {"en": "The Data Layer is hidden", "uk": "Data Layer приховано"}], "answer": 2, "explain": {"en": "The island's graphs remove everything inside KO_District1, which is tagged KeepOutArea. A copy whose area branch reads KeepOutArea_D1 plants the district's wild ground and still keeps buildings, roads and lanes clear.", "uk": "Графи острова прибирають усе всередині KO_District1, який має тег KeepOutArea. Копія, гілка площ якої читає KeepOutArea_D1, засаджує дикі ділянки району й водночас тримає вільними будівлі, дороги й коридори."}}, {"q": {"en": "You want only the quay-side shop fronts to look old. You set Wear 0.7 on MI_Trim_ShopFront_A, and every shop front on the island ages, even in sheltered lanes. What should you do?", "uk": "Ти хочеш, щоб старими виглядали лише фасади крамниць біля причалу. Ти ставиш Wear 0.7 на MI_Trim_ShopFront_A, і старіє кожен фасад на острові, навіть у затишних провулках. Що робити?"}, "options": [{"en": "Paint a new wear mask for every front", "uk": "Намалювати нову маску зношеності для кожного фасаду"}, {"en": "Set it back, and give each quay-side front a child of MI_Trim_ShopFront_A with Wear 0.7 on its Trim slot", "uk": "Повернути значення назад і дати кожному фасаду біля причалу дочірній інстанс MI_Trim_ShopFront_A з Wear 0.7 у слоті Trim"}, {"en": "Lower the opacity of your decals", "uk": "Зменшити непрозорість декалей"}, {"en": "Turn off Lumen", "uk": "Вимкнути Lumen"}], "answer": 1, "explain": {"en": "MI_Trim_ShopFront_A sits on the mesh asset, so it changes every copy. A child instance keeps the wear mask and lets chosen fronts have their own Wear.", "uk": "MI_Trim_ShopFront_A стоїть на асеті сітки, тож змінює кожну копію. Дочірній інстанс зберігає маску зношеності й дає вибраним фасадам власний Wear."}}, {"q": {"en": "A street tree on a sloped pit shows its roots floating 15 cm above the ground on the low side. What do you do?", "uk": "Вуличне дерево в похилій лунці показує корені, що висять на 15 см над землею з нижчого боку. Що ти робиш?"}, "options": [{"en": "Scale the tree up", "uk": "Збільшую масштаб дерева"}, {"en": "Add a decal under it", "uk": "Додаю під нього декаль"}, {"en": "Turn on Nanite", "uk": "Вмикаю Nanite"}, {"en": "Sink it until the trunk flare meets the ground on the low side", "uk": "Занурюю його, доки комель не зійдеться з землею з нижчого боку"}], "answer": 3, "explain": {"en": "A tree stands on one point, so its low side lifts on a slope. Sinking it hides the gap.", "uk": "Дерево стоїть на одній точці, тож на схилі його нижчий бік піднімається. Занурення ховає щілину."}}], "weekInfo": {"week": 9, "title": {"en": "District 1: the waterfront", "uk": "Район 1: набережна"}, "goal": {"en": "By Friday you have district 1, your waterfront, built from your plan with your own kit, props, boats, plants and decals, measured against a frame budget, and five screenshots that stand beside your reference photos.", "uk": "До п'ятниці в тебе є район 1, твоя набережна, збудований за твоїм планом із твого власного модульного набору, пропсів, човнів, рослин і декалей, перевірений бюджетом кадру, та п'ять скриншотів, які витримують порівняння з твоїми референсними фото."}, "skills": [{"en": "Set dressing a 200 x 200 m district from a counted plot plan in Unreal Engine 5", "uk": "Наповнення сцени (set dressing) району 200 x 200 м за планом розміщення з підрахунками в Unreal Engine 5"}, {"en": "Performance budgeting with stat unit, stat gpu and CSV profiling", "uk": "Бюджет продуктивності зі stat unit, stat gpu і CSV-профілюванням"}, {"en": "Modular building assembly with Level Instances and Packed Level Actors", "uk": "Збирання модульних будівель за допомогою Level Instances і Packed Level Actors"}, {"en": "Decal and material-wear storytelling for realistic environments", "uk": "Розповідь через декалі та зношеність матеріалів для реалістичного оточення"}, {"en": "Art review against reference photographs with located see-why-fix notes", "uk": "Арт-рев'ю за референсними фото з прив'язаними до місця нотатками «що бачу, чому, як виправити»"}]}, "morning": {"sofar": {"en": "District 1 has buildings, shop fronts, your own street furniture as instanced sets, and a boat of your own moored three times.", "uk": "У районі 1 є будівлі, вітрини, твої власні вуличні меблі групами інстансів і твій власний човен, пришвартований у трьох місцях."}, "today": {"en": "You plant beds, street trees and wild ground in district 1, and add grime and wear where water, wheels and feet would put them.", "uk": "Сьогодні ти висаджуєш клумби, вуличні дерева й дику рослинність у районі 1 і додаєш бруд та зношеність там, де їх залишили б вода, колеса й ноги."}, "cheer": {"en": "Planting and grime make a place feel lived in, so work by cause and let your photos tell you when to stop.", "uk": "Рослини й бруд роблять місце обжитим, тож працюй від причини, а фото підкажуть, коли зупинитися."}, "quote": {"text": {"en": "My work is loving the world. Here the sunflowers, there the hummingbird — equal seekers of sweetness.", "uk": "Моя робота — любити світ. Ось соняшники, а там колібрі — рівні шукачі солодкості."}, "author": {"en": "Mary Oliver", "uk": "Мері Олівер"}, "source": "https://en.wikiquote.org/wiki/Mary_Oliver"}}, "hasAssets": false, "workPath": "Work\\Assignment\\Day-44-district1-planting-grime-decals", "mapHref": "../../COURSE.html", "prevHref": "../Day-43-district1-street-furniture-and-boats/START-HERE.html", "nextHref": "../Day-45-boss-district1-r1/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me and don't write code. Keep me moving and make it feel like a game.\n\nToday I build on my own: The rest of the planting and grime, on your own.\nIt's part of: District 1 planted and aged: beds and street trees by hand, wild ground by your biome graph inside the district, the Wear slider set by exposure, and your Day 18 decals where their causes are (District 1: garden beds, street tree pits, wild ground between and behind the buildings, the quay walls, the road junctions and the busiest paving.).\n\nSpec:\n- Beds and street trees placed by hand with the Foliage tool (Unreal's brush for painting or clicking plants into place) to the plan's counts, from your picked plant packs. Trees seated (the trunk flare, the wide foot of the trunk, meets the ground) and kept out of the drone lanes.\n- Wild ground inside district 1 (slopes behind the houses, gaps between yards) planted by a PCG Volume running PCG_D1_Wild: a copy of your biome graph whose area branch reads the tag KeepOutArea_D1 instead of KeepOutArea. Closed-loop keep-outs KO_D1Built01, 02 ... round buildings, yards and paving carry that tag, on DL_KeepOuts like your Day 38 keep-outs; the copy's KeepOut and KeepOutWide branches still keep roads and the corridor clear.\n- Wear by exposure, written in your Day 14 wear_map.md: the Day 14 values on the mesh assets stay as the street default; quay-side and sheltered shop fronts get MI_Trim_ShopFront_Quay (0.6 to 0.8) or MI_Trim_ShopFront_Shelter (0.2) on their Trim slot; a house type that faces the sea gets a more-worn child of MI_Plaster_WallDoor inside its Level Instance. Only the six pieces with painted masks (Days 14 and 15) can wear; on pack buildings and unpainted pieces the slider does nothing.\n- Day 18 decals where their causes are: algae and salt lines along every quay wall (with breaks), tyre tracks and a puddle at road junctions and delivery spots, and worn patches (MI_Decal_Worn, a child of MI_Decal_Puddle) at doors and benches. Vehicle marks stay on roads.\n- Fade Screen Size set on small decals (they fade out when they are tiny on screen); the decal count and stat unit from C4 in budget.md.\n- No straight lines in nature, no ruled grime lines, nothing floating.\n\nMy checklist:\n1. Screenshot C3 for your before picture. In the Foliage tool, add the plants your plan names as foliage types with scale ranges and Random Yaw. Check: each plant shows in the Foliage panel. (from lesson 1)\n2. Paint every bed to the plan's counts: tall plants at the back, then the middle, then low plants at the front. Check: the Foliage panel's counts are within 10 % of the plan's. (from lesson 1)\n3. Street trees at their plan points in Single mode, sunk until the trunk flare meets the ground, the pits dressed with low plants. Check: no root floats in a 2 m side view. (from lesson 1)\n4. Make PCG_D1_Wild (a copy of your biome graph with its KeepOutArea branch changed to KeepOutArea_D1) and draw closed-loop keep-outs KO_D1Built01, 02 ... round the buildings, yards and paving, tagged KeepOutArea_D1, on DL_KeepOuts with Is Spatially Loaded unticked. Check: the loops show in a Top view round every built area. (from lesson 2)\n5. A PCG Volume over each wild area running PCG_D1_Wild; Generate. Check: from 30 m no plant stands in a path, a yard or a house. (from lesson 2)\n6. Slide LaneGauge along the lanes past the new trees. Check: no crown touches the cube. (from lesson 2)\n7. Wear: give quay-side and sheltered shop fronts MI_Trim_ShopFront_Quay or MI_Trim_ShopFront_Shelter on their Trim slot, and a sea-facing house type a more-worn door-wall instance inside its Level Instance; update wear_map.md. Check: from 10 m the quay-side fronts look older than the sheltered ones. (from lesson 4)\n8. Quay walls: algae and salt-line decals along every visible metre, with a break every few metres. Check: from 10 m the wall reads as old, not dirty. (from lesson 3)\n9. Roads: tyre tracks at junctions and delivery spots, one puddle where the road dips. Check: no vehicle mark on the promenade paving. (from lesson 3)\n10. Paving wear at shop doors, bench sets and the main walking line with MI_Decal_Worn. Check: from 10 m you can see where people walk. (from lesson 3)\n11. Fade Screen Size raised to 0.05 on small decals (as on Day 18); delete any decal no camera sees; count the decals in the Outliner. Check: small decals fade as you fly away. (from lesson 4)\n12. stat unit from C4; write the decal count and the GPU time in budget.md. Capture C3 before and after (before_after_day44.png) and a 60-second low flight along the quay and the streets. Save today's clip as flythrough_day44.mp4 and check that you also have planting_counts.md, beds_10m.png, quay_wall_10m.png and district1_30m.png (each is described in today's hand-in list; take any you are missing now). Check: still under your budget, and both files saved. (from lesson 4)\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Ivan\nDay 44: Planting, grime and decals: district 1 grows old. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

function quiz(){if(!D.quiz||!D.quiz.length)return '';const a=st.qa||{};let ok=0;const L=u('letters');
 const pips='<div class="pips well" aria-hidden="true">'+D.quiz.map((q,i)=>'<i class="'+(a[i]==null?'':a[i]===q.answer?'r':'w')+'"></i>').join('')+'</div>';
 const qs=D.quiz.map((q,i)=>{const c=a[i];if(c===q.answer)ok++;return '<div class="qz"><p class="qq"><span class="qn">'+(i+1)+'</span><span>'+lk(x(q.q))+'</span></p>'+q.options.map((o,k)=>{let cls='opt',mk='<span></span>';if(c!=null){if(k===q.answer){cls+=' right';mk=ic('check','mk')}else if(k===c){cls+=' wrong';mk=ic('x','mk')}}return '<button class="'+cls+'" id="o'+i+'_'+k+'"'+(c!=null?' disabled':'')+' onclick="pick('+i+','+k+')"><span class="lt">'+(L[k]||k+1)+'</span><span>'+esc(x(o))+'</span>'+mk+'</button>'}).join('')+(c!=null?'<p class="exp '+(c===q.answer?'r':'w')+'" id="e'+i+'" tabindex="-1"><b>'+(c===q.answer?u('right'):u('wrong'))+'</b>'+lk(x(q.explain))+'</p>':'')+'</div>'}).join('');
 return '<section class="card glass quiz">'+lab(u('quiz'),'gold')+'<p class="muted" style="margin:-6px 0 14px">'+u('quizSub')+'</p>'+pips+qs+(qDone()?'<div class="score well" role="status"><span class="eyebrow">'+u('score')+'</span><span class="lcd" aria-label="'+ok+' / '+D.quiz.length+'">'+seg(ok+'/'+D.quiz.length)+'</span><div class="row"><button class="btn ghost" id="retry" onclick="retry()">'+u('retry')+'</button></div></div>':'')+'</section>'}
function vid(v){if(!v)return '';const link=v.url?'<a href="'+esc(v.url)+'" target="_blank" rel="noopener">'+esc(x(v.title)||v.url)+'</a>'+(v.channel?' <span class="muted">· '+esc(v.channel)+(v.length?' · '+esc(v.length):'')+'</span>':''):'';const s=v.search?'<a href="https://www.youtube.com/results?search_query='+encodeURIComponent(v.search)+'" target="_blank" rel="noopener">'+u('noVid')+': '+esc(v.search)+'</a>':'';const alt=v.alt&&v.alt.url?'<br><span class="eyebrow">UA</span> <a href="'+esc(v.alt.url)+'" target="_blank" rel="noopener">'+esc(v.alt.title||v.alt.url)+'</a>'+(v.alt.channel?' <span class="muted">· '+esc(v.alt.channel)+'</span>':''):'';return '<div class="vid well">'+kn('play')+'<div><b>'+u('more')+'?</b><br>'+(link||s)+alt+(link&&s?'<br><span class="muted" style="font-size:14px">'+s+'</span>':'')+'</div></div>'}
function morning(){const m=D.morning;if(!m)return '';const q=m.quote||{};
 let shelf='';if(D.day>0){shelf='<div class="shelf" aria-hidden="true">';let g='';for(let d=0;d<D.day;d++){let p=0;try{p=(JSON.parse(localStorage.getItem('devteam:'+D.learner+':'+d))||{}).pct||0}catch(e){}g+='<i class="'+(p>=1?'d':'')+(d>0&&d%5===0?' bs':'')+'"></i>';if(d%5===0||d===D.day-1){shelf+='<span class="wkg">'+g+'</span>';g=''}}shelf+='</div>'}
 const qt=lang==='uk'&&q.original?q.original:x(q.text);
 return '<section class="card glass morning"><div class="mgrid">'+(m.sofar?'<div>'+lab(u('sofar'),'gold')+shelf+'<p class="mtxt">'+lk(x(m.sofar))+'</p></div>':'')+(m.today?'<div>'+lab(u('todayL'))+'<p class="mtxt">'+lk(x(m.today))+'</p></div>':'')+'</div>'+(m.cheer?'<p class="cheer">'+esc(x(m.cheer))+'</p>':'')+(qt?'<figure class="quote well">'+kn('quote')+'<blockquote>'+esc(qt)+'</blockquote>'+(q.author?'<figcaption>'+esc(x(q.author))+'</figcaption>':'')+'</figure>':'')+'</section>'}
function setLang(l){lang=l;try{localStorage.setItem('devteam:lang',lang)}catch(e){};render()}
function toggleLang(){setLang(lang==='uk'?'en':'uk')}
/* keep open sections and keyboard focus across re-renders */
const openD=new Set();
function tg(e){if(e.open)openD.add(e.id);else openD.delete(e.id)}
const op=id=>openD.has(id)?' open':'';
function render(){const ae=document.activeElement,fid=ae&&(ae.id||(ae.getAttribute('data-th')?'th-'+ae.getAttribute('data-th'):ae.getAttribute('lang')&&ae.closest('.seg')?'lg-'+ae.getAttribute('lang'):''));
 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);
 const b=D.build,P=Math.round(prog()*100);
 document.getElementById('top').innerHTML='<div class="topin glass"><a class="maplink" href="'+esc(D.mapHref)+'">'+kn('map')+u('map')+'</a><div class="crumb"><b>'+esc(x(D.learnerName))+'</b><span>'+u('week')+' '+D.week+'</span><span>'+u('day')+' '+D.day+' '+u('of')+' '+D.total+'</span></div>'+controls(lang,'setLang')+'</div><div class="tline"><i style="width:'+P+'%"></i></div>';
 const state=w=>w<D.week?'b':w===D.week?'n':'p';
 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 if(D.weekInfo){const w=D.weekInfo;h+='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}
 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p><div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+list(D.handin,'ul','ticks')+'<p class="path">'+ic('folder')+'<span>'+u('shipTo')+' <code>'+esc(D.workPath)+'</code></span></p>'+(D.lessons.length?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<p class="muted">'+u('report')+'</p><div class="row"><button class="btn s" onclick="cp(D.reportPrompt)">'+ic('copy')+u('copyR')+'</button></div></section>';
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();
</script>
</body>
</html>

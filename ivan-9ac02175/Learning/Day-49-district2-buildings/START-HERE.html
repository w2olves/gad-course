<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 49</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

ок замінено копією з бібліотеки, будівлею з набору або будівлею з пака на тому самому місці, з точністю до 0,5 м. Кожен замінений блок видалено."}, {"en": "Variation without new models: house types turned, with different outside details (fences, gates, steps, a lean-to from kit walls). At least three wall or roof colours across the district. Pack buildings can take their own colour instance per copy, because they are single actors.", "uk": "Різноманіття без нових моделей: типи будинків повернуто і дано їм різні доповнення зовні (паркани, хвіртки, сходи, прибудова зі стін набору). Щонайменше три кольори стін чи дахів на весь район. Будівлі з паків можуть мати власний інстанс кольору на кожну копію, бо це окремі актори."}, {"en": "A shelf for every footprint. On slopes, buildings sunk and given SM_Steps or a plinth (a low base wall), never a vertical landscape face. Walking paths under 8 % (8 m up per 100 m along), or with steps.", "uk": "Уступ під кожен обрис. На схилах будівлі занурено і додано SM_Steps або цоколь (низьку опорну стінку), ніколи не вертикальну стіну ландшафту. Пішохідні доріжки мають ухил до 8 % (8 м підйому на 100 м довжини) або сходи."}, {"en": "SM_ShopFront_A on any shop, inn or café the plan names, in its own colour instance.", "uk": "SM_ShopFront_A на кожній крамниці, корчмі чи кав'ярні з плану, з власним інстансом кольору."}, {"en": "The landmark: your Day 32 blockout of district 2's landmark (a lighthouse, tower, barn or silo), checked against landmarks.md and your photos. It is two or three times the height of the houses, in colours that read against the sky. You can pick it out from 300 m along a road. Day 51 models it.", "uk": "Орієнтир: блокаут орієнтира району 2 з Дня 32 (маяк, вежа, клуня чи силос), звірений із landmarks.md і твоїми фото. Він у два-три рази вищий за будинки, а його кольори добре видно на тлі неба. Його можна помітити з дороги за 300 м. Змоделюєш його в День 51."}, {"en": "Pack buildings credited in credits.md (in GAD on your PC); everything else on DL_District2.", "uk": "Будівлі з паків мають рядки авторства в credits.md (у папці GAD на ПК). Усе інше — на DL_District2."}], "piece1": "the first three houses from the library", "piece2": {"en": "Every other building and the landmark check, on your own", "uk": "Усі інші будівлі й перевірка орієнтира — самостійно"}, "steps": [{"text": {"en": "Check: the files from today's lessons are in the day work folder (placement_d2.md, landmark_300m.png and district2_60m.png). Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it. Then read the recipe lines in plan_check_d2.md (Day 48), and finish placement_d2.md: every grey box with what replaces it. Check: one line per box.", "uk": "Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: placement_d2.md, landmark_300m.png і district2_60m.png. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Потім прочитай рядки рецепта в plan_check_d2.md (День 48) і доповни placement_d2.md: кожен сірий блок і чим його замінити. Перевірка: по рядку на кожен блок."}, "lesson": 1}, {"text": {"en": "Shelves: Flatten each footprint plus 2 m, then Smooth the edges. Check: no vertical landscape face from 10 m.", "uk": "Уступи: Flatten під кожен обрис плюс 2 м, потім Smooth по краях. Перевірка: з 10 м не видно жодної вертикальної стіни ландшафту."}, "lesson": 2}, {"text": {"en": "Replace the first five boxes with library copies at the same coordinates, deleting each box. Check: every corner touches its shelf.", "uk": "Заміни перші п'ять блоків копіями з бібліотеки на тих самих координатах і видали кожен блок. Перевірка: кожен кут торкається уступу."}, "lesson": 1}, {"text": {"en": "Replace the rest; turn the types to the plan and vary the outside details. Check: from 30 m no two neighbours look like twins.", "uk": "Заміни решту. Поверни типи як на плані й дай їм різні доповнення зовні. Перевірка: з 30 м жодні двоє сусідів не схожі на близнюків."}, "lesson": 1}, {"text": {"en": "Pack buildings where the plan names them; add each pack to credits.md in GAD on your PC. Check: credits.md has a line for every pack.", "uk": "Будівлі з паків постав там, де їх називає план. Кожен пак допиши в credits.md у папці GAD на ПК. Перевірка: у credits.md є рядок для кожного пака."}, "lesson": 1}, {"text": {"en": "Slopes: sink each building and add SM_Steps or a plinth where a door stands high. Measure each steep path with the two-cube method from lesson 2. Check: every door has a way in, on a path under 8 % or by steps.", "uk": "Схили: занур кожну будівлю і додай SM_Steps або цоколь там, де двері стоять високо. Кожну круту доріжку виміряй способом двох кубів з уроку 2. Перевірка: до кожних дверей є вхід — доріжкою з ухилом до 8 % або сходами."}, "lesson": 2}, {"text": {"en": "Colour: spread three or more wall or roof colours across the house types and pack buildings. Check: from 30 m the colours sit with your Day 16 palette.", "uk": "Колір: розподіли три чи більше кольорів стін чи дахів між типами будинків і будівлями з паків. Перевірка: з 30 м кольори пасують до твоєї палітри з Дня 16."}, "lesson": 4}, {"text": {"en": "SM_ShopFront_A on any shop, inn or café, its back against the wall, in its own Plaster colour instance. Check: no gap or flicker from 2 m.", "uk": "SM_ShopFront_A на кожній крамниці, корчмі чи кав'ярні, спинкою до стіни, з власним інстансом кольору Plaster. Перевірка: з 2 м немає ні щілин, ні мерехтіння."}, "lesson": "D42.4"}, {"text": {"en": "Landmark: finish the lesson 3 check. Its height matches landmarks.md, its colours read against the sky, and its sightline from the road is clear. Check: from 300 m along the road you can pick it out.", "uk": "Орієнтир: доведи перевірку з уроку 3. Його висота відповідає landmarks.md, кольори добре видно на тлі неба, а лінію видимості з дороги ніщо не закриває. Перевірка: з дороги за 300 м його можна помітити."}, "lesson": 3}, {"text": {"en": "Overlay: lay a Top view HighResShot over plot_plan_d2.png in Krita and fix anything more than 0.5 m off. Check: every footprint sits on its box.", "uk": "Накладання: у Krita поклади знімок HighResShot з виду Top на plot_plan_d2.png і виправ усе, що зміщене більш ніж на 0,5 м. Перевірка: кожен обрис лежить на своєму прямокутнику."}, "lesson": "D42.1"}, {"text": {"en": "Proof: press Ctrl+S. Fly 60 m above the district, press G and save district2_60m.png. Check: district2_60m.png shows every building and no icons.", "uk": "Доказ: натисни Ctrl+S. Підлети на 60 м над районом, натисни G і збережи district2_60m.png. Перевірка: на district2_60m.png видно кожен будинок і жодного значка."}, "lesson": 4}, {"text": {"en": "Report and hand-in: click Copy the day report at the bottom of the page, paste it into a new chat and answer. Open summary.md in Notepad, press Ctrl+End, paste the answer and press Ctrl+S. Then drag the files on the Hand in list into your hand-in folder. Check: every name shows in the folder, each with a size.", "uk": "Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: кожна назва зі списку є в папці, у кожної є розмір."}, "lesson": "D0.1"}], "assets": ["island12/free-packs-list.md", "island12/credits-template.md"]}, "lessons": [{"title": {"en": "From blockout to buildings: the swap", "uk": "Від блокауту до будівель: заміна"}, "minutes": 40, "goals": [{"en": "Replace each grey box with its building at the same coordinates, then delete the box.", "uk": "Замінювати кожен сірий блок його будівлею на тих самих координатах, а потім видаляти блок."}, {"en": "Make a few house types look like many: turns, outside details and different neighbours.", "uk": "Робити так, щоб кілька типів будинків виглядали як багато: повороти, доповнення зовні й різні сусіди."}, {"en": "Keep placement_d2.md and the plan in step as you go.", "uk": "Тримати placement_d2.md і план узгодженими по ходу роботи."}], "doalong": [{"en": "Start placement_d2.md: one line per grey box on plot_plan_d2.png, with what will replace it (a house type, a kit building or a pack building). You should see a list as long as your box count.", "uk": "Почни placement_d2.md: по рядку на кожен сірий блок на plot_plan_d2.png і чим його замінити (тип будинку, будівля з набору чи будівля з пака). Має вийти список, довгий, як кількість блоків."}, {"en": "Select a grey box, right-click the Location row in Details > Copy. You should see nothing change yet: the numbers are on the clipboard.", "uk": "Виділи сірий блок і клацни правою кнопкою рядок Location у Details > Copy. Поки що нічого не змінюється: числа в буфері обміну."}, {"en": "Drag LI_Cottage_A from your Library folder into the level, right-click its Location row > Paste, and type its Rotation Z from the plan. You should see the cottage inside the box.", "uk": "Перетягни LI_Cottage_A з папки Library на рівень, клацни правою кнопкою його рядок Location > Paste і введи Rotation Z з плану. Котедж стоїть усередині блока."}, {"en": "Delete the box and press End on the cottage. You should see it sit on the ground. If it sits off to one side, the two pivots differ: line up the footprints in a Top view.", "uk": "Видали блок і натисни End на котеджі. Котедж стоїть на землі. Якщо він зміщений убік, у двох об'єктів origin у різних місцях: вирівняй обриси на виді Top."}, {"en": "Add one outside detail to this copy: a PLA_FenceRun_8m, a gate, or a lean-to from two kit walls. You should see it no longer look like its twin.", "uk": "Додай цій копії одне доповнення зовні: PLA_FenceRun_8m, хвіртку чи прибудову з двох стін набору. Тепер вона не схожа на свого близнюка."}, {"en": "Tick the row in placement_d2.md. You should see the list of open rows shrink.", "uk": "Познач рядок у placement_d2.md. Відкритих рядків стає менше."}], "play": {"en": "Twin hunt: I describe a street of six houses made from two types. The tutor tries to spot the twins; every pair it can't find scores me a point.", "uk": "Полювання на близнюків: я описую вулицю з шести будинків, зроблених із двох типів. Тьютор пробує знайти близнюків. Кожна пара, яку він не знаходить, — бал мені."}, "video": {"url": "https://www.youtube.com/watch?v=tnaXNCaBQ4M", "title": "06 - Snapping, Pivot Points, and Duplication - Unreal Engine Stage Design Course", "channel": "SuperStage", "length": "7:21", "search": "unreal engine snapping pivot duplicate"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Від блокауту до будівель: заміна (Day 49, lesson 1 of 4). Today's build: Будівлі району 2, розставлені за блокаутом, кожна на уступі і з входом, і орієнтир, якого видно здалеку.\nWhat I already know: День 48: блокаут, кутові маркери, DL_District2, D2_C1–D2_C5, твоя бібліотека будівель і plan_check_d2.md; День 42: уступи, посадка будівель на схилах, сходи, мощення й інстанси кольорів; День 13: SM_ShopFront_A; День 16: твоя палітра кольорів; День 24: список потреб для району 2 і паки будівель; День 32 і День 33: landmarks.md і блокаут орієнтира району 2 у справжньому розмірі, на DL_Landmarks з HLOD_Merged.\n\nBy the end of this lesson I can:\n1. Замінювати кожен сірий блок його будівлею на тих самих координатах, а потім видаляти блок.\n2. Робити так, щоб кілька типів будинків виглядали як багато: повороти, доповнення зовні й різні сусіди.\n3. Тримати placement_d2.md і план узгодженими по ходу роботи.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: Район 2 має блокаут у повний розмір, а твій набір став невеликою бібліотекою типів будинків і комплектів. Today: Сьогодні ти замінюєш сірі блоки будівлями зі своєї бібліотеки й паків, ставиш кожну на її уступ і перевіряєш, чи блокаут орієнтира читається з 300 м. One encouraging line: Орієнтир — твій підпис на острові; сьогодні його форма має лише читатися здалеку, а модель ти зробиш у День 51.); 2 lines on why today matters and where it comes back, in plain words (from this: Ставити будівлі за блокаутом швидко: кожне «де» вже вирішено. Сьогодні головне — як кожна будівля сходиться з землею. Орієнтир дає пілотам точку, до якої летіти, і допомагає запам'ятати район. Студії ставлять орієнтир у кожній частині світу й перевіряють його силует задовго до того, як його змоделюють. It comes back: У п'ятницю в День боса ці будівлі оцінюватимуть із дрона. У День 51 ти змоделюєш орієнтир у Blender, а з Дня 53 пілоти триматимуть на нього курс.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-49-district2-buildings exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (Перші три будинки з бібліотеки). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Почни placement_d2.md: по рядку на кожен сірий блок на plot_plan_d2.png і чим його замінити (тип будинку, будівля з набору чи будівля з пака). Має вийти список, довгий, як кількість блоків.\n   2. Виділи сірий блок і клацни правою кнопкою рядок Location у Details > Copy. Поки що нічого не змінюється: числа в буфері обміну.\n   3. Перетягни LI_Cottage_A з папки Library на рівень, клацни правою кнопкою його рядок Location > Paste і введи Rotation Z з плану. Котедж стоїть усередині блока. [screenshot]\n   4. Видали блок і натисни End на котеджі. Котедж стоїть на землі. Якщо він зміщений убік, у двох об'єктів origin у різних місцях: вирівняй обриси на виді Top.\n   5. Додай цій копії одне доповнення зовні: PLA_FenceRun_8m, хвіртку чи прибудову з двох стін набору. Тепер вона не схожа на свого близнюка.\n   6. Познач рядок у placement_d2.md. Відкритих рядків стає менше. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Полювання на близнюків: я описую вулицю з шести будинків, зроблених із двох типів. Тьютор пробує знайти близнюків. Кожна пара, яку він не знаходить, — бал мені. Otherwise skip it.\n6. Review: ask me these questions from earlier days, one at a time, and correct me kindly: Day 46: a note says 'C4: the street trees stand in a row'. Where is its source, and how do you fix it there? | Day 42: how do you seat a building on a slope?\n7. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n8. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\nIf I want to go deeper, recommend this free video: \"06 - Snapping, Pivot Points, and Duplication - Unreal Engine Stage Design Course\" by SuperStage: https://www.youtube.com/watch?v=tnaXNCaBQ4M\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; review (by tutor or art director) = огляд; credits line = рядок авторства; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); File Explorer = Провідник; vertex / edge / face = вершина / ребро / грань; origin (and kit pivot) = origin — точка, за яку об'єкт ставлять і обертають; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; collision / UCX collision box = колізія / блок UCX; grey box placeholder = сірий блок (заглушка); material instance / child instance = інстанс / дочірній інстанс; volume (PCG Volume, Post Process Volume) = об'єм; keep-out zone / footprint test / grounding = зона-виняток / тест опори / посадка на ґрунт; kit / kit piece / part of one object = набір / деталь / частина; district / plot / plot plan = район / ділянка / план ділянки; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; vista / blockout / landmark = панорама / блокаут / орієнтир; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the eck_d2.md; День 42: уступи, посадка будівель на схилах, сходи, мощення й інстанси кольорів; День 13: SM_ShopFront_A; День 16: твоя палітра кольорів; День 24: список потреб для району 2 і паки будівель; День 32 і День 33: landmarks.md і блокаут орієнтира району 2 у справжньому розмірі, на DL_Landmarks з HLOD_Merged.\nEarlier today I already did: lesson 1 (Від блокауту до будівель: заміна); lesson 2 (Будівлі на схилі: уступи, цоколі й сходи); lesson 3 (Твій орієнтир: блокаут, помітний з 300 м). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Читати групу будівель із 30 і 60 м: дахи (усі дахи, які видно разом), кольори й простір між будівлями.\n2. Розподіляти кольори так, щоб район пасував до твоєї палітри, а жодні двоє сусідів не збігалися.\n3. Виправляти групу, а не окремі будинки: повороти, проміжки й висоти.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: 2 lines on why today matters and where it comes back, in plain words (from this: Ставити будівлі за блокаутом швидко: кожне «де» вже вирішено. Сьогодні головне — як кожна будівля сходиться з землею. Орієнтир дає пілотам точку, до якої летіти, і допомагає запам'ятати район. Студії ставлять орієнтир у кожній частині світу й перевіряють його силует задовго до того, як його змоделюють. It comes back: У п'ятницю в День боса ці будівлі оцінюватимуть із дрона. У День 51 ти змоделюєш орієнтир у Blender, а з Дня 53 пілоти триматимуть на нього курс.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-49-district2-buildings exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (Перші три будинки з бібліотеки). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Підлети на 60 м над районом, натисни G і збережи скриншот як district2_60m.png. Дахи видно як один візерунок.\n   2. Примруж очі: чи схожі дахи на одну форму, проштамповану знову й знову? Так видно, де помітні повтори.\n   3. Поверни дві копії або заміни їх іншим типом будинку. Візерунок ламається. [screenshot]\n   4. У Krita постав свою палітру з Дня 16 поруч зі скриншотом із 30 м. Так видно, чи кольори пасують.\n   5. Зміни один колір стіни чи даху, який не пасує. На типі будинку: Level > Edit, потім Commit. На будівлі з пака: Details > Materials. Район тепер пасує до палітри. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Детектор копіювання: тьютор отримує мій скриншот із 60 м і називає кожен повтор, який знаходить. Я виправляю кожен і надсилаю знову. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); default value = типове значення; File Explorer = Провідник; vertex / edge / face = вершина / ребро / грань; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; collision / UCX collision box = колізія / блок UCX; material instance / child instance = інстанс / дочірній інстанс; keep-out zone / footprint test / grounding = зона-виняток / тест опори / посадка на ґрунт; kit / kit piece / part of one object = набір / деталь / частина; district / plot / plot plan = район / ділянка / план ділянки; vista / blockout / landmark = панорама / блокаут / орієнтир; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; hero shot = головний кадр (hero shot); proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}], "handin": [{"en": "summary.md", "uk": "summary.md (звіт дня)"}, {"en": "district2_60m.png: every building in place, seen from 60 m (proof)", "uk": "district2_60m.png (кожна будівля на місці, вид із 60 м) (доказ)"}], "goal": {"en": "By the end of today every building of district 2 stands at its plan place, and your landmark blockout reads from 300 m away.", "uk": "Наприкінці дня кожна будівля району 2 стоїть на своєму місці з плану, а блокаут твого орієнтира помітний з 300 м."}, "uses": [{"en": "Day 48: the blockout, the corner markers, DL_District2, D2_C1 to D2_C5, your building library and plan_check_d2.md", "uk": "День 48: блокаут, кутові маркери, DL_District2, D2_C1–D2_C5, твоя бібліотека будівель і plan_check_d2.md"}, {"en": "Day 42: shelves, seating on slopes, steps, paving and colour instances", "uk": "День 42: уступи, посадка будівель на схилах, сходи, мощення й інстанси кольорів"}, {"en": "Day 13: SM_ShopFront_A", "uk": "День 13: SM_ShopFront_A"}, {"en": "Day 16: your colour palette", "uk": "День 16: твоя палітра кольорів"}, {"en": "Day 24: your district 2 needs list and building packs", "uk": "День 24: список потреб для району 2 і паки будівель"}, {"en": "Days 32 and 33: landmarks.md and district 2's landmark blocked out at true size, on DL_Landmarks with HLOD_Merged", "uk": "День 32 і День 33: landmarks.md і блокаут орієнтира району 2 у справжньому розмірі, на DL_Landmarks з HLOD_Merged"}], "quiz": [{"q": {"en": "You paste a grey box's Location onto a cottage, but the cottage stands 3 m to one side of where the box was. What is the likely cause?", "uk": "Ти вставляєш Location сірого блока в котедж, але котедж стоїть на 3 м убік від місця блока. Яка ймовірна причина?"}, "options": [{"en": "Unreal moved it", "uk": "Unreal його пересунув"}, {"en": "The Data Layer is wrong", "uk": "Неправильний Data Layer"}, {"en": "The cottage's pivot and the box's pivot are in different places; line up the footprints in a Top view", "uk": "Origin котеджу й origin блока в різних місцях: вирівняй обриси на виді Top"}, {"en": "The plan is wrong", "uk": "План неправильний"}], "answer": 2, "explain": {"en": "Location places an object's pivot. If the two pivots sit in different spots (a corner and a centre), the footprints don't match.", "uk": "Location ставить origin об'єкта. Якщо два origin у різних місцях (у куті й у центрі), обриси не збігаються."}}, {"q": {"en": "What makes a landmark work for a pilot?", "uk": "Що робить орієнтир корисним для пілота?"}, "options": [{"en": "It is the most detailed model in the district", "uk": "Це найдеталізованіша модель у районі"}, {"en": "It stands out from far away by height, shape or colour, and gives a point to fly toward", "uk": "Він вирізняється здалеку висотою, формою чи кольором і дає точку, до якої летіти"}, {"en": "It has the most triangles", "uk": "У нього найбільше трикутників"}, {"en": "It is hidden until you are close", "uk": "Його не видно, доки не наблизишся"}], "answer": 1, "explain": {"en": "A landmark is about being seen and remembered from a distance, not about detail.", "uk": "Орієнтир має бути помітним і запам'ятовуватися здалеку. Дрібниці тут не головне."}}, {"q": {"en": "A path climbs 3 m over 20 m to a door. What do you do?", "uk": "Доріжка до дверей піднімається на 3 м на відстані 20 м. Що ти робиш?"}, "options": [{"en": "Nothing, because it is under 8 %", "uk": "Нічого, бо це менше 8 %"}, {"en": "Lower the door", "uk": "Опускаю двері"}, {"en": "Nothing, because a drone flies anyway", "uk": "Нічого, бо дрон однаково летить"}, {"en": "It is 15 %, too steep to walk: add steps or make the path longer and winding", "uk": "Це 15 %, надто круто для ходьби: додаю сходи або роблю доріжку довшою і звивистою"}], "answer": 3, "explain": {"en": "3 divided by 20 is 0.15, so 15 %. Walking paths stay under about 8 %, or use steps.", "uk": "3, поділене на 20, — це 0,15, тобто 15 %. Пішохідні доріжки мають ухил до 8 %, інакше потрібні сходи."}}, {"q": {"en": "How do you make six houses from two Level Instance types look different?", "uk": "Як зробити, щоб шість будинків із двох типів Level Instance виглядали по-різному?"}, "options": [{"en": "Give each a different Data Layer", "uk": "Дати кожному інший Data Layer"}, {"en": "Scale each to a different size", "uk": "Змасштабувати кожен до іншого розміру"}, {"en": "Turn them, add different outside details, and mix the types along the street", "uk": "Повертати їх, додавати різні доповнення зовні й чергувати типи вздовж вулиці"}], "answer": 2, "explain": {"en": "Turns, outside details and mixed neighbours hide the repeats without new models.", "uk": "Повороти, доповнення зовні й різні сусіди ховають повтори без нових моделей."}}, {"q": {"en": "From 60 m the roofs look like one stamp repeated in a grid. What do you do?", "uk": "З 60 м дахи виглядають як один штамп, повторений сіткою. Що ти робиш?"}, "options": [{"en": "Add more triangles to the roofs", "uk": "Додаю дахам більше трикутників"}, {"en": "Turn copies, vary the gaps and swap types so the pattern breaks", "uk": "Повертаю копії, змінюю проміжки й міняю типи, щоб візерунок зламався"}, {"en": "Add fog", "uk": "Додаю туман"}, {"en": "Only check from 10 m", "uk": "Перевіряю лише з 10 м"}], "answer": 1, "explain": {"en": "The eye finds repeats from above first. Breaking the rhythm of turns, gaps and types fixes it.", "uk": "Згори око насамперед помічає повтори. Їх ховають, коли порушують ритм поворотів, проміжків і типів."}}], "weekInfo": {"week": 10, "title": {"en": "District 1 finished, district 2 built", "uk": "Район 1 завершено, район 2 збудовано"}, "goal": {"en": "By Friday district 1 is finished with before and after proof, and district 2 stands with its buildings, landmark and roads, inside your budget.", "uk": "До п'ятниці район 1 завершено, з доказами «до і після», а район 2 стоїть із будівлями, орієнтиром і дорогами — і все в межах бюджету."}, "skills": [{"en": "Iterating an environment from review notes, with before and after evidence", "uk": "Доопрацювання оточення за нотатками огляду, з парами «до і після»"}, {"en": "Composition, landmarks and sightlines for aerial and drone cameras", "uk": "Композиція, орієнтири й лінії видимості для камер з повітря і з дрона"}, {"en": "Edge blending between hand-built areas and procedural landscapes", "uk": "Плавні переходи між ділянками, зробленими вручну, і процедурним ландшафтом"}, {"en": "Greybox blockout to final placement with a reusable building library", "uk": "Від блокауту сірими блоками до фінального розміщення з бібліотекою будівель для повторного використання"}, {"en": "Landscape spline roads and paths that follow real terrain", "uk": "Дороги й стежки на сплайнах ландшафту (Landscape Splines), що йдуть за справжнім рельєфом"}]}, "morning": {"sofar": {"en": "District 2 is blocked out at full size, and your own kit has become a small library of house types and sets.", "uk": "Район 2 має блокаут у повний розмір, а твій набір став невеликою бібліотекою типів будинків і комплектів."}, "today": {"en": "You swap the grey boxes for buildings from your library and packs, set each on its shelf, and check that your landmark blockout reads from 300 m away.", "uk": "Сьогодні ти замінюєш сірі блоки будівлями зі своєї бібліотеки й паків, ставиш кожну на її уступ і перевіряєш, чи блокаут орієнтира читається з 300 м."}, "cheer": {"en": "Your landmark is your signature on the island; today its shape only has to read from far away, and you model it on Day 51.", "uk": "Орієнтир — твій підпис на острові; сьогодні його форма має лише читатися здалеку, а модель ти зробиш у День 51."}, "quote": {"text": {"en": "Lighthouses don't go running all over an island looking for boats to save; they just stand there shining.", "uk": "Маяки не бігають по всьому острову в пошуках човнів, які треба рятувати; вони просто стоять і світять."}, "author": {"en": "Anne Lamott", "uk": "Енн Ламотт"}, "source": "https://en.wikiquote.org/wiki/Anne_Lamott"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-49-district2-buildings", "mapHref": "../../COURSE.html", "prevHref": "../Day-48-district2-plan-check-and-blockout/START-HERE.html", "nextHref": "../Day-50-boss-district2-built/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8 and Krita. I am a beginner on Day 49. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me and don't write code.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: Усі інші будівлі й перевірка орієнтира — самостійно.\nIt's part of: Будівлі району 2, розставлені за блокаутом, кожна на уступі і з входом, і орієнтир, якого видно здалеку (Район 2: кожен сірий блок із Дня 48 і місце орієнтира на plot_plan_d2.png.).\nWhy it matters: Ставити будівлі за блокаутом швидко: кожне «де» вже вирішено. Сьогодні головне — як кожна будівля сходиться з землею. Орієнтир дає пілотам точку, до якої летіти, і допомагає запам'ятати район. Студії ставлять орієнтир у кожній частині світу й перевіряють його силует задовго до того, як його змоделюють. It comes back: У п'ятницю в День боса ці будівлі оцінюватимуть із дрона. У День 51 ти змоделюєш орієнтир у Blender, а з Дня 53 пілоти триматимуть на нього курс.\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-49-district2-buildings (on the drive I chose on Day 0).\nWhat I already know: День 48: блокаут, кутові маркери, DL_District2, D2_C1–D2_C5, твоя бібліотека будівель і plan_check_d2.md; День 42: уступи, посадка будівель на схилах, сходи, мощення й інстанси кольорів; День 13: SM_ShopFront_A; День 16: твоя палітра кольорів; День 24: список потреб для району 2 і паки будівель; День 32 і День 33: landmarks.md і блокаут орієнтира району 2 у справжньому розмірі, на DL_Landmarks з HLOD_Merged; today's lessons: Від блокауту до будівель: заміна; Будівлі на схилі: уступи, цоколі й сходи; Твій орієнтир: блокаут, помітний з 300 м; Як читається група будівель із повітря. Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- Кожен сірий блок замінено копією з бібліотеки, будівлею з набору або будівлею з пака на тому самому місці, з точністю до 0,5 м. Кожен замінений блок видалено.\n- Різноманіття без нових моделей: типи будинків повернуто і дано їм різні доповнення зовні (паркани, хвіртки, сходи, прибудова зі стін набору). Щонайменше три кольори стін чи дахів на весь район. Будівлі з паків можуть мати власний інстанс кольору на кожну копію, бо це окремі актори.\n- Уступ під кожен обрис. На схилах будівлі занурено і додано SM_Steps або цоколь (низьку опорну стінку), ніколи не вертикальну стіну ландшафту. Пішохідні доріжки мають ухил до 8 % (8 м підйому на 100 м довжини) або сходи.\n- SM_ShopFront_A на кожній крамниці, корчмі чи кав'ярні з плану, з власним інстансом кольору.\n- Орієнтир: блокаут орієнтира району 2 з Дня 32 (маяк, вежа, клуня чи силос), звірений із landmarks.md і твоїми фото. Він у два-три рази вищий за будинки, а його кольори добре видно на тлі неба. Його можна помітити з дороги за 300 м. Змоделюєш його в День 51.\n- Будівлі з паків мають рядки авторства в credits.md (у папці GAD на ПК). Усе інше — на DL_District2.\n\nMy checklist (the same numbers show on my course page):\n1. Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: placement_d2.md, landmark_300m.png і district2_60m.png. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Потім прочитай рядки рецепта в plan_check_d2.md (День 48) і доповни placement_d2.md: кожен сірий блок і чим його замінити. Перевірка: по рядку на кожен блок. (from lesson 1)\n2. Уступи: Flatten під кожен обрис плюс 2 м, потім Smooth по краях. Перевірка: з 10 м не видно жодної вертикальної стіни ландшафту. (from lesson 2)\n3. Заміни перші п'ять блоків копіями з бібліотеки на тих самих координатах і видали кожен блок. Перевірка: кожен кут торкається уступу. (from lesson 1)\n4. Заміни решту. Поверни типи як на плані й дай їм різні доповнення зовні. Перевірка: з 30 м жодні двоє сусідів не схожі на близнюків. (from lesson 1)\n5. Будівлі з паків постав там, де їх називає план. Кожен пак допиши в credits.md у папці GAD на ПК. Перевірка: у credits.md є рядок для кожного пака. (from lesson 1)\n6. Схили: занур кожну будівлю і додай SM_Steps або цоколь там, де двері стоять високо. Кожну круту доріжку виміряй способом двох кубів з уроку 2. Перевірка: до кожних дверей є вхід — доріжкою з ухилом до 8 % або сходами. (from lesson 2)\n7. Колір: розподіли три чи більше кольорів стін чи дахів між типами будинків і будівлями з паків. Перевірка: з 30 м кольори пасують до твоєї палітри з Дня 16. (from lesson 4)\n8. SM_ShopFront_A на кожній крамниці, корчмі чи кав'ярні, спинкою до стіни, з власним інстансом кольору Plaster. Перевірка: з 2 м немає ні щілин, ні мерехтіння. (from day 42, lesson 4)\n9. Орієнтир: доведи перевірку з уроку 3. Його висота відповідає landmarks.md, кольори добре видно на тлі неба, а лінію видимості з дороги ніщо не закриває. Перевірка: з дороги за 300 м його можна помітити. (from lesson 3)\n10. Накладання: у Krita поклади знімок HighResShot з виду Top на plot_plan_d2.png і виправ усе, що зміщене більш ніж на 0,5 м. Перевірка: кожен обрис лежить на своєму прямокутнику. (from day 42, lesson 1)\n11. Доказ: натисни Ctrl+S. Підлети на 60 м над районом, натисни G і збережи district2_60m.png. Перевірка: на district2_60m.png видно кожен будинок і жодного значка. (from lesson 4)\n12. Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: кожна назва зі списку є в папці, у кожної є розмір. (from day 0, lesson 1)\n\nHow to help: ask which step number I'm on, then give me only the next step: the exact clicks and what I should see. When I send a screenshot, compare it with my reference, my sizes and the spec, and name one thing to fix at a time.\nCheck every save and export by reopening it before we move on:\n- a .md or .txt: open it with Notepad; the text is there, and the name doesn't end in .md.txt\nWhen I write \"готово\", and in any case before the day ends, check with me one item at a time (yes/no): each spec point, then each file on my hand-in list, ready in my day work folder (skip summary.md: the day report writes it next):\n1. district2_60m.png (кожна будівля на місці, вид із 60 м) (доказ)\nFinish with a short list of anything missing, and one line on where this work comes back and what it will look like there. Then tell me the order for the end of the day: first the day report (the Copy the day report button at the bottom of my course page) into summary.md, and only then hand in all the files on the list, summary.md too.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; checklist = чек-лист; credits line = рядок авторства; reference photo / hero photo = фото-референс / ключове фото; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); vertex / edge / face = вершина / ребро / грань; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; collision / UCX collision box = колізія / блок UCX; grey box placeholder = сірий блок (заглушка); material instance / child instance = інстанс / дочірній інстанс; material slot / node / pin = слот матеріалу / вузол / вхід; keep-out zone / footprint test / grounding = зона-виняток / тест опори / посадка на ґрунт; kit / kit piece / part of one object = набір / деталь / частина; district / plot / plot plan = район / ділянка / план ділянки; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; vista / blockout / landmark = панорама / блокаут / орієнтир; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; hero shot = головний кадр (hero shot); proof (picture) = доказ.\n\nStart by asking for my best reference photo. Then, one at a time, my sizes and my step number.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender.", "reportPrompt": "Help me write today's report for summary.md. I write it before I hand in. Talk to me in simple Ukrainian, and never use gendered forms about me. Keep the English labels below exactly; the text after each label may be Ukrainian.\nAsk me one thing at a time, and skip whatever I've already pasted below:\n1. My lesson summaries («Засвоєно» / «Було важко»), or which lessons I skipped.\n2. My first score in the page's \"Check yourself\" quiz.\n3. How far the build got: done, partly or blocked (if blocked, where).\n4. My hand-in list, one item at a time (skip summary.md): is the file ready in my day work folder (GAD\\Day-49-district2-buildings)? (yes/no)\n   - district2_60m.png (кожна будівля на місці, вид із 60 м) (доказ)\n5. One question for Thalia (about any day; start with the day number), or \"none\".\n6. Whether I fixed an earlier day today (which day and what), or \"no\".\n7. About how many hours today took.\nThen give me the finished report in one block I can copy:\n\nTeam summary, <date>, Ivan\nDay 49: District 2 buildings: the library placed, the landmark readable. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nReady to hand in: <tick each item of today's list: ✓ name, or ✗ name and why it isn't ready>\nMissing: <files not ready, or \"none\">\nFixed: <Day N: what I fixed (the fixed files are in that day's hand-in folder), or \"none\">\nQuestion for Thalia: <Day N: one line, or \"none\">\nHours: <about N>\nTo revisit: <the «Було важко» lines>\n\nThen tell me: open summary.md in today's day work folder (GAD\\Day-49-district2-buildings) with Notepad (right-click > Open with > Notepad; if there is no summary.md yet, make it: right-click > New > Text Document, named summary.md). Press Ctrl+End, paste the report below anything already there, and save with Ctrl+S. Never delete or paste over what is already in the file. Only then hand in all the files on the list, summary.md too, with the Open my hand-in folder button on the page.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); vertex / edge / face = вершина / ребро / грань; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; kit / kit piece / part of one object = набір / деталь / частина; district / plot / plot plan = район / ділянка / план ділянки; vista / blockout / landmark = панорама / блокаут / орієнтир; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.", "before": null, "handinUrl": "https://drive.google.com/drive/folders/1CjdiweN8BkioqMHmvp21h_c55tAVQ7bm", "assetFiles": ["free-packs-list.md", "credits-template.md"]}</script>

 s+='<circle class="face" cx="200" cy="200" r="168"/><circle class="track" cx="200" cy="200" r="176"/>';
 s+='<circle class="arc" cx="200" cy="200" r="176" stroke="url(#'+id+'g)" stroke-dasharray="'+(C*p).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 200 200)"/>';
 if(p>0){const A=-Math.PI/2+p*TAU;s+='<circle class="knob'+(p<1?' go':'')+'" cx="'+(200+176*Math.cos(A)).toFixed(1)+'" cy="'+(200+176*Math.sin(A)).toFixed(1)+'" r="7"/>'}

 if(r.length)t+='\n\nMy lesson summaries, pasted from my course page:\n'+r.join('\n');

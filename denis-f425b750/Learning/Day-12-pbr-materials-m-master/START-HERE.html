<script id="data" type="application/json">{"learner": "ib-denis-f425b750", "learnerName": {"en": "Denis", "uk": "Денис"}, "day": 12, "week": 3, "total": 60, "title": {"en": "PBR materials: from the Principled BSDF to M_Master and its instances", "uk": "PBR-матеріали: від Principled BSDF до M_Master та його інстансів"}, "theme": {"en": "Week 3: Surfaces", "uk": "Тиждень 3: Поверхні"}, "build": {"item": {"en": "M_Master, one master material for the whole course, and its instances on the kit", "uk": "M_Master, один майстер-матеріал на весь курс, і його інстанси на наборі"}, "why": {"en": "A material is the set of surface settings that tells Unreal how a surface looks. PBR (physically based rendering) describes it with real values (colour, metal or not, roughness and small bumps), so it looks right under any light. Studios build one master material and many cheap instances, so a colour change is one click and the game loads less. Every later day uses M_Master.", "uk": "Матеріал — це набір налаштувань поверхні, який підказує Unreal, як вона виглядає. PBR (physically based rendering, фізично коректний рендер) описує її реальними значеннями (колір, метал чи ні, шорсткість і дрібні нерівності), тож вона виглядає правильно за будь-якого світла. Студії роблять один майстер-матеріал і багато дешевих інстансів: так зміна кольору — це одне клацання, а гра завантажує менше. Кожен наступний день використовує M_Master."}, "where": {"en": "Course/Day12 for the textures and materials; L_KitTest for the kit. The same instances dress your island's waterfront in Week 9.", "uk": "Course/Day12 для текстур і матеріалів; L_KitTest для набору. Ці самі інстанси вдягнуть набережну твого острова на Тижні 9."}, "spec": [{"en": "M_Master has six parameters: BaseColor (a texture), Tint (a colour), Roughness, Metallic, Normal (a texture) and Tiling.", "uk": "M_Master має шість параметрів: BaseColor (текстура), Tint (колір), Roughness, Metallic, Normal (текстура) і Tiling."}, {"en": "At least six instances, each set from a real photo: MI_PaintedMetal, MI_GalvanisedSteel, MI_Wood, MI_Stone, MI_Plaster and MI_Glass.", "uk": "Щонайменше шість інстансів, кожен налаштований за справжнім фото: MI_PaintedMetal, MI_GalvanisedSteel, MI_Wood, MI_Stone, MI_Plaster і MI_Glass."}, {"en": "The metal rule: paint is not metal, so painted metal is Metallic 0; only bare metal (galvanised steel) is Metallic 1. Wood, stone and plaster: Metallic 0, Roughness 0.6 or more.", "uk": "Правило металу: фарба — не метал, тому фарбований метал має Metallic 0; лише голий метал (оцинкована сталь) має Metallic 1. Дерево, камінь і штукатурка: Metallic 0, Roughness 0.6 або більше."}, {"en": "Glass is opaque 'game glass': a dark, smooth surface (Roughness about 0.05) in its own material slot, with nothing behind it.", "uk": "Скло — непрозоре «ігрове скло»: темна гладка поверхня (Roughness близько 0.05) у власному слоті матеріалу, і за нею нічого немає."}, {"en": "Textures from Poly Haven (free, CC0), named T_<Name>_D for colour and T_<Name>_N for the normal map (the DX version), each listed in credits.md.", "uk": "Текстури з Poly Haven (безкоштовні, CC0) з назвами T_<Name>_D для кольору й T_<Name>_N для карти нормалей (версія DX), кожна записана в credits.md."}, {"en": "Material slots named by surface (Plaster, Frame, Glass, Stone, Wood, Metal, Roof), and instances set on the mesh assets in the Static Mesh Editor, so every copy in every level updates.", "uk": "Слоти матеріалів названі за поверхнею (Plaster, Frame, Glass, Stone, Wood, Metal, Roof), а інстанси призначені на асетах сіток у Static Mesh Editor, тож оновлюється кожна копія на кожному рівні."}, {"en": "Every kit piece and the four props wear instances: nothing grey or checkered is left in L_KitTest or on the props.", "uk": "На кожній деталі набору й чотирьох пропсах — інстанси: у L_KitTest і на пропсах не лишилося нічого сірого чи в шахівницю."}], "piece1": "SM_PierDeck_4m in wood and SM_Wall_Window with plaster, frame and glass (shared with the lessons)", "piece2": {"en": "Material slots and instances for the rest of the kit and the four props, on your own", "uk": "Слоти матеріалів та інстанси для решти набору й чотирьох пропсів, самостійно"}, "steps": [{"text": {"en": "Download two more Poly Haven textures at 1K or 2K: a stone wall or quay stone, and a plaster. Take the colour map (Diffuse) and Normal (DX) of each. Add both to credits.md. Check: three texture sets (wood, stone, plaster) are in your Day12 folder and three lines are in credits.md.", "uk": "Завантаж ще дві текстури з Poly Haven у 1K або 2K: кам'яну стіну чи камінь набережної, і штукатурку. Візьми для кожної карту кольору (Diffuse) і Normal (DX). Додай обидві в credits.md. Перевірка: три набори текстур (дерево, камінь, штукатурка) лежать у папці Day12, а в credits.md є три рядки."}, "lesson": 1}, {"text": {"en": "Material slots in Blender (buildkit_day11.blend) for SM_Wall_Door (Plaster, Frame, Door) and your roof pieces: SM_Roof_2m and SM_Roof_Ridge_2m (Roof), SM_Roof_Gable_4m (Plaster), as in lesson 2. Check: in Edit Mode, each slot's Select button lights up the right faces.", "uk": "Слоти матеріалів у Blender (buildkit_day11.blend) для SM_Wall_Door (Plaster, Frame, Door) і деталей даху: SM_Roof_2m і SM_Roof_Ridge_2m (Roof), SM_Roof_Gable_4m (Plaster), як в уроці 2. Перевірка: в Edit Mode кнопка Select кожного слота підсвічує правильні грані."}, "lesson": 2}, {"text": {"en": "Slots for the other kit pieces: SM_QuayEdge_4m, SM_Steps and SM_QuayCorner_Out (Stone), SM_Railing_2m and SM_RailingPost (Metal, or Wood if your railing is timber), SM_Wall_2m and SM_Wall_Corner (Plaster). Pick an existing material from the ball menu when the name already exists (for example Plaster). Check: every slot name says what the surface is.", "uk": "Слоти для інших деталей набору: SM_QuayEdge_4m, SM_Steps і SM_QuayCorner_Out (Stone), SM_Railing_2m і SM_RailingPost (Metal, або Wood, якщо поручень дерев'яний), SM_Wall_2m і SM_Wall_Corner (Plaster). Якщо назва вже існує (наприклад, Plaster), вибери наявний матеріал у меню кульки. Перевірка: назва кожного слота каже, що це за поверхня."}, "lesson": 2}, {"text": {"en": "Slots for the four props: SM_Bollard (Metal), SM_Bench (Wood and Metal), SM_LampPost (Metal, plus Glass if it has a lamp) and SM_Bin (Metal). Check: the bench's slats and frame light up separately with Select.", "uk": "Слоти для чотирьох пропсів: SM_Bollard (Metal), SM_Bench (Wood і Metal), SM_LampPost (Metal, плюс Glass, якщо в нього є лампа) і SM_Bin (Metal). Перевірка: через Select рейки й каркас лавки підсвічуються окремо."}, "lesson": 2}, {"text": {"en": "Export all kit pieces and props over their old FBX files, then Reimport each in Unreal (accept any window about material slots). Check: in each Static Mesh Editor, the Material Slots list shows your slot names.", "uk": "Експортуй усі деталі набору й пропси поверх їхніх старих FBX-файлів, потім зроби Reimport кожного в Unreal (приймай будь-яке вікно про слоти матеріалів). Перевірка: у кожному Static Mesh Editor список Material Slots показує твої назви слотів."}, "lesson": 2}, {"text": {"en": "Import the stone and plaster textures into Course/Day12, rename them T_Stone_D, T_Stone_N, T_Plaster_D and T_Plaster_N, and set both normal maps to Normalmap with sRGB off. Check: each _N texture shows Normalmap in Compression Settings.", "uk": "Імпортуй текстури каменю й штукатурки в Course/Day12, перейменуй їх на T_Stone_D, T_Stone_N, T_Plaster_D і T_Plaster_N та постав обом картам нормалей Normalmap з вимкненим sRGB. Перевірка: кожна текстура _N показує Normalmap у Compression Settings."}, "lesson": 3}, {"text": {"en": "Make MI_Stone and MI_Plaster from M_Master: tick and set BaseColor, Normal and Roughness, then change Tiling until the stones and plaster grain look the right size beside the mannequin. Check: a stone block looks about as big as a real one (40 to 60 cm long).", "uk": "Створи MI_Stone і MI_Plaster з M_Master: постав галочки й задай BaseColor, Normal і Roughness, потім змінюй Tiling, доки каміння й зерно штукатурки не матимуть правильного розміру поруч із манекеном. Перевірка: кам'яний блок приблизно такий, як справжній (40–60 см завдовжки)."}, "lesson": 4}, {"text": {"en": "Make MI_GalvanisedSteel for bare railings and fittings: Tint light grey, Metallic 1, Roughness 0.4. Check: in sunlight it shows soft metal highlights, not white plastic.", "uk": "Створи MI_GalvanisedSteel для голих поручнів і фурнітури: Tint світло-сірий, Metallic 1, Roughness 0.4. Перевірка: на сонці видно м'які металеві відблиски, а не білий пластик."}, "lesson": 4}, {"text": {"en": "Set instances on the mesh assets: open each Static Mesh Editor and fill every slot. Plaster: MI_Plaster. Frame: MI_PaintedMetal. Door: MI_Wood. Wood: MI_Wood. Stone: MI_Stone. Metal: MI_GalvanisedSteel or MI_PaintedMetal. Roof: a new instance of M_Master, MI_RoofTile, with a dark red Tint and Roughness 0.8 for now (Day 17 gives it a tile texture). Glass: MI_Glass. Check: open L_KitTest; nothing is grey or checkered.", "uk": "Признач інстанси на асетах сіток: відкрий кожен Static Mesh Editor і заповни кожен слот. Plaster: MI_Plaster. Frame: MI_PaintedMetal. Door: MI_Wood. Wood: MI_Wood. Stone: MI_Stone. Metal: MI_GalvanisedSteel або MI_PaintedMetal. Roof: новий інстанс M_Master, MI_RoofTile, поки що з темно-червоним Tint і Roughness 0.8 (на Дні 17 він отримає текстуру черепиці). Glass: MI_Glass. Перевірка: відкрий L_KitTest; нічого не лишилося сірим чи в шахівницю."}, "lesson": 4}, {"text": {"en": "Photo check: find one real photo each of painted steel, weathered timber, quay stone and a plastered wall on Wikimedia Commons (commons.wikimedia.org). Put each beside a screenshot of your matching material in Unreal. Check: you wrote one change per material, and made it.", "uk": "Перевірка за фото: знайди на Wikimedia Commons (commons.wikimedia.org) по одному справжньому фото фарбованої сталі, вивітреного дерева, каменю набережної й поштукатуреної стіни. Постав кожне поруч зі скриншотом відповідного матеріалу в Unreal. Перевірка: для кожного матеріалу записано одну зміну, і її внесено."}, "lesson": 4}, {"text": {"en": "The metal rule pass: open every instance; any painted surface with Metallic above 0 goes back to 0. Check: only MI_GalvanisedSteel has Metallic 1.", "uk": "Прохід за правилом металу: відкрий кожен інстанс; будь-яку фарбовану поверхню з Metallic більше 0 поверни до 0. Перевірка: Metallic 1 лише в MI_GalvanisedSteel."}, "lesson": 1}, {"text": {"en": "Before/after capture: L_KitTest from the same view with Day 11's checkers or grey, and with today's materials. Then a 60-second clip flying along the kit. Save today's clip as flythrough_day12.mp4 and check that you also have material_instances.png, m_master_graph.png, photo_vs_engine_day12.png and before_after_day12.png (each is described in today's hand-in list; take any you are missing now). Check: every piece shows its material in the clip.", "uk": "Знімок «до/після»: L_KitTest з того самого ракурсу з шахівницею чи сірим з Дня 11 і з сьогоднішніми матеріалами. Потім 60-секундний кліп прольоту вздовж набору. Збережи сьогоднішній кліп як flythrough_day12.mp4 і перевір, що в тебе також є material_instances.png, m_master_graph.png, photo_vs_engine_day12.png і before_after_day12.png (кожен описано в сьогоднішньому списку «Здати роботу»; зроби зараз ті, яких бракує). Перевірка: у кліпі кожна деталь показує свій матеріал."}, "lesson": 4}], "assets": ["island12/credits-template.md"]}, "lessons": [{"title": {"en": "PBR in Blender: the Principled BSDF", "uk": "PBR у Blender: Principled BSDF"}, "minutes": 40, "goals": [{"en": "Explain the four PBR inputs: Base Color (the surface's own colour), Metallic (bare metal or not), Roughness (0 is a mirror, 1 is fully matt) and Normal (a normal map: an image that fakes small bumps).", "uk": "Поясни чотири входи PBR: Base Color (власний колір поверхні), Metallic (голий метал чи ні), Roughness (шорсткість: 0 — дзеркало, 1 — повністю матова) і Normal (карта нормалей: зображення, що імітує дрібні нерівності)."}, {"en": "Wire a free texture set from Poly Haven (CC0: free for any use, no credit required, though you still list it) into Blender's Principled BSDF node.", "uk": "Підключи безкоштовний набір текстур з Poly Haven (CC0: вільно для будь-якого використання, згадка автора не обов'язкова, хоча ти все одно його записуєш) до вузла Principled BSDF у Blender."}, {"en": "Use the metal rule: paint, wood, stone and plaster are Metallic 0; only bare metal is Metallic 1.", "uk": "Застосовуй правило металу: фарба, дерево, камінь і штукатурка мають Metallic 0; лише голий метал має Metallic 1."}], "doalong": [{"en": "Open polyhaven.com in your browser, click Textures and search planks. Open a weathered wooden plank texture, choose 1K, and download the Diffuse (colour), Normal (GL) and Normal (DX) maps. (GL is for Blender, DX for Unreal.) Write the name and link in credits.md. You see three image files in your downloads folder.", "uk": "Відкрий polyhaven.com у браузері, клацни Textures і пошукай planks. Відкрий текстуру вивітрених дерев'яних дощок, вибери 1K і завантаж карти Diffuse (колір), Normal (GL) і Normal (DX). (GL — для Blender, DX — для Unreal.) Запиши назву й посилання в credits.md. Ти бачиш три файли зображень у папці завантажень."}, {"en": "Move them into your Day12 folder. Open quaykit_day11.blend, select SM_PierDeck_4m and click the Shading tab at the top. In Material Properties (red ball icon, right side), remove the UVGrid slot with the minus (-) button, then press New and rename the material Wood. You see a Principled BSDF node wired to Material Output in the node area at the bottom.", "uk": "Перенеси їх у папку Day12. Відкрий quaykit_day11.blend, виділи SM_PierDeck_4m і клацни вкладку Shading угорі. У Material Properties (іконка червоної кульки, праворуч) прибери слот UVGrid кнопкою «мінус» (-), потім натисни New і перейменуй матеріал на Wood. Ти бачиш вузол Principled BSDF, з'єднаний з Material Output, у зоні вузлів унизу."}, {"en": "Drag the Diffuse image from Explorer into the node area and wire its yellow Color dot into Base Color. You see planks on the deck in the 3D view, sized by your Day 11 UVs.", "uk": "Перетягни зображення Diffuse з Explorer у зону вузлів і з'єднай його жовту точку Color з Base Color. Ти бачиш дошки на настилі в 3D-вікні, розміром за твоїми UV з Дня 11."}, {"en": "Drag in the Normal (GL) image. In its node, set Color Space to Non-Color (it holds directions, not colours). Press Shift+A > Vector > Normal Map, then wire image Color > Normal Map Color, and Normal Map's Normal > Principled BSDF's Normal. You see small bumps catch the light as you orbit (middle mouse).", "uk": "Перетягни зображення Normal (GL). У його вузлі постав Color Space на Non-Color (воно зберігає напрямки, а не кольори). Натисни Shift+A > Vector > Normal Map, потім з'єднай Color зображення > Color вузла Normal Map, і Normal вузла Normal Map > Normal вузла Principled BSDF. Ти бачиш, як дрібні нерівності ловлять світло, коли ти обертаєш вид (середня кнопка миші)."}, {"en": "On the Principled BSDF, drag Roughness to 0.1, then to 0.9, and watch the shine. Settle on about 0.75 for weathered wood; leave Metallic at 0. You see a dry, matt deck.", "uk": "На Principled BSDF потягни Roughness до 0.1, потім до 0.9, і стеж за блиском. Зупинись приблизно на 0.75 для вивітреного дерева; Metallic залиш на 0. Ти бачиш сухий матовий настил."}], "play": {"en": "Spot the material: the tutor names six surfaces (wet quay stone, dry rope, a stainless rail, a painted bollard, an old plank, a window pane). I give each a Metallic and a Roughness value. A point for each within 0.2 of the tutor's.", "uk": "Впізнай матеріал: тьютор називає шість поверхонь (мокрий камінь набережної, суха мотузка, поручень з нержавійки, фарбований стовпчик, стара дошка, віконна шибка). Я даю кожній значення Metallic і Roughness. Бал за кожне, що відрізняється від значення тьютора не більше ніж на 0.2."}, "video": {"url": "https://www.youtube.com/watch?v=53Rdzthjuu0", "title": "Video Game Textures Explained! (Blender 4.0+ Tutorial)", "channel": "Vertex Arcade", "length": "5:29", "search": "blender pbr textures roughness metallic normal", "alt": {"url": "https://www.youtube.com/watch?v=JtQyLrz-EZs", "title": "Як працювати з PBR текстурами та робити UV розгортку", "channel": "Sabina Frolova"}}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: PBR in Blender: the Principled BSDF (Day 12, lesson 1 of 4).\nToday's build: M_Master, one master material for the whole course, and its instances on the kit.\n\nBy the end of this lesson I can:\n1. Explain the four PBR inputs: Base Color (the surface's own colour), Metallic (bare metal or not), Roughness (0 is a mirror, 1 is fully matt) and Normal (a normal map: an image that fakes small bumps).\n2. Wire a free texture set from Poly Haven (CC0: free for any use, no credit required, though you still list it) into Blender's Principled BSDF node.\n3. Use the metal rule: paint, wood, stone and plaster are Metallic 0; only bare metal is Metallic 1.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (Every kit piece and street prop you have made is unwrapped at one texel density, ready for real surfaces.), what I will learn today (You build M_Master, one master material for the course, and give the whole kit instances for painted metal, wood, stone, plaster and glass.), encourage me (Today your kit starts to look real, so compare each material with its photo and trust what your own eyes tell you.), and share today's quote: \"My aim in painting has always been the most exact transcription possible of my most intimate impressions of nature.\" (Edward Hopper).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 9: why does every wall piece of your building kit share one width (2 m) and one height? | Day 6: how do you place an actor at an exact spot, for example 4 m east of the origin?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Spot the material: the tutor names six surfaces (wet quay stone, dry rope, a stainless rail, a painted bollard, an old plank, a window pane). I give each a Metallic and a Roughness value. A point for each within 0.2 of the tutor's.\n6. Do-along on today's build (SM_PierDeck_4m in wood and SM_Wall_Window with plaster, frame and glass (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Open polyhaven.com in your browser, click Textures and search planks. Open a weathered wooden plank texture, choose 1K, and download the Diffuse (colour), Normal (GL) and Normal (DX) maps. (GL is for Blender, DX for Unreal.) Write the name and link in credits.md. You see three image files in your downloads folder.\n   - Move them into your Day12 folder. Open quaykit_day11.blend, select SM_PierDeck_4m and click the Shading tab at the top. In Material Properties (red ball icon, right side), remove the UVGrid slot with the minus (-) button, then press New and rename the material Wood. You see a Principled BSDF node wired to Material Output in the node area at the bottom.\n   - Drag the Diffuse image from Explorer into the node area and wire its yellow Color dot into Base Color. You see planks on the deck in the 3D view, sized by your Day 11 UVs.\n   - Drag in the Normal (GL) image. In its node, set Color Space to Non-Color (it holds directions, not colours). Press Shift+A > Vector > Normal Map, then wire image Color > Normal Map Color, and Normal Map's Normal > Principled BSDF's Normal. You see small bumps catch the light as you orbit (middle mouse).\n   - On the Principled BSDF, drag Roughness to 0.1, then to 0.9, and watch the shine. Settle on about 0.75 for weathered wood; leave Metallic at 0. You see a dry, matt deck.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Video Game Textures Explained! (Blender 4.0+ Tutorial)\" by Vertex Arcade: https://www.youtube.com/watch?v=53Rdzthjuu0\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Material slots: one piece, several materials", "uk": "Слоти матеріалів: одна деталь, кілька матеріалів"}, "minutes": 40, "goals": [{"en": "Explain a material slot: a place on one mesh that holds one material, so a wall can have plaster, a frame and glass.", "uk": "Поясни, що таке слот матеріалу: місце на одній сітці, яке тримає один матеріал, тож стіна може мати штукатурку, раму й скло."}, {"en": "Add slots and assign faces to each in Edit Mode.", "uk": "Додай слоти й признач кожному грані в Edit Mode."}, {"en": "Name slots by surface (Plaster, Frame, Glass), because Unreal shows these names, and see them after Reimport.", "uk": "Називай слоти за поверхнею (Plaster, Frame, Glass), бо Unreal показує ці назви, і знайди їх після Reimport."}], "doalong": [{"en": "Open buildkit_day11.blend and select SM_Wall_Window. In Material Properties, remove the UVGrid slot with the minus (-) button. Then press + and New three times, and rename the materials Plaster, Frame and Glass. Give each a different Base Color so you can tell them apart. You see three slots in the list, and the whole wall in the first colour.", "uk": "Відкрий buildkit_day11.blend і виділи SM_Wall_Window. У Material Properties прибери слот UVGrid кнопкою «мінус» (-). Потім тричі натисни + і New та перейменуй матеріали на Plaster, Frame і Glass. Дай кожному інший Base Color, щоб їх розрізняти. Ти бачиш три слоти в списку, а всю стіну — в першому кольорі."}, {"en": "Your Day 9 window has a glass panel. Only if yours is an empty hole, add a pane first: In Object Mode press Shift+A > Mesh > Plane, then rotate and scale it to fill the opening and move it 5 cm inside. Click it, Shift+click the wall and press Ctrl+J to join them. You see the pane inside the opening, part of the wall.", "uk": "Твоє вікно з Дня 9 має скляну панель. Лише якщо в тебе порожній отвір, спершу додай шибку: в Object Mode натисни Shift+A > Mesh > Plane, потім поверни й масштабуй її, щоб вона заповнила отвір, і посунь на 5 см усередину. Клацни її, Shift+клацни стіну й натисни Ctrl+J, щоб їх об'єднати. Ти бачиш шибку всередині отвору як частину стіни."}, {"en": "Tab into Edit Mode and press 3 for faces. Hover over the wall and press L to select its linked faces (or click faces with Shift). Click the Plaster slot and press Assign. You see those faces take Plaster's colour.", "uk": "Натисни Tab для Edit Mode і 3 для граней. Наведи курсор на стіну й натисни L, щоб виділити її зв'язані грані (або клацай грані з Shift). Клацни слот Plaster і натисни Assign. Ти бачиш, що ці грані набувають кольору Plaster."}, {"en": "Select the frame faces, click Frame, Assign. Select the pane, click Glass, Assign. You see three parts in three colours.", "uk": "Виділи грані рами, клацни Frame, Assign. Виділи шибку, клацни Glass, Assign. Ти бачиш три частини трьох кольорів."}, {"en": "Check: click each slot, press Select, look, then Deselect. You see exactly the right faces light up each time.", "uk": "Перевірка: клацни кожен слот, натисни Select, подивися, потім Deselect. Ти бачиш, що щоразу підсвічуються саме потрібні грані."}, {"en": "Back in Object Mode, export SM_Wall_Window over its old FBX (with its UCX boxes) and Reimport it in Unreal; if a window about material slots opens, accept it. Double-click it to open the Static Mesh Editor. You see Plaster, Frame and Glass in Details > Material Slots.", "uk": "Повернись в Object Mode, експортуй SM_Wall_Window поверх її старого FBX (з UCX-коробками) і зроби Reimport в Unreal; якщо відкриється вікно про слоти матеріалів, прийми його. Двічі клацни її, щоб відкрити Static Mesh Editor. Ти бачиш Plaster, Frame і Glass у Details > Material Slots."}], "play": {"en": "Slot planner: the tutor names five kit pieces. I say which slots each needs and their names in 15 seconds each. An extra slot I don't need costs a point, because each slot costs the computer one more draw.", "uk": "Планувальник слотів: тьютор називає п'ять деталей набору. Я за 15 секунд на кожну кажу, які слоти їй потрібні і як вони називаються. Зайвий слот коштує бал, бо кожен слот — це ще один виклик малювання (draw call) для комп'ютера."}, "video": {"search": "blender material slots assign faces"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Material slots: one piece, several materials (Day 12, lesson 2 of 4).\nToday's build: M_Master, one master material for the whole course, and its instances on the kit.\nEarlier today I already did: lesson 1 (PBR in Blender: the Principled BSDF). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Explain a material slot: a place on one mesh that holds one material, so a wall can have plaster, a frame and glass.\n2. Add slots and assign faces to each in Edit Mode.\n3. Name slots by surface (Plaster, Frame, Glass), because Unreal shows these names, and see them after Reimport.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Slot planner: the tutor names five kit pieces. I say which slots each needs and their names in 15 seconds each. An extra slot I don't need costs a point, because each slot costs the computer one more draw.\n4. Do-along on today's build (SM_PierDeck_4m in wood and SM_Wall_Window with plaster, frame and glass (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Open buildkit_day11.blend and select SM_Wall_Window. In Material Properties, remove the UVGrid slot with the minus (-) button. Then press + and New three times, and rename the materials Plaster, Frame and Glass. Give each a different Base Color so you can tell them apart. You see three slots in the list, and the whole wall in the first colour.\n   - Your Day 9 window has a glass panel. Only if yours is an empty hole, add a pane first: In Object Mode press Shift+A > Mesh > Plane, then rotate and scale it to fill the opening and move it 5 cm inside. Click it, Shift+click the wall and press Ctrl+J to join them. You see the pane inside the opening, part of the wall.\n   - Tab into Edit Mode and press 3 for faces. Hover over the wall and press L to select its linked faces (or click faces with Shift). Click the Plaster slot and press Assign. You see those faces take Plaster's colour.\n   - Select the frame faces, click Frame, Assign. Select the pane, click Glass, Assign. You see three parts in three colours.\n   - Check: click each slot, press Select, look, then Deselect. You see exactly the right faces light up each time.\n   - Back in Object Mode, export SM_Wall_Window over its old FBX (with its UCX boxes) and Reimport it in Unreal; if a window about material slots opens, accept it. Double-click it to open the Static Mesh Editor. You see Plaster, Frame and Glass in Details > Material Slots.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Textures into Unreal, and M_Master", "uk": "Текстури в Unreal і M_Master"}, "minutes": 40, "goals": [{"en": "Import a texture set and set it up: colour maps stay sRGB (a colour standard for images people look at); normal maps use Normalmap compression with sRGB off.", "uk": "Імпортуй набір текстур і налаштуй його: карти кольору лишаються sRGB (колірний стандарт для зображень, які розглядають люди); карти нормалей використовують стиснення Normalmap з вимкненим sRGB."}, {"en": "Explain a master material: one material with parameters (named settings you can change later) that many instances copy.", "uk": "Поясни, що таке майстер-матеріал: один матеріал з параметрами (іменованими налаштуваннями, які можна змінити пізніше), який копіюють багато інстансів."}, {"en": "Build M_Master on the main node's classic pins (Substrate converts it for you) with BaseColor times Tint, Roughness, Metallic, Normal and Tiling, using the M_, MI_ and T_ prefixes.", "uk": "Збери M_Master на класичних пінах головного вузла (Substrate сам його перетворить) з BaseColor, помноженим на Tint, Roughness, Metallic, Normal і Tiling, використовуючи префікси M_, MI_ і T_."}], "doalong": [{"en": "In the Content Browser make the folder Course/Day12. Drag in the wood Diffuse and Normal (DX) images. Rename them T_WoodPlanks_D and T_WoodPlanks_N (right-click > Rename). You see two textures with the right names.", "uk": "У Content Browser створи папку Course/Day12. Перетягни туди зображення дерева Diffuse і Normal (DX). Перейменуй їх на T_WoodPlanks_D і T_WoodPlanks_N (правою кнопкою > Rename). Ти бачиш дві текстури з правильними назвами."}, {"en": "Double-click T_WoodPlanks_N. In its Details on the right, check Compression Settings reads Normalmap and sRGB is unticked; change them if not, then press Save. You see Normalmap in the Compression box.", "uk": "Двічі клацни T_WoodPlanks_N. У Details праворуч перевір, що Compression Settings показує Normalmap, а sRGB без галочки; якщо ні, зміни їх, потім натисни Save. Ти бачиш Normalmap у полі Compression."}, {"en": "Right-click empty space in Course/Day12 > Material, name it M_Master and double-click it. You see the Material Editor: a graph in the middle, the main material node with input pins (Base Color, Metallic, Roughness, Normal and more), and a preview sphere at the top left. (Your project uses Substrate, Unreal's newer material system, which is switched on in every new 5.8 project. A new material still shows these classic pins, and Unreal converts it to Substrate when it compiles, so you build it exactly as below. Never right-click the main node > Convert to Substrate: that swaps Metallic for other pins. A Substrate panel may show under the graph; ignore it. If your main node shows only one pin, called Front Material, send the tutor a screenshot.)", "uk": "Клацни правою кнопкою на порожньому місці в Course/Day12 > Material, назви його M_Master і двічі клацни. Ти бачиш Material Editor: граф посередині, головний вузол матеріалу з вхідними пінами (Base Color, Metallic, Roughness, Normal та інші) і сферу попереднього перегляду вгорі ліворуч. (Твій проєкт використовує Substrate, новішу систему матеріалів Unreal, яка ввімкнена в кожному новому проєкті 5.8. Новий матеріал усе одно показує ці класичні піни, а Unreal перетворює його на Substrate під час компіляції, тож збирай його точно так, як нижче. Ніколи не клацай правою кнопкою на головному вузлі > Convert to Substrate: це замінить Metallic іншими пінами. Під графом може з'явитися панель Substrate; не зважай на неї. Якщо головний вузол показує лише один пін, Front Material, надішли тьюторові скриншот.)"}, {"en": "Hold T and left-click empty graph space: a Texture Sample node. Right-click it > Convert to Parameter and name it BaseColor. In Details, set its Texture to WhiteSquareTexture (in the picker, open the settings cog and tick Show Engine Content). You see a white square in the node's thumbnail.", "uk": "Затисни T і клацни лівою кнопкою на порожньому місці графа: з'явиться вузол Texture Sample. Клацни його правою кнопкою > Convert to Parameter і назви BaseColor. У Details постав його Texture на WhiteSquareTexture (у вікні вибору відкрий шестерню налаштувань і постав галочку Show Engine Content). Ти бачиш білий квадрат на мініатюрі вузла."}, {"en": "Hold V and click: a Vector Parameter; name it Tint and leave its colour white. Hold M and click: a Multiply. Drag wires from BaseColor's RGB pin and from Tint into the Multiply's A and B, then from the Multiply into Base Color. You see a white preview sphere.", "uk": "Затисни V і клацни: Vector Parameter; назви його Tint і залиш колір білим. Затисни M і клацни: Multiply. Протягни дроти від піна RGB вузла BaseColor і від Tint у входи A і B вузла Multiply, потім від Multiply у Base Color. Ти бачиш білу сферу попереднього перегляду."}, {"en": "Hold S and click twice for two Scalar Parameters: Roughness (Default Value 0.7) and Metallic (0). Wire each into the pin with the same name. You see a matt, slightly grey sphere.", "uk": "Затисни S і клацни двічі — два Scalar Parameter: Roughness (Default Value 0.7) і Metallic (0). З'єднай кожен з піном такої самої назви. Ти бачиш матову, трохи сіру сферу."}, {"en": "Add another Texture Sample (hold T and click), Convert to Parameter, name it Normal, set its Texture to DefaultNormal (an engine texture for a flat surface) and wire its RGB into Normal. You see no change yet: wood bumps come with each instance.", "uk": "Додай ще один Texture Sample (затисни T і клацни), Convert to Parameter, назви його Normal, постав його Texture на DefaultNormal (текстура рушія для пласкої поверхні) і з'єднай його RGB з Normal. Поки що змін не видно: нерівності дерева прийдуть з кожним інстансом."}, {"en": "Hold U and click: a TexCoord node (the model's UVs). Add a Scalar Parameter Tiling (Default 1) and a Multiply: TexCoord times Tiling, wired into the UVs pin of both BaseColor and Normal. Press Apply and Save at the top. You see the material compile (Unreal turns the graph into a small program for the graphics card) with no errors.", "uk": "Затисни U і клацни: вузол TexCoord (UV моделі). Додай Scalar Parameter Tiling (Default 1) і Multiply: TexCoord, помножений на Tiling, з'єднаний з піном UVs і в BaseColor, і в Normal. Натисни Apply і Save угорі. Ти бачиш, як матеріал компілюється (Unreal перетворює граф на маленьку програму для відеокарти) без помилок."}], "play": {"en": "Break it, fix it: the tutor tells me one secret mistake in a material (a normal map left in sRGB, Metallic 1 on paint, a missing Tiling wire). I guess it from the tutor's description of the result and say the fix.", "uk": "Зламай і полагодь: тьютор вигадує одну таємну помилку в матеріалі (карта нормалей лишилася в sRGB, Metallic 1 на фарбі, бракує дроту Tiling). Я вгадую її з опису результату від тьютора й кажу, як виправити."}, "video": {"url": "https://www.youtube.com/watch?v=yKqp27yO0C4", "title": "Simple Master Material Setup in Unreal Engine 5 (Tutorial)", "channel": "Faebe Tutorials", "length": "9:26", "search": "unreal engine 5 master material instance", "alt": {"url": "https://www.youtube.com/watch?v=49WuJspiPSk", "title": "Матеріали в Unreal Engine 5 для початківців", "channel": "3DV Unreal Engine Archviz Academy"}}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Textures into Unreal, and M_Master (Day 12, lesson 3 of 4).\nToday's build: M_Master, one master material for the whole course, and its instances on the kit.\nEarlier today I already did: lesson 1 (PBR in Blender: the Principled BSDF); lesson 2 (Material slots: one piece, several materials). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Import a texture set and set it up: colour maps stay sRGB (a colour standard for images people look at); normal maps use Normalmap compression with sRGB off.\n2. Explain a master material: one material with parameters (named settings you can change later) that many instances copy.\n3. Build M_Master on the main node's classic pins (Substrate converts it for you) with BaseColor times Tint, Roughness, Metallic, Normal and Tiling, using the M_, MI_ and T_ prefixes.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Break it, fix it: the tutor tells me one secret mistake in a material (a normal map left in sRGB, Metallic 1 on paint, a missing Tiling wire). I guess it from the tutor's description of the result and say the fix.\n4. Do-along on today's build (SM_PierDeck_4m in wood and SM_Wall_Window with plaster, frame and glass (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - In the Content Browser make the folder Course/Day12. Drag in the wood Diffuse and Normal (DX) images. Rename them T_WoodPlanks_D and T_WoodPlanks_N (right-click > Rename). You see two textures with the right names.\n   - Double-click T_WoodPlanks_N. In its Details on the right, check Compression Settings reads Normalmap and sRGB is unticked; change them if not, then press Save. You see Normalmap in the Compression box.\n   - Right-click empty space in Course/Day12 > Material, name it M_Master and double-click it. You see the Material Editor: a graph in the middle, the main material node with input pins (Base Color, Metallic, Roughness, Normal and more), and a preview sphere at the top left. (Your project uses Substrate, Unreal's newer material system, which is switched on in every new 5.8 project. A new material still shows these classic pins, and Unreal converts it to Substrate when it compiles, so you build it exactly as below. Never right-click the main node > Convert to Substrate: that swaps Metallic for other pins. A Substrate panel may show under the graph; ignore it. If your main node shows only one pin, called Front Material, send the tutor a screenshot.)\n   - Hold T and left-click empty graph space: a Texture Sample node. Right-click it > Convert to Parameter and name it BaseColor. In Details, set its Texture to WhiteSquareTexture (in the picker, open the settings cog and tick Show Engine Content). You see a white square in the node's thumbnail.\n   - Hold V and click: a Vector Parameter; name it Tint and leave its colour white. Hold M and click: a Multiply. Drag wires from BaseColor's RGB pin and from Tint into the Multiply's A and B, then from the Multiply into Base Color. You see a white preview sphere.\n   - Hold S and click twice for two Scalar Parameters: Roughness (Default Value 0.7) and Metallic (0). Wire each into the pin with the same name. You see a matt, slightly grey sphere.\n   - Add another Texture Sample (hold T and click), Convert to Parameter, name it Normal, set its Texture to DefaultNormal (an engine texture for a flat surface) and wire its RGB into Normal. You see no change yet: wood bumps come with each instance.\n   - Hold U and click: a TexCoord node (the model's UVs). Add a Scalar Parameter Tiling (Default 1) and a Multiply: TexCoord times Tiling, wired into the UVs pin of both BaseColor and Normal. Press Apply and Save at the top. You see the material compile (Unreal turns the graph into a small program for the graphics card) with no errors.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Simple Master Material Setup in Unreal Engine 5 (Tutorial)\" by Faebe Tutorials: https://www.youtube.com/watch?v=yKqp27yO0C4\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Material instances: painted metal, wood, stone and glass", "uk": "Інстанси матеріалів: фарбований метал, дерево, камінь і скло"}, "minutes": 40, "goals": [{"en": "Explain an instance: a cheap copy of a master material where you only change its parameters, with no wait to recompile.", "uk": "Поясни, що таке інстанс: дешева копія майстер-матеріалу, де ти змінюєш лише параметри, без очікування на перекомпіляцію."}, {"en": "Make instances from M_Master and set each from a real photo: painted metal, wood and glass.", "uk": "Створи інстанси з M_Master і налаштуй кожен за справжнім фото: фарбований метал, дерево й скло."}, {"en": "Set instances on the mesh asset in the Static Mesh Editor, so every copy in every level updates.", "uk": "Признач інстанси на асеті сітки в Static Mesh Editor, щоб оновилася кожна копія на кожному рівні."}], "doalong": [{"en": "Right-click M_Master > Create Material Instance and name it MI_Wood. Double-click it; tick BaseColor (pick T_WoodPlanks_D), Normal (T_WoodPlanks_N) and Roughness (0.75). You see planks on the preview sphere.", "uk": "Клацни правою кнопкою M_Master > Create Material Instance і назви його MI_Wood. Двічі клацни його; постав галочки BaseColor (вибери T_WoodPlanks_D), Normal (T_WoodPlanks_N) і Roughness (0.75). Ти бачиш дошки на сфері попереднього перегляду."}, {"en": "Double-click SM_PierDeck_4m in the Content Browser. In Details > Material Slots, set its slot to MI_Wood, then Save. You see the wooden deck in this editor and in L_KitTest.", "uk": "Двічі клацни SM_PierDeck_4m у Content Browser. У Details > Material Slots постав її слот на MI_Wood, потім Save. Ти бачиш дерев'яний настил у цьому редакторі й у L_KitTest."}, {"en": "Make MI_PaintedMetal: no texture; tick Tint and pick a dark green or blue; Roughness 0.45; Metallic 0. You see a satin painted finish, not chrome.", "uk": "Створи MI_PaintedMetal: без текстури; постав галочку Tint і вибери темно-зелений або синій; Roughness 0.45; Metallic 0. Ти бачиш сатинове фарбоване покриття, а не хром."}, {"en": "Make MI_Glass: Tint a dark blue-grey, Roughness 0.05, Metallic 0. Set SM_Wall_Window's Glass slot to it, its Frame slot to MI_PaintedMetal. You see the sky reflected in the window. (Real see-through glass costs more and needs a room behind it; most game buildings use this opaque game glass.)", "uk": "Створи MI_Glass: Tint темний синьо-сірий, Roughness 0.05, Metallic 0. Признач його слоту Glass у SM_Wall_Window, а слоту Frame — MI_PaintedMetal. Ти бачиш небо, що відбивається у вікні. (Справжнє прозоре скло дорожче й потребує кімнати за ним; більшість ігрових будівель використовує саме таке непрозоре ігрове скло.)"}, {"en": "Put a real photo of painted harbour railings beside your viewport and adjust MI_PaintedMetal's Tint and Roughness until it looks like the photo. You see the two side by side in a screenshot.", "uk": "Постав справжнє фото фарбованих поручнів гавані поруч із в'юпортом і підлаштовуй Tint і Roughness у MI_PaintedMetal, доки матеріал не стане схожим на фото. Ти бачиш їх поруч на скриншоті."}, {"en": "Open MI_Wood and set Tiling to 2, then back to 1. You see the planks halve in size, then return: Tiling is how you correct a texture's real size.", "uk": "Відкрий MI_Wood і постав Tiling на 2, потім знову на 1. Ти бачиш, що дошки зменшуються вдвічі, а потім повертаються: Tiling — це спосіб виправити реальний розмір текстури."}], "play": {"en": "Speed build: I make four instances (painted metal, wood, stone, glass), named and set, in 10 minutes from the saved master. The tutor checks the names and Metallic values from my screenshot.", "uk": "Швидкісна збірка: за 10 хвилин зі збереженого майстер-матеріалу я роблю чотири інстанси (фарбований метал, дерево, камінь, скло), з назвами й налаштуваннями. Тьютор перевіряє назви й значення Metallic з мого скриншота."}, "video": {"url": "https://www.youtube.com/watch?v=j-woQ77pkhU", "title": "Unreal 5 Videocourse - 17 - Materials, PBR, Physically Based Render, Roughness, Specular, Metallic", "channel": "jbdtube", "length": "9:58", "search": "unreal engine 5 roughness metallic specular"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Material instances: painted metal, wood, stone and glass (Day 12, lesson 4 of 4).\nToday's build: M_Master, one master material for the whole course, and its instances on the kit.\nEarlier today I already did: lesson 1 (PBR in Blender: the Principled BSDF); lesson 2 (Material slots: one piece, several materials); lesson 3 (Textures into Unreal, and M_Master). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Explain an instance: a cheap copy of a master material where you only change its parameters, with no wait to recompile.\n2. Make instances from M_Master and set each from a real photo: painted metal, wood and glass.\n3. Set instances on the mesh asset in the Static Mesh Editor, so every copy in every level updates.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Speed build: I make four instances (painted metal, wood, stone, glass), named and set, in 10 minutes from the saved master. The tutor checks the names and Metallic values from my screenshot.\n4. Do-along on today's build (SM_PierDeck_4m in wood and SM_Wall_Window with plaster, frame and glass (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Right-click M_Master > Create Material Instance and name it MI_Wood. Double-click it; tick BaseColor (pick T_WoodPlanks_D), Normal (T_WoodPlanks_N) and Roughness (0.75). You see planks on the preview sphere.\n   - Double-click SM_PierDeck_4m in the Content Browser. In Details > Material Slots, set its slot to MI_Wood, then Save. You see the wooden deck in this editor and in L_KitTest.\n   - Make MI_PaintedMetal: no texture; tick Tint and pick a dark green or blue; Roughness 0.45; Metallic 0. You see a satin painted finish, not chrome.\n   - Make MI_Glass: Tint a dark blue-grey, Roughness 0.05, Metallic 0. Set SM_Wall_Window's Glass slot to it, its Frame slot to MI_PaintedMetal. You see the sky reflected in the window. (Real see-through glass costs more and needs a room behind it; most game buildings use this opaque game glass.)\n   - Put a real photo of painted harbour railings beside your viewport and adjust MI_PaintedMetal's Tint and Roughness until it looks like the photo. You see the two side by side in a screenshot.\n   - Open MI_Wood and set Tiling to 2, then back to 1. You see the planks halve in size, then return: Tiling is how you correct a texture's real size.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Unreal 5 Videocourse - 17 - Materials, PBR, Physically Based Render, Roughness, Specular, Metallic\" by jbdtube: https://www.youtube.com/watch?v=j-woQ77pkhU\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "credits.md (every texture with its link)", "uk": "credits.md (кожна текстура з посиланням)"}, {"en": "material_instances.png (Course/Day12 with M_Master and all instances)", "uk": "material_instances.png (Course/Day12 з M_Master і всіма інстансами)"}, {"en": "m_master_graph.png (the M_Master graph)", "uk": "m_master_graph.png (граф M_Master)"}, {"en": "photo_vs_engine_day12.png (four materials beside real photos)", "uk": "photo_vs_engine_day12.png (чотири матеріали поруч зі справжніми фото)"}, {"en": "before_after_day12.png (L_KitTest before and after materials, same view)", "uk": "before_after_day12.png (L_KitTest до і після матеріалів, той самий ракурс)"}, {"en": "flythrough_day12.mp4 (60 seconds)", "uk": "flythrough_day12.mp4 (60 секунд)"}, {"en": "summary.md", "uk": "звіт дня (summary.md)"}], "goal": {"en": "By the end of today you have M_Master in Unreal, with instances for painted metal, wood, stone, plaster and glass on every kit piece and prop, checked beside real photos.", "uk": "Наприкінці сьогоднішнього дня в тебе є M_Master в Unreal, а на кожній деталі набору й кожному пропсі — його інстанси для фарбованого металу, дерева, каменю, штукатурки й скла, звірені зі справжніми фото."}, "uses": [{"en": "Day 11: your unwrapped kit and props at 1024 pixels per metre, in quaykit_day11.blend, railing_day11.blend, buildkit_day11.blend and your prop files", "uk": "День 11: твій розгорнутий набір і пропси з 1024 пікселями на метр, у quaykit_day11.blend, railing_day11.blend, buildkit_day11.blend і файлах пропсів"}, {"en": "Day 10: L_KitTest, where the kit is assembled", "uk": "День 10: L_KitTest, де зібрано набір"}, {"en": "Day 9: SM_Wall_Window and SM_Wall_Door, which get several materials each", "uk": "День 9: SM_Wall_Window і SM_Wall_Door, кожна з яких отримує кілька матеріалів"}], "quiz": [{"q": {"en": "Which surface should have Metallic 1?", "uk": "Яка поверхня має мати Metallic 1?"}, "options": [{"en": "A painted steel bollard", "uk": "Фарбований сталевий стовпчик"}, {"en": "Bare galvanised steel on a railing", "uk": "Гола оцинкована сталь на поручні"}, {"en": "A painted wooden door", "uk": "Фарбовані дерев'яні двері"}, {"en": "Wet quay stone", "uk": "Мокрий камінь набережної"}], "answer": 1, "explain": {"en": "Paint covers the metal, so painted steel is Metallic 0. Only bare metal is Metallic 1.", "uk": "Фарба вкриває метал, тож фарбована сталь має Metallic 0. Лише голий метал має Metallic 1."}}, {"q": {"en": "Your new wood looks like shiny plastic in the sun. Which single change helps most?", "uk": "Твоє нове дерево на сонці схоже на блискучий пластик. Яка одна зміна допоможе найбільше?"}, "options": [{"en": "Raise Roughness to about 0.75", "uk": "Підняти Roughness приблизно до 0.75"}, {"en": "Set Metallic to 1", "uk": "Поставити Metallic на 1"}, {"en": "Make the Tint pure white", "uk": "Зробити Tint чисто білим"}, {"en": "Set Tiling to 0.1", "uk": "Поставити Tiling на 0.1"}], "answer": 0, "explain": {"en": "Wood is matt. A low Roughness makes any surface shine like plastic.", "uk": "Дерево матове. Низький Roughness змушує будь-яку поверхню блищати, як пластик."}}, {"q": {"en": "You changed the Tint in MI_PaintedMetal, but one lamp post in a level keeps the old colour. What is the likely cause?", "uk": "Tint у MI_PaintedMetal змінено, але один ліхтарний стовп на рівні зберігає старий колір. Яка найімовірніша причина?"}, "options": [{"en": "The lamp post needs more triangles", "uk": "Ліхтарному стовпу потрібно більше трикутників"}, {"en": "Instances never update in levels", "uk": "Інстанси на рівнях ніколи не оновлюються"}, {"en": "That placed copy has its own material set in the level, which wins over the mesh asset", "uk": "Ця розміщена копія має власний матеріал на рівні, і він переважає асет сітки"}], "answer": 2, "explain": {"en": "A material set on a placed copy in the level overrides the mesh asset's slot. Set materials on the mesh asset and clear the copy's override.", "uk": "Матеріал, призначений розміщеній копії на рівні, перекриває слот асета сітки. Признач матеріали на асеті сітки й прибери перевизначення з копії."}}, {"q": {"en": "Why use one master material and many instances?", "uk": "Навіщо один майстер-матеріал і багато інстансів?"}, "options": [{"en": "Instances change without recompiling, and the game has fewer materials to prepare", "uk": "Інстанси змінюються без перекомпіляції, і грі треба готувати менше матеріалів"}, {"en": "Instances always look more real", "uk": "Інстанси завжди виглядають реалістичніше"}, {"en": "Unreal can only use one material", "uk": "Unreal може використовувати лише один матеріал"}, {"en": "Instances need no textures", "uk": "Інстансам не потрібні текстури"}], "answer": 0, "explain": {"en": "An instance only changes parameter values. It is fast to edit and cheap for the game to load.", "uk": "Інстанс змінює лише значення параметрів. Його швидко редагувати, і грі дешево його завантажувати."}}, {"q": {"en": "Your normal map makes the planks look lit from the wrong side, with odd bumps. What do you check first?", "uk": "Через карту нормалей дошки виглядають освітленими не з того боку, з дивними нерівностями. Що ти перевіряєш спершу?"}, "options": [{"en": "That Metallic is 1", "uk": "Що Metallic дорівнює 1"}, {"en": "That the mesh has UCX collision", "uk": "Що сітка має колізію UCX"}, {"en": "That Tiling is 0", "uk": "Що Tiling дорівнює 0"}, {"en": "That it is the DX version, with Normalmap compression and sRGB off", "uk": "Що це версія DX, зі стисненням Normalmap і вимкненим sRGB"}], "answer": 3, "explain": {"en": "Unreal needs the DX normal map, set to Normalmap compression without sRGB. The GL version flips the bumps.", "uk": "Unreal потребує карту нормалей DX зі стисненням Normalmap без sRGB. Версія GL перевертає нерівності."}}], "weekInfo": {"week": 3, "title": {"en": "Surfaces", "uk": "Поверхні"}, "goal": {"en": "By Friday you have your whole harbour kit unwrapped at one texel density, textured with M_Master instances and a trim sheet, weathered with painted wear masks and a Wear slider, and shown beside real harbour photos.", "uk": "До п'ятниці в тебе є весь портовий набір: розгорнутий з однією щільністю текселів, затекстурований інстансами M_Master і трим-шитом, зістарений намальованими масками зношеності й повзунком Wear і показаний поруч зі справжніми фото гавані."}, "skills": [{"en": "UV unwrapping with clean seams and consistent texel density for modular kits", "uk": "UV-розгортка з акуратними швами й однаковою щільністю текселів для модульних наборів"}, {"en": "PBR material authoring: master materials and material instances in Unreal Engine 5", "uk": "Створення PBR-матеріалів: майстер-матеріали та інстанси матеріалів в Unreal Engine 5"}, {"en": "Trim sheet design and UV layout for modular environment kits", "uk": "Дизайн трим-шитів і UV-розкладка для модульних наборів оточення"}, {"en": "Texture painting and parameter-driven weathering (wear masks on a second UV channel)", "uk": "Малювання текстур і зношеність, керована параметрами (маски зношеності на другому UV-каналі)"}, {"en": "Look-development review against real photo reference", "uk": "Перевірка вигляду (look development) за справжніми фото-референсами"}]}, "morning": {"sofar": {"en": "Every kit piece and street prop you have made is unwrapped at one texel density, ready for real surfaces.", "uk": "Кожна частина набору й кожен вуличний пропс уже мають розгортку з однією тексельною щільністю й чекають на справжні поверхні."}, "today": {"en": "You build M_Master, one master material for the course, and give the whole kit instances for painted metal, wood, stone, plaster and glass.", "uk": "Сьогодні ти будуєш M_Master — один майстер-матеріал на весь курс — і даєш усьому набору інстанси для фарбованого металу, дерева, каменю, штукатурки та скла."}, "cheer": {"en": "Today your kit starts to look real, so compare each material with its photo and trust what your own eyes tell you.", "uk": "Сьогодні твій набір починає виглядати справжнім, тож порівнюй кожен матеріал з його фото й довіряй тому, що бачать твої очі."}, "quote": {"text": {"en": "My aim in painting has always been the most exact transcription possible of my most intimate impressions of nature.", "uk": "Моєю метою в живописі завжди було якомога точніше передати мої найпотаємніші враження від природи."}, "author": {"en": "Edward Hopper", "uk": "Едвард Гоппер"}, "source": "https://en.wikiquote.org/wiki/Edward_Hopper"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-12-pbr-materials-m-master", "mapHref": "../../COURSE.html", "prevHref": "../Day-11-uvs-on-the-kit/START-HERE.html", "nextHref": "../Day-13-trim-sheet-and-shop-front/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Blender and Unreal Engine 5.8. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me and don't write code. Keep me moving and make it feel like a game.\n\nToday I build on my own: Material slots and instances for the rest of the kit and the four props, on your own.\nIt's part of: M_Master, one master material for the whole course, and its instances on the kit (Course/Day12 for the textures and materials; L_KitTest for the kit. The same instances dress your island's waterfront in Week 9.).\n\nSpec:\n- M_Master has six parameters: BaseColor (a texture), Tint (a colour), Roughness, Metallic, Normal (a texture) and Tiling.\n- At least six instances, each set from a real photo: MI_PaintedMetal, MI_GalvanisedSteel, MI_Wood, MI_Stone, MI_Plaster and MI_Glass.\n- The metal rule: paint is not metal, so painted metal is Metallic 0; only bare metal (galvanised steel) is Metallic 1. Wood, stone and plaster: Metallic 0, Roughness 0.6 or more.\n- Glass is opaque 'game glass': a dark, smooth surface (Roughness about 0.05) in its own material slot, with nothing behind it.\n- Textures from Poly Haven (free, CC0), named T_<Name>_D for colour and T_<Name>_N for the normal map (the DX version), each listed in credits.md.\n- Material slots named by surface (Plaster, Frame, Glass, Stone, Wood, Metal, Roof), and instances set on the mesh assets in the Static Mesh Editor, so every copy in every level updates.\n- Every kit piece and the four props wear instances: nothing grey or checkered is left in L_KitTest or on the props.\n\nMy checklist:\n1. Download two more Poly Haven textures at 1K or 2K: a stone wall or quay stone, and a plaster. Take the colour map (Diffuse) and Normal (DX) of each. Add both to credits.md. Check: three texture sets (wood, stone, plaster) are in your Day12 folder and three lines are in credits.md. (from lesson 1)\n2. Material slots in Blender (buildkit_day11.blend) for SM_Wall_Door (Plaster, Frame, Door) and your roof pieces: SM_Roof_2m and SM_Roof_Ridge_2m (Roof), SM_Roof_Gable_4m (Plaster), as in lesson 2. Check: in Edit Mode, each slot's Select button lights up the right faces. (from lesson 2)\n3. Slots for the other kit pieces: SM_QuayEdge_4m, SM_Steps and SM_QuayCorner_Out (Stone), SM_Railing_2m and SM_RailingPost (Metal, or Wood if your railing is timber), SM_Wall_2m and SM_Wall_Corner (Plaster). Pick an existing material from the ball menu when the name already exists (for example Plaster). Check: every slot name says what the surface is. (from lesson 2)\n4. Slots for the four props: SM_Bollard (Metal), SM_Bench (Wood and Metal), SM_LampPost (Metal, plus Glass if it has a lamp) and SM_Bin (Metal). Check: the bench's slats and frame light up separately with Select. (from lesson 2)\n5. Export all kit pieces and props over their old FBX files, then Reimport each in Unreal (accept any window about material slots). Check: in each Static Mesh Editor, the Material Slots list shows your slot names. (from lesson 2)\n6. Import the stone and plaster textures into Course/Day12, rename them T_Stone_D, T_Stone_N, T_Plaster_D and T_Plaster_N, and set both normal maps to Normalmap with sRGB off. Check: each _N texture shows Normalmap in Compression Settings. (from lesson 3)\n7. Make MI_Stone and MI_Plaster from M_Master: tick and set BaseColor, Normal and Roughness, then change Tiling until the stones and plaster grain look the right size beside the mannequin. Check: a stone block looks about as big as a real one (40 to 60 cm long). (from lesson 4)\n8. Make MI_GalvanisedSteel for bare railings and fittings: Tint light grey, Metallic 1, Roughness 0.4. Check: in sunlight it shows soft metal highlights, not white plastic. (from lesson 4)\n9. Set instances on the mesh assets: open each Static Mesh Editor and fill every slot. Plaster: MI_Plaster. Frame: MI_PaintedMetal. Door: MI_Wood. Wood: MI_Wood. Stone: MI_Stone. Metal: MI_GalvanisedSteel or MI_PaintedMetal. Roof: a new instance of M_Master, MI_RoofTile, with a dark red Tint and Roughness 0.8 for now (Day 17 gives it a tile texture). Glass: MI_Glass. Check: open L_KitTest; nothing is grey or checkered. (from lesson 4)\n10. Photo check: find one real photo each of painted steel, weathered timber, quay stone and a plastered wall on Wikimedia Commons (commons.wikimedia.org). Put each beside a screenshot of your matching material in Unreal. Check: you wrote one change per material, and made it. (from lesson 4)\n11. The metal rule pass: open every instance; any painted surface with Metallic above 0 goes back to 0. Check: only MI_GalvanisedSteel has Metallic 1. (from lesson 1)\n12. Before/after capture: L_KitTest from the same view with Day 11's checkers or grey, and with today's materials. Then a 60-second clip flying along the kit. Save today's clip as flythrough_day12.mp4 and check that you also have material_instances.png, m_master_graph.png, photo_vs_engine_day12.png and before_after_day12.png (each is described in today's hand-in list; take any you are missing now). Check: every piece shows its material in the clip. (from lesson 4)\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Denis\nDay 12: PBR materials: from the Principled BSDF to M_Master and its instances. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

 const P=[],D=[];let last=0;for(let w=1;w<=12;w++)if(state(w)!=='p')last=w;
 for(let i=0;i<=110;i++){const t=i/110,a=t0+t*turns*TAU,s=1.1-t*.98,q=pt(a,s,0);P.push(q);if(last&&t<=(last-1)/11+1e-9)D.push(q)}
 o+='<path class="rt" d="'+smooth(P,false)+'"/>';
 if(D.length>1)o+='<path class="rtd" d="'+smooth(D,false)+'"/>';
 for(let w=1;w<=12;w++){const c=state(w),{a,s}=wp(w),q=pt(a,s,0),lx=q[0]+(Math.cos(a)>=0?15:-15),an=Math.cos(a)>=0?'start':'end';
  o+='<g class="w '+c+'">'+(c==='n'?'<circle class="halo" cx="'+f(q[0])+'" cy="'+f(q[1])+'" r="12"/>':'')+'<circle class="dot" cx="'+f(q[0])+'" cy="'+f(q[1])+'" r="'+(c==='p'?4.5:c==='n'?8:6)+'"/><text x="'+f(lx)+'" y="'+f(q[1]+5.5)+'" text-anchor="'+an+'">'+String(w).padStart(2,'0')+'</text></g>'}
 /* the dial around it: a ring with the progress arc and a label running along the rim */
 const C=2*Math.PI*176,p=Math.max(0,Math.min(1,pct||0)),id='rim'+Math.random().toString(36).slice(2,7);

 s+='<circle class="face" cx="200" cy="200" r="168"/><circle class="track" cx="200" cy="200" r="176"/>';

 if(p>0){const A=-Math.PI/2+p*TAU;s+='<circle class="knob'+(p<1?' go':'')+'" cx="'+(200+176*Math.cos(A)).toFixed(1)+'" cy="'+(200+176*Math.sin(A)).toFixed(1)+'" r="7"/>'}
 if(label)s+='<text class="rimt"><textPath href="#'+id+'" startOffset="25%" text-anchor="middle">'+label+'</textPath></text>';
 s+='<svg class="topo" x="40" y="62" width="320" height="276" viewBox="40 20 520 370">'+o+'</svg>';

function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2600)}
async function cp(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e2){}a.remove()}toast(u('copied'))}
function tagTxt(v){v=String(v);const m=v.match(/^D(\d+)\.(\d+)$/i);return m?u('day')+' '+m[1]+', '+u('lesson')+' '+m[2]:u('lesson')+' '+v}
function fbCard(){const f=FB[D.day];if(!f)return '';
 if(f.s==='reviewed'){try{const z=fbSeen();if(z[D.day]!==f.at){z[D.day]=f.at;localStorage.setItem(fbSeenKey,JSON.stringify(z))}}catch(e){}
  return '<section class="card glass fbcard">'+lab(u('fbTitle'),'ok')+'<div class="row" style="align-items:baseline;gap:12px"><span class="eyebrow">'+u('fbScore')+'</span><span class="big">'+esc(f.score)+'/'+esc(f.max||10)+'</span></div>'+(fbNote(f)?'<p class="note">'+esc(fbNote(f))+'</p>':'')+'<p class="muted">'+u('fbFull')+': <code>'+esc(D.workPath)+'</code></p></section>'}
 return '<section class="card glass fbcard">'+lab(u('fbTitle'),f.s==='missing'?'':'ok')+'<p class="note">'+u(f.s==='missing'?'fbMiss':'fbWait')+'</p>'+(f.s==='missing'?'<p class="muted">'+u('shipTo')+' <code>'+esc(D.workPath)+'</code></p>':'')+'</section>'}
function qDone(){return D.quiz&&D.quiz.length&&st.qa&&D.quiz.every((q,i)=>st.qa[i]!=null)}
function prog(){const Q=(D.quiz&&D.quiz.length)?1:0,L=D.lessons.length,C=D.build.steps.length;let n=0;D.lessons.forEach((l,i)=>{if(st['q'+i])n++});D.build.steps.forEach((s,i)=>{if(st['c'+i])n++});if(Q&&qDone())n++;return (L+C+Q)?n/(L+C+Q):0}
function qScore(){let n=0;D.quiz.forEach((q,i)=>{if((st.qa||{})[i]===q.answer)n++});return n}
function pick(i,k){st.qa=st.qa||{};if(st.qa[i]!=null)return;st.qa[i]=k;if(qDone())st.qs=[qScore(),D.quiz.length];save();render();const e=document.getElementById('e'+i);if(e)e.focus({preventScroll:true})}
function retry(){st.qa={};delete st.qs;save();render();const e=document.getElementById('o0_0');if(e)e.focus()}
const isBoss=!!(D.build&&D.build.boss&&D.build.boss.length),isFin=D.day===D.total;
document.body.className=isFin?'fin':isBoss?'boss':'';
const lk=s=>esc(s).replace(/https?:\/\/[^\s<']*[^\s<.,;:)']/g,m=>'<a href="'+m+'" target="_blank" rel="noopener">'+m+'</a>');
function list(a,tag,cls){return '<'+tag+(cls?' class="'+cls+'"':'')+'>'+(a||[]).map(i=>'<li>'+lk(x(i))+'</li>').join('')+'</'+tag+'>'}
const lab=(t,k)=>'<div class="lab'+(k?' k-'+k:'')+'"><span class="dotc"></span>'+t+'</div>';
const kn=n=>'<span class="kn">'+ic(n)+'</span>';
const slider=p=>'<div class="slider"><i style="width:calc('+p+'% - 6px)"></i><b style="left:clamp(13px,'+p+'%,calc(100% - 13px))"></b></div>';
function quiz(){if(!D.quiz||!D.quiz.length)return '';const a=st.qa||{};let ok=0;const L=u('letters');
 const pips='<div class="pips well" aria-hidden="true">'+D.quiz.map((q,i)=>'<i class="'+(a[i]==null?'':a[i]===q.answer?'r':'w')+'"></i>').join('')+'</div>';
 const qs=D.quiz.map((q,i)=>{const c=a[i];if(c===q.answer)ok++;return '<div class="qz"><p class="qq"><span class="qn">'+(i+1)+'</span><span>'+lk(x(q.q))+'</span></p>'+q.options.map((o,k)=>{let cls='opt',mk='<span></span>';if(c!=null){if(k===q.answer){cls+=' right';mk=ic('check','mk')}else if(k===c){cls+=' wrong';mk=ic('x','mk')}}return '<button class="'+cls+'" id="o'+i+'_'+k+'"'+(c!=null?' disabled':'')+' onclick="pick('+i+','+k+')"><span class="lt">'+(L[k]||k+1)+'</span><span>'+esc(x(o))+'</span>'+mk+'</button>'}).join('')+(c!=null?'<p class="exp '+(c===q.answer?'r':'w')+'" id="e'+i+'" tabindex="-1"><b>'+(c===q.answer?u('right'):u('wrong'))+'</b>'+lk(x(q.explain))+'</p>':'')+'</div>'}).join('');
 return '<section class="card glass quiz">'+lab(u('quiz'),'gold')+'<p class="muted" style="margin:-6px 0 14px">'+u('quizSub')+'</p>'+pips+qs+(qDone()?'<div class="score well" role="status"><span class="eyebrow">'+u('score')+'</span><span class="lcd" aria-label="'+ok+' / '+D.quiz.length+'">'+seg(ok+'/'+D.quiz.length)+'</span><div class="row"><button class="btn ghost" id="retry" onclick="retry()">'+u('retry')+'</button></div></div>':'')+'</section>'}
function vid(v){if(!v)return '';const link=v.url?'<a href="'+esc(v.url)+'" target="_blank" rel="noopener">'+esc(x(v.title)||v.url)+'</a>'+(v.channel?' <span class="muted">· '+esc(v.channel)+(v.length?' · '+esc(v.length):'')+'</span>':''):'';const s=v.search?'<a href="https://www.youtube.com/results?search_query='+encodeURIComponent(v.search)+'" target="_blank" rel="noopener">'+u('noVid')+': '+esc(v.search)+'</a>':'';const alt=v.alt&&v.alt.url?'<br><span class="eyebrow">UA</span> <a href="'+esc(v.alt.url)+'" target="_blank" rel="noopener">'+esc(v.alt.title||v.alt.url)+'</a>'+(v.alt.channel?' <span class="muted">· '+esc(v.alt.channel)+'</span>':''):'';return '<div class="vid well">'+kn('play')+'<div><b>'+u('more')+'?</b><br>'+(link||s)+alt+(link&&s?'<br><span class="muted" style="font-size:14px">'+s+'</span>':'')+'</div></div>'}
function morning(){const m=D.morning;if(!m)return '';const q=m.quote||{};
 let shelf='';if(D.day>0){shelf='<div class="shelf" aria-hidden="true">';let g='';for(let d=0;d<D.day;d++){let p=0;try{p=(JSON.parse(localStorage.getItem('devteam:'+D.learner+':'+d))||{}).pct||0}catch(e){}g+='<i class="'+(p>=1?'d':'')+(d>0&&d%5===0?' bs':'')+'"></i>';if(d%5===0||d===D.day-1){shelf+='<span class="wkg">'+g+'</span>';g=''}}shelf+='</div>'}
 const qt=lang==='uk'&&q.original?q.original:x(q.text);
 return '<section class="card glass morning"><div class="mgrid">'+(m.sofar?'<div>'+lab(u('sofar'),'gold')+shelf+'<p class="mtxt">'+lk(x(m.sofar))+'</p></div>':'')+(m.today?'<div>'+lab(u('todayL'))+'<p class="mtxt">'+lk(x(m.today))+'</p></div>':'')+'</div>'+(m.cheer?'<p class="cheer">'+esc(x(m.cheer))+'</p>':'')+(qt?'<figure class="quote well">'+kn('quote')+'<blockquote>'+esc(qt)+'</blockquote>'+(q.author?'<figcaption>'+esc(x(q.author))+'</figcaption>':'')+'</figure>':'')+'</section>'}
function setLang(l){lang=l;try{localStorage.setItem('devteam:lang',lang)}catch(e){};render()}
function toggleLang(){setLang(lang==='uk'?'en':'uk')}
/* keep open sections and keyboard focus across re-renders */

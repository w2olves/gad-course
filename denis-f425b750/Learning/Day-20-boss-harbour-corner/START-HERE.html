<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 20</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.b{background:linear-gradient(145deg,#ff8cc4,#d6337e);box-shadow:0 10px 24px -8px rgba(255,95,168,.6),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.s{background:linear-gradient(145deg,#5fe39a,#16a34a);box-shadow:0 10px 24px -8px rgba(74,222,128,.55),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.ghost{color:var(--ink);background:var(--card);box-shadow:var(--raiseS)}

/* the Done switch */
.sw{display:inline-flex;align-items:center;gap:12px;border:0;background:transparent;cursor:pointer;font:600 14px/1 var(--head);color:var(--muted);min-height:50px;padding:0 6px}
.sw .tr{position:relative;width:58px;height:32px;border-radius:999px;background:var(--well);box-shadow:var(--press);transition:background .25s}

details{margin-top:22px;border-radius:20px;background:var(--well);box-shadow:var(--press);padding:0 18px}

.steps{list-style:none;padding:0;counter-reset:s;margin:4px 0 0}
.steps li{counter-increment:s;position:relative;padding:0 0 0 44px;margin:12px 0}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 12.5px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.vid{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;margin-top:20px;font-size:15px;padding:16px 18px;border-radius:20px}

/* build */
.build.bossday{border-color:rgba(255,95,168,.35)}
.build.bossday::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(60% 45% at 100% 0%,rgba(255,95,168,.28),transparent 70%);z-index:-1;pointer-events:none}
.tiers{list-style:none;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:0}

.m1{--mg:rgba(190,200,215,.7)}.m1 i{background:linear-gradient(135deg,#f3f6fa,#9aa5b3)}

.check input::after{content:"";width:10px;height:5px;border:solid #fff;border-width:0 0 2.2px 2.2px;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.check input:checked{background:linear-gradient(145deg,#5fe39a,#16a34a);box-shadow:0 0 12px rgba(74,222,128,.55)}
.check input:checked::after{opacity:1}
.check li.on .tx{color:var(--faint)}
.check .ln{font:600 10.5px/1.3 var(--head);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);white-space:nowrap;margin-top:5px;padding:4px 9px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
/* quiz */
.pips{display:flex;gap:8px;margin:0 0 4px;padding:10px 14px;border-radius:999px;width:max-content;max-width:100%;flex-wrap:wrap}

.opt:hover:not([disabled]){transform:translateY(-1px);color:var(--accT)}
.opt.right{box-shadow:var(--press);background:var(--okBg);border-color:rgba(74,222,128,.45)}.opt.right .lt{background:var(--okL);color:#fff;box-shadow:0 0 10px var(--okL)}.opt.right .mk{color:var(--ok)}
.opt.wrong{box-shadow:var(--press);background:var(--badBg);border-color:rgba(255,93,93,.45)}.opt.wrong .lt{background:var(--badL);color:#fff;box-shadow:0 0 10px var(--badL)}.opt.wrong .mk{color:var(--bad)}

.exp{margin:10px 0 0 50px;font-size:15.5px;color:var(--muted)}

.nav a.nx{justify-content:flex-end;text-align:right;grid-column:2}
#toast{position:fixed;left:50%;bottom:28px;z-index:9;transform:translateX(-50%) translateY(16px);background:rgba(30,33,46,.82);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:#f4f5fa;border:1px solid rgba(255,255,255,.14);padding:13px 24px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none;font:600 14px/1.4 var(--head);max-width:min(92vw,560px);text-align:center;box-shadow:0 20px 40px -14px rgba(0,0,0,.5),0 0 24px var(--glow)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:860px){.how{grid-template-columns:repeat(2,minmax(0,1fr))}.tiers{grid-template-columns:1fr}}

 body{font-size:16.5px}

 .quest{grid-template-columns:1fr}.qnum{width:54px;height:54px;font-size:19px;margin-bottom:10px}

}

<script id="data" type="application/json">{"learner": "ib-denis-f425b750", "learnerName": {"en": "Denis", "uk": "Денис"}, "day": 20, "week": 4, "total": 60, "title": {"en": "Boss: a lit, dressed 30 x 30 m harbour corner from your own kit", "uk": "День боса: освітлений і наповнений куток гавані 30 x 30 м з твого власного набору"}, "theme": {"en": "Week 4: The Unreal look", "uk": "Тиждень 4: Вигляд в Unreal"}, "build": {"item": {"en": "A lit, dressed 30 x 30 m harbour corner, from your own kit", "uk": "Освітлений і наповнений куток гавані 30 x 30 м з твого власного набору"}, "why": {"en": "This is your first scene that looks like a real place: quay, pier, building, props, wear and light, all your own work. A small, finished corner teaches more than a big, empty town, and studios ask for exactly this kind of piece in a portfolio. From Day 41 it becomes the sample plot for district 1 on your island.", "uk": "Це твоя перша сцена, що виглядає як справжнє місце: набережна, пірс, будівля, пропси, зношеність і світло — усе це твоя власна робота. Маленький завершений куток навчає більше, ніж велике порожнє місто, і студії просять саме таку роботу в портфоліо. З Дня 41 він стане пробною ділянкою для району 1 на твоєму острові."}, "where": {"en": "L_HarbourCorner (Course/Day19), around the kit you placed yesterday.", "uk": "L_HarbourCorner (Course/Day19), навколо набору, розставленого вчора."}, "spec": [{"en": "A 30 x 30 m area: a quay edge along two sides of the land, turning the corner with SM_QuayCorner_Out, so there is water on two sides; the pier, the harbour building with SM_ShopFront_A and an awning, steps down to the water, and railings.", "uk": "Ділянка 30 x 30 м: край набережної вздовж двох боків суші, що повертає за ріг через SM_QuayCorner_Out, тож вода з двох боків; пірс, будівля гавані з SM_ShopFront_A і маркізою, сходи до води й поручні."}, {"en": "Ground: MI_Paving on the land side with the right Tiling; roofs in MI_RoofTile.", "uk": "Земля: MI_Paving з боку суші з правильним Tiling; дахи в MI_RoofTile."}, {"en": "Props by use: bollards along the quay edge, benches facing the water, lamp posts at a steady rhythm with one real break, a bin by each bench.", "uk": "Пропси за призначенням: стовпчики вздовж краю набережної, лавки лицем до води, ліхтарні стовпи в рівному ритмі з одним справжнім розривом, урна біля кожної лавки."}, {"en": "Decals by cause: algae and salt at the waterline, one or two puddles, tyre tracks at a van stop.", "uk": "Декалі за причиною: водорості й сіль біля ватерлінії, одна-дві калюжі, сліди шин біля зупинки фургона."}, {"en": "Wear set by how exposed each piece is to sea and sun, colours from your palette; nothing grey, floating or sunk too deep.", "uk": "Зношеність задано за тим, наскільки кожна деталь відкрита морю й сонцю, кольори з твоєї палітри; нічого сірого, нічого, що висить у повітрі чи надто глибоко втоплене."}, {"en": "Lit by light_recipe.md; C1 and C2 composed (subject on a third, horizon level) and shot at 1920 x 1080.", "uk": "Освітлено за light_recipe.md; C1 і C2 скомпоновано (об'єкт на третині, горизонт рівний) і знято в 1920 x 1080."}, {"en": "Performance: stat unit from C2 written down (aim under 16.6 ms on your PC).", "uk": "Продуктивність: stat unit з C2 записано (мета — менше 16,6 мс на твоєму ПК)."}], "piece1": "the stretch of quay in front of the building (shared with the lessons)", "piece2": {"en": "The rest of the corner, timed (tiers)", "uk": "Решта кутка, на час (рівні)"}, "steps": [{"text": {"en": "Start the clock (4 hours). In Krita, draw a top-down plan of the 30 x 30 m corner on a 2 m grid: the land, water on two sides, the quay turning the corner, the pier, the building, paving, a van stop and prop groups. Check: plan_day20.png shows every item in its place.", "uk": "Запусти таймер (4 години). У Krita намалюй план кутка 30 x 30 м згори на сітці 2 м: суша, вода з двох боків, набережна, що повертає за ріг, пірс, будівля, бруківка, зупинка фургона й групи пропсів. Перевірка: plan_day20.png показує кожен елемент на своєму місці."}, "lesson": 1}, {"text": {"en": "Big shapes first: extend the quay edge along both water sides with SM_QuayEdge_4m, turning the corner with SM_QuayCorner_Out, snapped to the grid. Check: the quay turns the corner with no gaps, and its top is level all along.", "uk": "Спершу великі форми: продовж край набережної вздовж обох боків води деталями SM_QuayEdge_4m, повертаючи за ріг через SM_QuayCorner_Out, з прив'язкою до сітки. Перевірка: набережна повертає за ріг без зазорів, а її верх рівний по всій довжині."}, "lesson": 1}, {"text": {"en": "Ground: scale the Land block (top at Z 0) to fill the land side of your plan, then lay a Plane from /Engine/BasicShapes over it at Z 1 (1 cm higher, so the two never flicker), with a child instance of MI_Paving and its Tiling worked out (metres divided by 2). Check: from 2 m, the stones look the right size beside the mannequin.", "uk": "Земля: масштабуй блок Land (верх на Z 0), щоб він заповнив бік суші на твоєму плані, потім поклади над ним Plane з /Engine/BasicShapes на Z 1 (на 1 см вище, щоб поверхні ніколи не мерехтіли) з дочірнім інстансом MI_Paving і обчисленим Tiling (метри, поділені на 2). Перевірка: з 2 м камені виглядають правильного розміру поруч із манекеном."}, "lesson": "D17.4"}, {"text": {"en": "The building: LI_HarbourHouse (or kit pieces), with SM_ShopFront_A facing the water, SM_Awning_A over it and MI_RoofTile on the roof. Check: the front faces the water and the awning touches the wall.", "uk": "Будівля: LI_HarbourHouse (або деталі набору), з SM_ShopFront_A лицем до води, SM_Awning_A над ним і MI_RoofTile на даху. Перевірка: фасад дивиться на воду, а маркіза торкається стіни."}, "lesson": 1}, {"text": {"en": "Steps and railings: steps down to the water at one spot, and railings wherever someone could fall. Check: the railing breaks at the steps and at the pier, and nowhere else.", "uk": "Сходи й поручні: сходи до води в одному місці й поручні скрізь, де хтось може впасти. Перевірка: поручні розриваються біля сходів і біля пірса, і більше ніде."}, "lesson": 2}, {"text": {"en": "Prop groups: bollards every 4 to 6 m along the edge, two benches facing the water each with a bin, lamp posts at a steady rhythm with one break. Check: from C2, props sit in groups by use, not sprinkled evenly.", "uk": "Групи пропсів: стовпчики кожні 4–6 м уздовж краю, дві лавки лицем до води, кожна з урною, ліхтарні стовпи в рівному ритмі з одним розривом. Перевірка: з C2 пропси стоять групами за призначенням, а не розсипані рівномірно."}, "lesson": 1}, {"text": {"en": "Story marks: algae and salt along every visible metre of quay wall, a puddle in a low spot, tyre tracks at the van stop. Check: you can name the cause of every mark.", "uk": "Сліди історії: водорості й сіль уздовж кожного видимого метра стінки набережної, калюжа в низині, сліди шин біля зупинки фургона. Перевірка: ти можеш назвати причину кожного сліду."}, "lesson": 2}, {"text": {"en": "Wear and colour pass: Wear on each piece by how exposed it is to sea and sun, tints from your palette. Check: one or two accents only, and everything else calm.", "uk": "Прохід зношеності й кольору: Wear на кожній деталі за тим, наскільки вона відкрита морю й сонцю, відтінки з твоєї палітри. Перевірка: лише один-два акценти, а все інше спокійне."}, "lesson": 2}, {"text": {"en": "Light check: the sun, fog and exposure still match light_recipe.md, and no new surface is too bright. Check: white walls keep their texture in C1 and C2.", "uk": "Перевірка світла: сонце, туман і експозиція досі відповідають light_recipe.md, і жодна нова поверхня не надто яскрава. Перевірка: білі стіни зберігають текстуру в C1 і C2."}, "lesson": "D19.3"}, {"text": {"en": "Cameras: unlock, retouch and lock C1 and C2 for the dressed scene, then take both shots with HighResShot 1920x1080. Check: two 1920 x 1080 PNGs are in your project's Saved/Screenshots/WindowsEditor folder.", "uk": "Камери: розблокуй, підправ і знову зафіксуй C1 і C2 для наповненої сцени, потім зроби обидва кадри через HighResShot 1920x1080. Перевірка: два PNG 1920 x 1080 лежать у папці Saved/Screenshots/WindowsEditor твого проєкту."}, "lesson": 3}, {"text": {"en": "Performance: look through C2, type stat unit and write the frame time in budget_day20.md. Check: the note shows the number and whether it is under 16.6 ms.", "uk": "Продуктивність: подивися крізь C2, введи stat unit і запиши час кадру в budget_day20.md. Перевірка: нотатка показує число і чи воно менше за 16,6 мс."}, "lesson": "D18.4"}, {"text": {"en": "Self-review: score both shots on the rubric, get the tutor's see-why-fix notes and make the top fix. Stop the clock and write your tier and time. Check: rubric_day20.md has your scores, the notes, your fix and your time.", "uk": "Самооцінка: оціни обидва кадри за рубрикою, отримай нотатки тьютора «бачу — чому — виправити» і зроби головне виправлення. Зупини таймер і запиши свій рівень і час. Перевірка: rubric_day20.md містить твої оцінки, нотатки, твоє виправлення й твій час."}, "lesson": 4}, {"text": {"en": "Before/after capture: Day 19's harbour_C2.png beside today's final C2 shot, as before_after_day20.png. Then a 60-second clip flying from C2 down to C1. Save today's clip as flythrough_day20.mp4 and check that you also have harbour_C1.png (each is described in today's hand-in list; take any you are missing now). Check: the clip shows the whole corner and ends on C1's view.", "uk": "Знімок «до/після»: harbour_C2.png з Дня 19 поруч із сьогоднішнім фінальним кадром C2, як before_after_day20.png. Потім 60-секундний кліп прольоту від C2 униз до C1. Збережи сьогоднішній кліп як flythrough_day20.mp4 і перевір, що в тебе також є harbour_C1.png (кожен описано в сьогоднішньому списку «Здати роботу»; зроби зараз ті, яких бракує). Перевірка: кліп показує весь куток і закінчується на ракурсі C1."}, "lesson": 3}], "boss": [{"en": "Bronze: inside 4 hours, the 30 x 30 m corner stands from your own kit and props, with materials on everything, paving, water, the light recipe and both camera shots; nothing floats.", "uk": "Бронза: за 4 години куток 30 x 30 м стоїть, зібраний з твого власного набору й пропсів, з матеріалами на всьому, бруківкою, водою, рецептом світла й обома кадрами з камер; ніщо не висить у повітрі."}, {"en": "Silver: it looks right: props in groups by use with a steady rhythm, decals only where their causes are, colours from your palette, and both shots composed with the subject on a third and a level horizon.", "uk": "Срібло: усе виглядає правильно: пропси групами за призначенням у рівному ритмі, декалі лише там, де їхні причини, кольори з твоєї палітри, і обидва кадри скомпоновано з об'єктом на третині й рівним горизонтом."}, {"en": "Gold: inside 3 hours 30, stat unit from C2 under 16.6 ms, and in the tutor's review C1 or C2 scores 8 of 10 or more.", "uk": "Золото: за 3 години 30 хвилин, stat unit з C2 менше 16,6 мс, і в рев'ю тьютора C1 або C2 отримує 8 з 10 або більше."}], "assets": ["island12/art-director-notes.md"]}, "lessons": [{"title": {"en": "Set dressing: big shapes first, then groups", "uk": "Наповнення сцени: спершу великі форми, потім групи"}, "minutes": 40, "goals": [{"en": "Explain set dressing (placing the things that make a space feel used) and its order: big shapes first (quay, building, ground), then medium (steps, railings, awnings), then small props last.", "uk": "Поясни, що таке наповнення сцени (set dressing: розстановка речей, які роблять простір обжитим) і його порядок: спершу великі форми (набережна, будівля, земля), потім середні (сходи, поручні, маркізи), а дрібні пропси — наостанок."}, {"en": "Group props by use (a bench with a bin and a lamp); never sprinkle them evenly.", "uk": "Групуй пропси за призначенням (лавка з урною й ліхтарем); ніколи не розсипай їх рівномірно."}, {"en": "Use rhythm with breaks: a steady spacing that one real exception interrupts.", "uk": "Використовуй ритм із розривами: рівний крок, який перериває один справжній виняток."}], "doalong": [{"en": "In Krita, draw the corner from above on a 2 m grid: the land, the water on two sides, the quay turning the corner, the building and the van stop. You see a simple plan.", "uk": "У Krita намалюй куток згори на сітці 2 м: суша, вода з двох боків, набережна, що повертає за ріг, будівля й зупинка фургона. Ти бачиш простий план."}, {"en": "In L_HarbourCorner, extend the quay edge 8 m along the front of the building with grid snapping on. You see one straight run of quay.", "uk": "У L_HarbourCorner продовж край набережної на 8 м уздовж фасаду будівлі з увімкненою прив'язкою до сітки. Ти бачиш один прямий відрізок набережної."}, {"en": "On that run, place two bollards on the edge, a bench facing the water and a bin beside the bench, as one group. You see a spot that says people sit here.", "uk": "На цьому відрізку постав два стовпчики на краю, лавку лицем до води й урну поруч із лавкою, однією групою. Ти бачиш місце, яке каже: тут сидять люди."}, {"en": "Add lamp posts every 8 m along the quay, then move one to make room for the steps. You see a rhythm with one real break.", "uk": "Додай ліхтарні стовпи кожні 8 м уздовж набережної, потім пересунь один, щоб звільнити місце для сходів. Ти бачиш ритм з одним справжнім розривом."}, {"en": "Look through C2 (right-click > Pilot). You see whether the props read as groups from the air.", "uk": "Подивися крізь C2 (правою кнопкою > Pilot). Ти бачиш, чи пропси читаються з повітря як групи."}], "play": {"en": "Speed dressing: I dress 12 m of quay in 8 minutes. The tutor judges the rhythm and clutter from my C2 screenshot.", "uk": "Швидке наповнення: я наповнюю 12 м набережної за 8 хвилин. Тьютор оцінює ритм і захаращеність з мого скриншота з C2."}, "video": {"url": "https://www.youtube.com/watch?v=YZ4gSKZh6do", "title": "How I Quickly Create 3D Environments in Unreal Engine 5 / FULL WORKFLOW", "channel": "pwnisher", "length": "22:30", "search": "unreal engine 5 set dressing environment"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Set dressing: big shapes first, then groups (Day 20, lesson 1 of 4).\nToday's build: A lit, dressed 30 x 30 m harbour corner, from your own kit.\n\nBy the end of this lesson I can:\n1. Explain set dressing (placing the things that make a space feel used) and its order: big shapes first (quay, building, ground), then medium (steps, railings, awnings), then small props last.\n2. Group props by use (a bench with a bin and a lamp); never sprinkle them evenly.\n3. Use rhythm with breaks: a steady spacing that one real exception interrupts.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (This week you took colour from real photos, made seamless textures and decals, and wrote a light recipe with two composed cameras.), what I will learn today (It is Boss day: you build a lit, dressed 30 x 30 m harbour corner from your own kit and props, seen from your two cameras.), encourage me (Aim for Bronze first, because it is always reachable; Silver and Gold are bonuses you earn at your own pace.), and share today's quote: \"So much depends upon a red wheel barrow glazed with rain water beside the white chickens.\" (William Carlos Williams).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 17: a ground plane 30 m across and a texture that covers 2 m: what Tiling do you set? | Day 14: which kit piece should have the highest Wear, and why?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Speed dressing: I dress 12 m of quay in 8 minutes. The tutor judges the rhythm and clutter from my C2 screenshot.\n6. Do-along on today's build (the stretch of quay in front of the building (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - In Krita, draw the corner from above on a 2 m grid: the land, the water on two sides, the quay turning the corner, the building and the van stop. You see a simple plan.\n   - In L_HarbourCorner, extend the quay edge 8 m along the front of the building with grid snapping on. You see one straight run of quay.\n   - On that run, place two bollards on the edge, a bench facing the water and a bin beside the bench, as one group. You see a spot that says people sit here.\n   - Add lamp posts every 8 m along the quay, then move one to make room for the steps. You see a rhythm with one real break.\n   - Look through C2 (right-click > Pilot). You see whether the props read as groups from the air.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"How I Quickly Create 3D Environments in Unreal Engine 5 / FULL WORKFLOW\" by pwnisher: https://www.youtube.com/watch?v=YZ4gSKZh6do\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Telling a story: cause, use and scale", "uk": "Розповідаємо історію: причина, призначення й масштаб"}, "minutes": 40, "goals": [{"en": "Make every mark and prop answer 'why is it here?': boats tie up at bollards, vans stop near the shop, people sit facing the view.", "uk": "Зроби так, щоб кожен слід і кожен пропс відповідав на питання «чому це тут?»: човни швартуються до стовпчиків, фургони зупиняються біля крамниці, люди сидять лицем до краєвиду."}, {"en": "Use scale cues (things everyone knows the size of: doors, steps, bollards, the mannequin) so a viewer feels the real size at once.", "uk": "Використовуй підказки масштабу (речі, розмір яких знає кожен: двері, сходи, стовпчики, манекен), щоб глядач одразу відчув справжній розмір."}, {"en": "Keep the story readable from the drone: a few clear signs of life beat many small ones.", "uk": "Тримай історію читабельною з дрона: кілька чітких ознак життя кращі за багато дрібних."}], "doalong": [{"en": "Write three story lines for your corner: who uses it and when (a fisher ties up at dawn, a van delivers to the shop, people sit in the evening). You see a short story in summary.md.", "uk": "Напиши три рядки історії для свого кутка: хто ним користується і коли (рибалка швартується на світанку, фургон привозить товар до крамниці, люди сидять увечері). Ти бачиш коротку історію у звіті дня (summary.md)."}, {"en": "Place one thing for each story line: a pair of bollards where a boat ties up, tyre tracks leading to the shop door, a bench facing the sunset. You see each story in the scene.", "uk": "Постав по одній речі для кожного рядка історії: пару стовпчиків там, де швартується човен, сліди шин до дверей крамниці, лавку лицем до заходу сонця. Ти бачиш кожну історію в сцені."}, {"en": "Stand the mannequin by the shop door and on the steps. You see whether the door, steps and bollards feel the right size.", "uk": "Постав манекен біля дверей крамниці й на сходах. Ти бачиш, чи двері, сходи й стовпчики правильного розміру."}, {"en": "From C2, write what you see first, second and third. You see whether your story reads from the air.", "uk": "З C2 запиши, що бачиш першим, другим і третім. Ти бачиш, чи читається твоя історія з повітря."}, {"en": "Remove one thing that tells no story. You see a calmer scene.", "uk": "Прибери одну річ, яка не розповідає жодної історії. Ти бачиш спокійнішу сцену."}], "play": {"en": "Story detective: I send a C2 screenshot without telling my story. The tutor guesses who uses the corner and when. If it matches my three lines, I score.", "uk": "Детектив історій: я надсилаю скриншот з C2, не розповідаючи своєї історії. Тьютор вгадує, хто користується кутком і коли. Якщо це збігається з моїми трьома рядками, бал мені."}, "video": {"url": "https://www.youtube.com/watch?v=10cbOga7V_M", "title": "Landmarks 🇬🇧 [~LEVEL DESIGN #21]", "channel": "Mina Pêcheux", "length": "5:32", "search": "level design landmarks sightlines"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Telling a story: cause, use and scale (Day 20, lesson 2 of 4).\nToday's build: A lit, dressed 30 x 30 m harbour corner, from your own kit.\nEarlier today I already did: lesson 1 (Set dressing: big shapes first, then groups). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Make every mark and prop answer 'why is it here?': boats tie up at bollards, vans stop near the shop, people sit facing the view.\n2. Use scale cues (things everyone knows the size of: doors, steps, bollards, the mannequin) so a viewer feels the real size at once.\n3. Keep the story readable from the drone: a few clear signs of life beat many small ones.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Story detective: I send a C2 screenshot without telling my story. The tutor guesses who uses the corner and when. If it matches my three lines, I score.\n4. Do-along on today's build (the stretch of quay in front of the building (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Write three story lines for your corner: who uses it and when (a fisher ties up at dawn, a van delivers to the shop, people sit in the evening). You see a short story in summary.md.\n   - Place one thing for each story line: a pair of bollards where a boat ties up, tyre tracks leading to the shop door, a bench facing the sunset. You see each story in the scene.\n   - Stand the mannequin by the shop door and on the steps. You see whether the door, steps and bollards feel the right size.\n   - From C2, write what you see first, second and third. You see whether your story reads from the air.\n   - Remove one thing that tells no story. You see a calmer scene.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Landmarks 🇬🇧 [~LEVEL DESIGN #21]\" by Mina Pêcheux: https://www.youtube.com/watch?v=10cbOga7V_M\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "The hero shots: composition and presentation", "uk": "Головні кадри: композиція й подача"}, "minutes": 40, "goals": [{"en": "Recompose C1 and C2 after dressing: subject on a third, a clear foreground, the eye led by lines and contrast.", "uk": "Перекомпонуй C1 і C2 після наповнення: об'єкт на третині, чіткий передній план, погляд ведуть лінії й контраст."}, {"en": "Take clean 1920 x 1080 shots with the console command HighResShot 1920x1080.", "uk": "Зроби чисті кадри 1920 x 1080 консольною командою HighResShot 1920x1080."}, {"en": "Make a before-and-after pair that a viewer understands in 3 seconds.", "uk": "Зроби пару «до і після», яку глядач зрозуміє за 3 секунди."}], "doalong": [{"en": "Right-click C1 > Transform > Lock Actor Movement to unlock it, then Pilot it. Move until a prop group is in the near foreground and the shop front sits on a third. Lock it again. You see three layers: near, middle and far.", "uk": "Клацни правою кнопкою C1 > Transform > Lock Actor Movement, щоб розблокувати її, потім Pilot. Пересувайся, доки група пропсів не опиниться на близькому передньому плані, а фасад крамниці — на третині. Знову зафіксуй. Ти бачиш три шари: близький, середній і дальній."}, {"en": "Find the brightest spot in the frame: it should be on or near your subject. You see where the eye goes first.", "uk": "Знайди найяскравіше місце в кадрі: воно має бути на об'єкті зйомки чи поруч із ним. Ти бачиш, куди погляд іде першим."}, {"en": "While piloting C1, press G (Game View hides editor icons), open the console (` key) and type HighResShot 1920x1080, then Enter. You see a message with the file's path.", "uk": "Керуючи C1, натисни G (Game View ховає іконки редактора), відкрий консоль (клавіша `) і введи HighResShot 1920x1080, потім Enter. Ти бачиш повідомлення зі шляхом до файлу."}, {"en": "Open your project folder in Explorer and go to Saved/Screenshots/WindowsEditor. You see a clean 1920 x 1080 picture with no editor icons.", "uk": "Відкрий папку проєкту в Explorer і перейди в Saved/Screenshots/WindowsEditor. Ти бачиш чисту картинку 1920 x 1080 без іконок редактора."}, {"en": "In Krita, put Day 19's harbour_C2.png and the new C2 side by side at the same size. You see your progress in one picture.", "uk": "У Krita постав harbour_C2.png з Дня 19 і новий C2 поруч в однаковому розмірі. Ти бачиш свій поступ на одній картинці."}], "play": {"en": "Three-second test: I send a shot. The tutor says what it saw first in 3 seconds. If it names my subject, I score.", "uk": "Тест трьох секунд: я надсилаю кадр. Тьютор каже, що побачив першим за 3 секунди. Якщо він називає мій об'єкт зйомки, бал мені."}, "video": {"url": "https://www.youtube.com/watch?v=KyecOinBgMo", "title": "How I Find Camera Compositions in Unreal Engine 5", "channel": "Ted Mebratu", "length": "16:51", "search": "unreal engine 5 camera composition"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait lder in Explorer and go to Saved/Screenshots/WindowsEditor. You see a clean 1920 x 1080 picture with no editor icons.\n   - In Krita, put Day 19's harbour_C2.png and the new C2 side by side at the same size. You see your progress in one picture.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"How I Find Camera Compositions in Unreal Engine 5\" by Ted Mebratu: https://www.youtube.com/watch?v=KyecOinBgMo\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Self-review: the art director's eye", "uk": "Самооцінка: погляд арт-директора"}, "minutes": 40, "goals": [{"en": "Review with one rubric: scale, composition, colour and value, light, story and wear, each scored 0 to 2.", "uk": "Оцінюй за однією рубрикою: масштаб, композиція, колір і тон, світло, історія й зношеність, кожен рядок від 0 до 2."}, {"en": "Write see-why-fix notes on your own shots, then compare them with the tutor's.", "uk": "Напиши нотатки «бачу — чому — виправити» до власних кадрів, потім порівняй їх із нотатками тьютора."}, {"en": "Choose the one fix that lifts the score most, and do only that: good enough ships.", "uk": "Вибери одне виправлення, яке найбільше підніме оцінку, і зроби лише його: достатньо добре — значить, готово."}], "doalong": [{"en  with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Self-review: the art director's eye (Day 20, lesson 4 of 4).\nToday's build: A lit, dressed 30 x 30 m harbour corner, from your own kit.\nEarlier today I already did: lesson 1 (Set dressing: big shapes first, then groups); lesson 2 (Telling a story: cause, use and scale); lesson 3 (The hero shots: composition and presentation). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Review with one rubric: scale, composition, colour and value, light, story and wear, each scored 0 to 2.\n2. Write see-why-fix notes on your own shots, then compare them with the tutor's.\n3. Choose the one fix that lifts the score most, and do only that: good enough ships.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Role swap: the tutor describes a harbour corner of its own with planted faults. I give three see-why-fix notes. It scores each note for being specific and kind.\n4. Do-along on today's build (the stretch of quay in front of the building (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Write rubric_day20.md with five lines (scale, composition, colour and value, light, story and wear), each 0 to 2. You see a table to fill.\n ix notes, your fix, your tier and time)", "uk": "rubric_day20.md (твої оцінки, нотатки тьютора «бачу — чому — виправити», твоє виправлення, твій рівень і час)"}, {"en": "flythrough_day20.mp4 (60 seconds, from C2 down to C1)", "uk": "flythrough_day20.mp4 (60 секунд, від C2 униз до C1)"}, {"en": "summary.md (with your three story lines)", "uk": "звіт дня (summary.md) з твоїми трьома рядками історії"}], "goal": {"en": "By the end of today you have a 30 x 30 m harbour corner built from your own kit and props, dressed, lit by your recipe and shown from your two cameras.", "uk": "Наприкінці сьогоднішнього дня в тебе є куток гавані 30 x 30 м, зібраний з твого власного набору й пропсів, наповнений, освітлений за твоїм рецептом і показаний з двох твоїх камер."}, "uses": [{"en": "Days 7 to 10: your harbour kit (with SM_QuayCorner_Out) and LI_HarbourHouse; Days 1 to 5: your four street props", "uk": "Дні 7–10: твій портовий набір (з SM_QuayCorner_Out) і LI_HarbourHouse; Дні 1–5: твої чотири вуличні пропси"}, {"en": "Days 12 to 18: M_Master instances, T_Trim_Harbour, SM_ShopFront_A, the Wear slider, your palette, MI_Paving, MI_RoofTile, SM_Awning_A and your decal set", "uk": "Дні 12–18: інстанси M_Master, T_Trim_Harbour, SM_ShopFront_A, повзунок Wear, твоя палітра, MI_Paving, MI_RoofTile, SM_Awning_A і твій набір декалей"}, {"en": "Day 19: L_HarbourCorner, light_recipe.md, and the cameras C1 and C2", "uk": "День 19: L_HarbourCorner, light_recipe.md і камери C1 та C2"}], "quiz": [{"q": {"en": "Your sampled stone colour is #FFFFFF, taken from the sunniest spot of a photo. What do you do?", "uk": "Взятий колір каменю — #FFFFFF, з найсонячнішого місця фото. Що ти робиш?"}, "options": [{"en": "Keep it: stone can be pure white", "uk": "Залишаю: камінь може бути чисто білим"}, {"en": "Sample a mid-tone on the lit side of a blurred copy instead", "uk": "Беру натомість середній тон з освітленого боку розмитої копії"}, {"en": "Make it pure black to balance it", "uk": "Роблю його чисто чорним для рівноваги"}], "answer": 1, "explain": {"en": "Pure white means a burned-out highlight. Base colours come from evenly lit mid-tones (Day 16).", "uk": "Чисто білий означає засвічений відблиск. Базові кольори беруть з рівномірно освітлених середніх тонів (День 16)."}}, {"q": {"en": "Why keep base colours between about 50 and 240 in each of red, green and blue?", "uk": "Навіщо тримати базові кольори приблизно між 50 і 240 для кожного з червоного, зеленого й синього?"}, "options": [{"en": "Real surfaces are never pure black or pure white, and the light adds brightness on top", "uk": "Справжні поверхні ніколи не бувають чисто чорними чи чисто білими, а світло додає яскравості зверху"}, {"en": "Unreal can't show other values", "uk": "Unreal не може показати інші значення"}, {"en": "It makes textures smaller on disk", "uk": "Це зменшує розмір текстур на диску"}, {"en": "It removes the need for a palette", "uk": "Тоді палітра не потрібна"}], "answer": 0, "explain": {"en": "Real materials reflect some light but never all of it. Values in range look real under any light (Day 16).", "uk": "Справжні матеріали відбивають частину світла, але ніколи не все. Значення в діапазоні виглядають справжніми за будь-якого світла (День 16)."}}, {"q": {"en": "From the drone, your paving shows the same dark stone every 2 m. What is the fault and the fix?", "uk": "З дрона на твоїй бруківці кожні 2 м видно той самий темний камінь. Яка це вада і як її виправити?"}, "options": [{"en": "A gradient: use Levels", "uk": "Градієнт: використати Levels"}, {"en": "A seam: use Offset Image", "uk": "Шов: використати Offset Image"}, {"en": "A blotch: clone ordinary stones over it", "uk": "Пляма: затерти її клоном звичайних каменів"}, {"en": "A wrong size: change Tiling", "uk": "Неправильний розмір: змінити Tiling"}], "answer": 2, "explain": {"en": "One spot that repeats on every tile is a blotch. Clone it away so the repeat is hard to find (Day 17).", "uk": "Місце, що повторюється на кожному тайлі, — це пляма. Затри її клоном, щоб повтор було важко знайти (День 17)."}}, {"q": {"en": "A ground plane from /Engine/BasicShapes is scaled to 30 (30 m), and your texture covers 2 m. What Tiling do you set?", "uk": "Площину землі з /Engine/BasicShapes масштабовано до 30 (30 м), а твоя текстура покриває 2 м. Який Tiling ти ставиш?"}, "options": [{"en": "30", "uk": "30"}, {"en": "2", "uk": "2"}, {"en": "60", "uk": "60"}, {"en": "15", "uk": "15"}], "answer": 3, "explain": {"en": "Tiling is metres covered divided by metres per texture: 30 divided by 2 is 15 (Day 17).", "uk": "Tiling — це покриті метри, поділені на метри однієї текстури: 30 поділити на 2 — це 15 (День 17)."}}, {"q": {"en": "Your tyre tracks run straight across the bench area. What is wrong?", "uk": "Твої сліди шин ідуть прямо через зону з лавками. Що не так?"}, "options": [{"en": "Nothing: tracks can go anywhere", "uk": "Усе гаразд: сліди можуть бути будь-де"}, {"en": "They have no cause: vans drive to where they unload, not through seating", "uk": "Вони не мають причини: фургони їдуть туди, де розвантажуються, а не через місця для сидіння"}, {"en": "They need a higher Sort Order", "uk": "Їм потрібен вищий Sort Order"}], "answer": 1, "explain": {"en": "Every mark needs a cause the viewer can believe. Put tracks where a van drives in, turns and stops (Day 18).", "uk": "Кожен слід потребує причини, у яку глядач повірить. Став сліди там, де фургон заїжджає, розвертається й зупиняється (День 18)."}}, {"q": {"en": "What makes a puddle decal reflect the sky?", "uk": "Що змушує декаль калюжі відбивати небо?"}, "options": [{"en": "A low Roughness, about 0.05 to 0.1", "uk": "Низький Roughness, приблизно від 0.05 до 0.1"}, {"en": "Metallic 1", "uk": "Metallic 1"}, {"en": "A bright blue colour", "uk": "Яскраво-синій колір"}, {"en": "A high Sort Order", "uk": "Високий Sort Order"}], "answer": 0, "explain": {"en": "Water is very smooth, so it mirrors the sky. Low Roughness gives that shine (Day 18).", "uk": "Вода дуже гладка, тож віддзеркалює небо. Низький Roughness дає цей блиск (День 18)."}}, {"q": {"en": "Your C1 and C2 shots look a little different in brightness every time you take them. What is missing?", "uk": "Твої кадри C1 і C2 щоразу трохи відрізняються яскравістю. Чого бракує?"}, "options": [{"en": "More fog", "uk": "Більше туману"}, {"en": "A second sun", "uk": "Другого сонця"}, {"en": "A locked exposure: Post Process Volume with Infinite Extent and Min EV100 = Max EV100", "uk": "Зафіксованої експозиції: Post Process Volume з Infinite Extent і Min EV100 = Max EV100"}, {"en": "A shorter focal length", "uk": "Коротшої фокусної відстані"}], "answer": 2, "explain": {"en": "Auto exposure changes with what the camera sees. Lock it and your shots repeat (Day 19).", "uk": "Автоекспозиція змінюється залежно від того, що бачить камера. Зафіксуй її, і кадри повторюватимуться (День 19)."}}, {"q": {"en": "Why dress big shapes first and small props last?", "uk": "Чому спершу розставляють великі форми, а дрібні пропси — наостанок?"}, "options": [{"en": "Small props are harder to find in the Content Browser", "uk": "Дрібні пропси важче знайти в Content Browser"}, {"en": "Big shapes decide the layout, scale and composition; small props are quick to move once those are right", "uk": "Великі форми визначають планування, масштаб і композицію; дрібні пропси швидко пересунути, коли великі вже на місці"}, {"en": "Unreal loads big meshes first", "uk": "Unreal спершу завантажує великі сітки"}, {"en": "Small props need no materials", "uk": "Дрібним пропсам не потрібні матеріали"}], "answer": 1, "explain": {"en": "If the quay or the building moves later, every small prop must move too. Settle the big shapes first (Day 20).", "uk": "Якщо пізніше зрушиться набережна чи будівля, доведеться пересувати й кожен дрібний пропс. Спершу визначся з великими формами (День 20)."}}], "weekInfo": {"week": 4, "title": {"en": "The Unreal look", "uk": "Вигляд в Unreal"}, "goal": {"en": "By Friday you have a lit, dressed 30 x 30 m harbour corner built from your own kit, with colours from real photos, seamless textures, decals, a written light recipe and two composed camera shots.", "uk": "До п'ятниці в тебе є освітлений і наповнений куток гавані 30 x 30 м, зібраний з твого власного набору: кольори зі справжніх фото, безшовні текстури, декалі, записаний рецепт світла й два скомпоновані кадри з камери."}, "skills": [{"en": "Colour palettes sampled from real photographs for consistent art direction", "uk": "Кольорові палітри, взяті зі справжніх фотографій, для цілісного художнього стилю"}, {"en": "Seamless tiling texture creation at real-world scale", "uk": "Створення безшовних тайлових текстур у реальному масштабі"}, {"en": "Decal-based weathering and environmental storytelling in Unreal Engine 5", "uk": "Зношеність за допомогою декалей і розповідь через оточення (environmental storytelling) в Unreal Engine 5"}, {"en": "Lumen lighting, atmosphere and post-process exposure for outdoor scenes", "uk": "Освітлення Lumen, атмосфера й експозиція post-process для сцен просто неба"}, {"en": "Shot composition with Cine Camera Actors", "uk": "Композиція кадру з Cine Camera Actor"}]}, "morning": {"sofar": {"en": "This week you took colour from real photos, made seamless textures and decals, and wrote a light recipe with two composed cameras.", "uk": "Цього тижня в тебе з'явилися кольори зі справжніх фото, безшовні текстури й декалі, а ще записаний рецепт світла і дві скомпоновані камери."}, "today": {"en": "It is Boss day: you build a lit, dressed 30 x 30 m harbour corner from your own kit and props, seen from your two cameras.", "uk": "Сьогодні День боса: ти будуєш освітлений, наповнений деталями портовий куточок 30 x 30 м із власного набору й пропсів, який видно з твоїх двох камер."}, "cheer": {"en": "Aim for Bronze first, because it is always reachable; Silver and Gold are bonuses you earn at your own pace.", "uk": "Спершу цілься в Бронзу, бо вона завжди досяжна; Срібло й Золото — бонуси, які ти здобуваєш у своєму темпі."}, "quote": {"text": {"en": "So much depends upon a red wheel barrow glazed with rain water beside the white chickens.", "uk": "Так багато залежить від червоної тачки, що блищить від дощової води, біля білих курчат."}, "author": {"en": "William Carlos Williams", "uk": "Вільям Карлос Вільямс"}, "source": "https://en.wikiquote.org/wiki/William_Carlos_Williams"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-20-boss-harbour-corner", "mapHref": "../../COURSE.html", "prevHref": "../Day-19-light-atmosphere-cameras/START-HERE.html", "nextHref": "../Day-21-real-place-references/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8 and Krita. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me and don't write code. Keep me moving and make it feel like a game.\n\nToday I build on my own: The rest of the corner, timed (tiers).\nIt's part of: A lit, dressed 30 x 30 m harbour corner, from your own kit (L_HarbourCorner (Course/Day19), around the kit you placed yesterday.).\n\nSpec:\n- A 30 x 30 m area: a quay edge along two sides of the land, turning the corner with SM_QuayCorner_Out, so there is water on two sides; the pier, the harbour building with SM_ShopFront_A and an awning, steps down to the water, and railings.\n- Ground: MI_Paving on the land side with the right Tiling; roofs in MI_RoofTile.\n- Props by use: bollards along the quay edge, benches facing the water, lamp posts at a steady rhythm with one real break, a bin by each bench.\n- Decals by cause: algae and salt at the waterline, one or two puddles, tyre tracks at a van stop.\n- Wear set by how exposed each piece is to sea and sun, colours from your palette; nothing grey, floating or sunk too deep.\n- Lit by light_recipe.md; C1 and C2 composed (subject on a third, horizon level) and shot at 1920 x 1080.\n- Performance: stat unit from C2 written down (aim under 16.6 ms on your PC).\n\nMy checklist:\n1. Start the clock (4 hours). In Krita, draw a top-down plan of the 30 x 30 m corner on a 2 m grid: the land, water on two sides, the quay turning the corner, the pier, the building, paving, a van stop and prop groups. Check: plan_day20.png shows every item in its place. (from lesson 1)\n2. Big shapes first: extend the quay edge along both water sides with SM_QuayEdge_4m, turning the corner with SM_QuayCorner_Out, snapped to the grid. Check: the quay turns the corner with no gaps, and its top is level all along. (from lesson 1)\n3. Ground: scale the Land block (top at Z 0) to fill the land side of your plan, then lay a Plane from /Engine/BasicShapes over it at Z 1 (1 cm higher, so the two never flicker), with a child instance of MI_Paving and its Tiling worked out (metres divided by 2). Check: from 2 m, the stones look the right size beside the mannequin. (from day 17, lesson 4)\n4. The building: LI_HarbourHouse (or kit pieces), with SM_ShopFront_A facing the water, SM_Awning_A over it and MI_RoofTile on the roof. Check: the front faces the water and the awning touches the wall. (from lesson 1)\n5. Steps and railings: steps down to the water at one spot, and railings wherever someone could fall. Check: the railing breaks at the steps and at the pier, and nowhere else. (from lesson 2)\n6. Prop groups: bollards every 4 to 6 m along the edge, two benches facing the water each with a bin, lamp posts at a steady rhythm with one break. Check: from C2, props sit in groups by use, not sprinkled evenly. (from lesson 1)\n7. Story marks: algae and salt along every visible metre of quay wall, a puddle in a low spot, tyre tracks at the van stop. Check: you can name the cause of every mark. (from lesson 2)\n8. Wear and colour pass: Wear on each piece by how exposed it is to sea and sun, tints from your palette. Check: one or two accents only, and everything else calm. (from lesson 2)\n9. Light check: the sun, fog and exposure still match light_recipe.md, and no new surface is too bright. Check: white walls keep their texture in C1 and C2. (from day 19, lesson 3)\n10. Cameras: unlock, retouch and lock C1 and C2 for the dressed scene, then take both shots with HighResShot 1920x1080. Check: two 1920 x 1080 PNGs are in your project's Saved/Screenshots/WindowsEditor folder. (from lesson 3)\n11. Performance: look through C2, type stat unit and write the frame time in budget_day20.md. Check: the note shows the number and whether it is under 16.6 ms. (from day 18, lesson 4)\n12. Self-review: score both shots on the rubric, get the tutor's see-why-fix notes and make the top fix. Stop the clock and write your tier and time. Check: rubric_day20.md has your scores, the notes, your fix and your time. (from lesson 4)\n13. Before/after capture: Day 19's harbour_C2.png beside today's final C2 shot, as before_after_day20.png. Then a 60-second clip flying from C2 down to C1. Save today's clip as flythrough_day20.mp4 and check that you also have harbour_C1.png (each is described in today's hand-in list; take any you are missing now). Check: the clip shows the whole corner and ends on C1's view. (from lesson 3)\n\nToday is a BOSS build: help me keep time against the tiers below. Tiers:\n- Bronze: inside 4 hours, the 30 x 30 m corner stands from your own kit and props, with materials on everything, paving, water, the light recipe and both camera shots; nothing floats.\n- Silver: it looks right: props in groups by use with a steady rhythm, decals only where their causes are, colours from your palette, and both shots composed with the subject on a third and a level horizon.\n- Gold: inside 3 hours 30, stat unit from C2 under 16.6 ms, and in the tutor's review C1 or C2 scores 8 of 10 or more.\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me and tell me which tier I reached.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Denis\nDay 20: Boss: a lit, dressed 30 x 30 m harbour corner from your own kit. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; boss tier: <bronze / silver / gold / none>; quiz: <score> of 8\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p><div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+list(D.handin,'ul','ticks')+'<p class="path">'+ic('folder')+'<span>'+u('shipTo')+' <code>'+esc(D.workPath)+'</code></span></p>'+(D.lessons.length?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<p class="muted">'+u('report')+'</p><div class="row"><button class="btn s" onclick="cp(D.reportPrompt)">'+ic('copy')+u('copyR')+'</button></div></section>';
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();

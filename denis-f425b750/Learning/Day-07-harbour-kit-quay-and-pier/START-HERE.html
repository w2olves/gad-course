<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 7</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

<script id="data" type="application/json">{"learner": "ib-denis-f425b750", "learnerName": {"en": "Denis", "uk": "Денис"}, "day": 7, "week": 2, "total": 60, "title": {"en": "Kit design: a metric grid, a pivot rule and your first harbour pieces", "uk": "Дизайн набору: метрична сітка, правило півота і твої перші деталі гавані"}, "theme": {"en": "Week 2: Modular kits", "uk": "Тиждень 2: Модульні набори"}, "build": {"item": {"en": "Your harbour kit, part 1: SM_QuayEdge_4m (a stone quay edge) and SM_PierDeck_4m (a timber pier deck)", "uk": "Твій набір для гавані, частина 1: SM_QuayEdge_4m (кам'яний край причалу) і SM_PierDeck_4m (дерев'яний настил пірса)"}, "why": {"en": "A modular kit is a small set of pieces that snap together to build big places, like building blocks. Studios build cities and harbours this way, because ten good pieces can make a kilometre of waterfront with no visible joins. The rules matter more than the models: every piece is a whole number of metres, and every piece has its pivot in the same place. Your kit builds the harbour of your island on Days 42 and 48.", "uk": "Модульний набір — це кілька деталей, які з'єднуються між собою, щоб будувати великі місця, як кубики конструктора. Так студії будують міста й гавані, бо десять добрих деталей можуть скласти кілометр набережної без помітних стиків. Правила важать більше за моделі: кожна деталь має ціле число метрів, і в кожної деталі півот в одному й тому самому місці. Твій набір збудує гавань твого острова в Дні 42 і 48."}, "where": {"en": "Your island's waterfront (district 1): the quay along the harbour and a pier going out over the water. Today the pieces meet in Course/Day07.", "uk": "Набережна твого острова (район 1): причал уздовж гавані та пірс, що виходить над водою. Сьогодні деталі зустрічаються в Course/Day07."}, "spec": [{"en": "kit_rules.md: the piece list, the grid (1 m; main pieces 4 m), the pivot rule, the water-side rule, and 'every piece is exported from the world origin'.", "uk": "kit_rules.md: список деталей, сітка (1 м; основні деталі — 4 м), правило півота, правило боку води і правило «кожна деталь експортується з центру світу»."}, {"en": "SM_QuayEdge_4m: 4 m long (X) and 2 m deep (Y), the deck top at Z = 0 and the wall going 3 m down; a stone coping (the row of big stones along the top of the water edge) 0.45 m wide, standing 0.1 m above the deck and overhanging the wall by 5 cm.", "uk": "SM_QuayEdge_4m: 4 м завдовжки (X) і 2 м завглибшки (Y), верхня поверхня на Z = 0, а стіна йде на 3 м донизу; кам'яна бровка (ряд великих каменів уздовж верхнього краю над водою) 0.45 м завширшки, що піднімається на 0.1 м над поверхнею причалу і нависає над стіною на 5 см."}, {"en": "SM_PierDeck_4m: a 4 x 4 m timber deck with its top at Z = 0: 20 planks 0.18 m wide with 2 cm gaps (Array), three beams underneath, and four piles (round posts that stand in the water), one near each corner.", "uk": "SM_PierDeck_4m: дерев'яний настил 4 x 4 м із верхом на Z = 0: 20 дощок по 0.18 м завширшки з проміжками 2 см (Array), три балки знизу і чотири палі (круглі стовпи, що стоять у воді), по одній біля кожного кута."}, {"en": "Pivot rule: the top corner at the start of the piece on the land side (X = 0, Y = 0, Z = 0). The piece runs along +X and the water side faces -Y (towards you in Blender's front view).", "uk": "Правило півота: верхній кут на початку деталі з боку суходолу (X = 0, Y = 0, Z = 0). Деталь іде вздовж +X, а бік води дивиться в -Y (до тебе на виді спереду в Blender)."}, {"en": "Triangles under 2,000 per piece; plain materials M_Stone and M_Timber; UCX boxes on each piece.", "uk": "Менше 2 000 трикутників на деталь; прості матеріали M_Stone і M_Timber; блоки UCX на кожній деталі."}, {"en": "SM_QuayEdge_4m.fbx and SM_PierDeck_4m.fbx; in Unreal (Course/Day07, level L_Day07), four quay pieces in a 16 m run and three pier decks going out from it, all snapped with no gaps.", "uk": "SM_QuayEdge_4m.fbx і SM_PierDeck_4m.fbx; в Unreal (Course/Day07, рівень L_Day07) чотири деталі причалу в ряд на 16 м і три настили пірса, що виходять від нього, усі з'єднані без щілин."}], "piece1": "SM_QuayEdge_4m (in the lessons)", "piece2": {"en": "SM_PierDeck_4m, on your own", "uk": "SM_PierDeck_4m, самостійно"}, "steps": [{"text": {"en": "Look at your harbour photos again and write the pier sizes in kit_rules.md: plank width, beam size, pile thickness. Check: three sizes written, each close to the ones in the spec.", "uk": "Ще раз подивися на свої фото гаваней і запиши розміри пірса в kit_rules.md: ширину дошки, розмір балки, товщину палі. Перевірка: записано три розміри, кожен близький до вказаних у вимогах."}, "lesson": 1}, {"text": {"en": "In quaykit_day7.blend, hide SM_QuayEdge_4m (the eye icon in the Outliner). One plank: a cube 0.18 x 4 x 0.05 m, scale applied, at X 0.1, Y -2, Z -0.025. Check: one plank lies across the deck area with its top on Z = 0.", "uk": "У quaykit_day7.blend сховай SM_QuayEdge_4m (значок ока в Outliner). Одна дошка: куб 0.18 x 4 x 0.05 м, масштаб застосовано, на X 0.1, Y -2, Z -0.025. Перевірка: одна дошка лежить упоперек ділянки настилу, а її верх на Z = 0."}, "lesson": "D1.3"}, {"text": {"en": "Add an Array to the plank: Count 20, Relative Offset off, Constant Offset Distance X 0.2 m. Check: 20 planks cover X 0 to 4 m with even gaps.", "uk": "Додай до дошки Array: Count 20, Relative Offset вимкнено, Constant Offset Distance X 0.2 м. Перевірка: 20 дощок покривають X від 0 до 4 м із рівними проміжками."}, "lesson": "D3.1"}, {"text": {"en": "Beams: three cubes 4 x 0.2 x 0.3 m running along X under the planks, at Y -0.3, -2 and -3.7, Z -0.2. Check: from the side (Numpad 3) the beams sit right under the planks with no gap.", "uk": "Балки: три куби 4 x 0.2 x 0.3 м уздовж X під дошками, на Y -0.3, -2 і -3.7, Z -0.2. Перевірка: збоку (Numpad 3) балки лежать просто під дошками без щілини."}, "lesson": "D1.3"}, {"text": {"en": "Piles: a cylinder (Vertices 12, Radius 0.15 m, Depth 4 m) at X 0.2, Y -0.3, Z -2.05; copy it with Shift+D to X 0.2, Y -3.7, then to X 3.8 at both Y values. Check: four piles go down from the beams, one near each corner.", "uk": "Палі: циліндр (Vertices 12, Radius 0.15 м, Depth 4 м) на X 0.2, Y -0.3, Z -2.05; скопіюй його через Shift+D на X 0.2, Y -3.7, а тоді на X 3.8 з обома значеннями Y. Перевірка: чотири палі йдуть донизу від балок, по одній біля кожного кута."}, "lesson": "D1.1"}, {"text": {"en": "Apply the Array, select every deck part (planks, beams and piles) and press Ctrl+J, name the object SM_PierDeck_4m and put its origin on the pivot: Shift+S > Cursor to World Origin, Origin to 3D Cursor. Check: the orange dot sits on the corner at X 0, Y 0, Z 0, and Location reads 0, 0, 0.", "uk": "Застосуй Array, виділи всі частини настилу (дошки, балки й палі) і натисни Ctrl+J, назви об'єкт SM_PierDeck_4m і постав його origin на півот: Shift+S > Cursor to World Origin, Origin to 3D Cursor. Перевірка: помаранчева точка стоїть на куті X 0, Y 0, Z 0, а Location показує 0, 0, 0."}, "lesson": 2}, {"text": {"en": "Material: M_Timber (a grey-brown from your photos, Roughness 0.85, Metallic 0) on the whole deck. Check: in Material Preview the deck looks like weathered timber, not plastic.", "uk": "Матеріал: M_Timber (сіро-коричневий за твоїми фото, Roughness 0.85, Metallic 0) на весь настил. Перевірка: у Material Preview настил схожий на вивітрене дерево, а не на пластик."}, "lesson": "D5.2"}, {"text": {"en": "Collision: one box for the deck and beams (Dimensions 4 x 4 x 0.35 m at X 2, Y -2, Z -0.175) and one box per pile, named UCX_SM_PierDeck_4m_00 to _04, with the deck's origin. Check: five boxes, every name starting with UCX_SM_PierDeck_4m_.", "uk": "Колізія: один блок на настил і балки (Dimensions 4 x 4 x 0.35 м на X 2, Y -2, Z -0.175) і по одному блоку на кожну палю, з назвами від UCX_SM_PierDeck_4m_00 до _04, з origin настилу. Перевірка: п'ять блоків, і кожна назва починається з UCX_SM_PierDeck_4m_."}, "lesson": "D4.3"}, {"text": {"en": "Read Triangles (under 2,000). Then test the grid: with snapping on, Shift+D the deck and move the copy exactly 4 m along X. Look at the join from close up, then delete the copy. Check: the two decks meet with the same 2 cm gap as between the planks, and no plank overlaps.", "uk": "Прочитай Triangles (менше 2 000). Тоді перевір сітку: з увімкненою прив'язкою зроби Shift+D настилу й посунь копію рівно на 4 м уздовж X. Роздивися стик зблизька, а тоді видали копію. Перевірка: два настили сходяться з тим самим проміжком 2 см, що й між дошками, і жодна дошка не накладається."}, "lesson": 2}, {"text": {"en": "Export SM_PierDeck_4m.fbx (deck and UCX boxes selected) with the Day 4 settings. Check: the file is in today's Work folder.", "uk": "Експортуй SM_PierDeck_4m.fbx (виділено настил і блоки UCX) з налаштуваннями з Дня 4. Перевірка: файл лежить у сьогоднішній папці Work."}, "lesson": "D4.4"}, {"text": {"en": "Import it into Course/Day07 and place three decks going out from the middle of your quay run: turn the first with Rotation Z 90 or -90 so it points away from the land, join it to the quay's water edge with vertex snap, then copy it twice, 400 cm each. Check: a 12 m pier goes straight out from the quay.", "uk": "Імпортуй його в Course/Day07 і постав три настили, що виходять із середини твого ряду причалу: поверни перший через Rotation Z 90 або -90, щоб він дивився від суходолу, приєднай його до краю причалу над водою через прив'язку до вершин (vertex snap), а тоді скопіюй його двічі, по 400 см. Перевірка: пірс завдовжки 12 м іде прямо від причалу."}, "lesson": 4}, {"text": {"en": "Fly along the pier at 1 m and at 10 m high. Check: the deck tops line up with the quay's deck height, and there are no gaps or flickering surfaces at any join.", "uk": "Пролети вздовж пірса на висоті 1 м і 10 м. Перевірка: верх настилів на одному рівні з поверхнею причалу, і на жодному стику немає щілин чи мерехтливих поверхонь."}, "lesson": 4}, {"text": {"en": "Captures: before_after_day7.png (both pieces side by side in Blender, and the quay with its pier in Unreal) and a 60-second clip flying low along the quay and out along the pier. Save today's clip as clip_day7.mp4. Check: both files are in today's Work folder.", "uk": "Знімки й запис: before_after_day7.png (обидві деталі поруч у Blender, а також причал із пірсом в Unreal) і 60-секундний кліп: низький проліт уздовж причалу й далі вздовж пірса. Збережи сьогоднішній кліп як clip_day7.mp4. Перевірка: обидва файли лежать у сьогоднішній папці Work."}, "lesson": "D0.1"}]}, "lessons": [{"title": {"en": "Kit design: a piece list from real harbours", "uk": "Дизайн набору: список деталей зі справжніх гаваней"}, "minutes": 40, "goals": [{"en": "Explain a modular kit: a few pieces that snap together on a grid to build large places.", "uk": "Пояснювати, що таке модульний набір: кілька деталей, які з'єднуються на сітці, щоб будувати великі місця."}, {"en": "Write a piece list from real photos: straight pieces, corners, ends and special pieces.", "uk": "Складати список деталей за справжніми фото: прямі деталі, кути, кінці й особливі деталі."}, {"en": "Choose a grid and explain why every piece must be a whole number of grid steps.", "uk": "Вибирати сітку й пояснювати, чому кожна деталь має бути цілим числом кроків сітки."}], "doalong": [{"en": "Open commons.wikimedia.org and find three photos of small present-day harbours with a stone quay (a harbour wall you can walk along) and a timber pier. Save them in refs and credit them in credits.md.", "uk": "Відкрий commons.wikimedia.org і знайди три фото невеликих сучасних гаваней із кам'яним причалом (стіною гавані, уздовж якої можна ходити) і дерев'яним пірсом. Збережи їх у refs і вкажи в credits.md."}, {"en": "In each photo, find the repeating parts: the quay wall, the coping stones along its top edge, the pier deck, the piles under it, the railings and any steps down to the water.", "uk": "На кожному фото знайди частини, що повторюються: стіну причалу, камені бровки вздовж її верхнього краю, настил пірса, палі під ним, поруччя і будь-які сходи до води."}, {"en": "Make kit_rules.md. Write the piece list for this week: SM_QuayEdge_4m and SM_PierDeck_4m (today); SM_Railing_2m, SM_RailingPost, SM_Steps and SM_QuayCorner_Out (Day 8). Kit names end in their size or type, so anyone knows how far each piece snaps.", "uk": "Створи kit_rules.md. Запиши список деталей на цей тиждень: SM_QuayEdge_4m і SM_PierDeck_4m (сьогодні); SM_Railing_2m, SM_RailingPost, SM_Steps і SM_QuayCorner_Out (День 8). Назви деталей набору закінчуються їхнім розміром або типом, тож будь-хто знає, на яку відстань з'єднується кожна деталь."}, {"en": "Add the grid rule: a 1 m grid; main pieces 4 m; small pieces 2 m. Add why: pieces that are whole metres always meet on a grid line, so nothing needs nudging.", "uk": "Додай правило сітки: сітка 1 м; основні деталі — 4 м; малі деталі — 2 м. Додай пояснення: деталі в цілих метрах завжди сходяться на лінії сітки, тож нічого не доводиться підсувати."}, {"en": "On paper or in Krita, draw the top view of a 16 m quay with a pier 12 m long going out from it. Count the pieces: 4 quay edges and 3 pier decks.", "uk": "На папері або в Krita накресли вид згори причалу завдовжки 16 м, від якого відходить пірс завдовжки 12 м. Порахуй деталі: 4 краї причалу й 3 настили пірса."}], "play": {"en": "Kit builder on paper: the tutor describes a harbour in words (a 20 m quay, a pier 8 m out, one more 12 m quay after a gap); I count the pieces from my list, and the tutor checks that nothing is left over or missing.", "uk": "Конструктор набору на папері: тьютор словами описує гавань (причал 20 м, пірс на 8 м від берега, ще один причал 12 м після проміжку); я рахую деталі за своїм списком, а тьютор перевіряє, що нічого не лишилося зайвим і нічого не бракує."}, "video": {"url": "https://www.youtube.com/watch?v=Nlj3hN35CE4", "title": "Modular assets: a simple time-saving technique for game developers", "channel": "Boars In Rome", "length": "10:01", "search": "modular assets game environment kit"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Kit design: a piece list from real harbours (Day 7, lesson 1 of 4).\nToday's build: Your harbour kit, part 1: SM_QuayEdge_4m (a stone quay edge) and SM_PierDeck_4m (a timber pier deck).\n\nBy the end of this lesson I can:\n1. Explain a modular kit: a few pieces that snap together on a grid to build large places.\n2. Write a piece list from real photos: straight pieces, corners, ends and special pieces.\n3. Choose a grid and explain why every piece must be a whole number of grid steps.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (You can model, export and place props to the centimetre, and you have a tidy practice street of your own in Unreal.), what I will learn today (You design a harbour kit on a 1 m grid and make SM_QuayEdge_4m and SM_PierDeck_4m, two pieces that snap together without gaps.), encourage me (Kits are how large game worlds get built, and you are starting one in week two; one clean, snapping piece is real progress.), and share today's quote: \"Design depends largely on constraints.\" (Charles Eames).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 4: What does a UCX_ name tell Unreal, and what must the rest of the name match? | Day 2: Which tools would you use to pull four legs out of a seat block, and in which order?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Kit builder on paper: the tutor describes a harbour in words (a 20 m quay, a pier 8 m out, one more 12 m quay after a gap); I count the pieces from my list, and the tutor checks that nothing is left over or missing.\n6. Do-along on today's build (SM_QuayEdge_4m (in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Open commons.wikimedia.org and find three photos of small present-day harbours with a stone quay (a harbour wall you can walk along) and a timber pier. Save them in refs and credit them in credits.md.\n   - In each photo, find the repeating parts: the quay wall, the coping stones along its top edge, the pier deck, the piles under it, the railings and any steps down to the water.\n   - Make kit_rules.md. Write the piece list for this week: SM_QuayEdge_4m and SM_PierDeck_4m (today); SM_Railing_2m, SM_RailingPost, SM_Steps and SM_QuayCorner_Out (Day 8). Kit names end in their size or type, so anyone knows how far each piece snaps.\n   - Add the grid rule: a 1 m grid; main pieces 4 m; small pieces 2 m. Add why: pieces that are whole metres always meet on a grid line, so nothing needs nudging.\n   - On paper or in Krita, draw the top view of a 16 m quay with a pier 12 m long going out from it. Count the pieces: 4 quay edges and 3 pier decks.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Modular assets: a simple time-saving technique for game developers\" by Boars In Rome: https://www.youtube.com/watch?v=Nlj3hN35CE4\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "The grid and the pivot rule in Blender", "uk": "Сітка і правило півота в Blender"}, "minutes": 40, "goals": [{"en": "Turn on snapping to the grid in Blender, and hold Ctrl while moving to switch it on or off for a moment.", "uk": "Вмикати прив'язку до сітки в Blender і утримувати Ctrl під час руху, щоб на мить вмикати чи вимикати її."}, {"en": "Explain a pivot (the point a piece is placed and turned by; in Blender it is the origin) and the kit rule: the top corner at the start of the piece, on the land side.", "uk": "Пояснювати, що таке півот (точка, за яку деталь ставлять і обертають; у Blender це origin), і правило набору: верхній кут на початку деталі, з боку суходолу."}, {"en": "Explain the water-side rule and why every piece is exported from the world origin.", "uk": "Пояснювати правило боку води і чому кожна деталь експортується з центру світу."}], "doalong": [{"en": "New file quaykit_day7.blend. In the viewport header, click the magnet icon so it turns blue (snapping on), and open the small drop-down beside it: in Snap Target choose Grid, so things snap to the grid lines you see (in older versions: choose Increment and tick Absolute Grid Snap).", "uk": "Новий файл quaykit_day7.blend. У заголовку 3D Viewport клацни значок магніту, щоб він став синім (прив'язку ввімкнено), і відкрий маленьке спадне меню поруч: у Snap Target вибери Grid, щоб об'єкти прив'язувалися до видимих ліній сітки (у старіших версіях: вибери Increment і познач Absolute Grid Snap)."}, {"en": "Add a cube and press G: it jumps in whole grid steps. Zoom in and move it again: the steps get smaller (10 cm). Hold Ctrl while you move: snapping turns off until you let go. Delete the cube.", "uk": "Додай куб і натисни G: він стрибає цілими кроками сітки. Наблизь і посунь його знову: кроки стають меншими (10 см). Утримуй Ctrl під час руху: прив'язка вимикається, доки не відпустиш. Видали куб."}, {"en": "Write in kit_rules.md: pivot at the top corner at the start of the piece, on the land side: X = 0, Y = 0, Z = 0. The piece runs along +X; the water is at -Y.", "uk": "Запиши в kit_rules.md: півот у верхньому куті на початку деталі, з боку суходолу: X = 0, Y = 0, Z = 0. Деталь іде вздовж +X; вода — в бік -Y."}, {"en": "Press Numpad 1 (front view): you look along +Y, so -Y is towards you. The water side of every piece faces you in this view. Add to kit_rules.md: every piece sits at the world origin when you export it, and you hide the others while you work.", "uk": "Натисни Numpad 1 (вид спереду): ти дивишся вздовж +Y, тож -Y — це до тебе. На цьому виді бік води кожної деталі повернуто до тебе. Додай у kit_rules.md: кожна деталь стоїть у центрі світу, коли ти її експортуєш, а решту ти ховаєш, поки працюєш."}, {"en": "Add a cube, set Dimensions 4 x 2 x 3 m and apply the scale. Type G X 2, G Y -1 and G Z -1.5: the block now runs from X 0 to 4 and from Y 0 to -2, and hangs 3 m down from Z 0.", "uk": "Додай куб, задай Dimensions 4 x 2 x 3 м і застосуй масштаб. Введи G X 2, G Y -1 і G Z -1.5: тепер брусок іде від X 0 до 4 і від Y 0 до -2 і звисає на 3 м донизу від Z 0."}, {"en": "Put the origin on the pivot: Shift+S > Cursor to World Origin, then Object > Set Origin > Origin to 3D Cursor. The orange dot sits on the top corner on the land side. Name the block SM_QuayEdge_4m.", "uk": "Постав origin на півот: Shift+S > Cursor to World Origin, потім Object > Set Origin > Origin to 3D Cursor. Помаранчева точка стоїть на верхньому куті з боку суходолу. Назви брусок SM_QuayEdge_4m."}], "play": {"en": "Where's the pivot? The tutor describes four pieces (a 4 m quay, a 2 m railing, a pier deck, a corner); I say where each pivot goes by my rule and which way its water side faces.", "uk": "Де півот? Тьютор описує чотири деталі (причал 4 м, поруччя 2 м, настил пірса, кут); я кажу, де за моїм правилом стоїть півот кожної і куди дивиться її бік води."}, "video": {"search": "blender snap to grid snap target"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: The grid and the pivot rule in Blender (Day 7, lesson 2 of 4).\nToday's build: Your harbour kit, part 1: SM_QuayEdge_4m (a stone quay edge) and SM_PierDeck_4m (a timber pier deck).\nEarlier today I already did: lesson 1 (Kit design: a piece list from real harbours). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Turn on snapping to the grid in Blender, and hold Ctrl while moving to switch it on or off for a moment.\n2. Explain a pivot (the point a piece is placed and turned by; in Blender it is the origin) and the kit rule: the top corner at the start of the piece, on the land side.\n3. Explain the water-side rule and why every piece is exported from the world origin.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Where's the pivot? The tutor describes four pieces (a 4 m quay, a 2 m railing, a pier deck, a corner); I say where each pivot goes by my rule and which way its water side faces.\n4. Do-along on today's build (SM_QuayEdge_4m (in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - New file quaykit_day7.blend. In the viewport header, click the magnet icon so it turns blue (snapping on), and open the small drop-down beside it: in Snap Target choose Grid, so things snap to the grid lines you see (in older versions: choose Increment and tick Absolute Grid Snap).\n   - Add a cube and press G: it jumps in whole grid steps. Zoom in and move it again: the steps get smaller (10 cm). Hold Ctrl while you move: snapping turns off until you let go. Delete the cube.\n   - Write in kit_rules.md: pivot at the top corner at the start of the piece, on the land side: X = 0, Y = 0, Z = 0. The piece runs along +X; the water is at -Y.\n   - Press Numpad 1 (front view): you look along +Y, so -Y is towards you. The water side of every piece faces you in this view. Add to kit_rules.md: every piece sits at the world origin when you export it, and you hide the others while you work.\n   - Add a cube, set Dimensions 4 x 2 x 3 m and apply the scale. Type G X 2, G Y -1 and G Z -1.5: the block now runs from X 0 to 4 and from Y 0 to -2, and hangs 3 m down from Z 0.\n   - Put the origin on the pivot: Shift+S > Cursor to World Origin, then Object > Set Origin > Origin to 3D Cursor. The orange dot sits on the top corner on the land side. Name the block SM_QuayEdge_4m.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Modelling SM_QuayEdge_4m", "uk": "Моделюємо SM_QuayEdge_4m"}, "minutes": 40, "goals": [{"en": "Model a quay edge to exact sizes: the wall block and the coping stones.", "uk": "Моделювати край причалу за точними розмірами: брусок стіни й камені бровки."}, {"en": "Split the wall into stone courses (rows) with loop cuts, so it reads as stone.", "uk": "Ділити стіну на ряди каміння петлевими розрізами, щоб вона читалася як кам'яна."}, {"en": "Add a material and UCX boxes, and export the first kit piece.", "uk": "Додавати матеріал і блоки UCX та експортувати першу деталь набору."}], "doalong": [{"en": "Coping: add a cube, set Dimensions 4 x 0.45 x 0.2 m and apply the scale. Type G X 2, G Y -1.825 Enter (it stays at Z 0): the coping runs along the water edge, overhangs the wall by 5 cm and stands 10 cm above the deck.", "uk": "Бровка: додай куб, задай Dimensions 4 x 0.45 x 0.2 м і застосуй масштаб. Введи G X 2, G Y -1.825 Enter (він лишається на Z 0): бровка йде вздовж краю над водою, нависає над стіною на 5 см і піднімається на 10 см над поверхнею причалу."}, {"en": "Add Modifier > Generate > Bevel to the coping: Amount 0.01 m, Segments 2. Apply it.", "uk": "Add Modifier > Generate > Bevel для бровки: Amount 0.01 м, Segments 2. Застосуй його."}, {"en": "Select the block, Tab, hover over a vertical edge of the wall face and press Ctrl+R; scroll to 5 cuts, click and right-click. The wall now has six rows of stone. Tab out.", "uk": "Виділи брусок, Tab, наведи мишу на вертикальне ребро лицьової грані стіни й натисни Ctrl+R; прокрути до 5 розрізів, клацни і клацни правою кнопкою. Тепер стіна має шість рядів каміння. Вийди з Edit Mode (Tab)."}, {"en": "Click the coping, then Shift+click the block (the block is now the active object) and press Ctrl+J. Check the orange dot is still on the pivot corner.", "uk": "Клацни бровку, тоді Shift+клацни брусок (тепер брусок — активний об'єкт) і натисни Ctrl+J. Перевір, що помаранчева точка досі на куті півота."}, {"en": "Material Properties > New, name it M_Stone: a light grey-beige from your photos, Roughness 0.8, Metallic 0.", "uk": "Material Properties > New, назви матеріал M_Stone: світлий сіро-бежевий за твоїми фото, Roughness 0.8, Metallic 0."}, {"en": "Collision: one box the size of the block (4 x 2 x 3 m) and one for the coping, named UCX_SM_QuayEdge_4m_00 and _01, with the piece's origin. Select the piece and both boxes and export SM_QuayEdge_4m.fbx with the Day 4 settings.", "uk": "Колізія: один блок розміром із брусок (4 x 2 x 3 м) і один на бровку, з назвами UCX_SM_QuayEdge_4m_00 і _01, з origin деталі. Виділи деталь і обидва блоки й експортуй SM_QuayEdge_4m.fbx з налаштуваннями з Дня 4."}], "play": {"en": "Break it, fix it: I describe to the tutor a quay piece whose origin I moved 3 cm off the corner; the tutor describes what happens when four of them are snapped in Unreal, and I say how to find and fix it.", "uk": "Зламай і полагодь: я описую тьютору деталь причалу, чий origin зсунуто на 3 см від кута; тьютор описує, що станеться, коли чотири такі деталі з'єднають в Unreal, а я кажу, як знайти й виправити помилку."}, "video": {"url": "https://www.youtube.com/watch?v=OVfWWv4t6yI", "title": "How to make Wooden Wharf in Blender / Blender tutorial #oe262", "channel": "Octopus Effects", "length": "10:13", "search": "blender wooden pier wharf modeling"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Modelling SM_QuayEdge_4m (Day 7, lesson 3 of 4).\nToday's build: Your harbour kit, part 1: SM_QuayEdge_4m (a stone quay edge) and SM_PierDeck_4m (a timber pier deck).\nEarlier today I already did: lesson 1 (Kit design: a piece list from real harbours); lesson 2 (The grid and the pivot rule in Blender). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Model a quay edge to exact sizes: the wall block and the coping stones.\n2. Split the wall into stone courses (rows) with loop cuts, so it reads as stone.\n3. Add a material and UCX boxes, and export the first kit piece.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Break it, fix it: I describe to the tutor a quay piece whose origin I moved 3 cm off the corner; the tutor describes what happens when four of them are snapped in Unreal, and I say how to find and fix it.\n4. Do-along on today's build (SM_QuayEdge_4m (in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Coping: add a cube, set Dimensions 4 x 0.45 x 0.2 m and apply the scale. Type G X 2, G Y -1.825 Enter (it stays at Z 0): the coping runs along the water edge, overhangs the wall by 5 cm and stands 10 cm above the deck.\n   - Add Modifier > Generate > Bevel to the coping: Amount 0.01 m, Segments 2. Apply it.\n   - Select the block, Tab, hover over a vertical edge of the wall face and press Ctrl+R; scroll to 5 cuts, click and right-click. The wall now has six rows of stone. Tab out.\n   - Click the coping, then Shift+click the block (the block is now the active object) and press Ctrl+J. Check the orange dot is still on the pivot corner.\n   - Material Properties > New, name it M_Stone: a light grey-beige from your photos, Roughness 0.8, Metallic 0.\n   - Collision: one box the size of the block (4 x 2 x 3 m) and one for the coping, named UCX_SM_QuayEdge_4m_00 and _01, with the piece's origin. Select the piece and both boxes and export SM_QuayEdge_4m.fbx with the Day 4 settings.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"How to make Wooden Wharf in Blender / Blender tutorial #oe262\" by Octopus Effects: https://www.youtube.com/watch?v=OVfWWv4t6yI\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Snapping kit pieces in Unreal", "uk": "З'єднуємо деталі набору в Unreal"}, "minutes": 40, "goals": [{"en": "Set the grid snap (100 cm) and the rotation snap (90 degrees) for kit work.", "uk": "Налаштовувати прив'язку до сітки (100 см) і прив'язку обертання (90 градусів) для роботи з набором."}, {"en": "Join pieces corner to corner with vertex snapping (hold V while dragging).", "uk": "З'єднувати деталі кут до кута через прив'язку до вершин (утримуй V під час перетягування)."}, {"en": "Check seams (the lines where two pieces meet) from 2 m away, for gaps and z-fighting.", "uk": "Перевіряти шви (лінії, де сходяться дві деталі) з 2 м на щілини й z-fighting."}], "doalong": [{"en": "In IslandCourse, make a new level (File > New Level > Basic), save it as L_Day07 in a new folder Course/Day07, and import SM_QuayEdge_4m.fbx into Course/Day07 using your import checklist.", "uk": "В IslandCourse створи новий рівень (File > New Level > Basic), збережи його як L_Day07 у новій папці Course/Day07 та імпортуй SM_QuayEdge_4m.fbx у Course/Day07, звіряючись із чек-листом імпорту."}, {"en": "Click Floor in the Outliner and type -100 into its Location Z. The floor drops 1 m and stands in for the water: the quay wall and the pier piles will show above it, and your deck tops won't flicker against a floor at the same height. You see the grey floor sink.", "uk": "Клацни Floor в Outliner і введи -100 у його Location Z. Підлога опускається на 1 м і грає роль води: стіна причалу й палі пірса будуть видні над нею, а верх настилів не мерехтітиме разом із підлогою на тій самій висоті. Ти бачиш, як сіра підлога опускається."}, {"en": "Drag the quay piece into the level and type Location 0, 0, 0. In the viewport toolbar, set the grid snap to 100 and the rotation snap (the angle icon beside it) to 90.", "uk": "Перетягни деталь причалу в рівень і введи Location 0, 0, 0. На панелі інструментів в'юпорта встанови прив'язку до сітки на 100, а прив'язку обертання (значок кута поруч) — на 90."}, {"en": "Hold Alt and drag the red arrow: a copy follows in 1 m steps. Stop at X 400, where it touches the first piece end to end. Make two more copies: a 16 m quay.", "uk": "Утримуй Alt і тягни червону стрілку: копія йде за нею кроками по 1 м. Зупинись на X 400, де вона торкається першої деталі торець у торець. Зроби ще дві копії: причал завдовжки 16 м."}, {"en": "Turn one copy 90 degrees (press E and drag the blue ring; it clicks in 90-degree steps). Then press W, hold V and drag it by its gizmo near another piece's corner: the corners click together. This is vertex snapping. Press Ctrl+Z twice to undo the turn.", "uk": "Поверни одну копію на 90 градусів (натисни E і тягни синє кільце; воно клацає кроками по 90 градусів). Потім натисни W, утримуй V і тягни копію за гізмо до кута іншої деталі: кути клацають і з'єднуються. Це прив'язка до вершин. Натисни Ctrl+Z двічі, щоб скасувати поворот."}, {"en": "Fly to 2 m from each seam. Look for gaps (light showing through) and z-fighting (two surfaces in exactly the same place, flickering).", "uk": "Підлети на 2 м до кожного шва. Шукай щілини (крізь них видно світло) і z-fighting (дві поверхні точно в одному місці, які мерехтять)."}], "play": {"en": "Beat the clock: a 20 m straight quay with snapping in 90 seconds, no gaps; the tutor times me from my first and last screenshot.", "uk": "Наввипередки з годинником: прямий причал 20 м із прив'язкою за 90 секунд, без щілин; тьютор рахує час між моїм першим і останнім скриншотом."}, "video": {"url": "https://www.youtube.com/watch?v=tnaXNCaBQ4M", "title": "06 - Snapping, Pivot Points, and Duplication - Unreal Engine Stage Design Course", "channel": "SuperStage", "length": "7:21", "search": "unreal engine snapping pivot duplicate"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Snapping kit pieces in Unreal (Day 7, lesson 4 of 4).\nToday's build: Your harbour kit, part 1: SM_QuayEdge_4m (a stone quay edge) and SM_PierDeck_4m (a timber pier deck).\nEarlier today I already did: lesson 1 (Kit design: a piece list from real harbours); lesson 2 (The grid and the pivot rule in Blender); lesson 3 (Modelling SM_QuayEdge_4m). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Set the grid snap (100 cm) and the rotation snap (90 degrees) for kit work.\n2. Join pieces corner to corner with vertex snapping (hold V while dragging).\n3. Check seams (the lines where two pieces meet) from 2 m away, for gaps and z-fighting.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Beat the clock: a 20 m straight quay with snapping in 90 seconds, no gaps; the tutor times me from my first and last screenshot.\n4. Do-along on today's build (SM_QuayEdge_4m (in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - In IslandCourse, make a new level (File > New Level > Basic), save it as L_Day07 in a new folder Course/Day07, and import SM_QuayEdge_4m.fbx into Course/Day07 using your import checklist.\n   - Click Floor in the Outliner and type -100 into its Location Z. The floor drops 1 m and stands in for the water: the quay wall and the pier piles will show above it, and your deck tops won't flicker against a floor at the same height. You see the grey floor sink.\n   - Drag the quay piece into the level and type Location 0, 0, 0. In the viewport toolbar, set the grid snap to 100 and the rotation snap (the angle icon beside it) to 90.\n   - Hold Alt and drag the red arrow: a copy follows in 1 m steps. Stop at X 400, where it touches the first piece end to end. Make two more copies: a 16 m quay.\n   - Turn one copy 90 degrees (press E and drag the blue ring; it clicks in 90-degree steps). Then press W, hold V and drag it by its gizmo near another piece's corner: the corners click together. This is vertex snapping. Press Ctrl+Z twice to undo the turn.\n   - Fly to 2 m from each seam. Look for gaps (light showing through) and z-fighting (two surfaces in exactly the same place, flickering).\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"06 - Snapping, Pivot Points, and Duplication - Unreal Engine Stage Design Course\" by SuperStage: https://www.youtube.com/watch?v=tnaXNCaBQ4M\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "kit_rules.md (piece list, grid, pivot and water-side rules)", "uk": "kit_rules.md (список деталей, сітка, правила півота й боку води)"}, {"en": "quaykit_day7.blend (your working file)", "uk": "quaykit_day7.blend (твій робочий файл)"}, {"en": "SM_QuayEdge_4m.fbx and SM_PierDeck_4m.fbx (with their UCX boxes)", "uk": "SM_QuayEdge_4m.fbx і SM_PierDeck_4m.fbx (з їхніми блоками UCX)"}, {"en": "before_after_day7.png (the pieces in Blender; the quay and pier in Unreal)", "uk": "before_after_day7.png (деталі в Blender; причал і пірс в Unreal)"}, {"en": "clip_day7.mp4 (60 seconds, low along the quay and out along the pier)", "uk": "clip_day7.mp4 (60 секунд: низько вздовж причалу й далі вздовж пірса)"}, {"en": "summary.md", "uk": "summary.md"}], "goal": {"en": "By the end of today you have SM_QuayEdge_4m and SM_PierDeck_4m, two harbour kit pieces on a 1 m grid with one shared pivot rule, snapped together without gaps in Unreal.", "uk": "До кінця дня в тебе є SM_QuayEdge_4m і SM_PierDeck_4m — дві деталі набору для гавані на сітці 1 м зі спільним правилом півота, з'єднані в Unreal без щілин."}, "uses": [{"en": "Day 6: exact placing, grid snap, folders and your import checklist", "uk": "День 6: точне розміщення, прив'язка до сітки, папки і твій чек-лист імпорту"}, {"en": "Day 5: simple materials (M_)", "uk": "День 5: прості матеріали (M_)"}, {"en": "Day 4: UCX boxes and the clean FBX export", "uk": "День 4: блоки UCX і чистий експорт FBX"}, {"en": "Day 3: the Array modifier and Bevel", "uk": "День 3: модифікатори Array і Bevel"}, {"en": "Day 2: loop cuts", "uk": "День 2: петлеві розрізи"}], "quiz": [{"q": {"en": "You snap four quay pieces and see a 3 cm gap at every seam. What is the most likely cause?", "uk": "Ти з'єднуєш чотири деталі причалу й бачиш щілину 3 см на кожному шві. Яка найімовірніша причина?"}, "options": [{"en": "The pieces are 3.97 m long, or their origins are 3 cm off the pivot corner", "uk": "Деталі мають 3.97 м завдовжки, або їхні origin зсунуто на 3 см від кута півота"}, {"en": "The material is too rough", "uk": "Матеріал занадто шорсткий"}, {"en": "The grid snap is set to 100", "uk": "Прив'язку до сітки встановлено на 100"}, {"en": "Nanite is off", "uk": "Nanite вимкнено"}], "answer": 0, "explain": {"en": "Kit pieces only meet cleanly when every length is whole and every pivot follows the rule. A small error repeats at every seam.", "uk": "Деталі набору сходяться чисто, лише коли кожна довжина ціла і кожен півот відповідає правилу. Маленька помилка повторюється на кожному шві."}}, {"q": {"en": "Why are kit pieces whole numbers of metres?", "uk": "Чому довжина деталей набору — ціле число метрів?"}, "options": [{"en": "Unreal can't import other sizes", "uk": "Unreal не може імпортувати інші розміри"}, {"en": "So they always meet on grid lines and snap together without nudging", "uk": "Щоб вони завжди сходилися на лініях сітки й з'єднувалися без підсування"}, {"en": "To save triangles", "uk": "Щоб заощадити трикутники"}], "answer": 1, "explain": {"en": "Whole-metre pieces on a 1 m grid always end on a grid line, so the next piece starts exactly there.", "uk": "Деталі в цілих метрах на сітці 1 м завжди закінчуються на лінії сітки, тож наступна деталь починається точно там."}}, {"q": {"en": "Where is the pivot of every piece in your harbour kit?", "uk": "Де півот кожної деталі твого набору для гавані?"}, "options": [{"en": "In the middle of the piece", "uk": "Посередині деталі"}, {"en": "At the bottom centre, like a prop", "uk": "Унизу по центру, як у пропса"}, {"en": "At the top corner at the start of the piece, on the land side", "uk": "У верхньому куті на початку деталі, з боку суходолу"}], "answer": 2, "explain": {"en": "Props pivot at their base centre; kit pieces pivot on a grid corner, so they snap to each other and to the grid.", "uk": "Півот пропсів — у центрі основи; півот деталей набору — у куті сітки, тож вони прив'язуються одна до одної й до сітки."}}, {"q": {"en": "Two surfaces flicker where your pier deck meets the quay. What is this, and what causes it?", "uk": "Там, де настил пірса сходиться з причалом, мерехтять дві поверхні. Що це і що це спричиняє?"}, "options": [{"en": "The deck is too far from the camera", "uk": "Настил задалеко від камери"}, {"en": "A missing material", "uk": "Відсутній матеріал"}, {"en": "Z-fighting: two faces in exactly the same place", "uk": "Z-fighting: дві грані точно в одному місці"}, {"en": "Snapping is off in Blender", "uk": "У Blender вимкнено прив'язку"}], "answer": 2, "explain": {"en": "When two faces sit in the same place, Unreal can't decide which to draw, so they flicker. Move or remove one of them.", "uk": "Коли дві грані лежать в одному місці, Unreal не може вирішити, яку малювати, тож вони мерехтять. Посунь або прибери одну з них."}}, {"q": {"en": "In Blender, your pier deck sits 6 m away from the world origin when you export it. What will you see in Unreal?", "uk": "У Blender під час експорту твій настил пірса стоїть за 6 м від центру світу. Що ти побачиш в Unreal?"}, "options": [{"en": "Nothing different", "uk": "Нічого не зміниться"}, {"en": "The deck's pivot may end up 6 m away from the deck, so it is placed in the wrong spot", "uk": "Півот настилу може опинитися за 6 м від самого настилу, тож його буде поставлено не туди"}, {"en": "The deck is 6 m longer", "uk": "Настил стане на 6 м довшим"}], "answer": 1, "explain": {"en": "Export every kit piece from the world origin with its origin on the pivot, so the pivot arrives in Unreal where you expect.", "uk": "Експортуй кожну деталь набору з центру світу з origin на півоті, щоб півот прибув в Unreal туди, куди ти очікуєш."}}], "weekInfo": {"week": 2, "title": {"en": "Modular kits", "uk": "Модульні набори"}, "goal": {"en": "By Friday you have your own harbour and building kit on a metric grid, and L_KitTest: a quay, a pier and a harbour house built from it in Unreal, with the house saved as a Level Instance.", "uk": "До п'ятниці в тебе є власний набір для гавані й будівель на метричній сітці та L_KitTest: причал, пірс і портовий будинок, зібрані з цього набору в Unreal, а будинок збережено як Level Instance."}, "skills": [{"en": "Modular kit design on a metric grid with consistent pivots", "uk": "Дизайн модульного набору на метричній сітці з узгодженими півотами"}, {"en": "Unreal Engine 5 level assembly: import pipeline, exact placement and snapping", "uk": "Збирання рівня в Unreal Engine 5: пайплайн імпорту, точне розміщення та прив'язка (snapping)"}, {"en": "Nanite versus LOD decisions for real-time performance", "uk": "Вибір між Nanite і LOD заради продуктивності в реальному часі"}, {"en": "Level Instances for reusable building sets", "uk": "Level Instances для наборів будівель, які можна використовувати багато разів"}, {"en": "Content Browser organisation and industry naming conventions (SM_, M_, MI_, T_, L_)", "uk": "Організація Content Browser і галузеві правила назв (SM_, M_, MI_, T_, L_)"}]}, "morning": {"sofar": {"en": "You can model, export and place props to the centimetre, and you have a tidy practice street of your own in Unreal.", "uk": "Ти вмієш моделювати, експортувати й розставляти пропси з точністю до сантиметра, і в Unreal у тебе вже є власна охайна тренувальна вулиця."}, "today": {"en": "You design a harbour kit on a 1 m grid and make SM_QuayEdge_4m and SM_PierDeck_4m, two pieces that snap together without gaps.", "uk": "Сьогодні ти проєктуєш портовий набір на сітці 1 м і робиш SM_QuayEdge_4m та SM_PierDeck_4m — дві частини, що стикуються без зазорів."}, "cheer": {"en": "Kits are how large game worlds get built, and you are starting one in week two; one clean, snapping piece is real progress.", "uk": "Саме з наборів будують великі ігрові світи, і ти починаєш свій уже на другому тижні; одна чиста частина, що точно стає на місце, — це справжній поступ."}, "quote": {"text": {"en": "Design depends largely on constraints.", "uk": "Дизайн великою мірою залежить від обмежень."}, "author": {"en": "Charles Eames", "uk": "Чарльз Імз"}, "source": "https://en.wikiquote.org/wiki/Charles_Eames"}}, "hasAssets": false, "workPath": "Work\\Assignment\\Day-07-harbour-kit-quay-and-pier", "mapHref": "../../COURSE.html", "prevHref": "../Day-06-unreal-first-steps/START-HERE.html", "nextHref": "../Day-08-kit-railing-steps-corner/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Blender and Unreal Engine 5.8. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me and don't write code. Keep me moving and make it feel like a game.\n\nToday I build on my own: SM_PierDeck_4m, on your own.\nIt's part of: Your harbour kit, part 1: SM_QuayEdge_4m (a stone quay edge) and SM_PierDeck_4m (a timber pier deck) (Your island's waterfront (district 1): the quay along the harbour and a pier going out over the water. Today the pieces meet in Course/Day07.).\n\nSpec:\n- kit_rules.md: the piece list, the grid (1 m; main pieces 4 m), the pivot rule, the water-side rule, and 'every piece is exported from the world origin'.\n- SM_QuayEdge_4m: 4 m long (X) and 2 m deep (Y), the deck top at Z = 0 and the wall going 3 m down; a stone coping (the row of big stones along the top of the water edge) 0.45 m wide, standing 0.1 m above the deck and overhanging the wall by 5 cm.\n- SM_PierDeck_4m: a 4 x 4 m timber deck with its top at Z = 0: 20 planks 0.18 m wide with 2 cm gaps (Array), three beams underneath, and four piles (round posts that stand in the water), one near each corner.\n- Pivot rule: the top corner at the start of the piece on the land side (X = 0, Y = 0, Z = 0). The piece runs along +X and the water side faces -Y (towards you in Blender's front view).\n- Triangles under 2,000 per piece; plain materials M_Stone and M_Timber; UCX boxes on each piece.\n- SM_QuayEdge_4m.fbx and SM_PierDeck_4m.fbx; in Unreal (Course/Day07, level L_Day07), four quay pieces in a 16 m run and three pier decks going out from it, all snapped with no gaps.\n\nMy checklist:\n1. Look at your harbour photos again and write the pier sizes in kit_rules.md: plank width, beam size, pile thickness. Check: three sizes written, each close to the ones in the spec. (from lesson 1)\n2. In quaykit_day7.blend, hide SM_QuayEdge_4m (the eye icon in the Outliner). One plank: a cube 0.18 x 4 x 0.05 m, scale applied, at X 0.1, Y -2, Z -0.025. Check: one plank lies across the deck area with its top on Z = 0. (from day 1, lesson 3)\n3. Add an Array to the plank: Count 20, Relative Offset off, Constant Offset Distance X 0.2 m. Check: 20 planks cover X 0 to 4 m with even gaps. (from day 3, lesson 1)\n4. Beams: three cubes 4 x 0.2 x 0.3 m running along X under the planks, at Y -0.3, -2 and -3.7, Z -0.2. Check: from the side (Numpad 3) the beams sit right under the planks with no gap. (from day 1, lesson 3)\n5. Piles: a cylinder (Vertices 12, Radius 0.15 m, Depth 4 m) at X 0.2, Y -0.3, Z -2.05; copy it with Shift+D to X 0.2, Y -3.7, then to X 3.8 at both Y values. Check: four piles go down from the beams, one near each corner. (from day 1, lesson 1)\n6. Apply the Array, select every deck part (planks, beams and piles) and press Ctrl+J, name the object SM_PierDeck_4m and put its origin on the pivot: Shift+S > Cursor to World Origin, Origin to 3D Cursor. Check: the orange dot sits on the corner at X 0, Y 0, Z 0, and Location reads 0, 0, 0. (from lesson 2)\n7. Material: M_Timber (a grey-brown from your photos, Roughness 0.85, Metallic 0) on the whole deck. Check: in Material Preview the deck looks like weathered timber, not plastic. (from day 5, lesson 2)\n8. Collision: one box for the deck and beams (Dimensions 4 x 4 x 0.35 m at X 2, Y -2, Z -0.175) and one box per pile, named UCX_SM_PierDeck_4m_00 to _04, with the deck's origin. Check: five boxes, every name starting with UCX_SM_PierDeck_4m_. (from day 4, lesson 3)\n9. Read Triangles (under 2,000). Then test the grid: with snapping on, Shift+D the deck and move the copy exactly 4 m along X. Look at the join from close up, then delete the copy. Check: the two decks meet with the same 2 cm gap as between the planks, and no plank overlaps. (from lesson 2)\n10. Export SM_PierDeck_4m.fbx (deck and UCX boxes selected) with the Day 4 settings. Check: the file is in today's Work folder. (from day 4, lesson 4)\n11. Import it into Course/Day07 and place three decks going out from the middle of your quay run: turn the first with Rotation Z 90 or -90 so it points away from the land, join it to the quay's water edge with vertex snap, then copy it twice, 400 cm each. Check: a 12 m pier goes straight out from the quay. (from lesson 4)\n12. Fly along the pier at 1 m and at 10 m high. Check: the deck tops line up with the quay's deck height, and there are no gaps or flickering surfaces at any join. (from lesson 4)\n13. Captures: before_after_day7.png (both pieces side by side in Blender, and the quay with its pier in Unreal) and a 60-second clip flying low along the quay and out along the pier. Save today's clip as clip_day7.mp4. Check: both files are in today's Work folder. (from day 0, lesson 1)\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Denis\nDay 7: Kit design: a metric grid, a pivot rule and your first harbour pieces. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p><div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+list(D.handin,'ul','ticks')+'<p class="path">'+ic('folder')+'<span>'+u('shipTo')+' <code>'+esc(D.workPath)+'</code></span></p>'+(D.lessons.length?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<p class="muted">'+u('report')+'</p><div class="row"><button class="btn s" onclick="cp(D.reportPrompt)">'+ic('copy')+u('copyR')+'</button></div></section>';
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();

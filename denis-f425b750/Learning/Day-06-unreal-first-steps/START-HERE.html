": "Names with the industry prefixes: SM_ for static meshes, M_ for materials, MI_ for material instances, T_ for textures, L_ for levels.", "uk": "Назви з галузевими префіксами: SM_ для статичних сіток, M_ для матеріалів, MI_ для екземплярів матеріалів (material instances), T_ для текстур, L_ для рівнів."}, {"en": "A practice street from basic-shape cubes: a pavement 20 m long, 3 m wide and 0.15 m high, and a road beside it, typed to exact Location and Scale.", "uk": "Тренувальна вулиця з кубів базових форм: тротуар 20 м завдовжки, 3 м завширшки і 0.15 м заввишки та дорога поруч, з точно введеними Location і Scale."}, {"en": "Props at the placement list's points (metres x 100 = Unreal centimetres): five bollards 1.5 m apart along the kerb, two lamp posts 8 m apart, two benches, two bins and the railing section, each dropped onto the pavement with End.", "uk": "Пропси в точках зі списку розміщення (метри x 100 = сантиметри Unreal): п'ять стовпчиків через 1.5 м уздовж бордюру, два ліхтарні стовпи на відстані 8 м, дві лавки, дві урни і секція поруччя, кожен пропс опущено на тротуар через End."}, {"en": "SM_RailingSection imported from a clean FBX with UCX boxes into Course/Day06/Meshes, and import_checklist.md written.", "uk": "SM_RailingSection, імпортований із чистого FBX з блоками UCX у Course/Day06/Meshes, і написаний import_checklist.md."}, {"en": "placement_check.md, an Outliner folder named Street, and five camera bookmarks (Ctrl+1 to Ctrl+5).", "uk": "placement_check.md, папка Street в Outliner і п'ять закладок камери (від Ctrl+1 до Ctrl+5)."}], "piece1": "the pavement and the first bollards (in the lessons)", "piece2": {"en": "The rest of the street, placed from the list, on your own", "uk": "Решта вулиці, розставлена за списком, самостійно"}, "steps": [{"text": {"en": "Road: drag another Cube from Place Actors > Shapes and type Location X 1000, Y -300, Z 1 and Scale 20, 6, 0.02: a road 2 cm thick lying on the floor (a road exactly level with the floor would flicker against it). Name it Road. Check: the road lies flat with no flicker, and from a low view the pavement stands about 13 cm above it like a kerb.", "uk": "Дорога: перетягни ще один Cube з Place Actors > Shapes і введи Location X 1000, Y -300, Z 1 і Scale 20, 6, 0.02: дорога завтовшки 2 см лежить на підлозі (дорога точно на рівні підлоги мерехтіла б разом із нею). Назви її Road. Перевірка: дорога лежить рівно й не мерехтить, а з низького ракурсу тротуар піднімається над нею приблизно на 13 см, як бордюр."}, "lesson": 4}, {"text": {"en": "Bollards: make sure all five bollards (X 100, 250, 400, 550 and 700, Y 30) are on the pavement; select each and press End. Check: from a low view, every bollard base touches the pavement top.", "uk": "Стовпчики: переконайся, що всі п'ять стовпчиків (X 100, 250, 400, 550 і 700, Y 30) стоять на тротуарі; виділи кожен і натисни End. Перевірка: з низького ракурсу основа кожного стовпчика торкається верху тротуару."}, "lesson": 4}, {"text": {"en": "Lamp posts: place SM_LampPost at X 600, Y 50 and X 1400, Y 50, then press End on each. Check: the lamps stand on the pavement, 8 m apart.", "uk": "Ліхтарні стовпи: постав SM_LampPost на X 600, Y 50 і на X 1400, Y 50, тоді натисни End на кожному. Перевірка: ліхтарі стоять на тротуарі на відстані 8 м один від одного."}, "lesson": 4}, {"text": {"en": "Benches: place SM_Bench at X 1000, Y 220 and X 1700, Y 220, and turn each with Rotation Z (in steps of 90) until it faces the road. Press End. Check: both benches face the road with their backs to the far side of the pavement.", "uk": "Лавки: постав SM_Bench на X 1000, Y 220 і на X 1700, Y 220 і поверни кожну через Rotation Z (кроками по 90), доки вона не стане обличчям до дороги. Натисни End. Перевірка: обидві лавки стоять обличчям до дороги, а спинками — до дальнього краю тротуару."}, "lesson": 4}, {"text": {"en": "Bins: place SM_Bin at X 1150, Y 250 and X 1850, Y 250, then press End. Check: each bin stands just beside a bench.", "uk": "Урни: постав SM_Bin на X 1150, Y 250 і на X 1850, Y 250, тоді натисни End. Перевірка: кожна урна стоїть просто біля лавки."}, "lesson": 4}, {"text": {"en": "Railing: place SM_RailingSection at X 300, Y 290 along the back edge of the pavement and turn it with Rotation Z until it runs along the street. Press End. Check: the railing stands on the pavement's back edge and runs parallel to the kerb.", "uk": "Поруччя: постав SM_RailingSection на X 300, Y 290 уздовж заднього краю тротуару й поверни його через Rotation Z, доки воно не йтиме вздовж вулиці. Натисни End. Перевірка: поруччя стоїть на задньому краю тротуару й іде паралельно бордюру."}, "lesson": 4}, {"text": {"en": "Surfaces: from LevelPrototyping > Materials, drag MI_PrototypeGrid_Gray onto the pavement and a different material from the same folder onto the road. Check: you can tell the pavement from the road at a glance.", "uk": "Поверхні: з LevelPrototyping > Materials перетягни MI_PrototypeGrid_Gray на тротуар, а інший матеріал із тієї самої папки — на дорогу. Перевірка: тротуар від дороги можна відрізнити з першого погляду."}, "lesson": 2}, {"text": {"en": "Outliner: select all props (Ctrl+click), right-click > Move To > Create New Folder and name it Street. Check: the Outliner shows a Street folder holding every prop.", "uk": "Outliner: виділи всі пропси (Ctrl+клацання), клацни правою кнопкою > Move To > Create New Folder і назви папку Street. Перевірка: Outliner показує папку Street з усіма пропсами."}, "lesson": 1}, {"text": {"en": "Content Browser: make sure the railing and its material sit in Course/Day06/Meshes and /Materials, then right-click Course > Fix Up Redirectors. Take folders.png of the Content Browser's folder tree (Win+Shift+S). Check: no asset of yours is loose in the Content folder.", "uk": "Content Browser: переконайся, що поруччя та його матеріал лежать у Course/Day06/Meshes і /Materials, а тоді клацни правою кнопкою на Course > Fix Up Redirectors. Зроби folders.png із деревом папок Content Browser (Win+Shift+S). Перевірка: жоден твій асет не лежить просто в папці Content."}, "lesson": 2}, {"text": {"en": "Write placement_check.md: for each prop, the plan point in metres, the X and Y you typed, and yes or no for 'on the pavement, not floating'. Check: twelve lines, all yes.", "uk": "Напиши placement_check.md: для кожного пропса — точка плану в метрах, введені тобою X і Y та «так» чи «ні» для «на тротуарі, не висить». Перевірка: дванадцять рядків, усі «так»."}, "lesson": 4}, {"text": {"en": "Bookmarks: Ctrl+1 to Ctrl+5 for a low view along the kerb, a view of each bench, a lamp post close-up and a view from about 10 m up. Press 1 to 5 in turn and take bookmark1.png to bookmark5.png (Win+Shift+S). Check: pressing 1 to 5 jumps to each view, and you have five screenshots.", "uk": "Закладки: від Ctrl+1 до Ctrl+5 — низький вид уздовж бордюру, вид на кожну лавку, ліхтарний стовп зблизька і вид приблизно з 10 м угорі. Натискай по черзі від 1 до 5 і роби скриншоти від bookmark1.png до bookmark5.png (Win+Shift+S). Перевірка: клавіші від 1 до 5 перекидають на кожен вид, і в тебе є п'ять скриншотів."}, "lesson": 1}, {"text": {"en": "Press Play and walk the mannequin along the pavement past every prop. Check: the mannequin bumps into the bollards and the bin instead of walking through them.", "uk": "Натисни Play і проведи манекен тротуаром повз кожен пропс. Перевірка: манекен натикається на стовпчики й урну, а не проходить крізь них."}, "lesson": "D4.4"}, {"text": {"en": "Captures: before_after_day6.png (the empty Basic level and the finished street from bookmark 5) and a 60-second clip flying along the street at about 3 m high. Save today's clip as clip_day6.mp4. Check: both files are in today's Work folder.", "uk": "Знімки й запис: before_after_day6.png (порожній рівень Basic і готова вулиця із закладки 5) і 60-секундний кліп прольоту вздовж вулиці на висоті близько 3 м. Збережи сьогоднішній кліп як clip_day6.mp4. Перевірка: обидва файли лежать у сьогоднішній папці Work."}, "lesson": "D0.1"}]}, "lessons": [{"title": {"en": "The Unreal editor: viewport, Outliner, Details and bookmarks", "uk": "Редактор Unreal: в'юпорт, Outliner, Details і закладки"}, "minutes": 40, "goals": [{"en": "Name the main parts of the Unreal editor: the viewport, the Outliner, the Details panel, the Content Drawer and the toolbar.", "uk": "Називати головні частини редактора Unreal: в'юпорт, Outliner, панель Details, Content Drawer і панель інструментів (toolbar)."}, {"en": "Fly the viewport (hold the right mouse button with W, A, S, D, Q and E), focus with F, and switch move, rotate and scale with W, E and R.", "uk": "Літати у в'юпорті (утримуючи праву кнопку миші, з W, A, S, D, Q і E), фокусуватися через F і перемикати переміщення, обертання й масштаб клавішами W, E і R."}, {"en": "Make your own level (File > New Level > Basic), save it, put actors in an Outliner folder, and save camera bookmarks (Ctrl+1 to 9).", "uk": "Створювати власний рівень (File > New Level > Basic), зберігати його, складати актори в папку Outliner і зберігати закладки камери (від Ctrl+1 до 9)."}], "doalong": [{"en": "Open IslandCourse. Find the parts: the viewport (the big 3D view), the Outliner (top right: a list of every actor in the level; an actor is anything placed in a level), the Details panel (bottom right: the selected actor's settings) and the toolbar (along the top).", "uk": "Відкрий IslandCourse. Знайди частини: в'юпорт (великий 3D-вид), Outliner (угорі праворуч: список усіх акторів у рівні; актор — це будь-що, поставлене в рівень), панель Details (унизу праворуч: налаштування виділеного актора) і панель інструментів (уздовж верху)."}, {"en": "File > New Level > Basic > Create. You see a floor, a sky and light. File > Save Current Level As: open Course, make a new folder Day06, name the level L_Day06 and click Save.", "uk": "File > New Level > Basic > Create. Ти бачиш підлогу, небо і світло. File > Save Current Level As: відкрий Course, створи нову папку Day06, назви рівень L_Day06 і натисни Save."}, {"en": "Hold the right mouse button and fly with W, A, S and D; Q goes down and E goes up. Roll the mouse wheel while flying to change speed. Click the floor in the Outliner and press F: the view jumps to it.", "uk": "Утримуй праву кнопку миші й літай клавішами W, A, S і D; Q опускає, E піднімає. Під час польоту крути коліщатко миші, щоб змінити швидкість. Клацни на підлогу в Outliner і натисни F: вид перескакує до неї."}, {"en": "With the floor selected, press W, E and R: the move, rotate and scale tools. The arrows, rings and boxes you see are called a gizmo. Press W again, and Ctrl+Z if you moved anything.", "uk": "Коли підлогу виділено, натискай W, E і R: це інструменти переміщення, обертання й масштабу. Стрілки, кільця й кубики, які ти бачиш, називаються гізмо (gizmo). Знову натисни W, а якщо щось зрушилося — Ctrl+Z."}, {"en": "Ctrl+click two actors in the Outliner (for example the floor and the light), right-click > Move To > Create New Folder and name it Practice: the Outliner now groups them. Drag them back out and delete the folder.", "uk": "Через Ctrl+клацання виділи два актори в Outliner (наприклад, підлогу і світло), клацни правою кнопкою > Move To > Create New Folder і назви папку Practice: тепер Outliner групує їх. Перетягни їх назад і видали папку."}, {"en": "Frame a view you like and press Ctrl+1 to save it as bookmark 1. Fly away and press 1: you jump straight back.", "uk": "Вибери вид, який тобі подобається, і натисни Ctrl+1, щоб зберегти його як закладку 1. Відлети подалі й натисни 1: ти одразу повертаєшся."}], "play": {"en": "Treasure hunt: the tutor names five things to find in 3 minutes (the Location row in Details, the Outliner search box, the camera speed setting, the View Mode menu, the Save button); I send one screenshot of each.", "uk": "Пошук скарбів: тьютор називає п'ять речей, які треба знайти за 3 хвилини (рядок Location у Details, поле пошуку Outliner, налаштування швидкості камери, меню View Mode, кнопку Save); я надсилаю по скриншоту кожної."}, "video": {"url": "https://www.youtube.com/watch?v=Lzl4rdJn0zM", "title": "UE5.5 Editor Interface Fundamentals – From Zero to Hero!", "channel": "Savage Games", "length": "6:36", "search": "unreal engine 5 interface navigation beginner", "alt": {"url": "https://www.youtube.com/watch?v=1rMkLZ_fxvY", "title": "Unreal Engine 5 для початківців: встановлення та огляд інтерфейсу", "channel": "3DV Unreal Engine Archviz Academy"}}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: The Unreal editor: viewport, Outliner, Details and bookmarks (Day 6, lesson 1 of 4).\nToday's build: L_Day06: a 20 m practice street with your props placed to the centimetre.\n\nBy the end of this lesson I can:\n1. Name the main parts of the Unreal editor: the viewport, the Outliner, the Details panel, the Content Drawer and the toolbar.\n2. Fly the viewport (hold the right mouse button with W, A, S, D, Q and E), focus with F, and switch move, rotate and scale with W, E and R.\n3. Make your own level (File > New Level > Basic), save it, put actors in an Outliner folder, and save camera bookmarks (Ctrl+1 to 9).\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (Your first week is done: four clean street props stand at real scale in Unreal, each beside its real photo.), what I will learn today (You learn the Unreal editor properly and build L_Day06, a 20 m practice street with your props placed to the centimetre.), encourage me (A big new program feels big for everyone at first, and your tutor will walk you through each panel as often as you need.), and share today's quote: \"We are all apprentices in a craft where no one ever becomes a master.\" (Ernest Hemingway).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 3: Why must the origin sit in the middle before you add a Mirror modifier? | Day 1: Where does the origin go on a prop, and why?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Treasure hunt: the tutor names five things to find in 3 minutes (the Location row in Details, the Outliner search box, the camera speed setting, the View Mode menu, the Save button); I send one screenshot of each.\n6. Do-along on today's build (the pavement and the first bollards (in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Open IslandCourse. Find the parts: the viewport (the big 3D view), the Outliner (top right: a list of every actor in the level; an actor is anything placed in a level), the Details panel (bottom right: the selected actor's settings) and the toolbar (along the top).\n   - File > New Level > Basic > Create. You see a floor, a sky and light. File > Save Current Level As: open Course, make a new folder Day06, name the level L_Day06 and click Save.\n   - Hold the right mouse button and fly with W, A, S and D; Q goes down and E goes up. Roll the mouse wheel while flying to change speed. Click the floor in the Outliner and press F: the view jumps to it.\n   - With the floor selected, press W, E and R: the move, rotate and scale tools. The arrows, rings and boxes you see are called a gizmo. Press W again, and Ctrl+Z if you moved anything.\n   - Ctrl+click two actors in the Outliner (for example the floor and the light), right-click > Move To > Create New Folder and name it Practice: the Outliner now groups them. Drag them back out and delete the folder.\n   - Frame a view you like and press Ctrl+1 to save it as bookmark 1. Fly away and press 1: you jump straight back.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"UE5.5 Editor Interface Fundamentals – From Zero to Hero!\" by Savage Games: https://www.youtube.com/watch?v=Lzl4rdJn0zM\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "The Content Browser: folders, names and engine content", "uk": "Content Browser: папки, назви та вміст рушія"}, "minutes": 40, "goals": [{"en": "Use the Content Browser and the Content Drawer (Ctrl+Space) to make folders and find assets with search and filters.", "uk": "Користуватися Content Browser і Content Drawer (Ctrl+Space), щоб створювати папки й шукати асети через пошук і фільтри."}, {"en": "Show engine content (Settings > Show Engine Content) to find Unreal's basic shapes in /Engine/BasicShapes, and find the template's LevelPrototyping blocks.", "uk": "Вмикати показ вмісту рушія (Settings > Show Engine Content), щоб знаходити базові форми Unreal в /Engine/BasicShapes, і знаходити блоки LevelPrototyping із шаблону."}, {"en": "Name assets with the industry prefixes (SM_, M_, MI_, T_, L_) and clean up after moving them (Fix Up Redirectors).", "uk": "Називати асети з галузевими префіксами (SM_, M_, MI_, T_, L_) і прибирати після переміщення (Fix Up Redirectors)."}], "doalong": [{"en": "Press Ctrl+Space to open the Content Drawer and click Dock in Layout, so it stays open at the bottom of the editor.", "uk": "Натисни Ctrl+Space, щоб відкрити Content Drawer, і натисни Dock in Layout, щоб він лишався відкритим унизу редактора."}, {"en": "Open the LevelPrototyping folder. In Meshes you see SM_Cube, SM_ChamferCube, SM_Ramp and more; in Materials, MI_PrototypeGrid_Gray and others. These grey blocks are free for blockouts (quick, rough versions of a place).", "uk": "Відкрий папку LevelPrototyping. У Meshes ти бачиш SM_Cube, SM_ChamferCube, SM_Ramp та інші; у Materials — MI_PrototypeGrid_Gray та інші. Ці сірі блоки безкоштовні для блокаутів (швидких чорнових версій місця)."}, {"en": "Click Settings (top right of the Content Browser) and tick Show Engine Content. Open Engine > BasicShapes: Cube, Sphere, Cylinder, Cone and Plane. The Cube is exactly 1 m on every side.", "uk": "Натисни Settings (угорі праворуч у Content Browser) і познач Show Engine Content. Відкрий Engine > BasicShapes: Cube, Sphere, Cylinder, Cone і Plane. Cube має рівно 1 м з кожного боку."}, {"en": "Under Course/Day06, make the folders Meshes and Materials (right-click > New Folder).", "uk": "У Course/Day06 створи папки Meshes і Materials (клацни правою кнопкою > New Folder)."}, {"en": "Type bench in the search box: your SM_Bench in Course/Day05 appears. Clear the search. Click Filters > Static Mesh to see only meshes, then clear the filter.", "uk": "Введи bench у поле пошуку: з'являється твій SM_Bench з Course/Day05. Очисти пошук. Натисни Filters > Static Mesh, щоб бачити лише сітки, а тоді зніми фільтр."}, {"en": "Right-click the Course folder > Fix Up Redirectors (in some versions: Update Redirector References). A redirector is a small note Unreal leaves behind when you move an asset; fixing them keeps the folders clean.", "uk": "Клацни правою кнопкою на папці Course > Fix Up Redirectors (у деяких версіях: Update Redirector References). Редирект (redirector) — це маленька примітка, яку Unreal лишає, коли ти переміщуєш асет; виправлення редиректів тримає папки чистими."}], "play": {"en": "Tidy-up race: the tutor gives me eight messy names (bench_final2, Material.001, cube, wood texture, level new...); I rewrite them with the right prefixes in 2 minutes.", "uk": "Перегони прибирання: тьютор дає мені вісім безладних назв (bench_final2, Material.001, cube, wood texture, level new...); я переписую їх із правильними префіксами за 2 хвилини."}, "video": {"search": "unreal engine 5 content browser folders naming beginner"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: The Content Browser: folders, names and engine content (Day 6, lesson 2 of 4).\nToday's build: L_Day06: a 20 m practice street with your props placed to the centimetre.\nEarlier today I already did: lesson 1 (The Unreal editor: viewport, Outliner, Details and bookmarks). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Use the Content Browser and the Content Drawer (Ctrl+Space) to make folders and find assets with search and filters.\n2. Show engine content (Settings > Show Engine Content) to find Unreal's basic shapes in /Engine/BasicShapes, and find the template's LevelPrototyping blocks.\n3. Name assets with the industry prefixes (SM_, M_, MI_, T_, L_) and clean up after moving them (Fix Up Redirectors).\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Tidy-up race: the tutor gives me eight messy names (bench_final2, Material.001, cube, wood texture, level new...); I rewrite them with the right prefixes in 2 minutes.\n4. Do-along on today's build (the pavement and the first bollards (in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Press Ctrl+Space to open the Content Drawer and click Dock in Layout, so it stays open at the bottom of the editor.\n   - Open the LevelPrototyping folder. In Meshes you see SM_Cube, SM_ChamferCube, SM_Ramp and more; in Materials, MI_PrototypeGrid_Gray and others. These grey blocks are free for blockouts (quick, rough versions of a place).\n   - Click Settings (top right of the Content Browser) and tick Show Engine Content. Open Engine > BasicShapes: Cube, Sphere, Cylinder, Cone and Plane. The Cube is exactly 1 m on every side.\n   - Under Course/Day06, make the folders Meshes and Materials (right-click > New Folder).\n   - Type bench in the search box: your SM_Bench in Course/Day05 appears. Clear the search. Click Filters > Static Mesh to see only meshes, then clear the filter.\n   - Right-click the Course folder > Fix Up Redirectors (in some versions: Update Redirector References). A redirector is a small note Unreal leaves behind when you move an asset; fixing them keeps the folders clean.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Import settings: your import checklist and Reimport", "uk": "Налаштування імпорту: твій чек-лист імпорту і Reimport"}, "minutes": 40, "goals": [{"en": "Read the import window: where the mesh and its materials go, why Fallback Collision Type stays None when you bring your own UCX boxes, and why Generate Lightmap UVs stays off.", "uk": "Читати вікно імпорту: куди потрапляють сітка та її матеріали, чому Fallback Collision Type лишається None, коли ти приносиш власні блоки UCX, і чому Generate Lightmap UVs лишається вимкненим."}, {"en": "Write your own import checklist (import_checklist.md): the settings and checks you do every time.", "uk": "Писати власний чек-лист імпорту (import_checklist.md): налаштування й перевірки, які ти робиш щоразу."}, {"en": "Update a mesh after a Blender change with right-click > Reimport, without breaking what is placed.", "uk": "Оновлювати сітку після зміни в Blender через правий клік > Reimport, нічого не ламаючи з уже розставленого."}], "doalong": [{"en": "In Blender, open railing_day3.blend (skip anything you already did for Day 5's Gold). Rename the object SM_RailingSection and add three UCX boxes (one per post, one for the rails and bars together) named UCX_SM_RailingSection_00 to _02, with the railing's origin, as on Day 4.", "uk": "У Blender відкрий railing_day3.blend (пропусти те, що вже зроблено для Золота в День 5). Перейменуй об'єкт на SM_RailingSection і додай три блоки UCX (по одному на кожну стійку, один на поручні й балясини разом) з назвами від UCX_SM_RailingSection_00 до _02, з origin поруччя, як у День 4."}, {"en": "Export SM_RailingSection.fbx with the Day 4 FBX settings into today's Work folder, then press Ctrl+S to save the .blend file too.", "uk": "Експортуй SM_RailingSection.fbx з налаштуваннями FBX із Дня 4 у сьогоднішню папку Work, а тоді натисни Ctrl+S, щоб зберегти й файл .blend."}, {"en": "In Unreal, drag the FBX into Course/Day06/Meshes. Before you click Import, read each section of the import window. Type collision in its search box and check your Day 4 settings: Collision and Import Collision According To Mesh Name ticked, Fallback Collision Type None. Then type lightmap in the search box and untick Generate Lightmap UVs: you use UV channel 1 for a painted wear mask on Day 14, and Lumen (Unreal's lighting) does not need lightmap UVs.", "uk": "В Unreal перетягни FBX у Course/Day06/Meshes. Перш ніж натиснути Import, прочитай кожен розділ вікна імпорту. Введи collision у поле пошуку й перевір свої налаштування з Дня 4: Collision і Import Collision According To Mesh Name позначено, Fallback Collision Type — None. Потім введи lightmap у поле пошуку й зніми позначку Generate Lightmap UVs: UV-канал 1 знадобиться для намальованої маски зносу в День 14, а Lumen (освітлення Unreal) не потребує lightmap UV."}, {"en": "Look at what arrived: the mesh and its material. Drag the material into Course/Day06/Materials and choose Move Here.", "uk": "Подивися, що прибуло: сітка та її матеріал. Перетягни матеріал у Course/Day06/Materials і вибери Move Here."}, {"en": "Write import_checklist.md: the right day folder; Collision and Import Collision According To Mesh Name ticked, Fallback Collision Type None; Generate Lightmap UVs off (UV channel 1 is kept for a painted mask; Lumen needs no lightmap UVs); the name starts with SM_; materials moved to Materials; Approx Size checked in the Static Mesh Editor.", "uk": "Напиши import_checklist.md: правильна папка дня; Collision і Import Collision According To Mesh Name позначено, Fallback Collision Type — None; Generate Lightmap UVs вимкнено (UV-канал 1 залишено для намальованої маски; Lumen не потребує lightmap UV); назва починається з SM_; матеріали переміщено в Materials; Approx Size перевірено в Static Mesh Editor."}, {"en": "In Blender, make the top rail 1 cm taller, export again with the same name, then in Unreal right-click the mesh > Reimport. Any placed railing updates by itself.", "uk": "У Blender зроби верхній поручень на 1 см вищим, експортуй ще раз із тією самою назвою, а тоді в Unreal клацни правою кнопкою на сітці > Reimport. Кожне розставлене поруччя оновлюється саме."}], "play": {"en": "Break it, fix it: the tutor has me import my Day 0 cube_day0.glb twice into a scratch folder, once with Fallback Collision Type set to Box and once with None; I compare them in the Static Mesh Editor (Show > Simple Collision), say which one the mannequin could walk through and why, then delete both copies.", "uk": "Зламай і полагодь: тьютор просить мене двічі імпортувати мій cube_day0.glb з Дня 0 у тимчасову папку — один раз із Fallback Collision Type = Box, другий — із None; я порівнюю їх у Static Mesh Editor (Show > Simple Collision), кажу, крізь який із них манекен міг би пройти і чому, а тоді видаляю обидві копії."}, "video": {"url": "https://www.youtube.com/watch?v=TZkHmLMm0NM", "title": "Importing a Bookshelf to Unreal Engine with Interchange", "channel": "Timeless Tower", "length": "13:40", "search": "unreal engine 5 interchange import static mesh"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Import settings: your import checklist and Reimport (Day 6, lesson 3 of 4).\nToday's build: L_Day06: a 20 m practice street with your props placed to the centimetre.\nEarlier today I already did: lesson 1 (The Unreal editor: viewport, Outliner, Details and bookmarks); lesson 2 (The Content Browser: folders, names and engine content). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Read the import window: where the mesh and its materials go, why Fallback Collision Type stays None when you bring your own UCX boxes, and why Generate Lightmap UVs stays off.\n2. Write your own import checklist (import_checklist.md): the settings and checks you do every time.\n3. Update a mesh after a Blender change with right-click > Reimport, without breaking what is placed.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Break it, fix it: the tutor has me import my Day 0 cube_day0.glb twice into a scratch folder, once with Fallback Collision Type set to Box and once with None; I compare them in the Static Mesh Editor (Show > Simple Collision), say which one the mannequin could walk through and why, then delete both copies.\n4. Do-along on today's build (the pavement and the first bollards (in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - In Blender, open railing_day3.blend (skip anything you already did for Day 5's Gold). Rename the object SM_RailingSection and add three UCX boxes (one per post, one for the rails and bars together) named UCX_SM_RailingSection_00 to _02, with the railing's origin, as on Day 4.\n   - Export SM_RailingSection.fbx with the Day 4 FBX settings into today's Work folder, then press Ctrl+S to save the .blend file too.\n   - In Unreal, drag the FBX into Course/Day06/Meshes. Before you click Import, read each section of the import window. Type collision in its search box and check your Day 4 settings: Collision and Import Collision According To Mesh Name ticked, Fallback Collision Type None. Then type lightmap in the search box and untick Generate Lightmap UVs: you use UV channel 1 for a painted wear mask on Day 14, and Lumen (Unreal's lighting) does not need lightmap UVs.\n   - Look at what arrived: the mesh and its material. Drag the material into Course/Day06/Materials and choose Move Here.\n   - Write import_checklist.md: the right day folder; Collision and Import Collision According To Mesh Name ticked, Fallback Collision Type None; Generate Lightmap UVs off (UV channel 1 is kept for a painted mask; Lumen needs no lightmap UVs); the name starts with SM_; materials moved to Materials; Approx Size checked in the Static Mesh Editor.\n   - In Blender, make the top rail 1 cm taller, export again with the same name, then in Unreal right-click the mesh > Reimport. Any placed railing updates by itself.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Importing a Bookshelf to Unreal Engine with Interchange\" by Timeless Tower: https://www.youtube.com/watch?v=TZkHmLMm0NM\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Placing exactly: centimetres, snapping and End", "uk": "Точне розміщення: сантиметри, прив'язка і End"}, "minutes": 40, "goals": [{"en": "Turn plan metres into Unreal centimetres (multiply by 100) and type Location, Rotation and Scale in the Details panel.", "uk": "Переводити метри плану в сантиметри Unreal (множити на 100) і вводити Location, Rotation і Scale у панелі Details."}, {"en": "Set the grid snap in the viewport toolbar, drop actors onto the surface below with End, and copy them with Alt+drag.", "uk": "Налаштовувати прив'язку до сітки на панелі інструментів в'юпорта, опускати актори на поверхню під ними через End і копіювати їх через Alt+перетягування."}, {"en": "Make a surface of an exact size from the 1 m basic-shape cube and its Scale.", "uk": "Робити поверхню точного розміру з куба базових форм 1 м і його Scale."}], "doalong": [{"en": "Open Window > Place Actors, click Shapes and drag a Cube into the level. It is exactly 1 m on every side, with its origin in its centre.", "uk": "Відкрий Window > Place Actors, натисни Shapes і перетягни Cube у рівень. Він має рівно 1 м з кожного боку, а його origin — у центрі."}, {"en": "In Details > Transform type Location X 1000, Y 150, Z 7.5 and Scale 20, 3, 0.15: a pavement 20 m long, 3 m wide and 15 cm high, sitting on the floor. Rename it Pavement in the Outliner.", "uk": "У Details > Transform введи Location X 1000, Y 150, Z 7.5 і Scale 20, 3, 0.15: тротуар 20 м завдовжки, 3 м завширшки і 15 см заввишки, що лежить на підлозі. Перейменуй його на Pavement в Outliner."}, {"en": "In the toolbar along the top of the viewport, find the snapping buttons beside the move, rotate and scale tools. Click the grid snap button (a grid icon) so it is highlighted, then click the number beside it and choose 10: things now move in 10 cm steps. If your toolbar looks different, send the tutor a screenshot.", "uk": "На панелі інструментів уздовж верху в'юпорта знайди кнопки прив'язки біля інструментів переміщення, обертання й масштабу. Натисни кнопку прив'язки до сітки (значок сітки), щоб вона підсвітилася, а тоді клацни число поруч і вибери 10: тепер об'єкти рухаються кроками по 10 см. Якщо твоя панель виглядає інакше, надішли тьютору скриншот."}, {"en": "Drag SM_Bollard from Course/Day05 onto the pavement and press End: it drops onto the pavement top. Type Location X 100, Y 30 and press End again.", "uk": "Перетягни SM_Bollard з Course/Day05 на тротуар і натисни End: стовпчик опускається на верх тротуару. Введи Location X 100, Y 30 і знову натисни End."}, {"en": "Hold Alt and drag the bollard's red arrow: a copy follows. Type the copy's X as 250. Make three more copies at X 400, 550 and 700.", "uk": "Утримуй Alt і тягни червону стрілку стовпчика: за нею йде копія. Введи для копії X 250. Зроби ще три копії на X 400, 550 і 700."}, {"en": "Press Ctrl+S to save the level, and save bookmark 2 looking along the bollards.", "uk": "Натисни Ctrl+S, щоб зберегти рівень, і збережи закладку 2 з видом уздовж стовпчиків."}], "play": {"en": "Coordinates bingo: the tutor reads five plan points in metres; I type each into Details and send a screenshot; a point typed in the wrong unit (metres instead of centimetres) costs double.", "uk": "Бінго координат: тьютор читає п'ять точок плану в метрах; я вводжу кожну в Details і надсилаю скриншот; точка, введена не в тих одиницях (метри замість сантиметрів), коштує подвійно."}, "video": {"url": "https://www.youtube.com/watch?v=syBNq0wumkQ", "title": "The Ultimate Guide to SNAPPING in Unreal Engine! (Place Objects Quickly and Accurately)", "channel": "The RealTime Essentials", "length": "11:41", "search": "unreal engine 5 grid snapping"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Placing exactly: centimetres, snapping and End (Day 6, lesson 4 of 4).\nToday's build: L_Day06: a 20 m practice street with your props placed to the centimetre.\nEarlier today I already did: lesson 1 (The Unreal editor: viewport, Outliner, Details and bookmarks); lesson 2 (The Content Browser: folders, names and engine content); lesson 3 (Import settings: your import checklist and Reimport). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Turn plan metres into Unreal centimetres (multiply by 100) and type Location, Rotation and Scale in the Details panel.\n2. Set the grid snap in the viewport toolbar, drop actors onto the surface below with End, and copy them with Alt+drag.\n3. Make a surface of an exact size from the 1 m basic-shape cube and its Scale.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Coordinates bingo: the tutor reads five plan points in metres; I type each into Details and send a screenshot; a point typed in the wrong unit (metres instead of centimetres) costs double.\n4. Do-along on today's build (the pavement and the first bollards (in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Open Window > Place Actors, click Shapes and drag a Cube into the level. It is exactly 1 m on every side, with its origin in its centre.\n   - In Details > Transform type Location X 1000, Y 150, Z 7.5 and Scale 20, 3, 0.15: a pavement 20 m long, 3 m wide and 15 cm high, sitting on the floor. Rename it Pavement in the Outliner.\n   - In the toolbar along the top of the viewport, find the snapping buttons beside the move, rotate and scale tools. Click the grid snap button (a grid icon) so it is highlighted, then click the number beside it and choose 10: things now move in 10 cm steps. If your toolbar looks different, send the tutor a screenshot.\n   - Drag SM_Bollard from Course/Day05 onto the pavement and press End: it drops onto the pavement top. Type Location X 100, Y 30 and press End again.\n   - Hold Alt and drag the bollard's red arrow: a copy follows. Type the copy's X as 250. Make three more copies at X 400, 550 and 700.\n   - Press Ctrl+S to save the level, and save bookmark 2 looking along the bollards.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"The Ultimate Guide to SNAPPING in Unreal Engine! (Place Objects Quickly and Accurately)\" by The RealTime Essentials: https://www.youtube.com/watch?v=syBNq0wumkQ\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "import_checklist.md and placement_check.md", "uk": "import_checklist.md і placement_check.md"}, {"en": "folders.png (your Content Browser folder tree)", "uk": "folders.png (дерево папок твого Content Browser)"}, {"en": "bookmark1.png to bookmark5.png (one screenshot from each bookmark)", "uk": "від bookmark1.png до bookmark5.png (по одному скриншоту з кожної закладки)"}, {"en": "SM_RailingSection.fbx (with its UCX boxes)", "uk": "SM_RailingSection.fbx (з його блоками UCX)"}, {"en": "before_after_day6.png (the empty level and the finished street, same bookmark)", "uk": "before_after_day6.png (порожній рівень і готова вулиця, та сама закладка)"}, {"en": "clip_day6.mp4 (60 seconds along the street)", "uk": "clip_day6.mp4 (60 секунд уздовж вулиці)"}, {"en": "summary.md", "uk": "summary.md"}], "goal": {"en": "By the end of today you have your own level L_Day06 with a 20 m practice street made from basic shapes, your street props and railing placed at exact coordinates, and a tidy folder tree.", "uk": "До кінця дня в тебе є власний рівень L_Day06 із тренувальною вулицею завдовжки 20 м з базових форм, твої вуличні пропси й поруччя, розставлені за точними координатами, і охайне дерево папок."}, "uses": [{"en": "Day 5: your four street props in Course/Day05 (SM_Bollard, SM_Bench, SM_LampPost, SM_Bin)", "uk": "День 5: твої чотири вуличні пропси в Course/Day05 (SM_Bollard, SM_Bench, SM_LampPost, SM_Bin)"}, {"en": "Day 4: the clean FBX export and UCX boxes", "uk": "День 4: чистий експорт FBX і блоки UCX"}, {"en": "Day 3: the railing section", "uk": "День 3: секція поруччя"}], "quiz": [{"q": {"en": "Your plan puts a lamp post at 12.5 m along X. What do you type into Location X?", "uk": "За твоїм планом ліхтарний стовп стоїть на 12.5 м уздовж X. Що ввести в Location X?"}, "options": [{"en": "12.5", "uk": "12.5"}, {"en": "125", "uk": "125"}, {"en": "1250", "uk": "1250"}, {"en": "12500", "uk": "12500"}], "answer": 2, "explain": {"en": "Unreal counts in centimetres, so metres times 100: 12.5 m is 1250.", "uk": "Unreal рахує в сантиметрах, тож метри множимо на 100: 12.5 м — це 1250."}}, {"q": {"en": "You moved assets to a new folder, and the old folder still shows small arrow icons. What do you do?", "uk": "Ти переносиш асети в нову папку, а в старій папці досі видно маленькі значки-стрілки. Що зробити?"}, "options": [{"en": "Delete the old folder at once", "uk": "Одразу видалити стару папку"}, {"en": "Right-click the parent folder > Fix Up Redirectors", "uk": "Клацнути правою кнопкою на батьківській папці > Fix Up Redirectors"}, {"en": "Reimport every asset", "uk": "Зробити Reimport кожного асета"}], "answer": 1, "explain": {"en": "Redirectors are notes left behind after a move. Fix Up Redirectors updates every link and removes them safely.", "uk": "Редиректи — це примітки, що лишаються після переміщення. Fix Up Redirectors оновлює кожне посилання й безпечно їх прибирає."}}, {"q": {"en": "You need a pavement 20 m long, 3 m wide and 15 cm high from the 1 m basic-shape cube. Which Scale do you type?", "uk": "Тобі потрібен тротуар 20 м завдовжки, 3 м завширшки і 15 см заввишки з куба базових форм 1 м. Який Scale ввести?"}, "options": [{"en": "20, 3, 0.15", "uk": "20, 3, 0.15"}, {"en": "2000, 300, 15", "uk": "2000, 300, 15"}, {"en": "2, 0.3, 0.015", "uk": "2, 0.3, 0.015"}], "answer": 0, "explain": {"en": "The cube is 1 m, so the Scale is the size in metres. Location is in centimetres; Scale is a multiplier.", "uk": "Куб має 1 м, тож Scale — це розмір у метрах. Location вимірюється в сантиметрах, а Scale — це множник."}}, {"q": {"en": "You change a railing in Blender and export it again with the same name. How do you update it in Unreal?", "uk": "Ти змінюєш поруччя в Blender і знову експортуєш його з тією самою назвою. Як оновити його в Unreal?"}, "options": [{"en": "Import it again into a new folder", "uk": "Імпортувати ще раз у нову папку"}, {"en": "Delete the placed railings and place them again", "uk": "Видалити розставлені поруччя й поставити їх знову"}, {"en": "Right-click the mesh in the Content Browser > Reimport", "uk": "Клацнути правою кнопкою на сітці в Content Browser > Reimport"}], "answer": 2, "explain": {"en": "Reimport replaces the mesh in place, and every placed copy updates by itself.", "uk": "Reimport замінює сітку на місці, і кожна розставлена копія оновлюється сама."}}, {"q": {"en": "Months from now, you can't find your bench in the project. Which habit would have helped most?", "uk": "Через кілька місяців ти не можеш знайти свою лавку в проєкті. Яка звичка допомогла б найбільше?"}, "options": [{"en": "Keeping everything in the Content folder", "uk": "Тримати все в папці Content"}, {"en": "Prefixes like SM_ and M_ and one folder per day", "uk": "Префікси на кшталт SM_ і M_ та окрема папка на кожен день"}, {"en": "Very long file names", "uk": "Дуже довгі назви файлів"}], "answer": 1, "explain": {"en": "Prefixes and a clear folder tree let anyone search and filter their way to an asset in seconds.", "uk": "Префікси й зрозуміле дерево папок дають змогу будь-кому знайти асет пошуком і фільтрами за секунди."}}], "weekInfo": {"week": 2, "title": {"en": "Modular kits", "uk": "Модульні набори"}, "goal": {"en": "By Friday you have your own harbour and building kit on a metric grid, and L_KitTest: a quay, a pier and a harbour house built from it in Unreal, with the house saved as a Level Instance.", "uk": "До п'ятниці в тебе є власний набір для гавані й будівель на метричній сітці та L_KitTest: причал, пірс і портовий будинок, зібрані з цього набору в Unreal, а будинок збережено як Level Instance."}, "skills": [{"en": "Modular kit design on a metric grid with consistent pivots", "uk": "Дизайн модульного набору на метричній сітці з узгодженими півотами"}, {"en": "Unreal Engine 5 level assembly: import pipeline, exact placement and snapping", "uk": "Збирання рівня в Unreal Engine 5: пайплайн імпорту, точне розміщення та прив'язка (snapping)"}, {"en": "Nanite versus LOD decisions for real-time performance", "uk": "Вибір між Nanite і LOD заради продуктивності в реальному часі"}, {"en": "Level Instances for reusable building sets", "uk": "Level Instances для наборів будівель, які можна використовувати багато разів"}, {"en": "Content Browser organisation and industry naming conventions (SM_, M_, MI_, T_, L_)", "uk": "Організація Content Browser і галузеві правила назв (SM_, M_, MI_, T_, L_)"}]}, "morning": {"sofar": {"en": "Your first week is done: four clean street props stand at real scale in Unreal, each beside its real photo.", "uk": "Перший тиждень позаду: чотири чисті вуличні пропси стоять у справжньому масштабі в Unreal, кожен поруч зі своєю справжньою фотографією."}, "today": {"en": "You learn the Unreal editor properly and build L_Day06, a 20 m practice street with your props placed to the centimetre.", "uk": "Сьогодні ти ґрунтовно знайомишся з редактором Unreal і будуєш L_Day06 — 20-метрову тренувальну вулицю, де твої пропси розставлено з точністю до сантиметра."}, "cheer": {"en": "A big new program feels big for everyone at first, and your tutor will walk you through each panel as often as you need.", "uk": "Велика нова програма спершу здається величезною кожному, а тьютор проведе тебе кожною панеллю стільки разів, скільки потрібно."}, "quote": {"text": {"en": "We are all apprentices in a craft where no one ever becomes a master.", "uk": "Усі ми — учні в ремеслі, де ніхто ніколи не стає майстром."}, "author": {"en": "Ernest Hemingway", "uk": "Ернест Гемінгвей"}, "source": "https://en.wikiquote.org/wiki/Ernest_Hemingway"}}, "hasAssets": false, "workPath": "Work\\Assignment\\Day-06-unreal-first-steps", "mapHref": "../../COURSE.html", "prevHref": "../Day-05-boss-street-props/START-HERE.html", "nextHref": "../Day-07-harbour-kit-quay-and-pier/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8 (and Blender for one export). I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me and don't write code. Keep me moving and make it feel like a game.\n\nToday I build on my own: The rest of the street, placed from the list, on your own.\nIt's part of: L_Day06: a 20 m practice street with your props placed to the centimetre (Your practice level L_Day06 in Course/Day06. You use the same skills to place everything on your island from Day 26.).\n\nSpec:\n- A new level L_Day06 (File > New Level > Basic), saved in Course/Day06.\n- Folders Course/Day06/Meshes and Course/Day06/Materials; nothing of yours loose in the Content folder.\n- Names with the industry prefixes: SM_ for static meshes, M_ for materials, MI_ for material instances, T_ for textures, L_ for levels.\n- A practice street from basic-shape cubes: a pavement 20 m long, 3 m wide and 0.15 m high, and a road beside it, typed to exact Location and Scale.\n- Props at the placement list's points (metres x 100 = Unreal centimetres): five bollards 1.5 m apart along the kerb, two lamp posts 8 m apart, two benches, two bins and the railing section, each dropped onto the pavement with End.\n- SM_RailingSection imported from a clean FBX with UCX boxes into Course/Day06/Meshes, and import_checklist.md written.\n- placement_check.md, an Outliner folder named Street, and five camera bookmarks (Ctrl+1 to Ctrl+5).\n\nMy checklist:\n1. Road: drag another Cube from Place Actors > Shapes and type Location X 1000, Y -300, Z 1 and Scale 20, 6, 0.02: a road 2 cm thick lying on the floor (a road exactly level with the floor would flicker against it). Name it Road. Check: the road lies flat with no flicker, and from a low view the pavement stands about 13 cm above it like a kerb. (from lesson 4)\n2. Bollards: make sure all five bollards (X 100, 250, 400, 550 and 700, Y 30) are on the pavement; select each and press End. Check: from a low view, every bollard base touches the pavement top. (from lesson 4)\n3. Lamp posts: place SM_LampPost at X 600, Y 50 and X 1400, Y 50, then press End on each. Check: the lamps stand on the pavement, 8 m apart. (from lesson 4)\n4. Benches: place SM_Bench at X 1000, Y 220 and X 1700, Y 220, and turn each with Rotation Z (in steps of 90) until it faces the road. Press End. Check: both benches face the road with their backs to the far side of the pavement. (from lesson 4)\n5. Bins: place SM_Bin at X 1150, Y 250 and X 1850, Y 250, then press End. Check: each bin stands just beside a bench. (from lesson 4)\n6. Railing: place SM_RailingSection at X 300, Y 290 along the back edge of the pavement and turn it with Rotation Z until it runs along the street. Press End. Check: the railing stands on the pavement's back edge and runs parallel to the kerb. (from lesson 4)\n7. Surfaces: from LevelPrototyping > Materials, drag MI_PrototypeGrid_Gray onto the pavement and a different material from the same folder onto the road. Check: you can tell the pavement from the road at a glance. (from lesson 2)\n8. Outliner: select all props (Ctrl+click), right-click > Move To > Create New Folder and name it Street. Check: the Outliner shows a Street folder holding every prop. (from lesson 1)\n9. Content Browser: make sure the railing and its material sit in Course/Day06/Meshes and /Materials, then right-click Course > Fix Up Redirectors. Take folders.png of the Content Browser's folder tree (Win+Shift+S). Check: no asset of yours is loose in the Content folder. (from lesson 2)\n10. Write placement_check.md: for each prop, the plan point in metres, the X and Y you typed, and yes or no for 'on the pavement, not floating'. Check: twelve lines, all yes. (from lesson 4)\n11. Bookmarks: Ctrl+1 to Ctrl+5 for a low view along the kerb, a view of each bench, a lamp post close-up and a view from about 10 m up. Press 1 to 5 in turn and take bookmark1.png to bookmark5.png (Win+Shift+S). Check: pressing 1 to 5 jumps to each view, and you have five screenshots. (from lesson 1)\n12. Press Play and walk the mannequin along the pavement past every prop. Check: the mannequin bumps into the bollards and the bin instead of walking through them. (from day 4, lesson 4)\n13. Captures: before_after_day6.png (the empty Basic level and the finished street from bookmark 5) and a 60-second clip flying along the street at about 3 m high. Save today's clip as clip_day6.mp4. Check: both files are in today's Work folder. (from day 0, lesson 1)\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Denis\nDay 6: Unreal first steps: the editor, folders, import settings and exact placing. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nMade: <file names>\nTo look at: <screenshots,  h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p><div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+list(D.handin,'ul','ticks')+'<p class="path">'+ic('folder')+'<span>'+u('shipTo')+' <code>'+esc(D.workPath)+'</code></span></p>'+(D.lessons.length?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<p class="muted">'+u('report')+'</p><div class="row"><button class="btn s" onclick="cp(D.reportPrompt)">'+ic('copy')+u('copyR')+'</button></div></section>';
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();

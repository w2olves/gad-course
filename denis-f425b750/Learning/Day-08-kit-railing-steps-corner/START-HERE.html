<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 8</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.b{background:linear-gradient(145deg,#ff8cc4,#d6337e);box-shadow:0 10px 24px -8px rgba(255,95,168,.6),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.s{background:linear-gradient(145deg,#5fe39a,#16a34a);box-shadow:0 10px 24px -8px rgba(74,222,128,.55),inset 0 1px 0 rgba(255,255,255,.35)}

/* the Done switch */
.sw{display:inline-flex;align-items:center;gap:12px;border:0;background:transparent;cursor:pointer;font:600 14px/1 var(--head);color:var(--muted);min-height:50px;padding:0 6px}
.sw .tr{position:relative;width:58px;height:32px;border-radius:999px;background:var(--well);box-shadow:var(--press);transition:background .25s}

.sw[aria-pressed=true] .tr::after{left:30px;background:#fff}
details{margin-top:22px;border-radius:20px;background:var(--well);box-shadow:var(--press);padding:0 18px}

.vid{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;margin-top:20px;font-size:15px;padding:16px 18px;border-radius:20px}

/* build */
.build.bossday{border-color:rgba(255,95,168,.35)}

.medal{display:flex;align-items:center;gap:10px;margin:0 0 8px;font:700 11.5px/1 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}

.check input::after{content:"";width:10px;height:5px;border:solid #fff;border-width:0 0 2.2px 2.2px;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.check input:checked{background:linear-gradient(145deg,#5fe39a,#16a34a);box-shadow:0 0 12px rgba(74,222,128,.55)}

.check li.on .tx{color:var(--faint)}
.check .ln{font:600 10.5px/1.3 var(--head);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);white-space:nowrap;margin-top:5px;padding:4px 9px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
/* quiz */
.pips{display:flex;gap:8px;margin:0 0 4px;padding:10px 14px;border-radius:999px;width:max-content;max-width:100%;flex-wrap:wrap}

.qz{margin:28px 0 0;padding:28px 0 0;border-top:1px solid var(--line)}

.opt{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;width:calc(100% - 50px);margin:12px 0 12px 50px;text-align:left;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid transparent;border-radius:18px;padding:11px 16px;cursor:pointer;box-shadow:var(--raiseS);transition:box-shadow .2s,transform .15s}

.opt:hover:not([disabled]){transform:translateY(-1px);color:var(--accT)}
.opt.right{box-shadow:var(--press);background:var(--okBg);border-color:rgba(74,222,128,.45)}.opt.right .lt{background:var(--okL);color:#fff;box-shadow:0 0 10px var(--okL)}.opt.right .mk{color:var(--ok)}
.opt.wrong{box-shadow:var(--press);background:var(--badBg);border-color:rgba(255,93,93,.45)}.opt.wrong .lt{background:var(--badL);color:#fff;box-shadow:0 0 10px var(--badL)}.opt.wrong .mk{color:var(--bad)}
.opt[disabled]{cursor:default}
.opt[disabled]:not(.right):not(.wrong){opacity:.55;box-shadow:none}
.exp{margin:10px 0 0 50px;font-size:15.5px;color:var(--muted)}

.exp.r b{color:var(--ok)}.exp.w b{color:var(--bad)}
.score{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:32px;padding:18px 20px;border-radius:24px}

.score .row{margin:0 0 0 auto}
/* ship */
.path{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;margin:22px 0 12px}

#toast{position:fixed;left:50%;bottom:28px;z-index:9;transform:translateX(-50%) translateY(16px);background:rgba(30,33,46,.82);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:#f4f5fa;border:1px solid rgba(255,255,255,.14);padding:13px 24px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none;font:600 14px/1.4 var(--head);max-width:min(92vw,560px);text-align:center;box-shadow:0 20px 40px -14px rgba(0,0,0,.5),0 0 24px var(--glow)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

 body{font-size:16.5px}

<script id="data" type="application/json">{"learner": "ib-denis-f425b750", "learnerName": {"en": "Denis", "uk": "Денис"}, "day": 8, "week": 2, "total": 60, "title": {"en": "More kit pieces: railing, steps and a corner, and Nanite versus LODs", "uk": "Більше деталей набору: поруччя, сходи й кут, а також Nanite проти LOD"}, "theme": {"en": "Week 2: Modular kits", "uk": "Тиждень 2: Модульні набори"}, "build": {"item": {"en": "Your harbour kit, part 2: SM_Railing_2m, SM_RailingPost, SM_Steps and SM_QuayCorner_Out", "uk": "Твій набір для гавані, частина 2: SM_Railing_2m, SM_RailingPost, SM_Steps і SM_QuayCorner_Out"}, "why": {"en": "Straight pieces alone only build straight harbours. Railings, steps and corners make a kit build a real place, and each must follow the same grid and pivot rules. Studios also decide how each piece is drawn: with Nanite (Unreal's system that draws detailed solid meshes cheaply at any distance) or with LODs (levels of detail: lighter copies that swap in when a mesh is far away). Deciding this early keeps a big island running smoothly.", "uk": "Самі лише прямі деталі будують тільки прямі гавані. Поруччя, сходи й кути дають змогу зібрати з набору справжнє місце, і кожна така деталь має дотримуватися тих самих правил сітки й півота. Студії також вирішують, як малюється кожна деталь: через Nanite (систему Unreal, яка дешево малює детальні суцільні сітки на будь-якій відстані) чи через LOD (рівні деталізації: легші копії, які підставляються, коли сітка далеко). Якщо вирішити це рано, великий острів працюватиме плавно."}, "where": {"en": "Your island's waterfront (district 1): railings along the pier, steps down to a boat landing, and a corner where the quay turns. Today in Course/Day08.", "uk": "Набережна твого острова (район 1): поруччя вздовж пірса, сходи вниз до майданчика для човнів і кут, де причал повертає. Сьогодні — у Course/Day08."}, "spec": [{"en": "kit_rules.md updated: the naming pattern, the new pieces, and one line per piece: Nanite or LODs, and why.", "uk": "Оновлений kit_rules.md: шаблон назв, нові деталі й по рядку на кожну деталь: Nanite чи LOD і чому."}, {"en": "SM_Railing_2m: from your Day 3 railing, exactly 2 m long, with one post at its start only, so railings chain without double posts; pivot at the bottom centre of the start post (Z = 0 on the deck).", "uk": "SM_Railing_2m: з твого поруччя з Дня 3, рівно 2 м завдовжки, зі стійкою лише на початку, щоб поруччя з'єднувалися в ланцюжок без подвійних стійок; півот унизу по центру початкової стійки (Z = 0 на настилі)."}, {"en": "SM_RailingPost: the single post, to finish a run.", "uk": "SM_RailingPost: окрема стійка, щоб завершити ряд."}, {"en": "SM_Steps: 2 m wide, 5 steps going down 0.8 m to a boat landing over 2 m (treads 0.4 m, risers 0.16 m), built against the quay's water face; pivot at the top corner at the start, on the wall line.", "uk": "SM_Steps: 2 м завширшки, 5 сходинок, що спускаються на 0.8 м до майданчика для човнів на відстані 2 м (проступи 0.4 м, підступенки 0.16 м), збудовані біля стіни причалу з боку води; півот у верхньому куті на початку, на лінії стіни."}, {"en": "SM_QuayCorner_Out: a 2 x 2 m outer corner, 3 m deep, with coping along its two water sides, matching SM_QuayEdge_4m exactly.", "uk": "SM_QuayCorner_Out: зовнішній кут 2 x 2 м, 3 м завглибшки, з бровкою вздовж обох боків, що виходять до води, точно під SM_QuayEdge_4m."}, {"en": "Every piece exported from the world origin with UCX boxes and M_Stone or M_Timber; triangles under 2,000 each.", "uk": "Кожну деталь експортовано з центру світу з блоками UCX і M_Stone або M_Timber; менше 2 000 трикутників на кожну."}, {"en": "In Unreal (Course/Day08, level L_Day08): Nanite on for the steps, the corner, the quay and the deck; 3 LODs on SM_Railing_2m; the new pieces snapped to your Day 7 quay and pier with no gaps.", "uk": "В Unreal (Course/Day08, рівень L_Day08): Nanite увімкнено для сходів, кута, причалу й настилу; 3 LOD на SM_Railing_2m; нові деталі з'єднано з твоїм причалом і пірсом із Дня 7 без щілин."}], "piece1": "SM_Railing_2m, SM_RailingPost and the first SM_Steps (in the lessons)", "piece2": {"en": "SM_Steps finished, SM_QuayCorner_Out, and the pieces placed with Nanite and LODs, on your own", "uk": "Завершені SM_Steps, SM_QuayCorner_Out і деталі, розставлені з Nanite та LOD, самостійно"}, "steps": [{"text": {"en": "SM_Steps: put the origin on the pivot (Shift+S > Cursor to World Origin, then Origin to 3D Cursor) and name the object SM_Steps. Check: the orange dot sits on the wall line at deck height (Z 0), 16 cm above the top step's back corner, and Location reads 0, 0, 0.", "uk": "SM_Steps: постав origin на півот (Shift+S > Cursor to World Origin, потім Origin to 3D Cursor) і назви об'єкт SM_Steps. Перевірка: помаранчева точка стоїть на лінії стіни на висоті поверхні причалу (Z 0), на 16 см вище заднього кута верхньої сходинки, а Location показує 0, 0, 0."}, "lesson": 2}, {"text": {"en": "Give SM_Steps M_Stone and five UCX boxes, one per step, each the size of that step's block (from its tread down to Z -1.0), named UCX_SM_Steps_00 to _04. Check: from the side, the boxes follow the steps like a staircase.", "uk": "Дай SM_Steps матеріал M_Stone і п'ять блоків UCX, по одному на сходинку, кожен розміром із брусок цієї сходинки (від її проступу донизу до Z -1.0), з назвами від UCX_SM_Steps_00 до _04. Перевірка: збоку блоки йдуть за сходинками, як сходи."}, "lesson": "D4.3"}, {"text": {"en": "SM_QuayCorner_Out: hide the other pieces, add a cube 2 x 2 x 3 m with the scale applied, and move it with G X 1, G Y -1, G Z -1.5. Check: the block runs from X 0 to 2 and Y 0 to -2, hanging 3 m down from Z 0.", "uk": "SM_QuayCorner_Out: сховай інші деталі, додай куб 2 x 2 x 3 м із застосованим масштабом і перемісти його через G X 1, G Y -1, G Z -1.5. Перевірка: брусок іде від X 0 до 2 і від Y 0 до -2 і звисає на 3 м донизу від Z 0."}, "lesson": 2}, {"text": {"en": "Corner coping: a cube 2.05 x 0.45 x 0.2 m at X 1.025, Y -1.825 (the front water side), and a cube 0.45 x 1.6 x 0.2 m at X 1.825, Y -0.8 (the right water side), both at Z 0. Check: from above (Numpad 7) the coping makes an L round the corner, with a 5 cm overhang on both water sides.", "uk": "Бровка кута: куб 2.05 x 0.45 x 0.2 м на X 1.025, Y -1.825 (передній бік до води) і куб 0.45 x 1.6 x 0.2 м на X 1.825, Y -0.8 (правий бік до води), обидва на Z 0. Перевірка: згори (Numpad 7) бровка утворює літеру L навколо кута з виступом 5 см з обох боків до води."}, "lesson": 2}, {"text": {"en": "Bevel the coping (Amount 0.01 m, Segments 2) and apply it; add 5 loop cuts on the wall for stone rows, as on SM_QuayEdge_4m. Check: the stone rows line up in height with the straight piece's rows.", "uk": "Зроби фаску на бровці (Amount 0.01 м, Segments 2) і застосуй її; додай 5 петлевих розрізів на стіні для рядів каміння, як на SM_QuayEdge_4m. Перевірка: ряди каміння за висотою збігаються з рядами прямої деталі."}, "lesson": "D7.3"}, {"text": {"en": "Join the coping into the block, name it SM_QuayCorner_Out, put the origin on the pivot, give it M_Stone and add three UCX boxes (the block and the two coping strips). Check: Location 0, 0, 0 and three names starting with UCX_SM_QuayCorner_Out_.", "uk": "Приєднай бровку до бруска, назви його SM_QuayCorner_Out, постав origin на півот, дай йому M_Stone і додай три блоки UCX (брусок і дві смуги бровки). Перевірка: Location 0, 0, 0 і три назви, що починаються з UCX_SM_QuayCorner_Out_."}, "lesson": "D4.3"}, {"text": {"en": "Grid test in Blender: show SM_QuayEdge_4m, Shift+D the corner and move the copy to X 4 with snapping on. Look closely at the join, then delete the copy. Check: the coping and the stone rows run straight from the quay into the corner.", "uk": "Тест сітки в Blender: покажи SM_QuayEdge_4m, зроби Shift+D кута й посунь копію на X 4 з увімкненою прив'язкою. Уважно роздивися стик, а тоді видали копію. Перевірка: бровка й ряди каміння йдуть рівно від причалу в кут."}, "lesson": "D7.2"}, {"text": {"en": "Check every new piece sits at the world origin with fewer than 2,000 triangles, then export SM_Steps.fbx and SM_QuayCorner_Out.fbx with their UCX boxes. Check: two FBX files in today's Work folder.", "uk": "Перевір, що кожна нова деталь стоїть у центрі світу й має менше 2 000 трикутників, а тоді експортуй SM_Steps.fbx і SM_QuayCorner_Out.fbx з їхніми блоками UCX. Перевірка: два файли FBX у сьогоднішній папці Work."}, "lesson": "D4.4"}, {"text": {"en": "Import both into Course/Day08 and switch on Nanite for each (Static Mesh Editor > Nanite Settings > Enable Nanite Support > Apply Changes); do the same for SM_QuayEdge_4m and SM_PierDeck_4m. Take nanite_overview.png. Check: in View Mode > Nanite Visualization > Overview, the quay, deck, steps and corner all show in colour.", "uk": "Імпортуй обидва в Course/Day08 і ввімкни Nanite для кожного (Static Mesh Editor > Nanite Settings > Enable Nanite Support > Apply Changes); зроби те саме для SM_QuayEdge_4m і SM_PierDeck_4m. Зроби nanite_overview.png. Перевірка: у View Mode > Nanite Visualization > Overview причал, настил, сходи й кут — усі кольорові."}, "lesson": 3}, {"text": {"en": "In L_Day08, place the corner at the end of the quay run and the steps against the quay's water face beside the pier, joining them with vertex snap. Check: the corner's coping continues the quay's coping, and the top step sits just below the deck.", "uk": "У L_Day08 постав кут у кінці ряду причалу, а сходи — біля стіни причалу з боку води поруч із пірсом, з'єднавши їх через прив'язку до вершин. Перевірка: бровка кута продовжує бровку причалу, а верхня сходинка лежить трохи нижче поверхні причалу."}, "lesson": "D7.4"}, {"text": {"en": "Railings: run SM_Railing_2m along both sides of the pier with vertex snap (six per side) and finish each run with SM_RailingPost. Check: posts every 2 m, no double posts, and a post at each end.", "uk": "Поруччя: постав SM_Railing_2m уздовж обох боків пірса через прив'язку до вершин (по шість з кожного боку) і заверши кожен ряд стійкою SM_RailingPost. Перевірка: стійки кожні 2 м, жодних подвійних стійок, і по стійці на кожному кінці."}, "lesson": 1}, {"text": {"en": "Fly slowly along a railing in View Mode > Level of Detail Coloration > Mesh LODs and take lod_coloration.png. Check: the colours change with distance, and in Lit view you can't see the swap happen.", "uk": "Повільно пролети вздовж поруччя у View Mode > Level of Detail Coloration > Mesh LODs і зроби lod_coloration.png. Перевірка: кольори змінюються з відстанню, а в режимі Lit заміни не видно."}, "lesson": 4}, {"text": {"en": "Write one line per kit piece in kit_rules.md: Nanite or LODs, and why. Check: six pieces, six lines.", "uk": "Запиши в kit_rules.md по рядку на кожну деталь набору: Nanite чи LOD і чому. Перевірка: шість деталей — шість рядків."}, "lesson": 3}, {"text": {"en": "Captures: before_after_day8.png (the Day 7 quay and pier beside today's version, same bookmark) and a 60-second clip: along the railing, down past the steps and round the corner. Save today's clip as clip_day8.mp4. Check: both files are in today's Work folder.", "uk": "Знімки й запис: before_after_day8.png (причал і пірс із Дня 7 поруч із сьогоднішньою версією, та сама закладка) і 60-секундний кліп: уздовж поруччя, вниз повз сходи й навколо кута. Збережи сьогоднішній кліп як clip_day8.mp4. Перевірка: обидва файли лежать у сьогоднішній папці Work."}, "lesson": "D0.1"}]}, "lessons": [{"title": {"en": "Kit names, and SM_Railing_2m from your Day 3 railing", "uk": "Назви деталей набору і SM_Railing_2m із твого поруччя з Дня 3"}, "minutes": 40, "goals": [{"en": "Name kit pieces with one pattern: SM_ + what it is + its size or type (SM_Railing_2m, SM_QuayCorner_Out).", "uk": "Називати деталі набору за одним шаблоном: SM_ + що це + розмір або тип (SM_Railing_2m, SM_QuayCorner_Out)."}, {"en": "Explain why a chaining piece has a post at one end only, and why a run needs an end piece (SM_RailingPost).", "uk": "Пояснювати, чому деталь для ланцюжка має стійку лише з одного кінця і чому ряду потрібна кінцева деталь (SM_RailingPost)."}, {"en": "Move a piece's origin to the kit pivot and test that two copies chain exactly.", "uk": "Переносити origin деталі на півот набору й перевіряти, що дві копії точно з'єднуються в ланцюжок."}], "doalong": [{"en": "Open railing_day3.blend and use File > Save As to save railing_day8.blend in today's Work folder. If the file has the three UCX boxes from Day 6, delete them: you make new ones today.", "uk": "Відкрий railing_day3.blend і через File > Save As збережи railing_day8.blend у сьогоднішній папці Work. Якщо у файлі є три блоки UCX із Дня 6, видали їх: сьогодні ти зробиш нові."}, {"en": "Select SM_RailingSection, press Tab, hover over the right-hand post and press L to select it. Press P > Selection: the post becomes its own object. Tab out. Name the post SM_RailingPost and the railing SM_Railing_2m.", "uk": "Виділи SM_RailingSection, натисни Tab, наведи мишу на праву стійку й натисни L, щоб виділити її. Натисни P > Selection: стійка стає окремим об'єктом. Вийди з Edit Mode (Tab). Назви стійку SM_RailingPost, а поруччя — SM_Railing_2m."}, {"en": "Put the railing's pivot at the bottom of its left post: Tab, press 3, click the post's bottom face, Shift+S > Cursor to Selected, Tab out, then Object > Set Origin > Origin to 3D Cursor. Press Alt+G: the railing moves so its pivot sits on the world origin.", "uk": "Постав півот поруччя внизу його лівої стійки: Tab, натисни 3, клацни нижню грань стійки, Shift+S > Cursor to Selected, вийди з Edit Mode (Tab), потім Object > Set Origin > Origin to 3D Cursor. Натисни Alt+G: поруччя переміщується так, що його півот стає в центр світу."}, {"en": "Test the chain: with snapping on, Shift+D and type X 2 Enter. The copy's post sits exactly where the first railing's rails end. Delete the copy.", "uk": "Перевір ланцюжок: з увімкненою прив'язкою зроби Shift+D і введи X 2 Enter. Стійка копії стоїть точно там, де закінчуються поручні першого поруччя. Видали копію."}, {"en": "Do the same for SM_RailingPost: its origin at its bottom centre, then Alt+G. Hide it.", "uk": "Зроби те саме для SM_RailingPost: origin унизу по центру, потім Alt+G. Сховай стійку."}, {"en": "Add UCX boxes: UCX_SM_Railing_2m_00 (the post) and _01 (the rails and bars), and UCX_SM_RailingPost_00, each with its own piece's origin. Export SM_Railing_2m.fbx and SM_RailingPost.fbx, one at a time, each with its boxes.", "uk": "Додай блоки UCX: UCX_SM_Railing_2m_00 (стійка) і _01 (поручні й балясини), а також UCX_SM_RailingPost_00, кожен з origin своєї деталі. Експортуй SM_Railing_2m.fbx і SM_RailingPost.fbx по одному, кожен зі своїми блоками."}], "play": {"en": "Name police: the tutor reads ten piece names from an imaginary kit (Railing2, sm_steps, SM_Quay_Corner_outside_v3, wall final...); I rewrite each one with the course pattern in 3 minutes.", "uk": "Поліція назв: тьютор читає десять назв деталей з уявного набору (Railing2, sm_steps, SM_Quay_Corner_outside_v3, wall final...); я переписую кожну за шаблоном курсу за 3 хвилини."}, "video": {"search": "modular kit naming convention unreal engine"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Kit names, and SM_Railing_2m from your Day 3 railing (Day 8, lesson 1 of 4).\nToday's build: Your harbour kit, part 2: SM_Railing_2m, SM_RailingPost, SM_Steps and SM_QuayCorner_Out.\n\nBy the end of this lesson I can:\n1. Name kit pieces with one pattern: SM_ + what it is + its size or type (SM_Railing_2m, SM_QuayCorner_Out).\n2. Explain why a chaining piece has a post at one end only, and why a run needs an end piece (SM_RailingPost).\n3. Move a piece's origin to the kit pivot and test that two copies chain exactly.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (Your harbour kit has begun: a stone quay edge and a timber pier deck that snap together on a metric grid.), what I will learn today (You add a railing, a post, steps and an outer corner to the kit, and decide for each piece whether it uses Nanite or LODs.), encourage me (Nanite and LODs are choices you will keep growing into, so write down your best reasoning today and refine it later.), and share today's quote: \"It's not just what it looks like and feels like. Design is how it works.\" (Steve Jobs).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 5: Why do you save numbered versions (v01, v02) during a timed build? | Day 3: In the Array modifier, what does Count do, and what does Constant Offset do?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Name police: the tutor reads ten piece names from an imaginary kit (Railing2, sm_steps, SM_Quay_Corner_outside_v3, wall final...); I rewrite each one with the course pattern in 3 minutes.\n6. Do-along on today's build (SM_Railing_2m, SM_RailingPost and the first SM_Steps (in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Open railing_day3.blend and use File > Save As to save railing_day8.blend in today's Work folder. If the file has the three UCX boxes from Day 6, delete them: you make new ones today.\n   - Select SM_RailingSection, press Tab, hover over the right-hand post and press L to select it. Press P > Selection: the post becomes its own object. Tab out. Name the post SM_RailingPost and the railing SM_Railing_2m.\n   - Put the railing's pivot at the bottom of its left post: Tab, press 3, click the post's bottom face, Shift+S > Cursor to Selected, Tab out, then Object > Set Origin > Origin to 3D Cursor. Press Alt+G: the railing moves so its pivot sits on the world origin.\n   - Test the chain: with snapping on, Shift+D and type X 2 Enter. The copy's post sits exactly where the first railing's rails end. Delete the copy.\n   - Do the same for SM_RailingPost: its origin at its bottom centre, then Alt+G. Hide it.\n   - Add UCX boxes: UCX_SM_Railing_2m_00 (the post) and _01 (the rails and bars), and UCX_SM_RailingPost_00, each with its own piece's origin. Export SM_Railing_2m.fbx and SM_RailingPost.fbx, one at a time, each with its boxes.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Corners and steps on the grid", "uk": "Кути й сходи на сітці"}, "minutes": 40, "goals": [{"en": "Plan an outer corner piece that keeps the coping and the wall continuous round a 90-degree turn.", "uk": "Планувати деталь зовнішнього кута, яка зберігає бровку і стіну безперервними на повороті під 90 градусів."}, {"en": "Size steps with a comfort rule: a riser (the height of one step) of 15 to 17 cm and a tread (the part you stand on) of 30 to 40 cm.", "uk": "Підбирати розміри сходинок за правилом зручності: підступенок (висота однієї сходинки) від 15 до 17 см і проступ (частина, на яку стаєш) від 30 до 40 см."}, {"en": "Build a flight of steps from copied blocks and typed moves.", "uk": "Будувати сходовий марш зі скопійованих брусків і введених рухів."}], "doalong": [{"en": "Open quaykit_day7.blend and save it as quaykit_day8.blend. Look at SM_QuayEdge_4m from above (Numpad 7): the coping runs along the water side only.", "uk": "Відкрий quaykit_day7.blend і збережи його як quaykit_day8.blend. Подивися на SM_QuayEdge_4m згори (Numpad 7): бровка йде лише вздовж боку води."}, {"en": "Write the corner plan in kit_rules.md: SM_QuayCorner_Out is 2 x 2 m and as deep as the quay; the water touches two sides (-Y and +X), so the coping runs along both.", "uk": "Запиши план кута в kit_rules.md: SM_QuayCorner_Out має 2 x 2 м і таку саму глибину, як причал; вода торкається двох боків (-Y і +X), тож бровка йде вздовж обох."}, {"en": "Write the step plan: 5 steps down 0.8 m to a boat landing 20 cm above the water; risers 16 cm, treads 40 cm, 2 m wide; so the flight is 2 m long and fits the grid.", "uk": "Запиши план сходів: 5 сходинок униз на 0.8 м до майданчика для човнів на 20 см вище води; підступенки 16 см, проступи 40 см, ширина 2 м; отже, марш має 2 м завдовжки й вписується в сітку."}, {"en": "Hide the other pieces. Add a cube, set Dimensions 2 x 0.4 x 0.84 m and apply the scale, then type G X 1, G Y -0.2 and G Z -0.58. The top step sits 16 cm below the deck, against the wall line at Y = 0.", "uk": "Сховай інші деталі. Додай куб, задай Dimensions 2 x 0.4 x 0.84 м і застосуй масштаб, тоді введи G X 1, G Y -0.2 і G Z -0.58. Верхня сходинка лежить на 16 см нижче поверхні причалу, біля лінії стіни на Y = 0."}, {"en": "Make the second step from a copy: press Shift+D, type Y -0.4 and press Enter, so the copy sits 40 cm nearer the water (towards you in the front view). Tab, press 3, click the copy's top face, type G Z -0.16 Enter and Tab out: a second step, 16 cm lower. (Each step is its own block: lowering a face that is joined to the first step would tilt the first step too.)", "uk": "Зроби другу сходинку з копії: натисни Shift+D, введи Y -0.4 і натисни Enter, щоб копія стала на 40 см ближче до води (до тебе на виді спереду). Tab, натисни 3, клацни верхню грань копії, введи G Z -0.16 Enter і вийди з Edit Mode (Tab): друга сходинка, на 16 см нижче. (Кожна сходинка — окремий брусок: якщо опустити грань, з'єднану з першою сходинкою, перша сходинка теж нахилиться.)"}, {"en": "Repeat with the newest step three more times (Shift+D, Y -0.4, then lower its top face by 0.16). Look from the side (Numpad 3): five even steps, the lowest at Z -0.8. Select the five blocks, press Ctrl+J and save.", "uk": "Повтори з найновішою сходинкою ще тричі (Shift+D, Y -0.4, потім опусти її верхню грань на 0.16). Подивися збоку (Numpad 3): п'ять рівних сходинок, найнижча на Z -0.8. Виділи п'ять брусків, натисни Ctrl+J і збережи."}], "play": {"en": "Comfort check: the tutor describes four flights of steps (risers 25 cm with treads 20 cm; risers 15 cm with treads 35 cm; and two more); I say which ones are comfortable to walk and why, using the rule.", "uk": "Перевірка зручності: тьютор описує чотири сходові марші (підступенки 25 см і проступи 20 см; підступенки 15 см і проступи 35 см; і ще два); я кажу, якими зручно ходити і чому, спираючись на правило."}, "video": {"search": "blender modeling stairs with extrude beginner"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Corners and steps on the grid (Day 8, lesson 2 of 4).\nToday's build: Your harbour kit, part 2: SM_Railing_2m, SM_RailingPost, SM_Steps and SM_QuayCorner_Out.\nEarlier today I already did: lesson 1 (Kit names, and SM_Railing_2m from your Day 3 railing). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Plan an outer corner piece that keeps the coping and the wall continuous round a 90-degree turn.\n2. Size steps with a comfort rule: a riser (the height of one step) of 15 to 17 cm and a tread (the part you stand on) of 30 to 40 cm.\n3. Build a flight of steps from copied blocks and typed moves.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Comfort check: the tutor describes four flights of steps (risers 25 cm with treads 20 cm; risers 15 cm with treads 35 cm; and two more); I say which ones are comfortable to walk and why, using the rule.\n4. Do-along on today's build (SM_Railing_2m, SM_RailingPost and the first SM_Steps (in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Open quaykit_day7.blend and save it as quaykit_day8.blend. Look at SM_QuayEdge_4m from above (Numpad 7): the coping runs along the water side only.\n   - Write the corner plan in kit_rules.md: SM_QuayCorner_Out is 2 x 2 m and as deep as the quay; the water touches two sides (-Y and +X), so the coping runs along both.\n   - Write the step plan: 5 steps down 0.8 m to a boat landing 20 cm above the water; risers 16 cm, treads 40 cm, 2 m wide; so the flight is 2 m long and fits the grid.\n   - Hide the other pieces. Add a cube, set Dimensions 2 x 0.4 x 0.84 m and apply the scale, then type G X 1, G Y -0.2 and G Z -0.58. The top step sits 16 cm below the deck, against the wall line at Y = 0.\n   - Make the second step from a copy: press Shift+D, type Y -0.4 and press Enter, so the copy sits 40 cm nearer the water (towards you in the front view). Tab, press 3, click the copy's top face, type G Z -0.16 Enter and Tab out: a second step, 16 cm lower. (Each step is its own block: lowering a face that is joined to the first step would tilt the first step too.)\n   - Repeat with the newest step three more times (Shift+D, Y -0.4, then lower its top face by 0.16). Look from the side (Numpad 3): five even steps, the lowest at Z -0.8. Select the five blocks, press Ctrl+J and save.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Nanite: when it helps and when it doesn't", "uk": "Nanite: коли допомагає, а коли ні"}, "minutes": 40, "goals": [{"en": "Explain Nanite: Unreal's system that draws dense, solid meshes cheaply at any distance.", "uk": "Пояснювати, що таке Nanite: система Unreal, яка дешево малює щільні суцільні сітки на будь-якій відстані."}, {"en": "Know where it doesn't help: see-through glass, and very thin parts far away, which can shimmer.", "uk": "Знати, де він не допомагає: прозоре скло і дуже тонкі частини вдалині, які можуть мерехтіти."}, {"en": "Turn Nanite on and off per mesh and see it in Nanite Visualization.", "uk": "Вмикати й вимикати Nanite для кожної сітки та бачити його в Nanite Visualization."}], "doalong": [{"en": "In IslandCourse, open L_Day07 and use File > Save Current Level As to save it as L_Day08 in a new folder Course/Day08. Your quay and pier come with it.", "uk": "В IslandCourse відкрий L_Day07 і через File > Save Current Level As збережи його як L_Day08 у новій папці Course/Day08. Твій причал і пірс переходять разом із ним."}, {"en": "Double-click SM_QuayEdge_4m in the Content Browser: the Static Mesh Editor opens. In the Details panel, find Nanite Settings > Enable Nanite Support. Tick it and click Apply Changes.", "uk": "Двічі клацни SM_QuayEdge_4m у Content Browser: відкривається Static Mesh Editor. У панелі Details знайди Nanite Settings > Enable Nanite Support. Познач його й натисни Apply Changes."}, {"en": "Back in the level, click View Mode (the button that says Lit) > Nanite Visualization > Overview. Nanite meshes show in colour; the rest stay dark. Switch back to Lit.", "uk": "Повернись у рівень і натисни View Mode (кнопка з написом Lit) > Nanite Visualization > Overview. Сітки Nanite кольорові, решта лишаються темними. Повернись до Lit."}, {"en": "Do the same for SM_PierDeck_4m. Look at it from 2 m and from 50 m: it looks the same at both distances.", "uk": "Зроби те саме для SM_PierDeck_4m. Подивися на нього з 2 м і з 50 м: на обох відстанях він виглядає однаково."}, {"en": "Write the course rule in kit_rules.md: Nanite on for solid pieces you repeat a lot (quay, deck, steps, walls); off for glass, and for thin parts like railing bars, which get LODs instead.", "uk": "Запиши правило курсу в kit_rules.md: Nanite увімкнено для суцільних деталей, які ти часто повторюєш (причал, настил, сходи, стіни); вимкнено для скла і для тонких частин, як-от балясини поруччя, які натомість отримують LOD."}], "play": {"en": "Quick-fire: the tutor names ten things (a quay stone, a glass shop window, a thin railing, a pier deck, a bench, a lamp's glass, a wall piece...); I say Nanite yes or no for each, in under 2 minutes.", "uk": "Бліц: тьютор називає десять речей (камінь причалу, скляна вітрина, тонке поруччя, настил пірса, лавка, скло ліхтаря, деталь стіни...); я кажу для кожної, Nanite так чи ні, менш ніж за 2 хвилини."}, "video": {"url": "https://www.youtube.com/watch?v=-FmFOiqTO-8", "title": "LOD or Nanite in UE5? / Unreal Engine 5 Optimization Tutorial for Beginners", "channel": "3D Dreamer", "length": "8:58", "search": "unreal engine 5 lod vs nanite"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Nanite: when it helps and when it doesn't (Day 8, lesson 3 of 4).\nToday's build: Your harbour kit, part 2: SM_Railing_2m, SM_RailingPost, SM_Steps and SM_QuayCorner_Out.\nEarlier today I already did: lesson 1 (Kit names, and SM_Railing_2m from your Day 3 railing); lesson 2 (Corners and steps on the grid). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Explain Nanite: Unreal's system that draws dense, solid meshes cheaply at any distance.\n2. Know where it doesn't help: see-through glass, and very thin parts far away, which can shimmer.\n3. Turn Nanite on and off per mesh and see it in Nanite Visualization.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Quick-fire: the tutor names ten things (a quay stone, a glass shop window, a thin railing, a pier deck, a bench, a lamp's glass, a wall piece...); I say Nanite yes or no for each, in under 2 minutes.\n4. Do-along on today's build (SM_Railing_2m, SM_RailingPost and the first SM_Steps (in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - In IslandCourse, open L_Day07 and use File > Save Current Level As to save it as L_Day08 in a new folder Course/Day08. Your quay and pier come with it.\n   - Double-click SM_QuayEdge_4m in the Content Browser: the Static Mesh Editor opens. In the Details panel, find Nanite Settings > Enable Nanite Support. Tick it and click Apply Changes.\n   - Back in the level, click View Mode (the button that says Lit) > Nanite Visualization > Overview. Nanite meshes show in colour; the rest stay dark. Switch back to Lit.\n   - Do the same for SM_PierDeck_4m. Look at it from 2 m and from 50 m: it looks the same at both distances.\n   - Write the course rule in kit_rules.md: Nanite on for solid pieces you repeat a lot (quay, deck, steps, walls); off for glass, and for thin parts like railing bars, which get LODs instead.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"LOD or Nanite in UE5? / Unreal Engine 5 Optimization Tutorial for Beginners\" by 3D Dreamer: https://www.youtube.com/watch?v=-FmFOiqTO-8\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "LODs for pieces without Nanite", "uk": "LOD для деталей без Nanite"}, "minutes": 40, "goals": [{"en": "Explain LODs (levels of detail): lighter copies of a mesh that Unreal swaps in as it gets smaller on screen.", "uk": "Пояснювати, що таке LOD (рівні деталізації): легші копії сітки, які Unreal підставляє, коли вона стає меншою на екрані."}, {"en": "Make automatic LODs in the Static Mesh Editor (LOD Settings > Number of LODs, Apply Changes) and look at each one.", "uk": "Робити автоматичні LOD у Static Mesh Editor (LOD Settings > Number of LODs, Apply Changes) і роздивлятися кожен."}, {"en": "Set screen sizes so the swap happens where nobody notices, and check it with LOD coloration.", "uk": "Задавати розміри на екрані так, щоб заміна відбувалася непомітно, і перевіряти це через LOD coloration."}], "doalong": [{"en": "Import SM_Railing_2m.fbx and SM_RailingPost.fbx into Course/Day08 with your import checklist. Double-click SM_Railing_2m.", "uk": "Імпортуй SM_Railing_2m.fbx і SM_RailingPost.fbx у Course/Day08, звіряючись із чек-листом імпорту. Двічі клацни SM_Railing_2m."}, {"en": "In Details > LOD Settings, set Number of LODs to 3 and click Apply Changes.", "uk": "У Details > LOD Settings встанови Number of LODs на 3 і натисни Apply Changes."}, {"en": "Use the LOD menu in the Static Mesh Editor's toolbar to view LOD0, LOD1 and LOD2. Note the triangles of each at the top left: each one is lighter. All three live inside the one asset SM_Railing_2m: that is why your asset names carry no LOD number.", "uk": "Через меню LOD на панелі інструментів Static Mesh Editor переглянь LOD0, LOD1 і LOD2. Подивися кількість трикутників кожного вгорі ліворуч: кожен наступний легший. Усі три живуть усередині одного асета SM_Railing_2m: саме тому в назвах твоїх асетів немає номера LOD."}, {"en": "Untick Auto Compute LOD Distances. Screen Size is how much of the screen the mesh fills (1 is the whole screen). Set the Screen Size of LOD1 to 0.3 and of LOD2 to 0.1. Click Apply Changes.", "uk": "Зніми позначку Auto Compute LOD Distances. Screen Size — це частка екрана, яку займає сітка (1 — увесь екран). Встанови Screen Size для LOD1 на 0.3, а для LOD2 на 0.1. Натисни Apply Changes."}, {"en": "In the level, place two railings on the pier edge with vertex snap. Switch View Mode to Level of Detail Coloration > Mesh LODs and fly slowly towards them: the colour changes as you get closer.", "uk": "У рівні постав два поруччя на край пірса через прив'язку до вершин. Перемкни View Mode на Level of Detail Coloration > Mesh LODs і повільно лети до них: колір змінюється, коли ти наближаєшся."}], "play": {"en": "Spot the swap: I record a 10-second slow approach to the railing in Lit view; the tutor asks at which second the LOD changed, and I check my answer with LOD coloration.", "uk": "Спіймай заміну: я записую 10-секундне повільне наближення до поруччя в режимі Lit; тьютор питає, на якій секунді змінився LOD, і я перевіряю свою відповідь через LOD coloration."}, "video": {"search": "unreal engine 5 static mesh LOD settings screen size"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: LODs for pieces without Nanite (Day 8, lesson 4 of 4).\nToday's build: Your harbour kit, part 2: SM_Railing_2m, SM_RailingPost, SM_Steps and SM_QuayCorner_Out.\nEarlier today I already did: lesson 1 (Kit names, and SM_Railing_2m from your Day 3 railing); lesson 2 (Corners and steps on the grid); lesson 3 (Nanite: when it helps and when it doesn't). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Explain LODs (levels of detail): lighter copies of a mesh that Unreal swaps in as it gets smaller on screen.\n2. Make automatic LODs in the Static Mesh Editor (LOD Settings > Number of LODs, Apply Changes) and look at each one.\n3. Set screen sizes so the swap happens where nobody notices, and check it with LOD coloration.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Spot the swap: I record a 10-second slow approach to the railing in Lit view; the tutor asks at which second the LOD changed, and I check my answer with LOD coloration.\n4. Do-along on today's build (SM_Railing_2m, SM_RailingPost and the first SM_Steps (in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Import SM_Railing_2m.fbx and SM_RailingPost.fbx into Course/Day08 with your import checklist. Double-click SM_Railing_2m.\n   - In Details > LOD Settings, set Number of LODs to 3 and click Apply Changes.\n   - Use the LOD menu in the Static Mesh Editor's toolbar to view LOD0, LOD1 and LOD2. Note the triangles of each at the top left: each one is lighter. All three live inside the one asset SM_Railing_2m: that is why your asset names carry no LOD number.\n   - Untick Auto Compute LOD Distances. Screen Size is how much of the screen the mesh fills (1 is the whole screen). Set the Screen Size of LOD1 to 0.3 and of LOD2 to 0.1. Click Apply Changes.\n   - In the level, place two railings on the pier edge with vertex snap. Switch View Mode to Level of Detail Coloration > Mesh LODs and fly slowly towards them: the colour changes as you get closer.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "kit_rules.md (updated, with a Nanite or LOD line per piece)", "uk": "kit_rules.md (оновлений, з рядком «Nanite чи LOD» для кожної деталі)"}, {"en": "railing_day8.blend and quaykit_day8.blend (your working files)", "uk": "railing_day8.blend і quaykit_day8.blend (твої робочі файли)"}, {"en": "SM_Railing_2m.fbx, SM_RailingPost.fbx, SM_Steps.fbx and SM_QuayCorner_Out.fbx (with their UCX boxes)", "uk": "SM_Railing_2m.fbx, SM_RailingPost.fbx, SM_Steps.fbx і SM_QuayCorner_Out.fbx (з їхніми блоками UCX)"}, {"en": "nanite_overview.png (View Mode > Nanite Visualization > Overview) and lod_coloration.png", "uk": "nanite_overview.png (View Mode > Nanite Visualization > Overview) і lod_coloration.png"}, {"en": "before_after_day8.png (the Day 7 quay and pier beside today's, same bookmark)", "uk": "before_after_day8.png (причал і пірс із Дня 7 поруч із сьогоднішніми, та сама закладка)"}, {"en": "clip_day8.mp4 (60 seconds)", "uk": "clip_day8.mp4 (60 секунд)"}, {"en": "summary.md", "uk": "summary.md"}], "goal": {"en": "By the end of today you have SM_Railing_2m, SM_RailingPost, SM_Steps and SM_QuayCorner_Out on your kit grid, each with a written Nanite or LOD decision, snapped to your quay and pier in Unreal.", "uk": "До кінця дня в тебе є SM_Railing_2m, SM_RailingPost, SM_Steps і SM_QuayCorner_Out на сітці твого набору, для кожної деталі записано рішення «Nanite чи LOD», і всі вони з'єднані з твоїм причалом і пірсом в Unreal."}, "uses": [{"en": "Day 7: SM_QuayEdge_4m, SM_PierDeck_4m, kit_rules.md and L_Day07", "uk": "День 7: SM_QuayEdge_4m, SM_PierDeck_4m, kit_rules.md і L_Day07"}, {"en": "Day 6: SM_RailingSection (your Day 3 railing with UCX boxes) and your import checklist", "uk": "День 6: SM_RailingSection (твоє поруччя з Дня 3 з блоками UCX) і твій чек-лист імпорту"}, {"en": "Day 2: Edit Mode faces and typed moves, for the steps", "uk": "День 2: грані в Edit Mode і введені рухи — для сходів"}], "quiz": [{"q": {"en": "Why does SM_Railing_2m have a post at one end only?", "uk": "Чому SM_Railing_2m має стійку лише з одного кінця?"}, "options": [{"en": "To save triangles only", "uk": "Лише щоб заощадити трикутники"}, {"en": "So railings chain without two posts in the same spot; SM_RailingPost finishes a run", "uk": "Щоб поруччя з'єднувалися в ланцюжок без двох стійок в одному місці; SM_RailingPost завершує ряд"}, {"en": "Unreal can't import two posts in one mesh", "uk": "Unreal не може імпортувати дві стійки в одній сітці"}], "answer": 1, "explain": {"en": "Two posts in exactly the same place would overlap and flicker. One post per piece plus an end post gives a clean run.", "uk": "Дві стійки точно в одному місці накладалися б і мерехтіли. Одна стійка на деталь плюс кінцева стійка дають чистий ряд."}}, {"q": {"en": "Which of these should NOT use Nanite under this course's rule?", "uk": "Що з цього НЕ повинно використовувати Nanite за правилом цього курсу?"}, "options": [{"en": "SM_QuayEdge_4m", "uk": "SM_QuayEdge_4m"}, {"en": "SM_PierDeck_4m", "uk": "SM_PierDeck_4m"}, {"en": "A glass shop window", "uk": "Скляна вітрина"}, {"en": "SM_Steps", "uk": "SM_Steps"}], "answer": 2, "explain": {"en": "Nanite draws solid meshes. See-through glass is drawn another way, so glass pieces stay out of Nanite.", "uk": "Nanite малює суцільні сітки. Прозоре скло малюється інакше, тож скляні деталі лишаються поза Nanite."}}, {"q": {"en": "Your railings visibly 'jump' to a simpler shape when you fly towards them. What do you change?", "uk": "Коли ти летиш до поруччя, воно помітно «стрибає» до простішої форми. Що змінити?"}, "options": [{"en": "The LOD screen sizes, so the swap happens when the railing is smaller on screen", "uk": "Розміри LOD на екрані (Screen Size), щоб заміна відбувалася, коли поруччя менше на екрані"}, {"en": "The railing's material", "uk": "Матеріал поруччя"}, {"en": "The grid snap", "uk": "Прив'язку до сітки"}], "answer": 0, "explain": {"en": "Lower screen sizes make each LOD swap happen further away, where the change is too small to notice.", "uk": "Менші значення Screen Size змушують кожну заміну LOD відбуватися далі, де зміна надто мала, щоб її помітити."}}, {"q": {"en": "A flight of steps in a photo has 25 cm risers and 20 cm treads. What will walking them feel like?", "uk": "На фото сходовий марш має підступенки 25 см і проступи 20 см. Як по ньому буде ходити?"}, "options": [{"en": "Comfortable", "uk": "Зручно"}, {"en": "Steep and awkward: the risers are too high and the treads too short", "uk": "Круто й незграбно: підступенки зависокі, а проступи закороткі"}, {"en": "Too flat", "uk": "Надто полого"}], "answer": 1, "explain": {"en": "Comfortable outdoor steps have risers of about 15 to 17 cm and treads of about 30 to 40 cm.", "uk": "Зручні вуличні сходи мають підступенки приблизно від 15 до 17 см і проступи приблизно від 30 до 40 см."}}, {"q": {"en": "You turn SM_QuayCorner_Out to fit the end of your quay, but its coping faces the land. What happened?", "uk": "Ти повертаєш SM_QuayCorner_Out, щоб він підійшов до кінця причалу, але його бровка дивиться на суходіл. Що сталося?"}, "options": [{"en": "Its triangles are too high", "uk": "У нього забагато трикутників"}, {"en": "Nanite is off", "uk": "Nanite вимкнено"}, {"en": "It needs another 90 or 180 degrees, so its water sides face the water", "uk": "Його треба повернути ще на 90 або 180 градусів, щоб боки до води дивилися на воду"}], "answer": 2, "explain": {"en": "Every kit piece has its water sides set by the rule; turn it until those sides face the water, then snap it.", "uk": "У кожної деталі набору боки до води задано правилом; повертай деталь, доки ці боки не дивитимуться на воду, а тоді з'єднуй."}}], "weekInfo": {"week": 2, "title": {"en": "Modular kits", "uk": "Модульні набори"}, "goal": {"en": "By Friday you have your own harbour and building kit on a metric grid, and L_KitTest: a quay, a pier and a harbour house built from it in Unreal, with the house saved as a Level Instance.", "uk": "До п'ятниці в тебе є власний набір для гавані й будівель на метричній сітці та L_KitTest: причал, пірс і портовий будинок, зібрані з цього набору в Unreal, а будинок збережено як Level Instance."}, "skills": [{"en": "Modular kit design on a metric grid with consistent pivots", "uk": "Дизайн модульного набору на метричній сітці з узгодженими півотами"}, {"en": "Unreal Engine 5 level assembly: import pipeline, exact placement and snapping", "uk": "Збирання рівня в Unreal Engine 5: пайплайн імпорту, точне розміщення та прив'язка (snapping)"}, {"en": "Nanite versus LOD decisions for real-time performance", "uk": "Вибір між Nanite і LOD заради продуктивності в реальному часі"}, {"en": "Level Instances for reusable building sets", "uk": "Level Instances для наборів будівель, які можна використовувати багато разів"}, {"en": "Content Browser organisation and industry naming conventions (SM_, M_, MI_, T_, L_)", "uk": "Організація Content Browser і галузеві правила назв (SM_, M_, MI_, T_, L_)"}]}, "morning": {"sofar": {"en": "Your harbour kit has begun: a stone quay edge and a timber pier deck that snap together on a metric grid.", "uk": "Твій портовий набір уже почався: кам'яний край причалу й дерев'яний настил пірсу, що стикуються на метричній сітці."}, "today": {"en": "You add a railing, a post, steps and an outer corner to the kit, and decide for each piece whether it uses Nanite or LODs.", "uk": "Сьогодні ти додаєш до набору поруччя, стійку, сходи й зовнішній кут і для кожної частини вирішуєш, чи буде вона на Nanite, чи з LOD."}, "cheer": {"en": "Nanite and LODs are choices you will keep growing into, so write down your best reasoning today and refine it later.", "uk": "Nanite і LOD — це рішення, у які ти ще довго заглиблюватимешся, тож запиши сьогодні свої найкращі міркування, а згодом уточни їх."}, "quote": {"text": {"en": "It's not just what it looks like and feels like. Design is how it works.", "uk": "Дизайн — це не лише те, як річ виглядає і які відчуття викликає. Дизайн — це те, як вона працює."}, "author": {"en": "Steve Jobs", "uk": "Стів Джобс"}, "source": "https://en.wikiquote.org/wiki/Steve_Jobs"}}, "hasAssets": false, "workPath": "Work\\Assignment\\Day-08-kit-railing-steps-corner", "mapHref": "../../COURSE.html", "prevHref": "../Day-07-harbour-kit-quay-and-pier/START-HERE.html", "nextHref": "../Day-09-building-kit/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Blender and Unreal Engine 5.8. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me and don't write code. Keep me moving and make it feel like a game.\n\nToday I build on my own: SM_Steps finished, SM_QuayCorner_Out, and the pieces placed with Nanite and LODs, on your own.\nIt's part of: Your harbour kit, part 2: SM_Railing_2m, SM_RailingPost, SM_Steps and SM_QuayCorner_Out (Your island's waterfront (district 1): railings along the pier, steps down to a boat landing, and a corner where the quay turns. Today in Course/Day08.).\n\nSpec:\n- kit_rules.md updated: the naming pattern, the new pieces, and one line per piece: Nanite or LODs, and why.\n- SM_Railing_2m: from your Day 3 railing, exactly 2 m long, with one post at its start only, so railings chain without double posts; pivot at the bottom centre of the start post (Z = 0 on the deck).\n- SM_RailingPost: the single post, to finish a run.\n- SM_Steps: 2 m wide, 5 steps going down 0.8 m to a boat landing over 2 m (treads 0.4 m, risers 0.16 m), built against the quay's water face; pivot at the top corner at the start, on the wall line.\n- SM_QuayCorner_Out: a 2 x 2 m outer corner, 3 m deep, with coping along its two water sides, matching SM_QuayEdge_4m exactly.\n- Every piece exported from the world origin with UCX boxes and M_Stone or M_Timber; triangles under 2,000 each.\n- In Unreal (Course/Day08, level L_Day08): Nanite on for the steps, the corner, the quay and the deck; 3 LODs on SM_Railing_2m; the new pieces snapped to your Day 7 quay and pier with no gaps.\n\nMy checklist:\n1. SM_Steps: put the origin on the pivot (Shift+S > Cursor to World Origin, then Origin to 3D Cursor) and name the object SM_Steps. Check: the orange dot sits on the wall line at deck height (Z 0), 16 cm above the top step's back corner, and Location reads 0, 0, 0. (from lesson 2)\n2. Give SM_Steps M_Stone and five UCX boxes, one per step, each the size of that step's block (from its tread down to Z -1.0), named UCX_SM_Steps_00 to _04. Check: from the side, the boxes follow the steps like a staircase. (from day 4, lesson 3)\n3. SM_QuayCorner_Out: hide the other pieces, add a cube 2 x 2 x 3 m with the scale applied, and move it with G X 1, G Y -1, G Z -1.5. Check: the block runs from X 0 to 2 and Y 0 to -2, hanging 3 m down from Z 0. (from lesson 2)\n4. Corner coping: a cube 2.05 x 0.45 x 0.2 m at X 1.025, Y -1.825 (the front water side), and a cube 0.45 x 1.6 x 0.2 m at X 1.825, Y -0.8 (the right water side), both at Z 0. Check: from above (Numpad 7) the coping makes an L round the corner, with a 5 cm overhang on both water sides. (from lesson 2)\n5. Bevel the coping (Amount 0.01 m, Segments 2) and apply it; add 5 loop cuts on the wall for stone rows, as on SM_QuayEdge_4m. Check: the stone rows line up in height with the straight piece's rows. (from day 7, lesson 3)\n6. Join the coping into the block, name it SM_QuayCorner_Out, put the origin on the pivot, give it M_Stone and add three UCX boxes (the block and the two coping strips). Check: Location 0, 0, 0 and three names starting with UCX_SM_QuayCorner_Out_. (from day 4, lesson 3)\n7. Grid test in Blender: show SM_QuayEdge_4m, Shift+D the corner and move the copy to X 4 with snapping on. Look closely at the join, then delete the copy. Check: the coping and the stone rows run straight from the quay into the corner. (from day 7, lesson 2)\n8. Check every new piece sits at the world origin with fewer than 2,000 triangles, then export SM_Steps.fbx and SM_QuayCorner_Out.fbx with their UCX boxes. Check: two FBX files in today's Work folder. (from day 4, lesson 4)\n9. Import both into Course/Day08 and switch on Nanite for each (Static Mesh Editor > Nanite Settings > Enable Nanite Support > Apply Changes); do the same for SM_QuayEdge_4m and SM_PierDeck_4m. Take nanite_overview.png. Check: in View Mode > Nanite Visualization > Overview, the quay, deck, steps and corner all show in colour. (from lesson 3)\n10. In L_Day08, place the corner at the end of the quay run and the steps against the quay's water face beside the pier, joining them with vertex snap. Check: the corner's coping continues the quay's coping, and the top step sits just below the deck. (from day 7, lesson 4)\n11. Railings: run SM_Railing_2m along both sides of the pier with vertex snap (six per side) and finish each run with SM_RailingPost. Check: posts every 2 m, no double posts, and a post at each end. (from lesson 1)\n12. Fly slowly along a railing in View Mode > Level of Detail Coloration > Mesh LODs and take lod_coloration.png. Check: the colours change with distance, and in Lit view you can't see the swap happen. (from lesson 4)\n13. Write one line per kit piece in kit_rules.md: Nanite or LODs, and why. Check: six pieces, six lines. (from lesson 3)\n14. Captures: before_after_day8.png (the Day 7 quay and pier beside today's version, same bookmark) and a 60-second clip: along the railing, down past the steps and round the corner. Save today's clip as clip_day8.mp4. Check: both files are in today's Work folder. (from day 0, lesson 1)\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Denis\nDay 8: More kit pieces: railing, steps and a corner, and Nanite versus LODs. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

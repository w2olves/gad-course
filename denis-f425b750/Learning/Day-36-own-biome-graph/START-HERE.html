<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 36</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

хил або мис приблизно 250 × 200 м з твоєї мапи — інший біом, ніж у лісовій долині, поза обома районами."}, "spec": [{"en": "biome_rules.md is your notes file for week 8. It holds the biome's name and 3 to 5 plant families with weights (40, 30, 20, 10). Pick the families from one photo of wild ground you like.", "uk": "biome_rules.md — твій файл нотаток на 8-й тиждень. У ньому назва біому й 3–5 родин рослин із вагами (40, 30, 20, 10). Родини вибери з одного фото дикої місцевості, яке тобі подобається."}, {"en": "PCG_Biome_Scrub (or your biome's name) in /Game/Island/PCG, in this order: 1) Get Landscape Data; 2) Surface Sampler; 3) Normal To Density; 4) Density Filter (slope); 5) Attribute Filter Range (height band); 6) Spatial Noise; 7) Density Filter (clumps); 8) Self Pruning; 9) Transform Points; 10) Static Mesh Spawner; 11) Output.", "uk": "PCG_Biome_Scrub (або назва твого біому) у /Game/Island/PCG, саме в такому порядку: 1) Get Landscape Data; 2) Surface Sampler; 3) Normal To Density; 4) Density Filter (схил); 5) Attribute Filter Range (смуга висот); 6) Spatial Noise; 7) Density Filter (куртини); 8) Self Pruning; 9) Transform Points; 10) Static Mesh Spawner; 11) Output."}, {"en": "Nothing on slopes over 35 degrees. Nothing lower than 2 m above the sea (your sea level is Z = 0) or above your biome's top height, for example 60 m.", "uk": "Нічого на схилах понад 35 градусів. Нічого нижче 2 м над морем (рівень моря в тебе — Z = 0) і нічого вище за верхню межу біому, наприклад 60 м."}, {"en": "Clumps 10 to 30 m across with open gaps between them; plants no closer than 1.5 m; a random turn and a scale of 0.7 to 1.3; no rows visible from 30 m.", "uk": "Куртини 10–30 м у поперечнику з відкритими прогалинами між ними. Рослини не ближче ніж 1,5 м одна від одної. Випадковий поворот і масштаб 0,7–1,3. З 30 м не видно рядів."}, {"en": "Placed with a PCG Volume of 250 x 200 m over the slope, on DL_Biomes, its Seed written down.", "uk": "Граф працює в об'ємі PCG Volume 250 × 200 м над схилом. Об'єм лежить на DL_Biomes, його Seed записано."}, {"en": "Older Unreal (4.27): the same rules in a Procedural Foliage Spawner, PFS_Biome_Scrub. Each family is a Foliage Type with its own slope, height, spacing and scale.", "uk": "Старіший Unreal (4.27): ті самі правила в Procedural Foliage Spawner — PFS_Biome_Scrub. Кожна родина — це Foliage Type з власним схилом, висотою, відстанню й масштабом."}], "piece1": "the graph's spine, the families and the slope filter", "piece2": {"en": "The height band, clumps, gaps and spacing, on your own", "uk": "Смуга висот, куртини, прогалини й відстань, самостійно"}, "steps": [{"text": {"en": "Check: the files from today's lessons are in the day work folder (biome_rules.md). Also check that L_Island has PCG_Biome_Scrub (or PFS_Biome_Scrub) over your slope. Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it.", "uk": "Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: biome_rules.md. У L_Island над твоїм схилом є PCG_Biome_Scrub (або PFS_Biome_Scrub). Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде."}, "lesson": 1}, {"text": {"en": "Look from 30 m and change a weight if one family is missing or too strong. Check: you see every family in biome_rules.md, the common ones most.", "uk": "Подивися з 30 м. Якщо якоїсь родини не видно або вона надто помітна, зміни її вагу. Перевірка: видно кожну родину з biome_rules.md, а поширених — найбільше."}, "lesson": 1}, {"text": {"en": "Press D on the slope filter, then on the height filter. Older Unreal (4.27): Resimulate and look at the cliffs and the beach instead. Check: steep faces are bare, and nothing grows on the beach or above the band.", "uk": "Натисни D на фільтрі схилу, потім на фільтрі висоти. Старіший Unreal (4.27): натомість клацни Resimulate й подивися на скелі та пляж. Перевірка: круті стіни голі, а на пляжі й вище смуги нічого не росте."}, "lesson": 2}, {"text": {"en": "Tune the clumps until the patches are 10 to 30 m across from 60 m. Check: the plants gather in patches with open ground between.", "uk": "Налаштовуй куртини, доки плями з 60 м не матимуть 10–30 м у поперечнику. Перевірка: рослини збираються плямами, а між ними відкритий ґрунт."}, "lesson": 3}, {"text": {"en": "Look from 5 m for spacing and from 30 m for variety; fix Point Extents or Transform Points (older Unreal: Collision Radius or the random scale). Check: no two plants overlap, and no two neighbours look the same.", "uk": "Подивися з 5 м на відстані між рослинами, а з 30 м — на різноманітність. Виправ Point Extents або Transform Points (у старішому Unreal — Collision Radius або випадковий масштаб). Перевірка: жодні дві рослини не накладаються, і жодні дві сусідні не однакові."}, "lesson": 3}, {"text": {"en": "Judge from 100 m, try two seeds and keep the best; write it in biome_rules.md and put the volume on DL_Biomes (older Unreal: a DL_Biomes folder). Check: no rows, carpets or plants on cliffs.", "uk": "Оціни результат зі 100 м. Спробуй два значення Seed і залиш краще. Запиши його в biome_rules.md і поклади об'єм на DL_Biomes (у старішому Unreal — у папку DL_Biomes). Перевірка: немає рядів, килимів і рослин на скелях."}, "lesson": 4}, {"text": {"en": "Read stat unit with the volume hidden and shown. Older Unreal (4.27) or weak PC: if GPU rises by more than 3 ms, lower the density. Check: GPU rose by less than 3 ms, or you lowered the density.", "uk": "Зчитай stat unit з прихованим і показаним об'ємом. Старіший Unreal (4.27) або слабкий ПК: якщо GPU виріс більше ніж на 3 мс, зменш густоту. Перевірка: GPU виріс менше ніж на 3 мс, або густоту зменшено."}, "lesson": 4}, {"text": {"en": "Press 3 for your 60 m bookmark, drop to 30 m, press G and take biome_30m.png (Win+Shift+S). Check: the picture shows clumps, gaps and bare cliffs.", "uk": "Натисни 3, щоб повернутися до закладки камери на 60 м, спустися на 30 м, натисни G і зроби скриншот biome_30m.png (Win+Shift+S). Перевірка: на знімку видно куртини, прогалини й голі скелі."}, "lesson": 4}, {"text": {"en": "Choose File > Save All in Unreal. Report and hand-in: click Copy the day report at the bottom of the page, paste it into a new chat and answer. Open summary.md in Notepad, press Ctrl+End, paste the answer and press Ctrl+S. Then drag the files on the Hand in list into your hand-in folder. Check: the level tab shows no * mark, and every name shows in the folder, each with a size.", "uk": "В Unreal вибери File > Save All. Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: на вкладці рівня немає позначки *, а кожна назва зі списку є в папці, у кожної є розмір."}, "lesson": 4}], "assets": ["island12/free-packs-list.md", "island12/credits-template.md"]}, "lessons": [{"title": {"en": "A biome graph on your slope", "uk": "Граф біому на твоєму схилі"}, "minutes": 40, "goals": [{"en": "Build the spine on your real landscape: Get Landscape Data > Surface Sampler > Static Mesh Spawner > Output, run by a PCG Volume (a box that says where the graph works).", "uk": "Будувати каркас на справжньому ландшафті: Get Landscape Data > Surface Sampler > Static Mesh Spawner > Output. Запускає його PCG Volume — об'єм, що позначає, де працює граф."}, {"en": "Read a biome from one photo: which plant families, and which are common or rare.", "uk": "Читати біом з одного фото: які родини рослин є і які з них поширені, а які рідкісні."}, {"en": "Mix plant families in one Static Mesh Spawner with weighted Mesh Entries (a higher weight is picked more often).", "uk": "Змішувати родини рослин в одному Static Mesh Spawner записами Mesh Entries з вагами (запис із більшою вагою вибирається частіше)."}], "doalong": [{"en": "Make the folder /Game/Island/PCG; right-click inside it > PCG > PCG Graph, click Create empty graph and name it PCG_Biome_Scrub. Add Get Landscape Data, Surface Sampler (Points Per Squared Meter 0.2) and Static Mesh Spawner, wired into Output. You see the Day 34 spine.", "uk": "Створи папку /Game/Island/PCG. Клацни всередині правою кнопкою > PCG > PCG Graph, клацни Create empty graph і назви граф PCG_Biome_Scrub. Додай Get Landscape Data, Surface Sampler (Points Per Squared Meter 0.2) і Static Mesh Spawner і з'єднай їх з Output. Має вийти: каркас, як у День 34."}, {"en": "Load your slope's region, fly to 60 m and press Ctrl+3 to bookmark it. Drag a PCG Volume over the slope at Scale 125, 100 and taller than the hill, set its Graph and click Generate. You see one kind of plant across the slope.", "uk": "Завантаж область схилу, підлети на 60 м і натисни Ctrl+3, щоб зберегти закладку камери. Перетягни PCG Volume на схил: Scale 125, 100, а за висотою — вище за пагорб. Вибери граф у полі Graph і клацни Generate. По схилу з'являється один вид рослин."}, {"en": "Older Unreal (4.27): make a Procedural Foliage Spawner PFS_Biome_Scrub with one Foliage Type, drop a Procedural Foliage Volume over the slope and click Resimulate. You see plants across the slope.", "uk": "Старіший Unreal (4.27): зроби Procedural Foliage Spawner PFS_Biome_Scrub з одним Foliage Type, постав Procedural Foliage Volume на схил і клацни Resimulate. По схилу з'являються рослини."}, {"en": "Open one photo of wild ground from your place and name 3 to 5 plant families in it; match each to a plant you brought in on Day 34. Write them in biome_rules.md with weights 40, 30, 20 and 10. You see your family list.", "uk": "Відкрий одне фото дикої місцевості свого краю й назви на ньому 3–5 родин рослин. Підбери до кожної рослину, перенесену в День 34. Запиши їх у biome_rules.md з вагами 40, 30, 20 і 10. Має вийти: список родин."}, {"en": "Add one Mesh Entry per family with its weight (older Unreal: one Foliage Type each) and Generate. You see the families mixed, the common ones most.", "uk": "Додай по одному запису Mesh Entries на кожну родину з її вагою (у старішому Unreal — по одному Foliage Type) і клацни Generate. Родини змішуються, поширених — найбільше."}], "play": {"en": "Break it, fix it: the tutor names one setting to break (Points Per Squared Meter 5, no landscape input, one weight at 0). I predict what happens, try it, and fix it within 2 minutes.", "uk": "Зламай і полагодь: тьютор називає одне налаштування, яке треба зламати (Points Per Squared Meter 5, без входу ландшафту, одна вага 0). Я передбачаю, що станеться, пробую й виправляю за 2 хвилини."}, "video": {"url": "https://www.youtube.com/watch?v=9FHkjcowP-g", "title": "Scatter Trees & Grass with PCG in Unreal Engine 5 / Part 1", "channel": "TUF", "length": "18:20", "search": "unreal engine 5 pcg scatter trees grass"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Граф біому на твоєму схилі (Day 36, lesson 1 of 4). Today's build: PCG_Biome_Scrub (назви його за своїм біомом) — твій перший граф біому. Він наповнює один схил за нахилом, висотою й шумом: змішані родини рослин, природні відстані, куртини й прогалини..\nWhat I already know: День 34: твій перший PCG-граф (або Procedural Foliage Spawner), режим налагодження й перенесені рослини; День 21: твоє фото цього місця (підійде й будь-яке фото дикої місцевості, яке тобі подобається); День 33: DL_Biomes; День 35: лісова долина — цей біом піде в інше місце.\n\nBy the end of this lesson I can:\n1. Будувати каркас на справжньому ландшафті: Get Landscape Data > Surface Sampler > Static Mesh Spawner > Output. Запускає його PCG Volume — об'єм, що позначає, де працює граф.\n2. Читати біом з одного фото: які родини рослин є і які з них поширені, а які рідкісні.\n3. Змішувати родини рослин в одному Static Mesh Spawner записами Mesh Entries з вагами (запис із більшою вагою вибирається частіше).\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: Сім тижнів позаду: на острові є земля, вода, дороги, світло, налаштування великого світу й ліс PCG на цілу долину. Today: Сьогодні ти будуєш власний граф біому: він вкриває один схил змішаними рослинами, зупиняється на крутому ґрунті й росте купками з прогалинами. One encouraging line: Власний граф — інструмент на роки, тож будуй його по одному вузлу й часто перевіряй.); 2 lines on why today matters and where it comes back, in plain words (from this: Сьогодні цілий схил наповнюється сам: твої правила ставлять чагарі там, де вони ростуть, лишають скелі голими й розбивають рослини на природні куртини. Студії пишуть правила для рослин, бо рослини, поставлені вручну, сповзають у ряди й килими. А одна зміна правила заново наповнює весь схил. It comes back: Завтра ти скопіюєш цей граф ще у два біоми й додаси дерева (День 37). У День 38 з'являться зони-винятки, у День 40 граф пошириться на весь острів, а в День 44 його копія засадить дику місцевість у районі 1.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-36-own-biome-graph exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (каркас графа, родини й фільтр схилу). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Створи папку /Game/Island/PCG. Клацни всередині правою кнопкою > PCG > PCG Graph, клацни Create empty graph і назви граф PCG_Biome_Scrub. Додай Get Landscape Data, Surface Sampler (Points Per Squared Meter 0.2) і Static Mesh Spawner і з'єднай їх з Output. Має вийти: каркас, як у День 34.\n   2. Завантаж область схилу, підлети на 60 м і натисни Ctrl+3, щоб зберегти закладку камери. Перетягни PCG Volume на схил: Scale 125, 100, а за висотою — вище за пагорб. Вибери граф у полі Graph і клацни Generate. По схилу з'являється один вид рослин.\n   3. Старіший Unreal (4.27): зроби Procedural Foliage Spawner PFS_Biome_Scrub з одним Foliage Type, постав Procedural Foliage Volume на схил і клацни Resimulate. По схилу з'являються рослини. [screenshot]\n   4. Відкрий одне фото дикої місцевості свого краю й назви на ньому 3–5 родин рослин. Підбери до кожної рослину, перенесену в День 34. Запиши їх у biome_rules.md з вагами 40, 30, 20 і 10. Має вийти: список родин.\n   5. Додай по одному запису Mesh Entries на кожну родину з її вагою (у старішому Unreal — по одному Foliage Type) і клацни Generate. Родини змішуються, поширених — найбільше. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Зламай і полагодь: тьютор називає одне налаштування, яке треба зламати (Points Per Squared Meter 5, без входу ландшафту, одна вага 0). Я передбачаю, що станеться, пробую й виправляю за 2 хвилини. Otherwise skip it.\n6. Review: ask me these questions from earlier days, one at a time, and correct me kindly: Day 33: which setting keeps the sun and the fog loaded when you unload regions? | Day 29: at what height is your sea level, and why will that matter for plants?\n7. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n8. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\nIf I want to go deeper, recommend this free video: \"Scatter Trees & Grass with PCG in Unreal Engine 5 / Part 1\" by TUF: https://www.youtube.com/watch?v=9FHkjcowP-g\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; review (by tutor or art director) = огляд; breakdown = розбір; credits line = рядок авторства; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; File Explorer = Провідник; mesh = меш; vertex / edge / face = вершина / ребро / грань; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; collision / UCX collision box = колізія / блок UCX; material slot / node / pin = слот матеріалу / вузол / вхід; volume (PCG Volume, Post Process Volume) = об'єм; seed = зерно (налаштування Seed); ma grow in clumps with gaps, and never overlap.", "uk": "До кінця дня твій власний граф біому наповнює один схил острова розміром 250 × 200 м. Змішані рослини не ростуть на крутому ґрунті, тримаються куртинами з прогалинами й ніколи не накладаються."}, "uses": [{"en": "Day 34: your first PCG graph (or Procedural Foliage Spawner), the debug view and the plants you brought in", "uk": "День 34: твій перший PCG-граф (або Procedural Foliage Spawner), режим налагодження й перенесені рослини"}, {"en": "Day 21: your photo of the place (any photo of wild ground you like works too)", "uk": "День 21: твоє фото цього місця (підійде й будь-яке фото дикої місцевості, яке тобі подобається)"}, {"en": "Day 33: DL_Biomes", "uk": "День 33: DL_Biomes"}, {"en": "Day 35: the forest valley, so this biome goes somewhere else", "uk": "День 35: лісова долина — цей біом піде в інше місце"}], "quiz": [{"q": {"en": "What does a Density Filter with Lower Bound 0.82 keep, placed after Normal To Density?", "uk": "Що залишає Density Filter з Lower Bound 0.82, поставлений після Normal To Density?"}, "options": [{"en": "Points on slopes under about 35 degrees", "uk": "Точки на схилах менше приблизно 35 градусів"}, {"en": "Points above 82 m", "uk": "Точки вище 82 м"}, {"en": "82 % of all the points", "uk": "82 % усіх точок"}], "answer": 0, "explain": {"en": "Normal To Density gives flat ground 1 and steeper ground less. 0.82 is the cosine of 35 degrees, so steeper points are removed.", "uk": "Normal To Density дає рівному ґрунту 1, а крутішому — менше. 0,82 — це косинус 35 градусів, тож крутіші точки прибираються."}}, {"q": {"en": "Your shrubs grow up a 60-degree cliff face. Which part is missing?", "uk": "Твої кущі ростуть угору 60-градусною скельною стіною. Якої частини бракує?"}, "options": [{"en": "Self Pruning", "uk": "Self Pruning"}, {"en": "The slope filter: Normal To Density and a Density Filter", "uk": "Фільтра схилу: Normal To Density і Density Filter"}, {"en": "Transform Points", "uk": "Transform Points"}, {"en": "A different Seed", "uk": "Іншого Seed"}], "answer": 1, "explain": {"en": "Without a slope filter, every sampled point survives, even on cliffs. Real plants cannot root there.", "uk": "Без фільтра схилу лишається кожна точка семплера, навіть на скелях. Справжні рослини не можуть там укорінитися."}}, {"q": {"en": "From 30 m your scrub looks like an even green carpet. What adds clumps and gaps?", "uk": "З 30 м твої чагарі виглядають як рівний зелений килим. Що додасть куртини й прогалини?"}, "options": [{"en": "A different Seed", "uk": "Іншого Seed"}, {"en": "Absolute Rotation", "uk": "Absolute Rotation"}, {"en": "Spatial Noise followed by a Density Filter", "uk": "Spatial Noise, а за ним Density Filter"}, {"en": "Turning off Lumen", "uk": "Вимкнення Lumen"}], "answer": 2, "explain": {"en": "The noise gives each area a smooth density, and the filter keeps only the dense patches, leaving gaps between.", "uk": "Шум дає кожній ділянці плавну густоту, а фільтр залишає лише густі плями. Між ними лишаються прогалини."}}, {"q": {"en": "What does Self Pruning do?", "uk": "Що робить Self Pruning?"}, "options": [{"en": "Turns plants at random", "uk": "Випадково повертає рослини"}, {"en": "Deletes the graph", "uk": "Видаляє граф"}, {"en": "Lowers the cost of Lumen", "uk": "Знижує вартість Lumen"}, {"en": "Removes points whose bounds overlap, so plants keep their room", "uk": "Прибирає точки, чиї межі накладаються, тож рослини зберігають свій простір"}], "answer": 3, "explain": {"en": "Each point has a size from Point Extents. Self Pruning removes overlapping points, giving even but random spacing.", "uk": "Кожна точка має розмір із Point Extents. Self Pruning прибирає точки, що накладаються, і відстані стають рівномірними, але випадковими."}}, {"q": {"en": "Your biome grows on the wet sand at the waterline. Which rule fixes it?", "uk": "Твій біом росте на мокрому піску біля лінії води. Яке правило це виправить?"}, "options": [{"en": "A height band that starts 2 m above the sea ($Position.Z minimum 200)", "uk": "Смуга висот, що починається на 2 м над морем ($Position.Z мінімум 200)"}, {"en": "Self Pruning", "uk": "Self Pruning"}, {"en": "A bigger Seed", "uk": "Більший Seed"}], "answer": 0, "explain": {"en": "Your sea level is at Z = 0. A minimum of 200 cm starts the band 2 m above it, which keeps the plants off the wet shore.", "uk": "Рівень моря в тебе — Z = 0. Мінімум 200 см починає смугу на 2 м вище, і рослини не потрапляють на мокрий берег."}}], "weekInfo": {"week": 8, "title": {"en": "PCG nature for the whole island", "uk": "PCG-природа для всього острова"}, "goal": {"en": "By Friday you have your whole island dressed by your own PCG biome rules, layered, with natural transitions, clear keep-outs and nothing floating, reading beautifully from the air.", "uk": "До п'ятниці весь твій острів заповнений природою за твоїми власними правилами біомів PCG: шарами, з природними переходами, чіткими зонами-винятками й без жодного об'єкта в повітрі, і він гарно читається з висоти."}, "skills": [{"en": "PCG biome rules in Unreal Engine 5 (slope, height, noise and spacing)", "uk": "Правила біомів PCG в Unreal Engine 5 (схил, висота, шум і відстань між об'єктами)"}, {"en": "Procedural keep-outs and grounding checks for playable spaces", "uk": "Процедурні зони-винятки й перевірки посадки на ґрунт для ігрових просторів"}, {"en": "Layered foliage and scatter design, read at every distance", "uk": "Шарова рослинність і розкидання об'єктів, що читаються на будь-якій відстані"}, {"en": "Island-scale partitioned PCG generation within a 16 GB memory budget", "uk": "Генерація PCG на весь острів із розбиттям на комірки, у межах бюджету пам'яті 16 ГБ"}]}, "morning": {"sofar": {"en": "Seven weeks in, your island has land, water, roads, light, a big-world set-up and a PCG forest filling one valley.", "uk": "Сім тижнів позаду: на острові є земля, вода, дороги, світло, налаштування великого світу й ліс PCG на цілу долину."}, "today": {"en": "You build your own biome graph that dresses one slope with mixed plants, stops on steep ground, and grows in clumps with gaps.", "uk": "Сьогодні ти будуєш власний граф біому: він вкриває один схил змішаними рослинами, зупиняється на крутому ґрунті й росте купками з прогалинами."}, "cheer": {"en": "A graph of your own is a tool you can use for years, so build it one node at a time and test it often.", "uk": "Власний граф — інструмент на роки, тож будуй його по одному вузлу й часто перевіряй."}, "quote": {"text": {"en": "I believe a leaf of grass is no less than the journey work of the stars.", "uk": "Я вірю, що травинка — не менший витвір, ніж мандрівна праця зірок."}, "author": {"en": "Walt Whitman", "uk": "Волт Вітмен"}, "source": "https://en.wikiquote.org/wiki/Leaves_of_Grass"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-36-own-biome-graph", "mapHref": "../../COURSE.html", "prevHref": "../Day-35-boss-roads-big-world-first-forest/START-HERE.html", "nextHref": "../Day-37-more-biomes-and-transitions/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8. I am a beginner on Day 36. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me and don't write code.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: Смуга висот, куртини, прогалини й відстань, самостійно.\nIt's part of: PCG_Biome_Scrub (назви його за своїм біомом) — твій перший граф біому. Він наповнює один схил за нахилом, висотою й шумом: змішані родини рослин, природні відстані, куртини й прогалини. (L_Island: один схил або мис приблизно 250 × 200 м з твоєї мапи — інший біом, ніж у лісовій долині, поза обома районами.).\nWhy it matters: Сьогодні цілий схил наповнюється сам: твої правила ставлять чагарі там, де вони ростуть, лишають скелі голими й розбивають рослини на природні куртини. Студії пишуть правила для рослин, бо рослини, поставлені вручну, сповзають у ряди й килими. А одна зміна правила заново наповнює весь схил. It comes back: Завтра ти скопіюєш цей граф ще у два біоми й додаси дерева (День 37). У День 38 з'являться зони-винятки, у День 40 граф пошириться на весь острів, а в День 44 його копія засадить дику місцевість у районі 1.\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-36-own-biome-graph (on the drive I chose on Day 0).\nWhat I already know: День 34: твій перший PCG-граф (або Procedural Foliage Spawner), режим налагодження й перенесені рослини; День 21: твоє фото цього місця (підійде й будь-яке фото дикої місцевості, яке тобі подобається); День 33: DL_Biomes; День 35: лісова долина — цей біом піде в інше місце; today's lessons: Граф біому на твоєму схилі; Схил і висота: де біом зупиняється; Куртини, прогалини й природна відстань; Як оцінити біом з повітря. Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- biome_rules.md — твій файл нотаток на 8-й тиждень. У ньому назва біому й 3–5 родин рослин із вагами (40, 30, 20, 10). Родини вибери з одного фото дикої місцевості, яке тобі подобається.\n- PCG_Biome_Scrub (або назва твого біому) у /Game/Island/PCG, саме в такому порядку: 1) Get Landscape Data; 2) Surface Sampler; 3) Normal To Density; 4) Density Filter (схил); 5) Attribute Filter Range (смуга висот); 6) Spatial Noise; 7) Density Filter (куртини); 8) Self Pruning; 9) Transform Points; 10) Static Mesh Spawner; 11) Output.\n- Нічого на схилах понад 35 градусів. Нічого нижче 2 м над морем (рівень моря в тебе — Z = 0) і нічого вище за верхню межу біому, наприклад 60 м.\n- Куртини 10–30 м у поперечнику з відкритими прогалинами між ними. Рослини не ближче ніж 1,5 м одна від одної. Випадковий поворот і масштаб 0,7–1,3. З 30 м не видно рядів.\n- Граф працює в об'ємі PCG Volume 250 × 200 м над схилом. Об'єм лежить на DL_Biomes, його Seed записано.\n- Старіший Unreal (4.27): ті самі правила в Procedural Foliage Spawner — PFS_Biome_Scrub. Кожна родина — це Foliage Type з власним схилом, висотою, відстанню й масштабом.\n\nMy checklist (the same numbers show on my course page):\n1. Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: biome_rules.md. У L_Island над твоїм схилом є PCG_Biome_Scrub (або PFS_Biome_Scrub). Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. (from lesson 1)\n2. Подивися з 30 м. Якщо якоїсь родини не видно або вона надто помітна, зміни її вагу. Перевірка: видно кожну родину з biome_rules.md, а поширених — найбільше. (from lesson 1)\n3. Натисни D на фільтрі схилу, потім на фільтрі висоти. Старіший Unreal (4.27): натомість клацни Resimulate й подивися на скелі та пляж. Перевірка: круті стіни голі, а на пляжі й вище смуги нічого не росте. (from lesson 2)\n4. Налаштовуй куртини, доки плями з 60 м не матимуть 10–30 м у поперечнику. Перевірка: рослини збираються плямами, а між ними відкритий ґрунт. (from lesson 3)\n5. Подивися з 5 м на відстані між рослинами, а з 30 м — на різноманітність. Виправ Point Extents або Transform Points (у старішому Unreal — Collision Radius або випадковий масштаб). Перевірка: жодні дві рослини не накладаються, і жодні дві сусідні не однакові. (from lesson 3)\n6. Оціни результат зі 100 м. Спробуй два значення Seed і залиш краще. Запиши його в biome_rules.md і поклади об'єм на DL_Biomes (у старішому Unreal — у папку DL_Biomes). Перевірка: немає рядів, килимів і рослин на скелях. (from lesson 4)\n7. Зчитай stat unit з прихованим і показаним об'ємом. Старіший Unreal (4.27) або слабкий ПК: якщо GPU виріс більше ніж на 3 мс, зменш густоту. Перевірка: GPU виріс менше ніж на 3 мс, або густоту зменшено. (from lesson 4)\n8. Натисни 3, щоб повернутися до закладки камери на 60 м, спустися на 30 м, натисни G і зроби скриншот biome_30m.png (Win+Shift+S). Перевірка: на знімку видно куртини, прогалини й голі скелі. (from lesson 4)\n9. В Unreal вибери File > Save All. Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: на вкладці рівня немає позначки *, а кожна назва зі списку є в папці, у кожної є розмір. (from lesson 4)\n\nHow to help: ask which step number I'm on, then give me only the next step: the exact clicks and what I should see. When I send a screenshot, compare it with my reference, my sizes and the spec, and name one thing to fix at a time.\nCheck every save and export by reopening it before we move on:\n- a .md or .txt: open it with Notepad; the text is there, and the name doesn't end in .md.txt\nWhen I write \"готово\", and in any case before the day ends, check with me one item at a time (yes/no): each spec point, then each file on my hand-in list, ready in my day work folder (skip summary.md: the day report writes it next):\n1. biome_rules.md (родини, ваги й Seed) (→ День 37)\n2. biome_30m.png (наповнений схил з 30 м) (доказ)\nFinish with a short list of anything missing, and one line on where this work comes back and what it will look like there. Then tell me the order for the end of the day: first the day report (the Copy the day report button at the bottom of my course page) into summary.md, and only then hand in all the files on the list, summary.md too.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; breakdown = розбір; see-why-fix note = нотатка «бачу, чому, як виправити»; checklist = чек-лист; credits line = рядок авторства; reference photo / hero photo = фото-референс / ключове фото; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); mesh = меш; vertex / edge / face = вершина / ребро / грань; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; collisi  const pips='<div class="pips well" aria-hidden="true">'+D.quiz.map((q,i)=>'<i class="'+(a[i]==null?'':a[i]===q.answer?'r':'w')+'"></i>').join('')+'</div>';
 const qs=D.quiz.map((q,i)=>{const c=a[i];if(c===q.answer)ok++;return '<div class="qz"><p class="qq"><span class="qn">'+(i+1)+'</span><span>'+lk(x(q.q))+'</span></p>'+q.options.map((o,k)=>{let cls='opt',mk='<span></span>';if(c!=null){if(k===q.answer){cls+=' right';mk=ic('check','mk')}else if(k===c){cls+=' wrong';mk=ic('x','mk')}}return '<button class="'+cls+'" id="o'+i+'_'+k+'"'+(c!=null?' disabled':'')+' onclick="pick('+i+','+k+')"><span class="lt">'+(L[k]||k+1)+'</span><span>'+esc(x(o))+'</span>'+mk+'</button>'}).join('')+(c!=null?'<p class="exp '+(c===q.answer?'r':'w')+'" id="e'+i+'" tabindex="-1"><b>'+(c===q.answer?u('right'):u('wrong'))+'</b>'+lk(x(q.explain))+'</p>':'')+'</div>'}).join('');
 return '<section class="card glass quiz">'+lab(u('quiz'),'gold')+'<p class="muted" style="margin:-6px 0 14px">'+u('quizSub')+'</p>'+pips+qs+(qDone()?'<div class="score well" role="status"><span class="eyebrow">'+u('score')+'</span><span class="lcd" aria-label="'+ok+' / '+D.quiz.length+'">'+seg(ok+'/'+D.quiz.length)+'</span>'+(st.qs1?'<span class="muted">'+u('first')+': '+st.qs1[0]+'/'+st.qs1[1]+'</span>':'')+'<div class="row"><button class="btn ghost" id="retry" onclick="retry()">'+u('retry')+'</button></div></div>':'')+'</section>'}
function vid(v){if(!v)return '';const link=v.url?'<a href="'+esc(v.url)+'" target="_blank" rel="noopener">'+esc(x(v.title)||v.url)+'</a>'+(v.channel?' <span class="muted">· '+esc(v.channel)+(v.length?' · '+esc(v.length):'')+'</span>':''):'';const s=v.search?'<a href="https://www.youtube.com/results?search_query='+encodeURIComponent(v.search)+'" target="_blank" rel="noopener">'+u('noVid')+': '+esc(v.search)+'</a>':'';const alt=v.alt&&v.alt.url?'<br><span class="eyebrow">UA</span> <a href="'+esc(v.alt.url)+'" target="_blank" rel="noopener">'+esc(v.alt.title||v.alt.url)+'</a>'+(v.alt.channel?' <span class="muted">· '+esc(v.alt.channel)+'</span>':''):'';return '<div class="vid well">'+kn('play')+'<div><b>'+u('more')+'?</b><br>'+(link||s)+alt+(link&&s?'<br><span class="muted" style="font-size:14px">'+s+'</span>':'')+'</div></div>'}
function morning(){const m=D.morning;if(!m)return '';const q=m.quote||{};
 let shelf='';if(D.day>0){shelf='<div class="shelf" aria-hidden="true">';let g='';for(let d=0;d<D.day;d++){let p=0;try{p=(JSON.parse(localStorage.getItem('devteam:'+D.learner+':'+d))||{}).pct||0}catch(e){}g+='<i class="'+(p>=1?'d':'')+(d>0&&d%5===0?' bs':'')+'"></i>';if(d%5===0||d===D.day-1){shelf+='<span class="wkg">'+g+'</span>';g=''}}shelf+='</div>'}
 const qt=lang==='uk'&&q.original?q.original:x(q.text);
 return '<section class="card glass morning"><div class="mgrid">'+(m.sofar?'<div>'+lab(u('sofar'),'gold')+shelf+'<p class="mtxt">'+lk(x(m.sofar))+'</p></div>':'')+(m.today?'<div>'+lab(u('todayL'))+'<p class="mtxt">'+lk(x(m.today))+'</p></div>':'')+'</div>'+(m.cheer?'<p class="cheer">'+esc(x(m.cheer))+'</p>':'')+(qt?'<figure class="quote well">'+kn('quote')+'<blockquote>'+esc(qt)+'</blockquote>'+(q.author?'<figcaption>'+esc(x(q.author))+'</figcaption>':'')+'</figure>':'')+'</section>'}
function setLang(l){lang=l;try{localStorage.setItem('devteam:lang',lang)}catch(e){};render()}
function toggleLang(){setLang(lang==='uk'?'en':'uk')}
/* keep open sections and keyboard focus across re-renders */
const openD=new Set();
function tg(e){if(e.open)openD.add(e.id);else openD.delete(e.id)}
const op=id=>openD.has(id)?' open':'';
function render(){const ae=document.activeElement,fid=ae&&(ae.id||(ae.getAttribute('data-th')?'th-'+ae.getAttribute('data-th'):ae.getAttribute('lang')&&ae.closest('.seg')?'lg-'+ae.getAttribute('lang'):''));
 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);
 const b=D.build,P=Math.round(prog()*100);
 document.getElementById('top').innerHTML='<div class="topin glass"><a class="maplink" href="'+esc(D.mapHref)+'">'+kn('map')+u('map')+'</a><div class="crumb"><b>'+esc(x(D.learnerName))+'</b><span>'+u('week')+' '+D.week+'</span><span>'+u('day')+' '+D.day+' '+u('of')+' '+D.total+'</span></div>'+controls(lang,'setLang')+'</div><div class="tline"><i style="width:'+P+'%"></i></div>';
 const state=w=>w<D.week?'b':w===D.week?'n':'p';
 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 let wk='';if(D.weekInfo){const w=D.weekInfo;wk='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}
 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p>'+(b.next?'<div class="back well">'+kn('arrow')+'<div><b>'+u('comes')+'</b><br>'+lk(x(b.next))+'</div></div>':'')+'<div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.assetFiles&&D.assetFiles.length?'<p class="files">'+ic('folder')+'<span>'+u('filesL')+' '+D.assetFiles.map(f=>'<a href="assets/'+encodeURIComponent(f)+'" target="_blank" rel="noopener">'+esc(f)+'</a>').join(', ')+'</span></p>':D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+=handinCard();h+=beforeCard();
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div><label class="rcpt" for="r'+i+'"><span class="eyebrow">'+u('rcpt')+'</span><textarea id="r'+i+'" rows="2" placeholder="'+esc(u('rcptPh'))+'" oninput="st.r'+i+'=this.value;save()">'+esc(st['r'+i]||'')+'</textarea></label>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+hList()+chkList()+(hasClip?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<h3>1 · '+u('copyR')+'</h3><p class="muted">'+u('report')+'</p><div class="row"><button class="btn ghost" onclick="cp(reportText())">'+ic('copy')+u('copyR')+'</button></div><h3>2 · '+u('ship')+'</h3>'+hf()+'<p class="muted" style="margin:12px 0 0">'+u('hNote')+'</p></section>';
 h+=qCard();h+=wk;
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();
</script>
</body>
</html>

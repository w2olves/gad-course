cube.png (твій куб поруч із манекеном) (доказ)"}], "goal": {"en": "By the end of today you know where every file goes, you have spent a first hour in Blender, and a 1 m cube you made stands beside the mannequin in your own Unreal project, IslandCourse.", "uk": "До кінця дня ти знаєш, куди йде кожен файл, перша година в Blender позаду, а твій куб 1 м стоїть поруч із манекеном у твоєму власному проєкті Unreal — IslandCourse."}, "uses": [{"en": "the Before Day 0 list on ACCOUNTS-AND-INSTALLS.html: your accounts, Blender, Krita and Unreal Engine 5.8 installed", "uk": "список «До Дня 0» на сторінці ACCOUNTS-AND-INSTALLS.html: твої акаунти та встановлені Blender, Krita й Unreal Engine 5.8"}], "quiz": [{"q": {"en": "You downloaded a file called photos.zip. What do you do before you use the photos inside?", "uk": "У тебе є завантажений файл photos.zip. Що зробити, перш ніж користуватися фото всередині?"}, "options": [{"en": "Rename it to photos.blend", "uk": "Перейменувати його на photos.blend"}, {"en": "Right-click it > Extract All, then use the new folder", "uk": "Клацнути на ньому правою кнопкою > Видобути все (Extract All), а тоді працювати з новою папкою"}, {"en": "Open it in Blender", "uk": "Відкрити його в Blender"}, {"en": "Delete it and download it again", "uk": "Видалити його й завантажити знову"}], "answer": 1, "explain": {"en": "A zip packs many files into one. Extract All unpacks them into a normal folder you can use.", "uk": "Zip пакує багато файлів в один. «Видобути все» розпаковує їх у звичайну папку, з якою можна працювати."}}, {"q": {"en": "In Blender, the sidebar shows Scale 0.5 and Dimensions 1 m. What does Ctrl+A > Scale do?", "uk": "У Blender бічна панель показує Scale 0.5 і Dimensions 1 м. Що робить Ctrl+A > Scale?"}, "options": [{"en": "Sets Scale to 1 and keeps the size at 1 m", "uk": "Ставить Scale на 1, а розмір лишає 1 м"}, {"en": "Makes the cube 2 m again", "uk": "Знову робить куб завбільшки 2 м"}, {"en": "Moves the cube onto the grid", "uk": "Ставить куб на сітку підлоги"}], "answer": 0, "explain": {"en": "Applying the scale makes the current size the object's normal size, so Scale reads 1. Unreal then reads the size correctly.", "uk": "Коли застосовуєш масштаб, поточний розмір стає звичайним розміром об'єкта, тож Scale показує 1. Тоді Unreal правильно зчитує розмір."}}, {"q": {"en": "In Unreal you add 100 to a cube's Location X. How far does it move?", "uk": "В Unreal ти додаєш 100 до Location X куба. На скільки він зсунеться?"}, "options": [{"en": "100 m", "uk": "100 м"}, {"en": "10 cm", "uk": "10 см"}, {"en": "1 m", "uk": "1 м"}, {"en": "100 mm", "uk": "100 мм"}], "answer": 2, "explain": {"en": "Unreal counts in centimetres, so 100 means 100 cm, which is 1 m.", "uk": "Unreal рахує в сантиметрах, тож 100 означає 100 см, тобто 1 м."}}, {"q": {"en": "You press Win+Alt+R and no clip is recorded. What is the most likely fix?", "uk": "Ти натискаєш Win+Alt+R, а кліп не записується. Що найімовірніше допоможе?"}, "options": [{"en": "Reinstall Blender", "uk": "Перевстановити Blender"}, {"en": "Press Ctrl+S first", "uk": "Спершу натиснути Ctrl+S"}, {"en": "Restart Unreal", "uk": "Перезапустити Unreal"}, {"en": "Click inside the program window, and check that Xbox Game Bar opens with Win+G", "uk": "Клацнути всередині вікна програми й перевірити, чи Xbox Game Bar відкривається клавішами Win+G"}], "answer": 3, "explain": {"en": "Win+Alt+R belongs to Xbox Game Bar, Windows' own recorder. It records program windows, not the desktop, and does nothing if Game Bar is missing; Snipping Tool's Record button is the backup.", "uk": "Win+Alt+R належить Xbox Game Bar — вбудованому записувачу Windows. Він записує вікна програм, а не робочий стіл, і без Game Bar нічого не робить. Запасний варіант — кнопка Record у Snipping Tool."}}, {"q": {"en": "You want to move one face of the cube, not the whole cube. What do you do first?", "uk": "Ти хочеш перемістити одну грань куба, а не весь куб. Що зробити спершу?"}, "options": [{"en": "Press N", "uk": "Натиснути N"}, {"en": "Press Numpad 5", "uk": "Натиснути Numpad 5"}, {"en": "Press Tab for Edit Mode, then 3 for face select", "uk": "Натиснути Tab, щоб перейти в Edit Mode, потім 3, щоб виділяти грані"}, {"en": "Press Home", "uk": "Натиснути Home"}], "answer": 2, "explain": {"en": "Object Mode moves whole objects. Edit Mode (Tab) lets you select and move vertices, edges and faces.", "uk": "Object Mode рухає цілі об'єкти. В Edit Mode (Tab) можна виділяти й переміщати вершини, ребра й грані."}}], "weekInfo": null, "morning": {"sofar": {"en": "You chose to start this course and finished the Before Day 0 list: your accounts and programs are ready.", "uk": "Почати цей курс — твій вибір, і список «До Дня 0» уже виконано: акаунти й програми готові."}, "today": {"en": "You set up your course folders, spend a first hour in Blender, and stand a 1 m cube you made beside the mannequin in your own Unreal project, IslandCourse.", "uk": "Сьогодні ти створюєш папки курсу, проводиш першу годину в Blender і ставиш власний куб 1 м поруч із манекеном у своєму проєкті Unreal — IslandCourse."}, "cheer": {"en": "Every game artist once opened these programs for the first time, so go at your own pace and ask your tutor about anything at all.", "uk": "Кожен ігровий художник колись уперше відкривав ці самі програми, тож рухайся у своєму темпі й питай тьютора про будь-що."}, "quote": {"text": {"en": "You're off to great places. Today is your day! Your mountain is waiting. So... get on your way.", "uk": "Перед тобою — чудові місця! Сьогодні твій день! Твоя гора чекає. Тож... вирушай у путь!"}, "author": {"en": "Dr. Seuss", "uk": "Доктор Сьюз"}, "source": "https://en.wikiquote.org/wiki/Dr._Seuss"}}, "hasAssets": false, "workPath": "Work\\Assignment\\Day-00-setup", "mapHref": "../../COURSE.html", "prevHref": "", "nextHref": "../Day-01-bollard/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Windows, Blender and Unreal Engine 5.8. I am a beginner on Day 0. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me and don't write code.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: Самостійно: підведи манекена до куба й збережи скриншот unreal_cube.png.\nIt's part of: Твій ПК готовий до Дня 1: папки, перша сцена в Blender і проєкт IslandCourse із твоїм кубом 1 м (Твій власний ПК. IslandCourse — проєкт Unreal, у якому ти тренуєшся з Дня 6 і будуєш увесь острів із Дня 26.).\nWhy it matters: Кожен урок іде в чаті з тьютором, а кожен день закінчується в Unreal. Сьогодні ти один раз проходиш увесь шлях: один метр у Blender стає одним метром в Unreal. Студії називають цей шлях пайплайном (pipeline). Пайплайн, перевірений один раз, згодом заощаджує години виправлень. It comes back: Кожен день в Unreal проходить в IslandCourse, а з Дня 26 у ньому росте твій острів. Куб 1 м — твоя перевірка масштабу: кожна наступна модель проходить ту саму перевірку поруч із манекеном.\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-00-setup (on the drive I chose on Day 0).\nWhat I already know: список «До Дня 0» на сторінці ACCOUNTS-AND-INSTALLS.html: твої акаунти та встановлені Blender, Krita й Unreal Engine 5.8; today's lessons: Твій ПК готовий: перша сцена, папки, zip-архіви й скриншоти; Твоя перша година в Blender; Куб 1 м із Blender в IslandCourse. Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- Список «До Дня 0» виконано: акаунти створено, Blender, Krita й Unreal встановлено (5.8 або 4.27 на старішому ПК).\n- Тьютор працює: ти пишеш йому в Gemini (в акаунті Google, з яким поділилися твоєю папкою здачі) або в ChatGPT, і він відповідає українською у звичайному чаті.\n- Провідник показує розширення імен файлів, робоча папка дня GAD\\Day-00-setup є на твоєму найшвидшому диску, і ти вмієш запакувати папку в zip і розпакувати її на робочому столі.\n- Проєкт Unreal IslandCourse створено з шаблону Third Person, у ньому ввімкнено плагін Water. Ти керуєш манекеном: Play, потім W, A, S, D; Esc зупиняє.\n- У Content Browser проєкту IslandCourse є папка Course, а в ній — Day00.\n- cube_day0.blend рахує в метрах (Unit Scale 1.0). У ньому куб рівно 1 м з кожного боку, зі Scale 1, на сітці підлоги. Файл відкривається знову, і куб видно в Outliner.\n- В Unreal куб 1 м стоїть на підлозі поруч із манекеном.\n- Win+Shift+S робить скриншот, який ти вставляєш у чат із тьютором.\n- У summary.md є рядок про твій ПК: відеокарта та її пам'ять, оперативна пам'ять, версії Blender і Unreal.\n\nMy checklist (the same numbers show on my course page):\n1. Перевір список «До Дня 0» на сторінці ACCOUNTS-AND-INSTALLS.html: кожен рядок позначено, Unreal встановлено (5.8 або 4.27 на старішому ПК). Unreal ще завантажується? Зроби зараз уроки 1 і 2, а до Unreal повернися потім. Перевірка: картку «Перед уроком 1» угорі цієї сторінки виконано, і тьютор відповідає тобі українською.\n2. Урок 1 з тьютором: папки на твоєму ПК, zip-архіви та скриншоти. Перевірка: Провідник показує розширення, у GAD\\Day-00-setup лежить summary.md, а на робочому столі не лишилося нічого від вправи з zip. (from lesson 1)\n3. Урок 2 з тьютором: твоя перша година в Blender. Збережи cube_day0.blend у робочій папці дня. Перевірка: ти обертаєш вид, зсуваєш і наближаєш його, виділяєш грань і скасовуєш дію, не заглядаючи в нотатки. (from lesson 2)\n4. Коли на плитці Unreal в Epic Games Launcher з'явиться кнопка Launch, клацни її. У Project Browser клацни Games > Third Person. Бачиш список Variant? Вибери None. Вибери Blueprint, Target Platform — Desktop, Quality Preset — Maximum. Прапорець Starter Content не вмикай. Перевірка: Third Person підсвічено, вибрано Maximum.\n5. Project Location: клацни Browse, створи на найшвидшому диску папку Unreal (наприклад, D:\\Unreal) і вибери її. Project Name: IslandCourse. Клацни Create і зачекай 10–30 хвилин, поки Unreal готує шейдери. Старіший Unreal (4.27) або слабкий ПК: дай йому до години й див. розділ «Слабкий ПК» на сторінці ACCOUNTS-AND-INSTALLS.html. Перевірка: відкривається сірий рівень із манекеном.\n6. Натисни зелену кнопку Play угорі. Керуй манекеном клавішами W, A, S і D, камеру повертай мишею, а Esc зупиняє гру. Манекен має зріст близько 1,8 м — це твоя перевірка масштабу на весь курс. Перевірка: манекен бігає й зупиняється, коли ти натискаєш Esc.\n7. Увімкни плагін Water — він додає океани, озера й річки. Відкрий Edit > Plugins, у пошуку введи Water і познач лише той плагін, що зветься Water. Unreal попереджає, що він Experimental (рання версія), або просить додати потрібні плагіни? Клацни Yes. Потім клацни Restart Now. Перевірка: після перезапуску в Edit > Plugins прапорець Water увімкнено.\n8. Урок 3 з тьютором: куб 1 м із Blender у папку Course/Day00 проєкту IslandCourse. Перевірка: у Провіднику cube_day0.glb має близько 2 КБ (1 КБ означає порожній файл), а куб стоїть на підлозі поруч із манекеном. Старіший Unreal (4.27) або слабкий ПК: якщо .glb не імпортується, експортуй натомість .fbx (File > Export > FBX). (from lesson 3)\n9. Самостійно: натисни Play і підведи манекена до свого куба. Натисни Win+Shift+S, захопи екран, клацни спливне вікно й значок збереження в ньому. Збережи unreal_cube.png у робочій папці дня. Натисни Esc. Перевірка: на картинці манекен поруч із кубом. (from lesson 3)\n10. Перевір збереження: закрий Blender і двічі клацни cube_day0.blend у робочій папці дня. Сцена відкривається порожня? File > Recover > Auto Save, вибери найновіший файл, потім File > Save As поверх cube_day0.blend. Перевірка: куб видно у в'юпорті й в Outliner. (from lesson 2)\n11. Звіт: клацни «Копіювати звіт дня» на цій сторінці, встав у новий чат із тьютором і дай відповіді. Розкажи йому про свій ПК: відеокарта та її пам'ять (Ctrl+Shift+Esc > Продуктивність (Performance) > GPU), оперативна пам'ять (Win+I > Система > Про систему (About)), версії Blender і Unreal. Встав його відповідь у summary.md (Блокнот) і натисни Ctrl+S. Перевірка: у summary.md твій текст і рядок про ПК. (from lesson 1)\n12. Здай роботу: перетягни файли в сьогоднішню папку здачі (кнопка «Відкрити мою папку здачі» на цій сторінці). Відкривається Work > Assignment? Спершу відкрий Day-00-setup. Перетягни summary.md, cube_day0.blend і unreal_cube.png. Потім відкрий День 1 на сторінці курсу. Перевірка: у папці на Drive видно всі три назви, у кожної є розмір. (from lesson 1)\n\nHow to help: ask which step number I'm on, then give me only the next step: the exact clicks and what I should see. When I send a screenshot, compare it with my reference, my sizes and the spec, and name one thing to fix at a time.\nCheck every save and export by reopening it before we move on:\n- a .blend: close Blender, double-click the file in today's day work folder (GAD\\Day-00-setup), and the model is there (an empty grid means the wrong file was saved)\n- a .md or .txt: open it with Notepad; the text is there, and the name doesn't end in .md.txt\nWhen I write \"готово\", and in any case before the day ends, check with me one item at a time (yes/no): each spec point, then each file on my hand-in list, ready in my day work folder (skip summary.md: the day report writes it next):\n1. cube_day0.blend (збереження працює, файл відкривається з кубом) (доказ)\n2. unreal_cube.png (твій куб поруч із манекеном) (доказ)\nFinish with a short list of anything missing, and one line on where this work comes back and what it will look like there. Then tell me the order for the end of the day: first the day report (the Copy the day report button at the bottom of my course page) into summary.md, and only then hand in all the files on the list, summary.md too.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; see-why-fix note = нотатка «бачу, чому, як виправити»; checklist = чек-лист; credits line = рядок авторства; reference photo / hero photo = фото-референс / ключове фото; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); File Explorer = Провідник; mesh = меш; grid = сітка (тільки grid, ніколи mesh); vertex / edge / face = вершина / ребро / грань; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; collision / UCX collision box = колізія / блок UCX; grey box placeholder = сірий блок (заглушка); kit / kit piece / part of one object = набір / деталь / частина; map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; district / plot / plot plan = район / ділянка / план ділянки; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.\n\nStart by asking for my best reference photo. Then, one at a time, my sizes and my step number.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender.", "reportPrompt": "Help me write today's report for summary.md. I write it before I hand in. Talk to me in simple Ukrainian, and never use gendered forms about me. Keep the English labels below exactly; the text after each label may be Ukrainian.\nAsk me one thing at a time, and skip whatever I've already pasted below:\n1. My PC: the graphics card and its memory (Task Manager > Performance > GPU), the RAM (Task Manager > Performance > Memory), and my Blender and Unreal versions (Help > About in each).\n2. My lesson summaries («Засвоєно» / «Було важко»), or which lessons I skipped.\n3. My first score in the page's \"Check yourself\" quiz.\n4. How far the build got: done, partly or blocked (if blocked, where).\n5. My hand-in list, one item at a time (skip summary.md): is the file ready in my day work folder (GAD\\Day-00-setup)? (yes/no)\n   - cube_day0.blend (збереження працює, файл відкривається з кубом) (доказ)\n   - unreal_cube.png (твій куб поруч із манекеном) (доказ)\n6. The checks: my .blend reopens with the model inside.\n7. One question for Thalia (about any day; start with the day number), or \"none\".\n8. Whether I fixed an earlier day today (which day and what), or \"no\".\n9. About how many hours today took.\nThen give me the finished report in one block I can copy:\n\nTeam summary, <date>, Svetlana\nDay 0: Set-up: your folders, a first hour in Blender and your Unreal project. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nPC: <graphics card, VRAM, RAM; Blender x.y, Unreal x.y>\nReady to hand in: <tick each item of today's list: ✓ name, or ✗ name and why it isn't ready>\nMissing: <files not ready, or \"none\">\nFixed: <Day N: what I fixed (the fixed files are in that day's hand-in folder), or \"none\">\nChecks: <blend reopens: ok, or what's wrong>\nQuestion for Thalia: <Day N: one line, or \"none\">\nHours: <about N>\nTo revisit: <the «Було важко» lines>\n\nThen tell me: open summary.md in today's day work folder (GAD\\Day-00-setup) with Notepad (right-click > Open with > Notepad; if there is no summary.md yet, make it: right-click > New > Text Document, named summary.md). Press Ctrl+End, paste the report below anything already there, and save with Ctrl+S. Never delete or paste over what is already in the file. Only then hand in all the files on the list, summary.md too, with the Open my hand-in folder button on the page.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); File Explorer = Провідник; mesh = меш; grid = сітка (тільки grid, ніколи mesh); vertex / edge / face = вершина / ребро / грань; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; kit / kit piece / part of one object = набір / деталь / частина; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.", "before": [{"en": "Open gemini.google.com in the Google account your hand-in folder was shared with (the address is in your email). Never make a new Gmail for the course. No Google account on that address? Reply to that email first.", "uk": "Відкрий gemini.google.com в акаунті Google, з яким поділилися твоєю папкою здачі (адреса є в листі). Не створюй нову пошту Gmail для курсу. На цю адресу немає акаунта Google? Спершу відповідай на той лист."}, {"en": "Open the hand-in folder link from the same email: you see a folder with your name, and Work inside it. Empty, or \"You need access\"? Reply to that email and we'll sort it out together.", "uk": "Відкрий посилання на папку здачі з того самого листа. Має вийти: папка з твоїм іменем, а в ній Work. Папка порожня або пише «Потрібен доступ» (You need access)? Відповідай на той лист — розберемося разом."}, {"en": "In Gemini, start a New chat (no Guided Learning or Canvas) and send: \"Привіт! Відповідай українською.\" Free limit reached? Use chatgpt.com with the same Google account. Never paste passwords into a chat. Check: the tutor answers in Ukrainian.", "uk": "У Gemini почни новий чат (New chat) без Guided Learning і Canvas і надішли: «Привіт! Відповідай українською.» Безкоштовний ліміт вичерпано? Відкрий chatgpt.com у тому самому акаунті Google. Ніколи не вставляй паролі в чат. Перевірка: тьютор відповідає українською."}], "handinUrl": "https://drive.google.com/drive/folders/1FyfgRxjh0CdzAsHKTE9VF6H86yHSoGE3", "assetFiles": []}</script>

function vid(v){if(!v)return '';const link=v.url?'<a href="'+esc(v.url)+'" target="_blank" rel="noopener">'+esc(x(v.title)||v.url)+'</a>'+(v.channel?' <span class="muted">· '+esc(v.channel)+(v.length?' · '+esc(v.length):'')+'</span>':''):'';const s=v.search?'<a href="https://www.youtube.com/results?search_query='+encodeURIComponent(v.search)+'" target="_blank" rel="noopener">'+u('noVid')+': '+esc(v.search)+'</a>':'';const alt=v.alt&&v.alt.url?'<br><span class="eyebrow">UA</span> <a href="'+esc(v.alt.url)+'" target="_blank" rel="noopener">'+esc(v.alt.title||v.alt.url)+'</a>'+(v.alt.channel?' <span class="muted">· '+esc(v.alt.channel)+'</span>':''):'';return '<div class="vid well">'+kn('play')+'<div><b>'+u('more')+'?</b><br>'+(link||s)+alt+(link&&s?'<br><span class="muted" style="font-size:14px">'+s+'</span>':'')+'</div></div>'}
function morning(){const m=D.morning;if(!m)return '';const q=m.quote||{};
 let shelf='';if(D.day>0){shelf='<div class="shelf" aria-hidden="true">';let g='';for(let d=0;d<D.day;d++){let p=0;try{p=(JSON.parse(localStorage.getItem('devteam:'+D.learner+':'+d))||{}).pct||0}catch(e){}g+='<i class="'+(p>=1?'d':'')+(d>0&&d%5===0?' bs':'')+'"></i>';if(d%5===0||d===D.day-1){shelf+='<span class="wkg">'+g+'</span>';g=''}}shelf+='</div>'}
 const qt=lang==='uk'&&q.original?q.original:x(q.text);
 return '<section class="card glass morning"><div class="mgrid">'+(m.sofar?'<div>'+lab(u('sofar'),'gold')+shelf+'<p class="mtxt">'+lk(x(m.sofar))+'</p></div>':'')+(m.today?'<div>'+lab(u('todayL'))+'<p class="mtxt">'+lk(x(m.today))+'</p></div>':'')+'</div>'+(m.cheer?'<p class="cheer">'+esc(x(m.cheer))+'</p>':'')+(qt?'<figure class="quote well">'+kn('quote')+'<blockquote>'+esc(qt)+'</blockquote>'+(q.author?'<figcaption>'+esc(x(q.author))+'</figcaption>':'')+'</figure>':'')+'</section>'}
function setLang(l){lang=l;try{localStorage.setItem('devteam:lang',lang)}catch(e){};render()}
function toggleLang(){setLang(lang==='uk'?'en':'uk')}
/* keep open sections and keyboard focus across re-renders */
const openD=new Set();
function tg(e){if(e.open)openD.add(e.id);else openD.delete(e.id)}
const op=id=>openD.has(id)?' open':'';
function render(){const ae=document.activeElement,fid=ae&&(ae.id||(ae.getAttribute('data-th')?'th-'+ae.getAttribute('data-th'):ae.getAttribute('lang')&&ae.closest('.seg')?'lg-'+ae.getAttribute('lang'):''));
 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);
 const b=D.build,P=Math.round(prog()*100);
 document.getElementById('top').innerHTML='<div class="topin glass"><a class="maplink" href="'+esc(D.mapHref)+'">'+kn('map')+u('map')+'</a><div class="crumb"><b>'+esc(x(D.learnerName))+'</b><span>'+u('week')+' '+D.week+'</span><span>'+u('day')+' '+D.day+' '+u('of')+' '+D.total+'</span></div>'+controls(lang,'setLang')+'</div><div class="tline"><i style="width:'+P+'%"></i></div>';
 const state=w=>w<D.week?'b':w===D.week?'n':'p';
 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 let wk='';if(D.weekInfo){const w=D.weekInfo;wk='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}
 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p>'+(b.next?'<div class="back well">'+kn('arrow')+'<div><b>'+u('comes')+'</b><br>'+lk(x(b.next))+'</div></div>':'')+'<div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.assetFiles&&D.assetFiles.length?'<p class="files">'+ic('folder')+'<span>'+u('filesL')+' '+D.assetFiles.map(f=>'<a href="assets/'+encodeURIComponent(f)+'" target="_blank" rel="noopener">'+esc(f)+'</a>').join(', ')+'</span></p>':D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+=handinCard();h+=beforeCard();
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div><label class="rcpt" for="r'+i+'"><span class="eyebrow">'+u('rcpt')+'</span><textarea id="r'+i+'" rows="2" placeholder="'+esc(u('rcptPh'))+'" oninput="st.r'+i+'=this.value;save()">'+esc(st['r'+i]||'')+'</textarea></label>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+hList()+chkList()+(hasClip?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<h3>1 · '+u('copyR')+'</h3><p class="muted">'+u('report')+'</p><div class="row"><button class="btn ghost" onclick="cp(reportText())">'+ic('copy')+u('copyR')+'</button></div><h3>2 · '+u('ship')+'</h3>'+hf()+'<p class="muted" style="margin:12px 0 0">'+u('hNote')+'</p></section>';
 h+=qCard();h+=wk;
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();
</script>

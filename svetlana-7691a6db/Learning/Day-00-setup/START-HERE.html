<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 0</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

details{margin-top:22px;border-radius:20px;background:var(--well);box-shadow:var(--press);padding:0 18px}

details[open] summary .chev{transform:rotate(180deg)}

.steps{list-style:none;padding:0;counter-reset:s;margin:4px 0 0}

.vid{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;margin-top:20px;font-size:15px;padding:16px 18px;border-radius:20px}

/* build */
.build.bossday{border-color:rgba(255,95,168,.35)}

.tiers{list-style:none;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:0}
.tiers li{margin:0;padding:16px 18px;border-radius:20px;font-size:14.5px;line-height:1.55;color:var(--muted);background:var(--card);box-shadow:var(--raiseS)}
.medal{display:flex;align-items:center;gap:10px;margin:0 0 8px;font:700 11.5px/1 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}

.m0{--mg:rgba(205,127,50,.6)}.m0 i{background:linear-gradient(135deg,#e7a46d,#9a5a2b)}
.m1{--mg:rgba(190,200,215,.7)}.m1 i{background:linear-gradient(135deg,#f3f6fa,#9aa5b3)}
.m2{--mg:rgba(245,195,91,.75)}.m2 i{background:linear-gradient(135deg,#ffe08a,#c99412)}
.ccount{display:flex;align-items:center;gap:16px;margin:28px 0 10px}

.check{list-style:none;padding:0;margin:0}
.check li{margin:0}
.check label{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:start;padding:14px 4px;cursor:pointer;border-bottom:1px solid var(--line)}
.check li:last-child label{border-bottom:0}
.check{counter-reset:c}.check li{counter-increment:c}.check .tx::before{content:counter(c) ". ";font:700 14px/1 var(--head);color:var(--accT)}
.check input{appearance:none;-webkit-appearance:none;width:26px;height:26px;margin:1px 0 0;border-radius:9px;background:var(--well);box-shadow:var(--press);display:grid;place-items:center;cursor:pointer;transition:background .2s,box-shadow .2s}
.check input::after{content:"";width:10px;height:5px;border:solid #fff;border-width:0 0 2.2px 2.2px;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.check input:checked{background:linear-gradient(145deg,#5fe39a,#16a34a);box-shadow:0 0 12px rgba(74,222,128,.55)}
.check input:checked::after{opacity:1}
.check li.on .tx{color:var(--faint)}
.check .ln{font:600 10.5px/1.3 var(--head);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);white-space:nowrap;margin-top:5px;padding:4px 9px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
/* quiz */
.pips{display:flex;gap:8px;margin:0 0 4px;padding:10px 14px;border-radius:999px;width:max-content;max-width:100%;flex-wrap:wrap}
.pips i{width:9px;height:9px;border-radius:50%;background:var(--line2)}
.pips i.r{background:var(--okL);box-shadow:0 0 8px var(--okL)}.pips i.w{background:var(--badL);box-shadow:0 0 8px var(--badL)}
.qz{margin:28px 0 0;padding:28px 0 0;border-top:1px solid var(--line)}
.qz:first-of-type{border-top:0;padding-top:10px;margin-top:10px}
.qq{display:grid;grid-template-columns:40px 1fr;gap:10px;font:600 17.5px/1.45 var(--head);letter-spacing:-.005em;margin:0 0 14px}
.qq .qn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 13px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.opt{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;width:calc(100% - 50px);margin:12px 0 12px 50px;text-align:left;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid transparent;border-radius:18px;padding:11px 16px;cursor:pointer;box-shadow:var(--raiseS);transition:box-shadow .2s,transform .15s}
.opt .lt{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 12.5px/1 var(--head);color:var(--faint);background:var(--well);box-shadow:var(--press)}

.opt.right{box-shadow:var(--press);background:var(--okBg);border-color:rgba(74,222,128,.45)}.opt.right .lt{background:var(--okL);color:#fff;box-shadow:0 0 10px var(--okL)}.opt.right .mk{color:var(--ok)}
.opt.wrong{box-shadow:var(--press);background:var(--badBg);border-color:rgba(255,93,93,.45)}.opt.wrong .lt{background:var(--badL);color:#fff;box-shadow:0 0 10px var(--badL)}.opt.wrong .mk{color:var(--bad)}

.nav a.nx{justify-content:flex-end;text-align:right;grid-column:2}
#toast{position:fixed;left:50%;bottom:28px;z-index:9;transform:translateX(-50%) translateY(16px);background:rgba(30,33,46,.82);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:#f4f5fa;border:1px solid rgba(255,255,255,.14);padding:13px 24px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none;font:600 14px/1.4 var(--head);max-width:min(92vw,560px);text-align:center;box-shadow:0 20px 40px -14px rgba(0,0,0,.5),0 0 24px var(--glow)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

 body{font-size:16.5px}

}

підлозі поруч із манекеном."}, {"en": "Win+Shift+S takes a screenshot that you can paste into the tutor chat.", "uk": "Win+Shift+S робить скриншот, який ти вставляєш у чат із тьютором."}, {"en": "summary.md has your PC line: graphics card and its memory, RAM, and your Blender and Unreal versions.", "uk": "У summary.md є рядок про твій ПК: відеокарта та її пам'ять, оперативна пам'ять, версії Blender і Unreal."}], "piece1": "a 1 m cube (your first Blender scene)", "piece2": {"en": "Walk your mannequin to the cube and take unreal_cube.png, on your own", "uk": "Самостійно: підведи манекена до куба й збережи скриншот unreal_cube.png"}, "steps": [{"text": {"en": "Check the Before Day 0 list on ACCOUNTS-AND-INSTALLS.html: every line ticked and Unreal installed (5.8, or 4.27 on an older PC). If the download is still running, do Lessons 1 and 2 now and come back to Unreal after. Check: the Before lesson 1 card at the top of this page is done, and the tutor answers you in Ukrainian.", "uk": "Перевір список «До Дня 0» на сторінці ACCOUNTS-AND-INSTALLS.html: кожен рядок позначено, Unreal встановлено (5.8 або 4.27 на старішому ПК). Unreal ще завантажується? Зроби зараз уроки 1 і 2, а до Unreal повернися потім. Перевірка: картку «Перед уроком 1» угорі цієї сторінки виконано, і тьютор відповідає тобі українською."}}, {"text": {"en": "Lesson 1 with the tutor: your PC's folders, zips and screenshots. Check: File Explorer shows extensions, GAD\\Day-00-setup holds summary.md, and no zip practice is left on your Desktop.", "uk": "Урок 1 з тьютором: папки на твоєму ПК, zip-архіви та скриншоти. Перевірка: Провідник показує розширення, у GAD\\Day-00-setup лежить summary.md, а на робочому столі не лишилося нічого від вправи з zip."}, "lesson": 1}, {"text": {"en": "Lesson 2 with the tutor: your first hour in Blender. Save cube_day0.blend in the day work folder. Check: you can orbit, pan, zoom, select a face and undo without looking at notes.", "uk": "Урок 2 з тьютором: твоя перша година в Blender. Збережи cube_day0.blend у робочій папці дня. Перевірка: ти обертаєш вид, зсуваєш і наближаєш його, виділяєш грань і скасовуєш дію, не заглядаючи в нотатки."}, "lesson": 2}, {"text": {"en": "When the Unreal tile in the Epic Games Launcher shows Launch, click it. In the Project Browser click Games > Third Person. If you see a Variant list, choose None. Choose Blueprint, Target Platform Desktop and Quality Preset Maximum; leave any Starter Content box unticked. Check: Third Person is highlighted and Maximum is chosen.", "uk": "Коли на плитці Unreal в Epic Games Launcher з'явиться кнопка Launch, клацни її. У Project Browser клацни Games > Third Person. Бачиш список Variant? Вибери None. Вибери Blueprint, Target Platform — Desktop, Quality Preset — Maximum. Прапорець Starter Content не вмикай. Перевірка: Third Person підсвічено, вибрано Maximum."}}, {"text": {"en": "Project Location: click Browse, make a folder Unreal on your fastest drive (for example D:\\Unreal) and pick it. Project Name: IslandCourse. Click Create and wait 10 to 30 minutes while Unreal prepares its shaders. Older Unreal (4.27) or weak PC: allow up to an hour, and see Weak PC on ACCOUNTS-AND-INSTALLS.html. Check: a grey level with a mannequin opens.", "uk": "Project Location: клацни Browse, створи на найшвидшому диску папку Unreal (наприклад, D:\\Unreal) і вибери її. Project Name: IslandCourse. Клацни Create і зачекай 10–30 хвилин, поки Unreal готує шейдери. Старіший Unreal (4.27) або слабкий ПК: дай йому до години й див. розділ «Слабкий ПК» на сторінці ACCOUNTS-AND-INSTALLS.html. Перевірка: відкривається сірий рівень із манекеном."}}, {"text": {"en": "Press the green Play button at the top. Walk the mannequin with W, A, S and D, turn the camera with the mouse, and press Esc to stop. The mannequin is about 1.8 m tall: your scale check for the whole course. Check: the mannequin runs around and stops when you press Esc.", "uk": "Натисни зелену кнопку Play угорі. Керуй манекеном клавішами W, A, S і D, камеру повертай мишею, а Esc зупиняє гру. Манекен має зріст близько 1,8 м — це твоя перевірка масштабу на весь курс. Перевірка: манекен бігає й зупиняється, коли ти натискаєш Esc."}}, {"text": {"en": "Switch on the Water plugin (it adds oceans, lakes and rivers): Edit > Plugins, type Water in the search box and tick only the one named Water. If Unreal warns it is Experimental (an early version) or asks for plugins it needs, click Yes. Click Restart Now. Check: after the restart, Edit > Plugins still shows Water ticked.", "uk": "Увімкни плагін Water — він додає океани, озера й річки. Відкрий Edit > Plugins, у пошуку введи Water і познач лише той плагін, що зветься Water. Unreal попереджає, що він Experimental (рання версія), або просить додати потрібні плагіни? Клацни Yes. Потім клацни Restart Now. Перевірка: після перезапуску в Edit > Plugins прапорець Water увімкнено."}}, {"text": {"en": "Lesson 3 with the tutor: the 1 m cube from Blender into Course/Day00 in IslandCourse. Check: cube_day0.glb is about 2 KB in File Explorer (1 KB means empty), and the cube stands on the floor beside the mannequin. Older Unreal (4.27) or weak PC: if the .glb won't import, export an .fbx instead (File > Export > FBX).", "uk": "Урок 3 з тьютором: куб 1 м із Blender у папку Course/Day00 проєкту IslandCourse. Перевірка: у Провіднику cube_day0.glb має близько 2 КБ (1 КБ означає порожній файл), а куб стоїть на підлозі поруч із манекеном. Старіший Unreal (4.27) або слабкий ПК: якщо .glb не імпортується, експортуй натомість .fbx (File > Export > FBX)."}, "lesson": 3}, {"text": {"en": "On your own: press Play and walk the mannequin up to your cube. Press Win+Shift+S, capture the screen, click the pop-up and its save icon, and save unreal_cube.png in the day work folder. Press Esc. Check: the picture shows the mannequin beside the cube.", "uk": "Самостійно: натисни Play і підведи манекена до свого куба. Натисни Win+Shift+S, захопи екран, клацни спливне вікно й значок збереження в ньому. Збережи unreal_cube.png у робочій папці дня. Натисни Esc. Перевірка: на картинці манекен поруч із кубом."}, "lesson": 3}, {"text": {"en": "Save check: close Blender, then double-click cube_day0.blend in the day work folder. Opens empty? File > Recover > Auto Save, pick the newest file, then File > Save As over cube_day0.blend. Check: the cube shows in the viewport and in the Outliner.", "uk": "Перевір збереження: закрий Blender і двічі клацни cube_day0.blend у робочій папці дня. Сцена відкривається порожня? File > Recover > Auto Save, вибери найновіший файл, потім File > Save As поверх cube_day0.blend. Перевірка: куб видно у в'юпорті й в Outliner."}, "lesson": 2}, {"text": {"en": "Report: click Copy the day report on this page, paste it into a new tutor chat and answer. Tell it your PC: graphics card and its memory (Ctrl+Shift+Esc > Performance > GPU), RAM (Win+I > System > About), Blender and Unreal versions. Paste its answer into summary.md (Notepad) and press Ctrl+S. Check: summary.md has your text and a PC line.", "uk": "Звіт: клацни «Копіювати звіт дня» на цій сторінці, встав у новий чат із тьютором і дай відповіді. Розкажи йому про свій ПК: відеокарта та її пам'ять (Ctrl+Shift+Esc > Продуктивність (Performance) > GPU), оперативна пам'ять (Win+I > Система > Про систему (About)), версії Blender і Unreal. Встав його відповідь у summary.md (Блокнот) і натисни Ctrl+S. Перевірка: у summary.md твій текст і рядок про ПК."}, "lesson": 1}, {"text": {"en": "Hand in: drag the files into today's hand-in folder (the Open my hand-in folder button on this page); if it opens Work > Assignment, open Day-00-setup first. Drag in summary.md, cube_day0.blend and unreal_cube.png. Then open Day 1 on your course page. Check: all three names show in the Drive folder, each with a size.", "uk": "Здай роботу: перетягни файли в сьогоднішню папку здачі (кнопка «Відкрити мою папку здачі» на цій сторінці). Відкривається Work > Assignment? Спершу відкрий Day-00-setup. Перетягни summary.md, cube_day0.blend і unreal_cube.png. Потім відкрий День 1 на сторінці курсу. Перевірка: у папці на Drive видно всі три назви, у кожної є розмір."}, "lesson": 1}]}, "lessons": [{"title": {"en": "Your PC, ready: a first scene, folders, zips and screenshots", "uk": "Твій ПК готовий: перша сцена, папки, zip-архіви й скриншоти"}, "minutes": 40, "goals": [{"en": "Make the day work folder on your PC, find your hand-in folder on Google Drive, and switch on file name extensions.", "uk": "Створювати робочу папку дня на ПК, знаходити папку здачі на Google Drive і вмикати розширення імен файлів."}, {"en": "Make folders and text files, and keep every file where it belongs.", "uk": "Створювати папки й текстові файли і тримати кожен файл там, де йому місце."}, {"en": "Zip (pack) and unzip (unpack) a folder with Windows' own tools.", "uk": "Запаковувати папку в zip і розпаковувати її інструментами самої Windows."}, {"en": "Take a screenshot (Win+Shift+S) and paste it into the tutor chat.", "uk": "Робити скриншот (Win+Shift+S) і вставляти його в чат із тьютором."}], "doalong": [{"en": "Open Blender and click outside the welcome picture. You see the 3D Viewport (the big view), the Outliner (top right: everything in the scene) and Properties (bottom right). Press Shift+A > Mesh > Monkey: Suzanne, Blender's mascot, appears beside the cube.", "uk": "Відкрий Blender і клацни поза вітальною картинкою. Має вийти: в'юпорт (3D Viewport, великий вид), Outliner (угорі праворуч, усе в сцені) і Properties (унизу праворуч). Натисни Shift+A > Mesh > Monkey: поруч із кубом з'являється Сюзанна, талісман Blender."}, {"en": "File > Save As. In the save window open your fastest drive (often D:, or C: if you have only one), click the new-folder icon and make GAD, then inside it Day-00-setup: the day work folder. Save first_scene.blend there. You see first_scene.blend in the title bar.", "uk": "File > Save As. У вікні збереження відкрий свій найшвидший диск (часто D:, або C:, якщо диск один). Клацни значок нової папки й створи GAD, а в ній — Day-00-setup: це робоча папка дня. Збережи туди first_scene.blend. Має вийти: у рядку заголовка видно first_scene.blend."}, {"en": "Press Win+E and open GAD\\Day-00-setup: first_scene.blend is there. Click View > Show > File name extensions so a tick appears. Then right-click > New > Text Document and rename it summary.md (F2, change .txt to .md, click Yes). Check: the name ends in .md, not .md.txt.", "uk": "Натисни Win+E і відкрий GAD\\Day-00-setup: там лежить first_scene.blend. Клацни Вигляд > Показати > Розширення імен файлів (View > Show > File name extensions), щоб з'явилася позначка. Потім клацни правою кнопкою > Створити > Текстовий документ (New > Text Document) і перейменуй його на summary.md: F2, заміни .txt на .md, клацни «Так» (Yes). Перевірка: назва закінчується на .md, а не на .md.txt."}, {"en": "Bookmark your course page (Ctrl+D): it opens online at your personal link, which ends in COURSE.html. Open the hand-in folder link from your email, signed in to the Google account it was shared with. Open Work > Assignment: you see Day-00-setup and the other day folders. Nothing there? Reply to that email and we'll sort it out together.", "uk": "Додай сторінку курсу в закладки (Ctrl+D). Вона відкривається онлайн за твоїм особистим посиланням, що закінчується на COURSE.html. Відкрий посилання на папку здачі з листа в тому акаунті Google, з яким нею поділилися. Відкрий Work > Assignment: там є Day-00-setup та папки інших днів. Порожньо? Відповідай на той лист — розберемося разом."}, {"en": "Zip practice, on the Desktop (not in a hand-in folder): make a folder zip-test with a text file hello.txt inside. Right-click it > Compress to > ZIP File. Delete the folder, then right-click zip-test.zip > Extract All > Extract: it comes back. Now delete both.", "uk": "Вправа з zip — на робочому столі (не в папці здачі). Створи папку zip-test, а в ній текстовий файл hello.txt. Клацни папку правою кнопкою > Стиснути до > ZIP-файл (Compress to > ZIP File). Видали папку, потім клацни zip-test.zip правою кнопкою > Видобути все (Extract All) > Видобути: папка повертається. Тепер видали обидва."}, {"en": "Press Win+Shift+S, drag a box round Suzanne in Blender, click in the tutor chat and press Ctrl+V: the picture appears. Send it. On Friday you also record a short clip with Win+Alt+R. Not recording? Click in the program window; Win+G should open Xbox Game Bar.", "uk": "Натисни Win+Shift+S, обведи рамкою Сюзанну в Blender, клацни в чаті з тьютором і натисни Ctrl+V: картинка з'являється. Надішли її. У п'ятницю ти ще запишеш короткий кліп клавішами Win+Alt+R. Не записує? Клацни у вікні програми; Win+G має відкривати Xbox Game Bar."}], "play": {"en": "Folder detective: the tutor names five files (an installer, a photo, a zip, a Blender file, a clip); for each I say which folder it belongs in and which extension it has, then I find one real example on my PC and send a screenshot of it.", "uk": "Детектив папок: тьютор називає п'ять файлів (інсталятор, фото, zip, файл Blender, кліп). Для кожного я кажу, у якій папці йому місце і яке в нього розширення. Потім знаходжу один справжній приклад на своєму ПК і надсилаю скриншот."}, "video": {"search": "windows 11 file explorer file name extensions zip extract beginner"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Твій ПК готовий: перша сцена, папки, zip-архіви й скриншоти (Day 0, lesson 1 of 3). Today's build: Твій ПК готовий до Дня 1: папки, перша сцена в Blender і проєкт IslandCourse із твоїм кубом 1 м.\nWhat I already know: список «До Дня 0» на сторінці ACCOUNTS-AND-INSTALLS.html: твої акаунти та встановлені Blender, Krita й Unreal Engine 5.8.\n\nBy the end of this lesson I can:\n1. Створювати робочу папку дня на ПК, знаходити папку здачі на Google Drive і вмикати розширення імен файлів.\n2. Створювати папки й текстові файли і тримати кожен файл там, де йому місце.\n3. Запаковувати папку в zip і розпаковувати її інструментами самої Windows.\n4. Робити скриншот (Win+Shift+S) і вставляти його в чат із тьютором.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: Почати цей курс — твій вибір, і список «До Дня 0» уже виконано: акаунти й програми готові. Today: Сьогодні ти створюєш папки курсу, проводиш першу годину в Blender і ставиш власний куб 1 м поруч із манекеном у своєму проєкті Unreal — IslandCourse. One encouraging line: Кожен ігровий художник колись уперше відкривав ці самі програми, тож рухайся у своєму темпі й питай тьютора про будь-що.); 2 lines on why today matters and where it comes back, in plain words (from this: Кожен урок іде в чаті з тьютором, а кожен день закінчується в Unreal. Сьогодні ти один раз проходиш увесь шлях: один метр у Blender стає одним метром в Unreal. Студії називають цей шлях пайплайном (pipeline). Пайплайн, перевірений один раз, згодом заощаджує години виправлень. It comes back: Кожен день в Unreal проходить в IslandCourse, а з Дня 26 у ньому росте твій острів. Куб 1 м — твоя перевірка масштабу: кожна наступна модель проходить ту саму перевірку поруч із манекеном.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Do-along on today's build (куб 1 м (твоя перша сцена в Blender)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Відкрий Blender і клацни поза вітальною картинкою. Має вийти: в'юпорт (3D Viewport, великий вид), Outliner (угорі праворуч, усе в сцені) і Properties (унизу праворуч). Натисни Shift+A > Mesh > Monkey: поруч із кубом з'являється Сюзанна, талісман Blender.\n   2. File > Save As. У вікні збереження відкрий свій найшвидший диск (часто D:, або C:, якщо диск один). Клацни значок нової папки й створи GAD, а в ній — Day-00-setup: це робоча папка дня. Збережи туди first_scene.blend. Має вийти: у рядку заголовка видно first_scene.blend.\n   3. Натисни Win+E і відкрий GAD\\Day-00-setup: там лежить first_scene.blend. Клацни Вигляд > Показати > Розширення імен файлів (View > Show > File name extensions), щоб з'явилася позначка. Потім клацни правою кнопкою > Створити > Текстовий документ (New > Text Document) і перейменуй його на summary.md: F2, заміни .txt на .md, клацни «Так» (Yes). Перевірка: назва закінчується на .md, а не на .md.txt. [screenshot]\n   4. Додай сторінку курсу в закладки (Ctrl+D). Вона відкривається онлайн за твоїм особистим посиланням, що закінчується на COURSE.html. Відкрий посилання на папку здачі з листа в тому акаунті Google, з яким нею поділилися. Відкрий Work > Assignment: там є Day-00-setup та папки інших днів. Порожньо? Відповідай на той лист — розберемося разом.\n   5. Вправа з zip — на робочому столі (не в папці здачі). Створи папку zip-test, а в ній текстовий файл hello.txt. Клацни папку правою кнопкою > Стиснути до > ZIP-файл (Compress to > ZIP File). Видали папку, потім клацни zip-test.zip правою кнопкою > Видобути все (Extract All) > Видобути: папка повертається. Тепер видали обидва.\n   6. Натисни Win+Shift+S, обведи рамкою Сюзанну в Blender, клацни в чаті з тьютором і натисни Ctrl+V: картинка з'являється. Надішли її. У п'ятницю ти ще запишеш короткий кліп клавішами Win+Alt+R. Не записує? Клацни у вікні програми; Win+G має відкривати Xbox Game Bar. [screenshot]\n3. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n4. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Детектив папок: тьютор називає п'ять файлів (інсталятор, фото, zip, файл Blender, кліп). Для кожного я кажу, у якій папці йому місце і яке в нього розширення. Потім знаходжу один справжній приклад на своєму ПК і надсилаю скриншот. Otherwise skip it.\n5. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n6. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; breakdown = розбір; credits line = рядок авторства; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); File Explorer = Провідник; mesh = меш; grid = сітка (тільки grid, ніколи mesh); vertex / edge / face = вершина / ребро / грань; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; material instance / child instance = інстанс / дочірній інстанс; kit / kit piece / part of one object = набір / деталь / частина; map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}, {"title": {"en": "Your first hour in Blender", "uk": "Твоя перша година в Blender"}, "minutes": 40, "goals": [{"en": "Name the main parts of Blender's window: the 3D Viewport, the Outliner, the Properties editor and the menus.", "uk": "Називати головні частини вікна Blender: в'юпорт (3D Viewport), Outliner, Properties і меню."}, {"en": "Move around the 3D Viewport: orbit, pan, zoom, the numpad views and Frame Selected.", "uk": "Рухатися у в'юпорті: обертати вид (orbit), зсувати (pan), наближати (zoom), вмикати види з цифрового блока (Numpad) і Frame Selected."}, {"en": "Tell Object Mode from Edit Mode (Tab) and select vertices, edges and faces.", "uk": "Відрізняти Object Mode від Edit Mode (Tab) і виділяти вершини, ребра й грані."}, {"en": "Move, rotate and scale with G, R and S, type an exact value, undo with Ctrl+Z and save with Ctrl+S.", "uk": "Переміщати, обертати й масштабувати клавішами G, R і S, вводити точне значення, скасовувати дію клавішами Ctrl+Z і зберігати клавішами Ctrl+S."}], "doalong": [{"en": "Orbit (turn the view) by holding the middle mouse button and moving the mouse. Pan (slide) with Shift+middle mouse, and zoom with the wheel. Wheel switched off? Drag the coloured axis ball at the top right of the viewport to orbit, the hand icon to pan and the magnifier to zoom.", "uk": "Щоб обертати вид, тримай середню кнопку миші й рухай мишею. Shift + середня кнопка зсуває вид, коліщатко наближає. Коліщатко вимкнене? Тягни кольорову кульку осей угорі праворуч у в'юпорті, щоб обертати. Значок руки зсуває вид, значок лупи наближає."}, {"en": "Switch the keyboard to English first (Win+Space). Press Numpad 1, 3 and 7 for the front, right and top views, and Numpad 5 to switch perspective and orthographic (flat, good for measuring). No numpad? Press the ` key under Esc for the View pie with Front, Right, Top and Bottom, all course long. View > Perspective/Orthographic replaces Numpad 5.", "uk": "Спершу перемкни клавіатуру на англійську (Win+Space). Numpad 1, 3 і 7 вмикають вид спереду, справа й згори. Numpad 5 перемикає перспективу й ортографію — плаский вид, зручний для вимірювань. Немає цифрового блока? Натискай клавішу ` під Esc: відкриється кругле меню View з видами Front, Right, Top і Bottom. Так роби весь курс, а замість Numpad 5 бери View > Perspective/Orthographic."}, {"en": "Click the cube: an orange outline appears. Press Numpad . (or View > Frame Selected): the cube fills the view. Press Home (or View > Frame All) to see everything. Home shows the top view instead? Your Home key doubles as Numpad 7: use View > Frame All.", "uk": "Клацни куб — з'являється помаранчевий контур. Натисни Numpad . (або View > Frame Selected): куб заповнює вид. Натисни Home (або View > Frame All), щоб побачити все. Home вмикає вид згори? На твоїй клавіатурі Home працює як Numpad 7: бери View > Frame All."}, {"en": "Press G, then X, type 2 and press Enter: the cube moves 2 m along the red X axis. G moves, R rotates and S scales: type R Z 45 Enter, then S 0.5 Enter. Press N and read Location, Rotation and Scale. Press Ctrl+Z three times.", "uk": "Натисни G, потім X, введи 2 і натисни Enter: куб зсувається на 2 м уздовж червоної осі X. G переміщає, R обертає, S масштабує: введи R Z 45 Enter, потім S 0.5 Enter. Натисни N і прочитай Location, Rotation і Scale. Натисни Ctrl+Z тричі."}, {"en": "The cube is a mesh: vertices (corner points), edges (lines between them) and faces (flat surfaces). Press Tab for Edit Mode, where you change these parts; Object Mode moves whole objects. Press 1, 2 and 3 for vertex, edge and face select. Click a face, Shift+click another; A selects all, Alt+A none. Tab back.", "uk": "Куб — це меш: форма з вершин, ребер і граней. Вершини — кутові точки, ребра — лінії між ними, грані — пласкі поверхні. Натисни Tab: це Edit Mode, де змінюють ці частини, а Object Mode рухає цілі об'єкти. Клавіші 1, 2 і 3 вмикають виділення вершин, ребер і граней. Клацни грань, Shift+клацни ще одну; A виділяє все, Alt+A знімає виділення, Tab повертає назад."}, {"en": "File > Save As, open the day work folder (GAD\\Day-00-setup) and save cube_day0.blend. A .blend file is your Blender scene. You see cube_day0.blend in the title bar. From now on, press Ctrl+S often.", "uk": "File > Save As, відкрий робочу папку дня (GAD\\Day-00-setup) і збережи cube_day0.blend. Файл .blend — це твоя сцена Blender. Має вийти: у рядку заголовка видно cube_day0.blend. Відтепер часто натискай Ctrl+S."}], "play": {"en": "Simon says: the tutor calls a view or a move ('top view', 'frame the cube', 'cube 2 m along X', 'rotate 90 degrees on Z'); I do it and send a screenshot. Five in a row without a mistake wins the round.", "uk": "Гра «Саймон каже»: тьютор називає вид або рух («вид згори», «куб на весь екран», «куб на 2 м уздовж X», «поверни на 90 градусів навколо Z»). Я виконую і надсилаю скриншот. П'ять поспіль без помилки — раунд виграно."}, "video": {"url": "https://www.youtube.com/watch?v=Y2cKbEIdNF0", "title": "Zero to Hero #3 / Essential Viewport Navigation & Object Selection / Blender 4.4 Beginner Course", "channel": "Alan Aronica", "length": "6:22", "search": "blender 4 viewport navigation selection beginner", "alt": {"url": "https://www.youtube.com/watch?v=VObzbN_0-wE", "title": "Урок 1 / Основи Blender 5.1 / Знайомство з інтерфейсом", "channel": "Fun Open Source Українською"}}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Твоя перша година в Blender (Day 0, lesson 2 of 3). Today's build: Твій ПК готовий до Дня 1: папки, перша сцена в Blender і проєкт IslandCourse із твоїм кубом 1 м.\nWhat I already know: список «До Дня 0» на сторінці ACCOUNTS-AND-INSTALLS.html: твої акаунти та встановлені Blender, Krita й Unreal Engine 5.8.\nEarlier today I already did: lesson 1 (Твій ПК готовий: перша сцена, папки, zip-архіви й скриншоти). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Називати головні частини вікна Blender: в'юпорт (3D Viewport), Outliner, Properties і меню.\n2. Рухатися у в'юпорті: обертати вид (orbit), зсувати (pan), наближати (zoom), вмикати види з цифрового блока (Numpad) і Frame Selected.\n3. Відрізняти Object Mode від Edit Mode (Tab) і виділяти вершини, ребра й грані.\n4. Переміщати, обертати й масштабувати клавішами G, R і S, вводити точне значення, скасовувати дію клавішами Ctrl+Z і зберігати клавішами Ctrl+S.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: 2 lines on why today matters and where it comes back, in plain words (from this: Кожен урок іде в чаті з тьютором, а кожен день закінчується в Unreal. Сьогодні ти один раз проходиш увесь s."}, "video": {"url": "https://www.youtube.com/watch?v=W0d6635Rits", "title": "Unreal Engine Co-ordinates Explained", "channel": "HyperDev", "length": "3:24", "search": "unreal engine coordinates explained units"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Куб 1 м із Blender в IslandCourse (Day 0, lesson 3 of 3). Today's build: Твій ПК готовий до Дня 1: папки, перша сцена в Blender і проєкт IslandCourse із твоїм кубом 1 м.\nWhat I already know: список «До Дня 0» на сторінці ACCOUNTS-AND-INSTALLS.html: твої акаунти та встановлені Blender, Krita й Unreal Engine 5.8.\nEarlier today I already did: lesson 1 (Твій ПК готовий: перша сцена, папки, zip-архіви й скриншоти); lesson 2 (Твоя перша година в Blender). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Перемикати Blender на метри й читати справжній розмір будь-якого об'єкта: бічна панель, вкладка Item > Dimensions.\n2. Створювати куб 1 м зі Scale 1, що стоїть на сітці підлоги, і експортувати його у файл GLB.\n3. Створювати папки Course і Day00 у Content Browser в Unreal.\n4. Імпортувати GLB в Unreal, опускати на підлогу й перевіряти поруч із манекено hort lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\nIf I want to go deeper, recommend this free video: \"Unreal Engine Co-ordinates Explained\" by HyperDev: https://www.youtube.com/watch?v=W0d6635Rits\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти ба

<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 56</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

/* the Done switch */
.sw{display:inline-flex;align-items:center;gap:12px;border:0;background:transparent;cursor:pointer;font:600 14px/1 var(--head);color:var(--muted);min-height:50px;padding:0 6px}

details{margin-top:22px;border-radius:20px;background:var(--well);box-shadow:var(--press);padding:0 18px}

.check input::after{content:"";width:10px;height:5px;border:solid #fff;border-width:0 0 2.2px 2.2px;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.check input:checked{background:linear-gradient(145deg,#5fe39a,#16a34a);box-shadow:0 0 12px rgba(74,222,128,.55)}

 body{font-size:16.5px}

<script id="data" type="application/json">{"learner": "ib-svetlana-7691a6db", "learnerName": {"en": "Svetlana", "uk": "Світлана"}, "day": 56, "week": 12, "total": 60, "title": {"en": "Whole-island performance: a CSV along the full route, cull distances and HLODs", "uk": "Продуктивність усього острова: CSV уздовж усього маршруту, відстані відсікання й HLOD"}, "theme": {"en": "Week 12: The whole island, polished, flown and presented", "uk": "Тиждень 12: увесь острів — шліфування, проліт і презентація"}, "build": {"item": {"en": "A whole-island performance pass: a CSV capture along the full scenic route before and after, cull distances per layer, HLODs built and checked, at least three measured fixes, and budget.md as the proof", "uk": "Прохід продуктивності по всьому острову: CSV-запис уздовж усього мальовничого маршруту до й після, відстані відсікання для кожного шару, зібрані й перевірені HLOD, щонайменше три виміряні виправлення та budget.md як доказ"}, "why": {"en": "A world that stutters is unplayable, and many players' PCs are no faster than yours. Big worlds get slow from thousands of small plants drawn too far away, from small things casting shadows, and from far land drawn in full detail. Studios measure the whole route first, then cut where it costs most and shows least, and they prove the result with numbers anyone can read.", "uk": "Світ, що підвисає, неможливо грати, а ПК багатьох гравців не швидші за твій. Великі світи гальмують через тисячі дрібних рослин, які малюються надто далеко, через дрібні об'єкти, що відкидають тіні, і через далеку землю, намальовану з повною деталізацією. Студії спершу вимірюють увесь маршрут, потім ріжуть там, де найдорожче й найменш помітно, і доводять результат числами, які може прочитати будь-хто."}, "where": {"en": "L_Island: the whole scenic route RT_Scenic, flown from the launch point, with your own PC as the target machine at 1920 x 1080.", "uk": "L_Island: увесь мальовничий маршрут RT_Scenic, пролетений від точки старту, з твоїм власним ПК як цільовою машиною при 1920 x 1080."}, "spec": [{"en": "budget.md: the target (average frame time under 16.6 ms and 95th percentile under 33.3 ms, at 1920 x 1080), the settings (Engine Scalability High, a 1920 x 1080 play window) and the memory in use (under about 14 GB in Task Manager).", "uk": "budget.md: ціль (середній час кадру менше 16,6 мс і 95-й перцентиль менше 33,3 мс при 1920 x 1080), налаштування (Engine Scalability High, вікно гри 1920 x 1080) і використана пам'ять (менше приблизно 14 ГБ у Task Manager (Диспетчер завдань))."}, {"en": "A CSV capture of the whole route before the fixes and after them, flown in Play with the Day 33 flying pawn, each opened in a free spreadsheet (LibreOffice Calc or Google Sheets) with the average and the 95th percentile of the frame time and the GPU time, and a line chart of the frame time.", "uk": "CSV-запис усього маршруту до виправлень і після них, пролетений у Play з літальним павном Дня 33; кожен відкрито в безкоштовній електронній таблиці (LibreOffice Calc або Google Sheets) із середнім значенням і 95-м перцентилем часу кадру та часу GPU, а також лінійним графіком часу кадру."}, {"en": "stat unit and stat gpu at the three worst spots from the chart, with the top lines written down, and the cost of each Data Layer at the worst spot.", "uk": "stat unit і stat gpu у трьох найгірших місцях за графіком, із записаними верхніми рядками, і ціна кожного Data Layer у найгіршому місці."}, {"en": "Cull distances set per layer and listed: ground cover 40 to 60 m, small plants 80 to 120 m, shrubs and small rocks 150 to 250 m, small district props about 150 m, trees 800 m or more; buildings never culled (HLODs draw them far away).", "uk": "Відстані відсікання задано для кожного шару й записано: ґрунтопокривні 40–60 м, дрібні рослини 80–120 м, кущі й дрібне каміння 150–250 м, дрібні пропси районів близько 150 м, дерева 800 м і більше; будівлі ніколи не відсікаються (здалеку їх малюють HLOD)."}, {"en": "HLODs: district buildings and big rocks set to HLOD_Merged (Day 33), with HLOD_Merged still listed in the last row of HLOD Partitions > HLOD Layers To Include; built (Build > Build HLODs) and checked in Play from about 600 m out at sea: both districts and the big landforms still read.", "uk": "HLOD: будівлі районів і великі скелі мають HLOD_Merged (День 33), і HLOD_Merged досі стоїть в останньому рядку HLOD Partitions > HLOD Layers To Include; зібрано (Build > Build HLODs) і перевірено в Play приблизно з 600 м у морі: обидва райони й великі форми рельєфу досі читаються."}, {"en": "At least three fixes, each with a before and after number; if your PC still can't hold the budget after them, one named setting lowered (for example Shadows to Medium in Engine Scalability) and written in budget.md.", "uk": "Щонайменше три виправлення, кожне з числом до й після; якщо після них твій ПК досі не тримає бюджет, одне назване налаштування знижено (наприклад, Shadows на Medium в Engine Scalability) і записано в budget.md."}, {"en": "Looks kept: C4 and D2_C4 shot again and compared with Day 55's finals; any fix that shows is undone.", "uk": "Вигляд збережено: C4 і D2_C4 перезнято й порівняно з фінальними кадрами Дня 55; кожне помітне виправлення скасовано."}], "piece1": "the budget and the first full-route CSV", "piece2": {"en": "Culling, HLODs, the fixes and the second CSV, on your own", "uk": "Відсікання, HLOD, виправлення й другий CSV — самостійно"}, "steps": [{"text": {"en": "Update budget.md with the target and the settings; set the play window to 1920 x 1080 and Engine Scalability to High. Check: budget.md lists the target and both settings.", "uk": "Онови budget.md, вписавши ціль і налаштування; постав вікно гри 1920 x 1080 і Engine Scalability на High. Перевірка: у budget.md є ціль і обидва налаштування."}, "lesson": 1}, {"text": {"en": "Play in a New Editor Window from the start of RT_Scenic, type csvprofile start, fly the whole route at a steady speed with the Day 33 flying pawn, then type csvprofile stop. Copy the new file into today's Work folder as csv_before.csv. Check: a new .csv file is in IslandCourse/Saved/Profiling/CSV, and its copy is in your Work folder.", "uk": "Запусти Play у New Editor Window з початку RT_Scenic, введи csvprofile start, пролети весь маршрут з рівною швидкістю на літальному павні Дня 33, потім введи csvprofile stop. Скопіюй новий файл у сьогоднішню папку Work як csv_before.csv. Перевірка: новий файл .csv лежить у IslandCourse/Saved/Profiling/CSV, а його копія — у твоїй папці Work."}, "lesson": 1}, {"text": {"en": "Open the CSV in a spreadsheet (Language English (USA), as on Day 41); work out the average and the 95th percentile of the frame time and the GPU time; make a line chart of the frame time. Check: four numbers and the chart are in budget.md.", "uk": "Відкрий CSV в електронній таблиці (мова English (USA), як у День 41); порахуй середнє значення й 95-й перцентиль часу кадру та часу GPU; зроби лінійний графік часу кадру. Перевірка: чотири числа й графік є в budget.md."}, "lesson": 1}, {"text": {"en": "Find the three worst stretches on the chart, fly there, and write stat unit and the top five lines of stat gpu at each. At the worst spot, bookmark the view (Ctrl+6) and take stat_before.png and statgpu_worst.png (Win+Shift+S). Check: three spots, each with Frame, GPU and its biggest cost.", "uk": "Знайди на графіку три найгірші ділянки, підлети туди й запиши в кожній stat unit і п'ять верхніх рядків stat gpu. У найгіршому місці збережи вид закладкою (Ctrl+6) і зроби stat_before.png і statgpu_worst.png (Win+Shift+S). Перевірка: три місця, у кожного Frame, GPU і найбільша стаття витрат."}, "lesson": 2}, {"text": {"en": "At the worst spot, hide one Data Layer at a time in the editor and write what each costs. Check: a cost in ms for every layer.", "uk": "У найгіршому місці ховай у редакторі по одному Data Layer і записуй, скільки коштує кожен. Перевірка: для кожного шару є ціна в мс."}, "lesson": 2}, {"text": {"en": "Set cull distances on ground cover and small plants, in their PCG spawners and foliage types. Check: flying at 30 m, no ground cover is drawn beyond about 60 m.", "uk": "Задай відстані відсікання для ґрунтопокривних і дрібних рослин — у їхніх PCG-спавнерах і типах рослинності. Перевірка: на висоті 30 м жодна ґрунтопокривна рослина не малюється далі ніж приблизно за 60 м."}, "lesson": 3}, {"text": {"en": "Set cull distances on shrubs, small rocks and small district props. Check: every layer's numbers are listed in budget.md.", "uk": "Задай відстані відсікання для кущів, дрібного каміння й дрібних пропсів районів. Перевірка: числа кожного шару записано в budget.md."}, "lesson": 3}, {"text": {"en": "Pop check: fly at 10 m, 30 m and 60 m, note anything that pops in near the middle of the view, and push that layer's distance out. Check: nothing pops in near the centre of the view.", "uk": "Перевірка на раптову появу (pop-in): пролети на висоті 10 м, 30 м і 60 м, запиши все, що раптово з'являється ближче до середини кадру, і збільш відстань для цього шару. Перевірка: ніщо не з'являється раптово біля центру кадру."}, "lesson": 3}, {"text": {"en": "Set HLOD Layer to HLOD_Merged on district buildings and big rocks (Mobility Static), check HLOD_Merged is still in the last row of HLOD Partitions in World Settings, then choose Build > Build HLODs. Check: the build finishes without errors.", "uk": "Постав HLOD Layer на HLOD_Merged для будівель районів і великих скель (Mobility Static), перевір, що HLOD_Merged досі в останньому рядку HLOD Partitions у World Settings, потім обери Build > Build HLODs. Перевірка: збирання завершується без помилок."}, "lesson": 4}, {"text": {"en": "Play, fly about 600 m out to sea with the flying pawn and look back at the island. Check: both districts and the big landforms still read from there.", "uk": "Запусти Play, відлети на літальному павні приблизно на 600 м у море й озирнися на острів. Перевірка: обидва райони й великі форми рельєфу звідти досі читаються."}, "lesson": 4}, {"text": {"en": "Make three or more fixes from the biggest costs, one at a time, measuring after each. Check: each fix has its saving in ms in budget.md.", "uk": "Зроби три або більше виправлень з найбільших статей витрат, по одному, вимірюючи після кожного. Перевірка: у кожного виправлення є економія в мс у budget.md."}, "lesson": 4}, {"text": {"en": "Take the CSV capture of the whole route again, copy it as csv_after.csv, and compare it with the first. Check: the average is under 16.6 ms and the 95th percentile under 33.3 ms, or one named setting is lowered and written down.", "uk": "Зроби CSV-запис усього маршруту ще раз, скопіюй його як csv_after.csv і порівняй із першим. Перевірка: середнє менше 16,6 мс, а 95-й перцентиль менше 33,3 мс, або одне назване налаштування знижено й записано."}, "lesson": 1}, {"text": {"en": "Shoot C4 and D2_C4 again and compare them with d1_final_C4 and d2_final_C4; undo any fix you can see. Check: each pair looks the same at a glance.", "uk": "Перезніми C4 і D2_C4 і порівняй їх із d1_final_C4 і d2_final_C4; скасуй кожне виправлення, яке видно. Перевірка: кожна пара з першого погляду виглядає однаково."}, "lesson": 3}, {"text": {"en": "Press 6, take stat unit again and put it beside stat_before.png as before_after_day56.png, and record a 60-second flight with stat unit on. Save today's clip as flythrough_day56.mp4 and check that you also have csv_chart.png, hlod_600m.png, hlod_setup.png and looks_kept.png (each is described in today's hand-in list; take any you are missing now). Check: the numbers are readable in both.", "uk": "Натисни 6, знову зніми stat unit і постав поруч зі stat_before.png як before_after_day56.png, а також запиши 60-секундний проліт з увімкненим stat unit. Збережи сьогоднішній кліп як flythrough_day56.mp4 і перевір, що в тебе є також csv_chart.png, hlod_600m.png, hlod_setup.png і looks_kept.png (кожен описано в сьогоднішньому списку «Що здати»; зроби зараз ті, яких бракує). Перевірка: числа читаються на обох."}, "lesson": 2}]}, "lessons": [{"title": {"en": "The budget and a CSV along the whole route", "uk": "Бюджет і CSV уздовж усього маршруту"}, "minutes": 40, "goals": [{"en": "Explain frame time: how many milliseconds (ms, thousandths of a second) one picture takes. 60 frames a second means 16.6 ms each; 30 frames a second means 33.3 ms.", "uk": "Пояснити, що таке час кадру: скільки мілісекунд (мс, тисячних секунди) займає одна картинка. 60 кадрів за секунду — це по 16,6 мс на кадр; 30 кадрів за секунду — по 33,3 мс."}, {"en": "Explain a CSV capture: Unreal writes the time of every frame of your flight into a table file (CSV, comma-separated values) that any spreadsheet opens.", "uk": "Пояснити, що таке CSV-запис: Unreal записує час кожного кадру твого польоту у файл-таблицю (CSV, значення, розділені комами), який відкриває будь-яка електронна таблиця."}, {"en": "Explain the 95th percentile: sort all the frames from fast to slow; the 95th percentile is the time that 95 % of frames beat. It shows the slow frames a pilot feels as stutter, which an average hides.", "uk": "Пояснити, що таке 95-й перцентиль: відсортуй усі кадри від швидких до повільних; 95-й перцентиль — це час, швидший за який є 95 % кадрів. Він показує повільні кадри, які пілот відчуває як підвисання і які середнє значення ховає."}, {"en": "Record the whole route and read the average and the 95th percentile in a spreadsheet.", "uk": "Записати весь маршрут і прочитати середнє значення й 95-й перцентиль в електронній таблиці."}], "doalong": [{"en": "Open Edit > Editor Preferences > Level Editor > Play and set New Viewport Resolution to 1920 x 1080. Then click the three dots next to the green Play button and choose New Editor Window (PIE, Play In Editor). You should see the game open in its own 1920 x 1080 window.", "uk": "Відкрий Edit > Editor Preferences > Level Editor > Play і постав New Viewport Resolution на 1920 x 1080. Потім натисни три крапки біля зеленої кнопки Play й обери New Editor Window (PIE, Play In Editor). Ти бачиш, як гра відкривається в окремому вікні 1920 x 1080."}, {"en": "Close it, click Settings at the top right of the main toolbar > Engine Scalability Settings (as on Day 26), and choose High. You should see High highlighted; write it in budget.md.", "uk": "Закрий його, натисни Settings угорі праворуч на головній панелі інструментів > Engine Scalability Settings (як у День 26) і обери High. Ти бачиш підсвічене High; запиши це в budget.md."}, {"en": "Move your Player Start (from Day 33) to the start of RT_Scenic, about 30 m up. Play in a New Editor Window, press the key left of 1 and type csvprofile start. Fly the whole route at a steady speed (hold W; E or Space to rise, Q or C to sink), then type csvprofile stop. You should see the island stream in round you as you fly. (Use the flying pawn, not ToggleDebugCamera: World Partition loads cells round the player, and may not load them round the debug camera.)", "uk": "Перенеси свій Player Start (з Дня 33) на початок RT_Scenic, приблизно на 30 м угору. Запусти Play у New Editor Window, натисни клавішу ліворуч від 1 і введи csvprofile start. Пролети весь маршрут з рівною швидкістю (тримай W; E або Space — угору, Q або C — униз), потім введи csvprofile stop. Ти бачиш, як острів підвантажується навколо тебе під час польоту. (Використовуй літальний павн, а не ToggleDebugCamera: World Partition завантажує комірки навколо гравця й може не завантажувати їх навколо налагоджувальної камери.)"}, {"en": "Open IslandCourse/Saved/Profiling/CSV and open the newest .csv in LibreOffice Calc. In the Text Import window choose Separated by Comma and set Language to English (USA), so numbers like 16.52 stay numbers (as on Day 41). (In Google Sheets, first set File > Settings > Locale to United States, then File > Import.) You should see one row per frame and many columns.", "uk": "Відкрий IslandCourse/Saved/Profiling/CSV і відкрий найновіший .csv у LibreOffice Calc. У вікні Text Import обери Separated by Comma і постав Language на English (USA), щоб числа на кшталт 16.52 лишалися числами (як у День 41). (У Google Sheets спершу постав File > Settings > Locale на United States, потім File > Import.) Ти бачиш по рядку на кадр і багато стовпців."}, {"en": "Find the FrameTime and GPUTime columns (or names like them) and where their numbers end; stop above the few rows of text at the very bottom, which repeat the headings and list settings. In an empty cell type =AVERAGE(B2:B9000) with your own column letter and last row, and next to it =PERCENTILE(B2:B9000,0.95). Do the same for GPUTime. You should see four times in milliseconds; if you see an error, check the Language setting from the last step.", "uk": "Знайди стовпці FrameTime і GPUTime (або зі схожими назвами) і те, де закінчуються їхні числа; зупинись над кількома рядками тексту в самому низу, які повторюють заголовки й перелічують налаштування. У порожній клітинці введи =AVERAGE(B2:B9000) зі своєю літерою стовпця й останнім рядком, а поруч =PERCENTILE(B2:B9000,0.95). Зроби те саме для GPUTime. Ти бачиш чотири значення часу в мілісекундах; якщо бачиш помилку, перевір налаштування Language з попереднього кроку."}, {"en": "Select the FrameTime numbers and choose Insert > Chart > Line. You should see a line with spikes where the flight slowed.", "uk": "Виділи числа FrameTime й обери Insert > Chart > Line. Ти бачиш лінію з піками там, де політ гальмував."}], "play": {"en": "Budget guess: before I open the spreadsheet, I guess my average and my 95th percentile; the closest guess scores.", "uk": "Вгадай бюджет: перш ніж відкрити таблицю, я вгадую своє середнє значення й 95-й перцентиль; найточніша здогадка отримує бал."}, "video": {"url": "https://www.youtube.com/watch?v=Bzf35Aa-M1s", "title": "Level Streaming: Profiling And Performance Optimization. Ep.2 Perf Test And CSV Profiler", "channel": "UsefulCode", "length": "8:00", "search": "unreal engine csv profiler perf test"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: The budget and a CSV along the whole route (Day 56, lesson 1 of 4).\nToday's build: A whole-island performance pass: a CSV capture along the full scenic route before and after, cull distances per layer, HLODs built and checked, at least three measured fixes, and budget.md as the proof.\n\nBy the end of this lesson I can:\n1. Explain frame time: how many milliseconds (ms, thousandths of a second) one picture takes. 60 frames a second means 16.6 ms each; 30 frames a second means 33.3 ms.\n2. Explain a CSV capture: Unreal writes the time of every frame of your flight into a table file (CSV, comma-separated values) that any spreadsheet opens.\n3. Explain the 95th percentile: sort all the frames from fast to slow; the 95th percentile is the time that 95 % of frames beat. It shows the slow frames a pilot feels as stutter, which an average hides.\n4. Record the whole route and read the average and the 95th percentile in a spreadsheet.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (Eleven weeks in, you have two finished districts on your own island, with ten final shots beside real photos.), what I will learn today (You capture the frame time along the whole scenic route, set cull distances and HLODs, and prove the island holds the budget.), encourage me (Performance work is detective work: measure, change one thing, measure again, and count every fix as a win.), and share today's quote: \"If we all worked on the assumption that what is accepted as true is really true, there would be little hope of advance.\" (Orville Wright).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 53: what does LaneGauge, your 4 x 4 x 4 m gauge cube, check along the scenic route? | Day 51: how did you measure what district 2's props cost?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Budget guess: before I open the spreadsheet, I guess my average and my 95th percentile; the closest guess scores.\n6. Do-along on today's build (the budget and the first full-route CSV): guide me through these steps one at a time, checking a screenshot after each:\n   - Open Edit > Editor Preferences > Level Editor > Play and set New Viewport Resolution to 1920 x 1080. Then click the three dots next to the green Play button and choose New Editor Window (PIE, Play In Editor). You should see the game open in its own 1920 x 1080 window.\n   - Close it, click Settings at the top right of the main toolbar > Engine Scalability Settings (as on Day 26), and choose High. You should see High highlighted; write it in budget.md.\n   - Move your Player Start (from Day 33) to the start of RT_Scenic, about 30 m up. Play in a New Editor Window, press the key left of 1 and type csvprofile start. Fly the whole route at a steady speed (hold W; E or Space to rise, Q or C to sink), then type csvprofile stop. You should see the island stream in round you as you fly. (Use the flying pawn, not ToggleDebugCamera: World Partition loads cells round the player, and may not load them round the debug camera.)\n   - Open IslandCourse/Saved/Profiling/CSV and open the newest .csv in LibreOffice Calc. In the Text Import window choose Separated by Comma and set Language to English (USA), so numbers like 16.52 stay numbers (as on Day 41). (In Google Sheets, first set File > Settings > Locale to United States, then File > Import.) You should see one row per frame and many columns.\n   - Find the FrameTime and GPUTime columns (or names like them) and where their numbers end; stop above the few rows of text at the very bottom, which repeat the headings and list settings. In an empty cell type =AVERAGE(B2:B9000) with your own column letter and last row, and next to it =PERCENTILE(B2:B9000,0.95). Do the same for GPUTime. You should see four times in milliseconds; if you see an error, check the Language setting from the last step.\n   - Select the FrameTime numbers and choose Insert > Chart > Line. You should see a line with spikes where the flight slowed.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Level Streaming: Profiling And Performance Optimization. Ep.2 Perf Test And CSV Profiler\" by UsefulCode: https://www.youtube.com/watch?v=Bzf35Aa-M1s\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Where the time goes: stat gpu and Data Layers (micro-lesson)", "uk": "Куди йде час: stat gpu і Data Layers (мікроурок)"}, "minutes": 40, "goals": [{"en": "Read stat unit: Frame is the whole picture, Game is the game logic, Draw is preparing the picture, GPU is the graphics card; the biggest of Game, Draw and GPU sets your frame time.", "uk": "Читати stat unit: Frame — уся картинка, Game — ігрова логіка, Draw — підготовка картинки, GPU — відеокарта; найбільше з Game, Draw і GPU визначає твій час кадру."}, {"en": "Read the biggest lines of stat gpu (for example Lumen, shadow depths, Nanite, the base pass, translucency) to see what the graphics card spends its time on.", "uk": "Читати найбільші рядки stat gpu (наприклад, Lumen, глибини тіней, Nanite, базовий прохід, прозорість), щоб побачити, на що відеокарта витрачає час."}, {"en": "Measure what a Data Layer costs by hiding it in the editor at a fixed view.", "uk": "Вимірювати, скільки коштує Data Layer, ховаючи його в редакторі при незмінному виді."}], "doalong": [{"en": "On the chart, find the worst spike. Because you flew at a steady speed, its place along the chart tells you roughly where on the route it was (halfway along the chart is halfway along the route). You should see one place to visit.", "uk": "Знайди на графіку найгірший пік. Оскільки ти летиш з рівною швидкістю, його місце на графіку приблизно підказує, де він на маршруті (середина графіка — середина маршруту). Ти бачиш одне місце, яке треба відвідати."}, {"en": "Fly there in the editor viewport and type stat unit, then stat gpu. You should see four timings and a list of GPU costs.", "uk": "Підлети туди у в'юпорті редактора й введи stat unit, потім stat gpu. Ти бачиш чотири значення часу й список витрат GPU."}, {"en": "Write the top five lines of stat gpu in budget.md. You should see the biggest cost at the top of your list.", "uk": "Запиши п'ять верхніх рядків stat gpu в budget.md. Ти бачиш найбільшу статтю витрат угорі свого списку."}, {"en": "Open the Data Layer Outliner and hide one layer at a time with its eye icon, writing the GPU time after each. You should see which layer costs the most.", "uk": "Відкрий Data Layer Outliner і ховай по одному шару іконкою ока, записуючи час GPU після кожного. Ти бачиш, який шар коштує найбільше."}, {"en": "Show every layer again. You should see the whole island back.", "uk": "Знову покажи всі шари. Ти бачиш, що весь острів повернувся."}], "play": {"en": "Cost detective: I tell the tutor the top three stat gpu lines at my worst spot; it asks three questions about what's on screen there; together we name the likely cause.", "uk": "Детектив витрат: я кажу тьюторові три верхні рядки stat gpu в моєму найгіршому місці; він ставить три запитання про те, що там на екрані; разом ми називаємо ймовірну причину."}, "video": {"url": "https://www.youtube.com/watch?v=nQdsY2a-Fn8", "title": "What's Causing my Frame Rate to Drop? - Unreal Engine 5 Stat Profiling Tutorial", "channel": "NumenBrothers", "length": "6:09", "search": "unreal engine 5 stat unit stat gpu profiling"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Where the time goes: stat gpu and Data Layers (micro-lesson) (Day 56, lesson 2 of 4).\nToday's build: A whole-island performance pass: a CSV capture along the full scenic route before and after, cull distances per layer, HLODs built and checked, at least three measured fixes, and budget.md as the proof.\n\nBy the end of this lesson I can:\n1. Read stat unit: Frame is the whole picture, Game is the game logic, Draw is preparing the picture, GPU is the graphics card; the biggest of Game, Draw and GPU sets your frame time.\n2. Read the biggest lines of stat gpu (for example Lumen, shadow depths, Nanite, the base pass, translucency) to see what the graphics card spends its time on.\n3. Measure what a Data Layer costs by hiding it in the editor at a fixed view.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Cost detective: I tell the tutor the top three stat gpu lines at my worst spot; it asks three questions about what's on screen there; together we name the likely cause.\n4. Do-along on today's build (the budget and the first full-route CSV): guide me through these steps one at a time, checking a screenshot after each:\n   - On the chart, find the worst spike. Because you flew at a steady speed, its place along the chart tells you roughly where on the route it was (halfway along the chart is halfway along the route). You should see one place to visit.\n   - Fly there in the editor viewport and type stat unit, then stat gpu. You should see four timings and a list of GPU costs.\n   - Write the top five lines of stat gpu in budget.md. You should see the biggest cost at the top of your list.\n   - Open the Data Layer Outliner and hide one layer at a time with its eye icon, writing the GPU time after each. You should see which layer costs the most.\n   - Show every layer again. You should see the whole island back.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"What's Causing my Frame Rate to Drop? - Unreal Engine 5 Stat Profiling Tutorial\" by NumenBrothers: https://www.youtube.com/watch?v=nQdsY2a-Fn8\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Cull distances per layer", "uk": "Відстані відсікання для кожного шару"}, "minutes": 40, "goals": [{"en": "Explain a cull distance: the distance beyond which Unreal stops drawing an object. Far away, a small plant covers only a few pixels but still costs time.", "uk": "Пояснити, що таке відстань відсікання: відстань, далі за яку Unreal перестає малювати об'єкт. Удалині дрібна рослина займає лише кілька пікселів, але все одно забирає час."}, {"en": "Set cull distances per layer: in a PCG Static Mesh Spawner's mesh entry (Descriptor > Instance Start Cull Distance and Instance End Cull Distance; you set the end distance on Day 39, and between the two the plants fade out), on a foliage type (Cull Distance Min and Max), and on placed props (Desired Max Draw Distance). All of them are in centimetres.", "uk": "Задавати відстані відсікання для кожного шару: у mesh entry вузла PCG Static Mesh Spawner (Descriptor > Instance Start Cull Distance та Instance End Cull Distance; кінцеву відстань ти задаєш у День 39, а між двома відстанями рослини поступово зникають), у типі рослинності (Cull Distance Min і Max) і на розставлених пропсах (Desired Max Draw Distance). Усі вони в сантиметрах."}, {"en": "Check from the drone's heights that nothing pops in (appears suddenly) near the middle of the view.", "uk": "Перевіряти з висот польоту дрона, що ніщо не вискакує (не з'являється раптово) біля середини кадру."}], "doalong": [{"en": "Open your ground-cover PCG graph, select the Static Mesh Spawner, open its mesh entry's Descriptor and set Instance Start Cull Distance 4000 and Instance End Cull Distance 6000; click Generate on its volume. You should see ground cover stop about 60 m away.", "uk": "Відкрий PCG-граф ґрунтопокривних рослин, виділи Static Mesh Spawner, відкрий Descriptor його mesh entry і постав Instance Start Cull Distance 4000 та Instance End Cull Distance 6000; натисни Generate на його об'ємі. Ти бачиш, що ґрунтопокривні рослини закінчуються приблизно за 60 м."}, {"en": "Press Shift+3, click a small plant type in the Foliage panel and set Cull Distance Min 8000 and Max 12000. You should see small plants thin out far away.", "uk": "Натисни Shift+3, клацни тип дрібних рослин на панелі Foliage і постав Cull Distance Min 8000 і Max 12000. Ти бачиш, як удалині дрібних рослин меншає."}, {"en": "Type Bench in the Outliner's search box, click the first bench and Shift+click the last to select them all, then in Details search for Max Draw and set Desired Max Draw Distance to 15000. You should see them vanish only beyond 150 m.", "uk": "Введи Bench у поле пошуку Outliner, клацни першу лавку й Shift+клацни останню, щоб виділити всі, потім у Details знайди Max Draw і постав Desired Max Draw Distance на 15000. Ти бачиш, що вони зникають лише далі ніж за 150 м."}, {"en": "Fly at 10 m, 30 m and 60 m with stat unit on. You should see the GPU time drop; note any pop.", "uk": "Пролети на висоті 10 м, 30 м і 60 м з увімкненим stat unit. Ти бачиш, як падає час GPU; запиши кожну раптову появу."}, {"en": "Shoot D2_C4 again and compare it with d2_final_C4.png. You should see the same picture.", "uk": "Перезніми D2_C4 і порівняй з d2_final_C4.png. Ти бачиш ту саму картинку."}], "play": {"en": "Pop or not: three flights at different heights; the tutor checks my notes for pops; each pop costs a point, each 0.5 ms saved earns one.", "uk": "Вискочило чи ні: три польоти на різних висотах; тьютор перевіряє мої нотатки на раптові появи; кожна раптова поява коштує бал, кожні зекономлені 0,5 мс дають бал."}, "video": {"url": "https://www.youtube.com/watch?v=ut2_prCEg1c", "title": "How To Load And Unload Foliage In Unreal Engine 5 | Foliage Culling Tutorial", "channel": "Matt Aspland", "length": "4:11", "search": "unreal engine 5 foliage cull distance"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Cull distances per layer (Day 56, lesson 3 of 4).\nToday's build: A whole-island performance pass: a CSV capture along the full scenic route before and after, cull distances per layer, HLODs built and checked, at least three measured fixes, and budget.md as the proof.\n\nBy the end of this lesson I can:\n1. Explain a cull distance: the distance beyond which Unreal stops drawing an object. Far away, a small plant covers only a few pixels but still costs time.\n2. Set cull distances per layer: in a PCG Static Mesh Spawner's mesh entry (Descriptor > Instance Start Cull Distance and Instance End Cull Distance; you set the end distance on Day 39, and between the two the plants fade out), on a foliage type (Cull Distance Min and Max), and on placed props (Desired Max Draw Distance). All of them are in centimetres.\n3. Check from the drone's heights that nothing pops in (appears suddenly) near the middle of the view.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Pop or not: three flights at different heights; the tutor checks my notes for pops; each pop costs a point, each 0.5 ms saved earns one.\n4. Do-along on today's build (the budget and the first full-route CSV): guide me through these steps one at a time, checking a screenshot after each:\n   - Open your ground-cover PCG graph, select the Static Mesh Spawner, open its mesh entry's Descriptor and set Instance Start Cull Distance 4000 and Instance End Cull Distance 6000; click Generate on its volume. You should see ground cover stop about 60 m away.\n   - Press Shift+3, click a small plant type in the Foliage panel and set Cull Distance Min 8000 and Max 12000. You should see small plants thin out far away.\n   - Type Bench in the Outliner's search box, click the first bench and Shift+click the last to select them all, then in Details search for Max Draw and set Desired Max Draw Distance to 15000. You should see them vanish only beyond 150 m.\n   - Fly at 10 m, 30 m and 60 m with stat unit on. You should see the GPU time drop; note any pop.\n   - Shoot D2_C4 again and compare it with d2_final_C4.png. You should see the same picture.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"How To Load And Unload Foliage In Unreal Engine 5 | Foliage Culling Tutorial\" by Matt Aspland: https://www.youtube.com/watch?v=ut2_prCEg1c\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "HLODs and fixes that don't show", "uk": "HLOD і виправлення, яких не видно"}, "minutes": 40, "goals": [{"en": "Recall HLODs (Hierarchical Levels of Detail) from Day 33: far parts of a World Partition level are swapped for simple merged stand-ins, so the whole island shows cheaply.", "uk": "Згадати HLOD (Hierarchical Levels of Detail) з Дня 33: далекі частини рівня World Partition замінюються простими об'єднаними замінниками, тож увесь острів показується дешево."}, {"en": "Give district buildings and big rocks HLOD_Merged (Day 33), keep HLOD_Merged in the HLOD Partitions list, build HLODs after big changes (Build > Build HLODs) and check them from far away.", "uk": "Дати будівлям районів і великим скелям HLOD_Merged (День 33), тримати HLOD_Merged у списку HLOD Partitions, збирати HLOD після великих змін (Build > Build HLODs) і перевіряти їх здалеку."}, {"en": "Fix the biggest cost first, one change at a time, with cheap fixes for nature: shadows off on small plants, fewer but larger plants, closer culling.", "uk": "Виправляти спершу найбільшу статтю витрат, по одній зміні за раз, дешевими виправленнями для природи: вимкнені тіні на дрібних рослинах, менше рослин, але більших, ближче відсікання."}], "doalong": [{"en": "Select a district 2 building and type HLOD in the Details search box; set HLOD Layer to HLOD_Merged (as on Day 33) and check its Mobility is Static (HLODs only take static actors). Then open World Settings > Runtime Partitions > your first partition > HLOD Partitions and check HLOD_Merged is still in the last row's HLOD Layers To Include. You should see HLOD_Merged in both places. If your panel looks different, send the tutor a screenshot.", "uk": "Виділи будівлю району 2 і введи H s-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: HLODs and fixes that don't show (Day 56, lesson 4 of 4).\nToday's build: A whole-island performance pass: a CSV capture along the full scenic route before and after, cull distances per layer, HLODs built and checked, at least three measured fixes, and budget.md as the proof.\n\nBy the end of this lesson I can:\n1. Recall HLODs (Hierarchical Levels of Detail) from Day 33: far parts of a World Partition level are swapped for simple merged stand-ins, so the whole island shows cheaply.\n2. Give district buildings and big rocks HLOD_Merged (Day 33), keep HLOD_Merged in the HLOD Partitions list, build HLODs after big changes (Build > Build HLODs) and check them from far away.\n3. Fix the biggest cost first, one change at a time, with cheap fixes for nature: shadows off on small plants, fewer but larger plants, closer culling.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Cost challenge: save 3 ms at my worst spot with no change the tutor can find in my D2_C4 before/after.\n4. Do-along on today's build (the budget and the first full-route CSV): guide me through these steps one at a time, checking a screenshot after each:\n   - Select a district 2 building and type HLOD in the Details search box; set HLOD Layer to HLOD_Merged (as on Day 33) and check its Mobility is Static (HLODs only take static actors). Then open World Settings > Runtime Partitions > your first partition > HLOD Partitions and check HLOD_Merged is still in the last row's HLOD Layers To Include. You should see HLOD_Merged in both places. If your panel looks different, send the tutor a screenshot.\n   - In the main menu choose Build > Build HLODs and wait. You should see a progress bar, then a message that the build has finished.\n   - Play, fly about 600 m out to sea with the flying pawn and turn back. You should see both districts as simple but recognisable shapes.\n   - In the ground-cover spawner's Descriptor, untick Cast Shadow; Generate; measure at the worst spot. You should see the saving in ms.\n   - Write each fix, its saving and whether you can see it in budget.md. You should see a list of fixes with numbers.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Unreal Engine 5 | HLODS and World Partition\" by pheel: https://www.youtube.com/watch?v=BCeTWfmUC9U\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "budget.md (target, settings, both CSV results, worst spots, layer costs, cull distances, fixes with savings): your budget proof", "uk": "budget.md (ціль, налаштування, обидва результати CSV, найгірші місця, ціна шарів, відстані відсікання, виправлення з економією): твій доказ бюджету"}, {"en": "csv_before.csv, csv_after.csv and csv_chart.png (the frame time along the route, before and after)", "uk": "csv_before.csv, csv_after.csv і csv_chart.png (час кадру вздовж маршруту, до й після)"}, {"en": "statgpu_worst.png (stat gpu at the worst spot)", "uk": "statgpu_worst.png (stat gpu у найгіршому місці)"}, {"en": "hlod_600m.png (the island from about 600 m out at sea)", "uk": "hlod_600m.png (острів приблизно з 600 м у морі)"}, {"en": "hlod_setup.png (World Settings with HLOD_Merged in the HLOD Partitions row, and one building's HLOD Layer)", "uk": "hlod_setup.png (World Settings з HLOD_Merged у рядку HLOD Partitions і HLOD Layer однієї будівлі)"}, {"en": "looks_kept.png (C4 and D2_C4 after the fixes, beside Day 55's finals)", "uk": "looks_kept.png (C4 і D2_C4 після виправлень поруч із фінальними кадрами Дня 55)"}, {"en": "before_after_day56.png and flythrough_day56.mp4 (60 seconds with stat unit on)", "uk": "before_after_day56.png і flythrough_day56.mp4 (60 секунд з увімкненим stat unit)"}, {"en": "summary.md", "uk": "summary.md"}], "goal": {"en": "By the end of today you have a budget proof: a CSV capture of the whole scenic route at 1920 x 1080 with an average frame time under 16.6 ms and a 95th percentile under 33.3 ms, and the measured fixes that got it there.", "uk": "До кінця дня ти маєш доказ бюджету: CSV-запис усього мальовничого маршруту при 1920 x 1080 із середнім часом кадру менше 16,6 мс і 95-м перцентилем менше 33,3 мс, а також виміряні виправлення, які цього досягли."}, "uses": [{"en": "Day 41: budget.md, stat unit, stat gpu and your first CSV capture", "uk": "День 41: budget.md, stat unit, stat gpu і твій перший CSV-запис"}, {"en": "Day 33: World Partition, Data Layers, HLODs and the flying Play set-up (GameModeBase), which streams the island round you", "uk": "День 33: World Partition, Data Layers, HLOD і налаштування польоту в Play (GameModeBase), яке підвантажує острів навколо тебе"}, {"en": "Day 39: the cull distances on your ground cover", "uk": "День 39: відстані відсікання на ґрунтопокривних рослинах"}, {"en": "Day 53: RT_Scenic and scenic_route.md", "uk": "День 53: RT_Scenic і scenic_route.md"}, {"en": "Day 55: the ten final shots (the look you must keep)", "uk": "День 55: десять фінальних кадрів (вигляд, який треба зберегти)"}], "quiz": [{"q": {"en": "Your CSV shows an average frame time of 14 ms and a 95th percentile of 41 ms. What does that tell you?", "uk": "Твій CSV показує середній час кадру 14 мс і 95-й перцентиль 41 мс. Про що це каже?"}, "options": [{"en": "The PC is too slow for Unreal", "uk": "ПК занадто повільний для Unreal"}, {"en": "All is well: the average is under 16.6 ms", "uk": "Усе гаразд: середнє менше 16,6 мс"}, {"en": "Most frames are fine, but the slowest 5 % stutter: find the spikes and fix them", "uk": "Більшість кадрів нормальні, але найповільніші 5 % підвисають: знайди піки й виправ їх"}], "answer": 2, "explain": {"en": "The average hides slow frames. The budget needs both numbers: average under 16.6 ms and 95th percentile under 33.3 ms.", "uk": "Середнє значення ховає повільні кадри. Бюджету потрібні обидва числа: середнє менше 16,6 мс і 95-й перцентиль менше 33,3 мс."}}, {"q": {"en": "What is a cull distance?", "uk": "Що таке відстань відсікання?"}, "options": [{"en": "The distance beyond which Unreal stops drawing an object", "uk": "Відстань, далі за яку Unreal перестає малювати об'єкт"}, {"en": "How far a drone can fly", "uk": "Як далеко може летіти дрон"}, {"en": "The size of a World Partition cell", "uk": "Розмір комірки World Partition"}, {"en": "The distance between two PCG points", "uk": "Відстань між двома точками PCG"}], "answer": 0, "explain": {"en": "Beyond its cull distance an object isn't drawn, which saves time on things too small to see.", "uk": "Далі за свою відстань відсікання об'єкт не малюється, і це економить час на речах, надто дрібних, щоб їх побачити."}}, {"q": {"en": "After you cull ground cover at 20 m, you see grass appear in a ring round the camera at 30 m height. What do you do?", "uk": "Після того як ти відсікаєш ґрунтопокривні рослини на 20 м, на висоті 30 м навколо камери з'являється кільце трави. Що ти робиш?"}, "options": [{"en": "Remove all the grass", "uk": "Прибираю всю траву"}, {"en": "Push the distance out (about 40 to 60 m) with start and end distances, so it fades instead of popping", "uk": "Відсуваю відстань далі (приблизно 40–60 м) з початковою й кінцевою відстанями, щоб трава поступово зникала, а не вискакувала"}, {"en": "Switch Lumen off", "uk": "Вимикаю Lumen"}], "answer": 1, "explain": {"en": "Too close a cull distance makes pops. A start and an end distance let plants fade out.", "uk": "Занадто близька відстань відсікання створює раптові появи. Початкова й кінцева відстані дають рослинам поступово зникати."}}, {"q": {"en": "Why are buildings not culled?", "uk": "Чому будівлі не відсікаються?"}, "options": [{"en": "They cost nothing", "uk": "Вони нічого не коштують"}, {"en": "Unreal can't cull buildings", "uk": "Unreal не вміє відсікати будівлі"}, {"en": "They're landmarks seen from far away, and HLODs draw them cheaply instead", "uk": "Вони — орієнтири, які видно здалеку, а HLOD натомість малюють їх дешево"}], "answer": 2, "explain": {"en": "Buildings help a pilot find the way from far off. HLODs keep them visible at little cost.", "uk": "Будівлі допомагають пілотові знайти дорогу здалеку. HLOD тримають їх видимими за невелику ціну."}}, {"q": {"en": "Hiding DL_D2_Planting at your worst spot saves 4 ms. What is a good first fix?", "uk": "Приховування DL_D2_Planting у твоєму найгіршому місці економить 4 мс. Яке перше виправлення буде добрим?"}, "options": [{"en": "Delete district 2's planting", "uk": "Видалити рослини району 2"}, {"en": "Turn off shadows on its small plants and cull its ground cover closer, then measure again", "uk": "Вимкнути тіні на його дрібних рослинах і відсікати ґрунтопокривні ближче, потім виміряти знову"}, {"en": "Lower the screen to 1280 x 720", "uk": "Знизити екран до 1280 x 720"}], "answer": 1, "explain": {"en": "Fix the biggest cost in the way that shows least, one change at a time, and measure after each.", "uk": "Виправляй найбільшу статтю витрат найменш помітним способом, по одній зміні за раз, і вимірюй після кожної."}}], "weekInfo": {"week": 12, "title": {"en": "The whole island, polished, flown and presented", "uk": "Увесь острів: шліфування, проліт і презентація"}, "goal": {"en": "By Friday you have the finished island: a budget proof at 1920 x 1080, a 2-minute scenic flight video through both districts, a hand-over pack with correct credits, and a portfolio ready for ArtStation with a CV skills list.", "uk": "До п'ятниці ти маєш готовий острів: доказ, що він вкладається в бюджет при 1920 x 1080, 2-хвилинне відео мальовничого прольоту крізь обидва райони, пакет для передачі з правильними кредитами (credits) і портфоліо, готове для ArtStation, зі списком навичок для резюме."}, "skills": [{"en": "Performance profiling with stat gpu and CSV captures to a 60 fps budget", "uk": "Профілювання продуктивності за допомогою stat gpu і CSV-записів під бюджет 60 fps"}, {"en": "Cull distances and HLODs for large World Partition worlds", "uk": "Відстані відсікання (cull distances) і HLOD для великих світів World Partition"}, {"en": "Cinematic flythroughs with Sequencer and Movie Render Queue, cut and encoded (H.264) in Blender's Video Sequencer", "uk": "Кінематографічні прольоти в Sequencer і Movie Render Queue, змонтовані й закодовані (H.264) у Video Sequencer у Blender"}, {"en": "Portfolio presentation: hero shots, breakdowns and before/after pairs", "uk": "Презентація портфоліо: головні кадри (hero shots), розбори (breakdowns) і пари «до/після»"}, {"en": "Production hand-over: documentation, dependency checks and licence-correct credits", "uk": "Передача проєкту: документація, перевірка залежностей і кредити з дотриманням ліцензій"}]}, "morning": {"sofar": {"en": "Eleven weeks in, you have two finished districts on your own island, with ten final shots beside real photos.", "uk": "Одинадцять тижнів позаду, і на твоєму власному острові два завершені райони з десятьма фінальними кадрами поруч зі справжніми фото."}, "today": {"en": "You capture the frame time along the whole scenic route, set cull distances and HLODs, and prove the island holds the budget.", "uk": "Сьогодні ти записуєш час кадру вздовж усього мальовничого маршруту, налаштовуєш відстані відсікання й HLOD і доводиш, що острів тримає бюджет."}, "cheer": {"en": "Performance work is detective work: measure, change one thing, measure again, and count every fix as a win.", "uk": "Робота з продуктивністю — це детективна робота: вимірюй, змінюй одну річ, вимірюй знову й зараховуй кожне виправлення як перемогу."}, "quote": {"text": {"en": "If we all worked on the assumption that what is accepted as true is really true, there would be little hope of advance.", "uk": "Якби ми всі виходили з того, що загальноприйняте справді є істинним, надії на поступ було б мало."}, "author": {"en": "Orville Wright", "uk": "Орвілл Райт"}, "source": "https://en.wikiquote.org/wiki/Orville_Wright"}}, "hasAssets": false, "workPath": "Work\\Assignment\\Day-56-whole-island-performance", "mapHref": "../../COURSE.html", "prevHref": "../Day-55-boss-district2-finished/START-HERE.html", "nextHref": "../Day-57-scenic-flight-route-gates/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8 and a free spreadsheet. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me and don't write code. Keep me moving and make it feel like a game.\n\nToday I build on my own: Culling, HLODs, the fixes and the second CSV, on your own.\nIt's part of: A whole-island performance pass: a CSV capture along the full scenic route before and after, cull distances per layer, HLODs built and checked, at least three measured fixes, and budget.md as the proof (L_Island: the whole scenic route RT_Scenic, flown from the launch point, with your own PC as the target machine at 1920 x 1080.).\n\nSpec:\n- budget.md: the target (average frame time under 16.6 ms and 95th percentile under 33.3 ms, at 1920 x 1080), the settings (Engine Scalability High, a 1920 x 1080 play window) and the memory in use (under about 14 GB in Task Manager).\n- A CSV capture of the whole route before the fixes and after them, flown in Play with the Day 33 flying pawn, each opened in a free spreadsheet (LibreOffice Calc or Google Sheets) with the average and the 95th percentile of the frame time and the GPU time, and a line chart of the frame time.\n- stat unit and stat gpu at the three worst spots from the chart, with the top lines written down, and the cost of each Data Layer at the worst spot.\n- Cull distances set per layer and listed: ground cover 40 to 60 m, small plants 80 to 120 m, shrubs and small rocks 150 to 250 m, small district props about 150 m, trees 800 m or more; buildings never culled (HLODs draw them far away).\n- HLODs: district buildings and big rocks set to HLOD_Merged (Day 33), with HLOD_Merged still listed in the last row of HLOD Partitions > HLOD Layers To Include; built (Build > Build HLODs) and checked in Play from about 600 m out at sea: both districts and the big landforms still read.\n- At least three fixes, each with a before and after number; if your PC still can't hold the budget after them, one named setting lowered (for example Shadows to Medium in Engine Scalability) and written in budget.md.\n- Looks kept: C4 and D2_C4 shot again and compared with Day 55's finals; any fix that shows is undone.\n\nMy checklist:\n1. Update budget.md with the target and the settings; set the play window to 1920 x 1080 and Engine Scalability to High. Check: budget.md lists the target and both settings. (from lesson 1)\n2. Play in a New Editor Window from the start of RT_Scenic, type csvprofile start, fly the whole route at a steady speed with the Day 33 flying pawn, then type csvprofile stop. Copy the new file into today's Work folder as csv_before.csv. Check: a new .csv file is in IslandCourse/Saved/Profiling/CSV, and its copy is in your Work folder. (from lesson 1)\n3. Open the CSV in a spreadsheet (Language English (USA), as on Day 41); work out the average and the 95th percentile of the frame time and the GPU time; make a line chart of the frame time. Check: four numbers and the chart are in budget.md. (from lesson 1)\n4. Find the three worst stretches on the chart, fly there, and write stat unit and the top five lines of stat gpu at each. At the worst spot, bookmark the view (Ctrl+6) and take stat_before.png and statgpu_worst.png (Win+Shift+S). Check: three spots, each with Frame, GPU and its biggest cost. (from lesson 2)\n5. At the worst spot, hide one Data Layer at a time in the editor and write what each costs. Check: a cost in ms for every layer. (from lesson 2)\n6. Set cull distances on ground cover and small plants, in their PCG spawners and foliage types. Check: flying at 30 m, no ground cover is drawn beyond about 60 m. (from lesson 3)\n7. Set cull distances on shrubs, small rocks and small district props. Check: every layer's numbers are listed in budget.md. (from lesson 3)\n8. Pop check: fly at 10 m, 30 m and 60 m, note anything that pops in near the middle of the view, and push that layer's distance out. Check: nothing pops in near the centre of the view. (from lesson 3)\n9. Set HLOD Layer to HLOD_Merged on district buildings and big rocks (Mobility Static), check HLOD_Merged is still in the last row of HLOD Partitions in World Settings, then choose Build > Build HLODs. Check: the build finishes without errors. (from lesson 4)\n10. Play, fly about 600 m out to sea with the flying pawn and look back at the island. Check: both districts and the big landforms still read from there. (from lesson 4)\n11. Make three or more fixes from the biggest costs, one at a time, measuring after each. Check: each fix has its saving in ms in budget.md. (from lesson 4)\n12. Take the CSV capture of the whole route again, copy it as csv_after.csv, and compare it with the first. Check: the average is under 16.6 ms and the 95th percentile under 33.3 ms, or one named setting is lowered and written down. (from lesson 1)\n13. Shoot C4 and D2_C4 again and compare them with d1_final_C4 and d2_final_C4; undo any fix you can see. Check: each pair looks the same at a glance. (from lesson 3)\n14. Press 6, take stat unit again and put it beside stat_before.png as before_after_day56.png, and record a 60-second flight with stat unit on. Save today's clip as flythrough_day56.mp4 and check that you also have csv_chart.png, hlod_600m.png, hlod_setup.png and looks_kept.png (each is described in today's hand-in list; take any you are missing now). Check: the numbers are readable in both. (from lesson 2)\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Svetlana\nDay 56: Whole-island performance: a CSV along the full route, cull distances and HLODs. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

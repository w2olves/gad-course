<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 15</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.b{background:linear-gradient(145deg,#ff8cc4,#d6337e);box-shadow:0 10px 24px -8px rgba(255,95,168,.6),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.s{background:linear-gradient(145deg,#5fe39a,#16a34a);box-shadow:0 10px 24px -8px rgba(74,222,128,.55),inset 0 1px 0 rgba(255,255,255,.35)}

/* the Done switch */
.sw{display:inline-flex;align-items:center;gap:12px;border:0;background:transparent;cursor:pointer;font:600 14px/1 var(--head);color:var(--muted);min-height:50px;padding:0 6px}
.sw .tr{position:relative;width:58px;height:32px;border-radius:999px;background:var(--well);box-shadow:var(--press);transition:background .25s}

details{margin-top:22px;border-radius:20px;background:var(--well);box-shadow:var(--press);padding:0 18px}

.steps{list-style:none;padding:0;counter-reset:s;margin:4px 0 0}

.vid{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;margin-top:20px;font-size:15px;padding:16px 18px;border-radius:20px}

/* build */
.build.bossday{border-color:rgba(255,95,168,.35)}

.tiers{list-style:none;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:0}

.medal{display:flex;align-items:center;gap:10px;margin:0 0 8px;font:700 11.5px/1 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}

.m0{--mg:rgba(205,127,50,.6)}.m0 i{background:linear-gradient(135deg,#e7a46d,#9a5a2b)}
.m1{--mg:rgba(190,200,215,.7)}.m1 i{background:linear-gradient(135deg,#f3f6fa,#9aa5b3)}
.m2{--mg:rgba(245,195,91,.75)}.m2 i{background:linear-gradient(135deg,#ffe08a,#c99412)}
.ccount{display:flex;align-items:center;gap:16px;margin:28px 0 10px}

.check li:last-child label{border-bottom:0}
.check input{appearance:none;-webkit-appearance:none;width:26px;height:26px;margin:1px 0 0;border-radius:9px;background:var(--well);box-shadow:var(--press);display:grid;place-items:center;cursor:pointer;transition:background .2s,box-shadow .2s}
.check input::after{content:"";width:10px;height:5px;border:solid #fff;border-width:0 0 2.2px 2.2px;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.check input:checked{background:linear-gradient(145deg,#5fe39a,#16a34a);box-shadow:0 0 12px rgba(74,222,128,.55)}
.check input:checked::after{opacity:1}
.check li.on .tx{color:var(--faint)}
.check .ln{font:600 10.5px/1.3 var(--head);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);white-space:nowrap;margin-top:5px;padding:4px 9px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
/* quiz */
.pips{display:flex;gap:8px;margin:0 0 4px;padding:10px 14px;border-radius:999px;width:max-content;max-width:100%;flex-wrap:wrap}

.opt{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;width:calc(100% - 50px);margin:12px 0 12px 50px;text-align:left;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid transparent;border-radius:18px;padding:11px 16px;cursor:pointer;box-shadow:var(--raiseS);transition:box-shadow .2s,transform .15s}

.opt:hover:not([disabled]){transform:translateY(-1px);color:var(--accT)}
.opt.right{box-shadow:var(--press);background:var(--okBg);border-color:rgba(74,222,128,.45)}.opt.right .lt{background:var(--okL);color:#fff;box-shadow:0 0 10px var(--okL)}.opt.right .mk{color:var(--ok)}
.opt.wrong{box-shadow:var(--press);background:var(--badBg);border-color:rgba(255,93,93,.45)}.opt.wrong .lt{background:var(--badL);color:#fff;box-shadow:0 0 10px var(--badL)}.opt.wrong .mk{color:var(--bad)}

.exp{margin:10px 0 0 50px;font-size:15.5px;color:var(--muted)}

.path{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;margin:22px 0 12px}

.clip{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}

.nav{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:34px}
.nav a{display:flex;align-items:center;gap:14px;border-radius:24px;padding:16px 20px;font:600 15px/1.3 var(--head);text-decoration:none;color:var(--ink);min-height:72px}
.nav a .kn{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}

.nav a.nx{justify-content:flex-end;text-align:right;grid-column:2}
#toast{position:fixed;left:50%;bottom:28px;z-index:9;transform:translateX(-50%) translateY(16px);background:rgba(30,33,46,.82);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:#f4f5fa;border:1px solid rgba(255,255,255,.14);padding:13px 24px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none;font:600 14px/1.4 var(--head);max-width:min(92vw,560px);text-align:center;box-shadow:0 20px 40px -14px rgba(0,0,0,.5),0 0 24px var(--glow)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

 body{font-size:16.5px}

}

<script id="data" type="application/json">{"learner": "ib-svetlana-7691a6db", "learnerName": {"en": "Svetlana", "uk": "Світлана"}, "day": 15, "week": 3, "total": 60, "title": {"en": "Boss: your weathered kit beside real photos", "uk": "День боса: твій зістарений набір поруч зі справжніми фото"}, "theme": {"en": "Week 3: Surfaces", "uk": "Тиждень 3: Поверхні"}, "build": {"item": {"en": "The weathered kit in L_KitTest, shown beside three real harbour photos", "uk": "Зістарений набір у L_KitTest поруч із трьома справжніми фото гаваней"}, "why": {"en": "A kit is judged the way a player sees it: in a scene, beside reality. A shot placed beside a real photo at the same angle shows at once what is too clean, too bright or the wrong size. Studios call this a look-development (look-dev) review, and a kit must pass it before anyone builds a town from it. Next week you light and dress a whole harbour corner with this kit.", "uk": "Набір оцінюють так, як його бачить гравець: у сцені, поруч із реальністю. Кадр поруч зі справжнім фото під тим самим кутом одразу показує, що надто чисте, надто яскраве чи неправильного розміру. Студії називають це рев'ю вигляду (look-dev review), і набір має пройти його, перш ніж хтось збудує з нього місто. Наступного тижня ти освітлиш і наповниш цілий куток гавані цим набором."}, "where": {"en": "L_KitTest, with your props placed on the pier and quay.", "uk": "L_KitTest, з твоїми пропсами на пірсі й набережній."}, "spec": [{"en": "Every kit piece, the shop front and the four props wear M_Master instances: nothing grey, checkered or default.", "uk": "Кожна деталь набору, фасад крамниці й чотири пропси вдягнені в інстанси M_Master: нічого сірого, у шахівницю чи стандартного."}, {"en": "At least six pieces with painted wear masks and Wear set by how exposed each piece is to sea and sun: the four from Day 14 plus two more.", "uk": "Щонайменше шість деталей з намальованими масками зношеності, а Wear задано за тим, наскільки кожна деталь відкрита морю й сонцю: чотири з Дня 14 і ще дві."}, {"en": "The four props placed where real ones stand: bollards on the quay edge, a bench facing the water, a bin beside it, a lamp post.", "uk": "Чотири пропси стоять там, де стоять справжні: стовпчики на краю набережної, лавка лицем до води, поруч урна, ліхтарний стовп."}, {"en": "Three real photos of present-day harbours from Wikimedia Commons (a quay wall, a small harbour building, a pier or jetty), each credited in credits.md.", "uk": "Три справжні фото сучасних гаваней з Wikimedia Commons (стінка набережної, маленька будівля в гавані, пірс чи причал), кожне вказане в credits.md."}, {"en": "Three matching views in L_KitTest, each saved as a camera bookmark, with a similar angle, height, field of view and light direction.", "uk": "Три відповідні ракурси в L_KitTest, кожен збережений як закладка камери, зі схожим кутом, висотою, полем зору й напрямком світла."}, {"en": "Three side-by-side sheets at 1920 x 1080: the photo on the left, your shot on the right.", "uk": "Три аркуші порівняння 1920 x 1080: фото ліворуч, твій кадр праворуч."}, {"en": "A self-review with your five-line rubric and the tutor's see-why-fix notes, and one fix made.", "uk": "Самооцінка за твоєю рубрикою з п'яти рядків і нотатки тьютора «бачу — чому — виправити», та одне внесене виправлення."}], "piece1": "the quay wall view beside its photo (shared with the lessons)", "piece2": {"en": "The building and pier views, plus the last textures and wear, timed (tiers)", "uk": "Ракурси будівлі й пірса, а також останні текстури й зношеність, на час (рівні)"}, "steps": [{"text": {"en": "Start the clock (4 hours). Pick one wide view of L_KitTest, save it as bookmark 4 (Ctrl+4) and take start_day15.png: it is the 'before' half of today's before/after. Then fly through L_KitTest and list every piece that still shows grey, checker or a default material. Check: your list shows exactly what is left.", "uk": "Запусти таймер (4 години). Вибери один широкий ракурс L_KitTest, збережи його як закладку 4 (Ctrl+4) і зроби start_day15.png: це половина «до» сьогоднішнього «до/після». Потім пролети через L_KitTest і випиши кожну деталь, що досі показує сірий, шахівницю чи стандартний матеріал. Перевірка: твій список показує саме те, що лишилося."}, "lesson": "D12.4"}, {"text": {"en": "Finish materials on everything on your list, on the mesh assets in the Static Mesh Editor. Check: from 10 m, no grey or checker shows anywhere.", "uk": "Заверши матеріали на всьому зі свого списку, на асетах сіток у Static Mesh Editor. Перевірка: з 10 м ніде не видно сірого чи шахівниці."}, "lesson": "D12.4"}, {"text": {"en": "Paint wear masks for two more pieces (for example SM_Steps in quaykit_day14.blend and SM_Wall_Window in buildkit_day14.blend) on a Paint UV map, then pack, save and export. Check: both masks are mostly black, with wear only where its cause is.", "uk": "Намалюй маски зношеності ще для двох деталей (наприклад, SM_Steps у quaykit_day14.blend і SM_Wall_Window у buildkit_day14.blend) на UV-розгортці Paint, потім запакуй, збережи й експортуй. Перевірка: обидві маски здебільшого чорні, а зношеність лише там, де є її причина."}, "lesson": "D14.2"}, {"text": {"en": "Reimport the two pieces (Generate Lightmap UVs off, as on Day 14), import their masks and make child instances with WearMask and Wear on their main slots. Check: both pieces age when you drag Wear.", "uk": "Зроби Reimport двох деталей (Generate Lightmap UVs вимкнено, як на Дні 14), імпортуй їхні маски й створи дочірні інстанси з WearMask і Wear на їхніх головних слотах. Перевірка: обидві деталі старіють, коли ти тягнеш Wear."}, "lesson": "D14.4"}, {"text": {"en": "Place the four props where real ones stand: bollards on the quay edge, a bench facing the water with a bin beside it, a lamp post near the bench. Press End on each. Check: nothing floats, and each prop has a reason to be where it is.", "uk": "Постав чотири пропси там, де стоять справжні: стовпчики на краю набережної, лавку лицем до води з урною поруч, ліхтарний стовп біля лавки. На кожному натисни End. Перевірка: ніщо не висить у повітрі, і в кожного пропса є причина стояти саме там."}, "lesson": 1}, {"text": {"en": "Find three photos on Wikimedia Commons: a quay wall at the waterline, a small harbour building, a pier or jetty. Credit each. Check: three photos in your Day15 folder and three lines in credits.md.", "uk": "Знайди на Wikimedia Commons три фото: стінку набережної біля ватерлінії, маленьку будівлю в гавані, пірс чи причал. Вкажи авторів кожного. Перевірка: три фото в папці Day15 і три рядки в credits.md."}, "lesson": 1}, {"text": {"en": "For each photo, fly to a matching view in L_KitTest (angle, height, Field of View) and save a bookmark with Ctrl+1, Ctrl+2 and Ctrl+3. Check: pressing 1, 2 and 3 jumps back to each view.", "uk": "Для кожного фото знайди відповідний ракурс у L_KitTest (кут, висота, Field of View) і збережи закладку через Ctrl+1, Ctrl+2 і Ctrl+3. Перевірка: натискання 1, 2 і 3 повертає до кожного ракурсу."}, "lesson": 2}, {"text": {"en": "For each view, turn the sun (hold Ctrl+L and move the mouse) to match the photo's light direction, then press G (Game View hides the editor icons) and take the shot (Win+Shift+S). Check: your shadows fall the same way as in each photo.", "uk": "Для кожного ракурсу поверни сонце (затисни Ctrl+L і порухай мишею) під напрямок світла на фото, потім натисни G (Game View ховає іконки редактора) і зроби кадр (Win+Shift+S). Перевірка: твої тіні падають так само, як на кожному фото."}, "lesson": 2}, {"text": {"en": "Make the three side-by-side sheets in Krita at 1920 x 1080: photo left, your shot right, horizons lined up. Export compare_quay.png, compare_building.png and compare_pier.png. Check: horizons sit at the same height in both halves.", "uk": "Зроби три аркуші порівняння в Krita, 1920 x 1080: фото ліворуч, твій кадр праворуч, горизонти на одній лінії. Експортуй compare_quay.png, compare_building.png і compare_pier.png. Перевірка: горизонти на однаковій висоті в обох половинах."}, "lesson": 3}, {"text": {"en": "Score each sheet with your rubric (five lines, 0 to 2 each) in rubric_day15.md. Check: three totals out of 10 and one line naming your weakest point.", "uk": "Оціни кожен аркуш за своєю рубрикою (п'ять рядків, від 0 до 2 кожен) у rubric_day15.md. Перевірка: три суми з 10 і один рядок, що називає твоє найслабше місце."}, "lesson": 4}, {"text": {"en": "Paste the sheets into a new tutor chat and ask for a review as a demanding art director, in see-why-fix notes. Make the one fix that lifts the score most. Check: before and after crops of that fix are saved.", "uk": "Встав аркуші в новий чат із тьютором і попроси рев'ю від вимогливого арт-директора в нотатках «бачу — чому — виправити». Зроби одне виправлення, яке найбільше підніме оцінку. Перевірка: фрагменти «до» і «після» цього виправлення збережено."}, "lesson": 4}, {"text": {"en": "Stop the clock and write your tier and time in summary.md. Before/after capture: press 4 and put start_day15.png beside the same view now, as before_after_day15.png. Then a 60-second clip flying through all three views. Save today's clip as flythrough_day15.mp4. Check: summary.md names your tier and your time.", "uk": "Зупини таймер і запиши свій рівень і час у звіт дня (summary.md). Знімок «до/після»: натисни 4 і постав start_day15.png поруч із тим самим ракурсом зараз, як before_after_day15.png. Потім 60-секундний кліп прольоту через усі три ракурси. Збережи сьогоднішній кліп як flythrough_day15.mp4. Перевірка: звіт дня (summary.md) називає твій рівень і твій час."}, "lesson": 4}], "boss": [{"en": "Bronze: inside 4 hours, every kit piece, the shop front and the four props wear instances (nothing grey), six pieces have wear, and three photo sheets exist.", "uk": "Бронза: за 4 години кожна деталь набору, фасад крамниці й чотири пропси вдягнені в інстанси (нічого сірого), шість деталей мають зношеність і є три аркуші з фото."}, {"en": "Silver: it looks right: the texel density matches across pieces, no surface looks like plastic, wear sits only where its cause is, and each sheet matches its photo's angle and light.", "uk": "Срібло: усе виглядає правильно: щільність текселів однакова на всіх деталях, жодна поверхня не схожа на пластик, зношеність лише там, де є її причина, а кожен аркуш збігається з кутом і світлом свого фото."}, {"en": "Gold: inside 3 hours 30, and in the tutor's review at least one sheet scores 8 of 10 or more for realism beside its photo.", "uk": "Золото: за 3 години 30 хвилин, і в рев'ю тьютора принаймні один аркуш отримує 8 з 10 або більше за реалістичність поруч зі своїм фото."}], "assets": ["island12/art-director-notes.md", "island12/credits-template.md"]}, "lessons": [{"title": {"en": "Reading a harbour photo for materials, wear and props", "uk": "Читаємо фото гавані: матеріали, зношеність і пропси"}, "minutes": 40, "goals": [{"en": "Read a photo surface by surface: what is stone, plaster, paint, timber and metal, and how rough each looks.", "uk": "Читай фото поверхня за поверхнею: що тут камінь, штукатурка, фарба, дерево й метал і наскільки шорстким виглядає кожне."}, {"en": "Find the wear in a photo and name its cause: water, sun, feet, hands or ropes.", "uk": "Знайди на фото зношеність і назви її причину: вода, сонце, ноги, руки чи мотузки."}, {"en": "Note where props stand in a real harbour and why: bollards on the edge for ropes, benches facing the view.", "uk": "Зверни увагу, де стоять пропси в справжній гавані і чому: стовпчики на краю для мотузок, лавки лицем до краєвиду."}], "doalong": [{"en": "Open a Wikimedia Commons photo of a quay wall in Krita. On a new layer, draw boxes round five surfaces and label them (stone, plaster, timber, metal, rubber). You see a labelled photo.", "uk": "Відкрий у Krita фото стінки набережної з Wikimedia Commons. На новому шарі обведи рамками п'ять поверхонь і підпиши їх (камінь, штукатурка, дерево, метал, гума). Ти бачиш фото з підписами."}, {"en": "Under each label write rough or smooth, and metal or not. You see five short lines, like a material list.", "uk": "Під кожним підписом напиши «шорстке» чи «гладке» і «метал» чи «ні». Ти бачиш п'ять коротких рядків, як список матеріалів."}, {"en": "Circle every wear mark you can find and write its cause beside it. You see that most of the photo is clean.", "uk": "Обведи кожен слід зношеності, який знайдеш, і напиши поруч його причину. Ти бачиш, що більша частина фото чиста."}, {"en": "Circle each prop and write why it stands there. You see that props stand where people need them.", "uk": "Обведи кожен пропс і напиши, чому він там стоїть. Ти бачиш, що пропси стоять там, де вони потрібні людям."}, {"en": "Look at L_KitTest and write the two biggest differences from the photo. You see your first two fixes.", "uk": "Подивися на L_KitTest і запиши дві найбільші відмінності від фото. Ти бачиш свої перші два виправлення."}], "play": {"en": "Material detective: the tutor describes a real harbour photo in words. I list its five main surfaces with Roughness and Metallic values in 3 minutes. A point for each value within 0.2.", "uk": "Детектив матеріалів: тьютор описує словами справжнє фото гавані. За 3 хвилини я перелічую п'ять головних поверхонь зі значеннями Roughness і Metallic. Бал за кожне значення з похибкою до 0.2."}, "video": {"search": "environment art reference photo analysis materials"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Reading a harbour photo for materials, wear and props (Day 15, lesson 1 of 4).\nToday's build: The weathered kit in L_KitTest, shown beside three real harbour photos.\n\nBy the end of this lesson I can:\n1. Read a photo surface by surface: what is stone, plaster, paint, timber and metal, and how rough each looks.\n2. Find the wear in a photo and name its cause: water, sun, feet, hands or ropes.\n3. Note where props stand in a real harbour and why: bollards on the edge for ropes, benches facing the view.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (This week your kit gained clean UVs, a master material, a trim sheet, a shop front and painted wear with its own slider.), what I will learn today (It is Boss day: you finish L_KitTest fully textured and weathered, and set three views of it beside three real harbour photos.), encourage me (An honest side-by-side is the mark of a professional, and the Bronze tier asks only for honest, finished work.), and share today's quote: \"The first principle is that you must not fool yourself — and you are the easiest person to fool.\" (Richard Feynman).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 12: why is a painted steel bollard Metallic 0? | Day 9: name the three wall pieces of your building kit, and what makes each different.\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Material detective: the tutor describes a real harbour photo in words. I list its five main surfaces with Roughness and Metallic values in 3 minutes. A point for each value within 0.2.\n6. Do-along on today's build (the quay wall view beside its photo (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Open a Wikimedia Commons photo of a quay wall in Krita. On a new layer, draw boxes round five surfaces and label them (stone, plaster, timber, metal, rubber). You see a labelled photo.\n   - Under each label write rough or smooth, and metal or not. You see five short lines, like a material list.\n   - Circle every wear mark you can find and write its cause beside it. You see that most of the photo is clean.\n   - Circle each prop and write why it stands there. You see that props stand where people need them.\n   - Look at L_KitTest and write the two biggest differences from the photo. You see your first two fixes.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Matching a view to a photo", "uk": "Підганяємо ракурс під фото"}, "minutes": 40, "goals": [{"en": "Match a photo's view: camera height, angle and field of view (how wide the view is, in degrees; a phone photo is about 60 to 70 degrees).", "uk": "Підбери ракурс фото: висоту камери, кут і поле зору (наскільки широкий вид, у градусах; фото з телефона — це приблизно 60–70 градусів)."}, {"en": "Save views as camera bookmarks (Ctrl+1 to Ctrl+9 saves; 1 to 9 jumps back).", "uk": "Зберігай ракурси як закладки камери (Ctrl+1 … Ctrl+9 зберігає; 1 … 9 повертає назад)."}, {"en": "Turn the sun to match a photo's light direction (hold Ctrl+L and move the mouse).", "uk": "Поверни сонце під напрямок світла на фото (затисни Ctrl+L і порухай мишею)."}], "doalong": [{"en": "Look at your quay photo and guess the camera height from a door (about 2.1 m) or a person (about 1.7 m). Write it down. You see a number like 1.6 m or 6 m.", "uk": "Подивися на фото набережної й оціни висоту камери за дверима (приблизно 2,1 м) чи людиною (приблизно 1,7 м). Запиши. Ти бачиш число на кшталт 1,6 м або 6 м."}, {"en": "In L_KitTest, open the viewport's menu at the top left corner of the view (the three-line icon) and set Field of View to 65. You see the view narrow a little.", "uk": "У L_KitTest відкрий меню в'юпорта в лівому верхньому куті вікна (іконка з трьох рисок) і постав Field of View на 65. Ти бачиш, що вид трохи звузився."}, {"en": "Fly to the same height and angle as the photo (hold the right mouse button and use W, A, S, D, Q and E). Press Ctrl+1. Fly away, then press 1. You see the view jump back exactly.", "uk": "Пролети на ту саму висоту й під тим самим кутом, що й на фото (затисни праву кнопку миші й використовуй W, A, S, D, Q і E). Натисни Ctrl+1. Відлети, потім натисни 1. Ти бачиш, що вид точно повернувся."}, {"en": "Hold Ctrl+L and move the mouse to swing the sun until your shadows fall as in the photo. You see the shadow direction match.", "uk": "Затисни Ctrl+L і поводь мишею, щоб повернути сонце, доки твої тіні не падатимуть, як на фото. Ти бачиш, що напрямок тіней збігся."}, {"en": "Press G to hide the editor icons, take a screenshot (Win+Shift+S) and paste it beside the photo in Krita. You see the two side by side.", "uk": "Натисни G, щоб сховати іконки редактора, зроби скриншот (Win+Shift+S) і встав його поруч із фото в Krita. Ти бачиш їх поруч."}], "play": {"en": "Match the shot: the tutor describes a photo (low, from the water, sun behind the camera). I set up the view and send a screenshot. It scores the match out of 5. I get two tries.", "uk": "Повтори кадр: тьютор описує фото (низько, з води, сонце позаду камери). Я налаштовую ракурс і надсилаю скриншот. Тьютор оцінює збіг з 5. У мене дві спроби."}, "video": {"search": "match camera to reference photo unreal engine"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Matching a view to a photo (Day 15, lesson 2 of 4).\nToday's build: The weathered kit in L_KitTest, shown beside three real harbour photos.\nEarlier today I already did: lesson 1 (Reading a harbour photo for materials, wear and props). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Match a photo's view: camera height, angle and field of view (how wide the view is, in degrees; a phone photo is about 60 to 70 degrees).\n2. Save views as camera bookmarks (Ctrl+1 to Ctrl+9 saves; 1 to 9 jumps back).\n3. Turn the sun to match a photo's light direction (hold Ctrl+L and move the mouse).\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Match the shot: the tutor describes a photo (low, from the water, sun behind the camera). I set up the view and send a screenshot. It scores the match out of 5. I get two tries.\n4. Do-along on today's build (the quay wall view beside its photo (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Look at your quay photo and guess the camera height from a door (about 2.1 m) or a person (about 1.7 m). Write it down. You see a number like 1.6 m or 6 m.\n   - In L_KitTest, open the viewport's menu at the top left corner of the view (the three-line icon) and set Field of View to 65. You see the view narrow a little.\n   - Fly to the same height and angle as the photo (hold the right mouse button and use W, A, S, D, Q and E). Press Ctrl+1. Fly away, then press 1. You see the view jump back exactly.\n   - Hold Ctrl+L and move the mouse to swing the sun until your shadows fall as in the photo. You see the shadow direction match.\n   - Press G to hide the editor icons, take a screenshot (Win+Shift+S) and paste it beside the photo in Krita. You see the two side by side.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "A side-by-side sheet that tells the truth", "uk": "Аркуш порівняння, що каже правду"}, "minutes": 40, "goals": [{"en": "Lay out a 1920 x 1080 comparison sheet: the photo on the left, your shot on the right, the same height and horizon.", "uk": "Розклади аркуш порівняння 1920 x 1080: фото ліворуч, твій кадр праворуч, однакова висота й горизонт."}, {"en": "Compare value (how light or dark), saturation (how strong a colour is), shine and the size of texture details, not only shapes.", "uk": "Порівнюй тон (наскільки світле чи темне), насиченість (наскільки сильний колір), блиск і розмір деталей текстури, а не лише форми."}, {"en": "See value alone by turning both halves grey.", "uk": "Подивися на тон окремо, зробивши обидві половини сірими."}], "doalong": [{"en": "Krita: File > New, 1920 x 1080. Paste the photo into the left half and your shot into the right half (Ctrl+V), scaling each with Ctrl+T to the full height. You see two halves.", "uk": "Krita: File > New, 1920 x 1080. Встав фото в ліву половину, а свій кадр — у праву (Ctrl+V), масштабуючи кожне через Ctrl+T на всю висоту. Ти бачиш дві половини."}, {"en": "Move one half up or down (Ctrl+T, drag) until both horizons line up. You see one level line across the sheet.", "uk": "Посунь одну половину вгору чи вниз (Ctrl+T, тягни), доки обидва горизонти не стануть на одну лінію. Ти бачиш одну рівну лінію через увесь аркуш."}, {"en": "Add a new layer on top, fill it mid-grey and set its blend mode (the drop-down at the top of the Layers panel) to Color. You see both halves in greyscale: which one is brighter?", "uk": "Додай зверху новий шар, залий його середньо-сірим і постав режим змішування (випадний список угорі панелі Layers) на Color. Ти бачиш обидві половини у відтінках сірого: яка з них світліша?"}, {"en": "Hide the grey layer and write three notes under the sheet: brightness, colour, size of texture. You see three plain lines you can act on.", "uk": "Сховай сірий шар і напиши під аркушем три нотатки: яскравість, колір, розмір текстури. Ти бачиш три прості рядки, з якими можна працювати."}, {"en": "File > Export: compare_quay.png. You see the file in your Day15 folder.", "uk": "File > Export: compare_quay.png. Ти бачиш файл у папці Day15."}], "play": {"en": "Spot the difference: I send a sheet. The tutor names one difference in value, one in colour and one in scale. Each one I had already written down scores.", "uk": "Знайди відмінність: я надсилаю аркуш. Тьютор називає одну відмінність у тоні, одну в кольорі й одну в масштабі. Бал за кожну, що вже є в моїх нотатках."}, "video": {"search": "photo reference comparison 3d environment art"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: A side-by-side sheet that tells the truth (Day 15, lesson 3 of 4).\nToday's build: The weathered kit in L_KitTest, shown beside three real harbour photos.\nEarlier today I already did: lesson 1 (Reading a harbour photo for materials, wear and props); lesson 2 (Matching a view to a photo). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Lay out a 1920 x 1080 comparison sheet: the photo on the left, your shot on the right, the same height and horizon.\n2. Compare value (how light or dark), saturation (how strong a colour is), shine and the size of texture details, not only shapes.\n3. See value alone by turning both halves grey.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Spot the difference: I send a sheet. The tutor names one difference in value, one in colour and one in scale. Each one I had already written down scores.\n4. Do-along on today's build (the quay wall view beside its photo (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Krita: File > New, 1920 x 1080. Paste the photo into the left half and your shot into the right half (Ctrl+V), scaling each with Ctrl+T to the full height. You see two halves.\n   - Move one half up or down (Ctrl+T, drag) until both horizons line up. You see one level line across the sheet.\n   - Add a new layer on top, fill it mid-grey and set its blend mode (the drop-down at the top of the Layers panel) to Color. You see both halves in greyscale: which one is brighter?\n   - Hide the grey layer and write three notes under the sheet: brightness, colour, size of texture. You see three plain lines you can act on.\n   - File > Export: compare_quay.png. You see the file in your Day15 folder.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Self-review: a rubric and see-why-fix notes", "uk": "Самооцінка: рубрика й нотатки «бачу — чому — виправити»"}, "minutes": 40, "goals": [{"en": "Score your own work on a rubric (a short scoring table): five lines (scale and density, material values, wear, colour and value, match to the photo), each 0 to 2.", "uk": "Оціни власну роботу за рубрикою (короткою таблицею оцінювання): п'ять рядків (масштаб і щільність, значення матеріалів, зношеність, колір і тон, збіг із фото), кожен від 0 до 2."}, {"en": "Give and take critique as see-why-fix notes: what I see, why it matters, one fix.", "uk": "Давай і приймай критику як нотатки «бачу — чому — виправити»: що я бачу, чому це важливо, одне виправлення."}, {"en": "Pick the one fix that lifts the score most, and do only that: good enough ships.", "uk": "Вибери одне виправлення, яке найбільше підніме оцінку, і зроби лише його: достатньо добре — значить, готово."}], "doalong": [{"en": "Write rubric_day15.md with the five lines, each scored 0, 1 or 2. You see a short table.", "uk": "Напиши rubric_day15.md з п'ятьма рядками, кожен з оцінкою 0, 1 або 2. Ти бачиш коротку таблицю."}, {"en": "Score your quay sheet. You see a total out of 10.", "uk": "Оціни свій аркуш набережної. Ти бачиш суму з 10."}, {"en": "Open art-director-notes.md from today's hand-outs and read it. Copy one rule you will use into your rubric file. You see that rule at the top of your notes.", "uk": "Відкрий art-director-notes.md із сьогоднішніх матеріалів і прочитай. Скопіюй у файл рубрики одне правило, яке будеш використовувати. Ти бачиш це правило вгорі своїх нотаток."}, {"en": "Paste the sheet into a new tutor chat and write: 'Review this as a demanding art director, in see-why-fix notes.' You see three or more notes.", "uk": "Встав аркуш у новий чат із тьютором і напиши: «Зроби рев'ю цієї роботи як вимогливий арт-директор, у нотатках \"бачу — чому — виправити\"». Ти бачиш три або більше нотаток."}, {"en": "Reply with one question and one decision: the fix you'll make first. You see your plan in one line.", "uk": "Дай відповідь з одним питанням і одним рішенням: яке виправлення ти зробиш першим. Ти бачиш свій план одним рядком."}], "play": {"en": "Role swap: the tutor describes a harbour kit of its own with a few planted faults. I give three see-why-fix notes. It scores each note for being specific and kind.", "uk": "Обмін ролями: тьютор описує власний набір для гавані з кількома навмисними вадами. Я даю три нотатки «бачу — чому — виправити». Тьютор оцінює кожну нотатку за конкретність і доброзичливість."}, "video": {"url": "https://www.youtube.com/watch?v=JcqG3dILKZY", "title": "How to Give a Professional Design Critique (Step by Step)", "channel": "Lindsay Marsh", "length": "11:43", "search": "how to give design critique"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Self-review: a rubric and see-why-fix notes (Day 15, lesson 4 of 4).\nToday's build: The weathered kit in L_KitTest, shown beside three real harbour photos.\nEarlier today I already did: lesson 1 (Reading a harbour photo for materials, wear and props); lesson 2 (Matching a view to a photo); lesson 3 (A side-by-side sheet that tells the truth). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Score your own work on a rubric (a short scoring table): five lines (scale and density, material values, wear, colour and value, match to the photo), each 0 to 2.\n2. Give and take critique as see-why-fix notes: what I see, why it matters, one fix.\n3. Pick the one fix that lifts the score most, and do only that: good enough ships.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Role swap: the tutor describes a harbour kit of its own with a few planted faults. I give three see-why-fix notes. It scores each note for being specific and kind.\n4. Do-along on today's build (the quay wall view beside its photo (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Write rubric_day15.md with the five lines, each scored 0, 1 or 2. You see a short table.\n   - Score your quay sheet. You see a total out of 10.\n   - Open art-director-notes.md from today's hand-outs and read it. Copy one rule you will use into your rubric file. You see that rule at the top of your notes.\n   - Paste the sheet into a new tutor chat and write: 'Review this as a demanding art director, in see-why-fix notes.' You see three or more notes.\n   - Reply with one question and one decision: the fix you'll make first. You see your plan in one line.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"How to Give a Professional Design Critique (Step by Step)\" by Lindsay Marsh: https://www.youtube.com/watch?v=JcqG3dILKZY\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "compare_quay.png, compare_building.png and compare_pier.png (photo left, your shot right)", "uk": "compare_quay.png, compare_building.png і compare_pier.png (фото ліворуч, твій кадр праворуч)"}, {"en": "rubric_day15.md (your scores, the tutor's see-why-fix notes, your fix, your tier and time)", "uk": "rubric_day15.md (твої оцінки, нотатки тьютора «бачу — чому — виправити», твоє виправлення, твій рівень і час)"}, {"en": "credits.md (with the three photos)", "uk": "credits.md (з трьома фото)"}, {"en": "The wear masks for your two extra pieces", "uk": "Маски зношеності для двох додаткових деталей"}, {"en": "before_after_day15.png (one view at the start and at the end of today)", "uk": "before_after_day15.png (один ракурс на початку й наприкінці сьогоднішнього дня)"}, {"en": "flythrough_day15.mp4 (60 seconds through the three views)", "uk": "flythrough_day15.mp4 (60 секунд через три ракурси)"}, {"en": "summary.md", "uk": "звіт дня (summary.md)"}], "goal": {"en": "By the end of today you have L_KitTest fully textured and weathered, three views of it placed beside three real harbour photos, and an honest self-review with your tier.", "uk": "Наприкінці сьогоднішнього дня в тебе є повністю затекстурований і зістарений L_KitTest, три його ракурси поруч із трьома справжніми фото гаваней і чесна самооцінка з твоїм рівнем."}, "uses": [{"en": "Days 11 to 14: your UVs, M_Master and its instances, T_Trim_Harbour, SM_ShopFront_A and the Wear slider", "uk": "Дні 11–14: твої UV, M_Master та його інстанси, T_Trim_Harbour, SM_ShopFront_A і повзунок Wear"}, {"en": "Day 10: L_KitTest with the pier and the small harbour building", "uk": "День 10: L_KitTest з пірсом і маленькою будівлею в гавані"}, {"en": "Days 1 to 5: your four street props, with their Day 12 materials", "uk": "Дні 1–5: твої чотири вуличні пропси з матеріалами з Дня 12"}], "quiz": [{"q": {"en": "In Unreal, the stone on SM_Steps looks twice the size of the stone on SM_QuayEdge_4m, with the same instance. What do you fix?", "uk": "В Unreal каміння на SM_Steps удвічі більше, ніж на SM_QuayEdge_4m, хоча інстанс той самий. Що ти виправляєш?"}, "options": [{"en": "The sun angle", "uk": "Кут сонця"}, {"en": "The steps' UV islands: scale them to the kit standard to match TD_Reference", "uk": "UV-острівці сходів: масштабувати їх до стандарту набору, щоб збігалися з TD_Reference"}, {"en": "The Metallic value", "uk": "Значення Metallic"}, {"en": "The FBX file name", "uk": "Назву FBX-файлу"}], "answer": 1, "explain": {"en": "One material at two sizes means two texel densities. Scale the islands until the checkers match (Day 11).", "uk": "Один матеріал двох розмірів означає дві різні щільності текселів. Масштабуй острівці, доки клітинки не збігатимуться (День 11)."}}, {"q": {"en": "Which values suit weathered timber?", "uk": "Які значення пасують вивітреному дереву?"}, "options": [{"en": "Metallic 0, Roughness 0.8", "uk": "Metallic 0, Roughness 0.8"}, {"en": "Metallic 1, Roughness 0.1", "uk": "Metallic 1, Roughness 0.1"}, {"en": "Metallic 0.5, Roughness 0.3", "uk": "Metallic 0.5, Roughness 0.3"}], "answer": 0, "explain": {"en": "Timber is not metal and it is matt. Low Roughness or Metallic makes it look like plastic or chrome (Day 12).", "uk": "Дерево — не метал, і воно матове. Низький Roughness чи Metallic робить його схожим на пластик або хром (День 12)."}}, {"q": {"en": "Why set instances on the mesh asset in the Static Mesh Editor, not on each placed copy?", "uk": "Навіщо призначати інстанси на асеті сітки в Static Mesh Editor, а не на кожній розміщеній копії?"}, "options": [{"en": "Because placed copies can't have materials", "uk": "Бо розміщені копії не можуть мати матеріалів"}, {"en": "It makes the mesh lighter", "uk": "Це робить сітку легшою"}, {"en": "So every copy in every level updates at once", "uk": "Щоб кожна копія на кожному рівні оновилася одразу"}, {"en": "It adds collision", "uk": "Це додає колізію"}], "answer": 2, "explain": {"en": "The mesh asset is shared by every copy. Change it once and every level follows (Day 12).", "uk": "Асет сітки спільний для всіх копій. Зміни його один раз, і кожен рівень підхопить зміну (День 12)."}}, {"q": {"en": "A 7 cm window frame on a 25 cm trim strip: what do you do?", "uk": "Віконна рама 7 см на смузі триму 25 см: що ти робиш?"}, "options": [{"en": "Squash the strip to 7 cm", "uk": "Стискаю смугу до 7 см"}, {"en": "Use part of the strip's height, at the kit density", "uk": "Використовую частину висоти смуги, зі щільністю набору"}, {"en": "Make a new texture for the frame", "uk": "Роблю нову текстуру для рами"}, {"en": "Scale the frame model to 25 cm", "uk": "Масштабую модель рами до 25 см"}], "answer": 1, "explain": {"en": "Thin parts use part of a strip. Squashing changes the density and the texture looks wrong (Day 13).", "uk": "Тонкі частини займають частину смуги. Стискання змінює щільність, і текстура виглядає неправильно (День 13)."}}, {"q": {"en": "Your shop front shows a thin seam every 2 m along the fascia. What is the likely cause?", "uk": "На вивісній дошці твого фасаду кожні 2 м видно тонкий шов. Яка найімовірніша причина?"}, "options": [{"en": "Too many triangles", "uk": "Забагато трикутників"}, {"en": "Metallic is too high", "uk": "Metallic зависокий"}, {"en": "The pivot is in the wrong place", "uk": "Півот не на своєму місці"}, {"en": "The trim strip doesn't tile left to right: its join needs fixing in Wrap Around Mode", "uk": "Смуга триму не тайлиться зліва направо: її стик треба виправити в Wrap Around Mode"}], "answer": 3, "explain": {"en": "The trim is 2 m wide, so a bad join shows every 2 m. Clone it out in Krita and reimport (Day 13).", "uk": "Трим має 2 м завширшки, тож поганий стик видно кожні 2 м. Затри його клоном у Krita й зроби Reimport (День 13)."}}, {"q": {"en": "On a wear mask, which colour means worn?", "uk": "Який колір на масці зношеності означає «зношене»?"}, "options": [{"en": "Black", "uk": "Чорний"}, {"en": "Red", "uk": "Червоний"}, {"en": "White", "uk": "Білий"}], "answer": 2, "explain": {"en": "White is worn and black is clean. Most of a good mask stays black (Day 14).", "uk": "Біле — зношене, чорне — чисте. Більша частина доброї маски лишається чорною (День 14)."}}, {"q": {"en": "You drag Wear on the pier deck and nothing changes. What do you check first?", "uk": "Ти тягнеш Wear на настилі пірса, і нічого не змінюється. Що ти перевіряєш спершу?"}, "options": [{"en": "That the deck's slot uses its child instance with WearMask set, and that WearMask reads UV channel 1", "uk": "Що слот настилу використовує свій дочірній інстанс із заданою WearMask і що WearMask читає UV-канал 1"}, {"en": "That the sun is at noon", "uk": "Що сонце в зеніті"}, {"en": "That the deck has UCX boxes", "uk": "Що настил має коробки UCX"}, {"en": "That Tiling is 0", "uk": "Що Tiling дорівнює 0"}], "answer": 0, "explain": {"en": "Wear only works through the child instance that holds the mask. The mask must read the Paint map, UV channel 1 (Day 14).", "uk": "Wear працює лише через дочірній інстанс, який тримає маску. Маска має читати розгортку Paint, UV-канал 1 (День 14)."}}, {"q": {"en": "When you compare your shot with a photo, what should match before you judge the materials?", "uk": "Коли ти порівнюєш свій кадр із фото, що має збігатися, перш ніж оцінювати матеріали?"}, "options": [{"en": "The file names", "uk": "Назви файлів"}, {"en": "The angle, height, field of view and light direction", "uk": "Кут, висота, поле зору й напрямок світла"}, {"en": "The number of triangles", "uk": "Кількість трикутників"}], "answer": 1, "explain": {"en": "If the view and light differ, every comparison is unfair. Match them first, then judge (Day 15).", "uk": "Якщо ракурс і світло різні, кожне порівняння нечесне. Спершу підбери їх, потім оцінюй (День 15)."}}], "weekInfo": {"week": 3, "title": {"en": "Surfaces", "uk": "Поверхні"}, "goal": {"en": "By Friday you have your whole harbour kit unwrapped at one texel density, textured with M_Master instances and a trim sheet, weathered with painted wear masks and a Wear slider, and shown beside real harbour photos.", "uk": "До п'ятниці в тебе є весь портовий набір: розгорнутий з однією щільністю текселів, затекстурований інстансами M_Master і трим-шитом, зістарений намальованими масками зношеності й повзунком Wear і показаний поруч зі справжніми фото гавані."}, "skills": [{"en": "UV unwrapping with clean seams and consistent texel density for modular kits", "uk": "UV-розгортка з акуратними швами й однаковою щільністю текселів для модульних наборів"}, {"en": "PBR material authoring: master materials and material instances in Unreal Engine 5", "uk": "Створення PBR-матеріалів: майстер-матеріали та інстанси матеріалів в Unreal Engine 5"}, {"en": "Trim sheet design and UV layout for modular environment kits", "uk": "Дизайн трим-шитів і UV-розкладка для модульних наборів оточення"}, {"en": "Texture painting and parameter-driven weathering (wear masks on a second UV channel)", "uk": "Малювання текстур і зношеність, керована параметрами (маски зношеності на другому UV-каналі)"}, {"en": "Look-development review against real photo reference", "uk": "Перевірка вигляду (look development) за справжніми фото-референсами"}]}, "morning": {"sofar": {"en": "This week your kit gained clean UVs, a master material, a trim sheet, a shop front and painted wear with its own slider.", "uk": "Цього тижня твій набір отримав чисті UV, майстер-матеріал, трим-шит, вітрину й намальовану зношеність із власним повзунком."}, "today": {"en": "It is Boss day: you finish L_KitTest fully textured and weathered, and set three views of it beside three real harbour photos.", "uk": "Сьогодні День боса: ти завершуєш L_KitTest — повністю текстурований і зістарений — і ставиш три його види поруч із трьома справжніми фото порту."}, "cheer": {"en": "An honest side-by-side is the mark of a professional, and the Bronze tier asks only for honest, finished work.", "uk": "Чесне порівняння пліч-о-пліч — ознака професіонала, а Бронза просить лише чесної, завершеної роботи."}, "quote": {"text": {"en": "The first principle is that you must not fool yourself — and you are the easiest person to fool.", "uk": "Перший принцип полягає в тому, що не можна обманювати себе, — а себе обдурити найлегше."}, "author": {"en": "Richard Feynman", "uk": "Річард Фейнман"}, "source": "https://en.wikiquote.org/wiki/Richard_Feynman"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-15-boss-weathered-kit", "mapHref": "../../COURSE.html", "prevHref": "../Day-14-texture-painting-and-wear/START-HERE.html", "nextHref": "../Day-16-colour-from-real-photos/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8, Blender and Krita. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me and don't write code. Keep me moving and make it feel like a game.\n\nToday I build on my own: The building and pier views, plus the last textures and wear, timed (tiers).\nIt's part of: The weathered kit in L_KitTest, shown beside three real harbour photos (L_KitTest, with your props placed on the pier and quay.).\n\nSpec:\n- Every kit piece, the shop front and the four props wear M_Master instances: nothing grey, checkered or default.\n- At least six pieces with painted wear masks and Wear set by how exposed each piece is to sea and sun: the four from Day 14 plus two more.\n- The four props placed where real ones stand: bollards on the quay edge, a bench facing the water, a bin beside it, a lamp post.\n- Three real photos of present-day harbours from Wikimedia Commons (a quay wall, a small harbour building, a pier or jetty), each credited in credits.md.\n- Three matching views in L_KitTest, each saved as a camera bookmark, with a similar angle, height, field of view and light direction.\n- Three side-by-side sheets at 1920 x 1080: the photo on the left, your shot on the right.\n- A self-review with your five-line rubric and the tutor's see-why-fix notes, and one fix made.\n\nMy checklist:\n1. Start the clock (4 hours). Pick one wide view of L_KitTest, save it as bookmark 4 (Ctrl+4) and take start_day15.png: it is the 'before' half of today's before/after. Then fly through L_KitTest and list every piece that still shows grey, checker or a default material. Check: your list shows exactly what is left. (from day 12, lesson 4)\n2. Finish materials on everything on your list, on the mesh assets in the Static Mesh Editor. Check: from 10 m, no grey or checker shows anywhere. (from day 12, lesson 4)\n3. Paint wear masks for two more pieces (for example SM_Steps in quaykit_day14.blend and SM_Wall_Window in buildkit_day14.blend) on a Paint UV map, then pack, save and export. Check: both masks are mostly black, with wear only where its cause is. (from day 14, lesson 2)\n4. Reimport the two pieces (Generate Lightmap UVs off, as on Day 14), import their masks and make child instances with WearMask and Wear on their main slots. Check: both pieces age when you drag Wear. (from day 14, lesson 4)\n5. Place the four props where real ones stand: bollards on the quay edge, a bench facing the water with a bin beside it, a lamp post near the bench. Press End on each. Check: nothing floats, and each prop has a reason to be where it is. (from lesson 1)\n6. Find three photos on Wikimedia Commons: a quay wall at the waterline, a small harbour building, a pier or jetty. Credit each. Check: three photos in your Day15 folder and three lines in credits.md. (from lesson 1)\n7. For each photo, fly to a matching view in L_KitTest (angle, height, Field of View) and save a bookmark with Ctrl+1, Ctrl+2 and Ctrl+3. Check: pressing 1, 2 and 3 jumps back to each view. (from lesson 2)\n8. For each view, turn the sun (hold Ctrl+L and move the mouse) to match the photo's light direction, then press G (Game View hides the editor icons) and take the shot (Win+Shift+S). Check: your shadows fall the same way as in each photo. (from lesson 2)\n9. Make the three side-by-side sheets in Krita at 1920 x 1080: photo left, your shot right, horizons lined up. Export compare_quay.png, compare_building.png and compare_pier.png. Check: horizons sit at the same height in both halves. (from lesson 3)\n10. Score each sheet with your rubric (five lines, 0 to 2 each) in rubric_day15.md. Check: three totals out of 10 and one line naming your weakest point. (from lesson 4)\n11. Paste the sheets into a new tutor chat and ask for a review as a demanding art director, in see-why-fix notes. Make the one fix that lifts the score most. Check: before and after crops of that fix are saved. (from lesson 4)\n12. Stop the clock and write your tier and time in summary.md. Before/after capture: press 4 and put start_day15.png beside the same view now, as before_after_day15.png. Then a 60-second clip flying through all three views. Save today's clip as flythrough_day15.mp4. Check: summary.md names your tier and your time. (from lesson 4)\n\nToday is a BOSS build: help me keep time against the tiers below. Tiers:\n- Bronze: inside 4 hours, every kit piece, the shop front and the four props wear instances (nothing grey), six pieces have wear, and three photo sheets exist.\n- Silver: it looks right: the texel density matches across pieces, no surface looks like plastic, wear sits only where its cause is, and each sheet matches its photo's angle and light.\n- Gold: inside 3 hours 30, and in the tutor's review at least one sheet scores 8 of 10 or more for realism beside its photo.\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me and tell me which tier I reached.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Svetlana\nDay 15: Boss: your weathered kit beside real photos. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; boss tier: <bronze / silver / gold / none>; quiz: <score> of 8\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

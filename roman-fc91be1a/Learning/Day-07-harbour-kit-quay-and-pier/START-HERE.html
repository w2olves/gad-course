<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 7</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

<script id="data" type="application/json">{"learner": "ib-roman-fc91be1a", "learnerName": {"en": "Roman", "uk": "Роман"}, "day": 7, "week": 2, "total": 60, "title": {"en": "Kit design: a metric grid, a pivot rule and your first harbour pieces", "uk": "Дизайн набору: метрична сітка, правило origin і твої перші деталі гавані"}, "theme": {"en": "Week 2: Modular kits", "uk": "Тиждень 2: Модульні набори"}, "build": {"item": {"en": "Your harbour kit, part 1: SM_QuayEdge_4m (a stone quay edge) and SM_PierDeck_4m (a timber pier deck)", "uk": "Твій набір для гавані, частина 1: SM_QuayEdge_4m (кам'яний край причалу) і SM_PierDeck_4m (дерев'яний настил пірса)"}, "why": {"en": "A modular kit is a few pieces that snap together like building blocks, so ten good pieces can build a kilometre of waterfront with no visible joins. The rules matter more than the models: every piece is a whole number of metres, and every piece has its pivot in the same place.", "uk": "Модульний набір — це кілька деталей, які з'єднуються між собою, як кубики конструктора. Десять добрих деталей складають кілометр набережної без помітних стиків. Правила важливіші за моделі: довжина кожної деталі — ціла кількість метрів, і origin у кожної в тому самому місці."}, "next": {"en": "kit_rules.md grows on Days 8 and 9. These two pieces build L_KitTest on Friday, your harbour corner on Day 20 and your island's real quay on Day 41.", "uk": "kit_rules.md доповнюється в День 8 і День 9. Із цих двох деталей у п'ятницю постане L_KitTest, у День 20 — ріг гавані, а в День 41 — справжній причал твого острова."}, "where": {"en": "Your island's waterfront (district 1): the quay along the harbour and a pier going out over the water. Today the pieces meet in Course/Day07.", "uk": "Набережна твого острова (район 1): причал уздовж гавані та пірс, що виходить над водою. Сьогодні деталі зустрічаються в Course/Day07."}, "spec": [{"en": "kit_rules.md (one level above the day work folder, for the whole course): the piece list, the grid (1 m; main pieces 4 m), the pivot rule, the water-side rule, 'every piece is exported from the world origin' and 'Unreal mirrors Y'.", "uk": "kit_rules.md у GAD, на рівень вище за робочу папку дня, — на весь курс. У ньому список деталей, сітка (1 м; основні деталі 4 м), правило origin, правило боку води, «кожну деталь експортують із центру світу» і «Unreal віддзеркалює вісь Y»."}, {"en": "SM_QuayEdge_4m: 4 m long (X) and 2 m deep (Y), the deck top at Z = 0 and the wall going 3 m down; a stone coping (the row of big stones along the top of the water edge) 0.45 m wide, standing 0.1 m above the deck and overhanging the wall by 5 cm.", "uk": "SM_QuayEdge_4m: 4 м завдовжки (X) і 2 м завглибшки (Y). Верх причалу на Z = 0, стіна йде на 3 м донизу. Кам'яна бровка — ряд великих каменів уздовж краю над водою — має 0,45 м завширшки, піднімається на 0,1 м над причалом і нависає над стіною на 5 см."}, {"en": "SM_PierDeck_4m: a 4 x 4 m timber deck with its top at Z = 0: 20 planks 0.18 m wide with 2 cm gaps (Array (Legacy)), three beams underneath, and four piles (round posts that stand in the water), one near each corner.", "uk": "SM_PierDeck_4m: дерев'яний настил 4 × 4 м з верхом на Z = 0. У ньому 20 дощок по 0,18 м завширшки з проміжками 2 см (Array (Legacy)), три балки знизу й чотири палі — круглі стовпи, що стоять у воді, — по одній біля кожного кута."}, {"en": "Pivot rule: the top corner at the start of the piece on the land side (X = 0, Y = 0, Z = 0). The piece runs along +X and the water side faces -Y (towards you in Blender's front view; +Y in Unreal, which mirrors the Y axis).", "uk": "Правило origin: верхній кут на початку деталі з боку суходолу (X = 0, Y = 0, Z = 0). Деталь іде вздовж +X, а бік води дивиться в -Y — до тебе на виді спереду в Blender. В Unreal це +Y, бо Unreal віддзеркалює вісь Y."}, {"en": "Triangles under 2,000 per piece; plain materials M_Stone and M_Timber; UCX boxes on each piece.", "uk": "Менше 2 000 трикутників на деталь; прості матеріали M_Stone і M_Timber; блоки UCX на кожній деталі."}, {"en": "SM_QuayEdge_4m.fbx and SM_PierDeck_4m.fbx; in Unreal (Course/Day07, level L_Day07), four quay pieces in a 16 m run and three pier decks going out from it, all snapped with no gaps.", "uk": "SM_QuayEdge_4m.fbx і SM_PierDeck_4m.fbx. В Unreal (Course/Day07, рівень L_Day07) чотири деталі причалу в ряд на 16 м і три настили пірса, що виходять від нього, усі з'єднані без щілин."}], "piece1": "SM_QuayEdge_4m (in the lessons)", "piece2": {"en": "SM_PierDeck_4m, on your own", "uk": "SM_PierDeck_4m, самостійно"}, "steps": [{"text": {"en": "Check: the files from today's lessons are in the day work folder (quaykit_day7.blend with SM_QuayEdge_4m, SM_QuayEdge_4m.fbx and kit_rules.md), and Unreal has the level L_Day07. Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it.", "uk": "Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: quaykit_day7.blend із SM_QuayEdge_4m, SM_QuayEdge_4m.fbx і kit_rules.md, а в Unreal є рівень L_Day07. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде."}, "lesson": 1}, {"text": {"en": "In quaykit_day7.blend, hide SM_QuayEdge_4m (the eye icon in the Outliner). One plank: a cube 0.18 x 4 x 0.05 m, scale applied, at X 0.1, Y -2, Z -0.025. Check: one plank lies across the deck area with its top on Z = 0.", "uk": "У quaykit_day7.blend сховай SM_QuayEdge_4m (значок ока в Outliner). Одна дошка: куб із Dimensions X 0.18, Y 4, Z 0.05, масштаб застосовано, на X 0.1, Y -2, Z -0.025. Перевірка: одна дошка лежить упоперек настилу, а її верх на Z = 0."}, "lesson": "D1.3"}, {"text": {"en": "Add Array (Legacy) to the plank (Add Modifier > Generate > Array (Legacy)): Count 20, Relative Offset off, Constant Offset Distance X 0.2 m. Check: 20 planks cover X 0 to 4 m with even gaps.", "uk": "Додай дошці Array (Legacy): Add Modifier > Generate > Array (Legacy). Count 20, Relative Offset вимкнено, Constant Offset Distance X 0.2 м. Перевірка: 20 дощок покривають X від 0 до 4 м з однаковими проміжками."}, "lesson": "D3.1"}, {"text": {"en": "Beams: three cubes 4 x 0.2 x 0.3 m running along X under the planks, each at X 2, Z -0.2 and Y -0.3, -2 and -3.7. Check: from the front (Numpad 1, or the ` pie) each beam starts at X 0 and ends at X 4, right under the planks.", "uk": "Балки: три куби з Dimensions X 4, Y 0.2, Z 0.3 уздовж X під дошками, кожен на X 2, Z -0.2 і Y -0.3, -2 і -3.7. Перевірка: спереду (Numpad 1 або кругле меню `) кожна балка починається на X 0 і закінчується на X 4, просто під дошками."}, "lesson": "D1.3"}, {"text": {"en": "Piles: a cylinder (Vertices 12, Radius 0.15 m, Depth 4 m) at X 0.2, Y -0.3, Z -2.05; copy it with Shift+D to X 0.2, Y -3.7, then to X 3.8 at both Y values. Press Ctrl+S. Check: four piles go down from the beams, one near each corner.", "uk": "Палі: циліндр (Vertices 12, Radius 0.15 м, Depth 4 м) на X 0.2, Y -0.3, Z -2.05. Скопіюй його клавішами Shift+D на X 0.2, Y -3.7, потім на X 3.8 з обома значеннями Y. Натисни Ctrl+S. Перевірка: чотири палі йдуть донизу від балок, по одній біля кожного кута."}, "lesson": "D1.1"}, {"text": {"en": "Apply the Array, select every deck part (planks, beams and piles), press Ctrl+J and name the object SM_PierDeck_4m. Put its origin on the pivot: Shift+S > Cursor to World Origin, then Origin to 3D Cursor. Check: the orange dot sits on the corner, and Location reads 0, 0, 0.", "uk": "Застосуй Array, виділи всі частини настилу (дошки, балки й палі), натисни Ctrl+J і назви об'єкт SM_PierDeck_4m. Постав origin за правилом: Shift+S > Cursor to World Origin, потім Origin to 3D Cursor. Перевірка: помаранчева точка стоїть на куті, а Location показує 0, 0, 0."}, "lesson": 2}, {"text": {"en": "Material: M_Timber (a grey-brown from your photos, Roughness 0.85, Metallic 0) on the whole deck. Check: in Material Preview the deck looks like weathered timber, not plastic.", "uk": "Матеріал: M_Timber (сіро-коричневий за твоїми фото, Roughness 0.85, Metallic 0) на весь настил. Перевірка: у Material Preview настил схожий на зношене часом дерево, а не на пластик."}, "lesson": "D5.2"}, {"text": {"en": "Collision: one box for the deck and beams (Dimensions 4 x 4 x 0.35 m at X 2, Y -2, Z -0.175) and one box per pile, named UCX_SM_PierDeck_4m_00 to _04, with the deck's origin. Press Ctrl+S. Check: five boxes, every name starting with UCX_SM_PierDeck_4m_.", "uk": "Колізія: один блок на настил із балками (Dimensions X 4, Y 4, Z 0.35 на X 2, Y -2, Z -0.175) і по блоку на кожну палю. Назви їх від UCX_SM_PierDeck_4m_00 до _04 і дай їм origin настилу. Натисни Ctrl+S. Перевірка: п'ять блоків, кожна назва починається з UCX_SM_PierDeck_4m_."}, "lesson": "D4.3"}, {"text": {"en": "Read Triangles (under 2,000), then select the deck and its UCX boxes and export SM_PierDeck_4m.fbx with the Day 4 settings. Check: in File Explorer the file is 10 KB or more (4 KB means nothing was selected).", "uk": "Прочитай Triangles (менше 2 000), потім виділи настил і його блоки UCX і експортуй SM_PierDeck_4m.fbx із налаштуваннями з Дня 4. Перевірка: у Провіднику файл має 10 КБ або більше (4 КБ означає, що нічого не було виділено)."}, "lesson": 2}, {"text": {"en": "Import it into Course/Day07 with your import checklist. Place three decks out from the middle of your quay run: turn the first with Rotation Z 90 or -90 so it points away from the land, join it to the quay's water edge with vertex snap. After snapping, type Location Z 0, then copy it twice, 400 cm each. Check: a 12 m pier goes straight out, with no gaps or flicker at any join.", "uk": "Імпортуй його в Course/Day07 за своїм чек-листом імпорту. Постав три настили від середини ряду причалу. Перший поверни полем Rotation Z на 90 або -90, щоб він дивився від суходолу, і приєднай до краю причалу над водою прив'язкою до вершин. Після прив'язки введи Location Z 0, потім скопіюй настил двічі, щоразу на 400 см. Перевірка: пірс 12 м іде прямо від берега, на жодному стику немає щілин чи мерехтіння."}, "lesson": 4}, {"text": {"en": "Save check: close Blender and reopen quaykit_day7.blend: both pieces are in the Outliner. Then before_after_day7.png: Blender with both pieces on the left half (Win+Left), Unreal with the quay and pier on the right (Win+Right), one Win+Shift+S. Check: one picture shows both programs.", "uk": "Перевір збереження: закрий Blender і знову відкрий quaykit_day7.blend — обидві деталі є в Outliner. Потім зроби before_after_day7.png: Blender з обома деталями в лівій половині екрана (Win+Left), Unreal із причалом і пірсом у правій (Win+Right), один скриншот Win+Shift+S. Перевірка: на одній картинці видно обидві програми."}, "lesson": "D0.1"}, {"text": {"en": "Report and hand-in: click Copy the day report at the bottom of the page, paste it into a new chat and answer. Open summary.md in Notepad, press Ctrl+End, paste the answer and press Ctrl+S. Then drag the files on the Hand in list into your hand-in folder. Check: every name shows in the folder, each with a size.", "uk": "Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: кожна назва зі списку є в папці, у кожної є розмір."}, "lesson": "D0.1"}]}, "lessons": [{"title": {"en": "Kit design: a blockout and a piece list", "uk": "Дизайн набору: блокаут і список деталей"}, "minutes": 40, "goals": [{"en": "Explain a modular kit: a few pieces that snap together on a grid to build large places.", "uk": "Пояснювати, що таке модульний набір: кілька деталей, які з'єднуються на сітці, щоб будувати великі місця."}, {"en": "Write a piece list from a blockout and one photo: straight pieces, corners, ends and special pieces.", "uk": "Складати список деталей за блокаутом і одним фото: прямі деталі, кути, кінці й особливі деталі."}, {"en": "Choose a grid and explain why every piece must be a whole number of grid steps.", "uk": "Вибирати сітку й пояснювати, чому кожна деталь має бути цілим числом кроків сітки."}], "doalong": [{"en": "Blockout first, in Unreal: File > New Level > Basic (Default on 4.27) and save it as L_Day07 in a new folder Course/Day07. Drag a Cube from Place Actors > Shapes and type Scale 4, 2, 0.2: one 4 m quay piece. Alt+drag copies to X 400, 800 and 1200: a 16 m quay.", "uk": "Спершу блокаут, в Unreal: File > New Level > Basic (у 4.27 — Default), збережи як L_Day07 у новій папці Course/Day07. Перетягни Cube з Place Actors > Shapes і введи Scale 4, 2, 0.2: одна деталь причалу 4 м. Перетягуванням з Alt зроби копії на X 400, 800 і 1200: має вийти причал 16 м."}, {"en": "Add three cubes with Scale 4, 4, 0.2 going out from the middle of the quay: the pier. Count the pieces: 4 quay pieces and 3 pier decks, all whole metres, so every join lands on a grid line.", "uk": "Додай три куби зі Scale 4, 4, 0.2, що йдуть від середини причалу: це пірс. Порахуй деталі: 4 деталі причалу й 3 настили пірса, усі в цілих метрах, тож кожен стик лягає на лінію сітки."}, {"en": "Make kit_rules.md one level above the day work folder, beside credits.md: it lives there for the whole course. Write this week's piece list: SM_QuayEdge_4m and SM_PierDeck_4m (today); SM_Railing_2m, SM_RailingPost, SM_Steps and SM_QuayCorner_Out (Day 8). Kit names end in their size or type.", "uk": "Створи kit_rules.md у GAD, на рівень вище за робочу папку дня, поруч із credits.md: він лежатиме там увесь курс. Запиши список деталей цього тижня: SM_QuayEdge_4m і SM_PierDeck_4m (сьогодні); SM_Railing_2m, SM_RailingPost, SM_Steps і SM_QuayCorner_Out (День 8). Назви деталей закінчуються розміром або типом."}, {"en": "Add the grid rule: a 1 m grid; main pieces 4 m; small pieces 2 m. Add why: pieces that are whole metres always meet on a grid line, so nothing needs nudging.", "uk": "Додай правило сітки: сітка 1 м, основні деталі — 4 м, малі — 2 м. Додай пояснення: деталі в цілих метрах завжди сходяться на лінії сітки, тож нічого не доводиться підсувати."}, {"en": "Find one photo you like of a small harbour with a stone quay and a timber pier (any site) and keep it in refs; it is only for your eyes. Spot its repeating parts: the wall, the coping, the deck, the piles, the railings and the steps.", "uk": "Знайди одне фото невеликої гавані з кам'яним причалом і дерев'яним пірсом, яке тобі подобається (будь-який сайт), і збережи в refs — воно лише для твоїх очей. Знайди на ньому частини, що повторюються: стіну, бровку, настил, палі, поруччя й сходи."}], "play": {"en": "Kit builder on paper: the tutor describes a harbour in words (a 20 m quay, a pier 8 m out, one more 12 m quay after a gap); I count the pieces from my list, and the tutor checks that nothing is left over or missing.", "uk": "Конструктор набору на папері: тьютор словами описує гавань (причал 20 м, пірс на 8 м від берега, ще один причал 12 м після проміжку). Я рахую деталі за своїм списком, а тьютор перевіряє, чи нічого не зайве й нічого не бракує."}, "video": {"url": "https://www.youtube.com/watch?v=Nlj3hN35CE4", "title": "Modular assets: a simple time-saving technique for game developers", "channel": "Boars In Rome", "length": "10:01", "search": "modular assets game environment kit"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Дизайн набору: блокаут і список деталей (Day 7, lesson 1 of 4). Today's build: Твій набір для гавані, частина 1: SM_QuayEdge_4m (кам'яний край причалу) і SM_PierDeck_4m (дерев'яний настил пірса).\nWhat I already know: День 6: точне розміщення, прив'язка до сітки, папки і твій чек-лист імпорту; День 5: прості матеріали (M_); День 4: блоки UCX і чистий експорт FBX; День 3: модифікатори Array і Bevel; День 2: петлеві розрізи.\n\nBy the end of this lesson I can:\n1. Пояснювати, що таке модульний набір: кілька деталей, які з'єднуються на сітці, щоб будувати великі місця.\n2. Складати список деталей за блокаутом і одним фото: прямі деталі, кути, кінці й особливі деталі.\n3. Вибирати сітку й пояснювати, чому кожна деталь має бути цілим числом кроків сітки.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: Ти вже вмієш моделювати, експортувати й ставити пропси з точністю до сантиметра, і в Unreal є твоя власна охайна тренувальна вулиця. Today: Сьогодні ти задумуєш набір для гавані на сітці 1 м і робиш SM_QuayEdge_4m та SM_PierDeck_4m — дві деталі, які стикуються без щілин. One encouraging line: Великі ігрові світи будують саме з наборів, і ти починаєш свій уже на другому тижні: одна чиста деталь, що стикується, — справжній поступ.); 2 lines on why today matters and where it comes back, in plain words (from this: Модульний набір — це кілька деталей, які з'єднуються між собою, як кубики конструктора. Десять добрих деталей складають кілометр набережної без помітних стиків. Правила важливіші за моделі: довжина кожної деталі — ціла кількість метрів, і origin у кожної в тому самому місці. It comes back: kit_rules.md доповнюється в День 8 і День 9. Із цих двох деталей у п'ятницю постане L_KitTest, у День 20 — ріг гавані, а в День 41 — справжній причал твого острова.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-07-harbour-kit-quay-and-pier exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (SM_QuayEdge_4m (на уроках)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Спершу блокаут, в Unreal: File > New Level > Basic (у 4.27 — Default), збережи як L_Day07 у новій папці Course/Day07. Перетягни Cube з Place Actors > Shapes і введи Scale 4, 2, 0.2: одна деталь причалу 4 м. Перетягуванням з Alt зроби копії на X 400, 800 і 1200: має вийти причал 16 м.\n   2. Додай три куби зі Scale 4, 4, 0.2, що йдуть від середини причалу: це пірс. Порахуй деталі: 4 деталі причалу й 3 настили пірса, усі в цілих метрах, тож кожен стик лягає на лінію сітки.\n   3. Створи kit_rules.md у GAD, на рівень вище за робочу папку дня, поруч із credits.md: він лежатиме там увесь курс. Запиши список деталей цього тижня: SM_QuayEdge_4m і SM_PierDeck_4m (сьогодні); SM_Railing_2m, SM_RailingPost, SM_Steps і SM_QuayCorner_Out (День 8). Назви деталей закінчуються розміром або типом. [screenshot]\n   4. Додай правило s) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}], "handin": [{"en": "summary.md", "uk": "summary.md (звіт дня)"}, {"en": "quaykit_day7.blend: your first two kit pieces, which get new pieces tomorrow (→ Day 8)", "uk": "quaykit_day7.blend (твої перші дві деталі набору, до них завтра додадуться нові) (→ День 8)"}, {"en": "before_after_day7.png: the pieces in Blender, and the quay with its pier in Unreal (proof)", "uk": "before_after_day7.png (деталі в Blender, а причал із пірсом в Unreal) (доказ)"}], "goal": {"en": "By the end of today you have SM_QuayEdge_4m and SM_PierDeck_4m, two harbour kit pieces on a 1 m grid with one shared pivot rule, snapped together without gaps in Unreal.", "uk": "До кінця дня в тебе є SM_QuayEdge_4m і SM_PierDeck_4m — дві деталі набору для гавані на сітці 1 м зі спільним правилом origin. В Unreal вони з'єднані без щілин."}, "uses": [{"en": "Day 6: exact placing, grid snap, folders and your import checklist", "uk": "День 6: точне розміщення, прив'язка до сітки, папки і твій чек-лист імпорту"}, {"en": "Day 5: simple materials (M_)", "uk": "День 5: прості матеріали (M_)"}, {"en": "Day 4: UCX boxes and the clean FBX export", "uk": "День 4: блоки UCX і чистий експорт FBX"}, {"en": "Day 3: the Array modifier and Bevel", "uk": "День 3: модифікатори Array і Bevel"}, {"en": "Day 2: loop cuts", "uk": "День 2: петлеві розрізи"}], "quiz": [{"q": {"en": "You snap four quay pieces and see a 3 cm gap at every seam. What is the most likely cause?", "uk": "Ти з'єднуєш чотири деталі причалу й бачиш щілину 3 см на кожному шві. Яка найімовірніша причина?"}, "options": [{"en": "The pieces are 3.97 m long, or their origins are 3 cm off the pivot corner", "uk": "Деталі мають 3,97 м завдовжки, або їхні origin зсунуто на 3 см від кута"}, {"en": "The material is too rough", "uk": "Матеріал надто шорсткий"}, {"en": "The grid snap is set to 100", "uk": "Прив'язка до сітки стоїть на 100"}, {"en": "Nanite is off", "uk": "Nanite вимкнено"}], "answer": 0, "explain": {"en": "Kit pieces only meet cleanly when every length is whole and every pivot follows the rule. A small error repeats at every seam.", "uk": "Деталі набору сходяться чисто, лише коли кожна довжина ціла, а кожен origin стоїть за правилом. Маленька помилка повторюється на кожному шві."}}, {"q": {"en": "Why are kit pieces whole numbers of metres?", "uk": "Чому довжина деталей набору — ціле число метрів?"}, "options": [{"en": "Unreal can't import other sizes", "uk": "Unreal не може імпортувати інші розміри"}, {"en": "So they always meet on grid lines and snap together without nudging", "uk": "Щоб вони завжди сходилися на лініях сітки й з'єднувалися без підсування"}, {"en": "To save triangles", "uk": "Щоб заощадити трикутники"}], "answer": 1, "explain": {"en": "Whole-metre pieces on a 1 m grid always end on a grid line, so the next piece starts exactly there.", "uk": "Деталі в цілих метрах на сітці 1 м завжди закінчуються на лінії сітки, тож наступна деталь починається точно там."}}, {"q": {"en": "Where is the pivot of every piece in your harbour kit?", "uk": "Де origin кожної деталі твого набору для гавані?"}, "options": [{"en": "In the middle of the piece", "uk": "Посередині деталі"}, {"en": "At the bottom centre, like a prop", "uk": "Унизу по центру, як у пропса"}, {"en": "At the top corner at the start of the piece, on the land side", "uk": "У верхньому куті на початку деталі, з боку суходолу"}], "answer": 2, "explain": {"en": "Props pivot at their base centre; kit pieces pivot on a grid corner, so they snap to each other and to the grid.", "uk": "У пропсів origin у центрі основи, а в деталей набору — у куті сітки. Тож деталі прилипають одна до одної й до сітки."}}, {"q": {"en": "Two surfaces flicker where your pier deck meets the quay. What is this, and what causes it?", "uk": "Там, де настил пірса сходиться з причалом, мерехтять дві поверхні. Що це і чому так?"}, "options": [{"en": "The deck is too far from the camera", "uk": "Настил задалеко від камери"}, {"en": "A missing material", "uk": "Бракує матеріалу"}, {"en": "Z-fighting: two faces in exactly the same place", "uk": "Z-fighting: дві грані точно в одному місці"}, {"en": "Snapping is off in Blender", "uk": "У Blender вимкнено прив'язку"}], "answer": 2, "explain": {"en": "When two faces sit in the same place, Unreal can't decide which to draw, so they flicker. Move or remove one of them.", "uk": "Коли дві грані лежать в одному місці, Unreal не може вирішити, яку малювати, і вони мерехтять. Посунь або прибери одну з них."}}, {"q": {"en": "In Blender, your pier deck sits 6 m away from the world origin when you export it. What will you see in Unreal?", "uk": "У Blender під час експорту твій настил пірса стоїть за 6 м від центру світу. Що ти побачиш в Unreal?"}, "options": [{"en": "Nothing different", "uk": "Нічого не зміниться"}, {"en": "The deck's pivot may end up 6 m away from the deck, so it is placed in the wrong spot", "uk": "Origin настилу може опинитися за 6 м від самого настилу, тож настил стане не туди"}, {"en": "The deck is 6 m longer", "uk": "Настил стане на 6 м довшим"}], "answer": 1, "explain": {"en": "Export every kit piece from the world origin with its origin on the pivot, so the pivot arrives in Unreal where you expect.", "uk": "Експортуй кожну деталь набору з центру світу, з origin на куті за правилом. Тоді origin прибуде в Unreal туди, куди ти очікуєш."}}], "weekInfo": {"week": 2, "title": {"en": "Modular kits", "uk": "Модульні набори"}, "goal": {"en": "By Friday you have your own harbour and building kit on a metric grid, and L_KitTest: a quay, a pier and a harbour house built from it in Unreal, with the house saved as a Level Instance.", "uk": "До п'ятниці в тебе є власний набір для гавані й будівель на метричній сітці. Із нього в Unreal зібрано рівень L_KitTest: причал, пірс і будинок біля гавані, а будинок збережено як Level Instance."}, "skills": [{"en": "Modular kit design on a metric grid with consistent pivots", "uk": "Дизайн модульного набору на метричній сітці з однаковими origin"}, {"en": "Unreal Engine 5 level assembly: import pipeline, exact placement and snapping", "uk": "Збирання рівня в Unreal Engine 5: імпорт, точне розміщення та прив'язка (snapping)"}, {"en": "Nanite versus LOD decisions for real-time performance", "uk": "Вибір між Nanite і LOD заради продуктивності в реальному часі"}, {"en": "Level Instances for reusable building sets", "uk": "Level Instance для будівель, які ставлять багато разів"}, {"en": "Content Browser organisation and industry naming conventions (SM_, M_, MI_, T_, L_)", "uk": "Порядок у Content Browser і галузеві правила назв (SM_, M_, MI_, T_, L_)"}]}, "morning": {"sofar": {"en": "You can model, export and place props to the centimetre, and you have a tidy practice street of your own in Unreal.", "uk": "Ти вже вмієш моделювати, експортувати й ставити пропси з точністю до сантиметра, і в Unreal є твоя власна охайна тренувальна вулиця."}, "today": {"en": "You design a harbour kit on a 1 m grid and make SM_QuayEdge_4m and SM_PierDeck_4m, two pieces that snap together without gaps.", "uk": "Сьогодні ти задумуєш набір для гавані на сітці 1 м і робиш SM_QuayEdge_4m та SM_PierDeck_4m — дві деталі, які стикуються без щілин."}, "cheer": {"en": "Kits are how large game worlds get built, and you are starting one in week two; one clean piece that snaps is real progress.", "uk": "Великі ігрові світи будують саме з наборів, і ти починаєш свій уже на другому тижні: одна чиста деталь, що стикується, — справжній поступ."}, "quote": {"text": {"en": "Design depends largely on constraints.", "uk": "Дизайн великою мірою залежить від обмежень."}, "author": {"en": "Charles Eames", "uk": "Чарльз Імз"}, "source": "https://en.wikiquote.org/wiki/Charles_Eames"}}, "hasAssets": false, "workPath": "Work\\Assignment\\Day-07-harbour-kit-quay-and-pier", "mapHref": "../../COURSE.html", "prevHref": "../Day-06-unreal-first-steps/START-HERE.html", "nextHref": "../Day-08-kit-railing-steps-corner/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Blender and Unreal Engine 5.8. I am a beginner on Day 7. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me and don't write code.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: SM_PierDeck_4m, самостійно.\nIt's part of: Твій набір для гавані, частина 1: SM_QuayEdge_4m (кам'яний край причалу) і SM_PierDeck_4m (дерев'яний настил пірса) (Набережна твого острова (район 1): причал уздовж гавані та пірс, що виходить над водою. Сьогодні деталі зустрічаються в Course/Day07.).\nWhy it matters: Модульний набір — це кілька деталей, які з'єднуються між собою, як кубики конструктора. Десять добрих деталей складають кілометр набережної без помітних стиків. Правила важливіші за моделі: довжина кожної деталі — ціла кількість метрів, і origin у кожної в тому самому місці. It comes back: kit_rules.md доповнюється в День 8 і День 9. Із цих двох деталей у п'ятницю постане L_KitTest, у День 20 — ріг гавані, а в День 41 — справжній причал твого острова.\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-07-harbour-kit-quay-and-pier (on the drive I chose on Day 0).\nWhat I already know: День 6: точне розміщення, прив'язка до сітки, папки і твій чек-лист імпорту; День 5: прості матеріали (M_); День 4: блоки UCX і чистий експорт FBX; День 3: модифікатори Array і Bevel; День 2: петлеві розрізи; today's lessons: Дизайн набору: блокаут і список деталей; Сітка і правило origin у Blender; Моделюємо SM_QuayEdge_4m; З'єднуємо деталі набору в Unreal. Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- kit_rules.md у GAD, на рівень вище за робочу папку дня, — на весь курс. У ньому список деталей, сітка (1 м; основні деталі 4 м), правило origin, правило боку води, «кожну деталь експортують із центру світу» і «Unreal віддзеркалює вісь Y».\n- SM_QuayEdge_4m: 4 м завдовжки (X) і 2 м завглибшки (Y). Верх причалу на Z = 0, стіна йде на 3 м донизу. Кам'яна бровка — ряд великих каменів уздовж краю над водою — має 0,45 м завширшки, піднімається на 0,1 м над причалом і нависає над стіною на 5 см.\n- SM_PierDeck_4m: дерев'яний настил 4 × 4 м з верхом на Z = 0. У ньому 20 дощок по 0,18 м завширшки з проміжками 2 см (Array (Legacy)), три балки знизу й чотири палі — круглі стовпи, що стоять у воді, — по одній біля кожного кута.\n- Правило origin: верхній кут на початку деталі з боку суходолу (X = 0, Y = 0, Z = 0). Деталь іде вздовж +X, а бік води дивиться в -Y — до тебе на виді спереду в Blender. В Unreal це +Y, бо Unreal віддзеркалює вісь Y.\n- Менше 2 000 трикутників на деталь; прості матеріали M_Stone і M_Timber; блоки UCX на кожній деталі.\n- SM_QuayEdge_4m.fbx і SM_PierDeck_4m.fbx. В Unreal (Course/Day07, рівень L_Day07) чотири деталі причалу в ряд на 16 м і три настили пірса, що виходять від нього, усі з'єднані без щілин.\n\nMy checklist (the same numbers show on my course page):\n1. Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: quaykit_day7.blend із SM_QuayEdge_4m, SM_QuayEdge_4m.fbx і kit_rules.md, а в Unreal є рівень L_Day07. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. (from lesson 1)\n2. У quaykit_day7.blend сховай SM_QuayEdge_4m (значок ока в Outliner). Одна дошка: куб із Dimensions X 0.18, Y 4, Z 0.05, масштаб застосовано, на X 0.1, Y -2, Z -0.025. Перевірка: одна дошка лежить упоперек настилу, а її верх на Z = 0. (from day 1, lesson 3)\n3. Додай дошці Array (Legacy): Add Modifier > Generate > Array (Legacy). Count 20, Relative Offset вимкнено, Constant Offset Distance X 0.2 м. Перевірка: 20 дощок покривають X від 0 до 4 м з однаковими проміжками. (from day 3, lesson 1)\n4. Балки: три куби з Dimensions X 4, Y 0.2, Z 0.3 уздовж X під дошками, кожен на X 2, Z -0.2 і Y -0.3, -2 і -3.7. Перевірка: спереду (Numpad 1 або кругле меню `) кожна балка починається на X 0 і закінчується на X 4, просто під дошками. (from day 1, lesson 3)\n5. Палі: циліндр (Vertices 12, Radius 0.15 м, Depth 4 м) на X 0.2, Y -0.3, Z -2.05. Скопіюй його клавішами Shift+D на X 0.2, Y -3.7, потім на X 3.8 з обома значеннями Y. Натисни Ctrl+S. Перевірка: чотири палі йдуть донизу від балок, по одній біля кожного кута. (from day 1, lesson 1)\n6. Застосуй Array, виділи всі частини настилу (дошки, балки й палі), натисни Ctrl+J і назви об'єкт SM_PierDeck_4m. Постав origin за правилом: Shift+S > Cursor to World Origin, потім Origin to 3D Cursor. Перевірка: помаранчева точка стоїть на куті, а Location показує 0, 0, 0. (from lesson 2)\n7. Матеріал: M_Timber (сіро-коричневий за твоїми фото, Roughness 0.85, Metallic 0) на весь настил. Перевірка: у Material Preview настил схожий на зношене часом дерево, а не на пластик. (from day 5, lesson 2)\n8. Колізія: один блок на настил із балками (Dimensions X 4, Y 4, Z 0.35 на X 2, Y -2, Z -0.175) і по блоку на кожну палю. Назви їх від UCX_SM_PierDeck_4m_00 до _04 і дай їм origin настилу. Натисни Ctrl+S. Перевірка: п'ять блоків, кожна назва починається з UCX_SM_PierDeck_4m_. (from day 4, lesson 3)\n9. Прочитай Triangles (менше 2 000), потім виділи настил і його блоки UCX і експортуй SM_PierDeck_4m.fbx із налаштуваннями з Дня 4. Перевірка: у Провіднику файл має 10 КБ або більше (4 КБ означає, що нічого не було виділено). (from lesson 2)\n10. Імпортуй його в Course/Day07 за своїм чек-листом імпорту. Постав три настили від середини ряду причалу. Перший поверни полем Rotation Z на 90 або -90, щоб він дивився від суходолу, і приєднай до краю причалу над водою прив'язкою до вершин. Після прив'язки введи Location Z 0, потім скопіюй настил двічі, щоразу на 400 см. Перевірка: пірс 12 м іде прямо від берега, на жодному стику немає щілин чи мерехтіння. (from lesson 4)\n11. Перевір збереження: закрий Blender і знову відкрий quaykit_day7.blend — обидві деталі є в Outliner. Потім зроби before_after_day7.png: Blender з обома деталями в лівій половині екрана (Win+Left), Unreal із причалом і пірсом у правій (Win+Right), один скриншот Win+Shift+S. Перевірка: на одній картинці видно обидві програми. (from day 0, lesson 1)\n12. Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: кожна назва зі списку є в папці, у кожної є розмір. (from day 0, lesson 1)\n\nHow to help: ask which step number I'm on, then give me only the next step: the exact clicks and what I should see. When I send a screenshot, compare it with my reference, my sizes and the spec, and name one thing to fix at a time.\nCheck every save and export by reopening it before we move on:\n- a .blend: close Blender, double-click the file in today's day work folder (GAD\\Day-07-harbour-kit-quay-and-pier), and the model is there (an empty grid means the wrong file was saved)\n- a .md or .txt: open it with Notepad; the text is there, and the name doesn't end in .md.txt\nWhen I write \"готово\", and in any case before the day ends, check with me one item at a time (yes/no): each spec point, then each file on my hand-in list, ready in my day work folder (skip summary.md: the day report writes it next):\n1. quaykit_day7.blend (твої перші дві деталі набору, до них завтра додадуться нові) (→ День 8)\n2. before_after_day7.png (деталі в Blender, а причал із пірсом в Unreal) (доказ)\nFinish with a short list of anything missing, and one line on where this work comes back and what it will look like there. Then tell me the order for the end of the day: first the day report (the Copy the day report button at the bottom of my course page) into summary.md, and only then hand in all the files on the list, summary.md too.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт function quiz(){if(!D.quiz||!D.quiz.length)return '';const a=st.qa||{};let ok=0;const L=u('letters');
 const pips='<div class="pips well" aria-hidden="true">'+D.quiz.map((q,i)=>'<i class="'+(a[i]==null?'':a[i]===q.answer?'r':'w')+'"></i>').join('')+'</div>';
 const qs=D.quiz.map((q,i)=>{const c=a[i];if(c===q.answer)ok++;return '<div class="qz"><p class="qq"><span class="qn">'+(i+1)+'</span><span>'+lk(x(q.q))+'</span></p>'+q.options.map((o,k)=>{let cls='opt',mk='<span></span>';if(c!=null){if(k===q.answer){cls+=' right';mk=ic('check','mk')}else if(k===c){cls+=' wrong';mk=ic('x','mk')}}return '<button class="'+cls+'" id="o'+i+'_'+k+'"'+(c!=null?' disabled':'')+' onclick="pick('+i+','+k+')"><span class="lt">'+(L[k]||k+1)+'</span><span>'+esc(x(o))+'</span>'+mk+'</button>'}).join('')+(c!=null?'<p class="exp '+(c===q.answer?'r':'w')+'" id="e'+i+'" tabindex="-1"><b>'+(c===q.answer?u('right'):u('wrong'))+'</b>'+lk(x(q.explain))+'</p>':'')+'</div>'}).join('');
 return '<section class="card glass quiz">'+lab(u('quiz'),'gold')+'<p class="muted" style="margin:-6px 0 14px">'+u('quizSub')+'</p>'+pips+qs+(qDone()?'<div class="score well" role="status"><span class="eyebrow">'+u('score')+'</span><span class="lcd" aria-label="'+ok+' / '+D.quiz.length+'">'+seg(ok+'/'+D.quiz.length)+'</span>'+(st.qs1?'<span class="muted">'+u('first')+': '+st.qs1[0]+'/'+st.qs1[1]+'</span>':'')+'<div class="row"><button class="btn ghost" id="retry" onclick="retry()">'+u('retry')+'</button></div></div>':'')+'</section>'}
function vid(v){if(!v)return '';const link=v.url?'<a href="'+esc(v.url)+'" target="_blank" rel="noopener">'+esc(x(v.title)||v.url)+'</a>'+(v.channel?' <span class="muted">· '+esc(v.channel)+(v.length?' · '+esc(v.length):'')+'</span>':''):'';const s=v.search?'<a href="https://www.youtube.com/results?search_query='+encodeURIComponent(v.search)+'" target="_blank" rel="noopener">'+u('noVid')+': '+esc(v.search)+'</a>':'';const alt=v.alt&&v.alt.url?'<br><span class="eyebrow">UA</span> <a href="'+esc(v.alt.url)+'" target="_blank" rel="noopener">'+esc(v.alt.title||v.alt.url)+'</a>'+(v.alt.channel?' <span class="muted">· '+esc(v.alt.channel)+'</span>':''):'';return '<div class="vid well">'+kn('play')+'<div><b>'+u('more')+'?</b><br>'+(link||s)+alt+(link&&s?'<br><span class="muted" style="font-size:14px">'+s+'</span>':'')+'</div></div>'}
function morning(){const m=D.morning;if(!m)return '';const q=m.quote||{};
 let shelf='';if(D.day>0){shelf='<div class="shelf" aria-hidden="true">';let g='';for(let d=0;d<D.day;d++){let p=0;try{p=(JSON.parse(localStorage.getItem('devteam:'+D.learner+':'+d))||{}).pct||0}catch(e){}g+='<i class="'+(p>=1?'d':'')+(d>0&&d%5===0?' bs':'')+'"></i>';if(d%5===0||d===D.day-1){shelf+='<span class="wkg">'+g+'</span>';g=''}}shelf+='</div>'}
 const qt=lang==='uk'&&q.original?q.original:x(q.text);
 return '<section class="card glass morning"><div class="mgrid">'+(m.sofar?'<div>'+lab(u('sofar'),'gold')+shelf+'<p class="mtxt">'+lk(x(m.sofar))+'</p></div>':'')+(m.today?'<div>'+lab(u('todayL'))+'<p class="mtxt">'+lk(x(m.today))+'</p></div>':'')+'</div>'+(m.cheer?'<p class="cheer">'+esc(x(m.cheer))+'</p>':'')+(qt?'<figure class="quote well">'+kn('quote')+'<blockquote>'+esc(qt)+'</blockquote>'+(q.author?'<figcaption>'+esc(x(q.author))+'</figcaption>':'')+'</figure>':'')+'</section>'}
function setLang(l){lang=l;try{localStorage.setItem('devteam:lang',lang)}catch(e){};render()}
function toggleLang(){setLang(lang==='uk'?'en':'uk')}
/* keep open sections and keyboard focus across re-renders */
const openD=new Set();
function tg(e){if(e.open)openD.add(e.id);else openD.delete(e.id)}
const op=id=>openD.has(id)?' open':'';
function render(){const ae=document.activeElement,fid=ae&&(ae.id||(ae.getAttribute('data-th')?'th-'+ae.getAttribute('data-th'):ae.getAttribute('lang')&&ae.closest('.seg')?'lg-'+ae.getAttribute('lang'):''));
 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);
 const b=D.build,P=Math.round(prog()*100);
 document.getElementById('top').innerHTML='<div class="topin glass"><a class="maplink" href="'+esc(D.mapHref)+'">'+kn('map')+u('map')+'</a><div class="crumb"><b>'+esc(x(D.learnerName))+'</b><span>'+u('week')+' '+D.week+'</span><span>'+u('day')+' '+D.day+' '+u('of')+' '+D.total+'</span></div>'+controls(lang,'setLang')+'</div><div class="tline"><i style="width:'+P+'%"></i></div>';
 const state=w=>w<D.week?'b':w===D.week?'n':'p';
 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 let wk='';if(D.weekInfo){const w=D.weekInfo;wk='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}
 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p>'+(b.next?'<div class="back well">'+kn('arrow')+'<div><b>'+u('comes')+'</b><br>'+lk(x(b.next))+'</div></div>':'')+'<div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.assetFiles&&D.assetFiles.length?'<p class="files">'+ic('folder')+'<span>'+u('filesL')+' '+D.assetFiles.map(f=>'<a href="assets/'+encodeURIComponent(f)+'" target="_blank" rel="noopener">'+esc(f)+'</a>').join(', ')+'</span></p>':D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+=handinCard();h+=beforeCard();
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div><label class="rcpt" for="r'+i+'"><span class="eyebrow">'+u('rcpt')+'</span><textarea id="r'+i+'" rows="2" placeholder="'+esc(u('rcptPh'))+'" oninput="st.r'+i+'=this.value;save()">'+esc(st['r'+i]||'')+'</textarea></label>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+hList()+chkList()+(hasClip?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<h3>1 · '+u('copyR')+'</h3><p class="muted">'+u('report')+'</p><div class="row"><button class="btn ghost" onclick="cp(reportText())">'+ic('copy')+u('copyR')+'</button></div><h3>2 · '+u('ship')+'</h3>'+hf()+'<p class="muted" style="margin:12px 0 0">'+u('hNote')+'</p></section>';
 h+=qCard();h+=wk;
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();
</script>
</body>
</html>

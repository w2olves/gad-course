олини, а біля моря — ширші. Між долинами розгалужуються хребти — довгі високі гребені."}, {"en": "Shape a beach: a gentle slope under 10 degrees, at least 6 m long for every 1 m of drop. It runs on under the water, only in a sheltered bay.", "uk": "Формувати пляж: пологий схил менше 10 градусів, щонайменше 6 м довжини на кожен 1 м спуску. Він тягнеться далі під воду і буває лише в захищеній затоці."}, {"en": "Shape district 2's ground by its kind of place: stepped terraces for a village, a broad top for a lighthouse headland, a wide flat floor for a farm valley.", "uk": "Формувати землю району 2 за його типом місцевості: тераси-сходи для села, широкий верх для мису з маяком, широке рівне дно для долини з фермами."}], "doalong": [{"en": "Find a stream's line on island_map.png, then fly to the same place between your poles. Use Sculpt with Shift (lower), Brush Size 1500, along the stream from high to low. You should see a valley that drops all the way to the sea.", "uk": "Знайди лінію струмка на island_map.png, потім перелети в те саме місце між віхами. Веди Sculpt із Shift (опускання), Brush Size 1500, уздовж струмка згори донизу. Має вийти долина, що спускається аж до моря."}, {"en": "Sharpen the ridge between two valleys with Sculpt (raise) at low strength, then a light Smooth. You should see a clear crest line from 100 m.", "uk": "Загостри хребет між двома долинами інструментом Sculpt (піднімання) з малою силою, потім легко пройдися Smooth. З висоти 100 м видно чітку лінію гребеня."}, {"en": "In a sheltered bay, Shift-sculpt the floor so the land slopes gently from about 2 m above sea to about 3 m below it over 30 to 40 m. You should see the Z = 0 plane meet the beach in a long soft line.", "uk": "У захищеній затоці опусти дно через Sculpt із Shift, щоб земля полого спускалася приблизно від 2 м над морем до 3 м під ним на відстані 30–40 м. Площина на Z = 0 сходиться з пляжем довгою м'якою лінією."}, {"en": "District 2: Flatten its ground for its kind of place. A village gets two or three terraces 3 to 4 m apart, each its own Flatten stroke at its own height. You should see flat ground where your plan puts buildings or fields.", "uk": "Район 2: вирівняй землю інструментом Flatten під його тип місцевості. Для села — дві-три тераси через 3–4 м, кожна окремим мазком Flatten на своїй висоті. Рівна земля з'являється там, де на плані будівлі чи поля."}, {"en": "Climb CAM_Survey to 300 m and follow your valleys. You should see them reach your bays where the map shows them.", "uk": "Підніми CAM_Survey на 300 м і пролети вздовж долин. Вони доходять до заток там, де їх показує мапа."}], "play": {"en": "Landform quiz: the tutor describes a valley, ridge or beach ('a beach at a cliff foot facing the open sea', 'a valley that rises towards the sea'). I say 'real' or 'fake' and why.", "uk": "Вікторина рельєфу: тьютор описує долину, хребет чи пляж («пляж біля підніжжя скелі, відкритий до моря», «долина, що піднімається до моря»). Я кажу «справжнє» чи «несправжнє» і чому."}, "video": {"search": "how rivers shape valleys v-shaped valley explained"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Форми рельєфу: долини, хребти й пляжі (Day 27, lesson 3 of 4). Today's build: Ландшафт острова, виліплений за мапою: рівні майданчики для обох районів, дві полиці під дороги, долини, хребти й пляжі, з вивітрюванням і перевірені з повітря.\nWhat I already know: День 26: L_Island з відкаліброваним ландшафтом, CAM_Survey і terrain_notes.md; День 22: map_notes.md (кути районів, верхівка, стартовий майданчик і дороги); День 23: обидва плани ділянок (де має бути рівна земля).\nEarlier today I already did: lesson 1 (Основи ліплення й геодезичні віхи); lesson 2 (Рівні майданчики й полиці для районів і доріг). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Читати землю так, як її формує вода. На крутій землі струмки прорізають V-подібні долини, а біля моря — ширші. Між долинами розгалужуються хребти — довгі високі гребені.\n2. Формувати пляж: пологий схил менше 10 градусів, щонайменше 6 м довжини на кожен 1 м спуску. Він тягнеться далі під воду і буває лише в захищеній затоці.\n3. Формувати землю району 2 за його типом місцевості: тераси-сходи для села, широкий верх для мису з маяком, широке рівне дно для долини з фермами.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: 2 lines on why today matters and where it comes back, in plain words (from this: Карта висот дає великі пагорби, але тільки ти знаєш, де стоїть містечко і де дорога йде вгору. Будинкам потрібна рівна земля, дорогам — полиці з пологим підйомом, а воді — долини, що йдуть униз. Студії спершу ліплять під ці потреби, а вже потім — для краси. It comes back: Завтра на цю землю ляже узбережжя й автоматичний матеріал. Полиці під дороги в День 31 понесуть дороги, а на рівних майданчиках районів з Дня 41 стануть будівлі району 1, з Дня 48 — району 2.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-27-sculpting-to-the-map exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (рівний майданчик району 1 і перша полиця під дорогу (разом з уроками)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Знайди лінію струмка на island_map.png, потім перелети в те саме місце між віхами. Веди Sculpt із Shift (опускання), Brush Size 1500, уздовж струмка згори донизу. Має вийти долина, що спускається аж до моря.\n   2. Загостри хребет між двома долинами інструментом Sculpt (піднімання) з малою силою, потім легко пройдися Smooth. З висоти 100 м видно чітку лінію гребеня.\n   3. У захищеній затоці опусти дно через Sculpt із Shift, щоб земля полого спускалася приблизно від 2 м над морем до 3 м під ним на відстані 30–40 м. Площина на Z = 0 сходиться з пляжем довгою м'якою лінією. [screenshot]\n   4. Район 2: вирівняй землю інструментом Flatten під його тип місцевості. Для села — дві-три тераси через 3–4 м, кожна окремим мазком Flatten на своїй висоті. Рівна земля з'являється там, де на плані будівлі чи поля.\n   5. Підніми CAM_Survey на 300 м і пролети вздовж долин. Вони доходять до заток там, де їх показує мапа. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Вікторина рельєфу: тьютор описує долину, хребет чи пляж («пляж біля підніжжя скелі, відкритий до моря», «долина, що піднімається до моря»). Я кажу «справжнє» чи «несправжнє» і чому. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; see-why-fix note = нотатка «бачу, чому, як виправити»; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; default value = типове значення; File Explorer = Провідник; vertex / edge / face = вершина / ребро / грань; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; kit / kit piece / part of one object = набір / деталь / частина; map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; district / plot / plot plan = район / ділянка / план ділянки; harbour / quay / waterfront / pier = гавань / причал / набережна / пірс; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; summit, hilltop = верхівка; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}, {"title": {"en": "Weathering and checking from the air", "uk": "Вивітрювання й перевірка з повітря"}, "minutes": 40, "goals": [{"en": "Weather the slopes lightly, with big brushes. Noise breaks up smooth shapes, Erosion slumps steep slopes as if soil slid down, and Hydro cuts small rain channels.", "uk": "Легко вивітрювати схили великими пензлями. Noise розбиває гладкі форми, Erosion осідає круті схили, ніби ґрунт сповз, а Hydro прорізає маленькі дощові русла."}, {"en": "Clean the faults left from the import, stair-like steps, spikes and holes, with Smooth.", "uk": "Прибирати інструментом Smooth вади після імпорту: сходинки, шпилі та ями."}, {"en": "Check the land from 50 m and 300 m, and against the map in a Top view.", "uk": "Перевіряти землю з висоти 50 м і 300 м, а також за мапою згори (вид Top)."}], "doalong": [{"en": "Choose Noise, Brush Size 6000, Tool Strength 0.1, and make one stroke across a long smooth slope. You should see small bumps, not big lumps.", "uk": "Вибери Noise, Brush Size 6000, Tool Strength 0.1 і зроби один мазок поперек довгого гладкого схилу. З'являються дрібні горбики, а не великі грудки."}, {"en": "Choose Erosion and brush once over a steep slope; then choose Hydro and brush once. Compare before and after from 150 m. You should see slumps at the foot and small channels down the face.", "uk": "Вибери Erosion і пройдися один раз по крутому схилу, потім вибери Hydro і пройдися один раз. Порівняй до і після з висоти 150 м. Біля підніжжя з'являються осипи, а на схилі — маленькі русла."}, {"en": "Pilot CAM_Survey low (Z about 5000, 50 m) along your coast and look for stair-like steps, spikes or holes; Smooth each one. You should see none left along your route.", "uk": "Пролети камерою CAM_Survey низько (Z близько 5000, тобто 50 м) уздовж узбережжя й шукай сходинки, шпилі чи ями. Кожну згладь інструментом Smooth. Має вийти: на маршруті їх не лишилося."}, {"en": "Climb CAM_Survey to 300 m (Z 30000) and look at the whole island. You should see the districts' flats, the road shelves and the valleys reading clearly.", "uk": "Підніми CAM_Survey на 300 м (Z 30000) і подивися на весь острів. Рівні майданчики районів, полиці під дороги й долини добре читаються."}, {"en": "Switch to Top and Unlit, take a screenshot, and lay it over island_map.png in Krita. Save it as overlay.png. You should see the poles on the red boxes' corners and the flats inside them.", "uk": "Перемкнися на Top і Unlit, зроби скриншот і наклади його на island_map.png у Krita. Збережи як overlay.png. Віхи стоять на кутах червоних квадратів, а майданчики — всередині."}], "play": {"en": "Sculpt challenge: the tutor names a real coast feature (a sheltered cove, a headland, a road shelf, a stream valley). I sculpt it out at sea in 4 minutes and describe it from 100 m; the tutor scores it out of 5.", "uk": "Виклик ліплення: тьютор називає справжню форму берега (захищена бухта, мис, полиця під дорогу, долина струмка). Я ліплю її в морі за 4 хвилини й описую з висоти 100 м, а тьютор оцінює з 5."}, "video": {"search": "unreal engine 5 landscape erosion hydro noise tools"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Вивітрювання й перевірка з повітря (Day 27, lesson 4 of 4). Today's build: Ландшафт острова, виліплений за мапою: рівні майданчики для обох районів, дві полиці під дороги, долини, хребти й пляжі, з вивітрюванням і перевірені з повітря.\nWhat I already know: День 26: L_Island з відкаліброваним ландшафтом, CAM_Survey і terrain_notes.md; День 22: map_notes.md (кути районів, верхівка, стартовий майданчик і дороги); День 23: обидва плани ділянок (де має бути рівна земля).\nEarlier today I already did: lesson 1 (Основи ліплення й геодезичні віхи); lesson 2 (Рівні майданчики й полиці для районів і доріг); lesson 3 (Форми рельєфу: долини, хребти й пляжі). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Легко вивітрювати схили великими пензлями. Noise розбиває гладкі форми, Erosion осідає круті схили, ніби ґрунт сповз, а Hydro прорізає маленькі дощові русла.\n2. Прибирати інструментом Smooth вади після імпорту: сходинки, шпилі та ями.\n3. Перевіряти землю з висоти 50 м і 300 м, а також за мапою згори (вид Top).\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: 2 lines on why today matters and where it comes back, in plain words (from this: Карта висот дає великі пагорби, але тільки ти знаєш, де стоїть містечко і де дорога йде вгору. Будинкам потрібна рівна земля, дорогам — полиці з пологим підйомом, а воді — долини, що йдуть униз. Студії спершу ліплять під ці потреби, а вже потім — для краси. It comes back: Завтра на цю землю ляже узбережжя й автоматичний матеріал. Полиці під дороги в День 31 понесуть дороги, а на рівних майданчиках районів з Дня 41 стануть будівлі району 1, з Дня 48 — району 2.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-27-sculpting-to-the-map exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (рівний майданчик району 1 і перша полиця під дорогу (разом з уроками)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Вибери Noise, Brush Size 6000, Tool Strength 0.1 і зроби один мазок поперек довгого гладкого схилу. З'являються дрібні горбики, а не великі грудки.\n   2. Вибери Erosion і пройдися один раз по крутому схилу, потім вибери Hydro і пройдися один раз. Порівняй до і після з висоти 150 м. Біля підніжжя з'являються осипи, а на схилі — маленькі русла.\n   3. Пролети камерою CAM_Survey низько (Z близько 5000, тобто 50 м) уздовж узбережжя й шукай сходинки, шпилі чи ями. Кожну згладь інструментом Smooth. Має вийти: на маршруті їх не лишилося. [screenshot]\n   4. Підніми CAM_Survey на 300 м (Z 30000) і подивися на весь острів. Рівні майданчики районів, полиці під дороги й долини добре читаються.\n   5. Перемкнися на Top і Unlit, зроби скриншот і наклади його на island_map.png у Krita. Збережи як overlay.png. Віхи стоять на кутах червоних квадратів, а майданчики — всередині. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Виклик ліплення: тьютор називає справжню форму берега (захищена бухта, мис, полиця під дорогу, долина струмка). Я ліплю її в морі за 4 хвилини й описую з висоти 100 м, а тьютор оцінює з 5. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; breakdown = розбір; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; File Explorer = Провідник; vertex / edge / face = вершина / ребро / грань; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; kit / kit piece / part of one object = набір / деталь / частина; map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; district / plot / plot plan = район / ділянка / план ділянки; harbour / quay / waterfront / pier = гавань / причал / набережна / пірс; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; summit, hilltop = верхівка; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}], "handin": [{"en": "summary.md", "uk": "summary.md (звіт дня)"}, {"en": "terrain_notes.md with the district heights and ramp grades (→ Day 28)", "uk": "terrain_notes.md (висоти районів і ухили полиць) (→ День 28)"}, {"en": "overlay.png: the Top view over island_map.png (proof)", "uk": "overlay.png (вид Top поверх island_map.png) (доказ)"}], "goal": {"en": "By the end of today your landscape has flat ground for both districts, two road shelves, clear valleys and gentle beaches. It matches your map from the air.", "uk": "До кінця дня на ландшафті є рівна земля для обох районів, дві полиці під дороги, чіткі долини й пологі пляжі. З повітря він збігається з мапою."}, "uses": [{"en": "Day 26: L_Island with its calibrated landscape, CAM_Survey and terrain_notes.md", "uk": "День 26: L_Island з відкаліброваним ландшафтом, CAM_Survey і terrain_notes.md"}, {"en": "Day 22: map_notes.md (district corners, the summit, the launch pad and the roads)", "uk": "День 22: map_notes.md (кути районів, верхівка, стартовий майданчик і дороги)"}, {"en": "Day 23: both plot plans (where the flat ground must be)", "uk": "День 23: обидва плани ділянок (де має бути рівна земля)"}], "quiz": [{"q": {"en": "Your road shelf climbs 30 m over 200 m. Is that a good road grade?", "uk": "Твоя полиця під дорогу піднімається на 30 м на відстані 200 м. Чи добрий це ухил для дороги?"}, "options": [{"en": "Yes: 15 % is gentle.", "uk": "Так: 15 % — це полого."}, {"en": "No: it's 15 %, too steep; move the top point further away so it stays under 10 %.", "uk": "Ні: це 15 %, надто круто. Постав верхню точку далі, щоб ухил був менше 10 %."}, {"en": "Yes: any grade works in Unreal.", "uk": "Так: в Unreal підходить будь-який ухил."}], "answer": 1, "explain": {"en": "30 ÷ 200 x 100 = 15 %. A road over 10 % is hard work for a van and looks wrong to the eye.", "uk": "30 ÷ 200 × 100 = 15 %. Дорога з ухилом понад 10 % важка для фургона й виглядає неправильно."}}, {"q": {"en": "You start a Flatten stroke on a hillside 12 m up, meaning to level the harbour at 2.5 m. What happens?", "uk": "Ти починаєш мазок Flatten на схилі на висоті 12 м, хоча хочеш вирівняти гавань на 2,5 м. Що станеться?"}, "options": [{"en": "The harbour levels at 2.5 m anyway.", "uk": "Гавань однаково вирівняється на 2,5 м."}, {"en": "Nothing happens.", "uk": "Нічого не станеться."}, {"en": "The whole island gets lower.", "uk": "Увесь острів стане нижчим."}, {"en": "Flatten levels to the height where the stroke starts, so you get a shelf at 12 m; start on ground at 2.5 m or type a Flatten Target.", "uk": "Flatten вирівнює до висоти, з якої починається мазок, тож вийде полиця на 12 м. Почни на землі на висоті 2,5 м або введи Flatten Target."}], "answer": 3, "explain": {"en": "Flatten copies the height under the brush when you start. A Flatten Target makes the height exact.", "uk": "Flatten бере висоту під пензлем у момент, коли ти починаєш мазок. Flatten Target робить висоту точною."}}, {"q": {"en": "What do survey poles do?", "uk": "Для чого потрібні геодезичні віхи?"}, "options": [{"en": "They mark map positions in the level, so you sculpt to the map and not by eye.", "uk": "Вони позначають позиції з мапи на рівні, щоб ліпити за мапою, а не на око."}, {"en": "They hold the landscape up.", "uk": "Вони тримають ландшафт."}, {"en": "They are gates for the drone race.", "uk": "Це ворота для перегонів дронів."}, {"en": "They light the level.", "uk": "Вони освітлюють рівень."}], "answer": 0, "explain": {"en": "Typed from map_notes.md, they put the district corners, the summit and the launch pad exactly where the map says.", "uk": "Віхи, поставлені за числами з map_notes.md, ставлять кути районів, верхівку й стартовий майданчик точно туди, де каже мапа."}}, {"q": {"en": "A long hillside looks smooth like clay from 150 m. Which tools fix it, and how hard?", "uk": "Довгий схил пагорба з висоти 150 м виглядає гладким, як глина. Які інструменти це виправлять і з якою силою?"}, "options": [{"en": "Flatten at full strength.", "uk": "Flatten на повній силі."}, {"en": "Ramp along the slope.", "uk": "Ramp уздовж схилу."}, {"en": "Noise, Erosion and Hydro, lightly, with big brushes.", "uk": "Noise, Erosion і Hydro — легко, великими пензлями."}, {"en": "Smooth at full strength.", "uk": "Smooth на повній силі."}], "answer": 2, "explain": {"en": "Real slopes carry small bumps, slumps and rain channels. Light passes add them without making a mess.", "uk": "Справжні схили мають дрібні горбики, осипи й дощові русла. Кілька легких мазків додають їх без безладу."}}, {"q": {"en": "Your beach drops 1 m in every 2 m of length. What's wrong?", "uk": "Твій пляж опускається на 1 м на кожні 2 м довжини. Що не так?"}, "options": [{"en": "Nothing: beaches can have any slope.", "uk": "Нічого: пляжі можуть мати будь-який схил."}, {"en": "It's about 27 degrees, far too steep for a beach; aim for at least 6 m of length per 1 m of drop (under 10 degrees).", "uk": "Це близько 27 градусів, надто круто для пляжу. Ціль — щонайменше 6 м довжини на 1 м спуску (менше 10 градусів)."}, {"en": "Beaches must be perfectly flat.", "uk": "Пляжі мають бути ідеально рівними."}], "answer": 1, "explain": {"en": "Waves spread sand into gentle slopes. A steep beach reads as a cliff edge painted yellow.", "uk": "Хвилі розносять пісок пологими схилами. Крутий пляж виглядає як край скелі, пофарбований у жовтий."}}], "weekInfo": {"week": 6, "title": {"en": "Terrain and water", "uk": "Рельєф і вода"}, "goal": {"en": "By Friday you have L_Island, a World Partition level with your island's terrain from a real heightmap, sculpted to your map, with rock-covered cliffs, beaches, an auto-material, the ocean, a lake and a river, seen from three locked drone cameras.", "uk": "До п'ятниці в тебе є L_Island — рівень World Partition із рельєфом острова зі справжньої карти висот, виліпленим за твоєю мапою. На ньому скелі, вкриті камінням, пляжі, автоматичний матеріал, океан, озеро й річка, і все це видно з трьох заблокованих камер дрона."}, "skills": [{"en": "Heightmap-based landscapes in Unreal Engine 5 (16-bit import, Z scale and calibration)", "uk": "Ландшафти з карти висот в Unreal Engine 5 (16-бітний імпорт, масштаб Z і калібрування)"}, {"en": "Landscape sculpting for gameplay and realism: flats, road ramps and erosion", "uk": "Ліплення ландшафту для геймплею й реалізму: рівні майданчики, полиці під дороги й ерозія"}, {"en": "Auto-landscape materials blended by slope and height", "uk": "Автоматичні матеріали ландшафту, що змішуються за схилом і висотою"}, {"en": "Unreal Water system: ocean, rivers and lakes that follow the terrain", "uk": "Система Water в Unreal: океан, річки й озера, що йдуть за рельєфом"}, {"en": "Cinematic camera set-up and shot review against reference photos", "uk": "Налаштування кінематографічних камер і перевірка кадрів за фото-референсами"}]}, "morning": {"sofar": {"en": "Your island has real ground: L_Island, a 2 km landscape from a real heightmap that matches your map's summit and coast.", "uk": "У твого острова є справжня земля: L_Island, ландшафт 2 км зі справжньої карти висот, що збігається з верхівкою й узбережжям твоєї мапи."}, "today": {"en": "You sculpt flat ground for both districts, two road shelves, clear valleys and ridges, and gentle beaches.", "uk": "Сьогодні ти ліпиш рівну землю для обох районів, дві полиці під дороги, чіткі долини й хребти та пологі пляжі."}, "cheer": {"en": "Sculpting is judged by eye, so work in small strokes, check from the air, and trust that every pass makes the island better.", "uk": "Ліплення оцінюють на око, тож працюй малими мазками й перевіряй з повітря: кожен захід робить острів кращим."}, "quote": {"text": {"en": "The mountains are calling and I must go.", "uk": "Гори кличуть, і я мушу йти."}, "author": {"en": "John Muir", "uk": "Джон Мюїр"}, "source": "https://en.wikiquote.org/wiki/John_Muir"}}, "hasAssets": false, "workPath": "Work\\Assignment\\Day-27-sculpting-to-the-map", "mapHref": "../../COURSE.html", "prevHref": "../Day-26-l-island-heightmap/START-HERE.html", "nextHref": "../Day-28-coast-cliffs-auto-material/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8 and Krita. I am a beginner on Day 27. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me and don't write code.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: Рівна земля району 2, долини, пляжі й вивітрювання — самостійно.\nIt's part of: Ландшафт острова, виліплений за мапою: рівні майданчики для обох районів, дві полиці під дороги, долини, хребти й пляжі, з вивітрюванням і перевірені з повітря (L_Island: рівний майданчик району 1 біля гавані, рівна земля району 2, дорога між ними, долини, якими течуть струмки, і пляжі в затоках.).\nWhy it matters: Карта висот дає великі пагорби, але тільки ти знаєш, де стоїть містечко і де дорога йде вгору. Будинкам потрібна рівна земля, дорогам — полиці з пологим підйомом, а воді — долини, що йдуть униз. Студії спершу ліплять під ці потреби, а вже потім — для краси. It comes back: Завтра на цю землю ляже узбережжя й автоматичний матеріал. Полиці під дороги в День 31 понесуть дороги, а на рівних майданчиках районів з Дня 41 стануть будівлі району 1, з Дня 48 — району 2.\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-27-sculpting-to-the-map (on the drive I chose on Day 0).\nWhat I already know: День 26: L_Island з відкаліброваним ландшафтом, CAM_Survey і terrain_notes.md; День 22: map_notes.md (кути районів, верхівка, стартовий майданчик і дороги); День 23: обидва плани ділянок (де має бути рівна земля); today's lessons: Основи ліплення й геодезичні віхи; Рівні майданчики й полиці для районів і доріг; Форми рельєфу: долини, хребти й пляжі; Вивітрювання й перевірка з повітря. Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- Геодезичні віхи на кутах обох районів, на верхівці й на стартовому майданчику. Віха — високий тонкий циліндр, що позначає на рівні позицію з мапи. Їх поставлено за map_notes.md і зібрано в Outliner у папку Survey.\n- Район 1 вирівняно приблизно на 2,5 м над морем на площі щонайменше 120 × 80 м за причалом. Район 2 отримує рівну землю, якої потребує його тип місцевості: тераси через 3–4 м, верх мису або дно долини.\n- Дві полиці під дороги, зроблені інструментом Ramp. Полиця — рівна смуга, врізана в схил під дорогу. Кожна має 6–8 м завширшки й ухил (крутизну) менше 10 %, тобто 10 м підйому на 100 м.\n- Долини поглиблено там, де течуть струмки, а хребти між ними загострено. Дно кожної захищеної затоки опущено до пологого схилу пляжу, менше 10 градусів.\n- Легке вивітрювання інструментами Noise, Erosion і Hydro. Згладжено місця, де після імпорту лишилися сходинки, шпилі чи ями.\n- Перевірено з висоти 50 м і 300 м, а вид Top накладено на island_map.png, і віхи стоять на кутах районів.\n\nMy checklist (the same numbers show on my course page):\n1. Спершу переконайся, що робота з сьогоднішніх уроків є в L_Island: десять геодезичних віх, рівний майданчик району 1, перша полиця під дорогу, долина й пляж. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Потім подивися згори (вид Top). Перевірка: віхи стоять на кутах червоних квадратів, на верхівці й на стартовому майданчику. (from lesson 1)\n2. Район 1: Flatten приблизно на 2,5 м над морем, щонайменше 120 × 80 м за причалом. Перевірка: куб, опущений на майданчик, показує Z близько 300, а майданчик лежить між віхами району 1. (from lesson 2)\n3. Район 2: рівна земля, якої потребує його тип місцевості (тераси, верх мису або дно долини). Перевірка: майданчики збігаються з будівлями чи полями на plot_plan_d2. (from lesson 3)\n4. Полиця під дорогу 1 інструментом Ramp: від району 1 угору пагорбом. Перевірка: ухил менше 10 %, а краї згладжено в схил. (from lesson 2)\n5. Полиця під дорогу 2 — у бік району 2. Перевірка: ухил менше 10 %, а дві полиці сходяться так, як дорога на мапі. (from lesson 2)\n6. Поглиб долини струмків від пагорбів до заток. Перевірка: кожна долина спускається аж до моря й ніде не піднімається. (from lesson 3)\n7. Загостри хребти між долинами. Перевірка: з висоти 300 м кожен хребет видно як чіткий гребінь. (from lesson 3)\n8. Пляжі в захищених затоках: схил менше 10 градусів, що тягнеться далі під воду. Перевірка: площина на Z = 0 сходиться з кожним пляжем довгою м'якою лінією. (from lesson 3)\n9. Легке вивітрювання інструментами Noise, Erosion і Hydro. Перевірка: з висоти 150 м жоден довгий схил не виглядає гладким, як глина. (from lesson 4)\n10. Пролети камерою CAM_Survey на висоті 50 м уздовж мальовничого маршруту й згладь (Smooth) кожну сходинку, шпиль чи яму. Перевірка: на маршруті їх не лишилося, а рівні майданчики обох районів мають м'які краї. (from lesson 4)\n11. Зроби вид Top поверх island_map.png (overlay.png) і оглянь острів з висоти 300 м. Запиши висоти районів і ухили полиць у terrain_notes.md. Перевірка: майданчики лежать у червоних квадратах, а узбережжя досі збігається з мапою. (from lesson 4)\n12. File > Save All, закрий L_Island і відкрий знову. Перевірка: папка Survey є в Outliner, і виліплене на місці. Якщо суші немає, вона просто вивантажена: завантаж її в World Partition Editor. (from lesson 4)\n13. Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: кожна назва зі списку є в папці, у кожної є розмір. (from day 0, lesson 1)\n\nHow to help: ask which step number I'm on, then give me only the next step: the exact clicks and what I should see. When I send a screenshot, compare it with my reference, my sizes and the spec, and name one thing to fix at a time.\nCheck every save and export by reopening it before we move on:\n- a .md or .txt: open it with Notepad; the text is there, and the name doesn't end in .md.txt\nWhen I write \"готово\", and in any case before the day ends, check with me one item at a time (yes/no): each spec point, then each file on my hand-in list, ready in my day work folder (skip summary.md: the day report writes it next):\n1. terrain_notes.md (висоти районів і ухили полиць) (→ День 28)\n2. overlay.png (вид Top поверх island_map.png) (доказ)\nFinish with a short list of anything missing, and one line on where this work comes back and what it will look like there. Then tell me the order for the end of the day: first the day report (the Copy the day report button at the bottom of my course page) into summary.md, and only then hand in all the files on the list, summary.md too.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English  /* the dial around it: a ring with the progress arc and a label running along the rim */

 s+='<circle class="face" cx="200" cy="200" r="168"/><circle class="track" cx="200" cy="200" r="176"/>';
 s+='<circle class="arc" cx="200" cy="200" r="176" stroke="url(#'+id+'g)" stroke-dasharray="'+(C*p).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 200 200)"/>';
 if(p>0){const A=-Math.PI/2+p*TAU;s+='<circle class="knob'+(p<1?' go':'')+'" cx="'+(200+176*Math.cos(A)).toFixed(1)+'" cy="'+(200+176*Math.sin(A)).toFixed(1)+'" r="7"/>'}
 if(label)s+='<text class="rimt"><textPath href="#'+id+'" startOffset="25%" text-anchor="middle">'+label+'</textPath></text>';

 if(f.s==='reviewed'){try{const z=fbSeen();if(z[D.day]!==f.at){z[D.day]=f.at;localStorage.setItem(fbSeenKey,JSON.stringify(z))}}catch(e){}

/* fix phase 1 (2026-10-22): the hand-in folder (a button when the roster has a link, else the folder path), the hand-in card,

const HIN=(D.handin||[]).map(v=>(v&&v.en)||(typeof v==='string'?v:'')).join(' ').toLowerCase(),hasClip=/\.mp4|clip/.test(HIN);

function nFiles(n){if(!n)return '';if(lang==='en')return ' · '+n+(n===1?' file':' files');const a=n%10,b=n%100;return ' · '+n+' '+(a===1&&b!==11?'файл':a>=2&&a<=4&&(b<12||b>14)?'файли':'файлів')}

function reportText(){let t=D.reportPrompt;const r=D.lessons.map((l,i)=>{const v=(st['r'+i]||'').trim();return v?'Lesson '+(i+1)+': '+v:''}).filter(Boolean);
 if(r.length)t+='\n\nMy lesson summaries, pasted from my course page:\n'+r.join('\n');
 if(st.qs1)t+='\nMy first score in the Check yourself quiz: '+st.qs1[0]+' of '+st.qs1[1]+'.';

function quiz(){if(!D.quiz||!D.quiz.length)return '';const a=st.qa||{};let ok=0;const L=u('letters');

 return '<section class="card glass quiz">'+lab(u('quiz'),'gold')+'<p class="muted" style="margin:-6px 0 14px">'+u('quizSub')+'</p>'+pips+qs+(qDone()?'<div class="score well" role="status"><span class="eyebrow">'+u('score')+'</span><span class="lcd" aria-label="'+ok+' / '+D.quiz.length+'">'+seg(ok+'/'+D.quiz.length)+'</span>'+(st.qs1?'<span class="muted">'+u('first')+': '+st.qs1[0]+'/'+st.qs1[1]+'</span>':'')+'<div class="row"><button class="btn ghost" id="retry" onclick="retry()">'+u('retry')+'</button></div></div>':'')+'</section>'}

 let shelf='';if(D.day>0){shelf='<div class="shelf" aria-hidden="true">';let g='';for(let d=0;d<D.day;d++){let p=0;try{p=(JSON.parse(localStorage.getItem('devteam:'+D.learner+':'+d))||{}).pct||0}catch(e){}g+='<i class="'+(p>=1?'d':'')+(d>0&&d%5===0?' bs':'')+'"></i>';if(d%5===0||d===D.day-1){shelf+='<span class="wkg">'+g+'</span>';g=''}}shelf+='</div>'}

 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);

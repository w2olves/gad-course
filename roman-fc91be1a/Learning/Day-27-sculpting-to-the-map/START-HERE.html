<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 27</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

<script id="data" type="application/json">{"learner": "ib-roman-fc91be1a", "learnerName": {"en": "Roman", "uk": "Роман"}, "day": 27, "week": 6, "total": 60, "title": {"en": "Sculpting to your map: flats, road shelves, valleys and beaches", "uk": "Ліпимо за мапою: рівні майданчики, полиці під дороги, долини й пляжі"}, "theme": {"en": "Week 6: Terrain and water", "uk": "Тиждень 6: Рельєф і вода"}, "build": {"item": {"en": "Your island's landscape sculpted to the map: flats for both districts, two road shelves, valleys, ridges and beaches, weathered and checked from the air", "uk": "Ландшафт острова, виліплений за мапою: рівні майданчики для обох районів, дві полиці під дороги, долини, хребти й пляжі, з вивітрюванням і перевірені з повітря"}, "why": {"en": "A heightmap gives the big hills, but only you know where the town stands and where the road climbs. Buildings need flat ground, roads need shelves with a gentle climb, and water needs valleys that run downhill. Studios sculpt for these needs first and for beauty second.", "uk": "Карта висот дає великі пагорби, але тільки ти знаєш, де стоїть містечко і де дорога йде вгору. Будинкам потрібна рівна земля, дорогам — полиці з пологим підйомом, а воді — долини, що йдуть униз. Студії спершу ліплять під ці потреби, а вже потім — для краси."}, "next": {"en": "Tomorrow the coast and the auto-material go onto this ground. Your road shelves carry the roads on Day 31, and the district flats hold district 1's buildings from Day 41 and district 2's from Day 48.", "uk": "Завтра на цю землю ляже узбережжя й автоматичний матеріал. Полиці під дороги в День 31 понесуть дороги, а на рівних майданчиках районів з Дня 41 стануть будівлі району 1, з Дня 48 — району 2."}, "where": {"en": "L_Island: district 1's flat by the harbour and district 2's flat ground, the road between them, the valleys your streams follow and the beaches in your bays.", "uk": "L_Island: рівний майданчик району 1 біля гавані, рівна земля району 2, дорога між ними, долини, якими течуть струмки, і пляжі в затоках."}, "spec": [{"en": "Survey poles at the corners of both districts, the summit and the launch pad: tall thin cylinders that mark map positions in the level. They are placed from map_notes.md and kept in an Outliner folder named Survey.", "uk": "Геодезичні віхи на кутах обох районів, на верхівці й на стартовому майданчику. Віха — високий тонкий циліндр, що позначає на рівні позицію з мапи. Їх поставлено за map_notes.md і зібрано в Outliner у папку Survey."}, {"en": "District 1 flattened about 2.5 m above sea level, over at least 120 x 80 m behind the quay. District 2 gets the flat ground its kind of place needs: terraces 3 to 4 m apart, a headland top, or a valley floor.", "uk": "Район 1 вирівняно приблизно на 2,5 м над морем на площі щонайменше 120 × 80 м за причалом. Район 2 отримує рівну землю, якої потребує його тип місцевості: тераси через 3–4 м, верх мису або дно долини."}, {"en": "Two road shelves made with the Ramp tool: flat strips cut into a slope for a road. Each is 6 to 8 m wide, with a grade (steepness) under 10 %, which is 10 m of climb per 100 m.", "uk": "Дві полиці під дороги, зроблені інструментом Ramp. Полиця — рівна смуга, врізана в схил під дорогу. Кожна має 6–8 м завширшки й ухил (крутизну) менше 10 %, тобто 10 м підйому на 100 м."}, {"en": "Valleys deepened where your streams run, and ridges sharpened between them. The floor of each sheltered bay is lowered to a gentle beach slope under 10 degrees.", "uk": "Долини поглиблено там, де течуть струмки, а хребти між ними загострено. Дно кожної захищеної затоки опущено до пологого схилу пляжу, менше 10 градусів."}, {"en": "Weathered lightly with Noise, Erosion and Hydro. Smoothed where the import left stair-like steps, spikes or holes.", "uk": "Легке вивітрювання інструментами Noise, Erosion і Hydro. Згладжено місця, де після імпорту лишилися сходинки, шпилі чи ями."}, {"en": "Checked from 50 m and 300 m, and a Top view laid over island_map.png with the poles on the district corners.", "uk": "Перевірено з висоти 50 м і 300 м, а вид Top накладено на island_map.png, і віхи стоять на кутах районів."}], "piece1": "district 1's flat and the first road shelf (shared with the lessons)", "piece2": {"en": "District 2's flat, the valleys, the beaches and the weathering, on your own", "uk": "Рівна земля району 2, долини, пляжі й вивітрювання — самостійно"}, "steps": [{"text": {"en": "Check: today's lesson work is in L_Island (the ten survey poles, district 1's flat, the first road shelf, a valley and a beach). Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it. Then look from a Top view. Check: the poles sit on the red boxes' corners, the summit and the launch pad.", "uk": "Спершу переконайся, що робота з сьогоднішніх уроків є в L_Island: десять геодезичних віх, рівний майданчик району 1, перша полиця під дорогу, долина й пляж. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Потім подивися згори (вид Top). Перевірка: віхи стоять на кутах червоних квадратів, на верхівці й на стартовому майданчику."}, "lesson": 1}, {"text": {"en": "District 1: Flatten about 2.5 m above sea, at least 120 x 80 m behind the quay. Check: a cube dropped on the flat reads Z about 300, and the flat sits between the district 1 poles.", "uk": "Район 1: Flatten приблизно на 2,5 м над морем, щонайменше 120 × 80 м за причалом. Перевірка: куб, опущений на майданчик, показує Z близько 300, а майданчик лежить між віхами району 1."}, "lesson": 2}, {"text": {"en": "District 2: the flat ground its kind of place needs (terraces, a headland top or a valley floor). Check: the flats match the buildings or fields on plot_plan_d2.", "uk": "Район 2: рівна земля, якої потребує його тип місцевості (тераси, верх мису або дно долини). Перевірка: майданчики збігаються з будівлями чи полями на plot_plan_d2."}, "lesson": 3}, {"text": {"en": "Road shelf 1 with Ramp, from district 1 up the hill. Check: its grade is under 10 %, and its edges are smoothed into the slope.", "uk": "Полиця під дорогу 1 інструментом Ramp: від району 1 угору пагорбом. Перевірка: ухил менше 10 %, а краї згладжено в схил."}, "lesson": 2}, {"text": {"en": "Road shelf 2 towards district 2. Check: its grade is under 10 %, and the two shelves join the way your map's road does.", "uk": "Полиця під дорогу 2 — у бік району 2. Перевірка: ухил менше 10 %, а дві полиці сходяться так, як дорога на мапі."}, "lesson": 2}, {"text": {"en": "Deepen the stream valleys from the hills down to your bays. Check: each valley drops all the way to the sea and never climbs.", "uk": "Поглиб долини струмків від пагорбів до заток. Перевірка: кожна долина спускається аж до моря й ніде не піднімається."}, "lesson": 3}, {"text": {"en": "Sharpen the ridges between the valleys. Check: from 300 m each ridge reads as a clear crest.", "uk": "Загостри хребти між долинами. Перевірка: з висоти 300 м кожен хребет видно як чіткий гребінь."}, "lesson": 3}, {"text": {"en": "Beaches in your sheltered bays: under 10 degrees, running on under the water. Check: the Z = 0 plane meets each beach in a long, soft line.", "uk": "Пляжі в захищених затоках: схил менше 10 градусів, що тягнеться далі під воду. Перевірка: площина на Z = 0 сходиться з кожним пляжем довгою м'якою лінією."}, "lesson": 3}, {"text": {"en": "Weather with Noise, Erosion and Hydro, lightly. Check: from 150 m no long slope looks smooth like clay.", "uk": "Легке вивітрювання інструментами Noise, Erosion і Hydro. Перевірка: з висоти 150 м жоден довгий схил не виглядає гладким, як глина."}, "lesson": 4}, {"text": {"en": "Fly CAM_Survey at 50 m along your scenic route and Smooth every stair-like step, spike or hole. Check: none left along the route, and both districts' flats have soft edges.", "uk": "Пролети камерою CAM_Survey на висоті 50 м уздовж мальовничого маршруту й згладь (Smooth) кожну сходинку, шпиль чи яму. Перевірка: на маршруті їх не лишилося, а рівні майданчики обох районів мають м'які краї."}, "lesson": 4}, {"text": {"en": "Take a Top view over island_map.png (overlay.png) and check the island from 300 m. Write the district heights and ramp grades in terrain_notes.md. Check: the flats sit inside the red boxes, and the coast still matches the map.", "uk": "Зроби вид Top поверх island_map.png (overlay.png) і оглянь острів з висоти 300 м. Запиши висоти районів і ухили полиць у terrain_notes.md. Перевірка: майданчики лежать у червоних квадратах, а узбережжя досі збігається з мапою."}, "lesson": 4}, {"text": {"en": "File > Save All, close L_Island and open it again. Check: the Survey folder is in the Outliner and your sculpting is still there; land missing means it is unloaded, so load it in the World Partition Editor.", "uk": "File > Save All, закрий L_Island і відкрий знову. Перевірка: папка Survey є в Outliner, і виліплене на місці. Якщо суші немає, вона просто вивантажена: завантаж її в World Partition Editor."}, "lesson": 4}, {"text": {"en": "Report and hand-in: click Copy the day report at the bottom of the page, paste it into a new chat and answer. Open summary.md in Notepad, press Ctrl+End, paste the answer and press Ctrl+S. Then drag the files on the Hand in list into your hand-in folder. Check: every name shows in the folder, each with a size.", "uk": "Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: кожна назва зі списку є в папці, у кожної є розмір."}, "lesson": "D0.1"}]}, "lessons": [{"title": {"en": "Sculpting basics and survey poles", "uk": "Основи ліплення й геодезичні віхи"}, "minutes": 40, "goals": [{"en": "Explain sculpting: changing the landscape's height with brushes, like pushing clay, in Landscape mode's Sculpt tab.", "uk": "Пояснювати, що таке ліплення: зміна висоти ландшафту пензлями, ніби мнеш глину, на вкладці Sculpt у Landscape mode."}, {"en": "Use Sculpt and Smooth: left-click raises, Shift+left-click lowers. Brush Size sets how wide, Tool Strength how strong, and Brush Falloff how soft the edge is.", "uk": "Користуватися Sculpt і Smooth: клацання лівою кнопкою піднімає, Shift+клацання лівою — опускає. Brush Size задає ширину, Tool Strength — силу, а Brush Falloff — м'якість краю."}, {"en": "Mark positions from your map with survey poles, so you sculpt to the map and not by eye.", "uk": "Позначати позиції з мапи геодезичними віхами, щоб ліпити за мапою, а не на око."}], "doalong": [{"en": "Place Actors > Shapes > Cylinder. In Details set Scale 1, 1, 30 (1 m wide, 30 m tall), and Location X and Y from map_notes.md times 100. Press End to drop it onto the ground and rename it Pole_D1_NW. You should see a tall white pole on district 1's north-west corner.", "uk": "Place Actors > Shapes > Cylinder. У Details постав Scale 1, 1, 30 (1 м завширшки, 30 м заввишки), а Location X і Y — з map_notes.md, помножені на 100. Опусти на землю клавішею End і перейменуй на Pole_D1_NW. Має вийти висока біла віха на північно-західному куті району 1."}, {"en": "Make the other nine poles with Alt+drag copies, typing each position: both districts' corners, the summit and the launch pad. Select all ten, right-click > Move To > Create New Folder, and name it Survey. You should see ten poles in one Outliner folder.", "uk": "Зроби ще дев'ять віх копіями (Alt+перетягування), вводячи позицію кожної: кути обох районів, верхівка й стартовий майданчик. Виділи всі десять, клацни правою кнопкою > Move To > Create New Folder і назви папку Survey. Має вийти десять віх в одній папці Outliner."}, {"en": "Press Shift+2 for Landscape mode and open the Sculpt tab. Fly out to sea, far from your island. Set Brush Size 2000 and Tool Strength 0.3; the circle on the ground shows the brush's size. Hold the left mouse button for a second. You should see a soft hill rise; Shift+left-click lowers it.", "uk": "Натисни Shift+2 (Landscape mode) і відкрий вкладку Sculpt. Відлети в море, подалі від острова. Постав Brush Size 2000 і Tool Strength 0.3; коло на землі показує розмір пензля. Утримуй ліву кнопку миші секунду. Здіймається м'який пагорб; Shift+клацання лівою його опускає."}, {"en": "Choose Smooth and brush over the hill. You should see its top and edges soften. Ctrl+Z undoes anything you don't like; it may need several presses.", "uk": "Вибери Smooth і пройдися пензлем по пагорбу. Його верх і краї м'якшають. Ctrl+Z скасовує те, що не подобається; іноді треба натиснути кілька разів."}, {"en": "Change Brush Falloff to 0.1, sculpt once, then to 0.9 and sculpt again. You should see a hard-edged bump and a very soft one.", "uk": "Зміни Brush Falloff на 0.1 і виліпи один раз, потім на 0.9 і виліпи ще раз. Має вийти горбок із різким краєм і дуже м'який горбок."}], "play": {"en": "Brush guess: the tutor names a shape (a soft dune, a sharp ridge, a wide flat mound). I say the tool, size, strength and falloff before I try it, then sculpt it out at sea in 3 minutes.", "uk": "Вгадай пензель: тьютор називає форму (м'яка дюна, гострий хребет, широкий пологий горб). Я називаю інструмент, розмір, силу й м'якість краю ще до спроби, а потім ліплю цю форму в морі за 3 хвилини."}, "video": {"url": "https://www.youtube.com/watch?v=cohlWZxJ8_U", "title": "Natural Aesthetics in UE5 - Part 1.2 - Landscape Sculpt Tool", "channel": "Generally Playful", "length": "23:40", "search": "unreal engine 5 landscape sculpt erosion hydro"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Основи ліплення й геодезичні віхи (Day 27, lesson 1 of 4). Today's build: Ландшафт острова, виліплений за мапою: рівні майданчики для обох районів, дві полиці під дороги, долини, хребти й пляжі, з вивітрюванням і перевірені з повітря.\nWhat I already know: День 26: L_Island з відкаліброваним ландшафтом, CAM_Survey і terrain_notes.md; День 22: map_notes.md (кути районів, верхівка, стартовий майданчик і дороги); День 23: обидва плани ділянок (де має бути рівна земля).\n\nBy the end of this lesson I can:\n1. Пояснювати, що таке ліплення: зміна висоти ландшафту пензлями, ніби мнеш глину, на вкладці Sculpt у Landscape mode.\n2. Користуватися Sculpt і Smooth: клацання лівою кнопкою піднімає, Shift+клацання лівою — опускає. Brush Size задає ширину, Tool Strength — силу, а Brush Falloff — м'якість краю.\n3. Позначати позиції з мапи геодезичними віхами, щоб ліпити за мапою, а не на око.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: У твого острова є справжня земля: L_Island, ландшафт 2 км зі справжньої карти висот, що збігається з верхівкою й узбережжям твоєї мапи. Today: Сьогодні ти ліпиш рівну землю для обох районів, дві полиці під дороги, чіткі долини й хребти та пологі пляжі. One encouraging line: Ліплення оцінюють на око, тож працюй малими мазками й перевіряй з повітря: кожен захід робить острів кращим.); 2 lines on why today matters and where it comes back, in plain words (from this: Карта висот дає великі пагорби, але тільки ти знаєш, де стоїть містечко і де дорога йде вгору. Будинкам потрібна рівна земля, дорогам — полиці з пологим підйомом, а воді — долини, що йдуть униз. Студії спершу ліплять під ці потреби, а вже потім — для краси. It comes back: Завтра на цю землю ляже узбережжя й автоматичний матеріал. Полиці під дороги в День 31 понесуть дороги, а на рівних майданчиках районів з Дня 41 стануть будівлі району 1, з Дня 48 — району 2.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-27-sculpting-to-the-map exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (рівний майданчик району 1 і перша полиця під дорогу (разом з уроками)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Place Actors > Shapes > Cylinder. У Details постав Scale 1, 1, 30 (1 м завширшки, 30 м заввишки), а Location X і Y — з map_notes.md, помножені на 100. Опусти на землю клавішею End і перейменуй на Pole_D1_NW. Має вийти висока біла віха на північно-західному куті району 1.\n   2. Зроби ще дев'ять віх копіями (Alt+перетягування), вводячи позицію кожної: кути обох районів, верхівка й стартовий майданчик. Виділи всі десять, клацни правою кнопкою > Move To > Create New Folder і назви папку Survey. Має вийти десять віх в одній папці Outliner.\n   3. Натисни Shift+2 (Landscape mode) і відкрий вкладку Sculpt. Відлети в море, подалі від острова. Постав Brush Size 2000 і Tool Strength 0.3; коло на землі показує розмір пензля. Утримуй ліву кнопку миші секунду. Здіймається м'який пагорб; Shift+клацання лівою його опускає. [screenshot]\n   4. Вибери Smooth і пройдися пензлем по пагорбу. Його верх і краї м'якшають. Ctrl+Z скасовує те, що не подобається; іноді треба натиснути кілька разів.\n   5. Зміни Brush Falloff на 0.1 і виліпи один раз, потім на 0.9 і виліпи ще раз. Має вийти горбок із різким краєм і дуже м'який горбок. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Вгадай пензель: тьютор називає форму (м'яка дюна, гострий хребет, широкий пологий горб). Я називаю інструмент, розмір, силу й м'якість краю ще до спроби, а потім ліплю цю форму в морі за 3 хвилини. Otherwise skip it.\n6. Review: ask me these questions from earlier days, one at a time, and correct me kindly: Day 24: in what order do you look for a source for each need, and why does your own kit come first? | Day 22: why do roads zigzag where contour lines bunch together?\n7. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n8. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\nIf I want to go deeper, recommend this free video: \"Natural Aesthetics in UE5 - Part 1.2 - Landscape Sculpt Tool\" by Generally Playful: https://www.youtube.com/watch?v=cohlWZxJ8_U\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; review (by tutor or art director) = огляд; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / , якою проїде фургон, — менше 10 %."}], "doalong": [{"en": "Fly to district 1 between its poles. Choose Flatten, tick Flatten Target and type 250: Unreal counts in centimetres, so that is 2.5 m above sea. Set Brush Size 3000 and Tool Strength 0.5, and level at least 120 x 80 m behind the quay. You should see flat ground between the poles, just above the sea.", "uk": "Перелети в район 1, між його віхи. Вибери Flatten, увімкни прапорець Flatten Target і введи 250: Unreal рахує в сантиметрах, тож це 2,5 м над морем. Постав Brush Size 3000 і Tool Strength 0.5 і вирівняй щонайменше 120 × 80 м за причалом. Між віхами з'являється рівна земля трохи вище моря."}, {"en": "Drop a cube on the flat (End) and read its Z. You should see about 300: 250 cm of ground plus the cube's 50 cm.", "uk": "Опусти на майданчик куб (End) і прочитай його Z. Має бути близько 300: 250 см землі плюс 50 см куба."}, {"en": "Choose Ramp. Left-click on the flat where the road starts, then about 200 m up the hill where your map's road goes; if no marker appears, hold Ctrl while you click. Set Ramp Width to 700 (7 m) and click Add Ramp. You should see a straight shelf cut into the slope.", "uk": "Вибери Ramp. Клацни лівою кнопкою на майданчику, де починається дорога, потім приблизно за 200 м угору пагорбом, куди йде дорога на мапі. Якщо позначка не з'являється, утримуй Ctrl під час клацання. Постав Ramp Width 700 (7 м) і клацни Add Ramp. У схил врізається пряма полиця."}, {"en": "Drop a cube at each end of the shelf and read both Location Z values: their difference ÷ 100 is the climb in metres. In a Top view, middle-mouse-drag from cube to cube to read the length. Grade = climb ÷ length x 100. You should get under 10 %; if not, Reset and move the top point further.", "uk": "Опусти куб на кожен кінець полиці й прочитай обидва Location Z: їхня різниця ÷ 100 — це підйом у метрах. Перемкнися на вид Top і протягни середньою кнопкою миші від куба до куба, щоб прочитати довжину. Ухил = підйом ÷ довжина × 100.

<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 53</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

n": "The road between the districts as a landscape spline, every leg under 10 % (one short piece up to 12 %). Both junctions are blended by a kerb, a decal or a verge.", "uk": "Дорога між районами як сплайн ландшафту: ухил кожного відрізка менший за 10 % (один короткий шматок — до 12 %). Обидва перехрестя злиті бордюром, декаллю або узбіччям."}, {"en": "District 2's edges blended 30 to 50 m outwards, as on Day 47, and biome seams mixed in patches.", "uk": "Краї району 2 злиті на 30–50 м назовні, як у День 47, а біоми на стиках перемішані плямами."}, {"en": "island_light_recipe.md tested from C4, D2_C4 and CAM_Island_High. The sun is 25 to 35° high and from the side, and the review lock and flight range are written down.", "uk": "island_light_recipe.md перевірено з камер C4, D2_C4 і CAM_Island_High. Сонце стоїть на висоті 25–35° і світить збоку, а зафіксовану експозицію для огляду й діапазон для польоту записано."}, {"en": "RT_Scenic: a spline from the launch point, round the coast and through both districts to a vista. It is 1.8 to 2.5 km long, 5 to 20 m high in the districts and 30 to 80 m elsewhere.", "uk": "RT_Scenic — сплайн від точки старту, навколо узбережжя й через обидва райони до панорами. Довжина — 1,8–2,5 км, висота — 5–20 м у районах і 30–80 м деінде."}, {"en": "d2_notes.md gets two short sections: Road (the steepest grade) and Route (length and three landmarks).", "uk": "У d2_notes.md з'являються два короткі розділи: Road (найкрутіший ухил) і Route (довжина й три орієнтири)."}, {"en": "Gold (optional): measure every leg of the road, not just the steepest.", "uk": "Золото (за бажанням): виміряй кожен відрізок дороги, а не лише найкрутіший."}], "piece1": "the road's grades and the first junction", "piece2": {"en": "The edges, the light test and the scenic route, on your own", "uk": "Краї, перевірка світла й мальовничий маршрут — самостійно"}, "steps": [{"text": {"en": "Check: the files from today's lessons are in the day work folder (d2_notes.md, island_light_recipe.md; in Unreal: CAM_Island_High, RT_Scenic). Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it.", "uk": "Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: d2_notes.md, island_light_recipe.md, а в Unreal — CAM_Island_High, RT_Scenic. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде."}, "lesson": 1}, {"text": {"en": "Fix the steepest leg if it is over 10 %: move points or add a hairpin, then measure again with the two cubes. Write its grade under Road in d2_notes.md. Check: it is under 10 %, or under 12 % for one short piece.", "uk": "Якщо найкрутіший відрізок має ухил понад 10 %, виправ його: пересунь точки або додай серпантинний поворот, потім знову виміряй двома кубами. Запиши його ухил під заголовком Road у d2_notes.md. Перевірка: ухил менший за 10 % або, для одного короткого шматка, за 12 %."}, "lesson": 1}, {"text": {"en": "Blend both junctions with a kerb piece, a decal or a verge. Dress the roadside with verges, a ditch on the uphill side and a few SM_Bollard on the outside of bends. Check: flying at 2 m, neither junction shows a step or a seam.", "uk": "Злий обидва перехрестя бордюром, декаллю або узбіччям. Облаштуй узбіччя: трава, канава з боку схилу вгору й кілька SM_Bollard на зовнішньому боці поворотів. Перевірка: на висоті 2 м на жодному перехресті не видно ні сходинки, ні шва."}, "lesson": 1}, {"text": {"en": "Edges: reshape KO_District2 to hug the gardens and yards, as in lesson 3, and Generate nearby PCG Volumes. Run walls and paths to a natural stop. Older Unreal (4.27): paint up to the edge with the Foliage tool. Check: from 120 m up you can't see where either district ends.", "uk": "Краї: зміни форму KO_District2, щоб контур облягав сади й подвір'я, як в уроці 3, і клацни Generate на PCG Volume поруч. Доведи мури й стежки до природного кінця. Старіший Unreal (4.27): домалюй рослини до краю інструментом Foliage. Перевірка: з висоти 120 м не видно, де закінчується котрийсь район."}, "lesson": 3}, {"text": {"en": "Seams: paint biome plants a little inside district 2's edge and district plants a little outside, in patches. Move the road's keep-out onto the final road and Generate. Older Unreal (4.27): paint the seam with the Foliage tool. Check: flying the seam at 30 m, you find no straight edge and no plant on the road.", "uk": "Стики: намалюй рослини біому трохи всередині краю району 2, а рослини району — трохи назовні, плямами. Перенеси зону-виняток дороги на остаточну дорогу й клацни Generate. Старіший Unreal (4.27): намалюй стик інструментом Foliage. Перевірка: пролітаючи вздовж стику на 30 м, ти не знаходиш ні прямого краю, ні рослин на дорозі."}, "lesson": 3}, {"text": {"en": "Compare the sun, Sky Light and fog with island_light_recipe.md, as in lesson 2, and test with a HighResShot from C4, D2_C4 and CAM_Island_High. Older Unreal (4.27) or weak PC: Lumen off or static light is fine; judge at Medium. See Weak PC in ACCOUNTS-AND-INSTALLS.html. Check: no burnt-out sky, and the far coast keeps its outline.", "uk": "Порівняй сонце, Sky Light і туман з island_light_recipe.md, як в уроці 2, і перевір кадрами HighResShot з камер C4, D2_C4 і CAM_Island_High. Старіший Unreal (4.27) або слабкий ПК: можна вимкнути Lumen або взяти статичне світло; оцінюй на Medium; див. розділ «Слабкий ПК» на сторінці ACCOUNTS-AND-INSTALLS.html. Перевірка: небо не пересвічене, а далекий берег зберігає обриси."}, "lesson": 2}, {"text": {"en": "Try both exposure set-ups from the recipe: the review lock, then the flight range while you fly from a dark wood over the sea. Check: the lock gives the same brightness twice, and the range adjusts slowly.", "uk": "Спробуй обидві настройки експозиції з рецепту: спершу зафіксовану для огляду, потім діапазон для польоту, пролітаючи з темного лісу над море. Перевірка: зафіксована експозиція двічі дає ту саму яскравість, а діапазон підлаштовується повільно."}, "lesson": 2}, {"text": {"en": "Lay RT_Scenic along your drawn route at the right heights, as in lesson 4. Check: measured on island_map.png, the route is 1.8 to 2.5 km long.", "uk": "Проклади RT_Scenic уздовж намальованого маршруту на потрібних висотах, як в уроці 4. Перевірка: на island_map.png маршрут має довжину 1,8–2,5 км."}, "lesson": 4}, {"text": {"en": "Slide LaneGauge along the narrowest parts of RT_Scenic, then write the route's length and three landmarks under Route in d2_notes.md. Check: the cube touches nothing, and three landmarks are named.", "uk": "Проведи LaneGauge уздовж найвужчих місць RT_Scenic, потім запиши довжину маршруту й три орієнтири під заголовком Route у d2_notes.md. Перевірка: куб нічого не торкається, і три орієнтири названо."}, "lesson": 4}, {"text": {"en": "Proof picture: place a camera about 120 m above the road between the districts. Press G, take HighResShot 1920x1080 and rename it join_120m.png. Then choose File > Save All. Check: the level tab shows no star (*), and the picture shows both districts with no hard edge.", "uk": "Картинка-доказ: постав камеру приблизно на 120 м над дорогою між районами. Натисни G, зроби HighResShot 1920x1080 і перейменуй файл на join_120m.png. Потім вибери File > Save All. Перевірка: на вкладці рівня немає зірочки (*), а на картинці обидва райони без різкого краю."}, "lesson": 3}, {"text": {"en": "Report and hand-in: click Copy the day report at the bottom of the page, paste it into a new chat and answer. Open summary.md in Notepad, press Ctrl+End, paste the answer and press Ctrl+S. Then drag the files on the Hand in list into your hand-in folder. Check: every name shows in the folder, each with a size.", "uk": "Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: кожна назва зі списку є в папці, у кожної є розмір."}, "lesson": 4}]}, "lessons": [{"title": {"en": "The road between the districts", "uk": "Дорога між районами"}, "minutes": 40, "goals": [{"en": "Explain grade: the rise divided by the length. A 10 % grade climbs 10 m every 100 m; island roads stay under 10 %.", "uk": "Пояснювати, що таке ухил: підйом, поділений на довжину. Ухил 10 % — це 10 м підйому на кожні 100 м; дороги острова тримаються нижче 10 %."}, {"en": "Measure a grade with two cubes for the rise and the Top-view ruler for the length.", "uk": "Вимірювати ухил: підйом — двома кубами, довжину — лінійкою на виді Top."}, {"en": "Explain a hairpin: the tight turn of a road that zigzags up a slope, kept flatter and wider than the legs.", "uk": "Пояснювати, що таке серпантинний поворот: тісний поворот дороги, що зигзагом піднімається схилом. Його роблять пологішим і ширшим за відрізки."}, {"en": "Blend a junction: hide the change of surface with a kerb, a decal or a verge.", "uk": "Зливати перехрестя: ховати зміну покриття бордюром, декаллю або узбіччям."}], "doalong": [{"en": "Find the steepest climb on the road between the districts. Use Day 31's two-cube method: drop a small cube at its bottom and one at its top (Place Actors > Shapes > Cube, then End). You see two cubes on the slope.", "uk": "Знайди найкрутіший підйом на дорозі між районами. Застосуй метод двох кубів із Дня 31: постав малий куб унизу підйому й ще один угорі (Place Actors > Shapes > Cube, потім End). Має вийти: два куби на схилі."}, {"en": "Click each cube and read its Location Z in Details. The difference divided by 100 is the rise in metres. You see the rise written in d2_notes.md, under Road.", "uk": "Клацни кожен куб і прочитай його Location Z у Details. Різниця, поділена на 100, — це висота підйому в метрах. Запиши підйом у d2_notes.md під заголовком Road."}, {"en": "Switch the viewport to Top (the Perspective menu at the top left > Top). Hold the middle mouse button and drag from one cube to the other. You see the length along the ground in metres; write it beside the rise.", "uk": "Перемкни в'юпорт на вид Top (меню Perspective угорі ліворуч > Top). Затисни середню кнопку миші й протягни від одного куба до іншого. На екрані з'явиться довжина вздовж землі в метрах. Запиши її поруч із висотою."}, {"en": "Work out the grade: rise divided by length, times 100. Over 10 %? In Landscape > Manage > Splines, raise or lower a point and measure again. You see a grade under 10 % in d2_notes.md.", "uk": "Порахуй ухил: висоту підйому поділи на довжину й помнож на 100. Більше за 10 %? У Landscape > Manage > Splines підніми чи опусти точку й виміряй знову. Має вийти: у d2_notes.md ухил менший за 10 %."}, {"en": "Fly to junction 1 at 2 m and place a kerb piece or your dirt-edge decal over the seam. You should see the road and the street read as one surface.", "uk": "Підлети до перехрестя 1 на висоті 2 м і постав на шов бордюр або свою декаль ґрунтового краю. Має вийти: дорога й вулиця виглядають однією поверхнею."}], "play": {"en": "Road inspector: I describe my road at 10 m; the tutor flags any leg over 10 %, any lump at a hairpin and any verge that drops away like a cliff.", "uk": "Дорожній інспектор: я описую свою дорогу з 10 м. Тьютор позначає кожен відрізок з ухилом понад 10 %, кожен горб на серпантинному повороті й кожне узбіччя, що обривається, як скеля."}, "video": {"url": "https://www.youtube.com/watch?v=eO2HUsC7dHY", "title": "How to Make Roads with Splines in Unreal Engine 5", "channel": "Gorka Games", "length": "11:25", "search": "unreal engine 5 roads with landscape splines"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Дорога між районами (Day 53, lesson 1 of 4). Today's build: Готова дорога між районами, злиті краї й стики біомів району 2, island_light_recipe.md, перевірений на всьому острові, і RT_Scenic через обидва райони.\nWhat I already know: День 31: твої дороги як сплайни ландшафту; День 31: метод двох кубів для ухилу (сьогодні ухил записуєш під заголовком Road у d2_notes.md); День 37 і День 38: твої переходи між біомами й зони-винятки (KO_District2); День 47: краї району 1, злиті з островом; День 52: район 2 із рослинами й слідами часу; День 32: island_light_recipe.md і експозиція для огляду; День 22: island_map.png — для довжини маршруту.\n\nBy the end of this lesson I can:\n1. Пояснювати, що таке ухил: підйом, поділений на довжину. Ухил 10 % — це 10 м підйому на кожні 100 м; дороги острова тримаються нижче 10 %.\n2. Вимірювати ухил: підйом — двома кубами, довжину — лінійкою на виді Top.\n3. Пояснювати, що таке серпантинний поворот: тісний поворот дороги, що зигзагом піднімається схилом. Його роблять пологішим і ширшим за відрізки.\n4. Зливати перехрестя: ховати зміну покриття бордюром, декаллю або узбіччям.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: Обидва райони збудовано й облаштовано, у них є рослини й зношеність. Today: Сьогодні ти завершуєш дорогу між районами, вплітаєш краї району 2 у рельєф, перевіряєш одне світло на всьому острові й прокладаєш мальовничий маршрут крізь обидва райони. One encouraging line: Саме стики роблять із двох місць один острів, тож працюй повільно вздовж кожного краю й перевіряй з повітря.); 2 lines on why today matters and where it comes back, in plain words (from this: Сьогодні два твої райони стають одним островом. Їх з'єднує справжня дорога, їхні краї зливаються з землею, а все навколо освітлює одне післяобіднє світло. Студії витрачають чимало часу на стики, бо саме вони перетворюють окремі шматки на один світ. It comes back: RT_Scenic — це траса, якою полетить твій дрон у День 57 і у відео в День 58. Завдяки рецепту світла кожен фінальний кадр у День 55 виглядає як той самий золотий вечір.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-53-joins-between-districts exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (ухили дороги й перше перехрестя). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Знайди найкрутіший підйом на дорозі між районами. Застосуй метод двох кубів із Дня 31: постав малий куб унизу підйому й ще один угорі (Place Actors > Shapes > Cube, потім End). Має вийти: два куби на схилі.\n   2. Клацни кожен куб і прочитай його Location Z у Details. Різниця, поділена на 100, — це висота підйому в метрах. Запиши підйом у d2_notes.md під заголовком Road.\n   3. Перемкни в'юпорт на вид Top (меню Perspective угорі ліворуч > Top). Затисни середню кнопку миші й протягни від одного куба до іншого. На екрані з'явиться довжина вздовж землі в метрах. Запиши її поруч із висотою. [screenshot]\n   4. Порахуй ухил: висоту підйому поділи на довжину й помнож на 100. Більше за 10 %? У Landscape > Manage > Splines підніми чи опусти точку й виміряй знову. Має вийти: у d2_notes.md ухил менший за 10 %.\n   5. Підлети до перехрестя 1 на висоті 2 м і постав на шов бордюр або свою декаль ґрунтового краю. Має вийти: дорога й вулиця виглядають однією поверхнею. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Дорожній інспектор: я описую свою дорогу з 10 м. Тьютор позначає кожен відрізок з ухилом понад 10 %, кожен горб на серпантинному повороті й кожне узбіччя, що обривається, як скеля. Otherwise skip it.\n6. Review: ask me these questions from earlier days, one at a time, and correct me kindly: Day 50: when you read district 2 from 30 m, which kind of fault was easiest to see? | Day 47: why does a district need its edges blended into the island around it?\n7. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n8. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\nIf I want to go deeper, recommend this free video: \"How to Make Roads with Splines in Unreal Engine 5\" by Gorka Games: https://www.youtube.com/watch?v=eO2HUsC7dHY\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; review (by tutor or art director) = огляд; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = e spline follow the route round the island.", "uk": "Виділи кінцеву точку й тягни з Alt, щоб додати точки вздовж намальованого маршруту. Сплайн іде маршрутом навколо острова."}, {"en": "Raise or lower each point with the blue Z arrow to its height (sea level is Z = 0). You should see the spline at the right heights.", "uk": "Підніми чи опусти кожну точку синьою стрілкою Z до її висоти (рівень моря — Z = 0). Має вийти: сплайн на потрібних висотах."}, {"en": "Slide LaneGauge along the narrowest part, then write three landmarks and where each stands under Route in d2_notes.md. You should see three names with their places.", "uk": "Проведи LaneGauge уздовж найвужчого місця, потім запиши під заголовком Route у d2_notes.md три орієнтири й де кожен стоїть. Має вийти три назви з місцями."}], "play": {"en": "Flow test: I describe the route part by part; the tutor 'flies' it and complains about every blind turn; each complaint becomes a fix.", "uk": "Перевірка плавності: я описую маршрут частина за частиною. Тьютор «пролітає» його й скаржиться на кожен сліпий поворот, а кожна скарга стає виправленням."}, "video": {"url": "https://www.youtube.com/watch?v=08kunzHcPV8", "title": "How to design an FPV racetrack that FLOWS - Happy Flying #26", "channel": "UAVfutures", "length": "8:17", "search": "fpv racetrack design flow"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Мальовничий маршрут через обидва райони (Day 53, lesson 4 of 4). Today's build: Готова дорога між районами, злиті краї й стики біомів району 2, island_light_recipe.md, перевірений на всьому острові, і RT_Scenic через обидва райони.\nWhat I already know: День 31: твої дороги як сплайни ландшафту; День 31: метод двох кубів для ухилу (сьогодні ухил записуєш під заголовком Road у d2_notes.md); День 37 і День 38: твої переходи між біомами й зони-винятки (KO_District2); День 47: краї району 1, злиті з островом; День 52: район 2 із рослинами й слідами часу; День 32: island_light_recipe.md і експозиція для огляду; День 22: island_map.png — для довжини маршруту.\nEarlier today I already did: lesson 1 (Дорога між районами); lesson 2 (Одне світло для всього острова); lesson 3 (Краї й стики біомів (мікроурок)). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Планувати маршрут, що показує острів у найкращому світлі: точка старту, узбережжя, обидва райони й панорама — широкий вид з високої точки.\n2. Прокладати маршрут як актор зі сплайном RT_Scenic. Тримати висоту 5–20 м у районах і 30–80 м над узбережжям і верхівкою.\n3. Перевіряти вільний простір кубом LaneGauge і називати орієнтири — високі, помітні об'єкти, за якими кермує пілот.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: 2 lines on why today matters and where it comes back, in plain words (from this: Сьогодні два твої райони стають одним островом. Їх з'єднує справжня дорога, їхні краї зливаються з землею, а все навколо освітлює одне післяобіднє світло. Студії витрачають чимало часу на стики, бо саме вони перетворюють окремі шматки на один світ. It comes back: RT_Scenic — це траса, якою полетить твій дрон у День 57 і у відео в День 58. Завдяки рецепту світла кожен фінальний кадр у День 55 виглядає як той самий золотий вечір.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-53-joins-between-districts exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (ухили дороги й перше перехрестя). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Відкрий копію island_map.png у Krita й намалюй маршрут однією лінією через обидва райони. Виміряй його інструментом Measure за шкалою масштабу своєї мапи. Має вийти 1,8–2,5 км.\n   2. Клацни кнопку Add > Basic > Empty Actor, назви актор RT_Scenic і в Details клацни + Add > Spline. З'являється короткий сплайн із двома точками.\n   3. Виділи кінцеву точку й тягни з Alt, щоб додати точки вздовж намальованого маршруту. Сплайн іде маршрутом навколо острова. [screenshot]\n   4. Підніми чи опусти кожну точку синьою стрілкою Z до її висоти (рівень моря — Z = 0). Має вийти: сплайн на потрібних висотах.\n   5. Проведи LaneGauge уздовж найвужчого місця, потім запиши під заголовком Route у d2_notes.md три орієнтири й де кожен стоїть. Має вийти три назви з місцями. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Перевірка плавності: я описую маршрут частина за частиною. Тьютор «пролітає» його й скаржиться на кожен сліпий поворот, а кожна скарга стає виправленням. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\nIf I want to go deeper, recommend this free video: \"How to design an FPV racetrack that FLOWS - Happy Flying #26\" by UAVfutures: https://www.youtube.com/watch?v=08kunzHcPV8\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; review (by tutor or art director) = огляд; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; File Explorer = Провідник; vertex / edge / face = вершина / ребро / грань; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); UV unwrap / UV layout / seam / UV island = розгортка / розкладка / шов / UV-острівець; level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; volume (PCG Volume, Post Process Volume) = об'єм; kit / kit piece / part of one object = набір / деталь / частина; map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; district / plot / plot plan = район / ділянка / план ділянки; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; summit, hilltop = верхівка; trim sheet / decal = трим-шит / декаль; vista / blockout / landmark = панорама / блокаут / орієнтир; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}], "handin": [{"en": "summary.md", "uk": "summary.md (звіт дня)"}, {"en": "d2_notes.md with the Road and Route sections (→ Day 57)", "uk": "d2_notes.md (розділи Road і Route) (→ День 57)"}, {"en": "island_light_recipe.md: every number and both exposure set-ups (→ Day 54)", "uk": "island_light_recipe.md (кожне число й обидві настройки експозиції) (→ День 54)"}, {"en": "join_120m.png: both districts and the road between them, from 120 m (proof)", "uk": "join_120m.png (обидва райони й дорога між ними з 120 м) (доказ)"}], "goal": {"en": "By the end of today your two districts sit in one island under one light. A finished road joins them, their edges melt into the land, and a scenic route flies through both.", "uk": "Наприкінці дня два твої райони стоять на одному острові під одним світлом. Їх з'єднує готова дорога, їхні краї зливаються з землею, а мальовничий маршрут пролягає через обидва."}, "uses": [{"en": "Day 31: your roads as landscape splines", "uk": "День 31: твої дороги як сплайни ландшафту"}, {"en": "Day 31: the two-cube grade method (today you write the grade under Road in d2_notes.md)", "uk": "День 31: метод двох кубів для ухилу (сьогодні ухил записуєш під заголовком Road у d2_notes.md)"}, {"en": "Days 37 and 38: your biome transitions and keep-outs (KO_District2)", "uk": "День 37 і День 38: твої переходи між біомами й зони-винятки (KO_District2)"}, {"en": "Day 47: district 1's edges, blended into the island", "uk": "День 47: краї району 1, злиті з островом"}, {"en": "Day 52: district 2 planted and weathered", "uk": "День 52: район 2 із рослинами й слідами часу"}, {"en": "Day 32: island_light_recipe.md and the review exposure", "uk": "День 32: island_light_recipe.md і експозиція для огляду"}, {"en": "Day 22: island_map.png, for the route's length", "uk": "День 22: island_map.png — для довжини маршруту"}], "quiz": [{"q": {"en": "A road leg climbs 18 m over 120 m. What is its grade, and is it OK?", "uk": "Відрізок дороги піднімається на 18 м на довжині 120 м. Який у нього ухил, і чи це нормально?"}, "options": [{"en": "15 %: too steep, so lengthen the road or add a hairpin", "uk": "15 %: занадто круто, тож подовж дорогу або додай серпантинний поворот"}, {"en": "6.7 %: fine", "uk": "6,7 %: нормально"}, {"en": "18 %: fine for cars", "uk": "18 %: для машин нормально"}, {"en": "1.5 %: too flat", "uk": "1,5 %: занадто полого"}], "answer": 0, "explain": {"en": "18 divided by 120 is 0.15, so 15 %. Island roads stay under 10 %, so the leg needs more length.", "uk": "18, поділене на 120, — це 0,15, тобто 15 %. Дороги острова тримаються нижче 10 %, тож відрізок треба подовжити."}}, {"q": {"en": "What is a hairpin on a switchback road?", "uk": "Що таке серпантинний поворот на дорозі-серпантині?"}, "options": [{"en": "A straight leg across the slope", "uk": "Прямий відрізок поперек схилу"}, {"en": "The tight turn between two legs, kept flatter and wider than the legs", "uk": "Тісний поворот між двома відрізками, пологіший і ширший за самі відрізки"}, {"en": "A bridge over a stream", "uk": "Міст через струмок"}], "answer": 1, "explain": {"en": "Cars slow down in the turn, so hairpins are flatter and wider than the legs between them.", "uk": "На повороті машини сповільнюються, тому серпантинні повороти пологіші й ширші за відрізки між ними."}}, {"q": {"en": "From CAM_Island_High the far coast disappears into white haze. What do you change first?", "uk": "З камери CAM_Island_High далекий берег зникає в білому серпанку. Що ти змінюєш насамперед?"}, "options": [{"en": "Raise Sky Light Intensity to 10", "uk": "Підняти Sky Light Intensity до 10"}, {"en": "Delete the Sky Atmosphere", "uk": "Видалити Sky Atmosphere"}, {"en": "Turn the sun to midday", "uk": "Повернути сонце на полудень"}, {"en": "Lower the Fog Density, or raise the Fog Height Falloff, and look again", "uk": "Зменшити Fog Density або підняти Fog Height Falloff і подивитися знову"}], "answer": 3, "explain": {"en": "Too much fog hides the island's shape. Thin it until the far coast keeps its outline.", "uk": "Забагато туману ховає форму острова. Розріджуй його, доки далекий берег не матиме чітких обрисів."}}, {"q": {"en": "Your road moved 6 m, and now trees grow in the new verge. Why?", "uk": "Твоя дорога зсунулася на 6 м, і тепер на новому узбіччі ростуть дерева. Чому?"}, "options": [{"en": "PCG never respects roads", "uk": "PCG ніколи не зважає на дороги"}, {"en": "The trees have no collision", "uk": "У дерев немає колізії"}, {"en": "The keep-out still follows the old road line: move it onto the road and regenerate", "uk": "Зона-виняток досі йде старою лінією дороги: перенеси її на дорогу й перегенеруй"}], "answer": 2, "explain": {"en": "Keep-outs don't follow a road by themselves. Move the keep-out and generate again.", "uk": "Зони-винятки не рухаються за дорогою самі. Перенеси зону-виняток і згенеруй знову."}}, {"q": {"en": "What does LaneGauge, your 4 x 4 x 4 m gauge cube, check along the scenic route?", "uk": "Що перевіряє LaneGauge, твій куб-калібр 4 × 4 × 4 м, уздовж мальовничого маршруту?"}, "options": [{"en": "The drone's speed", "uk": "Швидкість дрона"}, {"en": "That every narrow spot leaves enough clear space for a drone", "uk": "Що кожне вузьке місце залишає досить вільного простору для дрона"}, {"en": "That the road grade is under 10 %", "uk": "Що ухил дороги менший за 10 %"}, {"en": "The landscape's resolution", "uk": "Роздільну здатність ландшафту"}], "answer": 1, "explain": {"en": "The cube is the space a drone needs. If it touches something, the route is too tight there.", "uk": "Куб — це простір, потрібний дронові. Якщо він чогось торкається, маршрут там затісний."}}], "weekInfo": {"week": 11, "title": {"en": "District 2 finished", "uk": "Район 2 завершено"}, "goal": {"en": "By Friday you have district 2 finished: furnished, planted, weathered and joined to the island, with five final shots per district beside real photos.", "uk": "До п'ятниці район 2 завершено: облаштовано, засаджено, зістарено й з'єднано з островом, а по п'ять фінальних кадрів кожного району стоять поруч зі справжніми фото."}, "skills": [{"en": "Set dressing and prop placement by use for open-world districts", "uk": "Наповнення сцени (set dressing) і розстановка пропсів за призначенням у районах відкритого світу"}, {"en": "Spline-based PCG for fences, walls and hedgerows in Unreal Engine 5", "uk": "PCG на сплайнах для парканів, мурів і живоплотів в Unreal Engine 5"}, {"en": "Foliage and decal passes that age a scene believably", "uk": "Рослини й декалі, які правдоподібно старять сцену"}, {"en": "Lighting recipes and exposure control across a whole open world", "uk": "Рецепти світла й контроль експозиції для всього відкритого світу"}, {"en": "Art review against photo reference in r1/r2 rounds", "uk": "Огляд роботи за фото-референсами в раундах r1/r2"}]}, "morning": {"sofar": {"en": "Both districts are built, furnished, planted and weathered.", "uk": "Обидва райони збудовано й облаштовано, у них є рослини й зношеність."}, "today": {"en": "You finish the road between the districts, blend district 2's edges into the land, test one light across the whole island, and lay the scenic route through both districts.", "uk": "Сьогодні ти завершуєш дорогу між районами, вплітаєш краї району 2 у рельєф, перевіряєш одне світло на всьому острові й прокладаєш мальовничий маршрут крізь обидва райони."}, "cheer": {"en": "Joins are what make two places feel like one island, so work slowly along each edge and check it from the air.", "uk": "Саме стики роблять із двох місць один острів, тож працюй повільно вздовж кожного краю й перевіряй з повітря."}, "quote": {"text": {"en": "To be whole is to be part; true voyage is return.", "uk": "Бути цілим — означає бути частиною; справжня мандрівка — це повернення."}, "author": {"en": "Ursula K. Le Guin", "uk": "Урсула К. Ле Гуїн"}, "source": "https://en.wikiquote.org/wiki/Ursula_K._Le_Guin"}}, "hasAssets": false, "workPath": "Work\\Assignment\\Day-53-joins-between-districts", "mapHref": "../../COURSE.html", "prevHref": "../Day-52-district2-planting-grime-light/START-HERE.html", "nextHref": "../Day-54-district2-r1-and-r2/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Krita and Unreal Engine 5.8. I am a beginner on Day 53. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me and don't write code.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: Краї, перевірка світла й мальовничий маршрут — самостійно.\nIt's part of: Готова дорога між районами, злиті краї й стики біомів району 2, island_light_recipe.md, перевірений на всьому острові, і RT_Scenic через обидва райони (L_Island: дорога між районами, смуга 30–50 м навколо району 2 і сонце, небо й туман усього острова. Потім мальовничий маршрут через обидва райони.).\nWhy it matters: Сьогодні два твої райони стають одним островом. Їх з'єднує справжня дорога, їхні краї зливаються з землею, а все навколо освітлює одне післяобіднє світло. Студії витрачають чимало часу на стики, бо саме вони перетворюють окремі шматки на один світ. It comes back: RT_Scenic — це траса, якою полетить твій дрон у День 57 і у відео в День 58. Завдяки рецепту світла кожен фінальний кадр у День 55 виглядає як той самий золотий вечір.\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-53-joins-between-districts (on the drive I chose on Day 0).\nWhat I already know: День 31: твої дороги як сплайни ландшафту; День 31: метод двох кубів для ухилу (сьогодні ухил записуєш під заголовком Road у d2_notes.md); День 37 і День 38: твої переходи між біомами й зони-винятки (KO_District2); День 47: краї району 1, злиті з островом; День 52: район 2 із рослинами й слідами часу; День 32: island_light_recipe.md і експозиція для огляду; День 22: island_map.png — для довжини маршруту; today's lessons: Дорога між районами; Одне світло для всього острова; Краї й стики біомів (мікроурок); Мальовничий маршрут через обидва райони. Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- Дорога між районами як сплайн ландшафту: ухил кожного відрізка менший за 10 % (один короткий шматок — до 12 %). Обидва перехрестя злиті бордюром, декаллю або узбіччям.\n- Краї району 2 злиті на 30–50 м назовні, як у День 47, а біоми на стиках перемішані плямами.\n- island_light_recipe.md перевірено з камер C4, D2_C4 і CAM_Island_High. Сонце стоїть на висоті 25–35° і світить збоку, а зафіксовану експозицію для огляду й діапазон для польоту записано.\n- RT_Scenic — сплайн від точки старту, навколо узбережжя й через обидва райони до панорами. Довжина — 1,8–2,5 км, висота — 5–20 м у районах і 30–80 м деінде.\n- У d2_notes.md з'являються два короткі розділи: Road (найкрутіший ухил) і Route (довжина й три орієнтири).\n- Золото (за бажанням): виміряй кожен відрізок дороги, а не лише найкрутіший.\n\nMy checklist (the same numbers show on my course page):\n1. Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: d2_notes.md, island_light_recipe.md, а в Unreal — CAM_Island_High, RT_Scenic. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. (from lesson 1)\n2. Якщо найкрутіший відрізок має ухил понад 10 %, виправ його: пересунь точки або додай серпантинний поворот, потім знову виміряй двома кубами. Запиши його ухил під заголовком Road у d2_notes.md. Перевірка: ухил менший за 10 % або, для одного короткого шматка, за 12 %. (from lesson 1)\n3. Злий обидва перехрестя бордюром, декаллю або узбіччям. Облаштуй узбіччя: трава, канава з боку схилу вгору й кілька SM_Bollard на зовнішньому боці поворотів. Перевірка: на висоті 2 м на жодному перехресті не видно ні сходинки, ні шва. (from lesson 1)\n4. Краї: зміни форму KO_District2, щоб контур облягав сади й подвір'я, як в уроці 3, і клацни Generate на PCG Volume поруч. Доведи мури й стежки до природного кінця. Старіший Unreal (4.27): домалюй рослини до краю інструментом Foliage. Перевірка: з висоти 120 м не видно, де закінчується котрийсь район. (from lesson 3)\n5. Стики: намалюй рослини біому трохи всередині краю району 2, а рослини району — трохи назовні, плямами. Перенеси зону-виняток дороги на остаточну дорогу й клацни Generate. Старіший Unreal (4.27): намалюй стик інструментом Foliage. Перевірка: пролітаючи вздовж стику на 30 м, ти не знаходиш ні прямого краю, ні рослин на дорозі. (from lesson 3)\n6. Порівняй сонце, Sky Light і туман з island_light_recipe.md, як в уроці 2, і перевір кадрами HighResShot з камер C4, D2_C4 і CAM_Island_High. Старіший Unreal (4.27) або слабкий ПК: можна вимкнути Lumen або взяти статичне світло; оцінюй на Medium; див. розділ «Слабкий ПК» на сторінці ACCOUNTS-AND-INSTALLS.html. Перевірка: небо не пересвічене, а далекий берег зберігає обриси. (from lesson 2)\n7. Спробуй обидві настройки експозиції з рецепту: спершу зафіксовану для огляду, потім діапазон для польоту, пролітаючи з темного лісу над море. Перевірка: зафіксована експозиція двічі дає ту саму яскравість, а діапазон підлаштовується повільно. (from lesson 2)\n8. Проклади RT_Scenic уздовж намальованого маршруту на потрібних висотах, як в уроці 4. Перевірка: на island_map.png маршрут має довжину 1,8–2,5 км. (from lesson 4)\n9. Проведи LaneGauge уздовж найвужчих місць RT_Scenic, потім запиши довжину маршруту й три орієнтири під заголовком Route у d2_notes.md. Перевірка: куб нічого не торкається, і три орієнтири названо. (from lesson 4)\n10. Картинка-доказ: постав камеру приблизно на 120 м над дорогою між районами. Натисни G, зроби HighResShot 1920x1080 і перейменуй файл на join_120m.png. Потім вибери File > Save All. Перевірка: на вкладці рівня немає зірочки (*), а на картинці обидва райони без різкого краю. (from lesson 3)\n11. Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: кожна назва зі списку є в папці, у кожної є розмір. (from lesson 4)\n\nHow to help: ask which step number I'm on, then give me only the next step: the exact clicks and what I should see. When I send a screenshot, compare it with my reference, my sizes and the spec, and name one thing to fix at a time.\nCheck every save and export by reopening it before we move on:\n- a .md or .txt: open it with Notepad; the text is there, and the name doesn't end in .md.txt\nWhen I write \"готово\", and in any case before the day ends, check with me one item at a time (yes/no): each spec point, then each file on my hand-in list, ready in my day work folder (skip summary.md: the day report writes it next):\n1. d2_notes.md (розділи Road і Route) (→ День 57)\n2. island_light_recipe.md (кожне число й обидві настройки експозиції) (→ День 54)\n3. join_120m.png (обидва райони й дорога між ними з 120 м) (доказ)\nFinish ything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; review (by tutor or art director) = огляд; click / right-click = клацни / клацни правою кнопкою; vertex / edge / face = вершина / ребро / грань; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); UV unwrap / UV layout / seam / UV island = розгортка / розкладка / шов / UV-острівець; level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; volume (PCG Volume, Post Process Volume) = об'єм; map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; district / plot / plot plan = район / ділянка / план ділянки; summit, hilltop = верхівка; trim sheet / decal = трим-шит / декаль; vista / blockout / landmark = панорама / блокаут / орієнтир; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.", "before": null, "handinUrl": "https://drive.google.com/drive/folders/1_SEmrMmc0KbBz41dU9qCl6BsENzZaAhM", "assetFiles": []}</script>

 s+='<circle class="face" cx="200" cy="200" r="168"/><circle class="track" cx="200" cy="200" r="176"/>';
 s+='<circle class="arc" cx="200" cy="200" r="176" stroke="url(#'+id+'g)" stroke-dasharray="'+(C*p).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 200 200)"/>';
 if(p>0){const A=-Math.PI/2+p*TAU;s+='<circle class="knob'+(p<1?' go':'')+'" cx="'+(200+176*Math.cos(A)).toFixed(1)+'" cy="'+(200+176*Math.sin(A)).toFixed(1)+'" r="7"/>'}

 if(r.length)t+='\n\nMy lesson summaries, pasted from my course page:\n'+r.join('\n');

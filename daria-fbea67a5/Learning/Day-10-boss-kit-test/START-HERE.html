<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 10</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

.opt.right{box-shadow:var(--press);background:var(--okBg);border-color:rgba(74,222,128,.45)}.opt.right .lt{background:var(--okL);color:#fff;box-shadow:0 0 10px var(--okL)}.opt.right .mk{color:var(--ok)}

<script id="data" type="application/json">{"learner": "ib-daria-fbea67a5", "learnerName": {"en": "Daria", "uk": "Дар'я"}, "day": 10, "week": 2, "total": 60, "title": {"en": "Boss: L_KitTest, a pier and a harbour house from your own kit", "uk": "День боса: L_KitTest — пірс і портовий будинок із твого власного набору"}, "theme": {"en": "Week 2: Modular kits", "uk": "Тиждень 2: Модульні набори"}, "build": {"item": {"en": "L_KitTest: your harbour kit assembled into a quay, a pier and a harbour house", "uk": "L_KitTest: твій набір для гавані, зібраний у причал, пірс і портовий будинок"}, "why": {"en": "A kit is only proven when it builds a place quickly and cleanly. Art directors test a kit exactly like this: build a small scene against the clock, then look for gaps, wrong heights and missing pieces. A Level Instance (a group of placed actors saved as its own small level, which you place like one object and can edit for all copies at once) is how studios repeat houses across a town. On Day 15 you dress this same level with weathered materials and compare it with real photos.", "uk": "Набір доведено лише тоді, коли з нього швидко й чисто будується місце. Арт-директори перевіряють набір саме так: збудувати невелику сцену на час, а тоді шукати щілини, неправильні висоти й відсутні деталі. Level Instance (група розставлених акторів, збережена як окремий маленький рівень, який ставиш як один об'єкт і можеш редагувати для всіх копій одразу) — це спосіб, яким студії повторюють будинки по всьому містечку. У День 15 ти оздобиш цей самий рівень вивітреними матеріалами й порівняєш його зі справжніми фото."}, "where": {"en": "Course/Day10/L_KitTest in IslandCourse. The house Level Instance comes back when you build your districts from Day 48.", "uk": "Course/Day10/L_KitTest в IslandCourse. Level Instance будинку повернеться, коли ти будуватимеш свої райони з Дня 48."}, "spec": [{"en": "L_KitTest saved in Course/Day10 (File > New Level > Basic).", "uk": "L_KitTest збережено в Course/Day10 (File > New Level > Basic)."}, {"en": "A 16 m quay of four SM_QuayEdge_4m with SM_QuayCorner_Out at one end, and a 12 m pier of three SM_PierDeck_4m going out from it.", "uk": "Причал завдовжки 16 м із чотирьох SM_QuayEdge_4m з SM_QuayCorner_Out на одному кінці та пірс завдовжки 12 м із трьох SM_PierDeck_4m, що виходить від нього."}, {"en": "SM_Railing_2m along both sides of the pier, each run finished with SM_RailingPost; SM_Steps against the quay's water face beside the pier.", "uk": "SM_Railing_2m уздовж обох боків пірса, кожен ряд завершено SM_RailingPost; SM_Steps біля стіни причалу з боку води поруч із пірсом."}, {"en": "The Floor lowered 1 m to stand in for the water, and a Land block (a basic-shape cube with its top at Z 0) behind the quay. A 4 x 6 m harbour house from the building kit on the land, at least 2 m back from the edge, with its door facing the water, saved as the Level Instance LI_HarbourHouse in Course/Day10.", "uk": "Floor опущено на 1 м, щоб грала роль води, а позаду причалу — брусок Land (куб базових форм із верхом на Z 0). Портовий будинок 4 x 6 м із набору для будівель стоїть на суходолі, щонайменше на 2 м від краю, дверима до води, і збережений як Level Instance LI_HarbourHouse у Course/Day10."}, {"en": "Nothing floating, no gaps and no flickering at any seam; every piece on the 100 cm grid where it can be.", "uk": "Нічого не висить, жодних щілин і жодного мерехтіння на швах; кожна деталь на сітці 100 см, де це можливо."}, {"en": "Two camera bookmarks and screenshots: kit_pier.png (along the pier at about 2 m high) and kit_wide.png (a three-quarter view from about 20 m up).", "uk": "Дві закладки камери і скриншоти: kit_pier.png (уздовж пірса на висоті близько 2 м) і kit_wide.png (вид на три чверті приблизно з 20 м угорі)."}, {"en": "plan_day10.md and rubric_day10.md (your plan with real times, and your self-review with the tutor).", "uk": "plan_day10.md і rubric_day10.md (твій план із реальним часом і твоя самоперевірка разом із тьютором)."}], "piece1": "the quay and the pier (in the lessons)", "piece2": {"en": "The harbour house as a Level Instance and the finished scene, on your own and timed (start a 4-hour timer)", "uk": "Портовий будинок як Level Instance і завершена сцена, самостійно і на час (запусти таймер на 4 години)"}, "steps": [{"text": {"en": "Start a 4-hour timer. Check plan_day10.md from lesson 3: Bronze by hour 2, Silver by hour 3, Gold in hour 4. Check: every job has a minute budget, and 30 minutes are spare.", "uk": "Запусти таймер на 4 години. Перевір plan_day10.md з уроку 3: Бронза до кінця 2-ї години, Срібло до кінця 3-ї, Золото — на 4-й годині. Перевірка: кожна задача має бюджет у хвилинах, і 30 хвилин лишаються в запасі."}, "lesson": 3}, {"text": {"en": "Finish the quay and the pier from lesson 1 if needed: four quay pieces, the outer corner and three pier decks. Check: from 2 m away, every seam is clean.", "uk": "За потреби заверши причал і пірс з уроку 1: чотири деталі причалу, зовнішній кут і три настили пірса. Перевірка: з 2 м кожен шов чистий."}, "lesson": 1}, {"text": {"en": "Place SM_Steps against the quay's water face beside the pier, joined with vertex snap. Check: the top step sits just below the deck and the flight goes down towards the water.", "uk": "Постав SM_Steps біля стіни причалу з боку води поруч із пірсом, з'єднавши через прив'язку до вершин. Перевірка: верхня сходинка лежить трохи нижче поверхні причалу, а марш спускається до води."}, "lesson": 1}, {"text": {"en": "Run SM_Railing_2m along both sides of the pier with vertex snap and finish each run with SM_RailingPost. Check: a post every 2 m, no double posts, and one at each end.", "uk": "Постав SM_Railing_2m уздовж обох боків пірса через прив'язку до вершин і заверши кожен ряд стійкою SM_RailingPost. Перевірка: стійка кожні 2 м, жодних подвійних стійок, і по одній на кожному кінці."}, "lesson": 1}, {"text": {"en": "Land first: drag a Cube from Place Actors > Shapes, name it Land and type Scale 20, 10, 1 and Location X 800, Y -500, Z -50, so its top is at Z 0. If it overlaps the quay instead of meeting its land side (the side without coping), change Y to 500: land and quay must meet with no gap and no overlap. Then the house shell on the land, at least 2 m back from the quay edge, with the door wall facing the water: walls, door, windows and four corner posts. Bronze check: Ctrl+S and take bronze.png. Check: the land meets the quay deck with no step or flicker, and the house is a closed box of walls with no gaps at the corners.", "uk": "Спершу суходіл: перетягни Cube з Place Actors > Shapes, назви його Land і введи Scale 20, 10, 1 і Location X 800, Y -500, Z -50, щоб його верх був на Z 0. Якщо він накладається на причал, а не сходиться з його боком до суходолу (боком без бровки), зміни Y на 500: суходіл і причал мають сходитися без щілини й без накладання. Потім коробка будинку на суходолі, щонайменше на 2 м від краю причалу, стіною з дверима до води: стіни, двері, вікна і чотири кутові стійки. Перевірка Бронзи: Ctrl+S і зроби bronze.png. Перевірка: суходіл сходиться з поверхнею причалу без сходинки й мерехтіння, а будинок — замкнена коробка стін без щілин у кутах."}, "lesson": "D9.4"}, {"text": {"en": "Roof: the quay deck is at Z 0, so the heights are the same as on Day 9: gables at Z 300, roof panels and the ridge at Z 415. Check: from the side, the roof meets the ridge and rests on the walls.", "uk": "Дах: поверхня причалу на Z 0, тож висоти ті самі, що й у День 9: фронтони на Z 300, панелі даху й коник на Z 415. Перевірка: збоку дах сходиться на гребені й лежить на стінах."}, "lesson": "D9.4"}, {"text": {"en": "Select every house piece in the Outliner and right-click > Level > Create Level Instance; save it as LI_HarbourHouse in Course/Day10. Check: clicking any part of the house now selects the whole house.", "uk": "Виділи всі деталі будинку в Outliner і клацни правою кнопкою > Level > Create Level Instance; збережи його як LI_HarbourHouse у Course/Day10. Перевірка: тепер клацання на будь-якій частині будинку виділяє весь будинок."}, "lesson": 2}, {"text": {"en": "Set bookmark 1 along the pier at about 2 m high and bookmark 2 as a three-quarter view from about 20 m up, with level horizons and an edge leading into each picture. Take kit_pier.png and kit_wide.png. Check: both pictures show the quay, the pier and the house clearly.", "uk": "Постав закладку 1 уздовж пірса на висоті близько 2 м, а закладку 2 — вид на три чверті приблизно з 20 м угорі, з рівним горизонтом і краєм, що веде погляд у кадр. Зроби kit_pier.png і kit_wide.png. Перевірка: на обох кадрах чітко видно причал, пірс і будинок."}, "lesson": 3}, {"text": {"en": "Silver check: drag the Player Start (find it in the Outliner) onto the land and press End, then press Play and walk the mannequin along the quay, out along the pier and through the house door. Check: the mannequin stops at railings and walls, and fits through the door.", "uk": "Перевірка Срібла: перетягни Player Start (знайди його в Outliner) на суходіл і натисни End, потім натисни Play і проведи манекен уздовж причалу, далі пірсом і крізь двері будинку. Перевірка: манекен зупиняється біля поруччя й стін і проходить у двері."}, "lesson": "D0.3"}, {"text": {"en": "Gold: Alt+drag a second copy of LI_HarbourHouse along the quay and turn it 90 degrees. Then right-click one copy > Level > Edit, swap one plain wall for SM_Wall_Window, and Commit. Check: both houses show the new window.", "uk": "Золото: через Alt+перетягування зроби другу копію LI_HarbourHouse уздовж причалу й поверни її на 90 градусів. Потім клацни правою кнопкою на одній копії > Level > Edit, заміни одну просту стіну на SM_Wall_Window і натисни Commit. Перевірка: в обох будинках з'явилося нове вікно."}, "lesson": 2}, {"text": {"en": "Gold: make kit_compare.png in Krita: kit_pier.png and kit_wide.png beside two of your real harbour photos, with one line under each pair on what matches and what doesn't. Check: two pairs, each with a line.", "uk": "Золото: зроби kit_compare.png у Krita: kit_pier.png і kit_wide.png поруч із двома твоїми справжніми фото гаваней, з рядком під кожною парою про те, що збігається, а що ні. Перевірка: дві пари, у кожної є рядок."}, "lesson": "D5.3"}, {"text": {"en": "Self-review: fill in rubric_day10.md line by line with the tutor and fix the worst 'no' first. Write kit_notes.md (three things that work, two to fix). Check: every line has a yes or a no, and the worst fault is fixed.", "uk": "Самоперевірка: заповни rubric_day10.md рядок за рядком разом із тьютором і спершу виправ найгірше «ні». Напиши kit_notes.md (три речі, що працюють, і дві, які треба виправити). Перевірка: у кожному рядку стоїть «так» або «ні», а найгіршу помилку виправлено."}, "lesson": 4}, {"text": {"en": "Captures: before_after_day10.png (the empty Basic level and the finished scene from bookmark 2) and a 60-second clip flying along the pier, past the steps and round the house. Save today's clip as clip_day10.mp4. Check: both files are in today's Work folder.", "uk": "Знімки й запис: before_after_day10.png (порожній рівень Basic і завершена сцена із закладки 2) і 60-секундний кліп прольоту вздовж пірса, повз сходи й навколо будинку. Збережи сьогоднішній кліп як clip_day10.mp4. Перевірка: обидва файли лежать у сьогоднішній папці Work."}, "lesson": "D0.1"}], "boss": [{"en": "Bronze: the 16 m quay with its corner, the 12 m pier and the house shell (walls, door, windows, corner posts) assembled with no gaps and saved in L_KitTest, within 4 hours.", "uk": "Бронза: причал 16 м із кутом, пірс 12 м і коробка будинку (стіни, двері, вікна, кутові стійки), зібрані без щілин і збережені в L_KitTest, за 4 години."}, {"en": "Silver: Bronze, plus railings with end posts, the steps, the house's gables, roof and ridge, the house saved as LI_HarbourHouse, and the two camera screenshots.", "uk": "Срібло: Бронза плюс поруччя з кінцевими стійками, сходи, фронтони, дах і коник будинку, будинок збережено як LI_HarbourHouse, і є два скриншоти з камер."}, {"en": "Gold: Silver, plus a second copy of LI_HarbourHouse turned 90 degrees, one edit inside the Level Instance that updates both copies, and kit_compare.png beside real harbour photos, all within 4 hours.", "uk": "Золото: Срібло плюс друга копія LI_HarbourHouse, повернута на 90 градусів, одна зміна всередині Level Instance, яка оновлює обидві копії, і kit_compare.png поруч зі справжніми фото гаваней, усе за 4 години."}], "assets": ["island12/art-director-notes.md"]}, "lessons": [{"title": {"en": "Kitbash speed: copies, multi-select and vertex snap", "uk": "Швидкий кітбаш: копії, виділення кількох акторів і прив'язка до вершин"}, "minutes": 40, "goals": [{"en": "Explain kitbashing: building a new place quickly from existing kit pieces.", "uk": "Пояснювати, що таке кітбаш (kitbashing): швидке будування нового місця з наявних деталей набору."}, {"en": "Copy actors fast with Alt+drag and Ctrl+D (duplicate), and move several selected actors together.", "uk": "Швидко копіювати актори через Alt+перетягування і Ctrl+D (дублювання) та переміщати кілька виділених акторів разом."}, {"en": "Snap with the grid, the rotation snap and vertex snap (hold V) so nothing needs fixing later.", "uk": "З'єднувати деталі через сітку, прив'язку обертання і прив'язку до вершин (утримуй V), щоб потім нічого не довелося виправляти."}], "doalong": [{"en": "File > New Level > Basic, then File > Save Current Level As: L_KitTest in a new folder Course/Day10. Click Floor in the Outliner and type -100 into its Location Z, as on Day 7: the floor becomes the water, 1 m below your deck.", "uk": "File > New Level > Basic, потім File > Save Current Level As: L_KitTest у новій папці Course/Day10. Клацни Floor в Outliner і введи -100 у його Location Z, як у День 7: підлога стає водою на 1 м нижче твого настилу."}, {"en": "Set the grid snap to 100 and the rotation snap to 90. Drag SM_QuayEdge_4m in and type Location 0, 0, 0.", "uk": "Встанови прив'язку до сітки на 100, а прив'язку обертання — на 90. Перетягни SM_QuayEdge_4m у рівень і введи Location 0, 0, 0."}, {"en": "Alt+drag along X three times: a 16 m quay. Click the first piece in the Outliner and Shift+click the last: all four are selected. Move them together 1 m and back (Ctrl+Z).", "uk": "Тричі зроби Alt+перетягування вздовж X: причал завдовжки 16 м. Клацни першу деталь в Outliner і Shift+клацни останню: виділено всі чотири. Посунь їх разом на 1 м і назад (Ctrl+Z)."}, {"en": "Add SM_QuayCorner_Out at the quay's end: hold V while dragging its gizmo near the last piece's corner until it clicks into place. Turn it with Rotation Z if its coping faces the land.", "uk": "Додай SM_QuayCorner_Out у кінці причалу: утримуй V, тягнучи його гізмо до кута останньої деталі, доки він не клацне на місце. Поверни його через Rotation Z, якщо його бровка дивиться на суходіл."}, {"en": "Place the first SM_PierDeck_4m at the middle of the quay's water edge, turned with Rotation Z 90 or -90 so it points out to the water, and join it with vertex snap. Press Ctrl+D to duplicate it (if nothing happens, Edit > Duplicate shows your shortcut) and move the copy 400 cm outwards; repeat once more.", "uk": "Постав перший SM_PierDeck_4m посередині краю причалу над водою, повернувши через Rotation Z 90 або -90, щоб він дивився на воду, і приєднай його через прив'язку до вершин. Натисни Ctrl+D, щоб дублювати його (якщо нічого не відбувається, Edit > Duplicate покаже твоє скорочення), і посунь копію на 400 см назовні; повтори ще раз."}, {"en": "Fly along the pier at 2 m high and check every seam. Press Ctrl+S.", "uk": "Пролети вздовж пірса на висоті 2 м і перевір кожен шов. Натисни Ctrl+S."}], "play": {"en": "Beat the clock: the quay and the pier in 20 minutes; the tutor times me from my first and my last screenshot.", "uk": "Наввипередки з годинником: причал і пірс за 20 хвилин; тьютор рахує час між моїм першим і останнім скриншотом."}, "video": {"url": "https://www.youtube.com/watch?v=tnaXNCaBQ4M", "title": "06 - Snapping, Pivot Points, and Duplication - Unreal Engine Stage Design Course", "channel": "SuperStage", "length": "7:21", "search": "unreal engine snapping pivot duplicate"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Kitbash speed: copies, multi-select and vertex snap (Day 10, lesson 1 of 4).\nToday's build: L_KitTest: your harbour kit assembled into a quay, a pier and a harbour house.\n\nBy the end of this lesson I can:\n1. Explain kitbashing: building a new place quickly from existing kit pieces.\n2. Copy actors fast with Alt+drag and Ctrl+D (duplicate), and move several selected actors together.\n3. Snap with the grid, the rotation snap and vertex snap (hold V) so nothing needs fixing later.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (This week you built a harbour kit and a building kit, every piece on one grid with one pivot rule.), what I will learn today (It is Boss day: you assemble L_KitTest, a quay, a pier and a harbour house from your own kit, and save the house as a Level Instance.), encourage me (Start with the Bronze build and save numbered versions; whatever tier you reach, you end the day with a place made only from your own pieces.), and share today's quote: \"The various objects of the universe may be constant, at times, but their reciprocal relationships always vary.\" (Alexander Calder).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 7: Where is the pivot of every harbour kit piece, and which way does its water side face? | Day 3: What is a modifier, and when do you apply it?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Beat the clock: the quay and the pier in 20 minutes; the tutor times me from my first and my last screenshot.\n6. Do-along on today's build (the quay and the pier (in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - File > New Level > Basic, then File > Save Current Level As: L_KitTest in a new folder Course/Day10. Click Floor in the Outliner and type -100 into its Location Z, as on Day 7: the floor becomes the water, 1 m below your deck.\n   - Set the grid snap to 100 and the rotation snap to 90. Drag SM_QuayEdge_4m in and type Location 0, 0, 0.\n   - Alt+drag along X three times: a 16 m quay. Click the first piece in the Outliner and Shift+click the last: all four are selected. Move them together 1 m and back (Ctrl+Z).\n   - Add SM_QuayCorner_Out at the quay's end: hold V while dragging its gizmo near the last piece's corner until it clicks into place. Turn it with Rotation Z if its coping faces the land.\n   - Place the first SM_PierDeck_4m at the middle of the quay's water edge, turned with Rotation Z 90 or -90 so it points out to the water, and join it with vertex snap. Press Ctrl+D to duplicate it (if nothing happens, Edit > Duplicate shows your shortcut) and move the copy 400 cm outwards; repeat once more.\n   - Fly along the pier at 2 m high and check every seam. Press Ctrl+S.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"06 - Snapping, Pivot Points, and Duplication - Unreal Engine Stage Design Course\" by SuperStage: https://www.youtube.com/watch?v=tnaXNCaBQ4M\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Level Instances: one house, many copies", "uk": "Level Instances: один будинок, багато копій"}, "minutes": 40, "goals": [{"en": "Explain a Level Instance: a group of actors saved as its own small level and placed like one object.", "uk": "Пояснювати, що таке Level Instance: група акторів, збережена як окремий маленький рівень і розміщена як один об'єкт."}, {"en": "Make one from selected actors (right-click > Level > Create Level Instance) and place copies of it.", "uk": "Створювати його з виділених акторів (правий клік > Level > Create Level Instance) і розставляти його копії."}, {"en": "Edit a Level Instance in place and commit, so every copy updates.", "uk": "Редагувати Level Instance на місці й підтверджувати зміни (Commit), щоб оновилася кожна копія."}], "doalong": [{"en": "Practice group: place three SM_Wall_2m pieces and one SM_Wall_Corner anywhere on the floor, away from the quay.", "uk": "Тренувальна група: постав три деталі SM_Wall_2m і одну SM_Wall_Corner будь-де на підлозі, подалі від причалу."}, {"en": "Select all four in the Outliner, right-click > Level > Create Level Instance. Accept the options, and save the new level as LI_Practice in Course/Day10. The four actors now move as one.", "uk": "Виділи всі чотири в Outliner, клацни правою кнопкою > Level > Create Level Instance. Прийми параметри й збережи новий рівень як LI_Practice у Course/Day10. Тепер чотири актори рухаються як один."}, {"en": "Hold Alt and drag the Level Instance to make a copy.", "uk": "Утримуй Alt і тягни Level Instance, щоб зробити копію."}, {"en": "Select one copy, right-click > Level > Edit. Move one wall 1 m, then click Commit (in the bar that appears at the top of the viewport, or right-click > Level > Commit). Both copies change.", "uk": "Виділи одну копію, клацни правою кнопкою > Level > Edit. Посунь одну стіну на 1 м, а тоді натисни Commit (на панелі, що з'являється вгорі в'юпорта, або правий клік > Level > Commit). Змінюються обидві копії."}, {"en": "Delete both practice copies from the level, then right-click LI_Practice in the Content Browser > Delete, so your folder stays clean.", "uk": "Видали обидві тренувальні копії з рівня, а тоді клацни правою кнопкою на LI_Practice у Content Browser > Delete, щоб твоя папка лишалася чистою."}], "play": {"en": "Instance or not: the tutor names six things (20 identical street lamps, one unique statue, a row of five identical houses, a single boat, a repeated market stall, a whole harbour); I say whether each should be a Level Instance and why.", "uk": "Instance чи ні: тьютор називає шість речей (20 однакових вуличних ліхтарів, одна унікальна статуя, ряд із п'яти однакових будинків, один човен, повторювана ринкова ятка, ціла гавань); я кажу, чи варто кожну робити Level Instance і чому."}, "video": {"search": "unreal engine 5 level instance tutorial"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Level Instances: one house, many copies (Day 10, lesson 2 of 4).\nToday's build: L_KitTest: your harbour kit assembled into a quay, a pier and a harbour house.\nEarlier today I already did: lesson 1 (Kitbash speed: copies, multi-select and vertex snap). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Explain a Level Instance: a group of actors saved as its own small level and placed like one object.\n2. Make one from selected actors (right-click > Level > Create Level Instance) and place copies of it.\n3. Edit a Level Instance in place and commit, so every copy updates.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Instance or not: the tutor names six things (20 identical street lamps, one unique statue, a row of five identical houses, a single boat, a repeated market stall, a whole harbour); I say whether each should be a Level Instance and why.\n4. Do-along on today's build (the quay and the pier (in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Practice group: place three SM_Wall_2m pieces and one SM_Wall_Corner anywhere on the floor, away from the quay.\n   - Select all four in the Outliner, right-click > Level > Create Level Instance. Accept the options, and save the new level as LI_Practice in Course/Day10. The four actors now move as one.\n   - Hold Alt and drag the Level Instance to make a copy.\n   - Select one copy, right-click > Level > Edit. Move one wall 1 m, then click Commit (in the bar that appears at the top of the viewport, or right-click > Level > Commit). Both copies change.\n   - Delete both practice copies from the level, then right-click LI_Practice in the Content Browser > Delete, so your folder stays clean.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Beat-the-clock rules and two camera views", "uk": "Правила гонки з часом і два ракурси камери"}, "minutes": 40, "goals": [{"en": "Plan a timed build: biggest shapes first, details last, a screenshot every 30 minutes.", "uk": "Планувати роботу на час: спершу найбільші форми, деталі — наостанок, скриншот кожні 30 хвилин."}, {"en": "Choose two views that tell the whole story: one along the place at about 2 m high, one wide from above.", "uk": "Вибирати два ракурси, які розповідають усю історію: один уздовж місця на висоті близько 2 м, другий — широкий згори."}, {"en": "Use leading lines (an edge or a railing that leads the eye into the picture) and a level horizon, and save views as bookmarks.", "uk": "Використовувати провідні лінії (край чи поруччя, що ведуть погляд у кадр) і рівний горизонт та зберігати ракурси як закладки."}], "doalong": [{"en": "Write plan_day10.md: the three tiers in your own words and a minute plan (house walls 60, roof 40, railings and steps 40, Level Instance 20, cameras 20, Gold 30, spare 30).", "uk": "Напиши plan_day10.md: три рівні своїми словами й поминутний план (стіни будинку 60, дах 40, поруччя й сходи 40, Level Instance 20, камери 20, Золото 30, запас 30)."}, {"en": "Fly to about 2 m above the pier edge, looking along it. Keep the horizon level and press Ctrl+1.", "uk": "Підлети приблизно на 2 м над краєм пірса й дивися вздовж нього. Тримай горизонт рівним і натисни Ctrl+1."}, {"en": "Fly up to about 20 m at a three-quarter angle (from the side and above), so the quay and the pier show together. Press Ctrl+2.", "uk": "Піднімися приблизно на 20 м під кутом на три чверті (збоку й згори), щоб причал і пірс були видні разом. Натисни Ctrl+2."}, {"en": "In each view, check that the pier edge or the railing leads the eye into the picture. Move a little until it does, and save the bookmark again.", "uk": "На кожному ракурсі перевір, що край пірса або поруччя веде погляд у кадр. Трохи посунься, доки так не стане, і збережи закладку ще раз."}, {"en": "Take both screenshots (Win+Shift+S) and write one line on what each shows that the other doesn't.", "uk": "Зроби обидва скриншоти (Win+Shift+S) і напиши по рядку про те, що показує кожен, чого не показує інший."}], "play": {"en": "Spot the difference: the tutor describes two versions of the same shot, one with a tilted horizon or a cut-off pier end; I pick the better one and say why, three rounds in a row.", "uk": "Знайди відмінність: тьютор описує дві версії того самого кадру, одну — з нахиленим горизонтом або обрізаним кінцем пірса; я вибираю кращу й пояснюю чому, три раунди поспіль."}, "video": {"url": "https://www.youtube.com/watch?v=KyecOinBgMo", "title": "How I Find Camera Compositions in Unreal Engine 5", "channel": "Ted Mebratu", "length": "16:51", "search": "unreal engine 5 camera composition"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Beat-the-clock rules and two camera views (Day 10, lesson 3 of 4).\nToday's build: L_KitTest: your harbour kit assembled into a quay, a pier and a harbour house.\nEarlier today I already did: lesson 1 (Kitbash speed: copies, multi-select and vertex snap); lesson 2 (Level Instances: one house, many copies). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Plan a timed build: biggest shapes first, details last, a screenshot every 30 minutes.\n2. Choose two views that tell the whole story: one along the place at about 2 m high, one wide from above.\n3. Use leading lines (an edge or a railing that leads the eye into the picture) and a level horizon, and save views as bookmarks.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Spot the difference: the tutor describes two versions of the same shot, one with a tilted horizon or a cut-off pier end; I pick the better one and say why, three rounds in a row.\n4. Do-along on today's build (the quay and the pier (in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Write plan_day10.md: the three tiers in your own words and a minute plan (house walls 60, roof 40, railings and steps 40, Level Instance 20, cameras 20, Gold 30, spare 30).\n   - Fly to about 2 m above the pier edge, looking along it. Keep the horizon level and press Ctrl+1.\n   - Fly up to about 20 m at a three-quarter angle (from the side and above), so the quay and the pier show together. Press Ctrl+2.\n   - In each view, check that the pier edge or the railing leads the eye into the picture. Move a little until it does, and save the bookmark again.\n   - Take both screenshots (Win+Shift+S) and write one line on what each shows that the other doesn't.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"How I Find Camera Compositions in Unreal Engine 5\" by Ted Mebratu: https://www.youtube.com/watch?v=KyecOinBgMo\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Self-review: your kit against the rubric", "uk": "Самоперевірка: твій набір за рубрикою"}, "minutes": 40, "goals": [{"en": "Run a kit rubric: grid, pivots, seams, heights, names, collision, Nanite and the Level Instance.", "uk": "Проходити рубрику набору: сітка, півоти, шви, висоти, назви, колізія, Nanite і Level Instance."}, {"en": "Rate your own work honestly as Bronze, Silver or Gold before you hand it in.", "uk": "Чесно оцінювати власну роботу як Бронзу, Срібло чи Золото, перш ніж її здати."}, {"en": "Write kit notes for your future self: what works and what to fix.", "uk": "Писати нотатки про набір для себе в майбутньому: що працює і що виправити."}], "doalong": [{"en": "Write rubric_day10.md with ten yes or no lines: every piece on the grid; pivots by the rule; no gaps at seams; no flickering; deck heights match; names follow the pattern; UCX boxes on every piece; Nanite decisions written; the house is a Level Instance; two bookmarks saved.", "uk": "Напиши rubric_day10.md з десятьма рядками «так» чи «ні»: кожна деталь на сітці; півоти за правилом; немає щілин на швах; немає мерехтіння; висоти настилів збігаються; назви за шаблоном; блоки UCX на кожній деталі; рішення щодо Nanite записано; будинок — це Level Instance; дві закладки збережено."}, {"en": "Check your level line by line, using a screenshot for each line you can.", "uk": "Перевір свій рівень рядок за рядком, підкріплюючи скриншотом кожен рядок, де це можливо."}, {"en": "Fix the worst 'no' first.", "uk": "Спершу виправ найгірше «ні»."}, {"en": "Read your lines to the tutor. For each 'yes' it asks one question; a 'yes' you can't back up becomes a 'no'.", "uk": "Прочитай свої рядки тьютору. На кожне «так» він ставить одне запитання; «так», яке не вдається підтвердити, стає «ні»."}, {"en": "Write kit_notes.md: three things that work and two to fix. Tomorrow you start giving these pieces real surfaces.", "uk": "Напиши kit_notes.md: три речі, що працюють, і дві, які треба виправити. Завтра ти почнеш давати цим деталям справжні поверхні."}], "play": {"en": "Strict art director: the tutor plays a demanding art director and asks me to prove three of my 'yes' lines with screenshots or numbers; each line I prove scores a point.", "uk": "Суворий арт-директор: тьютор грає вимогливого арт-директора і просить мене довести три мої рядки «так» скриншотами або числами; кожен доведений рядок приносить бал."}, "video": {"url": "https://www.youtube.com/watch?v=gf5yQQF-d0I", "title": "What Does Game-Ready Really Mean? / Game Asset Tips for 3D Artists", "channel": "Ali Cgi", "length": "5:24", "search": "what does game ready mean 3d asset checklist", "alt": {"url": "https://www.youtube.com/watch?v=li0AMSd8_C4", "title": "НАВІГАЦІЯ в Blender Українською", "channel": "Stanisslayer"}}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Self-review: your kit against the rubric (Day 10, lesson 4 of 4).\nToday's build: L_KitTest: your harbour kit assembled into a quay, a pier and a harbour house.\nEarlier today I already did: lesson 1 (Kitbash speed: copies, multi-select and vertex snap); lesson 2 (Level Instances: one house, many copies); lesson 3 (Beat-the-clock rules and two camera views). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Run a kit rubric: grid, pivots, seams, heights, names, collision, Nanite and the Level Instance.\n2. Rate your own work honestly as Bronze, Silver or Gold before you hand it in.\n3. Write kit notes for your future self: what works and what to fix.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Strict art director: the tutor plays a demanding art director and asks me to prove three of my 'yes' lines with screenshots or numbers; each line I prove scores a point.\n4. Do-along on today's build (the quay and the pier (in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Write rubric_day10.md with ten yes or no lines: every piece on the grid; pivots by the rule; no gaps at seams; no flickering; deck heights match; names follow the pattern; UCX boxes on every piece; Nanite decisions written; the house is a Level Instance; two bookmarks saved.\n   - Check your level line by line, using a screenshot for each line you can.\n   - Fix the worst 'no' first.\n   - Read your lines to the tutor. For each 'yes' it asks one question; a 'yes' you can't back up becomes a 'no'.\n   - Write kit_notes.md: three things that work and two to fix. Tomorrow you start giving these pieces real surfaces.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"What Does Game-Ready Really Mean? / Game Asset Tips for 3D Artists\" by Ali Cgi: https://www.youtube.com/watch?v=gf5yQQF-d0I\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "plan_day10.md (your tiers and minute plan, with the real times)", "uk": "plan_day10.md (твої рівні й поминутний план, із реальним часом)"}, {"en": "rubric_day10.md (your ten lines, checked) and kit_notes.md", "uk": "rubric_day10.md (твої десять рядків, перевірені) і kit_notes.md"}, {"en": "bronze.png, kit_pier.png and kit_wide.png (Boss evidence)", "uk": "bronze.png, kit_pier.png і kit_wide.png (докази для Дня боса)"}, {"en": "kit_compare.png (your shots beside real harbour photos; Gold)", "uk": "kit_compare.png (твої кадри поруч зі справжніми фото гаваней; Золото)"}, {"en": "before_after_day10.png (the empty level and the finished scene, bookmark 2)", "uk": "before_after_day10.png (порожній рівень і завершена сцена, закладка 2)"}, {"en": "clip_day10.mp4 (60 seconds along the pier and round the house)", "uk": "clip_day10.mp4 (60 секунд уздовж пірса й навколо будинку)"}, {"en": "summary.md", "uk": "summary.md"}], "goal": {"en": "By the end of today you have L_KitTest, a level with a 16 m quay, a 12 m pier with railings and steps, and a small harbour house saved as a Level Instance, all built from your own kit with no gaps.", "uk": "До кінця дня в тебе є L_KitTest — рівень із причалом завдовжки 16 м, пірсом завдовжки 12 м із поруччям і сходами та невеликим портовим будинком, збереженим як Level Instance, і все це зібрано з твого власного набору без щілин."}, "uses": [{"en": "Day 7: SM_QuayEdge_4m and SM_PierDeck_4m", "uk": "День 7: SM_QuayEdge_4m і SM_PierDeck_4m"}, {"en": "Day 8: SM_Railing_2m, SM_RailingPost, SM_Steps and SM_QuayCorner_Out, with Nanite and LODs set", "uk": "День 8: SM_Railing_2m, SM_RailingPost, SM_Steps і SM_QuayCorner_Out з налаштованими Nanite і LOD"}, {"en": "Day 9: the building kit (walls, openings, corner post and roof pieces)", "uk": "День 9: набір для будівель (стіни, прорізи, кутова стійка й деталі даху)"}, {"en": "Day 5: planning a timed build, the comparison sheet and the self-review rubric", "uk": "День 5: планування роботи на час, аркуш порівняння і рубрика самоперевірки"}], "quiz": [{"q": {"en": "You snap four quay pieces and see a 3 cm gap at every seam. What is the most likely cause?", "uk": "Ти з'єднуєш чотири деталі причалу й бачиш щілину 3 см на кожному шві. Яка найімовірніша причина?"}, "options": [{"en": "The material is wrong", "uk": "Неправильний матеріал"}, {"en": "Nanite is off", "uk": "Nanite вимкнено"}, {"en": "Each piece's origin is 3 cm off the pivot corner, or a piece is 3.97 m long", "uk": "Origin кожної деталі зсунуто на 3 см від кута півота, або деталь має 3.97 м завдовжки"}], "answer": 2, "explain": {"en": "Seams only close when lengths are whole and pivots follow the rule. One small error repeats at every seam.", "uk": "Шви закриваються, лише коли довжини цілі, а півоти відповідають правилу. Одна маленька помилка повторюється на кожному шві."}}, {"q": {"en": "Your plan puts the house corner at 7.5 m along X. What do you type into Location X?", "uk": "За твоїм планом кут будинку стоїть на 7.5 м уздовж X. Що ввести в Location X?"}, "options": [{"en": "7.5", "uk": "7.5"}, {"en": "75", "uk": "75"}, {"en": "7500", "uk": "7500"}, {"en": "750", "uk": "750"}], "answer": 3, "explain": {"en": "Metres times 100 gives Unreal's centimetres: 7.5 m is 750.", "uk": "Метри, помножені на 100, дають сантиметри Unreal: 7.5 м — це 750."}}, {"q": {"en": "Two surfaces flicker where the pier deck meets the quay. What is it called?", "uk": "Там, де настил пірса сходиться з причалом, мерехтять дві поверхні. Як це називається?"}, "options": [{"en": "Z-fighting: two faces in exactly the same place", "uk": "Z-fighting: дві грані точно в одному місці"}, {"en": "An LOD swap", "uk": "Заміна LOD"}, {"en": "A redirector", "uk": "Редирект"}], "answer": 0, "explain": {"en": "When two faces share a place, Unreal can't decide which to draw. Move one, or change the piece so they don't overlap.", "uk": "Коли дві грані ділять одне місце, Unreal не може вирішити, яку малювати. Посунь одну або зміни деталь, щоб вони не накладалися."}}, {"q": {"en": "Why does SM_Railing_2m have a post at its start only?", "uk": "Чому SM_Railing_2m має стійку лише на початку?"}, "options": [{"en": "To save triangles", "uk": "Щоб заощадити трикутники"}, {"en": "Unreal can't import two posts", "uk": "Unreal не може імпортувати дві стійки"}, {"en": "So runs chain without double posts; SM_RailingPost ends a run", "uk": "Щоб ряди з'єднувалися без подвійних стійок; SM_RailingPost завершує ряд"}], "answer": 2, "explain": {"en": "One post per piece, plus one end post, gives a post every 2 m with nothing overlapping.", "uk": "Одна стійка на деталь плюс одна кінцева стійка дають стійку кожні 2 м, і ніщо не накладається."}}, {"q": {"en": "Which piece stays out of Nanite under the course rule?", "uk": "Яка деталь лишається поза Nanite за правилом курсу?"}, "options": [{"en": "A glass window pane", "uk": "Скляна шибка вікна"}, {"en": "SM_QuayEdge_4m", "uk": "SM_QuayEdge_4m"}, {"en": "SM_Wall_2m", "uk": "SM_Wall_2m"}, {"en": "SM_PierDeck_4m", "uk": "SM_PierDeck_4m"}], "answer": 0, "explain": {"en": "Nanite is for solid meshes. Glass is see-through, so it is drawn another way.", "uk": "Nanite — для суцільних сіток. Скло прозоре, тож воно малюється інакше."}}, {"q": {"en": "You edit one copy of LI_HarbourHouse, but the other copy doesn't change. Why?", "uk": "Ти редагуєш одну копію LI_HarbourHouse, але інша копія не змінюється. Чому?"}, "options": [{"en": "Level Instances never update", "uk": "Level Instances ніколи не оновлюються"}, {"en": "You didn't Commit the edit", "uk": "Зміну не підтверджено через Commit"}, {"en": "The house has no collision", "uk": "У будинку немає колізії"}], "answer": 1, "explain": {"en": "Edits inside a Level Instance reach every copy only when you Commit them.", "uk": "Зміни всередині Level Instance доходять до кожної копії, лише коли ти підтверджуєш їх через Commit."}}, {"q": {"en": "For a 4 m wide house with a 30-degree roof, about how high is the ridge above the wall tops?", "uk": "Наскільки приблизно гребінь вищий за верх стін у будинку завширшки 4 м із дахом під 30 градусів?"}, "options": [{"en": "0.5 m", "uk": "0.5 м"}, {"en": "2 m", "uk": "2 м"}, {"en": "1.15 m", "uk": "1.15 м"}, {"en": "4 m", "uk": "4 м"}], "answer": 2, "explain": {"en": "Half the width (2 m) times about 0.58 is about 1.15 m.", "uk": "Половина ширини (2 м), помножена приблизно на 0.58, — це близько 1.15 м."}}, {"q": {"en": "The mannequin can't walk through your house's doorway. What do you check first?", "uk": "Манекен не може пройти у дверний проріз твого будинку. Що перевірити спершу?"}, "options": [{"en": "The UCX boxes on SM_Wall_Door: three boxes around the opening, none inside it", "uk": "Блоки UCX на SM_Wall_Door: три блоки навколо прорізу, жодного всередині"}, {"en": "The roof's material", "uk": "Матеріал даху"}, {"en": "The Nanite setting", "uk": "Налаштування Nanite"}, {"en": "The ridge height", "uk": "Висоту гребеня"}], "answer": 0, "explain": {"en": "Collision follows the UCX boxes. A box across the doorway, or one big fallback box because a UCX name didn't match, blocks the door.", "uk": "Колізія йде за блоками UCX. Блок упоперек дверного прорізу або один великий запасний блок (fallback), що з'явився через назву UCX, яка не збіглася, перекриває двері."}}], "weekInfo": {"week": 2, "title": {"en": "Modular kits", "uk": "Модульні набори"}, "goal": {"en": "By Friday you have your own harbour and building kit on a metric grid, and L_KitTest: a quay, a pier and a harbour house built from it in Unreal, with the house saved as a Level Instance.", "uk": "До п'ятниці в тебе є власний набір для гавані й будівель на метричній сітці та L_KitTest: причал, пірс і портовий будинок, зібрані з цього набору в Unreal, а будинок збережено як Level Instance."}, "skills": [{"en": "Modular kit design on a metric grid with consistent pivots", "uk": "Дизайн модульного набору на метричній сітці з узгодженими півотами"}, {"en": "Unreal Engine 5 level assembly: import pipeline, exact placement and snapping", "uk": "Збирання рівня в Unreal Engine 5: пайплайн імпорту, точне розміщення та прив'язка (snapping)"}, {"en": "Nanite versus LOD decisions for real-time performance", "uk": "Вибір між Nanite і LOD заради продуктивності в реальному часі"}, {"en": "Level Instances for reusable building sets", "uk": "Level Instances для наборів будівель, які можна використовувати багато разів"}, {"en": "Content Browser organisation and industry naming conventions (SM_, M_, MI_, T_, L_)", "uk": "Організація Content Browser і галузеві правила назв (SM_, M_, MI_, T_, L_)"}]}, "morning": {"sofar": {"en": "This week you built a harbour kit and a building kit, every piece on one grid with one pivot rule.", "uk": "Цього тижня в тебе з'явилися портовий і будівельний набори: кожна частина на одній сітці й з одним правилом півота."}, "today": {"en": "It is Boss day: you assemble L_KitTest, a quay, a pier and a harbour house from your own kit, and save the house as a Level Instance.", "uk": "Сьогодні День боса: ти збираєш L_KitTest — причал, пірс і портовий будинок із власного набору — і зберігаєш будинок як Level Instance."}, "cheer": {"en": "Start with the Bronze build and save numbered versions; whatever tier you reach, you end the day with a place made only from your own pieces.", "uk": "Почни зі збірки на Бронзу й зберігай пронумеровані версії; хай який рівень ти візьмеш, день завершиться місцем, створеним лише з твоїх власних частин."}, "quote": {"text": {"en": "The various objects of the universe may be constant, at times, but their reciprocal relationships always vary.", "uk": "Окремі предмети всесвіту часом можуть бути незмінними, але їхні взаємні зв'язки змінюються завжди."}, "author": {"en": "Alexander Calder", "uk": "Александер Колдер"}, "source": "https://en.wikiquote.org/wiki/Alexander_Calder"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-10-boss-kit-test", "mapHref": "../../COURSE.html", "prevHref": "../Day-09-building-kit/START-HERE.html", "nextHref": "../Day-11-uvs-on-the-kit/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8 (and Krita for Gold). I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me and don't write code. Keep me moving and make it feel like a game.\n\nToday I build on my own: The harbour house as a Level Instance and the finished scene, on your own and timed (start a 4-hour timer).\nIt's part of: L_KitTest: your harbour kit assembled into a quay, a pier and a harbour house (Course/Day10/L_KitTest in IslandCourse. The house Level Instance comes back when you build your districts from Day 48.).\n\nSpec:\n- L_KitTest saved in Course/Day10 (File > New Level > Basic).\n- A 16 m quay of four SM_QuayEdge_4m with SM_QuayCorner_Out at one end, and a 12 m pier of three SM_PierDeck_4m going out from it.\n- SM_Railing_2m along both sides of the pier, each run finished with SM_RailingPost; SM_Steps against the quay's water face beside the pier.\n- The Floor lowered 1 m to stand in for the water, and a Land block (a basic-shape cube with its top at Z 0) behind the quay. A 4 x 6 m harbour house from the building kit on the land, at least 2 m back from the edge, with its door facing the water, saved as the Level Instance LI_HarbourHouse in Course/Day10.\n- Nothing floating, no gaps and no flickering at any seam; every piece on the 100 cm grid where it can be.\n- Two camera bookmarks and screenshots: kit_pier.png (along the pier at about 2 m high) and kit_wide.png (a three-quarter view from about 20 m up).\n- plan_day10.md and rubric_day10.md (your plan with real times, and your self-review with the tutor).\n\nMy checklist:\n1. Start a 4-hour timer. Check plan_day10.md from lesson 3: Bronze by hour 2, Silver by hour 3, Gold in hour 4. Check: every job has a minute budget, and 30 minutes are spare. (from lesson 3)\n2. Finish the quay and the pier from lesson 1 if needed: four quay pieces, the outer corner and three pier decks. Check: from 2 m away, every seam is clean. (from lesson 1)\n3. Place SM_Steps against the quay's water face beside the pier, joined with vertex snap. Check: the top step sits just below the deck and the flight goes down towards the water. (from lesson 1)\n4. Run SM_Railing_2m along both sides of the pier with vertex snap and finish each run with SM_RailingPost. Check: a post every 2 m, no double posts, and one at each end. (from lesson 1)\n5. Land first: drag a Cube from Place Actors > Shapes, name it Land and type Scale 20, 10, 1 and Location X 800, Y -500, Z -50, so its top is at Z 0. If it overlaps the quay instead of meeting its land side (the side without coping), change Y to 500: land and quay must meet with no gap and no overlap. Then the house shell on the land, at least 2 m back from the quay edge, with the door wall facing the water: walls, door, windows and four corner posts. Bronze check: Ctrl+S and take bronze.png. Check: the land meets the quay deck with no step or flicker, and the house is a closed box of walls with no gaps at the corners. (from day 9, lesson 4)\n6. Roof: the quay deck is at Z 0, so the heights are the same as on Day 9: gables at Z 300, roof panels and the ridge at Z 415. Check: from the side, the roof meets the ridge and rests on the walls. (from day 9, lesson 4)\n7. Select every house piece in the Outliner and right-click > Level > Create Level Instance; save it as LI_HarbourHouse in Course/Day10. Check: clicking any part of the house now selects the whole house. (from lesson 2)\n8. Set bookmark 1 along the pier at about 2 m high and bookmark 2 as a three-quarter view from about 20 m up, with level horizons and an edge leading into each picture. Take kit_pier.png and kit_wide.png. Check: both pictures show the quay, the pier and the house clearly. (from lesson 3)\n9. Silver check: drag the Player Start (find it in the Outliner) onto the land and press End, then press Play and walk the mannequin along the quay, out along the pier and through the house door. Check: the mannequin stops at railings and walls, and fits through the door. (from day 0, lesson 3)\n10. Gold: Alt+drag a second copy of LI_HarbourHouse along the quay and turn it 90 degrees. Then right-click one copy > Level > Edit, swap one plain wall for SM_Wall_Window, and Commit. Check: both houses show the new window. (from lesson 2)\n11. Gold: make kit_compare.png in Krita: kit_pier.png and kit_wide.png beside two of your real harbour photos, with one line under each pair on what matches and what doesn't. Check: two pairs, each with a line. (from day 5, lesson 3)\n12. Self-review: fill in rubric_day10.md line by line with the tutor and fix the worst 'no' first. Write kit_notes.md (three things that work, two to fix). Check: every line has a yes or a no, and the worst fault is fixed. (from lesson 4)\n13. Captures: before_after_day10.png (the empty Basic level and the finished scene from bookmark 2) and a 60-second clip flying along the pier, past the steps and round the house. Save today's clip as clip_day10.mp4. Check: both files are in today's Work folder. (from day 0, lesson 1)\n\nToday is a BOSS build: help me keep time against the tiers below. Tiers:\n- Bronze: the 16 m quay with its corner, the 12 m pier and the house shell (walls, door, windows, corner posts) assembled with no gaps and saved in L_KitTest, within 4 hours.\n- Silver: Bronze, plus railings with end posts, the steps, the house's gables, roof and ridge, the house saved as LI_HarbourHouse, and the two camera screenshots.\n- Gold: Silver, plus a second copy of LI_HarbourHouse turned 90 degrees, one edit inside the Level Instance that updates both copies, and kit_compare.png beside real harbour photos, all within 4 hours.\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me and tell me which tier I reached.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Daria\nDay 10: Boss: L_KitTest, a pier and a harbour house from your own kit. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; boss tier: <bronze / silver / gold / none>; quiz: <score> of 8\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

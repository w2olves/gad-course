<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 22</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

ередини. Центр мапи — точка (0, 0). X зростає на схід, тобто праворуч, а Y — на південь, тобто донизу. Саме так Unreal прочитає мапу в День 26."}, "spec": [{"en": "island_map.kra, 2000 x 2000 px at 1 px = 1 m, and island_map.png exported from it. Its ten layers: sea, guide, land, height, water, districts, roads, route, labels and scale_north.", "uk": "island_map.kra, 2000 × 2000 px у масштабі 1 px = 1 м, і експортований із нього island_map.png. Десять шарів: sea, guide, land, height, water, districts, roads, route, labels і scale_north."}, {"en": "The coast: an island 0.9 to 1.2 km along its longest axis, shaped from your real place and changed into your own. Add headlands (land that sticks out into the sea) and bays (sea that curves into the land). Beaches go only in sheltered bays, cliffs on headlands facing the open sea.", "uk": "Узбережжя. Острів завдовжки 0,9–1,2 км за найдовшою віссю. Форму бери з реального місця, але зміни на свою. Додай миси (виступи суші в море) і затоки (вигини моря в сушу). Пляжі — лише в захищених затоках, скелі — на мисах, відкритих до моря."}, {"en": "Contour lines or shading every 25 m up to the summit, with its height written. The summit is off-centre. Streams run down valleys into bays.", "uk": "Горизонталі або затінення через кожні 25 м аж до верхівки, з підписаною висотою. Верхівка стоїть не в центрі. Струмки течуть долинами в затоки."}, {"en": "Two red 200 x 200 px boxes (200 x 200 m), called districts: the areas you build in full detail later. District 1 is the waterfront, round the harbour. District 2 is your second kind of place, at least 300 m away. Add two or three more named areas, such as a pine ridge.", "uk": "Два червоні квадрати 200 × 200 px (200 × 200 м) — це райони: ділянки, які ти пізніше збудуєш у повній деталізації. Район 1 — набережна навколо гавані. Район 2 — твій другий тип місцевості, щонайменше за 300 м від першого. Додай ще дві-три названі ділянки, наприклад сосновий хребет."}, {"en": "Roads that follow the contours and zigzag where the slope is steep, joining both districts. A 10 x 10 m launch pad near district 1, where every drone flight starts.", "uk": "Дороги йдуть за горизонталями, на крутих схилах — зигзагом, і з'єднують обидва райони. Стартовий майданчик 10 × 10 м біля району 1: звідси починається кожен політ дрона."}, {"en": "The scenic route: a loop of 1.8 to 2.5 km from the launch pad through both districts, drawn with arrows. It passes at least three named landmarks: tall features that tell a pilot where they are.", "uk": "Мальовничий маршрут: петля завдовжки 1,8–2,5 км від стартового майданчика через обидва райони, намальована стрілками. Вона проходить щонайменше повз три названі орієнтири. Орієнтир — помітний високий об'єкт, за яким пілот розуміє, де він."}, {"en": "map_notes.md: the longest axis, the summit height, and each district's use and why it sits there. Add both districts' corners as X and Y in metres, the launch pad's position and the route's length.", "uk": "map_notes.md: найдовша вісь, висота верхівки, призначення кожного району й чому він саме там. Додай кути обох районів як X і Y у метрах, позицію стартового майданчика і довжину маршруту."}], "piece1": "the canvas, the coast and the height (shared with the lessons)", "piece2": {"en": "Districts, roads and the scenic route, on your own", "uk": "Райони, дороги й мальовничий маршрут — самостійно"}, "steps": [{"text": {"en": "Check: the files from today's lessons are in the day work folder (island_map.kra and map_notes.md). Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it. Check: the rulers (View > Show Rulers) read 2000 on both edges, and the scale bar is exactly 100 px.", "uk": "Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: island_map.kra і map_notes.md. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Перевірка: лінійки (View > Show Rulers) по обох краях доходять до 2000, а шкала масштабу має рівно 100 px."}, "lesson": 1}, {"text": {"en": "Put osm_view.png on the guide layer at true scale (Measure tool, then Ctrl+T), at 30 % opacity, locked. Check: the longest axis you measured on Day 21 is as many pixels long as it is metres.", "uk": "Поклади osm_view.png на шар guide у справжньому масштабі (інструмент Measure, потім Ctrl+T). Непрозорість — 30 %, шар заблоковано. Перевірка: найдовша вісь, виміряна в День 21, має стільки пікселів, скільки в ній метрів."}, "lesson": 1}, {"text": {"en": "Paint the land: your island 0.9 to 1.2 km across, shaped from the guide and changed into your own. Check: the Measure tool reads 900 to 1200 px along the longest axis.", "uk": "Намалюй сушу: острів завширшки 0,9–1,2 км, за формою шару guide, але перероблений на твій власний. Перевірка: інструмент Measure показує 900–1200 px уздовж найдовшої осі."}, "lesson": 2}, {"text": {"en": "Shape the coast: two or three bays and two headlands. Mark beaches in sheltered bays and cliffs on headlands that face the open sea. Check: no straight stretch is longer than about 50 px, and every beach sits inside a bay.", "uk": "Сформуй узбережжя: дві-три затоки і два миси. Познач пляжі в захищених затоках і скелі на мисах, відкритих до моря. Перевірка: жодна пряма ділянка не довша за 50 px, і кожен пляж лежить у затоці."}, "lesson": 2}, {"text": {"en": "Height: contours or shading every 25 m up to an off-centre summit, with its height written. Check: the lines bunch where you want steep ground and spread out where the districts need flat ground.", "uk": "Висоти: горизонталі або затінення через кожні 25 м аж до верхівки, яка стоїть не в центрі. Підпиши її висоту. Перевірка: лінії згущуються там, де потрібен крутий схил, і розходяться там, де районам потрібна рівна земля."}, "lesson": 2}, {"text": {"en": "Draw streams from the hills down into your bays, and a small lake if you want one. Check: no stream climbs across a contour.", "uk": "Намалюй струмки від пагорбів донизу до заток і, якщо хочеш, невелике озеро. Перевірка: жоден струмок не піднімається через горизонталь."}, "lesson": 2}, {"text": {"en": "District 1: a red 200 x 200 px box round the harbour. Check: it holds the quay, some water, the row of buildings and a road.", "uk": "Район 1: червоний квадрат 200 × 200 px навколо гавані. Перевірка: у ньому є причал, трохи води, ряд будівель і дорога."}, "lesson": 3}, {"text": {"en": "District 2: choose its kind of place, write why, and draw its red box where that kind of place really grows. Check: it is at least 300 m from district 1, and your Day 21 photos show the same kind of place.", "uk": "Район 2: вибери тип місцевості, запиши чому і намалюй червоний квадрат там, де такі місця виникають насправді. Перевірка: він щонайменше за 300 м від району 1, а на фото з Дня 21 є такий самий тип місцевості."}, "lesson": 3}, {"text": {"en": "Roads: the main road between the districts and one smaller track, both following the contours. Check: where contours bunch, your road zigzags.", "uk": "Дороги: головна дорога між районами й одна менша стежка, обидві за горизонталями. Перевірка: там, де горизонталі згущуються, дорога йде зигзагом."}, "lesson": 4}, {"text": {"en": "Draw the launch pad and the scenic route: a loop with arrows and three named landmarks. Check: the measured total is 1800 to 2500 m, and the loop passes through both red boxes.", "uk": "Намалюй стартовий майданчик і мальовничий маршрут: петлю зі стрілками й трьома названими орієнтирами. Перевірка: виміряна довжина — 1800–2500 м, і петля проходить через обидва червоні квадрати."}, "lesson": 4}, {"text": {"en": "Write map_notes.md: the longest axis, the summit height, each district's use and why, the corners of both boxes, the launch pad and the route length. Check: every position is written as X and Y in metres from the centre.", "uk": "Заповни map_notes.md: найдовша вісь, висота верхівки, призначення кожного району й чому він там, кути обох квадратів, стартовий майданчик і довжина маршруту. Перевірка: кожну позицію записано як X і Y у метрах від центру."}, "lesson": 3}, {"text": {"en": "Save island_map.kra (Ctrl+S). Hide the guide layer and export island_map.png (File > Export). Check: island_map.png reopens in Krita at 2000 x 2000 px and shows both red boxes and the route.", "uk": "Збережи island_map.kra (Ctrl+S). Сховай шар guide і експортуй island_map.png (File > Export). Перевірка: island_map.png знову відкривається в Krita з розміром 2000 × 2000 px, на ньому обидва червоні квадрати й маршрут."}, "lesson": 1}, {"text": {"en": "Report and hand-in: click Copy the day report at the bottom of the page, paste it into a new chat and answer. Open summary.md in Notepad, press Ctrl+End, paste the answer and press Ctrl+S. Then drag the files on the Hand in list into your hand-in folder. Check: every name shows in the folder, each with a size.", "uk": "Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: кожна назва зі списку є в папці, у кожної є розмір."}, "lesson": "D0.1"}]}, "lessons": [{"title": {"en": "A map canvas at real scale", "uk": "Полотно для мапи в реальному масштабі"}, "minutes": 40, "goals": [{"en": "Set up a Krita canvas where 1 pixel is 1 metre: 2000 x 2000 px for a 2 x 2 km square, north up.", "uk": "Налаштовувати полотно Krita, де 1 піксель — це 1 метр: 2000 × 2000 px для квадрата 2 × 2 км, північ угорі."}, {"en": "Use map coordinates: numbers that say where a point is. The centre is (0, 0), X grows east and Y grows south. So X = pixel across - 1000, and Y = pixel down - 1000.", "uk": "Користуватися координатами мапи — числами, які кажуть, де стоїть точка. Центр — (0, 0), X зростає на схід, а Y — на південь. Отже, X = піксель по горизонталі − 1000, а Y = піксель по вертикалі − 1000."}, {"en": "Scale a guide picture to your map's scale from one length you measured.", "uk": "Масштабувати допоміжне зображення до масштабу мапи за однією виміряною довжиною."}], "doalong": [{"en": "In Krita: File > New, Width 2000 and Height 2000 pixels, then Create. Save it in the day work folder as island_map.kra. You should see a large white square that stands for 2 x 2 km.", "uk": "У Krita: File > New, Width 2000 і Height 2000 пікселів, потім Create. Збережи файл у робочій папці дня як island_map.kra. Має вийти великий білий квадрат — це 2 × 2 км."}, {"en": "In the Layers docker (bottom right; Settings > Dockers > Layers if it's hidden), click + to add layers. Double-click each name to rename it: sea, guide, land, height, water, districts, roads, route, labels, scale_north. You should see ten named layers.", "uk": "На панелі Layers (унизу праворуч; якщо її не видно — Settings > Dockers > Layers) клацай +, щоб додати шари. Двічі клацни кожну назву й перейменуй: sea, guide, land, height, water, districts, roads, route, labels, scale_north. Має вийти десять названих шарів."}, {"en": "Fill the sea layer pale blue with the Fill tool (the paint bucket). On scale_north, hold Shift and draw a 100 px line, and write '100 m' under it. Draw an N arrow at the top right. You should see a scale bar and a north arrow.", "uk": "Залий шар sea блідо-блакитним інструментом Fill (відро з фарбою). На шарі scale_north утримуй Shift і проведи лінію 100 px, а під нею напиши «100 м». Угорі праворуч намалюй стрілку N. Має вийти: є шкала масштабу і стрілка півночі."}, {"en": "Choose View > Show Rulers (Ctrl+R picks a selection tool in Krita). Find 1000 on both rulers: that point is (0, 0). A point at 1300 across and 700 down is X 300, Y -300, east and north of the centre. You should be able to read any point in metres.", "uk": "Вибери View > Show Rulers (Ctrl+R у Krita вмикає інструмент виділення, тож краще через меню). Знайди 1000 на обох лінійках: ця точка — (0, 0). Точка 1300 по горизонталі і 700 по вертикалі — це X 300, Y −300, тобто на схід і на північ від центру. Тепер будь-яку точку можна прочитати в метрах."}, {"en": "Click the guide layer and drag osm_view.png from File Explorer onto the canvas; choose Insert as New Layer if Krita asks. Delete the empty guide layer and rename the new one guide. You should see your real place on the map.", "uk": "Клацни шар guide і перетягни osm_view.png із Провідника (File Explorer) на полотно. Якщо Krita питає, вибери Insert as New Layer. Видали порожній шар guide, а новий перейменуй на guide. Має вийти: на мапі твоє реальне місце."}, {"en": "Measure your place's longest axis on the guide in pixels. Press Ctrl+T and type the scale in Tool Options: metres ÷ pixels x 100, as a percentage. Set the layer's opacity to 30 % and click its padlock. You should see the longest axis as many pixels long as it is metres.", "uk": "Виміряй на шарі guide найдовшу вісь місця в пікселях. Натисни Ctrl+T і введи масштаб у Tool Options у відсотках: метри ÷ пікселі × 100. Постав непрозорість шару 30 % і клацни його замочок. Має вийти: у найдовшій осі стільки пікселів, скільки метрів."}], "play": {"en": "Coordinate quick-fire: the tutor reads me ten pixel positions; I give each as X and Y in metres within 10 seconds. A wrong sign on Y costs double.", "uk": "Бліц координат: тьютор зачитує мені десять позицій у пікселях. Я називаю кожну як X і Y у метрах за 10 секунд. Неправильний знак у Y коштує подвійно."}, "video": {"url": "https://www.youtube.com/watch?v=W0d6635Rits", "title": "Unreal Engine Co-ordinates Explained", "channel": "HyperDev", "length": "3:24", "search": "unreal engine coordinates explained units"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Полотно для мапи в реальному масштабі (Day 22, lesson 1 of 4). Today's build: island_map.kra і island_map.png: твій острів, намальований північчю вгору в масштабі 1 px = 1 м на квадраті моря 2 × 2 км, і map_notes.md.\nWhat I already know: День 21: osm_view.png із вимірами, references.md і твої ключові фото; День 4: малювання в масштабі на шарах Krita.\n\nBy the end of this lesson I can:\n1. Налаштовувати полотно Krita, де 1 піксель — це 1 метр: 2000 × 2000 px для квадрата 2 × 2 км, північ угорі.\n2. Користуватися координатами мапи — числами, які кажуть, де стоїть точка. Центр — (0, 0), X зростає на схід, а Y — на південь. Отже, X = піксель по горизонталі − 1000, а Y = піксель по вертикалі − 1000.\n3. Масштабувати допоміжне зображення до масштабу мапи за однією виміряною довжиною.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: У тебе є одне справжнє місце на узбережжі, виміряне на OpenStreetMap, і 15 чи більше фото-референсів із рядками авторства. Today: Сьогодні ти малюєш island_map.png у масштабі — 2 × 2 км, 1 піксель = 1 метр — з узбережжям, висотами, дорогами, мальовничим маршрутом і двома районами. One encouraging line: Мапа виростає з маленьких рішень, тож спершу намалюй узбережжя, а решта піде за ним; будь-яку лінію можна покращити згодом.); 2 lines on why today matters and where it comes back, in plain words (from this: Студії малюють мапу ще до того, як хтось торкнеться рельєфу. Мапа закріплює масштаб, узбережжя, райони, дороги й маршрут прольоту, тож уся подальша робота узгоджується. У День 26 цей малюнок стане твоїм рельєфом: що намалюєш сьогодні, там і буде збудовано. It comes back: Завтра ти виріжеш з island_map.kra плани обох районів. У День 26 island_map.png стане твоїм рельєфом, у День 31 його дороги стануть справжніми дорогами, а в День 57 мальовничий маршрут стане твоїм фінальним прольотом.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-22-island-map-to-scale exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (полотно, узбережжя і висоти (разом з уроками)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. У Krita: File > New, Width 2000 і Height 2000 пікселів, потім Create. Збережи файл у робочій папці дня як island_map.kra. Має вийти великий білий квадрат — це 2 × 2 км.\n   2. На панелі Layers (унизу праворуч; якщо її не видно — Settings > Dockers > Layers) клацай +, щоб додати шари. Двічі клацни кожну назву й перейменуй: sea, guide, land, height, water, districts, roads, route, labels, scale_north. Має вийти тр. На ній узбережжя, висоти, дороги, мальовничий маршрут і два червоні райони."}, "uses": [{"en": "Day 21: osm_view.png with its measurements, references.md and your hero photos", "uk": "День 21: osm_view.png із вимірами, references.md і твої ключові фото"}, {"en": "Day 4: drawing to scale on Krita layers", "uk": "День 4: малювання в масштабі на шарах Krita"}], "quiz": [{"q": {"en": "On your 2000 x 2000 px map, a lighthouse sits at pixel 1300 across and 700 down. Where is it in map metres?", "uk": "На твоїй мапі 2000 × 2000 px маяк стоїть на пікселі 1300 по горизонталі і 700 по вертикалі. Де він у метрах мапи?"}, "options": [{"en": "X 300, Y -300 (east and north of the centre)", "uk": "X 300, Y −300 (на схід і на північ від центру)"}, {"en": "X -300, Y 300 (west and south of the centre)", "uk": "X −300, Y 300 (на захід і на південь від центру)"}, {"en": "X 1300, Y 700", "uk": "X 1300, Y 700"}, {"en": "X 300, Y 300", "uk": "X 300, Y 300"}], "answer": 0, "explain": {"en": "Subtract 1000 from each pixel number. Y grows south, so a negative Y means north of the centre.", "uk": "Відніми 1000 від кожного числа пікселів. Y зростає на південь, тож від'ємний Y означає північ від центру."}}, {"q": {"en": "You drew a wide sandy beach on a headland that faces the open sea. What would a reviewer say?", "uk": "На твоїй мапі широкий піщаний пляж лежить на мисі, зверненому до відкритого моря. Що скаже рецензент?"}, "options": [{"en": "It's fine: beaches can go anywhere.", "uk": "Усе гаразд: пляжі можуть бути будь-де."}, {"en": "Beaches always need a river nearby.", "uk": "Пляжам завжди потрібна річка поруч."}, {"en": "Waves drop sand in sheltered bays; an exposed headland would have cliffs or rock.", "uk": "Хвилі залишають пісок у захищених затоках. На відкритому мисі були б скелі або камінь."}, {"en": "Make the beach whiter so it reads better.", "uk": "Зроби пляж білішим, щоб він краще читався."}], "answer": 2, "explain": {"en": "Sand settles where the water is calm. Open-sea headlands take the full force of the waves, so they are rock.", "uk": "Пісок осідає там, де вода спокійна. Миси, відкриті до моря, приймають повну силу хвиль, тому там камінь."}}, {"q": {"en": "Why does your main road zigzag up the steep hill?", "uk": "Чому твоя головна дорога петляє зигзагом угору крутим пагорбом?"}, "options": [{"en": "Zigzags look more interesting from the drone.", "uk": "Зигзаги цікавіше виглядають із дрона."}, {"en": "Unreal can't build straight roads.", "uk": "Unreal не вміє будувати прямі дороги."}, {"en": "To make the scenic route longer.", "uk": "Щоб мальовничий маршрут став довшим."}, {"en": "A road straight up a steep slope would be too steep to drive, so real roads follow the contours and switch back.", "uk": "Дорога прямо вгору крутим схилом була б надто крутою для їзди, тож справжні дороги йдуть за горизонталями і повертають серпантином."}], "answer": 3, "explain": {"en": "Roads keep a gentle climb. Where contours bunch, the slope is steep, so the road turns back and forth.", "uk": "Дороги зберігають пологий підйом. Де горизонталі згущуються, схил крутий, тому дорога повертає туди й назад."}}, {"q": {"en": "What does a contour line on your map show?", "uk": "Що показує горизонталь на твоїй мапі?"}, "options": [{"en": "The edge of a district.", "uk": "Межу району."}, {"en": "A line joining points at the same height.", "uk": "Лінію, що з'єднує точки однакової висоти."}, {"en": "A road for the drone.", "uk": "Дорогу для дрона."}, {"en": "Where the sea is 25 m deep.", "uk": "Де глибина моря 25 м."}], "answer": 1, "explain": {"en": "Each contour joins points of equal height. Lines close together mean steep ground; lines far apart mean gentle ground.", "uk": "Кожна горизонталь з'єднує точки однакової висоти. Густі лінії означають крутий схил, рідкі — пологий."}}, {"q": {"en": "Your scenic route measures 600 m. Why is that a problem?", "uk": "Твій мальовничий маршрут має 600 м. Чому це проблема?"}, "options": [{"en": "Routes must be exactly 1 km.", "uk": "Маршрути мають бути рівно 1 км."}, {"en": "It is too short for a 2-minute flight through both districts; aim for about 2 km.", "uk": "Він закороткий для 2-хвилинного прольоту через обидва райони. Ціль — близько 2 км."}, {"en": "It isn't: shorter routes are always better.", "uk": "Це не проблема: коротші маршрути завжди кращі."}], "answer": 1, "explain": {"en": "The final video is about 2 minutes at drone speed, which needs about 2 km. A 600 m route is over in 35 seconds.", "uk": "Фінальне відео триває близько 2 хвилин на швидкості дрона, а для цього потрібно близько 2 км. Маршрут на 600 м закінчується за 35 секунд."}}], "weekInfo": {"week": 5, "title": {"en": "Your real place and your island on paper", "uk": "Твоє реальне місце і твій острів на папері"}, "goal": {"en": "By Friday you have a complete planning pack: one real coastal place with 15 credited photos, island_map.png to scale with two red 200 x 200 m districts and the scenic route, two counted plot plans, two needs lists, reviewed free packs, and the Electric Dreams download under way.", "uk": "До п'ятниці в тебе є повний пакет планування: одне реальне прибережне місце з 15 фото з рядками авторства; island_map.png у масштабі з двома червоними районами 200 × 200 м і мальовничим маршрутом; два плани ділянок із підрахованими об'єктами; два списки потреб; оглянуті безкоштовні паки. Завантаження Electric Dreams уже триває."}, "skills": [{"en": "Reference research and image licensing (Creative Commons) for production art", "uk": "Пошук референсів і ліцензування зображень (Creative Commons) для продакшн-арту"}, {"en": "Scaled world maps from OpenStreetMap data, with districts, roads and flight routes", "uk": "Мапи світу в масштабі за даними OpenStreetMap: райони, дороги й маршрути польотів"}, {"en": "Plot plans with item counts, camera positions and drone lanes for level layout", "uk": "Плани ділянок із підрахунком об'єктів, позиціями камер і польотними коридорами для планування рівня"}, {"en": "Asset sourcing: needs lists, Fab licence checks and best-pieces reviews", "uk": "Пошук асетів: списки потреб, перевірка ліцензій на Fab і огляд найкращих деталей паків"}, {"en": "Pre-production review: consistency checks and a one-page planning board", "uk": "Перевірка планів перед виробництвом (препродакшн): узгоджені числа й аркуш планування на одну сторінку"}]}, "morning": {"sofar": {"en": "You have one real coastal place, measured on OpenStreetMap, with 15 or more credited reference photos.", "uk": "У тебе є одне справжнє місце на узбережжі, виміряне на OpenStreetMap, і 15 чи більше фото-референсів із рядками авторства."}, "today": {"en": "You draw island_map.png to scale, 2 x 2 km at 1 pixel = 1 metre, with your coast, heights, roads, the scenic route and two districts.", "uk": "Сьогодні ти малюєш island_map.png у масштабі — 2 × 2 км, 1 піксель = 1 метр — з узбережжям, висотами, дорогами, мальовничим маршрутом і двома районами."}, "cheer": {"en": "A map grows from small decisions, so draw the coast first and let the rest follow; any line can be improved later.", "uk": "Мапа виростає з маленьких рішень, тож спершу намалюй узбережжя, а решта піде за ним; будь-яку лінію можна покращити згодом."}, "quote": {"text": {"en": "It is not down on any map; true places never are.", "uk": "Його немає на жодній мапі; справжніх місць там не буває ніколи."}, "author": {"en": "Herman Melville", "uk": "Герман Мелвілл"}, "source": "https://en.wikiquote.org/wiki/Moby-Dick"}}, "hasAssets": false, "workPath": "Work\\Assignment\\Day-22-island-map-to-scale", "mapHref": "../../COURSE.html", "prevHref": "../Day-21-real-place-references/START-HERE.html", "nextHref": "../Day-23-two-plot-plans/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Krita and a web browser. I am a beginner on Day 22. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me and don't write code.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: Райони, дороги й мальовничий маршрут — самостійно.\nIt's part of: island_map.kra і island_map.png: твій острів, намальований північчю вгору в масштабі 1 px = 1 м на квадраті моря 2 × 2 км, і map_notes.md (Квадрат моря 2 × 2 км, північ угорі, а твій острів завширшки 0,9–1,2 км — біля середини. Центр мапи — точка (0, 0). X зростає на схід, тобто праворуч, а Y — на південь, тобто донизу. Саме так Unreal прочитає мапу в День 26.).\nWhy it matters: Студії малюють мапу ще до того, як хтось торкнеться рельєфу. Мапа закріплює масштаб, узбережжя, райони, дороги й маршрут прольоту, тож уся подальша робота узгоджується. У День 26 цей малюнок стане твоїм рельєфом: що намалюєш сьогодні, там і буде збудовано. It comes back: Завтра ти виріжеш з island_map.kra плани обох районів. У День 26 island_map.png стане твоїм рельєфом, у День 31 його дороги стануть справжніми дорогами, а в День 57 мальовничий маршрут стане твоїм фінальним прольотом.\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-22-island-map-to-scale (on the drive I chose on Day 0).\nWhat I already know: День 21: osm_view.png із вимірами, references.md і твої ключові фото; День 4: малювання в масштабі на шарах Krita; today's lessons: Полотно для мапи в реальному масштабі; Правдоподібне узбережжя і висоти; Райони там, де вони виникають насправді; Дороги й мальовничий маршрут. Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- island_map.kra, 2000 × 2000 px у масштабі 1 px = 1 м, і експортований із нього island_map.png. Десять шарів: sea, guide, land, height, water, districts, roads, route, labels і scale_north.\n- Узбережжя. Острів завдовжки 0,9–1,2 км за найдовшою віссю. Форму бери з реального місця, але зміни на свою. Додай миси (виступи суші в море) і затоки (вигини моря в сушу). Пляжі — лише в захищених затоках, скелі — на мисах, відкритих до моря.\n- Горизонталі або затінення через кожні 25 м аж до верхівки, з підписаною висотою. Верхівка стоїть не в центрі. Струмки течуть долинами в затоки.\n- Два червоні квадрати 200 × 200 px (200 × 200 м) — це райони: ділянки, які ти пізніше збудуєш у повній деталізації. Район 1 — набережна навколо гавані. Район 2 — твій другий тип місцевості, щонайменше за 300 м від першого. Додай ще дві-три названі ділянки, наприклад сосновий хребет.\n- Дороги йдуть за горизонталями, на крутих схилах — зигзагом, і з'єднують обидва райони. Стартовий майданчик 10 × 10 м біля району 1: звідси починається кожен політ дрона.\n- Мальовничий маршрут: петля завдовжки 1,8–2,5 км від стартового майданчика через обидва райони, намальована стрілками. Вона проходить щонайменше повз три названі орієнтири. Орієнтир — помітний високий об'єкт, за яким пілот розуміє, де він.\n- map_notes.md: найдовша вісь, висота верхівки, призначення кожного району й чому він саме там. Додай кути обох районів як X і Y у метрах, позицію стартового майданчика і довжину маршруту.\n\nMy checklist (the same numbers show on my course page):\n1. Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: island_map.kra і map_notes.md. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Перевірка: лінійки (View > Show Rulers) по обох краях доходять до 2000, а шкала масштабу має рівно 100 px. (from lesson 1)\n2. Поклади osm_view.png на шар guide у справжньому масштабі (інструмент Measure, потім Ctrl+T). Непрозорість — 30 %, шар заблоковано. Перевірка: найдовша вісь, виміряна в День 21, має стільки пікселів, скільки в ній метрів. (from lesson 1)\n3. Намалюй сушу: острів завширшки 0,9–1,2 км, за формою шару guide, але перероблений на твій власний. Перевірка: інструмент Measure показує 900–1200 px уздовж найдовшої осі. (from lesson 2)\n4. Сформуй узбережжя: дві-три затоки і два миси. Познач пляжі в захищених затоках і скелі на мисах, відкритих до моря. Перевірка: жодна пряма ділянка не довша за 50 px, і кожен пляж лежить у затоці. (from lesson 2)\n5. Висоти: горизонталі або затінення через кожні 25 м аж до верхівки, яка стоїть не в центрі. Підпиши її висоту. Перевірка: лінії згущуються там, де потрібен крутий схил, і розходяться там, де районам потрібна рівна земля. (from lesson 2)\n6. Намалюй струмки від пагорбів донизу до заток і, якщо хочеш, невелике озеро. Перевірка: жоден струмок не піднімається через горизонталь. (from lesson 2)\n7. Район 1: червоний квадрат 200 × 200 px навколо гавані. Перевірка: у ньому є причал, трохи води, ряд будівель і дорога. (from lesson 3)\n8. Район 2: вибери тип місцевості, запиши чому і намалюй червоний квадрат там, де такі місця виникають насправді. Перевірка: він щонайменше за 300 м від району 1, а на фото з Дня 21 є такий самий тип місцевості. (from lesson 3)\n9. Дороги: головна дорога між районами й одна менша стежка, обидві за горизонталями. Перевірка: там, де горизонталі згущуються, дорога йде зигзагом. (from lesson 4)\n10. Намалюй стартовий майданчик і мальовничий маршрут: петлю зі стрілками й трьома названими орієнтирами. Перевірка: виміряна довжина — 1800–2500 м, і петля проходить через обидва червоні квадрати. (from lesson 4)\n11. Заповни map_notes.md: найдовша вісь, висота верхівки, призначення кожного району й чому він там, кути обох квадратів, стартовий майданчик і довжина маршруту. Перевірка: кожну позицію записано як X і Y у метрах від центру. (from lesson 3)\n12. Збережи island_map.kra (Ctrl+S). Сховай шар guide і експортуй island_map.png (File > Export). Перевірка: island_map.png знову відкривається в Krita з розміром 2000 × 2000 px, на ньому обидва червоні квадрати й маршрут. (from lesson 1)\n13. Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: кожна назва зі списку є в папці, у кожної є розмір. (from day 0, lesson 1)\n\nHow to help: ask which step number I'm on, then give me only the next step: the exact clicks and what I should see. When I send a screenshot, compare it with my reference, my sizes and the spec, and name one thing to fix at a time.\nCheck every save and export by reopening it before we move on:\n- a .md or .txt: open it with Notepad; the text is there, and the name doesn't end in .md.txt\nWhen I write \"готово\", and in any case before the day ends, check with me one item at a time (yes/no): each spec point, then each file on my hand-in list, ready in my day work folder (skip summary.md: the day report writes it next):\n1. island_map.kra (мапа з шарами) (→ День 23)\n2. map_notes.md (нотатки до мапи) (→ День 23)\n3. island_map.png, 2000 × 2000 px (→ День 26)\nFinish with a short list of anything missing, and one line on where this work comes back and what it will look like there. Then tell me the order for the end of the day: first the day report (the Copy the day report button at the bottom of my course page) into summary.md, and only then hand in all the files on the list, summary.md too.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; see-why-fix note = нотатка «бачу, чому, як виправити»; checklist = чек-лист; credits line = рядок авторства; reference photo / hero photo = фото-референс / ключове фото; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; File Explorer = Провідник; vertex / edge / face = вершина / ребро / грань; world origin / 3D cursor = центр світу / 3D-курсор; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; loop cut / edge loop = петлевий розріз (Loop Cut) / петля ребер; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); UV unwrap / UV layout / seam / UV island = розгортка / розкладка / шов / UV-острівець; asset / prop / actor = асет / пропс / актор; collision / UCX collision box = колізія / блок UCX; material slot / node / pin = слот матеріалу / вузол / вхід; volume (PCG Volume, Post Pro function setLang(l){lang=l;try{localStorage.setItem('devteam:lang',lang)}catch(e){};render()}
function toggleLang(){setLang(lang==='uk'?'en':'uk')}
/* keep open sections and keyboard focus across re-renders */
const openD=new Set();
function tg(e){if(e.open)openD.add(e.id);else openD.delete(e.id)}
const op=id=>openD.has(id)?' open':'';
function render(){const ae=document.activeElement,fid=ae&&(ae.id||(ae.getAttribute('data-th')?'th-'+ae.getAttribute('data-th'):ae.getAttribute('lang')&&ae.closest('.seg')?'lg-'+ae.getAttribute('lang'):''));
 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);
 const b=D.build,P=Math.round(prog()*100);
 document.getElementById('top').innerHTML='<div class="topin glass"><a class="maplink" href="'+esc(D.mapHref)+'">'+kn('map')+u('map')+'</a><div class="crumb"><b>'+esc(x(D.learnerName))+'</b><span>'+u('week')+' '+D.week+'</span><span>'+u('day')+' '+D.day+' '+u('of')+' '+D.total+'</span></div>'+controls(lang,'setLang')+'</div><div class="tline"><i style="width:'+P+'%"></i></div>';
 const state=w=>w<D.week?'b':w===D.week?'n':'p';
 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 let wk='';if(D.weekInfo){const w=D.weekInfo;wk='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}
 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p>'+(b.next?'<div class="back well">'+kn('arrow')+'<div><b>'+u('comes')+'</b><br>'+lk(x(b.next))+'</div></div>':'')+'<div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.assetFiles&&D.assetFiles.length?'<p class="files">'+ic('folder')+'<span>'+u('filesL')+' '+D.assetFiles.map(f=>'<a href="assets/'+encodeURIComponent(f)+'" target="_blank" rel="noopener">'+esc(f)+'</a>').join(', ')+'</span></p>':D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+=handinCard();h+=beforeCard();
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div><label class="rcpt" for="r'+i+'"><span class="eyebrow">'+u('rcpt')+'</span><textarea id="r'+i+'" rows="2" placeholder="'+esc(u('rcptPh'))+'" oninput="st.r'+i+'=this.value;save()">'+esc(st['r'+i]||'')+'</textarea></label>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+hList()+chkList()+(hasClip?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<h3>1 · '+u('copyR')+'</h3><p class="muted">'+u('report')+'</p><div class="row"><button class="btn ghost" onclick="cp(reportText())">'+ic('copy')+u('copyR')+'</button></div><h3>2 · '+u('ship')+'</h3>'+hf()+'<p class="muted" style="margin:12px 0 0">'+u('hNote')+'</p></section>';
 h+=qCard();h+=wk;
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();
</script>

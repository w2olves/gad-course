<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 28</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

<script id="data" type="application/json">{"learner": "ib-karina-648be559", "learnerName": {"en": "Karina", "uk": "Каріна"}, "day": 28, "week": 6, "total": 60, "title": {"en": "Coast and cliffs, and an auto-landscape material", "uk": "Узбережжя й скелі та автоматичний матеріал ландшафту"}, "theme": {"en": "Week 6: Terrain and water", "uk": "Тиждень 6: Рельєф і вода"}, "build": {"item": {"en": "Your island's coast, with a rock-covered cliff of about 150 m, a rocky shore and a beach, and the whole landscape painted by MI_Island_Auto", "uk": "Узбережжя острова зі скелею близько 150 м, вкритою камінням, скелястим берегом і пляжем; увесь ландшафт пофарбовано інстансом MI_Island_Auto"}, "why": {"en": "A landscape has one height per point, so it can't overhang, and on steep faces its textures stretch into smears. Real coasts are rock where the sea attacks and sand only in sheltered bays. Open-world studios paint the whole island with an auto-material and let rock meshes take over where the ground gets too steep.", "uk": "Ландшафт має одну висоту на точку, тож не може нависати, а на крутих гранях його текстури розмазуються. Справжні береги кам'яні там, де б'є море, а піщані — лише в захищених затоках. Студії відкритих світів фарбують увесь острів автоматичним матеріалом, а там, де земля надто крута, ставлять меші каміння."}, "next": {"en": "MI_Island_Auto paints every shot of Friday's Boss. On Day 39 your plants grow on its grass and keep off its rock, and your rock pack returns tomorrow round the cascade.", "uk": "MI_Island_Auto фарбує кожен кадр п'ятничного Дня боса. У День 39 рослини ростуть на його траві й оминають його камінь. А пак каміння повернеться завтра навколо каскаду."}, "where": {"en": "L_Island: the whole landscape for the material. For the coast: one cliff stretch of about 150 m on a headland, a rocky shore, and a beach in a sheltered bay, as your map draws them.", "uk": "L_Island: увесь ландшафт — для матеріалу. Для узбережжя — одна ділянка скель близько 150 м на мисі, скелястий берег і пляж у захищеній затоці, як на мапі."}, "spec": [{"en": "The coast types your map shows: at least one beach in a sheltered bay (under 10 degrees), one rocky shore and one cliff stretch of about 150 m.", "uk": "Типи берега, які показує мапа: щонайменше один пляж у захищеній затоці (менше 10 градусів), один скелястий берег і одна ділянка скель близько 150 м."}, {"en": "The cliff stretch: the terrain steepened for the big shape, then covered with rock meshes from your Day 24 rock pack. The rocks overlap and sink 1 to 3 m, and no smeared landscape face shows from 30 m.", "uk": "Ділянка скель: рельєф зроблено крутішим для великої форми, а потім вкрито мешами з пака каміння з Дня 24. Камені заходять один на один і втоплені на 1–3 м. З 30 м не видно жодної розмазаної грані ландшафту."}, {"en": "No straight lines in nature: rock pieces turned and scaled 0.7 to 1.4, so no two neighbours repeat. Foot lines and cliff tops are broken, and boulders sit in groups, never in rows.", "uk": "У природі немає прямих ліній: камені повернуто й масштабовано від 0,7 до 1,4, тож сусіди не повторюються. Лінії підніжжя й верху скель нерівні, а валуни лежать групами, ніколи рядами."}, {"en": "Rock budget: about 30 pieces at most on the cliff stretch, all with Nanite on. Older Unreal (4.27) or weak PC: no Nanite there, so keep the pack's LODs and use 20 pieces at most. Nanite is Unreal's system that draws very detailed meshes cheaply.", "uk": "Бюджет каміння: не більше 30 деталей на ділянці скель, у всіх увімкнено Nanite. Старіший Unreal (4.27) або слабкий ПК: Nanite там немає, тож лиши LOD пака й постав не більше 20 деталей. Nanite — система Unreal, яка дешево малює дуже деталізовані меші."}, {"en": "Content/Island/Textures holds your rock, grass and sand colour textures. Content/Island/Materials holds M_Island_Auto: rock on steep slopes and grass on gentle ones (a slope mask), sand on low flat ground (a height mask). Each layer is a texture times a colour parameter, with one Tiling parameter.", "uk": "У Content/Island/Textures — текстури кольору каменю, трави й піску. У Content/Island/Materials — M_Island_Auto: камінь на крутих схилах, трава на пологих (маска схилу), пісок на низькій рівній землі (маска висоти). Кожен шар — це текстура, помножена на параметр кольору, з одним параметром Tiling."}, {"en": "MI_Island_Auto set as the landscape's material, its colours matched to your photo side by side, and its tiling checked beside the mannequin.", "uk": "MI_Island_Auto призначено матеріалом ландшафту, його кольори підібрано за твоїм фото поруч, а тайлінг перевірено біля манекена."}], "piece1": "the cliff stretch and M_Island_Auto's slope mask (shared with the lessons)", "piece2": {"en": "The rocky shore, the beach, sand by height and the colour match, on your own", "uk": "Скелястий берег, пляж, пісок за висотою й підбір кольору — самостійно"}, "steps": [{"text": {"en": "Check: today's lesson work is in place (the coast types marked on a map copy, the first cliff rocks, and M_Island_Auto with MI_Island_Auto on the landscape). Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it. Check: from 300 m, cliffs show rock and gentle slopes show grass.", "uk": "Спершу переконайся, що робота з сьогоднішніх уроків на місці: типи берега позначено на копії мапи, перші камені на скелі стоять, а M_Island_Auto з MI_Island_Auto призначено ландшафту. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Перевірка: з висоти 300 м на скелях камінь, а на пологих схилах трава."}, "lesson": 1}, {"text": {"en": "Rock pack check: Nanite on for every rock mesh you'll use. Older Unreal (4.27) or weak PC: there is no Nanite on 4.27, so keep the pack's LODs and place 20 rocks at most. Check: Enable Nanite Support is ticked in each one, or the LODs show.", "uk": "Перевір пак каміння: Nanite увімкнено для кожного меша каміння, який ти використаєш. Старіший Unreal (4.27) або слабкий ПК: у 4.27 немає Nanite, тож лиши LOD пака й постав не більше 20 каменів. Перевірка: у кожному ввімкнено прапорець Enable Nanite Support або видно LOD."}, "lesson": 2}, {"text": {"en": "Sculpt the cliff headland steeper, then rock the cliff stretch, about 150 m: overlapping, sunk, turned, and scaled 0.7 to 1.4; 30 pieces at most. Check: from 30 m, no smeared landscape face and no two neighbours alike.", "uk": "Зроби мис зі скелями крутішим, потім вкрий камінням ділянку скель близько 150 м: камені заходять один на один, втоплені, повернуті, масштаб від 0,7 до 1,4, не більше 30 деталей. Перевірка: з 30 м немає жодної розмазаної грані ландшафту й однакових сусідів."}, "lesson": 2}, {"text": {"en": "The rocky shore: boulders half-buried in groups at the waterline. Check: a broken foot line, and nothing floating when you look from 2 m above the water.", "uk": "Скелястий берег: напівзакопані валуни групами біля лінії води. Перевірка: лінія підніжжя нерівна, і з висоти 2 м над водою нічого не висить у повітрі."}, "lesson": 2}, {"text": {"en": "Import your rock, grass and sand textures from Day24/ground into Content/Island/Textures: drag the files into the Content Browser, and click Import All if a window opens. Check: all three show in the folder, and each opens at 2048 x 2048 with no visible seam.", "uk": "Імпортуй текстури каменю, трави й піску з Day24/ground у Content/Island/Textures: перетягни файли в Content Browser і, якщо відкриється вікно, клацни Import All. Перевірка: усі три є в папці, кожна відкривається з розміром 2048 × 2048 без видимого шва."}, "lesson": "D24.3"}, {"text": {"en": "Finish M_Island_Auto's rock and grass layers, the tiling and the slope mask. Check: the preview sphere shows grass on top and rock on its sides.", "uk": "Заверши в M_Island_Auto шари каменю й трави, тайлінг і маску схилу. Перевірка: на сфері попереднього перегляду трава зверху, а камінь — з боків."}, "lesson": 3}, {"text": {"en": "Tune SlopeStart and SlopeSharpness in MI_Island_Auto. Check: rock on the cliffs and steep banks, grass on gentle slopes, and a soft edge between them.", "uk": "Налаштуй SlopeStart і SlopeSharpness в MI_Island_Auto. Перевірка: камінь на скелях і крутих берегах, трава на пологих схилах, між ними м'який перехід."}, "lesson": 3}, {"text": {"en": "Add sand by height, multiplied by the slope mask. Check: sand along your beaches and under the shallow water, but not on the district 1 flat at 2.5 m.", "uk": "Додай пісок за висотою, помножений на маску схилу. Перевірка: пісок уздовж пляжів і під мілкою водою, але не на рівному майданчику району 1 на висоті 2,5 м."}, "lesson": 4}, {"text": {"en": "Colour match: put one engine shot beside your photo of the place in Krita, or any photo of similar ground, and tune the tints in small steps from white. Check: first the brightness of the ground, then its hue, sit close to the photo.", "uk": "Підбір кольору: постав у Krita один кадр із рушія поруч зі своїм фото місця або будь-яким фото схожої місцевості й змінюй відтінки малими кроками, починаючи з білого. Перевірка: спершу яскравість землі, потім її відтінок близькі до фото."}, "lesson": 4}, {"text": {"en": "Tiling check with the mannequin on grass, rock and sand. Write the final values in terrain_notes.md. Check: no pebble the size of a car, and no tile repeating like wallpaper from 30 m.", "uk": "Перевір тайлінг із манекеном на траві, камені й піску. Запиши остаточні значення в terrain_notes.md. Перевірка: жодного камінчика завбільшки з автомобіль, і з 30 м текстура не повторюється, як шпалери."}, "lesson": 4}, {"text": {"en": "Older Unreal (4.27) or weak PC: wait for 'Compiling Shaders' to finish before you judge colours, and switch to High only for the next shot (see 'A weak PC' in ACCOUNTS-AND-INSTALLS.html). Pilot CAM_Survey along the cliff at 30 m and save cliff_30m.png. Check: rock, grass and sand all show, with no smeared face.", "uk": "Старіший Unreal (4.27) або слабкий ПК: дочекайся, поки зникне напис «Compiling Shaders», і лише потім оцінюй кольори; на High перемикайся тільки для наступного кадру (див. розділ «Слабкий ПК» на сторінці ACCOUNTS-AND-INSTALLS.html). Пролети з CAM_Survey уздовж скелі на висоті 30 м і збережи cliff_30m.png. Перевірка: видно камінь, траву й пісок, розмазаних граней немає."}, "lesson": 2}, {"text": {"en": "File > Save All, close L_Island and open it again. Report and hand-in: click Copy the day report at the bottom of the page, paste it into a new chat and answer. Open summary.md in Notepad, press Ctrl+End, paste the answer and press Ctrl+S. Then drag the files on the Hand in list into your hand-in folder. Check: the rocks and MI_Island_Auto are back after reopening, and every name shows in the folder, each with a size.", "uk": "File > Save All, закрий L_Island і відкрий знову. Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: після повторного відкриття камені й MI_Island_Auto на місці, а кожна назва зі списку є в папці, у кожної є розмір."}, "lesson": "D0.1"}]}, "lessons": [{"title": {"en": "Real coasts: beaches, rocky shores and cliffs", "uk": "Справжні береги: пляжі, скелясті береги й скелі"}, "minutes": 40, "goals": [{"en": "Explain why each coast forms. Beaches lie in sheltered bays where waves drop sand, at 2 to 10 degrees. Rocky shores and cliffs form where high ground faces the open sea; cliffs stand at 60 to 90 degrees, with fallen rock at the foot.", "uk": "Пояснювати, чому виникає кожен тип берега. Пляжі лежать у захищених затоках, де хвилі залишають пісок, під кутом 2–10 градусів. Скелясті береги й скелі виникають там, де висока земля стоїть проти відкритого моря. Скелі мають 60–90 градусів, біля підніжжя — уламки."}, {"en": "Decide where meshes take over from the landscape: any face steeper than about 50 degrees, or anything that overhangs.", "uk": "Вирішувати, де замість ландшафту ставити меші: на кожній грані, крутішій за приблизно 50 градусів, і там, де щось нависає."}, {"en": "Shape the big forms in the landscape first: a steep headland for the cliff, a gentle floor for the beach.", "uk": "Спершу формувати в ландшафті великі форми: крутий мис для скель, пологе дно для пляжу."}], "doalong": [{"en": "Sort your coast photos by type and write the slope you see in each: gentle, steep or vertical. You should have at least one of each.", "uk": "Розсортуй фото узбережжя за типом і запиши, який схил на кожному: пологий, крутий чи прямовисний. Має вийти щонайменше по одному фото кожного типу."}, {"en": "On a copy of island_map.png, mark each stretch of coast as beach, rocky shore or cliff. You should see beaches in bays and cliffs on headlands.", "uk": "На копії island_map.png познач кожну ділянку узбережжя як пляж, скелястий берег або скелі. Пляжі виходять у затоках, а скелі — на мисах."}, {"en": "In L_Island, Sculpt (raise) and steepen the headland for your cliff with short strokes, Brush Size about 1000. You should see a face much steeper than the hills behind it.", "uk": "У L_Island підніми інструментом Sculpt і зроби крутішим мис для скель короткими мазками, Brush Size близько 1000. Грань стає набагато крутішою за пагорби позаду."}, {"en": "Pilot CAM_Survey along the coast at 30 m (Z 3000) and list the faces steeper than about 50 degrees. You should see their textures stretched into streaks: those get rock next.", "uk": "Пролети з CAM_Survey уздовж узбережжя на висоті 30 м (Z 3000) і випиши грані, крутіші за приблизно 50 градусів. Їхні текстури розтягнуті смугами: саме їх далі вкриє камінь."}], "play": {"en": "Coast detective: the tutor describes six coasts ('a sandy beach on an exposed headland', 'a sea cliff in a calm lagoon'...). I say 'real' or 'fake' and why.", "uk": "Детектив узбережжя: тьютор описує шість берегів («піщаний пляж на відкритому мисі», «морська скеля в тихій лагуні»…). Я кажу «справжнє» чи «несправжнє» і чому."}, "video": {"url": "https://www.youtube.com/watch?v=oD9GRPXAgVM", "title": "Coastal Landforms: Cliffs, Arches, Stacks, Spits | Physical Geography", "channel": "Sociologylearners", "length": "8:00", "search": "coastal landforms cliffs beaches explained"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Справжні береги: пляжі, скелясті береги й скелі (Day 28, lesson 1 of 4). Today's build: Узбережжя острова зі скелею близько 150 м, вкритою камінням, скелястим берегом і пляжем; увесь ландшафт пофарбовано інстансом MI_Island_Auto.\nWhat I already know: День 27: виліплений ландшафт у L_Island; День 24: твій пак каміння й текстури ґрунту в Day24/ground; День 12: матеріал із параметрами та його інстанси; День 14: вузол Lerp, який змішує A з B за маскою; День 21: твоє фото місця (підійде й будь-яке фото схожої місцевості).\n\nBy the end of this lesson I can:\n1. Пояснювати, чому виникає кожен тип берега. Пляжі лежать у захищених затоках, де хвилі залишають пісок, під кутом 2–10 градусів. Скелясті береги й скелі виникають там, де висока земля стоїть проти відкритого моря. Скелі мають 60–90 градусів, біля підніжжя — уламки.\n2. Вирішувати, де замість ландшафту ставити меші: на кожній грані, крутішій за приблизно 50 градусів, і там, де щось нависає.\n3. Спершу формувати в ландшафті великі форми: крутий мис для скель, пологе дно для пляжу.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: Твій ландшафт виліплено за мапою: рівна земля для обох районів, полиці під дороги, долини, хребти й пляжі. Today: Сьогодні ти будуєш обрив, укритий камінням, кам'янистий берег і пляж, а M_Island_Auto фарбує скелю, траву й пісок за схилом і висотою. One encouraging line: Тримай фото узбережжя відкритим поруч із в'юпортом: одна переконлива ділянка обриву сьогодні — це справжній поступ.); 2 lines on why today matters and where it comes back, in plain words (from this: Ландшафт має одну висоту на точку, тож не може нависати, а на крутих гранях його текстури розмазуються. Справжні береги кам'яні там, де б'є море, а піщані — лише в захищених затоках. Студії відкритих світів фарбують увесь острів автоматичним матеріалом, а там, де земля надто крута, ставлять меші каміння. It comes back: MI_Island_Auto фарбує кожен кадр п'ятничного Дня боса. У День 39 рослини ростуть на його траві й оминають його камінь. А пак каміння повернеться завтра навколо каскаду.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-28-coast-cliffs-auto-material exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (ділянка скель і маска схилу в M_Island_Auto (разом з уроками)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Розсортуй фото узбережжя за типом і запиши, який схил на кожному: пологий, крутий чи прямовисний. Має вийти щонайменше по одному фото кожного типу.\n   2. На копії island_map.png познач кожну ділянку узбережжя як пляж, скелястий берег або скелі. Пляжі виходять у затоках, а скелі — на мисах. [screenshot]\n   3. У L_Island підніми інструментом Sculpt і зроби крутішим мис для скель короткими мазками, Brush Size близько 1000. Грань стає набагато крутішою за пагорби позаду.\n   4. Пролети з CAM_Survey уздовж узбережжя на висоті 30 м (Z 3000) і випиши грані, крутіші за приблизно 50 градусів. Їхні текстури розтягнуті смугами: саме їх далі вкриє камінь. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Детектив узбережжя: тьютор описує шість берегів («піщаний пляж на відкритому мисі», «морська скеля в тихій лагуні»…). Я кажу «справжнє» чи «несправжнє» і чому. Otherwise skip it.\n6. Review: ask me these questions from earlier days, one at a time, and correct me kindly: Day 25: why does a studio review a greybox preview before anyone models anything? | Day 22: why do beaches form in bays, but cliffs on headlands?\n7. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n8. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\nIf I want to go deeper, recommend this free video: \"Coastal Landforms: Cliffs, Arches, Stacks, Spits | Physical Geography\" by Sociologylearners: https://www.youtube.com/watch?v=oD9GRPXAgVM\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English hem overlap. You should see one rock wall, not a row of copies.", "uk": "Роби копії вздовж скелі (Alt+перетягування). Кожній дай у Details масштаб від 0,7 до 1,4 і поверни, щоб вона відрізнялася від сусідньої; хай камені заходять один на один. Має вийти одна кам'яна стіна, а не ряд копій."}, {"en": "Add smaller rocks at the foot, half-buried, in groups of 3 to 5. You should see a broken foot line, never a row.", "uk": "Додай біля підніжжя менші камені, напівзакопані, групами по 3–5. Лінія підніжжя нерівна, а не рядом."}, {"en": "Fly past at 30 m and at 10 m. Wherever a stretched landscape face shows between rocks, add a piece, or push the terrain back behind the rock with Shift-sculpt. You should see no smears left.", "uk": "Пролети повз на висоті 30 м і 10 м. Де між каменями видно розтягнуту грань ландшафту, додай деталь або відсунь рельєф за камінь через Sculpt із Shift. Має вийти: розмазаних місць не лишилося."}], "play": {"en": "Rock referee: I describe two screenshots of my cliff. The tutor hunts for floating rocks, repeated neighbours, straight foot lines and smeared faces, and each find costs me a point until I fix it.", "uk": "Суддя каміння: я описую два скриншоти своєї скелі. Тьютор шукає камені, що висять у повітрі, однакових сусідів, прямі лінії підніжжя й розмазані грані. Кожна знахідка коштує мені бал, поки я її не виправлю."}, "video": {"search": "unreal engine 5 cliff rocks on landscape placement tutorial"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Скелі з мешів каміння (Day 28, lesson 2 of 4). Today's build: Узбережжя острова зі скелею близько 150 м, вкритою камінням, скелястим берегом і пляжем; увесь ландшафт пофарбовано інстансом MI_Island_Auto.\nWhat I already know: День 27: виліплений ландшафт у L_Island; День 24: твій пак каміння й текстури ґрунту в Day24/ground; День 12: матеріал із параметрами та його інстанси; День 14: вузол Lerp, який змішує A з B за маскою; День 21: твоє фото місця (підійде й будь-яке фото схожої місцевості).\nEarlier today I already did: lesson 1 (Справжні береги: пляжі, скелясті береги й скелі). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Пояснювати, чому круті грані вкривають мешами каміння: меш може мати будь-яку форму, нависати й тримати текстуру чіткою. Ландшафт не вміє нічого з цього.\n2. Ставити камені, як у природі: вони заходять один на один, втоплені на 1–3 м у землю, повернуті й масштабовані так, що сусіди не однакові. Менші валуни збираються біля підніжжя.\n3. Перевіряти, чи в кожного меша каміння увімкнено Nanite (на старішому Unreal — LOD), і тримати бюджет — близько 30 деталей на 150 м.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: 2 lines on why today matters and where it comes back, in plain words (from this: Ландшафт має одну висоту на точку, тож не може нависати, а на крутих гранях його текстури розмазуються. Справжні береги кам'яні там, де б'є море, а піщані — лише в захищених затоках. Студії відкритих світів фарбують увесь острів автоматичним матеріалом, а там, де земля надто крута, ставлять меші каміння. It comes back: MI_Island_Auto фарбує кожен кадр п'ятничного Дня боса. У День 39 рослини ростуть на його траві й оминають його камінь. А пак каміння повернеться завтра навколо каскаду.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-28-coast-cliffs-auto-material exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (ділянка скель і маска схилу в M_Island_Auto (разом з уроками)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Відкрий папку пака каміння й двічі клацни найбільший камінь. У Details редактора меша знайди Nanite Settings: прапорець Enable Nanite Support має бути ввімкнено. Якщо ні, увімкни його й клацни Apply Changes. Старіший Unreal (4.27) або слабкий ПК: Nanite немає; відкрий параметри LOD і перевір, чи в меша є LOD. Має вийти: параметр увімкнено.\n   2. Перетягни великий камінь на грань скелі й натисни End. Поверни його (E) так, щоб його шари йшли в тому самому напрямку, що й шари скелі. Опускай, поки біля основи не зникне щілина. Камінь виростає із землі.\n   3. Роби копії вздовж скелі (Alt+перетягування). Кожній дай у Details масштаб від 0,7 до 1,4 і поверни, щоб вона відрізнялася від сусідньої; хай каме

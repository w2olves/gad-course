see an empty graph with the main material node.", "uk": "У Content Browser створи Content/Island/Materials. Клацни правою кнопкою > Material, назви M_Island_Auto і двічі клацни на ньому. Відкривається порожній граф із головним вузлом матеріалу."}, {"en": "Rock layer: drag your rock texture in, right-click it > Convert to Parameter and name it RockTex. Hold V and click to add a colour parameter, RockTint, with its default white (1, 1, 1). Hold M and click to Multiply them. Make the grass layer the same way, with GrassTex and GrassTint. You should see two small chains.", "uk": "Шар каменю: перетягни свою текстуру каменю в граф, клацни її правою кнопкою > Convert to Parameter і назви RockTex. Утримуй V і клацни, щоб додати параметр кольору RockTint із типовим білим (1, 1, 1). Утримуй M і клацни, щоб перемножити їх. Так само зроби шар трави з GrassTex і GrassTint. Має вийти два короткі ланцюжки."}, {"en": "Tiling: add LandscapeLayerCoords; it gives one unit per metre on your landscape, so leave Mapping Scale at 1. Multiply it by a scalar parameter Tiling (hold S and click; value 0.25, one tile every 4 m). Plug the result into both textures' UVs pins. You should see both UVs pins connected.", "uk": "Тайлінг: додай LandscapeLayerCoords. Він дає одну одиницю на метр ландшафту, тож Mapping Scale лиши 1. Помнож його на скалярний параметр Tiling (утримуй S і клацни; значення 0.25 — одна плитка текстури на 4 м). Підключи результат до входів UVs обох текстур. Має вийти: обидва входи UVs підключено."}, {"en": "Slope mask: add VertexNormalWS, then a Mask node (search ComponentMask) with only B ticked. Subtract a scalar parameter SlopeStart (0.8), Multiply by a scalar parameter SlopeSharpness (10), and finish with Saturate. You should see one chain ending in a value from 0 to 1.", "uk": "Маска схилу: додай VertexNormalWS, потім вузол Mask (шукай ComponentMask), у якому ввімкнено лише B. Відніми скалярний параметр SlopeStart (0.8), помнож на скалярний параметр SlopeSharpness (10) і заверши вузлом Saturate. Має вийти один ланцюжок, що закінчується значенням від 0 до 1."}, {"en": "Hold L and click to add a Lerp: A = rock, B = grass, Alpha = the slope mask. Plug it into Base Color, and a scalar parameter Roughness (0.9) into Roughness. Never use Convert to Substrate (older Unreal needs none); only a Front Material pin? Send the tutor a screenshot. Save. You should see the preview sphere grassy on top and rocky on its sides.", "uk": "Утримуй L і клацни, щоб додати Lerp: A — камінь, B — трава, Alpha — маска схилу. Підключи його до Base Color, а скалярний параметр Roughness (0.9) — до Roughness. Ніколи не тисни Convert to Substrate (на старішому Unreal це й не потрібно). Бачиш лише вхід Front Material? Надішли тьютору скриншот. Збережи. Сфера попереднього перегляду трав'яна зверху й кам'яна з боків."}, {"en": "Right-click M_Island_Auto > Create Material Instance and name it MI_Island_Auto. Select the landscape and set Landscape Material to MI_Island_Auto in Details; wait for the shaders. You should see cliffs turn to rock and gentle slopes to grass.", "uk": "Клацни правою кнопкою на M_Island_Auto > Create Material Instance і назви інстанс MI_Island_Auto. Виділи ландшафт і в Details постав Landscape Material на MI_Island_Auto; дочекайся шейдерів. Скелі стають кам'яними, а пологі схили — трав'яними."}], "play": {"en": "Slider guess: the tutor names a look ('rock only on true cliffs', 'grass creeping up the banks'). I say which parameter moves and which way before trying it, and right guesses score.", "uk": "Вгадай повзунок: тьютор називає вигляд («камінь лише на справжніх скелях», «трава заповзає на береги»). Я кажу, який параметр і в який бік змінити, ще до спроби. Правильні здогадки приносять бали."}, "video": {"url": "https://www.youtube.com/watch?v=TJa-v5yDybI", "title": "Advanced Landscape Auto Material - Building Worlds In Unreal - Episode 18", "channel": "Ben Cloward", "length": "31:17", "search": "unreal engine landscape auto material slope height"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Автоматичний матеріал ландшафту: камінь і трава за схилом (Day 28, lesson 3 of 4). Today's build: Узбережжя острова зі скелею близько 150 м, вкритою камінням, скелястим берегом і пляжем; увесь ландшафт пофарбовано інстансом MI_Island_Auto.\nWhat I already know: День 27: виліплений ландшафт у L_Island; День 24: твій пак каміння й текстури ґрунту в Day24/ground; День 12: матеріал із параметрами та його інстанси; День 14: вузол Lerp, який змішує A з B за маскою; День 21: твоє фото місця (підійде й будь-яке фото схожої місцевості).\nEarlier today I already did: lesson 1 (Справжні береги: пляжі, скелясті береги й скелі); lesson 2 (Скелі з мешів каміння). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Пояснювати, що таке автоматичний матеріал: матеріал ландшафту, який сам вибирає поверхню (тут — за схилом), тож увесь острів пофарбовано без пензля.\n2. Будувати маску схилу — значення від 0 до 1, яке каже, де видно кожен шар. VertexNormalWS показує, куди звернена земля. Його синя частина (B) дорівнює 1 на рівній землі й 0 на прямовисній скелі.\n3. Змішувати два шари вузлом Lerp (A там, де маска 0, B там, де 1). Тайлити їх у метрах вузлом LandscapeLayerCoords і керувати всім через Material Instance.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: 2 lines on why today matters and where it comes back, in plain words (from this: Ландшафт має одну висоту на точку, тож не може нависати, а на крутих гранях його текстури розмазуються. Справжні береги кам'яні там, де б'є море, а піщані — лише в захищених затоках. Студії відкритих світів фарбують увесь острів автоматичним матеріалом, а там, де земля надто крута, ставлять меші каміння. It comes back: MI_Island_Auto фарбує кожен кадр п'ятничного Дня боса. У День 39 рослини ростуть на його траві й оминають його камінь. А пак каміння повернеться завтра навколо каскаду.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-28-coast-cliffs-auto-material exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (ділянка скель і маска схилу в M_Island_Auto (разом з уроками)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. У Content Browser створи Content/Island/Materials. Клацни правою кнопкою > Material, назви M_Island_Auto і двічі клацни на ньому. Відкривається порожній граф із головним вузлом матеріалу.\n   2. Шар каменю: перетягни свою текстуру каменю в граф, клацни її правою кнопкою > Convert to Parameter і назви RockTex. Утримуй V і клацни, щоб додати параметр кольору RockTint із типовим білим (1, 1, 1). Утримуй M і клацни, щоб перемножити їх. Так само зроби шар трави з GrassTex і GrassTint. Має вийти два короткі ланцюжки.\n   3. Тайлінг: додай LandscapeLayerCoords. Він дає одну одиницю на метр ландшафту, тож Mapping Scale лиши 1. Помнож його на скалярний параметр Tiling (утримуй S і клацни; значення 0.25 — одна плитка текстури на 4 м). Підключи результат до входів UVs обох текстур. Має вийти: обидва входи UVs підключено. [screenshot]\n   4. Маска схилу: додай VertexNormalWS, потім вузол Mask (шукай ComponentMask), у якому ввімкнено лише B. Відніми скалярний параметр SlopeStart (0.8), помнож на скалярний параметр SlopeSharpness (10) і заверши вузлом Saturate. Має вийти один ланцюжок, що закінчується значенням від 0 до 1.\n   5. Утримуй L і клацни, щоб додати Lerp: A — камінь, B — трава, Alpha — маска схилу. Підключи його до Base Color, а скалярний параметр Roughness (0.9) — до Roughness. Ніколи не тисни Convert to Substrate (на старішому Unreal це й не потрібно). Бачиш лише вхід Front Material? Надішли тьютору скриншот. Збережи. Сфера попереднього перегляду трав'яна зверху й кам'яна з боків.\n   6. Клацни правою кнопкою на M_Island_Auto > Create Material Instance і назви інстанс MI_Island_Auto. Виділи ландшафт і в Details постав Landscape Material на MI_Island_Auto; дочекайся шейдерів. Скелі стають кам'яними, а пологі схили — трав'яними. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Вгадай повзунок: тьютор називає вигляд («камінь лише на справжніх скелях», «трава заповзає на береги»). Я кажу, який параметр і в який бік змінити, ще до спроби. Правильні здогадки приносять бали. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\nIf I want to go deeper, recommend this free video: \"Advanced Landscape Auto Material - Building Worlds In Unreal - Episode 18\" by Ben Cloward: https://www.youtube.com/watch?v=TJa-v5yDybI\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; review (by tutor or art director) = огляд; reference photo / hero photo = фото-референс / ключове фото; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); default value = типове значення; File Explorer = Провідник; mesh = меш; vertex / edge / face = вершина / ребро / грань; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); UV unwrap / UV layout / seam / UV island = розгортка / розкладка / шов / UV-острівець; level (Unreal) = рівень (тільки рівень Unreal); material instance / child instance = інстанс / дочірній інстанс; material slot / node / pin = слот матеріалу / вузол / вхід; kit / kit piece / part of one object = набір / деталь / частина; map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; district / plot / plot plan = район / ділянка / план ділянки; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; hero shot = головний кадр (hero shot); proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}, {"title": {"en": "Sand by height, and colour matched to your photos", "uk": "Пісок за висотою й колір за твоїми фото"}, "minutes": 40, "goals": [{"en": "Add a height mask: Absolute World Position's Z is each point's height in cm, so low ground near the sea can turn to sand.", "uk": "Додавати маску висоти: Z з Absolute World Position — це висота кожної точки в сантиметрах, тож низька земля біля моря може стати піском."}, {"en": "Compare engine and photo side by side at a similar distance and light: brightness first, then hue, then saturation.", "uk": "Порівнювати кадр із рушія й фото поруч, на схожій відстані й при схожому світлі: спершу яскравість, потім відтінок, потім насиченість."}, {"en": "Tune the tints towards your photos, not towards 'nicer': start at white and move in small steps. The usual mistakes are grass too green and rock too dark.", "uk": "Підганяти відтінки під свої фото, а не під «гарніше»: починати з білого й рухатися малими кроками. Типові помилки — надто зелена трава й надто темний камінь."}], "doalong": [{"en": "In M_Island_Auto add Absolute World Position, then a Mask with only B ticked. Make two scalar parameters, SandHeight (150) and SandBlend (100). Subtract the height from SandHeight, Divide by SandBlend, then Saturate. You should see a chain that is 1 low down and 0 above 1.5 m.", "uk": "У M_Island_Auto додай Absolute World Position, потім Mask, у якому ввімкнено лише B. Створи два скалярні параметри: SandHeight (150) і SandBlend (100). Відніми висоту від SandHeight, поділи (Divide) на SandBlend, потім Saturate. Має вийти ланцюжок, що дає 1 унизу й 0 вище 1,5 м."}, {"en": "Multiply it by your slope mask, so cliffs at sea level stay rock. Add a sand layer (SandTex times SandTint, its default white) and a second Lerp: A = the first Lerp, B = sand, Alpha = the sand mask. Plug it into Base Color and save. You should see sand appear along your beaches.", "uk": "Помнож його на маску схилу, щоб скелі на рівні моря лишалися кам'яними. Додай шар піску (SandTex, помножений на SandTint із типовим білим) і другий Lerp: A — перший Lerp, B — пісок, Alpha — маска піску. Підключи до Base Color і збережи. Уздовж пляжів з'являється пісок."}, {"en": "Use your Day 21 photo of the place, or any photo of similar ground; it stays private. Frame the editor camera at a similar distance, take a screenshot and put it beside the photo in Krita. You should see the differences at once.", "uk": "Візьми своє фото місця з Дня 21 або будь-яке фото схожої місцевості; воно лишається особистим. Постав камеру редактора на схожу відстань, зроби скриншот і поклади його поруч із фото в Krita. Відмінності видно одразу."}, {"en": "Sample the photo's grass with Krita's colour picker (Ctrl+click) and compare it with your screenshot. In MI_Island_Auto tick GrassTint and move it from white in small steps. Lower all three numbers to darken, blue a little to warm, green a little to calm the grass. Do the same for RockTint. You should see the ground's brightness come close first.", "uk": "Візьми піпеткою Krita (Ctrl+клацання) колір трави на фото й порівняй зі скриншотом. В MI_Island_Auto увімкни прапорець GrassTint і змінюй його від білого малими кроками. Щоб затемнити, зменшуй усі три числа. Трохи менше синього робить траву теплішою, трохи менше зеленого — спокійнішою. Те саме зроби для RockTint. Першою має зрівнятися яскравість землі."}, {"en": "Stand the mannequin on grass and on sand. If a pebble looks car-sized, raise Tiling in MI_Island_Auto: more tiles make smaller pebbles. You should see surface detail at a believable size.", "uk": "Постав манекен на траву й на пісок. Якщо камінчик виглядає завбільшки з автомобіль, збільш Tiling в MI_Island_Auto: більше повторів — менші камінчики. Має вийти: дрібниці поверхні правдоподібного розміру."}], "play": {"en": "Spot the difference: the tutor names one difference per pair (too green, too dark, too even). I fix it and describe the result; three rounds to a pass.", "uk": "Знайди різницю: тьютор називає по одній відмінності в кожній парі (надто зелене, надто темне, надто рівне). Я виправляю й описую результат. Три раунди — і зараховано."}, "video": {"search": "matching game environment colours to reference photos"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Пісок за висотою й колір за твоїми фото (Day 28, lesson 4 of 4). Today's build: Узбережжя острова зі скелею близько 150 м, вкритою камінням, скелястим берегом і пляжем; увесь ландшафт пофарбовано інстансом MI_Island_Auto.\nWhat I already know: День 27: виліплений ландшафт у L_Island; День 24: твій пак каміння й текстури ґрунту в Day24/ground; День 12: матеріал із параметрами та його інстанси; День 14: вузол Lerp, який змішує A з B за маскою; День 21: твоє фото місця (підійде й будь-яке фото схожої місцевості).\nEarlier today I already did: lesson 1 (Справжні береги: пляжі, скелясті береги й скелі); lesson 2 (Скелі з мешів каміння); lesson 3 (Автоматичний матеріал ландшафту: камінь і трава за схилом). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Додавати маску висоти: Z з Absolute World Position — це висота кожної точки в сантиметрах, тож низька земля біля моря може стати піском.\n2. Порівнювати кадр із рушія й фото поруч, на схожій відстані й при схожому світлі: спершу яскравість, потім відтінок, потім насиченість.\n3. Підганяти відтінки під свої фото, а не під «гарніше»: починати з білого й рухатися малими кроками. Типові помилки — надто зелена трава й надто темний камінь.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: 2 lines on why today matters and where it comes back, in plain words (from this: Ландшафт має одну висоту на точку, тож не може нависати, а на крутих гранях його текстури розмазуються. Справжні береги кам'яні там, де б'є море, а піщані — лише в захищених затоках. Студії відкритих світів фарбують увесь острів автоматичним матеріалом, а там, де земля надто крута, ставлять меші каміння. It comes back: MI_Island_Auto фарбує кожен кадр п'ятничного Дня боса. У День 39 рослини ростуть на його траві й оминають його камінь. А пак каміння повернеться завтра навколо каскаду.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-28-coast-cliffs-auto-material exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (ділянка скель і маска схилу в M_Island_Auto (разом з уроками)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. У M_Island_Auto додай Absolute World Position, потім Mask, у якому ввімкнено лише B. Створи два скалярні параметри: SandHeight (150) і SandBlend (100). Відніми висоту від SandHeight, поділи (Divide) на SandBlend, потім Saturate. Має вийти ланцюжок, що дає 1 унизу й 0 вище 1,5 м.\n   2. Помнож його на маску схилу, щоб скелі на рівні моря лишалися кам'яними. Додай шар піску (SandTex, помножений на SandTint із типовим білим) і другий Lerp: A — перший Lerp, B — пісок, Alpha — маска піску. Підключи до Base Color і збережи. Уздовж пляжів з'являється пісок.\n   3. Візьми своє фото місця з Дня 21 або будь-яке фото схожої місцевості; воно лишається особистим. Постав камеру редактора на схожу відстань, зроби скриншот і поклади його поруч із фото в Krita. Відмінності видно одразу. [screenshot]\n   4. Візьми піпеткою Krita (Ctrl+клацання) колір трави на фото й порівняй зі скриншотом. В MI_Island_Auto увімкни прапорець GrassTint і змінюй його від білого малими кроками. Щоб затемнити, зменшуй усі три числа. Трохи менше синього робить траву теплішою, трохи менше зеленого — спокійнішою. Те саме зроби для RockTint. Першою має зрівнятися яскравість землі.\n   5. Постав манекен на траву й на пісок. Якщо камінчик виглядає завбільшки з автомобіль, збільш Tiling в MI_Island_Auto: більше повторів — менші камінчики. Має вийти: дрібниці поверхні правдоподібного розміру. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Знайди різницю: тьютор називає по одній відмінності в кожній парі (надто зелене, надто темне, надто рівне). Я виправляю й описую результат. Три раунди — і зараховано. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; review (by tutor or art director) = огляд; reference photo / hero photo = фото-референс / ключове фото; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); default value = типове значення; File Explorer = Провідник; mesh = меш; vertex / edge / face = вершина / ребро / грань; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); UV unwrap / UV layout / seam / UV island = розгортка / розкладка / шов / UV-острівець; level (Unreal) = рівень (тільки рівень Unreal); material instance / child instance = інстанс / дочірній інстанс; material slot / node / pin = слот матеріалу / вузол / вхід; map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; district / plot / plot plan = район / ділянка / план ділянки; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}], "handin": [{"en": "summary.md", "uk": "summary.md (звіт дня)"}, {"en": "cliff_30m.png: the rocked cliff with rock, grass and sand (proof)", "uk": "cliff_30m.png (скеля з камінням, травою й піском) (доказ)"}], "goal": {"en": "By the end of today your island has a rock-covered cliff, a rocky shore and a beach. Your own M_Island_Auto paints rock, grass and sand by slope and height.", "uk": "До кінця дня на острові є скеля, вкрита камінням, скелястий берег і пляж. Твій власний M_Island_Auto фарбує камінь, траву й пісок за схилом і висотою."}, "uses": [{"en": "Day 27: the sculpted landscape in L_Island", "uk": "День 27: виліплений ландшафт у L_Island"}, {"en": "Day 24: your rock pack and the ground textures in Day24/ground", "uk": "День 24: твій пак каміння й текстури ґрунту в Day24/ground"}, {"en": "Day 12: building a material with parameters and making instances of it", "uk": "День 12: матеріал із параметрами та його інстанси"}, {"en": "Day 14: the Lerp node, which blends A into B by a mask", "uk": "День 14: вузол Lerp, який змішує A з B за маскою"}, {"en": "Day 21: your photo of the place (any photo of similar ground works too)", "uk": "День 21: твоє фото місця (підійде й будь-яке фото схожої місцевості)"}], "quiz": [{"q": {"en": "From the drone, your cliff face shows long smeared stripes of texture. What is the cause and the fix?", "uk": "З дрона на грані твоєї скелі видно довгі розмазані смуги текстури. Яка причина і як виправити?"}, "options": [{"en": "The texture is too small; use a bigger one.", "uk": "Текстура замала. Візьми більшу."}, {"en": "A landscape stretches its texture on faces steeper than about 50 degrees; cover them with rock meshes.", "uk": "Ландшафт розтягує текстуру на гранях, крутіших за приблизно 50 градусів. Вкрий їх мешами каміння."}, {"en": "The sun is too low; raise it.", "uk": "Сонце надто низько. Підніми його."}, {"en": "Nanite is off on the landscape.", "uk": "На ландшафті вимкнено Nanite."}], "answer": 1, "explain": {"en": "A landscape has one height per point, so steep faces stretch. Meshes can take any shape and keep their textures sharp.", "uk": "Ландшафт має одну висоту на точку, тож на крутих гранях текстура розтягується. Меші можуть мати будь-яку форму й тримають текстури чіткими."}}, {"q": {"en": "In MI_Island_Auto you raise SlopeStart from 0.8 to 0.9. What changes?", "uk": "У MI_Island_Auto ти збільшуєш SlopeStart з 0.8 до 0.9. Що змінюється?"}, "options": [{"en": "Grass now needs flatter ground, so rock creeps onto gentler slopes.", "uk": "Траві тепер потрібна рівніша земля, тож камінь заповзає на пологіші схили."}, {"en": "Grass creeps up the cliffs.", "uk": "Трава заповзає на скелі."}, {"en": "Sand appears on the summit.", "uk": "На верхівці з'являється пісок."}, {"en": "Nothing: it's only a name.", "uk": "Нічого: це лише назва."}], "answer": 0, "explain": {"en": "The mask turns to grass only where the ground faces up more than SlopeStart. A higher value leaves more slopes as rock.", "uk": "Маска дає траву лише там, де земля звернена вгору більше, ніж SlopeStart. Вище значення лишає більше схилів кам'яними."}}, {"q": {"en": "Why do you multiply the sand mask by the slope mask?", "uk": "Навіщо множити маску піску на маску схилу?"}, "options": [{"en": "To make the sand brighter.", "uk": "Щоб пісок став яскравішим."}, {"en": "To save memory.", "uk": "Щоб заощадити пам'ять."}, {"en": "So steep cliffs at sea level stay rock instead of turning to sand.", "uk": "Щоб круті скелі на рівні моря лишалися кам'яними, а не ставали піском."}, {"en": "Because a Lerp needs two masks.", "uk": "Бо Lerp потребує двох масок."}], "answer": 2, "explain": {"en": "Sand should be low AND flat. Multiplying the masks keeps only places that pass both tests.", "uk": "Пісок має бути низько і на рівному. Множення масок лишає тільки місця, які проходять обидві перевірки."}}, {"q": {"en": "Your boulders stand in a neat row along the waterline, all the same size. What would a reviewer say?", "uk": "Твої валуни стоять акуратним рядом уздовж лінії води, усі однакового розміру. Що скаже рецензент?"}, "options": [{"en": "Perfect: a tidy coast.", "uk": "Ідеально: охайне узбережжя."}, {"en": "Make them all bigger.", "uk": "Зроби їх усі більшими."}, {"en": "Add more in the same row.", "uk": "Додай ще в той самий ряд."}, {"en": "Rocks in nature fall in groups of different sizes, half-buried and turned; break the row and vary the scale from 0.7 to 1.4.", "uk": "Каміння в природі лежить групами різного розміру, напівзакопане й повернуте. Розбий ряд і зміни масштаб від 0,7 до 1,4."}], "answer": 3, "explain": {"en": "No straight lines in nature. Rows and repeats are the first things the eye catches as fake.", "uk": "У природі немає прямих ліній. Ряди й повтори око першими помічає як несправжні."}}, {"q": {"en": "Beside the mannequin, the pebbles in your grass look as big as a car. What do you change?", "uk": "Поруч із манекеном камінчики у твоїй траві виглядають завбільшки з автомобіль. Що ти змінюєш?"}, "options": [{"en": "Scale the landscape down.", "uk": "Зменшую масштаб ландшафту."}, {"en": "Raise the Tiling parameter, so each tile covers less ground and the pebbles shrink.", "uk": "Збільшую параметр Tiling, щоб кожна плитка текстури вкривала менше землі й камінчики меншали."}, {"en": "Lower the Tiling parameter.", "uk": "Зменшую параметр Tiling."}, {"en": "Make the mannequin bigger.", "uk": "Роблю манекен більшим."}], "answer": 1, "explain": {"en": "Tiling sets how many times the texture repeats per metre. More repeats means smaller detail.", "uk": "Tiling задає, скільки разів текстура повторюється на метр. Більше повторів — дрібніший малюнок."}}], "weekInfo": {"week": 6, "title": {"en": "Terrain and water", "uk": "Рельєф і вода"}, "goal": {"en": "By Friday you have L_Island, a World Partition level with your island's terrain from a real heightmap, sculpted to your map, with rock-covered cliffs, beaches, an auto-material, the ocean, a lake and a river, seen from three locked drone cameras.", "uk": "До п'ятниці в тебе є L_Island — рівень World Partition із рельєфом острова зі справжньої карти висот, виліпленим за твоєю мапою. На ньому скелі, вкриті камінням, пляжі, автоматичний матеріал, океан, озеро й річка, і все це видно з трьох заблокованих камер дрона."}, "skills": [{"en": "Heightmap-based landscapes in Unreal Engine 5 (16-bit import, Z scale and calibration)", "uk": "Ландшафти з карти висот в Unreal Engine 5 (16-бітний імпорт, масштаб Z і калібрування)"}, {"en": "Landscape sculpting for gameplay and realism: flats, road ramps and erosion", "uk": "Ліплення ландшафту для геймплею й реалізму: рівні майданчики, полиці під дороги й ерозія"}, {"en": "Auto-landscape materials blended by slope and height", "uk": "Автоматичні матеріали ландшафту, що змішуються за схилом і висотою"}, {"en": "Unreal Water system: ocean, rivers and lakes that follow the terrain", "uk": "Система Water в Unreal: океан, річки й озера, що йдуть за рельєфом"}, {"en": "Cinematic camera set-up and shot review against reference photos", "uk": "Налаштування кінематографічних камер і перевірка кадрів за фото-референсами"}]}, "morning": {"sofar": {"en": "Your landscape is sculpted to your map, with flat ground for both districts, road shelves, valleys, ridges and beaches.", "uk": "Твій ландшафт виліплено за мапою: рівна земля для обох районів, полиці під дороги, долини, хребти й пляжі."}, "today": {"en": "You build a rock-covered cliff, a rocky shore and a beach, and make M_Island_Auto paint rock, grass and sand by slope and height.", "uk": "Сьогодні ти будуєш обрив, укритий камінням, кам'янистий берег і пляж, а M_Island_Auto фарбує скелю, траву й пісок за схилом і висотою."}, "cheer": {"en": "Keep your coast photo open beside the viewport; one convincing stretch of cliff today is real progress.", "uk": "Тримай фото узбережжя відкритим поруч із в'юпортом: одна переконлива ділянка обриву сьогодні — це справжній поступ."}, "quote": {"text": {"en": "The sediments are a sort of epic poem of the earth.", "uk": "Осадові породи — це своєрідна епічна поема Землі."}, "author": {"en": "Rachel Carson", "uk": "Рейчел Карсон"}, "source": "https://en.wikiquote.org/wiki/Rachel_Carson"}}, "hasAssets": false, "workPath": "Work\\Assignment\\Day-28-coast-cliffs-auto-material", "mapHref": "../../COURSE.html", "prevHref": "../Day-27-sculpting-to-the-map/START-HERE.html", "nextHref": "../Day-29-ocean-river-lake-cascade/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8 and Krita. I am a beginner on Day 28. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me and don't write code.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: Скелястий берег, пляж, пісок за висотою й підбір кольору — самостійно.\nIt's part of: Узбережжя острова зі скелею близько 150 м, вкритою камінням, скелястим берегом і пляжем; увесь ландшафт пофарбовано інстансом MI_Island_Auto (L_Island: увесь ландшафт — для матеріалу. Для узбережжя — одна ділянка скель близько 150 м на мисі, скелястий берег і пляж у захищеній затоці, як на мапі.).\nWhy it matters: Ландшафт має одну висоту на точку, тож не може нависати, а на крутих гранях його текстури розмазуються. Справжні береги кам'яні там, де б'є море, а піщані — лише в захищених затоках. Студії відкритих світів фарбують увесь острів автоматичним матеріалом, а там, де земля надто крута, ставлять меші каміння. It comes back: MI_Island_Auto фарбує кожен кадр п'ятничного Дня боса. У День 39 рослини ростуть на його траві й оминають його камінь. А пак каміння повернеться завтра навколо каскаду.\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-28-coast-cliffs-auto-material (on the drive I chose on Day 0).\nWhat I already know: День 27: виліплений ландшафт у L_Island; День 24: твій пак каміння й текстури ґрунту в Day24/ground; День 12: матеріал із параметрами та його інстанси; День 14: вузол Lerp, який змішує A з B за маскою; День 21: твоє фото місця (підійде й будь-яке фото схожої місцевості); today's lessons: Справжні береги: пляжі, скелясті береги й скелі; Скелі з мешів каміння; Автоматичний матеріал ландшафту: камінь і трава за схилом; Пісок за висотою й колір за твоїми фото. Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- Типи берега, які показує мапа: щонайменше один пляж у захищеній затоці (менше 10 градусів), один скелястий берег і одна ділянка скель близько 150 м.\n- Ділянка скель: рельєф зроблено крутішим для великої форми, а потім вкрито мешами з пака каміння з Дня 24. Камені заходять один на один і втоплені на 1–3 м. З 30 м не видно жодної розмазаної грані ландшафту.\n- У природі немає прямих ліній: камені повернуто й масштабовано від 0,7 до 1,4, тож сусіди не повторюються. Лінії підніжжя й верху скель нерівні, а валуни лежать групами, ніколи рядами.\n- Бюджет каміння: не більше 30 деталей на ділянці скель, у всіх увімкнено Nanite. Старіший Unreal (4.27) або слабкий ПК: Nanite там немає, тож лиши LOD пака й постав не більше 20 деталей. Nanite — система Unreal, яка дешево малює дуже деталізовані меші.\n- У Content/Island/Textures — текстури кольору каменю, трави й піску. У Content/Island/Materials — M_Island_Auto: камінь на крутих схилах, трава на пологих (маска схилу), пісок на низькій рівній землі (маска висоти). Кожен шар — це текстура, помножена на параметр кольору, з одним параметром Tiling.\n- MI_Island_Auto призначено матеріалом ландшафту, його кольори підібрано за твоїм фото поруч, а тайлінг перевірено біля манекена.\n\nMy checklist (the same numbers show on my course page):\n1. Спершу переконайся, що робота з сьогоднішніх уроків на місці: типи берега позначено на копії мапи, перші камені на скелі стоять, а M_Island_Auto з MI_Island_Auto призначено ландшафту. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Перевірка: з висоти 300 м на скелях камінь, а на пологих схилах трава. (from lesson 1)\n2. Перевір пак каміння: Nanite увімкнено для кожного меша каміння, який ти використаєш. Старіший Unreal (4.27) або слабкий ПК: у 4.27 немає Nanite, тож лиши LOD пака й постав не більше 20 каменів. Перевірка: у кожному ввімкнено прапорець Enable Nanite Support або видно LOD. (from lesson 2)\n3. Зроби мис зі скелями крутішим, потім вкрий камінням ділянку скель близько 150 м: камені заходять один на один, втоплені, повернуті, масштаб від 0,7 до 1,4, не більше 30 деталей. Перевірка: з 30 м немає жодної розмазаної грані ландшафту й однакових сусідів. (from lesson 2)\n4. Скелястий берег: напівзакопані валуни групами біля лінії води. Перевірка: лінія підніжжя нерівна, і з висоти 2 м над водою нічого не висить у повітрі. (from lesson 2)\n5. Імпортуй текстури каменю, трави й піску з Day24/ground у Content/Island/Textures: перетягни файли в Content Browser і, якщо відкриється вікно, клацни Import All. Перевірка: усі три є в папці, кожна відкривається з розміром 2048 × 2048 без видимого шва. (from day 24, lesson 3)\n6. Заверши в M_Island_Auto шари каменю й трави, тайлінг і маску схилу. Перевірка: на сфері попереднього перегляду трава зверху, а камінь — з боків. (from lesson 3)\n7. Налаштуй SlopeStart і SlopeSharpness в MI_Island_Auto. Перевірка: камінь на скелях і крутих берегах, трава на пологих схилах, між ними м'який перехід. (from lesson 3)\n8. Додай пісок за висотою, помножений на маску схилу. Перевірка: пісок уздовж пляжів і під мілкою водою, але не на рівному майданчику району 1 на висоті 2,5 м. (from lesson 4)\n9. Підбір кольору: постав у Krita один кадр із рушія поруч зі своїм фото місця або будь-яким фото схожої місцевості й змінюй відтінки малими кроками, починаючи з білого. Перевірка: спершу яскравість землі, потім її відтінок близькі до фото. (from lesson 4)\n10. Перевір тайлінг із манекеном на траві, камені й піску. Запиши остаточні значення в terrain_notes.md. Перевірка: жодного камінчика завбільшки з автомобіль, і з 30 м текстура не повторюється, як шпалери. (from lesson 4)\n11. Старіший Unreal (4.27) або слабкий ПК: дочекайся, поки зникне напис «Compiling Shaders», і лише потім оцінюй кольори; на High перемикайся тільки для наступного кадру (див. розділ «Слабкий ПК» на сторінці ACCOUNTS-AND-INSTALLS.html). Пролети з CAM_Survey уздовж скелі на висоті 30 м і збережи cliff_30m.png. Перевірка: видно камінь, траву й пісок, розмазаних граней немає. (from lesson 2)\n12. File > Save All, закрий L_Island і відкрий знову. Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: після повторного відкриття камені й MI_Island_Auto на місці, а кожна назва зі списку є в папці, у кожної є розмір. (from day 0, lesson 1)\n\nHow to help: ask which step number I'm on, then give me only the next step: the exact clicks and what I should see. When I send a screenshot, compare it with my reference, my sizes and the spec, and name one thing to fix at a time.\nCheck every save and export by reopening it before we move on:\n- a .md or .txt: open it with Notepad; the text is there, and the name doesn't end in .md.txt\nWhen I write \"готово\", and in any case before the day ends, check with me one item at a time (yes/no): each spec point, then each file on my hand-in list, ready in my day work folder (skip summary.md: the day report writes it next):\n1. cliff_30m.png (скеля з камінням, травою й піском) (доказ)\nFinish with a short list of anything missing, and one line on where this work comes back and what it will look like there. Then tell me the order for the end of the day: first the day report (the Copy the day report button at the bottom of my course page) into summary.md, and only then hand in all the files on the list, summary.md too.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; review (by tutor or art director) = огляд; checklist = чек-лист; credits line = рядок авторства; reference photo / hero photo = фото-референс / ключове фото; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); mesh = меш; vertex / edge / face = вершина / ребро / грань; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = вида  return '<section class="card glass morning"><div class="mgrid">'+(m.sofar?'<div>'+lab(u('sofar'),'gold')+shelf+'<p class="mtxt">'+lk(x(m.sofar))+'</p></div>':'')+(m.today?'<div>'+lab(u('todayL'))+'<p class="mtxt">'+lk(x(m.today))+'</p></div>':'')+'</div>'+(m.cheer?'<p class="cheer">'+esc(x(m.cheer))+'</p>':'')+(qt?'<figure class="quote well">'+kn('quote')+'<blockquote>'+esc(qt)+'</blockquote>'+(q.author?'<figcaption>'+esc(x(q.author))+'</figcaption>':'')+'</figure>':'')+'</section>'}
function setLang(l){lang=l;try{localStorage.setItem('devteam:lang',lang)}catch(e){};render()}
function toggleLang(){setLang(lang==='uk'?'en':'uk')}
/* keep open sections and keyboard focus across re-renders */
const openD=new Set();
function tg(e){if(e.open)openD.add(e.id);else openD.delete(e.id)}
const op=id=>openD.has(id)?' open':'';
function render(){const ae=document.activeElement,fid=ae&&(ae.id||(ae.getAttribute('data-th')?'th-'+ae.getAttribute('data-th'):ae.getAttribute('lang')&&ae.closest('.seg')?'lg-'+ae.getAttribute('lang'):''));
 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);
 const b=D.build,P=Math.round(prog()*100);
 document.getElementById('top').innerHTML='<div class="topin glass"><a class="maplink" href="'+esc(D.mapHref)+'">'+kn('map')+u('map')+'</a><div class="crumb"><b>'+esc(x(D.learnerName))+'</b><span>'+u('week')+' '+D.week+'</span><span>'+u('day')+' '+D.day+' '+u('of')+' '+D.total+'</span></div>'+controls(lang,'setLang')+'</div><div class="tline"><i style="width:'+P+'%"></i></div>';
 const state=w=>w<D.week?'b':w===D.week?'n':'p';
 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 let wk='';if(D.weekInfo){const w=D.weekInfo;wk='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}
 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p>'+(b.next?'<div class="back well">'+kn('arrow')+'<div><b>'+u('comes')+'</b><br>'+lk(x(b.next))+'</div></div>':'')+'<div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.assetFiles&&D.assetFiles.length?'<p class="files">'+ic('folder')+'<span>'+u('filesL')+' '+D.assetFiles.map(f=>'<a href="assets/'+encodeURIComponent(f)+'" target="_blank" rel="noopener">'+esc(f)+'</a>').join(', ')+'</span></p>':D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+=handinCard();h+=beforeCard();
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div><label class="rcpt" for="r'+i+'"><span class="eyebrow">'+u('rcpt')+'</span><textarea id="r'+i+'" rows="2" placeholder="'+esc(u('rcptPh'))+'" oninput="st.r'+i+'=this.value;save()">'+esc(st['r'+i]||'')+'</textarea></label>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+hList()+chkList()+(hasClip?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<h3>1 · '+u('copyR')+'</h3><p class="muted">'+u('report')+'</p><div class="row"><button class="btn ghost" onclick="cp(reportText())">'+ic('copy')+u('copyR')+'</button></div><h3>2 · '+u('ship')+'</h3>'+hf()+'<p class="muted" style="margin:12px 0 0">'+u('hNote')+'</p></section>';
 h+=qCard();h+=wk;
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();
</script>

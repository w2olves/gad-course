<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 50</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

ry building reached; walking paths under 8 % or with steps.", "uk": "Дороги й доріжки: провулки, ґрунтові дороги чи вулиці з плану як сплайни ландшафту (твій метод із Дня 31) або квадрати мощення 2 x 2 м, з'єднані з дорогою острова, до кожної будівлі є шлях; пішохідні доріжки з ухилом менше 8 % або зі сходами."}, {"en": "No grey box, marker or stand-in left visible; everything on DL_District2.", "uk": "Жодного видимого сірого бокса, маркера чи заглушки; усе на DL_District2."}, {"en": "drone_read_d2.md: screenshots at 10, 30 and 60 m along the main route, each with one line: what reads and what doesn't. A drone read means judging the district from the heights a pilot flies.", "uk": "drone_read_d2.md: скриншоти на 10, 30 і 60 м уздовж головного маршруту, до кожного один рядок: що читається, а що ні. Огляд із дрона — це оцінювання району з тих висот, на яких літає пілот."}, {"en": "district2_built_D2_C1.png to district2_built_D2_C5.png (HighResShot 1920x1080 from D2_C1 to D2_C5) with the Day 45 pre-flight check in preflight_d2.md.", "uk": "Від district2_built_D2_C1.png до district2_built_D2_C5.png (HighResShot 1920x1080 з D2_C1-D2_C5) з передпольотною перевіркою з Дня 45 у preflight_d2.md."}, {"en": "A CSV capture of a 60-second flight through district 2: the average and 95th percentile of frame time and GPU time in budget.md, under the budget (average under 16.6 ms, 95th percentile under 33.3 ms).", "uk": "CSV-запис 60-секундного польоту через район 2: середнє і 95-й перцентиль часу кадру й часу GPU в budget.md, у межах бюджету (середнє менше 16,6 мс, 95-й перцентиль менше 33,3 мс)."}, {"en": "week10_review.md: a self-review with the tutor using this rubric, 0 to 2 each: layout matches the plan; buildings seated on the land; roads and paths reach every door; landmark and skyline read from the air; budget held. Then the three most important jobs for Week 11.", "uk": "week10_review.md: самооцінювання з тьютором за цією рубрикою, від 0 до 2 за кожен пункт: планування відповідає плану; будівлі сидять на землі; дороги й доріжки доходять до кожних дверей; орієнтир і силует читаються з повітря; бюджет витримано. Потім три найважливіші завдання на Тиждень 11."}], "piece1": "the main road into district 2", "piece2": {"en": "Every other road and path, the drone read and the CSV capture, on your own and timed (start a 4-hour timer)", "uk": "Усі інші дороги й доріжки, огляд із дрона і CSV-запис, самостійно і на час (запусти таймер на 4 години)"}, "steps": [{"text": {"en": "Start a 4-hour timer. Screenshot D2_C4 for your before picture. List every road, track and path from plot_plan_d2.png with its width in roads_d2.md. Check: one line for each.", "uk": "Запусти таймер на 4 години. Зроби скриншот D2_C4 — це твоє фото «до». Перелічи кожну дорогу, ґрунтову дорогу й доріжку з plot_plan_d2.png з її шириною в roads_d2.md. Перевірка: по одному рядку на кожну."}, "lesson": 2}, {"text": {"en": "Main road: a landscape spline from the island's road into the district, following the land. Check: no part of the road floats or cuts a cliff.", "uk": "Головна дорога: сплайн ландшафту від дороги острова в район, що йде за рельєфом. Перевірка: жодна частина дороги не висить у повітрі й не розрізає скелю."}, "lesson": 2}, {"text": {"en": "Side streets or tracks the same way, joined to the main road. Check: you can follow a road from the island's road to every street.", "uk": "Так само бічні вулиці чи ґрунтові дороги, з'єднані з головною дорогою. Перевірка: від дороги острова можна дійти дорогою до кожної вулиці."}, "lesson": 2}, {"text": {"en": "Paths and steps to every door no street reaches: paving squares or a narrow spline, with steps where it's steeper than 8 %. Check: every door has a way in.", "uk": "Доріжки й сходи до кожних дверей, до яких не доходить вулиця: квадрати мощення або вузький сплайн, зі сходами там, де крутіше за 8 %. Перевірка: до кожних дверей є вхід."}, "lesson": 2}, {"text": {"en": "Clean-up: delete the path markers, the corner markers and any leftover boxes; hide DL_District2 to find strays on the wrong layer. Check: with DL_District2 shown, no grey box or marker shows, and with it hidden, none of today's placed actors show (roads and shelves belong to the landscape and stay).", "uk": "Прибирання: видали маркери доріжок, кутові маркери й залишки боксів; сховай DL_District2, щоб знайти загублене на неправильному шарі. Перевірка: коли DL_District2 показано, не видно жодного сірого бокса чи маркера, а коли приховано — жодного розміщеного сьогодні актора (дороги й уступи належать ландшафту й лишаються)."}, "lesson": 4}, {"text": {"en": "Drone read: screenshots at 10, 30 and 60 m along the main route, one line each in drone_read_d2.md. Check: three shots and three lines.", "uk": "Огляд із дрона: скриншоти на 10, 30 і 60 м уздовж головного маршруту, по одному рядку на кожен у drone_read_d2.md. Перевірка: три кадри й три рядки."}, "lesson": 1}, {"text": {"en": "Shoot D2_C1 to D2_C5 with HighResShot 1920x1080 and run the pre-flight check in preflight_d2.md. Check: a yes or no for every check on every shot.", "uk": "Зніми D2_C1-D2_C5 через HighResShot 1920x1080 і проведи передпольотну перевірку в preflight_d2.md. Перевірка: «так» або «ні» для кожного пункту на кожному кадрі."}, "lesson": 3}, {"text": {"en": "Fix the two biggest faults from the read and the pre-flight check; shoot those cameras again. Check: a before and after pair for each fix.", "uk": "Виправ дві найбільші вади з огляду й передпольотної перевірки; зніми ці камери знову. Перевірка: пара «до і після» для кожного виправлення."}, "lesson": 3}, {"text": {"en": "CSV capture in Play (your Day 33 flying set-up) of a 60-second flight through district 2; work out the average and 95th percentile in your spreadsheet. Check: four numbers in budget.md.", "uk": "CSV-запис у Play (твоє налаштування польоту з Дня 33) 60-секундного польоту через район 2; обчисли середнє і 95-й перцентиль у своїй електронній таблиці. Перевірка: чотири числа в budget.md."}, "lesson": "D41.4"}, {"text": {"en": "If you are over budget, find the biggest cost with stat gpu and fix it (pack loose repeats into a Packed Level Actor, rebuild HLODs with Build > Build HLODs, or remove what no camera sees), then capture again. Check: the new numbers are lower, or you were already under.", "uk": "Якщо ти виходиш за бюджет, знайди найбільшу вартість через stat gpu і виправ її (упакуй окремі повтори в Packed Level Actor, перебудуй HLOD через Build > Build HLODs або прибери те, чого не бачить жодна камера), потім запиши знову. Перевірка: нові числа менші, або числа й так були в межах бюджету."}, "lesson": 4}, {"text": {"en": "Write week10_review.md: score the rubric yourself, then ask the tutor to score it from your 60 m shot and D2_C1 to D2_C5; write three priorities for Week 11. Check: every score has a reason.", "uk": "Напиши week10_review.md: спершу оціни рубрику самостійно, потім попроси тьютора оцінити її за твоїм кадром із 60 м і D2_C1-D2_C5; запиши три пріоритети на Тиждень 11. Перевірка: у кожної оцінки є причина."}, "lesson": 4}, {"text": {"en": "Capture: D2_C4 before and after today (before_after_day50.png), and a 60-second flight from the island road into district 2 and past the landmark. Write your finish time and tier in summary.md. Save today's clip as flythrough_day50.mp4. Check: both files are in today's Work folder.", "uk": "Запис: D2_C4 до і після сьогоднішнього дня (before_after_day50.png) і 60-секундний проліт від дороги острова в район 2 і повз орієнтир. Запиши час фінішу й рівень у summary.md. Збережи сьогоднішнє відео як flythrough_day50.mp4. Перевірка: обидва файли в сьогоднішній папці Work."}, "lesson": 1}], "boss": [{"en": "Bronze: every building and road of district 2 in place with no grey box left, drone_read_d2.md with the three heights and five camera shots (D2_C1 to D2_C5), and a CSV capture with its numbers, inside 4 hours.", "uk": "Бронза: кожна будівля й дорога району 2 на місці, жодного сірого бокса, drone_read_d2.md з трьома висотами й п'ятьма кадрами камер (D2_C1-D2_C5) і CSV-запис із числами, за 4 години."}, {"en": "Silver: Bronze, plus every door reached by a path, the five shots pass the pre-flight check, and the CSV average frame time is under 16.6 ms.", "uk": "Срібло: усе з бронзи, плюс до кожних дверей веде доріжка, п'ять кадрів проходять передпольотну перевірку, а середній час кадру в CSV менше 16,6 мс."}, {"en": "Gold: Silver, plus the 95th percentile is under 33.3 ms, the landmark reads from 300 m or more, the tutor finds no fault in your 60 m read, and you finish inside 3 hours 30.", "uk": "Золото: усе зі срібла, плюс 95-й перцентиль менше 33,3 мс, орієнтир читається з 300 м чи більше, тьютор не знаходить жодної вади у твоєму огляді з 60 м, і ти фінішуєш за 3 години 30 хвилин."}]}, "lessons": [{"title": {"en": "Reading a district from the drone (micro-lesson)", "uk": "Читаємо район із дрона (мікроурок)"}, "minutes": 40, "goals": [{"en": "Read a district at three heights: 60 m for the layout and skyline, 30 m for the streets and colours, 10 m for how buildings meet the ground.", "uk": "Читати район на трьох висотах: 60 м для планування й силуету, 30 м для вулиць і кольорів, 10 м для того, як будівлі сходяться з землею."}, {"en": "Name what a pilot needs first: a landmark to fly toward, open lanes, and routes that make sense.", "uk": "Називати, що пілотові потрібно насамперед: орієнтир, до якого летіти, вільні коридори й маршрути, що мають сенс."}, {"en": "Write one line per view: what reads and what doesn't.", "uk": "Писати по одному рядку на кожен вигляд: що читається, а що ні."}], "doalong": [{"en": "Fly to 60 m above the main route, press G for game view and screenshot. You should see the district's whole shape and the landmark.", "uk": "Підлети на 60 м над головним маршрутом, натисни G для Game View і зроби скриншот. Ти маєш побачити всю форму району й орієнтир."}, {"en": "Drop to 30 m and screenshot. You should see the streets and the roof colours.", "uk": "Знизься до 30 м і зроби скриншот. Ти маєш побачити вулиці й кольори дахів."}, {"en": "Drop to 10 m and screenshot. You should see where walls meet the ground.", "uk": "Знизься до 10 м і зроби скриншот. Ти маєш побачити, де стіни сходяться з землею."}, {"en": "Write one line under each in drone_read_d2.md. You should see three short verdicts.", "uk": "Напиши по одному рядку під кожним у drone_read_d2.md. Ти маєш побачити три короткі вердикти."}], "play": {"en": "Blind read: I send the 60 m shot without telling the tutor my plan. It describes the layout in words; if it matches my plan, I score.", "uk": "Сліпе читання: я надсилаю кадр із 60 м, не розповідаючи тьютору про свій план. Він описує планування словами; якщо це збігається з моїм планом, бал мені."}, "video": {"url": "https://www.youtube.com/watch?v=08kunzHcPV8", "title": "How to design an FPV racetrack that FLOWS - Happy Flying #26", "channel": "UAVfutures", "length": "8:17", "search": "fpv racetrack design flow"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Reading a district from the drone (micro-lesson) (Day 50, lesson 1 of 4).\nToday's build: District 2 built: roads and paths finished to every building, nothing temporary left, a drone read at 10, 30 and 60 m and from five cameras, and a CSV capture that holds the budget.\n\nBy the end of this lesson I can:\n1. Read a district at three heights: 60 m for the layout and skyline, 30 m for the streets and colours, 10 m for how buildings meet the ground.\n2. Name what a pilot needs first: a landmark to fly toward, open lanes, and routes that make sense.\n3. Write one line per view: what reads and what doesn't.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (This week you finished district 1 and raised district 2 from a blockout, with a library of your own buildings and a landmark.), what I will learn today (It is Boss day: you finish district 2's roads and paths to every door, read it from the drone at three heights, and check the budget.), encourage me (Bronze is always on the table today, and two districts on an island you built yourself are already a portfolio piece.), and share today's quote: \"It is possible to fly without motors, but not without knowledge and skill.\" (Wilbur Wright).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 47: name three ways to blend a district's edge into the island. | Day 43: what does a Packed Level Actor do for the frame time?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Blind read: I send the 60 m shot without telling the tutor my plan. It describes the layout in words; if it matches my plan, I score.\n6. Do-along on today's build (the main road into district 2): guide me through these steps one at a time, checking a screenshot after each:\n   - Fly to 60 m above the main route, press G for game view and screenshot. You should see the district's whole shape and the landmark.\n   - Drop to 30 m and screenshot. You should see the streets and the roof colours.\n   - Drop to 10 m and screenshot. You should see where walls meet the ground.\n   - Write one line under each in drone_read_d2.md. You should see three short verdicts.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"How to design an FPV racetrack that FLOWS - Happy Flying #26\" by UAVfutures: https://www.youtube.com/watch?v=08kunzHcPV8\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Roads and paths that reach every door", "uk": "Дороги й доріжки, що доходять до кожних дверей"}, "minutes": 40, "goals": [{"en": "Finish the district's roads as landscape splines that follow the land, joined to the island's road.", "uk": "Доводити дороги району як сплайни ландшафту, що йдуть за рельєфом і з'єднані з дорогою острова."}, {"en": "Reach every door with a street, a track or a path: walking paths under 8 %, or steps.", "uk": "Підводити до кожних дверей вулицю, ґрунтову дорогу чи доріжку: пішохідні доріжки з ухилом менше 8 % або сходи."}, {"en": "Size roads by use: a village lane 3 to 4 m, a farm track about 3 m, a car park aisle about 6 m.", "uk": "Визначати ширину доріг за призначенням: сільський провулок 3-4 м, польова дорога близько 3 м, проїзд на парковці близько 6 м."}], "doalong": [{"en": "Choose Landscape from the mode menu, then Manage > Splines (the tool you used on Day 31). Select a control point on the island's road, then Ctrl+click into the district, as you made a junction on Day 31. You should see a new spline branch with control points that follow the ground.", "uk": "Вибери Landscape у меню режимів, потім Manage > Splines (інструмент, яким ти користуєшся на Дні 31). Виділи контрольну точку на дорозі острова, потім Ctrl+клік усередині району, як ти робиш розвилку на Дні 31. Ти маєш побачити нову гілку сплайна з контрольними точками, що йдуть за землею."}, {"en": "Set its width and its road mesh or paint layer as you did on Day 31. You should see a road as wide as your plan says.", "uk": "Встанови її ширину і сітку дороги чи шар фарбування, як на Дні 31. Ти маєш побачити дорогу такої ширини, як каже твій план."}, {"en": "Raise or lower control points so the road follows the land without cutting a cliff. You should see a smooth climb.", "uk": "Піднімай чи опускай контрольні точки, щоб дорога йшла за рельєфом, не розрізаючи скель. Ти маєш побачити плавний підйом."}, {"en": "Back in Selection mode, lay 2 x 2 m paving squares with MI_Paving_2m (as on Day 42) to doors no road reaches. You should see a way in to every building.", "uk": "Повернувшись у режим Selection, поклади квадрати мощення 2 x 2 м з MI_Paving_2m (як на Дні 42) до дверей, до яких не доходить дорога. Ти маєш побачити вхід до кожної будівлі."}, {"en": "Measure a steep path as on Day 49: the Z difference of two cubes dropped at its ends, divided by its length from the ruler. You should see 0.08 or less; if not, add SM_Steps.", "uk": "Виміряй круту доріжку, як на Дні 49: різниця Z двох кубів, опущених на її кінцях, поділена на її довжину за лінійкою. Ти маєш побачити 0,08 чи менше; якщо ні — додай SM_Steps."}], "play": {"en": "Door audit: the tutor picks five buildings from my plan. I prove each has a way in with a 10 m screenshot.", "uk": "Аудит дверей: тьютор вибирає п'ять будівель із мого плану. Я доводжу скриншотом із 10 м, що до кожної є вхід."}, "video": {"search": "unreal engine 5 landscape spline road tutorial"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Roads and paths that reach every door (Day 50, lesson 2 of 4).\nToday's build: District 2 built: roads and paths finished to every building, nothing temporary left, a drone read at 10, 30 and 60 m and from five cameras, and a CSV capture that holds the budget.\n\nBy the end of this lesson I can:\n1. Finish the district's roads as landscape splines that follow the land, joined to the island's road.\n2. Reach every door with a street, a track or a path: walking paths under 8 %, or steps.\n3. Size roads by use: a village lane 3 to 4 m, a farm track about 3 m, a car park aisle about 6 m.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Door audit: the tutor picks five buildings from my plan. I prove each has a way in with a 10 m screenshot.\n4. Do-along on today's build (the main road into district 2): guide me through these steps one at a time, checking a screenshot after each:\n   - Choose Landscape from the mode menu, then Manage > Splines (the tool you used on Day 31). Select a control point on the island's road, then Ctrl+click into the district, as you made a junction on Day 31. You should see a new spline branch with control points that follow the ground.\n   - Set its width and its road mesh or paint layer as you did on Day 31. You should see a road as wide as your plan says.\n   - Raise or lower control points so the road follows the land without cutting a cliff. You should see a smooth climb.\n   - Back in Selection mode, lay 2 x 2 m paving squares with MI_Paving_2m (as on Day 42) to doors no road reaches. You should see a way in to every building.\n   - Measure a steep path as on Day 49: the Z difference of two cubes dropped at its ends, divided by its length from the ruler. You should see 0.08 or less; if not, add SM_Steps.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Pre-flight and fast fixes under the clock", "uk": "Передпольотна перевірка й швидкі виправлення на час"}, "minutes": 40, "goals": [{"en": "Shoot D2_C1 to D2_C5 the same clean way as on Day 45.", "uk": "Знімати D2_C1-D2_C5 так само чисто, як на Дні 45."}, {"en": "Run the pre-flight check and fix only the faults that show most.", "uk": "Проводити передпольотну перевірку й виправляти лише найпомітніші вади."}, {"en": "Keep a before and after pair for each fix.", "uk": "Зберігати пару «до і після» для кожного виправлення."}], "doalong": [{"en": "Pilot D2_C1, press G and run HighResShot 1920x1080; rename the file district2_built_D2_C1.png. You should see a clean shot with no icons.", "uk": "Керуй D2_C1 (Pilot), натисни G і виконай HighResShot 1920x1080; перейменуй файл на district2_built_D2_C1.png. Ти маєш побачити чистий кадр без значків."}, {"en": "Repeat for D2_C2 to D2_C5. You should see five files in a folder district2_built.", "uk": "Повтори для D2_C2-D2_C5. Ти маєш побачити п'ять файлів у папці district2_built."}, {"en": "Copy preflight_d1.md to preflight_d2.md and run the seven checks on each shot at 200 % in Krita. You should see a yes or no in every cell.", "uk": "Скопіюй preflight_d1.md у preflight_d2.md і проведи сім перевірок на кожному кадрі при 200 % у Krita. Ти маєш побачити «так» або «ні» в кожній клітинці."}, {"en": "Fix the two biggest faults in the level and shoot those cameras again. You should see two before and after pairs.", "uk": "Виправ дві найбільші вади на рівні й зніми ці камери знову. Ти маєш побачити дві пари «до і після»."}], "play": {"en": "Three lives: the tutor hunts faults in my five shots. I fix each within 5 minutes or lose a life.", "uk": "Три життя: тьютор шукає вади на моїх п'яти кадрах. Я виправляю кожну за 5 хвилин, інакше втрачаю життя."}, "video": {"url": "https://www.youtube.com/watch?v=xW-ns1dCEMk", "title": "How To Take A High Resolution Screenshot In Unreal Engine 5.6", "channel": "Pitchfork Academy", "length": "8:35", "search": "unreal engine 5 high resolution screenshot"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Pre-flight and fast fixes under the clock (Day 50, lesson 3 of 4).\nToday's build: District 2 built: roads and paths finished to every building, nothing temporary left, a drone read at 10, 30 and 60 m and from five cameras, and a CSV capture that holds the budget.\n\nBy the end of this lesson I can:\n1. Shoot D2_C1 to D2_C5 the same clean way as on Day 45.\n2. Run the pre-flight check and fix only the faults that show most.\n3. Keep a before and after pair for each fix.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Three lives: the tutor hunts faults in my five shots. I fix each within 5 minutes or lose a life.\n4. Do-along on today's build (the main road into district 2): guide me through these steps one at a time, checking a screenshot after each:\n   - Pilot D2_C1, press G and run HighResShot 1920x1080; rename the file district2_built_D2_C1.png. You should see a clean shot with no icons.\n   - Repeat for D2_C2 to D2_C5. You should see five files in a folder district2_built.\n   - Copy preflight_d1.md to preflight_d2.md and run the seven checks on each shot at 200 % in Krita. You should see a yes or no in every cell.\n   - Fix the two biggest faults in the level and shoot those cameras again. You should see two before and after pairs.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"How To Take A High Resolution Screenshot In Unreal Engine 5.6\" by Pitchfork Academy: https://www.youtube.com/watch?v=xW-ns1dCEMk\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "The budget check and the week's self-review", "uk": "Перевірка бюджету й самооцінювання тижня"}, "minutes": 40, "goals": [{"en": "Run the Day 41 CSV method on district 2 and compare the numbers with budget.md.", "uk": "Застосовувати метод CSV з Дня 41 до району 2 й порівнювати числа з budget.md."}, {"en": "Fix the biggest cost first if you are over budget: pack loose repeats into Packed Level Actors, rebuild HLODs, or remove what no camera sees.", "uk": "Спершу виправляти найбільшу вартість, якщо виходиш за бюджет: пакувати окремі повтори в Packed Level Actors, перебудовувати HLOD або прибирати те, чого не бачить жодна камера."}, {"en": "Score the week with the rubric, first yourself and then with the tutor, and choose three priorities for Week 11.", "uk": "Оцінювати тиждень за рубрикою, спершу самостійно, а потім із тьютором, і вибирати три пріоритети на Тиждень 11."}], "doalong": [{"en": "Hide DL_District2 in the Data Layer Outliner (click its eye icon). You should see the district empty except the roads and shelves, which belong to the landscape; any placed actor still standing is on the wrong layer, so move it.", "uk": "Сховай DL_District2 у Data Layer Outliner (клацни його значок ока). Ти маєш побачити порожній район, крім доріг і уступів, які належать ландшафту; кожен розміщений актор, що досі стоїть, лежить на неправильному шарі, тож перенеси його."}, {"en": "Press Play in a New Editor Window: your Day 33 set-up flies you. Type csvprofile start, fly 60 seconds through district 2, then type csvprofile stop. You should see a new .csv in IslandCourse/Saved/Profiling/CSV.", "uk": "Натисни Play у New Editor Window: твоє налаштування з Дня 33 дає змогу літати. Введи csvprofile start, пролети 60 секунд через район 2, потім введи csvprofile stop. Ти маєш побачити новий .csv в IslandCourse/Saved/Profiling/CSV."}, {"en": "Open it as on Day 41 (Language English (USA)) and work out =AVERAGE() and =PERCENTILE(..., 0.95) for frame time and GPU time. You should see four numbers to compare with budget.md.", "uk": "Відкрий його, як на Дні 41 (Language English (USA)), і обчисли =AVERAGE() і =PERCENTILE(..., 0.95) для часу кадру й часу GPU. Ти маєш побачити чотири числа, які треба порівняти з budget.md."}, {"en": "If you are over budget, run stat gpu at the slowest spot and fix its top line. You should see that number drop.", "uk": "Якщо виходиш за бюджет, виконай stat gpu в найповільнішому місці й виправ його верхній рядок. Ти маєш побачити, як це число зменшується."}, {"en": "Score the five rubric lines 0 to 2 in week10_review.md, then paste it with your shots into the tutor chat for its score. You should see two totals out of 10 and the lines where you differ.", "uk": "Оціни п'ять рядків рубрики від 0 до 2 у week10_review.md, потім встав файл разом зі своїми кадрами в чат із тьютором, щоб отримати його оцінку. Ти маєш побачити два загальні бали з 10 і рядки, де ви розходитеся."}], "play": {"en": "Rubric duel: I score my district first, then the tutor scores it from my shots. We discuss any line where we differ by more than 1.", "uk": "Дуель рубрик: спершу я оцінюю свій район, потім тьютор оцінює його за моїми кадрами. Ми обговорюємо кожен рядок, де розходимося більш ніж на 1."}, "video": {"url": "https://www.youtube.com/watch?v=mCZRHljYnZA", "title": "Technical Artist's Guide to Profiling in Unreal Engine | Unreal Fest Orlando 2025", "channel": "Unreal Engine", "length": "33:26", "search": "technical artist guide to profiling unreal engine"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: The budget check and the week's self-review (Day 50, lesson 4 of 4).\nToday's build: District 2 built: roads and paths finished to every building, nothing temporary left, a drone read at 10, 30 and 60 m and from five cameras, and a CSV capture that holds the budget.\n\nBy the end of this lesson I can:\n1. Run the Day 41 CSV method on district 2 and compare the numbers with budget.md.\n2. Fix the biggest cost first if you are over budget: pack loose repeats into Packed Level Actors, rebuild HLODs, or remove what no camera sees.\n3. Score the week with the rubric, first yourself and then with the tutor, and choose three priorities for Week 11.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Rubric duel: I score my district first, then the tutor scores it from my shots. We discuss any line where we differ by more than 1.\n4. Do-along on today's build (the main road into district 2): guide me through these steps one at a time, checking a screenshot after each:\n   - Hide DL_District2 in the Data Layer Outliner (click its eye icon). You should see the district empty except the roads and shelves, which belong to the landscape; any placed actor still standing is on the wrong layer, so move it.\n   - Press Play in a New Editor Window: your Day 33 set-up flies you. Type csvprofile start, fly 60 seconds through district 2, then type csvprofile stop. You should see a new .csv in IslandCourse/Saved/Profiling/CSV.\n   - Open it as on Day 41 (Language English (USA)) and work out =AVERAGE() and =PERCENTILE(..., 0.95) for frame time and GPU time. You should see four numbers to compare with budget.md.\n   - If you are over budget, run stat gpu at the slowest spot and fix its top line. You should see that number drop.\n   - Score the five rubric lines 0 to 2 in week10_review.md, then paste it with your shots into the tutor chat for its score. You should see two totals out of 10 and the lines where you differ.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Technical Artist's Guide to Profiling in Unreal Engine | Unreal Fest Orlando 2025\" by Unreal Engine: https://www.youtube.com/watch?v=mCZRHljYnZA\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "roads_d2.md", "uk": "roads_d2.md"}, {"en": "drone_read_d2.md with the 10, 30 and 60 m shots", "uk": "drone_read_d2.md з кадрами з 10, 30 і 60 м"}, {"en": "district2_built/ (district2_built_D2_C1.png to district2_built_D2_C5.png) and preflight_d2.md", "uk": "district2_built/ (від district2_built_D2_C1.png до district2_built_D2_C5.png) і preflight_d2.md"}, {"en": "The before and after pairs of today's fixes", "uk": "Пари «до і після» для сьогоднішніх виправлень"}, {"en": "budget.md with the district 2 CSV numbers, and the CSV file", "uk": "budget.md із числами CSV для району 2 і файл CSV"}, {"en": "week10_review.md (both rubric scores and three priorities for Week 11)", "uk": "week10_review.md (обидві оцінки за рубрикою і три пріоритети на Тиждень 11)"}, {"en": "Boss evidence: your finish time and tier (Bronze, Silver or Gold) in summary.md", "uk": "Докази Дня боса: твій час фінішу й рівень (Бронза, Срібло чи Золото) у summary.md"}, {"en": "before_after_day50.png (D2_C4 before and after) and flythrough_day50.mp4 (60 seconds from the island road into district 2)", "uk": "before_after_day50.png (D2_C4 до і після) і flythrough_day50.mp4 (60 секунд від дороги острова в район 2)"}, {"en": "summary.md", "uk": "звіт дня (summary.md)"}], "goal": {"en": "By the end of today you have district 2 complete in its big shapes: every building and road in place, every door reached, and a drone read at three heights that proves it works from the air and within your budget.", "uk": "Наприкінці дня в тебе є район 2, завершений у великих формах: кожна будівля й дорога на місці, до кожних дверей є шлях, а огляд із дрона на трьох висотах доводить, що район працює з повітря і вкладається в бюджет."}, "uses": [{"en": "Days 48 and 49: district 2's blockout, library, buildings, landmark and cameras D2_C1 to D2_C5", "uk": "Дні 48 і 49: блокаут району 2, бібліотека, будівлі, орієнтир і камери D2_C1-D2_C5"}, {"en": "Day 31: your landscape spline roads", "uk": "День 31: твої дороги на сплайнах ландшафту"}, {"en": "Day 33: DL_District2, the flying Play set-up and Build HLODs", "uk": "День 33: DL_District2, налаштування польоту в Play і Build HLODs"}, {"en": "Day 41: budget.md and the CSV capture method", "uk": "День 41: budget.md і метод CSV-запису"}, {"en": "Day 45: the pre-flight check and the rubric", "uk": "День 45: передпольотна перевірка і рубрика"}, {"en": "Day 47: the obvious route, and Day 38: LaneGauge", "uk": "День 47: очевидний маршрут, і День 38: LaneGauge"}], "quiz": [{"q": {"en": "Why fix a review note at its source (Day 46)?", "uk": "Навіщо виправляти нотатку огляду в її джерелі (День 46)?"}, "options": [{"en": "So the fix holds from every camera, not just one", "uk": "Щоб виправлення трималося з кожної камери, а не лише з однієї"}, {"en": "So the note disappears from the list faster", "uk": "Щоб нотатка швидше зникла зі списку"}, {"en": "Because sources are easier to change", "uk": "Бо джерела легше змінювати"}, {"en": "So you don't need r2 shots", "uk": "Щоб не потрібні були кадри r2"}], "answer": 0, "explain": {"en": "A fix made where the problem comes from (plan, placement, graph, material, light) shows correctly from every view.", "uk": "Виправлення, зроблене там, звідки береться проблема (план, розміщення, граф, матеріал, світло), правильно видно з кожного вигляду."}}, {"q": {"en": "Your Difference layer shows light patches all over the picture, not just where you fixed things. What happened?", "uk": "Твій шар Difference показує світлі плями по всій картинці, а не лише там, де ти щось виправляєш. Що сталося?"}, "options": [{"en": "Your fixes were too big", "uk": "Твої виправлення були завеликими"}, {"en": "The camera or the exposure changed between r1 and r2; lock both and shoot again", "uk": "Між r1 і r2 змінилася камера чи експозиція; заблокуй обидві й зніми знову"}, {"en": "Krita is broken", "uk": "Krita зламалася"}, {"en": "Difference always looks like that", "uk": "Difference завжди так виглядає"}], "answer": 1, "explain": {"en": "If the camera or the light moved, every pixel changes. Locked camera and exposure make the pair honest.", "uk": "Якщо зрушила камера чи світло, змінюється кожен піксель. Заблоковані камера й експозиція роблять пару чесною."}}, {"q": {"en": "What makes a district's edge look natural from 60 m (Day 47)?", "uk": "Що робить край району природним із 60 м (День 47)?"}, "options": [{"en": "A straight wall of trees round it", "uk": "Пряма стіна дерев навколо нього"}, {"en": "Fog over the edge", "uk": "Туман над краєм"}, {"en": "The keep-out hugging the built area, roads and rock continuing to a natural stop, and detail thinning outward", "uk": "Зона-виняток облягає забудову, дороги й скелі тягнуться до природного завершення, а деталей меншає назовні"}, {"en": "A bigger district", "uk": "Більший район"}], "answer": 2, "explain": {"en": "Edges blend when the island's nature reaches the buildings and detail fades gradually.", "uk": "Краї зливаються, коли природа острова доходить до будівель, а деталей поступово меншає."}}, {"q": {"en": "Your D2_C3 subject sits dead centre and half a lamp post is cut off at the left edge. What do you change?", "uk": "Предмет твоєї D2_C3 стоїть точно по центру, а пів ліхтаря обрізано лівим краєм. Що ти змінюєш?"}, "options": [{"en": "Nothing; centre is always best", "uk": "Нічого; центр завжди найкращий"}, {"en": "Move the building", "uk": "Пересуваю будівлю"}, {"en": "Raise the camera to 100 m", "uk": "Піднімаю камеру на 100 м"}, {"en": "Turn the camera a little so the subject sits on a third, and move the lamp post up to 2 m so the edge is clean", "uk": "Трохи повертаю камеру, щоб предмет став на третину, і пересуваю ліхтар до 2 м, щоб край був чистим"}], "answer": 3, "explain": {"en": "Subjects on a third and clean frame edges make a stronger frame, using small camera and prop moves.", "uk": "Предмет на третині й чисті краї кадру роблять кадр сильнішим за допомогою дрібних зсувів камери й пропсів."}}, {"q": {"en": "A fence run is repeated 40 times in district 2 and never changes. Which tool fits best (Day 48)?", "uk": "Ділянка паркану повторюється в районі 2 40 разів і ніколи не змінюється. Який інструмент пасує найкраще (День 48)?"}, "options": [{"en": "A Packed Level Actor", "uk": "Packed Level Actor"}, {"en": "A Level Instance with lights inside", "uk": "Level Instance зі світлом усередині"}, {"en": "40 separate actors", "uk": "40 окремих акторів"}], "answer": 0, "explain": {"en": "Identical meshes repeated many times are what Packed Level Actors are for: one placeable set, drawn as instances.", "uk": "Однакові сітки, що повторюються багато разів, — саме для цього Packed Level Actors: один набір, який можна розставляти, що малюється як інстанси."}}, {"q": {"en": "The plan shows 14 buildings, but your blockout has 12 grey boxes. What do you do before swapping in real buildings?", "uk": "План показує 14 будівель, а в твоєму блокауті 12 сірих боксів. Що ти робиш, перш ніж ставити справжні будівлі?"}, "options": [{"en": "Swap the 12 and forget the rest", "uk": "Замінюю 12 і забуваю про решту"}, {"en": "Find the two missing rows on the plan and block them out, or write in plan_check_d2.md why they changed", "uk": "Знаходжу на плані два пропущені рядки й роблю для них блокаут або записую в plan_check_d2.md, чому вони змінилися"}, {"en": "Add two random houses", "uk": "Додаю два випадкові будинки"}, {"en": "Change the plan to 12 without a note", "uk": "Змінюю план на 12 без нотатки"}], "answer": 1, "explain": {"en": "The blockout must match the plan, or the plan must be changed on purpose with a note.", "uk": "Блокаут мусить відповідати плану, або план треба змінити свідомо, з нотаткою."}}, {"q": {"en": "From 300 m along the road, trees hide your lighthouse. What is the best fix (Day 49)?", "uk": "З 300 м уздовж дороги дерева ховають твій маяк. Яке найкраще виправлення (День 49)?"}, "options": [{"en": "Accept it; a landmark doesn't need to be seen", "uk": "Змиритися; орієнтир не мусить бути видимим"}, {"en": "Make the lighthouse glow", "uk": "Зробити так, щоб маяк світився"}, {"en": "Clear the sightline (thin or move the trees on that line) or move the landmark where the road sees it", "uk": "Звільнити лінію огляду (проріджити чи пересунути дерева на цій лінії) або перенести орієнтир туди, де його видно з дороги"}, {"en": "Add a sign that says 'lighthouse'", "uk": "Додати табличку «маяк»"}], "answer": 2, "explain": {"en": "A landmark only works if pilots can see it; keep its sightlines open.", "uk": "Орієнтир працює, лише коли пілоти його бачать; тримай його лінії огляду вільними."}}, {"q": {"en": "At which height do you best judge how buildings meet the ground?", "uk": "На якій висоті найкраще оцінювати, як будівлі сходяться з землею?"}, "options": [{"en": "10 m", "uk": "10 м"}, {"en": "30 m", "uk": "30 м"}, {"en": "60 m", "uk": "60 м"}, {"en": "300 m", "uk": "300 м"}], "answer": 0, "explain": {"en": "At 10 m you see bases, gaps and steps. 30 m shows streets and colours; 60 m shows the layout.", "uk": "З 10 м видно основи, щілини й сходи. З 30 м видно вулиці й кольори; з 60 м — планування."}}], "weekInfo": {"week": 10, "title": {"en": "District 1 finished, district 2 built", "uk": "Район 1 завершено, район 2 збудовано"}, "goal": {"en": "By Friday you have district 1 finished with before and after proof, and district 2 standing: its buildings, landmark and roads in place, read from the drone and inside your budget.", "uk": "До п'ятниці в тебе є завершений район 1 із доказами «до і після» та район 2, що вже стоїть: його будівлі, орієнтир і дороги на місці, вони добре читаються з дрона й вкладаються в бюджет."}, "skills": [{"en": "Iterating an environment from review notes, with before and after evidence", "uk": "Доопрацювання оточення за нотатками рев'ю, з доказами «до і після»"}, {"en": "Composition, landmarks and sightlines for aerial and drone cameras", "uk": "Композиція, орієнтири й лінії огляду для повітряних камер і камер дрона"}, {"en": "Edge blending between hand-built areas and procedural landscapes", "uk": "Плавні переходи між зробленими вручну ділянками та процедурним ландшафтом"}, {"en": "Greybox blockout to final placement with a reusable building library", "uk": "Від грейбокс-блокауту до фінального розміщення з бібліотекою будівель для повторного використання"}, {"en": "Landscape spline roads and paths that follow real terrain", "uk": "Дороги й стежки на сплайнах ландшафту (Landscape Splines), що йдуть за справжнім рельєфом"}]}, "morning": {"sofar": {"en": "This week you finished district 1 and raised district 2 from a blockout, with a library of your own buildings and a landmark.", "uk": "Цього тижня район 1 завершено, а район 2 виріс із блокауту — з бібліотекою твоїх власних будівель і орієнтиром."}, "today": {"en": "It is Boss day: you finish district 2's roads and paths to every door, read it from the drone at three heights, and check the budget.", "uk": "Сьогодні День боса: ти завершуєш дороги й стежки району 2 до кожних дверей, читаєш його з дрона на трьох висотах і перевіряєш бюджет."}, "cheer": {"en": "Bronze is always on the table today, and two districts on an island you built yourself are already a portfolio piece.", "uk": "Бронза сьогодні, як завжди, в межах досяжного, а два райони на острові, який ти створюєш власноруч, — це вже робота для портфоліо."}, "quote": {"text": {"en": "It is possible to fly without motors, but not without knowledge and skill.", "uk": "Літати можна без моторів, але не без знань і вмінь."}, "author": {"en": "Wilbur Wright", "uk": "Вілбур Райт"}, "source": "https://en.wikiquote.org/wiki/Wilbur_Wright"}}, "hasAssets": false, "workPath": "Work\\Assignment\\Day-50-boss-district2-built", "mapHref": "../../COURSE.html", "prevHref": "../Day-49-district2-buildings/START-HERE.html", "nextHref": "../Day-51-district2-props-and-furniture/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8, Krita and a free spreadsheet. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me and don't write code. Keep me moving and make it feel like a game.\n\nToday I build on my own: Every other road and path, the drone read and the CSV capture, on your own and timed (start a 4-hour timer).\nIt's part of: District 2 built: roads and paths finished to every building, nothing temporary left, a drone read at 10, 30 and 60 m and from five cameras, and a CSV capture that holds the budget (District 2, the roads in and out of it, and the air above it at 10, 30 and 60 m.).\n\nSpec:\n- Roads and paths: the plan's lanes, tracks or streets as landscape splines (your Day 31 method) or 2 x 2 m paving squares, joined to the island's road, every building reached; walking paths under 8 % or with steps.\n- No grey box, marker or stand-in left visible; everything on DL_District2.\n- drone_read_d2.md: screenshots at 10, 30 and 60 m along the main route, each with one line: what reads and what doesn't. A drone read means judging the district from the heights a pilot flies.\n- district2_built_D2_C1.png to district2_built_D2_C5.png (HighResShot 1920x1080 from D2_C1 to D2_C5) with the Day 45 pre-flight check in preflight_d2.md.\n- A CSV capture of a 60-second flight through district 2: the average and 95th percentile of frame time and GPU time in budget.md, under the budget (average under 16.6 ms, 95th percentile under 33.3 ms).\n- week10_review.md: a self-review with the tutor using this rubric, 0 to 2 each: layout matches the plan; buildings seated on the land; roads and paths reach every door; landmark and skyline read from the air; budget held. Then the three most important jobs for Week 11.\n\nMy checklist:\n1. Start a 4-hour timer. Screenshot D2_C4 for your before picture. List every road, track and path from plot_plan_d2.png with its width in roads_d2.md. Check: one line for each. (from lesson 2)\n2. Main road: a landscape spline from the island's road into the district, following the land. Check: no part of the road floats or cuts a cliff. (from lesson 2)\n3. Side streets or tracks the same way, joined to the main road. Check: you can follow a road from the island's road to every street. (from lesson 2)\n4. Paths and steps to every door no street reaches: paving squares or a narrow spline, with steps where it's steeper than 8 %. Check: every door has a way in. (from lesson 2)\n5. Clean-up: delete the path markers, the corner markers and any leftover boxes; hide DL_District2 to find strays on the wrong layer. Check: with DL_District2 shown, no grey box or marker shows, and with it hidden, none of today's placed actors show (roads and shelves belong to the landscape and stay). (from lesson 4)\n6. Drone read: screenshots at 10, 30 and 60 m along the main route, one line each in drone_read_d2.md. Check: three shots and three lines. (from lesson 1)\n7. Shoot D2_C1 to D2_C5 with HighResShot 1920x1080 and run the pre-flight check in preflight_d2.md. Check: a yes or no for every check on every shot. (from lesson 3)\n8. Fix the two biggest faults from the read and the pre-flight check; shoot those cameras again. Check: a before and after pair for each fix. (from lesson 3)\n9. CSV capture in Play (your Day 33 flying set-up) of a 60-second flight through district 2; work out the average and 95th percentile in your spreadsheet. Check: four numbers in budget.md. (from day 41, lesson 4)\n10. If you are over budget, find the biggest cost with stat gpu and fix it (pack loose repeats into a Packed Level Actor, rebuild HLODs with Build > Build HLODs, or remove what no camera sees), then capture again. Check: the new numbers are lower, or you were already under. (from lesson 4)\n11. Write week10_review.md: score the rubric yourself, then ask the tutor to score it from your 60 m shot and D2_C1 to D2_C5; write three priorities for Week 11. Check: every score has a reason. (from lesson 4)\n12. Capture: D2_C4 before and after today (before_after_day50.png), and a 60-second flight from the island road into district 2 and past the landmark. Write your finish time and tier in summary.md. Save today's clip as flythrough_day50.mp4. Check: both files are in today's Work folder. (from lesson 1)\n\nToday is a BOSS build: help me keep time against the tiers below. Tiers:\n- Bronze: every building and road of district 2 in place with no grey box left, drone_read_d2.md with the three heights and five camera shots (D2_C1 to D2_C5), and a CSV capture with its numbers, inside 4 hours.\n- Silver: Bronze, plus every door reached by a path, the five shots pass the pre-flight check, and the CSV average frame time is under 16.6 ms.\n- Gold: Silver, plus the 95th percentile is under 33.3 ms, the landmark reads from 300 m or more, the tutor finds no fault in your 60 m read, and you finish inside 3 hours 30.\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me and tell me which tier I reached.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Karina\nDay 50: Boss: district 2 built, read from the drone. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; boss tier: <bronze / silver / gold / none>; quiz: <score> of 8\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p><div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+list(D.handin,'ul','ticks')+'<p class="path">'+ic('folder')+'<span>'+u('shipTo')+' <code>'+esc(D.workPath)+'</code></span></p>'+(D.lessons.length?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<p class="muted">'+u('report')+'</p><div class="row"><button class="btn s" onclick="cp(D.reportPrompt)">'+ic('copy')+u('copyR')+'</button></div></section>';
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();

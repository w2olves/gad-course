<script id="data" type="application/json">{"learner": "ib-karina-648be559", "learnerName": {"en": "Karina", "uk": "Каріна"}, "day": 18, "week": 4, "total": 60, "title": {"en": "Decals: salt lines, algae, puddles and tyre tracks", "uk": "Декалі: сольові лінії, водорості, калюжі й сліди шин"}, "theme": {"en": "Week 4: The Unreal look", "uk": "Тиждень 4: Вигляд в Unreal"}, "build": {"item": {"en": "A harbour decal set, and the quay dressed with it", "uk": "Набір декалей для гавані й набережна, оздоблена ним"}, "why": {"en": "A decal is an image projected onto whatever surface sits inside its box, like a slide projector. It adds marks without new models or new textures on your kit. Decals tell the eye a story: where the tide reaches, where water pools, where vans turn. Studios reuse a small set many times, turned and scaled, and watch the cost: without decals a world looks brand new, with too many it looks dirty and runs slowly.", "uk": "Декаль — це зображення, що проєктується на будь-яку поверхню всередині її коробки, як діапроектор. Вона додає сліди без нових моделей і нових текстур на твоєму наборі. Декалі розповідають оку історію: куди сягає приплив, де збирається вода, де розвертаються фургони. Студії багато разів повторно використовують невеликий набір декалей, повертаючи й масштабуючи їх, і стежать за вартістю: без декалей світ виглядає новеньким, а з надто великою кількістю — брудним і працює повільно."}, "where": {"en": "L_KitTest: the quay wall at the waterline (where it meets the lowered Floor, your stand-in water), the 4 x 4 m paving plane on the Land block, and a van turning spot on the land at one end of the quay.", "uk": "L_KitTest: стінка набережної біля ватерлінії (там, де вона зустрічається з опущеним Floor, твоєю тимчасовою водою), площина бруківки 4 x 4 м на блоці Land і місце розвороту фургона на суші в одному кінці набережної."}, "spec": [{"en": "Four decal textures painted in Krita on a transparent background, saved as PNG: T_Decal_SaltLine and T_Decal_Algae (2048 x 512, covering 4 x 1 m, tiling left to right), T_Decal_Puddle (1024 x 1024) and T_Decal_TyreTrack (2048 x 512).", "uk": "Чотири текстури декалей, намальовані в Krita на прозорому тлі й збережені як PNG: T_Decal_SaltLine і T_Decal_Algae (2048 x 512, покривають 4 x 1 м, тайляться зліва направо), T_Decal_Puddle (1024 x 1024) і T_Decal_TyreTrack (2048 x 512)."}, {"en": "M_Decal_Master: Material Domain Deferred Decal, Blend Mode Translucent, with Colour, Opacity and Roughness parameters; one instance per texture (MI_Decal_SaltLine, MI_Decal_Algae, MI_Decal_Puddle, MI_Decal_TyreTrack).", "uk": "M_Decal_Master: Material Domain Deferred Decal, Blend Mode Translucent, з параметрами Colour, Opacity і Roughness; по одному інстансу на текстуру (MI_Decal_SaltLine, MI_Decal_Algae, MI_Decal_Puddle, MI_Decal_TyreTrack)."}, {"en": "Quay wall: algae at the waterline (the line where the wall meets the Floor, 1 m below the deck) and a salt line just above it, with breaks every few metres; never a ruler-straight line.", "uk": "Стінка набережної: водорості біля ватерлінії (лінії, де стінка зустрічається з Floor, на 1 м нижче настилу) і сольова лінія трохи вище, з розривами кожні кілька метрів; ніколи не рівна, як під лінійку."}, {"en": "Ground: one or two puddles in low spots, and tyre tracks where a van drives in, turns and stops, never across a bench area.", "uk": "Земля: одна-дві калюжі в низинах і сліди шин там, де фургон заїжджає, розвертається й зупиняється, але ніколи не через зону з лавками."}, {"en": "Puddles have Roughness 0.05 to 0.1, so they reflect the sky.", "uk": "Калюжі мають Roughness від 0.05 до 0.1, тож у них відбивається небо."}, {"en": "At most 25 decal actors; Fade Screen Size raised on small ones; stat unit's GPU time written down before and after.", "uk": "Не більше 25 акторів-декалей; на малих Fade Screen Size збільшено; час GPU зі stat unit записано до і після."}], "piece1": "the algae and salt line on the quay wall (shared with the lessons)", "piece2": {"en": "Puddles and tyre tracks on the ground, and the cost check, on your own", "uk": "Калюжі й сліди шин на землі та перевірка вартості, самостійно"}, "steps": [{"text": {"en": "Collect three Wikimedia Commons photos of real harbour walls and quays showing an algae band, salt above it, puddles and tyre marks. Credit them, and circle each mark in Krita. Check: decal_references.png shows every mark circled.", "uk": "Збери на Wikimedia Commons три фото справжніх стін гаваней і набережних зі смугою водоростей, сіллю над нею, калюжами й слідами шин. Вкажи авторів і обведи кожен слід у Krita. Перевірка: на decal_references.png обведено кожен слід."}, "lesson": 3}, {"text": {"en": "Paint T_Decal_Puddle in Krita: 1024 x 1024 on a transparent background, an irregular dark wet shape with soft, broken edges. Export as PNG. Check: in Krita the grey-white checker pattern (transparency) shows all round the puddle.", "uk": "Намалюй T_Decal_Puddle у Krita: 1024 x 1024 на прозорому тлі, неправильна темна мокра форма з м'якими уривчастими краями. Експортуй як PNG. Перевірка: у Krita сіро-біла шахівниця (прозорість) видна навколо всієї калюжі."}, "lesson": 2}, {"text": {"en": "Paint T_Decal_TyreTrack: 2048 x 512, transparent, one dark, broken tyre band along the middle with faint tread marks, fading out at both ends. It covers 4 m x 1 m, and you place one per wheel. Export as PNG. Check: both ends fade to nothing, so tracks can overlap.", "uk": "Намалюй T_Decal_TyreTrack: 2048 x 512, прозоре тло, одна темна уривчаста смуга шини посередині з ледь помітними слідами протектора, що згасає на обох кінцях. Вона покриває 4 м x 1 м, і ти ставиш по одній на кожне колесо. Експортуй як PNG. Перевірка: обидва кінці згасають до нуля, тож сліди можуть накладатися."}, "lesson": 2}, {"text": {"en": "Import both and make MI_Decal_Puddle (Roughness 0.05, Opacity 0.9) and MI_Decal_TyreTrack (Roughness 0.8, Opacity 0.6). Check: both show in Course/Day18 with the MI_Decal_ prefix.", "uk": "Імпортуй обидві й створи MI_Decal_Puddle (Roughness 0.05, Opacity 0.9) і MI_Decal_TyreTrack (Roughness 0.8, Opacity 0.6). Перевірка: обидва видно в Course/Day18 з префіксом MI_Decal_."}, "lesson": 1}, {"text": {"en": "Find the low spots on your paving plane and on the quay. Place one or two puddles there, each turned and scaled differently. Check: when you swing the sun (Ctrl+L), the puddles shine like water.", "uk": "Знайди низини на площині бруківки й на набережній. Постав туди одну-дві калюжі, кожну повернуту й масштабовану по-своєму. Перевірка: коли ти повертаєш сонце (Ctrl+L), калюжі блищать, як вода."}, "lesson": 3}, {"text": {"en": "Plan the van spot: in Krita, sketch from above where a small van would drive across the Land block to the end of the quay, turn and stop. Check: the sketch shows the two wheel lines (about 1.7 m apart) and where the van stops.", "uk": "Сплануй місце для фургона: у Krita намалюй вид згори, де маленький фургон проїжджав би через блок Land до кінця набережної, розвертався й зупинявся. Перевірка: на ескізі видно дві лінії коліс (приблизно 1,7 м одна від одної) і місце, де фургон зупиняється."}, "lesson": 3}, {"text": {"en": "Lay tyre tracks along the sketch: short decals following the turn, each turned a little more than the last, their faded ends overlapping. Check: from 10 m the tracks read as one smooth curve.", "uk": "Поклади сліди шин уздовж ескізу: короткі декалі вздовж повороту, кожна трохи більше повернута, ніж попередня, з кінцями, що згасають і накладаються. Перевірка: з 10 м сліди читаються як одна плавна крива."}, "lesson": 3}, {"text": {"en": "Finish the quay wall along the whole quay in L_KitTest: algae and salt with breaks, a little darker near the steps where water runs off. Check: from 2 m and 10 m you can't find a ruler-straight line.", "uk": "Заверши стінку вздовж усієї набережної в L_KitTest: водорості й сіль з розривами, трохи темніше біля сходів, де стікає вода. Перевірка: з 2 м і з 10 м неможливо знайти лінію, рівну, як під лінійку."}, "lesson": 3}, {"text": {"en": "Cost: count the decal actors (type Decal in the Outliner's search box), raise Fade Screen Size to 0.05 on small ones, and note stat unit's GPU time before and after. Check: decal_cost.md shows the count (25 or fewer) and both times.", "uk": "Вартість: порахуй актори-декалі (введи Decal у пошук Outliner), збільш Fade Screen Size до 0.05 на малих і запиши час GPU зі stat unit до і після. Перевірка: decal_cost.md показує кількість (25 або менше) і обидва значення часу."}, "lesson": 4}, {"text": {"en": "Delete every decal no camera will see (behind walls, under the pier), and the test decals from lesson 1. Check: the count went down and nothing you can see changed.", "uk": "Видали кожну декаль, яку не побачить жодна камера (за стінами, під пірсом), і тестові декалі з уроку 1. Перевірка: кількість зменшилася, а нічого з видимого не змінилося."}, "lesson": 4}, {"text": {"en": "Before/after capture: press 5 and put quay_before.png beside the same view now, as before_after_day18.png. Then a 60-second clip low along the quay and over the van spot. Save today's clip as flythrough_day18.mp4 and check that you also have van_spot_sketch.png, quay_decals_2m.png and quay_decals_10m.png (each is described in today's hand-in list; take any you are missing now). Check: algae, salt, puddles and tracks all show in the clip.", "uk": "Знімок «до/після»: натисни 5 і постав quay_before.png поруч із тим самим ракурсом зараз, як before_after_day18.png. Потім 60-секундний кліп низького прольоту вздовж набережної й над місцем фургона. Збережи сьогоднішній кліп як flythrough_day18.mp4 і перевір, що в тебе також є van_spot_sketch.png, quay_decals_2m.png і quay_decals_10m.png (кожен описано в сьогоднішньому списку «Здати роботу»; зроби зараз ті, яких бракує). Перевірка: у кліпі видно водорості, сіль, калюжі й сліди."}, "lesson": 4}]}, "lessons": [{"title": {"en": "Decals in Unreal", "uk": "Декалі в Unreal"}, "minutes": 40, "goals": [{"en": "Explain a decal: an image projected onto the surfaces inside its box; the arrow on the box shows which way it projects.", "uk": "Поясни, що таке декаль: зображення, що проєктується на поверхні всередині її коробки; стрілка на коробці показує, в який бік вона проєктує."}, {"en": "Make M_Decal_Master: Material Domain Deferred Decal, Blend Mode Translucent, the texture's colour into Base Color and its alpha (the transparency channel: where the image is see-through) times Opacity into Opacity, plus Roughness.", "uk": "Створи M_Decal_Master: Material Domain Deferred Decal, Blend Mode Translucent, колір текстури — у Base Color, а її альфа (канал прозорості: де зображення прозоре), помножена на Opacity, — в Opacity, плюс Roughness."}, {"en": "Place a Decal Actor, aim it, size it with Scale, and stack decals with Sort Order (a higher number draws on top).", "uk": "Постав Decal Actor, спрямуй його, задай розмір через Scale і накладай декалі одна на одну через Sort Order (більше число малюється зверху)."}], "doalong": [{"en": "Krita: File > New, 1024 x 1024, and on the Content tab make the background transparent: drag the background colour's Opacity slider to 0 (if your Krita shows a Transparent choice, pick it). If the canvas still looks white, send the tutor a screenshot. Paint a soft white blob with a big soft brush. File > Export: T_Decal_Test.png. You see the blob on a grey-white checker (the transparent background).", "uk": "Krita: File > New, 1024 x 1024, і на вкладці Content зроби тло прозорим: потягни повзунок Opacity кольору тла до 0 (якщо твоя Krita показує варіант Transparent, вибери його). Якщо полотно досі виглядає білим, надішли тьюторові скриншот. Намалюй м'яку білу пляму великим м'яким пензлем. File > Export: T_Decal_Test.png. Ти бачиш пляму на сіро-білій шахівниці (прозорому тлі)."}, {"en": "In Unreal make Course/Day18 and import T_Decal_Test.png. Right-click > Material, name it M_Decal_Master and open it. In Details (left side of the Material Editor), set Material Domain to Deferred Decal and Blend Mode to Translucent. You see the main node's pins change.", "uk": "В Unreal створи Course/Day18 й імпортуй T_Decal_Test.png. Правою кнопкою > Material, назви його M_Decal_Master і відкрий. У Details (ліворуч у Material Editor) постав Material Domain на Deferred Decal, а Blend Mode на Translucent. Ти бачиш, що піни головного вузла змінилися."}, {"en": "Hold T and click for a Texture Sample, Convert to Parameter, name it Colour, set it to T_Decal_Test, and wire RGB into Base Color. Add a Scalar Parameter Opacity (1) and a Multiply: Colour's A (alpha) times Opacity, into Opacity. Add a Scalar Parameter Roughness (0.8) into Roughness. Apply and Save. You see the material compile.", "uk": "Затисни T і клацни, щоб додати Texture Sample, Convert to Parameter, назви його Colour, постав на T_Decal_Test і з'єднай RGB з Base Color. Додай Scalar Parameter Opacity (1) і Multiply: A (альфа) від Colour, помножена на Opacity, — в Opacity. Додай Scalar Parameter Roughness (0.8) у Roughness. Apply і Save. Ти бачиш, що матеріал компілюється."}, {"en": "Create the instance MI_Decal_Test. Open L_KitTest, fly to a low view along the quay wall, save it as bookmark 5 (Ctrl+5) and take quay_before.png: the 'before' of today's before/after. Then Window > Place Actors, search Decal and drag a Decal Actor onto your paving plane. In Details, set Decal Material to MI_Decal_Test. You see a white blob projected on the ground.", "uk": "Створи інстанс MI_Decal_Test. Відкрий L_KitTest, пролети на низький ракурс уздовж стінки набережної, збережи його як закладку 5 (Ctrl+5) і зроби quay_before.png: «до» сьогоднішнього «до/після». Потім Window > Place Actors, пошукай Decal і перетягни Decal Actor на площину бруківки. У Details постав Decal Material на MI_Decal_Test. Ти бачиш білу пляму, спроєктовану на землю."}, {"en": "Rotate the decal (E key) until its arrow points into the quay wall, move it there (W key) and scale it until the blob is about 1 m across. You see the blob on the wall.", "uk": "Повертай декаль (клавіша E), доки її стрілка не вкаже в стінку набережної, пересунь її туди (клавіша W) і масштабуй, доки пляма не стане приблизно 1 м завширшки. Ти бачиш пляму на стіні."}, {"en": "Overlap a second copy (Alt+drag) and set its Sort Order to 1. You see it draw over the first.", "uk": "Наклади другу копію (Alt+перетягування) і постав їй Sort Order 1. Ти бачиш, що вона малюється поверх першої."}], "play": {"en": "Beat the clock: I go from PNG to a placed, sized decal on a wall in 10 minutes. The tutor checks four things from my screenshot: aimed right, see-through edges, right size, on the surface.", "uk": "Наввипередки з часом: за 10 хвилин я проходжу шлях від PNG до розміщеної декалі потрібного розміру на стіні. Тьютор перевіряє з мого скриншота чотири речі: правильно спрямована, прозорі краї, правильний розмір, лежить на поверхні."}, "video": {"url": "https://www.youtube.com/watch?v=D-PcRuzBX0E", "title": "Intro to Decals [UE5]", "channel": "PrismaticaDev", "length": "18:49", "search": "unreal engine 5 decals explained"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Decals in Unreal (Day 18, lesson 1 of 4).\nToday's build: A harbour decal set, and the quay dressed with it.\n\nBy the end of this lesson I can:\n1. Explain a decal: an image projected onto the surfaces inside its box; the arrow on the box shows which way it projects.\n2. Make M_Decal_Master: Material Domain Deferred Decal, Blend Mode Translucent, the texture's colour into Base Color and its alpha (the transparency channel: where the image is see-through) times Opacity into Opacity, plus Roughness.\n3. Place a Decal Actor, aim it, size it with Scale, and stack decals with Sort Order (a higher number draws on top).\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (Your harbour has its own colour palette and three seamless textures for paving, roofs and awnings.), what I will learn today (You paint decals for salt lines, algae, puddles and tyre tracks, and place each one exactly where its cause would be.), encourage me (A few decals placed with care change a whole scene, so place them thoughtfully and step back to enjoy the difference.), and share today's quote: \"Get your facts first, and then you can distort them as much as you please.\" (Mark Twain).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 15: when you compare your shot with a photo, what must match before you judge the materials? | Day 12: why set a material on the mesh asset rather than on each placed copy?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Beat the clock: I go from PNG to a placed, sized decal on a wall in 10 minutes. The tutor checks four things from my screenshot: aimed right, see-through edges, right size, on the surface.\n6. Do-along on today's build (the algae and salt line on the quay wall (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Krita: File > New, 1024 x 1024, and on the Content tab make the background transparent: drag the background colour's Opacity slider to 0 (if your Krita shows a Transparent choice, pick it). If the canvas still looks white, send the tutor a screenshot. Paint a soft white blob with a big soft brush. File > Export: T_Decal_Test.png. You see the blob on a grey-white checker (the transparent background).\n   - In Unreal make Course/Day18 and import T_Decal_Test.png. Right-click > Material, name it M_Decal_Master and open it. In Details (left side of the Material Editor), set Material Domain to Deferred Decal and Blend Mode to Translucent. You see the main node's pins change.\n   - Hold T and click for a Texture Sample, Convert to Parameter, name it Colour, set it to T_Decal_Test, and wire RGB into Base Color. Add a Scalar Parameter Opacity (1) and a Multiply: Colour's A (alpha) times Opacity, into Opacity. Add a Scalar Parameter Roughness (0.8) into Roughness. Apply and Save. You see the material compile.\n   - Create the instance MI_Decal_Test. Open L_KitTest, fly to a low view along the quay wall, save it as bookmark 5 (Ctrl+5) and take quay_before.png: the 'before' of today's before/after. Then Window > Place Actors, search Decal and drag a Decal Actor onto your paving plane. In Details, set Decal Material to MI_Decal_Test. You see a white blob projected on the ground.\n   - Rotate the decal (E key) until its arrow points into the quay wall, move it there (W key) and scale it until the blob is about 1 m across. You see the blob on the wall.\n   - Overlap a second copy (Alt+drag) and set its Sort Order to 1. You see it draw over the first.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Intro to Decals [UE5]\" by PrismaticaDev: https://www.youtube.com/watch?v=D-PcRuzBX0E\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Painting decals: salt lines and algae", "uk": "Малюємо декалі: сольові лінії й водорості"}, "minutes": 40, "goals": [{"en": "Paint on a transparent canvas: what you paint shows, the rest stays see-through.", "uk": "Малюй на прозорому полотні: те, що ти малюєш, видно, решта лишається прозорою."}, {"en": "Make a strip that tiles left to right (Wrap Around Mode), so copies can run along a long wall.", "uk": "Зроби смугу, що тайлиться зліва направо (Wrap Around Mode), щоб копії могли йти вздовж довгої стіни."}, {"en": "Give edges a soft, broken shape: real marks never have a ruler edge.", "uk": "Дай краям м'яку уривчасту форму: справжні сліди ніколи не мають краю, як під лінійку."}], "doalong": [{"en": "Krita: File > New, 2048 x 512, transparent background (Opacity 0 on the Content tab, as in lesson 1). It will cover 4 m of wall and 1 m of height. You see an empty checker canvas.", "uk": "Krita: File > New, 2048 x 512, прозоре тло (Opacity 0 на вкладці Content, як в уроці 1). Полотно покриватиме 4 м стіни й 1 м висоти. Ти бачиш порожнє полотно-шахівницю."}, {"en": "Name the layer Algae (double-click it in the Layers panel). Paint a dark green-brown band along the bottom third, thicker in some places, with a ragged top edge. You see an uneven band.", "uk": "Назви шар Algae (двічі клацни його на панелі Layers). Намалюй темну зелено-буру смугу вздовж нижньої третини, подекуди товщу, з рваним верхнім краєм. Ти бачиш нерівну смугу."}, {"en": "Add a new layer, Salt. Paint pale grey-white streaks just above the algae, rising unevenly 10 to 40 cm (about 50 to 200 px). You see chalky streaks.", "uk": "Додай новий шар Salt. Намалюй блідо-сіро-білі патьоки трохи вище водоростей, що нерівно піднімаються на 10–40 см (приблизно 50–200 px). Ти бачиш крейдяні патьоки."}, {"en": "Press W (Wrap Around Mode) and check the left-right join on both layers; paint over any break. Press W again. You see both bands run on across the edge.", "uk": "Натисни W (Wrap Around Mode) і перевір стик ліво-право на обох шарах; замалюй будь-який розрив. Натисни W ще раз. Ти бачиш, що обидві смуги безперервно переходять через край."}, {"en": "Hide Salt (the eye icon) and File > Export: T_Decal_Algae.png. Show Salt, hide Algae and export T_Decal_SaltLine.png. Save the file as decals_day18.kra. You see two PNGs with transparent backgrounds.", "uk": "Сховай Salt (іконка ока) і File > Export: T_Decal_Algae.png. Покажи Salt, сховай Algae й експортуй T_Decal_SaltLine.png. Збережи файл як decals_day18.kra. Ти бачиш два PNG із прозорим тлом."}, {"en": "Import both into Course/Day18. Make MI_Decal_Algae (Opacity 0.9, Roughness 0.3, because it's wet) and MI_Decal_SaltLine (Opacity 0.7, Roughness 0.9). You see two new instances.", "uk": "Імпортуй обидва в Course/Day18. Створи MI_Decal_Algae (Opacity 0.9, Roughness 0.3, бо водорості мокрі) і MI_Decal_SaltLine (Opacity 0.7, Roughness 0.9). Ти бачиш два нові інстанси."}], "play": {"en": "Straight-line hunt: I send a screenshot of my wall. The tutor gets 30 seconds to point at a ruler-straight edge. Each one it finds is a point to the tutor.", "uk": "Полювання на прямі лінії: я надсилаю скриншот своєї стіни. Тьютор має 30 секунд, щоб показати на край, рівний, як під лінійку. Кожен знайдений — бал тьюторові."}, "video": {"url": "https://www.youtube.com/watch?v=ymg0btE24S0", "title": "UE5 Beginner Tutorial: Use DECALS To Add DIRT And GRUNGE To Your Game!", "channel": "Unreal Dev Hub", "length": "8:31", "search": "unreal engine 5 decals dirt grunge"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Painting decals: salt lines and algae (Day 18, lesson 2 of 4).\nToday's build: A harbour decal set, and the quay dressed with it.\nEarlier today I already did: lesson 1 (Decals in Unreal). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Paint on a transparent canvas: what you paint shows, the rest stays see-through.\n2. Make a strip that tiles left to right (Wrap Around Mode), so copies can run along a long wall.\n3. Give edges a soft, broken shape: real marks never have a ruler edge.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Straight-line hunt: I send a screenshot of my wall. The tutor gets 30 seconds to point at a ruler-straight edge. Each one it finds is a point to the tutor.\n4. Do-along on today's build (the algae and salt line on the quay wall (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Krita: File > New, 2048 x 512, transparent background (Opacity 0 on the Content tab, as in lesson 1). It will cover 4 m of wall and 1 m of height. You see an empty checker canvas.\n   - Name the layer Algae (double-click it in the Layers panel). Paint a dark green-brown band along the bottom third, thicker in some places, with a ragged top edge. You see an uneven band.\n   - Add a new layer, Salt. Paint pale grey-white streaks just above the algae, rising unevenly 10 to 40 cm (about 50 to 200 px). You see chalky streaks.\n   - Press W (Wrap Around Mode) and check the left-right join on both layers; paint over any break. Press W again. You see both bands run on across the edge.\n   - Hide Salt (the eye icon) and File > Export: T_Decal_Algae.png. Show Salt, hide Algae and export T_Decal_SaltLine.png. Save the file as decals_day18.kra. You see two PNGs with transparent backgrounds.\n   - Import both into Course/Day18. Make MI_Decal_Algae (Opacity 0.9, Roughness 0.3, because it's wet) and MI_Decal_SaltLine (Opacity 0.7, Roughness 0.9). You see two new instances.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"UE5 Beginner Tutorial: Use DECALS To Add DIRT And GRUNGE To Your Game!\" by Unreal Dev Hub: https://www.youtube.com/watch?v=ymg0btE24S0\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Marks where their cause is: water, wheels and feet", "uk": "Сліди там, де їхня причина: вода, колеса й ноги"}, "minutes": 40, "goals": [{"en": "Read a harbour by cause: the tide line makes algae and salt, dips make puddles, vans make tyre tracks, feet wear paths.", "uk": "Читай гавань за причинами: лінія припливу дає водорості й сіль, заглиблення — калюжі, фургони — сліди шин, ноги протоптують стежки."}, {"en": "Place decals by cause and with breaks: turn, scale and flip each copy so no two look the same.", "uk": "Став декалі за причиною й з розривами: повертай, масштабуй і віддзеркалюй кожну копію, щоб жодні дві не були однаковими."}, {"en": "Check from 2 m and 10 m: the result should look used, not dirty.", "uk": "Перевіряй з 2 м і з 10 м: результат має виглядати вживаним, а не брудним."}], "doalong": [{"en": "Fly low along the quay (2 m). Your Floor sits 1 m below the deck as stand-in water, so the waterline is where the quay wall meets it. Select the Floor and untick Receives Decals in Details, so wall decals that dip below the waterline don't smear across the water. You see the height where the algae band starts.", "uk": "Пролети низько вздовж набережної (2 м). Твій Floor лежить на 1 м нижче настилу як тимчасова вода, тож ватерлінія там, де стінка набережної з ним зустрічається. Виділи Floor і зніми галочку Receives Decals у Details, щоб декалі стіни, які заходять нижче ватерлінії, не розмазувалися по воді. Ти бачиш висоту, з якої починається смуга водоростей."}, {"en": "Place MI_Decal_Algae decals along 8 m of wall at the waterline, aimed into the wall, with a break of about 1 m every few metres. Scale each decal so its box is four times as wide as it is tall, like the 4 x 1 m image; if the band looks squashed, swap the two scale numbers. You see an uneven green-brown band.", "uk": "Постав декалі MI_Decal_Algae вздовж 8 м стіни біля ватерлінії, спрямовані в стіну, з розривом приблизно 1 м кожні кілька метрів. Масштабуй кожну декаль так, щоб її коробка була вчетверо ширшою, ніж заввишки, як зображення 4 x 1 м; якщо смуга виглядає сплющеною, поміняй місцями два числа масштабу. Ти бачиш нерівну зелено-буру смугу."}, {"en": "Place MI_Decal_SaltLine decals just above, overlapping the algae's top edge a little, with Sort Order 1. You see chalky streaks over the algae.", "uk": "Постав декалі MI_Decal_SaltLine трохи вище, щоб вони трохи накривали верхній край водоростей, із Sort Order 1. Ти бачиш крейдяні патьоки над водоростями."}, {"en": "Vary the copies: turn some 2 to 5 degrees, scale some 80 to 120 %, and flip some (a negative Scale Y). You see no two pieces of band look the same.", "uk": "Урізноманітни копії: деякі поверни на 2–5 градусів, деякі масштабуй на 80–120 %, а деякі віддзеркаль (від'ємний Scale Y). Ти бачиш, що жодні два шматки смуги не однакові."}, {"en": "Fly back to 10 m. You see a wall that looks old and wet at the bottom, not painted with stripes.", "uk": "Відлети назад на 10 м. Ти бачиш стіну, що виглядає старою й мокрою внизу, а не розмальованою смугами."}], "play": {"en": "Cause and effect: the tutor names a mark (a white crust, a dark ring, a tyre curve, a shiny patch). I say its cause and where it belongs on my quay.", "uk": "Причина й наслідок: тьютор називає слід (біла кірка, темне кільце, крива шини, блискуча ділянка). Я називаю його причину й місце, де він має бути на моїй набережній."}, "video": {"url": "https://www.youtube.com/watch?v=pPl5h5Xjed8", "title": "All about Puddles UE5 Beginner Tutorial / DesignwithDan", "channel": "Design with Dan", "length": "11:01", "search": "unreal engine 5 puddles material"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Marks where their cause is: water, wheels and feet (Day 18, lesson 3 of 4).\nToday's build: A harbour decal set, and the quay dressed with it.\nEarlier today I already did: lesson 1 (Decals in Unreal); lesson 2 (Painting decals: salt lines and algae). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Read a harbour by cause: the tide line makes algae and salt, dips make puddles, vans make tyre tracks, feet wear paths.\n2. Place decals by cause and with breaks: turn, scale and flip each copy so no two look the same.\n3. Check from 2 m and 10 m: the result should look used, not dirty.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Cause and effect: the tutor names a mark (a white crust, a dark ring, a tyre curve, a shiny patch). I say its cause and where it belongs on my quay.\n4. Do-along on today's build (the algae and salt line on the quay wall (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Fly low along the quay (2 m). Your Floor sits 1 m below the deck as stand-in water, so the waterline is where the quay wall meets it. Select the Floor and untick Receives Decals in Details, so wall decals that dip below the waterline don't smear across the water. You see the height where the algae band starts.\n   - Place MI_Decal_Algae decals along 8 m of wall at the waterline, aimed into the wall, with a break of about 1 m every few metres. Scale each decal so its box is four times as wide as it is tall, like the 4 x 1 m image; if the band looks squashed, swap the two scale numbers. You see an uneven green-brown band.\n   - Place MI_Decal_SaltLine decals just above, overlapping the algae's top edge a little, with Sort Order 1. You see chalky streaks over the algae.\n   - Vary the copies: turn some 2 to 5 degrees, scale some 80 to 120 %, and flip some (a negative Scale Y). You see no two pieces of band look the same.\n   - Fly back to 10 m. You see a wall that looks old and wet at the bottom, not painted with stripes.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"All about Puddles UE5 Beginner Tutorial / DesignwithDan\" by Design with Dan: https://www.youtube.com/watch?v=pPl5h5Xjed8\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Decal cost and fade", "uk": "Вартість декалей і згасання"}, "minutes": 40, "goals": [{"en": "Count decals and measure their cost with stat unit (an on-screen readout of how many milliseconds each frame takes; GPU is the graphics card's time).", "uk": "Порахуй декалі й виміряй їхню вартість через stat unit (екранний показник того, скільки мілісекунд триває кожен кадр; GPU — це час відеокарти)."}, {"en": "Set Fade Screen Size so small decals fade out when they are tiny on screen.", "uk": "Налаштуй Fade Screen Size, щоб малі декалі згасали, коли вони стають крихітними на екрані."}, {"en": "Explain why many overlapping see-through layers cost more than a few well-placed ones.", "uk": "Поясни, чому багато прозорих шарів, що накладаються, коштують більше, ніж кілька вдало розміщених."}], "doalong": [{"en": "In the Outliner (top right), type Decal in the search box. You see a list and a count of your decal actors.", "uk": "В Outliner (угорі праворуч) введи Decal у пошук. Ти бачиш список і кількість своїх акторів-декалей."}, {"en": "Press the ` key (left of 1) to open the console, type stat unit and press Enter. Fly to a low quay view and write down the GPU number. You see numbers in milliseconds at the top right.", "uk": "Натисни клавішу ` (ліворуч від 1), щоб відкрити консоль, введи stat unit і натисни Enter. Пролети на низький ракурс набережної й запиши число GPU. Ти бачиш числа в мілісекундах угорі праворуч."}, {"en": "Select a small decal and raise Fade Screen Size to 0.05 in Details (a bigger number makes it fade out sooner, while it is still bigger on screen), then fly away from it. You see it fade out when it gets small on screen.", "uk": "Виділи малу декаль і збільш Fade Screen Size до 0.05 у Details (більше число змушує її згасати раніше, коли вона ще більша на екрані), потім відлети від неї. Ти бачиш, що вона згасає, коли стає малою на екрані."}, {"en": "Alt+drag five copies of one decal onto the same spot and read stat unit again; then delete four of them. You see the GPU time go up, then back down.", "uk": "Через Alt+перетягування зроби п'ять копій однієї декалі на тому самому місці й знову подивися stat unit; потім видали чотири з них. Ти бачиш, що час GPU зростає, а потім знову падає."}, {"en": "Write decal_cost.md: the count and the GPU time before and after. Type stat unit again to hide it. You see a short note in your Day18 folder.", "uk": "Напиши decal_cost.md: кількість і час GPU до і після. Введи stat unit ще раз, щоб сховати показник. Ти бачиш коротку нотатку в папці Day18."}], "play": {"en": "Cost cutter: I remove 10 % of my decals. The tutor must spot a difference between my before and after screenshots. If it can't, I score.", "uk": "Скорочувач витрат: я прибираю 10 % своїх декалей. Тьютор має помітити різницю між моїми скриншотами «до» і «після». Якщо не помічає, бал мені."}, "video": {"url": "https://www.youtube.com/watch?v=CQhBvjUIbBs", "title": "Draw Calls Explanation - 🎓 Unreal Engine 5 Optimization Course ⬇️", "channel": "SKIPPERS ACADEMY", "length": "14:26", "search": "unreal engine 5 draw calls explained"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Decal cost and fade (Day 18, lesson 4 of 4).\nToday's build: A harbour decal set, and the quay dressed with it.\nEarlier today I already did: lesson 1 (Decals in Unreal); lesson 2 (Painting decals: salt lines and algae); lesson 3 (Marks where their cause is: water, wheels and feet). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Count decals and measure their cost with stat unit (an on-screen readout of how many milliseconds each frame takes; GPU is the graphics card's time).\n2. Set Fade Screen Size so small decals fade out when they are tiny on screen.\n3. Explain why many overlapping see-through layers cost more than a few well-placed ones.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Cost cutter: I remove 10 % of my decals. The tutor must spot a difference between my before and after screenshots. If it can't, I score.\n4. Do-along on today's build (the algae and salt line on the quay wall (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - In the Outliner (top right), type Decal in the search box. You see a list and a count of your decal actors.\n   - Press the ` key (left of 1) to open the console, type stat unit and press Enter. Fly to a low quay view and write down the GPU number. You see numbers in milliseconds at the top right.\n   - Select a small decal and raise Fade Screen Size to 0.05 in Details (a bigger number makes it fade out sooner, while it is still bigger on screen), then fly away from it. You see it fade out when it gets small on screen.\n   - Alt+drag five copies of one decal onto the same spot and read stat unit again; then delete four of them. You see the GPU time go up, then back down.\n   - Write decal_cost.md: the count and the GPU time before and after. Type stat unit again to hide it. You see a short note in your Day18 folder.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Draw Calls Explanation - 🎓 Unreal Engine 5 Optimization Course ⬇️\" by SKIPPERS ACADEMY: https://www.youtube.com/watch?v=CQhBvjUIbBs\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "T_Decal_SaltLine, T_Decal_Algae, T_Decal_Puddle and T_Decal_TyreTrack (PNGs with their .kra files)", "uk": "T_Decal_SaltLine, T_Decal_Algae, T_Decal_Puddle і T_Decal_TyreTrack (PNG разом з файлами .kra)"}, {"en": "decal_references.png and van_spot_sketch.png", "uk": "decal_references.png і van_spot_sketch.png"}, {"en": "decal_cost.md (count, GPU time before and after)", "uk": "decal_cost.md (кількість, час GPU до і після)"}, {"en": "quay_decals_2m.png and quay_decals_10m.png", "uk": "quay_decals_2m.png і quay_decals_10m.png"}, {"en": "before_after_day18.png (the quay before and after decals, same view)", "uk": "before_after_day18.png (набережна до і після декалей, той самий ракурс)"}, {"en": "flythrough_day18.mp4 (60 seconds)", "uk": "flythrough_day18.mp4 (60 секунд)"}, {"en": "summary.md", "uk": "звіт дня (summary.md)"}], "goal": {"en": "By the end of today you have four decal textures and a decal master material, and the quay in L_KitTest shows salt lines, algae, puddles and tyre tracks exactly where their causes are.", "uk": "Наприкінці сьогоднішнього дня в тебе є чотири текстури декалей і майстер-матеріал для декалей, а набережна в L_KitTest показує сольові лінії, водорості, калюжі й сліди шин саме там, де є їхні причини."}, "uses": [{"en": "Day 14: where wear comes from (water, sun, feet, hands, ropes)", "uk": "День 14: звідки береться зношеність (вода, сонце, ноги, руки, мотузки)"}, {"en": "Day 17: Wrap Around Mode for a strip that tiles, and MI_Paving on your 4 x 4 m test plane", "uk": "День 17: Wrap Around Mode для смуги, що тайлиться, і MI_Paving на твоїй тестовій площині 4 x 4 м"}, {"en": "Day 15: your harbour photos and the habit of checking against them", "uk": "День 15: твої фото гаваней і звичка звірятися з ними"}, {"en": "Day 10: L_KitTest's quay and pier", "uk": "День 10: набережна й пірс у L_KitTest"}], "quiz": [{"q": {"en": "What is a decal?", "uk": "Що таке декаль?"}, "options": [{"en": "A new mesh with its own UVs", "uk": "Нова сітка з власними UV"}, {"en": "An image projected onto the surfaces inside its box", "uk": "Зображення, що проєктується на поверхні всередині її коробки"}, {"en": "A light that colours the ground", "uk": "Світло, що забарвлює землю"}, {"en": "A collision box", "uk": "Коробка колізії"}], "answer": 1, "explain": {"en": "A decal projects an image like a slide projector. It needs no new model and no new UVs on your kit.", "uk": "Декаль проєктує зображення, як діапроектор. Їй не потрібна нова модель і нові UV на твоєму наборі."}}, {"q": {"en": "Your algae decal shows as a solid dark rectangle on the wall. What is the likely cause?", "uk": "Твоя декаль водоростей показує на стіні суцільний темний прямокутник. Яка найімовірніша причина?"}, "options": [{"en": "The texture's alpha isn't wired to Opacity, or the PNG has no transparent background", "uk": "Альфа текстури не з'єднана з Opacity, або PNG не має прозорого тла"}, {"en": "The sun is too low", "uk": "Сонце занизько"}, {"en": "The wall has no UVs", "uk": "Стіна не має UV"}, {"en": "Fade Screen Size is 0.01", "uk": "Fade Screen Size дорівнює 0.01"}], "answer": 0, "explain": {"en": "The see-through parts come from the alpha. Paint on a transparent canvas and wire alpha times Opacity into Opacity.", "uk": "Прозорі частини беруться з альфи. Малюй на прозорому полотні й з'єднай альфу, помножену на Opacity, з Opacity."}}, {"q": {"en": "Where should tyre tracks go on your quay?", "uk": "Де мають бути сліди шин на твоїй набережній?"}, "options": [{"en": "Across the bench area, so the paving looks used", "uk": "Через зону з лавками, щоб бруківка виглядала вживаною"}, {"en": "Where a van drives in, turns and stops", "uk": "Там, де фургон заїжджає, розвертається й зупиняється"}, {"en": "In a straight line along the water's edge", "uk": "Прямою лінією вздовж краю води"}, {"en": "Evenly everywhere", "uk": "Рівномірно всюди"}], "answer": 1, "explain": {"en": "Every mark needs a cause. Vans drive to where they unload; people sit by the benches.", "uk": "Кожен слід потребує причини. Фургони їдуть туди, де розвантажуються; люди сидять біля лавок."}}, {"q": {"en": "Which setting makes a small decal disappear when it is tiny on screen?", "uk": "Який параметр змушує малу декаль зникати, коли вона крихітна на екрані?"}, "options": [{"en": "Sort Order", "uk": "Sort Order"}, {"en": "Roughness", "uk": "Roughness"}, {"en": "Fade Screen Size", "uk": "Fade Screen Size"}], "answer": 2, "explain": {"en": "Fade Screen Size hides a decal once it covers only a few pixels, which saves work for the graphics card.", "uk": "Fade Screen Size ховає декаль, щойно вона займає лише кілька пікселів, і це економить роботу відеокарти."}}, {"q": {"en": "You stacked many decals on one spot and the frame got slower. Why?", "uk": "На одне місце складено багато декалей, і кадр став повільнішим. Чому?"}, "options": [{"en": "Decals add triangles to the wall", "uk": "Декалі додають стіні трикутників"}, {"en": "Decals turn off Lumen", "uk": "Декалі вимикають Lumen"}, {"en": "Stacked decals change the sun", "uk": "Складені декалі змінюють сонце"}, {"en": "Each see-through layer is drawn again over the same pixels", "uk": "Кожен прозорий шар малюється ще раз поверх тих самих пікселів"}], "answer": 3, "explain": {"en": "Every see-through layer means more work on the same pixels. A few well-placed decals beat many stacked ones.", "uk": "Кожен прозорий шар — це більше роботи над тими самими пікселями. Кілька вдало розміщених декалей кращі за багато складених одна на одну."}}], "weekInfo": {"week": 4, "title": {"en": "The Unreal look", "uk": "Вигляд в Unreal"}, "goal": {"en": "By Friday you have a lit, dressed 30 x 30 m harbour corner built from your own kit, with colours from real photos, seamless textures, decals, a written light recipe and two composed camera shots.", "uk": "До п'ятниці в тебе є освітлений і наповнений куток гавані 30 x 30 м, зібраний з твого власного набору: кольори зі справжніх фото, безшовні текстури, декалі, записаний рецепт світла й два скомпоновані кадри з камери."}, "skills": [{"en": "Colour palettes sampled from real photographs for consistent art direction", "uk": "Кольорові палітри, взяті зі справжніх фотографій, для цілісного художнього стилю"}, {"en": "Seamless tiling texture creation at real-world scale", "uk": "Створення безшовних тайлових текстур у реальному масштабі"}, {"en": "Decal-based weathering and environmental storytelling in Unreal Engine 5", "uk": "Зношеність за допомогою декалей і розповідь через оточення (environmental storytelling) в Unreal Engine 5"}, {"en": "Lumen lighting, atmosphere and post-process exposure for outdoor scenes", "uk": "Освітлення Lumen, атмосфера й експозиція post-process для сцен просто неба"}, {"en": "Shot composition with Cine Camera Actors", "uk": "Композиція кадру з Cine Camera Actor"}]}, "morning": {"sofar": {"en": "Your harbour has its own colour palette and three seamless textures for paving, roofs and awnings.", "uk": "Твій порт має власну палітру кольорів і три безшовні текстури для бруківки, дахів і маркіз."}, "today": {"en": "You paint decals for salt lines, algae, puddles and tyre tracks, and place each one exactly where its cause would be.", "uk": "Сьогодні ти малюєш декалі для соляних смуг, водоростей, калюж і слідів шин і розміщуєш кожну саме там, де була б її причина."}, "cheer": {"en": "A few decals placed with care change a whole scene, so place them thoughtfully and step back to enjoy the difference.", "uk": "Кілька дбайливо розміщених декалей змінюють усю сцену, тож став їх вдумливо й відступи на крок, щоб помилуватися різницею."}, "quote": {"text": {"en": "Get your facts first, and then you can distort them as much as you please.", "uk": "Спершу з'ясуй факти, а тоді можеш перекручувати їх скільки завгодно."}, "author": {"en": "Mark Twain", "uk": "Марк Твен"}, "source": "https://en.wikiquote.org/wiki/Mark_Twain"}}, "hasAssets": false, "workPath": "Work\\Assignment\\Day-18-decals-salt-algae-puddles-tracks", "mapHref": "../../COURSE.html", "prevHref": "../Day-17-seamless-textures/START-HERE.html", "nextHref": "../Day-19-light-atmosphere-cameras/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Krita and Unreal Engine 5.8. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me and don't write code. Keep me moving and make it feel like a game.\n\nToday I build on my own: Puddles and tyre tracks on the ground, and the cost check, on your own.\nIt's part of: A harbour decal set, and the quay dressed with it (L_KitTest: the quay wall at the waterline (where it meets the lowered Floor, your stand-in water), the 4 x 4 m paving plane on the Land block, and a van turning spot on the land at one end of the quay.).\n\nSpec:\n- Four decal textures painted in Krita on a transparent background, saved as PNG: T_Decal_SaltLine and T_Decal_Algae (2048 x 512, covering 4 x 1 m, tiling left to right), T_Decal_Puddle (1024 x 1024) and T_Decal_TyreTrack (2048 x 512).\n- M_Decal_Master: Material Domain Deferred Decal, Blend Mode Translucent, with Colour, Opacity and Roughness parameters; one instance per texture (MI_Decal_SaltLine, MI_Decal_Algae, MI_Decal_Puddle, MI_Decal_TyreTrack).\n- Quay wall: algae at the waterline (the line where the wall meets the Floor, 1 m below the deck) and a salt line just above it, with breaks every few metres; never a ruler-straight line.\n- Ground: one or two puddles in low spots, and tyre tracks where a van drives in, turns and stops, never across a bench area.\n- Puddles have Roughness 0.05 to 0.1, so they reflect the sky.\n- At most 25 decal actors; Fade Screen Size raised on small ones; stat unit's GPU time written down before and after.\n\nMy checklist:\n1. Collect three Wikimedia Commons photos of real harbour walls and quays showing an algae band, salt above it, puddles and tyre marks. Credit them, and circle each mark in Krita. Check: decal_references.png shows every mark circled. (from lesson 3)\n2. Paint T_Decal_Puddle in Krita: 1024 x 1024 on a transparent background, an irregular dark wet shape with soft, broken edges. Export as PNG. Check: in Krita the grey-white checker pattern (transparency) shows all round the puddle. (from lesson 2)\n3. Paint T_Decal_TyreTrack: 2048 x 512, transparent, one dark, broken tyre band along the middle with faint tread marks, fading out at both ends. It covers 4 m x 1 m, and you place one per wheel. Export as PNG. Check: both ends fade to nothing, so tracks can overlap. (from lesson 2)\n4. Import both and make MI_Decal_Puddle (Roughness 0.05, Opacity 0.9) and MI_Decal_TyreTrack (Roughness 0.8, Opacity 0.6). Check: both show in Course/Day18 with the MI_Decal_ prefix. (from lesson 1)\n5. Find the low spots on your paving plane and on the quay. Place one or two puddles there, each turned and scaled differently. Check: when you swing the sun (Ctrl+L), the puddles shine like water. (from lesson 3)\n6. Plan the van spot: in Krita, sketch from above where a small van would drive across the Land block to the end of the quay, turn and stop. Check: the sketch shows the two wheel lines (about 1.7 m apart) and where the van stops. (from lesson 3)\n7. Lay tyre tracks along the sketch: short decals following the turn, each turned a little more than the last, their faded ends overlapping. Check: from 10 m the tracks read as one smooth curve. (from lesson 3)\n8. Finish the quay wall along the whole quay in L_KitTest: algae and salt with breaks, a little darker near the steps where water runs off. Check: from 2 m and 10 m you can't find a ruler-straight line. (from lesson 3)\n9. Cost: count the decal actors (type Decal in the Outliner's search box), raise Fade Screen Size to 0.05 on small ones, and note stat unit's GPU time before and after. Check: decal_cost.md shows the count (25 or fewer) and both times. (from lesson 4)\n10. Delete every decal no camera will see (behind walls, under the pier), and the test decals from lesson 1. Check: the count went down and nothing you can see changed. (from lesson 4)\n11. Before/after capture: press 5 and put quay_before.png beside the same view now, as before_after_day18.png. Then a 60-second clip low along the quay and over the van spot. Save today's clip as flythrough_day18.mp4 and check that you also have van_spot_sketch.png, quay_decals_2m.png and quay_decals_10m.png (each is described in today's hand-in list; take any you are missing now). Check: algae, salt, puddles and tracks all show in the clip. (from lesson 4)\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Karina\nDay 18: Decals: salt lines, algae, puddles and tyre tracks. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 if(D.weekInfo){const w=D.weekInfo;h+='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}
 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p><div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+list(D.handin,'ul','ticks')+'<p class="path">'+ic('folder')+'<span>'+u('shipTo')+' <code>'+esc(D.workPath)+'</code></span></p>'+(D.lessons.length?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<p class="muted">'+u('report')+'</p><div class="row"><button class="btn s" onclick="cp(D.reportPrompt)">'+ic('copy')+u('copyR')+'</button></div></section>';
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();
</script>

<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 43</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

/* the Done switch */

.check input::after{content:"";width:10px;height:5px;border:solid #fff;border-width:0 0 2.2px 2.2px;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.check input:checked{background:linear-gradient(145deg,#5fe39a,#16a34a);box-shadow:0 0 12px rgba(74,222,128,.55)}

#toast{position:fixed;left:50%;bottom:28px;z-index:9;transform:translateX(-50%) translateY(16px);background:rgba(30,33,46,.82);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:#f4f5fa;border:1px solid rgba(255,255,255,.14);padding:13px 24px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none;font:600 14px/1.4 var(--head);max-width:min(92vw,560px);text-align:center;box-shadow:0 20px 40px -14px rgba(0,0,0,.5),0 0 24px var(--glow)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

 body{font-size:16.5px}

15 m on the promenade facing the view, a bin beside every second bench and at street corners, lamp posts every 15 to 20 m.", "uk": "Кількості у furniture_d1.md, починаючи з рядків меблів у plot_plan_d1.md (День 23) і перевірені за кожною довжиною й кроком: швартовні стовпчики вздовж краю причалу (кожні 8-10 м або як на твоїх фото), лавка кожні 12-15 м на променаді лицем до краєвиду, урна біля кожної другої лавки й на розі вулиць, ліхтарі кожні 15-20 м."}, {"en": "Your own SM_Bollard, SM_Bench, SM_LampPost and SM_Bin first; pack props (Street Props Pack Vol.1, CC-BY, so credit it) only for gaps such as traffic signs or barriers.", "uk": "Спершу твої власні SM_Bollard, SM_Bench, SM_LampPost і SM_Bin; пропси з паків (Street Props Pack Vol.1, CC-BY, тож вкажи автора) лише для прогалин, як-от дорожні знаки чи огорожі."}, {"en": "Repeated groups as Packed Level Actors, for example PLA_BenchSet (a bench and a bin) and PLA_QuaySet (a bollard and a lamp post). A Packed Level Actor is a group of meshes packed into one actor: repeated meshes inside it become instances (many copies of one mesh drawn together in one go, much cheaper than drawing each copy alone), and the whole set places in one click and edits once for every copy.", "uk": "Групи, що повторюються, як Packed Level Actors, наприклад PLA_BenchSet (лавка й урна) і PLA_QuaySet (швартовний стовпчик і ліхтар). Packed Level Actor — це група сіток, упакована в один актор: однакові сітки всередині стають інстансами (багато копій однієї сітки, які малюються разом за один раз, набагато дешевше, ніж малювати кожну копію окремо), а весь набір ставиться одним клацанням і змінюється один раз для кожної копії."}, {"en": "SM_Skiff_5m: a simple open boat about 5 m long and 1.8 m wide, under 3,000 triangles, with its origin on the waterline (the line where the water meets the hull, 25 cm above the keel), a UCX collision box (UCX_SM_Skiff_5m_00) and your M_Master instances. Three copies moored beside bollards at Z = 0, each in its own colour (a child instance with another Tint, set in Details > Materials).", "uk": "SM_Skiff_5m: простий відкритий човен завдовжки близько 5 м і завширшки 1,8 м, менше 3000 трикутників, з опорною точкою на ватерлінії (лінія, де вода сходиться з корпусом, на 25 см вище кіля), колізійним боксом UCX (UCX_SM_Skiff_5m_00) і твоїми інстансами M_Master. Три копії пришвартовані біля стовпчиків на Z = 0, кожна свого кольору (дочірній інстанс з іншим Tint, призначений у Details > Materials)."}, {"en": "Lamp heads and anything tall kept out of the drone lanes, tested with LaneGauge, your 4 x 4 x 4 m gauge cube from Day 38 (you slide it along a lane: if it touches something, the lane is blocked).", "uk": "Голови ліхтарів і все високе тримай поза коридорами дрона, перевір за допомогою LaneGauge, твого куба-калібру 4 x 4 x 4 м з Дня 38 (ти ведеш його вздовж коридору: якщо він чогось торкається, коридор заблоковано)."}, {"en": "stat unit from C4 before and after the furniture: furniture adds no more than about 10 % to the GPU time.", "uk": "stat unit з C4 до і після меблів: меблі додають не більше ніж приблизно 10 % до часу GPU."}], "piece1": "the bench set as a Packed Level Actor", "piece2": {"en": "All the other furniture and the boats, on your own", "uk": "Усі інші меблі й човни, самостійно"}, "steps": [{"text": {"en": "Count from the plan: copy the furniture rows of plot_plan_d1.md into furniture_d1.md (item, count, spacing, where) and check each count against its length divided by its spacing. Check: every count comes from a length divided by a spacing.", "uk": "Порахуй за планом: перепиши рядки меблів із plot_plan_d1.md у furniture_d1.md (елемент, кількість, крок, де) і перевір кожну кількість: довжина, поділена на крок. Перевірка: кожна кількість — це довжина, поділена на крок."}, "lesson": 1}, {"text": {"en": "stat unit from C4 before any furniture (as on Day 41); write GPU and Frame in budget.md. Screenshot C2 for your before picture. Check: a 'before furniture' line in budget.md.", "uk": "stat unit з C4 до будь-яких меблів (як на Дні 41); запиши GPU і Frame у budget.md. Зроби скриншот C2 — це твоє фото «до». Перевірка: рядок «до меблів» у budget.md."}, "lesson": 2}, {"text": {"en": "PLA_BenchSet: a bench and a bin side by side, packed with right-click > Level > Create Packed Level Actor. Check: the Outliner shows one actor for the set.", "uk": "PLA_BenchSet: лавка й урна поруч, упаковані через правий клік > Level > Create Packed Level Actor. Перевірка: Outliner показує один актор на набір."}, "lesson": 2}, {"text": {"en": "Promenade: PLA_BenchSet copies every 12 to 15 m, benches facing the view, a few turned 2 to 5 degrees. Check: from 10 m each bench faces water or a view, never a wall.", "uk": "Променад: копії PLA_BenchSet кожні 12-15 м, лавки лицем до краєвиду, кілька повернуті на 2-5 градусів. Перевірка: з 10 м кожна лавка дивиться на воду чи краєвид, ніколи на стіну."}, "lesson": 3}, {"text": {"en": "Quay edge: your bollards at your photos' spacing, and PLA_QuaySet where a lamp stands with a bollard. Check: every bollard base sits on the quay top, none in the air.", "uk": "Край причалу: твої стовпчики з кроком, як на твоїх фото, і PLA_QuaySet там, де ліхтар стоїть разом зі стовпчиком. Перевірка: основа кожного стовпчика стоїть на верху причалу, жодна не висить у повітрі."}, "lesson": 3}, {"text": {"en": "Streets: lamp posts every 15 to 20 m and bins at corners and doors; pack props only for gaps, each credited. Check: the counts in furniture_d1.md match what you placed.", "uk": "Вулиці: ліхтарі кожні 15-20 м і урни на рогах та біля дверей; пропси з паків лише для прогалин, з указаним автором для кожного. Перевірка: кількості у furniture_d1.md збігаються з тим, що ти розставляєш."}, "lesson": 3}, {"text": {"en": "LaneGauge: slide it along every drone lane at its planned height. Check: the cube passes every lane without touching a lamp head.", "uk": "LaneGauge: проведи його вздовж кожного коридору дрона на запланованій висоті. Перевірка: куб проходить кожен коридор, не торкаючись жодної голови ліхтаря."}, "lesson": 3}, {"text": {"en": "Boat hull in Blender: a 5 x 1.8 x 0.7 m box shaped into an open hull with loop cuts, a pointed and raised bow, a narrower keel and Solidify (redo or finish your lesson boat). Check: Dimensions show about 5 m by 1.8 m, and the inside is hollow.", "uk": "Корпус човна в Blender: бокс 5 x 1,8 x 0,7 м, перетворений на відкритий корпус за допомогою loop cuts, загостреного й піднятого носа, вужчого кіля і Solidify (переробити чи довершити човен з уроку). Перевірка: Dimensions показують приблизно 5 м на 1,8 м, а всередині порожньо."}, "lesson": 4}, {"text": {"en": "Boat finish: two seats from thin boxes (about 0.25 x 1.5 x 0.04 m) fitted wall to wall and joined to the hull (Ctrl+J), Smart UV Project, your wood or painted-metal instance, the origin on the waterline, a UCX box named UCX_SM_Skiff_5m_00; export SM_Skiff_5m.fbx and reimport it. Check: in the Static Mesh Editor, Approx Size reads about 500 x 180 x 90.", "uk": "Оздоблення човна: дві лавки-сидіння з тонких боксів (приблизно 0,25 x 1,5 x 0,04 м), припасовані від борту до борту й з'єднані з корпусом (Ctrl+J), Smart UV Project, твій інстанс дерева чи фарбованого металу, опорна точка на ватерлінії, бокс UCX з назвою UCX_SM_Skiff_5m_00; експортуй SM_Skiff_5m.fbx і повторно імпортуй. Перевірка: у Static Mesh Editor Approx Size показує приблизно 500 x 180 x 90."}, "lesson": 4}, {"text": {"en": "Moor three boats beside bollards with Location Z 0, each with its own colour: a child instance of your wood or painted-metal instance with another Tint, set in Details > Materials. Check: from 2 m the waterline cuts each hull about a third of the way up.", "uk": "Пришвартуй три човни біля стовпчиків із Location Z 0, кожен свого кольору: дочірній інстанс твого інстансу дерева чи фарбованого металу з іншим Tint, призначений у Details > Materials. Перевірка: з 2 м ватерлінія перетинає кожен корпус приблизно на третині висоти."}, "lesson": 4}, {"text": {"en": "stat unit from C4 after; if the GPU time rose more than 10 %, pack more loose props into sets and measure again. Check: an 'after furniture' line in budget.md within 10 % of the before line.", "uk": "stat unit з C4 після; якщо час GPU зріс більш ніж на 10 %, упакуй більше окремих пропсів у набори й виміряй знову. Перевірка: рядок «після меблів» у budget.md у межах 10 % від рядка «до»."}, "lesson": 2}, {"text": {"en": "Capture: C2 before and after the furniture (before_after_day43.png), and a 60-second flight over the promenade and the boats. Save today's clip as flythrough_day43.mp4 and check that you also have skiff.blend, promenade_10m.png and boats_2m.png (each is described in today's hand-in list; take any you are missing now). Check: both files are in today's Work folder.", "uk": "Запис: C2 до і після меблів (before_after_day43.png) і 60-секундний проліт над променадом і човнами. Збережи сьогоднішнє відео як flythrough_day43.mp4 і перевір, що в тебе також є skiff.blend, promenade_10m.png і boats_2m.png (кожен описано в сьогоднішньому списку «Здати роботу»; яких бракує — зніми зараз). Перевірка: обидва файли в сьогоднішній папці Work."}, "lesson": 3}], "assets": ["island12/free-packs-list.md", "island12/credits-template.md"]}, "lessons": [{"title": {"en": "Counting furniture by use", "uk": "Рахуємо меблі за призначенням"}, "minutes": 40, "goals": [{"en": "Count furniture from length and spacing: a 90 m promenade with a bench every 15 m holds 6 or 7 benches.", "uk": "Рахувати меблі за довжиною й кроком: на променаді 90 м із лавкою кожні 15 м уміщається 6 або 7 лавок."}, {"en": "Place by use: benches face a view, bins sit by benches and doors, bollards stand where boats tie up.", "uk": "Розставляти за призначенням: лавки дивляться на краєвид, урни стоять біля лавок і дверей, стовпчики — там, де прив'язують човни."}, {"en": "Write the counts down before you place anything.", "uk": "Записувати кількості, перш ніж щось розставляти."}], "doalong": [{"en": "Measure the quay edge on plot_plan_d1.png against the scale bar. You should see one length in metres.", "uk": "Виміряй край причалу на plot_plan_d1.png за масштабною лінійкою. Ти маєш побачити одну довжину в метрах."}, {"en": "Divide it by the bollard spacing in your photos and write the count in furniture_d1.md. You should see a whole number.", "uk": "Поділи її на крок стовпчиків на твоїх фото і запиши кількість у furniture_d1.md. Ти маєш побачити ціле число."}, {"en": "Do the same for benches (every 12 to 15 m) and lamp posts (every 15 to 20 m) along the promenade. You should see three rows in the table.", "uk": "Зроби те саме для лавок (кожні 12-15 м) і ліхтарів (кожні 15-20 м) уздовж променаду. Ти маєш побачити три рядки в таблиці."}, {"en": "Mark on the plan where people sit, wait and walk in; put bins there. You should see bins at benches, doors and corners.", "uk": "Познач на плані, де люди сидять, чекають і заходять; постав туди урни. Ти маєш побачити урни біля лавок, дверей і на рогах."}, {"en": "Compare your spacing with two reference photos. You should see the same rhythm as the real place.", "uk": "Порівняй свій крок із двома референсними фото. Ти маєш побачити той самий ритм, що й у справжньому місці."}], "play": {"en": "Estimate duel: the tutor and I both guess a count (the lamps on my promenade, the bollards on my quay) before we calculate. The closer guess wins.", "uk": "Дуель оцінок: ми з тьютором обоє вгадуємо кількість (ліхтарі на моєму променаді, стовпчики на моєму причалі), перш ніж рахувати. Ближча здогадка перемагає."}, "video": {"search": "street furniture placement urban design spacing"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Counting furniture by use (Day 43, lesson 1 of 4).\nToday's build: District 1's street furniture and boats: your own Week 1 props placed by use as Packed Level Actor sets, a simple boat of your own moored three times, and the cost measured.\n\nBy the end of this lesson I can:\n1. Count furniture from length and spacing: a 90 m promenade with a bench every 15 m holds 6 or 7 benches.\n2. Place by use: benches face a view, bins sit by benches and doors, bollards stand where boats tie up.\n3. Write the counts down before you place anything.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (District 1 has every building and shop front standing on level shelves, with paving to every door.), what I will learn today (You furnish district 1 with your own Week 1 bollards, benches, lamp posts and bins as instanced sets, and moor a simple boat you model yourself.), encourage me (The props you modelled in week one now dress your own town, which shows how far you have come.), and share today's quote: \"You can't use up creativity. The more you use, the more you have.\" (Maya Angelou).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 40: in your Boss, how did you prove that nothing floats? | Day 36: why does a biome graph make clumps and gaps instead of an even spread?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Estimate duel: the tutor and I both guess a count (the lamps on my promenade, the bollards on my quay) before we calculate. The closer guess wins.\n6. Do-along on today's build (the bench set as a Packed Level Actor): guide me through these steps one at a time, checking a screenshot after each:\n   - Measure the quay edge on plot_plan_d1.png against the scale bar. You should see one length in metres.\n   - Divide it by the bollard spacing in your photos and write the count in furniture_d1.md. You should see a whole number.\n   - Do the same for benches (every 12 to 15 m) and lamp posts (every 15 to 20 m) along the promenade. You should see three rows in the table.\n   - Mark on the plan where people sit, wait and walk in; put bins there. You should see bins at benches, doors and corners.\n   - Compare your spacing with two reference photos. You should see the same rhythm as the real place.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Instancing with Packed Level Actors (micro-lesson)", "uk": "Інстансинг із Packed Level Actors (мікроурок)"}, "minutes": 40, "goals": [{"en": "Explain instancing: drawing many copies of the same mesh together in one go instead of one by one, which saves the CPU a lot of work.", "uk": "Пояснювати інстансинг: малювання багатьох копій однієї сітки разом за один раз, а не по одній, що заощаджує процесору багато роботи."}, {"en": "Make a Packed Level Actor: a group of meshes packed into one actor, where repeated meshes become instances; it places in one click and edits once for every copy.", "uk": "Створювати Packed Level Actor: групу сіток, упаковану в один актор, де однакові сітки стають інстансами; він ставиться одним клацанням і змінюється один раз для кожної копії."}, {"en": "Measure with stat unit from the same spot before and after.", "uk": "Вимірювати stat unit з того самого місця до і після."}], "doalong": [{"en": "Place SM_Bench and SM_Bin side by side on a free spot in district 1. You should see a bench with a bin beside it.", "uk": "Постав SM_Bench і SM_Bin поруч на вільному місці в районі 1. Ти маєш побачити лавку з урною біля неї."}, {"en": "Select both (Ctrl+click in the Outliner), right-click > Level > Create Packed Level Actor, set Pivot Type to Center Min Z and click OK. Save the new level as PLA_BenchSet in Content/Island/District1; when Unreal also asks to save a Blueprint, keep its suggested name (it starts with BPP_). You should see one actor replace the two.", "uk": "Виділи обидва (Ctrl+клік в Outliner), правий клік > Level > Create Packed Level Actor, встанови Pivot Type на Center Min Z і натисни OK. Збережи новий рівень як PLA_BenchSet у Content/Island/District1; коли Unreal також запропонує зберегти Blueprint, залиш запропоновану назву (вона починається з BPP_). Ти маєш побачити, що один актор замінив два."}, {"en": "Hold Alt and drag the move arrow to make 10 copies along a test line. You should see 10 benches with bins, but only 10 actors in the Outliner, not 20.", "uk": "Утримуй Alt і тягни стрілку переміщення, щоб зробити 10 копій уздовж тестової лінії. Ти маєш побачити 10 лавок з урнами, але в Outliner лише 10 акторів, а не 20."}, {"en": "Right-click one copy > Level > Edit, turn the bin a little, then click Commit, as with Level Instances. You should see every copy change.", "uk": "Правий клік по одній копії > Level > Edit, трохи поверни урну, потім натисни Commit, як із Level Instances. Ти маєш побачити, що змінилася кожна копія."}, {"en": "In Play, fly to C4's spot and run stat unit; write the GPU time and compare it with your Day 41 number there. Delete the test copies afterwards. You should see a small cost for 10 sets.", "uk": "У Play прилети на місце C4 і виконай stat unit; запиши час GPU і порівняй зі своїм числом там із Дня 41. Потім видали тестові копії. Ти маєш побачити невелику вартість для 10 наборів."}], "play": {"en": "Cost challenge: I place 40 benches on the promenade for under 1 ms more GPU time than none. The tutor checks my stat unit numbers.", "uk": "Виклик вартості: я ставлю 40 лавок на променаді, додаючи менше ніж 1 мс часу GPU порівняно з порожнім. Тьютор перевіряє мої числа stat unit."}, "video": {"url": "https://www.youtube.com/watch?v=pWgVa_8885U", "title": "Unreal Engine 5 Tutorial - Level Design Tools - Packed Level Actors", "channel": "JBarlowTraining", "length": "6:47", "search": "unreal engine 5 packed level actors"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Instancing with Packed Level Actors (micro-lesson) (Day 43, lesson 2 of 4).\nToday's build: District 1's street furniture and boats: your own Week 1 props placed by use as Packed Level Actor sets, a simple boat of your own moored three times, and the cost measured.\nEarlier today I already did: lesson 1 (Counting furniture by use). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Explain instancing: drawing many copies of the same mesh together in one go instead of one by one, which saves the CPU a lot of work.\n2. Make a Packed Level Actor: a group of meshes packed into one actor, where repeated meshes become instances; it places in one click and edits once for every copy.\n3. Measure with stat unit from the same spot before and after.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Cost challenge: I place 40 benches on the promenade for under 1 ms more GPU time than none. The tutor checks my stat unit numbers.\n4. Do-along on today's build (the bench set as a Packed Level Actor): guide me through these steps one at a time, checking a screenshot after each:\n   - Place SM_Bench and SM_Bin side by side on a free spot in district 1. You should see a bench with a bin beside it.\n   - Select both (Ctrl+click in the Outliner), right-click > Level > Create Packed Level Actor, set Pivot Type to Center Min Z and click OK. Save the new level as PLA_BenchSet in Content/Island/District1; when Unreal also asks to save a Blueprint, keep its suggested name (it starts with BPP_). You should see one actor replace the two.\n   - Hold Alt and drag the move arrow to make 10 copies along a test line. You should see 10 benches with bins, but only 10 actors in the Outliner, not 20.\n   - Right-click one copy > Level > Edit, turn the bin a little, then click Commit, as with Level Instances. You should see every copy change.\n   - In Play, fly to C4's spot and run stat unit; write the GPU time and compare it with your Day 41 number there. Delete the test copies afterwards. You should see a small cost for 10 sets.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Unreal Engine 5 Tutorial - Level Design Tools - Packed Level Actors\" by JBarlowTraining: https://www.youtube.com/watch?v=pWgVa_8885U\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Set dressing by use, with the lanes kept clear", "uk": "Наповнення сцени за призначенням, з вільними коридорами"}, "minutes": 40, "goals": [{"en": "Place props the way people use them, in clusters with breathing space, never a rigid grid outside formal rows.", "uk": "Розставляти пропси так, як ними користуються люди, групами з вільним простором між ними, ніколи жорсткою сіткою, крім формальних рядів."}, {"en": "Keep lamp heads and tall props out of the drone lanes and prove it with LaneGauge, your 4 x 4 x 4 m gauge cube.", "uk": "Тримати голови ліхтарів і високі пропси поза коридорами дрона й доводити це за допомогою LaneGauge, твого куба-калібру 4 x 4 x 4 м."}, {"en": "Use pack props only for the gaps your own props don't cover, and credit them.", "uk": "Брати пропси з паків лише для прогалин, яких не закривають твої власні пропси, і вказувати їхніх авторів."}], "doalong": [{"en": "Place PLA_BenchSet copies along the promenade at your counted spacing, each bench facing the view, and turn a few by 2 to 5 degrees (Details > Rotation Z). You should see a rhythm, not a perfect row.", "uk": "Розстав копії PLA_BenchSet уздовж променаду з порахованим кроком, кожну лавку лицем до краєвиду, і поверни кілька на 2-5 градусів (Details > Rotation Z). Ти маєш побачити ритм, а не ідеальний ряд."}, {"en": "Place lamp posts along the street side at their spacing. You should see poles that follow the paving edge (lines made by people may be straight).", "uk": "Розстав ліхтарі вздовж боку вулиці з їхнім кроком. Ти маєш побачити стовпи, що йдуть за краєм мощення (лінії, зроблені людьми, можуть бути прямими)."}, {"en": "Select LaneGauge, your Day 38 gauge cube, in the Outliner (if you can't find it, drag a Cube from Place Actors > Shapes, set Scale 4, 4, 4 and name it LaneGauge). You should see a box the size of a drone lane.", "uk": "Виділи LaneGauge, свій куб-калібр з Дня 38, в Outliner (якщо не можеш знайти, перетягни Cube з Place Actors > Shapes, встанови Scale 4, 4, 4 і назви його LaneGauge). Ти маєш побачити коробку розміром із коридор дрона."}, {"en": "Move LaneGauge along each lane at its planned height. You should see it pass without touching a lamp head; move any lamp it hits.", "uk": "Веди LaneGauge уздовж кожного коридору на запланованій висоті. Ти маєш побачити, що він проходить, не торкаючись голів ліхтарів; переставляй кожен ліхтар, у який він влучає."}, {"en": "Add one pack prop for a gap (a traffic sign or a barrier) and write its credit line. You should see a new line in credits.md.", "uk": "Додай один пропс із паку для прогалини (дорожній знак чи огорожу) і напиши рядок про автора. Ти маєш побачити новий рядок у credits.md."}], "play": {"en": "Story spotting: I describe three places where people would sit or wait. The tutor must find them in my 10 m screenshot.", "uk": "Пошук історій: я описую три місця, де люди сиділи б чи чекали. Тьютор має знайти їх на моєму скриншоті з 10 м."}, "video": {"url": "https://www.youtube.com/watch?v=YZ4gSKZh6do", "title": "How I Quickly Create 3D Environments in Unreal Engine 5 / FULL WORKFLOW", "channel": "pwnisher", "length": "22:30", "search": "unreal engine 5 set dressing environment"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Set dressing by use, with the lanes kept clear (Day 43, lesson 3 of 4).\nToday's build: District 1's street furniture and boats: your own Week 1 props placed by use as Packed Level Actor sets, a simple boat of your own moored three times, and the cost measured.\nEarlier today I already did: lesson 1 (Counting furniture by use); lesson 2 (Instancing with Packed Level Actors (micro-lesson)). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Place props the way people use them, in clusters with breathing space, never a rigid grid outside formal rows.\n2. Keep lamp heads and tall props out of the drone lanes and prove it with LaneGauge, your 4 x 4 x 4 m gauge cube.\n3. Use pack props only for the gaps your own props don't cover, and credit them.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Story spotting: I describe three places where people would sit or wait. The tutor must find them in my 10 m screenshot.\n4. Do-along on today's build (the bench set as a Packed Level Actor): guide me through these steps one at a time, checking a screenshot after each:\n   - Place PLA_BenchSet copies along the promenade at your counted spacing, each bench facing the view, and turn a few by 2 to 5 degrees (Details > Rotation Z). You should see a rhythm, not a perfect row.\n   - Place lamp posts along the street side at their spacing. You should see poles that follow the paving edge (lines made by people may be straight).\n   - Select LaneGauge, your Day 38 gauge cube, in the Outliner (if you can't find it, drag a Cube from Place Actors > Shapes, set Scale 4, 4, 4 and name it LaneGauge). You should see a box the size of a drone lane.\n   - Move LaneGauge along each lane at its planned height. You should see it pass without touching a lamp head; move any lamp it hits.\n   - Add one pack prop for a gap (a traffic sign or a barrier) and write its credit line. You should see a new line in credits.md.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"How I Quickly Create 3D Environments in Unreal Engine 5 / FULL WORKFLOW\" by pwnisher: https://www.youtube.com/watch?v=YZ4gSKZh6do\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "A simple boat of your own, moored at the waterline", "uk": "Простий власний човен, пришвартований біля лінії води"}, "minutes": 40, "goals": [{"en": "Model an open boat from a box with tools you know: loop cuts, scaling along one axis, and Solidify.", "uk": "Моделювати відкритий човен із бокса знайомими інструментами: loop cuts, масштабування вздовж однієї осі і Solidify."}, {"en": "Put a boat's origin at its waterline, so setting its Z to the water surface makes it float at the right depth.", "uk": "Ставити опорну точку човна на його ватерлінію, щоб, коли Z човна дорівнює поверхні води, він плавав на правильній глибині."}, {"en": "Moor copies in different colours beside bollards, checked from water level.", "uk": "Швартувати копії різних кольорів біля стовпчиків і перевіряти з рівня води."}], "doalong": [{"en": "In a new Blender file add a cube (Shift+A > Mesh > Cube). In the N panel set Dimensions to X 5, Y 1.8 and Z 0.7 m, then apply the scale (Ctrl+A > Scale). You should see a long box with Scale 1, 1, 1.", "uk": "У новому файлі Blender додай куб (Shift+A > Mesh > Cube). На панелі N встанови Dimensions X 5, Y 1.8 і Z 0.7 m (у полях Blender — з крапкою), потім застосуй масштаб (Ctrl+A > Scale). Ти маєш побачити довгий бокс зі Scale 1, 1, 1."}, {"en": "Tab into Edit Mode. Press Ctrl+R, hover over a long top edge so the yellow ring runs across the box, scroll once for 2 cuts, then click and right-click. You should see two rings that split the length into three.", "uk": "Натисни Tab, щоб увійти в Edit Mode (режим редагування). Натисни Ctrl+R, наведи на довге верхнє ребро так, щоб жовте кільце йшло поперек бокса, прокрути коліщатко один раз для 2 розрізів, потім клацни лівою і правою кнопкою. Ти маєш побачити два кільця, що ділять довжину на три частини."}, {"en": "Press 1 for vertices and Alt+Z for X-ray. In the Top view (Numpad 7) box-select the four vertices at the front end and type S Y 0, Enter; then press M > By Distance to join the vertices that now sit on top of each other. Then, in the Front view (Numpad 1), box-select only the top vertex of the bow and type G Z 0.2, Enter. You should see a pointed bow that rises a little.", "uk": "Натисни 1 для вершин і Alt+Z для X-ray. У вигляді Top (Numpad 7) виділи рамкою чотири вершини на передньому кінці й введи S Y 0, Enter; потім натисни M > By Distance, щоб об'єднати вершини, які тепер лежать одна на одній. Потім у вигляді Front (Numpad 1) виділи рамкою лише верхню вершину носа й введи G Z 0.2, Enter. Ти маєш побачити загострений ніс, що трохи піднімається."}, {"en": "In the Front view, box-select the whole bottom row and type S Y 0.6. In the Top view, box-select the back end and type S Y 0.85. You should see a hull that narrows at the keel and the stern.", "uk": "У вигляді Front виділи рамкою весь нижній ряд і введи S Y 0.6. У вигляді Top виділи рамкою задній кінець і введи S Y 0.85. Ти маєш побачити корпус, що звужується до кіля й корми."}, {"en": "Press Alt+Z to leave X-ray, press 3 for faces, Shift+click the three top faces and press X > Faces. Tab out, then Add Modifier > Generate > Solidify with Thickness 0.03 m. You should see an open hull with walls 3 cm thick.", "uk": "Натисни Alt+Z, щоб вийти з X-ray, натисни 3 для граней, Shift+клік по трьох верхніх гранях і натисни X > Faces. Вийди через Tab, потім Add Modifier > Generate > Solidify із Thickness 0.03 m. Ти маєш побачити відкритий корпус зі стінками завтовшки 3 см."}, {"en": "Put the origin on the waterline: set Location Z to 0.35 (the keel now sits on the grid), press Shift+S > Cursor to World Origin, type 0.25 into the 3D cursor's Z (N panel > View > 3D Cursor), choose Object > Set Origin > Origin to 3D Cursor, then press Alt+G. You should see the orange origin dot at the world origin with 25 cm of hull below the grid.", "uk": "Постав опорну точку на ватерлінію: встанови Location Z на 0.35 (кіль тепер стоїть на сітці), натисни Shift+S > Cursor to World Origin, введи 0.25 у Z 3D-курсора (панель N > View > 3D Cursor), вибери Object > Set Origin > Origin to 3D Cursor, потім натисни Alt+G. Ти маєш побачити помаранчеву точку опорної точки в центрі світу і 25 см корпусу під сіткою."}, {"en": "Export SM_Skiff_5m.fbx with your Day 4 export settings and import it into Content/Island/District1. Place it beside a bollard and type 0 into Location Z: sea level is Z = 0 (Day 26). You should see about a third of the hull under the water.", "uk": "Експортуй SM_Skiff_5m.fbx зі своїми налаштуваннями експорту з Дня 4 й імпортуй його в Content/Island/District1. Постав його біля стовпчика й введи 0 у Location Z: рівень моря — це Z = 0 (День 26). Ти маєш побачити приблизно третину корпусу під водою."}], "play": {"en": "Scale detective: from my water-level screenshot, the tutor guesses how deep my boat sits. I give the real figure.", "uk": "Детектив масштабу: за моїм скриншотом із рівня води тьютор вгадує, наскільки глибоко сидить мій човен. Я називаю справжнє число."}, "video": {"url": "https://www.youtube.com/watch?v=09SO3X_fUto", "title": "Unreal Engine 5 Tutorial: Easy Water System Walkthrough for Beginners (Island, River, Lake)", "channel": "EZ Unreal", "length": "10:39", "search": "unreal engine 5 water system tutorial"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: A simple boat of your own, moored at the waterline (Day 43, lesson 4 of 4).\nToday's build: District 1's street furniture and boats: your own Week 1 props placed by use as Packed Level Actor sets, a simple boat of your own moored three times, and the cost measured.\nEarlier today I already did: lesson 1 (Counting furniture by use); lesson 2 (Instancing with Packed Level Actors (micro-lesson)); lesson 3 (Set dressing by use, with the lanes kept clear). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Model an open boat from a box with tools you know: loop cuts, scaling along one axis, and Solidify.\n2. Put a boat's origin at its waterline, so setting its Z to the water surface makes it float at the right depth.\n3. Moor copies in different colours beside bollards, checked from water level.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Scale detective: from my water-level screenshot, the tutor guesses how deep my boat sits. I give the real figure.\n4. Do-along on today's build (the bench set as a Packed Level Actor): guide me through these steps one at a time, checking a screenshot after each:\n   - In a new Blender file add a cube (Shift+A > Mesh > Cube). In the N panel set Dimensions to X 5, Y 1.8 and Z 0.7 m, then apply the scale (Ctrl+A > Scale). You should see a long box with Scale 1, 1, 1.\n   - Tab into Edit Mode. Press Ctrl+R, hover over a long top edge so the yellow ring runs across the box, scroll once for 2 cuts, then click and right-click. You should see two rings that split the length into three.\n   - Press 1 for vertices and Alt+Z for X-ray. In the Top view (Numpad 7) box-select the four vertices at the front end and type S Y 0, Enter; then press M > By Distance to join the vertices that now sit on top of each other. Then, in the Front view (Numpad 1), box-select only the top vertex of the bow and type G Z 0.2, Enter. You should see a pointed bow that rises a little.\n   - In the Front view, box-select the whole bottom row and type S Y 0.6. In the Top view, box-select the back end and type S Y 0.85. You should see a hull that narrows at the keel and the stern.\n   - Press Alt+Z to leave X-ray, press 3 for faces, Shift+click the three top faces and press X > Faces. Tab out, then Add Modifier > Generate > Solidify with Thickness 0.03 m. You should see an open hull with walls 3 cm thick.\n   - Put the origin on the waterline: set Location Z to 0.35 (the keel now sits on the grid), press Shift+S > Cursor to World Origin, type 0.25 into the 3D cursor's Z (N panel > View > 3D Cursor), choose Object > Set Origin > Origin to 3D Cursor, then press Alt+G. You should see the orange origin dot at the world origin with 25 cm of hull below the grid.\n   - Export SM_Skiff_5m.fbx with your Day 4 export settings and import it into Content/Island/District1. Place it beside a bollard and type 0 into Location Z: sea level is Z = 0 (Day 26). You should see about a third of the hull under the water.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Unreal Engine 5 Tutorial: Easy Water System Walkthrough for Beginners (Island, River, Lake)\" by EZ Unreal: https://www.youtube.com/watch?v=09SO3X_fUto\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "furniture_d1.md (counts, spacing, places)", "uk": "furniture_d1.md (кількості, крок, місця)"}, {"en": "SM_Skiff_5m.fbx and skiff.blend", "uk": "SM_Skiff_5m.fbx і skiff.blend"}, {"en": "budget.md (stat unit before and after the furniture)", "uk": "budget.md (stat unit до і після меблів)"}, {"en": "promenade_10m.png and boats_2m.png", "uk": "promenade_10m.png і boats_2m.png"}, {"en": "credits.md (any pack props added)", "uk": "credits.md (додані пропси з паків, якщо є)"}, {"en": "before_after_day43.png (C2 before and after)", "uk": "before_after_day43.png (C2 до і після)"}, {"en": "flythrough_day43.mp4 (60 seconds over the promenade and the boats)", "uk": "flythrough_day43.mp4 (60 секунд над променадом і човнами)"}, {"en": "summary.md", "uk": "звіт дня (summary.md)"}], "goal": {"en": "By the end of today you have district 1 furnished with your own bollards, benches, lamp posts and bins, placed by use as instanced sets, and three of your own boats moored at the waterline.", "uk": "Наприкінці дня район 1 облаштований твоїми власними швартовними стовпчиками, лавками, ліхтарями й урнами, розставленими за призначенням як інстансовані набори, а три твої власні човни пришвартовані біля лінії води."}, "uses": [{"en": "Days 1 to 5: SM_Bollard, SM_Bench, SM_LampPost and SM_Bin", "uk": "Дні 1-5: SM_Bollard, SM_Bench, SM_LampPost і SM_Bin"}, {"en": "Day 42: the buildings, shop fronts and paving of district 1", "uk": "День 42: будівлі, фасади крамниць і мощення району 1"}, {"en": "Day 41: budget.md and your stat unit spots", "uk": "День 41: budget.md і твої місця для stat unit"}, {"en": "Day 23: the furniture counts in plot_plan_d1.md", "uk": "День 23: кількість меблів у plot_plan_d1.md"}, {"en": "Day 38: LaneGauge, your 4 x 4 x 4 m gauge cube", "uk": "День 38: LaneGauge, твій куб-калібр 4 x 4 x 4 м"}, {"en": "Days 26 and 29: sea level at Z = 0 and the ocean", "uk": "Дні 26 і 29: рівень моря на Z = 0 і океан"}, {"en": "Day 12: your M_Master instances (painted metal, wood)", "uk": "День 12: твої інстанси M_Master (фарбований метал, дерево)"}, {"en": "Day 24: Street Props Pack Vol.1, if you picked it, for the gaps", "uk": "День 24: Street Props Pack Vol.1, якщо ти його вибираєш, для прогалин"}], "quiz": [{"q": {"en": "A promenade is 90 m long and your photos show a bench every 15 m. About how many benches do you place?", "uk": "Променад завдовжки 90 м, а на твоїх фото лавка стоїть кожні 15 м. Скільки приблизно лавок ти ставиш?"}, "options": [{"en": "3", "uk": "3"}, {"en": "6 or 7", "uk": "6 або 7"}, {"en": "15", "uk": "15"}, {"en": "90", "uk": "90"}], "answer": 1, "explain": {"en": "90 divided by 15 is 6; with one at each end you get 6 or 7.", "uk": "90, поділене на 15, — це 6; з лавкою на кожному кінці виходить 6 або 7."}}, {"q": {"en": "Your boat floats 30 cm above the water, even though its Z equals the water surface Z. What is the likely cause?", "uk": "Твій човен висить на 30 см над водою, хоча його Z дорівнює Z поверхні води. Яка ймовірна причина?"}, "options": [{"en": "The origin is at the keel (the bottom), not at the waterline", "uk": "Опорна точка на кілі (на дні), а не на ватерлінії"}, {"en": "The water's material is wrong", "uk": "Неправильний матеріал води"}, {"en": "The boat has no collision", "uk": "Човен не має колізії"}, {"en": "Nanite is off", "uk": "Nanite вимкнено"}], "answer": 0, "explain": {"en": "Unreal puts the origin at the Z you type. If the origin is at the bottom, the whole hull sits on top of the water.", "uk": "Unreal ставить опорну точку на той Z, який ти вводиш. Якщо опорна точка на дні, увесь корпус лежить поверх води."}}, {"q": {"en": "Why pack a bench and a bin into a Packed Level Actor?", "uk": "Навіщо пакувати лавку й урну в Packed Level Actor?"}, "options": [{"en": "So the bench can move in the wind", "uk": "Щоб лавка могла рухатися на вітрі"}, {"en": "So the bench gets collision", "uk": "Щоб лавка отримала колізію"}, {"en": "So the set places in one click, edits once for every copy, and draws its repeated meshes as instances", "uk": "Щоб набір ставився одним клацанням, змінювався один раз для кожної копії і малював свої однакові сітки як інстанси"}, {"en": "So the bin stops casting shadows", "uk": "Щоб урна перестала відкидати тіні"}], "answer": 2, "explain": {"en": "A Packed Level Actor is one placeable set that you edit once. Inside it, repeated meshes are drawn together as instances, and fewer actors cost the CPU less.", "uk": "Packed Level Actor — це один набір, який можна розставляти і який змінюєш один раз. Усередині нього однакові сітки малюються разом як інстанси, а менше акторів менше навантажує процесор."}}, {"q": {"en": "A lamp head touches your gauge cube on the main drone lane. What do you do?", "uk": "Голова ліхтаря торкається твого куба-калібру на головному коридорі дрона. Що ти робиш?"}, "options": [{"en": "Delete the lane", "uk": "Видаляю коридор"}, {"en": "Make the cube smaller", "uk": "Зменшую куб"}, {"en": "Hide the lamp in game view", "uk": "Ховаю ліхтар у Game View"}, {"en": "Move the lamp along the street, or move the lane on the plan, then test again", "uk": "Пересуваю ліхтар уздовж вулиці або пересуваю коридор на плані, а потім перевіряю знову"}], "answer": 3, "explain": {"en": "The lane must stay at least 4 x 4 m. Move the lamp or the lane and prove it again with the cube.", "uk": "Коридор має лишатися щонайменше 4 x 4 м. Пересунь ліхтар або коридор і знову доведи це кубом."}}, {"q": {"en": "After you place the furniture, the GPU time at C4 goes from 10 ms to 12.5 ms. Your rule is 10 %. What next?", "uk": "Після розстановки меблів час GPU на C4 зростає з 10 мс до 12,5 мс. Твоє правило — 10 %. Що далі?"}, "options": [{"en": "Nothing, because it is still under 16.6 ms", "uk": "Нічого, бо це досі менше 16,6 мс"}, {"en": "Pack more loose props into sets and measure again, because 25 % is over the rule", "uk": "Упакувати більше окремих пропсів у набори й виміряти знову, бо 25 % перевищує правило"}, {"en": "Turn off Lumen", "uk": "Вимкнути Lumen"}, {"en": "Remove all the lamps", "uk": "Прибрати всі ліхтарі"}], "answer": 1, "explain": {"en": "2.5 ms on 10 ms is 25 %. Keeping each layer inside its share leaves room for planting and decals tomorrow.", "uk": "2,5 мс від 10 мс — це 25 %. Коли кожен шар тримається своєї частки, лишається місце для рослин і декалей завтра."}}], "weekInfo": {"week": 9, "title": {"en": "District 1: the waterfront", "uk": "Район 1: набережна"}, "goal": {"en": "By Friday you have district 1, your waterfront, built from your plan with your own kit, props, boats, plants and decals, measured against a frame budget, and five screenshots that stand beside your reference photos.", "uk": "До п'ятниці в тебе є район 1, твоя набережна, збудований за твоїм планом із твого власного модульного набору, пропсів, човнів, рослин і декалей, перевірений бюджетом кадру, та п'ять скриншотів, які витримують порівняння з твоїми референсними фото."}, "skills": [{"en": "Set dressing a 200 x 200 m district from a counted plot plan in Unreal Engine 5", "uk": "Наповнення сцени (set dressing) району 200 x 200 м за планом розміщення з підрахунками в Unreal Engine 5"}, {"en": "Performance budgeting with stat unit, stat gpu and CSV profiling", "uk": "Бюджет продуктивності зі stat unit, stat gpu і CSV-профілюванням"}, {"en": "Modular building assembly with Level Instances and Packed Level Actors", "uk": "Збирання модульних будівель за допомогою Level Instances і Packed Level Actors"}, {"en": "Decal and material-wear storytelling for realistic environments", "uk": "Розповідь через декалі та зношеність матеріалів для реалістичного оточення"}, {"en": "Art review against reference photographs with located see-why-fix notes", "uk": "Арт-рев'ю за референсними фото з прив'язаними до місця нотатками «що бачу, чому, як виправити»"}]}, "morning": {"sofar": {"en": "District 1 has every building and shop front standing on level shelves, with paving to every door.", "uk": "У районі 1 уже стоять усі будівлі й вітрини на рівних уступах, з бруківкою до кожних дверей."}, "today": {"en": "You furnish district 1 with your own Week 1 bollards, benches, lamp posts and bins as instanced sets, and moor a simple boat you model yourself.", "uk": "Сьогодні ти облаштовуєш район 1 власними стовпчиками, лавами, ліхтарними стовпами й урнами з тижня 1, розставленими групами інстансів, і швартуєш простий човен, змодельований власноруч."}, "cheer": {"en": "The props you modelled in week one now dress your own town, which shows how far you have come.", "uk": "Пропси з першого тижня тепер прикрашають твоє власне місто, і це показує, який великий шлях уже позаду."}, "quote": {"text": {"en": "You can't use up creativity. The more you use, the more you have.", "uk": "Творчість неможливо вичерпати. Що більше її використовуєш, то більше її маєш."}, "author": {"en": "Maya Angelou", "uk": "Мая Енджелоу"}, "source": "https://en.wikiquote.org/wiki/Maya_Angelou"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-43-district1-street-furniture-and-boats", "mapHref": "../../COURSE.html", "prevHref": "../Day-42-district1-buildings-and-fronts/START-HERE.html", "nextHref": "../Day-44-district1-planting-grime-decals/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Blender and Unreal Engine 5.8. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me and don't write code. Keep me moving and make it feel like a game.\n\nToday I build on my own: All the other furniture and the boats, on your own.\nIt's part of: District 1's street furniture and boats: your own Week 1 props placed by use as Packed Level Actor sets, a simple boat of your own moored three times, and the cost measured (District 1: the quay edge, the promenade and the streets between the buildings, and the water along the quay.).\n\nSpec:\n- Counts in furniture_d1.md, starting from the furniture rows of plot_plan_d1.md (Day 23) and checked against each length and spacing: mooring bollards along the quay edge (every 8 to 10 m, or what your photos show), a bench every 12 to 15 m on the promenade facing the view, a bin beside every second bench and at street corners, lamp posts every 15 to 20 m.\n- Your own SM_Bollard, SM_Bench, SM_LampPost and SM_Bin first; pack props (Street Props Pack Vol.1, CC-BY, so credit it) only for gaps such as traffic signs or barriers.\n- Repeated groups as Packed Level Actors, for example PLA_BenchSet (a bench and a bin) and PLA_QuaySet (a bollard and a lamp post). A Packed Level Actor is a group of meshes packed into one actor: repeated meshes inside it become instances (many copies of one mesh drawn together in one go, much cheaper than drawing each copy alone), and the whole set places in one click and edits once for every copy.\n- SM_Skiff_5m: a simple open boat about 5 m long and 1.8 m wide, under 3,000 triangles, with its origin on the waterline (the line where the water meets the hull, 25 cm above the keel), a UCX collision box (UCX_SM_Skiff_5m_00) and your M_Master instances. Three copies moored beside bollards at Z = 0, each in its own colour (a child instance with another Tint, set in Details > Materials).\n- Lamp heads and anything tall kept out of the drone lanes, tested with LaneGauge, your 4 x 4 x 4 m gauge cube from Day 38 (you slide it along a lane: if it touches something, the lane is blocked).\n- stat unit from C4 before and after the furniture: furniture adds no more than about 10 % to the GPU time.\n\nMy checklist:\n1. Count from the plan: copy the furniture rows of plot_plan_d1.md into furniture_d1.md (item, count, spacing, where) and check each count against its length divided by its spacing. Check: every count comes from a length divided by a spacing. (from lesson 1)\n2. stat unit from C4 before any furniture (as on Day 41); write GPU and Frame in budget.md. Screenshot C2 for your before picture. Check: a 'before furniture' line in budget.md. (from lesson 2)\n3. PLA_BenchSet: a bench and a bin side by side, packed with right-click > Level > Create Packed Level Actor. Check: the Outliner shows one actor for the set. (from lesson 2)\n4. Promenade: PLA_BenchSet copies every 12 to 15 m, benches facing the view, a few turned 2 to 5 degrees. Check: from 10 m each bench faces water or a view, never a wall. (from lesson 3)\n5. Quay edge: your bollards at your photos' spacing, and PLA_QuaySet where a lamp stands with a bollard. Check: every bollard base sits on the quay top, none in the air. (from lesson 3)\n6. Streets: lamp posts every 15 to 20 m and bins at corners and doors; pack props only for gaps, each credited. Check: the counts in furniture_d1.md match what you placed. (from lesson 3)\n7. LaneGauge: slide it along every drone lane at its planned height. Check: the cube passes every lane without touching a lamp head. (from lesson 3)\n8. Boat hull in Blender: a 5 x 1.8 x 0.7 m box shaped into an open hull with loop cuts, a pointed and raised bow, a narrower keel and Solidify (redo or finish your lesson boat). Check: Dimensions show about 5 m by 1.8 m, and the inside is hollow. (from lesson 4)\n9. Boat finish: two seats from thin boxes (about 0.25 x 1.5 x 0.04 m) fitted wall to wall and joined to the hull (Ctrl+J), Smart UV Project, your wood or painted-metal instance, the origin on the waterline, a UCX box named UCX_SM_Skiff_5m_00; export SM_Skiff_5m.fbx and reimport it. Check: in the Static Mesh Editor, Approx Size reads about 500 x 180 x 90. (from lesson 4)\n10. Moor three boats beside bollards with Location Z 0, each with its own colour: a child instance of your wood or painted-metal instance with another Tint, set in Details > Materials. Check: from 2 m the waterline cuts each hull about a third of the way up. (from lesson 4)\n11. stat unit from C4 after; if the GPU time rose more than 10 %, pack more loose props into sets and measure again. Check: an 'after furniture' line in budget.md within 10 % of the before line. (from lesson 2)\n12. Capture: C2 before and after the furniture (before_after_day43.png), and a 60-second flight over the promenade and the boats. Save today's clip as flythrough_day43.mp4 and check that you also have skiff.blend, promenade_10m.png and boats_2m.png (each is described in today's hand-in list; take any you are missing now). Check: both files are in today's Work folder. (from lesson 3)\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Maria\nDay 43: Street furniture, boats and instancing. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

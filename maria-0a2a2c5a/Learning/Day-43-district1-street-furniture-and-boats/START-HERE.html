k": "Виділи в Outliner LaneGauge — твій куб-калібр з Дня 38. Якщо не знаходиш, перетягни Cube з Place Actors > Shapes, задай Scale 4, 4, 4 і назви LaneGauge. Має вийти коробка завбільшки з польотний коридор."}, {"en": "Move LaneGauge along each lane at its planned height. You should see it pass without touching a lamp head; move any lamp it hits.", "uk": "Веди LaneGauge уздовж кожного коридору на запланованій висоті. Куб має пройти, не зачепивши жодного плафона. Кожен ліхтар, який він зачіпає, переставляй."}, {"en": "Add one pack prop for a gap (a traffic sign or a barrier) and write its credit line in credits.md (in GAD on your PC). You should see a new line there.", "uk": "Додай один пропс із пака для прогалини (дорожній знак чи загородження) і запиши його рядок авторства в credits.md (у папці GAD на ПК). У файлі з'являється новий рядок."}], "play": {"en": "Story spotting: I describe three places where people would sit or wait. The tutor must find them in my 10 m screenshot.", "uk": "Пошук історій: я описую три місця, де люди сиділи б чи чекали. Тьютор має знайти їх на моєму скриншоті з 10 м."}, "video": {"url": "https://www.youtube.com/watch?v=YZ4gSKZh6do", "title": "How I Quickly Create 3D Environments in Unreal Engine 5 / FULL WORKFLOW", "channel": "pwnisher", "length": "22:30", "search": "unreal engine 5 set dressing environment"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Наповнення сцени за призначенням, з вільними коридорами (Day 43, lesson 3 of 4). Today's build: Район 1, облаштований твоїми пропсами з 1-го тижня в комплектах Packed Level Actor, три пришвартовані копії твого власного човна і виміряна вартість.\nWhat I already know: Дні 1–5: SM_Bollard, SM_Bench, SM_LampPost і SM_Bin — пропси з 1-го тижня нарешті повертаються; День 42: будівлі, фасади крамниць і мощення району 1; День 41: budget.md і твої місця для stat unit; День 23: кількість меблів у plot_plan_d1.md; День 38: LaneGauge — твій куб-калібр 4 × 4 × 4 м; День 26 і День 29: рівень моря на Z = 0 і океан; День 12: твої інстанси M_Master (фарбований метал, дерево); День 24: Street Props Pack Vol.1, якщо його вибрано, — для прогалин.\nEarlier today I already did: lesson 1 (Рахуємо меблі за призначенням); lesson 2 (Інстансинг із Packed Level Actor (мікроурок)). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Розставляти пропси так, як ними користуються люди: групами з вільним простором між ними. Жорстку сітку — лише для формальних рядів.\n2. Тримати плафони ліхтарів і високі пропси поза польотними коридорами й доводити це LaneGauge — кубом-калібром 4 × 4 × 4 м.\n3. Брати пропси з паків лише для прогалин, яких не закривають твої власні, і писати для них рядки авторства.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: 2 lines on why today matters and where it comes back, in plain words (from this: Меблі оживляють набережну, але можуть і загальмувати її: це сотні дрібних пропсів. Згруповані в комплекти з інстансами, вони коштують мало. А розставлені за призначенням, з 10 м виглядають справжніми. Студії наймають саме за цей шлях: від власних пропсів до справжнього місця. It comes back: Твої пропси й човни потраплять у п'ять кадрів огляду в п'ятницю, поруч із фото-референсами. PLA_BenchSet і звичка до інстансингу повернуться в День 51, коли ти облаштовуватимеш район 2.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-43-district1-street-furniture-and-boats exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (Набір із лавкою як Packed Level Actor). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Розстав копії PLA_BenchSet уздовж набережної з порахованим кроком, кожну лавку лицем до краєвиду. Кілька поверни на 2–5 градусів (Details > Rotation Z). Має вийти ритм, а не ідеальний ряд.\n   2. Розстав ліхтарні стовпи вздовж вулиці з їхнім кроком. Стовпи йдуть за краєм мощення. Лінії, які провели люди, можуть бути прямими.\n   3. Виділи в Outliner LaneGauge — твій куб-калібр з Дня 38. Якщо не знаходиш, перетягни Cube з Place Actors > Shapes, задай Scale 4, 4, 4 і назви LaneGauge. Має вийти коробка завбільшки з польотний коридор. [screenshot]\n   4. Веди LaneGauge уздовж кожного коридору на запланованій висоті. Куб має пройти, не зачепивши жодного плафона. Кожен ліхтар, який він зачіпає, переставляй.\n   5. Додай один пропс із пака для прогалини (дорожній знак чи загородження) і запиши його рядок авторства в credits.md (у папці GAD на ПК). У файлі з'являється новий рядок. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Пошук історій: я описую три місця, де люди сиділи б чи чекали. Тьютор має знайти їх на моєму скриншоті з 10 м. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\nIf I want to go deeper, recommend this free video: \"How I Quickly Create 3D Environments in Unreal Engine 5 / FULL WORKFLOW\" by pwnisher: https://www.youtube.com/watch?v=YZ4gSKZh6do\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; review (by tutor or art director) = огляд; credits line = рядок авторства; reference photo / hero photo = фото-референс / ключове фото; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; File Explorer = Провідник; mesh = меш; grid = сітка (тільки grid, ніколи mesh); vertex / edge / face = вершина / ребро / грань; origin (and kit pivot) = origin — точка, за яку об'єкт ставлять і обертають; world origin / 3D cursor = центр світу / 3D-курсор; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; loop cut / edge loop = петлевий розріз (Loop Cut) / петля ребер; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); modifier = модифікатор; level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; material instance / child instance = інстанс / дочірній інстанс; drone flight corridor = польотний коридор; kit / kit piece / part of one object = набір / деталь / частина; district / plot / plot plan = район / ділянка / план ділянки; harbour / quay / waterfront / pier = гавань / причал / набережна / пірс; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; shop front / shop window = фасад крамниці / вітрина; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}, {"title": {"en": "A simple boat of your own, with its origin on the waterline", "uk": "Твій простий човен з origin на ватерлінії"}, "minutes": 40, "goals": [{"en": "Model an open boat from a box with tools you know: loop cuts, scaling along one axis, and Solidify.", "uk": "Моделювати відкритий човен із куба знайомими інструментами: петлеві розрізи, масштабування вздовж однієї осі і Solidify."}, {"en": "Put a boat's origin at its waterline, so setting its Z to the water surface makes it float at the right depth.", "uk": "Ставити origin човна на ватерлінію. Origin — це точка, за яку об'єкт ставлять і обертають. Тоді, якщо Z човна дорівнює поверхні води, він сидить у воді на правильній глибині."}, {"en": "Check your file the studio way: save, close, reopen, and see the hull in the Outliner before you export.", "uk": "Перевіряти файл, як у студії: зберегти, закрити, відкрити знову й побачити корпус в Outliner перед експортом."}], "doalong": [{"en": "In a new Blender file add a cube (Shift+A > Mesh > Cube). In the N panel set Dimensions to X 5, Y 1.8 and Z 0.7 m, then apply the scale (Ctrl+A > Scale). Save it as skiff.blend in the day work folder. You should see a long box with Scale 1, 1, 1.", "uk": "У новому файлі Blender додай куб (Shift+A > Mesh > Cube). На панелі N задай Dimensions: X 5, Y 1.8, Z 0.7, потім застосуй масштаб (Ctrl+A > Scale). Збережи як skiff.blend у робочій папці дня. Має вийти довга коробка зі Scale 1, 1, 1."}, {"en": "Tab into Edit Mode. Press Ctrl+R and hover over a long top edge, so the yellow ring runs across the box. Scroll once for 2 cuts, then click and right-click. No mouse wheel? Set Number of Cuts to 2 in the panel at the bottom left. You should see two rings splitting the length into three.", "uk": "Натисни Tab, щоб перейти в Edit Mode. Натисни Ctrl+R і наведи на довге верхнє ребро: жовте кільце має пройти впоперек коробки. Прокрути коліщатко раз — буде 2 розрізи. Потім клацни і клацни правою кнопкою. Немає коліщатка? Задай Number of Cuts: 2 на панелі внизу ліворуч. Має вийти два кільця, що ділять довжину на три частини."}, {"en": "Press 1 for vertices and turn on X-ray: Alt+Z, or the X-ray button (two overlapping squares) at the top right of the viewport. If Alt+Z opens the NVIDIA overlay, use the button. You should see through the box.", "uk": "Натисни 1 (режим вершин) і ввімкни X-ray: Alt+Z або кнопка X-ray (два квадрати один на одному) угорі праворуч у в'юпорті. Якщо Alt+Z відкриває оверлей NVIDIA, користуйся кнопкою. Коробка стає прозорою."}, {"en": "Go to the Top view: Numpad 7, or click the blue Z circle of the axis gizmo at the top right. Box-select the four vertices at the front end. Type S Y 0, Enter, then M > By Distance. You should see a pointed bow from above.", "uk": "Перейди на вид Top: Numpad 7 або клацни синє коло Z на гізмо осей угорі праворуч. Виділи рамкою чотири вершини на передньому кінці. Введи S Y 0, Enter, потім M > By Distance. Згори видно гострий ніс."}, {"en": "Go to the Front view: Numpad 1, or click the green -Y circle of the gizmo. Select only the top vertex of the bow and type G Z 0.2, Enter. Then box-select the whole bottom row and type S Y 0.6. You should see a raised bow and a hull that narrows at the keel.", "uk": "Перейди на вид Front: Numpad 1 або клацни зелене коло -Y на гізмо. Виділи лише верхню вершину носа і введи G Z 0.2, Enter. Потім виділи рамкою весь нижній ряд і введи S Y 0.6. Має вийти піднятий ніс і корпус, що звужується до кіля."}, {"en": "In the Top view, box-select the back end and type S Y 0.85. Leave X-ray (Alt+Z or the button), press 3 for faces, select the three top faces and press X > Faces. Tab out and add Modifier > Generate > Solidify, Thickness 0.03 m. You should see an open hull with walls 3 cm thick.", "uk": "На виді Top виділи рамкою задній кінець і введи S Y 0.85. Вимкни X-ray (Alt+Z або кнопка), натисни 3 (режим граней), виділи три верхні грані й натисни X > Faces. Вийди з Edit Mode клавішею Tab і додай Modifier > Generate > Solidify, Thickness 0.03. Має вийти відкритий корпус зі стінками завтовшки 3 см."}, {"en": "Set Location Z to 0.35, so the keel sits on the grid. Press Shift+S > Cursor to World Origin, then type 0.25 into the cursor's Z (N panel > View). Choose Object > Set Origin > Origin to 3D Cursor, and press Alt+G. You should see the origin dot at the world origin, with 25 cm of hull below the grid.", "uk": "Задай Location Z 0.35, щоб кіль став на сітку. Натисни Shift+S > Cursor to World Origin, потім введи 0.25 у Z курсора (панель N > View). Вибери Object > Set Origin > Origin to 3D Cursor і натисни Alt+G. Має вийти: точка origin — у центрі світу, а 25 см корпусу — під сіткою."}], "play": {"en": "Scale detective: from my water-level screenshot, the tutor guesses how deep my boat sits. I give the real figure.", "uk": "Детектив масштабу: за моїм скриншотом із рівня води тьютор вгадує, наскільки глибоко сидить мій човен. Я називаю справжнє число."}, "video": {"url": "https://www.youtube.com/watch?v=09SO3X_fUto", "title": "Unreal Engine 5 Tutorial: Easy Water System Walkthrough for Beginners (Island, River, Lake)", "channel": "EZ Unreal", "length": "10:39", "search": "unreal engine 5 water system tutorial"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Твій простий човен з origin на ватерлінії (Day 43, lesson 4 of 4). Today's build: Район 1, облаштований твоїми пропсами з 1-го тижня в комплектах Packed Level Actor, три пришвартовані копії твого власного човна і виміряна вартість.\nWhat I already know: Дні 1–5: SM_Bollard, SM_Bench, SM_LampPost і SM_Bin — пропси з 1-го тижня нарешті повертаються; День 42: будівлі, фасади крамниць і мощення району 1; День 41: budget.md і твої місця для stat unit; День 23: кількість меблів у plot_plan_d1.md; День 38: LaneGauge — твій куб-калібр 4 × 4 × 4 м; День 26 і День 29: рівень моря на Z = 0 і океан; День 12: твої інстанси M_Master (фарбований метал, дерево); День 24: Street Props Pack Vol.1, якщо його вибрано, — для прогалин.\nEarlier today I already did: lesson 1 (Рахуємо меблі за призначенням); lesson 2 (Інстансинг із Packed Level Actor (мікроурок)); lesson 3 (Наповнення сцени за призначенням, з вільними коридорами). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Моделювати відкритий човен із куба знайомими інструментами: петлеві розрізи, масштабування вздовж однієї осі і Solidify.\n2. Ставити origin човна на ватерлінію. Origin — це точка, за яку об'єкт ставлять і обертають. Тоді, якщо Z човна дорівнює поверхні води, він сидить у воді на правильній глибині.\n3. Перевіряти файл, як у студії: зберегти, закрити, відкрити знову й побачити корпус в Outliner перед експортом.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: 2 lines on why today matters and where it comes back, in plain words (from this: Меблі оживляють набережну, але можуть і загальмувати її: це сотні дрібних пропсів. Згруповані в комплекти з інстансами, вони коштують мало. А розставлені за призначенням, з 10 м виглядають справжніми. Студії наймають саме за цей шлях: від власних пропсів до справжнього місця. It comes back: Твої пропси й човни потраплять у п'ять кадрів огляду в п'ятницю, поруч із фото-референсами. PLA_BenchSet і звичка до інстансингу повернуться в День 51, коли ти облаштовуватимеш район 2.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-43-district1-street-furniture-and-boats exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (Набір із лавкою як Packed Level Actor). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. У новому файлі Blender додай куб (Shift+A > Mesh > Cube). На панелі N задай Dimensions: X 5, Y 1.8, Z 0.7, потім застосуй масштаб (Ctrl+A > Scale). Збережи як skiff.blend у робочій папці дня. Має вийти довга коробка зі Scale 1, 1, 1.\n   2. Натисни Tab, щоб перейти в Edit Mode. Натисни Ctrl+R і наведи на довге верхнє ребро: жовте кільце має пройти впоперек коробки. Прокрути коліщатко раз — буде 2 розрізи. Потім клацни і клацни правою кнопкою. Немає коліщатка? Задай Number of Cuts: 2 на панелі внизу ліворуч. Має вийти два кільця, що ділять довжину на три частини.\n   3. Натисни 1 (режим вершин) і ввімкни X-ray: Alt+Z або кнопка X-ray (два квадрати один на одному) угорі праворуч у в'юпорті. Якщо Alt+Z відкриває оверлей NVIDIA, користуйся кнопкою. Коробка стає прозорою.\n   4. Перейди на вид Top: Numpad 7 або клацни синє коло Z на гізмо осей угорі праворуч. Виділи рамкою чотири вершини на передньому кінці. Введи S Y 0, Enter, потім M > By Distance. Згори видно гострий ніс. [screenshot]\n   5. Перейди на вид Front: Numpad 1 або клацни зелене коло -Y на гізмо. Виділи лише верхню вершину носа і введи G Z 0.2, Enter. Потім виділи рамкою весь нижній ряд і введи S Y 0.6. Має вийти піднятий ніс і корпус, що звужується до кіля.\n   6. На виді Top виділи рамкою задній кінець і введи S Y 0.85. Вимкни X-ray (Alt+Z або кнопка), натисни 3 (режим граней), виділи три верхні грані й натисни X > Faces. Вийди з Edit Mode клавішею Tab і додай Modifier > Generate > Solidify, Thickness 0.03. Має вийти відкритий корпус зі стінками завтовшки 3 см.\n   7. Задай Location Z 0.35, щоб кіль став на сітку. Натисни Shift+S > Cursor to World Origin, потім введи 0.25 у Z курсора (панель N > View). Вибери Object > Set Origin > Origin to 3D Cursor і натисни Alt+G. Має вийти: точка origin — у центрі світу, а 25 см корпусу — під сіткою. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Детектив масштабу: за моїм скриншотом із рівня води тьютор вгадує, наскільки глибоко сидить мій човен. Я називаю справжнє число. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\nIf I want to go deeper, recommend this free video: \"Unreal Engine 5 Tutorial: Easy Water System Walkthrough for Beginners (Island, River, Lake)\" by EZ Unreal: https://www.youtube.com/watch?v=09SO3X_fUto\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; review (by tutor or art director) = огляд; credits line = рядок авторства; reference photo / hero photo = фото-референс / ключове фото; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; File Explorer = Провідник; mesh = меш; grid = сітка (тільки grid, ніколи mesh); vertex / edge / face = вершина / ребро / грань; origin (and kit pivot) = origin — точка, за яку об'єкт ставлять і обертають; world origin / 3D cursor = центр світу / 3D-курсор; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; loop cut / edge loop = петлевий розріз (Loop Cut) / петля ребер; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); modifier = модифікатор; level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; material instance / child instance = інстанс / дочірній інстанс; volume (PCG Volume, Post Process Volume) = об'єм; kit / kit piece / part of one object = набір / деталь / частина; district / plot / plot plan = район / ділянка / план ділянки; harbour / quay / waterfront / pier = гавань / причал / набережна / пірс; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; shop front / shop window = фасад крамниці / вітрина; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}], "handin": [{"en": "summary.md", "uk": "summary.md (звіт дня)"}, {"en": "budget.md with the before and after furniture lines (→ Day 44)", "uk": "budget.md (з рядками «до меблів» і «після меблів») (→ День 44)"}, {"en": "furnished_10m.png: benches, bollards and the moored boats from 10 m (proof)", "uk": "furnished_10m.png (лавки, стовпчики й пришвартовані човни з 10 м) (доказ)"}], "goal": {"en": "By the end of today your Week 1 props furnish district 1 in instanced sets, and three boats you made are moored.", "uk": "Наприкінці дня пропси з 1-го тижня облаштовують район 1 комплектами-інстансами, а три твої власні човни пришвартовано."}, "uses": [{"en": "Days 1 to 5: SM_Bollard, SM_Bench, SM_LampPost and SM_Bin, your Week 1 props, back at last", "uk": "Дні 1–5: SM_Bollard, SM_Bench, SM_LampPost і SM_Bin — пропси з 1-го тижня нарешті повертаються"}, {"en": "Day 42: the buildings, shop fronts and paving of district 1", "uk": "День 42: будівлі, фасади крамниць і мощення району 1"}, {"en": "Day 41: budget.md and your stat unit spots", "uk": "День 41: budget.md і твої місця для stat unit"}, {"en": "Day 23: the furniture counts in plot_plan_d1.md", "uk": "День 23: кількість меблів у plot_plan_d1.md"}, {"en": "Day 38: LaneGauge, your 4 x 4 x 4 m gauge cube", "uk": "День 38: LaneGauge — твій куб-калібр 4 × 4 × 4 м"}, {"en": "Days 26 and 29: sea level at Z = 0 and the ocean", "uk": "День 26 і День 29: рівень моря на Z = 0 і океан"}, {"en": "Day 12: your M_Master instances (painted metal, wood)", "uk": "День 12: твої інстанси M_Master (фарбований метал, дерево)"}, {"en": "Day 24: Street Props Pack Vol.1, if you picked it, for the gaps", "uk": "День 24: Street Props Pack Vol.1, якщо його вибрано, — для прогалин"}], "quiz": [{"q": {"en": "A promenade is 90 m long and your photos show a bench every 15 m. About how many benches do you place?", "uk": "Набережна завдовжки 90 м, а на твоїх фото лавка стоїть кожні 15 м. Скільки приблизно лавок ти ставиш?"}, "options": [{"en": "3", "uk": "3"}, {"en": "6 or 7", "uk": "6 або 7"}, {"en": "15", "uk": "15"}, {"en": "90", "uk": "90"}], "answer": 1, "explain": {"en": "90 divided by 15 is 6; with one at each end you get 6 or 7.", "uk": "90, поділене на 15, — це 6. Якщо поставити лавку на кожному кінці, виходить 6 або 7."}}, {"q": {"en": "Your boat floats 30 cm above the water, even though its Z equals the water surface Z. What is the likely cause?", "uk": "Твій човен висить на 30 см над водою, хоча його Z дорівнює Z поверхні води. Яка ймовірна причина?"}, "options": [{"en": "The origin is at the keel (the bottom), not at the waterline", "uk": "Origin на кілі (на дні), а не на ватерлінії"}, {"en": "The water's material is wrong", "uk": "Неправильний матеріал води"}, {"en": "The boat has no collision", "uk": "Човен не має колізії"}, {"en": "Nanite is off", "uk": "Nanite вимкнено"}], "answer": 0, "explain": {"en": "Unreal puts the origin at the Z you type. If the origin is at the bottom, the whole hull sits on top of the water.", "uk": "Unreal ставить origin на той Z, який ти вводиш. Якщо origin на дні, увесь корпус стоїть поверх води."}}, {"q": {"en": "Why pack a bench and a bin into a Packed Level Actor?", "uk": "Навіщо пакувати лавку й урну в Packed Level Actor?"}, "options": [{"en": "So the bench can move in the wind", "uk": "Щоб лавка могла рухатися на вітрі"}, {"en": "So the bench gets collision", "uk": "Щоб лавка отримала колізію"}, {"en": "So the set places in one click, edits once for every copy, and draws its repeated meshes as instances", "uk": "Щоб комплект ставився одним клацанням, змінювався один раз для всіх копій і малював свої однакові меші як інстанси"}, {"en": "So the bin stops casting shadows", "uk": "Щоб урна перестала відкидати тіні"}], "answer": 2, "explain": {"en": "A Packed Level Actor is one placeable set that you edit once. Inside it, repeated meshes are drawn together as instances, and fewer actors cost the CPU less.", "uk": "Packed Level Actor — це один комплект, який ставлять і змінюють один раз. Однакові меші всередині Unreal малює разом як інстанси, а менше акторів — менше роботи для процесора."}}, {"q": {"en": "A lamp head touches your gauge cube on the main drone lane. What do you do?", "uk": "Плафон ліхтаря зачіпає твій куб-калібр у головному польотному коридорі. Що ти робиш?"}, "options": [{"en": "Delete the lane", "uk": "Видаляю коридор"}, {"en": "Make the cube smaller", "uk": "Зменшую куб"}, {"en": "Hide the lamp in game view", "uk": "Ховаю ліхтар у режимі Game View"}, {"en": "Move the lamp along the street, or move the lane on the plan, then test again", "uk": "Пересуваю ліхтар уздовж вулиці або коридор на плані, а потім перевіряю знову"}], "answer": 3, "explain": {"en": "The lane must stay at least 4 x 4 m. Move the lamp or the lane and prove it again with the cube.", "uk": "Коридор має лишатися щонайменше 4 × 4 м. Пересунь ліхтар або коридор і знову доведи це кубом."}}, {"q": {"en": "After you place the furniture, the GPU time at C4 goes from 10 ms to 12.5 ms. Your rule is 10 %. What next?", "uk": "Після розстановки меблів час GPU на C4 зростає з 10 мс до 12,5 мс. Твоє правило — 10 %. Що далі?"}, "options": [{"en": "Nothing, because it is still under 16.6 ms", "uk": "Нічого, бо це досі менше 16,6 мс"}, {"en": "Pack more loose props into sets and measure again, because 25 % is over the rule", "uk": "Упакувати більше окремих пропсів у комплекти й виміряти знову, бо 25 % — це більше, ніж дозволяє правило"}, {"en": "Turn off Lumen", "uk": "Вимкнути Lumen"}, {"en": "Remove all the lamps", "uk": "Прибрати всі ліхтарі"}], "answer": 1, "explain": {"en": "2.5 ms on 10 ms is 25 %. Keeping each layer inside its share leaves room for planting and decals tomorrow.", "uk": "2,5 мс від 10 мс — це 25 %. Коли кожен шар тримається своєї частки, завтра лишиться місце для рослин і декалей."}}], "weekInfo": {"week": 9, "title": {"en": "District 1: the waterfront", "uk": "Район 1: набережна"}, "goal": {"en": "By Friday you have district 1, your waterfront, built from your plan and measured against a frame budget, with five screenshots beside your reference photos.", "uk": "До п'ятниці в тебе є район 1 — твоя набережна, збудована за планом і виміряна бюджетом кадру, з п'ятьма скриншотами поруч із фото-референсами."}, "skills": [{"en": "Set dressing a 200 x 200 m district from a counted plot plan in Unreal Engine 5", "uk": "Наповнення сцени (set dressing) району 200 × 200 м за планом ділянки з підрахунками в Unreal Engine 5"}, {"en": "Performance budgeting with stat unit, stat gpu and CSV profiling", "uk": "Бюджет продуктивності: stat unit, stat gpu і CSV-профілювання"}, {"en": "Modular building assembly with Level Instances and Packed Level Actors", "uk": "Збирання модульних будівель із Level Instance і Packed Level Actor"}, {"en": "Decal and material-wear storytelling for realistic environments", "uk": "Розповідь через декалі та зношеність матеріалів для реалістичного оточення"}, {"en": "Art review against reference photographs with located see-why-fix notes", "uk": "Огляд роботи за фото-референсами: нотатки «бачу, чому, як виправити» з точним місцем"}]}, "morning": {"sofar": {"en": "District 1 has every building and shop front standing on shelves cut into the land, with paving to every door.", "uk": "У районі 1 кожна будівля й фасад крамниці стоять на уступах, вирізаних у рельєфі, з мощенням до кожних дверей."}, "today": {"en": "You furnish district 1 with your own Week 1 bollards, benches, lamp posts and bins as instanced sets, and moor three copies of a simple boat you model yourself.", "uk": "Сьогодні ти облаштовуєш район 1 власними стовпчиками, лавками, ліхтарними стовпами й урнами з першого тижня як комплектами-інстансами та швартуєш три копії простого човна власної моделі."}, "cheer": {"en": "The props you modelled in week one now dress your own town, which shows how far you have come.", "uk": "Пропси з першого тижня тепер облаштовують твоє власне містечко — видно, який шлях уже пройдено."}, "quote": {"text": {"en": "You can't use up creativity. The more you use, the more you have.", "uk": "Творчість неможливо вичерпати. Що більше її використовуєш, то більше її маєш."}, "author": {"en": "Maya Angelou", "uk": "Мая Енджелоу"}, "source": "https://en.wikiquote.org/wiki/Maya_Angelou"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-43-district1-street-furniture-and-boats", "mapHref": "../../COURSE.html", "prevHref": "../Day-42-district1-buildings-and-fronts/START-HERE.html", "nextHref": "../Day-44-district1-planting-grime-decals/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Blender and Unreal Engine 5.8. I am a beginner on Day 43. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me and don't write code.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: Усі інші меблі й човни — самостійно.\nIt's part of: Район 1, облаштований твоїми пропсами з 1-го тижня в комплектах Packed Level Actor, три пришвартовані копії твого власного човна і виміряна вартість (Район 1: край причалу, набережна і вулиці між будівлями, а також вода вздовж причалу.).\nWhy it matters: Меблі оживляють набережну, але можуть і загальмувати її: це сотні дрібних пропсів. Згруповані в комплекти з інстансами, вони коштують мало. А розставлені за призначенням, з 10 м виглядають справжніми. Студії наймають саме за цей шлях: від власних пропсів до справжнього місця. It comes back: Твої пропси й човни потраплять у п'ять кадрів огляду в п'ятницю, поруч із фото-референсами. PLA_BenchSet і звичка до інстансингу повернуться в День 51, коли ти облаштовуватимеш район 2.\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-43-district1-street-furniture-and-boats (on the drive I chose on Day 0).\nWhat I already know: Дні 1–5: SM_Bollard, SM_Bench, SM_LampPost і SM_Bin — пропси з 1-го тижня нарешті повертаються; День 42: будівлі, фасади крамниць і мощення району 1; День 41: budget.md і твої місця для stat unit; День 23: кількість меблів у plot_plan_d1.md; День 38: LaneGauge — твій куб-калібр 4 × 4 × 4 м; День 26 і День 29: рівень моря на Z = 0 і океан; День 12: твої інстанси M_Master (фарбований метал, дерево); День 24: Street Props Pack Vol.1, якщо його вибрано, — для прогалин; today's lessons: Рахуємо меблі за призначенням; Інстансинг із Packed Level Actor (мікроурок); Наповнення сцени за призначенням, з вільними коридорами; Твій простий човен з origin на ватерлінії. Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- furniture_d1.md: кількості з рядків меблів у plot_plan_d1.md, кожна перевірена як довжина, поділена на крок. Стовпчики для швартування — кожні 8–10 м або як на твоїх фото. Лавка — кожні 12–15 м, лицем до краєвиду, ліхтарні стовпи — кожні 15–20 м. Урна — біля кожної другої лавки і на рогах.\n- Спершу твої власні SM_Bollard, SM_Bench, SM_LampPost і SM_Bin. Пропси з паків — лише для прогалин, як-от дорожніх знаків, і кожен із рядком авторства (Street Props Pack Vol.1 має ліцензію CC-BY).\n- Групи, що повторюються, збережено як Packed Level Actor, наприклад PLA_BenchSet (лавка й урна) і PLA_QuaySet (стовпчик і ліхтарний стовп). Packed Level Actor — це кілька мешів, упакованих в один актор. Однакові меші всередині стають інстансами: Unreal малює їх разом, за один раз. Набір ставиш одним клацанням, а змінюєш один раз.\n- SM_Skiff_5m: простий відкритий човен, приблизно 5 × 1,8 м і менше ніж 3 000 трикутників. Його origin — на ватерлінії, на 25 см вище кіля. У нього є блок UCX (UCX_SM_Skiff_5m_00) і твої інстанси M_Master. Три копії пришвартовано біля стовпчиків на Z = 0, кожна свого кольору.\n- Плафони ліхтарів і все високе стоїть поза польотними коридорами. Це перевірено LaneGauge — твоїм кубом-калібром 4 × 4 × 4 м з Дня 38. Якщо куб щось зачіпає, коридор заблоковано.\n- stat unit з C4 до і після меблів: меблі додають до часу GPU не більше ніж приблизно 10 %.\n\nMy checklist (the same numbers show on my course page):\n1. Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: furniture_d1.md і skiff.blend, а в Unreal — PLA_BenchSet. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Потім перевір кожну кількість у furniture_d1.md. Перевірка: кожна кількість — це довжина, поділена на крок. (from lesson 1)\n2. Скопіюй найновіший budget.md (День 41) у робочу папку дня. Запусти stat unit з C4, поки меблів ще немає, і запиши GPU та Frame у рядок «до меблів». Перевірка: рядок є в budget.md. (from lesson 2)\n3. PLA_QuaySet: стовпчик і ліхтарний стовп, упаковані так само, як PLA_BenchSet (клацни правою кнопкою > Level > Create Packed Level Actor). Перевірка: Outliner показує для комплекту один актор, а PLA_QuaySet є в Content Browser. (from lesson 2)\n4. Набережна: копії PLA_BenchSet кожні 12–15 м, лавки лицем до краєвиду, кілька повернуто на 2–5 градусів. Перевірка: з 10 м кожна лавка дивиться на воду чи краєвид, а не на стіну. (from lesson 3)\n5. Край причалу: твої стовпчики з тим кроком, що на фото, і PLA_QuaySet там, де ліхтар стоїть поруч зі стовпчиком. Перевірка: основа кожного стовпчика стоїть на верху причалу. (from lesson 3)\n6. Вулиці: ліхтарні стовпи кожні 15–20 м, урни на рогах і біля дверей. Пропси з паків — лише для прогалин, і кожен допиши в credits.md у папці GAD на ПК. Перевірка: кількості у furniture_d1.md збігаються з тим, що стоїть у районі. (from lesson 3)\n7. Проведи LaneGauge уздовж кожного польотного коридору на запланованій висоті. Перевірка: куб проходить кожен коридор, не зачепивши жодного плафона. (from lesson 3)\n8. Човен у Blender: відкрий skiff.blend і доведи корпус з уроку. Зроби Smart UV Project, признач свій інстанс дерева чи фарбованого металу і додай блок UCX з назвою UCX_SM_Skiff_5m_00. Якщо є час, додай два сидіння з тонких коробок (Ctrl+J об'єднує їх). Збережи, закрий і знову відкрий skiff.blend. Перевірка: корпус є в Outliner, а Dimensions показують приблизно 5 × 1,8 м. (from lesson 4)\n9. Експортуй SM_Skiff_5m.fbx з налаштуваннями з Дня 4, але з Path Mode: Auto і вимкненим Embed Textures. У Провіднику файл має бути 10 КБ або більше: 4 КБ означає, що нічого не було виділено. Імпортуй його в Content/Island/District1. Перевірка: у Static Mesh Editor поле Approx Size показує приблизно 500 × 180 × 90. (from lesson 4)\n10. Пришвартуй три човни біля стовпчиків на Location Z 0. Дай кожному свій колір: дочірній інстанс від твого інстансу дерева чи фарбованого металу з іншим Tint. Якщо хвилі трохи заходять у корпус, це допустимо — або зменш хвилі океану біля гавані. Перевірка: з 2 м ватерлінія перетинає кожен корпус приблизно на третині висоти. (from lesson 4)\n11. Знову запусти stat unit з C4 і запиши в budget.md рядок «після меблів». Якщо час GPU виріс більш ніж на 10 %, упакуй більше окремих пропсів у комплекти й виміряй знову. Перевірка: рядок «після» відрізняється від рядка «до» не більше ніж на 10 %. (from lesson 2)\n12. Доказ: натисни Ctrl+S. З 10 м зніми лавки, стовпчики й пришвартовані човни в одному кадрі й збережи як furnished_10m.png. Перевірка: furnished_10m.png відкривається, і на ньому видно всі три. (from lesson 3)\n13. Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: кожна назва зі списку є в папці, у кожної є розмір. (from day 0, lesson 1)\n\nHow to help: ask which step number I'm on, then give me only the next step: the exact clicks and what I should see. When I send a screenshot, compare it with my reference, my sizes and the spec, and name one thing to fix at a time.\nCheck every save and export by reopening it before we move on:\n- a .md or .txt: open it with Notepad; the text is there, and the name doesn't end in .md.txt\nWhen I write \"готово\", and in any case before the day ends, check with me one item at a time (yes/no): each spec point, then each file on my hand-in list, ready in my day work folder (skip summary.md: the day report writes it next):\n1. budget.md (з рядками «до меблів» і «після меблів») (→ День 44)\n2. furnished_10m.png (лавки, стовпчики й пришвартовані човни з 10 м) (доказ)\nFinish with a short list of anything missing, and one line on where this work comes back and what it will look like there. Then tell me the order for the end of the day: first the day report (the Copy the day report button at the bottom of my course page) into summary.md, and only then hand in all the files on the list, summary.md too.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; review (by tutor or art director) = огляд; checklist = чек-лист; credits line = рядок авторства; reference photo / hero photo = фото-референс / ключове фото; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; File Explorer = Провідник; mesh = меш; grid = сітка (тільки grid, ніколи mesh); vertex / edge / face = вершина / ребро / грань; origin (and kit pivot) = origin — точка, за яку об'єкт ставлять і обертають; world origin / 3D cursor = центр світу / 3D-курсор; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; loop cut / edge loop = петлевий розріз (Loop Cut) / петля ребер; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); modifier = модифікатор; level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; collision / UCX collision box = колізія / блок UCX; material in  return '<section class="card glass morning"><div class="mgrid">'+(m.sofar?'<div>'+lab(u('sofar'),'gold')+shelf+'<p class="mtxt">'+lk(x(m.sofar))+'</p></div>':'')+(m.today?'<div>'+lab(u('todayL'))+'<p class="mtxt">'+lk(x(m.today))+'</p></div>':'')+'</div>'+(m.cheer?'<p class="cheer">'+esc(x(m.cheer))+'</p>':'')+(qt?'<figure class="quote well">'+kn('quote')+'<blockquote>'+esc(qt)+'</blockquote>'+(q.author?'<figcaption>'+esc(x(q.author))+'</figcaption>':'')+'</figure>':'')+'</section>'}
function setLang(l){lang=l;try{localStorage.setItem('devteam:lang',lang)}catch(e){};render()}
function toggleLang(){setLang(lang==='uk'?'en':'uk')}
/* keep open sections and keyboard focus across re-renders */
const openD=new Set();
function tg(e){if(e.open)openD.add(e.id);else openD.delete(e.id)}
const op=id=>openD.has(id)?' open':'';
function render(){const ae=document.activeElement,fid=ae&&(ae.id||(ae.getAttribute('data-th')?'th-'+ae.getAttribute('data-th'):ae.getAttribute('lang')&&ae.closest('.seg')?'lg-'+ae.getAttribute('lang'):''));
 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);
 const b=D.build,P=Math.round(prog()*100);
 document.getElementById('top').innerHTML='<div class="topin glass"><a class="maplink" href="'+esc(D.mapHref)+'">'+kn('map')+u('map')+'</a><div class="crumb"><b>'+esc(x(D.learnerName))+'</b><span>'+u('week')+' '+D.week+'</span><span>'+u('day')+' '+D.day+' '+u('of')+' '+D.total+'</span></div>'+controls(lang,'setLang')+'</div><div class="tline"><i style="width:'+P+'%"></i></div>';
 const state=w=>w<D.week?'b':w===D.week?'n':'p';
 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 let wk='';if(D.weekInfo){const w=D.weekInfo;wk='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}
 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p>'+(b.next?'<div class="back well">'+kn('arrow')+'<div><b>'+u('comes')+'</b><br>'+lk(x(b.next))+'</div></div>':'')+'<div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.assetFiles&&D.assetFiles.length?'<p class="files">'+ic('folder')+'<span>'+u('filesL')+' '+D.assetFiles.map(f=>'<a href="assets/'+encodeURIComponent(f)+'" target="_blank" rel="noopener">'+esc(f)+'</a>').join(', ')+'</span></p>':D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+=handinCard();h+=beforeCard();
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div><label class="rcpt" for="r'+i+'"><span class="eyebrow">'+u('rcpt')+'</span><textarea id="r'+i+'" rows="2" placeholder="'+esc(u('rcptPh'))+'" oninput="st.r'+i+'=this.value;save()">'+esc(st['r'+i]||'')+'</textarea></label>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+hList()+chkList()+(hasClip?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<h3>1 · '+u('copyR')+'</h3><p class="muted">'+u('report')+'</p><div class="row"><button class="btn ghost" onclick="cp(reportText())">'+ic('copy')+u('copyR')+'</button></div><h3>2 · '+u('ship')+'</h3>'+hf()+'<p class="muted" style="margin:12px 0 0">'+u('hNote')+'</p></section>';
 h+=qCard();h+=wk;
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();
</script>

<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 43</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

<script id="data" type="application/json">{"learner": "ib-maria-0a2a2c5a", "learnerName": {"en": "Maria", "uk": "Марія"}, "day": 43, "week": 9, "total": 60, "title": {"en": "Street furniture, boats and instancing", "uk": "Вуличні меблі, човни та інстансинг"}, "theme": {"en": "Week 9: District 1: the waterfront", "uk": "Тиждень 9: Район 1: набережна"}, "build": {"item": {"en": "District 1 furnished with your Week 1 props as Packed Level Actor sets, three moored copies of your own boat, and the cost measured", "uk": "Район 1, облаштований твоїми пропсами з 1-го тижня в комплектах Packed Level Actor, три пришвартовані копії твого власного човна і виміряна вартість"}, "why": {"en": "Furniture makes a waterfront come alive, and it can also make it slow: hundreds of small props. Grouped into instanced sets they cost little, and placed by use they read as real from 10 m. Studios hire for exactly this path from your own props to a real place.", "uk": "Меблі оживляють набережну, але можуть і загальмувати її: це сотні дрібних пропсів. Згруповані в комплекти з інстансами, вони коштують мало. А розставлені за призначенням, з 10 м виглядають справжніми. Студії наймають саме за цей шлях: від власних пропсів до справжнього місця."}, "next": {"en": "Your props and boats appear in Friday's five review shots beside your reference photos. PLA_BenchSet and the instancing habit come back on Day 51, when you furnish district 2.", "uk": "Твої пропси й човни потраплять у п'ять кадрів огляду в п'ятницю, поруч із фото-референсами. PLA_BenchSet і звичка до інстансингу повернуться в День 51, коли ти облаштовуватимеш район 2."}, "where": {"en": "District 1: the quay edge, the promenade and the streets between the buildings, and the water along the quay.", "uk": "Район 1: край причалу, набережна і вулиці між будівлями, а також вода вздовж причалу."}, "spec": [{"en": "furniture_d1.md: counts from the furniture rows of plot_plan_d1.md, each checked as length divided by spacing. Mooring bollards every 8 to 10 m, or as your photos show. A bench every 12 to 15 m, facing the view, and lamp posts every 15 to 20 m. A bin beside every second bench and at corners.", "uk": "furniture_d1.md: кількості з рядків меблів у plot_plan_d1.md, кожна перевірена як довжина, поділена на крок. Стовпчики для швартування — кожні 8–10 м або як на твоїх фото. Лавка — кожні 12–15 м, лицем до краєвиду, ліхтарні стовпи — кожні 15–20 м. Урна — біля кожної другої лавки і на рогах."}, {"en": "Your own SM_Bollard, SM_Bench, SM_LampPost and SM_Bin first. Pack props only for gaps such as traffic signs, each credited (Street Props Pack Vol.1 is CC-BY).", "uk": "Спершу твої власні SM_Bollard, SM_Bench, SM_LampPost і SM_Bin. Пропси з паків — лише для прогалин, як-от дорожніх знаків, і кожен із рядком авторства (Street Props Pack Vol.1 має ліцензію CC-BY)."}, {"en": "Repeated groups as Packed Level Actors, for example PLA_BenchSet (a bench and a bin) and PLA_QuaySet (a bollard and a lamp post). A Packed Level Actor packs several meshes into one actor. Repeated meshes inside it become instances, drawn together in one go. A set places in one click and edits once.", "uk": "Групи, що повторюються, збережено як Packed Level Actor, наприклад PLA_BenchSet (лавка й урна) і PLA_QuaySet (стовпчик і ліхтарний стовп). Packed Level Actor — це кілька мешів, упакованих в один актор. Однакові меші всередині стають інстансами: Unreal малює їх разом, за один раз. Набір ставиш одним клацанням, а змінюєш один раз."}, {"en": "SM_Skiff_5m: a simple open boat, about 5 x 1.8 m and under 3,000 triangles. Its origin sits on the waterline, 25 cm above the keel. It has a UCX box (UCX_SM_Skiff_5m_00) and your M_Master instances. Three copies moored beside bollards at Z = 0, each in its own colour.", "uk": "SM_Skiff_5m: простий відкритий човен, приблизно 5 × 1,8 м і менше ніж 3 000 трикутників. Його origin — на ватерлінії, на 25 см вище кіля. У нього є блок UCX (UCX_SM_Skiff_5m_00) і твої інстанси M_Master. Три копії пришвартовано біля стовпчиків на Z = 0, кожна свого кольору."}, {"en": "Lamp heads and anything tall kept out of the drone lanes, tested with LaneGauge, your 4 x 4 x 4 m gauge cube from Day 38. If it touches something, the lane is blocked.", "uk": "Плафони ліхтарів і все високе стоїть поза польотними коридорами. Це перевірено LaneGauge — твоїм кубом-калібром 4 × 4 × 4 м з Дня 38. Якщо куб щось зачіпає, коридор заблоковано."}, {"en": "stat unit from C4 before and after the furniture: the furniture adds no more than about 10 % to the GPU time.", "uk": "stat unit з C4 до і після меблів: меблі додають до часу GPU не більше ніж приблизно 10 %."}], "piece1": "the bench set as a Packed Level Actor", "piece2": {"en": "All the other furniture and the boats, on your own", "uk": "Усі інші меблі й човни — самостійно"}, "steps": [{"text": {"en": "Check: the files from today's lessons are in the day work folder (furniture_d1.md and skiff.blend; in Unreal, PLA_BenchSet). Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it. Then check every count in furniture_d1.md. Check: each count is a length divided by a spacing.", "uk": "Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: furniture_d1.md і skiff.blend, а в Unreal — PLA_BenchSet. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Потім перевір кожну кількість у furniture_d1.md. Перевірка: кожна кількість — це довжина, поділена на крок."}, "lesson": 1}, {"text": {"en": "Copy your newest budget.md (Day 41) into the day work folder. Run stat unit from C4 before any furniture, and write GPU and Frame on a 'before furniture' line. Check: the line is in budget.md.", "uk": "Скопіюй найновіший budget.md (День 41) у робочу папку дня. Запусти stat unit з C4, поки меблів ще немає, і запиши GPU та Frame у рядок «до меблів». Перевірка: рядок є в budget.md."}, "lesson": 2}, {"text": {"en": "PLA_QuaySet: a bollard and a lamp post, packed like PLA_BenchSet (right-click > Level > Create Packed Level Actor). Check: the Outliner shows one actor for the set, and PLA_QuaySet is in the Content Browser.", "uk": "PLA_QuaySet: стовпчик і ліхтарний стовп, упаковані так само, як PLA_BenchSet (клацни правою кнопкою > Level > Create Packed Level Actor). Перевірка: Outliner показує для комплекту один актор, а PLA_QuaySet є в Content Browser."}, "lesson": 2}, {"text": {"en": "Promenade: PLA_BenchSet copies every 12 to 15 m, benches facing the view, a few turned 2 to 5 degrees. Check: from 10 m each bench faces water or a view, never a wall.", "uk": "Набережна: копії PLA_BenchSet кожні 12–15 м, лавки лицем до краєвиду, кілька повернуто на 2–5 градусів. Перевірка: з 10 м кожна лавка дивиться на воду чи краєвид, а не на стіну."}, "lesson": 3}, {"text": {"en": "Quay edge: your bollards at your photos' spacing, and PLA_QuaySet where a lamp stands with a bollard. Check: every bollard base sits on the quay top.", "uk": "Край причалу: твої стовпчики з тим кроком, що на фото, і PLA_QuaySet там, де ліхтар стоїть поруч зі стовпчиком. Перевірка: основа кожного стовпчика стоїть на верху причалу."}, "lesson": 3}, {"text": {"en": "Streets: lamp posts every 15 to 20 m and bins at corners and doors. Use pack props only for gaps, each added to credits.md in GAD on your PC. Check: the counts in furniture_d1.md match what you placed.", "uk": "Вулиці: ліхтарні стовпи кожні 15–20 м, урни на рогах і біля дверей. Пропси з паків — лише для прогалин, і кожен допиши в credits.md у папці GAD на ПК. Перевірка: кількості у furniture_d1.md збігаються з тим, що стоїть у районі."}, "lesson": 3}, {"text": {"en": "Slide LaneGauge along every drone lane at its planned height. Check: the cube passes every lane without touching a lamp head.", "uk": "Проведи LaneGauge уздовж кожного польотного коридору на запланованій висоті. Перевірка: куб проходить кожен коридор, не зачепивши жодного плафона."}, "lesson": 3}, {"text": {"en": "Boat in Blender: open skiff.blend and finish your lesson hull with Smart UV Project, your wood or painted-metal instance, and a UCX box named UCX_SM_Skiff_5m_00. If you have time, add two seats from thin boxes (Ctrl+J joins them). Save, close and reopen skiff.blend. Check: the hull is in the Outliner, and Dimensions read about 5 x 1.8 m.", "uk": "Човен у Blender: відкрий skiff.blend і доведи корпус з уроку. Зроби Smart UV Project, признач свій інстанс дерева чи фарбованого металу і додай блок UCX з назвою UCX_SM_Skiff_5m_00. Якщо є час, додай два сидіння з тонких коробок (Ctrl+J об'єднує їх). Збережи, закрий і знову відкрий skiff.blend. Перевірка: корпус є в Outliner, а Dimensions показують приблизно 5 × 1,8 м."}, "lesson": 4}, {"text": {"en": "Export SM_Skiff_5m.fbx with your Day 4 settings, but with Path Mode Auto and Embed Textures off. In File Explorer the file must be 10 KB or more: 4 KB means nothing was selected. Import it into Content/Island/District1. Check: in the Static Mesh Editor, Approx Size reads about 500 x 180 x 90.", "uk": "Експортуй SM_Skiff_5m.fbx з налаштуваннями з Дня 4, але з Path Mode: Auto і вимкненим Embed Textures. У Провіднику файл має бути 10 КБ або більше: 4 КБ означає, що нічого не було виділено. Імпортуй його в Content/Island/District1. Перевірка: у Static Mesh Editor поле Approx Size показує приблизно 500 × 180 × 90."}, "lesson": 4}, {"text": {"en": "Moor three boats beside bollards at Location Z 0. Give each its own colour: a child of your wood or painted-metal instance with another Tint. If passing waves dip through a hull, accept a little, or lower the ocean's waves near the harbour. Check: from 2 m the waterline cuts each hull about a third of the way up.", "uk": "Пришвартуй три човни біля стовпчиків на Location Z 0. Дай кожному свій колір: дочірній інстанс від твого інстансу дерева чи фарбованого металу з іншим Tint. Якщо хвилі трохи заходять у корпус, це допустимо — або зменш хвилі океану біля гавані. Перевірка: з 2 м ватерлінія перетинає кожен корпус приблизно на третині висоти."}, "lesson": 4}, {"text": {"en": "Run stat unit from C4 again and write an 'after furniture' line in budget.md. If the GPU time rose more than 10 %, pack more loose props into sets and measure again. Check: the after line is within 10 % of the before line.", "uk": "Знову запусти stat unit з C4 і запиши в budget.md рядок «після меблів». Якщо час GPU виріс більш ніж на 10 %, упакуй більше окремих пропсів у комплекти й виміряй знову. Перевірка: рядок «після» відрізняється від рядка «до» не більше ніж на 10 %."}, "lesson": 2}, {"text": {"en": "Proof: press Ctrl+S. From 10 m, shoot benches, bollards and the moored boats in one view as furnished_10m.png. Check: furnished_10m.png opens and shows all three.", "uk": "Доказ: натисни Ctrl+S. З 10 м зніми лавки, стовпчики й пришвартовані човни в одному кадрі й збережи як furnished_10m.png. Перевірка: furnished_10m.png відкривається, і на ньому видно всі три."}, "lesson": 3}, {"text": {"en": "Report and hand-in: click Copy the day report at the bottom of the page, paste it into a new chat and answer. Open summary.md in Notepad, press Ctrl+End, paste the answer and press Ctrl+S. Then drag the files on the Hand in list into your hand-in folder. Check: every name shows in the folder, each with a size.", "uk": "Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: кожна назва зі списку є в папці, у кожної є розмір."}, "lesson": "D0.1"}], "assets": ["island12/free-packs-list.md", "island12/credits-template.md"]}, "lessons": [{"title": {"en": "Counting furniture by use", "uk": "Рахуємо меблі за призначенням"}, "minutes": 40, "goals": [{"en": "Count furniture from length and spacing: a 90 m promenade with a bench every 15 m holds 6 or 7 benches.", "uk": "Рахувати меблі за довжиною й кроком: на набережній 90 м із лавкою кожні 15 м вміщається 6 або 7 лавок."}, {"en": "Place by use: benches face a view, bins sit by benches and doors, bollards stand where boats tie up.", "uk": "Розставляти за призначенням: лавки дивляться на краєвид, урни стоять біля лавок і дверей, стовпчики — там, де прив'язують човни."}, {"en": "Write the counts down before you place anything.", "uk": "Записувати кількості, перш ніж щось розставляти."}], "doalong": [{"en": "Measure the quay edge on plot_plan_d1.png against the scale bar. You should see one length in metres.", "uk": "Виміряй край причалу на plot_plan_d1.png за шкалою масштабу. Має вийти одна довжина в метрах."}, {"en": "Divide it by the bollard spacing in your photos and write the count in furniture_d1.md. You should see a whole number.", "uk": "Поділи її на крок стовпчиків на твоїх фото і запиши кількість у furniture_d1.md. Має вийти ціле число."}, {"en": "Do the same for benches (every 12 to 15 m) and lamp posts (every 15 to 20 m) along the promenade. You should see three rows in the table.", "uk": "Зроби те саме для лавок (кожні 12–15 м) і ліхтарних стовпів (кожні 15–20 м) уздовж набережної. Має вийти три рядки в таблиці."}, {"en": "Mark on the plan where people sit, wait and walk in; put bins there. You should see bins at benches, doors and corners.", "uk": "Познач на плані, де люди сидять, чекають і заходять. Постав туди урни. Має вийти: урни біля лавок, дверей і на рогах."}, {"en": "Compare your spacing with two reference photos. You should see the same rhythm as the real place.", "uk": "Порівняй свій крок із двома фото-референсами. Ритм такий самий, як у справжньому місці."}], "play": {"en": "Estimate duel: the tutor and I both guess a count (the lamps on my promenade, the bollards on my quay) before we calculate. The closer guess wins.", "uk": "Дуель оцінок: ми з тьютором обоє вгадуємо кількість (ліхтарні стовпи на моїй набережній, стовпчики на моєму причалі), перш ніж рахувати. Ближча здогадка перемагає."}, "video": {"search": "street furniture placement urban design spacing"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Рахуємо меблі за призначенням (Day 43, lesson 1 of 4). Today's build: Район 1, облаштований твоїми пропсами з 1-го тижня в комплектах Packed Level Actor, три пришвартовані копії твого власного човна і виміряна вартість.\nWhat I already know: Дні 1–5: SM_Bollard, SM_Bench, SM_LampPost і SM_Bin — пропси з 1-го тижня нарешті повертаються; День 42: будівлі, фасади крамниць і мощення району 1; День 41: budget.md і твої місця для stat unit; День 23: кількість меблів у plot_plan_d1.md; День 38: LaneGauge — твій куб-калібр 4 × 4 × 4 м; День 26 і День 29: рівень моря на Z = 0 і океан; День 12: твої інстанси M_Master (фарбований метал, дерево); День 24: Street Props Pack Vol.1, якщо його вибрано, — для прогалин.\n\nBy the end of this lesson I can:\n1. Рахувати меблі за довжиною й кроком: на набережній 90 м із лавкою кожні 15 м вміщається 6 або 7 лавок.\n2. Розставляти за призначенням: лавки дивляться на краєвид, урни стоять біля лавок і дверей, стовпчики — там, де прив'язують човни.\n3. Записувати кількості, перш ніж щось розставляти.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: У районі 1 кожна будівля й фасад крамниці стоять на уступах, вирізаних у рельєфі, з мощенням до кожних дверей. Today: Сьогодні ти облаштовуєш район 1 власними стовпчиками, лавками, ліхтарними стовпами й урнами з першого тижня як комплектами-інстансами та швартуєш три копії простого човна власної моделі. One encouraging line: Пропси з першого тижня тепер облаштовують твоє власне містечко — видно, який шлях уже пройдено.); 2 lines on why today matters and where it comes back, in plain words (from this: Меблі оживляють набережну, але можуть і загальмувати її: це сотні дрібних пропсів. Згруповані в комплекти з інстансами, вони коштують мало. А розставлені за призначенням, з 10 м виглядають справжніми. Студії наймають саме за цей шлях: від власних пропсів до справжнього місця. It comes back: Твої пропси й човни потраплять у п'ять кадрів огляду в п'ятницю, поруч із фото-референсами. PLA_BenchSet і звичка до інстансингу повернуться в День 51, коли ти облаштовуватимеш район 2.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-43-district1-street-furniture-and-boats exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (Набір із лавкою як Packed Level Actor). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Виміряй край причалу на plot_plan_d1.png за шкалою масштабу. Має вийти одна довжина в метрах.\n   2. Поділи її на крок стовпчиків на твоїх фото і запиши кількість у furniture_d1.md. Має вийти ціле число.\n   3. Зроби те саме для лавок (кожні 12–15 м) і ліхтарних стовпів (кожні 15–20 м) уздовж набережної. Має вийти три рядки в таблиці. [screenshot]\n   4. Познач на плані, де люди сидять, чекають і заходять. Постав туди урни. Має вийти: урни біля лавок, дверей і на рогах.\n   5. Порівняй свій крок із двома фото-референсами. Ритм такий самий, як у справжньому місці. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Дуель оцінок: ми з тьютором обоє вгадуємо кількість (ліхтарні стовпи на моїй набережній, стовпчики на моєму причалі), перш ніж рахувати. Ближча здогадка перемагає. Otherwise skip it.\n6. Review: ask me these questions from earlier days, one at a time, and correct me kindly: Day 40: in your Boss, how did you prove that nothing floats? | Day 36: why does a biome graph make clumps and gaps instead of an even spread?\n7. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n8. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; rubric = таблиця оцінювання; review (by tutor or art director) = огляд; credits line = рядок авторства; reference photo / hero photo = фото-референс / ключове фото; click / right-click = клацни / клацни правою кнопкою; screen

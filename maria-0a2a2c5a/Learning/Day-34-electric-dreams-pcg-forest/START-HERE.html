<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 34</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

.btn.s{background:linear-gradient(145deg,#5fe39a,#16a34a);box-shadow:0 10px 24px -8px rgba(74,222,128,.55),inset 0 1px 0 rgba(255,255,255,.35)}

/* the Done switch */
.sw{display:inline-flex;align-items:center;gap:12px;border:0;background:transparent;cursor:pointer;font:600 14px/1 var(--head);color:var(--muted);min-height:50px;padding:0 6px}
.sw .tr{position:relative;width:58px;height:32px;border-radius:999px;background:var(--well);box-shadow:var(--press);transition:background .25s}

.sw[aria-pressed=true] .tr::after{left:30px;background:#fff}
details{margin-top:22px;border-radius:20px;background:var(--well);box-shadow:var(--press);padding:0 18px}

.steps{list-style:none;padding:0;counter-reset:s;margin:4px 0 0}
.steps li{counter-increment:s;position:relative;padding:0 0 0 44px;margin:12px 0}

/* build */
.build.bossday{border-color:rgba(255,95,168,.35)}

.tiers{list-style:none;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:0}
.tiers li{margin:0;padding:16px 18px;border-radius:20px;font-size:14.5px;line-height:1.55;color:var(--muted);background:var(--card);box-shadow:var(--raiseS)}
.medal{display:flex;align-items:center;gap:10px;margin:0 0 8px;font:700 11.5px/1 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}

.m1{--mg:rgba(190,200,215,.7)}.m1 i{background:linear-gradient(135deg,#f3f6fa,#9aa5b3)}
.m2{--mg:rgba(245,195,91,.75)}.m2 i{background:linear-gradient(135deg,#ffe08a,#c99412)}
.ccount{display:flex;align-items:center;gap:16px;margin:28px 0 10px}

.check{list-style:none;padding:0;margin:0}
.check li{margin:0}
.check label{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:start;padding:14px 4px;cursor:pointer;border-bottom:1px solid var(--line)}
.check li:last-child label{border-bottom:0}
.check input{appearance:none;-webkit-appearance:none;width:26px;height:26px;margin:1px 0 0;border-radius:9px;background:var(--well);box-shadow:var(--press);display:grid;place-items:center;cursor:pointer;transition:background .2s,box-shadow .2s}
.check input::after{content:"";width:10px;height:5px;border:solid #fff;border-width:0 0 2.2px 2.2px;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.check input:checked{background:linear-gradient(145deg,#5fe39a,#16a34a);box-shadow:0 0 12px rgba(74,222,128,.55)}
.check input:checked::after{opacity:1}
.check li.on .tx{color:var(--faint)}
.check .ln{font:600 10.5px/1.3 var(--head);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);white-space:nowrap;margin-top:5px;padding:4px 9px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
/* quiz */
.pips{display:flex;gap:8px;margin:0 0 4px;padding:10px 14px;border-radius:999px;width:max-content;max-width:100%;flex-wrap:wrap}

.opt{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;width:calc(100% - 50px);margin:12px 0 12px 50px;text-align:left;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid transparent;border-radius:18px;padding:11px 16px;cursor:pointer;box-shadow:var(--raiseS);transition:box-shadow .2s,transform .15s}

.opt:hover:not([disabled]){transform:translateY(-1px);color:var(--accT)}
.opt.right{box-shadow:var(--press);background:var(--okBg);border-color:rgba(74,222,128,.45)}.opt.right .lt{background:var(--okL);color:#fff;box-shadow:0 0 10px var(--okL)}.opt.right .mk{color:var(--ok)}
.opt.wrong{box-shadow:var(--press);background:var(--badBg);border-color:rgba(255,93,93,.45)}.opt.wrong .lt{background:var(--badL);color:#fff;box-shadow:0 0 10px var(--badL)}.opt.wrong .mk{color:var(--bad)}

.opt[disabled]:not(.right):not(.wrong){opacity:.55;box-shadow:none}
.exp{margin:10px 0 0 50px;font-size:15.5px;color:var(--muted)}

.score{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:32px;padding:18px 20px;border-radius:24px}

.clip{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}

.nav a.nx{justify-content:flex-end;text-align:right;grid-column:2}
#toast{position:fixed;left:50%;bottom:28px;z-index:9;transform:translateX(-50%) translateY(16px);background:rgba(30,33,46,.82);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:#f4f5fa;border:1px solid rgba(255,255,255,.14);padding:13px 24px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none;font:600 14px/1.4 var(--head);max-width:min(92vw,560px);text-align:center;box-shadow:0 20px 40px -14px rgba(0,0,0,.5),0 0 24px var(--glow)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

 body{font-size:16.5px}

uk": "Тренування: /Game/Course/Day34 в IslandCourse. Розбір: рівень-розбір ElectricDreams_PCGForest в ElectricDreamsSample. Збірка: тестова ділянка 100 x 100 м в одній із долин твого острова, поза обома районами й далеко від доріг."}, "spec": [{"en": "Before today: if you have never opened ElectricDreamsSample (your Electric Dreams project), open it once (for example the evening before) and let the shaders compile; it can take an hour; don't close the editor.", "uk": "Ще до сьогодні: якщо ElectricDreamsSample (твій проєкт Electric Dreams) ще жодного разу не відкривався, відкрий його один раз (наприклад, напередодні ввечері) і дай шейдерам скомпілюватися; це може тривати годину; не закривай редактор."}, {"en": "PCG_FirstScatter in /Game/Course/Day34: Get Landscape Data > Surface Sampler > Static Mesh Spawner on a small practice landscape, with its points seen in debug and the Density column read.", "uk": "PCG_FirstScatter у /Game/Course/Day34: Get Landscape Data > Surface Sampler > Static Mesh Spawner на маленькому тренувальному ландшафті, з точками, показаними в debug, і прочитаним стовпцем Density."}, {"en": "In ElectricDreamsSample, Engine Scalability is at High and only the small breakdown level ElectricDreams_PCGForest is opened (Content > Levels > PCG > Breakdown_Levels, which holds the four small levels). Never open ElectricDreams_Env or ElectricDreams_PCG, the full 4 km maps built for 32 to 64 GB of memory. Memory stays under about 14 GB in Task Manager.", "uk": "В ElectricDreamsSample Engine Scalability стоїть на High, і відкрито лише маленький рівень-розбір ElectricDreams_PCGForest (Content > Levels > PCG > Breakdown_Levels, де лежать чотири маленькі рівні). Ніколи не відкривай ElectricDreams_Env чи ElectricDreams_PCG — повні мапи 4 км, розраховані на 32–64 ГБ пам'яті. Пам'ять у Task Manager лишається нижче приблизно 14 ГБ."}, {"en": "pcg_study.md: the forest graph's chain in plain words, one line per step, each marked 'where', 'which survive' or 'what'.", "uk": "pcg_study.md: ланцюжок графа лісу простими словами, по рядку на крок, кожен позначений «де», «що виживає» або «що»."}, {"en": "PCGDemo_ForestBP migrated into IslandCourse with everything it uses, plus a short list for next week (4 to 6 plants and 2 to 4 rocks); every asset listed in migrated.md, with the PCG plugin the Electric Dreams project uses (Procedural Content Generation Framework) on in IslandCourse.", "uk": "PCGDemo_ForestBP, перенесений в IslandCourse з усім, що він використовує, плюс короткий список на наступний тиждень (4–6 рослин і 2–4 камені); кожен асет перелічений у migrated.md, а плагін PCG, який використовує проєкт Electric Dreams (Procedural Content Generation Framework), увімкнений в IslandCourse."}, {"en": "The forest on a 100 x 100 m test patch of L_Island, generated, one setting changed with a before/after pair, on DL_Forest; Electric Dreams added to credits.md.", "uk": "Ліс на тестовій ділянці 100 x 100 м у L_Island, згенерований, з одним зміненим налаштуванням і парою до/після, на DL_Forest; Electric Dreams додано в credits.md."}, {"en": "Only one project open at a time.", "uk": "Одночасно відкритий лише один проєкт."}], "piece1": "your first PCG graph and the forest study", "piece2": {"en": "The migration and the forest on your test patch, on your own", "uk": "Перенесення й ліс на тестовій ділянці, самостійно"}, "steps": [{"text": {"en": "Check the PCG plugin in IslandCourse: Edit > Plugins, search PCG. Check: Procedural Content Generation Framework (PCG) is ticked (it is on by default in 5.8; if not, tick it and restart).", "uk": "Перевір плагін PCG в IslandCourse: Edit > Plugins, пошук PCG. Перевірка: Procedural Content Generation Framework (PCG) увімкнений (у 5.8 він увімкнений за замовчуванням; якщо ні, увімкни його й перезапусти)."}, "lesson": 1}, {"text": {"en": "Make L_Day34_PCG with a small landscape and one hill; build PCG_FirstScatter and Generate it in a PCG Volume. Check: cubes sit on the hill inside the volume.", "uk": "Створи L_Day34_PCG з маленьким ландшафтом і одним пагорбом; збудуй PCG_FirstScatter і запусти Generate у PCG Volume. Перевірка: куби стоять на пагорбі всередині volume."}, "lesson": 1}, {"text": {"en": "Debug and inspect the Surface Sampler: D shows its points, A lists them. If the list is empty, click Generate again with the graph open. Check: pcg_first.png shows the points and a Density column.", "uk": "Увімкни debug та inspect для Surface Sampler: D показує його точки, A виводить їх списком. Якщо список порожній, знову клікни Generate з відкритим графом. Перевірка: pcg_first.png показує точки й стовпець Density."}, "lesson": 1}, {"text": {"en": "Save and close IslandCourse. Open ElectricDreamsSample with Engine Scalability at High and open only ElectricDreams_PCGForest. Check: Task Manager shows memory under about 14 GB.", "uk": "Збережи й закрий IslandCourse. Відкрий ElectricDreamsSample з Engine Scalability на High і відкрий лише ElectricDreams_PCGForest. Перевірка: Task Manager показує пам'ять нижче приблизно 14 ГБ."}, "lesson": 2}, {"text": {"en": "Open the forest actor's graph and follow it from left to right; write the chain in pcg_study.md. Check: at least six lines, each marked 'where', 'which survive' or 'what'.", "uk": "Відкрий граф актора лісу й пройди по ньому зліва направо; запиши ланцюжок у pcg_study.md. Перевірка: щонайменше шість рядків, кожен позначений «де», «що виживає» або «що»."}, "lesson": 2}, {"text": {"en": "Change Trees Density on the forest actor, Generate, look, then set it back; don't save the sample's level. Check: you saw the forest thin out and fill in again.", "uk": "Зміни Trees Density на акторі лісу, запусти Generate, подивися, потім поверни значення назад; не зберігай рівень зразка. Перевірка: видно, як ліс рідшає й знову густішає."}, "lesson": 2}, {"text": {"en": "Write the Electric Dreams project's PCG plugins at the top of migrated.md (you should find one: Procedural Content Generation Framework), then migrate PCGDemo_ForestBP to IslandCourse's Content folder. Check: Unreal reports that the migration finished.", "uk": "Запиши плагіни PCG проєкту Electric Dreams угорі migrated.md (має знайтися один: Procedural Content Generation Framework), потім перенеси PCGDemo_ForestBP у теку Content проєкту IslandCourse. Перевірка: Unreal повідомляє, що перенесення завершено."}, "lesson": 3}, {"text": {"en": "Migrate your short list of 4 to 6 plants and 2 to 4 rocks the same way and add each to migrated.md. Check: migrated.md lists every asset and the folder it came from.", "uk": "Так само перенеси свій короткий список із 4–6 рослин і 2–4 каменів і додай кожен у migrated.md. Перевірка: migrated.md перелічує кожен асет і теку, з якої він прийшов."}, "lesson": 3}, {"text": {"en": "Close ElectricDreamsSample; open IslandCourse and check the same PCG plugins are ticked (restart if you had to tick one). Check: the migrated folders show in the Content Browser, with no missing-plugin message.", "uk": "Закрий ElectricDreamsSample; відкрий IslandCourse і перевір, що ті самі плагіни PCG увімкнені (перезапусти, якщо довелося якийсь увімкнути). Перевірка: перенесені теки видно в Content Browser, без повідомлення про відсутній плагін."}, "lesson": 3}, {"text": {"en": "In L_Island load only your test valley; bookmark a 60 m view and take your 'before' shot; place PCGDemo_ForestBP, size it to 100 x 100 m and Generate. Check: trees stand on your terrain inside the patch.", "uk": "У L_Island завантаж лише свою тестову долину; збережи закладку виду з 60 м і зроби знімок «до»; постав PCGDemo_ForestBP, задай розмір 100 x 100 м і запусти Generate. Перевірка: дерева стоять на твоєму рельєфі всередині ділянки."}, "lesson": 4}, {"text": {"en": "From your bookmark, change Trees Density once and save the pair as forest_pair.png. Check: the pair shows a clear difference from the same view.", "uk": "Зі своєї закладки один раз зміни Trees Density і збережи пару як forest_pair.png. Перевірка: пара показує чітку різницю з того самого виду."}, "lesson": 4}, {"text": {"en": "Put the forest on DL_Forest and add Electric Dreams to credits.md. Check: hiding DL_Forest hides the forest; credits.md names Electric Dreams Env, Epic Games and Fab.", "uk": "Постав ліс на DL_Forest і додай Electric Dreams у credits.md. Перевірка: якщо сховати DL_Forest, ліс зникає; credits.md називає Electric Dreams Env, Epic Games і Fab."}, "lesson": 4}, {"text": {"en": "Before/after capture: the bare patch and the forested patch from the same bookmark; then a 60-second clip over the patch in Play. Check: before_after_day34.png and flythrough_day34.mp4 are saved.", "uk": "Знімок до/після: гола ділянка й ділянка з лісом з тієї самої закладки; потім 60-секундне відео над ділянкою в Play. Перевірка: before_after_day34.png і flythrough_day34.mp4 збережені."}, "lesson": "D33.2"}], "assets": ["island12/credits-template.md", "island12/free-packs-list.md"]}, "lessons": [{"title": {"en": "PCG from zero: points, nodes and graphs", "uk": "PCG з нуля: точки, вузли й графи"}, "minutes": 40, "goals": [{"en": "Explain PCG (Procedural Content Generation): Unreal places things for you by rules, so one change can re-dress a whole valley.", "uk": "Пояснити PCG (Procedural Content Generation): Unreal розставляє речі за тебе за правилами, тож одна зміна може заново наповнити цілу долину."}, {"en": "Explain a graph, its nodes and its points: a graph is a chain of boxes (nodes) joined by wires; points flow from left to right, and each node changes, removes or uses them. A point is a spot with a position, a rotation, a size and a Density between 0 and 1.", "uk": "Пояснити граф, його вузли й точки: граф — це ланцюжок блоків (вузлів), з'єднаних дротами; точки течуть зліва направо, і кожен вузол змінює, прибирає або використовує їх. Точка — це місце з позицією, поворотом, розміром і Density від 0 до 1."}, {"en": "Build a first graph that samples points on a landscape and spawns a mesh on each, and look at the points with debug.", "uk": "Збудувати перший граф, який розкидає точки по ландшафту й ставить меш на кожну, і подивитися на точки через debug."}], "doalong": [{"en": "Open Edit > Plugins and search PCG. You see Procedural Content Generation Framework (PCG) ticked: it is on by default in Unreal 5.8. If it is not, tick it and restart the editor.", "uk": "Відкрий Edit > Plugins і знайди PCG. Ти бачиш, що Procedural Content Generation Framework (PCG) увімкнений: в Unreal 5.8 він увімкнений за замовчуванням. Якщо ні, увімкни його й перезапусти редактор."}, {"en": "Choose File > New Level > Basic and save it as /Game/Course/Day34/L_Day34_PCG. Press Shift+2 for Landscape mode, click Manage > New, keep the default settings and click Create; raise one hill with the Sculpt tool (as on Day 27). You see a flat landscape with a hill.", "uk": "Вибери File > New Level > Basic і збережи як /Game/Course/Day34/L_Day34_PCG. Натисни Shift+2 для Landscape mode, клікни Manage > New, залиш налаштування за замовчуванням і клікни Create; підніми один пагорб інструментом Sculpt (як у День 27). Ти бачиш рівний ландшафт із пагорбом."}, {"en": "In /Game/Course/Day34 right-click > PCG > PCG Graph. If a window called Create Graph From Template opens, click Create empty graph. Name it PCG_FirstScatter and double-click it. You see the graph editor with an Input node on the left and an Output node on the right.", "uk": "У /Game/Course/Day34 клікни правою кнопкою > PCG > PCG Graph. Якщо відкриється вікно Create Graph From Template, клікни Create empty graph. Назви його PCG_FirstScatter і двічі клікни. Ти бачиш редактор графа з вузлом Input ліворуч і вузлом Output праворуч."}, {"en": "Right-click in the empty graph, type Get Landscape Data and press Enter. You see a new node with one pin on its right side: its output. This node hands the graph your landscape's surface.", "uk": "Клікни правою кнопкою в порожньому графі, введи Get Landscape Data і натисни Enter. Ти бачиш новий вузол з одним піном справа: це його вихід. Цей вузол передає графу поверхню твого ландшафту."}, {"en": "Right-click again and add a Surface Sampler. Drag from Get Landscape Data's right-hand pin to the Surface Sampler's Surface pin on its left. You see a wire join them: the sampler will scatter points over that surface.", "uk": "Знову клікни правою кнопкою й додай Surface Sampler. Потягни від правого піна Get Landscape Data до піна Surface зліва на Surface Sampler. Ти бачиш, як їх з'єднує дріт: семплер розкидатиме точки по цій поверхні."}, {"en": "Add a Static Mesh Spawner; wire the Surface Sampler's right-hand pin into it, and its right-hand pin into the Output node. In its Details find Mesh Entries, click +, open the new entry and set Descriptor > Static Mesh to SM_Cube from /Game/LevelPrototyping. You see four nodes in a chain from left to right.", "uk": "Додай Static Mesh Spawner; з'єднай правий пін Surface Sampler з ним, а його правий пін — з вузлом Output. У його Details знайди Mesh Entries, клікни +, розгорни новий запис і встанови Descriptor > Static Mesh на SM_Cube з /Game/LevelPrototyping. Ти бачиш чотири вузли в ланцюжку зліва направо."}, {"en": "In Place Actors search PCG Volume and drag one over the hill. It starts as a small box (about 2 m), so set its Scale to 25, 25, 10 (about 50 x 50 m and 20 m tall) and move it so the hill sits inside. In Details set its Graph to PCG_FirstScatter and click Generate. You see cubes standing on the hill, only inside the volume.", "uk": "У Place Actors знайди PCG Volume і перетягни його на пагорб. Спершу це маленька коробка (близько 2 м), тож встанови Scale 25, 25, 10 (приблизно 50 x 50 м і 20 м заввишки) і пересунь так, щоб пагорб був усередині. У Details встанови Graph на PCG_FirstScatter і клікни Generate. Ти бачиш куби на пагорбі, лише всередині volume."}, {"en": "In the graph click the Surface Sampler and press D (debug), then A (inspect). You see the points as small boxes in the level, and a list of points with a Density column in the graph editor. If the list stays empty, click Generate again while the graph is open.", "uk": "У графі клікни Surface Sampler і натисни D (debug), потім A (inspect). Ти бачиш точки як маленькі коробки в рівні, а в редакторі графа — список точок зі стовпцем Density. Якщо список лишається порожнім, знову клікни Generate, поки граф відкритий."}], "play": {"en": "Pipe it: the tutor describes a chain of three nodes in words; I say what I'll see in the level after Generate, then try it.", "uk": "Збери ланцюжок: тьютор описує словами ланцюжок із трьох вузлів; я кажу, що побачу в рівні після Generate, а потім пробую."}, "video": {"url": "https://www.youtube.com/watch?v=NZLtrWLNTes", "title": "Introduction to Procedural Content Generation (PCG) - Episode 1", "channel": "Ben Cloward", "length": "20:48", "search": "introduction to pcg unreal engine"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: PCG from zero: points, nodes and graphs (Day 34, lesson 1 of 4).\nToday's build: Your first PCG graph in a practice level, a written study of Electric Dreams' forest graph from its small breakdown level, and its forest (PCGDemo_ForestBP) migrated into IslandCourse and growing on a 100 x 100 m test patch.\n\nBy the end of this lesson I can:\n1. Explain PCG (Procedural Content Generation): Unreal places things for you by rules, so one change can re-dress a whole valley.\n2. Explain a graph, its nodes and its points: a graph is a chain of boxes (nodes) joined by wires; points flow from left to right, and each node changes, removes or uses them. A point is a spot with a position, a rotation, a size and a Density between 0 and 1.\n3. Build a first graph that samples points on a landscape and spawns a mesh on each, and look at the points with debug.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (Your island runs as a real open world, with World Partition, Data Layers and HLODs in place.), what I will learn today (You make your first PCG graph, read how the Electric Dreams forest decides where trees grow, and migrate that forest onto a test patch of your island.), encourage me (PCG is new ground for many professionals too, so explore it with curiosity; your test patch only has to grow, not to be perfect.), and share today's quote: \"What I cannot create, I do not understand.\" (Richard Feynman).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 31: what does Half-Width 300 on a landscape spline control point give you? | Day 27: which valley on your island will be forest, and why there?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Pipe it: the tutor describes a chain of three nodes in words; I say what I'll see in the level after Generate, then try it.\n6. Do-along on today's build (your first PCG graph and the forest study): guide me through these steps one at a time, checking a screenshot after each:\n   - Open Edit > Plugins and search PCG. You see Procedural Content Generation Framework (PCG) ticked: it is on by default in Unreal 5.8. If it is not, tick it and restart the editor.\n   - Choose File > New Level > Basic and save it as /Game/Course/Day34/L_Day34_PCG. Press Shift+2 for Landscape mode, click Manage > New, keep the default settings and click Create; raise one hill with the Sculpt tool (as on Day 27). You see a flat landscape with a hill.\n   - In /Game/Course/Day34 right-click > PCG > PCG Graph. If a window called Create Graph From Template opens, click Create empty graph. Name it PCG_FirstScatter and double-click it. You see the graph editor with an Input node on the left and an Output node on the right.\n   - Right-click in the empty graph, type Get Landscape Data and press Enter. You see a new node with one pin on its right side: its output. This node hands the graph your landscape's surface.\n   - Right-click again and add a Surface Sampler. Drag from Get Landscape Data's right-hand pin to the Surface Sampler's Surface pin on its left. You see a wire join them: the sampler will scatter points over that surface.\n   - Add a Static Mesh Spawner; wire the Surface Sampler's right-hand pin into it, and its right-hand pin into the Output node. In its Details find Mesh Entries, click +, open the new entry and set Descriptor > Static Mesh to SM_Cube from /Game/LevelPrototyping. You see four nodes in a chain from left to right.\n   - In Place Actors search PCG Volume and drag one over the hill. It starts as a small box (about 2 m), so set its Scale to 25, 25, 10 (about 50 x 50 m and 20 m tall) and move it so the hill sits inside. In Details set its Graph to PCG_FirstScatter and click Generate. You see cubes standing on the hill, only inside the volume.\n   - In the graph click the Surface Sampler and press D (debug), then A (inspect). You see the points as small boxes in the level, and a list of points with a Density column in the graph editor. If the list stays empty, click Generate again while the graph is open.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Introduction to Procedural Content Generation (PCG) - Episode 1\" by Ben Cloward: https://www.youtube.com/watch?v=NZLtrWLNTes\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Reading Electric Dreams' forest graph", "uk": "Читаємо граф лісу Electric Dreams"}, "minutes": 40, "goals": [{"en": "Open the Electric Dreams project safely on a 16 GB PC: Engine Scalability at High, and only the small breakdown levels (small levels that each show one part of the sample).", "uk": "Безпечно відкрити проєкт Electric Dreams на ПК з 16 ГБ: Engine Scalability на High і лише маленькі рівні-розбори (невеликі рівні, кожен з яких показує одну частину зразка)."}, {"en": "Read a real graph left to right as three kinds of decision: where points may go (samplers), which survive (filters), and what they become (spawners).", "uk": "Читати справжній граф зліва направо як три види рішень: куди можуть потрапити точки (семплери), які з них виживають (фільтри) і чим вони стають (спавнери)."}, {"en": "Find the parts of PCGDemo_Forest for trees, hero trees (big feature trees), clearings and clutter (small plants and debris near the trees).", "uk": "Знайти в PCGDemo_Forest частини для дерев, hero trees (великих дерев-акцентів), галявин і clutter (дрібних рослин і уламків біля дерев)."}], "doalong": [{"en": "Save and close IslandCourse. Open ElectricDreamsSample, your Electric Dreams project from Day 24; if the shaders still compile, let them finish. Choose Settings > Engine Scalability Settings > High, as on Day 26. You see the editor ready.", "uk": "Збережи й закрий IslandCourse. Відкрий ElectricDreamsSample, свій проєкт Electric Dreams з Дня 24; якщо шейдери ще компілюються, дай їм завершитися. Вибери Settings > Engine Scalability Settings > High, як у День 26. Ти бачиш, що редактор готовий."}, {"en": "Open Content > Levels > PCG > Breakdown_Levels > ElectricDreams_PCGForest. Open only the four levels in Breakdown_Levels. Never open ElectricDreams_Env or ElectricDreams_PCG: they are the full 4 km maps, built for 32 to 64 GB of memory. You see a small forest scene, and Task Manager shows memory under about 14 GB.", "uk": "Відкрий Content > Levels > PCG > Breakdown_Levels > ElectricDreams_PCGForest. Відкривай лише чотири рівні з Breakdown_Levels. Ніколи не відкривай ElectricDreams_Env чи ElectricDreams_PCG: це повні мапи 4 км, розраховані на 32–64 ГБ пам'яті. Ти бачиш маленьку лісову сцену, а Task Manager показує пам'ять нижче приблизно 14 ГБ."}, {"en": "Select the forest actor; in Details find its PCG component and its graph, and open PCGDemo_Forest (Content > PCG > Graphs > Forest). You see a large graph in coloured groups.", "uk": "Виділи актора лісу; у Details знайди його PCG-компонент і граф і відкрий PCGDemo_Forest (Content > PCG > Graphs > Forest). Ти бачиш великий граф, поділений на кольорові групи."}, {"en": "Click a Surface Sampler and read Points Per Squared Meter; click a filter node and read what it keeps; select one node and press D. You see that node's points appear in the level.", "uk": "Клікни Surface Sampler і прочитай Points Per Squared Meter; клікни вузол-фільтр і прочитай, що він залишає; виділи один вузол і натисни D. Ти бачиш, як точки цього вузла з'являються в рівні."}, {"en": "Write the chain in pcg_study.md, one line per step, each marked 'where', 'which survive' or 'what'. You see at least six lines.", "uk": "Запиши ланцюжок у pcg_study.md, по рядку на крок, кожен позначений «де», «що виживає» або «що». Ти бачиш щонайменше шість рядків."}], "play": {"en": "Graph detective: the tutor describes what one node does ('keeps only points on gentle ground', 'turns points into trees'); I find it in the graph and give its name; five finds win.", "uk": "Детектив графа: тьютор описує, що робить один вузол («залишає лише точки на пологому ґрунті», «перетворює точки на дерева»); я знаходжу його в графі й називаю; п'ять знахідок — перемога."}, "video": {"url": "https://www.youtube.com/watch?v=fFLHiGiF3ZM", "title": "Exploring The Electric Dreams Sample | Unreal Engine 5.2 Procedural Content Generation Tech Demo", "channel": "Matt Aspland", "length": "12:47", "search": "electric dreams sample unreal engine explore"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Reading Electric Dreams' forest graph (Day 34, lesson 2 of 4).\nToday's build: Your first PCG graph in a practice level, a written study of Electric Dreams' forest graph from its small breakdown level, and its forest (PCGDemo_ForestBP) migrated into IslandCourse and growing on a 100 x 100 m test patch.\n\nBy the end of this lesson I can:\n1. Open the Electric Dreams project safely on a 16 GB PC: Engine Scalability at High, and only the small breakdown levels (small levels that each show one part of the sample).\n2. Read a real graph left to right as three kinds of decision: where points may go (samplers), which survive (filters), and what they become (spawners).\n3. Find the parts of PCGDemo_Forest for trees, hero trees (big feature trees), clearings and clutter (small plants and debris near the trees).\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Graph detective: the tutor describes what one node does ('keeps only points on gentle ground', 'turns points into trees'); I find it in the graph and give its name; five finds win.\n4. Do-along on today's build (your first PCG graph and the forest study): guide me through these steps one at a time, checking a screenshot after each:\n   - Save and close IslandCourse. Open ElectricDreamsSample, your Electric Dreams project from Day 24; if the shaders still compile, let them finish. Choose Settings > Engine Scalability Settings > High, as on Day 26. You see the editor ready.\n   - Open Content > Levels > PCG > Breakdown_Levels > ElectricDreams_PCGForest. Open only the four levels in Breakdown_Levels. Never open ElectricDreams_Env or ElectricDreams_PCG: they are the full 4 km maps, built for 32 to 64 GB of memory. You see a small forest scene, and Task Manager shows memory under about 14 GB.\n   - Select the forest actor; in Details find its PCG component and its graph, and open PCGDemo_Forest (Content > PCG > Graphs > Forest). You see a large graph in coloured groups.\n   - Click a Surface Sampler and read Points Per Squared Meter; click a filter node and read what it keeps; select one node and press D. You see that node's points appear in the level.\n   - Write the chain in pcg_study.md, one line per step, each marked 'where', 'which survive' or 'what'. You see at least six lines.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Exploring The Electric Dreams Sample | Unreal Engine 5.2 Procedural Content Generation Tech Demo\" by Matt Aspland: https://www.youtube.com/watch?v=fFLHiGiF3ZM\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Migrate: moving assets between projects", "uk": "Migrate: переносимо асети між проєктами"}, "minutes": 40, "goals": [{"en": "Explain Migrate: it copies an asset and everything it uses (its dependencies: meshes, materials, textures, graphs) into another project's Content folder.", "uk": "Пояснити Migrate: він копіює асет і все, що той використовує (його залежності: меші, матеріали, текстури, графи), у теку Content іншого проєкту."}, {"en": "Match the plugins first: the target project needs the same PCG plugins turned on, or the copied graph cannot run.", "uk": "Спершу узгодити плагіни: у цільовому проєкті мають бути увімкнені ті самі плагіни PCG, інакше скопійований граф не запуститься."}, {"en": "Keep the copy small: migrate only what you will use, and list it.", "uk": "Тримати копію маленькою: переносити лише те, що використовуватимеш, і складати список."}], "doalong": [{"en": "In ElectricDreamsSample open Edit > Plugins and search PCG. You see Procedural Content Generation Framework (PCG) ticked; if any other PCG plugin is ticked, note it too. Write their names at the top of migrated.md.", "uk": "В ElectricDreamsSample відкрий Edit > Plugins і знайди PCG. Ти бачиш, що Procedural Content Generation Framework (PCG) увімкнений; якщо увімкнений ще якийсь плагін PCG, запиши й його. Запиши їхні назви вгорі migrated.md."}, {"en": "In the Content Browser go to Content > PCG > Graphs > Forest, right-click PCGDemo_ForestBP > Asset Actions > Migrate. You see a window listing every asset it uses, all ticked.", "uk": "У Content Browser перейди в Content > PCG > Graphs > Forest, клікни правою кнопкою PCGDemo_ForestBP > Asset Actions > Migrate. Ти бачиш вікно зі списком усіх асетів, які він використовує, усі позначені."}, {"en": "Click OK and choose the Content folder inside your IslandCourse project folder. You see a message that the migration finished.", "uk": "Клікни OK і вибери теку Content усередині теки проєкту IslandCourse. Ти бачиш повідомлення, що перенесення завершено."}, {"en": "Choose 4 to 6 plants from Content > Megascans > 3D_Plants (for example FanPalm, DragonTree, CastorOilPlant, KikuyuGrass, Fern, or a tree such as EuropeanHornbeam) and 2 to 4 rocks from Content > Megascans > 3D_Assets (for example NordicBeachRocks, MossyForestBoulder, and SmallStonesPack for pebbles) for next week; select them, right-click > Asset Actions > Migrate to the same folder. You see a second finished message; add each name to migrated.md.", "uk": "Вибери 4–6 рослин з Content > Megascans > 3D_Plants (наприклад, FanPalm, DragonTree, CastorOilPlant, KikuyuGrass, Fern або дерево на кшталт EuropeanHornbeam) і 2–4 камені з Content > Megascans > 3D_Assets (наприклад, NordicBeachRocks, MossyForestBoulder і SmallStonesPack для гальки) на наступний тиждень; виділи їх, клікни правою кнопкою > Asset Actions > Migrate у ту саму теку. Ти бачиш друге повідомлення про завершення; додай кожну назву в migrated.md."}, {"en": "Close ElectricDreamsSample. Open IslandCourse and check the same PCG plugins are ticked in Edit > Plugins (restart if you had to tick one). You see the new folders (for example PCG and Megascans) in the Content Browser.", "uk": "Закрий ElectricDreamsSample. Відкрий IslandCourse і перевір, що ті самі плагіни PCG увімкнені в Edit > Plugins (перезапусти, якщо довелося якийсь увімкнути). Ти бачиш нові теки (наприклад, PCG і Megascans) у Content Browser."}], "play": {"en": "Packing list: the tutor names five assets a studio wants copied to another project; for each I say what Migrate will also bring along, and what could break.", "uk": "Список пакування: тьютор називає п'ять асетів, які студія хоче скопіювати в інший проєкт; для кожного я кажу, що Migrate прихопить разом із ним і що може зламатися."}, "video": {"url": "https://www.youtube.com/watch?v=s4i_3J4yiHw", "title": "Seamlessly Transfer Your Assets Between Unreal Engine Projects With Migration: A Step-by-step Guide", "channel": "Digital Alchemy", "length": "7:19", "search": "unreal engine migrate assets between projects"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Migrate: moving assets between projects (Day 34, lesson 3 of 4).\nToday's build: Your first PCG graph in a practice level, a written study of Electric Dreams' forest graph from its small breakdown level, and its forest (PCGDemo_ForestBP) migrated into IslandCourse and growing on a 100 x 100 m test patch.\n\nBy the end of this lesson I can:\n1. Explain Migrate: it copies an asset and everything it uses (its dependencies: meshes, materials, textures, graphs) into another project's Content folder.\n2. Match the plugins first: the target project needs the same PCG plugins turned on, or the copied graph cannot run.\n3. Keep the copy small: migrate only what you will use, and list it.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Packing list: the tutor names five assets a studio wants copied to another project; for each I say what Migrate will also bring along, and what could break.\n4. Do-along on today's build (your first PCG graph and the forest study): guide me through these steps one at a time, checking a screenshot after each:\n   - In ElectricDreamsSample open Edit > Plugins and search PCG. You see Procedural Content Generation Framework (PCG) ticked; if any other PCG plugin is ticked, note it too. Write their names at the top of migrated.md.\n   - In the Content Browser go to Content > PCG > Graphs > Forest, right-click PCGDemo_ForestBP > Asset Actions > Migrate. You see a window listing every asset it uses, all ticked.\n   - Click OK and choose the Content folder inside your IslandCourse project folder. You see a message that the migration finished.\n   - Choose 4 to 6 plants from Content > Megascans > 3D_Plants (for example FanPalm, DragonTree, CastorOilPlant, KikuyuGrass, Fern, or a tree such as EuropeanHornbeam) and 2 to 4 rocks from Content > Megascans > 3D_Assets (for example NordicBeachRocks, MossyForestBoulder, and SmallStonesPack for pebbles) for next week; select them, right-click > Asset Actions > Migrate to the same folder. You see a second finished message; add each name to migrated.md.\n   - Close ElectricDreamsSample. Open IslandCourse and check the same PCG plugins are ticked in Edit > Plugins (restart if you had to tick one). You see the new folders (for example PCG and Megascans) in the Content Browser.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my

 одне число за раз і оцінювати результат з 60 м, зберігаючи пару до/після."}], "doalong": [{"en": "Open L_Island; in the World Partition editor load only the region round your test valley. You see that valley and little else.", "uk": "Відкрий L_Island; у редакторі World Partition завантаж лише ділянку довкола тестової долини. Ти бачиш цю долину й майже нічого більше."}, {"en": "Fly to 60 m above the valley, press Ctrl+4 to bookmark the view and take a screenshot (Win+Shift+S) as your 'before'. You see the bare valley saved.", "uk": "Підлети на 60 м над долиною, натисни Ctrl+4, щоб зберегти закладку виду, і зроби скріншот (Win+Shift+S) як «до». Ти бачиш, що гола долина збережена."}, {"en": "Drag PCGDemo_ForestBP from the migrated Forest folder into the valley; scale its box to about 100 x 100 m. You see the forest's box sitting on your terrain.", "uk": "Перетягни PCGDemo_ForestBP з перенесеної теки Forest у долину; масштабуй його коробку приблизно до 100 x 100 м. Ти бачиш коробку лісу на своєму рельєфі."}, {"en": "Click Generate on its PCG component and wait; fly to 60 m. You see trees standing on your landscape; if nothing appears, check that the box overlaps the ground and Generate again.", "uk": "Клікни Generate на його PCG-компоненті й зачекай; підлети на 60 м. Ти бачиш дерева на своєму ландшафті; якщо нічого не з'явилося, перевір, що коробка перетинає ґрунт, і знову запусти Generate."}, {"en": "Press 4 to return to your bookmark and take a screenshot; lower Trees Density by a third, Generate and take another. You see a thinner forest; put the two side by side as forest_pair.png.", "uk": "Натисни 4, щоб повернутися до закладки, і зроби скріншот; зменш Trees Density на третину, запусти Generate і зроби ще один. Ти бачиш рідший ліс; постав два знімки поруч як forest_pair.png."}, {"en": "Put the forest on DL_Forest and add Electric Dreams to credits.md (Electric Dreams Env, Epic Games, from Fab). You see the forest hide and show with DL_Forest's eye.", "uk": "Постав ліс на DL_Forest і додай Electric Dreams у credits.md (Electric Dreams Env, Epic Games, з Fab). Ти бачиш, як ліс ховається й з'являється оком DL_Forest."}], "play": {"en": "Number guess: before each Generate I predict what the change will do; the tutor scores my prediction against my description of the result.", "uk": "Вгадай число: перед кожним Generate я передбачаю, що зробить зміна; тьютор оцінює мій прогноз за моїм описом результату."}, "video": {"url": "https://www.youtube.com/watch?v=HlGEZ5DZbVI", "title": "Unreal Engine 5.2 PCG Tutorial - Electric Dreams Demo", "channel": "Smart Poly", "length": "17:52", "search": "unreal engine pcg electric dreams tutorial"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: The forest on your island: place, size and retune (Day 34, lesson 4 of 4).\nToday's build: Your first PCG graph in a practice level, a written study of Electric Dreams' forest graph from its small breakdown level, and its forest (PCGDemo_ForestBP) migrated into IslandCourse and growing on a 100 x 100 m test patch.\n\nBy the end of this lesson I can:\n1. Place PCGDemo_ForestBP (a ready-made forest actor with its own settings) over a test patch of L_Island and generate it on your terrain.\n2. Retune it from Details only: Trees Density and Spacing, Hero Trees, Clearings Spacing, Clutter Density and the Seed (a number that reshuffles every random choice); the exact names may differ a little, so look for them in the forest actor's Details.\n3. Change one number at a time and judge it from 60 m, keeping a before/after pair.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Number guess: before each Generate I predict what the change will do; the tutor scores my prediction against my description of the result.\n4. Do-along on today's build (your first PCG graph and the forest study): guide me through these steps one at a time, checking a screenshot after each:\n   - Open L_Island; in the World Partition editor load only the region round your test valley. You see that valley and little else.\n   - Fly to 60 m above the valley, press Ctrl+4 to bookmark the view and take a screenshot (Win+Shift+S) as your 'before'. You see the bare valley saved.\n   - Drag PCGDemo_ForestBP from the migrated Forest folder into the valley; scale its box to about 100 x 100 m. You see the forest's box sitting on your terrain.\n   - Click Generate on its PCG component and wait; fly to 60 m. You see trees standing on your landscape; if nothing appears, check that the box overlaps the ground and Generate again.\n   - Press 4 to return to your bookmark and take a screenshot; lower Trees Density by a third, Generate and take another. You see a thinner forest; put the two side by side as forest_pair.png.\n   - Put the forest on DL_Forest and add Electric Dreams to credits.md (Electric Dreams Env, Epic Games, from Fab). You see the forest hide and show with DL_Forest's eye.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Unreal Engine 5.2 PCG Tutorial - Electric Dreams Demo\" by Smart Poly: https://www.youtube.com/watch?v=HlGEZ5DZbVI\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "pcg_first.png (PCG_FirstScatter's graph and the cubes on the hill)", "uk": "pcg_first.png (граф PCG_FirstScatter і куби на пагорбі)"}, {"en": "pcg_study.md (the forest graph's chain in plain words)", "uk": "pcg_study.md (ланцюжок графа лісу простими словами)"}, {"en": "migrated.md (the plugins, every migrated asset and its folder)", "uk": "migrated.md (плагіни, кожен перенесений асет і його тека)"}, {"en": "forest_pair.png (before and after one setting change)", "uk": "forest_pair.png (до й після однієї зміни налаштування)"}, {"en": "credits.md (with Electric Dreams added)", "uk": "credits.md (з доданим Electric Dreams)"}, {"en": "before_after_day34.png and flythrough_day34.mp4 (60 seconds over the test patch in Play)", "uk": "before_after_day34.png і flythrough_day34.mp4 (60 секунд над тестовою ділянкою в Play)"}, {"en": "summary.md", "uk": "звіт дня (summary.md)"}], "goal": {"en": "By the end of today you have made your first PCG graph, written down how Electric Dreams' forest graph decides where trees grow, and that forest migrated into IslandCourse and growing on a 100 x 100 m test patch of L_Island.", "uk": "До кінця дня в тебе є перший власний PCG-граф, записаний опис того, як граф лісу Electric Dreams вирішує, де ростуть дерева, і цей ліс, перенесений в IslandCourse, росте на тестовій ділянці 100 x 100 м у L_Island."}, "uses": [{"en": "Day 24: ElectricDreamsSample, the Electric Dreams project you started downloading", "uk": "День 24: ElectricDreamsSample, проєкт Electric Dreams, завантаження якого почалося того дня"}, {"en": "Day 27: your sculpted valleys", "uk": "День 27: твої виліплені долини"}, {"en": "Day 33: L_Island's regions, DL_Forest and the flying Play set-up", "uk": "День 33: ділянки L_Island, DL_Forest і налаштування польоту в Play"}], "quiz": [{"q": {"en": "In a PCG graph, which kind of node decides 'what' a point becomes?", "uk": "Який вид вузла в PCG-графі вирішує, «чим» стане точка?"}, "options": [{"en": "A sampler", "uk": "Семплер"}, {"en": "A filter", "uk": "Фільтр"}, {"en": "A spawner, such as Static Mesh Spawner", "uk": "Спавнер, наприклад Static Mesh Spawner"}], "answer": 2, "explain": {"en": "Samplers make points (where), filters remove some (which survive), and spawners turn the rest into meshes (what).", "uk": "Семплери створюють точки (де), фільтри прибирають частину (що виживає), а спавнери перетворюють решту на меші (що)."}}, {"q": {"en": "Your 16 GB PC freezes as soon as you open a level in the Electric Dreams project. Which level did you probably open?", "uk": "Твій ПК з 16 ГБ зависає, щойно відкривається рівень у проєкті Electric Dreams. Який рівень, найімовірніше, відкрито?"}, "options": [{"en": "ElectricDreams_PCGForest", "uk": "ElectricDreams_PCGForest"}, {"en": "ElectricDreams_Env, the full 4 km map", "uk": "ElectricDreams_Env, повна мапа 4 км"}, {"en": "L_Day34_PCG", "uk": "L_Day34_PCG"}, {"en": "A breakdown level at Scalability High", "uk": "Рівень-розбір зі Scalability High"}], "answer": 1, "explain": {"en": "The full maps need 32 to 64 GB of memory. On 16 GB, open only the small breakdown levels.", "uk": "Повним мапам потрібно 32–64 ГБ пам'яті. На 16 ГБ відкривай лише маленькі рівні-розбори."}}, {"q": {"en": "After Migrate, the forest graph in IslandCourse shows errors and generates nothing. What do you check first?", "uk": "Після Migrate граф лісу в IslandCourse показує помилки й нічого не генерує. Що перевірити насамперед?"}, "options": [{"en": "That IslandCourse has the same PCG plugins turned on as the Electric Dreams project", "uk": "Що в IslandCourse увімкнені ті самі плагіни PCG, що й у проєкті Electric Dreams"}, {"en": "That Lumen is on", "uk": "Що Lumen увімкнений"}, {"en": "That the sun is 30 degrees high", "uk": "Що сонце стоїть на висоті 30 градусів"}, {"en": "That the forest is on DL_Water", "uk": "Що ліс на DL_Water"}], "answer": 0, "explain": {"en": "A migrated graph uses nodes from the source project's plugins. Without them, its nodes are missing.", "uk": "Перенесений граф використовує вузли з плагінів вихідного проєкту. Без них його вузлів бракує."}}, {"q": {"en": "What does Migrate copy?", "uk": "Що копіює Migrate?"}, "options": [{"en": "Only the asset you clicked", "uk": "Лише асет, на який клікнули"}, {"en": "The whole Electric Dreams project", "uk": "Увесь проєкт Electric Dreams"}, {"en": "Only the textures", "uk": "Лише текстури"}, {"en": "The asset and everything it uses (its dependencies)", "uk": "Асет і все, що він використовує (його залежності)"}], "answer": 3, "explain": {"en": "Migrate follows every reference, so meshes, materials, textures and graphs come along and keep working.", "uk": "Migrate іде за кожним посиланням, тож меші, матеріали, текстури й графи переносяться разом і продовжують працювати."}}, {"q": {"en": "You changed Trees Density, Clearings Spacing and the Seed all at once, and now the valley looks worse. What should you have done?", "uk": "Trees Density, Clearings Spacing і Seed змінено всі разом, і тепер долина виглядає гірше. Як варто було діяти?"}, "options": [{"en": "Change all the settings again at once", "uk": "Знову змінити всі налаштування разом"}, {"en": "Change one setting at a time and keep a before/after pair for each", "uk": "Змінювати одне налаштування за раз і зберігати пару до/після для кожного"}, {"en": "Delete the forest and place it again", "uk": "Видалити ліс і поставити його знову"}], "answer": 1, "explain": {"en": "One change at a time shows what each number does. With three changes you cannot tell which one hurt.", "uk": "Одна зміна за раз показує, що робить кожне число. Коли змін три, неможливо сказати, яка з них зашкодила."}}], "weekInfo": {"week": 7, "title": {"en": "Roads, the big world and a first forest", "uk": "Дороги, великий світ і перший ліс"}, "goal": {"en": "By Friday you have roads that follow the land, island-scale light with landmarks and vistas, L_Island organised with World Partition, Data Layers and HLODs, and a first PCG forest filling one valley.", "uk": "До п'ятниці в тебе є дороги, що йдуть за рельєфом, світло в масштабі острова з орієнтирами й панорамами, L_Island, упорядкований за допомогою World Partition, Data Layers і HLOD, і перший PCG-ліс, що заповнює одну долину."}, "skills": [{"en": "Landscape spline roads built to real grades in Unreal Engine 5", "uk": "Дороги зі сплайнів ландшафту зі справжніми ухилами в Unreal Engine 5"}, {"en": "World Partition, Data Layer and HLOD set-up for large open worlds", "uk": "Налаштування World Partition, Data Layers і HLOD для великих відкритих світів"}, {"en": "Atmosphere, light, landmarks and vistas for open-world composition", "uk": "Атмосфера, світло, орієнтири й панорами в композиції відкритого світу"}, {"en": "Reading production PCG graphs and migrating assets between Unreal projects", "uk": "Читання продакшн-графів PCG і перенесення асетів між проєктами Unreal"}]}, "morning": {"sofar": {"en": "Your island runs as a real open world, with World Partition, Data Layers and HLODs in place.", "uk": "Твій острів працює як справжній відкритий світ: World Partition, Data Layers і HLOD уже на своїх місцях."}, "today": {"en": "You make your first PCG graph, read how the Electric Dreams forest decides where trees grow, and migrate that forest onto a test patch of your island.", "uk": "Сьогодні ти робиш свій перший PCG-граф, розбираєшся, як ліс Electric Dreams вирішує, де рости деревам, і переносиш цей ліс на тестову ділянку свого острова."}, "cheer": {"en": "PCG is new ground for many professionals too, so explore it with curiosity; your test patch only has to grow, not to be perfect.", "uk": "PCG — нова територія і для багатьох професіоналів, тож досліджуй її з цікавістю; твоя тестова ділянка має лише вирости, а не бути досконалою."}, "quote": {"text": {"en": "What I cannot create, I do not understand.", "uk": "Чого я не можу створити, того я не розумію."}, "author": {"en": "Richard Feynman", "uk": "Річард Фейнман"}, "source": "https://en.wikiquote.org/wiki/Richard_Feynman"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-34-electric-dreams-pcg-forest", "mapHref": "../../COURSE.html", "prevHref": "../Day-33-world-partition-data-layers-hlods/START-HERE.html", "nextHref": "../Day-35-boss-roads-big-world-first-forest/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8 (IslandCourse and ElectricDreamsSample). I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me and don't write code. Keep me moving and make it feel like a game.\n\nToday I build on my own: The migration and the forest on your test patch, on your own.\nIt's part of: Your first PCG graph in a practice level, a written study of Electric Dreams' forest graph from its small breakdown level, and its forest (PCGDemo_ForestBP) migrated into IslandCourse and growing on a 100 x 100 m test patch (Practice: /Game/Course/Day34 in IslandCourse. Study: the breakdown level ElectricDreams_PCGForest in ElectricDreamsSample. Build: a 100 x 100 m test patch in one of your island's valleys, outside both districts and away from the roads.).\n\nSpec:\n- Before today: if you have never opened ElectricDreamsSample (your Electric Dreams project), open it once (for example the evening before) and let the shaders compile; it can take an hour; don't close the editor.\n- PCG_FirstScatter in /Game/Course/Day34: Get Landscape Data > Surface Sampler > Static Mesh Spawner on a small practice landscape, with its points seen in debug and the Density column read.\n- In ElectricDreamsSample, Engine Scalability is at High and only the small breakdown level ElectricDreams_PCGForest is opened (Content > Levels > PCG > Breakdown_Levels, which holds the four small levels). Never open ElectricDreams_Env or ElectricDreams_PCG, the full 4 km maps built for 32 to 64 GB of memory. Memory stays under about 14 GB in Task Manager.\n- pcg_study.md: the forest graph's chain in plain words, one line per step, each marked 'where', 'which survive' or 'what'.\n- PCGDemo_ForestBP migrated into IslandCourse with everything it uses, plus a short list for next week (4 to 6 plants and 2 to 4 rocks); every asset listed in migrated.md, with the PCG plugin the Electric Dreams project uses (Procedural Content Generation Framework) on in IslandCourse.\n- The forest on a 100 x 100 m test patch of L_Island, generated, one setting changed with a before/after pair, on DL_Forest; Electric Dreams added to credits.md.\n- Only one project open at a time.\n\nMy checklist:\n1. Check the PCG plugin in IslandCourse: Edit > Plugins, search PCG. Check: Procedural Content Generation Framework (PCG) is ticked (it is on by default in 5.8; if not, tick it and restart). (from lesson 1)\n2. Make L_Day34_PCG with a small landscape and one hill; build PCG_FirstScatter and Generate it in a PCG Volume. Check: cubes sit on the hill inside the volume. (from lesson 1)\n3. Debug and inspect the Surface Sampler: D shows its points, A lists them. If the list is empty, click Generate again with the graph open. Check: pcg_first.png shows the points and a Density column. (from lesson 1)\n4. Save and close IslandCourse. Open ElectricDreamsSample with Engine Scalability at High and open only ElectricDreams_PCGForest. Check: Task Manager shows memory under about 14 GB. (from lesson 2)\n5. Open the forest actor's graph and follow it from left to right; write the chain in pcg_study.md. Check: at least six lines, each marked 'where', 'which survive' or 'what'. (from lesson 2)\n6. Change Trees Density on the forest actor, Generate, look, then set it back; don't save the sample's level. Check: you saw the forest thin out and fill in again. (from lesson 2)\n7. Write the Electric Dreams project's PCG plugins at the top of migrated.md (you should find one: Procedural Content Generation Framework), then migrate PCGDemo_ForestBP to IslandCourse's Content folder. Check: Unreal reports that the migration finished. (from lesson 3)\n8. Migrate your short list of 4 to 6 plants and 2 to 4 rocks the same way and add each to migrated.md. Check: migrated.md lists every asset and the folder it came from. (from lesson 3)\n9. Close ElectricDreamsSample; open IslandCourse and check the same PCG plugins are ticked (restart if you had to tick one). Check: the migrated folders show in the Content Browser, with no missing-plugin message. (from lesson 3)\n10. In L_Island load only your test valley; bookmark a 60 m view and take your 'before' shot; place PCGDemo_ForestBP, size it to 100 x 100 m and Generate. Check: trees stand on your terrain inside the patch. (from lesson 4)\n11. From your bookmark, change Trees Density once and save the pair as forest_pair.png. Check: the pair shows a clear difference from the same view. (from lesson 4)\n12. Put the forest on DL_Forest and add Electric Dreams to credits.md. Check: hiding DL_Forest hides the forest; credits.md names Electric Dreams Env, Epic Games and Fab. (from lesson 4)\n13. Before/after capture: the bare patch and the forested patch from the same bookmark; then a 60-second clip over the patch in Play. Check: before_after_day34.png and flythrough_day34.mp4 are saved. (from day 33, lesson 2)\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Maria\nDay 34: PCG from zero: Electric Dreams' forest read and migrated. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

function quiz(){if(!D.quiz||!D.quiz.length)return '';const a=st.qa||{};let ok=0;const L=u('letters');
 const pips='<div class="pips well" aria-hidden="true">'+D.quiz.map((q,i)=>'<i class="'+(a[i]==null?'':a[i]===q.answer?'r':'w')+'"></i>').join('')+'</div>';
 const qs=D.quiz.map((q,i)=>{const c=a[i];if(c===q.answer)ok++;return '<div class="qz"><p class="qq"><span class="qn">'+(i+1)+'</span><span>'+lk(x(q.q))+'</span></p>'+q.options.map((o,k)=>{let cls='opt',mk='<span></span>';if(c!=null){if(k===q.answer){cls+=' right';mk=ic('check','mk')}else if(k===c){cls+=' wrong';mk=ic('x','mk')}}return '<button class="'+cls+'" id="o'+i+'_'+k+'"'+(c!=null?' disabled':'')+' onclick="pick('+i+','+k+')"><span class="lt">'+(L[k]||k+1)+'</span><span>'+esc(x(o))+'</span>'+mk+'</button>'}).join('')+(c!=null?'<p class="exp '+(c===q.answer?'r':'w')+'" id="e'+i+'" tabindex="-1"><b>'+(c===q.answer?u('right'):u('wrong'))+'</b>'+lk(x(q.explain))+'</p>':'')+'</div>'}).join('');
 return '<section class="card glass quiz">'+lab(u('quiz'),'gold')+'<p class="muted" style="margin:-6px 0 14px">'+u('quizSub')+'</p>'+pips+qs+(qDone()?'<div class="score well" role="status"><span class="eyebrow">'+u('score')+'</span><span class="lcd" aria-label="'+ok+' / '+D.quiz.length+'">'+seg(ok+'/'+D.quiz.length)+'</span><div class="row"><button class="btn ghost" id="retry" onclick="retry()">'+u('retry')+'</button></div></div>':'')+'</section>'}
function vid(v){if(!v)return '';const link=v.url?'<a href="'+esc(v.url)+'" target="_blank" rel="noopener">'+esc(x(v.title)||v.url)+'</a>'+(v.channel?' <span class="muted">· '+esc(v.channel)+(v.length?' · '+esc(v.length):'')+'</span>':''):'';const s=v.search?'<a href="https://www.youtube.com/results?search_query='+encodeURIComponent(v.search)+'" target="_blank" rel="noopener">'+u('noVid')+': '+esc(v.search)+'</a>':'';const alt=v.alt&&v.alt.url?'<br><span class="eyebrow">UA</span> <a href="'+esc(v.alt.url)+'" target="_blank" rel="noopener">'+esc(v.alt.title||v.alt.url)+'</a>'+(v.alt.channel?' <span class="muted">· '+esc(v.alt.channel)+'</span>':''):'';return '<div class="vid well">'+kn('play')+'<div><b>'+u('more')+'?</b><br>'+(link||s)+alt+(link&&s?'<br><span class="muted" style="font-size:14px">'+s+'</span>':'')+'</div></div>'}
function morning(){const m=D.morning;if(!m)return '';const q=m.quote||{};
 let shelf='';if(D.day>0){shelf='<div class="shelf" aria-hidden="true">';let g='';for(let d=0;d<D.day;d++){let p=0;try{p=(JSON.parse(localStorage.getItem('devteam:'+D.learner+':'+d))||{}).pct||0}catch(e){}g+='<i class="'+(p>=1?'d':'')+(d>0&&d%5===0?' bs':'')+'"></i>';if(d%5===0||d===D.day-1){shelf+='<span class="wkg">'+g+'</span>';g=''}}shelf+='</div>'}
 const qt=lang==='uk'&&q.original?q.original:x(q.text);
 return '<section class="card glass morning"><div class="mgrid">'+(m.sofar?'<div>'+lab(u('sofar'),'gold')+shelf+'<p class="mtxt">'+lk(x(m.sofar))+'</p></div>':'')+(m.today?'<div>'+lab(u('todayL'))+'<p class="mtxt">'+lk(x(m.today))+'</p></div>':'')+'</div>'+(m.cheer?'<p class="cheer">'+esc(x(m.cheer))+'</p>':'')+(qt?'<figure class="quote well">'+kn('quote')+'<blockquote>'+esc(qt)+'</blockquote>'+(q.author?'<figcaption>'+esc(x(q.author))+'</figcaption>':'')+'</figure>':'')+'</section>'}
function setLang(l){lang=l;try{localStorage.setItem('devteam:lang',lang)}catch(e){};render()}
function toggleLang(){setLang(lang==='uk'?'en':'uk')}
/* keep open sections and keyboard focus across re-renders */
const openD=new Set();
function tg(e){if(e.open)openD.add(e.id);else openD.delete(e.id)}
const op=id=>openD.has(id)?' open':'';
function render(){const ae=document.activeElement,fid=ae&&(ae.id||(ae.getAttribute('data-th')?'th-'+ae.getAttribute('data-th'):ae.getAttribute('lang')&&ae.closest('.seg')?'lg-'+ae.getAttribute('lang'):''));
 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);
 const b=D.build,P=Math.round(prog()*100);
 document.getElementById('top').innerHTML='<div class="topin glass"><a class="maplink" href="'+esc(D.mapHref)+'">'+kn('map')+u('map')+'</a><div class="crumb"><b>'+esc(x(D.learnerName))+'</b><span>'+u('week')+' '+D.week+'</span><span>'+u('day')+' '+D.day+' '+u('of')+' '+D.total+'</span></div>'+controls(lang,'setLang')+'</div><div class="tline"><i style="width:'+P+'%"></i></div>';
 const state=w=>w<D.week?'b':w===D.week?'n':'p';
 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 if(D.weekInfo){const w=D.weekInfo;h+='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}
 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p><div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+list(D.handin,'ul','ticks')+'<p class="path">'+ic('folder')+'<span>'+u('shipTo')+' <code>'+esc(D.workPath)+'</code></span></p>'+(D.lessons.length?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<p class="muted">'+u('report')+'</p><div class="row"><button class="btn s" onclick="cp(D.reportPrompt)">'+ic('copy')+u('copyR')+'</button></div></section>';
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();
</script>
</body>
</html>

<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 32</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

<script id="data" type="application/json">{"learner": "ib-maria-0a2a2c5a", "learnerName": {"en": "Maria", "uk": "Марія"}, "day": 32, "week": 7, "total": 60, "title": {"en": "Island-scale light and haze, landmarks and vistas", "uk": "Світло й серпанок у масштабі острова, орієнтири й панорами"}, "theme": {"en": "Week 7: Roads, the big world and a first forest", "uk": "Тиждень 7: Дороги, великий світ і перший ліс"}, "build": {"item": {"en": "One island light recipe (sun, Lumen, sky, haze, clouds and locked exposure) and three landmarks blocked out at true size. Three vista cameras frame them along the scenic route.", "uk": "Один рецепт світла для острова (сонце, Lumen, небо, серпанок, хмари й зафіксована експозиція) і блокаути трьох орієнтирів у справжньому розмірі. Три камери панорам беруть їх у кадр уздовж мальовничого маршруту."}, "why": {"en": "Today your island gets its golden hour, three landmarks a pilot can steer by, and three postcard views. Studios plan landmarks and vistas early, because every later shot and the final flight are built around them. One written light recipe lets anyone rebuild the same afternoon.", "uk": "Сьогодні на острові настає золота година, з'являються три орієнтири, за якими може летіти пілот, і три види, як на листівці. Студії планують орієнтири й панорами рано, бо навколо них будують кожен наступний кадр і фінальний проліт. Записаний рецепт світла дає будь-кому відтворити той самий день."}, "next": {"en": "island_light_recipe.md is the light for every review from now on: you check it on Day 45 and update it for both districts on Day 52. Your vista cameras shoot the dressed island again on Day 40, and district 2's landmark from landmarks.md becomes a real model on Day 51.", "uk": "Відтепер island_light_recipe.md — світло для кожного огляду: у День 45 ти його перевіриш, а в День 52 оновиш для обох районів. Камери панорам знімуть уже вбраний острів у День 40, а в День 51 орієнтир району 2 з landmarks.md стане справжньою моделлю."}, "where": {"en": "L_Island: the whole island for the light. Three landmarks from your map and photos, such as a lighthouse on a headland or a church tower in district 2. Three vista points along your scenic route.", "uk": "L_Island: для світла — увесь острів. Три орієнтири з твоєї мапи й фото, наприклад маяк на мисі чи церковна вежа в районі 2. Три точки панорам уздовж мальовничого маршруту."}, "spec": [{"en": "island_light_recipe.md, grown from your Day 30 sky_recipe.md (save a copy under the new name and add to it). It holds the sun's rotation, the Sky Light (Real Time Capture on), Sky Atmosphere, Height Fog, Volumetric Cloud and the locked exposure, all as numbers.", "uk": "island_light_recipe.md, виріс із твого sky_recipe.md з Дня 30: збережи копію під новою назвою й доповни її. У ньому числами записано поворот сонця, Sky Light (Real Time Capture увімкнено), Sky Atmosphere, Height Fog, Volumetric Cloud і зафіксовану експозицію."}, {"en": "Lumen on for light and reflections (Project Settings), checked, not changed. Older Unreal (4.27) or weak PC: Lumen off; the Sky Light lights the shade.", "uk": "Lumen увімкнений для світла й відбиттів (Project Settings): перевірено, не змінено. Старіший Unreal (4.27) або слабкий ПК: Lumen вимкнений, тінь освітлює Sky Light."}, {"en": "Haze that softens the coast 1 km away but keeps its shape; the near sea is never milky.", "uk": "Серпанок пом'якшує берег за 1 км, але зберігає його форму. Близьке море ніколи не стає молочним."}, {"en": "Exposure locked with your Day 30 Post Process Volume (Infinite Extent ticked, Min EV100 = Max EV100), retuned for the island light. No second volume.", "uk": "Експозицію зафіксовано твоїм Post Process Volume з Дня 30 (Infinite Extent увімкнено, Min EV100 = Max EV100) і переналаштовано під світло острова. Другого об'єму немає."}, {"en": "Three landmarks blocked out at true size with basic shapes or your own kit. Sizes: a lighthouse 15 to 25 m, a tower 20 to 30 m, a lone tree about 15 m. Each one's map spot and height are in landmarks.md.", "uk": "Блокаути трьох орієнтирів у справжньому розмірі з простих форм або з твого набору. Розміри: маяк 15–25 м, вежа 20–30 м, самотнє дерево близько 15 м. Місце кожного на мапі й висота записані в landmarks.md."}, {"en": "Three locked Cine Cameras, CAM_Vista_1 to CAM_Vista_3, on the scenic route, 16:9. Each frames a landmark with a foreground, a middle and a far background.", "uk": "Три заблоковані Cine Camera, CAM_Vista_1–CAM_Vista_3, на мальовничому маршруті, 16:9. Кожна бере в кадр орієнтир із переднім, середнім і далеким заднім планом."}], "piece1": "the island light recipe", "piece2": {"en": "The landmarks and the three vistas, on your own", "uk": "Орієнтири й три панорами, самостійно"}, "steps": [{"text": {"en": "Check: the files from today's lessons are in the day work folder (island_light_recipe.md and landmarks.md). Also check that L_Island has your first landmark and the locked camera CAM_Vista_1. Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it.", "uk": "Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: island_light_recipe.md і landmarks.md. У L_Island є твій перший орієнтир і заблокована камера CAM_Vista_1. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде."}, "lesson": 1}, {"text": {"en": "Pilot CAM_Island_C3 and compare the view with the one photo of your place you like best. Adjust only the sun's rotation and the exposure until the light matches, and write both in the recipe. Check: from high up every hill has a lit side and a shaded side.", "uk": "Перейди командою Pilot у CAM_Island_C3 і порівняй вид з тим фото свого місця, яке тобі найбільше подобається. Змінюй лише поворот сонця й експозицію, доки світло не збігатиметься. Запиши обидва значення в рецепт. Перевірка: згори в кожного пагорба є освітлений і затінений бік."}, "lesson": 1}, {"text": {"en": "Tune the haze with the Height Fog and the Sky Atmosphere until the coast 1 km away is softer and bluer than the near coast. Check: the far coast keeps its shape and the near sea is not milky.", "uk": "Налаштуй серпанок полями Height Fog і Sky Atmosphere, доки берег за 1 км не стане м'якшим і синішим за близький. Перевірка: далекий берег зберігає форму, а близьке море не молочне."}, "lesson": 2}, {"text": {"en": "Block out the other two landmarks at true size, each on its spot, and add them to landmarks.md. Check: from 1 km away each shows as a clear shape against sky or sea, and the three are spread across the island.", "uk": "Зроби блокаути двох інших орієнтирів у справжньому розмірі, кожен на своєму місці, і допиши їх у landmarks.md. Перевірка: з 1 км кожен видно як чітку форму на тлі неба чи моря, а всі три розкидані по острову."}, "lesson": 3}, {"text": {"en": "Place and lock CAM_Vista_2 and CAM_Vista_3 as you did CAM_Vista_1, each framing a landmark. Check: every landmark shows in at least two of the three vistas.", "uk": "Постав і заблокуй CAM_Vista_2 і CAM_Vista_3 так само, як CAM_Vista_1. Кожна бере в кадр орієнтир. Перевірка: кожен орієнтир видно щонайменше у двох із трьох панорам."}, "lesson": 4}, {"text": {"en": "Take a HighResShot 1920x1080 from each vista camera and rename the files island_vista1.png to island_vista3.png; Day 40 shoots them again. Check: three files, each 1920 x 1080.", "uk": "Зроби HighResShot 1920x1080 з кожної камери панорами й перейменуй файли на island_vista1.png–island_vista3.png. У День 40 ти знімеш їх знову. Перевірка: три файли, кожен 1920 × 1080."}, "lesson": 4}, {"text": {"en": "Choose File > Save All in Unreal. Report and hand-in: click Copy the day report at the bottom of the page, paste it into a new chat and answer. Open summary.md in Notepad, press Ctrl+End, paste the answer and press Ctrl+S. Then drag the files on the Hand in list into your hand-in folder. Check: the level tab shows no * mark, and every name shows in the folder, each with a size.", "uk": "В Unreal вибери File > Save All. Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: на вкладці рівня немає позначки *, а кожна назва зі списку є в папці, у кожної є розмір."}, "lesson": 4}], "assets": ["island12/picture-brief-standard.md"]}, "lessons": [{"title": {"en": "Light for a whole island: sun, sky light and Lumen", "uk": "Світло для цілого острова: сонце, Sky Light і Lumen"}, "minutes": 40, "goals": [{"en": "Explain Lumen: Unreal's real-time light that bounces off surfaces and lights the shade, so shaded places look right at once, with nothing to pre-calculate.", "uk": "Пояснювати, що таке Lumen. Це світло Unreal у реальному часі: воно відбивається від поверхонь і освітлює тінь. Тож затінені місця одразу виглядають правильно, і нічого не треба розраховувати наперед."}, {"en": "Set the sun for island scale: a low sun (25 to 35 degrees) shapes the hills and puts glints on the sea; a noon sun flattens everything.", "uk": "Ставити сонце для масштабу острова: низьке сонце (25–35 градусів) ліпить пагорби й дає відблиски на морі, а полуденне все сплющує."}, {"en": "Explain exposure (how bright the camera makes the picture) and retune your Day 30 lock, so every shot of the island repeats.", "uk": "Пояснювати, що таке експозиція (наскільки яскравою камера робить картинку), і переналаштовувати фіксацію з Дня 30, щоб кожен кадр острова повторювався."}], "doalong": [{"en": "In L_Island hold Ctrl+L and move the mouse to swing the sun to about 30 degrees high. You see long shadows on the hills. Save a copy of sky_recipe.md as island_light_recipe.md and write the sun's Rotation in it.", "uk": "У L_Island затисни Ctrl+L і рухай мишею, щоб підняти сонце приблизно на 30 градусів. На пагорбах лягають довгі тіні. Збережи копію sky_recipe.md як island_light_recipe.md і запиши в неї Rotation сонця."}, {"en": "Open Window > Env. Light Mixer. You see rows for the sun, Sky Light, Sky Atmosphere, Height Fog and Volumetric Cloud; click Create for any that are missing.", "uk": "Відкрий Window > Env. Light Mixer. Там є рядки для сонця, Sky Light, Sky Atmosphere, Height Fog і Volumetric Cloud. Для тих, яких бракує, клацни Create."}, {"en": "Open Edit > Project Settings > Engine > Rendering and set Dynamic Global Illumination Method and Reflection Method to Lumen. You see Lumen in both. Older Unreal (4.27) or weak PC: leave Lumen off (4.27 has none).", "uk": "Відкрий Edit > Project Settings > Engine > Rendering і встанови Lumen у Dynamic Global Illumination Method і Reflection Method. Має вийти: Lumen в обох. Старіший Unreal (4.27) або слабкий ПК: залиш Lumen вимкненим (у 4.27 його немає)."}, {"en": "Select the Sky Light and tick Real Time Capture in Details. You see shaded slopes turn from dark grey to a soft, bluish light.", "uk": "Виділи Sky Light і увімкни Real Time Capture в Details. Затінені схили з темно-сірих стають м'яко-синюватими."}, {"en": "Select your Day 30 Post Process Volume (don't add a second one). Change Min EV100 and Max EV100 together, always to the same value, until the island looks as bright as your photo. You see the brightness stay the same as you fly; write the value.", "uk": "Виділи свій Post Process Volume з Дня 30 (другого не додавай). Змінюй Min EV100 і Max EV100 разом, завжди на однакове значення, доки острів не стане таким яскравим, як на фото. Тепер яскравість не змінюється під час польоту. Запиши значення."}], "play": {"en": "Match the sun: the tutor describes the light in my favourite photo of my place. I set my sun and describe my screenshot until the tutor rates it 4 out of 5.", "uk": "Підбери сонце: тьютор описує світло на моєму улюбленому фото мого місця. Я налаштовую своє сонце й описую свій скриншот, доки тьютор не оцінить його на 4 з 5."}, "video": {"url": "https://www.youtube.com/watch?v=fVg5ihB8Wdc", "title": "The 2025 Guide to Rendering in Unreal Engine 5", "channel": "William Faucher", "length": "13:05", "search": "unreal engine 5 rendering guide lumen"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Світло для цілого острова: сонце, Sky Light і Lumen (Day 32, lesson 1 of 4). Today's build: Один рецепт світла для острова (сонце, Lumen, небо, серпанок, хмари й зафіксована експозиція) і блокаути трьох орієнтирів у справжньому розмірі. Три камери панорам беруть їх у кадр уздовж мальовничого маршруту..\nWhat I already know: День 19: твій рецепт світла й навички роботи з камерою з куточка гавані; День 30: sky_recipe.md, Post Process Volume, що фіксує експозицію, і твої заблоковані камери дрона CAM_Island_C1–CAM_Island_C3; День 21: твоє фото цього місця; День 22: island_map.png із мальовничим маршрутом; День 31: головна дорога й підйом серпантином.\n\nBy the end of this lesson I can:\n1. Пояснювати, що таке Lumen. Це світло Unreal у реальному часі: воно відбивається від поверхонь і освітлює тінь. Тож затінені місця одразу виглядають правильно, і нічого не треба розраховувати наперед.\n2. Ставити сонце для масштабу острова: низьке сонце (25–35 градусів) ліпить пагорби й дає відблиски на морі, а полуденне все сплющує.\n3. Пояснювати, що таке експозиція (наскільки яскравою камера робить картинку), і переналаштовувати фіксацію з Дня 30, щоб кожен кадр острова повторювався.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: На твоєму острові є дороги, що йдуть за рельєфом, зокрема серпантин з ухилом менше 10 %. Today: Сьогодні ти освітлюєш увесь острів одним рецептом світла, додаєш серпанок, що показує відстань, робиш блокаут трьох орієнтирів і кадруєш три панорами. One encouraging line: Сьогодні світло й серпанок роблять острів величезним, тож дай собі хвилинку помилуватися видом, який з'явився завдяки тобі.); 2 lines on why today matters and where it comes back, in plain words (from this: Сьогодні на острові настає золота година, з'являються три орієнтири, за якими може летіти пілот, і три види, як на листівці. Студії планують орієнтири й панорами рано, бо навколо них будують кожен наступний кадр і фінальний проліт. Записаний рецепт світла дає будь-кому відтворити той самий день. It comes back: Відтепер island_light_recipe.md — світло для кожного огляду: у День 45 ти його перевіриш, а в День 52 оновиш для обох районів. Камери панорам знімуть уже вбраний острів у День 40, а в День 51 орієнтир району 2 з landmarks.md стане справжньою моделлю.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-32-island-light-landmarks-vistas exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (рецепт острівного світла). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. У L_Island затисни Ctrl+L і рухай мишею, щоб підняти сонце приблизно на 30 градусів. На пагорбах лягають довгі тіні. Збережи копію sky_recipe.md як island_light_recipe.md і запиши в неї Rotation сонця.\n   2. Відкрий Window > Env. Light Mixer. Там є рядки для сонця, Sky Light, Sky Atmosphere, Height Fog і Volumetric Cloud. Для тих, яких бракує, клацни Create.\n   3. Відкрий Edit > Project Settings > Engine > Rendering і встанови Lumen у Dynamic Global Illumination Method і Reflection Method. Має вийти: Lumen в обох. Старіший Unreal (4.27) або слабкий ПК: залиш Lumen вимкненим (у 4.27 його немає). [screenshot]\n   4. Виділи Sky Light і увімкни Real Time Capture в Details. Затінені схили з темно-сірих стають м'яко-синюватими.\n   5. Виділи свій Post Process Volume з Дня 30 (другого не додавай). Змінюй Min EV100 і Max EV100 разом, завжди на однакове значення, доки острів не стане таким яскравим, як на фото. Тепер яскравість не змінюється під час польоту. Запиши значення. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Підбери сонце: тьютор описує світло на моєму улюбленому фото мого місця. Я налаштовую своє сонце й описую свій скриншот, доки тьютор не оцінить його на 4 з 5. Otherwise skip it.\n6. Review: ask me these questions from earlier days, one at a time, and correct me kindly: Day 29: why must every point of a river be lower than the one before it? | Day 25: which three heights did your preview cameras use, and what did each show?\n7. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n8. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\nIf I want to go deeper, recommend this free video: \"The 2025 Guide to Rendering in Unreal Engine 5\" by William Faucher: https://www.youtube.com/watch?v=fVg5ihB8Wdc\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; review (by tutor or art director) = огляд; credits line = рядок авторства; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); File Explorer = Провідник; vertex / edge / face = вершина / ребро / грань; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; collision / UCX collision box = колізія / блок UCX; grey box placeholder = сірий блок (заглушка); volume (PCG Volume, Post Process Volume) = об'єм; kit / kit piece / part of one object = набір / деталь / частина; map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; district / plot / plot plan = район / ділянка / план ділянки; harbour / quay / waterfront / pier = гавань / причал / набережна / пірс; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; vista / blockout / landmark = панорама / блокаут / орієнтир; locked camera / locked exposure = заблокована камера / зафіксована експозиція; set (of textures, decals, lights) = комплект; day work folder (on your PC) = роб ills turn lighter and bluer.", "uk": "Виділи Sky Atmosphere і трохи збільш Aerial Perspective View Distance Scale (наприклад, з 1 до 2). Далекі пагорби стають світлішими й синішими."}, {"en": "Open the console (the ` key, or the Cmd box at the bottom left) and type stat unit. Hide Volumetric Cloud with its eye, read GPU, then show it. You see what the clouds cost; write both numbers in the recipe.", "uk": "Відкрий консоль (клавіша ` або поле Cmd унизу ліворуч) і введи stat unit. Сховай Volumetric Cloud значком ока, зчитай GPU, потім покажи хмари. Різниця — це вартість хмар. Запиши обидва числа в рецепт."}, {"en": "Older Unreal (4.27) or weak PC: if the clouds cost over 3 ms, keep them hidden and write that in the recipe; the haze carries the distance. You see a lighter scene that still reads far away.", "uk": "Старіший Unreal (4.27) або слабкий ПК: якщо хмари коштують понад 3 мс, лиши їх прихованими й запиши це в рецепт — відстань покаже серпанок. Сцена стає легшою, а далечінь усе одно читається."}], "play": {"en": "Distance quiz: the tutor describes three screenshots, such as 'everything past 500 m is white'. I say which one has the right haze and which setting fixes the others.", "uk": "Вікторина про відстань: тьютор описує три скриншоти, наприклад «усе далі за 500 м біле». Я кажу, на якому серпанок правильний і яке налаштування виправить інші."}, "video": {"url": "https://www.youtube.com/watch?v=SbxO-Z5rzwk", "title": "Tips for Sky Atmosphere & Fog - Unreal Engine 5 (& UE4)", "channel": "William Faucher", "length": "5:26", "search": "unreal engine 5 sky atmosphere fog tips"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every messag : "Day 30: sky_recipe.md, the Post Process Volume that locks exposure, and your locked drone cameras CAM_Island_C1 to CAM_Island_C3", "uk": "День 30: sky_recipe.md, Post Process Volume, що фіксує експозицію, і твої заблоковані камери дрона CAM_Island_C1–CAM_Island_C3"}, {"en": "Day 21: your photo of the place", "uk": "День 21: твоє фото цього місця"}, {"en": "Day 22: island_map.png with the scenic route", "uk": "День 22: island_map.png із мальовничим маршрутом"}, {"en": "Day 31: the main road and the switchback climb", "uk": "День 31: головна дорога й підйом серпантином"}], "quiz": [{"q": {"en": "What is Lumen?", "uk": "Що таке Lumen?"}, "options": [{"en": "A plugin for water", "uk": "Плагін для води"}, {"en": "Unreal's real-time light that bounces off surfaces and lights the shade", "uk": "Світло Unreal у реальному часі, що відбивається від поверхонь і освітлює тінь"}, {"en": "A camera lens setting", "uk": "Налаштування об'єктива камери"}, {"en": "A kind of fog", "uk": "Різновид туману"}], "answer": 1, "explain": {"en": "Lumen bounces light in real time, so shade gets soft light from the sky and nearby surfaces at once, with nothing to pre-calculate.", "uk": "Lumen відбиває світло в реальному часі, тож тінь одразу отримує м'яке світло від неба й поверхонь поруч, без жодних попередніх розрахунків."}}, {"q": {"en": "From 150 m, your coast 1 km away looks as sharp and dark as the harbour below you. What should you change?", "uk": "З висоти 150 м берег за 1 км виглядає таким самим різким і темним, як гавань під тобою. Що варто змінити?"}, "options": [{"en": "Lower the sun to 5 degrees", "uk": "Опустити сонце до 5 градусів"}, {"en": "Turn off Lumen", "uk": "Вимкнути Lumen"}, {"en": "Raise the haze a little at a time: Height Fog density or the Sky Atmosphere's aerial perspective", "uk": "Потроху посилювати серпанок: густину Height Fog або повітряну перспективу Sky Atmosphere"}, {"en": "Raise the exposure", "uk": "Збільшити експозицію"}], "answer": 2, "explain": {"en": "Real air softens and blues far things. Without haze the island reads as a small model.", "uk": "Справжнє повітря пом'якшує далекі речі й робить їх синішими. Без серпанку острів читається як маленький макет."}}, {"q": {"en": "Your screenshots get brighter every time you fly from the open sea into a valley. What is the likely cause?", "uk": "Твої скриншоти світлішають щоразу, коли ти летиш із відкритого моря в долину. Яка ймовірна причина?"}, "options": [{"en": "Exposure is not locked", "uk": "Експозиція не зафіксована"}, {"en": "The fog is too thin", "uk": "Туман надто слабкий"}, {"en": "The sun is too high", "uk": "Сонце надто високо"}, {"en": "The road is too wide", "uk": "Дорога надто широка"}], "answer": 0, "explain": {"en": "With automatic exposure the camera adapts to each view. Locking Min EV100 and Max EV100 to one value on the Post Process Volume makes every shot repeat.", "uk": "З автоматичною експозицією камера підлаштовується під кожен вид. Якщо зафіксувати Min EV100 і Max EV100 на одному значенні в Post Process Volume, кожен кадр повторюється."}}, {"q": {"en": "You chose a 3 m bus shelter as a landmark, but nobody notices it from 1 km. Why?", "uk": "Твій орієнтир — автобусна зупинка заввишки 3 м, але з 1 км її ніхто не помічає. Чому?"}, "options": [{"en": "Lumen does not light small objects", "uk": "Lumen не освітлює малі об'єкти"}, {"en": "Landmarks must be red", "uk": "Орієнтири мають бути червоними"}, {"en": "It has no collision", "uk": "У неї немає колізії"}, {"en": "At 1 km it is only about 3 pixels tall on a 1080p screen, too small to read", "uk": "З 1 км вона заввишки лише приблизно 3 пікселі на екрані 1080p — замала, щоб її прочитати"}], "answer": 3, "explain": {"en": "At 1 km, 1 m is about 1 pixel. A landmark needs height and a clear outline, about 15 to 25 m or more.", "uk": "З 1 км 1 м — це приблизно 1 піксель. Орієнтирові потрібні висота й чіткий силует, приблизно 15–25 м або більше."}}, {"q": {"en": "What makes a good vista?", "uk": "Що робит   return '<section class="card glass fbcard">'+lab(u('fbTitle'),'ok')+'<div class="row" style="align-items:baseline;gap:12px"><span class="eyebrow">'+u('fbScore')+'</span><span class="big">'+esc(f.score)+'/'+esc(f.max||10)+'</span></div>'+(fbNote(f)?'<p class="note">'+esc(fbNote(f))+'</p>':'')+'<p class="muted">'+u('fbFull')+(D.handinUrl?': <a href="'+esc(D.handinUrl)+'" target="_blank" rel="noopener">'+u('hOpen')+'</a>':': <code>'+esc(D.workPath)+'</code>')+'</p></section>'}
 return '<section class="card glass fbcard">'+lab(u('fbTitle'),f.s==='missing'?'':'ok')+'<p class="note">'+u(f.s==='missing'?'fbMiss':'fbWait')+'</p>'+(f.s==='missing'?hf():'')+'</section>'}
/* fix phase 1 (2026-10-22): the hand-in folder (a button when the roster has a link, else the folder path), the hand-in card,
   Day 0's "Before lesson 1", the checks before handing in, the Questions card, and the day report with the pasted lesson summaries */
const HIN=(D.handin||[]).map(v=>(v&&v.en)||(typeof v==='string'?v:'')).join(' ').toLowerCase(),hasClip=/\.mp4|clip/.test(HIN);
function hItem(v){return x(v)}
function hList(){return '<ul class="ticks">'+(D.handin||[]).map(v=>'<li>'+lk(hItem(v))+'</li>').join('')+'</ul>'}
const NFILES=new Set((HIN.match(/[\w-]+\.(?:blend|glb|fbx|png|jpe?g|md|txt|mp4|csv|zip|pdf|webp|kra|psd|tga|exr|json|py|uasset|umap)\b/g)||[])).size;
function nFiles(n){if(!n)return '';if(lang==='en')return ' · '+n+(n===1?' file':' files');const a=n%10,b=n%100;return ' · '+n+' '+(a===1&&b!==11?'файл':a>=2&&a<=4&&(b<12||b>14)?'файли':'файлів')}
function hf(){return D.handinUrl?'<div class="row"><a class="btn s" href="'+esc(D.handinUrl)+'" target="_blank" rel="noopener">'+ic('folder')+u('hOpen')+'</a></div>':'<p class="path">'+ic('folder')+'<span>'+u('hPath')+' <code>'+esc(D.workPath)+'</code></span></p>'}
function handinCard(){if(!D.handin||!D.handin.length)return '';return '<section class="card glass handin">'+lab(u('hTitle')+nFiles(NFILES),'ok')+hList()+hf()+'<p class="muted" style="margin:12px 0 0">'+u('hNote')+'</p></section>'}
function beforeCard(){if(!D.before||!D.before.length)return '';return '<section class="card glass before">'+lab(u('before'),'gold')+list(D.before,'ol','steps')+'</section>'}
function chkList(){const a=[];if(HIN.indexOf('.blend')>=0)a.push('chk1');if(/\.(glb|fbx)\b/.test(HIN))a.push('chk2');a.push('chk3');if(hasClip)a.push('chk4');return '<h3>'+u('chk')+'</h3><ol class="steps">'+a.map(k=>'<li>'+u(k)+'</li>').join('')+'</ol>'}
function qCard(){return '<section class="card glass qcard">'+lab(u('qTitle'))+'<ul class="ticks"><li>'+u('q1')+'</li><li>'+u('q2')+'</li><li>'+u('q3')+'</li><li>'+u('q4')+'</li><li>'+u('q5')+'</li></ul></section>'}
function reportText(){let t=D.reportPrompt;const r=D.lessons.map((l,i)=>{const v=(st['r'+i]||'').trim();return v?'Lesson '+(i+1)+': '+v:''}).filter(Boolean);
 if(r.length)t+='\n\nMy lesson summaries, pasted from my course page:\n'+r.join('\n');
 if(st.qs1)t+='\nMy first score in the Check yourself quiz: '+st.qs1[0]+' of '+st.qs1[1]+'.';
 return t}
function qDone(){return D.quiz&&D.quiz.length&&st.qa&&D.quiz.every((q,i)=>st.qa[i]!=null)}
function prog(){const Q=(D.quiz&&D.quiz.length)?1:0,L=D.lessons.length,C=D.build.steps.length;let n=0;D.lessons.forEach((l,i)=>{if(st['q'+i])n++});D.build.steps.forEach((s,i)=>{if(st['c'+i])n++});if(Q&&qDone())n++;return (L+C+Q)?n/(L+C+Q):0}
function qScore(){let n=0;D.quiz.forEach((q,i)=>{if((st.qa||{})[i]===q.answer)n++});return n}
function pick(i,k){st.qa=st.qa||{};if(st.qa[i]!=null)return;st.qa[i]=k;if(qDone()){st.qs=[qScore(),D.quiz.length];if(!st.qs1)st.qs1=st.qs.slice()}save();render();const e=document.getElementById('e'+i);if(e)e.focus({preventScroll:true})}
function retry(){st.qa={};delete st.qs;save();render();const e=document.getElementById('o0_0');if(e)e.focus()}
const isBoss=!!(D.build&&D.build.boss&&D.build.boss.length),isFin=D.day===D.total;
document.body.className=isFin?'fin':isBoss?'boss':'';
const lk=s=>esc(s).replace(/https?:\/\/[^\s<']*[^\s<.,;:)']/g,m=>'<a href="'+m+'" target="_blank" rel="noopener">'+m+'</a>');
function list(a,tag,cls){return '<'+tag+(cls?' class="'+cls+'"':'')+'>'+(a||[]).map(i=>'<li>'+lk(x(i))+'</li>').join('')+'</'+tag+'>'}
const lab=(t,k)=>'<div class="lab'+(k?' k-'+k:'')+'"><span class="dotc"></span>'+t+'</div>';
const kn=n=>'<span class="kn">'+ic(n)+'</span>';
const slider=p=>'<div class="slider"><i style="width:calc('+p+'% - 6px)"></i><b style="left:clamp(13px,'+p+'%,calc(100% - 13px))"></b></div>';
function quiz(){if(!D.quiz||!D.quiz.length)return '';const a=st.qa||{};let ok=0;const L=u('letters');
 const pips='<div class="pips well" aria-hidden="true">'+D.quiz.map((q,i)=>'<i class="'+(a[i]==null?'':a[i]===q.answer?'r':'w')+'"></i>').join('')+'</div>';
 const qs=D.quiz.map((q,i)=>{const c=a[i];if(c===q.answer)ok++;return '<div class="qz"><p class="qq"><span class="qn">'+(i+1)+'</span><span>'+lk(x(q.q))+'</span></p>'+q.options.map((o,k)=>{let cls='opt',mk='<span></span>';if(c!=null){if(k===q.answer){cls+=' right';mk=ic('check','mk')}else if(k===c){cls+=' wrong';mk=ic('x','mk')}}return '<button class="'+cls+'" id="o'+i+'_'+k+'"'+(c!=null?' disabled':'')+' onclick="pick('+i+','+k+')"><span class="lt">'+(L[k]||k+1)+'</span><span>'+esc(x(o))+'</span>'+mk+'</button>'}).join('')+(c!=null?'<p class="exp '+(c===q.answer?'r':'w')+'" id="e'+i+'" tabindex="-1"><b>'+(c===q.answer?u('right'):u('wrong'))+'</b>'+lk(x(q.explain))+'</p>':'')+'</div>'}).join('');
 return '<section class="card glass quiz">'+lab(u('quiz'),'gold')+'<p class="muted" style="margin:-6px 0 14px">'+u('quizSub')+'</p>'+pips+qs+(qDone()?'<div class="score well" role="status"><span class="eyebrow">'+u('score')+'</span><span class="lcd" aria-label="'+ok+' / '+D.quiz.length+'">'+seg(ok+'/'+D.quiz.length)+'</span>'+(st.qs1?'<span class="muted">'+u('first')+': '+st.qs1[0]+'/'+st.qs1[1]+'</span>':'')+'<div class="row"><button class="btn ghost" id="retry" onclick="retry()">'+u('retry')+'</button></div></div>':'')+'</section>'}
function vid(v){if(!v)return '';const link=v.url?'<a href="'+esc(v.url)+'" target="_blank" rel="noopener">'+esc(x(v.title)||v.url)+'</a>'+(v.channel?' <span class="muted">· '+esc(v.channel)+(v.length?' · '+esc(v.length):'')+'</span>':''):'';const s=v.search?'<a href="https://www.youtube.com/results?search_query='+encodeURIComponent(v.search)+'" target="_blank" rel="noopener">'+u('noVid')+': '+esc(v.search)+'</a>':'';const alt=v.alt&&v.alt.url?'<br><span class="eyebrow">UA</span> <a href="'+esc(v.alt.url)+'" target="_blank" rel="noopener">'+esc(v.alt.title||v.alt.url)+'</a>'+(v.alt.channel?' <span class="muted">· '+esc(v.alt.channel)+'</span>':''):'';return '<div class="vid well">'+kn('play')+'<div><b>'+u('more')+'?</b><br>'+(link||s)+alt+(link&&s?'<br><span class="muted" style="font-size:14px">'+s+'</span>':'')+'</div></div>'}
function morning(){const m=D.morning;if(!m)return '';const q=m.quote||{};
 let shelf='';if(D.day>0){shelf='<div class="shelf" aria-hidden="true">';let g='';for(let d=0;d<D.day;d++){let p=0;try{p=(JSON.parse(localStorage.getItem('devteam:'+D.learner+':'+d))||{}).pct||0}catch(e){}g+='<i class="'+(p>=1?'d':'')+(d>0&&d%5===0?' bs':'')+'"></i>';if(d%5===0||d===D.day-1){shelf+='<span class="wkg">'+g+'</span>';g=''}}shelf+='</div>'}
 const qt=lang==='uk'&&q.original?q.original:x(q.text);
 return '<section class="card glass morning"><div class="mgrid">'+(m.sofar?'<div>'+lab(u('sofar'),'gold')+shelf+'<p class="mtxt">'+lk(x(m.sofar))+'</p></div>':'')+(m.today?'<div>'+lab(u('todayL'))+'<p class="mtxt">'+lk(x(m.today))+'</p></div>':'')+'</div>'+(m.cheer?'<p class="cheer">'+esc(x(m.cheer))+'</p>':'')+(qt?'<figure class="quote well">'+kn('quote')+'<blockquote>'+esc(qt)+'</blockquote>'+(q.author?'<figcaption>'+esc(x(q.author))+'</figcaption>':'')+'</figure>':'')+'</section>'}
function setLang(l){lang=l;try{localStorage.setItem('devteam:lang',lang)}catch(e){};render()}
function toggleLang(){setLang(lang==='uk'?'en':'uk')}
/* keep open sections and keyboard focus across re-renders */
const openD=new Set();
function tg(e){if(e.open)openD.add(e.id);else openD.delete(e.id)}
const op=id=>openD.has(id)?' open':'';
function render(){const ae=document.activeElement,fid=ae&&(ae.id||(ae.getAttribute('data-th')?'th-'+ae.getAttribute('data-th'):ae.getAttribute('lang')&&ae.closest('.seg')?'lg-'+ae.getAttribute('lang'):''));
 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);
 const b=D.build,P=Math.round(prog()*100);
 document.getElementById('top').innerHTML='<div class="topin glass"><a class="maplink" href="'+esc(D.mapHref)+'">'+kn('map')+u('map')+'</a><div class="crumb"><b>'+esc(x(D.learnerName))+'</b><span>'+u('week')+' '+D.week+'</span><span>'+u('day')+' '+D.day+' '+u('of')+' '+D.total+'</span></div>'+controls(lang,'setLang')+'</div><div class="tline"><i style="width:'+P+'%"></i></div>';
 const state=w=>w<D.week?'b':w===D.week?'n':'p';
 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 let wk='';if(D.weekInfo){const w=D.weekInfo;wk='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}
 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p>'+(b.next?'<div class="back well">'+kn('arrow')+'<div><b>'+u('comes')+'</b><br>'+lk(x(b.next))+'</div></div>':'')+'<div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.assetFiles&&D.assetFiles.length?'<p class="files">'+ic('folder')+'<span>'+u('filesL')+' '+D.assetFiles.map(f=>'<a href="assets/'+encodeURIComponent(f)+'" target="_blank" rel="noopener">'+esc(f)+'</a>').join(', ')+'</span></p>':D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+=handinCard();h+=beforeCard();
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div><label class="rcpt" for="r'+i+'"><span class="eyebrow">'+u('rcpt')+'</span><textarea id="r'+i+'" rows="2" placeholder="'+esc(u('rcptPh'))+'" oninput="st.r'+i+'=this.value;save()">'+esc(st['r'+i]||'')+'</textarea></label>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+hList()+chkList()+(hasClip?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<h3>1 · '+u('copyR')+'</h3><p class="muted">'+u('report')+'</p><div class="row"><button class="btn ghost" onclick="cp(reportText())">'+ic('copy')+u('copyR')+'</button></div><h3>2 · '+u('ship')+'</h3>'+hf()+'<p class="muted" style="margin:12px 0 0">'+u('hNote')+'</p></section>';
 h+=qCard();h+=wk;
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();
</script>

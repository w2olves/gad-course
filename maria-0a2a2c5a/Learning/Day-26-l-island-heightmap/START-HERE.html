<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 26</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

square), centred on (0, 0). Sea level is Z = 0, and the sea floor is near -40 m at the edges.", "uk": "IslandCourse: новий рівень Empty Open World, збережений як Content/Island/Maps/L_Island. У ньому один ландшафт із 2017 × 2017 точок сітки через 1 м (квадрат 2 016 м) із центром у (0, 0). Рівень моря — Z = 0, а дно моря біля країв — близько −40 м."}, "spec": [{"en": "island_height_r1.png: a 16-bit greyscale PNG, 2017 x 2017 px, made from real terrain. It is reshaped over island_map.png so the coast and summit sit where the map says. Keep island_height_r1.kra.", "uk": "island_height_r1.png: 16-бітний сірий PNG 2017 × 2017 px, зроблений зі справжнього рельєфу. Його перероблено поверх island_map.png так, що узбережжя й верхівка стоять там, де каже мапа. Збережи й island_height_r1.kra."}, {"en": "Pure black is -40 m, the sea floor at the edges, and pure white is your summit. Work out the Z scale and the Location Z from those two numbers and write them in terrain_notes.md.", "uk": "Чисто чорний — це −40 м, дно моря біля країв, а чисто білий — твоя верхівка. Обчисли з цих двох чисел масштаб Z і Location Z та запиши їх у terrain_notes.md."}, {"en": "L_Island made with File > New Level > Empty Open World and saved as Content/Island/Maps/L_Island.", "uk": "L_Island створено через File > New Level > Empty Open World і збережено як Content/Island/Maps/L_Island."}, {"en": "The landscape imported with Landscape mode > Manage > New > Import from File. Location is X 0, Y 0 and your Z; Scale is X 100, Y 100 and your Z scale. Edit layers are always on in 5.8, so there is no box to tick.", "uk": "Ландшафт імпортовано через Landscape mode > Manage > New > Import from File. Location: X 0, Y 0 і твій Z. Scale: X 100, Y 100 і твій масштаб Z. У 5.8 Edit Layers увімкнено завжди, тож прапорця для них немає."}, {"en": "Light from Window > Env. Light Mixer. Engine Scalability at High, not Epic, to spare your memory; Medium on a weak PC.", "uk": "Світло з Window > Env. Light Mixer. Engine Scalability — High, а не Epic, щоб берегти пам'ять; на слабкому ПК — Medium."}, {"en": "Checked: the summit within 5 m of your map's height, read from a 1 m cube on top. The coast within about 20 m of the map in a Top view, with a flat plane at Z = 0 standing in for the sea.", "uk": "Перевірено: верхівка відрізняється від висоти на мапі не більш ніж на 5 м (за кубом 1 м на ній). Узбережжя згори (вид Top) відрізняється від мапи приблизно на 20 м або менше; рівна площина на Z = 0 заміняє море."}], "piece1": "the heightmap, reshaped in Krita (shared with the lessons)", "piece2": {"en": "L_Island, the import and the calibration, on your own", "uk": "L_Island, імпорт і калібрування — самостійно"}, "steps": [{"text": {"en": "Check: the files from today's lessons are in the day work folder (real_height.png, terrain_notes.md, island_height_r1.kra and .png), and L_Island is in IslandCourse. Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it. Then add real_height.png's line to credits.md. Check: real_height.png shows Grayscale and 16-bit in Krita, with the land lighter than the sea.", "uk": "Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: real_height.png, terrain_notes.md, island_height_r1.kra і .png. L_Island має бути в IslandCourse. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Потім додай рядок про real_height.png у credits.md. Перевірка: Krita показує для real_height.png Grayscale і 16-bit, а суша світліша за море."}, "lesson": 1}, {"text": {"en": "Check your Z scale and Location Z in terrain_notes.md against the worked example. Check: a 260 m summit would give 58.6 and 11000 cm, and your own numbers follow the same sum.", "uk": "Звір масштаб Z і Location Z у terrain_notes.md із розв'язаним прикладом. Перевірка: верхівка 260 м дає 58,6 і 11000 см, а твої числа обчислено так само."}, "lesson": 1}, {"text": {"en": "Open island_height_r1.kra with your map at 40 % over the terrain. Check: the canvas is 2017 x 2017, and you can see both the map and the terrain.", "uk": "Відкрий island_height_r1.kra з мапою на 40 % поверх рельєфу. Перевірка: полотно 2017 × 2017, видно і мапу, і рельєф."}, "lesson": 2}, {"text": {"en": "Move, turn and scale the terrain (Ctrl+T) so its land sits under your map's land. Fill any empty edge with black on a bottom layer. Check: the real hills sit inside your coast.", "uk": "Пересунь, поверни й зміни масштаб рельєфу (Ctrl+T), щоб його суша лягла під сушу мапи. Порожній край залий чорним на нижньому шарі. Перевірка: справжні пагорби стоять усередині твого узбережжя."}, "lesson": 2}, {"text": {"en": "Paint the land to the map: sea out with dark grey, missing land in with lighter greys, the summit where the map puts it. Check: with the map layer shown, the grey coast follows the map's coast all round.", "uk": "Підмалюй сушу під мапу: море — темно-сірим, суша, якої бракує, — світлішими сірими, верхівка — там, де її ставить мапа. Перевірка: коли шар мапи видно, сіре узбережжя всюди йде за узбережжям мапи."}, "lesson": 2}, {"text": {"en": "Hide the map layer, blur 3 px, stretch with Levels and export island_height_r1.png again (16-bit, no alpha). Check: the file reopens in Krita as 2017 x 2017, Grayscale, 16-bit, with the deepest sea pure black and the summit pure white.", "uk": "Сховай шар мапи, розмий на 3 px, розтягни сірі через Levels і знову експортуй island_height_r1.png (16 біт, без альфа-каналу). Перевірка: файл знову відкривається в Krita як 2017 × 2017, Grayscale, 16-bit, найглибше море чисто чорне, а верхівка чисто біла."}, "lesson": 2}, {"text": {"en": "Open L_Island from Content/Island/Maps. If you made it in lesson 3 and imported a first version, delete that landscape now. Check: L_Island shows in the editor's title bar.", "uk": "Відкрий L_Island з Content/Island/Maps. Якщо на уроці 3 в ньому вже імпортовано першу версію ландшафту, видали її зараз. Перевірка: у заголовку вікна редактора — L_Island."}, "lesson": 3}, {"text": {"en": "Import the landscape from your final island_height_r1.png with your numbers. Check: the island appears. In Details, Location Z is your number and Scale is 100, 100 and your Z scale. Location X and Y may read about -100800: Unreal stores the corner, and the centre sits on 0, 0.", "uk": "Імпортуй ландшафт зі свого остаточного island_height_r1.png зі своїми числами. Перевірка: острів з'явився. У Details: Location Z — твоє число, Scale — 100, 100 і твій масштаб Z. Location X і Y можуть показувати близько -100800: Unreal записує кут ландшафту, а центр стоїть у 0, 0."}, "lesson": 3}, {"text": {"en": "Light it with Env. Light Mixer and set Engine Scalability to High. Weak PC (4 GB graphics card, or a slow editor on 16 GB): choose Medium (see 'A weak PC' in ACCOUNTS-AND-INSTALLS.html). Then File > Save All. Check: sky, sun and haze are in, and the editor runs smoothly.", "uk": "Освітли рівень через Env. Light Mixer і постав Engine Scalability на High. Слабкий ПК (відеокарта з 4 ГБ або редактор гальмує на 16 ГБ): вибери Medium (див. розділ «Слабкий ПК» на сторінці ACCOUNTS-AND-INSTALLS.html). Потім File > Save All. Перевірка: є небо, сонце й серпанок, а редактор працює плавно."}, "lesson": 3}, {"text": {"en": "Summit check with a 1 m cube. Change Scale Z if it's more than 5 m out, and note the final number. Check: terrain_notes.md has the summit check with both heights.", "uk": "Перевір верхівку кубом 1 м. Якщо розбіжність більша за 5 м, зміни Scale Z і запиши остаточне число. Перевірка: у terrain_notes.md є перевірка верхівки з обома висотами."}, "lesson": 4}, {"text": {"en": "Coast check with the Z = 0 plane in a Top view against your map; change Location Z in 1 m steps (100). Save the screenshot laid over your map as coast_check.png. Check: the two coasts sit within about 20 m.", "uk": "Перевір узбережжя: згори (вид Top) порівняй площину на Z = 0 зі своєю мапою. Змінюй Location Z кроками по 1 м (100). Скриншот, накладений на мапу, збережи як coast_check.png. Перевірка: два узбережжя розходяться не більш ніж приблизно на 20 м."}, "lesson": 4}, {"text": {"en": "File > Save All, close L_Island and open it again. Fly CAM_Survey round the island at about 150 m. Check: the landscape and CAM_Survey are in the Outliner, and the whole coast and both district areas show. Land missing? Load it in the World Partition Editor, as in lesson 4.", "uk": "File > Save All, закрий L_Island і відкрий знову. Облети острів камерою CAM_Survey на висоті близько 150 м. Перевірка: ландшафт і CAM_Survey є в Outliner, видно все узбережжя й обидві ділянки районів. Суші немає? Завантаж її в World Partition Editor, як на уроці 4."}, "lesson": 4}, {"text": {"en": "Report and hand-in: click Copy the day report at the bottom of the page, paste it into a new chat and answer. Open summary.md in Notepad, press Ctrl+End, paste the answer and press Ctrl+S. Then drag the files on the Hand in list into your hand-in folder. Check: every name shows in the folder, each with a size.", "uk": "Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: кожна назва зі списку є в папці, у кожної є розмір."}, "lesson": "D0.1"}]}, "lessons": [{"title": {"en": "Heightmaps: 16 bits, landscape sizes and Z scale", "uk": "Карти висот: 16 біт, розміри ландшафту й масштаб Z"}, "minutes": 40, "goals": [{"en": "Explain a heightmap: a grey picture where each pixel's brightness is a height, black lowest and white highest. Unreal turns it into a landscape, its big ground surface, made of a grid of points.", "uk": "Пояснювати, що таке карта висот: сіре зображення, де яскравість кожного пікселя — це висота (чорне — найнижче, біле — найвище). Unreal робить із нього ландшафт — велику поверхню землі. Ландшафт складається із сітки точок."}, {"en": "Explain why 16 bits: a 16-bit picture has 65,536 grey steps, an 8-bit one only 256. With 256 the slopes become stair-like steps: on a 300 m range, one every 1.2 m.", "uk": "Пояснювати, навіщо 16 біт: 16-бітне зображення має 65 536 відтінків сірого, а 8-бітне — лише 256. На 8-бітній карті схили стають сходинками: при перепаді 300 м — сходинка кожні 1,2 м."}, {"en": "Pick a landscape size: 2017 x 2017 grid points, 1 m apart, make 2,016 m. That is enough for a 1 km island in its own sea.", "uk": "Вибирати розмір ландшафту: 2017 × 2017 точок сітки через 1 м дають 2 016 м. Цього досить для острова 1 км із власним морем навколо."}, {"en": "Work out two import numbers. Z scale says how many metres the greys stretch over: at 100, black to white is 512 m. So Z scale = height range in metres x 0.1953125. Location Z is the height of the middle grey: the middle of your range.", "uk": "Обчислювати два числа для імпорту. Масштаб Z каже, на скільки метрів розтягнуться відтінки сірого: при 100 від чорного до білого — 512 м. Тому масштаб Z = перепад висот у метрах × 0,1953125. Location Z — висота середнього сірого, тобто середина твого перепаду."}], "doalong": [{"en": "Open https://manticorp.github.io/unrealheightmap/, a free generator that turns real terrain data into a 16-bit picture. In OpenStreetMap, find your place: the address bar ends in #map=zoom/latitude/longitude. Type the latitude and longitude into the generator's boxes. You should see an orange box round your place.", "uk": "Відкрий https://manticorp.github.io/unrealheightmap/ — безкоштовний генератор, який перетворює справжні дані рельєфу на 16-бітне зображення. Знайди своє місце в OpenStreetMap: адреса в браузері закінчується на #map=масштаб/широта/довгота. Введи широту й довготу в поля генератора. Навколо місця з'являється помаранчева рамка."}, {"en": "Set Default Sizes to 2017 x 2017, Output Format to PNG - 16 Bit and Norm. Mode to Smart. You should see 2017 in both size boxes.", "uk": "Постав Default Sizes на 2017 × 2017, Output Format — на PNG - 16 Bit, а Norm. Mode — на Smart. Має вийти: в обох полях розміру 2017."}, {"en": "Set Output Zoom to 16, or 17 if your place is under 1 km across; the land should fill about half the box. Click Generate Heightmap and save the file as real_height.png in Day26. You should get a grey picture with dark sea and lighter land.", "uk": "Постав Output Zoom на 16 або на 17, якщо місце менше за 1 км; суша має займати близько половини рамки. Клацни Generate Heightmap і збережи файл у Day26 як real_height.png. Має вийти сіре зображення з темним морем і світлішою сушею."}, {"en": "Add a line to credits.md: 'real_height.png: elevation data from Mapzen terrain tiles (Tilezen Joerd); sources at https://github.com/tilezen/joerd/blob/master/docs/attribution.md; made with manticorp.github.io/unrealheightmap'. If the site fails, try later or ask the tutor. In the worst case, paint the whole height yourself in lesson 2. You should see the credit beside your photos.", "uk": "Додай рядок у credits.md: «real_height.png: elevation data from Mapzen terrain tiles (Tilezen Joerd); sources at https://github.com/tilezen/joerd/blob/master/docs/attribution.md; made with manticorp.github.io/unrealheightmap». Якщо сайт не працює, спробуй пізніше або спитай тьютора. У найгіршому разі намалюєш усю висоту власноруч на уроці 2. Рядок авторства стоїть поруч із фото."}, {"en": "Open real_height.png in Krita and read the colour space in the status bar at the bottom (or Image > Properties). It should say Grayscale (or GRAYA) and 16-bit integer. If it says 8-bit, use Image > Convert Image Color Space: Grayscale/Alpha, 16-bit integer/channel. You should see 16-bit for your file.", "uk": "Відкрий real_height.png у Krita і прочитай колірний простір у рядку стану внизу (або Image > Properties). Має бути Grayscale (або GRAYA) і 16-bit integer. Якщо там 8-bit, зроби Image > Convert Image Color Space: Grayscale/Alpha, 16-bit integer/channel. Має вийти: файл 16-бітний."}, {"en": "Follow the worked example. A sea floor of -40 m and a summit of 260 m give a range of 300 m. Z scale = 300 x 0.1953125 = 58.6. Location Z = (260 + (-40)) ÷ 2 = 110 m, typed as 11000 cm. You should be able to repeat each step.", "uk": "Пройди розв'язаний приклад. Дно моря −40 м і верхівка 260 м дають перепад 300 м. Масштаб Z = 300 × 0,1953125 = 58,6. Location Z = (260 + (−40)) ÷ 2 = 110 м; вводиш 11000 (см). Повтори кожен крок самостійно."}, {"en": "Do the same with your own summit from map_notes.md. Write both numbers in a new file, terrain_notes.md. You should have two numbers ready for the import.", "uk": "Зроби те саме зі своєю верхівкою з map_notes.md. Запиши обидва числа в новий файл terrain_notes.md. Має вийти два числа, готові для імпорту."}], "play": {"en": "Number duel: the tutor gives me three islands (summits of 140 m, 380 m and 50 m, each with a sea floor at -40 m). I give the Z scale and Location Z for each before it does.", "uk": "Дуель чисел: тьютор дає мені три острови (верхівки 140 м, 380 м і 50 м, дно моря скрізь −40 м). Я називаю масштаб Z і Location Z для кожного раніше за нього."}, "video": {"url": "https://www.youtube.com/watch?v=u7u6Lam-p5k", "title": "How to Create & Import 16-bit Heightmaps for Unreal Engine 5.7 (Step-by-Step)", "channel": "Unreal Fusion", "length": "5:52", "search": "unreal engine 5 16-bit heightmap import"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Карти висот: 16 біт, розміри ландшафту й масштаб Z (Day 26, lesson 1 of 4). Today's build: L_Island із ландшафтом твого острова: карту висот island_height_r1.png (16 біт, 2017 × 2017 px) імпортовано так, що між сусідніми точками сітки рівно 1 м. Верхівку й берег звірено з мапою..\nWhat I already know: День 22: island_map.png і map_notes.md (узбережжя, висота верхівки й райони); День 21: твоє реальне місце і його найвища точка; День 0: проєкт IslandCourse із плагіном Water; День 6: розстановка акторів числами на панелі Details.\n\nBy the end of this lesson I can:\n1. Пояснювати, що таке карта висот: сіре зображення, де яскравість кожного пікселя — це висота (чорне — найнижче, біле — найвище). Unreal робить із нього ландшафт — велику поверхню землі. Ландшафт складається із сітки точок.\n2. Пояснювати, навіщо 16 біт: 16-бітне зображення має 65 536 відтінків сірого, а 8-бітне — лише 256. На 8-бітній карті схили стають сходинками: при перепаді 300 м — сходинка кожні 1,2 м.\n3. Вибирати розмір ландшафту: 2017 × 2017 точок сітки через 1 м дають 2 016 м. Цього досить для острова 1 км із власним морем навколо.\n4. Обчислювати два числа для імпорту. Масштаб Z каже, на скільки метрів розтягнуться відтінки сірого: при 100 від чорного до білого — 512 м. Тому масштаб Z = перепад висот у метрах × 0,1953125. Location Z — висота середнього сірого, тобто середина твого перепаду.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: За п'ять тижнів з'явилися твій власний набір для гавані, освітлений куточок гавані й план цілого острова за справжнім місцем. Today: Сьогодні ти створюєш L_Island — рівень Open World — та імпортуєш ландшафт 2 км зі справжньої карти висот, підігнаної під твою мапу. One encouraging line: Сьогодні твій острів стає справжньою землею, тож насолодися першим польотом над ним, перш ніж перевіряти висоти.); 2 lines on why today matters and where it comes back, in plain words (from this: Справжній рельєф несе логіку води: долини стікають до моря, а хребти розгалужуються. Справжня карта висот, підігнана під твою мапу, дає правдоподібні пагорби за пів дня, а ліплення з рівної землі забирає дні. Студії перевіряють числа масштабу ще до ліплення, бо кожна дорога, будинок і політ потім стоятимуть на цій землі. It comes back: Далі весь курс іде в L_Island. Завтра ти ліпиш рельєф, у День 28 і День 29 додаєш узбережжя й воду, у День 31 — дороги, а з Дня 41 — обидва райони. Завтра terrain_notes.md поповниться.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-26-l-island-heightmap exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (карта висот, перероблена в Krita (разом з уроками)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Відкрий https://manticorp.github.io/unrealheightmap/ — безкоштовний генератор, який пе гори. Постав цьому шару непрозорість 40 %. Збережи як island_height_r1.kra. Узбережжя мапи лежить поверх справжнього рельєфу."}, {"en": "Select the terrain layer, press Ctrl+T, then move, turn and scale it until its land sits under your map's land. If an edge goes empty, add a bottom layer filled with pure black. You should see the real hills inside your coast.", "uk": "Вибери шар рельєфу, натисни Ctrl+T і пересувай, повертай та змінюй масштаб, поки його суша не ляже під сушу мапи. Якщо край лишився порожнім, додай знизу шар, залитий чисто чорним. Справжні пагорби тепер усередині твого узбережжя."}, {"en": "With a large soft brush, paint out land that should be sea in dark grey, and add missing land in lighter greys. Keep the brightest part where the map's summit is. This is a first rough go; you finish it in the build. You should see the grey land follow the map's coast.", "uk": "Великим м'яким пензлем зафарбуй темно-сірим сушу, яка має бути морем, і додай світлішими сірими сушу, якої бракує. Найяскравіше місце лиши там, де на мапі верхівка. Це перша груба спроба: доробиш її в самостійній роботі. Сіра суша йде за узбережжям мапи."}, {"en": "Hide the map layer. Choose Filter > Blur > Gaussian Blur, 3 px. Then Filter > Adjust > Levels: drag the black and white input markers to the ends of the histogram, the graph of greys. You should see the deepest sea pure black and the summit pure white.", "uk": "Сховай шар мапи. Вибери Filter > Blur > Gaussian Blur, 3 px. Потім Filter > Adjust > Levels: перетягни чорний і білий повзунки входу до країв гістограми — графіка відтінків сірого. Має вийти: найглибше море чисто чорне, верхівка чисто біла."}, {"en": "File > Export as island_height_r1.png, with the map layer still hidden. In the PNG options untick Store alpha channel, and leave any 8-bit option unticked. Reopen the file. You should see 2017 x 2017 and 16-bit in the status bar.", "uk": "File > Export як island_height_r1.png, шар мапи досі схований. У параметрах PNG зніми п ts) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}, {"title": {"en": "L_Island: an Open World level and the landscape import", "uk": "L_Island: рівень Open World та імпорт ландшафту"}, "minutes": 40, "goals": [{"en": "Explain World Partition: Unreal's system for big worlds. It splits a level into cells, squares of ground, and loads only those near the camera. An Open World level uses it from the start; Day 33 goes deeper.", "uk": "Пояснювати, що таке World Partition: система Unreal для великих світів. Вона ділить рівень на комірки — квадрати землі — і завантажує лише ті, що поруч із камерою. Рівень Open World використовує її від початку; докладніше — у День 33."}, {"en": "Create L_Island with File > New Level > Empty Open World and save it in Content/Island/Maps.", "uk": "Створювати L_Island через File > New Level > Empty Open World і зберігати його в Content/Island/Maps."}, {"en": "Import a heightmap in Landscape mode with your numbers, and light the empty level with Env. Light Mixer. Unreal 5.8 always gives a new landscape Edit Layers, which let the Water plugin change the ground without wrecking your sculpting.", "uk": "Імпортувати карту висот у Landscape mode зі своїми числами й освітлювати порожній рівень через Env. Light Mixer. Unreal 5.8 завжди дає новому ландшафту Edit Layers — шари, які дозволяють плагіну Water змінювати землю, не псуючи твого ліплення."}], "doalong": [{"en": "In IslandCourse's Content Browser, right-click > New Folder and make Island, and inside it Maps. You should see Content/Island/Maps.", "uk": "У Content Browser проєкту IslandCourse клацни правою кнопкою > New Folder і створи Island, а в ній — Maps. Має вийти Content/Island/Maps."}, {"en": "File > New Level > Empty Open World > Create. Then File > Save Current Level As, choose Island/Maps and name it L_Island. You should see L_Island in the title bar and in the folder.", "uk": "File > New Level > Empty Open World > Create. Потім File > Save Current Level As, вибери Island/Maps і назви рівень L_Island. L_Island видно в заголовку вікна й у папці."}, {"en": "Open Landscape mode: the mode drop-down at the top left (it says Selection) > Landscape, or Shift+2. Click Manage, then New, then Import from File, and pick island_height_r1.png. You should see the resolution read 2017 x 2017.", "uk": "Відкрий Landscape mode: спадне меню режимів угорі ліворуч (там написано Selection) > Landscape або Shift+2. Клацни Manage, потім New, потім Import from File і вибери island_height_r1.png. Роздільність показує 2017 × 2017."}, {"en": "Set Location X 0, Y 0 and Z your Location Z in cm; Scale X 100, Y 100 and Z your Z scale. There is no Edit Layers box: 5.8 turns them on for every new landscape. Click Import. You should see your island appear in grey after a short wait.", "uk": "Постав Location X 0, Y 0, а Z — свій Location Z у сантиметрах. Scale: X 100, Y 100, а Z — свій масштаб Z. Прапорця Edit Layers немає: 5.8 вмикає їх для кожного нового ландшафту. Клацни Import. За мить з'являється сірий острів."}, {"en": "Window > Env. Light Mixer: click each button it offers (Sky Light, Atmospheric Light, Sky Atmosphere, Volumetric Cloud, Height Fog). You should see sky, sun and haze appear.", "uk": "Window > Env. Light Mixer: клацни кожну кнопку, яку він пропонує (Sky Light, Atmospheric Light, Sky Atmosphere, Volumetric Cloud, Height Fog). З'являються небо, сонце й серпанок."}, {"en": "Settings > Engine Scalability Settings > High; on a weak PC, Medium. Then File > Save All. You should see the editor run smoothly and no star (unsaved mark) on L_Island's tab.", "uk": "Settings > Engine Scalability Settings > High; на слабкому ПК — Medium. Потім File > Save All. Редактор працює плавно, а на вкладці L_Island немає зірочки (знака незбережених зм  0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (карта висот, перероблена в Krita (разом з уроками)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. У Content Browser проєкту IslandCourse клацни правою кнопкою > New Folder і створи Island, а в ній — Maps. Має вийти Content/Island/Maps.\n   2. File > New Level > Empty Open World > Create. Потім File > Save Current Level As, вибери Island/Maps і назви рівень L_Island. L_Island видно в заголовку вікна й у папці.\n   3. Відкрий Landscape mode: спадне меню режимів угорі ліворуч (там написано Selection) > Landscape або Shift+2. Клацни Manage, потім New, потім Import from File і вибери island_height_r1.png. Роздільність показує 2017 × 2017. [screenshot]\n   4. Постав Location X 0, Y 0, а Z — свій Location Z у сантиметрах. Scale: X 100, Y 100, а Z — свій масштаб Z. Прапорця Edit Layers немає: 5.8 вмикає їх для кожного нового ландшафту. Клацни Import. За мить з'являється сірий острів.\n   5. Window > Env. Light Mixer: клацни кожну кнопку, яку він пропонує (Sky Light, Atmospheric Light, Sky Atmosphere, Volumetric Cloud, Height Fog). З'являються небо, сонце й серпанок.\n   6. Settings > Engine Scalability Settings > High; на слабкому ПК — Medium. Потім File > Save All. Редактор працює плавно, а на вкладці L_Island немає зірочки (знака незбережених змін). [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Вікторина імпорту: тьютор зачитує п'ять параметрів імпорту (розмір 4033, Scale Z 100, Location Z 0, Scale X 50, 8-бітний файл). Я кажу, які з них хибні для мого острова і чому. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\nIf I want to go deeper, recommend this free video: \"How to Import Landscape Heightmaps in Unreal Engine 5\" by Gorka Games: https://www.youtube.com/watch?v=HwMgVavXXvY\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut ense). Never ask about my gender."}, {"title": {"en": "Checking the import: summit, coast and a first flight", "uk": "Перевіряємо імпорт: верхівка, узбережжя й перший проліт"}, "minutes": 40, "goals": [{"en": "Check the height: a 1 m cube dropped on the summit shows the real height in its Z.", "uk": "Перевіряти висоту: куб 1 м, опущений на верхівку, показує справжню висоту у своєму Z."}, {"en": "Check the coast: a flat plane at Z = 0 stands in for the sea. From a Top view the shoreline should match your map within about 20 m.", "uk": "Перевіряти узбережжя: рівна площина на Z = 0 заміняє море. Згори (вид Top) берег має збігатися з мапою з точністю до 20 м."}, {"en": "Fly at a known height with a piloted Cine Camera, and bring back land that World Partition has unloaded.", "uk": "Літати на відомій висоті з керованою Cine Camera й повертати сушу, яку World Partition вивантажила."}], "doalong": [{"en": "Place Actors (the + button on the toolbar) > Shapes > Cube. Move it over your summit and press End to drop it onto the ground. Its Z in Details minus 50 is the summit's height in cm. You should be within 5 m of your map; if not, change the landscape's Scale Z and note the new number.", "uk": "Place Actors (кнопка + на панелі інструментів) > Shapes > Cube. Пересунь його над верхівку й опусти на землю клавішею End. Його Z у Details мінус 50 — це висота верхівки в сантиметрах. Розбіжність із мапою має бути до 5 м. Якщо більше, зміни Scale Z ландшафту й запиши нове число."}, {"en": "Place a Plane at Location 0, 0, 0 with Scale 2000, 2000, 1 (2 km across). You should see a flat sheet cutting the land at sea level.", "uk": "Постав Plane у Location 0, 0, 0 зі Scale 2000, 2000, 1 (2 км завширшки). Рівна площина розтинає сушу на рівні моря."}, {"en": "Switch the viewport to Top (the Perspective menu at the top left > Top) and Unlit (the Lit menu > Unlit). Zoom the Top view until the 2 km plane fills the screen. Take a screenshot (Win+Shift+S) and lay it over island_map.png in Krita. Scale it (Ctrl+T) until the plane's edges meet the edges of the 2000 x 2000 px canvas: then 1 px = 1 m. You should see the two coasts within about 20 m.", "uk": "Перемкни в'юпорт на вид Top (меню Perspective угорі ліворуч > Top) і Unlit (меню Lit > Unlit). Наблизь вид Top так, щоб площина 2 км заповнила екран. Зроби скриншот (Win+Shift+S) і наклади його на island_map.png у Krita. Масштабуй скриншот (Ctrl+T), доки краї площини не зійдуться з краями полотна 2000 × 2000 px — тоді 1 px = 1 м. Має вийти: два узбережжя розходяться не більш ніж приблизно на 20 м."}, {"en": "Too big or too small? Move the landscape's Location Z down or up in steps of 100 (1 m) and look again. You should see the coasts come together.", "uk": "Острів завеликий чи замалий? Опускай або піднімай Location Z ландшафту кроками по 100 (1 м) і дивися знову. Узбережжя сходяться."}, {"en": "Back to Perspective and Lit. Place Actors > Cinematic > Cine Camera Actor, name it CAM_Survey and set Location Z to 15000 (150 m). Right-click it > Pilot. Hold the right mouse button: W, A, S, D move, E rises, Q sinks. You should see the island from about 150 m.", "uk": "Повернися в Perspective і Lit. Place Actors > Cinematic > Cine Camera Actor, назви її CAM_Survey і постав Location Z 15000 (150 м). Клацни її правою кнопкою > Pilot. Утримуй праву кнопку миші: W, A, S, D — рух, E — угору, Q — униз. Острів видно з висоти близько 150 м."}, {"en": "If you reopen L_Island and the land is missing: Window > World Partition > World Partition Editor. Drag a box over the whole grid, right-click > Load Region from Selection. You should see the landscape come back.", "uk": "Якщо після повторного відкриття L_Island суші немає: Window > World Partition > World Partition Editor. Обведи рамкою всю сітку, клацни правою кнопкою > Load Region from Selection. Ландшафт повертається."}], "play": {"en": "Calibration race: the tutor sets a target ('the plane must meet the coast at the harbour'). I change Location Z in 1 m steps and describe each Top-view result until it matches.", "uk": "Перегони калібрування: тьютор ставить ціль («площина має сходитися з берегом біля гавані»). Я змінюю Location Z кроками по 1 м і описую кожен результат згори (вид Top), доки не збіжеться."}, "video": {"search": "unreal engine 5 landscape heightmap scale and location z"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Перевіряємо імпорт: верхівка, узбережжя й перший проліт (Day 26, lesson 4 of 4). Today's build: L_Island із ландшафтом твого острова: карту висот island_height_r1.png (16 біт, 2017 × 2017 px) імпортовано так, що між сусідніми точками сітки рівно 1 м. Верхівку й берег звірено з мапою..\nWhat I already know: День 22: island_map.png і map_notes.md (узбережжя, висота верхівки й райони); День 21: твоє реальне місце і його найвища точка; День 0: проєкт IslandCourse із плагіном Water; День 6: розстановка акторів числами на панелі Details.\nEarlier today I already did: lesson 1 (Карти висот: 16 біт, розміри ландшафту й масштаб Z); lesson 2 (Переробляємо карту висот під твою мапу в Krita); lesson 3 (L_Island: рівень Open World та імпорт ландшафту). Things made there exist n at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Place Actors (кнопка + на панелі інструментів) > Shapes > Cube. Пересунь його над верхівку й опусти на землю клавішею End. Його Z у Details мінус 50 — це висота верхівки в сантиметрах. Розбіжність із мапою має бути до 5 м. Якщо більше, зміни Scale Z ландшафту й запиши нове число.\n   2. Постав Plane у Location 0, 0, 0 зі Scale 2000, 2000, 1 (2 км завширшки). Рівна площина розтинає сушу на рівні моря.\n   3. Перемкни в'юпорт на вид Top (меню Perspective угорі ліворуч > Top) і Unlit (меню Lit > Unlit). Наблизь вид Top так, щоб площина 2 км заповнила екран. Зроби скриншот (Win+Shift+S) і наклади його на island_map.png у Krita. Масштабуй скриншот (Ctrl+T), доки краї площини не зійдуться з краями полотна 2000 × 2000 px — тоді 1 px = 1 м. Має вийти: два узбережжя розходяться не більш ніж приблизно на 20 м. [screenshot]\n   4. Острів завеликий чи замалий? Опускай або піднімай Location Z ландшафту кроками по 100 (1 м) і дивися знову. Узбережжя сходяться.\n   5. Повернися в Perspective і Lit. Place Actors > Cinematic > Cine Camera Actor, назви її CAM_Survey і постав Location Z 15000 (150 м). Клацни її правою кнопкою > Pilot. Утримуй праву кнопку миші: W, A, S, D — рух, E — угору, Q — униз. Острів видно з висоти близько 150 м.\n   6. Якщо після повторного відкриття L_Island суші немає: Window > World Partition > World Partition Editor. Обведи рамкою всю сітку, клацни правою кнопкою > Load Region from Selection. Ландшафт повертається. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Перегони калібрування: тьютор ставить ціль («площина має сходитися з берегом біля гавані»). Я змінюю Location Z кроками по 1 м і описую кожен результат згори (вид Top), доки не збіжеться. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; breakdown = розбір; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; File Explorer = Провідник; grid = сітка (тільки grid, ніколи mesh); vertex / edge / face = вершина / ребро / грань; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; volume (PCG Volume, Post Process Volume) = об'єм; kit / kit piece / part of one object = набір / деталь / частина; map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; district / plot / plot plan = район / ділянка / план ділянки; harbour / quay / waterfront / pier = гавань / причал / набережна / пірс; summit, hilltop = верхівка; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}], "handin": [{"en": "summary.md", "uk": "summary.md (звіт дня)"}, {"en": "terrain_notes.md: range, Z scale, Location Z, the summit check and the coast check (→ Day 27)", "uk": "terrain_notes.md (перепад, масштаб Z, Location Z, перевірка верхівки й узбережжя) (→ День 27)"}, {"en": "coast_check.png: the Top view over your map (proof)", "uk": "coast_check.png (вид Top поверх мапи) (доказ)"}], "goal": {"en": "By the end of today you have L_Island, an Open World level with a 2 km landscape. It comes from a real 16-bit heightmap, reshaped to your map and checked.", "uk": "До кінця дня в тебе є L_Island — рівень Open World із ландшафтом 2 км. Він зроблений зі справжньої 16-бітної карти висот, перероблений під твою мапу й перевірений."}, "uses": [{"en": "Day 22: island_map.png and map_notes.md (the coast, the summit height and the districts)", "uk": "День 22: island_map.png і map_notes.md (узбережжя, висота верхівки й райони)"}, {"en": "Day 21: your real place and its highest point", "uk": "День 21: твоє реальне місце і його найвища точка"}, {"en": "Day 0: the IslandCourse project with the Water plugin", "uk": "День 0: проєкт IslandCourse із плагіном Water"}, {"en": "Day 6: placing actors by typed numbers in the Details panel", "uk": "День 6: розстановка акторів числами на панелі Details"}], "quiz": [{"q": {"en": "Your summit is 180 m and your sea floor is -40 m. What Z scale do you type?", "uk": "Твоя верхівка — 180 м, а дно моря — −40 м. Який масштаб Z ти вводиш?"}, "options": [{"en": "100", "uk": "100"}, {"en": "About 43", "uk": "Близько 43"}, {"en": "About 35", "uk": "Близько 35"}, {"en": "220", "uk": "220"}], "answer": 1, "explain": {"en": "The range is 220 m, and 220 x 0.1953125 = 43. The Location Z is the middle of the range: 70 m, typed as 7000 cm.", "uk": "Перепад — 220 м, а 220 × 0,1953125 = 43. Location Z — середина перепаду: 70 м, тобто вводиш 7000 (см)."}}, {"q": {"en": "After import, your hills look like stairs, with a step every metre or so. What is the likely cause?", "uk": "Після імпорту пагорби схожі на сходи, зі сходинкою приблизно щометра. Яка ймовірна причина?"}, "options": [{"en": "The heightmap was 8-bit, so it only had 256 grey steps.", "uk": "Карта висот була 8-бітною, тож мала лише 256 відтінків сірого."}, {"en": "Scale Z is too small.", "uk": "Scale Z замалий."}, {"en": "The landscape has Edit Layers.", "uk": "Ландшафт має Edit Layers."}, {"en": "The sun is too low.", "uk": "Сонце надто низько."}], "answer": 0, "explain": {"en": "8 bits give only 256 heights across the whole range. Use a 16-bit file, with 65,536 steps.", "uk": "8 біт дають лише 256 висот на весь перепад. Бери 16-бітний файл із 65 536 відтінками."}}, {"q": {"en": "What does Location Z do at import?", "uk": "Що робить Location Z під час імпорту?"}, "options": [{"en": "It sets the landscape's resolution.", "uk": "Встановлює роздільність ландшафту."}, {"en": "It moves the whole landscape up or down, so sea level lands at Z = 0.", "uk": "Піднімає або опускає весь ландшафт, щоб рівень моря опинився на Z = 0."}, {"en": "It sets the sea colour.", "uk": "Встановлює колір моря."}, {"en": "It turns World Partition on.", "uk": "Вмикає World Partition."}], "answer": 1, "explain": {"en": "Location Z places the middle of your height range. With the right value, the -40 m sea floor and your summit land at their true heights.", "uk": "Location Z ставить середину перепаду висот. З правильним значенням дно моря на −40 м і твоя верхівка опиняються на своїх справжніх висотах."}}, {"q": {"en": "You reopen L_Island and the landscape is gone, though the Outliner still lists landscape pieces. What do you try first?", "uk": "Ти знову відкриваєш L_Island, а ландшафту немає, хоча Outliner досі показує його частини. Що ти пробуєш насамперед?"}, "options": [{"en": "Import the heightmap again.", "uk": "Імпортую карту висот ще раз."}, {"en": "Delete the level.", "uk": "Видаляю рівень."}, {"en": "Raise Engine Scalability to Epic.", "uk": "Піднімаю Engine Scalability до Epic."}, {"en": "Open the World Partition Editor, select the whole grid and Load Region from Selection.", "uk": "Відкриваю World Partition Editor, виділяю всю сітку й роблю Load Region from Selection."}], "answer": 3, "explain": {"en": "World Partition loads cells only when asked. The land is still there; it just isn't loaded.", "uk": "World Partition завантажує комірки лише на запит. Суша нікуди не зникла, вона просто не завантажена."}}, {"q": {"en": "The Z = 0 plane shows your island 60 m wider than the map all round. What do you change?", "uk": "Площина на Z = 0 показує, що твій острів на 60 м ширший за мапу з усіх боків. Що ти змінюєш?"}, "options": [{"en": "Lower the landscape's Location Z in 1 m steps, checking the coast each time, then recheck the summit.", "uk": "Опускаю Location Z ландшафту кроками по 1 м, щоразу перевіряючи узбережжя, а потім знову перевіряю верхівку."}, {"en": "Raise Scale X and Y.", "uk": "Збільшую Scale X і Y."}, {"en": "Paint more sea and forget the map.", "uk": "Домальовую море і забуваю про мапу."}, {"en": "Nothing: 60 m is close enough.", "uk": "Нічого: 60 м — достатньо близько."}], "answer": 0, "explain": {"en": "Moving the landscape down puts its gentle edges under water, which pulls the coast in. The summit moves too, so check it again.", "uk": "Якщо опустити ландшафт, його пологі краї йдуть під воду, і берег відступає всередину. Верхівка теж зсувається, тож перевір її ще раз."}}], "weekInfo": {"week": 6, "title": {"en": "Terrain and water", "uk": "Рельєф і вода"}, "goal": {"en": "By Friday you have L_Island, a World Partition level with your island's terrain from a real heightmap, sculpted to your map, with rock-covered cliffs, beaches, an auto-material, the ocean, a lake and a river, seen from three locked drone cameras.", "uk": "До п'ятниці в тебе є L_Island — рівень World Partition із рельєфом острова зі справжньої карти висот, виліпленим за твоєю мапою. На ньому скелі, вкриті камінням, пляжі, автоматичний матеріал, океан, озеро й річка, і все це видно з трьох заблокованих камер дрона."}, "skills": [{"en": "Heightmap-based landscapes in Unreal Engine 5 (16-bit import, Z scale and calibration)", "uk": "Ландшафти з карти висот в Unreal Engine 5 (16-бітний імпорт, масштаб Z і калібрування)"}, {"en": "Landscape sculpting for gameplay and realism: flats, road ramps and erosion", "uk": "Ліплення ландшафту для геймплею й реалізму: рівні майданчики, полиці під дороги й ерозія"}, {"en": "Auto-landscape materials blended by slope and height", "uk": "Автоматичні матеріали ландшафту, що змішуються за схилом і висотою"}, {"en": "Unreal Water system: ocean, rivers and lakes that follow the terrain", "uk": "Система Water в Unreal: океан, річки й озера, що йдуть за рельєфом"}, {"en": "Cinematic camera set-up and shot review against reference photos", "uk": "Налаштування кінематографічних камер і перевірка кадрів за фото-референсами"}]}, "morning": {"sofar": {"en": "In five weeks you have built your own harbour kit, lit a harbour corner and planned a whole island from a real place.", "uk": "За п'ять тижнів з'явилися твій власний набір для гавані, освітлений куточок гавані й план цілого острова за справжнім місцем."}, "today": {"en": "You create L_Island, an Open World level, and import a 2 km landscape from a real heightmap, reshaped to your map.", "uk": "Сьогодні ти створюєш L_Island — рівень Open World — та імпортуєш ландшафт 2 км зі справжньої карти висот, підігнаної під твою мапу."}, "cheer": {"en": "Today your island becomes real ground, so enjoy that first flight across it before you start checking heights.", "uk": "Сьогодні твій острів стає справжньою землею, тож насолодися першим польотом над ним, перш ніж перевіряти висоти."}, "quote": {"text": {"en": "If you wish to make an apple pie from scratch, you must first invent the universe.", "uk": "Якщо хочеш спекти яблучний пиріг з нуля, спершу доведеться винайти всесвіт."}, "author": {"en": "Carl Sagan", "uk": "Карл Саган"}, "source": "https://en.wikiquote.org/wiki/Carl_Sagan"}}, "hasAssets": false, "workPath": "Work\\Assignment\\Day-26-l-island-heightmap", "mapHref": "../../COURSE.html", "prevHref": "../Day-25-boss-planning-pack/START-HERE.html", "nextHref": "../Day-27-sculpting-to-the-map/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in A web browser, Krita and Unreal Engine 5.8. I am a beginner on Day 26. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me and don't write code.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: L_Island, імпорт і калібрування — самостійно.\nIt's part of: L_Island із ландшафтом твого острова: карту висот island_height_r1.png (16 біт, 2017 × 2017 px) імпортовано так, що між сусідніми точками сітки рівно 1 м. Верхівку й берег звірено з мапою. (IslandCourse: новий рівень Empty Open World, збережений як Content/Island/Maps/L_Island. У ньому один ландшафт із 2017 × 2017 точок сітки через 1 м (квадрат 2 016 м) із центром у (0, 0). Рівень моря — Z = 0, а дно моря біля країв — близько −40 м.).\nWhy it matters: Справжній рельєф несе логіку води: долини стікають до моря, а хребти розгалужуються. Справжня карта висот, підігнана під твою мапу, дає правдоподібні пагорби за пів дня, а ліплення з рівної землі забирає дні. Студії перевіряють числа масштабу ще до ліплення, бо кожна дорога, будинок і політ потім стоятимуть на цій землі. It comes back: Далі весь курс іде в L_Island. Завтра ти ліпиш рельєф, у День 28 і День 29 додаєш узбережжя й воду, у День 31 — дороги, а з Дня 41 — обидва райони. Завтра terrain_notes.md поповниться.\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-26-l-island-heightmap (on the drive I chose on Day 0).\nWhat I already know: День 22: island_map.png і map_notes.md (узбережжя, висота верхівки й райони); День 21: твоє реальне місце і його найвища точка; День 0: проєкт IslandCourse із плагіном Water; День 6: розстановка акторів числами на панелі Details; today's lessons: Карти висот: 16 біт, розміри ландшафту й масштаб Z; Переробляємо карту висот під твою мапу в Krita; L_Island: рівень Open World та імпорт ландшафту; Перевіряємо імпорт: верхівка, узбережжя й перший проліт. Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- island_height_r1.png: 16-бітний сірий PNG 2017 × 2017 px, зроблений зі справжнього рельєфу. Його перероблено поверх island_map.png так, що узбережжя й верхівка стоять там, де каже мапа. Збережи й island_height_r1.kra.\n- Чисто чорний — це −40 м, дно моря біля країв, а чисто білий — твоя верхівка. Обчисли з цих двох чисел масштаб Z і Location Z та запиши їх у terrain_notes.md.\n- L_Island створено через File > New Level > Empty Open World і збережено як Content/Island/Maps/L_Island.\n- Ландшафт імпортовано через Landscape mode > Manage > New > Import from File. Location: X 0, Y 0 і твій Z. Scale: X 100, Y 100 і твій масштаб Z. У 5.8 Edit Layers увімкнено завжди, тож прапорця для них немає.\n- Світло з Window > Env. Light Mixer. Engine Scalability — High, а не Epic, щоб берегти пам'ять; на слабкому ПК — Medium.\n- Перевірено: верхівка відрізняється від висоти на мапі не більш ніж на 5 м (за кубом 1 м на ній). Узбережжя згори (вид Top) відрізняється від мапи приблизно на 20 м або менше; рівна площина на Z = 0 заміняє море.\n\nMy checklist (the same numbers show on my course page):\n1. Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: real_height.png, terrain_notes.md, island_height_r1.kra і .png. L_Island має бути в IslandCourse. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Потім додай рядок про real_height.png у credits.md. Перевірка: Krita показує для real_height.png Grayscale і 16-bit, а суша світліша за море. (from lesson 1)\n2. Звір масштаб Z і Location Z у terrain_notes.md із розв'язаним прикладом. Перевірка: верхівка 260 м дає 58,6 і 11000 см, а твої числа обчислено так само. (from lesson 1)\n3. Відкрий island_height_r1.kra з мапою на 40 % поверх рельєфу. Перевірка: полотно 2017 × 2017, видно і мапу, і рельєф. (from lesson 2)\n4. Пересунь, поверни й зміни масштаб рельєфу (Ctrl+T), щоб його суша лягла під сушу мапи. Порожній край залий чорним на нижньому шарі. Перевірка: справжні пагорби стоять усередині твого узбережжя. (from lesson 2)\n5. Підмалюй сушу під мапу: море — темно-сірим, суша, якої бракує, — світлішими сірими, верхівка — там, де її ставить мапа. Перевірка: коли шар мапи видно, сіре узбережжя всюди йде за узбережжям мапи. (from lesson 2)\n6. Сховай шар мапи, розмий на 3 px, розтягни сірі через Levels і знову експортуй island_height_r1.png (16 біт, без альфа-каналу). Перевірка: файл знову відкривається в Krita як 2017 × 2017, Grayscale, 16-bit, найглибше море чисто чорне, а верхівка чисто біла. (from lesson 2)\n7. Відкрий L_Island з Content/Island/Maps. Якщо на уроці 3 в ньому вже імпортовано першу версію ландшафту, видали її зараз. Перевірка: у заголовку вікна редактора — L_Island. (from lesson 3)\n8. Імпортуй ландшафт зі свого остаточного island_height_r1.png зі своїми числами. Перевірка: острів з'явився. У Details: Location Z — твоє число, Scale — 100, 100 і твій масштаб Z. Location X і Y можуть показувати близько -100800: Unreal записує кут ландшафту, а центр стоїть у 0, 0. (from lesson 3)\n9. Освітли рівень через Env. Light Mixer і постав Engine Scalability на High. Слабкий ПК (відеокарта з 4 ГБ або редактор гальмує на 16 ГБ): вибери Medium (див. розділ «Слабкий ПК» на сторінці ACCOUNTS-AND-INSTALLS.html). Потім File > Save All. Перевірка: є небо, сонце й серпанок, а редактор працює плавно. (from lesson 3)\n10. Перевір верхівку кубом 1 м. Якщо розбіжність більша за 5 м, зміни Scale Z і запиши остаточне число. Перевірка: у terrain_notes.md є перевірка верхівки з обома висотами. (from lesson 4)\n11. Перевір узбережжя: згори (вид Top) порівняй площину на Z = 0 зі своєю мапою. Змінюй Location Z кроками по 1 м (100). Скриншот, накладений на мапу, збережи як coast_check.png. Перевірка: два узбережжя розходяться не більш ніж приблизно на 20 м. (from lesson 4)\n12. File > Save All, закрий L_Island і відкрий знову. Облети острів камерою CAM_Survey на висоті близько 150 м. Перевірка: ландшафт і CAM_Survey є в Outliner, видно все узбережжя й обидві ділянки районів. Суші немає? Завантаж її в World Partition Editor, як на уроці 4. (from lesson 4)\n13. Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: кожна назва зі списку є в папці, у кожної є розмір. (from day 0, lesson 1)\n\nHow to help: ask which step number I'm on, then give me only the next step: the exact clicks and what I should see. When I send a screenshot, compare it with my reference, my sizes and the spec, and name one thing to fix at a time.\nCheck every save and export by reopening it before we move on:\n- a .md or .txt: open it with Notepad; the text is there, and the name doesn't end in .md.txt\nWhen I write \"готово\", and in any case before the day ends, check with me one item at a time (yes/no): each spec point, then each file on my hand-in list, ready in my day work folder (skip summary.md: the day report writes it next):\n1. terrain_notes.md (перепад, масштаб Z, Location Z, перевірка верхівки й узбережжя) (→ День 27)\n2. coast_check.png (вид Top поверх мапи) (доказ)\nFinish with a short list of anything missing, and one line on where this work comes back and what it will look like there. Then tell me the order for the end of the day: first the day report (the Copy the day report button at the bottom of my course page) into summary.md, and only then hand in all the files on the list, summary.md too.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; breakdown = розбір; checklist = чек-лист; credits line = рядок авторства; reference photo / hero photo = фото-референс / ключове фото; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; grid = сітка (тільки grid, ніколи mesh); vertex / edge / face = вершина / ребро / грань; world origin / 3D cursor = центр світу / 3D-курсор; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset /

<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 13</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

<script id="data" type="application/json">{"learner": "ib-anastasia-3be765b9", "learnerName": {"en": "Anastasia", "uk": "Анастасія"}, "day": 13, "week": 3, "total": 60, "title": {"en": "Trim sheets: T_Trim_Harbour and your first shop front", "uk": "Трим-шити: T_Trim_Harbour і твій перший фасад крамниці"}, "theme": {"en": "Week 3: Surfaces", "uk": "Тиждень 3: Поверхні"}, "build": {"item": {"en": "T_Trim_Harbour, a trim sheet for the whole harbour, and SM_ShopFront_A built with it", "uk": "T_Trim_Harbour, трим-шит для всієї гавані, і зібраний з ним SM_ShopFront_A"}, "why": {"en": "Today you paint one striped texture and dress a whole shop front with it: fascia, stone plinth, frames and door. One trim and one material can dress the edges of a whole street, which is why studios build harbour and city kits this way.", "uk": "Сьогодні ти малюєш одну смугасту текстуру й вдягаєш у неї цілий фасад крамниці: вивісну дошку, кам'яний цоколь, рами й двері. Один трим-шит з одним матеріалом може вкрити краї цілої вулиці, тому студії так і будують набори для гаваней і міст."}, "next": {"en": "SM_ShopFront_A lines the shop streets of district 1 (Day 42) and district 2 (Day 49). T_Trim_Harbour gets your island's colours on Day 16.", "uk": "SM_ShopFront_A вишикується вздовж торгових вулиць району 1 (День 42) і району 2 (День 49). У День 16 T_Trim_Harbour отримає кольори твого острова."}, "where": {"en": "Course/Day13 for the trim, its instance and the front; L_KitTest beside your small harbour building.", "uk": "Course/Day13 — для триму, його інстансу й фасаду. L_KitTest — поруч із твоєю маленькою будівлею в гавані."}, "spec": [{"en": "T_Trim_Harbour: 2048 x 2048 px at the kit standard, so the sheet is 2 m wide and every 512 px is 50 cm. Seven horizontal bands, like a striped flag; each strip tiles left to right with no visible seam.", "uk": "T_Trim_Harbour: 2048 × 2048 px за стандартом набору, тож трим-шит має 2 м завширшки, а кожні 512 px — це 50 см. Сім горизонтальних смуг, як у смугастому прапорі. Кожна смуга тайлиться зліва направо без помітного шва."}, {"en": "Seven strips from the top, in pixels: fascia paint 512, stone plinth and coping 512, timber boards 256 and frame paint 256. Then weathered planks 256, galvanised metal 128 and black rubber 128.", "uk": "Сім смуг згори, у пікселях: фарба вивісної дошки 512, кам'яний цоколь і бровка 512, дерев'яна обшивка 256 і фарба рам 256. Далі зношені дошки 256, оцинкований метал 128 і чорна гума 128."}, {"en": "Strip V ranges, with 0 at the bottom: strip 1 0.75 to 1, 2 0.5 to 0.75, 3 0.375 to 0.5, 4 0.25 to 0.375. Then 5 0.125 to 0.25, 6 0.0625 to 0.125, 7 0 to 0.0625.", "uk": "Діапазони V для смуг, 0 унизу: смуга 1 — від 0.75 до 1, 2 — від 0.5 до 0.75, 3 — від 0.375 до 0.5, 4 — від 0.25 до 0.375. Далі 5 — від 0.125 до 0.25, 6 — від 0.0625 до 0.125, 7 — від 0 до 0.0625."}, {"en": "SM_ShopFront_A: 4 m wide (two grid steps), 3 m tall like SM_Wall_2m and 0.3 m deep, with its front facing -Y like your walls. Pivot at the bottom left corner of its back face, so it can stand flat against any wall.", "uk": "SM_ShopFront_A: 4 м завширшки (два кроки сітки), 3 м заввишки, як SM_Wall_2m, і 0,3 м завглибшки. Лицем у бік -Y, як твої стіни. Origin — у нижньому лівому куті задньої грані, щоб фасад міг стати впритул до будь-якої стіни."}, {"en": "Real parts: a 2.2 m shop window over a 50 cm stone plinth, and a 1 m door. Above both, a 50 cm fascia board runs from 2.5 to 3 m, exactly the height of strip 1. Openings are recessed 10 to 15 cm.", "uk": "Справжні частини: вітрина 2,2 м над кам'яним цоколем 50 см і двері 1 м. Над ними на висоті від 2,5 до 3 м іде вивісна дошка 50 см — точно висота смуги 1. Прорізи заглиблені на 10–15 см."}, {"en": "Four slots: Trim for the long, thin parts, Plaster for the big flat wall, Door and Glass. In Unreal they take MI_Trim_Harbour, MI_Plaster, MI_Wood and MI_Glass. 5,000 triangles or fewer, with UCX boxes as in Week 1.", "uk": "Чотири слоти: Trim для довгих тонких частин, Plaster для великої пласкої стіни, Door і Glass. В Unreal вони отримують MI_Trim_Harbour, MI_Plaster, MI_Wood і MI_Glass. Не більше 5 000 трикутників, з блоками UCX, як на 1-му тижні."}, {"en": "Trim islands keep the kit density: a 50 cm part fills a 50 cm strip. Thin parts use part of a strip, and a strip is never squashed.", "uk": "Острівці на трим-шиті зберігають щільність набору: частина 50 см заповнює смугу 50 см. Тонкі частини займають частину смуги, а смугу ніколи не стискають."}], "piece1": "the trim sheet and the shop window part of the front (shared with the lessons)", "piece2": {"en": "The door, fascia, sill, slots, collision and export of SM_ShopFront_A, on your own", "uk": "Двері, вивісна дошка, підвіконня, слоти, колізія та експорт SM_ShopFront_A, самостійно"}, "steps": [{"text": {"en": "Check: the files from today's lessons are in the day work folder (buildkit_day13.blend with the window recessed, T_Trim_Harbour.kra and T_Trim_Harbour.png). Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it. MI_Trim_Harbour is in Course/Day13.", "uk": "Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: buildkit_day13.blend із заглибленим вікном, T_Trim_Harbour.kra і T_Trim_Harbour.png. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. MI_Trim_Harbour лежить у Course/Day13."}, "lesson": 1}, {"text": {"en": "In T_Trim_Harbour.kra fill strips 1, 3, 4, 6 and 7 with Rectangular Selection and Shift+Backspace: fascia paint, timber boards, frame paint, galvanised grey, rubber black. Dab soft noise on each with a big, faint brush. Check: zoomed out to 25 %, each strip reads as its material.", "uk": "У T_Trim_Harbour.kra заповни смуги 1, 3, 4, 6 і 7 інструментом Rectangular Selection і клавішами Shift+Backspace: фарба вивісної дошки, дерев'яна обшивка, фарба рам, оцинкований сірий, чорна гума. Великим блідим пензлем легенько нанеси на кожну м'який шум. Перевірка: при масштабі 25 % кожна смуга читається як свій матеріал."}, "lesson": 2}, {"text": {"en": "Press W (Wrap Around Mode) and clone out any hard line at each strip's left-right join. Press W again and Ctrl+S. Export T_Trim_Harbour.png over the old file and Reimport it in Unreal. Check: on MI_Trim_Harbour's preview sphere, no line shows where a strip repeats.", "uk": "Натисни W (Wrap Around Mode) і клонуванням прибери кожну різку лінію на стику лівого й правого краю смуги. Знову натисни W і Ctrl+S. Експортуй T_Trim_Harbour.png поверх старого файлу й зроби Reimport в Unreal. Перевірка: на кулі попереднього перегляду MI_Trim_Harbour не видно лінії там, де смуга повторюється."}, "lesson": 3}, {"text": {"en": "Door: select the two door faces, inset them 5 cm (I, type 0.05) and push them in 10 cm (E, type -0.1). Check: from the side, the door sits 10 cm behind the wall face.", "uk": "Двері: виділи дві грані дверей, зроби Inset на 5 см (I, введи 0.05) і втисни їх на 10 см (E, введи -0.1). Перевірка: збоку двері стоять на 10 см глибше за лице стіни."}, "lesson": 1}, {"text": {"en": "Fascia and sill: select the front faces between Z 2.5 and 3 m and push them out 5 cm (E, 0.05). Then select the bottom face of the window frame and push it out 5 cm. Check: from the side the fascia stands out, and the sill casts a thin shadow line under the window.", "uk": "Вивісна дошка й підвіконня: виділи передні грані між Z 2,5 і 3 м і висунь їх на 5 см (E, 0.05). Потім виділи нижню грань віконної рами й висунь її на 5 см. Перевірка: збоку вивісна дошка виступає, а підвіконня кидає під вікном тонку смужку тіні."}, "lesson": 1}, {"text": {"en": "Assign the new faces as in lesson 4: the door faces to Door, the sill to Trim. Check: each slot's Select button lights up only its faces.", "uk": "Признач нові грані, як в уроці 4: грані дверей — у Door, підвіконня — у Trim. Перевірка: кнопка Select кожного слота підсвічує лише його грані."}, "lesson": "D12.1"}, {"text": {"en": "Map the front again: A, U > Smart UV Project, then Average Islands Scale. Scale all islands together until the fascia fills strip 1's height. Then move each part with G only: fascia to strip 1, plinth and sill to strip 2, frames to strip 4. Check: every part shows the right material at the grain size of TD_Reference.", "uk": "Знову розгорни фасад: A, U > Smart UV Project, потім Average Islands Scale. Масштабуй усі острівці разом, доки вивісна дошка не заповнить висоту смуги 1. Потім пересувай кожну частину лише клавішею G: вивісну дошку — у смугу 1, цоколь і підвіконня — у смугу 2, рами — у смугу 4. Перевірка: кожна частина показує свій матеріал із таким самим розміром зерна, як на TD_Reference."}, "lesson": 4}, {"text": {"en": "Add UCX_SM_ShopFront_A_00 round the wall and UCX_SM_ShopFront_A_01 round the fascia; keep 5,000 triangles or fewer. Export the front and both boxes as SM_ShopFront_A.fbx, press Ctrl+S, close Blender and reopen buildkit_day13.blend. Check: the FBX is 10 KB or more, and all three objects are in the Outliner.", "uk": "Додай UCX_SM_ShopFront_A_00 навколо стіни й UCX_SM_ShopFront_A_01 навколо вивісної дошки. Не більше 5 000 трикутників. Експортуй фасад і обидва блоки як SM_ShopFront_A.fbx, натисни Ctrl+S, закрий Blender і знову відкрий buildkit_day13.blend. Перевірка: FBX має 10 КБ або більше, а всі три об'єкти є в Outliner."}, "lesson": "D4.3"}, {"text": {"en": "In Unreal import SM_ShopFront_A.fbx into Course/Day13 and fill its four slots in the Static Mesh Editor: Plaster MI_Plaster, Trim MI_Trim_Harbour, Door MI_Wood, Glass MI_Glass. Place it in L_KitTest beside your harbour building, snapped to the grid, and press End. Check: it stands as tall as the house walls, and its window faces outwards like theirs.", "uk": "В Unreal імпортуй SM_ShopFront_A.fbx у Course/Day13 і заповни чотири слоти в Static Mesh Editor: Plaster — MI_Plaster, Trim — MI_Trim_Harbour, Door — MI_Wood, Glass — MI_Glass. Постав фасад у L_KitTest поруч зі своєю будівлею в гавані, прив'язавши до сітки, і натисни End. Перевірка: фасад такий самий заввишки, як стіни будинку, а його вікно дивиться назовні, як і їхні."}, "lesson": "D12.3"}, {"text": {"en": "Take trim_on_front.png: the front in L_KitTest from about 3 m, showing trim, plaster, wood and glass. Check: today's proof picture is in your day work folder, and fascia, frames, plinth and wall read as different materials.", "uk": "Зроби скриншот і збережи як trim_on_front.png: фасад у L_KitTest приблизно з 3 м, видно трим, штукатурку, дерево й скло. Перевірка: сьогоднішній знімок-доказ лежить у робочій папці дня, а вивісна дошка, рами, цоколь і стіна читаються як різні матеріали."}, "lesson": 4}, {"text": {"en": "Gold (optional): reuse the trim on the quay. In quaykit_day11.blend give SM_QuayEdge_4m's top (coping) faces a new Trim slot and G their island into strip 2 without scaling. Export, Reimport and set the slot to MI_Trim_Harbour. Check: the coping and the shop plinth show the same stone.", "uk": "Золото (за бажанням): трим-шит на причалі. У quaykit_day11.blend признач верхнім граням SM_QuayEdge_4m (бровці) новий слот Trim і клавішею G перенеси їхній острівець у смугу 2 без масштабування. Експортуй, зроби Reimport і постав у слот MI_Trim_Harbour. Перевірка: бровка й цоколь крамниці показують той самий камінь."}, "lesson": 4}, {"text": {"en": "Report and hand-in: click Copy the day report at the bottom of the page, paste it into a new chat and answer. Open summary.md in Notepad, press Ctrl+End, paste the answer and press Ctrl+S. Then drag the files on the Hand in list into your hand-in folder. Check: every name shows in the folder, each with a size.", "uk": "Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: кожна назва зі списку є в папці, у кожної є розмір."}, "lesson": "D0.1"}]}, "lessons": [{"title": {"en": "A shop front on the grid: openings with depth", "uk": "Фасад крамниці на сітці: прорізи з глибиною"}, "minutes": 40, "goals": [{"en": "Block a 4 m shop front at real size, with the pivot at the bottom left corner of its back face on the grid.", "uk": "Будувати просту форму фасаду крамниці 4 м у справжньому розмірі, з origin у нижньому лівому куті задньої грані на сітці."}, {"en": "Place loop cuts at exact positions with the sidebar's Median value.", "uk": "Ставити петлеві розрізи (Loop Cut) у точні позиції значенням Median на бічній панелі."}, {"en": "Inset an opening and push it in, so the wall has depth. The inset ring becomes a frame, and the side faces of the opening are called reveals.", "uk": "Робити Inset прорізу й утискати його, щоб стіна мала глибину. Кільце від Inset стає рамою, а бічні грані прорізу називають укосами."}], "doalong": [{"en": "Open buildkit_day11.blend and save it as buildkit_day13.blend. Hide the other pieces (select them, H). Add a cube; in the sidebar (N) > Item set Dimensions X 4, Y 0.3, Z 3 m, then Location X 2, Y -0.15, Z 1.5. You see a slab.", "uk": "Відкрий buildkit_day11.blend і збережи як buildkit_day13.blend. Сховай інші деталі (виділи їх, H). Додай куб. На бічній панелі (N) > Item задай Dimensions X 4, Y 0.3, Z 3, потім Location X 2, Y -0.15, Z 1.5. Має вийти плита."}, {"en": "Name it SM_ShopFront_A. Shift+S > Cursor to World Origin, Object > Set Origin > Origin to 3D Cursor, then Ctrl+A > All Transforms. You see the orange origin dot at the bottom left corner of the back face.", "uk": "Назви її SM_ShopFront_A. Shift+S > Cursor to World Origin, Object > Set Origin > Origin to 3D Cursor, потім Ctrl+A > All Transforms. Помаранчева точка origin стоїть у нижньому лівому куті задньої грані."}, {"en": "Tab, then view from the front (Numpad 1 or View > Viewpoint > Front). Make the vertical cuts from left to right. Hover the top edge to the right of your last cut, press Ctrl+R, click, then right-click. In the sidebar's Median (Global) type X: 0.3, then 2.5, 2.8 and 3.8. You see four lines in order, none crossed.", "uk": "Натисни Tab і перемкнися на вид спереду (Numpad 1 або View > Viewpoint > Front). Роби вертикальні розрізи зліва направо. Наведи мишу на верхнє ребро праворуч від останнього розрізу, натисни Ctrl+R, клацни, потім клацни правою кнопкою. На бічній панелі в Median (Global) введи X: 0.3, далі 2.5, 2.8 і 3.8. Має вийти чотири лінії по порядку, без перетинів."}, {"en": "Do the same upwards for two horizontal cuts: hover a side edge above your last cut, Ctrl+R, click, right-click, then Median Z 0.5, then 2.5. You see the plinth, the window band and the fascia band.", "uk": "Так само вгору зроби два горизонтальні розрізи: наведи мишу на бічне ребро над останнім розрізом, Ctrl+R, клацни, клацни правою кнопкою, потім Median Z 0.5, далі 2.5. Має вийти цоколь, пояс вітрини й пояс вивісної дошки."}, {"en": "Press 3 for faces and click the window face (X 0.3 to 2.5, Z 0.5 to 2.5). Press I, type 0.05, Enter: this ring becomes the frame. You see a thin ring round a smaller face.", "uk": "Натисни 3 для граней і клацни на грань вітрини (X від 0.3 до 2.5, Z від 0.5 до 2.5). Натисни I, введи 0.05, Enter: це кільце стане рамою. Має вийти тонке кільце навколо меншої грані."}, {"en": "With the inner face selected press E, type -0.15, Enter, then Ctrl+S. You see a recess with reveals; its back face will be the glass.", "uk": "Коли внутрішня грань виділена, натисни E, введи -0.15, Enter, потім Ctrl+S. Має вийти заглиблення з укосами. Його задня грань стане склом."}], "play": {"en": "Scale detective: the tutor describes a real shop front. Before measuring, I guess its window width and fascia height using the 1.8 m mannequin as a ruler. Within 20 cm scores.", "uk": "Детектив масштабу: тьютор описує справжній фасад крамниці. Ще до вимірювання я вгадую ширину вітрини й висоту вивісної дошки, використовуючи манекен 1,8 м як лінійку. Похибка до 20 см — бал."}, "video": {"url": "https://www.youtube.com/watch?v=Lxtkx18m5Hs", "title": "Blender Precision Modeling Tutorial / Modeling Practice 01", "channel": "3D Nato", "length": "10:56", "search": "blender precision modeling exact dimensions", "alt": {"url": "https://www.youtube.com/watch?v=Py-SwJwPgk0", "title": "Урок 3 / Основи Blender 5.1 / Моделювання та модифікатори", "channel": "Fun Open Source Українською"}}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Фасад крамниці на сітці: прорізи з глибиною (Day 13, lesson 1 of 4). Today's build: T_Trim_Harbour, трим-шит для всієї гавані, і зібраний з ним SM_ShopFront_A.\nWhat I already know: День 11: твої навички UV, buildkit_day11.blend з TD_Reference і стандарт набору (1024 пікселі на метр); День 12: M_Master, MI_Plaster, MI_Wood, MI_Glass, слоти матеріалів і твої зображення каменю й дерева з Poly Haven; День 9: SM_Wall_2m та її висота 3 м, під яку підганяється фасад крамниці.\n\nBy the end of this lesson I can:\n1. Будувати просту форму фасаду крамниці 4 м у справжньому розмірі, з origin у нижньому лівому куті задньої грані на сітці.\n2. Ставити петлеві розрізи (Loop Cut) у точні позиції значенням Median на бічній панелі.\n3. Робити Inset прорізу й утискати його, щоб стіна мала глибину. Кільце від Inset стає рамою, а бічні грані прорізу називають укосами.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: Тепер твій набір має справжні матеріали з одного майстер-матеріалу: інстанси для металу, дерева, каменю, штукатурки й скла. Today: Сьогодні ти робиш T_Trim_Harbour — трим-шит із семи смуг — і будуєш SM_ShopFront_A, фасад крамниці завширшки 4 м, текстурований ним. One encouraging line: Трим-шити дуже люблять у студіях, і, вивчивши їх зараз, ти випереджаєш багатьох; якщо смуга виглядає не так, підправ її й рухайся далі.); 2 lines on why today matters and where it comes back, in plain words (from this: Сьогодні ти малюєш одну смугасту текстуру й вдягаєш у неї цілий фасад крамниці: вивісну дошку, кам'яний цоколь, рами й двері. Один трим-шит з одним матеріалом може вкрити краї цілої вулиці, тому студії так і будують набори для гаваней і міст. It comes back: SM_ShopFront_A вишикується вздовж торгових вулиць району 1 (День 42) і району 2 (День 49). У День 16 T_Trim_Harbour отримає кольори твого острова.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-13-trim-sheet-and-shop-front exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (трим-шит і вітрина фасаду (спільні з уроками)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact cli minutes": 40, "goals": [{"en": "Explain why trims cover long, thin parts (fascias, sills, frames) while big flat areas use a tiling material such as MI_Plaster.", "uk": "Пояснювати, чому трими вкривають довгі тонкі частини (вивісні дошки, підвіконня, рами), а великі пласкі ділянки — тайловий матеріал на кшталт MI_Plaster."}, {"en": "Unwrap all faces together and scale every island at once until a 50 cm part fills a 50 cm strip. Everything then has the kit density.", "uk": "Розгортати всі грані разом і масштабувати всі острівці одночасно, доки частина 50 см не заповнить смугу 50 см. Тоді все має щільність набору."}, {"en": "Move islands into their strips with G, never S, using part of a strip for thin parts.", "uk": "Переміщувати острівці в їхні смуги клавішею G, ніколи не S, а для тонких частин брати частину смуги."}], "doalong": [{"en": "In Material Properties add four slots (+). For Plaster, Door and Glass, pick the materials that already have those names in the sphere menu; click New only for Trim. In the Shading tab wire T_Trim_Harbour.png into Trim's Base Color, your plaster image into Plaster's and your wood into Door's. You see four slots.", "uk": "У Material Properties додай чотири слоти (+). Для Plaster, Door і Glass вибери в меню кулі матеріали з тими назвами, які вже є у файлі. New — лише для Trim. У вкладці Shading з'єднай T_Trim_Harbour.png з Base Color матеріалу Trim, зображення штукатурки — з Base Color матеріалу Plaster, а дерево — з Door. Має вийти чотири слоти."}, {"en": "Tab, press 3. Assign the wall faces to Plaster; the fascia band, plinth and frame ring to Trim; the window's back face to Glass. You see the front in four materials.", "uk": "Tab, натисни 3. Признач грані стіни в Plaster. Пояс вивісної дошки, цоколь і кільце рами — у Trim. Задню грань вітрини — у Glass. Фасад має чотири матеріали."}, {"en": "Press A, U > Smart UV Project, then UV > Average Islands Scale. Show T_Trim_Harbour in the UV Editor's header and press S until the fascia island is as tall as strip 1. You see the kit density on every island.", "uk": "Натисни A, U > Smart UV Project, потім UV > Average Islands Scale. Покажи T_Trim_Harbour у заголовку UV Editor, натисни S і тягни, доки острівець вивісної дошки не стане заввишки зі смугу 1. Щільність набору тепер на кожному острівці."}, {"en": "In the 3D view select only the fascia faces. In the UV Editor press A, then G to move the island into strip 1 (R 90 first if it stands upright). You see the painted board on the model.", "uk": "У в'юпорті виділи лише грані вивісної дошки. В UV Editor натисни A, потім G і пересунь острівець у смугу 1 (якщо він стоїть вертикально, спершу R 90). На моделі з'являється фарбована вивісна дошка."}, {"en": "To place it exactly: UV Editor sidebar (N) > View tab, untick Pixel Coordinates. Then Image tab > UV Vertex Y: type 0.875, the middle of strip 1 (with Pixel Coordinates on, type 1792). You see no stone at the board's edges.", "uk": "Щоб поставити точно: бічна панель UV Editor (N) > вкладка View, зніми прапорець Pixel Coordinates. Потім вкладка Image > UV Vertex Y: введи 0.875 — це середина смуги 1. Якщо Pixel Coordinates увімкнено, введи 1792. На краях дошки немає каменю."}, {"en": "Move the plinth into strip 2 with G; its middle is V 0.625 (1280 px). Move the frame faces into strip 4, using part of its height. Press Ctrl+S. You see stone under the window and painted frames round it.", "uk": "Пересунь цоколь клавішею G у смугу 2: її середина — V 0.625 (1280 px). Пересунь грані рами в смугу 4, на частину її висоти. Натисни Ctrl+S. Під вікном камінь, а навколо — фарбовані рами."}], "play": {"en": "Strip quiz: the tutor names ten parts of a harbour street (a fascia, a gutter, a fender, a sill, a quay coping, a door frame...). I give the strip number for each in 5 seconds, or say 'tiling material' for big flat areas.", "uk": "Вікторина смуг: тьютор називає десять частин вулиці в гавані (вивісна дошка, ринва, кранець, підвіконня, бровка причалу, дверна рама...). За 5 секунд я називаю номер смуги для кожної або кажу «тайловий матеріал» для великих пласких ділянок."}, "video": {"search": "blender trim sheet uv mapping modular building"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Розкладка на смуги триму (Day 13, lesson 4 of 4). Today's build: T_Trim_Harbour, трим-шит для всієї гавані, і зібраний з ним SM_ShopFront_A.\nWhat I already know: День 11: твої навички UV, buildkit_day11.blend з TD_Reference і стандарт набору (1024 пікселі на метр); День 12: M_Master, MI_Plaster, MI_Wood, MI_Glass, слоти матеріалів і твої зображення каменю й дерева з Poly Haven; День 9: SM_Wall_2m та її висота 3 м, під яку підганяється фасад крамниці.\nEarlier today I already did: lesson 1 (Фасад крамниці на сітці: прорізи з глибиною); lesson 2 (Трим-шити: план смуг); lesson 3 (Смуги з фото, що тайляться зліва направо). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Пояснювати, чому трими вкривають довгі тонкі частини (вивісні дошки, підвіконня, рами), а великі пласкі ділянки — тайловий матеріал на кшталт MI_Plaster.\n2. Розгортати всі грані разом і масштабувати всі острівці одночасно, доки частина 50 см не заповнить смугу 50 см. Тоді все має щільність набору.\n3. Переміщувати острівці в їхні смуги клавішею G, ніколи не S, а для тонких частин брати частину смуги.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: 2 lines on why today matters and where it comes back, in plain words (from this: Сьогодні ти малюєш одну смугасту текстуру й вдягаєш у неї цілий фасад крамниці: вивісну дошку, кам'яний цоколь, рами й двері. Один трим-шит з одним матеріалом може вкрити краї цілої вулиці, тому студії так і будують набори для гаваней і міст. It comes back: SM_ShopFront_A вишикується вздовж торгових вулиць району 1 (День 42) і району 2 (День 49). У День 16 T_Trim_Harbour отримає кольори твого острова.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-13-trim-sheet-and-shop-front exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (трим-шит і вітрина фасаду (спільні з уроками)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. У Material Properties додай чотири слоти (+). Для Plaster, Door і Glass вибери в меню кулі матеріали з тими назвами, які вже є у файлі. New — лише для Trim. У вкладці Shading з'єднай T_Trim_Harbour.png з Base Color матеріалу Trim, зображення штукатурки — з Base Color матеріалу Plaster, а дерево — з Door. Має вийти чотири слоти.\n   2. Tab, натисни 3. Признач грані стіни в Plaster. Пояс вивісної дошки, цоколь і кільце рами — у Trim. Задню грань вітрини — у Glass. Фасад має чотири матеріали.\n   3. Натисни A, U > Smart UV Project, потім UV > Average Islands Scale. Покажи T_Trim_Harbour у заголовку UV Editor, натисни S і тягни, доки острівець вивісної дошки не стане заввишки зі смугу 1. Щільність набору тепер на кожному острівці. [screenshot]\n   4. У в'юпорті виділи лише грані вивісної дошки. В UV Editor натисни A, потім G і пересунь острівець у смугу 1 (якщо він стоїть вертикально, спершу R 90). На моделі з'являється фарбована вивісна дошка.\n   5. Щоб поставити точно: бічна панель UV Editor (N) > вкладка View, зніми прапорець Pixel Coordinates. Потім вкладка Image > UV Vertex Y: введи 0.875 — це середина смуги 1. Якщо Pixel Coordinates увімкнено, введи 1792. На краях дошки немає каменю.\n   6. Пересунь цоколь клавішею G у смугу 2: її середина — V 0.625 (1280 px). Пересунь грані рами в смугу 4, на частину її висоти. Натисни Ctrl+S. Під вікном камінь, а навколо — фарбовані рами. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Вікторина смуг: тьютор називає десять частин вулиці в гавані (вивісна дошка, ринва, кранець, підвіконня, бровка причалу, дверна рама...). За 5 секунд я називаю номер смуги для кожної або кажу «тайловий матеріал» для великих пласких ділянок. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to pa ) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; see-why-fix note = нотатка «бачу, чому, як виправити»; comparison sheet, board (an image) = аркуш (аркуш порівняння, аркуш референсів); click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); File Explorer = Провідник; mesh = меш; grid = сітка (тільки grid, ніколи mesh); vertex / edge / face = вершина / ребро / грань; origin (and kit pivot) = origin — точка, за яку об'єкт ставлять і обертають; world origin / 3D cursor = центр світу / 3D-курсор; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; loop cut / edge loop = петлевий розріз (Loop Cut) / петля ребер; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); modifier = модифікатор; UV unwrap / UV layout / seam / UV island = розгортка / розкладка / шов / UV-острівець; texel density / checker pattern = щільність текселів / шахівниця; level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; collision / UCX collision box = колізія / блок UCX; material slot / node / pin = слот матеріалу / вузол / вхід; kit / kit piece / part of one object = набір / деталь / частина; map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; district / plot / plot plan = район / ділянка / план ділянки; harbour / quay / waterfront / pier = гавань / причал / набережна / пірс; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; shop front / shop window = фасад крамниці / вітрина; trim sheet / decal = трим-шит / декаль; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ; shot set = серія кадрів.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}], "handin": [{"en": "summary.md", "uk": "summary.md (звіт дня)"}, {"en": "T_Trim_Harbour.png: your trim, which Day 16 recolours (→ Day 16)", "uk": "T_Trim_Harbour.png (твій трим, який у День 16 отримає нові кольори) (→ День 16)"}, {"en": "buildkit_day13.blend with SM_ShopFront_A (→ Day 15)", "uk": "buildkit_day13.blend із SM_ShopFront_A (→ День 15)"}, {"en": "trim_on_front.png: the front in Unreal with all four materials (proof)", "uk": "trim_on_front.png (фасад в Unreal з усіма чотирма матеріалами) (доказ)"}], "goal": {"en": "By the end of today T_Trim_Harbour, a trim sheet of seven strips, dresses SM_ShopFront_A: a 4 m shop front standing in L_KitTest.", "uk": "До кінця дня T_Trim_Harbour — трим-шит із семи смуг — вкриває SM_ShopFront_A: фасад крамниці завширшки 4 м у L_KitTest."}, "uses": [{"en": "Day 11: your UV skills, buildkit_day11.blend with TD_Reference, and the kit standard (1024 pixels per metre)", "uk": "День 11: твої навички UV, buildkit_day11.blend з TD_Reference і стандарт набору (1024 пікселі на метр)"}, {"en": "Day 12: M_Master, MI_Plaster, MI_Wood, MI_Glass, material slots and your Poly Haven stone and wood images", "uk": "День 12: M_Master, MI_Plaster, MI_Wood, MI_Glass, слоти матеріалів і твої зображення каменю й дерева з Poly Haven"}, {"en": "Day 9: SM_Wall_2m and its 3 m height, which the shop front matches", "uk": "День 9: SM_Wall_2m та її висота 3 м, під яку підганяється фасад крамниці"}], "quiz": [{"q": {"en": "What makes a trim sheet cheap to use?", "uk": "Чому трим-шит дешевий у використанні?"}, "options": [{"en": "Many pieces share one texture and one material", "uk": "Багато деталей ділять одну текстуру й один матеріал"}, {"en": "It has no colour", "uk": "У нього немає кольору"}, {"en": "It is always 512 px", "uk": "Він завжди 512 px"}, {"en": "It needs no UVs", "uk": "Йому не потрібні UV"}], "answer": 0, "explain": {"en": "One trim and one material can cover the edges of a whole street. The computer draws and stores less.", "uk": "Один трим і один матеріал можуть покрити краї цілої вулиці. Комп'ютер менше малює й менше зберігає."}}, {"q": {"en": "On your shop front, the window frame shows boards ten times wider than the fascia's. What went wrong?", "uk": "На твоєму фасаді віконна рама показує дошки вдесятеро ширші, ніж на вивісній дошці. Що пішло не так?"}, "options": [{"en": "The trim is the wrong file type", "uk": "Трим має неправильний тип файлу"}, {"en": "The frame's island was scaled on its own, so it lost the kit density", "uk": "Острівець рами масштабували окремо, тож він втратив щільність набору"}, {"en": "Metallic is too high", "uk": "Metallic зависокий"}, {"en": "The pivot is in the middle", "uk": "Origin посередині"}], "answer": 1, "explain": {"en": "Scale all islands together once, then only move them. Scaling one island alone changes its texel density.", "uk": "Масштабуй усі острівці разом один раз, потім лише переміщуй їх. Якщо масштабувати один острівець окремо, його щільність текселів зміниться."}}, {"q": {"en": "At the kit standard, how tall is a 512 px strip in real life?", "uk": "Яку реальну висоту має смуга 512 px у стандарті набору?"}, "options": [{"en": "12.5 cm", "uk": "12,5 см"}, {"en": "25 cm", "uk": "25 см"}, {"en": "50 cm", "uk": "50 см"}], "answer": 2, "explain": {"en": "1024 pixels cover 1 m, so 512 pixels cover 50 cm.", "uk": "1024 пікселі покривають 1 м, тож 512 пікселів покривають 50 см."}}, {"q": {"en": "In Unreal, a thin vertical line appears every 2 m along your quay coping. What is the fix?", "uk": "В Unreal уздовж бровки причалу кожні 2 м з'являється тонка вертикальна лінія. Як це виправити?"}, "options": [{"en": "Turn the sun", "uk": "Повернути сонце"}, {"en": "Add more triangles to the coping", "uk": "Додати бровці трикутників"}, {"en": "Set Tiling to 0", "uk": "Поставити Tiling на 0"}, {"en": "Paint out the seam at the strip's left-right join in Wrap Around Mode, then export and reimport", "uk": "Замалювати шов на стику лівого й правого краю смуги в Wrap Around Mode, потім експортувати й зробити Reimport"}], "answer": 3, "explain": {"en": "The trim is 2 m wide, so a seam at its edge repeats every 2 m. Fix the join in Krita, then reimport.", "uk": "Трим має 2 м завширшки, тож шов на його краю повторюється кожні 2 м. Виправ стик у Krita, потім зроби Reimport."}}, {"q": {"en": "Why is the shop's big flat wall in MI_Plaster and not on the trim?", "uk": "Чому велика пласка стіна крамниці в MI_Plaster, а не на тримі?"}, "options": [{"en": "A 3 m wall can't fit a 50 cm strip at the kit density; big areas need a tiling material", "uk": "Стіна 3 м не вміщується в смугу 50 см зі щільністю набору, тож великим ділянкам потрібен тайловий матеріал"}, {"en": "Plaster is cheaper than any trim", "uk": "Штукатурка дешевша за будь-який трим"}, {"en": "Trims can't be used on walls", "uk": "Трими не можна використовувати на стінах"}, {"en": "Unreal shows only one trim per level", "uk": "Unreal показує лише один трим на рівень"}], "answer": 0, "explain": {"en": "Trim strips repeat only from left to right. Big flat areas need a texture that tiles in both directions.", "uk": "Смуги триму повторюються лише зліва направо. Великим пласким ділянкам потрібна текстура, що тайлиться в обох напрямках."}}], "weekInfo": {"week": 3, "title": {"en": "Surfaces", "uk": "Поверхні"}, "goal": {"en": "By Friday you have your whole harbour kit unwrapped at one texel density, textured with M_Master instances and a trim sheet, weathered with painted wear masks and a Wear slider, and shown beside real harbour photos.", "uk": "До п'ятниці весь твій набір для гавані має розгортку з однією щільністю текселів, інстанси M_Master і трим-шит, а також зношеність із намальованих масок і повзунок Wear. Набір показано поруч зі справжніми фото гавані."}, "skills": [{"en": "UV unwrapping with clean seams and consistent texel density for modular kits", "uk": "UV-розгортка з акуратними швами й однаковою щільністю текселів для модульних наборів"}, {"en": "PBR material authoring: master materials and material instances in Unreal Engine 5", "uk": "Створення PBR-матеріалів: майстер-матеріали та інстанси матеріалів в Unreal Engine 5"}, {"en": "Trim sheet design and UV layout for modular environment kits", "uk": "Дизайн трим-шитів і UV-розкладка для модульних наборів оточення"}, {"en": "Texture painting and parameter-driven weathering (wear masks on a second UV channel)", "uk": "Малювання текстур і зношеність, керована параметрами (маски зношеності на другій UV-розгортці)"}, {"en": "Look-development review against real photo reference", "uk": "Огляд вигляду (look development) за справжніми фото-референсами"}]}, "morning": {"sofar": {"en": "Your kit now wears real materials from one master material, with instances for metal, wood, stone, plaster and glass.", "uk": "Тепер твій набір має справжні матеріали з одного майстер-матеріалу: інстанси для металу, дерева, каменю, штукатурки й скла."}, "today": {"en": "You make T_Trim_Harbour, a trim sheet of seven strips, and build SM_ShopFront_A, a 4 m shop front textured with it.", "uk": "Сьогодні ти робиш T_Trim_Harbour — трим-шит із семи смуг — і будуєш SM_ShopFront_A, фасад крамниці завширшки 4 м, текстурований ним."}, "cheer": {"en": "Trim sheets are a studio favourite and learning them now puts you ahead; if a strip looks wrong, adjust it and carry on.", "uk": "Трим-шити дуже люблять у студіях, і, вивчивши їх зараз, ти випереджаєш багатьох; якщо смуга виглядає не так, підправ її й рухайся далі."}, "quote": {"text": {"en": "Inspiration is for amateurs — the rest of us just show up and get to work.", "uk": "Натхнення — для аматорів. Решта з нас просто приходить і береться до роботи."}, "author": {"en": "Chuck Close", "uk": "Чак Клоуз"}, "source": "https://en.wikiquote.org/wiki/Chuck_Close"}}, "hasAssets": false, "workPath": "Work\\Assignment\\Day-13-trim-sheet-and-shop-front", "mapHref": "../../COURSE.html", "prevHref": "../Day-12-pbr-materials-m-master/START-HERE.html", "nextHref": "../Day-14-texture-painting-and-wear/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Krita, Blender and Unreal Engine 5.8. I am a beginner on Day 13. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me and don't write code.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: Двері, вивісна дошка, підвіконня, слоти, колізія та експорт SM_ShopFront_A, самостійно.\nIt's part of: T_Trim_Harbour, трим-шит для всієї гавані, і зібраний з ним SM_ShopFront_A (Course/Day13 — для триму, його інстансу й фасаду. L_KitTest — поруч із твоєю маленькою будівлею в гавані.).\nWhy it matters: Сьогодні ти малюєш одну смугасту текстуру й вдягаєш у неї цілий фасад крамниці: вивісну дошку, кам'яний цоколь, рами й двері. Один трим-шит з одним матеріалом може вкрити краї цілої вулиці, тому студії так і будують набори для гаваней і міст. It comes back: SM_ShopFront_A вишикується вздовж торгових вулиць району 1 (День 42) і району 2 (День 49). У День 16 T_Trim_Harbour отримає кольори твого острова.\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-13-trim-sheet-and-shop-front (on the drive I chose on Day 0).\nWhat I already know: День 11: твої навички UV, buildkit_day11.blend з TD_Reference і стандарт набору (1024 пікселі на метр); День 12: M_Master, MI_Plaster, MI_Wood, MI_Glass, слоти матеріалів і твої зображення каменю й дерева з Poly Haven; День 9: SM_Wall_2m та її висота 3 м, під яку підганяється фасад крамниці; today's lessons: Фасад крамниці на сітці: прорізи з глибиною; Трим-шити: план смуг; Смуги з фото, що тайляться зліва направо; Розкладка на смуги триму. Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- T_Trim_Harbour: 2048 × 2048 px за стандартом набору, тож трим-шит має 2 м завширшки, а кожні 512 px — це 50 см. Сім горизонтальних смуг, як у смугастому прапорі. Кожна смуга тайлиться зліва направо без помітного шва.\n- Сім смуг згори, у пікселях: фарба вивісної дошки 512, кам'яний цоколь і бровка 512, дерев'яна обшивка 256 і фарба рам 256. Далі зношені дошки 256, оцинкований метал 128 і чорна гума 128.\n- Діапазони V для смуг, 0 унизу: смуга 1 — від 0.75 до 1, 2 — від 0.5 до 0.75, 3 — від 0.375 до 0.5, 4 — від 0.25 до 0.375. Далі 5 — від 0.125 до 0.25, 6 — від 0.0625 до 0.125, 7 — від 0 до 0.0625.\n- SM_ShopFront_A: 4 м завширшки (два кроки сітки), 3 м заввишки, як SM_Wall_2m, і 0,3 м завглибшки. Лицем у бік -Y, як твої стіни. Origin — у нижньому лівому куті задньої грані, щоб фасад міг стати впритул до будь-якої стіни.\n- Справжні частини: вітрина 2,2 м над кам'яним цоколем 50 см і двері 1 м. Над ними на висоті від 2,5 до 3 м іде вивісна дошка 50 см — точно висота смуги 1. Прорізи заглиблені на 10–15 см.\n- Чотири слоти: Trim для довгих тонких частин, Plaster для великої пласкої стіни, Door і Glass. В Unreal вони отримують MI_Trim_Harbour, MI_Plaster, MI_Wood і MI_Glass. Не більше 5 000 трикутників, з блоками UCX, як на 1-му тижні.\n- Острівці на трим-шиті зберігають щільність набору: частина 50 см заповнює смугу 50 см. Тонкі частини займають частину смуги, а смугу ніколи не стискають.\n\nMy checklist (the same numbers show on my course page):\n1. Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: buildkit_day13.blend із заглибленим вікном, T_Trim_Harbour.kra і T_Trim_Harbour.png. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. MI_Trim_Harbour лежить у Course/Day13. (from lesson 1)\n2. У T_Trim_Harbour.kra заповни смуги 1, 3, 4, 6 і 7 інструментом Rectangular Selection і клавішами Shift+Backspace: фарба вивісної дошки, дерев'яна обшивка, фарба рам, оцинкований сірий, чорна гума. Великим блідим пензлем легенько нанеси на кожну м'який шум. Перевірка: при масштабі 25 % кожна смуга читається як свій матеріал. (from lesson 2)\n3. Натисни W (Wrap Around Mode) і клонуванням прибери кожну різку лінію на стику лівого й правого краю смуги. Знову натисни W і Ctrl+S. Експортуй T_Trim_Harbour.png поверх старого файлу й зроби Reimport в Unreal. Перевірка: на кулі попереднього перегляду MI_Trim_Harbour не видно лінії там, де смуга повторюється. (from lesson 3)\n4. Двері: виділи дві грані дверей, зроби Inset на 5 см (I, введи 0.05) і втисни їх на 10 см (E, введи -0.1). Перевірка: збоку двері стоять на 10 см глибше за лице стіни. (from lesson 1)\n5. Вивісна дошка й підвіконня: виділи передні грані між Z 2,5 і 3 м і висунь їх на 5 см (E, 0.05). Потім виділи нижню грань віконної рами й висунь її на 5 см. Перевірка: збоку вивісна дошка виступає, а підвіконня кидає під вікном тонку смужку тіні. (from lesson 1)\n6. Признач нові грані, як в уроці 4: грані дверей — у Door, підвіконня — у Trim. Перевірка: кнопка Select кожного слота підсвічує лише його грані. (from day 12, lesson 1)\n7. Знову розгорни фасад: A, U > Smart UV Project, потім Average Islands Scale. Масштабуй усі острівці разом, доки вивісна дошка не заповнить висоту смуги 1. Потім пересувай кожну частину лише клавішею G: вивісну дошку — у смугу 1, цоколь і підвіконня — у смугу 2, рами — у смугу 4. Перевірка: кожна частина показує свій матеріал із таким самим розміром зерна, як на TD_Reference. (from lesson 4)\n8. Додай UCX_SM_ShopFront_A_00 навколо стіни й UCX_SM_ShopFront_A_01 навколо вивісної дошки. Не більше 5 000 трикутників. Експортуй фасад і обидва блоки як SM_ShopFront_A.fbx, натисни Ctrl+S, закрий Blender і знову відкрий buildkit_day13.blend. Перевірка: FBX має 10 КБ або більше, а всі три об'єкти є в Outliner. (from day 4, lesson 3)\n9. В Unreal імпортуй SM_ShopFront_A.fbx у Course/Day13 і заповни чотири слоти в Static Mesh Editor: Plaster — MI_Plaster, Trim — MI_Trim_Harbour, Door — MI_Wood, Glass — MI_Glass. Постав фасад у L_KitTest поруч зі своєю будівлею в гавані, прив'язавши до сітки, і натисни End. Перевірка: фасад такий самий заввишки, як стіни будинку, а його вікно дивиться назовні, як і їхні. (from day 12, lesson 3)\n10. Зроби скриншот і збережи як trim_on_front.png: фасад у L_KitTest приблизно з 3 м, видно трим, штукатурку, дерево й скло. Перевірка: сьогоднішній знімок-доказ лежить у робочій папці дня, а вивісна дошка, рами, цоколь і стіна читаються як різні матеріали. (from lesson 4)\n11. Золото (за бажанням): трим-шит на причалі. У quaykit_day11.blend признач верхнім граням SM_QuayEdge_4m (бровці) новий слот Trim і клавішею G перенеси їхній острівець у смугу 2 без масштабування. Експортуй, зроби Reimport і постав у слот MI_Trim_Harbour. Перевірка: бровка й цоколь крамниці показують той самий камінь. (from lesson 4)\n12. Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: кожна назва зі списку є в папці, у кожної є розмір. (from day 0, lesson 1)\n\nHow to help: ask which step number I'm on, then give me only the next step: the exact clicks and what I should see. When I send a screenshot, compare it with my reference, my sizes and the spec, and name one thing to fix at a time.\nCheck every save and export by reopening it before we move on:\n- a .blend: close Blender, double-click the file in today's day work folder (GAD\\Day-13-trim-sheet-and-shop-front), and the model is there (an empty grid means the wrong file was saved)\n- a .md or .txt: open it with Notepad; the text is there, and the name doesn't end in .md.txt\nWhen I write \"готово\", and in any case before the day ends, check with me one item at a time (yes/no): each spec point, then each file on my hand-in list, ready in my day work folder (skip summary.md: the day report writes it next):\n1. T_Trim_Harbour.png (твій трим, який у День 16 отримає нові кольори) (→ День 16)\n2. buildkit_day13.blend із SM_ShopFront_A (→ День 15)\n3. trim_on_front.png (фасад в Unreal з усіма чотирма матеріалами) (доказ)\nFinish with a short list of anything missing, and one line on where this work comes back and what it will look like there. Then tell me the order for the end of the day: first the day report (the Copy the day report button at the bottom of my course page) into summary.md, and only then hand in all the files on the list, summary.md too.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetre const HIN=(D.handin||[]).map(v=>(v&&v.en)||(typeof v==='string'?v:'')).join(' ').toLowerCase(),hasClip=/\.mp4|clip/.test(HIN);

ow of plot_plan_d1.md inside the box (item, count, where in metres, source). Every count is a number.", "uk": "sample.md: чотири кути квадрата 60 x 60 м в острівних метрах, а далі кожен рядок plot_plan_d1.md, що потрапляє в цей квадрат (елемент, кількість, де в метрах, джерело). Кожна кількість — це число."}, {"en": "In L_Island, on DL_District1 (your Day 33 Data Layer, made current): four 1 m corner markers at the sample's corners, and every sample item at its plan coordinates (island metres x 100 = Location in centimetres). Nothing extra: if the plan is wrong, change the plan first.", "uk": "У L_Island, на DL_District1 (твій Data Layer з Дня 33, зроблений поточним): чотири маркери-куби по 1 м у кутах пробної ділянки та кожен елемент ділянки на своїх координатах із плану (острівні метри x 100 = Location у сантиметрах). Нічого зайвого: якщо план неправильний, спершу зміни план."}, {"en": "Pieces: your quay and pier kit along the water, two or three buildings (LI_HarbourHouse from Day 10, kit walls or a pack building), a few of your Week 1 props and a few pack plants. Every base touches the ground; nothing floats.", "uk": "Деталі: твій модульний набір причалу й пірса вздовж води, дві-три будівлі (LI_HarbourHouse з Дня 10, стіни з набору або будівля з паку), кілька твоїх пропсів з Тижня 1 і кілька рослин із паків. Кожна основа торкається землі; ніщо не висить у повітрі."}, {"en": "Five Cine Cameras C1 to C5 for the whole district (C1 the approach, C2 the buildings, C3 the main feature, C4 one wide view, C5 close on the ground), placed from the camera arrows on plot_plan_d1.png (Day 23: each with its height and hero photo) and locked. They sit beside your Day 30 island cameras, CAM_Island_C1 to CAM_Island_C3, so no two cameras share a name. At least two of the five see the sample.", "uk": "П'ять Cine Cameras C1-C5 для всього району (C1 підхід, C2 будівлі, C3 головна особливість, C4 один широкий вигляд, C5 близько до землі), розміщені за стрілками камер на plot_plan_d1.png (День 23: у кожної своя висота й головне фото) і заблоковані. Вони стоять поруч із твоїми камерами острова з Дня 30, CAM_Island_C1-CAM_Island_C3, тож дві камери ніколи не мають однакової назви. Принаймні дві з п'яти бачать пробну ділянку."}, {"en": "budget.md: the target (an average frame under 16.6 ms, and the 95th percentile under 33.3 ms, at 1920 x 1080), the settings (Play in a New Editor Window at 1920 x 1080, Engine Scalability High) and stat unit numbers (Frame, Game, Draw, GPU) at three spots: the launch point, C4 and the widest view. stat unit is a console command that shows how many milliseconds each frame takes.", "uk": "budget.md: ціль (середній кадр менше 16,6 мс і 95-й перцентиль менше 33,3 мс при 1920 x 1080), налаштування (Play у New Editor Window при 1920 x 1080, Engine Scalability High) і числа stat unit (Frame, Game, Draw, GPU) у трьох місцях: точка старту, C4 і найширший вигляд. stat unit — це консольна команда, яка показує, скільки мілісекунд займає кожен кадр."}, {"en": "stat gpu at the widest view: the five biggest lines, in budget.md. stat gpu is a console command that splits the graphics card's time into jobs, such as shadows or light.", "uk": "stat gpu на найширшому вигляді: п'ять найбільших рядків, у budget.md. stat gpu — це консольна команда, яка ділить час відеокарти на завдання, наприклад тіні чи світло."}, {"en": "One CSV capture of a 60-second flight through the sample (a file that records the time of every frame), opened in a free spreadsheet, with the average and the 95th percentile (the time that only the slowest 5 % of frames go over) of frame time and GPU time, and a line chart of frame time (csv_chart.png).", "uk": "Один CSV-запис 60-секундного польоту над пробною ділянкою (файл, який записує час кожного кадру), відкритий у безкоштовній електронній таблиці, із середнім і 95-м перцентилем (час, який перевищують лише 5 % найповільніших кадрів) для часу кадру й часу GPU, і лінійний графік часу кадру (csv_chart.png)."}, {"en": "sample_verdict.md: two engine shots beside two reference photos on sample_board.png, three lines on what the recipe keeps or changes, and one line on cost: is there room in the budget for the full district?", "uk": "sample_verdict.md: два кадри з рушія поруч із двома референсними фото на sample_board.png, три рядки про те, що рецепт залишає чи змінює, і один рядок про вартість: чи є в бюджеті місце для всього району?"}], "piece1": "the sample box, its corner markers and the first building, placed with the tutor", "piece2": {"en": "The rest of the sample, the budget and the CSV capture, on your own", "uk": "Решта пробної ділянки, бюджет і CSV-запис, самостійно"}, "steps": [{"text": {"en": "Open plot_plan_d1.png in Krita and draw a 60 x 60 m box (240 px) over the slice with the typical mix. Write sample.md: the box corners in island metres and every plan row inside it. Check: every row has a number and a place in metres.", "uk": "Відкрий plot_plan_d1.png у Krita і намалюй квадрат 60 x 60 м (240 px) поверх шматка з типовим набором елементів. Напиши sample.md: кути квадрата в острівних метрах і кожен рядок плану всередині нього. Перевірка: у кожного рядка є число й місце в метрах."}, "lesson": 1}, {"text": {"en": "In L_Island, load district 1's region and make DL_District1 the current Data Layer. Place four 1 m cube markers at the sample's corners by typed coordinates (island metres x 100). Check: in a Top view the markers sit where the box sits on your plan.", "uk": "У L_Island завантаж регіон району 1 і зроби DL_District1 поточним Data Layer. Постав чотири маркери-куби по 1 м у кутах пробної ділянки, вводячи координати вручну (острівні метри x 100). Перевірка: у вигляді Top маркери стоять там, де квадрат на твоєму плані."}, "lesson": 2}, {"text": {"en": "Place five Cine Cameras C1 to C5 from the camera arrows on plot_plan_d1.png; pilot, frame and lock each one. Screenshot the empty sample from C4 for your before picture. Check: each camera shows what its arrow and hero photo promise, and a locked camera doesn't move when you drag it.", "uk": "Постав п'ять Cine Cameras C1-C5 за стрілками камер на plot_plan_d1.png; керуй кожною (Pilot), скадруй і заблокуй. Зроби скриншот порожньої пробної ділянки з C4 — це твоє фото «до». Перевірка: кожна камера показує те, що обіцяють її стрілка й головне фото, а заблокована камера не рухається, коли ти її тягнеш."}, "lesson": 1}, {"text": {"en": "Quay and pier: lay SM_QuayEdge_4m pieces along the sample's water edge and SM_PierDeck_4m where the plan puts the pier. Check: from 2 m there is no gap between pieces and the tops are level.", "uk": "Причал і пірс: поклади деталі SM_QuayEdge_4m уздовж краю води на пробній ділянці і SM_PierDeck_4m там, де план ставить пірс. Перевірка: з 2 м між деталями немає щілин, а верхи на одному рівні."}, "lesson": 2}, {"text": {"en": "Buildings: place two or three buildings at their plan coordinates (LI_HarbourHouse, kit walls or a pack building), press End and sink the low side. Check: all four corners touch the ground when you look from 2 m.", "uk": "Будівлі: постав дві-три будівлі на їхні координати з плану (LI_HarbourHouse, стіни з набору або будівля з паку), натисни End і опусти нижчий бік. Перевірка: коли дивишся з 2 м, усі чотири кути торкаються землі."}, "lesson": 2}, {"text": {"en": "Props and plants: a few of your Week 1 props and pack plants at their plan places. Check: a low side view shows no floating base.", "uk": "Пропи й рослини: кілька твоїх пропсів з Тижня 1 і рослин із паків на місцях за планом. Перевірка: на низькому вигляді збоку жодна основа не висить у повітрі."}, "lesson": 2}, {"text": {"en": "Set Engine Scalability to High and the play window to 1920 x 1080; write the target and both settings in budget.md. Check: budget.md has a target line and a settings line.", "uk": "Встанови Engine Scalability на High, а вікно гри на 1920 x 1080; запиши ціль і обидва налаштування в budget.md. Перевірка: у budget.md є рядок із ціллю і рядок із налаштуваннями."}, "lesson": 3}, {"text": {"en": "In Play (New Editor Window), fly with your Day 33 flying set-up and use stat unit at the launch point, at C4's spot and at the widest view; write Frame, Game, Draw and GPU for each. Check: three rows of four numbers in budget.md.", "uk": "У Play (New Editor Window) літай зі своїм налаштуванням польоту з Дня 33 і вводь stat unit у точці старту, на місці C4 і на найширшому вигляді; запиши Frame, Game, Draw і GPU для кожного. Перевірка: у budget.md три рядки по чотири числа."}, "lesson": 3}, {"text": {"en": "stat gpu at the widest view; write its five biggest lines in budget.md. Check: you can name the job that costs the most.", "uk": "stat gpu на найширшому вигляді; запиши його п'ять найбільших рядків у budget.md. Перевірка: ти можеш назвати завдання, яке коштує найбільше."}, "lesson": 3}, {"text": {"en": "CSV capture: csvprofile start, fly 60 seconds through the sample, csvprofile stop. Open the file in a spreadsheet (Language English (USA)), work out the average and the 95th percentile of frame time and GPU time, and save a line chart as csv_chart.png. Check: four numbers in budget.md, each in milliseconds, and the chart saved.", "uk": "CSV-запис: csvprofile start, лети 60 секунд над пробною ділянкою, csvprofile stop. Відкрий файл в електронній таблиці (Language English (USA)), обчисли середнє і 95-й перцентиль часу кадру й часу GPU і збережи лінійний графік як csv_chart.png. Перевірка: у budget.md чотири числа, кожне в мілісекундах, і графік збережено."}, "lesson": 4}, {"text": {"en": "Shoot the sample from the two cameras that see it and put each beside its nearest reference photo in sample_board.png. Check: engine shot on the left, photo on the right, the same kind of view.", "uk": "Зніми пробну ділянку з двох камер, які її бачать, і постав кожен кадр поруч із найближчим референсним фото на sample_board.png. Перевірка: кадр із рушія ліворуч, фото праворуч, вигляд того самого типу."}, "lesson": 4}, {"text": {"en": "Write sample_verdict.md: three keep-or-change lines and the cost line. Paste it and the board into the tutor chat and add any note you accept. Check: the file ends with yes or no to 'the recipe works'.", "uk": "Напиши sample_verdict.md: три рядки «залишити чи змінити» і рядок про вартість. Встав його й дошку в чат із тьютором і додай нотатки, з якими погоджуєшся. Перевірка: файл закінчується відповіддю «так» або «ні» на «рецепт працює»."}, "lesson": 4}, {"text": {"en": "Capture: the empty sample beside the placed sample from C4 (before_after_day41.png), and a 60-second flight through the sample at drone height in game view. Save today's clip as flythrough_day41.mp4. Check: both files are in today's Work folder.", "uk": "Запис: порожня пробна ділянка поруч із заповненою з C4 (before_after_day41.png) і 60-секундний проліт над ділянкою на висоті дрона в Game View. Збережи сьогоднішнє відео як flythrough_day41.mp4. Перевірка: обидва файли в сьогоднішній папці Work."}, "lesson": 4}], "assets": ["island12/example-plot-plan.md"]}, "lessons": [{"title": {"en": "The sample plot: test the recipe small", "uk": "Пробна ділянка: перевір рецепт у малому"}, "minutes": 40, "goals": [{"en": "Explain why a studio builds a small sample before a whole district: it tests the look and the cost while changes are still cheap.", "uk": "Пояснювати, чому студія будує маленьку пробну ділянку перед цілим районом: вона перевіряє вигляд і вартість, поки зміни ще дешеві."}, {"en": "Choose a 60 x 60 m slice that holds every kind of item your district has.", "uk": "Обирати шматок 60 x 60 м, у якому є кожен тип елементів твого району."}, {"en": "Place the district's five review cameras C1 to C5 from your Day 23 camera arrows, so every later day is shot from the same places.", "uk": "Ставити п'ять камер огляду району C1-C5 за стрілками камер з Дня 23, щоб кожен наступний день знімати з тих самих місць."}], "doalong": [{"en": "Open plot_plan_d1.png in Krita. In the Layers docker (right side), click the + button to add a layer and name it sample. You should see your plan with an empty layer on top.", "uk": "Відкрий plot_plan_d1.png у Krita. У докері Layers (праворуч) натисни кнопку +, щоб додати шар, і назви його sample. Ти маєш побачити свій план із порожнім шаром зверху."}, {"en": "Pick the Rectangle tool in the Toolbox (left side) and draw a square 240 px wide over a slice with water, buildings, a street and planting: your plan has 4 px per metre, so 240 px is 60 m. Check the width with the Measure tool. You should see one square that holds every kind of item in your district.", "uk": "Вибери Rectangle tool на панелі Toolbox (ліворуч) і намалюй квадрат шириною 240 px поверх шматка з водою, будівлями, вулицею й зеленню: на твоєму плані 4 px на метр, тож 240 px — це 60 м. Перевір ширину інструментом Measure. Ти маєш побачити один квадрат, у якому є кожен тип елементів твого району."}, {"en": "Write sample.md: the four corners in island metres (read them on the grid labels), then copy every row of plot_plan_d1.md that falls inside the box. You should see a short table where every count is a number.", "uk": "Напиши sample.md: чотири кути в острівних метрах (зчитай їх на підписах сітки), а потім скопіюй кожен рядок plot_plan_d1.md, що потрапляє в квадрат. Ти маєш побачити коротку таблицю, де кожна кількість — число."}, {"en": "In Unreal, open L_Island and load only district 1: Window > World Partition > World Partition Editor, drag a box over district 1, right-click > Load Region From Selection (as on Day 33). You should see district 1 in the viewport and the rest unloaded.", "uk": "В Unreal відкрий L_Island і завантаж лише район 1: Window > World Partition > World Partition Editor, обведи рамкою район 1, правий клік > Load Region From Selection (як на Дні 33). Ти маєш побачити район 1 у в'юпорті, а решту — вивантаженою."}, {"en": "In the main toolbar click the Add button (the cube with a +) > Cinematic > Cine Camera Actor, and drop it near your C1 arrow. Rename it C1 (F2); the name is free, because your Day 30 island cameras are CAM_Island_C1 to CAM_Island_C3. Right-click it > Pilot 'C1', then move with the mouse and W, A, S, D until the view matches the arrow, its height and its hero photo. Click the eject button at the top left of the viewport. You should see the camera keep that view.", "uk": "На головній панелі інструментів натисни кнопку Add (куб із +) > Cinematic > Cine Camera Actor і кинь її біля стрілки C1. Перейменуй її на C1 (F2); ця назва вільна, бо твої камери острова з Дня 30 звуться CAM_Island_C1-CAM_Island_C3. Правий клік по ній > Pilot 'C1', потім рухайся мишею та W, A, S, D, доки вигляд не збігатиметься зі стрілкою, її висотою і головним фото. Натисни кнопку виходу (eject) угорі ліворуч у в'юпорті. Ти маєш побачити, що камера зберегла цей вигляд."}, {"en": "Repeat for C2 to C5. Then right-click each camera > Transform > Lock Actor Movement. You should see that a locked camera doesn't move when you try to drag it.", "uk": "Повтори для C2-C5. Потім правий клік по кожній камері > Transform > Lock Actor Movement. Ти маєш побачити, що заблокована камера не рухається, коли пробуєш її тягнути."}], "play": {"en": "Recipe guess: I describe my sample box to the tutor. It guesses which three things will be hardest to get right. After the build I tell it whether it was right.", "uk": "Вгадай рецепт: я описую тьютору свій квадрат пробної ділянки. Він вгадує, які три речі буде найважче зробити правильно. Після будівництва я кажу йому, чи він мав рацію."}, "video": {"url": "https://www.youtube.com/watch?v=CW8hDvJOwGM", "title": "Unreal Engine 5 Cinematic Camera Tutorial for Beginners STEP BY STEP", "channel": "EZ Unreal", "length": "7:46", "search": "unreal engine 5 cine camera actor"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: The sample plot: test the recipe small (Day 41, lesson 1 of 4).\nToday's build: The district 1 sample plot: a 60 x 60 m slice of your waterfront placed from plot_plan_d1.png, and budget.md, which says what the sample costs in milliseconds.\n\nBy the end of this lesson I can:\n1. Explain why a studio builds a small sample before a whole district: it tests the look and the cost while changes are still cheap.\n2. Choose a 60 x 60 m slice that holds every kind of item your district has.\n3. Place the district's five review cameras C1 to C5 from your Day 23 camera arrows, so every later day is shot from the same places.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (Eight weeks in, your whole island is dressed by PCG, from forest to shoreline, on land and water you shaped yourself.), what I will learn today (You build a 60 x 60 m sample of your waterfront from your plan and measure in milliseconds what it costs your PC.), encourage me (A sample is a safe place to test, so try things freely; the numbers only tell you what to do next.), and share today's quote: \"I have always been more interested in experiment, than in accomplishment.\" (Orson Welles).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 38: why is a flight corridor's keep-out wider than the 4 m lane it protects? | Day 33: what does a Data Layer let you do while you work on one part of the island?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Recipe guess: I describe my sample box to the tutor. It guesses which three things will be hardest to get right. After the build I tell it whether it was right.\n6. Do-along on today's build (the sample box, its corner markers and the first building, placed with the tutor): guide me through these steps one at a time, checking a screenshot after each:\n   - Open plot_plan_d1.png in Krita. In the Layers docker (right side), click the + button to add a layer and name it sample. You should see your plan with an empty layer on top.\n   - Pick the Rectangle tool in the Toolbox (left side) and draw a square 240 px wide over a slice with water, buildings, a street and planting: your plan has 4 px per metre, so 240 px is 60 m. Check the width with the Measure tool. You should see one square that holds every kind of item in your district.\n   - Write sample.md: the four corners in island metres (read them on the grid labels), then copy every row of plot_plan_d1.md that falls inside the box. You should see a short table where every count is a number.\n   - In Unreal, open L_Island and load only district 1: Window > World Partition > World Partition Editor, drag a box over district 1, right-click > Load Region From Selection (as on Day 33). You should see district 1 in the viewport and the rest unloaded.\n   - In the main toolbar click the Add button (the cube with a +) > Cinematic > Cine Camera Actor, and drop it near your C1 arrow. Rename it C1 (F2); the name is free, because your Day 30 island cameras are CAM_Island_C1 to CAM_Island_C3. Right-click it > Pilot 'C1', then move with the mouse and W, A, S, D until the view matches the arrow, its height and its hero photo. Click the eject button at the top left of the viewport. You should see the camera keep that view.\n   - Repeat for C2 to C5. Then right-click each camera > Transform > Lock Actor Movement. You should see that a locked camera doesn't move when you try to drag it.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Unreal Engine 5 Cinematic Camera Tutorial for Beginners STEP BY STEP\" by EZ Unreal: https://www.youtube.com/watch?v=CW8hDvJOwGM\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Placing exactly from the plan on a big island", "uk": "Точне розміщення за планом на великому острові"}, "minutes": 40, "goals": [{"en": "Turn plan coordinates into Unreal numbers: your plan is labelled in island metres (Day 23), and L_Island is centred on (0, 0) with X east and Y south (Days 22 and 26), so Location = island metres x 100 (Unreal works in centimetres).", "uk": "Перетворювати координати плану на числа Unreal: твій план підписаний в острівних метрах (День 23), а L_Island має центр у (0, 0), X на схід і Y на південь (Дні 22 і 26), тож Location = острівні метри x 100 (Unreal працює в сантиметрах)."}, {"en": "Place by typed numbers, then drop each piece to the ground with End and sink the low side.", "uk": "Розміщувати за введеними числами, потім опускати кожну деталь на землю клавішею End і занурювати нижчий бік."}, {"en": "Keep district work on DL_District1, the Data Layer you made on Day 33, so you can hide the rest of the island while you work.", "uk": "Тримати роботу над районом на DL_District1, Data Layer, створеному на Дні 33, щоб під час роботи ховати решту острова."}], "doalong": [{"en": "Open Window > World Partition > Data Layer Outliner. Right-click DL_District1 (you made it on Day 33) > Make Current Data Layer. You should see it marked as current: new actors now go onto it.", "uk": "Відкрий Window > World Partition > Data Layer Outliner. Правий клік по DL_District1 (його створено на Дні 33) > Make Current Data Layer. Ти маєш побачити, що його позначено поточним: нові актори тепер потрапляють на нього."}, {"en": "Drag a Cube from Place Actors > Shapes (Window > Place Actors): at Scale 1 it is 1 m, a good marker. Type the first sample corner into Details > Location: island X x 100 and island Y x 100 (a corner at X 240, Y -360 m goes to 24000, -36000). Press End. Alt+drag three copies and type the other corners. You should see four markers in a Top view (viewport menu Perspective > Top).", "uk": "Перетягни Cube з Place Actors > Shapes (Window > Place Actors): при Scale 1 він має 1 м, добрий маркер. Введи перший кут пробної ділянки в Details > Location: острівний X x 100 і острівний Y x 100 (кут у X 240, Y -360 м стає 24000, -36000). Натисни End. Alt+перетягування — і ще три копії; введи інші кути. Ти маєш побачити чотири маркери у вигляді Top (меню в'юпорту Perspective > Top)."}, {"en": "Select one building from your plan (LI_HarbourHouse, kit walls or a pack building) and type its island X and Y x 100 into Details > Transform > Location. You should see the building jump to its spot.", "uk": "Виділи одну будівлю зі свого плану (LI_HarbourHouse, стіни з набору або будівля з паку) і введи її острівні X і Y x 100 у Details > Transform > Location. Ти маєш побачити, як будівля стрибає на своє місце."}, {"en": "Press End to drop it to the ground. Look at each corner from 2 m and lower its Z until the low side touches. You should see no gap under any corner.", "uk": "Натисни End, щоб опустити її на землю. Подивись на кожен кут з 2 м і зменшуй її Z, доки нижчий бік не торкнеться землі. Ти маєш побачити, що під жодним кутом немає щілини."}, {"en": "In the Top view, switch to Unlit (the Lit menu > Unlit) and run HighResShot 1920x1080 in the console (press the ` key under Esc). In Krita, put the picture on a layer over plot_plan_d1.png at 50 % opacity and scale it (Ctrl+T) until the four markers sit on the box corners. You should see the footprint within 0.5 m (2 px) of the plan's box.", "uk": "У вигляді Top перемкнися на Unlit (меню Lit > Unlit) і виконай HighResShot 1920x1080 у консолі (натисни клавішу ` під Esc). У Krita поклади картинку на шар над plot_plan_d1.png із непрозорістю 50 % і масштабуй її (Ctrl+T), доки чотири маркери не стануть на кути квадрата. Ти маєш побачити, що обрис відхиляється від квадрата на плані не більше ніж на 0,5 м (2 px)."}], "play": {"en": "Coordinates bingo: the tutor picks three rows from my sample.md. I place each and send the Details numbers, and it checks my sums.", "uk": "Бінго координат: тьютор вибирає три рядки з мого sample.md. Я розміщую кожен і надсилаю числа з Details, а він перевіряє мої обчислення."}, "video": {"url": "https://www.youtube.com/watch?v=lkjlP0Y4zvc", "title": "World Partition And Data Layers - Unreal Engine 5 Tutorial", "channel": "Pitchfork Academy", "length": "26:33", "search": "world partition and data layers tutorial"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Placing exactly from the plan on a big island (Day 41, lesson 2 of 4).\nToday's build: The district 1 sample plot: a 60 x 60 m slice of your waterfront placed from plot_plan_d1.png, and budget.md, which says what the sample costs in milliseconds.\n\nBy the end of this lesson I can:\n1. Turn plan coordinates into Unreal numbers: your plan is labelled in island metres (Day 23), and L_Island is centred on (0, 0) with X east and Y south (Days 22 and 26), so Location = island metres x 100 (Unreal works in centimetres).\n2. Place by typed numbers, then drop each piece to the ground with End and sink the low side.\n3. Keep district work on DL_District1, the Data Layer you made on Day 33, so you can hide the rest of the island while you work.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Coordinates bingo: the tutor picks three rows from my sample.md. I place each and send the Details numbers, and it checks my sums.\n4. Do-along on today's build (the sample box, its corner markers and the first building, placed with the tutor): guide me through these steps one at a time, checking a screenshot after each:\n   - Open Window > World Partition > Data Layer Outliner. Right-click DL_District1 (you made it on Day 33) > Make Current Data Layer. You should see it marked as current: new actors now go onto it.\n   - Drag a Cube from Place Actors > Shapes (Window > Place Actors): at Scale 1 it is 1 m, a good marker. Type the first sample corner into Details > Location: island X x 100 and island Y x 100 (a corner at X 240, Y -360 m goes to 24000, -36000). Press End. Alt+drag three copies and type the other corners. You should see four markers in a Top view (viewport menu Perspective > Top).\n   - Select one building from your plan (LI_HarbourHouse, kit walls or a pack building) and type its island X and Y x 100 into Details > Transform > Location. You should see the building jump to its spot.\n   - Press End to drop it to the ground. Look at each corner from 2 m and lower its Z until the low side touches. You should see no gap under any corner.\n   - In the Top view, switch to Unlit (the Lit menu > Unlit) and run HighResShot 1920x1080 in the console (press the ` key under Esc). In Krita, put the picture on a layer over plot_plan_d1.png at 50 % opacity and scale it (Ctrl+T) until the four markers sit on the box corners. You should see the footprint within 0.5 m (2 px) of the plan's box.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"World Partition And Data Layers - Unreal Engine 5 Tutorial\" by Pitchfork Academy: https://www.youtube.com/watch?v=lkjlP0Y4zvc\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "A frame budget: stat unit and stat gpu", "uk": "Бюджет кадру: stat unit і stat gpu"}, "minutes": 40, "goals": [{"en": "Explain a frame budget: at 60 frames a second each frame may take 16.6 ms (milliseconds, thousandths of a second); at 30 frames a second, 33.3 ms.", "uk": "Пояснювати бюджет кадру: при 60 кадрах на секунду кожен кадр може тривати 16,6 мс (мілісекунд, тисячних часток секунди); при 30 кадрах на секунду — 33,3 мс."}, {"en": "Measure the same way every time: Play in a New Editor Window at 1920 x 1080, Engine Scalability High, the same spots.", "uk": "Щоразу вимірювати однаково: Play у New Editor Window при 1920 x 1080, Engine Scalability High, ті самі місця."}, {"en": "Read stat unit (Frame is the total; the slowest of Game, Draw and GPU sets it) and stat gpu (the graphics card's time split into jobs).", "uk": "Читати stat unit (Frame — це загальний час; його задає найповільніший із Game, Draw і GPU) і stat gpu (час відеокарти, поділений на завдання)."}], "doalong": [{"en": "Open Engine Scalability Settings (the Settings menu on the right of the main toolbar) and click High. You should see every quality row set to High. Write 'High' in budget.md.", "uk": "Відкрий Engine Scalability Settings (меню Settings праворуч на головній панелі інструментів) і натисни High. Ти маєш побачити, що кожен рядок якості встановлено на High. Запиши «High» у budget.md."}, {"en": "Open Edit > Editor Preferences > Level Editor > Play. Under Game Viewport Settings set New Viewport Resolution to 1920 x 1080. You should see 1920 and 1080 in the two boxes.", "uk": "Відкрий Edit > Editor Preferences > Level Editor > Play. У розділі Game Viewport Settings встанови New Viewport Resolution на 1920 x 1080. Ти маєш побачити 1920 і 1080 у двох полях."}, {"en": "Click the three dots next to the green Play button and choose New Editor Window (PIE). Your Day 33 set-up makes you fly: W, A, S, D and the mouse, E to rise and Q to sink. You should see a 1920 x 1080 window flying over the island (on a 1920 x 1080 monitor it fills the screen; that is fine).", "uk": "Натисни три крапки біля зеленої кнопки Play і вибери New Editor Window (PIE). Твоє налаштування з Дня 33 дає змогу літати: W, A, S, D і миша, E — вгору, Q — вниз. Ти маєш побачити вікно 1920 x 1080 із польотом над островом (на моніторі 1920 x 1080 воно займає весь екран; це нормально)."}, {"en": "Click inside the Play window, press ` and type stat unit. You should see Frame, Game, Draw and GPU, each in milliseconds. Game is the game's logic, Draw is the CPU preparing the picture, GPU is the graphics card.", "uk": "Клацни у вікні Play, натисни ` і введи stat unit. Ти маєш побачити Frame, Game, Draw і GPU, кожне в мілісекундах. Game — це логіка гри, Draw — процесор (CPU), що готує картинку, GPU — відеокарта."}, {"en": "Fly to C4's spot (camera icons don't show in Play, so use your plan) and write the four numbers. You should see which of Game, Draw and GPU is biggest: that one sets your frame.", "uk": "Прилети на місце C4 (значки камер у Play не видно, тож орієнтуйся за планом) і запиши чотири числа. Ти маєш побачити, яке з Game, Draw і GPU найбільше: саме воно задає твій кадр."}, {"en": "Type stat gpu at the widest view and write the five biggest lines. You should see job names such as Lumen, Nanite, ShadowDepths or BasePass with their times.", "uk": "Введи stat gpu на найширшому вигляді й запиши п'ять найбільших рядків. Ти маєш побачити назви завдань, як-от Lumen, Nanite, ShadowDepths чи BasePass, з їхнім часом."}], "play": {"en": "Budget guess: before each measurement I guess the GPU time. The tutor keeps score: the closest guess wins the round.", "uk": "Вгадай бюджет: перед кожним вимірюванням я вгадую час GPU. Тьютор веде рахунок: найближча здогадка виграє раунд."}, "video": {"url": "https://www.youtube.com/watch?v=nQdsY2a-Fn8", "title": "What's Causing my Frame Rate to Drop? - Unreal Engine 5 Stat Profiling Tutorial", "channel": "NumenBrothers", "length": "6:09", "search": "unreal engine 5 stat unit stat gpu profiling"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: A frame budget: stat unit and stat gpu (Day 41, lesson 3 of 4).\nToday's build: The district 1 sample plot: a 60 x 60 m slice of your waterfront placed from plot_plan_d1.png, and budget.md, which says what the sample costs in milliseconds.\n\nBy the end of this lesson I can:\n1. Explain a frame budget: at 60 frames a second each frame may take 16.6 ms (milliseconds, thousandths of a second); at 30 frames a second, 33.3 ms.\n2. Measure the same way every time: Play in a New Editor Window at 1920 x 1080, Engine Scalability High, the same spots.\n3. Read stat unit (Frame is the total; the slowest of Game, Draw and GPU sets it) and stat gpu (the graphics card's time split into jobs).\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Budget guess: before each measurement I guess the GPU time. The tutor keeps score: the closest guess wins the round.\n4. Do-along on today's build (the sample box, its corner markers and the first building, placed with the tutor): guide me through these steps one at a time, checking a screenshot after each:\n   - Open Engine Scalability Settings (the Settings menu on the right of the main toolbar) and click High. You should see every quality row set to High. Write 'High' in budget.md.\n   - Open Edit > Editor Preferences > Level Editor > Play. Under Game Viewport Settings set New Viewport Resolution to 1920 x 1080. You should see 1920 and 1080 in the two boxes.\n   - Click the three dots next to the green Play button and choose New Editor Window (PIE). Your Day 33 set-up makes you fly: W, A, S, D and the mouse, E to rise and Q to sink. You should see a 1920 x 1080 window flying over the island (on a 1920 x 1080 monitor it fills the screen; that is fine).\n   - Click inside the Play window, press ` and type stat unit. You should see Frame, Game, Draw and GPU, each in milliseconds. Game is the game's logic, Draw is the CPU preparing the picture, GPU is the graphics card.\n   - Fly to C4's spot (camera icons don't show in Play, so use your plan) and write the four numbers. You should see which of Game, Draw and GPU is biggest: that one sets your frame.\n   - Type stat gpu at the widest view and write the five biggest lines. You should see job names such as Lumen, Nanite, ShadowDepths or BasePass with their times.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"What's Causing my Frame Rate to Drop? - Unreal Engine 5 Stat Profiling Tutorial\" by NumenBrothers: https://www.youtube.com/watch?v=nQdsY2a-Fn8\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "A CSV capture and the sample's verdict", "uk": "CSV-запис і вердикт пробної ділянки"}, "minutes": 40, "goals": [{"en": "Record a whole flight, not one moment: a CSV capture is a file with one row per frame and one column per timing, made with csvprofile start and csvprofile stop.", "uk": "Записувати весь політ, а не одну мить: CSV-запис — це файл з одним рядком на кадр і одним стовпцем на кожен замір часу, який роблять командами csvprofile start і csvprofile stop."}, {"en": "Read it in a free spreadsheet: =AVERAGE() gives the typical frame; =PERCENTILE(range, 0.95) gives the 95th percentile, the time that only the slowest 5 % of frames go over: the stutter a pilot feels.", "uk": "Читати його в безкоштовній електронній таблиці: =AVERAGE() дає типовий кадр; =PERCENTILE(range, 0.95) дає 95-й перцентиль, час, який перевищують лише 5 % найповільніших кадрів: ті ривки, які відчуває пілот."}, {"en": "Judge the sample two ways: beside your reference photos, and against the budget.", "uk": "Оцінювати пробну ділянку двома способами: поруч із референсними фото і за бюджетом."}], "doalong": [{"en": "In Play (New Editor Window), press ` and type csvprofile start. Fly through the sample for 60 seconds, then type csvprofile stop and press Esc to end Play. You should see a new .csv file, named with the date and time, in IslandCourse/Saved/Profiling/CSV.", "uk": "У Play (New Editor Window) натисни ` і введи csvprofile start. Пролети над пробною ділянкою 60 секунд, потім введи csvprofile stop і натисни Esc, щоб завершити Play. Ти маєш побачити новий файл .csv з датою й часом у назві в IslandCourse/Saved/Profiling/CSV."}, {"en": "Open the newest .csv in LibreOffice Calc. In the Text Import window choose Separated by Comma and set Language to English (USA), so numbers like 16.52 stay numbers and don't turn into text or dates. (In Google Sheets, first set File > Settings > Locale to United States, then File > Import.) You should see one row per frame and columns such as FrameTime and GPUTime (or names like them).", "uk": "Відкрий найновіший .csv у LibreOffice Calc. У вікні Text Import вибери Separated by Comma і встанови Language на English (USA), щоб числа на кшталт 16.52 лишалися числами й не ставали текстом чи датами. (У Google Sheets спершу встанови File > Settings > Locale на United States, потім File > Import.) Ти маєш побачити один рядок на кадр і стовпці, як-от FrameTime і GPUTime (або зі схожими назвами)."}, {"en": "Find where the FrameTime numbers end. In an empty cell type =AVERAGE(B2:B1800) with your own column letter and last row, and next to it =PERCENTILE(B2:B1800,0.95). Do the same for GPUTime. You should see four times in milliseconds; if you see an error, check the Language setting from the last step.", "uk": "Знайди, де закінчуються числа FrameTime. У порожній клітинці введи =AVERAGE(B2:B1800) зі своєю літерою стовпця й останнім рядком, а поруч =PERCENTILE(B2:B1800,0.95). Зроби те саме для GPUTime. Ти маєш побачити чотири значення в мілісекундах; якщо бачиш помилку, перевір налаштування Language з попереднього кроку."}, {"en": "Select the FrameTime column and insert a line chart (LibreOffice: Insert > Chart, then Line; Google Sheets: Insert > Chart, then Line chart). Screenshot it as csv_chart.png. You should see spikes where the flight got slow; note what was on screen there.", "uk": "Виділи стовпець FrameTime і встав лінійний графік (LibreOffice: Insert > Chart, потім Line; Google Sheets: Insert > Chart, потім Line chart). Зроби його скриншот як csv_chart.png. Ти маєш побачити піки там, де політ сповільнювався; запиши, що було в ту мить на екрані."}, {"en": "In Krita, put two sample shots beside two reference photos and write three keep-or-change lines. You should see at a glance what the recipe already gets right.", "uk": "У Krita постав два кадри пробної ділянки поруч із двома референсними фото й напиши три рядки «залишити чи змінити». Ти маєш одразу побачити, що рецепт уже робить правильно."}], "play": {"en": "Spike hunt: I tell the tutor where my chart spikes. It asks three questions about what was on screen there, and together we name the likely cause.", "uk": "Полювання на піки: я кажу тьютору, де на моєму графіку піки. Він ставить три запитання про те, що там було на екрані, і разом ми називаємо ймовірну причину."}, "video": {"url": "https://www.youtube.com/watch?v=Bzf35Aa-M1s", "title": "Level Streaming: Profiling And Performance Optimization. Ep.2 Perf Test And CSV Profiler", "channel": "UsefulCode", "length": "8:00", "search": "unreal engine csv profiler perf test"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: A CSV capture and the sample's verdict (Day 41, lesson 4 of 4).\nToday's build: The district 1 sample plot: a 60 x 60 m slice of your waterfront placed from plot_plan_d1.png, and budget.md, which says what the sample costs in milliseconds.\n\nBy the end of this lesson I can:\n1. Record a whole flight, not one moment: a CSV capture is a file with one row per frame and one column per timing, made with csvprofile start and csvprofile stop.\n2. Read it in a free spreadsheet: =AVERAGE() gives the typical frame; =PERCENTILE(range, 0.95) gives the 95th percentile, the time that only the slowest 5 % of frames go over: the stutter a pilot feels.\n3. Judge the sample two ways: beside your reference photos, and against the budget.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Spike hunt: I tell the tutor where my chart spikes. It asks three questions about what was on screen there, and together we name the likely cause.\n4. Do-along on today's build (the sample box, its corner markers and the first building, placed with the tutor): guide me through these steps one at a time, checking a screenshot after each:\n   - In Play (New Editor Window), press ` and type csvprofile start. Fly through the sample for 60 seconds, then type csvprofile stop and press Esc to end Play. You should see a new .csv file, named with the date and time, in IslandCourse/Saved/Profiling/CSV.\n   - Open the newest .csv in LibreOffice Calc. In the Text Import window choose Separated by Comma and set Language to English (USA), so numbers like 16.52 stay numbers and don't turn into text or dates. (In Google Sheets, first set File > Settings > Locale to United States, then File > Import.) You should see one row per frame and columns such as FrameTime and GPUTime (or names like them).\n   - Find where the FrameTime numbers end. In an empty cell type =AVERAGE(B2:B1800) with your own column letter and last row, and next to it =PERCENTILE(B2:B1800,0.95). Do the same for GPUTime. You should see four times in milliseconds; if you see an error, check the Language setting from the last step.\n   - Select the FrameTime column and insert a line chart (LibreOffice: Insert > Chart, then Line; Google Sheets: Insert > Chart, then Line chart). Screenshot it as csv_chart.png. You should see spikes where the flight got slow; note what was on screen there.\n   - In Krita, put two sample shots beside two reference photos and write three keep-or-change lines. You should see at a glance what the recipe already gets right.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Level Streaming: Profiling And Performance Optimization. Ep.2 Perf Test And CSV Profiler\" by UsefulCode: https://www.youtube.com/watch?v=Bzf35Aa-M1s\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "sample.md and plot_plan_d1.png with the sample box", "uk": "sample.md і plot_plan_d1.png із квадратом пробної ділянки"}, {"en": "budget.md (target, settings, stat unit at three spots, the stat gpu top five, the CSV averages and 95th percentiles)", "uk": "budget.md (ціль, налаштування, stat unit у трьох місцях, п'ятірка найбільших рядків stat gpu, середні значення і 95-ті перцентилі з CSV)"}, {"en": "The CSV file and csv_chart.png", "uk": "Файл CSV і csv_chart.png"}, {"en": "sample_board.png and sample_verdict.md", "uk": "sample_board.png і sample_verdict.md"}, {"en": "before_after_day41.png (the empty and the placed sample from C4)", "uk": "before_after_day41.png (порожня й заповнена пробна ділянка з C4)"}, {"en": "flythrough_day41.mp4 (60 seconds through the sample)", "uk": "flythrough_day41.mp4 (60 секунд над пробною ділянкою)"}, {"en": "summary.md", "uk": "звіт дня (summary.md)"}], "goal": {"en": "By the end of today you have a 60 x 60 m sample of your waterfront built in L_Island from your plan, and budget.md, which shows in milliseconds what the sample costs your PC.", "uk": "Наприкінці дня в тебе є пробна ділянка 60 x 60 м твоєї набережної, збудована в L_Island за твоїм планом, і budget.md, де в мілісекундах видно, скільки ця ділянка коштує твоєму ПК."}, "uses": [{"en": "Day 23: plot_plan_d1.png and plot_plan_d1.md, your counted plan for district 1, with its camera arrows C1 to C5", "uk": "День 23: plot_plan_d1.png і plot_plan_d1.md, твій план розміщення з підрахунками для району 1, зі стрілками камер C1-C5"}, {"en": "Day 24: your district 1 needs list and the free packs you picked", "uk": "День 24: твій список потреб для району 1 і вибрані тобою безкоштовні паки"}, {"en": "Day 20: your lit harbour corner (the kit, materials and light that already worked)", "uk": "День 20: твій освітлений куточок гавані (модульний набір, матеріали й світло, які вже спрацювали)"}, {"en": "Days 7 to 10: your kit (SM_QuayEdge_4m, SM_PierDeck_4m, the wall pieces and LI_HarbourHouse, your Day 10 Level Instance)", "uk": "Дні 7-10: твій модульний набір (SM_QuayEdge_4m, SM_PierDeck_4m, деталі стін і LI_HarbourHouse, твій Level Instance з Дня 10)"}, {"en": "Days 22 and 26: island metres (X east, Y south from the map centre) and L_Island centred on (0, 0)", "uk": "Дні 22 і 26: острівні метри (X на схід, Y на південь від центру мапи) і L_Island із центром у (0, 0)"}, {"en": "Day 33: DL_District1 and the flying Play set-up; Days 38 to 40: L_Island dressed by PCG, with KO_District1, the keep-out round district 1", "uk": "День 33: DL_District1 і налаштування польоту в Play; Дні 38-40: L_Island, наповнений через PCG, з KO_District1, зоною-винятком навколо району 1"}], "quiz": [{"q": {"en": "Why do you build a 60 x 60 m sample before the whole 200 x 200 m district?", "uk": "Навіщо будувати пробну ділянку 60 x 60 м перед цілим районом 200 x 200 м?"}, "options": [{"en": "It is faster to light a small area", "uk": "Малу площу швидше освітлити"}, {"en": "It tests the look and the cost of the recipe before days go into placing", "uk": "Вона перевіряє вигляд і вартість рецепта, перш ніж на розміщення підуть дні"}, {"en": "Unreal can't load a 200 m district at once", "uk": "Unreal не може завантажити район 200 м за раз"}, {"en": "The tutor can only review small areas", "uk": "Тьютор може переглядати лише малі площі"}], "answer": 1, "explain": {"en": "The sample is a cheap test of the whole recipe. If the look or the cost is wrong, you lose an afternoon, not a week.", "uk": "Пробна ділянка — це дешева перевірка всього рецепта. Якщо вигляд чи вартість не ті, ти втрачаєш пів дня, а не тиждень."}}, {"q": {"en": "stat unit shows Frame 21 ms, Game 6 ms, Draw 7 ms and GPU 20 ms. What limits your frame?", "uk": "stat unit показує Frame 21 мс, Game 6 мс, Draw 7 мс і GPU 20 мс. Що обмежує твій кадр?"}, "options": [{"en": "The game logic", "uk": "Логіка гри"}, {"en": "The CPU preparing the picture (Draw)", "uk": "Процесор, що готує картинку (Draw)"}, {"en": "The graphics card (GPU)", "uk": "Відеокарта (GPU)"}, {"en": "The hard drive", "uk": "Жорсткий диск"}], "answer": 2, "explain": {"en": "The slowest of Game, Draw and GPU sets the frame. Here the GPU takes 20 ms, so the graphics card is the limit.", "uk": "Кадр задає найповільніший із Game, Draw і GPU. Тут GPU займає 20 мс, тож обмеження — відеокарта."}}, {"q": {"en": "Your target is 60 frames a second. What is the most an average frame may take?", "uk": "Твоя ціль — 60 кадрів на секунду. Скільки щонайбільше може тривати середній кадр?"}, "options": [{"en": "16.6 ms", "uk": "16,6 мс"}, {"en": "33.3 ms", "uk": "33,3 мс"}, {"en": "60 ms", "uk": "60 мс"}, {"en": "6 ms", "uk": "6 мс"}], "answer": 0, "explain": {"en": "One second is 1,000 ms; 1,000 divided by 60 is about 16.6 ms per frame.", "uk": "Одна секунда — це 1000 мс; 1000, поділене на 60, — це приблизно 16,6 мс на кадр."}}, {"q": {"en": "Your CSV average frame time is 14 ms, but the 95th percentile is 38 ms. What does that tell you?", "uk": "У твоєму CSV середній час кадру 14 мс, але 95-й перцентиль — 38 мс. Що це означає?"}, "options": [{"en": "Everything is fine because the average is under budget", "uk": "Усе гаразд, бо середнє вкладається в бюджет"}, {"en": "Most frames are fine, but some hitches go over 33.3 ms and a pilot will feel them", "uk": "Більшість кадрів у нормі, але деякі ривки перевищують 33,3 мс, і пілот їх відчує"}, {"en": "The CSV file is broken", "uk": "Файл CSV зламаний"}, {"en": "The graphics card is idle", "uk": "Відеокарта простоює"}], "answer": 1, "explain": {"en": "The average hides the slow frames. A 95th percentile over 33.3 ms means stutters a pilot notices.", "uk": "Середнє ховає повільні кадри. 95-й перцентиль понад 33,3 мс означає ривки, які пілот помічає."}}, {"q": {"en": "Your plan puts a building at island X 240 m, Y -360 m. L_Island is centred on (0, 0) with the same axis directions. What do you type into Location?", "uk": "Твій план ставить будівлю в острівних X 240 м, Y -360 м. L_Island має центр у (0, 0) з тими самими напрямками осей. Що ти вводиш у Location?"}, "options": [{"en": "X 240, Y -360", "uk": "X 240, Y -360"}, {"en": "X 2400, Y -3600", "uk": "X 2400, Y -3600"}, {"en": "X -24000, Y 36000", "uk": "X -24000, Y 36000"}, {"en": "X 24000, Y -36000", "uk": "X 24000, Y -36000"}], "answer": 3, "explain": {"en": "Unreal works in centimetres, so multiply island metres by 100: 240 m is 24000 and -360 m is -36000. The signs stay, because the axes match.", "uk": "Unreal працює в сантиметрах, тож множ острівні метри на 100: 240 м — це 24000, а -360 м — це -36000. Знаки не змінюються, бо осі збігаються."}}], "weekInfo": {"week": 9, "title": {"en": "District 1: the waterfront", "uk": "Район 1: набережна"}, "goal": {"en": "By Friday you have district 1, your waterfront, built from your plan with your own kit, props, boats, plants and decals, measured against a frame budget, and five screenshots that stand beside your reference photos.", "uk": "До п'ятниці в тебе є район 1, твоя набережна, збудований за твоїм планом із твого власного модульного набору, пропсів, човнів, рослин і декалей, перевірений бюджетом кадру, та п'ять скриншотів, які витримують порівняння з твоїми референсними фото."}, "skills": [{"en": "Set dressing a 200 x 200 m district from a counted plot plan in Unreal Engine 5", "uk": "Наповнення сцени (set dressing) району 200 x 200 м за планом розміщення з підрахунками в Unreal Engine 5"}, {"en": "Performance budgeting with stat unit, stat gpu and CSV profiling", "uk": "Бюджет продуктивності зі stat unit, stat gpu і CSV-профілюванням"}, {"en": "Modular building assembly with Level Instances and Packed Level Actors", "uk": "Збирання модульних будівель за допомогою Level Instances і Packed Level Actors"}, {"en": "Decal and material-wear storytelling for realistic environments", "uk": "Розповідь через декалі та зношеність матеріалів для реалістичного оточення"}, {"en": "Art review against reference photographs with located see-why-fix notes", "uk": "Арт-рев'ю за референсними фото з прив'язаними до місця нотатками «що бачу, чому, як виправити»"}]}, "morning": {"sofar": {"en": "Eight weeks in, your whole island is dressed by PCG, from forest to shoreline, on land and water you shaped yourself.", "uk": "Вісім тижнів позаду, і весь твій острів наповнено через PCG — від лісу до берегової лінії — на землі й воді, сформованих твоїми руками."}, "today": {"en": "You build a 60 x 60 m sample of your waterfront from your plan and measure in milliseconds what it costs your PC.", "uk": "Сьогодні ти будуєш за своїм планом зразок набережної 60 x 60 м і вимірюєш у мілісекундах, скільки він коштує твоєму ПК."}, "cheer": {"en": "A sample is a safe place to test, so try things freely; the numbers only tell you what to do next.", "uk": "Зразок — безпечне місце для тестів, тож пробуй вільно; числа лише підказують, що робити далі."}, "quote": {"text": {"en": "I have always been more interested in experiment, than in accomplishment.", "uk": "Мене завжди більше цікавив експеримент, ніж досягнення."}, "author": {"en": "Orson Welles", "uk": "Орсон Веллс"}, "source": "https://en.wikiquote.org/wiki/Orson_Welles"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-41-district1-sample-and-budget", "mapHref": "../../COURSE.html", "prevHref": "../Day-40-boss-whole-island-pcg/START-HERE.html", "nextHref": "../Day-42-district1-buildings-and-fronts/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8, Krita and a free spreadsheet. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me and don't write code. Keep me moving and make it feel like a game.\n\nToday I build on my own: The rest of the sample, the budget and the CSV capture, on your own.\nIt's part of: The district 1 sample plot: a 60 x 60 m slice of your waterfront placed from plot_plan_d1.png, and budget.md, which says what the sample costs in milliseconds (Inside district 1, the red 200 x 200 m box on island_map.png: the 60 x 60 m slice of plot_plan_d1.png that holds the typical mix, for example a stretch of quay, two or three buildings, a street and some planting.).\n\nSpec:\n- sample.md: the four corners of the 60 x 60 m box in island metres, then every row of plot_plan_d1.md inside the box (item, count, where in metres, source). Every count is a number.\n- In L_Island, on DL_District1 (your Day 33 Data Layer, made current): four 1 m corner markers at the sample's corners, and every sample item at its plan coordinates (island metres x 100 = Location in centimetres). Nothing extra: if the plan is wrong, change the plan first.\n- Pieces: your quay and pier kit along the water, two or three buildings (LI_HarbourHouse from Day 10, kit walls or a pack building), a few of your Week 1 props and a few pack plants. Every base touches the ground; nothing floats.\n- Five Cine Cameras C1 to C5 for the whole district (C1 the approach, C2 the buildings, C3 the main feature, C4 one wide view, C5 close on the ground), placed from the camera arrows on plot_plan_d1.png (Day 23: each with its height and hero photo) and locked. They sit beside your Day 30 island cameras, CAM_Island_C1 to CAM_Island_C3, so no two cameras share a name. At least two of the five see the sample.\n- budget.md: the target (an average frame under 16.6 ms, and the 95th percentile under 33.3 ms, at 1920 x 1080), the settings (Play in a New Editor Window at 1920 x 1080, Engine Scalability High) and stat unit numbers (Frame, Game, Draw, GPU) at three spots: the launch point, C4 and the widest view. stat unit is a console command that shows how many milliseconds each frame takes.\n- stat gpu at the widest view: the five biggest lines, in budget.md. stat gpu is a console command that splits the graphics card's time into jobs, such as shadows or light.\n- One CSV capture of a 60-second flight through the sample (a file that records the time of every frame), opened in a free spreadsheet, with the average and the 95th percentile (the time that only the slowest 5 % of frames go over) of frame time and GPU time, and a line chart of frame time (csv_chart.png).\n- sample_verdict.md: two engine shots beside two reference photos on sample_board.png, three lines on what the recipe keeps or changes, and one line on cost: is there room in the budget for the full district?\n\nMy checklist:\n1. Open plot_plan_d1.png in Krita and draw a 60 x 60 m box (240 px) over the slice with the typical mix. Write sample.md: the box corners in island metres and every plan row inside it. Check: every row has a number and a place in metres. (from lesson 1)\n2. In L_Island, load district 1's region and make DL_District1 the current Data Layer. Place four 1 m cube markers at the sample's corners by typed coordinates (island metres x 100). Check: in a Top view the markers sit where the box sits on your plan. (from lesson 2)\n3. Place five Cine Cameras C1 to C5 from the camera arrows on plot_plan_d1.png; pilot, frame and lock each one. Screenshot the empty sample from C4 for your before picture. Check: each camera shows what its arrow and hero photo promise, and a locked camera doesn't move when you drag it. (from lesson 1)\n4. Quay and pier: lay SM_QuayEdge_4m pieces along the sample's water edge and SM_PierDeck_4m where the plan puts the pier. Check: from 2 m there is no gap between pieces and the tops are level. (from lesson 2)\n5. Buildings: place two or three buildings at their plan coordinates (LI_HarbourHouse, kit walls or a pack building), press End and sink the low side. Check: all four corners touch the ground when you look from 2 m. (from lesson 2)\n6. Props and plants: a few of your Week 1 props and pack plants at their plan places. Check: a low side view shows no floating base. (from lesson 2)\n7. Set Engine Scalability to High and the play window to 1920 x 1080; write the target and both settings in budget.md. Check: budget.md has a target line and a settings line. (from lesson 3)\n8. In Play (New Editor Window), fly with your Day 33 flying set-up and use stat unit at the launch point, at C4's spot and at the widest view; write Frame, Game, Draw and GPU for each. Check: three rows of four numbers in budget.md. (from lesson 3)\n9. stat gpu at the widest view; write its five biggest lines in budget.md. Check: you can name the job that costs the most. (from lesson 3)\n10. CSV capture: csvprofile start, fly 60 seconds through the sample, csvprofile stop. Open the file in a spreadsheet (Language English (USA)), work out the average and the 95th percentile of frame time and GPU time, and save a line chart as csv_chart.png. Check: four numbers in budget.md, each in milliseconds, and the chart saved. (from lesson 4)\n11. Shoot the sample from the two cameras that see it and put each beside its nearest reference photo in sample_board.png. Check: engine shot on the left, photo on the right, the same kind of view. (from lesson 4)\n12. Write sample_verdict.md: three keep-or-change lines and the cost line. Paste it and the board into the tutor chat and add any note you accept. Check: the file ends with yes or no to 'the recipe works'. (from lesson 4)\n13. Capture: the empty sample beside the placed sample from C4 (before_after_day41.png), and a 60-second flight through the sample at drone height in game view. Save today's clip as flythrough_day41.mp4. Check: both files are in today's Work folder. (from lesson 4)\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Anastasia\nDay 41: District 1 sample plot and your frame budget. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);

const slider=p=>'<div class="slider"><i style="width:calc('+p+'% - 6px)"></i><b style="left:clamp(13px,'+p+'%,calc(100% - 13px))"></b></div>';
function quiz(){if(!D.quiz||!D.quiz.length)return '';const a=st.qa||{};let ok=0;const L=u('letters');
 const pips='<div class="pips well" aria-hidden="true">'+D.quiz.map((q,i)=>'<i class="'+(a[i]==null?'':a[i]===q.answer?'r':'w')+'"></i>').join('')+'</div>';
 const qs=D.quiz.map((q,i)=>{const c=a[i];if(c===q.answer)ok++;return '<div class="qz"><p class="qq"><span class="qn">'+(i+1)+'</span><span>'+lk(x(q.q))+'</span></p>'+q.options.map((o,k)=>{let cls='opt',mk='<span></span>';if(c!=null){if(k===q.answer){cls+=' right';mk=ic('check','mk')}else if(k===c){cls+=' wrong';mk=ic('x','mk')}}return '<button class="'+cls+'" id="o'+i+'_'+k+'"'+(c!=null?' disabled':'')+' onclick="pick('+i+','+k+')"><span class="lt">'+(L[k]||k+1)+'</span><span>'+esc(x(o))+'</span>'+mk+'</button>'}).join('')+(c!=null?'<p class="exp '+(c===q.answer?'r':'w')+'" id="e'+i+'" tabindex="-1"><b>'+(c===q.answer?u('right'):u('wrong'))+'</b>'+lk(x(q.explain))+'</p>':'')+'</div>'}).join('');
 return '<section class="card glass quiz">'+lab(u('quiz'),'gold')+'<p class="muted" style="margin:-6px 0 14px">'+u('quizSub')+'</p>'+pips+qs+(qDone()?'<div class="score well" role="status"><span class="eyebrow">'+u('score')+'</span><span class="lcd" aria-label="'+ok+' / '+D.quiz.length+'">'+seg(ok+'/'+D.quiz.length)+'</span><div class="row"><button class="btn ghost" id="retry" onclick="retry()">'+u('retry')+'</button></div></div>':'')+'</section>'}
function vid(v){if(!v)return '';const link=v.url?'<a href="'+esc(v.url)+'" target="_blank" rel="noopener">'+esc(x(v.title)||v.url)+'</a>'+(v.channel?' <span class="muted">· '+esc(v.channel)+(v.length?' · '+esc(v.length):'')+'</span>':''):'';const s=v.search?'<a href="https://www.youtube.com/results?search_query='+encodeURIComponent(v.search)+'" target="_blank" rel="noopener">'+u('noVid')+': '+esc(v.search)+'</a>':'';const alt=v.alt&&v.alt.url?'<br><span class="eyebrow">UA</span> <a href="'+esc(v.alt.url)+'" target="_blank" rel="noopener">'+esc(v.alt.title||v.alt.url)+'</a>'+(v.alt.channel?' <span class="muted">· '+esc(v.alt.channel)+'</span>':''):'';return '<div class="vid well">'+kn('play')+'<div><b>'+u('more')+'?</b><br>'+(link||s)+alt+(link&&s?'<br><span class="muted" style="font-size:14px">'+s+'</span>':'')+'</div></div>'}
function morning(){const m=D.morning;if(!m)return '';const q=m.quote||{};
 let shelf='';if(D.day>0){shelf='<div class="shelf" aria-hidden="true">';let g='';for(let d=0;d<D.day;d++){let p=0;try{p=(JSON.parse(localStorage.getItem('devteam:'+D.learner+':'+d))||{}).pct||0}catch(e){}g+='<i class="'+(p>=1?'d':'')+(d>0&&d%5===0?' bs':'')+'"></i>';if(d%5===0||d===D.day-1){shelf+='<span class="wkg">'+g+'</span>';g=''}}shelf+='</div>'}
 const qt=lang==='uk'&&q.original?q.original:x(q.text);
 return '<section class="card glass morning"><div class="mgrid">'+(m.sofar?'<div>'+lab(u('sofar'),'gold')+shelf+'<p class="mtxt">'+lk(x(m.sofar))+'</p></div>':'')+(m.today?'<div>'+lab(u('todayL'))+'<p class="mtxt">'+lk(x(m.today))+'</p></div>':'')+'</div>'+(m.cheer?'<p class="cheer">'+esc(x(m.cheer))+'</p>':'')+(qt?'<figure class="quote well">'+kn('quote')+'<blockquote>'+esc(qt)+'</blockquote>'+(q.author?'<figcaption>'+esc(x(q.author))+'</figcaption>':'')+'</figure>':'')+'</section>'}
function setLang(l){lang=l;try{localStorage.setItem('devteam:lang',lang)}catch(e){};render()}
function toggleLang(){setLang(lang==='uk'?'en':'uk')}
/* keep open sections and keyboard focus across re-renders */
const openD=new Set();
function tg(e){if(e.open)openD.add(e.id);else openD.delete(e.id)}
const op=id=>openD.has(id)?' open':'';
function render(){const ae=document.activeElement,fid=ae&&(ae.id||(ae.getAttribute('data-th')?'th-'+ae.getAttribute('data-th'):ae.getAttribute('lang')&&ae.closest('.seg')?'lg-'+ae.getAttribute('lang'):''));
 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);
 const b=D.build,P=Math.round(prog()*100);
 document.getElementById('top').innerHTML='<div class="topin glass"><a class="maplink" href="'+esc(D.mapHref)+'">'+kn('map')+u('map')+'</a><div class="crumb"><b>'+esc(x(D.learnerName))+'</b><span>'+u('week')+' '+D.week+'</span><span>'+u('day')+' '+D.day+' '+u('of')+' '+D.total+'</span></div>'+controls(lang,'setLang')+'</div><div class="tline"><i style="width:'+P+'%"></i></div>';
 const state=w=>w<D.week?'b':w===D.week?'n':'p';
 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 if(D.weekInfo){const w=D.weekInfo;h+='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}
 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p><div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+list(D.handin,'ul','ticks')+'<p class="path">'+ic('folder')+'<span>'+u('shipTo')+' <code>'+esc(D.workPath)+'</code></span></p>'+(D.lessons.length?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<p class="muted">'+u('report')+'</p><div class="row"><button class="btn s" onclick="cp(D.reportPrompt)">'+ic('copy')+u('copyR')+'</button></div></section>';
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();
</script>
</body>
</html>

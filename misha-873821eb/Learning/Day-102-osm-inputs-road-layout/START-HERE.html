<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 102</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

<script id="data" type="application/json">{"learner": "ib-misha-873821eb", "learnerName": {"en": "Misha", "uk": "Міша"}, "day": 102, "week": 21, "total": 110, "title": {"en": "Inputs from a real place: an OpenStreetMap extract becomes a road layout and zones", "uk": "Входи зі справжнього місця: вибірка OpenStreetMap стає розкладкою доріг і зонами"}, "theme": {"en": "Week 21: Capstone 1: the District Generator", "uk": "Тиждень 21: Випускний проєкт 1: District Generator"}, "build": {"item": {"en": "osm_to_layout.py and district_roads.csv in the plugin, S_RoadPoint and DT_DistrictRoads, BP_DistrictGenerator with a live street preview, DA_TownRules_District with zones from the map, and two or three corridors along real flight lines", "uk": "osm_to_layout.py і district_roads.csv у плагіні, S_RoadPoint і DT_DistrictRoads, BP_DistrictGenerator з живим переглядом вулиць, DA_TownRules_District із зонами з мапи і два-три коридори вздовж справжніх ліній польоту"}, "why": {"en": "Real places carry centuries of decisions: streets that follow the shore, a square in front of the church, lanes that bend round old walls. Using real map data gives your generator that logic for free, and turning open data into game layouts is a sought-after technical art skill. Doing it with a script means any place can be fed in the same way, with its licence travelling alongside.", "uk": "Справжні місця несуть століття рішень: вулиці йдуть уздовж берега, площа стоїть перед церквою, провулки огинають старі мури. Справжні картографічні дані дають генератору цю логіку задарма, а перетворення відкритих даних на ігрові розкладки — затребувана навичка технічного художника. Якщо робити це скриптом, будь-яке місце можна подати так само, а ліцензія йде поруч."}, "where": {"en": "The extract in your course folder (TechArt/District/map.osm, outside the plugin); osm_to_layout.py in Plugins/TechTools/Content/Python; district_roads.csv in Plugins/TechTools/TechData; S_RoadPoint, DT_DistrictRoads, BP_DistrictGenerator and DA_TownRules_District in /TechTools/District; L_District.", "uk": "Вибірка — у папці курсу (TechArt/District/map.osm, поза плагіном); osm_to_layout.py — у Plugins/TechTools/Content/Python; district_roads.csv — у Plugins/TechTools/TechData; S_RoadPoint, DT_DistrictRoads, BP_DistrictGenerator і DA_TownRules_District — у /TechTools/District; L_District."}, "spec": [{"en": "map.osm exported from openstreetmap.org (Export > Manually select a different area, around your Day 101 box) into TechArt/District, outside the plugin.", "uk": "map.osm експортовано з openstreetmap.org (Export > Manually select a different area, навколо рамки Дня 101) у TechArt/District, поза плагіном."}, {"en": "osm_to_layout.py in plain Python (csv, math, xml.etree.ElementTree): settings SRC, OUT, SIZE = 200 and KEEP (street kinds with a width in metres); to_m(lat, lon) giving metres with X east from the west edge and Y south from the north edge; a loop over the ways whose highway tag is in KEEP, keeping points inside the box plus 20 m and skipping roads with fewer than 2 points; district_roads.csv with the columns Name, Road, Point, X, Y, Width, Kind, and a printed count. It reads one file and writes one, so it needs no dry run.", "uk": "osm_to_layout.py на чистому Python (csv, math, xml.etree.ElementTree): налаштування SRC, OUT, SIZE = 200 і KEEP (типи вулиць із шириною в метрах). to_m(lat, lon) дає метри: X на схід від західного краю, Y на південь від північного. Цикл по шляхах (ways), чий тег highway є в KEEP, лишає точки всередині рамки плюс 20 м і пропускає дороги, у яких менше за 2 точки. district_roads.csv зі стовпцями Name, Road, Point, X, Y, Width, Kind і надрукована кількість. Скрипт читає один файл і пише один, тож пробний запуск не потрібен."}, {"en": "The planned mistake found and fixed: written first as y = (lat - min_lat) x 110540, the way a map grows upwards, the preview is mirrored (streets go round a block in the opposite order to the map); the fix is y = (max_lat - lat) x 110540, because in Unreal, when X points east, Y points south.", "uk": "Заплановану помилку знайдено й виправлено. Спершу формулу написано як y = (lat - min_lat) × 110540, як мапа росте вгору, і перегляд дзеркальний: вулиці обходять квартал у зворотному порядку до мапи. Виправлення: y = (max_lat - lat) × 110540, бо в Unreal, коли X дивиться на схід, Y дивиться на південь."}, {"en": "S_RoadPoint (Road Integer, Point Integer, X Float, Y Float, Width Float, Kind Name) and DT_DistrictRoads imported from district_roads.csv, reimported after every script run.", "uk": "S_RoadPoint (Road Integer, Point Integer, X Float, Y Float, Width Float, Kind Name) і DT_DistrictRoads, імпортований з district_roads.csv і повторно імпортований після кожного запуску скрипту."}, {"en": "BP_DistrictGenerator: a duplicate of BP_TownGenerator in /TechTools/District with Roads Table (Data Table, Instance Editable, default DT_DistrictRoads, Category Inputs); a function Read Rows that fills Rows Road, Rows Point (cm), Rows Width and Rows Kind and stops with a readable message when Roads Table is empty; a Construction Script that draws a flat box along every segment between two points of the same road on PreviewRoads; placed at 0, 0, 2 in L_District (2 cm up, so road surfaces never flicker against the ground).", "uk": "BP_DistrictGenerator — копія BP_TownGenerator у /TechTools/District з Roads Table (Data Table, Instance Editable, типово DT_DistrictRoads, Category Inputs). Функція Read Rows заповнює Rows Road, Rows Point (см), Rows Width і Rows Kind і зупиняється зі зрозумілим повідомленням, якщо Roads Table порожня. Construction Script малює на PreviewRoads пласку коробку вздовж кожного відрізка між двома точками однієї дороги. Генератор стоїть у 0, 0, 2 в L_District (на 2 см вище, щоб поверхня доріг ніколи не мерехтіла на ґрунті)."}, {"en": "DA_TownRules_District (a copy of DA_TownRules_Harbour) with Shore Point, Landmark Point and Shop Zone Min and Max (all in m) and Inland Direction, read from the preview and the map.", "uk": "DA_TownRules_District (копія DA_TownRules_Harbour) з Shore Point, Landmark Point, Shop Zone Min і Max (усе в м) та Inland Direction, зчитаними з перегляду і мапи."}, {"en": "Two or three corridors along real flight lines (for example along the waterfront and up the main street): Empty Actors with a Spline about 15 m up, tag KeepOutWide, in the generator's Keep Outs; CREDITS.md saying district_roads.csv is derived from OpenStreetMap data, © OpenStreetMap contributors, under the ODbL.", "uk": "Два-три коридори вздовж справжніх ліній польоту (наприклад, уздовж набережної і вгору головною вулицею): Empty Actors зі Spline приблизно на 15 м угорі, тег KeepOutWide, у Keep Outs генератора. CREDITS.md каже, що district_roads.csv — похідні дані OpenStreetMap, © OpenStreetMap contributors, за ліцензією ODbL."}], "piece1": "osm_to_layout.py, the Data Table and the street preview, with the planned mistake (built in the lessons)", "piece2": {"en": "The zones in DA_TownRules_District and the corridors, on your own", "uk": "Зони в DA_TownRules_District і коридори — самостійно"}, "steps": [{"text": {"en": "Check: the results of today's lessons are there (osm_to_layout.py with to_m() and the y fix, district_roads.csv, DT_DistrictRoads, and BP_DistrictGenerator's street preview in L_District). Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it. Open map.osm in Notepad and look around. Check: a bounds line near the top, many node lines with lat and lon, and way blocks with tag lines such as k=highway.", "uk": "Перевір, чи є результати сьогоднішніх уроків: osm_to_layout.py з to_m() і виправленням y, district_roads.csv, DT_DistrictRoads і перегляд вулиць BP_DistrictGenerator у L_District. Чогось бракує? Пройди зараз кроки «Разом із тьютором» того уроку (близько 25 хвилин): самостійна робота спирається на них. Відкрий map.osm у Notepad і роздивись. Перевірка: угорі рядок bounds, багато рядків node з lat і lon і блоки way з рядками tag на кшталт k=highway."}, "lesson": 1}, {"text": {"en": "Run osm_to_layout.py with File > Execute Python Script. Check: the Output Log prints the number of roads and points, and district_roads.csv opens in Notepad with the header Name,Road,Point,X,Y,Width,Kind.", "uk": "Запусти osm_to_layout.py через File > Execute Python Script. Перевірка: Output Log друкує кількість доріг і точок, а district_roads.csv відкривається в Notepad із заголовком Name,Road,Point,X,Y,Width,Kind."}, "lesson": 3}, {"text": {"en": "Import or reimport DT_DistrictRoads (right-click > Reimport). Check: one row per point named R1_P0, R1_P1 and so on, with X and Y between about -20 and 220.", "uk": "Імпортуй або повторно імпортуй DT_DistrictRoads (клацни правою кнопкою > Reimport). Перевірка: по рядку на точку з назвами R1_P0, R1_P1 і так далі, X і Y приблизно між -20 і 220."}, "lesson": "D69.1"}, {"text": {"en": "Place BP_DistrictGenerator at 0, 0, 2 in L_District. Check: grey strips trace the real streets inside the 200 m outline.", "uk": "Постав BP_DistrictGenerator у 0, 0, 2 в L_District. Перевірка: сірі смуги повторюють справжні вулиці всередині контуру 200 м."}, "lesson": 4}, {"text": {"en": "The mirror test: on the map go round one block clockwise naming its streets, then do the same from above in Unreal's Top view. Check: the same order; take preview_vs_map.png (the preview beside map_box.png, both north up: turn the Unreal picture until north, the -Y side, is up).", "uk": "Тест дзеркала: на мапі обійди один квартал за годинниковою стрілкою, називаючи вулиці, потім зроби те саме згори у виді Top в Unreal. Перевірка: порядок той самий. Зроби preview_vs_map.png (перегляд поруч із map_box.png, обидва північчю вгору: поверни картинку з Unreal, доки північ, бік -Y, не буде вгорі)."}, "lesson": 4}, {"text": {"en": "Measure one straight street in the preview with a middle-mouse drag in the Top view, and the same street against the map's scale bar. Check: the two lengths agree within 5 m.", "uk": "Виміряй одну пряму вулицю в перегляді, протягнувши середньою кнопкою миші у виді Top, і ту саму вулицю за шкалою масштабу мапи. Перевірка: дві довжини збігаються з точністю до 5 м."}, "lesson": 4}, {"text": {"en": "On your own: zones. Drop small cubes at the landmark, on the shore, a few metres inland, and at the two ends of the shop street; read their Locations and fill DA_TownRules_District: Landmark Point, Shore Point and Shop Zone Min and Max divided by 100 (all in metres), and Inland Direction from the shore cube towards the inland one, made length 1; set the generator's Rules to it. Check: each value matches its cube, and the landmark, shop street and shore sit where the map shows them.", "uk": "Самостійно: зони. Постав маленькі куби на орієнтирі, на березі, за кілька метрів углиб суходолу і на двох кінцях торгової вулиці. Прочитай їхні Location і заповни DA_TownRules_District: Landmark Point, Shore Point, Shop Zone Min і Max — поділені на 100 (усе в метрах), а Inland Direction — від куба на березі до куба вглибині, з довжиною 1. Признач цей асет у Rules генератора. Перевірка: кожне значення збігається зі своїм кубом, а орієнтир, торгова вулиця і берег стоять там, де їх показує мапа."}, "lesson": "D88.3"}, {"text": {"en": "On your own: corridors. Lay KO_Corridor01 along the waterfront and KO_Corridor02 up the main street (Empty Actor with a Spline about 15 m up, tag KeepOutWide) and add them to Keep Outs. Check: from 120 m both follow open lines (water, street), not the middle of blocks.", "uk": "Самостійно: коридори. Проклади KO_Corridor01 уздовж набережної і KO_Corridor02 угору головною вулицею (Empty Actor зі Spline приблизно на 15 м угорі, тег KeepOutWide) і додай їх у Keep Outs. Перевірка: з 120 м обидва йдуть відкритими лініями (вода, вулиця), а не серединою кварталів."}, "lesson": "D88.4"}, {"text": {"en": "Write the credit in CREDITS.md: the map data and district_roads.csv (derived data), © OpenStreetMap contributors, Open Database License, openstreetmap.org/copyright. Check: the credit names the data, the contributors, the licence and the link.", "uk": "Запиши рядок авторства в CREDITS.md: картографічні дані і district_roads.csv (похідні дані), © OpenStreetMap contributors, Open Database License, openstreetmap.org/copyright. Перевірка: рядок називає дані, учасників, ліцензію і посилання."}, "lesson": 1}, {"text": {"en": "Gold: run the script on a second extract of another town (new SRC and OUT), import it as DT_DistrictRoads_B and switch Roads Table to it. Check: a second, different street plan appears with no change to the Blueprint; switch back.", "uk": "Золото: запусти скрипт на другій вибірці іншого містечка (нові SRC і OUT), імпортуй як DT_DistrictRoads_B і перемкни на нього Roads Table. Перевірка: з'являється другий, інший план вулиць без жодної зміни в Blueprint. Перемкни назад."}, "lesson": 3}, {"text": {"en": "Commit and push ('Capstone inputs: osm_to_layout.py, DT_DistrictRoads, zones'). Copy osm_to_layout.py and district_roads.csv into today's Work folder: the reviewer cannot open your private repository. Check: GitHub has the new files, and the copies are in today's Work folder.", "uk": "Зроби коміт і надішли ('Capstone inputs: osm_to_layout.py, DT_DistrictRoads, zones'). Скопіюй osm_to_layout.py і district_roads.csv у робочу папку дня: рецензент не може відкрити твій приватний репозиторій. Перевірка: на GitHub нові файли, а копії лежать у робочій папці дня."}, "lesson": 4}, {"text": {"en": "Click Copy the day report, paste it into a new tutor chat, answer its questions and save its answer as summary.md in today's Work folder. Drag summary.md, osm_to_layout.py, district_roads.csv and preview_vs_map.png into today's hand-in folder (the button on this page); never a project or level folder. Check: the hand-in folder lists 4 files, each over 1 KB.", "uk": "Клацни «Копіювати звіт дня», встав у новий чат із тьютором, дай відповіді на його питання і збережи його відповідь як summary.md у робочій папці дня. Перетягни summary.md, osm_to_layout.py, district_roads.csv і preview_vs_map.png у папку здачі (кнопка на цій сторінці). Ніколи не перетягуй папку проєкту чи рівня. Перевірка: у папці здачі 4 файли, кожен більший за 1 КБ."}, "lesson": 1}], "assets": ["techart/road-layout-real-example.csv", "techart/code-style.md"], "next": {"en": "DT_DistrictRoads and DA_TownRules_District feed the generator core tomorrow (Day 103), and the corridors you drew decide where Day 104's dressing must stay clear.", "uk": "Завтра (День 103) DT_DistrictRoads і DA_TownRules_District живлять ядро генератора, а намальовані коридори визначають, де дрібниці Дня 104 мають лишити місце вільним."}}, "lessons": [{"title": {"en": "OpenStreetMap: free map data and its licence", "uk": "OpenStreetMap: вільні картографічні дані та їхня ліцензія"}, "minutes": 40, "goals": [{"en": "Export a box of real map data from openstreetmap.org as a .osm file.", "uk": "Експортувати рамку справжніх картографічних даних з openstreetmap.org як файл .osm."}, {"en": "Read the .osm format: nodes (points with a latitude and longitude), ways (lines through nodes) and tags (what a way is, such as highway=residential).", "uk": "Читати формат .osm: вузли (точки з широтою й довготою), шляхи (лінії через вузли) і теги (що таке шлях, як-от highway=residential)."}, {"en": "Know what the ODbL asks: the credit, and the same open licence on map data you derive and share.", "uk": "Знати, чого вимагає ODbL: рядка авторства і тієї самої відкритої ліцензії на похідні картографічні дані, якими ти ділишся."}], "doalong": [{"en": "Open openstreetmap.org, go to your Day 101 box and click Export at the top. Click Manually select a different area and drag the box onto your district, as close to your Day 101 corners as you can (the four numbers at the top of the panel are its edges). Click Export and confirm the download if asked.", "uk": "Відкрий openstreetmap.org, перейди до рамки Дня 101 і клацни Export угорі. Клацни Manually select a different area і перетягни рамку на свій район якомога ближче до кутів Дня 101 (чотири числа вгорі панелі — її краї). Клацни Export і, якщо попросить, підтверди завантаження."}, {"en": "You see map.osm downloaded; move it to TechArt/District in your course folder, outside the plugin. If Export says the area is too large, make the box smaller; if Export fails, use the Overpass API link in the same panel, which downloads the same box, and rename the file map.osm.", "uk": "Має вийти: map.osm завантажено. Перемісти його в TechArt/District у папці курсу, поза плагіном. Якщо Export каже, що область завелика, зменш рамку. Якщо Export не працює, скористайся посиланням Overpass API в тій самій панелі: воно завантажує ту саму рамку. Перейменуй файл на map.osm."}, {"en": "Open map.osm in Notepad. Near the top find the bounds line with minlat, minlon, maxlat and maxlon. You see your box's edges in degrees; compare them with your Day 101 corners. If your file has no bounds line (an Overpass file may not), type one under the first <osm ...> line: <bounds minlat=\"...\" minlon=\"...\" maxlat=\"...\" maxlon=\"...\"/> with your Day 101 corners.", "uk": "Відкрий map.osm у Notepad. Угорі знайди рядок bounds з minlat, minlon, maxlat і maxlon. Це краї твоєї рамки в градусах; порівняй їх із кутами Дня 101. Якщо у файлі немає рядка bounds (у файлі Overpass його може не бути), введи його під першим рядком <osm ...>: <bounds minlat=\"...\" minlon=\"...\" maxlat=\"...\" maxlon=\"...\"/> з кутами Дня 101."}, {"en": "Search (Ctrl+F) for highway. You see way blocks: a list of nd lines with ref numbers (the ids of the nodes the street passes through) and tag lines such as k=highway with v=residential, primary or footway.", "uk": "Знайди (Ctrl+F) highway. Має вийти: блоки way — список рядків nd з номерами ref (id вузлів, через які проходить вулиця) і рядки tag на кшталт k=highway з v=residential, primary чи footway."}, {"en": "Search for one of those ref numbers. You see a node line with its own lat and lon: a way is just a list of points, which is exactly what a spline is.", "uk": "Знайди один із цих номерів ref. Має вийти: рядок node з власними lat і lon. Шлях — це просто список точок, тобто саме те, що й сплайн."}, {"en": "Open openstreetmap.org/copyright again. Your street CSV will be derived data, so if you share it, it stays under the ODbL with the credit; pictures, videos and levels made from the data need only the credit. You see why CREDITS.md will name both the map and the CSV.", "uk": "Знову відкрий openstreetmap.org/copyright. Твій CSV вулиць буде похідними даними: якщо ти ним ділишся, він лишається під ODbL з рядком авторства. Картинкам, відео і рівням, зробленим із даних, потрібен лише рядок авторства. Тому CREDITS.md назве і мапу, і CSV."}], "play": {"en": "Tag sorter: the tutor names ten OpenStreetMap tags (highway=residential; highway=footway; highway=primary; building=yes; natural=coastline; amenity=place_of_worship; highway=service; leisure=park; highway=living_street; highway=steps). For each I say whether it becomes a road in my generator, a zone, or nothing.", "uk": "Сортувальник тегів: тьютор називає десять тегів OpenStreetMap (highway=residential; highway=footway; highway=primary; building=yes; natural=coastline; amenity=place_of_worship; highway=service; leisure=park; highway=living_street; highway=steps). Про кожен я кажу, чим він стане в моєму генераторі: дорогою, зоною чи нічим."}, "video": {"search": "openstreetmap export osm file nodes ways tags explained"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: OpenStreetMap: вільні картографічні дані та їхня ліцензія (Day 102, lesson 1 of 4). Today's build: osm_to_layout.py і district_roads.csv у плагіні, S_RoadPoint і DT_DistrictRoads, BP_DistrictGenerator з живим переглядом вулиць, DA_TownRules_District із зонами з мапи і два-три коридори вздовж справжніх ліній польоту.\nWhat I already know: День 101: design_doc.md, координати рамки, map_box.png і L_District; День 92: скрипти на чистому Python із csv і налаштуваннями вгорі; День 69: Data Tables, імпортовані з CSV через структуру рядка, і Reimport; Дні 87–89 і 99: BP_TownGenerator, PreviewRoads, DA_TownRules і Apply Plot Rules; День 88: KO_Corridor01, Keep Outs і Shop Zone, зчитана з кубів.\n\nBy the end of this lesson I can:\n1. Експортувати рамку справжніх картографічних даних з openstreetmap.org як файл .osm.\n2. Читати формат .osm: вузли (точки з широтою й довготою), шляхи (лінії через вузли) і теги (що таке шлях, як-от highway=residential).\n3. Знати, чого вимагає ODbL: рядка авторства і тієї самої відкритої ліцензії на похідні картографічні дані, якими ти ділишся.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: У тебе є проєктний документ District Generator, справжнє місце, вибране на OpenStreetMap, і L_District, що чекає в плагіні. Today: Ти перетворюєш справжню мапу на дані, які читає генератор: таблицю вулиць, яку пише скрипт Python, і зони з мапи. One encouraging line: Сьогоднішня запланована помилка з дзеркалом ловить людей у кожному рушії. Зустрівши її раз, ти помічатимеш її всю кар'єру.); 2 lines on why today matters and where it comes back, in plain words (from this: Справжні місця несуть століття рішень: вулиці йдуть уздовж берега, площа стоїть перед церквою, провулки огинають старі мури. Справжні картографічні дані дають генератору цю логіку задарма, а перетворення відкритих даних на ігрові розкладки — затребувана навичка технічного художника. Якщо робити це скриптом, будь-яке місце можна подати так само, а ліцензія йде поруч. It comes back: Завтра (День 103) DT_DistrictRoads і DA_TownRules_District живлять ядро генератора, а намальовані коридори визначають, де дрібниці Дня 104 мають лишити місце вільним.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-102-osm-inputs-road-layout exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (osm_to_layout.py, таблиця даних і перегляд вулиць із запланованою помилкою (робиш на уроках)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+ rator і DA_TownRules_District — у /TechTools/District; L_District.).\nWhy it matters: Справжні місця несуть століття рішень: вулиці йдуть уздовж берега, площа стоїть перед церквою, провулки огинають старі мури. Справжні картографічні дані дають генератору цю логіку задарма, а перетворення відкритих даних на ігрові розкладки — затребувана навичка технічного художника. Якщо робити це скриптом, будь-яке місце можна подати так само, а ліцензія йде поруч. It comes back: Завтра (День 103) DT_DistrictRoads і DA_TownRules_District живлять ядро генератора, а намальовані коридори визначають, де дрібниці Дня 104 мають лишити місце вільним.\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-102-osm-inputs-road-layout (on the drive I chose on Day 0).\nWhat I already know: День 101: design_doc.md, координати рамки, map_box.png і L_District; День 92: скрипти на чистому Python із csv і налаштуваннями вгорі; День 69: Data Tables, імпортовані з CSV через структуру рядка, і Reimport; Дні 87–89 і 99: BP_TownGenerator, PreviewRoads, DA_TownRules і Apply Plot Rules; День 88: KO_Corridor01, Keep Outs і Shop Zone, зчитана з кубів; today's lessons: OpenStreetMap: вільні картографічні дані та їхня ліцензія; osm_to_layout.py, частина 1: точки в метрах; osm_to_layout.py, частина 2: вулиці в CSV; Перегляд вулиць і запланована помилка. Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- map.osm експортовано з openstreetmap.org (Export > Manually select a different area, навколо рамки Дня 101) у TechArt/District, поза плагіном.\n- osm_to_layout.py на чистому Python (csv, math, xml.etree.ElementTree): налаштування SRC, OUT, SIZE = 200 і KEEP (типи вулиць із шириною в метрах). to_m(lat, lon) дає метри: X на схід від західного краю, Y на південь від північного. Цикл по шляхах (ways), чий тег highway є в KEEP, лишає точки всередині рамки плюс 20 м і пропускає дороги, у яких менше за 2 точки. district_roads.csv зі стовпцями Name, Road, Point, X, Y, Width, Kind і надрукована кількість. Скрипт читає один файл і пише один, тож пробний запуск не потрібен.\n- Заплановану помилку знайдено й виправлено. Спершу формулу написано як y = (lat - min_lat) × 110540, як мапа росте вгору, і перегляд дзеркальний: вулиці обходять квартал у зворотному порядку до мапи. Виправлення: y = (max_lat - lat) × 110540, бо в Unreal, коли X дивиться на схід, Y дивиться на південь.\n- S_RoadPoint (Road Integer, Point Integer, X Float, Y Float, Width Float, Kind Name) і DT_DistrictRoads, імпортований з district_roads.csv і повторно імпортований після кожного запуску скрипту.\n- BP_DistrictGenerator — копія BP_TownGenerator у /TechTools/District з Roads Table (Data Table, Instance Editable, типово DT_DistrictRoads, Category Inputs). Функція Read Rows заповнює Rows Road, Rows Point (см), Rows Width і Rows Kind і зупиняється зі зрозумілим повідомленням, якщо Roads Table порожня. Construction Script малює на PreviewRoads пласку коробку вздовж кожного відрізка між двома точками однієї дороги. Генератор стоїть у 0, 0, 2 в L_District (на 2 см вище, щоб поверхня доріг ніколи не мерехтіла на ґрунті).\n- DA_TownRules_District (копія DA_TownRules_Harbour) з Shore Point, Landmark Point, Shop Zone Min і Max (усе в м) та Inland Direction, зчитаними з перегляду і мапи.\n- Два-три коридори вздовж справжніх ліній польоту (наприклад, уздовж набережної і вгору головною вулицею): Empty Actors зі Spline приблизно на 15 м угорі, тег KeepOutWide, у Keep Outs генератора. CREDITS.md каже, що district_roads.csv — похідні дані OpenStreetMap, © OpenStreetMap contributors, за ліцензією ODbL.\n\nMy checklist (the same numbers show on my course page):\n1. Перевір, чи є результати сьогоднішніх уроків: osm_to_layout.py з to_m() і виправленням y, district_roads.csv, DT_DistrictRoads і перегляд вулиць BP_DistrictGenerator у L_District. Чогось бракує? Пройди зараз кроки «Разом із тьютором» того уроку (близько 25 хвилин): самостійна робота спирається на них. Відкрий map.osm у Notepad і роздивись. Перевірка: угорі рядок bounds, багато рядків node з lat і lon і блоки way з рядками tag на кшталт k=highway. (from lesson 1)\n2. Запусти osm_to_layout.py через File > Execute Python Script. Перевірка: Output Log друкує кількість доріг і точок, а district_roads.csv відкривається в Notepad із заголовком Name,Road,Point,X,Y,Width,Kind. (from lesson 3)\n3. Імпортуй або повторно імпортуй DT_DistrictRoads (клацни правою кнопкою > Reimport). Перевірка: по рядку на точку з назвами R1_P0, R1_P1 і так далі, X і Y приблизно між -20 і 220. (from day 69, lesson 1)\n4. Постав BP_DistrictGenerator у 0, 0, 2 в L_District. Перевірка: сірі смуги повторюють справжні вулиці всередині контуру 200 м. (from lesson 4)\n5. Тест дзеркала: на мапі обійди один квартал за годинниковою стрілкою, називаючи вулиці, потім зроби те саме згори у виді Top в Unreal. Перевірка: порядок той самий. Зроби preview_vs_map.png (перегляд поруч із map_box.png, обидва північчю вгору: поверни картинку з Unreal, доки північ, бік -Y, не буде вгорі). (from lesson 4)\n6. Виміряй одну пряму вулицю в перегляді, протягнувши середньою кнопкою миші у виді Top, і ту саму вулицю за шкалою масштабу мапи. Перевірка: дві довжини збігаються з точністю до 5 м. (from lesson 4)\n7. Самостійно: зони. Постав маленькі куби на орієнтирі, на березі, за кілька метрів углиб суходолу і на двох кінцях торгової вулиці. Прочитай їхні Location і заповни DA_TownRules_District: Landmark Point, Shore Point, Shop Zone Min і Max — поділені на 100 (усе в метрах), а Inland Direction — від куба на березі до куба вглибині, з довжиною 1. Признач цей асет у Rules генератора. Перевірка: кожне значення збігається зі своїм кубом, а орієнтир, торгова вулиця і берег стоять там, де їх показує мапа. (from day 88, lesson 3)\n8. Самостійно: коридори. Проклади KO_Corridor01 уздовж набережної і KO_Corridor02 угору головною вулицею (Empty Actor зі Spline приблизно на 15 м угорі, тег KeepOutWide) і додай їх у Keep Outs. Перевірка: з 120 м обидва йдуть відкритими лініями (вода, вулиця), а не серединою кварталів. (from day 88, lesson 4)\n9. Запиши рядок авторства в CREDITS.md: картографічні дані і district_roads.csv (похідні дані), © OpenStreetMap contributors, Open Database License, openstreetmap.org/copyright. Перевірка: рядок називає дані, учасників, ліцензію і посилання. (from lesson 1)\n10. Золото: запусти скрипт на другій вибірці іншого містечка (нові SRC і OUT), імпортуй як DT_DistrictRoads_B і перемкни на нього Roads Table. Перевірка: з'являється другий, інший план вулиць без жодної зміни в Blueprint. Перемкни назад. (from lesson 3)\n11. Зроби коміт і надішли ('Capstone inputs: osm_to_layout.py, DT_DistrictRoads, zones'). Скопіюй osm_to_layout.py і district_roads.csv у робочу папку дня: рецензент не може відкрити твій приватний репозиторій. Перевірка: на GitHub нові файли, а копії лежать у робочій папці дня. (from lesson 4)\n12. Клацни «Копіювати звіт дня», встав у новий чат із тьютором, дай відповіді на його питання і збережи його відповідь як summary.md у робочій папці дня. Перетягни summary.md, osm_to_layout.py, district_roads.csv і preview_vs_map.png у папку здачі (кнопка на цій сторінці). Ніколи не перетягуй папку проєкту чи рівня. Перевірка: у папці здачі 4 файли, кожен більший за 1 КБ. (from lesson 1)\n\nHow to help: ask which step number I'm on, then give me only the next step: the exact clicks and function seg(str,cls){str=String(str);const W=15,H=26,t=2.8,g=.9,P={a:[[g+t/2,0],[W-g-t/2,0],[W-g-t,t],[g+t,t]],d:[[g+t,H-t],[W-g-t,H-t],[W-g-t/2,H],[g+t/2,H]],g:[[g+t,H/2-t/2],[W-g-t,H/2-t/2],[W-g-t/2,H/2],[W-g-t,H/2+t/2],[g+t,H/2+t/2],[g+t/2,H/2]],f:[[0,g+t/2],[t,g+t],[t,H/2-g-t/2],[t/2,H/2-g],[0,H/2-g-t/2]],b:[[W,g+t/2],[W,H/2-g-t/2],[W-t/2,H/2-g],[W-t,H/2-g-t/2],[W-t,g+t]],e:[[0,H/2+g+t/2],[t/2,H/2+g],[t,H/2+g+t/2],[t,H-g-t],[0,H-g-t/2]],c:[[W,H/2+g+t/2],[W,H-g-t/2],[W-t,H-g-t],[W-t,H/2+g+t/2],[W-t/2,H/2+g]]};
 let x=0,o='';for(const ch of str){if(ch===' '){x+=8;continue}if(ch==='/'){o+='<path class="on" d="M'+(x+9)+' 2L'+(x+2)+' '+(H-2)+'L'+(x+4.5)+' '+(H-2)+'L'+(x+11.5)+' 2Z"/>';x+=15;continue}const on=SEG[ch]||'';
  for(const k of 'abcdefg')o+='<polygon class="'+(on.includes(k)?'on':'gh')+'" points="'+P[k].map(p=>(p[0]+x).toFixed(1)+','+p[1].toFixed(1)).join(' ')+'"/>';x+=W+5}

function island(state,pct,label){
 const cx=300,cy=205,R=172,TAU=Math.PI*2;

 const pt=(t,s,k)=>{const r=rad(t,s,k||0);return [cx+r*Math.cos(t),cy+r*Math.sin(t)*.78]};
 const f=n=>n.toFixed(1);
 const smooth=(P,closed)=>{let d='M'+f(P[0][0])+' '+f(P[0][1]);const n=P.length,g=i=>P[closed?(i+n)%n:Math.max(0,Math.min(n-1,i))];
  for(let i=0;i<(closed?n:n-1);i++){const p0=g(i-1),p1=g(i),p2=g(i+1),p3=g(i+2);d+='C'+f(p1[0]+(p2[0]-p0[0])/6)+' '+f(p1[1]+(p2[1]-p0[1])/6)+' '+f(p2[0]-(p3[0]-p1[0])/6)+' '+f(p2[1]-(p3[1]-p1[1])/6)+' '+f(p2[0])+' '+f(p2[1])}return d+(closed?'Z':'')};
 const ring=(s,k)=>{const P=[];for(let i=0;i<64;i++)P.push(pt(i/64*TAU,s,k));return smooth(P,true)};
 let o='<path class="c0" d="'+ring(1,0)+'"/>';
 [.84,.69,.55,.42,.3,.19,.1].forEach((s,k)=>o+='<path class="c" d="'+ring(s,k+1)+'"/>');
 const t0=-2.2,turns=1.55,wp=w=>{const t=(w-1)/11;return {a:t0+t*turns*TAU,s:1.1-t*.98}};
 const P=[],D=[];let last=0;for(let w=1;w<=12;w++)if(state(w)!=='p')last=w;
 for(let i=0;i<=110;i++){const t=i/110,a=t0+t*turns*TAU,s=1.1-t*.98,q=pt(a,s,0);P.push(q);if(last&&t<=(last-1)/11+1e-9)D.push(q)}
 o+='<path class="rt" d="'+smooth(P,false)+'"/>';

 for(let w=1;w<=12;w++){const c=state(w),{a,s}=wp(w),q=pt(a,s,0),lx=q[0]+(Math.cos(a)>=0?15:-15),an=Math.cos(a)>=0?'start':'end';

 s+='<circle class="face" cx="200" cy="200" r="168"/><circle class="track" cx="200" cy="200" r="176"/>';
 s+='<circle class="arc" cx="200" cy="200" r="176" stroke="url(#'+id+'g)" stroke-dasharray="'+(C*p).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 200 200)"/>';

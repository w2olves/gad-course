<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 63</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

The same Seed always gives the same layout; a new Seed gives a new one; nothing lands beyond the spline's ends.", "uk": "Те саме Seed завжди дає ту саму розкладку, нове Seed — нову. Ніщо не виходить за кінці сплайна."}, {"en": "L_Day63 with three scatters side by side (Seeds 1, 2 and 3) and one scatter along a path on your island, nothing floating.", "uk": "L_Day63 із трьома розсипами поруч (Seed 1, 2 і 3) і один розсип уздовж стежки на твоєму острові. Ніщо не висить у повітрі."}], "piece1": "The seeded scatter: one mesh, then three, then gaps (lessons)", "piece2": {"en": "Tuning for a look that is varied but calm, a Sink setting, and a scatter on your island, on your own", "uk": "Самостійно: спокійне різноманіття, параметр Sink і розсип на твоєму острові"}, "steps": [{"text": {"en": "Check: the results of today's lessons are there (BP_SplineScatter with Path, VariantA to VariantC, Seed and Set Stream; L_Day63). Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it. Open BP_SplineScatter and check it against the spec: Path, VariantA to VariantC, the settings with ranges and tooltips, Set Stream at the top and Clear Instances for all three components. Compile. Check: a green tick and no warnings in Compiler Results.", "uk": "Спершу перевір, чи є результати сьогоднішніх уроків: BP_SplineScatter з Path, VariantA–VariantC, Seed і Set Stream та L_Day63. Чогось бракує? Зроби вправу того уроку зараз (близько 25 хв), бо вона потрібна для збірки. Відкрий BP_SplineScatter і звір його з вимогами: Path, VariantA–VariantC, налаштування з діапазонами й підказками, Set Stream на початку і Clear Instances для всіх трьох компонентів. Клацни Compile. Перевірка: зелена позначка й жодних попереджень у Compiler Results."}, "lesson": 1}, {"text": {"en": "In L_Day63 place a scatter and shape a 30 m curve. Check: meshes follow the curve with varied turns and sizes, and none stands beyond the spline's ends.", "uk": "У L_Day63 розмісти розсип і сформуй криву 30 м. Перевірка: моделі йдуть за кривою з різними поворотами й розмірами, і жодна не стоїть за кінцями сплайна."}, "lesson": 2}, {"text": {"en": "Seed test: write down what you see at Seed 7 (for example 'two big rocks near the start, a gap in the middle'), change the Seed twice, then type 7 again. Check: Seed 7 gives exactly the picture you wrote down.", "uk": "Перевір зерно. Запиши, як виглядає розсип із Seed 7, наприклад: «два великі камені біля початку, проміжок посередині». Двічі зміни Seed, а потім знову введи 7. Перевірка: Seed 7 дає точно записану картину."}, "lesson": 1}, {"text": {"en": "Set VariantA to C to three meshes of one family from your kit or a free Fab pack (add any pack to credits.md in Work\\Assignment\\). Check: each component shows its mesh and the scatter mixes all three.", "uk": "Встанови у VariantA–VariantC три меші однієї родини зі свого набору або безкоштовного паку з Fab. Будь-який пак допиши в credits.md у Work\\Assignment\\. Перевірка: кожен компонент показує свій меш, а розсип змішує всі три."}, "lesson": 3}, {"text": {"en": "On your own, add a Float Sink (cm, default 0, ranges 0 to 50, Category Tool, tooltip Lowers every mesh into the ground) and subtract it from the location's Z with a Make Vector (0, 0, Sink) and a Subtract node before Make Transform. Check: Sink 20 lowers every mesh by 20 cm, and 0 puts them back.", "uk": "Самостійно додай Float Sink: см, типово 0, діапазони від 0 до 50, категорія Tool, підказка Lowers every mesh into the ground. Перед Make Transform віднімай від розташування Make Vector (0, 0, Sink) вузлом Subtract. Перевірка: Sink 20 опускає кожну модель на 20 см, а 0 повертає їх назад."}, "lesson": "D62.4"}, {"text": {"en": "Tune Gap Chance, Jitter, Min Scale, Max Scale and Sink until the row looks natural from 30 m. Write the values under a heading Day 63 in techtools_notes.md in Work\\Assignment\\ (beside credits.md; one notes file for the whole module). Check: no two neighbours look like copies, the row has a few gaps, and no rock shows a floating edge.", "uk": "Налаштовуй Gap Chance, Jitter, Min Scale, Max Scale і Sink, доки ряд не виглядатиме природно з висоти 30 м. Запиши значення під заголовком Day 63 у techtools_notes.md (Work\\Assignment\\, поруч із credits.md; один файл нотаток на весь модуль). Перевірка: жодні два сусіди не схожі на копії, у ряду є кілька проміжків, і в жодного каменя край не висить у повітрі."}, "lesson": 4}, {"text": {"en": "Edge tests: Spacing 2000 on a 10 m spline; Spacing 100 on a 2 m spline; Gap Chance 0.9. Check: the first shows no meshes and no error (no full slot fits), the second shows one or two meshes, and the third leaves only a few.", "uk": "Перевір крайні випадки: Spacing 2000 на сплайні 10 м; Spacing 100 на сплайні 2 м; Gap Chance 0.9. Перевірка: у першому випадку жодної моделі й жодної помилки, бо не вміщується жоден повний слот. У другому одна-дві моделі, а в третьому лишаються лише кілька."}, "lesson": 4}, {"text": {"en": "Place three copies with the same spline shape side by side and Seeds 1, 2 and 3. Then Alt+drag one copy. Save L_Day63 (Ctrl+S), open any other level and open L_Day63 again. Check: the reopened level still shows the three rows, three different rows come from one tool, and the Alt+drag copy matches its original until you change its Seed.", "uk": "Постав поруч три копії з однаковою формою сплайна й Seed 1, 2 і 3. Потім скопіюй одну перетягуванням з Alt. Збережи L_Day63 (Ctrl+S), відкрий будь-який інший рівень, а тоді знову L_Day63. Перевірка: у відкритому знову рівні три ряди, з одного інструмента вийшли три різні ряди, а копія з Alt збігається з оригіналом, доки ти не зміниш її Seed."}, "lesson": 1}, {"text": {"en": "On your island, place one scatter along a path, road edge or planting strip (rocks along a cliff path, shrubs on a verge, planters on a pavement); snap its points to the ground and add points where the ground changes. Check: from 30 m the row follows the edge, and nothing floats or sinks more than a quarter of its height.", "uk": "На острові постав один розсип уздовж стежки, краю дороги або смуги посадок. Це може бути каміння вздовж стежки над скелею, кущі на узбіччі або квітники на тротуарі. Опусти його точки на землю й додай точки там, де змінюється рельєф. Перевірка: з висоти 30 м ряд іде за краєм, ніщо не висить і не заходить у землю глибше ніж на чверть своєї висоти."}, "lesson": "D62.4"}, {"text": {"en": "Take scatter_graph.png (the Construction Script, node names readable) and seeds_day63.png (the three seeds from above). Check: two pictures in today's Work folder, and the three rows in the second differ.", "uk": "Зроби два скриншоти. scatter_graph.png — Construction Script, назви вузлів читаються. seeds_day63.png — три зерна згори. Перевірка: обидва зображення лежать у робочій папці дня, а три ряди на другому різні."}, "lesson": 1}, {"text": {"en": "Under Day 63 in techtools_notes.md add each variable and its range and three rules for variety without chaos. Click Copy the day report, paste it into a new tutor chat, answer its questions and save its answer as summary.md in today's Work folder. Drag summary.md, scatter_graph.png and seeds_day63.png into today's hand-in folder (the button on this page); never a project or level folder. Check: the hand-in folder lists 3 files, each over 1 KB.", "uk": "Під Day 63 у techtools_notes.md допиши кожну змінну з її діапазоном і три правила різноманіття без хаосу. Клацни «Копіювати звіт дня», встав текст у новий чат із тьютором, дай відповіді на його запитання й збережи відповідь як summary.md у робочій папці дня. Перетягни summary.md, scatter_graph.png і seeds_day63.png у папку здачі (кнопка на цій сторінці). Ніколи не здавай папку проєкту чи рівня. Перевірка: у папці здачі 3 файли, кожен більший за 1 КБ."}, "lesson": 4}], "assets": ["techart/code-style.md"], "next": {"en": "The seeded Stream comes back in every generator: on Friday (Day 65) it picks benches and bins along your promenade, and on Day 85 PCG scatters street props and trees the same way, seed for seed.", "uk": "Потік із зерном повертається в кожному генераторі. У п'ятницю (День 65) він вибирає лавки й урни вздовж твоєї набережної, а в День 85 PCG так само розсипає вуличні пропси й дерева, зерно за зерном."}}, "lessons": [{"title": {"en": "Random numbers you can repeat: the seed", "uk": "Випадкові числа, які можна повторити: зерно"}, "minutes": 40, "goals": [{"en": "Explain random numbers in a tool, and a seed: a number that starts the random sequence, so the same seed always gives the same 'random' results.", "uk": "Пояснювати, що таке зерно. Це число, що запускає випадкову послідовність: те саме зерно завжди дає ті самі «випадкові» результати."}, {"en": "Create a Random Stream from a Seed variable and store it in a variable, so each random node takes the next number in the sequence.", "uk": "Створювати Random Stream зі змінної Seed і зберігати його у змінній, щоб кожен випадковий вузол брав наступне число послідовності."}, {"en": "Prove it: print the first numbers for Seed 1, then Seed 2, then Seed 1 again.", "uk": "Доводити це на числах: виводити перші числа для Seed 1, потім Seed 2, потім знову Seed 1."}], "doalong": [{"en": "Make the folder Content/Tools/Day63 and the level L_Day63 (File > New Level > Basic). In Content/Tools/Blueprints right-click BP_SplineFence > Duplicate, name the copy BP_SplineScatter and open it. Delete the Rails component, the rail loop and the Rail Height variable; rename Posts to VariantA. You see the spline, one component and the post loop.", "uk": "Створи папку Content/Tools/Day63 і рівень L_Day63 (File > New Level > Basic). У Content/Tools/Blueprints клацни правою кнопкою на BP_SplineFence > Duplicate, назви копію BP_SplineScatter і відкрий її. Видали компонент Rails, цикл рейок і змінну Rail Height. Перейменуй Posts на VariantA. Має лишитися сплайн, один компонент і цикл стовпів."}, {"en": "Add an Integer variable Seed: default 1, Instance Editable, Category Tool, both ranges 0 to 9999, tooltip Same seed, same layout. Compile. You see Seed under Tool on a placed copy.", "uk": "Додай змінну Integer Seed: типово 1, Instance Editable, категорія Tool, обидва діапазони від 0 до 9999, підказка Same seed, same layout. Клацни Compile. На розміщеній копії під Tool з'являється Seed."}, {"en": "In the Construction Script, between the Construction Script node and Clear Instances, add Make Random Stream and connect Seed to its Initial Seed. Drag from its Return Value and choose Promote to Variable; name the variable Stream.", "uk": "У Construction Script між вузлом Construction Script і Clear Instances додай Make Random Stream. З'єднай Seed з його входом Initial Seed. Потягни від Return Value і вибери Promote to Variable. Назви змінну Stream."}, {"en": "If Make Random Stream is not offered, untick Context Sensitive; if it is still missing, add a variable of type Random Stream and use Set Random Stream Seed on it with Seed. Connect the Construction Script's white pin to Set Stream, and Set Stream's white output to Clear Instances. You see a Set Stream node in the white chain.", "uk": "Якщо Make Random Stream немає в списку, зніми прапорець Context Sensitive. Якщо його досі немає, додай змінну типу Random Stream і задай їй Seed вузлом Set Random Stream Seed. З'єднай білий вихід Construction Script із Set Stream, а білий вихід Set Stream — із Clear Instances. Має вийти вузол Set Stream у білому ланцюжку."}, {"en": "In Loop Body add Random Float in Range from Stream with Stream (Get) as its Stream, Min 0 and Max 100, and Print String its value. Compile and open the Output Log. You see a list of numbers; write the first three in your notes.", "uk": "У Loop Body додай Random Float in Range from Stream: Stream (Get) як його Stream, Min 0 і Max 100. Виведи значення вузлом Print String. Клацни Compile і відкрий Output Log. З'являється список чисел: запиши перші три в нотатки."}, {"en": "Set Seed to 2: you see new numbers. Set it back to 1: you see exactly your first three numbers again. Now connect Make Random Stream straight to the random node instead of Stream (Get), compile and look: every number is the same, because the stream starts over at each use. Put Stream (Get) back and delete the Print String.", "uk": "Встанови Seed на 2: числа нові. Поверни 1: знову точно твої перші три числа. Тепер з'єднай Make Random Stream прямо з випадковим вузлом замість Stream (Get) і клацни Compile. Усі числа однакові, бо потік щоразу починається заново. Поверни Stream (Get) і видали Print String."}], "play": {"en": "Seed or fresh: the tutor names five situations (a level designer reopens the level tomorrow; two artists build the same street on two PCs; a card game shuffles each round; a forest must look the same on every player's PC; a weather system picks today's clouds). For each I say whether I want a fixed seed or a fresh one, and why.", "uk": "Зерно чи нове щоразу: тьютор називає п'ять ситуацій. Дизайнер рівня завтра знову відкриває рівень; двоє художників будують ту саму вулицю на двох ПК; карткова гра тасує колоду щораунду; ліс має виглядати однаково на ПК кожного гравця; система погоди вибирає сьогоднішні хмари. Для кожної я кажу, чи потрібне фіксоване зерно, і чому."}, "video": {"search": "unreal engine 5 random stream seed blueprint"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Випадкові числа, які можна повторити: зерно (Day 63, lesson 1 of 4). Today's build: BP_SplineScatter: сплайн-інструмент, що розсипає уздовж лінії моделі трьох видів. Повороти, розміри, зсув і проміжки залежать від зерна. Розсип стоїть на тренувальному рівні й уздовж стежки на твоєму острові..\nWhat I already know: День 62: BP_SplineFence (Spline, Get Spline Length, Get Transform at Distance Along Spline, Truncate, Break Transform); День 61: змінні Instance Editable з діапазонами, Clear Instances і Add Instance; Твій набір або безкоштовний пак із Fab: три схожі моделі (три камені, три кущі або три квітники)..\n\nBy the end of this lesson I can:\n1. Пояснювати, що таке зерно. Це число, що запускає випадкову послідовність: те саме зерно завжди дає ті самі «випадкові» результати.\n2. Створювати Random Stream зі змінної Seed і зберігати його у змінній, щоб кожен випадковий вузол брав наступне число послідовності.\n3. Доводити це на числах: виводити перші числа для Seed 1, потім Seed 2, потім знову Seed 1.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: Ти маєш BP_BollardRow, BP_PlanterRow і BP_SplineFence: інструменти, що розставляють ряди й паркани вздовж будь-якої лінії, яку ти намалюєш. Today: Ти вивчаєш випадковість із зерном: різноманіття, що щоразу повертається однаковим. Сьогодні це розсип із трьох моделей. One encouraging line: Випадковість буває дикою, а зерно її приборкує. І це число тримаєш у руках ти.); 2 lines on why today matters and where it comes back, in plain words (from this: Природа й міста ніколи не повторюються точно: однакові копії з однаковим кроком видно як фальш з першого погляду. Випадкове різноманіття це виправляє. Але інструмент, що змінюється від кожного дотику, у справжньому проєкті марний, тому студії використовують зерна: те саме число завжди дає той самий результат. Так оформлюють кожен великий світ, від лісів PCG до вуличних дрібниць. It comes back: Потік із зерном повертається в кожному генераторі. У п'ятницю (День 65) він вибирає лавки й урни вздовж твоєї набережної, а в День 85 PCG так само розсипає вуличні пропси й дерева, зерно за зерном.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-63-spline-scatter-seeded exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (Розсип із зерном: одна модель, потім три, потім проміжки (уроки)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Створи папку Content/Tools/Day63 і рівень L_Day63 (File > New Level > Basic). У Content/Tools/Blueprints клацни правою кнопкою на BP_SplineFence > Duplicate, назви копію BP_SplineScatter і відкрий її. Видали компонент Rails, цикл рейок і змінну Rail Height. Перейменуй Posts на VariantA. Має лишитися сплайн, один компонент і цикл стовпів.\n   2. Додай змінну Integer Seed: типово 1, Instance Editable, категорія Tool, обидва діапазони від 0 до 9999, підказка Same seed, same layout. Клацни Compile. На розміщеній копії під Tool з'являється Seed.\n   3. У Construction Script між вузлом Construction Script і Clear Instances додай Make Random Stream. З'єднай Seed з його входом Initial Seed. Потягни від Return Value і вибери Promote to Variable. Назви змінну Stream. [screenshot]\n   4. Якщо Make Random Stream немає в списку, зніми прапорець Context Sensitive. Якщо його досі немає, додай змінну типу Random Stream і задай їй Seed вузлом Set Random Stream Seed. З'єднай білий вихід Construction Script із Set Stream, а білий вихід Set Stream — із Clear Instances. Має вийти вузол Set Stream у білому ланцюжку.\n   5. У Loop Body додай Random Float in Range from Stream: Stream (Get) як його Stream, Min 0 і Max 100. Виведи значення вузлом Print String. Клацни Compile і відкрий Output Log. З'являється список чисел: запиши перші три в нотатки.\n   6. Встанови Seed на 2: числа нові. Поверни 1: знову точно твої перші три числа. Тепер з'єднай Make Random Stream прямо з випадковим вузлом замість Stream (Get) і клацни Compile. Усі числа однакові, бо потік щоразу починається заново. Поверни Stream (Get) і видали Print String. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Зерно чи нове щоразу: тьютор називає п'ять ситуацій. Дизайнер рівня завтра знову відкриває рівень; двоє художників будують ту саму вулицю на двох ПК; карткова гра тасує колоду щораунду; ліс має виглядати однаково на ПК кожного гравця; система погоди вибирає сьогоднішні хмари. Для кожної я кажу, чи потрібне фіксоване зерно, і чому. Otherwise skip it.\n6. Finish with 1 multip подібні ряди."}, {"en": "Write three rules for variety without chaos in techtools_notes.md, for example: sizes within 20 percent of each other, one family of meshes per scatter, at most one gap in four. You see your rules next to the tool's defaults.", "uk": "Запиши в techtools_notes.md три правила різноманіття без хаосу. Наприклад: розміри в межах 20 % один від одного, одна родина мешів на розсип, не більше одного проміжку на чотири слоти. Порівняй свої правила з типовими значеннями інструмента."}], "play": {"en": "Art director: the tutor describes a street verge and a forest edge; for each I choose Spacing, Jitter, the scales and Gap Chance, and defend my numbers.", "uk": "Арт-директор: тьютор описує узбіччя вулиці й узлісся. Для кожного я вибираю Spacing, Jitter, масштаби й Gap Chance і захищаю свої числа."}, "video": {"search": "unreal engine 5 blueprint branch node beginners"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Проміжки та різноманіття без хаосу (Day 63, lesson 4 of 4). Today's build: BP_SplineScatter: сплайн-інструмент, що розсипає уздовж лінії моделі трьох видів. Повороти, розміри, зсув і проміжки залежать від зерна. Розсип стоїть на тренувальному рівні й уздовж стежки на твоєму острові..\nWhat I already know: День 62: BP_SplineFence (Spline, Get Spline Length, Get Transform at Distance Along Spline, Truncate, Break Transform); День 61: змінні Instance Editable з діапазонами, Clear Instances і Add Instance; Твій набір або безкоштовний пак із Fab: три схожі моделі (три камені, три кущі або три квітники)..\nEarlier today I already did: lesson 1 (Випадкові числа, які можна повторити: зерно); lesson 2 (Випадкові повороти, розміри й проміжки); lesson 3 (Три моделі та вибір: Switch on Int). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Пояснювати Branch: вузол, що йде шляхом True або False залежно від Boolean (значення true або false).\n2. Лишати природні проміжки вузлом Random Bool with Weight from Stream і налаштуванням Gap Chance.\n3. Оцінювати різноманіття з висоти дрона: групи й проміжки виглядають природно, рівний шум — фальшиво, а хаос — як поломка.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: 2 lines on why today matters and where it comes back, in plain words (from this: Природа й міста ніколи не повторюються точно: однакові копії з однаковим кроком видно як фальш з першого погляду. Випадкове різноманіття це виправляє. Але інструмент, що змінюється від кожного дотику, у справжньому проєкті марний, тому студії використовують зерна: те саме число завжди дає той самий результат. Так оформлюють кожен великий світ, від лісів PCG до вуличних дрібниць. It comes back: Потік із зерном повертається в кожному генераторі. У п'ятницю (День 65) він вибирає лавки й урни вздовж твоєї набережної, а в День 85 PCG так само розсипає вуличні пропси на родина мешів на розсип, не більше одного проміжку на чотири слоти. Порівняй свої правила з типовими значеннями інструмента. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Арт-директор: тьютор описує узбіччя вулиці й узлісся. Для кожного я вибираю Spacing, Jitter, масштаби й Gap Chance і захищаю свої числа. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; credits line = рядок авторства; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); default value = типове значення; File Explorer = Провідник; mesh = меш; vertex / edge / face = вершина / ребро / грань; origin (and kit pivot) = origin — точка, за яку об'єкт ставлять і обертають; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; material slot / node / pin = слот матеріалу / вузол / вхід; seed = зерно (налаштування Seed); kit / kit piece / part of one object = набір / деталь / частина; harbour / quay / waterfront / pier = гавань / причал / набережна / пірс; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}], "handin": [{"en": "summary.md", "uk": "summary.md (звіт дня)"}, {"en": "scatter_graph.png and seeds_day63.png (the Construction Script with readable node names; Seeds 1, 2 and 3 side by side) (proof)", "uk": "scatter_graph.png та seeds_day63.png (Construction Script з читабельними назвами вузлів; Seed 1, 2 і 3 поруч) (доказ)"}], "goal": {"en": "By the end of today you have BP_SplineScatter: rocks, shrubs or planters strewn along a spline with random turns, sizes, gaps and three mesh choices that always come back the same for the same Seed.", "uk": "До кінця дня ти матимеш BP_SplineScatter: каміння, кущі або квітники, розсипані вздовж сплайна. Повороти, розміри, проміжки й вибір із трьох моделей випадкові, але для того самого Seed результат завжди однаковий."}, "uses": [{"en": "Day 62: BP_SplineFence (Spline, Get Spline Length, Get Transform at Distance Along Spline, Truncate, Break Transform)", "uk": "День 62: BP_SplineFence (Spline, Get Spline Length, Get Transform at Distance Along Spline, Truncate, Break Transform)"}, {"en": "Day 61: Instance Editable variables with ranges, Clear Instances and Add Instance", "uk": "День 61: змінні Instance Editable з діапазонами, Clear Instances і Add Instance"}, {"en": "Your kit or a free Fab pack: three similar meshes (three rocks, three shrubs or three planters)", "uk": "Твій набір або безкоштовний пак із Fab: три схожі моделі (три камені, три кущі або три квітники)."}], "quiz": [{"q": {"en": "Every copy in your scatter has exactly the same turn, though you used a random node. What is the likely cause?", "uk": "Кожна копія в розсипі має точно той самий поворот, хоча випадковий вузол є. Яка ймовірна причина?"}, "options": [{"en": "The Seed is 0", "uk": "Seed дорівнює 0"}, {"en": "Make Random Stream is connected straight to the random node, so the stream restarts at each use", "uk": "Make Random Stream з'єднано прямо із випадковим вузлом, тож потік починається заново при кожному використанні"}, {"en": "Jitter is too small", "uk": "Jitter замалий"}, {"en": "Switch on Int has only two outputs", "uk": "Switch on Int має лише два виходи"}], "answer": 1, "explain": {"en": "Store the stream in a variable once per rebuild; then each random node takes the next number in the sequence.", "uk": "Збережи потік у змінній один раз на перебудову. Тоді кожен випадковий вузол бере наступне число послідовності."}}, {"q": {"en": "Why do studios use a seed in level tools instead of plain random numbers?", "uk": "Чому студії використовують зерно в інструментах рівнів замість простих випадкових чисел?"}, "options": [{"en": "The same seed always rebuilds the same layout, so the level never changes by itself", "uk": "Те саме зерно завжди відбудовує ту саму розкладку, тож рівень ніколи не змінюється сам"}, {"en": "Seeds make the tool draw faster", "uk": "Із зернами інструмент малює швидше"}, {"en": "Seeds stop meshes floating", "uk": "Зерна не дають моделям висіти в повітрі"}], "answer": 0, "explain": {"en": "A seeded tool is random-looking but repeatable, so a saved level stays exactly as the artist left it.", "uk": "Інструмент із зерном виглядає випадковим, але повторюваним, тож збережений рівень лишається точно таким, яким його лишив художник."}}, {"q": {"en": "Which node sends the white execution line down one of several outputs chosen by a number?", "uk": "Який вузол спрямовує білу лінію виконання на один із кількох виходів за числом?"}, "options": [{"en": "Branch", "uk": "Branch"}, {"en": "For Loop", "uk": "For Loop"}, {"en": "Switch on Int", "uk": "Switch on Int"}, {"en": "Make Transform", "uk": "Make Transform"}], "answer": 2, "explain": {"en": "Switch on Int picks an output by its number; a Branch only has True and False.", "uk": "Switch on Int вибирає вихід за числом, а Branch має лише True і False."}}, {"q": {"en": "From 30 m your rock row looks like pieces thrown everywhere. Which change helps most?", "uk": "З висоти 30 м твій ряд каміння виглядає як уламки, розкидані де попало. Яка зміна допоможе найбільше?"}, "options": [{"en": "Raise Gap Chance to 0.9", "uk": "Підняти Gap Chance до 0.9"}, {"en": "Change the Seed every time you open the level", "uk": "Змінювати Seed щоразу, коли відкриваєш рівень"}, {"en": "Use three different families of mesh", "uk": "Узяти три різні родини моделей"}, {"en": "Narrow the scale range and lower Jitter", "uk": "Звузити діапазон масштабу й зменшити Jitter"}], "answer": 3, "explain": {"en": "Calmer ranges keep variety believable; a huge scale range and big jitter read as chaos.", "uk": "Спокійніші діапазони тримають різноманіття правдоподібним. Величезний діапазон масштабу й великий зсув виглядають як хаос."}}, {"q": {"en": "Gap Chance is 0.25. About how many of 40 slots stay empty?", "uk": "Gap Chance дорівнює 0.25. Приблизно скільки зі 40 слотів лишаються порожніми?"}, "options": [{"en": "About 10", "uk": "Приблизно 10"}, {"en": "About 25", "uk": "Приблизно 25"}, {"en": "Exactly 4", "uk": "Рівно 4"}, {"en": "None", "uk": "Жодного"}], "answer": 0, "explain": {"en": "Each slot has a one-in-four chance of a gap, so about 40 x 0.25 = 10 stay empty; the exact number depends on the Seed.", "uk": "Кожен слот має один шанс із чотирьох лишитися порожнім, тож порожніх приблизно 40 × 0.25 = 10. Точне число залежить від Seed."}}], "weekInfo": null, "morning": {"sofar": {"en": "You have BP_BollardRow, BP_PlanterRow and BP_SplineFence: tools that lay rows and fences along any line you draw.", "uk": "Ти маєш BP_BollardRow, BP_PlanterRow і BP_SplineFence: інструменти, що розставляють ряди й паркани вздовж будь-якої лінії, яку ти намалюєш."}, "today": {"en": "You learn seeded randomness: variety that comes back the same every time, in a scatter of three meshes.", "uk": "Ти вивчаєш випадковість із зерном: різноманіття, що щоразу повертається однаковим. Сьогодні це розсип із трьох моделей."}, "cheer": {"en": "Randomness can feel wild; a seed tames it, and you are the one who holds the number.", "uk": "Випадковість буває дикою, а зерно її приборкує. І це число тримаєш у руках ти."}, "quote": {"text": {"en": "The best way to predict the future is to invent it.", "uk": "Найкращий спосіб передбачити майбутнє — винайти його."}, "author": {"en": "Alan Kay", "uk": "Алан Кей"}, "source": "Said at a 1971 Xerox PARC meeting; recalled in his essay Predicting the Future, Stanford Engineering, 1989"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-63-spline-scatter-seeded", "mapHref": "../../COURSE.html", "prevHref": "../Day-62-spline-fence/START-HERE.html", "nextHref": "../Day-64-street-lamp-mpc-events/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8. I am a beginner on Day 63. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me: when my Blueprint or script fails, ask for the error message or a screenshot of the graph, point to the line or node that is wrong and explain why, then let me fix it myself. Never write the whole tool for me.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: Самостійно: спокійне різноманіття, параметр Sink і розсип на твоєму острові.\nIt's part of: BP_SplineScatter: сплайн-інструмент, що розсипає уздовж лінії моделі трьох видів. Повороти, розміри, зсув і проміжки залежать від зерна. Розсип стоїть на тренувальному рівні й уздовж стежки на твоєму острові. (Content/Tools/Day63/L_Day63, а потім уздовж однієї стежки, краю дороги або смуги посадок на твоєму острові.).\nWhy it matters: Природа й міста ніколи не повторюються точно: однакові копії з однаковим кроком видно як фальш з першого погляду. Випадкове різноманіття це виправляє. Але інструмент, що змінюється від кожного дотику, у справжньому проєкті марний, тому студії використовують зерна: те саме число завжди дає той самий результат. Так оформлюють кожен великий світ, від лісів PCG до вуличних дрібниць. It comes back: Потік із зерном повертається в кожному генераторі. У п'ятницю (День 65) він вибирає лавки й урни вздовж твоєї набережної, а в День 85 PCG так само розсипає вуличні пропси й дерева, зерно за зерном.\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-63-spline-scatter-seeded (on the drive I chose on Day 0).\nWhat I already know: День 62: BP_SplineFence (Spline, Get Spline Length, Get Transform at Distance Along Spline, Truncate, Break Transform); День 61: змінні Instance Editable з діапазонами, Clear Instances і Add Instance; Твій набір або безкоштовний пак із Fab: три схожі моделі (три камені, три кущі або три квітники).; today's lessons: Випадкові числа, які можна повторити: зерно; Випадкові повороти, розміри й проміжки; Три моделі та вибір: Switch on Int; Проміжки та різноманіття без хаосу. Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- BP_SplineScatter у Content/Tools/Blueprints: Spline на ім'я Path і три компоненти Instanced Static Mesh — VariantA, VariantB і VariantC. У них три моделі однієї родини або Cone, Sphere і Cylinder з /Engine/BasicShapes.\n- Змінні Instance Editable у категорії Tool, з підказками й діапазонами. Seed: Integer, типово 1, від 0 до 9999. Spacing: Float, см, типово 400, від 100 до 2000. Jitter: Float, типово 0.3, від 0 до 0.45, частка від Spacing. Min Scale і Max Scale: Float, типово 0.8 і 1.2, від 0.2 до 3. Gap Chance: Float, типово 0.15, від 0 до 0.9. Sink: Float, см, типово 0, від 0 до 50.\n- Один випадковий потік на перебудову. На початку Construction Script Make Random Stream (Seed) зберігається у змінній Stream. Кожен випадковий вузол читає Stream.\n- Для кожного слота Branch пропускає слот, коли Random Bool with Weight from Stream (Gap Chance) дає true. Інакше Distance = (Index + 0.5 + випадкове значення від -Jitter до Jitter) × Spacing. Yaw від 0 до 360, один рівномірний масштаб від Min Scale до Max Scale, а Switch on Int вибирає VariantA, B або C.\n- Те саме Seed завжди дає ту саму розкладку, нове Seed — нову. Ніщо не виходить за кінці сплайна.\n- L_Day63 із трьома розсипами поруч (Seed 1, 2 і 3) і один розсип уздовж стежки на твоєму острові. Ніщо не висить у повітрі.\n\nMy checklist (the same numbers show on my course page):\n1. Спершу перевір, чи є результати сьогоднішніх уроків: BP_SplineScatter з Path, VariantA–VariantC, Seed і Set Stream та L_Day63. Чогось бракує? Зроби вправу того уроку зараз (близько 25 хв), бо вона потрібна для збірки. Відкрий BP_SplineScatter і звір його з вимогами: Path, VariantA–VariantC, налаштування з діапазонами й підказками, Set Stream на початку і Clear Instances для всіх трьох компонентів. Клацни Compile. Перевірка: зелена позначка й жодних попереджень у Compiler Results. (from lesson 1)\n2. У L_Day63 розмісти розсип і сформуй криву 30 м. Перевірка: моделі йдуть за кривою з різними поворотами й розмірами, і жодна не стоїть за кінцями сплайна. (from lesson 2)\n3. Перевір зерно. Запиши, як виглядає розсип із Seed 7, наприклад: «два великі камені біля початку, проміжок посередині». Двічі зміни Seed, а потім знову введи 7. Перевірка: Seed 7 дає точно записану картину. (from lesson 1)\n4. Встанови у VariantA–VariantC три меші однієї родини зі свого набору або безкоштовного паку з Fab. Будь-який пак допиши в credits.md у Work\\Assignment\\. Перевірка: кожен компонент показує свій меш, а розсип змішує всі три. (from lesson 3)\n5. Самостійно додай Float Sink: см, типово 0, діапазони від 0 до 50, категорія Tool, підказка Lowers every mesh into the ground. Перед Make Transform віднімай від розташування Make Vector (0, 0, Sink) вузлом Subtract. Перевірка: Sink 20 опускає кожну модель на 20 см, а 0 повертає їх назад. (from day 62, lesson 4)\n6. Налаштовуй Gap Chance, Jitter, Min Scale, Max Scale і Sink, доки ряд не виглядатиме природно з висоти 30 м. Запиши значення під заголовком Day 63 у techtools_notes.md (Work\\Assignment\\, поруч із credits.md; один файл нотаток на весь модуль). Перевірка: жодні два сусіди не схожі на копії, у ряду є кілька проміжків, і в жодного каменя край не висить у повітрі. (from lesson 4)\n7. Перевір крайні випадки: Spacing 2000 на сплайні 10 м; Spacing 100 на сплайні 2 м; Gap Chance 0.9. Перевірка: у першому випадку жодної моделі й жодної помилки, бо не вміщується жоден повний слот. У другому одна-дві моделі, а в третьому лишаються лише кілька. (from lesson 4)\n8. Постав поруч три копії з однаковою формою сплайна й Seed 1, 2 і 3. Потім скопіюй одну перетягуванням з Alt. Збережи L_Day63 (Ctrl+S), відкрий будь-який інший рівень, а тоді знову L_Day63. Перевірка: у відкритому знову рівні три ряди, з одного інструмента вийшли три різні ряди, а копія з Alt збігається з оригіналом, доки ти не зміниш її Seed. (from lesson 1)\n9. На острові постав один розсип уздовж стежки, краю дороги або смуги посадок. Це може бути каміння вздовж стежки над скелею, кущі на узбіччі або квітники на тротуарі. Опусти його точки на землю й додай точки там, де змінюється рельєф. Перевірка: з висоти 30 м ряд іде за краєм, ніщо не висить і не заходить у землю глибше ніж на чверть своєї висоти. (from day 62, lesson 4)\n10. Зроби два скриншоти. scatter_graph.png — Construction Script, назви вузлів читаються. seeds_day63.png — три зерна згори. Перевірка: обидва зображення лежать у робочій папці дня, а три ряди на другому різні. (from lesson 1)\n11. Під Day 63 у techtools_notes.md допиши кожну змінну з її діапазоном і три правила різноманіття без хаосу. Клацни «Копіювати звіт дня», встав текст у новий чат із тьютором, дай відповіді на його запитання й збережи відповідь як summary.md у робочій папці дня. Перетягни summary.md, scatter_graph.png і seeds_day63.png у папку здачі (кнопка на цій сторінці). Ніколи не здавай папку проєкту чи рівня. Перевірка: у папці здачі 3 файли, кожен більший за 1 КБ. (from lesson 4)\n\nHow to help: ask which step number I'm on, then give me only the next step: the exact clicks and what I should see. When I send a screenshot, compare it with my reference, my sizes and the spec, and name one thing to fix at a time.\nCheck every save and export by reopening it before we move on:\n- a Blueprint or script: compile or run it once more and see it work, with no errors\n- a .md or .txt: open it with Notepad; the text is there, and the name doesn't end in .md.txt\nWhen I write \"готово\", and in any case before the day ends, check with me one item at a time (yes/no): each spec point, then each file on my hand-in list, ready in my day work folder (skip summary.md: the day report writes it next):\n1. scatter_graph.png та seeds_day63.png (Construction Script з читабельними назвами вузлів; Seed 1, 2 і 3 поруч) (доказ)\nFinish with a short list of anything missing, and one line on where this work comes back and what it will look like there. Then tell me the order for the end of the day: first the day report (the Copy the day report button at the bottom of my course page) into summary.md, and only then hand in all the files on the list, summary.md too.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; see-why-fix note = нотатка «бачу, чому, як виправити»; checklist = чек-лист; credits line = рядок авторства; reference photo / hero photo = фото-референс / ключове фото; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); default value = типове значення; mesh = меш; vertex / edge / face = вершина / ребро / грань; origin (and kit pivot) = origin — точка, за яку об'єкт ставлять і обертають; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); UV unwrap / UV layout / seam / UV island = розгортка / розкладка / шов / UV-острівець; level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; material slot / node / pin = слот матеріалу / вузол / вхід; seed = зерно (налаштування Seed); keep-out zone / footprint test / grounding = зона-виняток / тест опори / посадка на ґрунт; kit / kit piece / part of one object = набір / деталь / частина; map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; harbour / quay / waterfront / pier = гавань / причал / набережна / пірс; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.\n\nStart by asking for my best reference photo. Then, one at a time, my sizes and my step number.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender.", "reportPrompt": "Help me write today's report for summary.md. I write it before I hand in. Talk to me in simple Ukrainian, and never use gendered forms about me. Keep the English labels below exactly; the text after each label may be Ukrainian.\nAsk me one thing at a time, and skip whatever I've already pasted below:\n1. My lesson summaries («Засвоєно» / «Було важко»), or which lessons I skipped.\n2. My first score in the page's \"Check yourself\" quiz.\n3. How far the build got: done, partly or blocked (if blocked, where).\n4. My hand-in list, one item at a time (skip summary.md): is the file ready in my day work folder (GAD\\Day-63-spline-scatter-seeded)? (yes/no)\n   - scatter_graph.png та seeds_day63.png (Construction Script з читабельними назвами вузлів; Seed 1, 2 і 3 поруч) (доказ)\n5. One question for Thalia (about any day; start with the day number), or \"none\".\n6. Whether I fixed an earlier day today (which day and what), or \"no\".\n7. About how many hours today took.\nThen give me the finished report in one block I can copy:\n\nTeam summary, <date>, Misha\nDay 63: Seeded variety: scatter along a spline. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nReady to hand in: <tick each item of today's list: ✓ name, or ✗ name and why it isn't ready>\nMissing: <files not ready, or \"none\">\nFixed: <Day N: what I fixed (the fixed files are in that day's hand-in folder), or \"none\">\nQuestion for Thalia: <Day N: one line, or \"none\">\nHours: <about N>\nTo revisit: <the «Було важко» lines>\n\nThen tell me: open summary.md in today's day work folder (GAD\\Day-63-spline-scatter-seeded) with Notepad (right-click > Open with > Notepad; if there is no summary.md yet, make it: right-click > New > Text Document, named summary.md). Press Ctrl+End, paste the report below anything already there, and save with Ctrl+S. Never delete or paste over what is already in the file. Only then hand in all the files on the list, summary.md too, with the Open my hand-in folder button on the page.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian function seg(str,cls){str=String(str);const W=15,H=26,t=2.8,g=.9,P={a:[[g+t/2,0],[W-g-t/2,0],[W-g-t,t],[g+t,t]],d:[[g+t,H-t],[W-g-t,H-t],[W-g-t/2,H],[g+t/2,H]],g:[[g+t,H/2-t/2],[W-g-t,H/2-t/2],[W-g-t/2,H/2],[W-g-t,H/2+t/2],[g+t,H/2+t/2],[g+t/2,H/2]],f:[[0,g+t/2],[t,g+t],[t,H/2-g-t/2],[t/2,H/2-g],[0,H/2-g-t/2]],b:[[W,g+t/2],[W,H/2-g-t/2],[W-t/2,H/2-g],[W-t,H/2-g-t/2],[W-t,g+t]],e:[[0,H/2+g+t/2],[t/2,H/2+g],[t,H/2+g+t/2],[t,H-g-t],[0,H-g-t/2]],c:[[W,H/2+g+t/2],[W,H-g-t/2],[W-t,H-g-t],[W-t,H/2+g+t/2],[W-t/2,H/2+g]]};
 let x=0,o='';for(const ch of str){if(ch===' '){x+=8;continue}if(ch==='/'){o+='<path class="on" d="M'+(x+9)+' 2L'+(x+2)+' '+(H-2)+'L'+(x+4.5)+' '+(H-2)+'L'+(x+11.5)+' 2Z"/>';x+=15;continue}const on=SEG[ch]||'';
  for(const k of 'abcdefg')o+='<polygon class="'+(on.includes(k)?'on':'gh')+'" points="'+P[k].map(p=>(p[0]+x).toFixed(1)+','+p[1].toFixed(1)).join(' ')+'"/>';x+=W+5}

function island(state,pct,label){
 const cx=300,cy=205,R=172,TAU=Math.PI*2;

 const pt=(t,s,k)=>{const r=rad(t,s,k||0);return [cx+r*Math.cos(t),cy+r*Math.sin(t)*.78]};
 const f=n=>n.toFixed(1);
 const smooth=(P,closed)=>{let d='M'+f(P[0][0])+' '+f(P[0][1]);const n=P.length,g=i=>P[closed?(i+n)%n:Math.max(0,Math.min(n-1,i))];
  for(let i=0;i<(closed?n:n-1);i++){const p0=g(i-1),p1=g(i),p2=g(i+1),p3=g(i+2);d+='C'+f(p1[0]+(p2[0]-p0[0])/6)+' '+f(p1[1]+(p2[1]-p0[1])/6)+' '+f(p2[0]-(p3[0]-p1[0])/6)+' '+f(p2[1]-(p3[1]-p1[1])/6)+' '+f(p2[0])+' '+f(p2[1])}return d+(closed?'Z':'')};
 const ring=(s,k)=>{const P=[];for(let i=0;i<64;i++)P.push(pt(i/64*TAU,s,k));return smooth(P,true)};
 let o='<path class="c0" d="'+ring(1,0)+'"/>';
 [.84,.69,.55,.42,.3,.19,.1].forEach((s,k)=>o+='<path class="c" d="'+ring(s,k+1)+'"/>');
 const t0=-2.2,turns=1.55,wp=w=>{const t=(w-1)/11;return {a:t0+t*turns*TAU,s:1.1-t*.98}};
 const P=[],D=[];let last=0;for(let w=1;w<=12;w++)if(state(w)!=='p')last=w;
 for(let i=0;i<=110;i++){const t=i/110,a=t0+t*turns*TAU,s=1.1-t*.98,q=pt(a,s,0);P.push(q);if(last&&t<=(last-1)/11+1e-9)D.push(q)}
 o+='<path class="rt" d="'+smooth(P,false)+'"/>';

 for(let w=1;w<=12;w++){const c=state(w),{a,s}=wp(w),q=pt(a,s,0),lx=q[0]+(Math.cos(a)>=0?15:-15),an=Math.cos(a)>=0?'start':'end';
  o+='<g class="w '+c+'">'+(c==='n'?'<circle class="halo" cx="'+f(q[0])+'" cy="'+f(q[1])+'" r="12"/>':'')+'<circle class="dot" cx="'+f(q[0])+'" cy="'+f(q[1])+'" r="'+(c==='p'?4.5:c==='n'?8:6)+'"/><text x="'+f(lx)+'" y="'+f(q[1]+5.5)+'" text-anchor="'+an+'">'+String(w).padStart(2,'0')+'</text></g>'}

 s+='<circle class="face" cx="200" cy="200" r="168"/><circle class="track" cx="200" cy="200" r="176"/>';
 s+='<circle class="arc" cx="200" cy="200" r="176" stroke="url(#'+id+'g)" stroke-dasharray="'+(C*p).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 200 200)"/>';

 if(label)s+='<text class="rimt"><textPath href="#'+id+'" startOffset="25%" text-anchor="middle">'+label+'</textPath></text>';

 return s+'</svg>'}

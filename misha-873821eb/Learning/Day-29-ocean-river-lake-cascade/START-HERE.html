<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 29</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.b{background:linear-gradient(145deg,#ff8cc4,#d6337e);box-shadow:0 10px 24px -8px rgba(255,95,168,.6),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.s{background:linear-gradient(145deg,#5fe39a,#16a34a);box-shadow:0 10px 24px -8px rgba(74,222,128,.55),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.ghost{color:var(--ink);background:var(--card);box-shadow:var(--raiseS)}
.btn.ghost:hover{color:var(--accT)}
/* the Done switch */
.sw{display:inline-flex;align-items:center;gap:12px;border:0;background:transparent;cursor:pointer;font:600 14px/1 var(--head);color:var(--muted);min-height:50px;padding:0 6px}
.sw .tr{position:relative;width:58px;height:32px;border-radius:999px;background:var(--well);box-shadow:var(--press);transition:background .25s}
.sw .tr::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .25s}
.sw[aria-pressed=true]{color:var(--ok)}
.sw[aria-pressed=true] .tr{background:linear-gradient(145deg,#5fe39a,#16a34a);box-shadow:0 0 14px rgba(74,222,128,.55)}
.sw[aria-pressed=true] .tr::after{left:30px;background:#fff}
details{margin-top:22px;border-radius:20px;background:var(--well);box-shadow:var(--press);padding:0 18px}
summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;min-height:52px;font:600 13px/1.3 var(--head);letter-spacing:.04em;color:var(--ink)}
summary:hover{color:var(--accT)}
summary::-webkit-details-marker{display:none}
summary .chev{margin-left:auto;transition:transform .25s;color:var(--faint)}
details[open] summary .chev{transform:rotate(180deg)}
details[open]{padding-bottom:16px}
.steps{list-style:none;padding:0;counter-reset:s;margin:4px 0 0}
.steps li{counter-increment:s;position:relative;padding:0 0 0 44px;margin:12px 0}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 12.5px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.vid{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;margin-top:20px;font-size:15px;padding:16px 18px;border-radius:20px}
.vid .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--badL)}
.vid b{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* build */
.build.bossday{border-color:rgba(255,95,168,.35)}
.build.bossday::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(60% 45% at 100% 0%,rgba(255,95,168,.28),transparent 70%);z-index:-1;pointer-events:none}
.tiers{list-style:none;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:0}
.tiers li{margin:0;padding:16px 18px;border-radius:20px;font-size:14.5px;line-height:1.55;color:var(--muted);background:var(--card);box-shadow:var(--raiseS)}
.medal{display:flex;align-items:center;gap:10px;margin:0 0 8px;font:700 11.5px/1 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
.medal i{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 2px 2px rgba(255,255,255,.6),0 0 10px var(--mg)}
.m0{--mg:rgba(205,127,50,.6)}.m0 i{background:linear-gradient(135deg,#e7a46d,#9a5a2b)}
.m1{--mg:rgba(190,200,215,.7)}.m1 i{background:linear-gradient(135deg,#f3f6fa,#9aa5b3)}
.m2{--mg:rgba(245,195,91,.75)}.m2 i{background:linear-gradient(135deg,#ffe08a,#c99412)}
.ccount{display:flex;align-items:center;gap:16px;margin:28px 0 10px}
.ccount .slider{flex:1}
.check{list-style:none;padding:0;margin:0}
.check li{margin:0}
.check label{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:start;padding:14px 4px;cursor:pointer;border-bottom:1px solid var(--line)}
.check li:last-child label{border-bottom:0}
.check input{appearance:none;-webkit-appearance:none;width:26px;height:26px;margin:1px 0 0;border-radius:9px;background:var(--well);box-shadow:var(--press);display:grid;place-items:center;cursor:pointer;transition:background .2s,box-shadow .2s}
.check input::after{content:"";width:10px;height:5px;border:solid #fff;border-width:0 0 2.2px 2.2px;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.check input:checked{background:linear-gradient(145deg,#5fe39a,#16a34a);box-shadow:0 0 12px rgba(74,222,128,.55)}
.check input:checked::after{opacity:1}
.check li.on .tx{color:var(--faint)}
.check .ln{font:600 10.5px/1.3 var(--head);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);white-space:nowrap;margin-top:5px;padding:4px 9px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
/* quiz */
.pips{display:flex;gap:8px;margin:0 0 4px;padding:10px 14px;border-radius:999px;width:max-content;max-width:100%;flex-wrap:wrap}
.pips i{width:9px;height:9px;border-radius:50%;background:var(--line2)}
.pips i.r{background:var(--okL);box-shadow:0 0 8px var(--okL)}.pips i.w{background:var(--badL);box-shadow:0 0 8px var(--badL)}
.qz{margin:28px 0 0;padding:28px 0 0;border-top:1px solid var(--line)}
.qz:first-of-type{border-top:0;padding-top:10px;margin-top:10px}
.qq{display:grid;grid-template-columns:40px 1fr;gap:10px;font:600 17.5px/1.45 var(--head);letter-spacing:-.005em;margin:0 0 14px}
.qq .qn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 13px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.opt{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;width:calc(100% - 50px);margin:12px 0 12px 50px;text-align:left;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid transparent;border-radius:18px;padding:11px 16px;cursor:pointer;box-shadow:var(--raiseS);transition:box-shadow .2s,transform .15s}
.opt .lt{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 12.5px/1 var(--head);color:var(--faint);background:var(--well);box-shadow:var(--press)}
.opt:hover:not([disabled]){transform:translateY(-1px);color:var(--accT)}
.opt.right{box-shadow:var(--press);background:var(--okBg);border-color:rgba(74,222,128,.45)}.opt.right .lt{background:var(--okL);color:#fff;box-shadow:0 0 10px var(--okL)}.opt.right .mk{color:var(--ok)}
.opt.wrong{box-shadow:var(--press);background:var(--badBg);border-color:rgba(255,93,93,.45)}.opt.wrong .lt{background:var(--badL);color:#fff;box-shadow:0 0 10px var(--badL)}.opt.wrong .mk{color:var(--bad)}
.opt[disabled]{cursor:default}
.opt[disabled]:not(.right):not(.wrong){opacity:.55;box-shadow:none}
.exp{margin:10px 0 0 50px;font-size:15.5px;color:var(--muted)}
.exp b{font:700 11.5px/1 var(--head);letter-spacing:.14em;text-transform:uppercase;margin-right:10px}
.exp.r b{color:var(--ok)}.exp.w b{color:var(--bad)}
.score{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:32px;padding:18px 20px;border-radius:24px}
.score .lcd .seg7{height:34px}
.score .row{margin:0 0 0 auto}
/* ship */
.path{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;margin:22px 0 12px}
.path .ic,.clip .ic{color:var(--accT);margin-top:4px}
.clip{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
/* prev / next */
.nav{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:34px}
.nav a{display:flex;align-items:center;gap:14px;border-radius:24px;padding:16px 20px;font:600 15px/1.3 var(--head);text-decoration:none;color:var(--ink);min-height:72px}
.nav a .kn{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.nav a:hover{color:var(--accT)}
.nav a.nx{justify-content:flex-end;text-align:right;grid-column:2}
#toast{position:fixed;left:50%;bottom:28px;z-index:9;transform:translateX(-50%) translateY(16px);background:rgba(30,33,46,.82);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:#f4f5fa;border:1px solid rgba(255,255,255,.14);padding:13px 24px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none;font:600 14px/1.4 var(--head);max-width:min(92vw,560px);text-align:center;box-shadow:0 20px 40px -14px rgba(0,0,0,.5),0 0 24px var(--glow)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:860px){.how{grid-template-columns:repeat(2,minmax(0,1fr))}.tiers{grid-template-columns:1fr}}
@media (max-width:640px){
 body{font-size:16.5px}
 .wrap{padding:0 14px 72px}.topin{width:calc(100% - 20px);border-radius:26px;padding:8px}
 .crumb{order:3;flex-basis:100%;padding:0 8px 4px}
 .hero{grid-template-columns:1fr;padding:26px 0 24px}
 .chart{order:-1;max-width:300px}
 .card{padding:24px 18px;border-radius:24px}
 .split,.how,.mgrid{grid-template-columns:1fr}
 .quest{grid-template-columns:1fr}.qnum{width:54px;height:54px;font-size:19px;margin-bottom:10px}
 .opt{margin-left:0;width:100%}.exp{margin-left:0}.qq{grid-template-columns:34px 1fr;font-size:16.5px}
 .check label{grid-template-columns:auto 1fr}.check .ln{grid-column:2;justify-self:start;margin-top:-4px}
 .nav{grid-template-columns:1fr}.nav a.nx{grid-column:auto}
 .score .row{margin:0}
 .btn{flex:1 1 auto}
}
@media print{.sea,.topbar,.row,.nav,#toast{display:none}.glass{background:#fff;box-shadow:none;break-inside:avoid}}

.fbt{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;font:600 11px/1.2 var(--head);letter-spacing:.06em;padding:5px 10px;border-radius:999px;background:var(--well);box-shadow:var(--press);color:var(--muted)}
.fbt.ok{color:var(--accT)}.fbt.miss{color:var(--faint)}
.fbt svg{width:14px;height:14px}
.fbnew{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:14px 18px;border-radius:22px;margin:0 0 18px}
.fbnew b{font:700 15px/1.3 var(--head)}
.fbnew .lk{display:flex;flex-wrap:wrap;gap:8px}
.fbnew a{color:var(--accT);font-weight:600;text-decoration:none;padding:6px 12px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.fbsc{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;padding:16px 18px;border-radius:24px;margin:0 0 22px}
.fbsc .v{font:700 26px/1.1 var(--head);color:var(--accT)}
.fbsc p{margin:4px 0 0}
.fbcard .big{font:700 30px/1 var(--head);color:var(--accT)}
.fbcard .note{font-size:16px;line-height:1.55;margin:10px 0}

<script id="data" type="application/json">{"learner": "ib-misha-873821eb", "learnerName": {"en": "Misha", "uk": "Міша"}, "day": 29, "week": 6, "total": 110, "title": {"en": "Water: the ocean, a river, a lake and a cascade", "uk": "Вода: океан, річка, озеро і каскад"}, "theme": {"en": "Week 6: Terrain and water", "uk": "Тиждень 6: Рельєф і вода"}, "build": {"item": {"en": "The island's water with the Water plugin: the ocean at sea level, one lake in a hollow, one river from the lake to the sea, a cascade where the river drops, and the sea's colour matched to your reference photo", "uk": "Вода острова з плагіном Water: океан на рівні моря, одне озеро в улоговині, одна річка від озера до моря, каскад там, де річка спадає, і колір моря, підібраний за твоїм референсним фото"}, "why": {"en": "Water is half of every island shot and the first thing that looks fake: a river running uphill, a lake floating above its banks, a sea the colour of a swimming pool. Rivers only run downhill along valleys, lakes sit in hollows, and the sea's colour comes from its depth and what lies beneath. Get those right and a drone crossing the coast reads the place as real at a glance.", "uk": "Вода — це половина кожного кадру острова і перше, що виглядає несправжнім: річка, що тече вгору, озеро, що висить над своїми берегами, море кольору басейну. Річки течуть лише донизу долинами, озера лежать в улоговинах, а колір моря залежить від його глибини і від того, що лежить на дні. Зроби це правильно — і дрон, що перетинає узбережжя, з першого погляду читає місце як справжнє."}, "where": {"en": "L_Island: the ocean all round the island; the lake and the river where your map draws them; the cascade where the river leaves the hills.", "uk": "L_Island: океан навколо всього острова; озеро і річка там, де їх малює твоя мапа; каскад там, де річка виходить із пагорбів."}, "spec": [{"en": "The Water plugin, on since Day 0 (Edit > Plugins > Water ticked).", "uk": "Плагін Water, увімкнений від Дня 0 (Edit > Plugins > Water з позначкою)."}, {"en": "A Water Body Ocean at Z 0 with Affects Landscape unticked (so your sculpted sea floor stays), its Water Zone covering the whole 2,016 m landscape, and its shoreline roughly following your coast.", "uk": "Water Body Ocean на Z 0 з вимкненим Affects Landscape (щоб твоє виліплене дно моря лишилося), його Water Zone покриває весь ландшафт 2 016 м, а берегова лінія приблизно йде за твоїм узбережжям."}, {"en": "A Water Body Lake in a hollow, its surface below the lowest point of its banks.", "uk": "Water Body Lake в улоговині, його поверхня нижча за найнижчу точку берегів."}, {"en": "A Water Body River from the lake's outflow to the sea along your map's stream: every point lower than the one before, River Width 3 to 10 m growing towards the sea, Depth 0.5 to 2 m, Affects Landscape ticked so it carves its bed.", "uk": "Water Body River від витоку з озера до моря вздовж струмка з твоєї мапи: кожна точка нижча за попередню, River Width 3-10 м і збільшується до моря, Depth 0,5-2 м, Affects Landscape увімкнено, щоб річка прорізала своє русло."}, {"en": "A cascade (a river stepping down over a few rocks) where the river drops 3 to 6 m: river points close together over two or three steps, rocks from your rock pack round the lip, and a pool at the foot.", "uk": "Каскад (річка, що спускається сходинками через кілька каменів) там, де річка спадає на 3-6 м: точки річки близько одна до одної на двох-трьох сходинках, каміння з твого пака каміння навколо краю і вир-басейн біля підніжжя."}, {"en": "MI_Island_Ocean, a Material Instance of the ocean's water material in Content/Island/Materials, with its Absorption and Scattering colours tuned until your shallow bay matches your water-colour photo side by side.", "uk": "MI_Island_Ocean, Material Instance водного матеріалу океану в Content/Island/Materials, де кольори Absorption і Scattering налаштовано так, щоб твоя мілка затока збігалася з фото кольору води поруч."}, {"en": "water_notes.md listing every water body with its key numbers.", "uk": "water_notes.md зі списком усіх водойм і їхніми ключовими числами."}], "piece1": "the ocean at sea level (shared with the lessons)", "piece2": {"en": "The lake, the river, the cascade and the sea colour, on your own", "uk": "Озеро, річка, каскад і колір моря, самостійно"}, "steps": [{"text": {"en": "Check that Water is ticked in Edit > Plugins (Day 0), then pilot CAM_Survey over your shallow bay at a similar height to your water-colour photo and save bay_before.png. Check: Water shows ticked, and bay_before.png shows the bay before any water.", "uk": "Перевір, що Water позначено в Edit > Plugins (День 0), потім пролети з CAM_Survey над своєю мілкою затокою на висоті, схожій на висоту твого фото кольору води, і збережи bay_before.png. Перевірка: Water позначено, а bay_before.png показує затоку до появи води."}, "lesson": 1}, {"text": {"en": "Delete the Z = 0 plane and place the ocean at Z 0 with Affects Landscape unticked. Check: your sculpted sea floor is unchanged under the water.", "uk": "Видали площину на Z = 0 і постав океан на Z 0 з вимкненим Affects Landscape. Перевірка: твоє виліплене дно моря під водою не змінилося."}, "lesson": 1}, {"text": {"en": "Set the Water Zone's Zone Extent to 210000 x 210000 (type Zone Extent in its Details search box) and move the ocean's spline points onto your coast. Check: from 300 m the sea reaches every edge and the shoreline follows your island.", "uk": "Встанови Zone Extent у Water Zone на 210000 x 210000 (введи Zone Extent у поле пошуку його Details) і пересунь точки сплайна океану на своє узбережжя. Перевірка: з висоти 300 м море доходить до кожного краю, а берегова лінія йде за твоїм островом."}, "lesson": 1}, {"text": {"en": "Place the lake in its hollow and lower it below its banks. Check: from 20 m no water stands above the land anywhere round the lake.", "uk": "Постав озеро в його улоговину і опусти нижче берегів. Перевірка: з висоти 20 м ніде навколо озера вода не стоїть над землею."}, "lesson": 3}, {"text": {"en": "Draw the river from the lake's outflow to the sea, with a point at every bend. Check: every point is at least 50 cm lower than the one before.", "uk": "Намалюй річку від витоку з озера до моря, з точкою на кожному вигині. Перевірка: кожна точка щонайменше на 50 cm нижча за попередню."}, "lesson": 2}, {"text": {"en": "Set each point's River Width, Depth and Velocity, with Affects Landscape ticked. Check: the river widens and slows towards the sea, in a carved bed.", "uk": "Встанови для кожної точки River Width, Depth і Velocity, з увімкненим Affects Landscape. Перевірка: річка розширюється і сповільнюється до моря, у прорізаному руслі."}, "lesson": 2}, {"text": {"en": "Join the river to the lake at the same height. Check: no step or gap where they meet.", "uk": "З'єднай річку з озером на тій самій висоті. Перевірка: там, де вони зустрічаються, немає сходинки чи щілини."}, "lesson": 3}, {"text": {"en": "The cascade: three close points dropping 1 to 2 m each, rocks round the lip, and a pool at the foot. Save cascade_15m.png. Check: from 15 m the water steps down between rocks into the pool.", "uk": "Каскад: три близькі точки, кожна нижча на 1-2 м, каміння навколо краю і вир-басейн біля підніжжя. Збережи cascade_15m.png. Перевірка: з висоти 15 м вода сходинками спускається між камінням у вир."}, "lesson": 3}, {"text": {"en": "Bank check from 20 m along the river and the lake, saved as river_banks.png; fix with Smooth or the river's width. Check: no water floating above the ground and no gaps under the edges.", "uk": "Перевірка берегів з висоти 20 м уздовж річки й озера, збережена як river_banks.png; виправ через Smooth або ширину річки. Перевірка: ніде вода не висить над землею і немає щілин під краями."}, "lesson": 2}, {"text": {"en": "Sea colour: MI_Island_Ocean, with Absorption and Scattering tuned against your photo. Check: water_match.png shows your bay beside the photo, with the shallows and the deep water close.", "uk": "Колір моря: MI_Island_Ocean з Absorption і Scattering, налаштованими за твоїм фото. Перевірка: water_match.png показує твою затоку поруч із фото, і мілини та глибока вода близькі до нього."}, "lesson": 4}, {"text": {"en": "Write water_notes.md: every water body and its key numbers. Check: the ocean, the lake, the river (each point's height and width) and the colour values are all there.", "uk": "Напиши water_notes.md: кожна водойма і її ключові числа. Перевірка: там є океан, озеро, річка (висота і ширина кожної точки) і значення кольорів."}, "lesson": 2}, {"text": {"en": "Make before_after_day29.png (bay_before.png beside the same view with the finished, coloured water) and record a 60-second flight from the lake down the river to the sea at about 15 m (Win+Alt+R). Save today's clip as flythrough_day29.mp4 and check that you also have water_values.png (each is described in today's hand-in list; take any you are missing now). Check: the clip follows the water downhill all the way.", "uk": "Зроби before_after_day29.png (bay_before.png поруч із тим самим видом із завершеною, пофарбованою водою) і запиши 60-секундний політ від озера вниз річкою до моря на висоті близько 15 м (Win+Alt+R). Збережи сьогоднішній запис як flythrough_day29.mp4 і перевір, що в тебе є й water_values.png (кожен файл описано в сьогоднішньому списку здачі роботи; зроби ті, яких бракує, зараз). Перевірка: запис іде за водою донизу всю дорогу."}, "lesson": 2}], "assets": []}, "lessons": [{"title": {"en": "The Water plugin and the ocean", "uk": "Плагін Water і океан"}, "minutes": 40, "goals": [{"en": "Explain the Water plugin's parts: Water Body actors (Ocean, Lake, River), the Water Zone that draws them, and splines (lines with points you can move, which set each body's shape).", "uk": "Пояснити частини плагіна Water: актори Water Body (Ocean, Lake, River), Water Zone, яка їх малює, і сплайни (лінії з точками, які можна пересувати і які задають форму кожної водойми)."}, {"en": "Place a Water Body Ocean at sea level and decide whether it carves the landscape (Affects Landscape): off for your island, because your sculpted sea floor is the real one.", "uk": "Поставити Water Body Ocean на рівні моря і вирішити, чи прорізає він ландшафт (Affects Landscape): для твого острова вимкнено, бо твоє виліплене дно моря і є справжнім."}, {"en": "Size the Water Zone (Zone Extent) to cover the whole landscape, so the sea doesn't stop in mid-air.", "uk": "Задати розмір Water Zone (Zone Extent) так, щоб вона покривала весь ландшафт і море не обривалося посеред повітря."}], "doalong": [{"en": "Edit > Plugins and search Water. Water should already be ticked from Day 0; if it isn't, tick it and click Restart Now. You should see Water ticked. (Water Extras is only Epic's sample maps, so leave it off.)", "uk": "Edit > Plugins і пошукай Water. Water має бути позначено ще з Дня 0; якщо ні, постав позначку і натисни Restart Now. Ти маєш побачити позначку біля Water. (Water Extras — це лише зразкові мапи від Epic, тож залиш його вимкненим.)"}, {"en": "Select the Z = 0 plane from Day 26 and delete it: it was only a stand-in. Place Actors: search Water Body Ocean, drag it in and set Location 0, 0, 0. You should see water appear round part of your island.", "uk": "Виділи площину на Z = 0 з Дня 26 і видали її: вона була лише заглушкою. Place Actors: знайди Water Body Ocean, перетягни його в рівень і встанови Location 0, 0, 0. Ти маєш побачити, як навколо частини острова з'являється вода."}, {"en": "In the ocean's Details find Affects Landscape and untick it. You should see your sea floor stay as you sculpted it.", "uk": "У Details океану знайди Affects Landscape і зніми позначку. Ти маєш побачити, що твоє дно моря лишається таким, як після ліплення."}, {"en": "In the Outliner select the WaterZone that came with the ocean. Type Zone Extent in the Details search box and set it to 210000 x 210000 (2.1 km). You should see the water reach every edge of the landscape.", "uk": "В Outliner виділи WaterZone, що з'явилася разом з океаном. Введи Zone Extent у поле пошуку Details і встанови 210000 x 210000 (2,1 км). Ти маєш побачити, що вода доходить до кожного краю ландшафту."}, {"en": "Select the ocean and click one of its spline points (small white dots); move it onto your coast. Alt+drag a point to add a new one. You should see the shoreline follow your island roughly.", "uk": "Виділи океан і клацни одну з точок його сплайна (маленькі білі крапки); пересунь її на своє узбережжя. Alt+перетягування точки додає нову. Ти маєш побачити, що берегова лінія приблизно йде за твоїм островом."}], "play": {"en": "Break it, fix it: the tutor names one setting to break (the ocean at Z 5 m, Zone Extent 500 m, Affects Landscape on); I describe what happens and fix it within 2 minutes.", "uk": "Зламай і полагодь: тьютор називає один параметр, який треба зламати (океан на Z 5 м, Zone Extent 500 м, Affects Landscape увімкнено); я описую, що стається, і виправляю за 2 хвилини."}, "video": {"url": "https://www.youtube.com/watch?v=09SO3X_fUto", "title": "Unreal Engine 5 Tutorial: Easy Water System Walkthrough for Beginners (Island, River, Lake)", "channel": "EZ Unreal", "length": "10:39", "search": "unreal engine 5 water system ocean river lake beginner"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: The Water plugin and the ocean (Day 29, lesson 1 of 4).\nToday's build: The island's water with the Water plugin: the ocean at sea level, one lake in a hollow, one river from the lake to the sea, a cascade where the river drops, and the sea's colour matched to your reference photo.\n\nBy the end of this lesson I can:\n1. Explain the Water plugin's parts: Water Body actors (Ocean, Lake, River), the Water Zone that draws them, and splines (lines with points you can move, which set each body's shape).\n2. Place a Water Body Ocean at sea level and decide whether it carves the landscape (Affects Landscape): off for your island, because your sculpted sea floor is the real one.\n3. Size the Water Zone (Zone Extent) to cover the whole landscape, so the sea doesn't stop in mid-air.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (Your island has sculpted land, a cliff coast, a beach and a material that paints rock, grass and sand by itself.), what I will learn today (You add the ocean at sea level, a lake, a river that runs downhill to the sea through a small cascade, and sea colour matched to a photo.), encourage me (Water makes an island feel alive, so give the river your time and let your tutor help with any bank that will not sit right.), and share today's quote: \"A lake is the landscape's most beautiful and expressive feature.\" (Henry David Thoreau).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 26: why does an 8-bit heightmap show terraces on a 300 m island? | Day 21: which of your photos shows the water's colour, and from what height was it taken?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Break it, fix it: the tutor names one setting to break (the ocean at Z 5 m, Zone Extent 500 m, Affects Landscape on); I describe what happens and fix it within 2 minutes.\n6. Do-along on today's build (the ocean at sea level (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Edit > Plugins and search Water. Water should already be ticked from Day 0; if it isn't, tick it and click Restart Now. You should see Water ticked. (Water Extras is only Epic's sample maps, so leave it off.)\n   - Select the Z = 0 plane from Day 26 and delete it: it was only a stand-in. Place Actors: search Water Body Ocean, drag it in and set Location 0, 0, 0. You should see water appear round part of your island.\n   - In the ocean's Details find Affects Landscape and untick it. You should see your sea floor stay as you sculpted it.\n   - In the Outliner select the WaterZone that came with the ocean. Type Zone Extent in the Details search box and set it to 210000 x 210000 (2.1 km). You should see the water reach every edge of the landscape.\n   - Select the ocean and click one of its spline points (small white dots); move it onto your coast. Alt+drag a point to add a new one. You should see the shoreline follow your island roughly.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Unreal Engine 5 Tutorial: Easy Water System Walkthrough for Beginners (Island, River, Lake)\" by EZ Unreal: https://www.youtube.com/watch?v=09SO3X_fUto\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Rivers that obey gravity", "uk": "Річки, що слухаються гравітації"}, "minutes": 40, "goals": [{"en": "Draw a river the way water runs: down the valley, every point lower than the one before, bends that swing wider on flat ground, never straight.", "uk": "Малювати річку так, як тече вода: долиною донизу, кожна точка нижча за попередню, вигини ширшають на рівній землі, ніколи не прямо."}, {"en": "Set a Water Body River point by point (under Water in the selected point's Details): River Width, Depth and Velocity (speed), growing wider and slower towards the sea.", "uk": "Налаштовувати Water Body River точка за точкою (у розділі Water у Details вибраної точки): River Width, Depth і Velocity (швидкість), щоб річка ширшала і сповільнювалася до моря."}, {"en": "Let the river carve its bed (Affects Landscape on) and check its banks from 20 m.", "uk": "Дати річці прорізати русло (Affects Landscape увімкнено) і перевіряти її береги з висоти 20 м."}], "doalong": [{"en": "Place a Water Body River where your lake will drain. Select its end point and Alt+drag it down the valley, adding a point at every bend, all the way to the sea. You should see water following your valley.", "uk": "Постав Water Body River там, звідки витікатиме твоє озеро. Виділи її кінцеву точку і веди її через Alt+перетягування вниз долиною, додаючи точку на кожному вигині, аж до моря. Ти маєш побачити воду, що йде твоєю долиною."}, {"en": "Click each point and read its Location Z (it may be measured from the river actor's own position; what matters is that the numbers fall). Each must be at least 50 cm lower than the one before. You should see the numbers fall all the way to the sea.", "uk": "Клацни кожну точку і прочитай її Location Z (вона може відраховуватися від позиції самого актора річки; головне, щоб числа спадали). Кожна має бути щонайменше на 50 cm нижчою за попередню. Ти маєш побачити, що числа спадають аж до моря."}, {"en": "Select the points one at a time and, under Water, set River Width from 300 (3 m) at the top to 1000 (10 m) at the mouth, Depth from 50 to 200, and Velocity higher in the hills than near the sea. You should see the river widen as it nears the sea.", "uk": "Вибирай точки по одній і в розділі Water встанови River Width від 300 (3 м) угорі до 1000 (10 м) у гирлі, Depth від 50 до 200, а Velocity вище в пагорбах, ніж біля моря. Ти маєш побачити, як річка розширюється, наближаючись до моря."}, {"en": "Check that Affects Landscape is ticked on the river. You should see the land dip under the water to make a bed.", "uk": "Перевір, що на річці позначено Affects Landscape. Ти маєш побачити, як земля опускається під водою, утворюючи русло."}, {"en": "Pilot CAM_Survey along the river, about 20 m above the water (the water's Z plus 2000). You should see no water floating above the ground and no gaps under the edges.", "uk": "Пролети з CAM_Survey уздовж річки приблизно на 20 м над водою (Z води плюс 2000). Ніде вода не має висіти над землею, і не має бути щілин під краями."}], "play": {"en": "Gravity check: I read my river to the tutor point by point (height, width); it flags every point that runs uphill or narrows downstream.", "uk": "Перевірка гравітації: я зачитую тьютору свою річку точка за точкою (висота, ширина); він позначає кожну точку, що тече вгору або звужується за течією."}, "video": {"url": "https://www.youtube.com/watch?v=lMgCxZqvZ80", "title": "Let's Build the RPG! - 16 - Unreal Engine 5 Water System Beginner Tutorial - Lakes and Rivers", "channel": "NumenBrothers", "length": "13:07", "search": "unreal engine 5 water system lakes rivers"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Rivers that obey gravity (Day 29, lesson 2 of 4).\nToday's build: The island's water with the Water plugin: the ocean at sea level, one lake in a hollow, one river from the lake to the sea, a cascade where the river drops, and the sea's colour matched to your reference photo.\nEarlier today I already did: lesson 1 (The Water plugin and the ocean). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Draw a river the way water runs: down the valley, every point lower than the one before, bends that swing wider on flat ground, never straight.\n2. Set a Water Body River point by point (under Water in the selected point's Details): River Width, Depth and Velocity (speed), growing wider and slower towards the sea.\n3. Let the river carve its bed (Affects Landscape on) and check its banks from 20 m.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Gravity check: I read my river to the tutor point by point (height, width); it flags every point that runs uphill or narrows downstream.\n4. Do-along on today's build (the ocean at sea level (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Place a Water Body River where your lake will drain. Select its end point and Alt+drag it down the valley, adding a point at every bend, all the way to the sea. You should see water following your valley.\n   - Click each point and read its Location Z (it may be measured from the river actor's own position; what matters is that the numbers fall). Each must be at least 50 cm lower than the one before. You should see the numbers fall all the way to the sea.\n   - Select the points one at a time and, under Water, set River Width from 300 (3 m) at the top to 1000 (10 m) at the mouth, Depth from 50 to 200, and Velocity higher in the hills than near the sea. You should see the river widen as it nears the sea.\n   - Check that Affects Landscape is ticked on the river. You should see the land dip under the water to make a bed.\n   - Pilot CAM_Survey along the river, about 20 m above the water (the water's Z plus 2000). You should see no water floating above the ground and no gaps under the edges.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Let's Build the RPG! - 16 - Unreal Engine 5 Water System Beginner Tutorial - Lakes and Rivers\" by NumenBrothers: https://www.youtube.com/watch?v=lMgCxZqvZ80\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Lakes, cascades and clean banks", "uk": "Озера, каскади і чисті береги"}, "minutes": 40, "goals": [{"en": "Sit a lake in a hollow with its surface below its lowest bank, and join the river at the same height whe our controls: Absorption (how fast colours fade with depth) and Scattering (the colour light picks up inside the water).", "uk": "Створити Material Instance водного матеріалу океану і знайти його налаштування кольору: Absorption (як швидко кольори згасають із глибиною) і Scattering (колір, який світло набирає всередині води)."}, {"en": "Judge water beside a photo taken at a similar height and sun: the shallow colour, the deep colour, and how quickly one turns into the other.", "uk": "Оцінювати воду поруч із фото, знятим на схожій висоті і при схожому сонці: колір мілини, колір глибини і як швидко один переходить в інший."}], "doalong": [{"en": "Select the ocean; in Details under Rendering find Water Material and click the browse arrow beside it. If the Content Browser shows nothing, open its Settings and tick Show Plugin Content. You should see the water material selected.", "uk": "Виділи океан; у Details у розділі Rendering знайди Water Material і натисни стрілку перегляду поруч. Якщо Content Browser нічого не показує, відкрий його Settings і постав позначку Show Plugin Content. Ти маєш побачити виділений водний матеріал."}, {"en": "Right-click it > Create Material Instance, name it MI_Island_Ocean, move it to Content/Island/Materials and set it as the ocean's Water Material. You should see no change yet.", "uk": "Клацни його правою кнопкою > Create Material Instance, назви MI_Island_Ocean, перемісти в Content/Island/Materials і признач як Water Material океану. Поки що ти не маєш побачити змін."}, {"en": "Open your water-colour photo and frame a similar view over your shallow bay at a similar height. You should have both side by side.", "uk": "Відкрий своє фото кольору води і скомпонуй схожий вид над своєю мілкою затокою на схожій висоті. У тебе мають бути обидва зображення поруч."}, {"en": "Open MI_Island_Ocean, tick Absorption and Scattering, and change them in small steps until the shallows and the deep water match the photo. Write the values in water_notes.md. to)", "uk": "water_values.png (параметри MI_Island_Ocean) і water_match.png (твоя затока поруч із фото кольору води)"}, {"en": "river_banks.png and cascade_15m.png", "uk": "river_banks.png і cascade_15m.png"}, {"en": "bay_before.png and before_after_day29.png (your bay before the water and after the colour work, same camera)", "uk": "bay_before.png і before_after_day29.png (твоя затока до води і після роботи з кольором, та сама камера)"}, {"en": "flythrough_day29.mp4 (60 seconds down the river at about 15 m)", "uk": "flythrough_day29.mp4 (60 секунд униз річкою на висоті близько 15 м)"}, {"en": "summary.md", "uk": "summary.md"}], "goal": {"en": "By the end of today your island sits in an ocean at sea level, with a river running downhill from a lake to the sea through a small cascade, and the sea's colour matched to your water photo.", "uk": "До кінця сьогоднішнього дня твій острів стоїть в океані на рівні моря, річка тече донизу від озера до моря через невеликий каскад, а колір моря підібрано за твоїм фото води."}, "uses": [{"en": "Day 28: the coast, the cliffs, the beaches and MI_Island_Auto", "uk": "День 28: узбережжя, скелі, пляжі і MI_Island_Auto"}, {"en": "Day 22: the streams and the lake on island_map.png", "uk": "День 22: струмки й озеро на island_map.png"}, {"en": "Day 21: your water-colour photo", "uk": "День 21: твоє фото кольору води"}, {"en": "Day 26: the landscape's Edit Layers, which let water carve its bed", "uk": "День 26: Edit Layers ландшафту, які дозволяють воді прорізати своє русло"}], "quiz": [{"q": {"en": "You placed the ocean, and your sculpted beaches vanished under a flat sea floor. What did you forget?", "uk": "Після того як океан поставлено, твої виліплені пляжі зникли під пласким дном моря. Що пропущено?"}, "options": [{"en": "To lower the ocean below Z 0.", "uk": "Опустити океан нижче Z 0."}, {"en": "To untick Affects Landscape on the ocean.", "uk": "Зняти позначку Affects Landscape на океані."}, {"en": "To lower the sun.", "uk": "Опустити сонце."}, {"en": "To set the Zone Extent.", "uk": "Встановити Zone Extent."}], "answer": 1, "explain": {"en": "With Affects Landscape on, the ocean carves its own floor. Your sculpted sea floor is the real one, so turn it off.", "uk": "З увімкненим Affects Landscape океан прорізає власне дно. Твоє виліплене дно моря і є справжнім, тож вимкни це."}}, {"q": {"en": "Flying low, you see the sea stop in mid-air near one corner of the landscape. What do you change?", "uk": "Пролітаючи низько, ти бачиш, що море обривається посеред повітря біля одного кута ландшафту. Що ти змінюєш?"}, "options": [{"en": "The Water Zone's Zone Extent, so it covers the whole landscape.", "uk": "Zone Extent у Water Zone, щоб вона покривала весь ландшафт."}, {"en": "The river's width.", "uk": "Ширину річки."}, {"en": "The ocean's colour.", "uk": "Колір океану."}, {"en": "Nothing: nobody flies there.", "uk": "Нічого: там ніхто не літає."}], "answer": 0, "explain": {"en": "The Water Zone draws the detailed water only inside its extent. 210000 x 210000 covers your 2 km landscape.", "uk": "Water Zone малює деталізовану воду лише в межах свого розміру. 210000 x 210000 покриває твій ландшафт 2 км."}}, {"q": {"en": "Reading your river's points from the top: 42 m, 38 m, 39 m, 30 m. What's wrong?", "uk": "Точки твоєї річки згори донизу: 42 м, 38 м, 39 м, 30 м. Що не так?"}, "options": [{"en": "Nothing.", "uk": "Нічого."}, {"en": "The points are too far apart.", "uk": "Точки надто далеко одна від одної."}, {"en": "The third point is higher than the second, so the water would run uphill; lower it below 38 m.", "uk": "Третя точка вища за другу, тож вода текла б угору; опусти її нижче 38 м."}, {"en": "Rivers must sit at sea level.", "uk": "Річки мають бути на рівні моря."}], "answer": 2, "explain": {"en": "Every point must be lower than the one before. One high point makes the water climb.", "uk": "Кожна точка має бути нижчою за попередню. Одна висока точка змушує воду підніматися."}}, {"q": {"en": "Why does shallow water over pale sand look turquoise, but deep water blue?", "uk": "Чому мілка вода над світлим піском виглядає бірюзовою, а глибока — синьою?"}, "options": [{"en": "Sand is turquoise.", "uk": "Пісок бірюзовий."}, {"en": "The sky is reflected only in shallow water.", "uk": "Небо відбивається лише в мілкій воді."}, {"en": "Deep water is colder.", "uk": "Глибока вода холодніша."}, {"en": "Water absorbs red light first, so deep water leaves only blue; over shallow sand, more green and light come back.", "uk": "Вода першим поглинає червоне світло, тож у глибокій воді лишається тільки синє; над мілким піском повертається більше зеленого і світла."}], "answer": 3, "explain": {"en": "The deeper the water, the more red and green light it soaks up. Absorption in your material copies this.", "uk": "Що глибша вода, то більше червоного і зеленого світла вона вбирає. Absorption у твоєму матеріалі повторює це."}}, {"q": {"en": "Your lake's water stands 1 m above its bank on one side. What's the fix?", "uk": "Вода у твоєму озері з одного боку стоїть на 1 м вище за берег. Як це виправити?"}, "options": [{"en": "Lower the lake's surface (or raise that bank) until the water sits below its lowest bank.", "uk": "Опустити поверхню озера (або підняти той берег), доки вода не буде нижчою за найнижчий берег."}, {"en": "Raise the lake.", "uk": "Підняти озеро."}, {"en": "Hide it with a Local Fog Volume.", "uk": "Сховати це за Local Fog Volume."}, {"en": "Make the lake bigger.", "uk": "Зробити озеро більшим."}], "answer": 0, "explain": {"en": "Water is always held in by land. If the lowest bank is below the surface, real water would pour out there.", "uk": "Воду завжди тримає суша. Якщо найнижчий берег нижчий за поверхню, справжня вода вилилася б саме там."}}], "weekInfo": {"week": 6, "title": {"en": "Terrain and water", "uk": "Рельєф і вода"}, "goal": {"en": "By Friday you have L_Island, a World Partition level with your island's terrain from a real heightmap, sculpted to your map, with rock-covered cliffs, beaches, an auto-material, the ocean, a lake and a river, seen from three locked drone cameras.", "uk": "До п'ятниці в тебе є L_Island, рівень World Partition із рельєфом твого острова з реальної карти висот, виліпленим за твоєю мапою, зі скелями, вкритими каменем, пляжами, автоматичним матеріалом, океаном, озером і річкою, і все це видно з трьох зафіксованих камер дрона."}, "skills": [{"en": "Heightmap-based landscapes in Unreal Engine 5 (16-bit import, Z scale and calibration)", "uk": "Ландшафти з карти висот в Unreal Engine 5 (16-бітний імпорт, масштаб Z і калібрування)"}, {"en": "Landscape sculpting for gameplay and realism: flats, road ramps and erosion", "uk": "Ліплення ландшафту для геймплею і реалізму: рівні майданчики, пандуси для доріг і ерозія"}, {"en": "Auto-landscape materials blended by slope and height", "uk": "Автоматичні матеріали ландшафту, що змішуються за схилом і висотою"}, {"en": "Unreal Water system: ocean, rivers and lakes that follow the terrain", "uk": "Система Water в Unreal: океан, річки й озера, що йдуть за рельєфом"}, {"en": "Cinematic camera set-up and shot review against reference photos", "uk": "Налаштування кінематографічних камер і перевірка кадрів за референсними фото"}]}, "morning": {"sofar": {"en": "Your island has sculpted land, a cliff coast, a beach and a material that paints rock, grass and sand by itself.", "uk": "На твоєму острові є виліплена земля, скелясте узбережжя, пляж і матеріал, який сам фарбує камінь, траву й пісок."}, "today": {"en": "You add the ocean at sea level, a lake, a river that runs downhill to the sea through a small cascade, and sea colour matched to a photo.", "uk": "Сьогодні ти додаєш океан на рівні моря, озеро, річку, що збігає схилом до моря через невеликий каскад, і колір моря, підібраний за фото."}, "cheer": {"en": "Water makes an island feel alive, so give the river your time and let your tutor help with any bank that will not sit right.", "uk": "Вода робить острів живим, тож приділи річці час, а тьютор допоможе з будь-яким берегом, що не хоче лягти як слід."}, "quote": {"text": {"en": "A lake is the landscape's most beautiful and expressive feature.", "uk": "Озеро — найпрекрасніша й найвиразніша риса краєвиду."}, "author": {"en": "Henry David Thoreau", "uk": "Генрі Девід Торо"}, "source": "https://en.wikiquote.org/wiki/Walden"}}, "hasAssets": false, "workPath": "Work\\Assignment\\Day-29-ocean-river-lake-cascade", "mapHref": "../../COURSE.html", "prevHref": "../Day-28-coast-cliffs-auto-material/START-HERE.html", "nextHref": "../Day-31-roads-that-follow-the-land/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8 and Krita. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me and don't write code. Keep me moving and make it feel like a game.\n\nToday I build on my own: The lake, the river, the cascade and the sea colour, on your own.\nIt's part of: The island's water with the Water plugin: the ocean at sea level, one lake in a hollow, one river from the lake to the sea, a cascade where the river drops, and the sea's colour matched to your reference photo (L_Island: the ocean all round the island; the lake and the river where your map draws them; the cascade where the river leaves the hills.).\n\nSpec:\n- The Water plugin, on since Day 0 (Edit > Plugins > Water ticked).\n- A Water Body Ocean at Z 0 with Affects Landscape unticked (so your sculpted sea floor stays), its Water Zone covering the whole 2,016 m landscape, and its shoreline roughly following your coast.\n- A Water Body Lake in a hollow, its surface below the lowest point of its banks.\n- A Water Body River from the lake's outflow to the sea along your map's stream: every point lower than the one before, River Width 3 to 10 m growing towards the sea, Depth 0.5 to 2 m, Affects Landscape ticked so it carves its bed.\n- A cascade (a river stepping down over a few rocks) where the river drops 3 to 6 m: river points close together over two or three steps, rocks from your rock pack round the lip, and a pool at the foot.\n- MI_Island_Ocean, a Material Instance of the ocean's water material in Content/Island/Materials, with its Absorption and Scattering colours tuned until your shallow bay matches your water-colour photo side by side.\n- water_notes.md listing every water body with its key numbers.\n\nMy checklist:\n1. Check that Water is ticked in Edit > Plugins (Day 0), then pilot CAM_Survey over your shallow bay at a similar height to your water-colour photo and save bay_before.png. Check: Water shows ticked, and bay_before.png shows the bay before any water. (from lesson 1)\n2. Delete the Z = 0 plane and place the ocean at Z 0 with Affects Landscape unticked. Check: your sculpted sea floor is unchanged under the water. (from lesson 1)\n3. Set the Water Zone's Zone Extent to 210000 x 210000 (type Zone Extent in its Details search box) and move the ocean's spline points onto your coast. Check: from 300 m the sea reaches every edge and the shoreline follows your island. (from lesson 1)\n4. Place the lake in its hollow and lower it below its banks. Check: from 20 m no water stands above the land anywhere round the lake. (from lesson 3)\n5. Draw the river from the lake's outflow to the sea, with a point at every bend. Check: every point is at least 50 cm lower than the one before. (from lesson 2)\n6. Set each point's River Width, Depth and Velocity, with Affects Landscape ticked. Check: the river widens and slows towards the sea, in a carved bed. (from lesson 2)\n7. Join the river to the lake at the same height. Check: no step or gap where they meet. (from lesson 3)\n8. The cascade: three close points dropping 1 to 2 m each, rocks round the lip, and a pool at the foot. Save cascade_15m.png. Check: from 15 m the water steps down between rocks into the pool. (from lesson 3)\n9. Bank check from 20 m along the river and the lake, saved as river_banks.png; fix with Smooth or the river's width. Check: no water floating above the ground and no gaps under the edges. (from lesson 2)\n10. Sea colour: MI_Island_Ocean, with Absorption and Scattering tuned against your photo. Check: water_match.png shows your bay beside the photo, with the shallows and the deep water close. (from lesson 4)\n11. Write water_notes.md: every water body and its key numbers. Check: the ocean, the lake, the river (each point's height and width) and the colour values are all there. (from lesson 2)\n12. Make before_after_day29.png (bay_before.png beside the same view with the finished, coloured water) and record a 60-second flight from the lake down the river to the sea at about 15 m (Win+Alt+R). Save today's clip as flythrough_day29.mp4 and check that you also have water_values.png (each is described in today's hand-in list; take any you are missing now). Check: the clip follows the water downhill all the way. (from lesson 2)\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Misha\nDay 29: Water: the ocean, a river, a lake and a cascade. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

,skills:'Skills for your CV and portfolio',dayGoal:'Today\'s goal',uses:'Builds on',quiz:'Check yourself',quizSub:'A small test at the end of the day. Pick an answer: you see at once if it\'s right, and why.',score:'Score',retry:'Try again',right:'Right!',wrong:'Not quite.',clip:'Victory clip: a 60-second fly-through in the editor (Win+Alt+R); hand it in with the report.',bossDay:'Boss day',sofar:'What you have achieved so far',todayL:'Today you will learn',finale:'Finale',letters:'ABCDEFG'}};

 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p><div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+list(D.handin,'ul','ticks')+'<p class="path">'+ic('folder')+'<span>'+u('shipTo')+' <code>'+esc(D.workPath)+'</code></span></p>'+(D.lessons.length?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<p class="muted">'+u('report')+'</p><div class="row"><button class="btn s" onclick="cp(D.reportPrompt)">'+ic('copy')+u('copyR')+'</button></div></section>';
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();

ls; тести в Content/Tools/Day98/L_Day98 і в TechToolsTest."}, "spec": [{"en": "Defaults: every tool does something sensible when placed with no changes. BP_TownGenerator's Layout defaults to DA_RoadLayout, Rules to DA_TownRules_Harbour and Seed to 1 (range 1 to 9999); BP_Road's Road Mesh to SM_RoadSection_10m; BP_PerfFlight's Start Delay to 3 (range 0 to 10); every default asset path starts with /TechTools/.", "uk": "Типові значення: кожен інструмент робить щось розумне, коли його розміщено без жодних змін. Layout у BP_TownGenerator за замовчуванням DA_RoadLayout, Rules DA_TownRules_Harbour, а Seed 1 (діапазон від 1 до 9999); Road Mesh у BP_Road SM_RoadSection_10m; Start Delay у BP_PerfFlight 3 (діапазон від 0 до 10); кожен типовий шлях ассета починається з /TechTools/."}, {"en": "Tooltips: every Instance Editable variable has a Description with what it does, its unit and a hint; every Call In Editor event has a Description; every EUW_TechTools button has a Tool Tip Text saying what it changes; settings grouped in Categories (Town, Preview, Links).", "uk": "Підказки: кожна змінна Instance Editable має Description з тим, що вона робить, її одиницею та порадою; кожна подія Call In Editor має Description; кожна кнопка EUW_TechTools має Tool Tip Text, що каже, що вона змінює; налаштування згруповано в Categories (Town, Preview, Links)."}, {"en": "Blueprint input checks: a function Check Inputs on BP_TownGenerator that returns OK only when Layout is set, Roads X and Roads Y each have at least 2 entries and Rules is set, and otherwise prints a red message of the form 'Town Generator: <problem>. Fix: <what to do>.' built with Format Text; Regenerate stops when the check fails; a missing Dresser gives an orange warning and the build carries on. BP_Road (Road Mesh) and BP_PerfFlight (Route) check their key input the same way, and BP_PerfFlight gains Run On Play (Boolean, default on, tooltip 'Untick to fly by hand in this level'), checked first in Event BeginPlay.", "uk": "Перевірки введення в Blueprint: функція Check Inputs у BP_TownGenerator, що повертає OK лише тоді, коли Layout встановлено, Roads X і Roads Y мають щонайменше по 2 записи, а Rules встановлено, і інакше виводить червоне повідомлення у формі 'Town Generator: <problem>. Fix: <what to do>.', побудоване через Format Text; Regenerate зупиняється, коли перевірка не проходить; відсутній Dresser дає помаранчеве попередження, а будівництво триває. BP_Road (Road Mesh) і BP_PerfFlight (Route) перевіряють свій ключовий вхід так само, а BP_PerfFlight отримує Run On Play (Boolean, за замовчуванням увімкнено, підказка 'Untick to fly by hand in this level'), яку перевіряють першою в Event BeginPlay."}, {"en": "Python input checks with a stop(message) helper (a show_message dialog, then a RuntimeError with the same text) in check_assets.py (no assets in FOLDER), place_from_csv.py (CSV file missing; an unknown type in a row is skipped with a message), perf_report.py (it stays plain Python, so its stop() only raises the RuntimeError, with no dialog: no capture; a missing column, listing the columns found) and rename_by_rules.py (no assets in FOLDER).", "uk": "Перевірки введення в Python із допоміжною функцією stop(message) (діалог show_message, потім RuntimeError з тим самим текстом) у check_assets.py (немає ассетів у FOLDER), place_from_csv.py (файл CSV відсутній; невідомий тип у рядку пропускається з повідомленням), perf_report.py (він лишається звичайним Python, тож його stop() лише викликає RuntimeError, без діалогу: немає захоплення; відсутній стовпець, з переліком знайдених стовпців) і rename_by_rules.py (немає ассетів у FOLDER)."}, {"en": "README.md with the sections What it is, Requirements (Unreal 5.8 and the plugins it needs), Install, Quick start (five steps to a generated quarter), Tools (one section per tool with a settings table and a screenshot), Scripts (what each changes, and its dry run), Known limits and Credits; at least six screenshots in Docs, each under 1 MB.", "uk": "README.md з розділами What it is, Requirements (Unreal 5.8 і плагіни, які йому потрібні), Install, Quick start (п'ять кроків до згенерованого кварталу), Tools (по розділу на інструмент з таблицею налаштувань і знімком екрана), Scripts (що змінює кожен і його пробний запуск), Known limits і Credits; щонайменше шість знімків екрана в Docs, кожен менше за 1 МБ."}, {"en": "test_messages.md: every input broken on purpose, the message seen, and whether it names the tool, the problem and the fix; everything committed and pushed.", "uk": "test_messages.md: кожне введення, навмисно зламане, побачене повідомлення та чи називає воно інструмент, проблему й виправлення; усе закомічено й надіслано."}], "piece1": "Defaults, tooltips and input checks for BP_TownGenerator and check_assets.py, and the README's first sections (built in the lessons)", "piece2": {"en": "The same checks for the other tools and scripts, and the finished README, on your own", "uk": "Ті самі перевірки для інших інструментів і скриптів та завершений README, самостійно"}, "steps": [{"text": {"en": "Place BP_TownGenerator at 0, 0, 0 in a new L_Day98 with the Day 87 ground slab and click Regenerate without changing anything. Check: a complete quarter builds from the defaults alone.", "uk": "Розмісти BP_TownGenerator на 0, 0, 0 у новому L_Day98 із плитою землі Дня 87 і натисни Regenerate, нічого не змінюючи. Перевірка: повний квартал будується лише з типових значень."}, "lesson": 1}, {"text": {"en": "Hover over every setting of BP_TownGenerator, BP_Road and BP_PerfFlight in Details. Check: each shows a tooltip with what it does and its unit, under a sensible Category.", "uk": "Наведи курсор на кожне налаштування BP_TownGenerator, BP_Road і BP_PerfFlight у Details. Перевірка: кожне показує підказку з тим, що воно робить, і його одиницею, у розумній Category."}, "lesson": 2}, {"text": {"en": "Break BP_TownGenerator on purpose: clear Layout and Regenerate; set it back, give a copy of DA_RoadLayout only one entry in Roads X and Regenerate with it; clear Rules and Regenerate. Check: three red messages, each naming the problem and the fix, and nothing built or deleted.", "uk": "Зламай BP_TownGenerator навмисно: очисти Layout і Regenerate; поверни його, дай копії DA_RoadLayout лише один запис у Roads X і Regenerate з нею; очисти Rules і Regenerate. Перевірка: три червоні повідомлення, кожне називає проблему та виправлення, і нічого не збудовано й не видалено."}, "lesson": 3}, {"text": {"en": "Clear Dresser and Regenerate. Check: the quarter builds, with an orange warning saying the streets were not dressed and how to set Dresser.", "uk": "Очисти Dresser і Regenerate. Перевірка: квартал будується, з помаранчевим попередженням про те, що вулиці не прикрашено, і як встановити Dresser."}, "lesson": 3}, {"text": {"en": "On your own: give BP_Road (Road Mesh empty) and BP_PerfFlight (Route empty) the same kind of check. Add Run On Play (Boolean, default on) to BP_PerfFlight and Branch on it right after Event BeginPlay. Check: each prints one readable message and does nothing else, and with Run On Play unticked Play lets you fly by hand.", "uk": "Самостійно: дай BP_Road (Road Mesh порожній) і BP_PerfFlight (Route порожній) такий самий вид перевірки. Додай Run On Play (Boolean, за замовчуванням увімкнено) до BP_PerfFlight і зроби Branch за ним одразу після Event BeginPlay. Перевірка: кожен виводить одне зрозуміле повідомлення й більше нічого не робить, а з вимкненим Run On Play Play дозволяє літати вручну."}, "lesson": 3}, {"text": {"en": "Run check_assets.py with FOLDER = '/TechTools/Nothing', then set it back. Check: a dialog and the Output Log both say there are no assets in that folder and how to fix it.", "uk": "Запусти check_assets.py з FOLDER = '/TechTools/Nothing', потім поверни назад. Перевірка: і діалог, і Output Log кажуть, що в цій папці немає ассетів, і як це виправити."}, "lesson": 3}, {"text": {"en": "On your own: place_from_csv.py with a wrong CSV path, then with one extra row of type kiosk; perf_report.py with an empty CSV_FOLDER (its message shows in the Output Log only: no dialog in plain Python); rename_by_rules.py on an empty folder. Check: four readable messages; the kiosk row is skipped with a message while the other rows are still placed in one undo.", "uk": "Самостійно: place_from_csv.py з хибним шляхом CSV, потім з одним зайвим рядком типу kiosk; perf_report.py з порожнім CSV_FOLDER (його повідомлення показується лише в Output Log: у звичайному Python діалогу немає); rename_by_rules.py на порожній папці. Перевірка: чотири зрозумілі повідомлення; рядок kiosk пропускається з повідомленням, а решта рядків усе одно розміщується одним скасуванням."}, "lesson": 3}, {"text": {"en": "Write test_messages.md: each broken input, the message you saw, and yes or no for tool, problem and fix. Check: at least ten rows, all yes.", "uk": "Напиши test_messages.md: кожне зламане введення, побачене повідомлення та «так» або «ні» для інструмента, проблеми й виправлення. Перевірка: щонайменше десять рядків, усі «так»."}, "lesson": 3}, {"text": {"en": "Take the README screenshots into Plugins/TechTools/Docs: euw_panel.png, town_details.png, quarter_120m.png, road_curve.png, dresser.png and report.png. Check: six PNG files, each under 1 MB and readable.", "uk": "Зроби знімки екрана для README у Plugins/TechTools/Docs: euw_panel.png, town_details.png, quarter_120m.png, road_curve.png, dresser.png і report.png. Перевірка: шість файлів PNG, кожен менше за 1 МБ і читабельний."}, "lesson": 4}, {"text": {"en": "Finish README.md: all eight sections, a settings table for each Blueprint tool, the scripts with their dry runs, and the six images. Check: the Markdown preview shows every image and every table.", "uk": "Заверши README.md: усі вісім розділів, таблиця налаштувань для кожного інструмента Blueprint, скрипти з їхніми пробними запусками та шість зображень. Перевірка: перегляд Markdown показує кожне зображення й кожну таблицю."}, "lesson": 4}, {"text": {"en": "Copy the plugin into TechToolsTest again and follow your own Quick start word for word. Check: the five steps work exactly as written; fix any step that doesn't.", "uk": "Скопіюй плагін у TechToolsTest знову та виконай свій власний Quick start слово в слово. Перевірка: п'ять кроків працюють точно як написано; виправ будь-який крок, що не працює."}, "lesson": 4}, {"text": {"en": "Commit and push (git add -A; git commit -m 'Defaults, tooltips, input checks and README'; git push), then open Plugins/TechTools on GitHub. Record clip_day98.mp4 (60 seconds): three broken inputs and their messages, then the README on GitHub. Check: GitHub shows README.md with its images, and the clip is in today's Work folder.", "uk": "Закоміть і надішли (git add -A; git commit -m 'Defaults, tooltips, input checks and README'; git push), потім відкрий Plugins/TechTools на GitHub. Запиши clip_day98.mp4 (60 секунд): три зламані введення та їхні повідомлення, потім README на GitHub. Перевірка: GitHub показує README.md із зображеннями, а кліп лежить у сьогоднішній папці Work."}, "lesson": "D96.4"}, {"text": {"en": "Click Copy the day report, paste it into a new tutor chat, answer its questions and save its answer as summary.md. Check: summary.md is in today's Work folder with Made, To look at, Hours and To revisit filled in.", "uk": "Натисни Copy the day report, встав у новий чат із тьютором, відповідай на його запитання і збережи його відповідь як summary.md. Перевірка: summary.md лежить у сьогоднішній папці Work із заповненими Made, To look at, Hours і To revisit."}, "lesson": 1}], "assets": ["techart/tool-review-checklist.md", "techart/code-style.md", "techart/standards-sheet.md"]}, "lessons": [{"title": {"en": "Defaults that work out of the box", "uk": "Типові значення, що працюють з коробки"}, "minutes": 40, "goals": [{"en": "Explain a safe default: a value that makes a tool do something sensible the moment it is placed.", "uk": "Поясни безпечне типове значення: значення, яке змушує інструмент робити щось розумне в момент розміщення."}, {"en": "Set defaults that point at assets inside the plugin, never at your island.", "uk": "Став типові значення, що вказують на ассети всередині плагіна, ніколи на твій острів."}, {"en": "Use Value Ranges so no setting can be typed into nonsense.", "uk": "Використовуй Value Ranges, щоб жодне налаштування не можна було ввести безглуздо."}], "doalong": [{"en": "Make L_Day98 in Content/Tools/Day98 (File > New Level > Basic), delete the Floor and add the Day 87 ground slab (a Cube at 10000, 10000, -50, Scale 300, 300, 1). Place BP_TownGenerator at 0, 0, 0 and click Regenerate without changing anything. You see what a new user sees: if nothing builds, the defaults are not set.", "uk": "Створи L_Day98 у Content/Tools/Day98 (File > New Level > Basic), видали Floor і додай плиту землі Дня 87 (Cube на 10000, 10000, -50, Scale 300, 300, 1). Розмісти BP_TownGenerator на 0, 0, 0 і натисни Regenerate, нічого не змінюючи. Ти бачиш те, що бачить новий користувач: якщо нічого не будується, типові значення не встановлено."}, {"en": "Open BP_TownGenerator, select Layout and set its Default Value to DA_RoadLayout; set Rules to DA_TownRules_Harbour and Seed to 1, with Slider and Value Range 1 to 9999. Compile and place a new copy. You see a quarter build at the first click.", "uk": "Відкрий BP_TownGenerator, вибери Layout і встанови його Default Value на DA_RoadLayout; встанови Rules на DA_TownRules_Harbour, а Seed на 1, зі Slider і Value Range від 1 до 9999. Compile і розмісти нову копію. Ти бачиш, як квартал будується з першого клацання."}, {"en": "Open BP_Road: Road Mesh defaults to SM_RoadSection_10m, and Piece Length to 1000 with a Value Range of 200 to 5000. Open BP_PerfFlight: Start Delay 3, range 0 to 10. You see every number inside a safe range.", "uk": "Відкрий BP_Road: Road Mesh за замовчуванням SM_RoadSection_10m, а Piece Length 1000 із Value Range від 200 до 5000. Відкрий BP_PerfFlight: Start Delay 3, діапазон від 0 до 10. Ти бачиш кожне число в безпечному діапазоні."}, {"en": "Hover over each default asset in Details to read its path. You see that every one starts with /TechTools/; anything starting with /Game/ would be missing in a fresh project.", "uk": "Наведи курсор на кожен типовий ассет у Details, щоб прочитати його шлях. Ти бачиш, що кожен починається з /TechTools/; будь-що, що починається з /Game/, бракувало б у чистому проєкті."}], "play": {"en": "Default doctor: the tutor names five defaults (Count 0; Spacing 150 cm; Layout empty; Seed 0 with no range; Road Mesh pointing at /Game/Island/SM_Road). For each I say what goes wrong for a new user and the safe default I would set.", "uk": "Лікар типових значень: тьютор називає п'ять типових значень (Count 0; Spacing 150 см; Layout порожній; Seed 0 без діапазону; Road Mesh, що вказує на /Game/Island/SM_Road). Для кожного я кажу, що йде не так для нового користувача, і яке безпечне типове значення я б поставив."}, "video": {"search": "unreal engine blueprint variable default value value range instance editable"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Defaults that work out of the box (Day 98, lesson 1 of 4).\nToday's build: A quality pass on TechTools: defaults, tooltips and input checks on BP_TownGenerator, BP_Road, BP_PerfFlight and four scripts, plus Plugins/TechTools/README.md with screenshots in Plugins/TechTools/Docs.\n\nBy the end of this lesson I can:\n1. Explain a safe default: a value that makes a tool do something sensible the moment it is placed.\n2. Set defaults that point at assets inside the plugin, never at your island.\n3. Use Value Ranges so no setting can be typed into nonsense.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (TechTools is a plugin now: your tools, data, kit and scripts in one box that installs into a fresh project, kept in Git.), what I will learn today (You make it safe and pleasant for anyone: defaults that work, tooltips that answer, errors that explain, and a README with pictures.), encourage me (This is the work that turns a clever tool into one people choose to use; be kind to your future users, one of whom is you in six months.), and share today's quote: \"Programs must be written for people to read, and only incidentally for machines to execute.\" (Harold Abelson and Gerald Jay Sussman).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 95: Why must a before-and-after test change only one thing? | Day 91: What does stat RHI show you?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Default doctor: the tutor names five defaults (Count 0; Spacing 150 cm; Layout empty; Seed 0 with no range; Road Mesh pointing at /Game/Island/SM_Road). For each I say what goes wrong for a new user and the safe default I would set.\n6. Do-along on today's build (Defaults, tooltips and input checks for BP_TownGenerator and check_assets.py, and the README's first sections (built in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Make L_Day98 in Content/Tools/Day98 (File > New Level > Basic), delete the Floor and add the Day 87 ground slab (a Cube at 10000, 10000, -50, Scale 300, 300, 1). Place BP_TownGenerator at 0, 0, 0 and click Regenerate without changing anything. You see what a new user sees: if nothing builds, the defaults are not set.\n   - Open BP_TownGenerator, select Layout and set its Default Value to DA_RoadLayout; set Rules to DA_TownRules_Harbour and Seed to 1, with Slider and Value Range 1 to 9999. Compile and place a new copy. You see a quarter build at the first click.\n   - Open BP_Road: Road Mesh defaults to SM_RoadSection_10m, and Piece Length to 1000 with a Value Range of 200 to 5000. Open BP_PerfFlight: Start Delay 3, range 0 to 10. You see every number inside a safe range.\n   - Hover over each default asset in Details to read its path. You see that every one starts with /TechTools/; anything starting with /Game/ would be missing in a fresh project.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Tooltips and categories everywhere", "uk": "Підказки та категорії скрізь"}, "minutes": 40, "goals": [{"en": "Write a tooltip that says what a setting does, its unit and a hint, for example 'Share of plots left empty, 0 to 1; 0.1 to 0.2 looks natural'.", "uk": "Напиши підказку, що каже, що робить налаштування, його одиницю та пораду, наприклад 'Share of plots left empty, 0 to 1; 0.1 to 0.2 looks natural'."}, {"en": "Describe Call In Editor events, so their buttons explain themselves.", "uk": "Опиши події Call In Editor, щоб їхні кнопки пояснювали самі себе."}, {"en": "Give every EUW_TechTools button a tooltip that says what it changes.", "uk": "Дай кожній кнопці EUW_TechTools підказку, що каже, що вона змінює."}], "doalong": [{"en": "In BP_TownGenerator select each Instance Editable variable and fill its Description: what it does, its unit and a hint. Compile. You see the tooltips when you hover over a placed copy's settings.", "uk": "У BP_TownGenerator вибери кожну змінну Instance Editable і заповни її Description: що вона робить, її одиниця та порада. Compile. Ти бачиш підказки, коли наводиш курсор на налаштування розміщеної копії."}, {"en": "Select the Regenerate event and fill its Description ('Builds the whole quarter from Layout, Rules and Seed; removes the last build first'); do the same for Clear and Check Town. You see the text when you hover over the buttons in Details.", "uk": "Вибери подію Regenerate і заповни її Description ('Builds the whole quarter from Layout, Rules and Seed; removes the last build first'); зроби те саме для Clear і Check Town. Ти бачиш текст, коли наводиш курсор на кнопки в Details."}, {"en": "Group the settings with Category: Town (Layout, Rules, Seed), Preview (Show Preview) and Links (Dresser, Keep Outs). You see tidy sections in Details instead of one long list.", "uk": "Згрупуй налаштування через Category: Town (Layout, Rules, Seed), Preview (Show Preview) і Links (Dresser, Keep Outs). Ти бачиш охайні розділи в Details замість одного довгого списку."}, {"en": "Open EUW_TechTools and read each button's Tool Tip Text: it must say what changes, for example 'Renames assets in FOLDER by the prefix rules; asks first; dry run by default'. Fix any that only repeat the button's name. You see tooltips that answer the real question.", "uk": "Відкрий EUW_TechTools і прочитай Tool Tip Text кожної кнопки: він має казати, що змінюється, наприклад 'Renames assets in FOLDER by the prefix rules; asks first; dry run by default'. Виправ кожен, що лише повторює назву кнопки. Ти бачиш підказки, що відповідають на справжнє запитання."}], "play": {"en": "Tooltip judge: the tutor shows me five tooltips (Count; The count; Number of bollards in the row, 1 to 50; Seed: changes it; Gap Chance: share of plots left empty, 0 to 1, 0.1 to 0.2 looks natural). I score each from 0 to 2 and rewrite the weak ones.", "uk": "Суддя підказок: тьютор показує мені п'ять підказок (Count; The count; Number of bollards in the row, 1 to 50; Seed: changes it; Gap Chance: share of plots left empty, 0 to 1, 0.1 to 0.2 looks natural). Я оцінюю кожну від 0 до 2 і переписую слабкі."}, "video": {"search": "unreal engine blueprint variable tooltip description category"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Tooltips and categories everywhere (Day 98, lesson 2 of 4).\nToday's build: A quality pass on TechTools: defaults, tooltips and input checks on BP_TownGenerator, BP_Road, BP_PerfFlight and four scripts, plus Plugins/TechTools/README.md with screenshots in Plugins/TechTools/Docs.\nEarlier today I already did: lesson 1 (Defaults that work out of the box). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Write a tooltip that says what a setting does, its unit and a hint, for example 'Share of plots left empty, 0 to 1; 0.1 to 0.2 looks natural'.\n2. Describe Call In Editor events, so their buttons explain themselves.\n3. Give every EUW_TechTools button a tooltip that says what it changes.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Tooltip judge: the tutor shows me five tooltips (Count; The count; Number of bollards in the row, 1 to 50; Seed: changes it; Gap Chance: share of plots left empty, 0 to 1, 0.1 to 0.2 looks natural). I score each from 0 to 2 and rewrite the weak ones.\n4. Do-along on today's build (Defaults, tooltips and input checks for BP_TownGenerator and check_assets.py, and the README's first sections (built in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - In BP_TownGenerator select each Instance Editable variable and fill its Description: what it does, its unit and a hint. Compile. You see the tooltips when you hover over a placed copy's settings.\n   - Select the Regenerate event and fill its Description ('Builds the whole quarter from Layout, Rules and Seed; removes the last build first'); do the same for Clear and Check Town. You see the text when you hover over the buttons in Details.\n   - Group the settings with Category: Town (Layout, Rules, Seed), Preview (Show Preview) and Links (Dresser, Keep Outs). You see tidy sections in Details instead of one long list.\n   - Open EUW_TechTools and read each button's Tool Tip Text: it must say what changes, for example 'Renames assets in FOLDER by the prefix rules; asks first; dry run by default'. Fix any that only repeat the button's name. You see tooltips that answer the real question.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Input checks with readable errors", "uk": "Перевірки введення зі зрозумілими помилками"}, "minutes": 40, "goals": [{"en": "Check a tool's inputs before it does any work, and stop with a message that says what is wrong and how to fix it.", "uk": "Перевіряй вхідні дані інструмента, перш ніж він почне будь-яку роботу, і зупиняйся з повідомленням, що каже, що не так і як це виправити."}, {"en": "Build messages with Format Text in Blueprints, and with a small stop() helper in Python.", "uk": "Будуй повідомлення через Format Text у Blueprint і через малу допоміжну функцію stop() у Python."}, {"en": "Tell a stop from a warning: missing data stops the tool; a missing extra only warns.", "uk": "Розрізняй зупинку й попередження: відсутні дані зупиняють інструмент; відсутній додаток лише попереджає."}], "doalong": [{"en": "In BP_TownGenerator make a function Check Inputs with one output, OK (Boolean). First Is Valid (Layout); on Is Not Valid add Format Text with the text {Tool}: no Layout set. Fix: pick a DA_RoadLayout in Details > Town > Layout. and type Town Generator into its Tool pin; connect it to Print String (Text Color red, Duration 10, Print to Log ticked), then a Return Node with OK false. You see a message built from a pattern; Format Text fills each Misha from the pin of the same name.", "uk": "У BP_TownGenerator створи функцію Check Inputs з одним виходом OK (Boolean). Спершу Is Valid (Layout); на Is Not Valid додай Format Text з текстом {Tool}: no Layout set. Fix: pick a DA_RoadLayout in Details > Town > Layout. і введи Town Generator у його пін Tool; з'єднай його з Print String (Text Color red, Duration 10, Print to Log позначено), потім Return Node з OK false. Ти бачиш повідомлення, побудоване за шаблоном; Format Text заповнює кожне Misha з піна з тим самим іменем."}, {"en": "Add the next checks the same way: Layout's Roads X Length at least 2 ('Roads X needs at least 2 roads'), the same for Roads Y, and Is Valid (Rules); end with a Return Node, OK true. At the start of Regenerate call Check Inputs and Branch on OK: False stops. Clear Layout and click Regenerate. You see one red message, and nothing built or deleted.", "uk": "Додай наступні перевірки так само: Roads X Length у Layout щонайменше 2 ('Roads X needs at least 2 roads'), те саме для Roads Y і Is Valid (Rules); закінчи Return Node, OK true. На початку Regenerate виклич Check Inputs і зроби Branch за OK: False зупиняє. Очисти Layout і натисни Regenerate. Ти бачиш одне червоне повідомлення, і нічого не збудовано й не видалено."}, {"en": "Dresser is an extra: in Regenerate, before Generate, if Dresser is not valid, Print String in orange 'Town Generator: no Dresser set, so the streets are not dressed. Fix: pick the PCG Volume in Details > Links > Dresser.' and carry on. You see the quarter build with a warning.", "uk": "Dresser — це додаток: у Regenerate, перед Generate, якщо Dresser не valid, Print String помаранчевим 'Town Generator: no Dresser set, so the streets are not dressed. Fix: pick the PCG Volume in Details > Links > Dresser.' і продовжуй. Ти бачиш, як квартал будується з попередженням."}, {"en": "In check_assets.py, after the settings, add a helper, 3 lines: `def stop(message):`; (4 spaces) `unreal.EditorDialog.show_message('TechTools', message, unreal.AppMsgType.OK)`; (4) `raise RuntimeError(message)` (stops the script, with the same text in the log). Before the main loop add `paths = lib.list_assets(FOLDER, recursive=True, include_folder=False)` and `if not paths: stop('No assets in ' + FOLDER + '. Fix: set FOLDER at the top of check_assets.py to a folder that exists, such as /TechTools/Kit.')`, and make the loop go over paths. Set FOLDER = '/TechTools/Nothing' and run. You see a dialog with your message.", "uk": "У check_assets.py після налаштувань додай допоміжну функцію, 3 рядки: `def stop(message):`; (4 пробіли) `unreal.EditorDialog.show_message('TechTools', message, unreal.AppMsgType.OK)`; (4) `raise RuntimeError(message)` (зупиняє скрипт, із тим самим текстом у журналі). Перед головним циклом додай `paths = lib.list_assets(FOLDER, recursive=True, include_folder=False)` і `if not paths: stop('No assets in ' + FOLDER + '. Fix: set FOLDER at the top of check_assets.py to a folder that exists, such as /TechTools/Kit.')` і зроби так, щоб цикл ішов по paths. Встанови FOLDER = '/TechTools/Nothing' і запусти. Ти бачиш діалог зі своїм повідомленням."}, {"en": "Set FOLDER back. Ask the tutor to judge both messages with three questions: does it name the tool, the problem and the fix? You see why 'Error 3' helps nobody.", "uk": "Поверни FOLDER назад. Попроси тьютора оцінити обидва повідомлення трьома запитаннями: чи називає воно інструмент, проблему та виправлення? Ти бачиш, чому 'Error 3' нікому не допомагає."}], "play": {"en": "Message makeover: the tutor shows me five bad messages (Accessed None trying to read property Layout; Error; Failed!; something went wrong in row 7; KeyError: 'kiosk'). For each I write the readable version: tool, problem, fix.", "uk": "Перероблення повідомлень: тьютор показує мені п'ять поганих повідомлень (Accessed None trying to read property Layout; Error; Failed!; something went wrong in row 7; KeyError: 'kiosk'). Для кожного я пишу зрозумілу версію: інструмент, проблема, виправлення."}, "video": {"search": "unreal engine blueprint format text print string validation message"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Input checks with readable errors (Day 98, lesson 3 of 4).\nToday's build: A quality pass on TechTools: defaults, tooltips and input checks on BP_TownGenerator, BP_Road, BP_PerfFlight and four scripts, plus Plugins/TechTools/README.md with screenshots in Plugins/TechTools/Docs.\nEarlier today I already did: lesson 1 (Defaults that work out of the box); lesson 2 (Tooltips and categories everywhere). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Check a tool's inputs before it does any work, and stop with a message that says what is wrong and how to fix it.\n2. Build messages with Format Text in Blueprints, and with a small stop() helper in Python.\n3. Tell a stop from a warning: missing data stops the tool; a missing extra only warns.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Message makeover: the tutor shows me five bad messages (Accessed None trying to read property Layout; Error; Failed!; something went wrong in row 7; KeyError: 'kiosk'). For each I write the readable version: tool, problem, fix.\n4. Do-along on today's build (Defaults, tooltips and input checks for BP_TownGenerator and check_assets.py, and the README's first sections (built in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - In BP_TownGenerator make a function Check Inputs with one output, OK (Boolean). First Is Valid (Layout); on Is Not Valid add Format Text with the text {Tool}: no Layout set. Fix: pick a DA_RoadLayout in Details > Town > Layout. and type Town Generator into its Tool pin; connect it to Print String (Text Color red, Duration 10, Print to Log ticked), then a Return Node with OK false. You see a message built from a pattern; Format Text fills each Misha from the pin of the same name.\n   - Add the next checks the same way: Layout's Roads X Length at least 2 ('Roads X needs at least 2 roads'), the same for Roads Y, and Is Valid (Rules); end with a Return Node, OK true. At the start of Regenerate call Check Inputs and Branch on OK: False stops. Clear Layout and click Regenerate. You see one red message, and nothing built or deleted.\n   - Dresser is an extra: in Regenerate, before Generate, if Dresser is not valid, Print String in orange 'Town Generator: no Dresser set, so the streets are not dressed. Fix: pick the PCG Volume in Details > Links > Dresser.' and carry on. You see the quarter build with a warning.\n   - In check_assets.py, after the settings, add a helper, 3 lines: `def stop(message):`; (4 spaces) `unreal.EditorDialog.show_message('TechTools', message, unreal.AppMsgType.OK)`; (4) `raise RuntimeError(message)` (stops the script, with the same text in the log). Before the main loop add `paths = lib.list_assets(FOLDER, recursive=True, include_folder=False)` and `if not paths: stop('No assets in ' + FOLDER + '. Fix: set FOLDER at the top of check_assets.py to a folder that exists, such as /TechTools/Kit.')`, and make the loop go over paths. Set FOLDER = '/TechTools/Nothing' and run. You see a dialog with your message.\n   - Set FOLDER back. Ask the tutor to judge both messages with three questions: does it name the tool, the problem and the fix? You see why 'Error 3' helps nobody.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "README.md: the manual", "uk": "README.md: посібник"}, "minutes": 40, "goals": [{"en": "Write a README in Markdown that a stranger can follow: what it is, requirements, install, quick start, tools, scripts, known limits and credits.", "uk": "Напиши README у Markdown, за яким може діяти сторонній: що це, вимоги, встановлення, швидкий старт, інструменти, скрипти, відомі обмеження та авторство."}, {"en": "Take clean screenshots and show them with Markdown image lines.", "uk": "Роби чисті знімки екрана та показуй їх рядками зображень Markdown."}, {"en": "Test the Quick start by following it word for word.", "uk": "Перевір Quick start, виконавши його слово в слово."}], "doalong": [{"en": "Create README.md in IslandCourse/Plugins/TechTools and type eight headings, each starting with ##: What it is, Requirements, Install, Quick start, Tools, Scripts, Known limits, Credits. Under What it is write two sentences. You see the skeleton in the Markdown preview (VS Code: Ctrl+Shift+V).", "uk": "Створи README.md в IslandCourse/Plugins/TechTools і введи вісім заголовків, кожен починається з ##: What it is, Requirements, Install, Quick start, Tools, Scripts, Known limits, Credits. Під What it is напиши два речення. Ти бачиш каркас у перегляді Markdown (VS Code: Ctrl+Shift+V)."}, {"en": "Under Requirements write Unreal Engine 5.8 and the plugins PCG, Python Editor Script Plugin and Editor Scripting Utilities. Under Install: copy the TechTools folder into your project's Plugins folder, open the project, tick TechTools in Edit > Plugins if it is not ticked, restart. You see two sections a stranger can follow.", "uk": "Під Requirements напиши Unreal Engine 5.8 і плагіни PCG, Python Editor Script Plugin та Editor Scripting Utilities. Під Install: скопіюй папку TechTools у папку Plugins свого проєкту, відкрий проєкт, познач TechTools в Edit > Plugins, якщо він не позначений, перезапусти. Ти бачиш два розділи, за якими може діяти сторонній."}, {"en": "Take euw_panel.png (EUW_TechTools docked) with Win+Shift+S and save it in Plugins/TechTools/Docs. Under Tools add the line ![EUW_TechTools panel](Docs/euw_panel.png) (a path from the README's own folder). You see the picture in the preview.", "uk": "Зроби euw_panel.png (EUW_TechTools закріплений) через Win+Shift+S і збережи його в Plugins/TechTools/Docs. Під Tools додай рядок ![EUW_TechTools panel](Docs/euw_panel.png) (шлях від власної папки README). Ти бачиш картинку в перегляді."}, {"en": "Under Tools write BP_TownGenerator's section: one sentence, a settings table with the columns | Setting | Unit | Range | Default | What it does |, and town_details.png. You see a table that matches the tooltips.", "uk": "Під Tools напиши розділ про BP_TownGenerator: одне речення, таблицю налаштувань зі стовпцями | Setting | Unit | Range | Default | What it does | і town_details.png. Ти бачиш таблицю, що збігається з підказками."}, {"en": "Write the Quick start as five numbered steps: place BP_TownGenerator at 0, 0, 0 over ground that covers 0 to 200 m (for example a Cube at 10000, 10000, -50, Scale 300, 300, 1); check Layout and Rules; click Regenerate; place a PCG Volume with PCG_StreetDresser over the quarter (Location 10000, 10000, 0; Scale 100, 100, 30), override its Kerb Offset to 0, 500, 12.5 and pick it as Dresser; click Check Town. You see the shortest path from install to a quarter.", "uk": "Напиши Quick start як п'ять нумерованих кроків: розмісти BP_TownGenerator на 0, 0, 0 над землею, що покриває від 0 до 200 м (наприклад, Cube на 10000, 10000, -50, Scale 300, 300, 1); перевір Layout і Rules; натисни Regenerate; розмісти PCG Volume з PCG_StreetDresser над кварталом (Location 10000, 10000, 0; Scale 100, 100, 30), перевизнач його Kerb Offset на 0, 500, 12.5 і вибери його як Dresser; натисни Check Town. Ти бачиш найкоротший шлях від встановлення до кварталу."}], "play": {"en": "Stranger test: the tutor plays someone who has never seen my tools and follows my Quick start out loud, step by step, stopping at every word that is unclear. I fix each unclear line.", "uk": "Тест стороннього: тьютор грає людину, яка ніколи не бачила моїх інструментів і вголос крок за кроком виконує мій Quick start, зупиняючись на кожному незрозумілому слові. Я виправляю кожен незрозумілий рядок."}, "video": {"search": "how to write a good readme markdown images tables"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: README.md: the manual (Day 98, lesson 4 of 4).\nToday's build: A quality pass on TechTools: defaults, tooltips and input checks on BP_TownGenerator, BP_Road, BP_PerfFlight and four scripts, plus Plugins/TechTools/README.md with screenshots in Plugins/TechTools/Docs.\nEarlier today I already did: lesson 1 (Defaults that work out of the box); lesson 2 (Tooltips and categories everywhere); lesson 3 (Input checks with readable errors). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Write a README in Markdown that a stranger can follow: what it is, requirements, install, quick start, tools, scripts, known limits and credits.\n2. Take clean screenshots and show them with Markdown image lines.\n3. Test the Quick start by following it word for word.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Stranger test: the tutor plays someone who has never seen my tools and follows my Quick start out loud, step by step, stopping at every word that is unclear. I fix each unclear line.\n4. Do-along on today's build (Defaults, tooltips and input checks for BP_TownGenerator and check_assets.py, and the README's first sections (built in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Create README.md in IslandCourse/Plugins/TechTools and type eight headings, each starting with ##: What it is, Requirements, Install, Quick start, Tools, Scripts, Known limits, Credits. Under What it is write two sentences. You see the skeleton in the Markdown preview (VS Code: Ctrl+Shift+V).\n   - Under Requirements write Unreal Engine 5.8 and the plugins PCG, Python Editor Script Plugin and Editor Scripting Utilities. Under Install: copy the TechTools folder into your project's Plugins folder, open the project, tick TechTools in Edit > Plugins if it is not ticked, restart. You see two sections a stranger can follow.\n   - Take euw_panel.png (EUW_TechTools docked) with Win+Shift+S and save it in Plugins/TechTools/Docs. Under Tools add the line ![EUW_TechTools panel](Docs/euw_panel.png) (a path from the README's own folder). You see the picture in the preview.\n   - Under Tools write BP_TownGenerator's section: one sentence, a settings table with the columns | Setting | Unit | Range | Default | What it does |, and town_details.png. You see a table that matches the tooltips.\n   - Write the Quick start as five numbered steps: place BP_TownGenerator at 0, 0, 0 over ground that covers 0 to 200 m (for example a Cube at 10000, 10000, -50, Scale 300, 300, 1); check Layout and Rules; click Regenerate; place a PCG Volume with PCG_StreetDresser over the quarter (Location 10000, 10000, 0; Scale 100, 100, 30), override its Kerb Offset to 0, 500, 12.5 and pick it as Dresser; click Check Town. You see the shortest path from install to a quarter.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "test_messages.md (each broken input, its message and the three yes or no answers)", "uk": "test_messages.md (кожне зламане введення, його повідомлення та три відповіді «так» або «ні»)"}, {"en": "README.md and the six screenshots in Docs (as committed to GitHub)", "uk": "README.md і шість знімків екрана в Docs (як закомічено на GitHub)"}, {"en": "clip_day98.mp4 (60 seconds: three broken inputs and their messages, then the README on GitHub)", "uk": "clip_day98.mp4 (60 секунд: три зламані введення та їхні повідомлення, потім README на GitHub)"}, {"en": "summary.md", "uk": "summary.md"}], "goal": {"en": "By the end of today you have TechTools tools that work the moment they are placed: safe defaults, a tooltip on every setting and button, input checks that stop with a readable message saying what is wrong and how to fix it, and README.md, a manual with screenshots inside the plugin.", "uk": "До кінця сьогодні ти маєш інструменти TechTools, що працюють у момент розміщення: безпечні типові значення, підказку на кожному налаштуванні й кнопці, перевірки введення, що зупиняються зі зрозумілим повідомленням про те, що не так і як це виправити, і README.md, посібник зі знімками екрана всередині плагіна."}, "uses": [{"en": "Day 97: the TechTools plugin, EUW_TechTools and TechToolsTest", "uk": "День 97: плагін TechTools, EUW_TechTools і TechToolsTest"}, {"en": "Day 89: BP_TownGenerator's Regenerate, Clear and settings", "uk": "День 89: Regenerate, Clear і налаштування BP_TownGenerator"}, {"en": "Days 73, 74 and 92: place_from_csv.py, check_assets.py and perf_report.py", "uk": "Дні 73, 74 і 92: place_from_csv.py, check_assets.py і perf_report.py"}, {"en": "Day 72: unreal.EditorDialog.show_message", "uk": "День 72: unreal.EditorDialog.show_message"}, {"en": "Days 61 and 75: tooltips, Value Ranges and tool-review-checklist.md", "uk": "Дні 61 і 75: підказки, Value Ranges і tool-review-checklist.md"}], "quiz": [{"q": {"en": "What makes a default safe?", "uk": "Що робить типове значення безпечним?"}, "options": [{"en": "The tool does something sensible the moment it is placed, using assets inside the plugin", "uk": "Інструмент робить щось розумне в момент розміщення, використовуючи ассети всередині плагіна"}, {"en": "It is always 0", "uk": "Воно завжди 0"}, {"en": "It points at your island's assets", "uk": "Воно вказує на ассети твого острова"}, {"en": "It is hidden from Details", "uk": "Воно приховане з Details"}], "answer": 0, "explain": {"en": "A new user's first click should give a result; defaults inside the plugin also work in a fresh project.", "uk": "Перше клацання нового користувача має дати результат; типові значення всередині плагіна працюють і в чистому проєкті."}}, {"q": {"en": "A user clicks Regenerate with no Layout and sees 'Accessed None trying to read property Layout'. What should your tool do instead?", "uk": "Користувач натискає Regenerate без Layout і бачить 'Accessed None trying to read property Layout'. Що має зробити твій інструмент натомість?"}, "options": [{"en": "Crash, so they notice", "uk": "Вилетіти, щоб вони помітили"}, {"en": "Stop before any work and print 'Town Generator: no Layout set. Fix: pick a DA_RoadLayout in Details > Town > Layout.'", "uk": "Зупинитися до будь-якої роботи та вивести 'Town Generator: no Layout set. Fix: pick a DA_RoadLayout in Details > Town > Layout.'"}, {"en": "Build an empty quarter", "uk": "Побудувати порожній квартал"}, {"en": "Pick a random layout", "uk": "Вибрати випадковий layout"}], "answer": 1, "explain": {"en": "Checking inputs first turns a confusing engine error into a message that names the tool, the problem and the fix.", "uk": "Перевірка вхідних даних спершу перетворює заплутану помилку рушія на повідомлення, що називає інструмент, проблему та виправлення."}}, {"q": {"en": "Why is a missing Dresser a warning and not a stop?", "uk": "Чому відсутній Dresser — це попередження, а не зупинка?"}, "options": [{"en": "Warnings are faster to print", "uk": "Попередження швидше виводяться"}, {"en": "Dressers are never needed", "uk": "Dresser ніколи не потрібні"}, {"en": "The quarter can still be built without dressing, so the user gets a result and a clear note", "uk": "Квартал усе одно можна збудувати без прикрашання, тож користувач отримує результат і зрозумілу примітку"}, {"en": "Format Text cannot stop a function", "uk": "Format Text не може зупинити функцію"}], "answer": 2, "explain": {"en": "Stop only for what the tool cannot work without; for extras, do the work and say what was skipped.", "uk": "Зупиняйся лише через те, без чого інструмент не може працювати; для додатків виконай роботу та скажи, що було пропущено."}}, {"q": {"en": "What does stop(message) do in your scripts?", "uk": "Що робить stop(message) у твоїх скриптах?"}, "options": [{"en": "Deletes the last report", "uk": "Видаляє останній звіт"}, {"en": "Pauses the script for a second", "uk": "Призупиняє скрипт на секунду"}, {"en": "Saves the level", "uk": "Зберігає рівень"}, {"en": "Shows the message in a dialog and stops the script with the same text in the log", "uk": "Показує повідомлення в діалозі та зупиняє скрипт із тим самим текстом у журналі"}], "answer": 3, "explain": {"en": "A panel user sees the dialog; someone running the script sees the text in the Output Log.", "uk": "Користувач панелі бачить діалог; той, хто запускає скрипт, бачить текст в Output Log."}}, {"q": {"en": "Your README's images show on your PC but not on GitHub. What is the likely cause?", "uk": "Зображення твого README показуються на твоєму ПК, але не на GitHub. Яка ймовірна причина?"}, "options": [{"en": "GitHub hides images in private repositories", "uk": "GitHub ховає зображення в приватних репозиторіях"}, {"en": "The image lines use full C:/ paths instead of paths from the README's folder, such as Docs/euw_panel.png, or Docs was not committed", "uk": "Рядки зображень використовують повні шляхи C:/ замість шляхів від папки README, як-от Docs/euw_panel.png, або Docs не закомічено"}, {"en": "PNG files cannot be shown in Markdown", "uk": "Файли PNG не можна показати в Markdown"}, {"en": "Markdown needs HTML for images", "uk": "Markdown потребує HTML для зображень"}], "answer": 1, "explain": {"en": "Paths relative to the README work everywhere the folder goes, including GitHub and other people's PCs.", "uk": "Шляхи відносно README працюють усюди, куди потрапляє папка, зокрема на GitHub і на чужих ПК."}}], "weekInfo": null, "morning": {"sofar": {"en": "TechTools is a plugin now: your tools, data, kit and scripts in one box that installs into a fresh project, kept in Git.", "uk": "TechTools тепер плагін: твої інструменти, дані, набір і скрипти в одній коробці, що встановлюється в чистий проєкт і зберігається в Git."}, "today": {"en": "You make it safe and pleasant for anyone: defaults that work, tooltips that answer, errors that explain, and a README with pictures.", "uk": "Ти робиш його безпечним і приємним для будь-кого: типові значення, що працюють, підказки, що відповідають, помилки, що пояснюють, і README із зображеннями."}, "cheer": {"en": "This is the work that turns a clever tool into one people choose to use; be kind to your future users, one of whom is you in six months.", "uk": "Це робота, що перетворює хитромудрий інструмент на той, який люди обирають; будь добрим до своїх майбутніх користувачів, одним з яких будеш ти за півроку."}, "quote": {"text": {"en": "Programs must be written for people to read, and only incidentally for machines to execute.", "uk": "Програми слід писати насамперед для читання людьми, і лише принагідно для виконання машинами."}, "author": {"en": "Harold Abelson and Gerald Jay Sussman", "uk": "Гарольд Абельсон і Джеральд Джей Сассман"}, "source": "Structure and Interpretation of Computer Programs (book), preface to the first edition, 1985"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-98-tool-quality-readme", "mapHref": "../../COURSE.html", "prevHref": "../Day-97-content-plugin-techtools/START-HERE.html", "nextHref": "../Day-99-self-code-review-refactor/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8, Python, and a Markdown editor (VS Code or Notepad). I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me: when my Blueprint or script fails, ask for the error message or a screenshot of the graph, point to the line or node that is wrong and explain why, then let me fix it myself. Never write the whole tool for me. Keep me moving and make it feel like a game.\n\nToday I build on my own: The same checks for the other tools and scripts, and the finished README, on your own.\nIt's part of: A quality pass on TechTools: defaults, tooltips and input checks on BP_TownGenerator, BP_Road, BP_PerfFlight and four scripts, plus Plugins/TechTools/README.md with screenshots in Plugins/TechTools/Docs (The TechTools plugin; README.md and the Docs folder in IslandCourse/Plugins/TechTools; tests in Content/Tools/Day98/L_Day98 and in TechToolsTest.).\n\nSpec:\n- Defaults: every tool does something sensible when placed with no changes. BP_TownGenerator's Layout defaults to DA_RoadLayout, Rules to DA_TownRules_Harbour and Seed to 1 (range 1 to 9999); BP_Road's Road Mesh to SM_RoadSection_10m; BP_PerfFlight's Start Delay to 3 (range 0 to 10); every default asset path starts with /TechTools/.\n- Tooltips: every Instance Editable variable has a Description with what it does, its unit and a hint; every Call In Editor event has a Description; every EUW_TechTools button has a Tool Tip Text saying what it changes; settings grouped in Categories (Town, Preview, Links).\n- Blueprint input checks: a function Check Inputs on BP_TownGenerator that returns OK only when Layout is set, Roads X and Roads Y each have at least 2 entries and Rules is set, and otherwise prints a red message of the form 'Town Generator: <problem>. Fix: <what to do>.' built with Format Text; Regenerate stops when the check fails; a missing Dresser gives an orange warning and the build carries on. BP_Road (Road Mesh) and BP_PerfFlight (Route) check their key input the same way, and BP_PerfFlight gains Run On Play (Boolean, default on, tooltip 'Untick to fly by hand in this level'), checked first in Event BeginPlay.\n- Python input checks with a stop(message) helper (a show_message dialog, then a RuntimeError with the same text) in check_assets.py (no assets in FOLDER), place_from_csv.py (CSV file missing; an unknown type in a row is skipped with a message), perf_report.py (it stays plain Python, so its stop() only raises the RuntimeError, with no dialog: no capture; a missing column, listing the columns found) and rename_by_rules.py (no assets in FOLDER).\n- README.md with the sections What it is, Requirements (Unreal 5.8 and the plugins it needs), Install, Quick start (five steps to a generated quarter), Tools (one section per tool with a settings table and a screenshot), Scripts (what each changes, and its dry run), Known limits and Credits; at least six screenshots in Docs, each under 1 MB.\n- test_messages.md: every input broken on purpose, the message seen, and whether it names the tool, the problem and the fix; everything committed and pushed.\n\nMy checklist:\n1. Place BP_TownGenerator at 0, 0, 0 in a new L_Day98 with the Day 87 ground slab and click Regenerate without changing anything. Check: a complete quarter builds from the defaults alone. (from lesson 1)\n2. Hover over every setting of BP_TownGenerator, BP_Road and BP_PerfFlight in Details. Check: each shows a tooltip with what it does and its unit, under a sensible Category. (from lesson 2)\n3. Break BP_TownGenerator on purpose: clear Layout and Regenerate; set it back, give a copy of DA_RoadLayout only one entry in Roads X and Regenerate with it; clear Rules and Regenerate. Check: three red messages, each naming the problem and the fix, and nothing built or deleted. (from lesson 3)\n4. Clear Dresser and Regenerate. Check: the quarter builds, with an orange warning saying the streets were not dressed and how to set Dresser. (from lesson 3)\n5. On your own: give BP_Road (Road Mesh empty) and BP_PerfFlight (Route empty) the same kind of check. Add Run On Play (Boolean, default on) to BP_PerfFlight and Branch on it right after Event BeginPlay. Check: each prints one readable message and does nothing else, and with Run On Play unticked Play lets you fly by hand. (from lesson 3)\n6. Run check_assets.py with FOLDER = '/TechTools/Nothing', then set it back. Check: a dialog and the Output Log both say there are no assets in that folder and how to fix it. (from lesson 3)\n7. On your own: place_from_csv.py with a wrong CSV path, then with one extra row of type kiosk; perf_report.py with an empty CSV_FOLDER (its message shows in the Output Log only: no dialog in plain Python); rename_by_rules.py on an empty folder. Check: four readable messages; the kiosk row is skipped with a message while the other rows are still placed in one undo. (from lesson 3)\n8. Write test_messages.md: each broken input, the message you saw, and yes or no for tool, problem and fix. Check: at least ten rows, all yes. (from lesson 3)\n9. Take the README screenshots into Plugins/TechTools/Docs: euw_panel.png, town_details.png, quarter_120m.png, road_curve.png, dresser.png and report.png. Check: six PNG files, each under 1 MB and readable. (from lesson 4)\n10. Finish README.md: all eight sections, a settings table for each Blueprint tool, the scripts with their dry runs, and the six images. Check: the Markdown preview shows every image and every table. (from lesson 4)\n11. Copy the plugin into TechToolsTest again and follow your own Quick start word for word. Check: the five steps work exactly as written; fix any step that doesn't. (from lesson 4)\n12. Commit and push (git add -A; git commit -m 'Defaults, tooltips, input checks and README'; git push), then open Plugins/TechTools on GitHub. Record clip_day98.mp4 (60 seconds): three broken inputs and their messages, then the README on GitHub. Check: GitHub shows README.md with its images, and the clip is in today's Work folder. (from day 96, lesson 4)\n13. Click Copy the day report, paste it into a new tutor chat, answer its questions and save its answer as summary.md. Check: summary.md is in today's Work folder with Made, To look at, Hours and To revisit filled in. (from lesson 1)\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Misha\nDay 98: Tool quality: safe defaults, tooltips, readable errors and a README. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

function quiz(){if(!D.quiz||!D.quiz.length)return '';const a=st.qa||{};let ok=0;const L=u('letters');
 const pips='<div class="pips well" aria-hidden="true">'+D.quiz.map((q,i)=>'<i class="'+(a[i]==null?'':a[i]===q.answer?'r':'w')+'"></i>').join('')+'</div>';
 const qs=D.quiz.map((q,i)=>{const c=a[i];if(c===q.answer)ok++;return '<div class="qz"><p class="qq"><span class="qn">'+(i+1)+'</span><span>'+lk(x(q.q))+'</span></p>'+q.options.map((o,k)=>{let cls='opt',mk='<span></span>';if(c!=null){if(k===q.answer){cls+=' right';mk=ic('check','mk')}else if(k===c){cls+=' wrong';mk=ic('x','mk')}}return '<button class="'+cls+'" id="o'+i+'_'+k+'"'+(c!=null?' disabled':'')+' onclick="pick('+i+','+k+')"><span class="lt">'+(L[k]||k+1)+'</span><span>'+esc(x(o))+'</span>'+mk+'</button>'}).join('')+(c!=null?'<p class="exp '+(c===q.answer?'r':'w')+'" id="e'+i+'" tabindex="-1"><b>'+(c===q.answer?u('right'):u('wrong'))+'</b>'+lk(x(q.explain))+'</p>':'')+'</div>'}).join('');
 return '<section class="card glass quiz">'+lab(u('quiz'),'gold')+'<p class="muted" style="margin:-6px 0 14px">'+u('quizSub')+'</p>'+pips+qs+(qDone()?'<div class="score well" role="status"><span class="eyebrow">'+u('score')+'</span><span class="lcd" aria-label="'+ok+' / '+D.quiz.length+'">'+seg(ok+'/'+D.quiz.length)+'</span><div class="row"><button class="btn ghost" id="retry" onclick="retry()">'+u('retry')+'</button></div></div>':'')+'</section>'}
function vid(v){if(!v)return '';const link=v.url?'<a href="'+esc(v.url)+'" target="_blank" rel="noopener">'+esc(x(v.title)||v.url)+'</a>'+(v.channel?' <span class="muted">· '+esc(v.channel)+(v.length?' · '+esc(v.length):'')+'</span>':''):'';const s=v.search?'<a href="https://www.youtube.com/results?search_query='+encodeURIComponent(v.search)+'" target="_blank" rel="noopener">'+u('noVid')+': '+esc(v.search)+'</a>':'';const alt=v.alt&&v.alt.url?'<br><span class="eyebrow">UA</span> <a href="'+esc(v.alt.url)+'" target="_blank" rel="noopener">'+esc(v.alt.title||v.alt.url)+'</a>'+(v.alt.channel?' <span class="muted">· '+esc(v.alt.channel)+'</span>':''):'';return '<div class="vid well">'+kn('play')+'<div><b>'+u('more')+'?</b><br>'+(link||s)+alt+(link&&s?'<br><span class="muted" style="font-size:14px">'+s+'</span>':'')+'</div></div>'}
function morning(){const m=D.morning;if(!m)return '';const q=m.quote||{};
 let shelf='';if(D.day>0){shelf='<div class="shelf" aria-hidden="true">';let g='';for(let d=0;d<D.day;d++){let p=0;try{p=(JSON.parse(localStorage.getItem('devteam:'+D.learner+':'+d))||{}).pct||0}catch(e){}g+='<i class="'+(p>=1?'d':'')+(d>0&&d%5===0?' bs':'')+'"></i>';if(d%5===0||d===D.day-1){shelf+='<span class="wkg">'+g+'</span>';g=''}}shelf+='</div>'}
 const qt=lang==='uk'&&q.original?q.original:x(q.text);
 return '<section class="card glass morning"><div class="mgrid">'+(m.sofar?'<div>'+lab(u('sofar'),'gold')+shelf+'<p class="mtxt">'+lk(x(m.sofar))+'</p></div>':'')+(m.today?'<div>'+lab(u('todayL'))+'<p class="mtxt">'+lk(x(m.today))+'</p></div>':'')+'</div>'+(m.cheer?'<p class="cheer">'+esc(x(m.cheer))+'</p>':'')+(qt?'<figure class="quote well">'+kn('quote')+'<blockquote>'+esc(qt)+'</blockquote>'+(q.author?'<figcaption>'+esc(x(q.author))+'</figcaption>':'')+'</figure>':'')+'</section>'}
function setLang(l){lang=l;try{localStorage.setItem('devteam:lang',lang)}catch(e){};render()}
function toggleLang(){setLang(lang==='uk'?'en':'uk')}
/* keep open sections and keyboard focus across re-renders */
const openD=new Set();
function tg(e){if(e.open)openD.add(e.id);else openD.delete(e.id)}
const op=id=>openD.has(id)?' open':'';
function render(){const ae=document.activeElement,fid=ae&&(ae.id||(ae.getAttribute('data-th')?'th-'+ae.getAttribute('data-th'):ae.getAttribute('lang')&&ae.closest('.seg')?'lg-'+ae.getAttribute('lang'):''));
 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);
 const b=D.build,P=Math.round(prog()*100);
 document.getElementById('top').innerHTML='<div class="topin glass"><a class="maplink" href="'+esc(D.mapHref)+'">'+kn('map')+u('map')+'</a><div class="crumb"><b>'+esc(x(D.learnerName))+'</b><span>'+u('week')+' '+D.week+'</span><span>'+u('day')+' '+D.day+' '+u('of')+' '+D.total+'</span></div>'+controls(lang,'setLang')+'</div><div class="tline"><i style="width:'+P+'%"></i></div>';
 const state=w=>w<D.week?'b':w===D.week?'n':'p';
 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 if(D.weekInfo){const w=D.weekInfo;h+='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}
 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p><div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+list(D.handin,'ul','ticks')+'<p class="path">'+ic('folder')+'<span>'+u('shipTo')+' <code>'+esc(D.workPath)+'</code></span></p>'+(D.lessons.length?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<p class="muted">'+u('report')+'</p><div class="row"><button class="btn s" onclick="cp(D.reportPrompt)">'+ic('copy')+u('copyR')+'</button></div></section>';
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();
</script>
</body>
</html>

out. і введи Town Generator у його вхід Tool. З'єднай із Print String (Text Color червоний, Duration 10, Print to Log позначено), потім Return Node з OK false. Має вийти: повідомлення, зібране за шаблоном. Format Text заповнює кожне Misha із входу з такою самою назвою."}, {"en": "Add the next checks the same way: Layout's Roads X Length at least 2 ('Roads X needs at least 2 roads'), the same for Roads Y, and Is Valid (Rules); end with a Return Node, OK true. At the start of Regenerate call Check Inputs and Branch on OK: False stops. Clear Layout and click Regenerate. You see one red message, and nothing built or deleted.", "uk": "Так само додай наступні перевірки: Length для Roads X у Layout щонайменше 2 ('Roads X needs at least 2 roads'), те саме для Roads Y, і Is Valid (Rules). Закінчи Return Node з OK true. На початку Regenerate виклич Check Inputs і зроби Branch за OK: False зупиняє. Очисти Layout і клацни Regenerate. Має вийти: одне червоне повідомлення, і нічого не збудовано й не видалено."}, {"en": "Dresser is an extra: in Regenerate, before Generate, if Dresser is not valid, Print String in orange 'Town Generator: no Dresser set, so the streets are not dressed. Fix: pick the PCG Volume in Details > Links > Dresser.' and carry on. You see the quarter build with a warning. In check_assets.py, after the settings, add a helper, 3 lines: `def stop(message):`; (4 spaces) `unreal.EditorDialog.show_message('TechTools', message, unreal.AppMsgType.OK)`; (4) `raise RuntimeError(message)` (stops the script, with the same text in the log).", "uk": "Dresser — додаткова частина. У Regenerate перед Generate, якщо Dresser не valid, зроби Print String помаранчевим 'Town Generator: no Dresser set, so the streets are not dressed. Fix: pick the PCG Volume in Details > Links > Dresser.' і продовжуй. Мікрорайон будується з попередженням. У check_assets.py після налаштувань додай помічника, 3 рядки: `def stop(message):`; (4 пробіли) `unreal.EditorDialog.show_message('TechTools', message, unreal.AppMsgType.OK)`; (4) `raise RuntimeError(message)` (зупиняє скрипт із тим самим текстом у журналі)."}, {"en": "Before the main loop add `paths = lib.list_assets(FOLDER, recursive=True, include_folder=False)` and `if not paths: stop('No assets in ' + FOLDER + '. Fix: set FOLDER at the top of check_assets.py to a folder that exists, such as /TechTools/Kit.')`, and make the loop go over paths. Set FOLDER = '/TechTools/Nothing' and run. You see a dialog with your message.", "uk": "Перед головним циклом додай `paths = lib.list_assets(FOLDER, recursive=True, include_folder=False)` і `if not paths: stop('No assets in ' + FOLDER + '. Fix: set FOLDER at the top of check_assets.py to a folder that exists, such as /TechTools/Kit.')`, а цикл нехай іде по paths. Постав FOLDER = '/TechTools/Nothing' і запусти. Має вийти: діалог із твоїм повідомленням."}, {"en": "Set FOLDER back. Ask the tutor to judge both messages with three questions: does it name the tool, the problem and the fix? You see why 'Error 3' helps nobody.", "uk": "Поверни FOLDER. Попроси тьютора оцінити обидва повідомлення трьома питаннями: чи називає воно інструмент, проблему і виправлення? Так стає зрозуміло, чому 'Error 3' нікому не допомагає."}], "play": {"en": "Message makeover: the tutor shows me five bad messages (Accessed None trying to read property Layout; Error; Failed!; something went wrong in row 7; KeyError: 'kiosk'). For each I write the readable version: tool, problem, fix.", "uk": "Переробка повідомлень: тьютор показує п'ять поганих повідомлень (Accessed None trying to read property Layout; Error; Failed!; something went wrong in row 7; KeyError: 'kiosk'). Для кожного я пишу зрозумілу версію: інструмент, проблема, виправлення."}, "video": {"search": "unreal engine blueprint format text print string validation message"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Перевірки введення зі зрозумілими помилками (Day 98, lesson 3 of 4). Today's build: Перевірка якості TechTools: типові значення, підказки й перевірки введення на BP_TownGenerator, BP_Road, BP_PerfFlight і чотирьох скриптах, плюс Plugins/TechTools/README.md зі скриншотами в Plugins/TechTools/Docs.\nWhat I already know: День 97: плагін TechTools, EUW_TechTools і TechToolsTest; День 89: Regenerate, Clear і налаштування BP_TownGenerator; Дні 73, 74 і 92: place_from_csv.py, check_assets.py і perf_report.py; День 72: unreal.EditorDialog.show_message; Дні 61 і 75: підказки, Value Ranges і tool-review-checklist.md.\nEarlier today I already did: lesson 1 (Типові значення, що працюють одразу); lesson 2 (Підказки й категорії всюди). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Перевіряти входи інструмента до будь-якої роботи і зупинятися з повідомленням: що не так і як виправити.\n2. Складати повідомлення через Format Text у Blueprint і маленьким помічником stop() у Python.\n3. Розрізняти зупинку і попередження: без потрібних даних інструмент зупиняється, а без додаткової частини лише попереджає.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: 2 lines on why today matters and where it comes back, in plain words (from this: Інструмент вартий рівно стільки, скільки дає людині, яка користується ним без тебе. Безпечні типові значення змушують його працювати одразу після встановлення. Підказки відповідають на питання раніше, ніж їх поставлять. Зрозуміла помилка перетворює тихий збій на двохвилинне виправлення. README дає чужій людині встановити інструмент і працювати з ним. Студії оцінюють авторів інструментів саме за цим, бо заплутаний інструмент забирає час у всіх. It comes back: README.md стане посібником, який ти доробиш для демо в День 109. На ці перевірки введення спираються завтрашній огляд (День 99) і п'ятничний тест чистої кімнати (День 100).); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-98-tool-quality-readme exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (Типові значення, підказки й перевірки введення для BP_TownGenerator і check_assets.py та перші розділи README (робиш на уроках)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. У BP_TownGenerator створи функцію Check Inputs з одним виходом OK (Boolean). Спершу Is Valid (Layout). На Is Not Valid додай Format Text з текстом {Tool}: no Layout set.\n   2. Fix: pick a DA_RoadLayout in Details > Town > Layout. і введи Town Generator у його вхід Tool. З'єднай із Print String (Text Color червоний, Duration 10, Print to Log позначено), потім Return Node з OK false. Має вийти: повідомлення, зібране за шаблоном. Format Text заповнює кожне Misha із входу з такою самою назвою.\n   3. Так само додай наступні перевірки: Length для Roads X у Layout щонайменше 2 ('Roads X needs at least 2 roads'), те саме для Roads Y, і Is Valid (Rules). Закінчи Return Node з OK true. На початку Regenerate виклич Check Inputs і зроби Branch за OK: False зупиняє. Очисти Layout і клацни Regenerate. Має вийти: одне червоне повідомлення, і нічого не збудовано й не видалено. [screenshot]\n   4. Dresser — додаткова частина. У Regenerate перед Generate, якщо Dresser не valid, зроби Print String помаранчевим 'Town Generator: no Dresser set, so the streets are not dressed. Fix: pick the PCG Volume in Details > Links > Dresser.' і продовжуй. Мікрорайон будується з попередженням. У check_assets.py після налаштувань додай помічника, 3 рядки: `def stop(message):`; (4 пробіли) `unreal.EditorDialog.show_message('TechTools', message, unreal.AppMsgType.OK)`; (4) `raise RuntimeError(message)` (зупиняє скрипт із тим самим текстом у журналі).\n   5. Перед головним циклом додай `paths = lib.list_assets(FOLDER, recursive=True, include_folder=False)` і `if not paths: stop('No assets in ' + FOLDER + '. Fix: set FOLDER at the top of check_assets.py to a folder that exists, such as /TechTools/Kit.')`, а цикл нехай іде по paths. Постав FOLDER = '/TechTools/Nothing' і запусти. Має вийти: діалог із твоїм повідомленням.\n   6. Поверни FOLDER. Попроси тьютора оцінити обидва повідомлення трьома питаннями: чи називає воно інструмент, проблему і виправлення? Так стає зрозуміло, чому 'Error 3' нікому не допомагає. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Переробка повідомлень: тьютор показує п'ять поганих повідомлень (Accessed None trying to read property Layout; Error; Failed!; something went wrong in row 7; KeyError: 'kiosk'). Для кожного я пишу зрозумілу версію: інструмент, проблема, виправлення. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; review (by tutor or art director) = огляд; see-why-fix note = нотатка «бачу, чому, як виправити»; checklist = чек-лист; credits line = рядок авторства; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); default value = типове значення; File Explorer = Провідник; mesh = меш; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; material slot / node / pin = слот матеріалу / вузол / вхід; volume (PCG Volume, Post Process Volume) = об'єм; seed = зерно (налаштування Seed); keep-out zone / footprint test / grounding = зона-виняток / тест опори / посадка на ґрунт; kit / kit piece / part of one object = набір / деталь / частина; district / plot / plot plan = район / ділянка / план ділянки; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; hero shot = головний кадр (hero shot); proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}, {"title": {"en": "README.md: the manual", "uk": "README.md: посібник"}, "minutes": 40, "goals": [{"en": "Write a README in Markdown that a stranger can follow: what it is, requirements, install, quick start, tools, scripts, known limits and credits.", "uk": "Писати README у Markdown, яким може скористатися чужа людина: що це, вимоги, встановлення, швидкий старт, інструменти, скрипти, відомі обмеження і рядки авторства."}, {"en": "Take clean screenshots and show them with Markdown image lines.", "uk": "Робити чисті скриншоти і показувати їх рядками зображень Markdown."}, {"en": "Test the Quick start by following it word for word.", "uk": "Перевіряти Quick start, виконуючи його слово в слово."}], "doalong": [{"en": "Create README.md in IslandCourse/Plugins/TechTools and type eight headings, each starting with ##: What it is, Requirements, Install, Quick start, Tools, Scripts, Known limits, Credits. Under What it is write two sentences. You see the skeleton in the Markdown preview (VS Code: Ctrl+Shift+V).", "uk": "Створи README.md в IslandCourse/Plugins/TechTools і введи вісім заголовків, кожен із ##: What it is, Requirements, Install, Quick start, Tools, Scripts, Known limits, Credits. Під What it is напиши два речення. Має вийти: каркас у перегляді Markdown (VS Code: Ctrl+Shift+V)."}, {"en": "Under Requirements write Unreal Engine 5.8 and the plugins PCG, Python Editor Script Plugin and Editor Scripting Utilities. Under Install: copy the TechTools folder into your project's Plugins folder, open the project, tick TechTools in Edit > Plugins if it is not ticked, restart. You see two sections a stranger can follow.", "uk": "Під Requirements напиши Unreal Engine 5.8 і плагіни PCG, Python Editor Script Plugin та Editor Scripting Utilities. Під Install: скопіюй папку TechTools у папку Plugins свого проєкту, відкрий проєкт, познач TechTools в Edit > Plugins, якщо не позначено, перезапусти. Має вийти: два розділи, якими може скористатися чужа людина."}, {"en": "Take euw_panel.png (EUW_TechTools docked) with Win+Shift+S and save it in Plugins/TechTools/Docs. Under Tools add the line ![EUW_TechTools panel](Docs/euw_panel.png) (a path from the README's own folder). You see the picture in the preview.", "uk": "Зроби euw_panel.png (EUW_TechTools у закріпленій панелі) через Win+Shift+S і збережи в Plugins/TechTools/Docs. Під Tools додай рядок ![EUW_TechTools panel](Docs/euw_panel.png) — шлях від власної папки README. Має вийти: картинка в перегляді."}, {"en": "Under Tools write BP_TownGenerator's section: one sentence, a settings table with the columns | Setting | Unit | Range | Default | What it does |, and town_details.png. You see a table that matches the tooltips.", "uk": "Під Tools напиши розділ BP_TownGenerator: одне речення, таблиця налаштувань зі стовпцями | Setting | Unit | Range | Default | What it does | і town_details.png. Має вийти: таблиця, що збігається з підказками."}, {"en": "Write the Quick start as five numbered steps: place BP_TownGenerator at 0, 0, 0 over ground that covers 0 to 200 m (for example a Cube at 10000, 10000, -50, Scale 300, 300, 1); check Layout and Rules; click Regenerate.", "uk": "Напиши Quick start як п'ять пронумерованих кроків: постав BP_TownGenerator у 0, 0, 0 над ґрунтом, що покриває 0–200 м (наприклад, Cube у 10000, 10000, -50, Scale 300, 300, 1); перевір Layout і Rules; клацни Regenerate."}, {"en": "Then place a PCG Volume with PCG_StreetDresser over the quarter (Location 10000, 10000, 0; Scale 100, 100, 30), override its Kerb Offset to 0, 500, 12.5 and pick it as Dresser; click Check Town. You see the shortest path from install to a quarter.", "uk": "Далі постав над мікрорайоном PCG Volume з PCG_StreetDresser (Location 10000, 10000, 0; Scale 100, 100, 30), перевизнач його Kerb Offset на 0, 500, 12.5 і вибери його як Dresser; клацни Check Town. Має вийти: найкоротший шлях від встановлення до мікрорайону."}], "play": {"en": "Stranger test: the tutor plays someone who has never seen my tools and follows my Quick start out loud, step by step, stopping at every word that is unclear. I fix each unclear line.", "uk": "Тест на чужій людині: тьютор грає когось, хто ніколи не бачив моїх інструментів, і вголос крок за кроком виконує мій Quick start, зупиняючись на кожному незрозумілому слові. Я виправляю кожен незрозумілий рядок."}, "video": {"search": "how to write a good readme markdown images tables"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: README.md: посібник (Day 98, lesson 4 of 4). Today's build: Перевірка якості TechTools: типові значення, підказки й перевірки введення на BP_TownGenerator, BP_Road, BP_PerfFlight і чотирьох скриптах, плюс Plugins/TechTools/README.md зі скриншотами в Plugins/TechTools/Docs.\nWhat I already know: День 97: плагін TechTools, EUW_TechTools і TechToolsTest; День 89: Regenerate, Clear і налаштування BP_TownGenerator; Дні 73, 74 і 92: place_from_csv.py, check_assets.py і perf_report.py; День 72: unreal.EditorDialog.show_message; Дні 61 і 75: підказки, Value Ranges і tool-review-checklist.md.\nEarlier today I already did: lesson 1 (Типові значення, що працюють одразу); lesson 2 (Підказки й категорії всюди); lesson 3 (Перевірки введення зі зрозумілими помилками). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Писати README у Markdown, яким може скористатися чужа людина: що це, вимоги, встановлення, швидкий старт, інструменти, скрипти, відомі обмеження і рядки авторства.\n2. Робити чисті скриншоти і показувати їх рядками зображень Markdown.\n3. Перевіряти Quick start, виконуючи його слово в слово.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: 2 lines on why today matters and where it comes back, in plain words (from this: Інструмент вартий рівно стільки, скільки дає людині, яка користується ним без тебе. Безпечні типові значення змушують його працювати одразу після встановлення. Підказки відповідають на питання раніше, ніж їх поставлять. Зрозуміла помилка перетворює тихий збій на двохвилинне виправлення. README дає чужій людині встановити інструмент і працювати з ним. Студії оцінюють авторів інструментів саме за цим, бо заплутаний інструмент забирає час у всіх. It comes back: README.md стане посібником, який ти доробиш для демо в День 109. На ці перевірки введення спираються завтрашній огляд (День 99) і п'ятничний тест чистої кімнати (День 100).); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-98-tool-quality-readme exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (Типові значення, підказки й перевірки введення для BP_TownGenerator і check_assets.py та перші розділи README (робиш на уроках)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Створи README.md в IslandCourse/Plugins/TechTools і введи вісім заголовків, кожен із ##: What it is, Requirements, Install, Quick start, Tools, Scripts, Known limits, Credits. Під What it is напиши два речення. Має вийти: каркас у перегляді Markdown (VS Code: Ctrl+Shift+V).\n   2. Під Requirements напиши Unreal Engine 5.8 і плагіни PCG, Python Editor Script Plugin та Editor Scripting Utilities. Під Install: скопіюй папку TechTools у папку Plugins свого проєкту, відкрий проєкт, познач TechTools в Edit > Plugins, якщо не позначено, перезапусти. Має вийти: два розділи, якими може скористатися чужа людина.\n   3. Зроби euw_panel.png (EUW_TechTools у закріпленій панелі) через Win+Shift+S і збережи в Plugins/TechTools/Docs. Під Tools додай рядок ![EUW_TechTools panel](Docs/euw_panel.png) — шлях від власної папки README. Має вийти: картинка в перегляді. [screenshot]\n   4. Під Tools напиши розділ BP_TownGenerator: одне речення, таблиця налаштувань зі стовпцями | Setting | Unit | Range | Default | What it does | і town_details.png. Має вийти: таблиця, що збігається з підказками.\n   5. Напиши Quick start як п'ять пронумерованих кроків: постав BP_TownGenerator у 0, 0, 0 над ґрунтом, що покриває 0–200 м (наприклад, Cube у 10000, 10000, -50, Scale 300, 300, 1); перевір Layout і Rules; клацни Regenerate.\n   6. Далі постав над мікрорайоном PCG Volume з PCG_StreetDresser (Location 10000, 10000, 0; Scale 100, 100, 30), перевизнач його Kerb Offset на 0, 500, 12.5 і вибери його як Dresser; клацни Check Town. Має вийти: найкоротший шлях від встановлення до мікрорайону. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Тест на чужій людині: тьютор грає когось, хто ніколи не бачив моїх інструментів, і вголос крок за кроком виконує мій Quick start, зупиняючись на кожному незрозумілому слові. Я виправляю кожен незрозумілий рядок. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; rubric = таблиця оцінювання; review (by tutor or art director) = огляд; checklist = чек-лист; credits line = рядок авторства; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); default value = типове значення; File Explorer = Провідник; mesh = меш; vertex / edge / face = вершина / ребро / грань; look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; material slot / node / pin = слот матеріалу / вузол / вхід; volume (PCG Volume, Post Process Volume) = об'єм; seed = зерно (налаштування Seed); keep-out zone / footprint test / grounding = зона-виняток / тест опори / посадка на ґрунт; kit / kit piece / part of one object = набір / деталь / частина; map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; district / plot / plot plan = район / ділянка / план ділянки; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}], "handin": [{"en": "summary.md", "uk": "summary.md (звіт дня)"}, {"en": "test_messages.md (each broken input, its message and the three yes or no answers) (proof)", "uk": "test_messages.md (кожен зламаний вхід, його повідомлення і три відповіді «так» чи «ні») (доказ)"}, {"en": "README.md and the six Docs screenshots (copies from Plugins/TechTools; the reviewer cannot open your private repository) (→ Day 109)", "uk": "README.md і шість скриншотів із Docs (копії з Plugins/TechTools; рецензент не може відкрити твій приватний репозиторій) (→ День 109)"}], "goal": {"en": "By the end of today you have TechTools tools that work the moment they are placed: safe defaults, a tooltip on every setting and button, input checks that stop with a readable message saying what is wrong and how to fix it, and README.md, a manual with screenshots inside the plugin.", "uk": "До кінця дня інструменти TechTools працюють одразу, щойно їх поставлено. У них безпечні типові значення, підказка на кожному налаштуванні й кнопці і перевірки введення, які зупиняються зі зрозумілим повідомленням: що не так і як виправити. А ще README.md — посібник зі скриншотами всередині плагіна."}, "uses": [{"en": "Day 97: the TechTools plugin, EUW_TechTools and TechToolsTest", "uk": "День 97: плагін TechTools, EUW_TechTools і TechToolsTest"}, {"en": "Day 89: BP_TownGenerator's Regenerate, Clear and settings", "uk": "День 89: Regenerate, Clear і налаштування BP_TownGenerator"}, {"en": "Days 73, 74 and 92: place_from_csv.py, check_assets.py and perf_report.py", "uk": "Дні 73, 74 і 92: place_from_csv.py, check_assets.py і perf_report.py"}, {"en": "Day 72: unreal.EditorDialog.show_message", "uk": "День 72: unreal.EditorDialog.show_message"}, {"en": "Days 61 and 75: tooltips, Value Ranges and tool-review-checklist.md", "uk": "Дні 61 і 75: підказки, Value Ranges і tool-review-checklist.md"}], "quiz": [{"q": {"en": "What makes a default safe?", "uk": "Що робить типове значення безпечним?"}, "options": [{"en": "The tool does something sensible the moment it is placed, using assets inside the plugin", "uk": "Інструмент робить щось осмислене, щойно його поставлено, і використовує асети всередині плагіна"}, {"en": "It is always 0", "uk": "Воно завжди 0"}, {"en": "It points at your island's assets", "uk": "Воно вказує на асети твого острова"}, {"en": "It is hidden from Details", "uk": "Воно сховане в Details"}], "answer": 0, "explain": {"en": "A new user's first click should give a result; defaults inside the plugin also work in a fresh project.", "uk": "Перше клацання нового користувача має давати результат. Типові значення всередині плагіна працюють і в новому проєкті."}}, {"q": {"en": "A user clicks Regenerate with no Layout and sees 'Accessed None trying to read property Layout'. What should your tool do instead?", "uk": "Користувач клацає Regenerate без Layout і бачить 'Accessed None trying to read property Layout'. Що має робити твій інструмент натомість?"}, "options": [{"en": "Crash, so they notice", "uk": "Впасти, щоб користувач помітив"}, {"en": "Stop before any work and print 'Town Generator: no Layout set. Fix: pick a DA_RoadLayout in Details > Town > Layout.'", "uk": "Зупинитися до будь-якої роботи і надрукувати 'Town Generator: no Layout set. Fix: pick a DA_RoadLayout in Details > Town > Layout.'"}, {"en": "Build an empty quarter", "uk": "Збудувати порожній мікрорайон"}, {"en": "Pick a random layout", "uk": "Вибрати випадкову розкладку"}], "answer": 1, "explain": {"en": "Checking inputs first turns a confusing engine error into a message that names the tool, the problem and the fix.", "uk": "Якщо спершу перевірити входи, заплутана помилка рушія стає повідомленням, яке називає інструмент, проблему і виправлення."}}, {"q": {"en": "Why is a missing Dresser a warning and not a stop?", "uk": "Чому відсутній Dresser — це попередження, а не зупинка?"}, "options": [{"en": "Warnings are faster to print", "uk": "Попередження друкуються швидше"}, {"en": "Dressers are never needed", "uk": "Dresser ніколи не потрібен"}, {"en": "The quarter can still be built without dressing, so the user gets a result and a clear note", "uk": "Мікрорайон можна збудувати і без дрібниць, тож користувач отримує результат і зрозумілу примітку"}, {"en": "Format Text cannot stop a function", "uk": "Format Text не може зупинити функцію"}], "answer": 2, "explain": {"en": "Stop only for what the tool cannot work without; for extras, do the work and say what was skipped.", "uk": "Зупиняйся лише тоді, коли інструмент без чогось не може працювати. Для додаткових частин зроби роботу і скажи, що пропущено."}}, {"q": {"en": "What does stop(message) do in your scripts?", "uk": "Що робить stop(message) у твоїх скриптах?"}, "options": [{"en": "Deletes the last report", "uk": "Видаляє останній звіт"}, {"en": "Pauses the script for a second", "uk": "Ставить скрипт на паузу на секунду"}, {"en": "Saves the level", "uk": "Зберігає рівень"}, {"en": "Shows the message in a dialog and stops the script with the same text in the log", "uk": "Показує повідомлення в діалозі й зупиняє скрипт із тим самим текстом у журналі"}], "answer": 3, "explain": {"en": "A panel user sees the dialog; someone running the script sees the text in the Output Log.", "uk": "Хто працює з панеллю, бачить діалог, а хто запускає скрипт — текст в Output Log."}}, {"q": {"en": "Your README's images show on your PC but not on GitHub. What is the likely cause?", "uk": "Зображення в README видно на твоєму ПК, але не на GitHub. Яка причина найімовірніша?"}, "options": [{"en": "GitHub hides images in private repositories", "uk": "GitHub ховає зображення в приватних репозиторіях"}, {"en": "The image lines use full C:/ paths instead of paths from the README's folder, such as Docs/euw_panel.png, or Docs was not committed", "uk": "Рядки зображень мають повні шляхи C:/ замість шляхів від папки README, як-от Docs/euw_panel.png, або Docs не закомічено"}, {"en": "PNG files cannot be shown in Markdown", "uk": "Markdown не показує файли PNG"}, {"en": "Markdown needs HTML for images", "uk": "Для зображень Markdown потрібен HTML"}], "answer": 1, "explain": {"en": "Paths relative to the README work everywhere the folder goes, including GitHub and other people's PCs.", "uk": "Шляхи від папки README працюють усюди, куди потрапляє папка, зокрема на GitHub і на чужих ПК."}}], "weekInfo": null, "morning": {"sofar": {"en": "TechTools is a plugin now: your tools, data, kit and scripts in one box that installs into a fresh project, kept in Git.", "uk": "TechTools тепер плагін: твої інструменти, дані, набір і скрипти в одній коробці, яка встановлюється в новий проєкт і зберігається в Git."}, "today": {"en": "You make it safe and pleasant for anyone: defaults that work, tooltips that answer, errors that explain, and a README with pictures.", "uk": "Ти робиш його безпечним і приємним для будь-кого: типові значення, що працюють, підказки, що відповідають, помилки, що пояснюють, і README з картинками."}, "cheer": {"en": "This is the work that turns a clever tool into one people choose to use; be kind to your future users, one of whom is you in six months.", "uk": "Саме ця робота перетворює хитрий інструмент на такий, яким люди хочуть користуватися. Подбай про майбутніх користувачів — серед них і ти через пів року."}, "quote": {"text": {"en": "Programs must be written for people to read, and only incidentally for machines to execute.", "uk": "Програми треба писати для того, щоб їх читали люди, і лише принагідно — щоб їх виконували машини."}, "author": {"en": "Harold Abelson and Gerald Jay Sussman", "uk": "Гарольд Абельсон і Джеральд Джей Сассман"}, "source": "Structure and Interpretation of Computer Programs (book), preface to the first edition, 1985"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-98-tool-quality-readme", "mapHref": "../../COURSE.html", "prevHref": "../Day-97-content-plugin-techtools/START-HERE.html", "nextHref": "../Day-99-self-code-review-refactor/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8, Python, and a Markdown editor (VS Code or Notepad). I am a beginner on Day 98. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me: when my Blueprint or script fails, ask for the error message or a screenshot of the graph, point to the line or node that is wrong and explain why, then let me fix it myself. Never write the whole tool for me.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: Ті самі перевірки для інших інструментів і скриптів і готовий README — самостійно.\nIt's part of: Перевірка якості TechTools: типові значення, підказки й перевірки введення на BP_TownGenerator, BP_Road, BP_PerfFlight і чотирьох скриптах, плюс Plugins/TechTools/README.md зі скриншотами в Plugins/TechTools/Docs (Плагін TechTools; README.md і папка Docs в IslandCourse/Plugins/TechTools; тести — у Content/Tools/Day98/L_Day98 і в TechToolsTest.).\nWhy it matters: Інструмент вартий рівно стільки, скільки дає людині, яка користується ним без тебе. Безпечні типові значення змушують його працювати одразу після встановлення. Підказки відповідають на питання раніше, ніж їх поставлять. Зрозуміла помилка перетворює тихий збій на двохвилинне виправлення. README дає чужій людині встановити інструмент і працювати з ним. Студії оцінюють авторів інструментів саме за цим, бо заплутаний інструмент забирає час у всіх. It comes back: README.md стане посібником, який ти доробиш для демо в День 109. На ці перевірки введення спираються завтрашній огляд (День 99) і п'ятничний тест чистої кімнати (День 100).\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-98-tool-quality-readme (on the drive I chose on Day 0).\nWhat I already know: День 97: плагін TechTools, EUW_TechTools і TechToolsTest; День 89: Regenerate, Clear і налаштування BP_TownGenerator; Дні 73, 74 і 92: place_from_csv.py, check_assets.py і perf_report.py; День 72: unreal.EditorDialog.show_message; Дні 61 і 75: підказки, Value Ranges і tool-review-checklist.md; today's lessons: Типові значення, що працюють одразу; Підказки й категорії всюди; Перевірки введення зі зрозумілими помилками; README.md: посібник. Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- Типові значення: кожен інструмент робить щось осмислене, якщо його поставити без змін. У BP_TownGenerator Layout типово DA_RoadLayout, Rules — DA_TownRules_Harbour, Seed — 1 (діапазон 1–9999). У BP_Road Road Mesh — SM_RoadSection_10m. У BP_PerfFlight Start Delay — 3 (діапазон 0–10). Кожен типовий шлях асету починається з /TechTools/.\n- Підказки: кожна змінна Instance Editable має Description — що вона робить, одиниця і порада. Кожна подія Call In Editor має Description. Кожна кнопка EUW_TechTools має Tool Tip Text про те, що вона змінює. Налаштування згруповано в Categories (Town, Preview, Links).\n- Перевірки введення в Blueprint: функція Check Inputs на BP_TownGenerator повертає OK, лише коли задано Layout, у Roads X і Roads Y щонайменше по 2 записи і задано Rules. Інакше друкує червоне повідомлення виду 'Town Generator: <problem>. Fix: <what to do>.', зібране через Format Text. Якщо перевірка не пройдена, Regenerate зупиняється. Якщо немає Dresser, з'являється помаранчеве попередження, а збірка триває. BP_Road (Road Mesh) і BP_PerfFlight (Route) так само перевіряють свій головний вхід. BP_PerfFlight отримує Run On Play (Boolean, типово увімкнено, підказка 'Untick to fly by hand in this level'), який перевіряється першим в Event BeginPlay.\n- Перевірки введення в Python із помічником stop(message): діалог show_message, потім RuntimeError з тим самим текстом. Він є в check_assets.py (у FOLDER немає асетів), place_from_csv.py (немає файлу CSV; рядок із невідомим типом пропускається з повідомленням), perf_report.py і rename_by_rules.py (у FOLDER немає асетів). perf_report.py лишається чистим Python, тож його stop() лише викликає RuntimeError, без діалогу: немає захоплення; немає стовпця — тоді перелічує знайдені стовпці.\n- README.md з розділами What it is, Requirements (Unreal 5.8 і потрібні плагіни), Install, Quick start (п'ять кроків до згенерованого мікрорайону), Tools (розділ на кожен інструмент із таблицею налаштувань і скриншотом), Scripts (що кожен змінює і його пробний запуск), Known limits і Credits. Щонайменше шість скриншотів у Docs, кожен менший за 1 МБ.\n- test_messages.md: кожен навмисно зламаний вхід, повідомлення, яке з'явилося, і чи називає воно інструмент, проблему і виправлення. Усе закомічено й надіслано.\n\nMy checklist (the same numbers show on my course page):\n1. Перевір, чи є результати сьогоднішніх уроків: Check Inputs на BP_TownGenerator, помічник stop() у check_assets.py і перші розділи README.md. Чогось бракує? Пройди зараз кроки «Разом із тьютором» того уроку (близько 25 хвилин): самостійна робота спирається на них. Постав BP_TownGenerator у 0, 0, 0 у новому L_Day98 з плитою ґрунту Дня 87 і клацни Regenerate, нічого не змінюючи. Перевірка: повний мікрорайон будується з самих типових значень. (from lesson 1)\n2. Навмисно зламай BP_TownGenerator: очисти Layout і клацни Regenerate. Поверни його, дай копії DA_RoadLayout лише один запис у Roads X і клацни Regenerate з нею. Очисти Rules і клацни Regenerate. Перевірка: три червоні повідомлення, кожне називає проблему і виправлення, і нічого не збудовано й не видалено. (from lesson 3)\n3. Очисти Dresser і клацни Regenerate. Перевірка: мікрорайон будується, а помаранчеве попередження каже, що вулиці не заповнено дрібницями, і як задати Dresser. (from lesson 3)\n4. Самостійно: дай BP_Road (Road Mesh порожній) і BP_PerfFlight (Route порожній) таку саму перевірку. Додай Run On Play (Boolean, типово увімкнено) у BP_PerfFlight і Branch за ним одразу після Event BeginPlay. Перевірка: кожен друкує одне зрозуміле повідомлення і більше нічого не робить, а зі знятим Run On Play у Play можна літати вручну. (from lesson 3)\n5. Запусти check_assets.py з FOLDER = '/TechTools/Nothing', потім поверни як було. Перевірка: і діалог, і Output Log кажуть, що в цій папці немає асетів, і як це виправити. (from lesson 3)\n6. Самостійно: place_from_csv.py з неправильним шляхом CSV, потім з одним зайвим рядком типу kiosk; perf_report.py з порожнім CSV_FOLDER (повідомлення лише в Output Log: у чистому Python діалогу немає); rename_by_rules.py на порожній папці. Перевірка: чотири зрозумілі повідомлення. Рядок kiosk пропущено з повідомленням, а решта рядків поставлено одним скасуванням. (from lesson 3)\n7. Напиши test_messages.md у робочій папці дня: кожен зламаний вхід, повідомлення, яке з'явилося, і «так» чи «ні» для інструмента, проблеми й виправлення. Перевірка: щонайменше десять рядків, усі «так». (from lesson 3)\n8. Зроби скриншоти для README у Plugins/TechTools/Docs: euw_panel.png, town_details.png, quarter_120m.png, road_curve.png, dresser.png і report.png. Перевірка: шість файлів PNG, кожен менший за 1 МБ і читабельний. (from lesson 4)\n9. Допиши README.md: усі вісім розділів, таблиця налаштувань для кожного інструмента на Blueprint (склади її із сьогоднішніх підказок), скрипти з пробними запусками і шість зображень. Перевірка: перегляд Markdown показує кожне зображення і кожну таблицю. (from lesson 4)\n10. Знову скопіюй плагін у TechToolsTest і виконай свій Quick start слово в слово. Перевірка: п'ять кроків працюють точно як написано; виправ кожен крок, що не працює. (from lesson 4)\n11. Зроби коміт і надішли (git add -A; git commit -m 'Defaults, tooltips, input checks and README'; git push), потім відкрий Plugins/TechTools на GitHub. Скопіюй README.md і шість картинок із Docs у робочу папку дня: рецензент не може відкрити твій приватний репозиторій. Перевірка: GitHub показує README.md із зображеннями, а копії лежать у робочій папці дня. (from day 96, lesson 4)\n12. Клацни «Копіювати звіт дня», встав у новий чат із тьютором, дай відповіді на його питання і збережи його відповідь як summary.md у робочій папці дня. Перетягни summary.md, test_messages.md, README.md і шість картинок у папку здачі (кнопка на цій сторінці). Папку проєкту чи рівня Unreal здавати не треба: вона дуже велика. Перевірка: у папці здачі 9 файлів, кожен більший за 1 КБ. (from lesson 1)\n\nHow to help: ask which step number I'm on, then give me only the next step: the exact clicks and what I should see. When I send a screenshot, compare it with my reference, my sizes and the spec, and name one thing to fix at a time.\nCheck every save and export by reopening it before we move on:\n- a Blueprint or script: compile or run it once more and see it work, with no errors\n- a .md or .txt: open it with Notepad; the text is there, and the name doesn't end in .md.txt\nWhen I write \"готово\", and in any case before the day ends, check with me one item at a time (yes/no): each spec point, then each file on my hand-in list, ready in my day work folder (skip summary.md: the day report writes it next):\n1. test_messages.md (кожен зламаний вхід, його повідомлення і три відповіді «так» чи «ні») (доказ)\n2. README.md і шість скриншотів із Docs (копії з Plugins/TechTools; рецензент не може відкрити твій приватний репозиторій) (→ День 109)\nFinish with a short list of anything missing, and one line on where this work comes back and what it will look like there. Then tell me the order for the end of the day: first the day report (the Copy the day report button at the bottom of my course page) into summary.md, and only then hand in all the files on the list, summary.md too.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a valu t reference photo. Then, one at a time, my sizes and my step number.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender.", "reportPrompt": "Help me write today's report for summary.md. I write it before I hand in. Talk to me in simple Ukrainian, and never use gendered forms about me. Keep the English labels below exactly; the text after each label may be Ukrainian.\nAsk me one thing at a time, and skip whatever I've already pasted below:\n1. My lesson summaries («Засвоєно» / «Було важко»), or which lessons I skipped.\n2. My first score in the page's \"Check yourself\" quiz.\n3. How far the build got: done, partly or blocked (if blocked, where).\n4. My hand-in list, one item at a time (skip summary.md): is the file ready in my day work folder (GAD\\Day-98-tool-quality-readme)? (yes/no)\n   - test_messages.md (кожен зламаний вхід, його повідомлення і три відповіді «так» чи «ні») (доказ)\n   - README.md і шість скриншотів із Docs (копії з Plugins/TechTools; рецензент не може відкрити твій приватний репозиторій) (→ День 109)\n5. One question for Thalia (about any day; start with the day number), or \"none\".\n6. Whether I fixed an earlier day today (which day and what), or \"no\".\n7. About how many hours today took.\nThen give me the finished report in one block I can copy:\n\nTeam summary, <date>, Misha\nDay 98: Tool quality: safe defaults, tooltips, readable errors and a README. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nReady to hand in: <tick each item of today's list: ✓ name, or ✗ name and why it isn't ready>\nMissing: <files not ready, or \"none\">\nFixed: <Day N: what I fixed (the fixed files are in that day's hand-in folder function vid(v){if(!v)return '';const link=v.url?'<a href="'+esc(v.url)+'" target="_blank" rel="noopener">'+esc(x(v.title)||v.url)+'</a>'+(v.channel?' <span class="muted">· '+esc(v.channel)+(v.length?' · '+esc(v.length):'')+'</span>':''):'';const s=v.search?'<a href="https://www.youtube.com/results?search_query='+encodeURIComponent(v.search)+'" target="_blank" rel="noopener">'+u('noVid')+': '+esc(v.search)+'</a>':'';const alt=v.alt&&v.alt.url?'<br><span class="eyebrow">UA</span> <a href="'+esc(v.alt.url)+'" target="_blank" rel="noopener">'+esc(v.alt.title||v.alt.url)+'</a>'+(v.alt.channel?' <span class="muted">· '+esc(v.alt.channel)+'</span>':''):'';return '<div class="vid well">'+kn('play')+'<div><b>'+u('more')+'?</b><br>'+(link||s)+alt+(link&&s?'<br><span class="muted" style="font-size:14px">'+s+'</span>':'')+'</div></div>'}
function morning(){const m=D.morning;if(!m)return '';const q=m.quote||{};
 let shelf='';if(D.day>0){shelf='<div class="shelf" aria-hidden="true">';let g='';for(let d=0;d<D.day;d++){let p=0;try{p=(JSON.parse(localStorage.getItem('devteam:'+D.learner+':'+d))||{}).pct||0}catch(e){}g+='<i class="'+(p>=1?'d':'')+(d>0&&d%5===0?' bs':'')+'"></i>';if(d%5===0||d===D.day-1){shelf+='<span class="wkg">'+g+'</span>';g=''}}shelf+='</div>'}
 const qt=lang==='uk'&&q.original?q.original:x(q.text);
 return '<section class="card glass morning"><div class="mgrid">'+(m.sofar?'<div>'+lab(u('sofar'),'gold')+shelf+'<p class="mtxt">'+lk(x(m.sofar))+'</p></div>':'')+(m.today?'<div>'+lab(u('todayL'))+'<p class="mtxt">'+lk(x(m.today))+'</p></div>':'')+'</div>'+(m.cheer?'<p class="cheer">'+esc(x(m.cheer))+'</p>':'')+(qt?'<figure class="quote well">'+kn('quote')+'<blockquote>'+esc(qt)+'</blockquote>'+(q.author?'<figcaption>'+esc(x(q.author))+'</figcaption>':'')+'</figure>':'')+'</section>'}
function setLang(l){lang=l;try{localStorage.setItem('devteam:lang',lang)}catch(e){};render()}
function toggleLang(){setLang(lang==='uk'?'en':'uk')}
/* keep open sections and keyboard focus across re-renders */
const openD=new Set();
function tg(e){if(e.open)openD.add(e.id);else openD.delete(e.id)}
const op=id=>openD.has(id)?' open':'';
function render(){const ae=document.activeElement,fid=ae&&(ae.id||(ae.getAttribute('data-th')?'th-'+ae.getAttribute('data-th'):ae.getAttribute('lang')&&ae.closest('.seg')?'lg-'+ae.getAttribute('lang'):''));
 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);
 const b=D.build,P=Math.round(prog()*100);
 document.getElementById('top').innerHTML='<div class="topin glass"><a class="maplink" href="'+esc(D.mapHref)+'">'+kn('map')+u('map')+'</a><div class="crumb"><b>'+esc(x(D.learnerName))+'</b><span>'+u('week')+' '+D.week+'</span><span>'+u('day')+' '+D.day+' '+u('of')+' '+D.total+'</span></div>'+controls(lang,'setLang')+'</div><div class="tline"><i style="width:'+P+'%"></i></div>';
 const state=w=>w<D.week?'b':w===D.week?'n':'p';
 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 let wk='';if(D.weekInfo){const w=D.weekInfo;wk='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}
 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p>'+(b.next?'<div class="back well">'+kn('arrow')+'<div><b>'+u('comes')+'</b><br>'+lk(x(b.next))+'</div></div>':'')+'<div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.assetFiles&&D.assetFiles.length?'<p class="files">'+ic('folder')+'<span>'+u('filesL')+' '+D.assetFiles.map(f=>'<a href="assets/'+encodeURIComponent(f)+'" target="_blank" rel="noopener">'+esc(f)+'</a>').join(', ')+'</span></p>':D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+=handinCard();h+=beforeCard();
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div><label class="rcpt" for="r'+i+'"><span class="eyebrow">'+u('rcpt')+'</span><textarea id="r'+i+'" rows="2" placeholder="'+esc(u('rcptPh'))+'" oninput="st.r'+i+'=this.value;save()">'+esc(st['r'+i]||'')+'</textarea></label>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+hList()+chkList()+(hasClip?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<h3>1 · '+u('copyR')+'</h3><p class="muted">'+u('report')+'</p><div class="row"><button class="btn ghost" onclick="cp(reportText())">'+ic('copy')+u('copyR')+'</button></div><h3>2 · '+u('ship')+'</h3>'+hf()+'<p class="muted" style="margin:12px 0 0">'+u('hNote')+'</p></section>';
 h+=qCard();h+=wk;
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();
</script>

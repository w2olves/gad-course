<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 98</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

#toast{position:fixed;left:50%;bottom:28px;z-index:9;transform:translateX(-50%) translateY(16px);background:rgba(30,33,46,.82);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:#f4f5fa;border:1px solid rgba(255,255,255,.14);padding:13px 24px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none;font:600 14px/1.4 var(--head);max-width:min(92vw,560px);text-align:center;box-shadow:0 20px 40px -14px rgba(0,0,0,.5),0 0 24px var(--glow)}

<script id="data" type="application/json">{"learner": "ib-misha-873821eb", "learnerName": {"en": "Misha", "uk": "Міша"}, "day": 98, "week": 20, "total": 110, "title": {"en": "Tool quality: safe defaults, tooltips, readable errors and a README", "uk": "Якість інструментів: безпечні типові значення, підказки, зрозумілі помилки і README"}, "theme": {"en": "Week 20: Git, packaging and tool quality", "uk": "Тиждень 20: Git, пакування та якість інструментів"}, "build": {"item": {"en": "A quality pass on TechTools: defaults, tooltips and input checks on BP_TownGenerator, BP_Road, BP_PerfFlight and four scripts, plus Plugins/TechTools/README.md with screenshots in Plugins/TechTools/Docs", "uk": "Перевірка якості TechTools: типові значення, підказки й перевірки введення на BP_TownGenerator, BP_Road, BP_PerfFlight і чотирьох скриптах, плюс Plugins/TechTools/README.md зі скриншотами в Plugins/TechTools/Docs"}, "why": {"en": "A tool is only as good as the moment someone uses it without you. Safe defaults make it work when dropped in; tooltips answer questions before they are asked; a readable error turns a silent failure into a two-minute fix; a README lets a stranger install and use it. Studios judge tool makers on exactly this, because a confusing tool costs everyone time.", "uk": "Інструмент вартий рівно стільки, скільки дає людині, яка користується ним без тебе. Безпечні типові значення змушують його працювати одразу після встановлення. Підказки відповідають на питання раніше, ніж їх поставлять. Зрозуміла помилка перетворює тихий збій на двохвилинне виправлення. README дає чужій людині встановити інструмент і працювати з ним. Студії оцінюють авторів інструментів саме за цим, бо заплутаний інструмент забирає час у всіх."}, "where": {"en": "The TechTools plugin; README.md and the Docs folder in IslandCourse/Plugins/TechTools; tests in Content/Tools/Day98/L_Day98 and in TechToolsTest.", "uk": "Плагін TechTools; README.md і папка Docs в IslandCourse/Plugins/TechTools; тести — у Content/Tools/Day98/L_Day98 і в TechToolsTest."}, "spec": [{"en": "Defaults: every tool does something sensible when placed with no changes. BP_TownGenerator's Layout defaults to DA_RoadLayout, Rules to DA_TownRules_Harbour and Seed to 1 (range 1 to 9999); BP_Road's Road Mesh to SM_RoadSection_10m; BP_PerfFlight's Start Delay to 3 (range 0 to 10); every default asset path starts with /TechTools/.", "uk": "Типові значення: кожен інструмент робить щось осмислене, якщо його поставити без змін. У BP_TownGenerator Layout типово DA_RoadLayout, Rules — DA_TownRules_Harbour, Seed — 1 (діапазон 1–9999). У BP_Road Road Mesh — SM_RoadSection_10m. У BP_PerfFlight Start Delay — 3 (діапазон 0–10). Кожен типовий шлях асету починається з /TechTools/."}, {"en": "Tooltips: every Instance Editable variable has a Description with what it does, its unit and a hint; every Call In Editor event has a Description; every EUW_TechTools button has a Tool Tip Text saying what it changes; settings grouped in Categories (Town, Preview, Links).", "uk": "Підказки: кожна змінна Instance Editable має Description — що вона робить, одиниця і порада. Кожна подія Call In Editor має Description. Кожна кнопка EUW_TechTools має Tool Tip Text про те, що вона змінює. Налаштування згруповано в Categories (Town, Preview, Links)."}, {"en": "Blueprint input checks: a function Check Inputs on BP_TownGenerator that returns OK only when Layout is set, Roads X and Roads Y each have at least 2 entries and Rules is set, and otherwise prints a red message of the form 'Town Generator: <problem>. Fix: <what to do>.' built with Format Text; Regenerate stops when the check fails; a missing Dresser gives an orange warning and the build carries on. BP_Road (Road Mesh) and BP_PerfFlight (Route) check their key input the same way, and BP_PerfFlight gains Run On Play (Boolean, default on, tooltip 'Untick to fly by hand in this level'), checked first in Event BeginPlay.", "uk": "Перевірки введення в Blueprint: функція Check Inputs на BP_TownGenerator повертає OK, лише коли задано Layout, у Roads X і Roads Y щонайменше по 2 записи і задано Rules. Інакше друкує червоне повідомлення виду 'Town Generator: <problem>. Fix: <what to do>.', зібране через Format Text. Якщо перевірка не пройдена, Regenerate зупиняється. Якщо немає Dresser, з'являється помаранчеве попередження, а збірка триває. BP_Road (Road Mesh) і BP_PerfFlight (Route) так само перевіряють свій головний вхід. BP_PerfFlight отримує Run On Play (Boolean, типово увімкнено, підказка 'Untick to fly by hand in this level'), який перевіряється першим в Event BeginPlay."}, {"en": "Python input checks with a stop(message) helper (a show_message dialog, then a RuntimeError with the same text) in check_assets.py (no assets in FOLDER), place_from_csv.py (CSV file missing; an unknown type in a row is skipped with a message), perf_report.py (it stays plain Python, so its stop() only raises the RuntimeError, with no dialog: no capture; a missing column, listing the columns found) and rename_by_rules.py (no assets in FOLDER).", "uk": "Перевірки введення в Python із помічником stop(message): діалог show_message, потім RuntimeError з тим самим текстом. Він є в check_assets.py (у FOLDER немає асетів), place_from_csv.py (немає файлу CSV; рядок із невідомим типом пропускається з повідомленням), perf_report.py і rename_by_rules.py (у FOLDER немає асетів). perf_report.py лишається чистим Python, тож його stop() лише викликає RuntimeError, без діалогу: немає захоплення; немає стовпця — тоді перелічує знайдені стовпці."}, {"en": "README.md with the sections What it is, Requirements (Unreal 5.8 and the plugins it needs), Install, Quick start (five steps to a generated quarter), Tools (one section per tool with a settings table and a screenshot), Scripts (what each changes, and its dry run), Known limits and Credits; at least six screenshots in Docs, each under 1 MB.", "uk": "README.md з розділами What it is, Requirements (Unreal 5.8 і потрібні плагіни), Install, Quick start (п'ять кроків до згенерованого мікрорайону), Tools (розділ на кожен інструмент із таблицею налаштувань і скриншотом), Scripts (що кожен змінює і його пробний запуск), Known limits і Credits. Щонайменше шість скриншотів у Docs, кожен менший за 1 МБ."}, {"en": "test_messages.md: every input broken on purpose, the message seen, and whether it names the tool, the problem and the fix; everything committed and pushed.", "uk": "test_messages.md: кожен навмисно зламаний вхід, повідомлення, яке з'явилося, і чи називає воно інструмент, проблему і виправлення. Усе закомічено й надіслано."}], "piece1": "Defaults, tooltips and input checks for BP_TownGenerator and check_assets.py, and the README's first sections (built in the lessons)", "piece2": {"en": "The same checks for the other tools and scripts, and the finished README, on your own", "uk": "Ті самі перевірки для інших інструментів і скриптів і готовий README — самостійно"}, "steps": [{"text": {"en": "Check: the results of today's lessons are there (Check Inputs on BP_TownGenerator, the stop() helper in check_assets.py, and README.md's first sections). Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it. Place BP_TownGenerator at 0, 0, 0 in a new L_Day98 with the Day 87 ground slab and click Regenerate without changing anything. Check: a complete quarter builds from the defaults alone.", "uk": "Перевір, чи є результати сьогоднішніх уроків: Check Inputs на BP_TownGenerator, помічник stop() у check_assets.py і перші розділи README.md. Чогось бракує? Пройди зараз кроки «Разом із тьютором» того уроку (близько 25 хвилин): самостійна робота спирається на них. Постав BP_TownGenerator у 0, 0, 0 у новому L_Day98 з плитою ґрунту Дня 87 і клацни Regenerate, нічого не змінюючи. Перевірка: повний мікрорайон будується з самих типових значень."}, "lesson": 1}, {"text": {"en": "Break BP_TownGenerator on purpose: clear Layout and Regenerate; set it back, give a copy of DA_RoadLayout only one entry in Roads X and Regenerate with it; clear Rules and Regenerate. Check: three red messages, each naming the problem and the fix, and nothing built or deleted.", "uk": "Навмисно зламай BP_TownGenerator: очисти Layout і клацни Regenerate. Поверни його, дай копії DA_RoadLayout лише один запис у Roads X і клацни Regenerate з нею. Очисти Rules і клацни Regenerate. Перевірка: три червоні повідомлення, кожне називає проблему і виправлення, і нічого не збудовано й не видалено."}, "lesson": 3}, {"text": {"en": "Clear Dresser and Regenerate. Check: the quarter builds, with an orange warning saying the streets were not dressed and how to set Dresser.", "uk": "Очисти Dresser і клацни Regenerate. Перевірка: мікрорайон будується, а помаранчеве попередження каже, що вулиці не заповнено дрібницями, і як задати Dresser."}, "lesson": 3}, {"text": {"en": "On your own: give BP_Road (Road Mesh empty) and BP_PerfFlight (Route empty) the same kind of check. Add Run On Play (Boolean, default on) to BP_PerfFlight and Branch on it right after Event BeginPlay. Check: each prints one readable message and does nothing else, and with Run On Play unticked Play lets you fly by hand.", "uk": "Самостійно: дай BP_Road (Road Mesh порожній) і BP_PerfFlight (Route порожній) таку саму перевірку. Додай Run On Play (Boolean, типово увімкнено) у BP_PerfFlight і Branch за ним одразу після Event BeginPlay. Перевірка: кожен друкує одне зрозуміле повідомлення і більше нічого не робить, а зі знятим Run On Play у Play можна літати вручну."}, "lesson": 3}, {"text": {"en": "Run check_assets.py with FOLDER = '/TechTools/Nothing', then set it back. Check: a dialog and the Output Log both say there are no assets in that folder and how to fix it.", "uk": "Запусти check_assets.py з FOLDER = '/TechTools/Nothing', потім поверни як було. Перевірка: і діалог, і Output Log кажуть, що в цій папці немає асетів, і як це виправити."}, "lesson": 3}, {"text": {"en": "On your own: place_from_csv.py with a wrong CSV path, then with one extra row of type kiosk; perf_report.py with an empty CSV_FOLDER (its message shows in the Output Log only: no dialog in plain Python); rename_by_rules.py on an empty folder. Check: four readable messages; the kiosk row is skipped with a message while the other rows are still placed in one undo.", "uk": "Самостійно: place_from_csv.py з неправильним шляхом CSV, потім з одним зайвим рядком типу kiosk; perf_report.py з порожнім CSV_FOLDER (повідомлення лише в Output Log: у чистому Python діалогу немає); rename_by_rules.py на порожній папці. Перевірка: чотири зрозумілі повідомлення. Рядок kiosk пропущено з повідомленням, а решта рядків поставлено одним скасуванням."}, "lesson": 3}, {"text": {"en": "Write test_messages.md in today's Work folder: each broken input, the message you saw, and yes or no for tool, problem and fix. Check: at least ten rows, all yes.", "uk": "Напиши test_messages.md у робочій папці дня: кожен зламаний вхід, повідомлення, яке з'явилося, і «так» чи «ні» для інструмента, проблеми й виправлення. Перевірка: щонайменше десять рядків, усі «так»."}, "lesson": 3}, {"text": {"en": "Take the README screenshots into Plugins/TechTools/Docs: euw_panel.png, town_details.png, quarter_120m.png, road_curve.png, dresser.png and report.png. Check: six PNG files, each under 1 MB and readable.", "uk": "Зроби скриншоти для README у Plugins/TechTools/Docs: euw_panel.png, town_details.png, quarter_120m.png, road_curve.png, dresser.png і report.png. Перевірка: шість файлів PNG, кожен менший за 1 МБ і читабельний."}, "lesson": 4}, {"text": {"en": "Finish README.md: all eight sections, a settings table for each Blueprint tool (build them from today's tooltips), the scripts with their dry runs, and the six images. Check: the Markdown preview shows every image and every table.", "uk": "Допиши README.md: усі вісім розділів, таблиця налаштувань для кожного інструмента на Blueprint (склади її із сьогоднішніх підказок), скрипти з пробними запусками і шість зображень. Перевірка: перегляд Markdown показує кожне зображення і кожну таблицю."}, "lesson": 4}, {"text": {"en": "Copy the plugin into TechToolsTest again and follow your own Quick start word for word. Check: the five steps work exactly as written; fix any step that doesn't.", "uk": "Знову скопіюй плагін у TechToolsTest і виконай свій Quick start слово в слово. Перевірка: п'ять кроків працюють точно як написано; виправ кожен крок, що не працює."}, "lesson": 4}, {"text": {"en": "Commit and push (git add -A; git commit -m 'Defaults, tooltips, input checks and README'; git push), then open Plugins/TechTools on GitHub. Copy README.md and the Docs folder's six pictures into today's Work folder: the reviewer cannot open your private repository. Check: GitHub shows README.md with its images, and the copies are in today's Work folder.", "uk": "Зроби коміт і надішли (git add -A; git commit -m 'Defaults, tooltips, input checks and README'; git push), потім відкрий Plugins/TechTools на GitHub. Скопіюй README.md і шість картинок із Docs у робочу папку дня: рецензент не може відкрити твій приватний репозиторій. Перевірка: GitHub показує README.md із зображеннями, а копії лежать у робочій папці дня."}, "lesson": "D96.4"}, {"text": {"en": "Click Copy the day report, paste it into a new tutor chat, answer its questions and save its answer as summary.md in today's Work folder. Drag summary.md, test_messages.md, README.md and the six pictures into today's hand-in folder (the button on this page); no need to hand in the Unreal project or level folders (they're very big). Check: the hand-in folder lists 9 files, each over 1 KB.", "uk": "Клацни «Копіювати звіт дня», встав у новий чат із тьютором, дай відповіді на його питання і збережи його відповідь як summary.md у робочій папці дня. Перетягни summary.md, test_messages.md, README.md і шість картинок у папку здачі (кнопка на цій сторінці). Папку проєкту чи рівня Unreal здавати не треба: вона дуже велика. Перевірка: у папці здачі 9 файлів, кожен більший за 1 КБ."}, "lesson": 1}], "assets": ["techart/tool-review-checklist.md", "techart/code-style.md", "techart/standards-sheet.md"], "next": {"en": "README.md becomes the manual you finish for the demo on Day 109, and these input checks are what tomorrow's review (Day 99) and Friday's clean-room test (Day 100) lean on.", "uk": "README.md стане посібником, який ти доробиш для демо в День 109. На ці перевірки введення спираються завтрашній огляд (День 99) і п'ятничний тест чистої кімнати (День 100)."}}, "lessons": [{"title": {"en": "Defaults that work out of the box", "uk": "Типові значення, що працюють одразу"}, "minutes": 40, "goals": [{"en": "Explain a safe default: a value that makes a tool do something sensible the moment it is placed.", "uk": "Пояснювати, що таке безпечне типове значення: значення, з яким інструмент робить щось осмислене, щойно його поставлено."}, {"en": "Set defaults that point at assets inside the plugin, never at your island.", "uk": "Задавати типові значення, що вказують на асети всередині плагіна, а не на твій острів."}, {"en": "Use Value Ranges so no setting can be typed into nonsense.", "uk": "Користуватися Value Ranges, щоб у жодне налаштування не можна було ввести нісенітницю."}], "doalong": [{"en": "Make L_Day98 in Content/Tools/Day98 (File > New Level > Basic), delete the Floor and add the Day 87 ground slab (a Cube at 10000, 10000, -50, Scale 300, 300, 1). Place BP_TownGenerator at 0, 0, 0 and click Regenerate without changing anything. You see what a new user sees: if nothing builds, the defaults are not set.", "uk": "Створи L_Day98 у Content/Tools/Day98 (File > New Level > Basic), видали Floor і додай плиту ґрунту Дня 87 (Cube у 10000, 10000, -50, Scale 300, 300, 1). Постав BP_TownGenerator у 0, 0, 0 і клацни Regenerate, нічого не змінюючи. Так бачить новий користувач: якщо нічого не будується, типові значення не задано."}, {"en": "Open BP_TownGenerator, select Layout and set its Default Value to DA_RoadLayout; set Rules to DA_TownRules_Harbour and Seed to 1, with Slider and Value Range 1 to 9999. Compile and place a new copy. You see a quarter build at the first click.", "uk": "Відкрий BP_TownGenerator, вибери Layout і постав його Default Value на DA_RoadLayout. Rules постав на DA_TownRules_Harbour, Seed — на 1, зі Slider і Value Range 1–9999. Клацни Compile і постав нову копію. Має вийти: мікрорайон будується з першого клацання."}, {"en": "Open BP_Road: Road Mesh defaults to SM_RoadSection_10m, and Piece Length to 1000 with a Value Range of 200 to 5000. Open BP_PerfFlight: Start Delay 3, range 0 to 10. You see every number inside a safe range.", "uk": "Відкрий BP_Road: Road Mesh типово SM_RoadSection_10m, а Piece Length — 1000 з Value Range 200–5000. Відкрий BP_PerfFlight: Start Delay 3, діапазон 0–10. Має вийти: кожне число в безпечному діапазоні."}, {"en": "Hover over each default asset in Details to read its path. You see that every one starts with /TechTools/; anything starting with /Game/ would be missing in a fresh project.", "uk": "Наведи мишу на кожен типовий асет у Details і прочитай його шлях. Кожен має починатися з /TechTools/: усе, що починається з /Game/, у новому проєкті буде відсутнє."}], "play": {"en": "Default doctor: the tutor names five defaults (Count 0; Spacing 150 cm; Layout empty; Seed 0 with no range; Road Mesh pointing at /Game/Island/SM_Road). For each I say what goes wrong for a new user and the safe default I would set.", "uk": "Лікар типових значень: тьютор називає п'ять типових значень (Count 0; Spacing 150 см; Layout порожній; Seed 0 без діапазону; Road Mesh вказує на /Game/Island/SM_Road). Для кожного я кажу, що піде не так у нового користувача, і яке безпечне значення я поставлю."}, "video": {"search": "unreal engine blueprint variable default value value range instance editable"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Типові значення, що працюють одразу (Day 98, lesson 1 of 4). Today's build: Перевірка якості TechTools: типові значення, підказки й перевірки введення на BP_TownGenerator, BP_Road, BP_PerfFlight і чотирьох скриптах, плюс Plugins/TechTools/README.md зі скриншотами в Plugins/TechTools/Docs.\nWhat I already know: День 97: плагін TechTools, EUW_TechTools і TechToolsTest; День 89: Regenerate, Clear і налаштування BP_TownGenerator; Дні 73, 74 і 92: place_from_csv.py, check_assets.py і perf_report.py; День 72: unreal.EditorDialog.show_message; Дні 61 і 75: підказки, Value Ranges і tool-review-checklist.md.\n\nBy the end of this lesson I can:\n1. Пояснювати, що таке безпечне типове значення: значення, з яким інструмент робить щось осмислене, щойно його поставлено.\n2. Задавати типові значення, що вказують на асети всередині плагіна, а не на твій острів.\n3. Користуватися Value Ranges, щоб у жодне налаштування не можна було ввести нісенітницю.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: TechTools тепер плагін: твої інструменти, дані, набір і скрипти в одній коробці, яка встановлюється в новий проєкт і зберігається в Git. Today: Ти робиш його безпечним і приємним для будь-кого: типові значення, що працюють, підказки, що відповідають, помилки, що пояснюють, і README з картинками. One encouraging line: Саме ця робота перетворює хитрий інструмент на такий, яким люди хочуть користуватися. Подбай про майбутніх користувачів — серед них і ти через пів року.); 2 lines on why today matters and where it comes back, in plain words (from this: Інструмент вартий рівно стільки, скільки дає людині, яка користується ним без тебе. Безпечні типові значення змушують його працювати одразу після встановлення. Підказки відповідають на питання раніше, ніж їх поставлять. Зрозуміла помилка перетворює тихий збій на двохвилинне виправлення. README дає чужій людині встановити інструмент і працювати з ним. Студії оцінюють авторів інструментів саме за цим, бо заплутаний інструмент забирає час у всіх. It comes back: README.md стане посібником, який ти доробиш для демо в День 109. На ці перевірки введення спираються завтрашній огляд (День 99) і п'ятничний тест чистої кімнати (День 100).); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-98-tool-quality-readme exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (Типові значення, підказки й перевірки введення для BP_TownGenerator і check_assets.py та перші розділи README (робиш на уроках)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Створи L_Day98 у Content/Tools/Day98 (File > New Level > Basic), видали Floor і додай плиту ґрунту Дня 87 (Cube у 10000, 10000, -50, Scale 300, 300, 1). Постав BP_TownGenerator у 0, 0, 0 і клацни Regenerate, нічого не змінюючи. Так бачить новий користувач: якщо нічого не будується, типові значення не задано.\n   2. Відкрий BP_TownGenerator, вибери Layout і постав його Default Value на DA_RoadLayout. Rules постав на DA_TownRules_Harbour, Seed — на 1, зі Slider і Value Range 1–9999. Клацни Compile і постав нову копію. Має вийти: мікрорайон будується з першого клацання. [screenshot]\n   3. Відкрий BP_Road: Road Mesh типово SM_RoadSection_10m, а Piece Length — 1000 з Value Range 200–5000. Відкрий BP_PerfFlight: Start Delay 3, діапазон 0–10. Має вийти: кожне число в безпечному діапазоні.\n   4. Наведи мишу на кожен типовий асет у Details і прочитай його шлях. Кожен має починатися з /TechTools/: усе, що починається з /Game/, у новому проєкті буде відсутнє. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Лікар типових значень: тьютор називає п'ять типових значень (Count 0; Spacing 150 см; Layout порожній; Seed 0 без діапазону; Road Mesh вказує на /Game/Island/SM_Road). Для кожного я кажу, що піде не так у нового користувача, і яке безпечне значення я поставлю. Otherwise skip it.\n6. Review: ask me these questions from earlier days, one at a time, and correct me kindly: Day

<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 66</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

/* the Done switch */

details{margin-top:22px;border-radius:20px;background:var(--well);box-shadow:var(--press);padding:0 18px}

#toast{position:fixed;left:50%;bottom:28px;z-index:9;transform:translateX(-50%) translateY(16px);background:rgba(30,33,46,.82);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:#f4f5fa;border:1px solid rgba(255,255,255,.14);padding:13px 24px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none;font:600 14px/1.4 var(--head);max-width:min(92vw,560px);text-align:center;box-shadow:0 20px 40px -14px rgba(0,0,0,.5),0 0 24px var(--glow)}

<script id="data" type="application/json">{"learner": "ib-misha-873821eb", "learnerName": {"en": "Misha", "uk": "Міша"}, "day": 66, "week": 14, "total": 110, "title": {"en": "Data, not code: structs and Data Assets for building styles", "uk": "Дані, а не код: структури й Data Asset для стилів будівель"}, "theme": {"en": "Week 14: Generators driven by data", "uk": "Тиждень 14: Генератори, що керуються даними"}, "build": {"item": {"en": "PDA_BuildingStyle (the form), S_RoofSet (a struct), DA_Style_Harbour plus at least two more DA_Style_* (filled-in styles), and BP_StyleSample, a test stand that shows a style's pieces", "uk": "PDA_BuildingStyle (форма), S_RoofSet (структура), DA_Style_Harbour і щонайменше два інші DA_Style_* (заповнені стилі) та BP_StyleSample — тестовий стенд, що показує деталі стилю"}, "why": {"en": "A building tool should not need a new graph for every look. When the pieces and colours live in data assets, an artist makes a new style in two minutes by filling in a form, and the same tool builds a harbour house, an ochre town house or a stone warehouse. Studios separate data from code for exactly this reason: artists change data, programmers change tools, and neither waits for the other.", "uk": "Інструментові для будівель не потрібен новий граф для кожного вигляду. Коли деталі й кольори лежать в асетах даних, художник заповнює форму й за дві хвилини має новий стиль. Той самий інструмент будує портовий будинок, охристий міський будинок або кам'яний склад. Студії відокремлюють дані від коду саме тому: художники змінюють дані, програмісти — інструменти, і ніхто не чекає на іншого."}, "where": {"en": "Content/Tools/Data for the struct, the class and the styles; Content/Tools/Day66/L_Day66 for the test stands.", "uk": "Content/Tools/Data для структури, класу й стилів; Content/Tools/Day66/L_Day66 для випробувальних стендів."}, "spec": [{"en": "S_RoofSet (a Blueprint Structure) in Content/Tools/Data: Panel, Ridge and Gable (Static Mesh) and Offset (Vector), with your roof pieces and Offset 0, 0, 115 (the ridge height above the wall tops) as its defaults.", "uk": "S_RoofSet (Blueprint Structure) у Content/Tools/Data: Panel, Ridge і Gable (Static Mesh) та Offset (Vector). Типові значення: твої деталі даху й Offset 0, 0, 115 — висота гребеня над верхом стін."}, {"en": "PDA_BuildingStyle, a Blueprint Class whose parent is PrimaryDataAsset: Wall, Window, Door and Corner (Static Mesh, Category Pieces), Roof (S_RoofSet, Category Pieces), Wall Material (Material Instance, Category Look), Bay Width (Float, 200) and Floor Height (Float, 300) (Category Grid); every variable Instance Editable with a tooltip.", "uk": "PDA_BuildingStyle — Blueprint Class з батьківським класом PrimaryDataAsset. Category Pieces: Wall, Window, Door і Corner (Static Mesh) та Roof (S_RoofSet). Category Look: Wall Material (Material Instance). Category Grid: Bay Width (Float, 200) і Floor Height (Float, 300). Кожна змінна Instance Editable і з підказкою."}, {"en": "DA_Style_Harbour filled from your kit, and at least two more styles (for example DA_Style_Ochre and DA_Style_Stone), each with its own Wall Material: a child of MI_Plaster with another Tint from your palette.", "uk": "DA_Style_Harbour, заповнений з твого набору, і щонайменше два інші стилі, наприклад DA_Style_Ochre і DA_Style_Stone. Кожен має свій Wall Material: дочірній інстанс MI_Plaster з іншим Tint із твоєї палітри."}, {"en": "BP_StyleSample in Content/Tools/Blueprints: four Static Mesh components 2.5 m apart and a Style variable; its Construction Script runs Is Valid on Style, then sets the four meshes and the wall's material from the style.", "uk": "BP_StyleSample у Content/Tools/Blueprints: чотири компоненти Static Mesh через 2,5 м і змінна Style. Його Construction Script перевіряє Style вузлом Is Valid, а потім бере зі стилю чотири моделі й матеріал стіни."}, {"en": "An empty Style gives an empty stand and no Accessed None message.", "uk": "Порожній Style дає порожній стенд і жодного повідомлення Accessed None."}, {"en": "Three styles side by side on three stands, each made only by changing data, never the graph.", "uk": "Три стилі поруч на трьох стендах, кожен зроблено лише зміною даних, ніколи не графа."}], "piece1": "S_RoofSet, PDA_BuildingStyle, DA_Style_Harbour and BP_StyleSample (lessons)", "piece2": {"en": "Two more styles from your palette, and a style board, on your own", "uk": "Самостійно: ще два стилі з твоєї палітри та аркуш стилів"}, "steps": [{"text": {"en": "Check: the results of today's lessons are there (S_RoofSet, PDA_BuildingStyle, DA_Style_Harbour, DA_Style_Ochre and BP_StyleSample). Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it. Open S_RoofSet and PDA_BuildingStyle and check them against the spec: types, categories and tooltips. Compile and Save. Check: no warnings, and every variable of PDA_BuildingStyle shows an open eye (Instance Editable).", "uk": "Спершу переконайся, що результати сьогоднішніх уроків на місці: S_RoofSet, PDA_BuildingStyle, DA_Style_Harbour, DA_Style_Ochre і BP_StyleSample. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Відкрий S_RoofSet і PDA_BuildingStyle і звір із вимогами: типи, категорії й підказки. Клацни Compile і Save. Перевірка: жодних попереджень, а кожна змінна PDA_BuildingStyle має відкрите око (Instance Editable)."}, "lesson": 2}, {"text": {"en": "Open DA_Style_Harbour and fill every field from your kit. Check: no field says None, and Bay Width and Floor Height read 200 and 300 (or your kit's grid).", "uk": "Відкрий DA_Style_Harbour і заповни кожне поле з твого набору. Перевірка: жодне поле не показує None, а Bay Width і Floor Height дорівнюють 200 і 300 (або кроку сітки твого набору)."}, "lesson": 3}, {"text": {"en": "Make a second wall colour from your Day 16 palette: right-click MI_Plaster > Create Material Instance, name it MI_Plaster_Stone (or your own colour name) and set its Tint. Check: MI_Plaster_Ochre (from lesson 3) and MI_Plaster_Stone show their colours on their thumbnails.", "uk": "Зроби другий колір стіни з палітри Дня 16: клацни правою кнопкою на MI_Plaster > Create Material Instance, назви його MI_Plaster_Stone (або своєю назвою кольору) і задай Tint. Перевірка: мініатюри MI_Plaster_Ochre (з уроку 3) і MI_Plaster_Stone показують свої кольори."}, "lesson": 3}, {"text": {"en": "Duplicate DA_Style_Harbour once more, name the copy DA_Style_Stone and set its Wall Material to MI_Plaster_Stone (change window or door pieces too, if your kit has others). Check: DA_Style_Harbour, DA_Style_Ochre (from lesson 3) and DA_Style_Stone sit in Content/Tools/Data.", "uk": "Ще раз продублюй DA_Style_Harbour, назви копію DA_Style_Stone і встанови Wall Material на MI_Plaster_Stone. Якщо в наборі є інші вікна чи двері, зміни й їх. Перевірка: у Content/Tools/Data лежать DA_Style_Harbour, DA_Style_Ochre (з уроку 3) і DA_Style_Stone."}, "lesson": 3}, {"text": {"en": "Place three BP_StyleSample copies in L_Day66, one per style, in a row. Save the level (Ctrl+S), open any other level and open L_Day66 again. Check: the reopened level shows three stands, each with a wall, a window, a door and a corner in its own colour.", "uk": "Постав у L_Day66 три копії BP_StyleSample в ряд, по одній на стиль. Збережи рівень (Ctrl+S), відкрий будь-який інший рівень, а тоді знову L_Day66. Перевірка: у відкритому знову рівні три стенди, кожен зі стіною, вікном, дверима й кутом у своєму кольорі."}, "lesson": 4}, {"text": {"en": "Edge test: on one stand open the Style dropdown and choose Clear, then move the stand a little so it rebuilds. Check: that stand is empty and the Output Log shows no Accessed None message.", "uk": "Перевір крайній випадок: на одному стенді відкрий спадне меню Style і вибери Clear. Трохи посунь стенд, щоб він перебудувався. Перевірка: стенд порожній, а Output Log не показує Accessed None."}, "lesson": 4}, {"text": {"en": "Swap test: change one stand's Style through all three styles. Check: the stand switches look each time without any change to its graph.", "uk": "Перевір заміну: перемкни Style на одному стенді через усі три стилі. Перевірка: стенд щоразу змінює вигляд без жодної зміни в графі."}, "lesson": 4}, {"text": {"en": "Take styles_day66.png (the three stands from the front, readable in one picture). Check: the picture is in today's Work folder.", "uk": "Зроби скриншот styles_day66.png: три стенди спереду, усі добре видно на одному зображенні. Перевірка: зображення в робочій папці дня."}, "lesson": 2}, {"text": {"en": "Click Copy the day report, paste it into a new tutor chat, answer its questions and save its answer as summary.md in today's Work folder. Drag summary.md and styles_day66.png into today's hand-in folder (the button on this page); never a project or level folder. Check: the hand-in folder lists 2 files, each over 1 KB.", "uk": "Клацни «Копіювати звіт дня», встав текст у новий чат із тьютором, дай відповіді на його запитання й збережи відповідь як summary.md у робочій папці дня. Здай роботу: перетягни файли в сьогоднішню папку здачі (кнопка на цій сторінці): summary.md і styles_day66.png. Ніколи не здавай папку проєкту чи рівня. Перевірка: у папці здачі 2 файли, кожен більший за 1 КБ."}, "lesson": 4}], "assets": ["techart/code-style.md"], "next": {"en": "Your DA_Style_* assets dress every building from now on: BP_Building reads them tomorrow (Day 67), and Days 68 to 70 add a palette, a street mix and a whole block.", "uk": "Відтепер твої DA_Style_* оформлюють кожну будівлю. Завтра (День 67) їх читатиме BP_Building, а з Дня 68 до Дня 70 з'являться палітра, вулична суміш і цілий квартал."}}, "lessons": [{"title": {"en": "Data, not code: a struct", "uk": "Дані, а не код: структура"}, "minutes": 40, "goals": [{"en": "Explain why tools read their settings from data assets: one tool, many looks, and artists change data without touching the graph.", "uk": "Пояснювати, чому інструменти читають налаштування з асетів даних: один інструмент дає багато виглядів, а художники змінюють дані, не чіпаючи графа."}, {"en": "Explain a struct: a bundle of named fields of different types under one name, like a form with several boxes (a Vector is a struct of X, Y and Z).", "uk": "Пояснювати, що таке структура (struct): набір іменованих полів різних типів під однією назвою, як форма з кількома полями. Vector — це структура з X, Y і Z."}, {"en": "Create S_RoofSet with your roof pieces as its defaults.", "uk": "Створювати S_RoofSet із твоїми деталями даху як типовими значеннями."}], "doalong": [{"en": "In BP_BollardRow's Construction Script right-click an empty spot and add a new Make Transform (leave the one in your loop alone); right-click its Location pin and choose Split Struct Pin. You see Location X, Y and Z: a Vector is a small struct of three Floats. Delete the new node again; your tool is unchanged.", "uk": "У Construction Script BP_BollardRow додай на вільному місці новий Make Transform (той, що в циклі, не чіпай). Клацни правою кнопкою на його вході Location > Split Struct Pin. З'являються Location X, Y і Z: Vector — це маленька структура з трьох Float. Видали новий вузол: інструмент не змінився."}, {"en": "In Content/Tools/Data right-click > Blueprint > Structure (if it is not there, type Structure into the Add menu's search box). Name it S_RoofSet and open it. You see a struct editor with one field named MemberVar_0.", "uk": "У Content/Tools/Data клацни правою кнопкою > Blueprint > Structure. Якщо пункту немає, введи Structure у пошук меню Add. Назви асет S_RoofSet і відкрий. Відкривається редактор структури з одним полем MemberVar_0."}, {"en": "Rename that field Panel and set its type to Static Mesh (Object Reference). Click + Add Variable and make Ridge and Gable (Static Mesh), then Offset (Vector). Save. You see four fields.", "uk": "Перейменуй поле на Panel і встанови тип Static Mesh (Object Reference). Клацни + Add Variable і створи Ridge та Gable (Static Mesh), потім Offset (Vector). Збережи. Має вийти чотири поля."}, {"en": "Open the Default Values tab: set Panel to SM_Roof_2m, Ridge to SM_Roof_Ridge_2m and Gable to SM_Roof_Gable_4m; set Offset to 0, 0, 115, because your roof panels and ridge have their pivots on the ridge line, 1.15 m above the wall tops (Day 9). Save. You see your roof pieces and the offset as the struct's defaults.", "uk": "Відкрий вкладку Default Values. Встанови Panel на SM_Roof_2m, Ridge на SM_Roof_Ridge_2m, Gable на SM_Roof_Gable_4m, а Offset на 0, 0, 115. Origin панелей даху й гребеня лежить на лінії гребеня, на 1,15 м над верхом стін (День 9). Збережи. Твої деталі даху й зсув стали типовими значеннями структури."}], "play": {"en": "Struct or not: the tutor names six things (a door with width, height and mesh; one colour; a seed; a lamp with pole, head and light colour; a street name; a window with mesh and sill height). I say which make good structs and name their fields.", "uk": "Структура чи ні: тьютор називає шість речей. Двері з шириною, висотою й моделлю; один колір; зерно; ліхтар зі стовпом, головкою й кольором світла; назва вулиці; вікно з моделлю й висотою підвіконня. Я кажу, які з них — добрі структури, і називаю їхні поля."}, "video": {"search": "unreal engine 5 blueprint structure struct beginners"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Дані, а не код: структура (Day 66, lesson 1 of 4). Today's build: PDA_BuildingStyle (форма), S_RoofSet (структура), DA_Style_Harbour і щонайменше два інші DA_Style_* (заповнені стилі) та BP_StyleSample — тестовий стенд, що показує деталі стилю.\nWhat I already know: День 9: твій набір будівель (SM_Wall_2m, SM_Wall_Window, SM_Wall_Door, SM_Wall_Corner, SM_Roof_2m, SM_Roof_Ridge_2m і SM_Roof_Gable_4m) або власний набір; День 12 і День 16: M_Master, MI_Plaster і твоя палітра. Пропущено День 16? Візьми піпеткою 3–5 кольорів стін з одного зі своїх фото-референсів.; День 61: змінні Instance Editable; День 64: функції.\n\nBy the end of this lesson I can:\n1. Пояснювати, чому інструменти читають налаштування з асетів даних: один інструмент дає багато виглядів, а художники змінюють дані, не чіпаючи графа.\n2. Пояснювати, що таке структура (struct): набір іменованих полів різних типів під однією назвою, як форма з кількома полями. Vector — це структура з X, Y і Z.\n3. Створювати S_RoofSet із твоїми деталями даху як типовими значеннями.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: Ти маєш інструменти 13-го тижня, і останній з них — BP_Promenade, що прокладає цілу набережну одним сплайном. Today: Ти вчишся тримати деталі й кольори інструмента в даних: структура, форма Data Asset і заповнені стилі. One encouraging line: Сьогодні тихіший день форм і полів. Але на цій основі стоїть кожен генератор цього тижня.); 2 lines on why today matters and where it comes back, in plain words (from this: Інструментові для будівель не потрібен новий граф для кожного вигляду. Коли деталі й кольори лежать в асетах даних, художник заповнює форму й за дві хвилини має новий стиль. Той самий інструмент будує портовий будинок, охристий міський будинок або кам'яний склад. Студії відокремлюють дані від коду саме тому: художники змінюють дані, програмісти — інструменти, і ніхто не чекає на іншого. It comes back: Відтепер твої DA_Style_* оформлюють кожну будівлю. Завтра (День 67) їх читатиме BP_Building, а з Дня 68 до Дня 70 з'являться палітра, вулична суміш і цілий квартал.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-66-structs-data-assets-styles exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (S_RoofSet, PDA_BuildingStyle, DA_Style_Harbour і BP_StyleSample (уроки)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. У Construction Script BP_BollardRow додай на вільному місці новий Make Transform (той, що в циклі, не чіпай). Клацни правою кнопкою на його вході Location > Split Struct Pin. З'являються Location X, Y і Z: Vector — це маленька структура з трьох Float. Видали новий вузол: інструмент не змінився.\n   2. У Content/Tools/Data клацни правою кнопкою > Blueprint > Structure. Якщо пункту немає, введи Structure у пошук меню Add. Назви асет S_RoofSet і відкрий. Відкривається редактор структури з одним полем MemberVar_0. [screenshot]\n   3. Перейменуй поле на Panel і встанови тип Static Mesh (Object Reference). Клацни + Add Variable і створи Ridge та Gable (Static Mesh), потім Offset (Vector). Збережи. Має вийти чотири поля.\n   4. Відкрий вкладку Default Values. Встанови Panel на SM_Roof_2m, Ridge на SM_Roof_Ridge_2m, Gable на SM_Roof_Gable_4m, а Offset на 0, 0, 115. Origin панелей даху й гребеня лежить на лінії гребеня, на 1,15 м над верхом стін (День 9). Збережи. Твої деталі даху й зсув стали типовими значеннями структури. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Структура чи ні: тьютор називає шість речей. Двері з шириною, висотою й моделлю; один колір; зерно; ліхтар зі стовпом, головкою й кольором світла; назва вулиці; вікно з моделлю й висотою підвіконня. Я кажу, які з них — добрі структури, і називаю їхні поля. Otherwise skip it.\n6. Review: ask me these questions from earlier days, one at a time, and correct me kindly: Day 63: why do you store Make Random Stream in a variable before using it? | Day 61: what does Instance Editable do for a variable?\n7. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n8. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; review (by tutor or art director) = огляд; see-why-fix note = нотатка «бачу, чому, як виправити»; reference photo / hero photo = фото-референс / ключове фото; comparison sheet, board (an image) = аркуш (аркуш порівняння, аркуш референсів); click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); default value = типове значення; File Explorer = Провідник; mesh = меш; grid = сітка (тільки grid, ніколи mesh); vertex / edge / face = вершина / ребро / грань; origin (and kit pivot) = origin — точка, за яку об'єкт ставлять і обертають; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; material instance / child instance = інстанс / дочірній інстанс; material slot / node / pin = слот матеріалу / вузол / вхід; seed = зерно (налаштування Seed); keep-out zone / footprint test / grounding = зона-виняток / тест опори / посадка на ґрунт; kit / kit piece / part of one object = набір / деталь / частина; harbour / quay / waterfront / pier = гавань / причал / набережна / пірс; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}, {"title": {"en": "A Primary Data Asset class: the form", "uk": "Клас Primary Data Asset: форма"}, "minutes": 40, "goals": [{"en": "Explain a Data Asset: an asset that only holds data, filled in from a form; the form is its class.", "uk": "Пояснювати, що таке Data Asset: асет, що лише тримає дані, заповнені за формою. Форма — це його клас."}, {"en": "Create PDA_BuildingStyle from PrimaryDataAsset with mesh, materi n, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; credits line = рядок авторства; reference photo / hero photo = фото-референс / ключове фото; comparison sheet, board (an image) = аркуш (аркуш порівняння, аркуш референсів); click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); default value = типове значення; File Explorer = Провідник; mesh = меш; grid = сітка (тільки grid, ніколи mesh); vertex / edge / face = вершина / ребро / грань; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; material instance / child instance = інстанс / дочірній інстанс; material slot / node / pin = слот матеріалу / вузол / вхід; seed = зерно (налаштування Seed); keep-out zone / footprint test / grounding = зона-виняток / тест опори / посадка на ґрунт; kit / kit piece / part of one object = набір / деталь / частина; harbour / quay / waterfront / pier = гавань / причал / набережна / пірс; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}], "handin": [{"en": "summary.md", "uk": "summary.md (звіт дня)"}, {"en": "styles_day66.png (three stands, one per style, from one Blueprint) (proof)", "uk": "styles_day66.png (три стенди, по одному на стиль, з одного Blueprint) (доказ)"}], "goal": {"en": "By the end of today you have PDA_BuildingStyle, the S_RoofSet struct and three DA_Style_* data assets made from your kit, and BP_StyleSample, a test stand that shows any style you pick in Details.", "uk": "До кінця дня ти матимеш PDA_BuildingStyle, структуру S_RoofSet і три асети даних DA_Style_* з частин твого набору. А ще BP_StyleSample — тестовий стенд, що показує будь-який стиль, вибраний у Details."}, "uses": [{"en": "Day 9: your building kit (SM_Wall_2m, SM_Wall_Window, SM_Wall_Door, SM_Wall_Corner, SM_Roof_2m, SM_Roof_Ridge_2m and SM_Roof_Gable_4m), or your own kit", "uk": "День 9: твій набір будівель (SM_Wall_2m, SM_Wall_Window, SM_Wall_Door, SM_Wall_Corner, SM_Roof_2m, SM_Roof_Ridge_2m і SM_Roof_Gable_4m) або власний набір"}, {"en": "Day 12 and Day 16: M_Master, MI_Plaster and your palette (skipped Day 16? pick 3 to 5 wall colours from one of your reference photos with the colour picker's eyedropper)", "uk": "День 12 і День 16: M_Master, MI_Plaster і твоя палітра. Пропущено День 16? Візьми піпеткою 3–5 кольорів стін з одного зі своїх фото-референсів."}, {"en": "Day 61: Instance Editable variables; Day 64: functions", "uk": "День 61: змінні Instance Editable; День 64: функції"}], "quiz": [{"q": {"en": "What is the difference between PDA_BuildingStyle and DA_Style_Harbour?", "uk": "У чому різниця між PDA_BuildingStyle і DA_Style_Harbour?"}, "options": [{"en": "PDA_BuildingStyle is the form (the class); DA_Style_Harbour is one filled-in copy of it", "uk": "PDA_BuildingStyle — це форма (клас); DA_Style_Harbour — одна її заповнена копія"}, {"en": "They are the same thing with two names", "uk": "Це те саме з двома назвами"}, {"en": "PDA_ holds meshes and DA_ holds code", "uk": "PDA_ тримає моделі, а DA_ тримає код"}], "answer": 0, "explain": {"en": "The class defines the fields; each data asset fills them in with its own values.", "uk": "Клас визначає поля, а кожен асет даних заповнює їх власними значеннями."}}, {"q": {"en": "Your stand shows nothing and the Output Log says Accessed None trying to read property Style. What happened?", "uk": "Стенд нічого не показує, а Output Log пише Accessed None trying to read property Style. Що сталося?"}, "options": [{"en": "The style asset is broken", "uk": "Асет стилю зламаний"}, {"en": "Style is empty on that stand, and the graph read it without an Is Valid check", "uk": "Style на цьому стенді порожній, а граф прочитав його без перевірки Is Valid"}, {"en": "The mesh has no collision", "uk": "У моделі немає колізії"}, {"en": "Bay Width is 0", "uk": "Bay Width дорівнює 0"}], "answer": 1, "explain": {"en": "Accessed None means a reference holds nothing; Is Valid lets the graph skip the work safely.", "uk": "Accessed None означає, що посилання порожнє. Is Valid дає графу безпечно пропустити роботу."}}, {"q": {"en": "Which of these is a struct?", "uk": "Що з цього є структурою?"}, "options": [{"en": "A single Integer", "uk": "Одне Integer"}, {"en": "A Branch node", "uk": "Вузол Branch"}, {"en": "A Vector: X, Y and Z bundled under one name", "uk": "Vector: X, Y і Z, зібрані під однією назвою"}], "answer": 2, "explain": {"en": "A struct bundles several named fields; a Vector is a small struct of three Floats.", "uk": "Структура збирає кілька іменованих полів. Vector — маленька структура з трьох Float."}}, {"q": {"en": "An artist wants a blue harbour house tomorrow. What is the fastest correct way?", "uk": "Художник хоче на завтра синій портовий будинок. Який найшвидший правильний спосіб?"}, "options": [{"en": "Duplicate BP_StyleSample and edit its graph", "uk": "Продублювати BP_StyleSample і відредагувати його граф"}, {"en": "Change M_Master's base colour for everyone", "uk": "Змінити базовий колір M_Master для всіх"}, {"en": "Repaint the wall textures in Krita", "uk": "Перемалювати текстури стін у Krita"}, {"en": "Duplicate a DA_Style_* and set its Wall Material to a blue child of MI_Plaster", "uk": "Продублювати DA_Style_* і встановити його Wall Material на синій дочірній інстанс MI_Plaster"}], "answer": 3, "explain": {"en": "A new look is a data change: a new style and a new instance, with no change to any graph.", "uk": "Новий вигляд — це зміна даних: новий стиль і новий інстанс без жодної зміни графів."}}, {"q": {"en": "Why is every variable in PDA_BuildingStyle Instance Editable?", "uk": "Чому кожна змінна в PDA_BuildingStyle є Instance Editable?"}, "options": [{"en": "So each data asset can fill in its own values in the form", "uk": "Щоб кожен асет даних міг заповнити власні значення у формі"}, {"en": "So the variables draw faster", "uk": "Щоб змінні швидше малювалися"}, {"en": "So they print in the Output Log", "uk": "Щоб вони виводилися в Output Log"}], "answer": 0, "explain": {"en": "Without Instance Editable a field cannot be changed in a data asset, so every style would be identical.", "uk": "Без Instance Editable поле не можна змінити в асеті даних, тож кожен стиль був би однаковий."}}], "weekInfo": null, "morning": {"sofar": {"en": "You have week 13's tools, ending with BP_Promenade, which lays a whole waterfront from one spline.", "uk": "Ти маєш інструменти 13-го тижня, і останній з них — BP_Promenade, що прокладає цілу набережну одним сплайном."}, "today": {"en": "You learn to keep a tool's pieces and colours in data: a struct, a Data Asset form and filled-in styles.", "uk": "Ти вчишся тримати деталі й кольори інструмента в даних: структура, форма Data Asset і заповнені стилі."}, "cheer": {"en": "Today is a quieter day of forms and fields, and it is the foundation every generator this week stands on.", "uk": "Сьогодні тихіший день форм і полів. Але на цій основі стоїть кожен генератор цього тижня."}, "quote": {"text": {"en": "Show me your tables, and I won't usually need your flowcharts; they'll be obvious.", "uk": "Покажи мені свої таблиці, і мені зазвичай не знадобляться твої блок-схеми; вони й так будуть очевидні."}, "author": {"en": "Fred Brooks", "uk": "Фред Брукс"}, "source": "The Mythical Man-Month, 1975"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-66-structs-data-assets-styles", "mapHref": "../../COURSE.html", "prevHref": "../Day-65-boss-promenade/START-HERE.html", "nextHref": "../Day-67-building-generator-floors-bays/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8. I am a beginner on Day 66. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me: when my Blueprint or script fails, ask for the error message or a screenshot of the graph, point to the line or node that is wrong and explain why, then let me fix it myself. Never write the whole tool for me.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: Самостійно: ще два стилі з твоєї палітри та аркуш стилів.\nIt's part of: PDA_BuildingStyle (форма), S_RoofSet (структура), DA_Style_Harbour і щонайменше два інші DA_Style_* (заповнені стилі) та BP_StyleSample — тестовий стенд, що показує деталі стилю (Content/Tools/Data для структури, класу й стилів; Content/Tools/Day66/L_Day66 для випробувальних стендів.).\nWhy it matters: Інструментові для будівель не потрібен новий граф для кожного вигляду. Коли деталі й кольори лежать в асетах даних, художник заповнює форму й за дві хвилини має новий стиль. Той самий інструмент будує портовий будинок, охристий міський будинок або кам'яний склад. Студії відокремлюють дані від коду саме тому: художники змінюють дані, програмісти — інструменти, і ніхто не чекає на іншого. It comes back: Відтепер твої DA_Style_* оформлюють кожну будівлю. Завтра (День 67) їх читатиме BP_Building, а з Дня 68 до Дня 70 з'являться палітра, вулична суміш і цілий квартал.\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-66-structs-data-assets-styles (on the drive I chose on Day 0).\nWhat I already know: День 9: твій набір будівель (SM_Wall_2m, SM_Wall_Window, SM_Wall_Door, SM_Wall_Corner, SM_Roof_2m, SM_Roof_Ridge_2m і SM_Roof_Gable_4m) або власний набір; День 12 і День 16: M_Master, MI_Plaster і твоя палітра. Пропущено День 16? Візьми піпеткою 3–5 кольорів стін з одного зі своїх фото-референсів.; День 61: змінні Instance Editable; День 64: функції; today's lessons: Дані, а не код: структура; Клас Primary Data Asset: форма; Data Asset: заповнення форми; Читання асета даних у Blueprint. Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- S_RoofSet (Blueprint Structure) у Content/Tools/Data: Panel, Ridge і Gable (Static Mesh) та Offset (Vector). Типові значення: твої деталі даху й Offset 0, 0, 115 — висота гребеня над верхом стін.\n- PDA_BuildingStyle — Blueprint Class з батьківським класом PrimaryDataAsset. Category Pieces: Wall, Window, Door і Corner (Static Mesh) та Roof (S_RoofSet). Category Look: Wall Material (Material Instance). Category Grid: Bay Width (Float, 200) і Floor Height (Float, 300). Кожна змінна Instance Editable і з підказкою.\n- DA_Style_Harbour, заповнений з твого набору, і щонайменше два інші стилі, наприклад DA_Style_Ochre і DA_Style_Stone. Кожен має свій Wall Material: дочірній інстанс MI_Plaster з іншим Tint із твоєї палітри.\n- BP_StyleSample у Content/Tools/Blueprints: чотири компоненти Static Mesh через 2,5 м і змінна Style. Його Construction Script перевіряє Style вузлом Is Valid, а потім бере зі стилю чотири моделі й матеріал стіни.\n- Порожній Style дає порожній стенд і жодного повідомлення Accessed None.\n- Три стилі поруч на трьох стендах, кожен зроблено лише зміною даних, ніколи не графа.\n\nMy checklist (the same numbers show on my course page):\n1. Спершу переконайся, що результати сьогоднішніх уроків на місці: S_RoofSet, PDA_BuildingStyle, DA_Style_Harbour, DA_Style_Ochre і BP_StyleSample. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Відкрий S_RoofSet і PDA_BuildingStyle і звір із вимогами: типи, категорії й підказки. Клацни Compile і Save. Перевірка: жодних попереджень, а кожна змінна PDA_BuildingStyle має відкрите око (Instance Editable). (from lesson 2)\n2. Відкрий DA_Style_Harbour і заповни кожне поле з твого набору. Перевірка: жодне поле не показує None, а Bay Width і Floor Height дорівнюють 200 і 300 (або кроку сітки твого набору). (from lesson 3)\n3. Зроби другий колір стіни з палітри Дня 16: клацни правою кнопкою на MI_Plaster > Create Material Instance, назви його MI_Plaster_Stone (або своєю назвою кольору) і задай Tint. Перевірка: мініатюри MI_Plaster_Ochre (з уроку 3) і MI_Plaster_Stone показують свої кольори. (from lesson 3)\n4. Ще раз продублюй DA_Style_Harbour, назви копію DA_Style_Stone і встанови Wall Material на MI_Plaster_Stone. Якщо в наборі є інші вікна чи двері, зміни й їх. Перевірка: у Content/Tools/Data лежать DA_Style_Harbour, DA_Style_Ochre (з уроку 3) і DA_Style_Stone. (from lesson 3)\n5. Постав у L_Day66 три копії BP_StyleSample в ряд, по одній на стиль. Збережи рівень (Ctrl+S), відкрий будь-який інший рівень, а тоді знову L_Day66. Перевірка: у відкритому знову рівні три стенди, кожен зі стіною, вікном, дверима й кутом у своєму кольорі. (from lesson 4)\n6. Перевір крайній випадок: на одному стенді відкрий спадне меню Style і вибери Clear. Трохи посунь стенд, щоб він перебудувався. Перевірка: стенд порожній, а Output Log не показує Accessed None. (from lesson 4)\n7. Перевір заміну: перемкни Style на одному стенді через усі три стилі. Перевірка: стенд щоразу змінює вигляд без жодної зміни в графі. (from lesson 4)\n8. Зроби скриншот styles_day66.png: три стенди спереду, усі добре видно на одному зображенні. Перевірка: зображення в робочій папці дня. (from lesson 2)\n9. Клацни «Копіювати звіт дня», встав текст у новий чат із тьютором, дай відповіді на його запитання й збережи відповідь як summary.md у робочій папці дня. Здай роботу: перетягни файли в сьогоднішню папку здачі (кнопка на цій сторінці): summary.md і styles_day66.png. Ніколи не здавай папку проєкту чи рівня. Перевірка: у папці здачі 2 файли, кожен більший за 1 КБ. (from lesson 4)\n\nHow to help: ask which step number I'm on, then give me only the next step: the exact clicks and what I should see. When I send a screenshot, compare it with my reference, my sizes and the spec, and name one thing to fix at a time.\nCheck every save and export by reopening it before we move on:\n- a Blueprint or script: compile or run it once more and see it work, with no errors\n- a .md or .txt: open it with Notepad; the text is there, and the name doesn't end in .md.txt\nWhen I write \"готово\", and in any case before the day ends, check with me one item at a time (yes/no): each spec point, then each file on my hand-in list, ready in my day work folder (skip summary.md: the day report writes it next):\n1. styles_day66.png (три стенди, по одному на стиль, з одного Blueprint) (доказ)\nFinish with a short list of anything missing, and one line on where this work comes back and what it will look like there. Then tell me the order for the end of the day: first the day report (the Copy the day report button at the bottom of my course page) into summary.md, and only then hand in all the files on the list, summary.md too.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; checklist = чек-лист; credits line = рядок авторства; reference photo / hero photo = фото-референс / ключове фото; comparison sheet, board (an image) = аркуш (аркуш порівняння, аркуш референсів); click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); default value = т function prog(){const Q=(D.quiz&&D.quiz.length)?1:0,L=D.lessons.length,C=D.build.steps.length;let n=0;D.lessons.forEach((l,i)=>{if(st['q'+i])n++});D.build.steps.forEach((s,i)=>{if(st['c'+i])n++});if(Q&&qDone())n++;return (L+C+Q)?n/(L+C+Q):0}
function qScore(){let n=0;D.quiz.forEach((q,i)=>{if((st.qa||{})[i]===q.answer)n++});return n}
function pick(i,k){st.qa=st.qa||{};if(st.qa[i]!=null)return;st.qa[i]=k;if(qDone()){st.qs=[qScore(),D.quiz.length];if(!st.qs1)st.qs1=st.qs.slice()}save();render();const e=document.getElementById('e'+i);if(e)e.focus({preventScroll:true})}
function retry(){st.qa={};delete st.qs;save();render();const e=document.getElementById('o0_0');if(e)e.focus()}
const isBoss=!!(D.build&&D.build.boss&&D.build.boss.length),isFin=D.day===D.total;
document.body.className=isFin?'fin':isBoss?'boss':'';
const lk=s=>esc(s).replace(/https?:\/\/[^\s<']*[^\s<.,;:)']/g,m=>'<a href="'+m+'" target="_blank" rel="noopener">'+m+'</a>');
function list(a,tag,cls){return '<'+tag+(cls?' class="'+cls+'"':'')+'>'+(a||[]).map(i=>'<li>'+lk(x(i))+'</li>').join('')+'</'+tag+'>'}
const lab=(t,k)=>'<div class="lab'+(k?' k-'+k:'')+'"><span class="dotc"></span>'+t+'</div>';
const kn=n=>'<span class="kn">'+ic(n)+'</span>';
const slider=p=>'<div class="slider"><i style="width:calc('+p+'% - 6px)"></i><b style="left:clamp(13px,'+p+'%,calc(100% - 13px))"></b></div>';
function quiz(){if(!D.quiz||!D.quiz.length)return '';const a=st.qa||{};let ok=0;const L=u('letters');
 const pips='<div class="pips well" aria-hidden="true">'+D.quiz.map((q,i)=>'<i class="'+(a[i]==null?'':a[i]===q.answer?'r':'w')+'"></i>').join('')+'</div>';
 const qs=D.quiz.map((q,i)=>{const c=a[i];if(c===q.answer)ok++;return '<div class="qz"><p class="qq"><span class="qn">'+(i+1)+'</span><span>'+lk(x(q.q))+'</span></p>'+q.options.map((o,k)=>{let cls='opt',mk='<span></span>';if(c!=null){if(k===q.answer){cls+=' right';mk=ic('check','mk')}else if(k===c){cls+=' wrong';mk=ic('x','mk')}}return '<button class="'+cls+'" id="o'+i+'_'+k+'"'+(c!=null?' disabled':'')+' onclick="pick('+i+','+k+')"><span class="lt">'+(L[k]||k+1)+'</span><span>'+esc(x(o))+'</span>'+mk+'</button>'}).join('')+(c!=null?'<p class="exp '+(c===q.answer?'r':'w')+'" id="e'+i+'" tabindex="-1"><b>'+(c===q.answer?u('right'):u('wrong'))+'</b>'+lk(x(q.explain))+'</p>':'')+'</div>'}).join('');
 return '<section class="card glass quiz">'+lab(u('quiz'),'gold')+'<p class="muted" style="margin:-6px 0 14px">'+u('quizSub')+'</p>'+pips+qs+(qDone()?'<div class="score well" role="status"><span class="eyebrow">'+u('score')+'</span><span class="lcd" aria-label="'+ok+' / '+D.quiz.length+'">'+seg(ok+'/'+D.quiz.length)+'</span>'+(st.qs1?'<span class="muted">'+u('first')+': '+st.qs1[0]+'/'+st.qs1[1]+'</span>':'')+'<div class="row"><button class="btn ghost" id="retry" onclick="retry()">'+u('retry')+'</button></div></div>':'')+'</section>'}
function vid(v){if(!v)return '';const link=v.url?'<a href="'+esc(v.url)+'" target="_blank" rel="noopener">'+esc(x(v.title)||v.url)+'</a>'+(v.channel?' <span class="muted">· '+esc(v.channel)+(v.length?' · '+esc(v.length):'')+'</span>':''):'';const s=v.search?'<a href="https://www.youtube.com/results?search_query='+encodeURIComponent(v.search)+'" target="_blank" rel="noopener">'+u('noVid')+': '+esc(v.search)+'</a>':'';const alt=v.alt&&v.alt.url?'<br><span class="eyebrow">UA</span> <a href="'+esc(v.alt.url)+'" target="_blank" rel="noopener">'+esc(v.alt.title||v.alt.url)+'</a>'+(v.alt.channel?' <span class="muted">· '+esc(v.alt.channel)+'</span>':''):'';return '<div class="vid well">'+kn('play')+'<div><b>'+u('more')+'?</b><br>'+(link||s)+alt+(link&&s?'<br><span class="muted" style="font-size:14px">'+s+'</span>':'')+'</div></div>'}
function morning(){const m=D.morning;if(!m)return '';const q=m.quote||{};
 let shelf='';if(D.day>0){shelf='<div class="shelf" aria-hidden="true">';let g='';for(let d=0;d<D.day;d++){let p=0;try{p=(JSON.parse(localStorage.getItem('devteam:'+D.learner+':'+d))||{}).pct||0}catch(e){}g+='<i class="'+(p>=1?'d':'')+(d>0&&d%5===0?' bs':'')+'"></i>';if(d%5===0||d===D.day-1){shelf+='<span class="wkg">'+g+'</span>';g=''}}shelf+='</div>'}
 const qt=lang==='uk'&&q.original?q.original:x(q.text);
 return '<section class="card glass morning"><div class="mgrid">'+(m.sofar?'<div>'+lab(u('sofar'),'gold')+shelf+'<p class="mtxt">'+lk(x(m.sofar))+'</p></div>':'')+(m.today?'<div>'+lab(u('todayL'))+'<p class="mtxt">'+lk(x(m.today))+'</p></div>':'')+'</div>'+(m.cheer?'<p class="cheer">'+esc(x(m.cheer))+'</p>':'')+(qt?'<figure class="quote well">'+kn('quote')+'<blockquote>'+esc(qt)+'</blockquote>'+(q.author?'<figcaption>'+esc(x(q.author))+'</figcaption>':'')+'</figure>':'')+'</section>'}
function setLang(l){lang=l;try{localStorage.setItem('devteam:lang',lang)}catch(e){};render()}
function toggleLang(){setLang(lang==='uk'?'en':'uk')}
/* keep open sections and keyboard focus across re-renders */
const openD=new Set();
function tg(e){if(e.open)openD.add(e.id);else openD.delete(e.id)}
const op=id=>openD.has(id)?' open':'';
function render(){const ae=document.activeElement,fid=ae&&(ae.id||(ae.getAttribute('data-th')?'th-'+ae.getAttribute('data-th'):ae.getAttribute('lang')&&ae.closest('.seg')?'lg-'+ae.getAttribute('lang'):''));
 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);
 const b=D.build,P=Math.round(prog()*100);
 document.getElementById('top').innerHTML='<div class="topin glass"><a class="maplink" href="'+esc(D.mapHref)+'">'+kn('map')+u('map')+'</a><div class="crumb"><b>'+esc(x(D.learnerName))+'</b><span>'+u('week')+' '+D.week+'</span><span>'+u('day')+' '+D.day+' '+u('of')+' '+D.total+'</span></div>'+controls(lang,'setLang')+'</div><div class="tline"><i style="width:'+P+'%"></i></div>';
 const state=w=>w<D.week?'b':w===D.week?'n':'p';
 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 let wk='';if(D.weekInfo){const w=D.weekInfo;wk='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}
 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p>'+(b.next?'<div class="back well">'+kn('arrow')+'<div><b>'+u('comes')+'</b><br>'+lk(x(b.next))+'</div></div>':'')+'<div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.assetFiles&&D.assetFiles.length?'<p class="files">'+ic('folder')+'<span>'+u('filesL')+' '+D.assetFiles.map(f=>'<a href="assets/'+encodeURIComponent(f)+'" target="_blank" rel="noopener">'+esc(f)+'</a>').join(', ')+'</span></p>':D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+=handinCard();h+=beforeCard();
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div><label class="rcpt" for="r'+i+'"><span class="eyebrow">'+u('rcpt')+'</span><textarea id="r'+i+'" rows="2" placeholder="'+esc(u('rcptPh'))+'" oninput="st.r'+i+'=this.value;save()">'+esc(st['r'+i]||'')+'</textarea></label>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+hList()+chkList()+(hasClip?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<h3>1 · '+u('copyR')+'</h3><p class="muted">'+u('report')+'</p><div class="row"><button class="btn ghost" onclick="cp(reportText())">'+ic('copy')+u('copyR')+'</button></div><h3>2 · '+u('ship')+'</h3>'+hf()+'<p class="muted" style="margin:12px 0 0">'+u('hNote')+'</p></section>';
 h+=qCard();h+=wk;
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();
</script>

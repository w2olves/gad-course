3 (4) `answer = unreal.EditorDialog.show_message('Rename by rules', msg, unreal.AppMsgType.YES_NO)`; line 24 (4) `if answer == unreal.AppReturnType.YES:`; line 25 (8) `for old, new in plan:`; line 26 (12) `if lib.does_asset_exist(new):`; line 27 (16) `print('SKIPPED, name taken:', new)`; line 28 (12) `else:`; line 29 (16) `lib.make_directory(new.rsplit('/', 1)[0])`; line 30 (16) `lib.rename_asset(old, new)`; line 31 (8) `print('Done. Fix up redirectors, then Save All.')`. new.rsplit('/', 1)[0] keeps the folder part of the new path. You see 31 lines; save the file without running it.\n   - Set DRY_RUN = False, save, and rerun from File > Recent Python Scripts. A window asks Go on?; click No. You see nothing change: No works as a second dry run.\n   - Run it again and click Yes. You see Meshes, Textures and Materials folders appear in Import with prefixed names. Open a material instance: its textures are still connected, because Unreal updated every reference.\n   - Right-click the Import folder > Fix Up Redirectors (in some versions: Update Redirector References), then File > Save All. You see no unsaved stars.\n   - Run once more. You see 0 changes planned: a good batch tool does nothing the second time.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Bulk settings: Nanite from Python", "uk": "Масові налаштування: Nanite з Python"}, "minutes": 40, "goals": [{"en": "Get the StaticMeshEditorSubsystem and read a mesh's Nanite setting and LOD count.", "uk": "Отримай StaticMeshEditorSubsystem і прочитай налаштування Nanite моделі та кількість її LOD."}, {"en": "Turn Nanite on: get the settings, set the enabled property, and set them back with apply_changes.", "uk": "Увімкни Nanite: отримай налаштування, встанови властивість enabled і поверни їх назад через apply_changes."}, {"en": "Save from Python: save_loaded_asset takes the asset object; save_asset takes a path text.", "uk": "Зберігай з Python: save_loaded_asset приймає об'єкт асета; save_asset приймає текст шляху."}], "doalong": [{"en": "In the Output Log type `sub = unreal.get_editor_subsystem(unreal.StaticMeshEditorSubsystem)`, then `mesh = unreal.EditorAssetLibrary.load_asset('/Game/Tools/Day72/Import/Meshes/SM_rock_big')` (use one of your renamed meshes) and `print(mesh.get_name())`. You see its name.", "uk": "В Output Log введи `sub = unreal.get_editor_subsystem(unreal.StaticMeshEditorSubsystem)`, потім `mesh = unreal.EditorAssetLibrary.load_asset('/Game/Tools/Day72/Import/Meshes/SM_rock_big')` (використай одну зі своїх перейменованих моделей) і `print(mesh.get_name())`. Ти бачиш її назву."}, {"en": "Type `s = sub.get_nanite_settings(mesh)` and `print(s.get_editor_property('enabled'), sub.get_lod_count(mesh))`. You see False 1 (or True if Nanite was already on). If get_nanite_settings is missing, read `mesh.get_editor_property('nanite_settings')` instead.", "uk": "Введи `s = sub.get_nanite_settings(mesh)` і `print(s.get_editor_property('enabled'), sub.get_lod_count(mesh))`. Ти бачиш False 1 (або True, якщо Nanite уже був увімкнений). Якщо get_nanite_settings немає, прочитай натомість `mesh.get_editor_property('nanite_settings')`."}, {"en": "Type `s.set_editor_property('enabled', True)` and `sub.set_nanite_settings(mesh, s, apply_changes=True)`. Open the mesh. You see Nanite enabled in its Details and an unsaved star on its tab. If set_nanite_settings is missing, use `mesh.set_editor_property('nanite_settings', s)`.", "uk": "Введи `s.set_editor_property('enabled', True)` і `sub.set_nanite_settings(mesh, s, apply_changes=True)`. Відкрий модель. Ти бачиш Nanite увімкненим у її Details і зірочку незбережених змін на її вкладці. Якщо set_nanite_settings немає, використай `mesh.set_editor_property('nanite_settings', s)`."}, {"en": "Type `unreal.EditorAssetLibrary.save_loaded_asset(mesh)`. You see the star disappear. save_asset would need the path text instead, for example `unreal.EditorAssetLibrary.save_asset('/Game/Tools/Day72/Import/Meshes/SM_rock_big')`.", "uk": "Введи `unreal.EditorAssetLibrary.save_loaded_asset(mesh)`. Ти бачиш, що зірочка зникає. save_asset натомість потребував би тексту шляху, наприклад `unreal.EditorAssetLibrary.save_asset('/Game/Tools/Day72/Import/Meshes/SM_rock_big')`."}, {"en": "Plan set_nanite.py with the tutor: the same shape as rename_by_rules.py (settings at the top, a plan list, PLAN lines, the Yes/No dialog), plus a SKIP list for meshes you chose to keep with LODs on Day 8. You see the outline you write this afternoon.", "uk": "Сплануй set_nanite.py разом із тьютором: така сама форма, як у rename_by_rules.py (налаштування угорі, список плану, рядки PLAN, діалог Yes/No), плюс список SKIP для моделей, які вирішено лишити з LOD у День 8. Ти бачиш план, який напишеш по обіді."}], "play": {"en": "Nanite or LODs: the tutor names six meshes (a rock, a glass pane, a tree with leaves, a quay block, a lamp post, a small sign). I say Nanite or LODs for each, using my Day 8 notes.", "uk": "Nanite чи LOD: тьютор називає шість моделей (камінь, скляна панель, дерево з листям, блок причалу, стовп ліхтаря, невеликий знак). Я кажу Nanite чи LOD для кожної, спираючись на свої нотатки з Дня 8."}, "video": {"search": "unreal engine python static mesh editor subsystem nanite"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Bulk settings: Nanite from Python (Day 72, lesson 4 of 4).\nToday's build: rename_by_rules.py and set_nanite.py in IslandCourse/Content/Python, tested on a messy copy of your kit in Content/Tools/Day72/Import.\nEarlier today I already did: lesson 1 (Dictionaries and decisions); lesson 2 (The dry run: a plan before any change); lesson 3 (Making it real, safely). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Get the StaticMeshEditorSubsystem and read a mesh's Nanite setting and LOD count.\n2. Turn Nanite on: get the settings, set the enabled property, and set them back with apply_changes.\n3. Save from Python: save_loaded_asset takes the asset object; save_asset takes a path text.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Nanite or LODs: the tutor names six meshes (a rock, a glass pane, a tree with leaves, a quay block, a lamp post, a small sign). I say Nanite or LODs for each, using my Day 8 notes.\n4. Do-along on today's build (rename_by_rules.py (lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - In the Output Log type `sub = unreal.get_editor_subsystem(unreal.StaticMeshEditorSubsystem)`, then `mesh = unreal.EditorAssetLibrary.load_asset('/Game/Tools/Day72/Import/Meshes/SM_rock_big')` (use one of your renamed meshes) and `print(mesh.get_name())`. You see its name.\n   - Type `s = sub.get_nanite_settings(mesh)` and `print(s.get_editor_property('enabled'), sub.get_lod_count(mesh))`. You see False 1 (or True if Nanite was already on). If get_nanite_settings is missing, read `mesh.get_editor_property('nanite_settings')` instead.\n   - Type `s.set_editor_property('enabled', True)` and `sub.set_nanite_settings(mesh, s, apply_changes=True)`. Open the mesh. You see Nanite enabled in its Details and an unsaved star on its tab. If set_nanite_settings is missing, use `mesh.set_editor_property('nanite_settings', s)`.\n   - Type `unreal.EditorAssetLibrary.save_loaded_asset(mesh)`. You see the star disappear. save_asset would need the path text instead, for example `unreal.EditorAssetLibrary.save_asset('/Game/Tools/Day72/Import/Meshes/SM_rock_big')`.\n   - Plan set_nanite.py with the tutor: the same shape as rename_by_rules.py (settings at the top, a plan list, PLAN lines, the Yes/No dialog), plus a SKIP list for meshes you chose to keep with LODs on Day 8. You see the outline you write this afternoon.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "rename_by_rules.py and set_nanite.py", "uk": "rename_by_rules.py і set_nanite.py"}, {"en": "rename_log.md (the dry-run plan, then the real result)", "uk": "rename_log.md (план пробного запуску, потім справжній результат)"}, {"en": "before_after_day72.png (the Import folder before and after)", "uk": "before_after_day72.png (папка Import до й після)"}, {"en": "flythrough_day72.mp4 (60 seconds: dry run, No, Yes, tidy folders)", "uk": "flythrough_day72.mp4 (60 секунд: пробний запуск, No, Yes, впорядковані папки)"}, {"en": "summary.md", "uk": "summary.md"}], "goal": {"en": "By the end of today you have rename_by_rules.py, which plans prefix renames and folder moves, prints the plan and changes nothing until you say yes, and set_nanite.py, which turns Nanite on for a folder of meshes in the same safe way.", "uk": "До кінця сьогодні ти матимеш rename_by_rules.py, що планує перейменування за префіксами й переміщення в папки, друкує план і нічого не змінює, доки ти не скажеш «так», а також set_nanite.py, що так само безпечно вмикає Nanite для папки моделей."}, "uses": [{"en": "Day 71: list_assets.py, load_asset, get_class().get_name(), isinstance and functions", "uk": "День 71: list_assets.py, load_asset, get_class().get_name(), isinstance і функції"}, {"en": "Day 8 and Day 9: your kit meshes and your written Nanite or LOD decisions", "uk": "День 8 і День 9: моделі твого набору та твої записані рішення щодо Nanite або LOD"}, {"en": "Day 12 and Day 17: your materials, instances and textures (only copies are used today)", "uk": "День 12 і День 17: твої матеріали, інстанси й текстури (сьогодні використовуються лише копії)"}], "quiz": [{"q": {"en": "What does a dry run do?", "uk": "Що робить пробний запуск?"}, "options": [{"en": "Prints every change the tool would make and changes nothing", "uk": "Друкує кожну зміну, яку зробив би інструмент, і нічого не змінює"}, {"en": "Renames only half the assets", "uk": "Перейменовує лише половину асетів"}, {"en": "Deletes old files", "uk": "Видаляє старі файли"}, {"en": "Saves everything first", "uk": "Спершу зберігає все"}], "answer": 0, "explain": {"en": "A dry run shows the plan so you can check it before anything happens.", "uk": "Пробний запуск показує план, щоб ти міг його перевірити, перш ніж щось станеться."}}, {"q": {"en": "The plan shows SM_SM_Bench. What is wrong in your rules?", "uk": "План показує SM_SM_Bench. Що не так у твоїх правилах?"}, "options": [{"en": "DRY_RUN is True", "uk": "DRY_RUN дорівнює True"}, {"en": "The startswith check is missing, so the prefix is added again", "uk": "Бракує перевірки startswith, тож префікс додається знову"}, {"en": "The dictionary has too many keys", "uk": "Словник має забагато ключів"}, {"en": "The folder path is wrong", "uk": "Шлях до папки неправильний"}], "answer": 1, "explain": {"en": "Only add a prefix when the name does not already start with it.", "uk": "Додавай префікс лише тоді, коли назва ще не починається з нього."}}, {"q": {"en": "Why must you rename assets with rename_asset and not by moving files in Windows Explorer?", "uk": "Чому асети слід перейменовувати через rename_asset, а не переміщенням файлів у Windows Explorer?"}, "options": [{"en": "Explorer is slower", "uk": "Explorer повільніший"}, {"en": "Python cannot see Windows folders", "uk": "Python не бачить папок Windows"}, {"en": "Unreal updates every reference to the asset; a Windows move breaks them", "uk": "Unreal оновлює кожне посилання на асет; переміщення у Windows їх ламає"}], "answer": 2, "explain": {"en": "Materials, levels and Blueprints point to assets by path; Unreal fixes those pointers when it renames, Explorer does not.", "uk": "Матеріали, рівні й Blueprint вказують на асети за шляхом; Unreal виправляє ці вказівники, коли перейменовує, а Explorer — ні."}}, {"q": {"en": "You have a loaded mesh object in a variable. Which call saves it?", "uk": "У тебе в змінній завантажений об'єкт моделі. Який виклик його зберігає?"}, "options": [{"en": "save_asset(mesh)", "uk": "save_asset(mesh)"}, {"en": "save_loaded_asset(mesh)", "uk": "save_loaded_asset(mesh)"}, {"en": "print(mesh)", "uk": "print(mesh)"}, {"en": "rename_asset(mesh)", "uk": "rename_asset(mesh)"}], "answer": 1, "explain": {"en": "save_loaded_asset takes the object; save_asset takes the asset's path text.", "uk": "save_loaded_asset приймає об'єкт; save_asset приймає текст шляху асета."}}, {"q": {"en": "You run rename_by_rules.py a second time and it plans 6 changes again. What does that suggest?", "uk": "Ти запускаєш rename_by_rules.py удруге, і він знову планує 6 змін. Що це може означати?"}, "options": [{"en": "Everything is fine: batch tools always plan the same", "uk": "Усе гаразд: пакетні інструменти завжди планують те саме"}, {"en": "Your PC needs a restart", "uk": "Твоєму ПК потрібне перезавантаження"}, {"en": "The first run did not apply (you clicked No, or DRY_RUN was True), or a rule keeps changing names", "uk": "Перший запуск не застосувався (було обрано No або DRY_RUN був True), або якесь правило постійно змінює назви"}], "answer": 2, "explain": {"en": "After a real run a good batch tool finds nothing left to do; a repeated plan means nothing changed or a rule is unstable.", "uk": "Після справжнього запуску добрий пакетний інструмент не знаходить, що ще робити; повторюваний план означає, що нічого не змінилося або правило нестабільне."}}], "weekInfo": null, "morning": {"sofar": {"en": "You have Python running in Unreal, and list_assets.py and count_types.py, which read any folder of your project.", "uk": "Ти маєш Python, що працює в Unreal, і list_assets.py та count_types.py, які читають будь-яку папку твого проєкту."}, "today": {"en": "You write your first batch tool: rules that rename and sort assets, with a dry run and a Yes-or-No question before anything changes.", "uk": "Ти пишеш свій перший пакетний інструмент: правила, що перейменовують і сортують асети, з пробним запуском і запитанням «так чи ні» перед будь-якою зміною."}, "cheer": {"en": "Careful tools are confident tools; once your dry run reads right, you can let a script tidy a hundred files without a worry.", "uk": "Обережні інструменти — впевнені інструменти; щойно твій пробний запуск читається правильно, можеш дозволити скрипту впорядкувати сотню файлів без тривоги."}, "quote": {"text": {"en": "Simplicity, simplicity, simplicity! I say, let your affairs be as two or three, and not a hundred or a thousand.", "uk": "Простота, простота, простота! Кажу вам: нехай ваші справи лічаться на двоє чи троє, а не на сотні чи тисячі."}, "author": {"en": "Henry David Thoreau", "uk": "Генрі Девід Торо"}, "source": "Walden, 1854"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-72-rename-by-rules-dry-run", "mapHref": "../../COURSE.html", "prevHref": "../Day-71-python-from-zero-unreal/START-HERE.html", "nextHref": "../Day-73-place-from-csv-undo/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8 with its Python, and a plain text editor. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me: when my Blueprint or script fails, ask for the error message or a screenshot of the graph, point to the line or node that is wrong and explain why, then let me fix it myself. Never write the whole tool for me. Keep me moving and make it feel like a game.\n\nToday I build on my own: set_nanite.py, on your own.\nIt's part of: rename_by_rules.py and set_nanite.py in IslandCourse/Content/Python, tested on a messy copy of your kit in Content/Tools/Day72/Import (Content/Tools/Day72/Import (copies only, never your real kit); the scripts in IslandCourse/Content/Python.).\n\nSpec:\n- A test folder Content/Tools/Day72/Import with at least 8 duplicated assets given messy names: 2 meshes, 2 textures, 1 material, 2 material instances and 1 asset that is already named correctly.\n- rename_by_rules.py: FOLDER, DRY_RUN = True, and the PREFIXES and SUBFOLDERS dictionaries at the top; it builds a plan list of (old path, new path) pairs and prints every PLAN line and a count.\n- With DRY_RUN = False it asks first with unreal.EditorDialog.show_message (YES_NO); on Yes it makes each subfolder with make_directory and calls rename_asset, skipping any name already taken; it saves nothing, so you check and Save All yourself.\n- A second run plans 0 changes.\n- set_nanite.py: lists the meshes in a folder that have Nanite off, with their LOD counts (a dry run); on Yes it turns Nanite on with StaticMeshEditorSubsystem get_nanite_settings and set_nanite_settings and saves each mesh with save_loaded_asset; a SKIP list keeps meshes you decided should use LODs.\n- rename_log.md: the dry-run plan, then the result of the real run.\n\nMy checklist:\n1. Check the test folder: at least 8 duplicated assets with messy names in Content/Tools/Day72/Import, and your real kit untouched. Check: the Import folder holds only copies, and your kit folder looks exactly as before. (from lesson 2)\n2. Dry run: run rename_by_rules.py with DRY_RUN = True. Check: one PLAN line per asset that needs a change, a count line, and nothing changed in the Content Browser. (from lesson 2)\n3. Copy the PLAN lines into rename_log.md and mark any line you disagree with; fix the rule (not the line) and run the dry run again. Check: every PLAN line in rename_log.md is one you agree with. (from lesson 2)\n4. Set DRY_RUN = False and run; when the dialog asks Go on?, click No. Check: nothing changes: No is always safe. (from lesson 3)\n5. Run again and click Yes. Check: Meshes, Textures and Materials folders appear inside Import with prefixed names, and a material instance still shows its textures. (from lesson 3)\n6. Right-click the Import folder > Fix Up Redirectors (in some versions: Update Redirector References), then File > Save All. Check: no unsaved stars remain in the Content Browser. (from lesson 3)\n7. Run rename_by_rules.py a third time. Check: 0 changes planned. (from lesson 3)\n8. Name-taken test: duplicate a mesh into Import and name the copy so that its planned new name already exists in Meshes; run and click Yes. Check: a SKIPPED, name taken line, and the existing asset is untouched. (from lesson 3)\n9. On your own, write set_nanite.py with the same shape as rename_by_rules.py: FOLDER (Import/Meshes), DRY_RUN = True and a SKIP list at the top; a plan list of meshes whose Nanite is off, each printed with its LOD count; then the Yes/No dialog, and on Yes get_nanite_settings, set enabled to True, set_nanite_settings and save_loaded_asset for each mesh. Check: the dry run prints one PLAN line per mesh with Nanite off. (from lesson 4)\n10. Run set_nanite.py with DRY_RUN = False and click Yes. Check: opening any of those meshes shows Nanite enabled in its Details, with no unsaved star; meshes on SKIP are unchanged. (from lesson 4)\n11. Finish rename_log.md with the real run's result and the set_nanite.py run, and take before_after_day72.png (the Import folder before and after, side by side). Check: both are in today's Work folder. (from lesson 2)\n12. Record flythrough_day72.mp4 (60 seconds): the dry run, the dialog with No, then Yes, and the tidy folders. Check: the clip shows the plan before any change. (from lesson 3)\n13. Click Copy the day report, paste it into a new tutor chat, answer its questions and save its answer as summary.md. Check: summary.md is in today's Work folder with Made, To look at, Hours and To revisit filled in. (from lesson 4)\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Misha\nDay 72: Batch tools: rename_by_rules.py with a dry run, and bulk Nanite. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 if(D.weekInfo){const w=D.weekInfo;h+='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}
 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p><div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+list(D.handin,'ul','ticks')+'<p class="path">'+ic('folder')+'<span>'+u('shipTo')+' <code>'+esc(D.workPath)+'</code></span></p>'+(D.lessons.length?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<p class="muted">'+u('report')+'</p><div class="row"><button class="btn s" onclick="cp(D.reportPrompt)">'+ic('copy')+u('copyR')+'</button></div></section>';
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();
</script>

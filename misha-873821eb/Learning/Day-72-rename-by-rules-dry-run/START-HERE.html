<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 72</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.b{background:linear-gradient(145deg,#ff8cc4,#d6337e);box-shadow:0 10px 24px -8px rgba(255,95,168,.6),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.s{background:linear-gradient(145deg,#5fe39a,#16a34a);box-shadow:0 10px 24px -8px rgba(74,222,128,.55),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.ghost{color:var(--ink);background:var(--card);box-shadow:var(--raiseS)}
.btn.ghost:hover{color:var(--accT)}
/* the Done switch */
.sw{display:inline-flex;align-items:center;gap:12px;border:0;background:transparent;cursor:pointer;font:600 14px/1 var(--head);color:var(--muted);min-height:50px;padding:0 6px}
.sw .tr{position:relative;width:58px;height:32px;border-radius:999px;background:var(--well);box-shadow:var(--press);transition:background .25s}
.sw .tr::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .25s}
.sw[aria-pressed=true]{color:var(--ok)}
.sw[aria-pressed=true] .tr{background:linear-gradient(145deg,#5fe39a,#16a34a);box-shadow:0 0 14px rgba(74,222,128,.55)}
.sw[aria-pressed=true] .tr::after{left:30px;background:#fff}
details{margin-top:22px;border-radius:20px;background:var(--well);box-shadow:var(--press);padding:0 18px}
summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;min-height:52px;font:600 13px/1.3 var(--head);letter-spacing:.04em;color:var(--ink)}
summary:hover{color:var(--accT)}
summary::-webkit-details-marker{display:none}
summary .chev{margin-left:auto;transition:transform .25s;color:var(--faint)}
details[open] summary .chev{transform:rotate(180deg)}
details[open]{padding-bottom:16px}
.steps{list-style:none;padding:0;counter-reset:s;margin:4px 0 0}
.steps li{counter-increment:s;position:relative;padding:0 0 0 44px;margin:12px 0}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 12.5px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.vid{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;margin-top:20px;font-size:15px;padding:16px 18px;border-radius:20px}
.vid .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--badL)}
.vid b{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* build */
.build.bossday{border-color:rgba(255,95,168,.35)}
.build.bossday::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(60% 45% at 100% 0%,rgba(255,95,168,.28),transparent 70%);z-index:-1;pointer-events:none}
.tiers{list-style:none;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:0}
.tiers li{margin:0;padding:16px 18px;border-radius:20px;font-size:14.5px;line-height:1.55;color:var(--muted);background:var(--card);box-shadow:var(--raiseS)}
.medal{display:flex;align-items:center;gap:10px;margin:0 0 8px;font:700 11.5px/1 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
.medal i{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 2px 2px rgba(255,255,255,.6),0 0 10px var(--mg)}
.m0{--mg:rgba(205,127,50,.6)}.m0 i{background:linear-gradient(135deg,#e7a46d,#9a5a2b)}
.m1{--mg:rgba(190,200,215,.7)}.m1 i{background:linear-gradient(135deg,#f3f6fa,#9aa5b3)}
.m2{--mg:rgba(245,195,91,.75)}.m2 i{background:linear-gradient(135deg,#ffe08a,#c99412)}
.ccount{display:flex;align-items:center;gap:16px;margin:28px 0 10px}
.ccount .slider{flex:1}
.check{list-style:none;padding:0;margin:0}
.check li{margin:0}
.check label{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:start;padding:14px 4px;cursor:pointer;border-bottom:1px solid var(--line)}
.check li:last-child label{border-bottom:0}
.check input{appearance:none;-webkit-appearance:none;width:26px;height:26px;margin:1px 0 0;border-radius:9px;background:var(--well);box-shadow:var(--press);display:grid;place-items:center;cursor:pointer;transition:background .2s,box-shadow .2s}
.check input::after{content:"";width:10px;height:5px;border:solid #fff;border-width:0 0 2.2px 2.2px;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.check input:checked{background:linear-gradient(145deg,#5fe39a,#16a34a);box-shadow:0 0 12px rgba(74,222,128,.55)}
.check input:checked::after{opacity:1}
.check li.on .tx{color:var(--faint)}
.check .ln{font:600 10.5px/1.3 var(--head);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);white-space:nowrap;margin-top:5px;padding:4px 9px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
/* quiz */
.pips{display:flex;gap:8px;margin:0 0 4px;padding:10px 14px;border-radius:999px;width:max-content;max-width:100%;flex-wrap:wrap}
.pips i{width:9px;height:9px;border-radius:50%;background:var(--line2)}
.pips i.r{background:var(--okL);box-shadow:0 0 8px var(--okL)}.pips i.w{background:var(--badL);box-shadow:0 0 8px var(--badL)}
.qz{margin:28px 0 0;padding:28px 0 0;border-top:1px solid var(--line)}
.qz:first-of-type{border-top:0;padding-top:10px;margin-top:10px}
.qq{display:grid;grid-template-columns:40px 1fr;gap:10px;font:600 17.5px/1.45 var(--head);letter-spacing:-.005em;margin:0 0 14px}
.qq .qn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 13px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.opt{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;width:calc(100% - 50px);margin:12px 0 12px 50px;text-align:left;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid transparent;border-radius:18px;padding:11px 16px;cursor:pointer;box-shadow:var(--raiseS);transition:box-shadow .2s,transform .15s}
.opt .lt{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 12.5px/1 var(--head);color:var(--faint);background:var(--well);box-shadow:var(--press)}
.opt:hover:not([disabled]){transform:translateY(-1px);color:var(--accT)}
.opt.right{box-shadow:var(--press);background:var(--okBg);border-color:rgba(74,222,128,.45)}.opt.right .lt{background:var(--okL);color:#fff;box-shadow:0 0 10px var(--okL)}.opt.right .mk{color:var(--ok)}
.opt.wrong{box-shadow:var(--press);background:var(--badBg);border-color:rgba(255,93,93,.45)}.opt.wrong .lt{background:var(--badL);color:#fff;box-shadow:0 0 10px var(--badL)}.opt.wrong .mk{color:var(--bad)}
.opt[disabled]{cursor:default}
.opt[disabled]:not(.right):not(.wrong){opacity:.55;box-shadow:none}
.exp{margin:10px 0 0 50px;font-size:15.5px;color:var(--muted)}
.exp b{font:700 11.5px/1 var(--head);letter-spacing:.14em;text-transform:uppercase;margin-right:10px}
.exp.r b{color:var(--ok)}.exp.w b{color:var(--bad)}
.score{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:32px;padding:18px 20px;border-radius:24px}
.score .lcd .seg7{height:34px}
.score .row{margin:0 0 0 auto}
/* ship */
.path{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;margin:22px 0 12px}
.path .ic,.clip .ic{color:var(--accT);margin-top:4px}
.clip{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
/* prev / next */
.nav{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:34px}
.nav a{display:flex;align-items:center;gap:14px;border-radius:24px;padding:16px 20px;font:600 15px/1.3 var(--head);text-decoration:none;color:var(--ink);min-height:72px}
.nav a .kn{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.nav a:hover{color:var(--accT)}
.nav a.nx{justify-content:flex-end;text-align:right;grid-column:2}
#toast{position:fixed;left:50%;bottom:28px;z-index:9;transform:translateX(-50%) translateY(16px);background:rgba(30,33,46,.82);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:#f4f5fa;border:1px solid rgba(255,255,255,.14);padding:13px 24px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none;font:600 14px/1.4 var(--head);max-width:min(92vw,560px);text-align:center;box-shadow:0 20px 40px -14px rgba(0,0,0,.5),0 0 24px var(--glow)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:860px){.how{grid-template-columns:repeat(2,minmax(0,1fr))}.tiers{grid-template-columns:1fr}}
@media (max-width:640px){
 body{font-size:16.5px}
 .wrap{padding:0 14px 72px}.topin{width:calc(100% - 20px);border-radius:26px;padding:8px}
 .crumb{order:3;flex-basis:100%;padding:0 8px 4px}
 .hero{grid-template-columns:1fr;padding:26px 0 24px}
 .chart{order:-1;max-width:300px}
 .card{padding:24px 18px;border-radius:24px}
 .split,.how,.mgrid{grid-template-columns:1fr}
 .quest{grid-template-columns:1fr}.qnum{width:54px;height:54px;font-size:19px;margin-bottom:10px}
 .opt{margin-left:0;width:100%}.exp{margin-left:0}.qq{grid-template-columns:34px 1fr;font-size:16.5px}
 .check label{grid-template-columns:auto 1fr}.check .ln{grid-column:2;justify-self:start;margin-top:-4px}
 .nav{grid-template-columns:1fr}.nav a.nx{grid-column:auto}
 .score .row{margin:0}
 .btn{flex:1 1 auto}
}

.fbt{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;font:600 11px/1.2 var(--head);letter-spacing:.06em;padding:5px 10px;border-radius:999px;background:var(--well);box-shadow:var(--press);color:var(--muted)}
.fbt.ok{color:var(--accT)}.fbt.miss{color:var(--faint)}
.fbt svg{width:14px;height:14px}
.fbnew{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:14px 18px;border-radius:22px;margin:0 0 18px}
.fbnew b{font:700 15px/1.3 var(--head)}
.fbnew .lk{display:flex;flex-wrap:wrap;gap:8px}
.fbnew a{color:var(--accT);font-weight:600;text-decoration:none;padding:6px 12px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.fbsc{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;padding:16px 18px;border-radius:24px;margin:0 0 22px}
.fbsc .v{font:700 26px/1.1 var(--head);color:var(--accT)}
.fbsc p{margin:4px 0 0}
.fbcard .big{font:700 30px/1 var(--head);color:var(--accT)}
.fbcard .note{font-size:16px;line-height:1.55;margin:10px 0}

<script id="data" type="application/json">{"learner": "ib-misha-873821eb", "learnerName": {"en": "Misha", "uk": "Міша"}, "day": 72, "week": 15, "total": 110, "title": {"en": "Batch tools: rename_by_rules.py with a dry run, and bulk Nanite", "uk": "Пакетні інструменти: rename_by_rules.py із пробним запуском і масове ввімкнення Nanite"}, "theme": {"en": "Week 15: Python in the Unreal editor", "uk": "Тиждень 15: Python в редакторі Unreal"}, "build": {"item": {"en": "rename_by_rules.py and set_nanite.py in IslandCourse/Content/Python, tested on a messy copy of your kit in Content/Tools/Day72/Import", "uk": "rename_by_rules.py і set_nanite.py в IslandCourse/Content/Python, перевірені на захаращеній копії твого набору в Content/Tools/Day72/Import"}, "why": {"en": "Imports arrive with names like rock_final2 and Material_001, and a project with mixed names is slow to search and breaks every tool that relies on prefixes. A rename tool with a dry run fixes hundreds of names in seconds and shows you every change first, so nothing surprising happens. Every studio pipeline has one, and writing a safe one is a classic technical-artist task.", "uk": "Імпорти приходять із назвами на зразок rock_final2 і Material_001, а проєкт зі змішаними назвами повільно шукати, і він ламає кожен інструмент, що спирається на префікси. Інструмент перейменування з пробним запуском виправляє сотні назв за секунди й спершу показує тобі кожну зміну, тож нічого несподіваного не стається. Кожен студійний пайплайн має такий, а написання безпечного — класичне завдання технічного художника."}, "where": {"en": "Content/Tools/Day72/Import (copies only, never your real kit); the scripts in IslandCourse/Content/Python.", "uk": "Content/Tools/Day72/Import (лише копії, ніколи твій справжній набір); скрипти в IslandCourse/Content/Python."}, "spec": [{"en": "A test folder Content/Tools/Day72/Import with at least 8 duplicated assets given messy names: 2 meshes, 2 textures, 1 material, 2 material instances and 1 asset that is already named correctly.", "uk": "Тестова папка Content/Tools/Day72/Import щонайменше з 8 дубльованими асетами із захаращеними назвами: 2 моделі, 2 текстури, 1 матеріал, 2 інстанси матеріалу й 1 асет, що вже має правильну назву."}, {"en": "rename_by_rules.py: FOLDER, DRY_RUN = True, and the PREFIXES and SUBFOLDERS dictionaries at the top; it builds a plan list of (old path, new path) pairs and prints every PLAN line and a count.", "uk": "rename_by_rules.py: FOLDER, DRY_RUN = True і словники PREFIXES та SUBFOLDERS угорі; він будує список плану з пар (старий шлях, новий шлях) і друкує кожен рядок PLAN та кількість."}, {"en": "With DRY_RUN = False it asks first with unreal.EditorDialog.show_message (YES_NO); on Yes it makes each subfolder with make_directory and calls rename_asset, skipping any name already taken; it saves nothing, so you check and Save All yourself.", "uk": "З DRY_RUN = False він спершу питає через unreal.EditorDialog.show_message (YES_NO); при Yes створює кожну підпапку через make_directory і викликає rename_asset, пропускаючи кожну вже зайняту назву; він нічого не зберігає, тож ти перевіряєш і виконуєш Save All сам."}, {"en": "A second run plans 0 changes.", "uk": "Другий запуск планує 0 змін."}, {"en": "set_nanite.py: lists the meshes in a folder that have Nanite off, with their LOD counts (a dry run); on Yes it turns Nanite on with StaticMeshEditorSubsystem get_nanite_settings and set_nanite_settings and saves each mesh with save_loaded_asset; a SKIP list keeps meshes you decided should use LODs.", "uk": "set_nanite.py: перелічує моделі в папці, що мають вимкнений Nanite, з їхніми кількостями LOD (пробний запуск); при Yes вмикає Nanite через StaticMeshEditorSubsystem get_nanite_settings і set_nanite_settings і зберігає кожну модель через save_loaded_asset; список SKIP залишає моделі, для яких вирішено використовувати LOD."}, {"en": "rename_log.md: the dry-run plan, then the result of the real run.", "uk": "rename_log.md: план пробного запуску, потім результат справжнього запуску."}], "piece1": "rename_by_rules.py (lessons)", "piece2": {"en": "set_nanite.py, on your own", "uk": "set_nanite.py, самостійно"}, "steps": [{"text": {"en": "Check the test folder: at least 8 duplicated assets with messy names in Content/Tools/Day72/Import, and your real kit untouched. Check: the Import folder holds only copies, and your kit folder looks exactly as before.", "uk": "Перевір тестову папку: щонайменше 8 дубльованих асетів із захаращеними назвами в Content/Tools/Day72/Import, а твій справжній набір не зачеплено. Перевірка: папка Import містить лише копії, а папка твого набору виглядає точно так, як раніше."}, "lesson": 2}, {"text": {"en": "Dry run: run rename_by_rules.py with DRY_RUN = True. Check: one PLAN line per asset that needs a change, a count line, and nothing changed in the Content Browser.", "uk": "Пробний запуск: запусти rename_by_rules.py з DRY_RUN = True. Перевірка: один рядок PLAN на кожен асет, що потребує зміни, рядок із кількістю, і нічого не змінилося в Content Browser."}, "lesson": 2}, {"text": {"en": "Copy the PLAN lines into rename_log.md and mark any line you disagree with; fix the rule (not the line) and run the dry run again. Check: every PLAN line in rename_log.md is one you agree with.", "uk": "Скопіюй рядки PLAN у rename_log.md і познач кожен рядок, із яким не згоден; виправ правило (а не рядок) і запусти пробний запуск знову. Перевірка: кожен рядок PLAN у rename_log.md — такий, який тебе влаштовує."}, "lesson": 2}, {"text": {"en": "Set DRY_RUN = False and run; when the dialog asks Go on?, click No. Check: nothing changes: No is always safe.", "uk": "Встанови DRY_RUN = False і запусти; коли діалог питає Go on?, клацни No. Перевірка: нічого не змінюється: No завжди безпечне."}, "lesson": 3}, {"text": {"en": "Run again and click Yes. Check: Meshes, Textures and Materials folders appear inside Import with prefixed names, and a material instance still shows its textures.", "uk": "Запусти знову й клацни Yes. Перевірка: усередині Import з'являються папки Meshes, Textures і Materials з назвами з префіксами, а інстанс матеріалу й далі показує свої текстури."}, "lesson": 3}, {"text": {"en": "Right-click the Import folder > Fix Up Redirectors (in some versions: Update Redirector References), then File > Save All. Check: no unsaved stars remain in the Content Browser.", "uk": "Клацни правою кнопкою на папці Import > Fix Up Redirectors (в деяких версіях: Update Redirector References), потім File > Save All. Перевірка: у Content Browser не лишилося зірочок незбережених змін."}, "lesson": 3}, {"text": {"en": "Run rename_by_rules.py a third time. Check: 0 changes planned.", "uk": "Запусти rename_by_rules.py утретє. Перевірка: заплановано 0 змін."}, "lesson": 3}, {"text": {"en": "Name-taken test: duplicate a mesh into Import and name the copy so that its planned new name already exists in Meshes; run and click Yes. Check: a SKIPPED, name taken line, and the existing asset is untouched.", "uk": "Тест зайнятої назви: продублюй модель у Import і назви копію так, щоб її запланована нова назва вже існувала в Meshes; запусти й клацни Yes. Перевірка: рядок SKIPPED, name taken, а наявний асет не зачеплено."}, "lesson": 3}, {"text": {"en": "On your own, write set_nanite.py with the same shape as rename_by_rules.py: FOLDER (Import/Meshes), DRY_RUN = True and a SKIP list at the top; a plan list of meshes whose Nanite is off, each printed with its LOD count; then the Yes/No dialog, and on Yes get_nanite_settings, set enabled to True, set_nanite_settings and save_loaded_asset for each mesh. Check: the dry run prints one PLAN line per mesh with Nanite off.", "uk": "Самостійно напиши set_nanite.py тієї самої форми, що rename_by_rules.py: FOLDER (Import/Meshes), DRY_RUN = True і список SKIP угорі; список плану з моделей, у яких Nanite вимкнений, кожна надрукована з кількістю LOD; потім діалог Yes/No, а при Yes get_nanite_settings, встанови enabled на True, set_nanite_settings і save_loaded_asset для кожної моделі. Перевірка: пробний запуск друкує один рядок PLAN на модель із вимкненим Nanite."}, "lesson": 4}, {"text": {"en": "Run set_nanite.py with DRY_RUN = False and click Yes. Check: opening any of those meshes shows Nanite enabled in its Details, with no unsaved star; meshes on SKIP are unchanged.", "uk": "Запусти set_nanite.py з DRY_RUN = False і клацни Yes. Перевірка: відкриття будь-якої з цих моделей показує Nanite увімкненим у її Details, без зірочки незбережених змін; моделі зі списку SKIP не змінено."}, "lesson": 4}, {"text": {"en": "Finish rename_log.md with the real run's result and the set_nanite.py run, and take before_after_day72.png (the Import folder before and after, side by side). Check: both are in today's Work folder.", "uk": "Заверши rename_log.md результатом справжнього запуску й запуску set_nanite.py і зроби before_after_day72.png (папка Import до й після, поруч). Перевірка: обидва лежать у сьогоднішній папці Work."}, "lesson": 2}, {"text": {"en": "Record flythrough_day72.mp4 (60 seconds): the dry run, the dialog with No, then Yes, and the tidy folders. Check: the clip shows the plan before any change.", "uk": "Запиши flythrough_day72.mp4 (60 секунд): пробний запуск, діалог із No, потім Yes і впорядковані папки. Перевірка: кліп показує план до будь-якої зміни."}, "lesson": 3}, {"text": {"en": "Click Copy the day report, paste it into a new tutor chat, answer its questions and save its answer as summary.md. Check: summary.md is in today's Work folder with Made, To look at, Hours and To revisit filled in.", "uk": "Натисни Copy the day report, встав його в новий чат із тьютором, дай відповіді на його запитання й збережи його відповідь як summary.md. Перевірка: summary.md лежить у сьогоднішній папці Work із заповненими Made, To look at, Hours і To revisit."}, "lesson": 4}], "assets": ["techart/code-style.md", "techart/standards-sheet.md"]}, "lessons": [{"title": {"en": "Dictionaries and decisions", "uk": "Словники й рішення"}, "minutes": 40, "goals": [{"en": "Explain a dictionary: a lookup table of key: value pairs inside { }, for example 'StaticMesh': 'SM_'.", "uk": "Поясни словник (dictionary): таблиця пошуку з пар ключ: значення всередині { }, наприклад 'StaticMesh': 'SM_'."}, {"en": "Make decisions with if, not and in, and test text with startswith.", "uk": "Приймай рішення через if, not і in та перевіряй текст через startswith."}, {"en": "Write a function wanted_name(kind, name) that returns the name with the right prefix.", "uk": "Напиши функцію wanted_name(kind, name), що повертає назву з правильним префіксом."}], "doalong": [{"en": "In the Output Log (Python) type `PREFIXES = {'StaticMesh': 'SM_', 'Texture2D': 'T_', 'Material': 'M_', 'MaterialInstanceConstant': 'MI_'}` and then `print(PREFIXES['Texture2D'])`. You see T_: the key gives you its value.", "uk": "В Output Log (Python) введи `PREFIXES = {'StaticMesh': 'SM_', 'Texture2D': 'T_', 'Material': 'M_', 'MaterialInstanceConstant': 'MI_'}`, а потім `print(PREFIXES['Texture2D'])`. Ти бачиш T_: ключ дає тобі своє значення."}, {"en": "Type `print('Blueprint' in PREFIXES)` and `print('StaticMesh' in PREFIXES)`. You see False, then True: in asks whether a key is in the dictionary.", "uk": "Введи `print('Blueprint' in PREFIXES)` і `print('StaticMesh' in PREFIXES)`. Ти бачиш False, потім True: in питає, чи є ключ у словнику."}, {"en": "Type `name = 'rock_big'` and `print(name.startswith('SM_'))`. You see False.", "uk": "Введи `name = 'rock_big'` і `print(name.startswith('SM_'))`. Ти бачиш False."}, {"en": "Type these lines with Shift+Enter between them, then press Enter: line 1 `def wanted_name(kind, name):`; line 2 (4 spaces) `if kind not in PREFIXES:`; line 3 (8 spaces) `return name`; line 4 (4 spaces) `if name.startswith(PREFIXES[kind]):`; line 5 (8 spaces) `return name`; line 6 (4 spaces) `return PREFIXES[kind] + name`. You see no output: the function is now defined.", "uk": "Введи ці рядки з Shift+Enter між ними, потім натисни Enter: рядок 1 `def wanted_name(kind, name):`; рядок 2 (4 пробіли) `if kind not in PREFIXES:`; рядок 3 (8 пробілів) `return name`; рядок 4 (4 пробіли) `if name.startswith(PREFIXES[kind]):`; рядок 5 (8 пробілів) `return name`; рядок 6 (4 пробіли) `return PREFIXES[kind] + name`. Ти не бачиш виводу: функцію тепер визначено."}, {"en": "Type `print(wanted_name('StaticMesh', 'rock_big'), wanted_name('StaticMesh', 'SM_Bench'), wanted_name('Blueprint', 'BP_Building'))`. You see SM_rock_big SM_Bench BP_Building: each rule fires once, and only when it is needed.", "uk": "Введи `print(wanted_name('StaticMesh', 'rock_big'), wanted_name('StaticMesh', 'SM_Bench'), wanted_name('Blueprint', 'BP_Building'))`. Ти бачиш SM_rock_big SM_Bench BP_Building: кожне правило спрацьовує один раз і лише тоді, коли потрібно."}], "play": {"en": "Rule judge: the tutor gives eight asset names with their types (rock_big as StaticMesh; T_Paving_D as Texture2D; Mat_red as Material; plaster_ochre as MaterialInstanceConstant, and four more). I say what wanted_name returns for each, and which results still look wrong to a human.", "uk": "Суддя правил: тьютор дає вісім назв асетів з їхніми типами (rock_big як StaticMesh; T_Paving_D як Texture2D; Mat_red як Material; plaster_ochre як MaterialInstanceConstant і ще чотири). Я кажу, що повертає wanted_name для кожної, і які результати все ще виглядають неправильно для людини."}, "video": {"search": "python dictionary if statement startswith beginners"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Dictionaries and decisions (Day 72, lesson 1 of 4).\nToday's build: rename_by_rules.py and set_nanite.py in IslandCourse/Content/Python, tested on a messy copy of your kit in Content/Tools/Day72/Import.\n\nBy the end of this lesson I can:\n1. Explain a dictionary: a lookup table of key: value pairs inside { }, for example 'StaticMesh': 'SM_'.\n2. Make decisions with if, not and in, and test text with startswith.\n3. Write a function wanted_name(kind, name) that returns the name with the right prefix.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (You have Python running in Unreal, and list_assets.py and count_types.py, which read any folder of your project.), what I will learn today (You write your first batch tool: rules that rename and sort assets, with a dry run and a Yes-or-No question before anything changes.), encourage me (Careful tools are confident tools; once your dry run reads right, you can let a script tidy a hundred files without a worry.), and share today's quote: \"Simplicity, simplicity, simplicity! I say, let your affairs be as two or three, and not a hundred or a thousand.\" (Henry David Thoreau).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 69: why does BP_StreetBlock spawn its houses from a Call In Editor event and not from the Construction Script? | Day 67: why is BP_Building's depth fixed at 2 bays?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Rule judge: the tutor gives eight asset names with their types (rock_big as StaticMesh; T_Paving_D as Texture2D; Mat_red as Material; plaster_ochre as MaterialInstanceConstant, and four more). I say what wanted_name returns for each, and which results still look wrong to a human.\n6. Do-along on today's build (rename_by_rules.py (lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - In the Output Log (Python) type `PREFIXES = {'StaticMesh': 'SM_', 'Texture2D': 'T_', 'Material': 'M_', 'MaterialInstanceConstant': 'MI_'}` and then `print(PREFIXES['Texture2D'])`. You see T_: the key gives you its value.\n   - Type `print('Blueprint' in PREFIXES)` and `print('StaticMesh' in PREFIXES)`. You see False, then True: in asks whether a key is in the dictionary.\n   - Type `name = 'rock_big'` and `print(name.startswith('SM_'))`. You see False.\n   - Type these lines with Shift+Enter between them, then press Enter: line 1 `def wanted_name(kind, name):`; line 2 (4 spaces) `if kind not in PREFIXES:`; line 3 (8 spaces) `return name`; line 4 (4 spaces) `if name.startswith(PREFIXES[kind]):`; line 5 (8 spaces) `return name`; line 6 (4 spaces) `return PREFIXES[kind] + name`. You see no output: the function is now defined.\n   - Type `print(wanted_name('StaticMesh', 'rock_big'), wanted_name('StaticMesh', 'SM_Bench'), wanted_name('Blueprint', 'BP_Building'))`. You see SM_rock_big SM_Bench BP_Building: each rule fires once, and only when it is needed.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "The dry run: a plan before any change", "uk": "Пробний запуск: план перед будь-якою зміною"}, "minutes": 40, "goals": [{"en": "Explain a dry run: the tool works out and prints every change it would make, and changes nothing.", "uk": "Поясни пробний запуск (dry run): інструмент обчислює й друкує кожну зміну, яку зробив би, і нічого не змінює."}, {"en": "Build a plan list of (old path, new path) pairs, each asset sorted into a subfolder by its type.", "uk": "Побудуй список плану з пар (старий шлях, новий шлях), де кожен асет розкладено в підпапку за його типом."}, {"en": "Read the plan line by line before you trust it.", "uk": "Прочитай план рядок за рядком, перш ніж йому довіряти."}], "doalong": [{"en": "Make the folder Content/Tools/Day72/Import. Select 8 of your kit's assets (2 meshes, 2 textures, 1 material, 2 instances and one more), drag them onto the Import folder and choose Copy Here; then rename the copies (F2) with messy names such as rock_big, wall_old, plaster_d, Mat_red and red_paint, leaving one copy correctly named. You see a messy folder, and your real kit untouched.", "uk": "Створи папку Content/Tools/Day72/Import. Вибери 8 асетів свого набору (2 моделі, 2 текстури, 1 матеріал, 2 інстанси й ще один), перетягни їх на папку Import і вибери Copy Here; потім перейменуй копії (F2) на захаращені назви на зразок rock_big, wall_old, plaster_d, Mat_red і red_paint, лишивши одну копію з правильною назвою. Ти бачиш захаращену папку, а твій справжній набір не зачеплено."}, {"en": "Create rename_by_rules.py in Content/Python with 6 lines: line 1 `import unreal`; line 2 `FOLDER = '/Game/Tools/Day72/Import'`; line 3 `DRY_RUN = True`; line 4 the PREFIXES dictionary from lesson 1; line 5 `SUBFOLDERS = {'StaticMesh': 'Meshes', 'Texture2D': 'Textures', 'Material': 'Materials', 'MaterialInstanceConstant': 'Materials'}`; line 6 `lib = unreal.EditorAssetLibrary` (a short name for a long one). Names in capitals are settings you change at the top. You see six lines; nothing runs yet.", "uk": "Створи rename_by_rules.py у Content/Python із 6 рядків: рядок 1 `import unreal`; рядок 2 `FOLDER = '/Game/Tools/Day72/Import'`; рядок 3 `DRY_RUN = True`; рядок 4 словник PREFIXES з уроку 1; рядок 5 `SUBFOLDERS = {'StaticMesh': 'Meshes', 'Texture2D': 'Textures', 'Material': 'Materials', 'MaterialInstanceConstant': 'Materials'}`; рядок 6 `lib = unreal.EditorAssetLibrary` (коротка назва для довгої). Назви великими літерами — це налаштування, які ти змінюєш угорі. Ти бачиш шість рядків; поки що нічого не виконується."}, {"en": "Add the plan, 11 lines: line 7 `plan = []`; line 8 `for path in lib.list_assets(FOLDER, recursive=False, include_folder=False):`; then, indented 4 spaces: line 9 `asset = lib.load_asset(path)`; line 10 `kind = asset.get_class().get_name()`; line 11 `if kind not in PREFIXES:`; line 12 (8 spaces) `continue` (skip to the next asset); line 13 `name = asset.get_name()`; line 14 `if not name.startswith(PREFIXES[kind]):`; line 15 (8 spaces) `name = PREFIXES[kind] + name`; line 16 `new = FOLDER + '/' + SUBFOLDERS[kind] + '/' + name`; line 17 `plan.append((path.split('.')[0], new))`. path.split('.')[0] cuts the .Name ending off the path; the two paths in round brackets travel together as a pair. You see 17 lines; save the file but do not run it yet.", "uk": "Додай план, 11 рядків: рядок 7 `plan = []`; рядок 8 `for path in lib.list_assets(FOLDER, recursive=False, include_folder=False):`; потім, з відступом 4 пробіли: рядок 9 `asset = lib.load_asset(path)`; рядок 10 `kind = asset.get_class().get_name()`; рядок 11 `if kind not in PREFIXES:`; рядок 12 (8 пробілів) `continue` (перейти до наступного асета); рядок 13 `name = asset.get_name()`; рядок 14 `if not name.startswith(PREFIXES[kind]):`; рядок 15 (8 пробілів) `name = PREFIXES[kind] + name`; рядок 16 `new = FOLDER + '/' + SUBFOLDERS[kind] + '/' + name`; рядок 17 `plan.append((path.split('.')[0], new))`. path.split('.')[0] відрізає закінчення .Name від шляху; два шляхи в круглих дужках ідуть разом як пара. Ти бачиш 17 рядків; збережи файл, але поки не запускай."}, {"en": "Add 3 lines to show the plan: line 18 `for old, new in plan:`; line 19 (4 spaces) `print('PLAN:', old, '->', new)`; line 20 `print(len(plan), 'changes planned; DRY_RUN =', DRY_RUN)`. Run it with File > Execute Python Script. You see one PLAN line per asset and the count, and the Content Browser has not changed.", "uk": "Додай 3 рядки, щоб показати план: рядок 18 `for old, new in plan:`; рядок 19 (4 пробіли) `print('PLAN:', old, '->', new)`; рядок 20 `print(len(plan), 'changes planned; DRY_RUN =', DRY_RUN)`. Запусти його через File > Execute Python Script. Ти бачиш один рядок PLAN на асет і кількість, а Content Browser не змінився."}, {"en": "Read each PLAN line aloud to the tutor: is the type right, the prefix right, the folder right? You see whether your rules match what a careful human would do.", "uk": "Прочитай кожен рядок PLAN уголос тьюторові: чи правильний тип, чи правильний префікс, чи правильна папка? Ти бачиш, чи збігаються твої правила з тим, що зробила б уважна людина."}], "play": {"en": "Plan reviewer: the tutor shows me five PLAN lines with one hidden mistake (a texture going to Meshes, a double prefix such as SM_SM_, or a Blueprint being renamed). I find it and say which rule to fix.", "uk": "Рецензент плану: тьютор показує мені п'ять рядків PLAN з однією прихованою помилкою (текстура йде в Meshes, подвійний префікс на зразок SM_SM_ або перейменовується Blueprint). Я знаходжу її й кажу, яке правило виправити."}, "video": {"search": "unreal engine python rename assets list_assets dry run"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: The dry run: a plan before any change (Day 72, lesson 2 of 4).\nToday's build: rename_by_rules.py and set_nanite.py in IslandCourse/Content/Python, tested on a messy copy of your kit in Content/Tools/Day72/Import.\nEarlier today I already did: lesson 1 (Dictionaries and decisions). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Explain a dry run: the tool works out and prints every change it would make, and changes nothing.\n2. Build a plan list of (old path, new path) pairs, each asset sorted into a subfolder by its type.\n3. Read the plan line by line before you trust it.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Plan reviewer: the tutor shows me five PLAN lines with one hidden mistake (a texture going to Meshes, a double prefix such as SM_SM_, or a Blueprint being renamed). I find it and say which rule to fix.\n4. Do-along on today's build (rename_by_rules.py (lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Make the folder Content/Tools/Day72/Import. Select 8 of your kit's assets (2 meshes, 2 textures, 1 material, 2 instances and one more), drag them onto the Import folder and choose Copy Here; then rename the copies (F2) with messy names such as rock_big, wall_old, plaster_d, Mat_red and red_paint, leaving one copy correctly named. You see a messy folder, and your real kit untouched.\n   - Create rename_by_rules.py in Content/Python with 6 lines: line 1 `import unreal`; line 2 `FOLDER = '/Game/Tools/Day72/Import'`; line 3 `DRY_RUN = True`; line 4 the PREFIXES dictionary from lesson 1; line 5 `SUBFOLDERS = {'StaticMesh': 'Meshes', 'Texture2D': 'Textures', 'Material': 'Materials', 'MaterialInstanceConstant': 'Materials'}`; line 6 `lib = unreal.EditorAssetLibrary` (a short name for a long one). Names in capitals are settings you change at the top. You see six lines; nothing runs yet.\n   - Add the plan, 11 lines: line 7 `plan = []`; line 8 `for path in lib.list_assets(FOLDER, recursive=False, include_folder=False):`; then, indented 4 spaces: line 9 `asset = lib.load_asset(path)`; line 10 `kind = asset.get_class().get_name()`; line 11 `if kind not in PREFIXES:`; line 12 (8 spaces) `continue` (skip to the next asset); line 13 `name = asset.get_name()`; line 14 `if not name.startswith(PREFIXES[kind]):`; line 15 (8 spaces) `name = PREFIXES[kind] + name`; line 16 `new = FOLDER + '/' + SUBFOLDERS[kind] + '/' + name`; line 17 `plan.append((path.split('.')[0], new))`. path.split('.')[0] cuts the .Name ending off the path; the two paths in round brackets travel together as a pair. You see 17 lines; save the file but do not run it yet.\n   - Add 3 lines to show the plan: line 18 `for old, new in plan:`; line 19 (4 spaces) `print('PLAN:', old, '->', new)`; line 20 `print(len(plan), 'changes planned; DRY_RUN =', DRY_RUN)`. Run it with File > Execute Python Script. You see one PLAN line per asset and the count, and the Content Browser has not changed.\n   - Read each PLAN line aloud to the tutor: is the type right, the prefix right, the folder right? You see whether your rules match what a careful human would do.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Making it real, safely", "uk": "Зробити це справжнім, безпечно"}, "minutes": 40, "goals": [{"en": "Ask before changing anything with unreal.EditorDialog.show_message and a Yes/No answer; No is always safe.", "uk": "Питай перед будь-якою зміною через unreal.EditorDialog.show_message і відповідь Yes/No; No завжди безпечне."}, {"en": "Rename and move assets with EditorAssetLibrary (make_directory, does_asset_exist, rename_asset), never by moving files in Windows Explorer, which breaks references.", "uk": "Перейменовуй і переміщуй асети через EditorAssetLibrary (make_directory, does_asset_exist, rename_asset), ніколи не переміщуючи файли у Windows Explorer, що ламає посилання."}, {"en": "Finish by hand: Fix Up Redirectors, then Save All after you have looked.", "uk": "Закінчуй вручну: Fix Up Redirectors, потім Save All після того, як подивишся."}], "doalong": [{"en": "Add 11 lines at the end: line 21 `if not DRY_RUN and plan:`; line 22 (4 spaces) `msg = str(len(plan)) + ' assets will be renamed or moved. Go on?'`; line 23 (4) `answer = unreal.EditorDialog.show_message('Rename by rules', msg, unreal.AppMsgType.YES_NO)`; line 24 (4) `if answer == unreal.AppReturnType.YES:`; line 25 (8) `for old, new in plan:`; line 26 (12) `if lib.does_asset_exist(new):`; line 27 (16) `print('SKIPPED, name taken:', new)`; line 28 (12) `else:`; line 29 (16) `lib.make_directory(new.rsplit('/', 1)[0])`; line 30 (16) `lib.rename_asset(old, new)`; line 31 (8) `print('Done. Fix up redirectors, then Save All.')`. new.rsplit('/', 1)[0] keeps the folder part of the new path. You see 31 lines; save the file without running it.", "uk": "Додай 11 рядків наприкінці: рядок 21 `if not DRY_RUN and plan:`; рядок 22 (4 пробіли) `msg = str(len(plan)) + ' assets will be renamed or moved. Go on?'`; рядок 23 (4) `answer = unreal.EditorDialog.show_message('Rename by rules', msg, unreal.AppMsgType.YES_NO)`; рядок 24 (4) `if answer == unreal.AppReturnType.YES:`; рядок 25 (8) `for old, new in plan:`; рядок 26 (12) `if lib.does_asset_exist(new):`; рядок 27 (16) `print('SKIPPED, name taken:', new)`; рядок 28 (12) `else:`; рядок 29 (16) `lib.make_directory(new.rsplit('/', 1)[0])`; рядок 30 (16) `lib.rename_asset(old, new)`; рядок 31 (8) `print('Done. Fix up redirectors, then Save All.')`. new.rsplit('/', 1)[0] лишає частину-папку нового шляху. Ти бачиш 31 рядок; збережи файл, не запускаючи."}, {"en": "Set DRY_RUN = False, save, and rerun from File > Recent Python Scripts. A window asks Go on?; click No. You see nothing change: No works as a second dry run.", "uk": "Встанови DRY_RUN = False, збережи й перезапусти через File > Recent Python Scripts. Вікно питає Go on?; клацни No. Ти бачиш, що нічого не змінюється: No працює як другий пробний запуск."}, {"en": "Run it again and click Yes. You see Meshes, Textures and Materials folders appear in Import with prefixed names. Open a material instance: its textures are still connected, because Unreal updated every reference.", "uk": "Запусти знову й клацни Yes. Ти бачиш, що в Import з'являються папки Meshes, Textures і Materials з назвами з префіксами. Відкрий інстанс матеріалу: його текстури й досі підключені, бо Unreal оновив кожне посилання."}, {"en": "Right-click the Import folder > Fix Up Redirectors (in some versions: Update Redirector References), then File > Save All. You see no unsaved stars.", "uk": "Клацни правою кнопкою на папці Import > Fix Up Redirectors (в деяких версіях: Update Redirector References), потім File > Save All. Ти бачиш, що зірочок незбережених змін немає."}, {"en": "Run once more. You see 0 changes planned: a good batch tool does nothing the second time.", "uk": "Запусти ще раз. Ти бачиш заплановано 0 змін: добрий пакетний інструмент вдруге нічого не робить."}], "play": {"en": "Undo or not: the tutor lists six changes (Python renames assets; I move actors in the level; I delete a file in Windows Explorer; Save All; Nanite switched on for a mesh; 50 lamps placed inside one transaction). I say which ones Ctrl+Z can bring back, and why a dry run matters for the others.", "uk": "Скасувати чи ні: тьютор перелічує шість змін (Python перейменовує асети; я пересуваю акторів на рівні; я видаляю файл у Windows Explorer; Save All; Nanite ввімкнено для моделі; 50 ліхтарів розміщено в одній транзакції). Я кажу, які з них Ctrl+Z може повернути, і чому пробний запуск важливий для решти."}, "video": {"search": "unreal engine python editordialog rename_asset"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't ma

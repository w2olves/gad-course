<script id="data" type="application/json">{"learner": "ib-misha-873821eb", "learnerName": {"en": "Misha", "uk": "Міша"}, "day": 65, "week": 13, "total": 110, "title": {"en": "Boss: BP_Promenade, a waterfront laid by one spline", "uk": "Бос: BP_Promenade, набережна, прокладена одним сплайном"}, "theme": {"en": "Week 13: Blueprints for world builders", "uk": "Тиждень 13: Blueprint для творців світів"}, "build": {"item": {"en": "BP_Promenade: one spline along your quay edge that lays paving, a railing on the sea side, lamps with glowing heads, and benches and bins chosen by a seed", "uk": "BP_Promenade: один сплайн уздовж краю твого причалу, що прокладає плитку, поручні з боку моря, ліхтарі зі світними головками, а також лавки й смітники, обрані зерном"}, "why": {"en": "A promenade is a whole street dressed along one line, and on a real waterfront that line bends with every quay. One tool that lays all of it keeps spacing, heights and style consistent over hundreds of metres, and redraws in seconds when the plan changes. This is the kind of tool level-art departments build first on a project, because it pays back on every map.", "uk": "Набережна — це ціла вулиця, оформлена вздовж однієї лінії, а на справжній набережній ця лінія згинається разом з усіма причалами. Один інструмент, що прокладає все це, тримає однаковими проміжки, висоти й стиль на сотні метрів і перемальовується за секунди, коли план змінюється. Саме такі інструменти відділи рівнів будують у проєкті першими, бо вони окуповуються на кожній мапі."}, "where": {"en": "Content/Tools/Day65/L_Day65 for testing, then at least 100 m of your island's waterfront (district 1's quay, or your own coast).", "uk": "Content/Tools/Day65/L_Day65 для тестування, а потім щонайменше 100 м набережної твого острова (причал району 1 або твоє власне узбережжя)."}, "spec": [{"en": "BP_Promenade in Content/Tools/Blueprints, made from a copy of BP_SplineFence: the spline marks the quay edge; Posts and Rails stand on it; Paving, Lamps, Benches and Bins are Instanced Static Mesh components.", "uk": "BP_Promenade у Content/Tools/Blueprints, зроблений із копії BP_SplineFence: сплайн позначає край причалу; Posts і Rails стоять на ньому; Paving, Lamps, Benches і Bins — компоненти Instanced Static Mesh."}, {"en": "Settings (Instance Editable, Category Tool, ranges and tooltips): Seed, Path Width (cm, default 400), Inland Side (-1 to 1, default 1), Tile Length (cm, default 400, kept equal to Path Width so the paving tiles stay square), Lamp Spacing (cm, default 2000), Furniture Spacing (cm, default 800), Bench Turn (degrees, 0 to 360), plus the fence's Spacing, Post Scale and Rail Height.", "uk": "Налаштування (Instance Editable, категорія Tool, діапазони й підказки): Seed, Path Width (см, за замовчуванням 400), Inland Side (від -1 до 1, за замовчуванням 1), Tile Length (см, за замовчуванням 400, дорівнює Path Width, щоб плитка лишалася квадратною), Lamp Spacing (см, за замовчуванням 2000), Furniture Spacing (см, за замовчуванням 800), Bench Turn (градуси, від 0 до 360), плюс Spacing, Post Scale і Rail Height паркану."}, {"en": "Side offsets with Transform Location: paving centred Path Width / 2 inland, lamps 50 cm inland of the railing, benches and bins 80 cm in from the inland edge, benches facing the sea.", "uk": "Бокові зсуви через Transform Location: плитка центрована на Path Width / 2 углиб суходолу, ліхтарі на 50 см углиб від поручнів, лавки й смітники на 80 см від краю з боку суходолу, лавки дивляться на море."}, {"en": "Lamps are instances of SM_LampPost with MI_LampGlow on the lantern slot, so MPC_World Night lights every lantern at once; real light comes from a few BP_StreetLamp actors at key spots (Silver).", "uk": "Ліхтарі — це інстанси SM_LampPost із MI_LampGlow на слоті ліхтаря, тож Night з MPC_World запалює кожен ліхтар одразу; справжнє світло дають кілька акторів BP_StreetLamp у ключових місцях (Срібло)."}, {"en": "Furniture: for each slot the Stream picks bench, bench, bin or nothing (Switch on Int, 0 to 3); the same Seed gives the same promenade.", "uk": "Меблі: для кожного слота Stream обирає лавку, лавку, смітник або нічого (Switch on Int, від 0 до 3); те саме Seed дає ту саму набережну."}, {"en": "A tidy graph: one function per part (Lay Railing, Lay Paving, Lay Lamps, Lay Furniture), comment boxes and no Tick; nothing floating along the waterfront; three locked shots (day, dusk, night), stat unit at night in boss_day65.md and a 60-second flight.", "uk": "Охайний граф: одна функція на частину (Lay Railing, Lay Paving, Lay Lamps, Lay Furniture), коментарі й жодного Tick; нічого не висить уздовж набережної; три зафіксовані кадри (день, присмерк, ніч), stat unit уночі в boss_day65.md і 60-секундний проліт."}], "piece1": "The plan, the side offsets and a tidy graph (micro-lessons)", "piece2": {"en": "The full promenade on your waterfront, with lamps, furniture and the proof, on your own", "uk": "Повна набережна на твоєму узбережжі з ліхтарями, меблями й доказом, самостійно"}, "steps": [{"text": {"en": "Start the clock. Write your plan with times in boss_day65.md (the biggest risk first), and take before_day65.png of your waterfront from a bookmark 30 m up. Check: the plan fits in 4 hours and the picture is saved.", "uk": "Запусти годинник. Напиши свій план із часом у boss_day65.md (найбільший ризик першим) і зроби before_day65.png своєї набережної із закладки на висоті 30 м. Перевірка: план вкладається в 4 години, а картинку збережено."}, "lesson": 1}, {"text": {"en": "Measure a real promenade from two reference photos: path width, lamp spacing, bench spacing and railing height. Write the four numbers in boss_day65.md with the photo each came from, and credit the photos in credits.md. Check: four numbers, each with its photo.", "uk": "Виміряй справжню набережну за двома еталонними фото: ширину доріжки, крок ліхтарів, крок лавок і висоту поручнів. Запиши чотири числа в boss_day65.md із фото, звідки кожне взято, і вкажи фото в credits.md. Перевірка: чотири числа, кожне зі своїм фото."}, "lesson": 1}, {"text": {"en": "Open BP_Promenade (made in lesson 2) and add Seed, Path Width, Tile Length, Furniture Spacing and Bench Turn with ranges and tooltips; at the top of the Construction Script add Make Random Stream (Seed) > Set Stream. Check: it compiles, and the railing and the lesson's lamps still work.", "uk": "Відкрий BP_Promenade (зроблений на уроці 2) і додай Seed, Path Width, Tile Length, Furniture Spacing і Bench Turn з діапазонами й підказками; на початку Construction Script додай Make Random Stream (Seed) > Set Stream. Перевірка: компілюється, а поручні та ліхтарі з уроку далі працюють."}, "lesson": "D63.1"}, {"text": {"en": "Check the tidy graph from lesson 3: Set Stream > Clear Instances > Lay Railing > Lay Paving > Lay Lamps > Lay Furniture, and give every component you add today its own Clear Instances there. Check: the Construction Script reads as one line of named nodes, and the railing looks the same as on Day 62.", "uk": "Звір охайний граф з уроку 3: Set Stream > Clear Instances > Lay Railing > Lay Paving > Lay Lamps > Lay Furniture, і дай кожному компоненту, який додаєш сьогодні, власний Clear Instances там. Перевірка: Construction Script читається як один рядок іменованих вузлів, а поручні виглядають так само, як у День 62."}, "lesson": 3}, {"text": {"en": "Lay Paving: add an Instanced Static Mesh Paving (mesh /Engine/BasicShapes/Plane) with MI_Paving_Prom, a child of MI_Paving_2m with Tiling 2; For Loop from 0 to Truncate(Length / Tile Length) minus 1; at distance (Index + 0.5) x Tile Length, Transform Location of (0, Path Width / 2 x Inland Side, 2); upright rotation as on Day 62; Scale (Tile Length / 100 x 1.02, Path Width / 100, 1); Paving: Add Instance. Each Plane shows the texture once, so keep Tile Length equal to Path Width (square tiles) and set Tiling to Path Width / 200 (2 for a 4 m path) to keep 2 m paving squares. Check: a continuous path beside the railing, with no gaps and no stretched squares visible from 10 m.", "uk": "Lay Paving: додай Instanced Static Mesh Paving (модель /Engine/BasicShapes/Plane) з MI_Paving_Prom, дочірнім від MI_Paving_2m з Tiling 2; For Loop від 0 до Truncate(Length / Tile Length) мінус 1; на відстані (Index + 0.5) x Tile Length, Transform Location від (0, Path Width / 2 x Inland Side, 2); вертикальний поворот, як у День 62; Scale (Tile Length / 100 x 1.02, Path Width / 100, 1); Paving: Add Instance. Кожен Plane показує текстуру один раз, тож тримай Tile Length рівним Path Width (квадратна плитка) і встанови Tiling на Path Width / 200 (2 для доріжки 4 м), щоб плитка лишалася квадратами по 2 м. Перевірка: суцільна доріжка поруч із поручнями, без проміжків і без розтягнутих квадратів, видимих з 10 м."}, "lesson": 2}, {"text": {"en": "Lay Lamps: check the lesson's version (every Lamp Spacing, Transform Location of (0, 50 x Inland Side, 0), upright rotation) and put MI_LampGlow in the Lamps component's lantern slot (Details > Materials). Check: lamps stand evenly just inland of the railing, and they glow when MPC_World Night is 1.", "uk": "Lay Lamps: звір версію з уроку (кожні Lamp Spacing, Transform Location від (0, 50 x Inland Side, 0), вертикальний поворот) і постав MI_LampGlow у слот ліхтаря компонента Lamps (Details > Materials). Перевірка: ліхтарі стоять рівно трохи углиб від поручнів і світяться, коли Night у MPC_World дорівнює 1."}, "lesson": 2}, {"text": {"en": "Lay Furniture: add Instanced Static Mesh components Benches (SM_Bench) and Bins (SM_Bin); a slot every Furniture Spacing, starting half a spacing in; Random Integer in Range from Stream (0, 3) into Switch on Int: 0 and 1 add a bench, 2 a bin, 3 nothing; place them at Transform Location of (0, (Path Width - 80) x Inland Side, 0) and add Bench Turn to the Yaw so benches face the sea. Check: a believable rhythm of benches and bins, and Seed 1 always gives the same one.", "uk": "Lay Furniture: додай компоненти Instanced Static Mesh Benches (SM_Bench) і Bins (SM_Bin); слот кожні Furniture Spacing, починаючи з пів кроку; Random Integer in Range from Stream (0, 3) у Switch on Int: 0 і 1 додають лавку, 2 смітник, 3 нічого; розміщуй їх у Transform Location від (0, (Path Width - 80) x Inland Side, 0) і додай Bench Turn до Yaw, щоб лавки дивилися на море. Перевірка: правдоподібний ритм лавок і смітників, а Seed 1 завжди дає той самий."}, "lesson": "D63.3"}, {"text": {"en": "Draw the spline along at least 100 m of your island's quay edge (a point every 10 to 20 m, snapped to the floor; Linear points at sharp corners). Check: from 30 m the railing stands on the quay edge and the path runs inland of it all the way.", "uk": "Прокресли сплайн уздовж щонайменше 100 м краю причалу твого острова (точка кожні 10–20 м, прив'язана до підлоги; точки Linear на різких кутах). Перевірка: з 30 м поручні стоять на краю причалу, а доріжка йде углиб від нього на всю довжину."}, "lesson": "D62.4"}, {"text": {"en": "Grounding pass: fly along the promenade 5 m up and fix any floating tile, lamp or bench by moving or adding spline points; if the whole path lands in the sea, set Inland Side to -1. Check: nothing floats or sinks, and the path never runs over water.", "uk": "Прохід із заземленням: прольоти вздовж набережної на висоті 5 м і виправ кожну плитку, ліхтар чи лавку, що висять, пересуваючи або додаючи точки сплайна; якщо вся доріжка опиняється в морі, встанови Inland Side на -1. Перевірка: ніщо не висить і не занурюється, а доріжка ніколи не йде над водою."}, "lesson": 2}, {"text": {"en": "Night: lower the sun below the horizon and click Update Light on one of your BP_StreetLamp actors (or set MPC_World Night to 1). Check: every lamp head along the promenade glows.", "uk": "Ніч: опусти сонце під горизонт і натисни Update Light на одному зі своїх акторів BP_StreetLamp (або встанови Night у MPC_World на 1). Перевірка: кожна головка ліхтаря вздовж набережної світиться."}, "lesson": "D64.3"}, {"text": {"en": "Shots and numbers: three locked Cine Cameras D1 (day, 30 m), D2 (dusk, 10 m) and D3 (night, 60 m), HighResShot 1920x1080 from each; stat unit at D3 into boss_day65.md; then a 60-second flight along the promenade. Check: promenade_D1.png to promenade_D3.png, Frame and GPU in ms, and flythrough_day65.mp4 are saved.", "uk": "Кадри й числа: три зафіксовані Cine Camera D1 (день, 30 м), D2 (присмерк, 10 м) і D3 (ніч, 60 м), HighResShot 1920x1080 з кожної; stat unit у D3 в boss_day65.md; потім 60-секундний проліт уздовж набережної. Перевірка: promenade_D1.png — promenade_D3.png, Frame і GPU у мс та flythrough_day65.mp4 збережено."}, "lesson": 1}, {"text": {"en": "Self-review: score the five-line rubric, go through tool-review-checklist.md, ask the tutor for three see-why-fix notes, fix the cheapest one and choose your tier. Check: self_review_day65.md has five scores, three notes, one fix and your tier.", "uk": "Самоперевірка: оціни п'ять рядків рубрики, пройди tool-review-checklist.md, попроси в тьютора три нотатки «бачу, чому, як виправити», виправ найдешевшу й обери свій рівень. Перевірка: self_review_day65.md має п'ять оцінок, три нотатки, одне виправлення й твій рівень."}, "lesson": 4}, {"text": {"en": "Click Copy the day report, paste it into a new tutor chat, answer its questions and save its answer as summary.md. Check: summary.md is in today's Work folder with Made, To look at, Hours and To revisit filled in.", "uk": "Натисни Copy the day report, встав його в новий чат із тьютором, дай відповіді на його запитання й збережи його відповідь як summary.md. Перевірка: summary.md лежить у сьогоднішній папці Work із заповненими Made, To look at, Hours і To revisit."}, "lesson": 4}], "boss": [{"en": "Bronze: BP_Promenade lays paving, a railing, lamps and seeded benches and bins along at least 100 m of your waterfront, nothing floats, and you have three locked shots, stat unit at night and a 60-second flight, inside 4 hours.", "uk": "Бронза: BP_Promenade прокладає плитку, поручні, ліхтарі та лавки й смітники із зерном уздовж щонайменше 100 м твоєї набережної, ніщо не висить, і ти маєш три зафіксовані кадри, stat unit уночі та 60-секундний проліт, у межах 4 годин."}, {"en": "Silver: the promenade follows the real curve of your quay with no gap visible from 30 m, its spacings match your photo measurements, four BP_StreetLamp actors give real light at key spots (steps, a landmark) and switch with the sun, and Frame stays under 16.6 ms at night.", "uk": "Срібло: набережна йде за справжнім вигином твого причалу без проміжків, видимих з 30 м, її кроки збігаються з твоїми вимірами за фото, чотири актори BP_StreetLamp дають справжнє світло в ключових місцях (сходи, пам'ятка) і перемикаються разом із сонцем, а Frame уночі лишається під 16.6 мс."}, {"en": "Gold: add Keep Clear From and Keep Clear To (distances in cm) so no lamp or furniture lands where drones cross the promenade: a Branch skips any slot whose distance is at least Keep Clear From AND at most Keep Clear To; show the clear gap from 30 m, and finish inside 3 hours.", "uk": "Золото: додай Keep Clear From і Keep Clear To (відстані в см), щоб жоден ліхтар чи меблі не опинялися там, де дрони перетинають набережну: Branch пропускає кожен слот, чия відстань не менша за Keep Clear From І не більша за Keep Clear To; покажи вільний проміжок з 30 м і закінчи в межах 3 годин."}], "assets": ["techart/tool-review-checklist.md", "techart/code-style.md"]}, "lessons": [{"title": {"en": "Boss briefing: plan, measure, prove (micro-lesson)", "uk": "Брифінг боса: плануй, вимірюй, доводь (мікроурок)"}, "minutes": 40, "goals": [{"en": "Plan a timed build: the biggest risk first (the side offsets), then the parts, the proof last.", "uk": "Сплануй виконання на час: найбільший ризик першим (бокові зсуви), потім частини, доказ останнім."}, {"en": "Measure a real promenade from reference photos using things of known size: path width, lamp and bench spacing, railing height.", "uk": "Виміряй справжню набережну за еталонними фото, використовуючи речі відомого розміру: ширина доріжки, крок ліхтарів і лавок, висота поручнів."}, {"en": "Plan the proof: three locked Cine Cameras with HighResShot 1920x1080, stat unit at night and a 60-second flight.", "uk": "Сплануй доказ: три зафіксовані Cine Camera з HighResShot 1920x1080, stat unit уночі та 60-секундний проліт."}], "doalong": [{"en": "Open boss_day65.md and copy in the build steps as a checklist. You see 13 lines.", "uk": "Відкрий boss_day65.md і скопіюй туди кроки побудови як контрольний список. Ти бачиш 13 рядків."}, {"en": "Give each line a time; the total must be under 4 hours. You see your plan with times.", "uk": "Дай кожному рядку час; загальна сума має бути менше 4 годин. Ти бачиш свій план із часом."}, {"en": "Find two daylight photos of a real waterfront promenade on Wikimedia Commons and estimate the four numbers from things of known size (a bench is about 1.8 m long, an adult about 1.7 m tall). You see four numbers in boss_day65.md, each with its photo link.", "uk": "Знайди два денні фото справжньої набережної на Wikimedia Commons і оціни чотири числа за речами відомого розміру (лавка завдовжки близько 1,8 м, дорослий заввишки близько 1,7 м). Ти бачиш чотири числа в boss_day65.md, кожне із посиланням на своє фото."}, {"en": "Place three Cine Cameras D1 to D3 over your waterfront (30 m, 10 m and 60 m up) and lock each one (right-click > Transform > Lock Actor Movement). You see three locked cameras ready for the end of the day.", "uk": "Розмісти три Cine Camera D1 — D3 над своєю набережною (на висоті 30 м, 10 м і 60 м) і зафіксуй кожну (клацни правою кнопкою > Transform > Lock Actor Movement). Ти бачиш три зафіксовані камери, готові до кінця дня."}], "play": {"en": "Producer: the tutor plays a studio producer; I defend my plan line by line, and it cuts the weakest line each round.", "uk": "Продюсер: тьютор грає студійного продюсера; я захищаю свій план рядок за рядком, а він щоразу викреслює найслабший рядок."}, "video": {"search": "unreal engine 5 spline blueprint promenade path tool"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Boss briefing: plan, measure, prove (micro-lesson) (Day 65, lesson 1 of 4).\nToday's build: BP_Promenade: one spline along your quay edge that lays paving, a railing on the sea side, lamps with glowing heads, and benches and bins chosen by a seed.\n\nBy the end of this lesson I can:\n1. Plan a timed build: the biggest risk first (the side offsets), then the parts, the proof last.\n2. Measure a real promenade from reference photos using things of known size: path width, lamp and bench spacing, railing height.\n3. Plan the proof: three locked Cine Cameras with HighResShot 1920x1080, stat unit at night and a 60-second flight.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (This week you built BP_SplineFence, BP_SplineScatter and BP_StreetLamp with MPC_World: fences, seeded scatters and lamps that know the sun.), what I will learn today (It is Boss day: you join them into BP_Promenade and lay a whole waterfront with one spline.), encourage me (Lock in Bronze first, then grow; a waterfront drawn with a single line is a real tool, and you built every part of it this week.), and share today's quote: \"It is possible to fly without motors, but not without knowledge and skill.\" (Wilbur Wright).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 62: a 12 m spline with Spacing 300: how many posts and how many rails? | Day 59: why does every free pack in your world go into credits.md?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Producer: the tutor plays a studio producer; I defend my plan line by line, and it cuts the weakest line each round.\n6. Do-along on today's build (The plan, the side offsets and a tidy graph (micro-lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Open boss_day65.md and copy in the build steps as a checklist. You see 13 lines.\n   - Give each line a time; the total must be under 4 hours. You see your plan with times.\n   - Find two daylight photos of a real waterfront promenade on Wikimedia Commons and estimate the four numbers from things of known size (a bench is about 1.8 m long, an adult about 1.7 m tall). You see four numbers in boss_day65.md, each with its photo link.\n   - Place three Cine Cameras D1 to D3 over your waterfront (30 m, 10 m and 60 m up) and lock each one (right-click > Transform > Lock Actor Movement). You see three locked cameras ready for the end of the day.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Side offsets: Transform Location (micro-lesson)", "uk": "Бокові зсуви: Transform Location (мікроурок)"}, "minutes": 40, "goals": [{"en": "Explain a local offset: a point measured in the spline's own frame at a distance (X along the path, Y to the side, Z up).", "uk": "Поясни локальний зсув: точка, виміряна у власній системі сплайна на відстані (X уздовж шляху, Y убік, Z угору)."}, {"en": "Use Transform Location to turn that local point into the actor's space, so things stay beside the path around every bend.", "uk": "Використай Transform Location, щоб перетворити цю локальну точку на простір актора, щоб речі лишалися поруч зі шляхом на кожному вигині."}, {"en": "Choose the land side with Inland Side (1 or -1) instead of redrawing the spline.", "uk": "Обери бік суходолу через Inland Side (1 або -1) замість перемальовування сплайна."}], "doalong": [{"en": "In Content/Tools/Blueprints right-click BP_SplineFence > Duplicate, name the copy BP_Promenade and open it. Add a Float Lamp Spacing (default 2000, ranges 500 to 5000, Instance Editable, Category Tool); click + next to Functions to make Lay Lamps, and inside it build a For Loop from 0 to Truncate(Length / Lamp Spacing) with Get Transform at Distance Along Spline (Local) at Index x Lamp Spacing. Call Lay Lamps at the end of the Construction Script. You see the familiar loop.", "uk": "У Content/Tools/Blueprints клацни правою кнопкою на BP_SplineFence > Duplicate, назви копію BP_Promenade і відкрий. Додай Float Lamp Spacing (за замовчуванням 2000, діапазони від 500 до 5000, Instance Editable, категорія Tool); натисни + поруч із Functions, щоб створити Lay Lamps, а всередині збудуй For Loop від 0 до Truncate(Length / Lamp Spacing) із Get Transform at Distance Along Spline (Local) на Index x Lamp Spacing. Виклич Lay Lamps наприкінці Construction Script. Ти бачиш знайомий цикл."}, {"en": "Drag from the Transform and add Transform Location; plug a Make Vector (0, 300, 0) into its Location pin. If Transform Location is not offered, use Get Right Vector at Distance Along Spline, multiply it by 300 and add it to Get Location at Distance Along Spline. You see a node that returns a point 3 m to the side of the curve.", "uk": "Потягни від Transform і додай Transform Location; підключи Make Vector (0, 300, 0) до його піна Location. Якщо Transform Location не пропонується, використай Get Right Vector at Distance Along Spline, помнож його на 300 і додай до Get Location at Distance Along Spline. Ти бачиш вузол, що повертає точку за 3 м убік від кривої."}, {"en": "Add an Instanced Static Mesh Lamps with SM_LampPost (and Clear Instances for it at the start of the script); Lamps: Add Instance at that point with the upright rotation from Day 62 (Break Transform > Break Rotator > Make Rotator with Yaw only). Compile and bend the spline. You see a row of lamps 3 m beside the railing that follows every bend.", "uk": "Додай Instanced Static Mesh Lamps з SM_LampPost (і Clear Instances для нього на початку скрипта); Lamps: Add Instance у цій точці з вертикальним поворотом з Дня 62 (Break Transform > Break Rotator > Make Rotator лише з Yaw). Натисни Compile і зігни сплайн. Ти бачиш ряд ліхтарів за 3 м від поручнів, що йде за кожним вигином."}, {"en": "Add a Float Inland Side (default 1, ranges -1 to 1, Instance Editable, Category Tool), multiply the 300 by it, compile, and set Inland Side to -1 on a placed copy. You see the row jump to the other side: use this when your promenade lands in the sea.", "uk": "Додай Float Inland Side (за замовчуванням 1, діапазони від -1 до 1, Instance Editable, категорія Tool), помнож 300 на нього, натисни Compile і встанови Inland Side на -1 на розміщеній копії. Ти бачиш, як ряд перестрибує на інший бік: користуйся цим, коли твоя набережна опиняється в морі."}, {"en": "Ask the tutor what happens to a 3 m offset on a tight bend (the inner side bunches up, the outer side spreads out) and how adding spline points helps. Then set the offset back to 50. You see the lamps return to 50 cm beside the railing.", "uk": "Запитай тьютора, що буває із зсувом 3 м на крутому вигині (внутрішній бік стискається, зовнішній розтягується) і як допомагає додавання точок сплайна. Потім поверни зсув на 50. Ти бачиш, що ліхтарі повертаються на 50 см від поручнів."}], "play": {"en": "Offset sketch: the tutor gives me a spline frame and three local points (0, 200, 0; 0, -250, 0; 0, 0, 300). I say where each lands: along, sea side or land side, or up.", "uk": "Ескіз зсуву: тьютор дає мені систему сплайна й три локальні точки (0, 200, 0; 0, -250, 0; 0, 0, 300). Я кажу, куди потрапляє кожна: уздовж, бік моря чи бік суходолу, або вгору."}, "video": {"search": "unreal engine 5 transform location blueprint spline offset"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Side offsets: Transform Location (micro-lesson) (Day 65, lesson 2 of 4).\nToday's build: BP_Promenade: one spline along your quay edge that lays paving, a railing on the sea side, lamps with glowing heads, and benches and bins chosen by a seed.\nEarlier today I already did: lesson 1 (Boss briefing: plan, measure, prove (micro-lesson)). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Explain a local offset: a point measured in the spline's own frame at a distance (X along the path, Y to the side, Z up).\n2. Use Transform Location to turn that local point into the actor's space, so things stay beside the path around every bend.\n3. Choose the land side with Inland Side (1 or -1) instead of redrawing the spline.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Offset sketch: the tutor gives me a spline frame and three local points (0, 200, 0; 0, -250, 0; 0, 0, 300). I say where each lands: along, sea side or land side, or up.\n4. Do-along on today's build (The plan, the side offsets and a tidy graph (micro-lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - In Content/Tools/Blueprints right-click BP_SplineFence > Duplicate, name the copy BP_Promenade and open it. Add a Float Lamp Spacing (default 2000, ranges 500 to 5000, Instance Editable, Category Tool); click + next to Functions to make Lay Lamps, and inside it build a For Loop from 0 to Truncate(Length / Lamp Spacing) with Get Transform at Distance Along Spline (Local) at Index x Lamp Spacing. Call Lay Lamps at the end of the Construction Script. You see the familiar loop.\n   - Drag from the Transform and add Transform Location; plug a Make Vector (0, 300, 0) into its Location pin. If Transform Location is not offered, use Get Right Vector at Distance Along Spline, multiply it by 300 and add it to Get Location at Distance Along Spline. You see a node that returns a point 3 m to the side of the curve.\n   - Add an Instanced Static Mesh Lamps with SM_LampPost (and Clear Instances for it at the start of the script); Lamps: Add Instance at that point with the upright rotation from Day 62 (Break Transform > Break Rotator > Make Rotator with Yaw only). Compile and bend the spline. You see a row of lamps 3 m beside the railing that follows every bend.\n   - Add a Float Inland Side (default 1, ranges -1 to 1, Instance Editable, Category Tool), multiply the 300 by it, compile, and set Inland Side to -1 on a placed copy. You see the row jump to the other side: use this when your promenade lands in the sea.\n   - Ask the tutor what happens to a 3 m offset on a tight bend (the inner side bunches up, the outer side spreads out) and how adding spline points helps. Then set the offset back to 50. You see the lamps return to 50 cm beside the railing.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Big graphs stay readable (micro-lesson)", "uk": "Великі графи лишаються читабельними (мікроурок)"}, "minutes": 40, "goals": [{"en": "Split a long Construction Script into functions with Collapse to Function, one function per part.", "uk": "Розбий довгий Construction Script на функції через Collapse to Function, по одній функції на частину."}, {"en": "Label graphs with comment boxes (select nodes, press C) and keep the white chain running left to right.", "uk": "Підписуй графи коментарями (виділи вузли, натисни C) і тримай білий ланцюжок зліва направо."}, {"en": "Check a tool against the tool-review checklist: names, tooltips, ranges, defaults, no Tick.", "uk": "Перевір інструмент за tool-review-checklist: назви, підказки, діапазони, значення за замовчуванням, без Tick."}], "doalong": [{"en": "Select the post loop and the rail loop with all their nodes, right-click > Collapse to Function, and name it Lay Railing. Compile. You see one purple node where the loops were, and the fence looks the same.", "uk": "Виділи цикл стовпів і цикл рейок з усіма їхніми вузлами, клацни правою кнопкою > Collapse to Function і назви її Lay Railing. Натисни Compile. Ти бачиш один фіолетовий вузол на місці циклів, а паркан виглядає так само."}, {"en": "Open Lay Railing, select the rail loop's nodes and press C; type Rails: one per gap. You see a coloured box with your title.", "uk": "Відкрий Lay Railing, виділи вузли циклу рейок і натисни C; введи Rails: one per gap. Ти бачиш кольорову рамку з твоїм заголовком."}, {"en": "Click + next to Functions twice for Lay Paving and Lay Furniture, and chain Lay Railing > Lay Paving > Lay Lamps > Lay Furniture after the Clear Instances nodes. You see the whole tool as one line of named steps.", "uk": "Двічі натисни + поруч із Functions для Lay Paving і Lay Furniture й з'єднай у ланцюжок Lay Railing > Lay Paving > Lay Lamps > Lay Furniture після вузлів Clear Instances. Ти бачиш увесь інструмент як один рядок іменованих кроків."}, {"en": "Open tool-review-checklist.md and tick what BP_Promenade already meets. You see what is left to do before the end of the day.", "uk": "Відкрий tool-review-checklist.md і познач те, що BP_Promenade уже виконує. Ти бачиш, що лишилося зробити до кінця дня."}], "play": {"en": "Graph critic: the tutor describes two graphs (one long tangle; one split into named functions with comments). I explain which one I would hand to a colleague and why.", "uk": "Критик графа: тьютор описує два графи (один довгий клубок; один розбитий на іменовані функції з коментарями). Я пояснюю, який із них передав би колезі, і чому."}, "video": {"search": "unreal engine 5 blueprint collapse to function comment organize graph"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Big graphs stay readable (micro-lesson) (Day 65, lesson 3 of 4).\nToday's build: BP_Promenade: one spline along your quay edge that lays paving, a railing on the sea side, lamps with glowing heads, and benches and bins chosen by a seed.\nEarlier today I already did: lesson 1 (Boss briefing: plan, measure, prove (micro-lesson)); lesson 2 (Side offsets: Transform Location (micro-lesson)). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Split a long Construction Script into functions with Collapse to Function, one function per part.\n2. Label graphs with comment boxes (select nodes, press C) and keep the white chain running left to right.\n3. Check a tool against the tool-review checklist: names, tooltips, ranges, defaults, no Tick.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Graph critic: the tutor describes two graphs (one long tangle; one split into named functions with comments). I explain which one I would hand to a colleague and why.\n4. Do-along on today's build (The plan, the side offsets and a tidy graph (micro-lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Select the post loop and the rail loop with all their nodes, right-click > Collapse to Function, and name it Lay Railing. Compile. You see one purple node where the loops were, and the fence looks the same.\n   - Open Lay Railing, select the rail loop's nodes and press C; type Rails: one per gap. You see a coloured box with your title.\n   - Click + next to Functions twice for Lay Paving and Lay Furniture, and chain Lay Railing > Lay Paving > Lay Lamps > Lay Furniture after the Clear Instances nodes. You see the whole tool as one line of named steps.\n   - Open tool-review-checklist.md and tick what BP_Promenade already meets. You see what is left to do before the end of the day.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Self-review with the tutor (micro-lesson)", "uk": "Самоперевірка з тьютором (мікроурок)"}, "minutes": 40, "goals": [{"en": "Score your result with a five-line rubric: follows the quay, rhythm of lamps and furniture, night look, grounding, graph tidiness; 0 to 2 each.", "uk": "Оціни свій результат за рубрикою з п'яти рядків: іде за причалом, ритм ліхтарів і меблів, нічний вигляд, заземлення, охайність графа; від 0 до 2 кожен."}, {"en": "Ask the tutor for see-why-fix notes: what it sees, why it matters, how to fix it.", "uk": "Попроси в тьютора нотатки «бачу, чому, як виправити»: що він бачить, чому це важливо, як виправити."}, {"en": "Decide what to fix now and what to carry into week 14, and name your tier.", "uk": "Вирішуй, що виправити зараз, а що перенести на тиждень 14, і назви свій рівень."}], "doalong": [{"en": "Write the rubric in self_review_day65.md and score yourself. You see five scores out of 10.", "uk": "Запиши рубрику в self_review_day65.md і постав собі оцінки. Ти бачиш п'ять оцінок із 10."}, {"en": "Describe your three shots and your graph in a new tutor chat (or upload the images if your chat accepts them) and ask for three see-why-fix notes as a senior technical artist would give them. You see three notes.", "uk": "Опиши свої три кадри й граф у новому чаті з тьютором (або завантаж зображення, якщо твій чат їх приймає) і попроси три нотатки «бачу, чому, як виправити», як їх дав би старший технічний художник. Ти бачиш три нотатки."}, {"en": "Fix the cheapest note now and write the others under To revisit. You see one fix done and two carried forward.", "uk": "Виправ найдешевшу нотатку зараз, а решту запиши під To revisit. Ти бачиш одне виправлення зроблено, а два перенесено."}], "play": {"en": "Role swap: the tutor describes another waterfront tool's shots; I write three see-why-fix notes on them, and it scores each note for being specific and kind.", "uk": "Обмін ролями: тьютор описує кадри іншого інструмента набережної; я пишу про них три нотатки «бачу, чому, як виправити», а він оцінює кожну за конкретність і доброзичливість."}, "video": {"search": "level design review waterfront promenade composition"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Self-review with the tutor (micro-lesson) (Day 65, lesson 4 of 4).\nToday's build: BP_Promenade: one spline along your quay edge that lays paving, a railing on the sea side, lamps with glowing heads, and benches and bins chosen by a seed.\nEarlier today I already did: lesson 1 (Boss briefing: plan, measure, prove (micro-lesson)); lesson 2 (Side offsets: Transform Location (micro-lesson)); lesson 3 (Big graphs stay readable (micro-lesson)). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Score your result with a five-line rubric: follows the quay, rhythm of lamps and furniture, night look, grounding, graph tidiness; 0 to 2 each.\n2. Ask the tutor for see-why-fix notes: what it sees, why it matters, how to fix it.\n3. Decide what to fix now and what to carry into week 14, and name your tier.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Role swap: the tutor describes another waterfront tool's shots; I write three see-why-fix notes on them, and it scores each note for being specific and kind.\n4. Do-along on today's build (The plan, the side offsets and a tidy graph (micro-lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Write the rubric in self_review_day65.md and score yourself. You see five scores out of 10.\n   - Describe your three shots and your graph in a new tutor chat (or upload the images if your chat accepts them) and ask for three see-why-fix notes as a senior technical artist would give them. You see three notes.\n   - Fix the cheapest note now and write the others under To revisit. You see one fix done and two carried forward.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "boss_day65.md (the plan with times, the four photo measurements, stat unit at night)", "uk": "boss_day65.md (план із часом, чотири виміри за фото, stat unit уночі)"}, {"en": "promenade_D1.png, promenade_D2.png and promenade_D3.png (1920 x 1080: day, dusk, night)", "uk": "promenade_D1.png, promenade_D2.png і promenade_D3.png (1920 x 1080: день, присмерк, ніч)"}, {"en": "promenade_graph.png (the Construction Script and one Lay function, node names readable)", "uk": "promenade_graph.png (Construction Script і одна функція Lay, назви вузлів читаються)"}, {"en": "self_review_day65.md (scores, the tutor's notes, your fix and your tier)", "uk": "self_review_day65.md (оцінки, нотатки тьютора, твоє виправлення й твій рівень)"}, {"en": "before_day65.png and flythrough_day65.mp4 (60 seconds along the promenade)", "uk": "before_day65.png і flythrough_day65.mp4 (60 секунд уздовж набережної)"}, {"en": "summary.md", "uk": "summary.md"}], "goal": {"en": "By the end of today you have BP_Promenade laying at least 100 m of your waterfront in one go: paving, a railing on the sea side, glowing lamps, and benches and bins chosen by a seed, proved in day, dusk and night shots and a 60-second flight.", "uk": "До кінця сьогодні ти матимеш BP_Promenade, що за один раз прокладає щонайменше 100 м твоєї набережної: плитку, поручні з боку моря, світні ліхтарі, а також лавки й смітники, обрані зерном, що підтверджується кадрами вдень, у присмерку й уночі та 60-секундним прольотом."}, "uses": [{"en": "Day 62: BP_SplineFence (posts, rails, the fencepost rule, upright rotation)", "uk": "День 62: BP_SplineFence (стовпи, рейки, правило стовпа огорожі, вертикальний поворот)"}, {"en": "Day 63: BP_SplineScatter (Stream, Switch on Int, Branch)", "uk": "День 63: BP_SplineScatter (Stream, Switch on Int, Branch)"}, {"en": "Day 64: MI_LampGlow, MPC_World and BP_StreetLamp", "uk": "День 64: MI_LampGlow, MPC_World і BP_StreetLamp"}, {"en": "Day 2, Day 3, Day 4 and Day 42: SM_Bench, SM_LampPost, SM_Bin and MI_Paving_2m (or your own)", "uk": "День 2, День 3, День 4 і День 42: SM_Bench, SM_LampPost, SM_Bin і MI_Paving_2m (або твої власні)"}], "quiz": [{"q": {"en": "A For Loop runs from 0 to Count and you get one bollard too many. Why?", "uk": "For Loop іде від 0 до Count, і ти отримуєш на один стовпчик більше. Чому?"}, "options": [{"en": "Spacing is too small", "uk": "Spacing замалий"}, {"en": "0 to Count is Count + 1 steps; Last Index should be Count minus 1", "uk": "Від 0 до Count це Count + 1 кроків; Last Index має бути Count мінус 1"}, {"en": "Instance Editable is ticked", "uk": "Instance Editable позначено"}, {"en": "Clear Instances is missing", "uk": "Бракує Clear Instances"}], "answer": 1, "explain": {"en": "A For Loop includes both ends, so 0 to 5 runs six times.", "uk": "For Loop включає обидва кінці, тож від 0 до 5 він виконується шість разів."}}, {"q": {"en": "A 9 m spline with Spacing 200: how many fence posts?", "uk": "Сплайн 9 м зі Spacing 200: скільки стовпів паркану?"}, "options": [{"en": "5", "uk": "5"}, {"en": "4", "uk": "4"}, {"en": "6", "uk": "6"}, {"en": "9", "uk": "9"}], "answer": 0, "explain": {"en": "9 / 2 = 4.5, truncated to 4 gaps, and posts = gaps + 1 = 5.", "uk": "9 / 2 = 4.5, відкинуто до 4 проміжків, а стовпів = проміжків + 1 = 5."}}, {"q": {"en": "Two copies of BP_SplineScatter on different paths show exactly the same pattern of sizes and gaps. Why?", "uk": "Дві копії BP_SplineScatter на різних шляхах показують точно той самий візерунок розмірів і проміжків. Чому?"}, "options": [{"en": "Gap Chance is 0", "uk": "Gap Chance дорівнює 0"}, {"en": "They use the same Seed", "uk": "Вони використовують те саме Seed"}, {"en": "The spline is too short", "uk": "Сплайн закороткий"}, {"en": "Jitter is 0.45", "uk": "Jitter дорівнює 0.45"}], "answer": 1, "explain": {"en": "A seed gives the same sequence of random numbers; give each copy its own Seed.", "uk": "Зерно дає ту саму послідовність випадкових чисел; дай кожній копії власне Seed."}}, {"q": {"en": "Why does a town's lamp glow come from MPC_World instead of each lamp changing its own material every frame?", "uk": "Чому сяйво ліхтарів міста береться з MPC_World, а не з того, що кожен ліхтар щокадру змінює власний матеріал?"}, "options": [{"en": "MPCs make textures smaller", "uk": "MPC роблять текстури меншими"}, {"en": "Lamps cannot have materials", "uk": "Ліхтарі не можуть мати матеріалів"}, {"en": "It turns on shadows", "uk": "Це вмикає тіні"}, {"en": "One value set once lights every lantern that reads it, with no per-lamp work", "uk": "Одне значення, задане раз, запалює кожен ліхтар, що його читає, без роботи для кожного ліхтаря окремо"}], "answer": 3, "explain": {"en": "The material reads Night from the collection, so one Set Scalar Parameter Value call switches them all.", "uk": "Матеріал читає Night з колекції, тож один виклик Set Scalar Parameter Value перемикає їх усі."}}, {"q": {"en": "Your promenade's benches and paving sit in the sea, and the railing is on the right line. What is the fastest fix?", "uk": "Лавки й плитка твоєї набережної стоять у морі, а поручні на правильній лінії. Яке виправлення найшвидше?"}, "options": [{"en": "Redraw the whole spline backwards", "uk": "Перемалювати весь сплайн у зворотному напрямку"}, {"en": "Raise Path Width", "uk": "Збільшити Path Width"}, {"en": "Set Inland Side to -1", "uk": "Встановити Inland Side на -1"}, {"en": "Change the Seed", "uk": "Змінити Seed"}], "answer": 2, "explain": {"en": "Inland Side flips every side offset to the other side of the spline.", "uk": "Inland Side перевертає кожен боковий зсув на інший бік сплайна."}}, {"q": {"en": "Why are the promenade's lamps instances with a glowing material, plus only a few real lights?", "uk": "Чому ліхтарі набережної — це інстанси зі світним матеріалом, а справжніх світел лише кілька?"}, "options": [{"en": "Instances and emissive are cheap; real lights cost a lot each, so you use them only where they matter", "uk": "Інстанси й emissive дешеві; справжні світла коштують багато кожне, тож їх використовують лише там, де це важливо"}, {"en": "Point Lights cannot be placed along a spline", "uk": "Point Light не можна розмістити вздовж сплайна"}, {"en": "Instances glow brighter", "uk": "Інстанси світяться яскравіше"}, {"en": "Lumen needs instances", "uk": "Lumen потребує інстансів"}], "answer": 0, "explain": {"en": "Fifty Point Lights would cost far more than fifty instances; a few real lights at key spots give the look for a fraction of the cost.", "uk": "П'ятдесят Point Light коштували б набагато дорожче, ніж п'ятдесят інстансів; кілька справжніх світел у ключових місцях дають вигляд за частку вартості."}}, {"q": {"en": "What does Collapse to Function do?", "uk": "Що робить Collapse to Function?"}, "options": [{"en": "Deletes the selected nodes", "uk": "Видаляє вибрані вузли"}, {"en": "Makes the graph run faster at runtime", "uk": "Змушує граф виконуватися швидше під час роботи"}, {"en": "Adds a comment box", "uk": "Додає коментар"}, {"en": "Turns the selected nodes into a named function, called by one node", "uk": "Перетворює вибрані вузли на іменовану функцію, що викликається одним вузлом"}], "answer": 3, "explain": {"en": "Collapsing keeps the logic and gives it a name, so a long graph reads as a short list of steps.", "uk": "Згортання зберігає логіку й дає їй назву, тож довгий граф читається як короткий список кроків."}}, {"q": {"en": "Transform Location with (0, 300, 0) in the spline's frame gives which point?", "uk": "Яку точку дає Transform Location із (0, 300, 0) у системі сплайна?"}, "options": [{"en": "3 m further along the spline", "uk": "На 3 м далі вздовж сплайна"}, {"en": "3 m up", "uk": "На 3 м угору"}, {"en": "3 m to the side of the spline at that distance", "uk": "На 3 м убік від сплайна на цій відстані"}, {"en": "3 m from the world origin", "uk": "На 3 м від початку координат світу"}], "answer": 2, "explain": {"en": "In the spline's frame X runs along the path, Y to the side and Z up, so Y = 300 is 3 m to the side.", "uk": "У системі сплайна X іде вздовж шляху, Y убік, а Z угору, тож Y = 300 — це 3 м убік."}}], "weekInfo": null, "morning": {"sofar": {"en": "This week you built BP_SplineFence, BP_SplineScatter and BP_StreetLamp with MPC_World: fences, seeded scatters and lamps that know the sun.", "uk": "Цього тижня збудовано BP_SplineFence, BP_SplineScatter і BP_StreetLamp з MPC_World: паркани, розсипи із зерном і ліхтарі, що знають сонце."}, "today": {"en": "It is Boss day: you join them into BP_Promenade and lay a whole waterfront with one spline.", "uk": "Це День боса: ти об'єднуєш їх у BP_Promenade і прокладаєш цілу набережну одним сплайном."}, "cheer": {"en": "Lock in Bronze first, then grow; a waterfront drawn with a single line is a real tool, and you built every part of it this week.", "uk": "Спершу закріпи Бронзу, потім рости; набережна, намальована однією лінією, — це справжній інструмент, і кожну його частину ти будуєш цього тижня."}, "quote": {"text": {"en": "It is possible to fly without motors, but not without knowledge and skill.", "uk": "Літати без моторів можна, але не без знань і вміння."}, "author": {"en": "Wilbur Wright", "uk": "Вілбур Райт"}, "source": "Letter to Octave Chanute, 13 May 1900"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-65-boss-promenade", "mapHref": "../../COURSE.html", "prevHref": "../Day-64-street-lamp-mpc-events/START-HERE.html", "nextHref": "../Day-66-structs-data-assets-styles/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me: when my Blueprint or script fails, ask for the error message or a screenshot of the graph, point to the line or node that is wrong and explain why, then let me fix it myself. Never write the whole tool for me. Keep me moving and make it feel like a game.\n\nToday I build on my own: The full promenade on your waterfront, with lamps, furniture and the proof, on your own.\nIt's part of: BP_Promenade: one spline along your quay edge that lays paving, a railing on the sea side, lamps with glowing heads, and benches and bins chosen by a seed (Content/Tools/Day65/L_Day65 for testing, then at least 100 m of your island's waterfront (district 1's quay, or your own coast).).\n\nSpec:\n- BP_Promenade in Content/Tools/Blueprints, made from a copy of BP_SplineFence: the spline marks the quay edge; Posts and Rails stand on it; Paving, Lamps, Benches and Bins are Instanced Static Mesh components.\n- Settings (Instance Editable, Category Tool, ranges and tooltips): Seed, Path Width (cm, default 400), Inland Side (-1 to 1, default 1), Tile Length (cm, default 400, kept equal to Path Width so the paving tiles stay square), Lamp Spacing (cm, default 2000), Furniture Spacing (cm, default 800), Bench Turn (degrees, 0 to 360), plus the fence's Spacing, Post Scale and Rail Height.\n- Side offsets with Transform Location: paving centred Path Width / 2 inland, lamps 50 cm inland of the railing, benches and bins 80 cm in from the inland edge, benches facing the sea.\n- Lamps are instances of SM_LampPost with MI_LampGlow on the lantern slot, so MPC_World Night lights every lantern at once; real light comes from a few BP_StreetLamp actors at key spots (Silver).\n- Furniture: for each slot the Stream picks bench, bench, bin or nothing (Switch on Int, 0 to 3); the same Seed gives the same promenade.\n- A tidy graph: one function per part (Lay Railing, Lay Paving, Lay Lamps, Lay Furniture), comment boxes and no Tick; nothing floating along the waterfront; three locked shots (day, dusk, night), stat unit at night in boss_day65.md and a 60-second flight.\n\nMy checklist:\n1. Start the clock. Write your plan with times in boss_day65.md (the biggest risk first), and take before_day65.png of your waterfront from a bookmark 30 m up. Check: the plan fits in 4 hours and the picture is saved. (from lesson 1)\n2. Measure a real promenade from two reference photos: path width, lamp spacing, bench spacing and railing height. Write the four numbers in boss_day65.md with the photo each came from, and credit the photos in credits.md. Check: four numbers, each with its photo. (from lesson 1)\n3. Open BP_Promenade (made in lesson 2) and add Seed, Path Width, Tile Length, Furniture Spacing and Bench Turn with ranges and tooltips; at the top of the Construction Script add Make Random Stream (Seed) > Set Stream. Check: it compiles, and the railing and the lesson's lamps still work. (from day 63, lesson 1)\n4. Check the tidy graph from lesson 3: Set Stream > Clear Instances > Lay Railing > Lay Paving > Lay Lamps > Lay Furniture, and give every component you add today its own Clear Instances there. Check: the Construction Script reads as one line of named nodes, and the railing looks the same as on Day 62. (from lesson 3)\n5. Lay Paving: add an Instanced Static Mesh Paving (mesh /Engine/BasicShapes/Plane) with MI_Paving_Prom, a child of MI_Paving_2m with Tiling 2; For Loop from 0 to Truncate(Length / Tile Length) minus 1; at distance (Index + 0.5) x Tile Length, Transform Location of (0, Path Width / 2 x Inland Side, 2); upright rotation as on Day 62; Scale (Tile Length / 100 x 1.02, Path Width / 100, 1); Paving: Add Instance. Each Plane shows the texture once, so keep Tile Length equal to Path Width (square tiles) and set Tiling to Path Width / 200 (2 for a 4 m path) to keep 2 m paving squares. Check: a continuous path beside the railing, with no gaps and no stretched squares visible from 10 m. (from lesson 2)\n6. Lay Lamps: check the lesson's version (every Lamp Spacing, Transform Location of (0, 50 x Inland Side, 0), upright rotation) and put MI_LampGlow in the Lamps component's lantern slot (Details > Materials). Check: lamps stand evenly just inland of the railing, and they glow when MPC_World Night is 1. (from lesson 2)\n7. Lay Furniture: add Instanced Static Mesh components Benches (SM_Bench) and Bins (SM_Bin); a slot every Furniture Spacing, starting half a spacing in; Random Integer in Range from Stream (0, 3) into Switch on Int: 0 and 1 add a bench, 2 a bin, 3 nothing; place them at Transform Location of (0, (Path Width - 80) x Inland Side, 0) and add Bench Turn to the Yaw so benches face the sea. Check: a believable rhythm of benches and bins, and Seed 1 always gives the same one. (from day 63, lesson 3)\n8. Draw the spline along at least 100 m of your island's quay edge (a point every 10 to 20 m, snapped to the floor; Linear points at sharp corners). Check: from 30 m the railing stands on the quay edge and the path runs inland of it all the way. (from day 62, lesson 4)\n9. Grounding pass: fly along the promenade 5 m up and fix any floating tile, lamp or bench by moving or adding spline points; if the whole path lands in the sea, set Inland Side to -1. Check: nothing floats or sinks, and the path never runs over water. (from lesson 2)\n10. Night: lower the sun below the horizon and click Update Light on one of your BP_StreetLamp actors (or set MPC_World Night to 1). Check: every lamp head along the promenade glows. (from day 64, lesson 3)\n11. Shots and numbers: three locked Cine Cameras D1 (day, 30 m), D2 (dusk, 10 m) and D3 (night, 60 m), HighResShot 1920x1080 from each; stat unit at D3 into boss_day65.md; then a 60-second flight along the promenade. Check: promenade_D1.png to promenade_D3.png, Frame and GPU in ms, and flythrough_day65.mp4 are saved. (from lesson 1)\n12. Self-review: score the five-line rubric, go through tool-review-checklist.md, ask the tutor for three see-why-fix notes, fix the cheapest one and choose your tier. Check: self_review_day65.md has five scores, three notes, one fix and your tier. (from lesson 4)\n13. Click Copy the day report, paste it into a new tutor chat, answer its questions and save its answer as summary.md. Check: summary.md is in today's Work folder with Made, To look at, Hours and To revisit filled in. (from lesson 4)\n\nToday is a BOSS build: help me keep time against the tiers below. Tiers:\n- Bronze: BP_Promenade lays paving, a railing, lamps and seeded benches and bins along at least 100 m of your waterfront, nothing floats, and you have three locked shots, stat unit at night and a 60-second flight, inside 4 hours.\n- Silver: the promenade follows the real curve of your quay with no gap visible from 30 m, its spacings match your photo measurements, four BP_StreetLamp actors give real light at key spots (steps, a landmark) and switch with the sun, and Frame stays under 16.6 ms at night.\n- Gold: add Keep Clear From and Keep Clear To (distances in cm) so no lamp or furniture lands where drones cross the promenade: a Branch skips any slot whose distance is at least Keep Clear From AND at most Keep Clear To; show the clear gap from 30 m, and finish inside 3 hours.\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me and tell me which tier I reached.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Misha\nDay 65: Boss: BP_Promenade, a waterfront laid by one spline. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; boss tier: <bronze / silver / gold / none>; quiz: <score> of 8\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

const lk=s=>esc(s).replace(/https?:\/\/[^\s<']*[^\s<.,;:)']/g,m=>'<a href="'+m+'" target="_blank" rel="noopener">'+m+'</a>');
function list(a,tag,cls){return '<'+tag+(cls?' class="'+cls+'"':'')+'>'+(a||[]).map(i=>'<li>'+lk(x(i))+'</li>').join('')+'</'+tag+'>'}
const lab=(t,k)=>'<div class="lab'+(k?' k-'+k:'')+'"><span class="dotc"></span>'+t+'</div>';
const kn=n=>'<span class="kn">'+ic(n)+'</span>';
const slider=p=>'<div class="slider"><i style="width:calc('+p+'% - 6px)"></i><b style="left:clamp(13px,'+p+'%,calc(100% - 13px))"></b></div>';
function quiz(){if(!D.quiz||!D.quiz.length)return '';const a=st.qa||{};let ok=0;const L=u('letters');
 const pips='<div class="pips well" aria-hidden="true">'+D.quiz.map((q,i)=>'<i class="'+(a[i]==null?'':a[i]===q.answer?'r':'w')+'"></i>').join('')+'</div>';
 const qs=D.quiz.map((q,i)=>{const c=a[i];if(c===q.answer)ok++;return '<div class="qz"><p class="qq"><span class="qn">'+(i+1)+'</span><span>'+lk(x(q.q))+'</span></p>'+q.options.map((o,k)=>{let cls='opt',mk='<span></span>';if(c!=null){if(k===q.answer){cls+=' right';mk=ic('check','mk')}else if(k===c){cls+=' wrong';mk=ic('x','mk')}}return '<button class="'+cls+'" id="o'+i+'_'+k+'"'+(c!=null?' disabled':'')+' onclick="pick('+i+','+k+')"><span class="lt">'+(L[k]||k+1)+'</span><span>'+esc(x(o))+'</span>'+mk+'</button>'}).join('')+(c!=null?'<p class="exp '+(c===q.answer?'r':'w')+'" id="e'+i+'" tabindex="-1"><b>'+(c===q.answer?u('right'):u('wrong'))+'</b>'+lk(x(q.explain))+'</p>':'')+'</div>'}).join('');
 return '<section class="card glass quiz">'+lab(u('quiz'),'gold')+'<p class="muted" style="margin:-6px 0 14px">'+u('quizSub')+'</p>'+pips+qs+(qDone()?'<div class="score well" role="status"><span class="eyebrow">'+u('score')+'</span><span class="lcd" aria-label="'+ok+' / '+D.quiz.length+'">'+seg(ok+'/'+D.quiz.length)+'</span><div class="row"><button class="btn ghost" id="retry" onclick="retry()">'+u('retry')+'</button></div></div>':'')+'</section>'}
function vid(v){if(!v)return '';const link=v.url?'<a href="'+esc(v.url)+'" target="_blank" rel="noopener">'+esc(x(v.title)||v.url)+'</a>'+(v.channel?' <span class="muted">· '+esc(v.channel)+(v.length?' · '+esc(v.length):'')+'</span>':''):'';const s=v.search?'<a href="https://www.youtube.com/results?search_query='+encodeURIComponent(v.search)+'" target="_blank" rel="noopener">'+u('noVid')+': '+esc(v.search)+'</a>':'';const alt=v.alt&&v.alt.url?'<br><span class="eyebrow">UA</span> <a href="'+esc(v.alt.url)+'" target="_blank" rel="noopener">'+esc(v.alt.title||v.alt.url)+'</a>'+(v.alt.channel?' <span class="muted">· '+esc(v.alt.channel)+'</span>':''):'';return '<div class="vid well">'+kn('play')+'<div><b>'+u('more')+'?</b><br>'+(link||s)+alt+(link&&s?'<br><span class="muted" style="font-size:14px">'+s+'</span>':'')+'</div></div>'}
function morning(){const m=D.morning;if(!m)return '';const q=m.quote||{};
 let shelf='';if(D.day>0){shelf='<div class="shelf" aria-hidden="true">';let g='';for(let d=0;d<D.day;d++){let p=0;try{p=(JSON.parse(localStorage.getItem('devteam:'+D.learner+':'+d))||{}).pct||0}catch(e){}g+='<i class="'+(p>=1?'d':'')+(d>0&&d%5===0?' bs':'')+'"></i>';if(d%5===0||d===D.day-1){shelf+='<span class="wkg">'+g+'</span>';g=''}}shelf+='</div>'}
 const qt=lang==='uk'&&q.original?q.original:x(q.text);
 return '<section class="card glass morning"><div class="mgrid">'+(m.sofar?'<div>'+lab(u('sofar'),'gold')+shelf+'<p class="mtxt">'+lk(x(m.sofar))+'</p></div>':'')+(m.today?'<div>'+lab(u('todayL'))+'<p class="mtxt">'+lk(x(m.today))+'</p></div>':'')+'</div>'+(m.cheer?'<p class="cheer">'+esc(x(m.cheer))+'</p>':'')+(qt?'<figure class="quote well">'+kn('quote')+'<blockquote>'+esc(qt)+'</blockquote>'+(q.author?'<figcaption>'+esc(x(q.author))+'</figcaption>':'')+'</figure>':'')+'</section>'}
function setLang(l){lang=l;try{localStorage.setItem('devteam:lang',lang)}catch(e){};render()}
function toggleLang(){setLang(lang==='uk'?'en':'uk')}
/* keep open sections and keyboard focus across re-renders */
const openD=new Set();
function tg(e){if(e.open)openD.add(e.id);else openD.delete(e.id)}
const op=id=>openD.has(id)?' open':'';
function render(){const ae=document.activeElement,fid=ae&&(ae.id||(ae.getAttribute('data-th')?'th-'+ae.getAttribute('data-th'):ae.getAttribute('lang')&&ae.closest('.seg')?'lg-'+ae.getAttribute('lang'):''));
 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);
 const b=D.build,P=Math.round(prog()*100);
 document.getElementById('top').innerHTML='<div class="topin glass"><a class="maplink" href="'+esc(D.mapHref)+'">'+kn('map')+u('map')+'</a><div class="crumb"><b>'+esc(x(D.learnerName))+'</b><span>'+u('week')+' '+D.week+'</span><span>'+u('day')+' '+D.day+' '+u('of')+' '+D.total+'</span></div>'+controls(lang,'setLang')+'</div><div class="tline"><i style="width:'+P+'%"></i></div>';
 const state=w=>w<D.week?'b':w===D.week?'n':'p';
 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 if(D.weekInfo){const w=D.weekInfo;h+='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}
 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p><div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+list(D.handin,'ul','ticks')+'<p class="path">'+ic('folder')+'<span>'+u('shipTo')+' <code>'+esc(D.workPath)+'</code></span></p>'+(D.lessons.length?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<p class="muted">'+u('report')+'</p><div class="row"><button class="btn s" onclick="cp(D.reportPrompt)">'+ic('copy')+u('copyR')+'</button></div></section>';
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();
</script>

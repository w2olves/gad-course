 plot after its Front, Bays and Yaw are made: the gap draw, Sea Distance and Floors, the shop test and Is In Corridor. Right-click > Collapse to Function and name it Apply Plot Rules.", "uk": "Відкрий Fill Row. Виділи вузли, що працюють з однією ділянкою після того, як зроблено її Front, Bays і Yaw: вибір пропуску, Sea Distance і Floors, тест крамниці та Is In Corridor. Клацни правою кнопкою > Collapse to Function і назви функцію Apply Plot Rules."}, {"en": "If the new function got an input pin for Stream, delete that pin and use a Get Stream node inside the function: a stream passed in as an input is a copy, so its draws would not move the real Stream on, and every later plot would change.", "uk": "Якщо нова функція отримала вхід для Stream, видали цей вхід і використай усередині функції вузол Get Stream. Потік, переданий як вхід, — це копія: її вибори не посунуть справжній Stream, і кожна наступна ділянка зміниться."}, {"en": "If a node inside used one of Fill Row's local variables, give the function an input for it. You see one new node in Fill Row.", "uk": "Якщо вузол усередині використовував одну з локальних змінних Fill Row, дай функції вхід для неї. Має вийти: у Fill Row один новий вузол."}, {"en": "Open Apply Plot Rules and tidy its pins: inputs Plot (S_Plot) and World Centre (Vector, cm); outputs Plot (S_Plot, with Floors, Sea Distance, Is Gap and Is Shop filled) and Keep (Boolean, false for a plot under a corridor).", "uk": "Відкрий Apply Plot Rules і впорядкуй входи й виходи. Входи: Plot (S_Plot) і World Centre (Vector, см). Виходи: Plot (S_Plot із заповненими Floors, Sea Distance, Is Gap і Is Shop) і Keep (Boolean, false для ділянки під коридором)."}, {"en": "Check that the random draws (Random Float from Stream, Random Integer in Range from Stream) still come before the corridor test. You see a function with clear inputs and outputs.", "uk": "Перевір, чи випадкові вибори (Random Float from Stream, Random Integer in Range from Stream) досі йдуть перед тестом коридору. Має вийти: функція з чіткими входами й виходами."}, {"en": "Compile, then Regenerate seeds 1 and 2 and compare the new pictures and lines with the old ones. You see them identical; if one plot differs, a random draw has moved, so put it back before the test and compare again.", "uk": "Клацни Compile, потім Regenerate із зернами 1 і 2 і порівняй нові картинки й рядки зі старими. Вони однакові. Якщо одна ділянка відрізняється, якийсь випадковий вибір перемістився: поверни його перед тест і порівняй знову."}], "play": {"en": "Refactor or not: the tutor names five changes (renaming a variable; moving nodes into a function; changing Gap Chance's default; splitting a long script into functions; changing how floors are chosen). For each I say refactor (behaviour unchanged) or behaviour change, and which test proves it.", "uk": "Рефакторинг чи ні: тьютор називає п'ять змін (перейменувати змінну; перенести вузли у функцію; змінити типове значення Gap Chance; розбити довгий скрипт на функції; змінити, як вибираються поверхи). Про кожну я кажу: рефакторинг (поведінка та сама) чи зміна поведінки, і який тест це доводить."}, "video": {"search": "unreal engine blueprint collapse to function refactor"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Безпечний рефакторинг: Apply Plot Rules (Day 99, lesson 3 of 4). Today's build: review_day99.md (самоперевірка коду двох інструментів), один рефакторинг (правила для кожної ділянки з Fill Row перенесено у функцію Apply Plot Rules), CHANGELOG.md і TechTools 1.1 з тегом v1.1 на GitHub.\nWhat I already know: День 98: типові значення, підказки, перевірки введення і README; Дні 87 і 88: Fill Row і правила ділянок у BP_TownGenerator; День 90: Check Town і порівняння з однієї закладки; День 74: check_assets.py; День 96: коміти, git log і git push.\nEarlier today I already did: lesson 1 (Читаємо код як рецензент); lesson 2 (Перевірка продуктивності інструмента). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Пояснювати, що таке рефакторинг: зміна того, як код організовано, без зміни того, що він робить.\n2. Доводити безпечність рефакторингу тестом «до і після»: те саме зерно дає той самий мікрорайон і ті самі числа.\n3. Згортати правила для кожної ділянки з Fill Row в Apply Plot Rules, зберігаючи порядок кожного випадкового вибору.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: 2 lines on why today matters and where it comes back, in plain words (from this: Код читають набагато частіше, ніж пишуть: колеги і ти через кілька місяців. Огляд за чек-листом знаходить назви, магічні числа й приховані витрати, через які інструменту важко довіряти. Рефакторинг — зміна того, як код організовано, без зміни того, що він робить, — усуває їх. Журнал змін каже користувачам, що змінилося. Сьогоднішній рефакторинг — ще й та частина, яку твій District Generator використає наступного тижня. It comes back: Apply Plot Rules — частина, яку твій District Generator використає в День 103, а CHANGELOG.md отримає запис 2.0, коли ти випустиш реліз у День 108.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-99-self-code-review-refactor exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (Огляд BP_TownGenerator за чек-листом і рефакторинг Apply Plot Rules (робиш на уроках)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. До будь-якої зміни: клацни Regenerate із зерном 1 і зерном 2. Для кожного зроби картинку із закладки на 120 м і скопіюй рядки Regenerate і Check Town. Зроби refactor_before.png із Fill Row. Має вийти: доказ збережено.\n   2. Відкрий Fill Row. Виділи вузли, що працюють з однією ділянкою після того, як зроблено її Front, Bays і Yaw: вибір пропуску, Sea Distance і Floors, тест крамниці та Is In Corridor. Клацни правою кнопкою > Collapse to Function і назви функцію Apply Plot Rules.\n   3. Якщо нова функція отримала вхід для Stream, видали цей вхід і використай усередині функції вузол Get Stream. Потік, переданий як вхід, — це копія: її вибори не посунуть справжній Stream, і кожна наступна ділянка зміниться.\n   4. Якщо вузол усередині використовував одну з локальних змінних Fill Row, дай функції вхід для неї. Має вийти: у Fill Row один новий вузол. [screenshot]\n   5. Відкрий Apply Plot Rules і впорядкуй входи й виходи. Входи: Plot (S_Plot) і World Centre (Vector, см). Виходи: Plot (S_Plot із заповненими Floors, Sea Distance, Is Gap і Is Shop) і Keep (Boolean, false для ділянки під коридором).\n   6. Перевір, чи випадкові вибори (Random Float from Stream, Random Integer in Range from Stream) досі йдуть перед тестом коридору. Має вийти: функція з чіткими входами й виходами.\n   7. Клацни Compile, потім Regenerate із зернами 1 і 2 і порівняй нові картинки й рядки зі старими. Вони однакові. Якщо одна ділянка відрізняється, якийсь випадковий вибір перемістився: поверни його перед тест і порівняй знову. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Рефакторинг чи ні: тьютор називає п'ять змін (перейменувати змінну; перенести вузли у функцію; змінити типове значення Gap Chance; розбити довгий скрипт на функції; змінити, як вибираються поверхи). Про кожну я кажу: рефакторинг (поведінка та сама) чи зміна поведінки, і який тест це доводить. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; self-review = самоперевірка; review (by tutor or art director) = огляд; breakdown = розбір; see-why-fix note = нотатка «бачу, чому, як виправити»; checklist = чек-лист; credits line = рядок авторства; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); default value = типове значення; File Explorer = Провідник; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; material slot / node / pin = слот матеріалу / вузол / вхід; seed = зерно (налаштування Seed); keep-out zone / footprint test / grounding = зона-виняток / тест опори / посадка на ґрунт; kit / kit piece / part of one object = набір / деталь / частина; map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; district / plot / plot plan = район / ділянка / план ділянки; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}, {"title": {"en": "Changelog, version and tag", "uk": "Журнал змін, версія і тег"}, "minutes": 40, "goals": [{"en": "Write a changelog: a short list per version of what was added, changed and fixed, in plain words.", "uk": "Писати журнал змін: короткий список для кожної версії — що додано, змінено й виправлено, простими словами."}, {"en": "Give the plugin a version number that matches the changelog.", "uk": "Давати плагіну номер версії, що збігається з журналом змін."}, {"en": "Mark the version in Git with a tag and push it.", "uk": "Позначати версію в Git тегом і надсилати його."}], "doalong": [{"en": "Create CHANGELOG.md in Plugins/TechTools. Type # Changelog, then ## [1.1.0] and today's date, then three lists: ### Added (input checks with readable messages, tooltips, README), ### Changed (safe defaults; Apply Plot Rules; check_assets.py's named size settings) and ### Fixed (what you fixed today).", "uk": "Створи CHANGELOG.md у Plugins/TechTools. Введи # Changelog, потім ## [1.1.0] і сьогоднішню дату, потім три списки: ### Added (перевірки введення зі зрозумілими повідомленнями, підказки, README), ### Changed (безпечні типові значення; Apply Plot Rules; іменовані налаштування розміру в check_assets.py) і ### Fixed (що виправлено сьогодні)."}, {"en": "Below, ## [1.0.0] with one line: First version as a plugin (tools, kit and scripts moved into TechTools). You see a changelog a user reads in 30 seconds.", "uk": "Нижче — ## [1.0.0] з одним рядком: First version as a plugin (tools, kit and scripts moved into TechTools). Має вийти: журнал змін, який користувач прочитає за 30 секунд."}, {"en": "In TechTools.uplugin set \"VersionName\": \"1.1\" and \"Version\": 2 (a whole number that goes up with every release). Restart. You see 1.1 in Edit > Plugins.", "uk": "У TechTools.uplugin постав \"VersionName\": \"1.1\" і \"Version\": 2 (ціле число, що росте з кожним релізом). Перезапусти. Має вийти: 1.1 в Edit > Plugins."}, {"en": "Type git add -A and git commit -m 'TechTools 1.1: review fixes, Apply Plot Rules, changelog'.", "uk": "Введи git add -A і git commit -m 'TechTools 1.1: review fixes, Apply Plot Rules, changelog'."}, {"en": "Then git tag -a v1.1 -m 'TechTools 1.1' (-a makes an annotated tag, with its own message) and git push --follow-tags (it sends the commit and every annotated tag on it; a plain git tag v1.1 would be left behind). You see the push send the commit and the tag.", "uk": "Потім git tag -a v1.1 -m 'TechTools 1.1' (-a робить анотований тег із власним повідомленням) і git push --follow-tags (надсилає коміт і кожен анотований тег на ньому; простий git tag v1.1 лишився б позаду). Має вийти: надсилання передає і коміт, і тег."}, {"en": "On GitHub open Tags (or Releases) on your repository page. You see v1.1: anyone can now get exactly this version back, whatever you change later.", "uk": "На GitHub відкрий Tags (або Releases) на сторінці репозиторію. Там є v1.1: будь-хто тепер може отримати саме цю версію, хоч що ти зміниш пізніше."}], "play": {"en": "Changelog editor: the tutor gives me six messy notes (fixed stuff; now it's better; Added Check Inputs to BP_TownGenerator; refactor; moved scripts into the plugin so the panel's paths changed; misc). I sort them into Added, Changed and Fixed, rewrite them plainly, and drop what a user doesn't need.", "uk": "Редактор журналу змін: тьютор дає мені шість безладних нотаток (fixed stuff; now it's better; Added Check Inputs to BP_TownGenerator; refactor; moved scripts into the plugin so the panel's paths changed; misc). Я розкладаю їх на Added, Changed і Fixed, переписую простими словами і викидаю те, що користувачу не потрібно."}, "video": {"search": "keep a changelog semantic versioning git tag push"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Журнал змін, версія і тег (Day 99, lesson 4 of 4). Today's build: review_day99.md (самоперевірка коду двох інструментів), один рефакторинг (правила для кожної ділянки з Fill Row перенесено у функцію Apply Plot Rules), CHANGELOG.md і TechTools 1.1 з тегом v1.1 на GitHub.\nWhat I already know: День 98: типові значення, підказки, перевірки введення і README; Дні 87 і 88: Fill Row і правила ділянок у BP_TownGenerator; День 90: Check Town і порівняння з однієї закладки; День 74: check_assets.py; День 96: коміти, git log і git push.\nEarlier today I already did: lesson 1 (Читаємо код як рецензент); lesson 2 (Перевірка продуктивності інструмента); lesson 3 (Безпечний рефакторинг: Apply Plot Rules). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Писати журнал змін: короткий список для кожної версії — що додано, змінено й виправлено, простими словами.\n2. Давати плагіну номер версії, що збігається з журналом змін.\n3. Позначати версію в Git тегом і надсилати його.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: 2 lines on why today matters and where it comes back, in plain words (from this: Код читають набагато частіше, ніж пишуть: колеги і ти через кілька місяців. Огляд за чек-листом знаходить назви, магічні числа й приховані витрати, через які інструменту важко довіряти. Рефакторинг — зміна того, як код організовано, без зміни того, що він робить, — усуває їх. Журнал змін каже користувачам, що змінилося. Сьогоднішній рефакторинг — ще й та частина, яку твій District Generator використає наступного тижня. It comes back: Apply Plot Rules — частина, яку твій District Generator використає в День 103, а CHANGELOG.md отримає запис 2.0, коли ти випустиш реліз у День 108.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-99-self-code-review-refactor exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (Огляд BP_TownGenerator за чек-листом і рефакторинг Apply Plot Rules (робиш на уроках)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Створи CHANGELOG.md у Plugins/TechTools. Введи # Changelog, потім ## [1.1.0] і сьогоднішню дату, потім три списки: ### Added (перевірки введення зі зрозумілими повідомленнями, підказки, README), ### Changed (безпечні типові значення; Apply Plot Rules; іменовані налаштування розміру в check_assets.py) і ### Fixed (що виправлено сьогодні).\n   2. Нижче — ## [1.0.0] з одним рядком: First version as a plugin (tools, kit and scripts moved into TechTools). Має вийти: журнал змін, який користувач прочитає за 30 секунд.\n   3. У TechTools.uplugin постав \"VersionName\": \"1.1\" і \"Version\": 2 (ціле число, що росте з кожним релізом). Перезапусти. Має вийти: 1.1 в Edit > Plugins. [screenshot]\n   4. Введи git add -A і git commit -m 'TechTools 1.1: review fixes, Apply Plot Rules, changelog'.\n   5. Потім git tag -a v1.1 -m 'TechTools 1.1' (-a робить анотований тег із власним повідомленням) і git push --follow-tags (надсилає коміт і кожен анотований тег на ньому; простий git tag v1.1 лишився б позаду). Має вийти: надсилання передає і коміт, і тег.\n   6. На GitHub відкрий Tags (або Releases) на сторінці репозиторію. Там є v1.1: будь-хто тепер може отримати саме цю версію, хоч що ти зміниш пізніше. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Редактор журналу змін: тьютор дає мені шість безладних нотаток (fixed stuff; now it's better; Added Check Inputs to BP_TownGenerator; refactor; moved scripts into the plugin so the panel's paths changed; misc). Я розкладаю їх на Added, Changed і Fixed, переписую простими словами і викидаю те, що користувачу не потрібно. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; self-review = самоперевірка; review (by tutor or art director) = огляд; see-why-fix note = нотатка «бачу, чому, як виправити»; checklist = чек-лист; credits line = рядок авторства; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); default value = типове значення; File Explorer = Провідник; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); UV unwrap / UV layout / seam / UV island = розгортка / розкладка / шов / UV-острівець; level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; material slot / node / pin = слот матеріалу / вузол / вхід; seed = зерно (налаштування Seed); kit / kit piece / part of one object = набір / деталь / частина; district / plot / plot plan = район / ділянка / план ділянки; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}], "handin": [{"en": "summary.md", "uk": "summary.md"}, {"en": "review_day99.md (the checklist answers, see-why-fix notes, the Tick search and the loop list) (proof)", "uk": "review_day99.md (відповіді за чек-листом, нотатки «бачу, чому, як виправити», пошук Tick і список циклів) (доказ)"}, {"en": "refactor_before.png, refactor_after.png and seeds_compare.png (the refactor changed nothing you can see) (proof)", "uk": "refactor_before.png, refactor_after.png і seeds_compare.png (рефакторинг не змінив нічого видимого) (доказ)"}, {"en": "CHANGELOG.md and tag_day99.png (copies; the v1.1 tag on GitHub) (→ Day 108)", "uk": "CHANGELOG.md і tag_day99.png (копії; тег v1.1 на GitHub) (→ День 108)"}], "goal": {"en": "By the end of today you have review_day99.md, a self code review of BP_TownGenerator and check_assets.py for names, comments, magic numbers and performance; one refactor, Apply Plot Rules, proved safe because the same seeds build the same quarters before and after; and CHANGELOG.md, with TechTools 1.1 tagged in Git.", "uk": "До кінця дня в тебе є review_day99.md — самоперевірка коду BP_TownGenerator і check_assets.py: назви, коментарі, магічні числа й продуктивність. Ще один рефакторинг, Apply Plot Rules, безпечність якого доведено: ті самі зерна будують ті самі мікрорайони до і після. І CHANGELOG.md, а TechTools 1.1 позначено тегом у Git."}, "uses": [{"en": "Day 98: the defaults, tooltips, input checks and README", "uk": "День 98: типові значення, підказки, перевірки введення і README"}, {"en": "Days 87 and 88: Fill Row and its plot rules in BP_TownGenerator", "uk": "Дні 87 і 88: Fill Row і правила ділянок у BP_TownGenerator"}, {"en": "Day 90: Check Town and comparisons from one bookmark", "uk": "День 90: Check Town і порівняння з однієї закладки"}, {"en": "Day 74: check_assets.py", "uk": "День 74: check_assets.py"}, {"en": "Day 96: commits, git log and git push", "uk": "День 96: коміти, git log і git push"}], "quiz": [{"q": {"en": "What is a refactor?", "uk": "Що таке рефакторинг?"}, "options": [{"en": "Changing how code is organised without changing what it does", "uk": "Зміна того, як код організовано, без зміни того, що він робить"}, {"en": "Adding a new feature", "uk": "Додавання нової функції"}, {"en": "Fixing every bug at once", "uk": "Виправлення всіх помилок одразу"}, {"en": "Deleting old code", "uk": "Видалення старого коду"}], "answer": 0, "explain": {"en": "Because behaviour must not change, a refactor is proved by a before-and-after test.", "uk": "Поведінка не повинна змінитися, тож рефакторинг доводять тестом «до і після»."}}, {"q": {"en": "After collapsing Fill Row's rules into Apply Plot Rules, seed 1 builds a slightly different quarter. What is the likely cause?", "uk": "Після згортання правил Fill Row в Apply Plot Rules зерно 1 будує трохи інший мікрорайон. Яка причина найімовірніша?"}, "options": [{"en": "Collapse to Function is broken", "uk": "Collapse to Function зламаний"}, {"en": "A random draw now happens in a different order, for example after the corridor test", "uk": "Випадковий вибір тепер відбувається в іншому порядку, наприклад після тесту коридору"}, {"en": "The seed must change after a refactor", "uk": "Після рефакторингу треба змінити зерно"}, {"en": "Check Town is wrong", "uk": "Check Town помиляється"}], "answer": 1, "explain": {"en": "A stream gives the same numbers in the same order; moving one draw shifts every draw after it.", "uk": "Потік дає ті самі числа в тому самому порядку. Якщо перемістити один вибір, зсуваються всі наступні."}}, {"q": {"en": "Find in Blueprints shows Event Tick in BP_TownGenerator, connected to nothing that moves. What do you do?", "uk": "Find in Blueprints показує Event Tick у BP_TownGenerator, під'єднаний до нічого, що рухається. Що ти робиш?"}, "options": [{"en": "Remove it: static tools never use Tick", "uk": "Прибираю його: статичні інструменти не використовують Tick"}, {"en": "Keep it, because Tick is free", "uk": "Лишаю, бо Tick нічого не коштує"}, {"en": "Add a Delay to it", "uk": "Додаю до нього Delay"}, {"en": "Move it into the Construction Script", "uk": "Переношу його в Construction Script"}], "answer": 0, "explain": {"en": "Ticking actors are checked every frame; a static generator has nothing to do each frame.", "uk": "Акторів із Tick перевіряють щокадру, а статичному генератору щокадру нема чого робити."}}, {"q": {"en": "What does git tag -a v1.1 -m 'TechTools 1.1' give you?", "uk": "Що дає git tag -a v1.1 -m 'TechTools 1.1'?"}, "options": [{"en": "A copy of the project on GitHub", "uk": "Копію проєкту на GitHub"}, {"en": "A new branch", "uk": "Нову гілку"}, {"en": "A release video", "uk": "Відео релізу"}, {"en": "A name for one exact commit, so anyone can get that version back later", "uk": "Назву для одного конкретного коміту, щоб будь-хто міг пізніше отримати саме цю версію"}], "answer": 3, "explain": {"en": "Tags mark releases (-a makes the annotated kind that git push --follow-tags sends); with the changelog they say exactly what version 1.1 contains.", "uk": "Теги позначають релізи (-a робить анотований тег, який надсилає git push --follow-tags). Разом із журналом змін вони точно кажуть, що містить версія 1.1."}}, {"q": {"en": "Where does a magic number like 5000 in check_assets.py's size check belong?", "uk": "Де місце магічного числа 5000 у перевірці розміру check_assets.py?"}, "options": [{"en": "In a comment beside it", "uk": "У коментарі поруч"}, {"en": "In the report's title", "uk": "У заголовку звіту"}, {"en": "In a named setting at the top, such as MAX_SIZE_CM = 5000", "uk": "В іменованому налаштуванні вгорі, як-от MAX_SIZE_CM = 5000"}, {"en": "Nowhere: delete the check", "uk": "Ніде: видалити перевірку"}], "answer": 2, "explain": {"en": "A named setting says what the number means and lets you change it in one place.", "uk": "Іменоване налаштування каже, що означає число, і дає змінити його в одному місці."}}], "weekInfo": null, "morning": {"sofar": {"en": "TechTools has defaults that work, tooltips everywhere, readable errors and a README, and it installs in a fresh project.", "uk": "У TechTools є типові значення, що працюють, підказки всюди, зрозумілі помилки і README, і він встановлюється в новий проєкт."}, "today": {"en": "You review your own code like a senior colleague would, refactor one part safely, and release version 1.1 with a changelog.", "uk": "Ти оглядаєш свій код, як це зробив би старший колега, безпечно робиш рефакторинг однієї частини і випускаєш версію 1.1 з журналом змін."}, "cheer": {"en": "Finding problems in your own work is not failing; it is the habit that marks a professional, and you are building it today.", "uk": "Знаходити проблеми у власній роботі — не поразка. Це звичка професіонала, і сьогодні ти її будуєш."}, "quote": {"text": {"en": "Simplicity does not precede complexity, but follows it.", "uk": "Простота не передує складності, а йде за нею."}, "author": {"en": "Alan Perlis", "uk": "Алан Перліс"}, "source": "Epigrams on Programming, ACM SIGPLAN Notices, September 1982"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-99-self-code-review-refactor", "mapHref": "../../COURSE.html", "prevHref": "../Day-98-tool-quality-readme/START-HERE.html", "nextHref": "../Day-100-boss-fresh-project-district/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8, Python and Git. I am a beginner on Day 99. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me: when my Blueprint or script fails, ask for the error message or a screenshot of the graph, point to the line or node that is wrong and explain why, then let me fix it myself. Never write the whole tool for me.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: Огляд і прибирання check_assets.py, журнал змін і тег — самостійно.\nIt's part of: review_day99.md (самоперевірка коду двох інструментів), один рефакторинг (правила для кожної ділянки з Fill Row перенесено у функцію Apply Plot Rules), CHANGELOG.md і TechTools 1.1 з тегом v1.1 на GitHub (BP_TownGenerator і check_assets.py у плагіні TechTools; тести — у Content/Tools/Day98/L_Day98; нотатки огляду — у сьогоднішній папці Work; CHANGELOG.md — в IslandCourse/Plugins/TechTools.).\nWhy it matters: Код читають набагато частіше, ніж пишуть: колеги і ти через кілька місяців. Огляд за чек-листом знаходить назви, магічні числа й приховані витрати, через які інструменту важко довіряти. Рефакторинг — зміна того, як код організовано, без зміни того, що він робить, — усуває їх. Журнал змін каже користувачам, що змінилося. Сьогоднішній рефакторинг — ще й та частина, яку твій District Generator використає наступного тижня. It comes back: Apply Plot Rules — частина, яку твій District Generator використає в День 103, а CHANGELOG.md отримає запис 2.0, коли ти випустиш реліз у День 108.\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-99-self-code-review-refactor (on the drive I chose on Day 0).\nWhat I already know: День 98: типові значення, підказки, перевірки введення і README; Дні 87 і 88: Fill Row і правила ділянок у BP_TownGenerator; День 90: Check Town і порівняння з однієї закладки; День 74: check_assets.py; День 96: коміти, git log і git push; today's lessons: Читаємо код як рецензент; Перевірка продуктивності інструмента; Безпечний рефакторинг: Apply Plot Rules; Журнал змін, версія і тег. Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- review_day99.md: tool-review-checklist.md і code-style.md застосовано до BP_TownGenerator і check_assets.py. Кожен рядок позначено OK, fixed або 'not yet: why'. Є щонайменше чотири нотатки «бачу, чому, як виправити» від тьютора.\n- Перевірка продуктивності: Find in Blueprints (Ctrl+Shift+F, усі Blueprint) шукає Event Tick, і кожен збіг у TechTools обґрунтовано або прибрано. Вкладені цикли в BP_TownGenerator перелічено з тим, скільки разів вони виконуються. Записано вартість Construction Script, коли тягнеш генератор.\n- check_assets.py: магічні числа винесено в іменовані налаштування (MAX_SIZE_CM = 5000, MIN_SIZE_CM = 5 та інші), коментар-заголовок каже, що скрипт читає і пише, а звіт по /TechTools/Kit до і після однаковий.\n- Рефакторинг: правила для кожної ділянки всередині Fill Row (вибір пропуску, відстань до моря й поверхи, тест крамниці та Is In Corridor) згорнуто у функцію Apply Plot Rules. Входи — Plot (S_Plot) і World Centre (см), виходи — Plot і Keep (Boolean). Випадкові вибори йдуть у тому самому порядку, що й раніше. Fill Row викликає її один раз на ділянку.\n- Доказ: до рефакторингу — seed1_before.png і seed2_before.png із закладки на 120 м та їхні рядки Regenerate і Check Town. Після нього — ті самі картинки й рядки, однакові.\n- CHANGELOG.md у стилі Keep a Changelog (## [1.1.0] з Added, Changed і Fixed; ## [1.0.0]). У TechTools.uplugin VersionName 1.1 і Version 2. Усе закомічено, позначено тегом v1.1 і надіслано разом із тегом.\n\nMy checklist (the same numbers show on my course page):\n1. Перевір, чи є результати сьогоднішніх уроків: review_day99.md з оглядом BP_TownGenerator за чек-листом і Apply Plot Rules у BP_TownGenerator. Чогось бракує? Пройди зараз кроки «Разом із тьютором» того уроку (близько 25 хвилин): самостійна частина спирається на них. Перш ніж щось змінювати: у L_Day98 клацни Regenerate із зерном 1 і зерном 2. Для кожного зроби seedN_before.png із закладки на 120 м і скопіюй підсумковий рядок Regenerate і рядок Check Town у review_day99.md у сьогоднішній папці Work. Зроби refactor_before.png із Fill Row. Перевірка: збережено три картинки й чотири рядки. (from lesson 3)\n2. Оглянь BP_TownGenerator за чек-листом разом із тьютором і запиши кожну знахідку як OK, fixed або not yet. Перевірка: кожен рядок чек-листа має відповідь, а щонайменше чотири знахідки мають нотатки «бачу, чому, як виправити». (from lesson 1)\n3. Перевірка продуктивності: Find in Blueprints шукає Event Tick в усіх Blueprint. Перелічи вкладені цикли BP_TownGenerator і скільки разів вони виконуються для DA_RoadLayout. Перевірка: у статичному інструменті немає Tick (або записано причину), а список циклів є в review_day99.md. (from lesson 2)\n4. Виправ дві найшвидші знахідки (наприклад, невиразну назву змінної і відсутню рамку коментаря), клацни Compile і збережи. Перевірка: обидві позначено fixed у review_day99.md. (from lesson 1)\n5. Рефакторинг: згорни правила для кожної ділянки з Fill Row в Apply Plot Rules, лишивши кожен випадковий вибір перед тестом коридору. Перевірка: Fill Row коротша і викликає Apply Plot Rules один раз на ділянку, а Blueprint компілюється без попереджень. (from lesson 3)\n6. Доведи: клацни Regenerate із зернами 1 і 2, зроби seedN_after.png з тієї самої закладки і скопіюй два підсумкові рядки й рядки Check Town. Перевірка: картинки збігаються з «до» будинок у будинок, а рядки однакові. Зроби refactor_after.png. (from lesson 3)\n7. Самостійно: оглянь check_assets.py за тим самим чек-листом. Винеси його магічні числа в іменовані налаштування і покращ коментар-заголовок. Перевірка: у перевірках не лишилося голих чисел, а звіт по /TechTools/Kit такий самий, як до зміни. (from lesson 2)\n8. Самостійно: напиши CHANGELOG.md з ## [1.1.0] (Added, Changed, Fixed) і ## [1.0.0]. Перевірка: кожну зміну Днів 97–99 перелічено один раз, простими словами, зрозумілими користувачу. (from lesson 4)\n9. Постав VersionName на 1.1 і Version на 2 у TechTools.uplugin і перезапусти. Перевірка: Edit > Plugins показує TechTools 1.1. (from lesson 4)\n10. Зроби коміт зі зрозумілим повідомленням, потім git tag -a v1.1 -m 'TechTools 1.1' і git push --follow-tags (надсилає коміт і його анотований тег). Зроби скриншот tag_day99.png (тег v1.1 на GitHub). Перевірка: сторінка репозиторію показує тег v1.1 у Tags або Releases, а картинка лежить у сьогоднішній папці Work. (from lesson 4)\n11. Зроби seeds_compare.png (чотири картинки зерен поруч, з підписами «до» і «після»). Скопіюй CHANGELOG.md з Plugins/TechTools у сьогоднішню папку Work. Перевірка: refactor_before.png, refactor_after.png, seeds_compare.png і CHANGELOG.md лежать у сьогоднішній папці Work. (from lesson 3)\n12. Клацни «Копіювати звіт дня», встав у новий чат із тьютором, дай відповіді на його питання і збережи його відповідь як summary.md у сьогоднішній папці Work. Перетягни файли з розділу «Що здати» в папку здачі (кнопка на цій сторінці). Ніколи не перетягуй папку проєкту чи рівня. Перевірка: у папці здачі всі файли, кожен більший за 1 КБ. (from lesson 1)\n\nHow to help: ask which step number I'm on, then give me only the next step: the exact clicks and what I should see. When I send a screenshot, compare it with my reference, my sizes and the spec, and name one thing to fix at a time.\nCheck every save and export by reopening it before we move on:\n- a Blueprint or script: compile function setLang(l){lang=l;try{localStorage.setItem('devteam:lang',lang)}catch(e){};render()}
function toggleLang(){setLang(lang==='uk'?'en':'uk')}
/* keep open sections and keyboard focus across re-renders */
const openD=new Set();
function tg(e){if(e.open)openD.add(e.id);else openD.delete(e.id)}
const op=id=>openD.has(id)?' open':'';
function render(){const ae=document.activeElement,fid=ae&&(ae.id||(ae.getAttribute('data-th')?'th-'+ae.getAttribute('data-th'):ae.getAttribute('lang')&&ae.closest('.seg')?'lg-'+ae.getAttribute('lang'):''));
 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);
 const b=D.build,P=Math.round(prog()*100);
 document.getElementById('top').innerHTML='<div class="topin glass"><a class="maplink" href="'+esc(D.mapHref)+'">'+kn('map')+u('map')+'</a><div class="crumb"><b>'+esc(x(D.learnerName))+'</b><span>'+u('week')+' '+D.week+'</span><span>'+u('day')+' '+D.day+' '+u('of')+' '+D.total+'</span></div>'+controls(lang,'setLang')+'</div><div class="tline"><i style="width:'+P+'%"></i></div>';
 const state=w=>w<D.week?'b':w===D.week?'n':'p';
 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 let wk='';if(D.weekInfo){const w=D.weekInfo;wk='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}
 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p>'+(b.next?'<div class="back well">'+kn('arrow')+'<div><b>'+u('comes')+'</b><br>'+lk(x(b.next))+'</div></div>':'')+'<div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.assetFiles&&D.assetFiles.length?'<p class="files">'+ic('folder')+'<span>'+u('filesL')+' '+D.assetFiles.map(f=>'<a href="assets/'+encodeURIComponent(f)+'" target="_blank" rel="noopener">'+esc(f)+'</a>').join(', ')+'</span></p>':D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+=handinCard();h+=beforeCard();
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div><label class="rcpt" for="r'+i+'"><span class="eyebrow">'+u('rcpt')+'</span><textarea id="r'+i+'" rows="2" placeholder="'+esc(u('rcptPh'))+'" oninput="st.r'+i+'=this.value;save()">'+esc(st['r'+i]||'')+'</textarea></label>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+hList()+chkList()+(hasClip?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<h3>1 · '+u('copyR')+'</h3><p class="muted">'+u('report')+'</p><div class="row"><button class="btn ghost" onclick="cp(reportText())">'+ic('copy')+u('copyR')+'</button></div><h3>2 · '+u('ship')+'</h3>'+hf()+'<p class="muted" style="margin:12px 0 0">'+u('hNote')+'</p></section>';
 h+=qCard();h+=wk;
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();
</script>

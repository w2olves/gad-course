<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 99</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

ожної ділянки всередині Fill Row (вибір пропуску, відстань до моря й поверхи, тест крамниці та Is In Corridor) згорнуто у функцію Apply Plot Rules. Входи — Plot (S_Plot) і World Centre (см), виходи — Plot і Keep (Boolean). Випадкові вибори йдуть у тому самому порядку, що й раніше. Fill Row викликає її один раз на ділянку."}, {"en": "Proof: before the refactor, seed1_before.png and seed2_before.png from the 120 m bookmark with their Regenerate and Check Town lines; after it, the same pictures and lines, identical.", "uk": "Доказ: до рефакторингу — seed1_before.png і seed2_before.png із закладки на 120 м та їхні рядки Regenerate і Check Town. Після нього — ті самі картинки й рядки, однакові."}, {"en": "CHANGELOG.md in the Keep a Changelog style (## [1.1.0] with Added, Changed and Fixed; ## [1.0.0]); VersionName 1.1 and Version 2 in TechTools.uplugin; committed, tagged v1.1 and pushed with the tag.", "uk": "CHANGELOG.md у стилі Keep a Changelog (## [1.1.0] з Added, Changed і Fixed; ## [1.0.0]). У TechTools.uplugin VersionName 1.1 і Version 2. Усе закомічено, позначено тегом v1.1 і надіслано разом із тегом."}], "piece1": "The checklist review of BP_TownGenerator and the Apply Plot Rules refactor (built in the lessons)", "piece2": {"en": "check_assets.py's review and clean-up, the changelog and the tag, on your own", "uk": "Огляд і прибирання check_assets.py, журнал змін і тег — самостійно"}, "steps": [{"text": {"en": "Check: the results of today's lessons are there (review_day99.md with the checklist review of BP_TownGenerator, and Apply Plot Rules in BP_TownGenerator). Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it. Before you change anything: in L_Day98 Regenerate seed 1 and seed 2; for each take seedN_before.png from the 120 m bookmark and copy the Regenerate summary line and the Check Town line into review_day99.md in today's Work folder; take refactor_before.png of Fill Row. Check: three pictures and four lines saved.", "uk": "Перевір, чи є результати сьогоднішніх уроків: review_day99.md з оглядом BP_TownGenerator за чек-листом і Apply Plot Rules у BP_TownGenerator. Чогось бракує? Пройди зараз кроки «Разом із тьютором» того уроку (близько 25 хвилин): самостійна частина спирається на них. Перш ніж щось змінювати: у L_Day98 клацни Regenerate із зерном 1 і зерном 2. Для кожного зроби seedN_before.png із закладки на 120 м і скопіюй підсумковий рядок Regenerate і рядок Check Town у review_day99.md у сьогоднішній папці Work. Зроби refactor_before.png із Fill Row. Перевірка: збережено три картинки й чотири рядки."}, "lesson": 3}, {"text": {"en": "Review BP_TownGenerator with the checklist and the tutor, writing every finding as OK, fixed or not yet. Check: every checklist line has an answer, and at least four findings have see-why-fix notes.", "uk": "Оглянь BP_TownGenerator за чек-листом разом із тьютором і запиши кожну знахідку як OK, fixed або not yet. Перевірка: кожен рядок чек-листа має відповідь, а щонайменше чотири знахідки мають нотатки «бачу, чому, як виправити»."}, "lesson": 1}, {"text": {"en": "Performance read: Find in Blueprints for Event Tick across all Blueprints, and list BP_TownGenerator's loops inside loops with how often they run for DA_RoadLayout. Check: no Tick in a static tool (or a written reason) and the loop list in review_day99.md.", "uk": "Перевірка продуктивності: Find in Blueprints шукає Event Tick в усіх Blueprint. Перелічи вкладені цикли BP_TownGenerator і скільки разів вони виконуються для DA_RoadLayout. Перевірка: у статичному інструменті немає Tick (або записано причину), а список циклів є в review_day99.md."}, "lesson": 2}, {"text": {"en": "Fix the two quickest findings (for example a vague variable name and a missing comment box), compile and save. Check: both marked fixed in review_day99.md.", "uk": "Виправ дві найшвидші знахідки (наприклад, невиразну назву змінної і відсутню рамку коментаря), клацни Compile і збережи. Перевірка: обидві позначено fixed у review_day99.md."}, "lesson": 1}, {"text": {"en": "The refactor: collapse Fill Row's per-plot rules into Apply Plot Rules, keeping every random draw before the corridor test. Check: Fill Row is shorter and calls Apply Plot Rules once per plot, and the Blueprint compiles with no warnings.", "uk": "Рефакторинг: згорни правила для кожної ділянки з Fill Row в Apply Plot Rules, лишивши кожен випадковий вибір перед тестом коридору. Перевірка: Fill Row коротша і викликає Apply Plot Rules один раз на ділянку, а Blueprint компілюється без попереджень."}, "lesson": 3}, {"text": {"en": "Prove it: Regenerate seeds 1 and 2, take seedN_after.png from the same bookmark and copy the two summary lines and Check Town lines. Check: the pictures match the before ones building for building and the lines are identical; take refactor_after.png.", "uk": "Доведи: клацни Regenerate із зернами 1 і 2, зроби seedN_after.png з тієї самої закладки і скопіюй два підсумкові рядки й рядки Check Town. Перевірка: картинки збігаються з «до» будинок у будинок, а рядки однакові. Зроби refactor_after.png."}, "lesson": 3}, {"text": {"en": "On your own: review check_assets.py with the same checklist; move its magic numbers into named settings and improve its header comment. Check: no bare number is left in its checks, and the report on /TechTools/Kit is the same as before the change.", "uk": "Самостійно: оглянь check_assets.py за тим самим чек-листом. Винеси його магічні числа в іменовані налаштування і покращ коментар-заголовок. Перевірка: у перевірках не лишилося голих чисел, а звіт по /TechTools/Kit такий самий, як до зміни."}, "lesson": 2}, {"text": {"en": "On your own: write CHANGELOG.md with ## [1.1.0] (Added, Changed, Fixed) and ## [1.0.0]. Check: every change from Days 97 to 99 is listed once, in plain words a user understands.", "uk": "Самостійно: напиши CHANGELOG.md з ## [1.1.0] (Added, Changed, Fixed) і ## [1.0.0]. Перевірка: кожну зміну Днів 97–99 перелічено один раз, простими словами, зрозумілими користувачу."}, "lesson": 4}, {"text": {"en": "Set VersionName to 1.1 and Version to 2 in TechTools.uplugin and restart. Check: Edit > Plugins shows TechTools 1.1.", "uk": "Постав VersionName на 1.1 і Version на 2 у TechTools.uplugin і перезапусти. Перевірка: Edit > Plugins показує TechTools 1.1."}, "lesson": 4}, {"text": {"en": "Commit with a clear message, then git tag -a v1.1 -m 'TechTools 1.1' and git push --follow-tags (it pushes the commit and its annotated tag). Take tag_day99.png (the tag v1.1 on GitHub). Check: the repository page lists the tag v1.1 under Tags or Releases, and the picture is in today's Work folder.", "uk": "Зроби коміт зі зрозумілим повідомленням, потім git tag -a v1.1 -m 'TechTools 1.1' і git push --follow-tags (надсилає коміт і його анотований тег). Зроби скриншот tag_day99.png (тег v1.1 на GitHub). Перевірка: сторінка репозиторію показує тег v1.1 у Tags або Releases, а картинка лежить у сьогоднішній папці Work."}, "lesson": 4}, {"text": {"en": "Make seeds_compare.png (the four seed pictures side by side, labelled before and after). Copy CHANGELOG.md from Plugins/TechTools into today's Work folder. Check: refactor_before.png, refactor_after.png, seeds_compare.png and CHANGELOG.md are in today's Work folder.", "uk": "Зроби seeds_compare.png (чотири картинки зерен поруч, з підписами «до» і «після»). Скопіюй CHANGELOG.md з Plugins/TechTools у сьогоднішню папку Work. Перевірка: refactor_before.png, refactor_after.png, seeds_compare.png і CHANGELOG.md лежать у сьогоднішній папці Work."}, "lesson": 3}, {"text": {"en": "Click Copy the day report, paste it into a new tutor chat, answer its questions and save its answer as summary.md in today's Work folder. Drag the files listed under What you hand in into today's hand-in folder (the button on this page); never a project or level folder. Check: the hand-in folder lists all the files, each over 1 KB.", "uk": "Клацни «Копіювати звіт дня», встав у новий чат із тьютором, дай відповіді на його питання і збережи його відповідь як summary.md у сьогоднішній папці Work. Перетягни файли з розділу «Що здати» в папку здачі (кнопка на цій сторінці). Ніколи не перетягуй папку проєкту чи рівня. Перевірка: у папці здачі всі файли, кожен більший за 1 КБ."}, "lesson": 1}], "assets": ["techart/tool-review-checklist.md", "techart/code-style.md"], "next": {"en": "Apply Plot Rules is the piece your District Generator reuses on Day 103, and CHANGELOG.md gets its 2.0 entry when you release on Day 108.", "uk": "Apply Plot Rules — частина, яку твій District Generator використає в День 103, а CHANGELOG.md отримає запис 2.0, коли ти випустиш реліз у День 108."}}, "lessons": [{"title": {"en": "Reading code like a reviewer", "uk": "Читаємо код як рецензент"}, "minutes": 40, "goals": [{"en": "Explain a code review: reading code against a checklist to find problems before users do, with notes that say what, why and how to fix.", "uk": "Пояснювати, що таке огляд коду: читання коду за чек-листом, щоб знайти проблеми раніше за користувачів, з нотатками «що, чому і як виправити»."}, {"en": "Use tool-review-checklist.md and code-style.md on your own Blueprint.", "uk": "Застосовувати tool-review-checklist.md і code-style.md до власного Blueprint."}, {"en": "Write findings as see-why-fix notes and sort them by how much they matter.", "uk": "Записувати знахідки як нотатки «бачу, чому, як виправити» і сортувати їх за важливістю."}], "doalong": [{"en": "Open tool-review-checklist.md and code-style.md beside BP_TownGenerator. Copy the checklist's 18 lines into review_day99.md. You see 18 lines waiting for an answer.", "uk": "Відкрий tool-review-checklist.md і code-style.md поруч із BP_TownGenerator. Скопіюй 18 рядків чек-листа в review_day99.md. Має вийти: 18 рядків, що чекають на відповідь."}, {"en": "Names: check that every variable and function is named for what it holds or does. Mark each vague one (Temp, NewVar_0, DoStuff) with a better name. You see your first findings.", "uk": "Назви: перевір, чи кожна змінна і функція названа за тим, що вона зберігає чи робить. Кожній невиразній (Temp, NewVar_0, DoStuff) запиши кращу назву. Має вийти: перші знахідки."}, {"en": "Comments: is every group of nodes inside a comment box with one line saying what it does? Mark the bare groups. You see where a new reader would get lost.", "uk": "Коментарі: чи кожна група вузлів у рамці коментаря з одним рядком про те, що вона робить? Познач групи без рамки. Так видно, де новий читач загубиться."}, {"en": "Magic numbers: find numbers typed straight into nodes (100, 50, 10000) and ask whether each is a unit change (fine, with a comment) or a rule that belongs in DA_TownRules. Mark the rules. You see which numbers should become settings.", "uk": "Магічні числа: знайди числа, введені прямо у вузли (100, 50, 10000). Для кожного спитай себе: це перетворення одиниць (нормально, з коментарем) чи правило, якому місце в DA_TownRules? Познач правила. Має вийти: видно, які числа мають стати налаштуваннями."}, {"en": "Paste three findings into the tutor chat and ask for see-why-fix notes as a senior technical artist would give them; then sort all findings into breaks, confuses and tidies. You see a short, ranked list.", "uk": "Встав три знахідки в чат із тьютором і попроси нотатки «бачу, чому, як виправити», як дав би старший технічний художник. Потім розклади всі знахідки на «ламає», «заплутує» і «для порядку». Має вийти: короткий список за рангом."}], "play": {"en": "Review a stranger's graph: the tutor describes a small Blueprint with five problems (a variable called A; a 15-node chain with no comment; the number 7 typed in three places; an Event Tick that moves nothing; a function called DoStuff). I write one see-why-fix note for each.", "uk": "Огляд чужого графа: тьютор описує маленький Blueprint із п'ятьма проблемами (змінна A; ланцюжок із 15 вузлів без коментаря; число 7, введене в трьох місцях; Event Tick, що нічого не рухає; функція DoStuff). На кожну я пишу одну нотатку «бачу, чому, як виправити»."}, "video": {"search": "unreal engine blueprint best practices code review readability"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Читаємо код як рецензент (Day 99, lesson 1 of 4). Today's build: review_day99.md (самоперевірка коду двох інструментів), один рефакторинг (правила для кожної ділянки з Fill Row перенесено у функцію Apply Plot Rules), CHANGELOG.md і TechTools 1.1 з тегом v1.1 на GitHub.\nWhat I already know: День 98: типові значення, підказки, перевірки введення і README; Дні 87 і 88: Fill Row і правила ділянок у BP_TownGenerator; День 90: Check Town і порівняння з однієї закладки; День 74: check_assets.py; День 96: коміти, git log і git push.\n\nBy the end of this lesson I can:\n1. Пояснювати, що таке огляд коду: читання коду за чек-листом, щоб знайти проблеми раніше за користувачів, з нотатками «що, чому і як виправити».\n2. Застосовувати tool-review-checklist.md і code-style.md до власного Blueprint.\n3. Записувати знахідки як нотатки «бачу, чому, як виправити» і сортувати їх за важливістю.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: У TechTools є типові значення, що працюють, підказки всюди, зрозумілі помилки і README, і він встановлюється в новий проєкт. Today: Ти оглядаєш свій код, як це зробив би старший колега, безпечно робиш рефакторинг однієї частини і випускаєш версію 1.1 з журналом змін. One encouraging line: Знаходити проблеми у власній роботі — не поразка. Це звичка професіонала, і сьогодні ти її будуєш.); 2 lines on why today matters and where it comes back, in plain words (from this: Код читають набагато частіше, ніж пишуть: колеги і ти через кілька місяців. Огляд за чек-листом знаходить назви, магічні числа й приховані витрати, через які інструменту важко довіряти. Рефакторинг — зміна того, як код організовано, без зміни того, що він робить, — усуває їх. Журнал змін каже користувачам, що змінилося. Сьогоднішній рефакторинг — ще й та частина, яку твій District Generator використає наступного тижня. It comes back: Apply Plot Rules — частина, яку твій District Generator використає в День 103, а CHANGELOG.md отримає запис 2.0, коли ти випустиш реліз у День 108.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-99-self-code-review-refactor exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (Огляд BP_TownGenerator за чек-листом і рефакторинг Apply Plot Rules (робиш на уроках)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Відкрий tool-review-checklist.md і code-style.md поруч із BP_TownGenerator. Скопіюй 18 рядків чек-листа в review_day99.md. Має вийти: 18 рядків, що чекають на відповідь.\n   2. Назви: перевір, чи кожна змінна і функція названа за тим, що вона зберігає чи робить. Кожній невиразній (Temp, NewVar_0, DoStuff) запиши кращу назву. Має вийти: перші знахідки.\n   3. Коментарі: чи кожна група вузлів у рамці коментаря з одним рядком про те, що вона робить? Познач групи без рамки. Так видно, де новий читач загубиться. [screenshot]\n   4. Магічні числа: знайди числа, введені прямо у вузли (100, 50, 10000). Для кожного спитай себе: це перетворення одиниць (нормально, з коментарем) чи правило, якому місце в DA_TownRules? Познач правила. Має вийти: видно, які числа мають стати налаштуваннями.\n   5. Встав три знахідки в чат із тьютором і попроси нотатки «бачу, чому, як виправити», як дав би старший технічний художник. Потім розклади всі знахідки на «ламає», «заплутує» і «для порядку». Має вийти: короткий список за рангом. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Огляд чужого графа: тьютор описує маленький Blueprint із п'ятьма проблемами (змінна A; ланцюжок із 15 вузлів без коментаря; число 7, введене в трьох місцях; Event Tick, що нічого не рухає; функція DoStuff). На кожну я пишу одну нотатку «бачу, чому, як виправити». Otherwise skip it.\n6. Review: ask me these questions from earlier days, one at a time, and correct me kindly: Day 96: Why does .gitattributes go into the very first commit? | Day 92: What does statistics.quantiles(times, n=100, method='inclusive')[94] give you?\n7. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n8. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) N

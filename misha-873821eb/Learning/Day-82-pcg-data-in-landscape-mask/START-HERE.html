ut 0.8 m per pixel.", "uk": "Крізь чорне видно вулицю. 200 м на 256 px — це близько 0,8 м на піксель."}, {"en": "On a new layer paint white strips 4 to 5 px wide (3 to 4 m) along the pavement where café terraces belong, 30 to 50 m long, on one side of the street. Hide the screenshot layer, save T_Mask_Shops.kra and export T_Mask_Shops.png. You see a black square with your white strips.", "uk": "На новому шарі намалюй уздовж тротуару, де мають бути тераси кафе, білі смуги завширшки 4–5 пікселів (3–4 м) і завдовжки 30–50 м, з одного боку вулиці. Сховай шар зі скриншотом, збережи T_Mask_Shops.kra й експортуй T_Mask_Shops.png. Має вийти чорний квадрат із білими смугами."}, {"en": "In IslandCourse make Content/Tools/Data and drag T_Mask_Shops.png in. Open it: untick sRGB, set Compression Settings to VectorDisplacementmap (RGBA8) (uncompressed, so PCG can read every pixel) and Mip Gen Settings to NoMipmaps; Save.", "uk": "В IslandCourse створи Content/Tools/Data і перетягни туди T_Mask_Shops.png. Відкрий текстуру: зніми прапорець sRGB, встанови Compression Settings на VectorDisplacementmap (RGBA8) — без стиснення, щоб PCG прочитав кожен піксель, — і Mip Gen Settings на NoMipmaps. Збережи."}, {"en": "You see the new settings in the texture's Details. If PCG later can't read the texture, tick Force Editor Only CPU Sampling on the Get Texture Data node (it needs exactly these settings: sRGB off, no mipmaps, uncompressed), or try UserInterface2D (RGBA).", "uk": "Нові налаштування видно в Details текстури. Якщо PCG згодом не прочитає текстуру, познач Force Editor Only CPU Sampling на вузлі Get Texture Data — йому потрібні саме ці налаштування: sRGB вимкнено, без mipmap, без стиснення. Або спробуй UserInterface2D (RGBA)."}], "play": {"en": "Pixels and metres: the tutor gives me four sizes in metres (a 4 m terrace, a 40 m strip, a 12 m plaza, a 1 m gap) and asks how many pixels each is on my 256 px mask over 200 m; then three sizes in pixels the other way round.", "uk": "Пікселі й метри: тьютор дає чотири розміри в метрах (тераса 4 м, смуга 40 м, площа 12 м, проміжок 1 м) і питає, скільки пікселів займає кожен на моїй масці 256 пікселів на 200 м. Потім навпаки — три розміри в пікселях."}, "video": {"search": "unreal engine 5 pcg texture mask paint krita import settings sRGB compression"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Малювання маски: зони, які дизайнер може змінювати (Day 82, lesson 3 of 4). Today's build: L_Day82: вулиця на ландшафті з PCG_Street_Base, PCG_VergeTrees, що ростуть із даних ландшафту, і T_Mask_Shops, що ставить столики кафе й прибирає лавки та стовпчики із зони крамниць.\nWhat I already know: День 81: PCG_Street_Base, BP_StreetSpline і правило Slot; День 36: Get Landscape Data, Surface Sampler, Normal To Density і фільтр нахилу; День 38: зони-винятки з Bounds Modifier і Difference; День 27 і День 34: ліплення й вирівнювання ландшафту; День 4: малювання з вимірюванням у Krita.\nEarlier today I already did: lesson 1 (Вулиця на справжній землі); lesson 2 (Дані ландшафту: дерева там, де дозволяє земля). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Пояснювати, що таке маска: чорно-біла текстура, де біле означає «так, тут», а чорне — «тут ні». Її малює дизайнер замість правок у графі.\n2. Малювати T_Mask_Shops у Krita поверх виду згори на PCG Volume і рахувати, скільки метрів в одному пікселі.\n3. Імпортувати маску так, щоб PCG читав кожен піксель: sRGB вимкнено, Compression Settings без стиснення.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: 2 lines on why today matters and where it comes back, in plain words (from this: Справжня розстановка береться з даних: дорога, яку хтось намалював, рельєф землі й зони, які малює дизайнер. Маска — найпростіший спосіб для дизайнера сказати «тут крамниці», не відкриваючи граф. Ландшафт підказує графу, де надто круто для дерев. Студії будують графи, що читають такі входи, тож той самий граф працює на кожній вулиці кожної мапи. It comes back: У п'ятницю (День 85) T_Mask_Shops і правила ландшафту повернуться всередині PCG_StreetDresser. У День 88 маски й зони вирішать, де в твоєму місті крамниці й високі будинки.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-82-pcg-data-in-landscape-mask exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (Дерева вздовж узбіччя з ландшафту та маска крамниць (на уроках)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. У в'юпорті рівня клацни Perspective угорі ліворуч і вибери Top. Охопи весь PCG Volume вулиці так, щоб його краї торкалися країв кадру, і зроби скриншот street_top.png (Win+Shift+S). Вулицю видно точно згори.\n   2. У Krita вибери File > New: 256 × 256 px, чорне тло. Перетягни street_top.png як новий шар, задай непрозорість 50 % і розтягни його точно на все полотно (інструмент Transform, Ctrl+T), щоб краї об'єму збіглися з краями полотна.\n   3. Крізь чорне видно вулицю. 200 м на 256 px — це близько 0,8 м на піксель. [screenshot]\n   4. На новому шарі намалюй уздовж тротуару, де мають бути тераси кафе, білі смуги завширшки 4–5 пікселів (3–4 м) і завдовжки 30–50 м, з одного боку вулиці. Сховай шар зі скриншотом, збережи T_Mask_Shops.kra й експортуй T_Mask_Shops.png. Має вийти чорний квадрат із білими смугами.\n   5. В IslandCourse створи Content/Tools/Data і перетягни туди T_Mask_Shops.png. Відкрий текстуру: зніми прапорець sRGB, встанови Compression Settings на VectorDisplacementmap (RGBA8) — без стиснення, щоб PCG прочитав кожен піксель, — і Mip Gen Settings на NoMipmaps. Збережи.\n   6. Нові налаштування видно в Details текстури. Якщо PCG згодом не прочитає текстуру, познач Force Editor Only CPU Sampling на вузлі Get Texture Data — йому потрібні саме ці налаштування: sRGB вимкнено, без mipmap, без стиснення. Або спробуй UserInterface2D (RGBA). [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Пікселі й метри: тьютор дає чотири розміри в метрах (тераса 4 м, смуга 40 м, площа 12 м, проміжок 1 м) і питає, скільки пікселів займає кожен на моїй масці 256 пікселів на 200 м. Потім навпаки — три розміри в пікселях. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); File Explorer = Провідник; mesh = меш; vertex / edge / face = вершина / ребро / грань; origin (and kit pivot) = origin — точка, за яку об'єкт ставлять і обертають; world origin / 3D cursor = центр світу / 3D-курсор; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); modifier = модифікатор; level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; material slot / node / pin = слот матеріалу / вузол / вхід; volume (PCG Volume, Post Process Volume) = об'єм; seed = зерно (налаштування Seed); map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}, {"title": {"en": "The mask drives placement", "uk": "Маска керує розстановкою"}, "minutes": 40, "goals": [{"en": "Turn the mask into points with Get Texture Data and a sampler, and keep the white ones with a Density Filter.", "uk": "Перетворювати маску на точки вузлами Get Texture Data і семплером і лишати білі вузлом Density Filter."}, {"en": "Use the same points twice: café tables where they are, and a Difference that clears benches and bollards from the shop zone.", "uk": "Брати ті самі точки двічі: столики кафе там, де вони є, і Difference, що прибирає лавки й стовпчики із зони крамниць."}, {"en": "Line the mask up with the world, and fix a mirrored or turned mask.", "uk": "Вирівнювати маску зі світом і виправляти віддзеркалену чи повернуту маску."}], "doalong": [{"en": "In PCG_Street_Base add Get Texture Data and set its Texture to T_Mask_Shops. In its Details tick Density Source Channel and set it to Red: your grey mask holds its value in Red, while the default channel may be Alpha, which is 1 everywhere in a picture without transparency, so every point would pass (if you see Color Channel instead, set that to Red).", "uk": "У PCG_Street_Base додай Get Texture Data і задай Texture T_Mask_Shops. У Details познач Density Source Channel і встанови Red. Твоя сіра маска тримає значення в Red, а типовий канал може бути Alpha — у зображенні без прозорості він усюди 1, і пройшла б кожна точка. Якщо замість цього є Color Channel, встанови його на Red."}, {"en": "You see Density Source Channel set to Red in the node's Details. After Get Texture Data add a Surface Sampler (Points Per Squared Meter 0.1): it makes points on the mask's flat plane, each with the mask's value as its Density (a Texture Sampler can do the same job; set its texture and channel the same way).", "uk": "У Details вузла Density Source Channel стоїть Red. Після Get Texture Data додай Surface Sampler (Points Per Squared Meter 0.1). Він ставить точки на пласкій площині маски, і Density кожної дорівнює значенню маски. Texture Sampler зробить те саме; задай йому текстуру й канал так само."}, {"en": "Then a Density Filter (Lower Bound 0.5). Press D on the filter. You see points in the shape of your white strips, spread over the volume at the height of its centre.", "uk": "Потім Density Filter (Lower Bound 0.5). Натисни D на фільтрі. Точки повторюють форму білих смуг і лежать по об'єму на висоті його центру."}, {"en": "Check the alignment: the strips should sit on the pavement where you painted them. If the shape is mirrored or turned by 90 degrees, mirror or rotate the image in Krita (Image menu), export over the same PNG, right-click T_Mask_Shops > Reimport and Generate. You see the points move onto the pavement.", "uk": "Перевір вирівнювання: смуги мають лягти на тротуар там, де їх намальовано. Якщо форма віддзеркалена чи повернута на 90°, віддзеркаль або поверни зображення в Krita (меню Image), експортуй поверх того самого PNG, клацни правою кнопкою на T_Mask_Shops > Reimport і клацни Generate. Точки переходять на тротуар."}, {"en": "Add Self Pruning (so tables don't overlap) and a Static Mesh Spawner with a café table and chairs (from a free Fab pack, or your SM_Bench as a stand-in) into Output. Generate. You see café tables only in the white zone.", "uk": "Додай Self Pruning, щоб столики не перекривалися, і Static Mesh Spawner зі столиком і стільцями кафе (з безкоштовного паку Fab або SM_Bench як заміна), з'єднаний з Output. Клацни Generate. Столики кафе стоять лише в білій зоні."}, {"en": "From the Density Filter also add a Bounds Modifier (Mode Set, -200, -200, -500 to 200, 200, 500). Add a Difference (Binary) on the bench branch and another on the bollard branch, each just before its spawner, with the Bounds Modifier in their Differences pins. Generate. You see benches and bollards gone from the shop zone and kept everywhere else, with the lamps untouched.", "uk": "Від Density Filter додай ще Bounds Modifier (Mode Set, від -200, -200, -500 до 200, 200, 500). Додай Difference (Binary) на гілку лавок і ще один на гілку стовпчиків, кожен перед своїм спавнером, з Bounds Modifier у вході Differences. Клацни Generate. Лавок і стовпчиків у зоні крамниць немає, а всюди інде вони лишилися; ліхтарі не зачеплено."}], "play": {"en": "Designer test: the tutor plays a level designer asking for three changes (cafés on the other side; a longer terrace; no cafés near the bend). For each I say whether I change the graph or the mask, and I do one of them.", "uk": "Тест дизайнера: тьютор грає дизайнера рівнів, що просить три зміни — кафе з іншого боку; довша тераса; жодного кафе біля вигину. Для кожної скажи, змінюєш ти граф чи маску, і зроби одну."}, "video": {"search": "unreal engine 5 pcg get texture data texture sampler density filter mask"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Маска керує розстановкою (Day 82, lesson 4 of 4). Today's build: L_Day82: вулиця на ландшафті з PCG_Street_Base, PCG_VergeTrees, що ростуть із даних ландшафту, і T_Mask_Shops, що ставить столики кафе й прибирає лавки та стовпчики із зони крамниць.\nWhat I already know: День 81: PCG_Street_Base, BP_StreetSpline і правило Slot; День 36: Get Landscape Data, Surface Sampler, Normal To Density і фільтр нахилу; День 38: зони-винятки з Bounds Modifier і Difference; День 27 і День 34: ліплення й вирівнювання ландшафту; День 4: малювання з вимірюванням у Krita.\nEarlier today I already did: lesson 1 (Вулиця на справжній землі); lesson 2 (Дані ландшафту: дерева там, де дозволяє земля); lesson 3 (Малювання маски: зони, які дизайнер може змінювати). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Перетворювати маску на точки вузлами Get Texture Data і семплером і лишати білі вузлом Density Filter.\n2. Брати ті самі точки двічі: столики кафе там, де вони є, і Difference, що прибирає лавки й стовпчики із зони крамниць.\n3. Вирівнювати маску зі світом і виправляти віддзеркалену чи повернуту маску.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: 2 lines on why today matters and where it comes back, in plain words (from this: Справжня розстановка береться з даних: дорога, яку хтось намалював, рельєф землі й зони, які малює дизайнер. Маска — найпростіший спосіб для дизайнера сказати «тут крамниці», не відкриваючи граф. Ландшафт підказує графу, де надто круто для дерев. Студії будують графи, що читають такі входи, тож той самий граф працює на кожній вулиці кожної мапи. It comes back: У п'ятницю (День 85) T_Mask_Shops і правила ландшафту повернуться всередині PCG_StreetDresser. У День 88 маски й зони вирішать, де в твоєму місті крамниці й високі будинки.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-82-pcg-data-in-landscape-mask exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (Дерева вздовж узбіччя з ландшафту та маска крамниць (на уроках)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. У PCG_Street_Base додай Get Texture Data і задай Texture T_Mask_Shops. У Details познач Density Source Channel і встанови Red. Твоя сіра маска тримає значення в Red, а типовий канал може бути Alpha — у зображенні без прозорості він усюди 1, і пройшла б кожна точка. Якщо замість цього є Color Channel, встанови його на Red.\n   2. У Details вузла Density Source Channel стоїть Red. Після Get Texture Data додай Surface Sampler (Points Per Squared Meter 0.1). Він ставить точки на пласкій площині маски, і Density кожної дорівнює значенню маски. Texture Sampler зробить те саме; задай йому текстуру й канал так само.\n   3. Потім Density Filter (Lower Bound 0.5). Натисни D на фільтрі. Точки повторюють форму білих смуг і лежать по об'єму на висоті його центру. [screenshot]\n   4. Перевір вирівнювання: смуги мають лягти на тротуар там, де їх намальовано. Якщо форма віддзеркалена чи повернута на 90°, віддзеркаль або поверни зображення в Krita (меню Image), експортуй поверх того самого PNG, клацни правою кнопкою на T_Mask_Shops > Reimport і клацни Generate. Точки переходять на тротуар.\n   5. Додай Self Pruning, щоб столики не перекривалися, і Static Mesh Spawner зі столиком і стільцями кафе (з безкоштовного паку Fab або SM_Bench як заміна), з'єднаний з Output. Клацни Generate. Столики кафе стоять лише в білій зоні.\n   6. Від Density Filter додай ще Bounds Modifier (Mode Set, від -200, -200, -500 до 200, 200, 500). Додай Difference (Binary) на гілку лавок і ще один на гілку стовпчиків, кожен перед своїм спавнером, з Bounds Modifier у вході Differences. Клацни Generate. Лавок і стовпчиків у зоні крамниць немає, а всюди інде вони лишилися; ліхтарі не зачеплено. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Тест дизайнера: тьютор грає дизайнера рівнів, що просить три зміни — кафе з іншого боку; довша тераса; жодного кафе біля вигину. Для кожної скажи, змінюєш ти граф чи маску, і зроби одну. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); default value = типове значення; File Explorer = Провідник; mesh = меш; vertex / edge / face = вершина / ребро / грань; origin (and kit pivot) = origin — точка, за яку об'єкт ставлять і обертають; world origin / 3D cursor = центр світу / 3D-курсор; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); modifier = модифікатор; level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; grey box placeholder = сірий блок (заглушка); material slot / node / pin = слот матеріалу / вузол / вхід; volume (PCG Volume, Post Process Volume) = об'єм; seed = зерно (налаштування Seed); keep-out zone / footprint test / grounding = зона-виняток / тест опори / посадка на ґрунт; map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; district / plot / plot plan = район / ділянка / план ділянки; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}], "handin": [{"en": "summary.md", "uk": "summary.md (звіт дня)"}, {"en": "T_Mask_Shops.png and T_Mask_Shops.kra (you repaint it on Friday) (→ Day 85)", "uk": "T_Mask_Shops.png та T_Mask_Shops.kra (у п'ятницю ти її перемалюєш) (→ День 85)"}, {"en": "cafes_day82.png (café tables only where your painted mask is white) (proof)", "uk": "cafes_day82.png (столики кафе лише там, де твоя намальована маска біла) (доказ)"}], "goal": {"en": "By the end of today you have a street on a real landscape dressed by PCG_Street_Base, verge trees from Get Landscape Data kept off steep ground and off the street, and T_Mask_Shops, a mask you painted, deciding where café tables go and where benches and bollards stay away.", "uk": "До кінця дня ти матимеш вулицю на справжньому ландшафті, оформлену PCG_Street_Base. Уздовж узбіччя ростуть дерева з Get Landscape Data, далеко від крутих схилів і від вулиці. А T_Mask_Shops — маска, яку ти намалюєш сам, — вирішує, де стоять столики кафе і де не стоять лавки та стовпчики."}, "uses": [{"en": "Day 81: PCG_Street_Base, BP_StreetSpline and the Slot rule", "uk": "День 81: PCG_Street_Base, BP_StreetSpline і правило Slot"}, {"en": "Day 36: Get Landscape Data, Surface Sampler, Normal To Density and the slope filter", "uk": "День 36: Get Landscape Data, Surface Sampler, Normal To Density і фільтр нахилу"}, {"en": "Day 38: keep-outs with Bounds Modifier and Difference", "uk": "День 38: зони-винятки з Bounds Modifier і Difference"}, {"en": "Days 27 and 34: sculpting and flattening a landscape", "uk": "День 27 і День 34: ліплення й вирівнювання ландшафту"}, {"en": "Day 4: drawing to measure in Krita", "uk": "День 4: малювання з вимірюванням у Krita"}], "quiz": [{"q": {"en": "Café tables appear in a mirror image of your white strips. What do you do?", "uk": "Столики кафе стоять дзеркально до білих смуг. Що робити?"}, "options": [{"en": "Turn sRGB on", "uk": "Увімкнути sRGB"}, {"en": "Raise the Density Filter's Lower Bound", "uk": "Підняти Lower Bound у Density Filter"}, {"en": "Mirror the image in Krita, export over the same file and reimport", "uk": "Віддзеркалити зображення в Krita, експортувати поверх того самого файлу й зробити Reimport"}, {"en": "Add Self Pruning", "uk": "Додати Self Pruning"}], "answer": 2, "explain": {"en": "The texture's axes don't match the volume's; fixing the image keeps the graph untouched.", "uk": "Осі текстури не збігаються з осями об'єму, а виправлення зображення лишає граф незмінним."}}, {"q": {"en": "Why does a Density Filter with Lower Bound 0.82 after Normal To Density keep slopes under about 35 degrees?", "uk": "Чому Density Filter з Lower Bound 0.82 після Normal To Density лишає схили менше приблизно 35°?"}, "options": [{"en": "0.82 is the cosine of 35 degrees, and Normal To Density gives 1 on flat ground", "uk": "0.82 — косинус 35°, а Normal To Density дає 1 на пласкій землі"}, {"en": "0.82 m is the tree height", "uk": "0,82 м — це висота дерева"}, {"en": "PCG measures slopes in percent", "uk": "PCG міряє схили у відсотках"}, {"en": "It removes 82 % of the points", "uk": "Він прибирає 82 % точок"}], "answer": 0, "explain": {"en": "Normal To Density turns how upright the ground is into a density, so a bound on density is a bound on slope.", "uk": "Normal To Density перетворює крутизну землі на щільність, тож межа щільності — це межа схилу."}}, {"q": {"en": "Trees grow right at the kerb. Which node do you check first?", "uk": "Дерева ростуть просто біля бордюру. Який вузол перевірити спершу?"}, "options": [{"en": "The Density Filter", "uk": "Density Filter"}, {"en": "The Bounds Modifier feeding the Difference: its box is too small", "uk": "Bounds Modifier, що живить Difference: його рамка замала"}, {"en": "Transform Points", "uk": "Transform Points"}, {"en": "The Static Mesh Spawner", "uk": "Static Mesh Spawner"}], "answer": 1, "explain": {"en": "The Bounds Modifier sets how wide the keep-out band along the street is.", "uk": "Bounds Modifier задає ширину смуги-винятку вздовж вулиці."}}, {"q": {"en": "Why paint a mask instead of placing café tables by hand?", "uk": "Чому краще намалювати маску, ніж розставляти столики кафе вручну?"}, "options": [{"en": "Masks render faster", "uk": "Маски швидше рендеряться"}, {"en": "PCG can't use hand-placed props", "uk": "PCG не може використовувати пропси, розставлені вручну"}, {"en": "Masks make props smaller", "uk": "Маски роблять пропси меншими"}, {"en": "A designer can change the zones by painting, and the graph places everything again the same way", "uk": "Дизайнер змінює зони пензлем, а граф щоразу так само розставляє все знову"}], "answer": 3, "explain": {"en": "The mask is data a designer owns; the graph turns it into placement every time.", "uk": "Маска — це дані дизайнера, а граф щоразу перетворює їх на розстановку."}}, {"q": {"en": "PCG reads nothing from your mask and the Output Log mentions the texture. What do you try?", "uk": "PCG нічого не читає з твоєї маски, а Output Log згадує текстуру. Що спробувати?"}, "options": [{"en": "A bigger Density Filter", "uk": "Більший Density Filter"}, {"en": "sRGB off and an uncompressed Compression Setting, then save", "uk": "Вимкнути sRGB, вибрати Compression Settings без стиснення й зберегти"}, {"en": "A higher Seed", "uk": "Вищий Seed"}, {"en": "Moving the volume", "uk": "Перемістити об'єм"}], "answer": 1, "explain": {"en": "PCG reads the texture's pixels, which works with an uncompressed format and linear (non-sRGB) values.", "uk": "PCG читає пікселі текстури, а це працює з нестиснутим форматом і лінійними значеннями (без sRGB)."}}], "weekInfo": null, "morning": {"sofar": {"en": "You have PCG_Street_Base: one graph that dresses every street tagged Street with lamps, bollards and benches by attribute rules.", "uk": "Ти маєш PCG_Street_Base: один граф, що оформлює кожну вулицю з тегом Street ліхтарями, стовпчиками й лавками за правилами атрибутів."}, "today": {"en": "You feed PCG three kinds of data, your spline, the landscape and a mask you paint, so the same graph fits the ground and a designer's zones.", "uk": "Ти даєш PCG три види даних — свій сплайн, ландшафт і намальовану маску, — тож той самий граф підлаштовується під землю й під зони дизайнера."}, "cheer": {"en": "Masks and filters can look strange at first, so lean on the debug view: each time the points land where you expected, you have learned something real.", "uk": "Маски й фільтри спершу можуть здаватися дивними, тож спирайся на режим налагодження. Щоразу, коли точки лягають куди треба, ти вчишся чогось справжнього."}, "quote": {"text": {"en": "The purpose of computing is insight, not numbers.", "uk": "Мета обчислень — розуміння, а не числа."}, "author": {"en": "Richard Hamming", "uk": "Річард Геммінг"}, "source": "Numerical Methods for Scientists and Engineers (book), 1962"}}, "hasAssets": false, "workPath": "Work\\Assignment\\Day-82-pcg-data-in-landscape-mask", "mapHref": "../../COURSE.html", "prevHref": "../Day-81-pcg-attributes-street-base/START-HERE.html", "nextHref": "../Day-83-pcg-custom-node-distance-to-sea/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8 and Krita. I am a beginner on Day 82. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me: when my Blueprint or script fails, ask for the error message or a screenshot of the graph, point to the line or node that is wrong and explain why, then let me fix it myself. Never write the whole tool for me.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: Самостійно: площа без дерев, намальована в зеленому каналі маски.\nIt's part of: L_Day82: вулиця на ландшафті з PCG_Street_Base, PCG_VergeTrees, що ростуть із даних ландшафту, і T_Mask_Shops, що ставить столики кафе й прибирає лавки та стовпчики із зони крамниць (Content/Tools/Day82/L_Day82: невеликий ландшафт із пагорбами й пласкою смугою під вулицю. T_Mask_Shops у Content/Tools/Data, графи в Content/Tools/PCG.).\nWhy it matters: Справжня розстановка береться з даних: дорога, яку хтось намалював, рельєф землі й зони, які малює дизайнер. Маска — найпростіший спосіб для дизайнера сказати «тут крамниці», не відкриваючи граф. Ландшафт підказує графу, де надто круто для дерев. Студії будують графи, що читають такі входи, тож той самий граф працює на кожній вулиці кожної мапи. It comes back: У п'ятницю (День 85) T_Mask_Shops і правила ландшафту повернуться всередині PCG_StreetDresser. У День 88 маски й зони вирішать, де в твоєму місті крамниці й високі будинки.\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-82-pcg-data-in-landscape-mask (on the drive I chose on Day 0).\nWhat I already know: День 81: PCG_Street_Base, BP_StreetSpline і правило Slot; День 36: Get Landscape Data, Surface Sampler, Normal To Density і фільтр нахилу; День 38: зони-винятки з Bounds Modifier і Difference; День 27 і День 34: ліплення й вирівнювання ландшафту; День 4: малювання з вимірюванням у Krita; today's lessons: Вулиця на справжній землі; Дані ландшафту: дерева там, де дозволяє земля; Малювання маски: зони, які дизайнер може змінювати; Маска керує розстановкою. Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- L_Day82: ландшафт із режиму Landscape (Manage > New, типові налаштування) з пагорбами довкола пласкої смуги (Flatten) завширшки близько 30 м і завдовжки 160 м уздовж Y. BP_StreetSpline іде смугою приблизно від Y -75 м до Y 75 м, кожну точку опущено на землю клавішею End. PCG Volume у X 0, Y 0, центром на вулиці (Scale 100, 100, 30), з PCG_Street_Base.\n- PCG_VergeTrees на другому PCG Volume того ж розміру: Get Landscape Data > Surface Sampler (0.02 точки на квадратний метр, Point Extents 300) > Normal To Density > Density Filter (Lower Bound 0.82: схили менше 35°) > Difference з вулицею (Get Spline Data за тегом Street > Spline Sampler > Bounds Modifier по 10 м з кожного боку) > Self Pruning > Transform Points (вертикально, повернуті, масштаб від 0.8 до 1.2, занурені на 20–40 см) > Static Mesh Spawner з 2–3 твоїми деревами.\n- T_Mask_Shops: 256 × 256 пікселів, намальована в Krita поверх виду згори на об'єм. Чорна, а біла там, де тераси кафе: одна-дві смуги завширшки 3–4 м на тротуарі. Імпортована в Content/Tools/Data з вимкненим sRGB, Compression Settings VectorDisplacementmap (RGBA8) і без mipmap.\n- У PCG_Street_Base: Get Texture Data (T_Mask_Shops, Density Source Channel Red) > Surface Sampler (або Texture Sampler) > Density Filter (Lower Bound 0.5) > Self Pruning > спавнер столиків кафе. Ті самі білі точки з Bounds Modifier і Difference прибирають лавки й стовпчики із зони крамниць.\n- T_Mask_Shops лягає на світ правильно (будь-яке віддзеркалення виправлено в Krita). Один піксель — близько 0,8 м (200 м на 256 px). Дерева додають менше 3 мс до часу GPU.\n\nMy checklist (the same numbers show on my course page):\n1. Спершу переконайся, що результати сьогоднішніх уроків на місці: L_Day82 з ландшафтом і вулицею, PCG_VergeTrees і T_Mask_Shops, імпортована в Content/Tools/Data. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Слабкий ПК (16 ГБ оперативної пам'яті або менше): під час роботи зменш об'єм PCG до 100 × 100 м, а для фінальних зображень збільш (див. розділ «Слабкий ПК» на сторінці ACCOUNTS-AND-INSTALLS.html). Відкрий L_Day82 і клацни Generate на обох PCG Volume. Перевірка: уздовж вулиці ліхтарі, стовпчики й лавки, на пологих пагорбах дерева, на дорозі нічого. (from lesson 1)\n2. Пролети вздовж вулиці на висоті 2 м. Перевірка: кожен пропс стоїть на землі. Де пропси висять над западиною, додай там точку сплайна (перетягування з Alt), натисни на ній End (або правою кнопкою > Snap/Align > Snap to Floor) і клацни Generate. (from lesson 1)\n3. У PCG_VergeTrees натисни D на Density Filter. Перевірка: точки лише там, де схил положистіший за 35°, а круті схили порожні. (from lesson 2)\n4. Натисни D на Difference. Перевірка: з кожного боку вулиці чиста смуга завширшки 10 м без жодної точки дерева. (from lesson 2)\n5. У PCG_Street_Base натисни D на Density Filter маски. Перевірка: точки повторюють форму білих смуг і лежать на тротуарі біля вулиці. Якщо форма віддзеркалена чи повернута, виправ її, як в уроці 4. (from lesson 4)\n6. Клацни Generate, збережи L_Day82, відкрий будь-який інший рівень, а тоді знову L_Day82. Клацни Generate і пролети до зони крамниць. Перевірка: столики кафе стоять лише там, де маска біла, і серед них немає жодної лавки чи стовпчика. (from lesson 4)\n7. Намалюй у Krita ще одну білу смугу й експортуй поверх того самого PNG. В Unreal клацни правою кнопкою на T_Mask_Shops > Reimport і клацни Generate. Перевірка: підказка T_Mask_Shops у Content Browser досі показує 256 × 256, а в новій смузі з'являються столики кафе без жодної зміни графа. (from lesson 3)\n8. Самостійно: намалюй у Krita пляму чисто зеленого кольору (RGB 0, 255, 0) там, де невелика площа має лишитися без дерев. Експортуй і зроби Reimport. Перевірка: смуги крамниць досі білі, а площа в редакторі текстур зелена. (from lesson 3)\n9. Самостійно: у PCG_VergeTrees додай Get Texture Data з T_Mask_Shops і Density Source Channel Green, семплер і Density Filter (як в уроці 4), потім Bounds Modifier у вхід Differences вузла Difference для дерев. Якщо в Get Texture Data немає вибору каналу, намалюй площу в другій текстурі T_Mask_NoTrees. Перевірка: на площі дерева не ростуть, а деінде дерева без змін. (from lesson 4)\n10. Збережи закладку з видом з 60 м (Ctrl+3) і прочитай stat unit з обома згенерованими об'ємами, а потім після Cleanup на компоненті PCG об'єму дерев. Перевірка: дерева додають менше 3 мс до часу GPU, або щільність дерев зменшено й записано. (from lesson 2)\n11. Зроби скриншот cafes_day82.png: столики кафе згори, лише там, де маска біла. Перевірка: зображення в робочій папці дня. (from lesson 1)\n12. Скопіюй T_Mask_Shops.png і T_Mask_Shops.kra у робочу папку дня. Клацни «Копіювати звіт дня», встав текст у новий чат із тьютором, дай відповіді на його запитання й збережи відповідь як summary.md у робочій папці дня. Здай роботу: перетягни файли в сьогоднішню папку здачі (кнопка на цій сторінці): summary.md, T_Mask_Shops.png, T_Mask_Shops.kra і cafes_day82.png. Папку проєкту чи рівня Unreal здавати не треба: вона дуже велика. Перевірка: у папці здачі 4 файли, кожен більший за 1 КБ. (from lesson 1)\n\nHow to help: ask which step number I'm on, then give me only the next step: the exact clicks and what I should see. When I send a screenshot, compare it with my reference, my sizes and the spec, and name one thing to fix at a time.\nCheck every save and export by reopening it before we move on:\n- a Blueprint or script: compile or run it once more and see it work, with no errors\n- a .md or .txt: open it with Notepad; the text is there, and the name doesn't end in .md.txt\nWhen I write \"готово\", and in any case before the day ends, check with me one item at a time (yes/no): each spec point, then each file on my hand-in list, ready in my day work folder (skip summary.md: the day report writes it next):\n1. T_Mask_Shops.png та T_Mask_Shops.kra (у п'ятницю ти її перемалюєш) (→ День 85)\n2. cafes_day82.png (столики кафе лише там, де твоя намальована маска біла) (доказ)\nFinish with a short list of anything missing, and one line on where this work comes back and what it will look like there. Then tell me the order for the end of the day: first the day report (the Copy the day report button at the bottom of my course page) into summary.md, and only then hand in all the files on the list, summary.md too.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; checklist = чек-лист; reference photo / hero photo = фото-референс / ключове фото; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; default value = типове значення; mesh = меш; vertex / edge / face = вершина / ребро / грань; origin (and kit pivot) = origin — точка, за яку об'єкт ставлять і обертають; world origin / 3D cursor = центр світу / 3D-курсор; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); modifier = модифікатор; texel density / checker pattern = щільність текселів / шахівниця; level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; material slot / node / pin = слот матеріалу / вузол / вхід; volume (PCG Volume, Post Process Volume) = об'єм; seed = зерно (налаштування Seed); map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; district / plot / plot plan = район / ділянка / план ділянки; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ; shot set = серія кадрів.\n\nStart by asking for my best reference photo. Then, one at a time, my sizes and my step number.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender.", "reportPrompt": "Help me write today's report for summary.md. I write it before I hand in. Talk to me in simple Ukrainian, and never use gendered forms about me. Keep the English labels below exactly; the text after each label may be Ukrainian.\nAsk me one thing at a time, and skip whatever I've already pasted below:\n1. My lesson summaries («Засвоєно» / «Було важко»), or which lessons I skipped.\n2. My first score in the page's \"Check yourself\" quiz.\n3. How far the build got: done, partly or blocked (if blocked, where).\n4. My hand-in list, one item at a time (skip summary.md): is the file ready in my day work folder (GAD\\Day-82-pcg-data-in-landscape-mask)? (yes/no)\n   - T_Mask_Shops.png та T_Mask_Shops.kra (у п'ятницю ти її перемалюєш) (→ День 85)\n   - cafes_day82.png (столики кафе лише там, де твоя намальована маска біла) (доказ)\n5. One question for Thalia (about any day; start with the day number), or \"none\".\n6. Whether I fixed an earlier day today (which day and what), or \"no\".\n7. About how many hours today took.\nThen give me the finished report in one block I can copy:\n\nTeam summary, <date>, Misha\nDay 82: Data in: splines, the landscape and a painted mask. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nReady to hand in: <tick each item of today's list: ✓ name, or ✗ name and why it isn't ready>\nMissing: <files not ready, or \"none\">\nFixed: <Day N: what I fixed (the fixed files are in that day's hand-in folder), or \"none\">\nQuestion for Thalia: <Day N: one line, or \"none\">\nHours: <about N>\nTo revisit: <the «Було важко» lines>\n\nThen tell me: open summary.md in today's day work folder (GAD\\Day-82-pcg-data-in-landscape-mask) with Notepad (right-click > Open with > Notepad; if there is no summ  return '<section class="card glass morning"><div class="mgrid">'+(m.sofar?'<div>'+lab(u('sofar'),'gold')+shelf+'<p class="mtxt">'+lk(x(m.sofar))+'</p></div>':'')+(m.today?'<div>'+lab(u('todayL'))+'<p class="mtxt">'+lk(x(m.today))+'</p></div>':'')+'</div>'+(m.cheer?'<p class="cheer">'+esc(x(m.cheer))+'</p>':'')+(qt?'<figure class="quote well">'+kn('quote')+'<blockquote>'+esc(qt)+'</blockquote>'+(q.author?'<figcaption>'+esc(x(q.author))+'</figcaption>':'')+'</figure>':'')+'</section>'}
function setLang(l){lang=l;try{localStorage.setItem('devteam:lang',lang)}catch(e){};render()}
function toggleLang(){setLang(lang==='uk'?'en':'uk')}
/* keep open sections and keyboard focus across re-renders */
const openD=new Set();
function tg(e){if(e.open)openD.add(e.id);else openD.delete(e.id)}
const op=id=>openD.has(id)?' open':'';
function render(){const ae=document.activeElement,fid=ae&&(ae.id||(ae.getAttribute('data-th')?'th-'+ae.getAttribute('data-th'):ae.getAttribute('lang')&&ae.closest('.seg')?'lg-'+ae.getAttribute('lang'):''));
 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);
 const b=D.build,P=Math.round(prog()*100);
 document.getElementById('top').innerHTML='<div class="topin glass"><a class="maplink" href="'+esc(D.mapHref)+'">'+kn('map')+u('map')+'</a><div class="crumb"><b>'+esc(x(D.learnerName))+'</b><span>'+u('week')+' '+D.week+'</span><span>'+u('day')+' '+D.day+' '+u('of')+' '+D.total+'</span></div>'+controls(lang,'setLang')+'</div><div class="tline"><i style="width:'+P+'%"></i></div>';
 const state=w=>w<D.week?'b':w===D.week?'n':'p';
 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 let wk='';if(D.weekInfo){const w=D.weekInfo;wk='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}
 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p>'+(b.next?'<div class="back well">'+kn('arrow')+'<div><b>'+u('comes')+'</b><br>'+lk(x(b.next))+'</div></div>':'')+'<div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.assetFiles&&D.assetFiles.length?'<p class="files">'+ic('folder')+'<span>'+u('filesL')+' '+D.assetFiles.map(f=>'<a href="assets/'+encodeURIComponent(f)+'" target="_blank" rel="noopener">'+esc(f)+'</a>').join(', ')+'</span></p>':D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+=handinCard();h+=beforeCard();
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div><label class="rcpt" for="r'+i+'"><span class="eyebrow">'+u('rcpt')+'</span><textarea id="r'+i+'" rows="2" placeholder="'+esc(u('rcptPh'))+'" oninput="st.r'+i+'=this.value;save()">'+esc(st['r'+i]||'')+'</textarea></label>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+hList()+chkList()+(hasClip?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<h3>1 · '+u('copyR')+'</h3><p class="muted">'+u('report')+'</p><div class="row"><button class="btn ghost" onclick="cp(reportText())">'+ic('copy')+u('copyR')+'</button></div><h3>2 · '+u('ship')+'</h3>'+hf()+'<p class="muted" style="margin:12px 0 0">'+u('hNote')+'</p></section>';
 h+=qCard();h+=wk;
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();
</script>

<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 82</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

<script id="data" type="application/json">{"learner": "ib-misha-873821eb", "learnerName": {"en": "Misha", "uk": "Міша"}, "day": 82, "week": 17, "total": 110, "title": {"en": "Data in: splines, the landscape and a painted mask", "uk": "Дані на вході: сплайни, ландшафт і намальована маска"}, "theme": {"en": "Week 17: PCG in depth", "uk": "Тиждень 17: PCG докладно"}, "build": {"item": {"en": "L_Day82: a street on a landscape with PCG_Street_Base, PCG_VergeTrees growing from the landscape data, and T_Mask_Shops driving café tables and clearing benches and bollards from the shop zone", "uk": "L_Day82: вулиця на ландшафті з PCG_Street_Base, PCG_VergeTrees, що ростуть із даних ландшафту, і T_Mask_Shops, що ставить столики кафе й прибирає лавки та стовпчики із зони крамниць"}, "why": {"en": "Real placement comes from data: the road someone drew, the ground the terrain gives, and zones a designer paints. A mask is the simplest way for a designer to say 'shops here' without opening the graph, and the landscape tells the graph where it is too steep for trees. Studios build graphs that read these inputs, so the same graph works in every street of every map.", "uk": "Справжня розстановка береться з даних: дорога, яку хтось намалював, рельєф землі й зони, які малює дизайнер. Маска — найпростіший спосіб для дизайнера сказати «тут крамниці», не відкриваючи граф. Ландшафт підказує графу, де надто круто для дерев. Студії будують графи, що читають такі входи, тож той самий граф працює на кожній вулиці кожної мапи."}, "where": {"en": "Content/Tools/Day82/L_Day82: a small landscape with hills and a flat street strip; T_Mask_Shops in Content/Tools/Data; the graphs in Content/Tools/PCG.", "uk": "Content/Tools/Day82/L_Day82: невеликий ландшафт із пагорбами й пласкою смугою під вулицю. T_Mask_Shops у Content/Tools/Data, графи в Content/Tools/PCG."}, "spec": [{"en": "L_Day82: a landscape made in Landscape mode (Manage > New, default settings) with hills round a flat strip about 30 m wide and 160 m long along Y (Flatten); a BP_StreetSpline from about Y -75 m to Y 75 m along the strip with every point dropped onto the ground with End; a PCG Volume at X 0, Y 0 with its centre on the street (Scale 100, 100, 30) and PCG_Street_Base.", "uk": "L_Day82: ландшафт із режиму Landscape (Manage > New, типові налаштування) з пагорбами довкола пласкої смуги (Flatten) завширшки близько 30 м і завдовжки 160 м уздовж Y. BP_StreetSpline іде смугою приблизно від Y -75 м до Y 75 м, кожну точку опущено на землю клавішею End. PCG Volume у X 0, Y 0, центром на вулиці (Scale 100, 100, 30), з PCG_Street_Base."}, {"en": "PCG_VergeTrees on a second PCG Volume of the same size: Get Landscape Data > Surface Sampler (0.02 points per square metre, Point Extents 300) > Normal To Density > Density Filter (Lower Bound 0.82: slopes under 35 degrees) > Difference with the street (Get Spline Data by tag Street > Spline Sampler > Bounds Modifier 10 m either side) > Self Pruning > Transform Points (upright, turned, scaled 0.8 to 1.2, sunk 20 to 40 cm) > Static Mesh Spawner with 2 or 3 of your trees.", "uk": "PCG_VergeTrees на другому PCG Volume того ж розміру: Get Landscape Data > Surface Sampler (0.02 точки на квадратний метр, Point Extents 300) > Normal To Density > Density Filter (Lower Bound 0.82: схили менше 35°) > Difference з вулицею (Get Spline Data за тегом Street > Spline Sampler > Bounds Modifier по 10 м з кожного боку) > Self Pruning > Transform Points (вертикально, повернуті, масштаб від 0.8 до 1.2, занурені на 20–40 см) > Static Mesh Spawner з 2–3 твоїми деревами."}, {"en": "T_Mask_Shops: 256 x 256 px painted in Krita over a top view of the volume, black with white where café terraces go (one or two strips 3 to 4 m wide on the pavement); imported into Content/Tools/Data with sRGB off, Compression Settings VectorDisplacementmap (RGBA8) and no mipmaps.", "uk": "T_Mask_Shops: 256 × 256 пікселів, намальована в Krita поверх виду згори на об'єм. Чорна, а біла там, де тераси кафе: одна-дві смуги завширшки 3–4 м на тротуарі. Імпортована в Content/Tools/Data з вимкненим sRGB, Compression Settings VectorDisplacementmap (RGBA8) і без mipmap."}, {"en": "In PCG_Street_Base: Get Texture Data (T_Mask_Shops, Density Source Channel Red) > Surface Sampler (or Texture Sampler) > Density Filter (Lower Bound 0.5) > Self Pruning > a café table spawner; the same white points, through a Bounds Modifier, clear benches and bollards from the shop zone with a Difference.", "uk": "У PCG_Street_Base: Get Texture Data (T_Mask_Shops, Density Source Channel Red) > Surface Sampler (або Texture Sampler) > Density Filter (Lower Bound 0.5) > Self Pruning > спавнер столиків кафе. Ті самі білі точки з Bounds Modifier і Difference прибирають лавки й стовпчики із зони крамниць."}, {"en": "T_Mask_Shops lines up with the world (fix any flip in Krita); one pixel is about 0.8 m (200 m over 256 px); the trees add less than 3 ms of GPU time.", "uk": "T_Mask_Shops лягає на світ правильно (будь-яке віддзеркалення виправлено в Krita). Один піксель — близько 0,8 м (200 м на 256 px). Дерева додають менше 3 мс до часу GPU."}], "piece1": "Verge trees from the landscape, and the shop mask (built in the lessons)", "piece2": {"en": "On your own: a no-trees plaza painted in the mask's green channel", "uk": "Самостійно: площа без дерев, намальована в зеленому каналі маски"}, "steps": [{"text": {"en": "Check: the results of today's lessons are there (L_Day82 with its landscape and street, PCG_VergeTrees, and T_Mask_Shops imported into Content/Tools/Data). Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it. Weak PC (16 GB of RAM or less): shrink the PCG volume to 100 x 100 m while you build and grow it for the final pictures (see the weak-PC section of ACCOUNTS-AND-INSTALLS.html). Open L_Day82 and click Generate on both PCG Volumes. Check: lamps, bollards and benches along the street, trees on the gentle hills, nothing on the road.", "uk": "Спершу переконайся, що результати сьогоднішніх уроків на місці: L_Day82 з ландшафтом і вулицею, PCG_VergeTrees і T_Mask_Shops, імпортована в Content/Tools/Data. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Слабкий ПК (16 ГБ оперативної пам'яті або менше): під час роботи зменш об'єм PCG до 100 × 100 м, а для фінальних зображень збільш (див. розділ «Слабкий ПК» на сторінці ACCOUNTS-AND-INSTALLS.html). Відкрий L_Day82 і клацни Generate на обох PCG Volume. Перевірка: уздовж вулиці ліхтарі, стовпчики й лавки, на пологих пагорбах дерева, на дорозі нічого."}, "lesson": 1}, {"text": {"en": "Fly along the street at 2 m. Check: every prop stands on the ground; where props float over a dip, add a spline point there (Alt+drag), press End on it (or right-click > Snap/Align > Snap to Floor) and Generate.", "uk": "Пролети вздовж вулиці на висоті 2 м. Перевірка: кожен пропс стоїть на землі. Де пропси висять над западиною, додай там точку сплайна (перетягування з Alt), натисни на ній End (або правою кнопкою > Snap/Align > Snap to Floor) і клацни Generate."}, "lesson": 1}, {"text": {"en": "In PCG_VergeTrees press D on the Density Filter. Check: points only where the ground is gentler than 35 degrees; steep faces are empty.", "uk": "У PCG_VergeTrees натисни D на Density Filter. Перевірка: точки лише там, де схил положистіший за 35°, а круті схили порожні."}, "lesson": 2}, {"text": {"en": "Press D on the Difference. Check: a clear band 10 m wide on each side of the street with no tree points in it.", "uk": "Натисни D на Difference. Перевірка: з кожного боку вулиці чиста смуга завширшки 10 м без жодної точки дерева."}, "lesson": 2}, {"text": {"en": "In PCG_Street_Base press D on the mask's Density Filter. Check: the points sit in the shape of your white strips, on the pavement beside the street; if the shape is mirrored or turned, fix it as in lesson 4.", "uk": "У PCG_Street_Base натисни D на Density Filter маски. Перевірка: точки повторюють форму білих смуг і лежать на тротуарі біля вулиці. Якщо форма віддзеркалена чи повернута, виправ її, як в уроці 4."}, "lesson": 4}, {"text": {"en": "Generate, save L_Day82, open any other level and open L_Day82 again; Generate and fly to the shop zone. Check: café tables stand only where the mask is white, and no bench or bollard stands among them.", "uk": "Клацни Generate, збережи L_Day82, відкрий будь-який інший рівень, а тоді знову L_Day82. Клацни Generate і пролети до зони крамниць. Перевірка: столики кафе стоять лише там, де маска біла, і серед них немає жодної лавки чи стовпчика."}, "lesson": 4}, {"text": {"en": "Paint one more white strip in Krita, export over the same PNG, then right-click T_Mask_Shops in Unreal > Reimport and Generate. Check: T_Mask_Shops still shows 256 x 256 in its Content Browser tooltip, and café tables appear in the new strip without any change to the graph.", "uk": "Намалюй у Krita ще одну білу смугу й експортуй поверх того самого PNG. В Unreal клацни правою кнопкою на T_Mask_Shops > Reimport і клацни Generate. Перевірка: підказка T_Mask_Shops у Content Browser досі показує 256 × 256, а в новій смузі з'являються столики кафе без жодної зміни графа."}, "lesson": 3}, {"text": {"en": "On your own: in Krita paint a patch in pure green (RGB 0, 255, 0) where a small plaza should stay free of trees; export and Reimport. Check: the shop strips still show white, and the plaza shows green in the texture editor.", "uk": "Самостійно: намалюй у Krita пляму чисто зеленого кольору (RGB 0, 255, 0) там, де невелика площа має лишитися без дерев. Експортуй і зроби Reimport. Перевірка: смуги крамниць досі білі, а площа в редакторі текстур зелена."}, "lesson": 3}, {"text": {"en": "On your own: in PCG_VergeTrees add Get Texture Data with T_Mask_Shops and its Density Source Channel set to Green, a sampler and a Density Filter (as in lesson 4), then a Bounds Modifier into the Differences pin of the tree Difference. If your Get Texture Data has no channel choice, paint the plaza into a second texture T_Mask_NoTrees instead. Check: no trees grow on the plaza, and the trees elsewhere don't change.", "uk": "Самостійно: у PCG_VergeTrees додай Get Texture Data з T_Mask_Shops і Density Source Channel Green, семплер і Density Filter (як в уроці 4), потім Bounds Modifier у вхід Differences вузла Difference для дерев. Якщо в Get Texture Data немає вибору каналу, намалюй площу в другій текстурі T_Mask_NoTrees. Перевірка: на площі дерева не ростуть, а деінде дерева без змін."}, "lesson": 4}, {"text": {"en": "Bookmark a 60 m view (Ctrl+3) and read stat unit with both volumes generated, then after Cleanup on the trees volume's PCG component. Check: GPU time rises by less than 3 ms with the trees, or you lowered the tree density and noted it.", "uk": "Збережи закладку з видом з 60 м (Ctrl+3) і прочитай stat unit з обома згенерованими об'ємами, а потім після Cleanup на компоненті PCG об'єму дерев. Перевірка: дерева додають менше 3 мс до часу GPU, або щільність дерев зменшено й записано."}, "lesson": 2}, {"text": {"en": "Take cafes_day82.png (the café tables from above, only where the mask is white). Check: the picture is in today's Work folder.", "uk": "Зроби скриншот cafes_day82.png: столики кафе згори, лише там, де маска біла. Перевірка: зображення в робочій папці дня."}, "lesson": 1}, {"text": {"en": "Copy T_Mask_Shops.png and T_Mask_Shops.kra into today's Work folder. Click Copy the day report, paste it into a new tutor chat, answer its questions and save its answer as summary.md in today's Work folder. Drag summary.md, T_Mask_Shops.png, T_Mask_Shops.kra and cafes_day82.png into today's hand-in folder (the button on this page); no need to hand in the Unreal project or level folders (they're very big). Check: the hand-in folder lists 4 files, each over 1 KB.", "uk": "Скопіюй T_Mask_Shops.png і T_Mask_Shops.kra у робочу папку дня. Клацни «Копіювати звіт дня», встав текст у новий чат із тьютором, дай відповіді на його запитання й збережи відповідь як summary.md у робочій папці дня. Здай роботу: перетягни файли в сьогоднішню папку здачі (кнопка на цій сторінці): summary.md, T_Mask_Shops.png, T_Mask_Shops.kra і cafes_day82.png. Папку проєкту чи рівня Unreal здавати не треба: вона дуже велика. Перевірка: у папці здачі 4 файли, кожен більший за 1 КБ."}, "lesson": 1}], "assets": [], "next": {"en": "T_Mask_Shops and the landscape rules come back inside PCG_StreetDresser on Friday (Day 85), and on Day 88 masks and zones decide where shops and tall houses go in your town.", "uk": "У п'ятницю (День 85) T_Mask_Shops і правила ландшафту повернуться всередині PCG_StreetDresser. У День 88 маски й зони вирішать, де в твоєму місті крамниці й високі будинки."}}, "lessons": [{"title": {"en": "A street on real ground", "uk": "Вулиця на справжній землі"}, "minutes": 40, "goals": [{"en": "Build a practice landscape with hills and a flat street strip, as on Days 27 and 34.", "uk": "Будувати тренувальний ландшафт із пагорбами й пласкою смугою під вулицю, як у День 27 і День 34."}, {"en": "Lay BP_StreetSpline on the ground with End on each point, so the slots follow the land.", "uk": "Класти BP_StreetSpline на землю клавішею End на кожній точці, щоб слоти йшли за рельєфом."}, {"en": "Explain why PCG_Street_Base works here unchanged: it reads any spline that carries the tag Street.", "uk": "Пояснювати, чому PCG_Street_Base тут працює без змін: він читає будь-який сплайн із тегом Street."}], "doalong": [{"en": "Choose File > New Level > Basic, save it as L_Day82 in Content/Tools/Day82 and delete Floor. Press Shift+2 for Landscape mode, choose Manage > New, keep the default settings and click Create. You see a flat landscape about 500 m across.", "uk": "Вибери File > New Level > Basic, збережи рівень як L_Day82 у Content/Tools/Day82 і видали Floor. Натисни Shift+2 для режиму Landscape, вибери Manage > New, лиши типові налаштування й клацни Create. Має вийти пласкій ландшафт завширшки близько 500 м."}, {"en": "With the Sculpt tool and a big brush raise hills round the middle, then choose Flatten and paint a strip about 30 m wide and 160 m long along the Y axis through the middle, from about Y -80 m to Y 80 m (a new landscape is centred on the world origin). You see hills round a flat strip.", "uk": "Інструментом Sculpt із великим пензлем підніми пагорби довкола середини. Потім вибери Flatten і проведи через середину вздовж осі Y смугу завширшки близько 30 м і завдовжки 160 м, приблизно від Y -80 м до Y 80 м. Новий ландшафт стоїть центром у центрі світу. Має вийти пагорби довкола пласкої смуги."}, {"en": "Drag BP_StreetSpline onto the strip and set its Location X 0, Y -7500; add points towards +Y with Alt+drag every 20 to 30 m up to about Y 7500, and press End on each point (or right-click it > Snap/Align > Snap to Floor, as on Day 62). You see the street line lying on the strip.", "uk": "Перетягни BP_StreetSpline на смугу й задай Location X 0, Y -7500. Додавай точки в бік +Y перетягуванням з Alt через кожні 20–30 м приблизно до Y 7500. На кожній точці натисни End (або правою кнопкою > Snap/Align > Snap to Floor, як у День 62). Лінія вулиці лежить на смузі."}, {"en": "Place a PCG Volume (Scale 100, 100, 30) at X 0, Y 0 and give it the same Location Z as BP_StreetSpline, so its centre lies on the street (lesson 4's mask points sit at that height). Set its Graph to PCG_Street_Base and click Generate. You see Day 81's dressing on the new street with no change to the graph.", "uk": "Постав PCG Volume (Scale 100, 100, 30) у X 0, Y 0 і дай йому той самий Location Z, що й BP_StreetSpline, щоб центр лежав на вулиці: точки маски з уроку 4 будуть на цій висоті. Задай Graph PCG_Street_Base і клацни Generate. Розстановка з Дня 81 з'являється на новій вулиці без жодної зміни графа."}], "play": {"en": "Same graph, new place: the tutor names four places (a street over a hill; two streets crossing; a street half outside the volume; a street without the tag). For each I predict what PCG_Street_Base will do, then I test one.", "uk": "Той самий граф, нове місце: тьютор називає чотири місця — вулиця через пагорб; дві вулиці, що перетинаються; вулиця наполовину поза об'ємом; вулиця без тегу. Для кожного передбач, що зробить PCG_Street_Base, а потім перевір одне."}, "video": {"search": "unreal engine 5 landscape flatten tool sculpt spline on landscape pcg"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Вулиця на справжній землі (Day 82, lesson 1 of 4). Today's build: L_Day82: вулиця на ландшафті з PCG_Street_Base, PCG_VergeTrees, що ростуть із даних ландшафту, і T_Mask_Shops, що ставить столики кафе й прибирає лавки та стовпчики із зони крамниць.\nWhat I already know: День 81: PCG_Street_Base, BP_StreetSpline і правило Slot; День 36: Get Landscape Data, Surface Sampler, Normal To Density і фільтр нахилу; День 38: зони-винятки з Bounds Modifier і Difference; День 27 і День 34: ліплення й вирівнювання ландшафту; День 4: малювання з вимірюванням у Krita.\n\nBy the end of this lesson I can:\n1. Будувати тренувальний ландшафт із пагорбами й пласкою смугою під вулицю, як у День 27 і День 34.\n2. Класти BP_StreetSpline на землю клавішею End на кожній точці, щоб слоти йшли за рельєфом.\n3. Пояснювати, чому PCG_Street_Base тут працює без змін: він читає будь-який сплайн із тегом Street.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: Ти маєш PCG_Street_Base: один граф, що оформлює кожну вулицю з тегом Street ліхтарями, стовпчиками й лавками за правилами атрибутів. Today: Ти даєш PCG три види даних — свій сплайн, ландшафт і намальовану маску, — тож той самий граф підлаштовується під землю й під зони дизайнера. One encouraging line: Маски й фільтри спершу можуть здаватися дивними, тож спирайся на режим налагодження. Щоразу, коли точки лягають куди треба, ти вчишся чогось справжнього.); 2 lines on why today matters and where it comes back, in plain words (from this: Справжня розстановка береться з даних: дорога, яку хтось намалював, рельєф землі й зони, які малює дизайнер. Маска — найпростіший спосіб для дизайнера сказати «тут крамниці», не відкриваючи граф. Ландшафт підказує графу, де надто круто для дерев. Студії будують графи, що читають такі входи, тож той самий граф працює на кожній вулиці кожної мапи. It comes back: У п'ятницю (День 85) T_Mask_Shops і правила ландшафту повернуться всередині PCG_StreetDresser. У День 88 маски й зони вирішать, де в твоєму місті крамниці й високі будинки.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-82-pcg-data-in-landscape-mask exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (Дерева вздовж узбіччя з ландшафту та маска крамниць (на уроках)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Вибери File > New Level > Basic, збережи рівень як L_Day82 у Content/Tools/Day82 і видали Floor. Натисни Shift+2 для режиму Landscape, вибери Manage > New, лиши типові налаштування й клацни Create. Має вийти пласкій ландшафт завширшки близько 500 м.\n   2. Інструментом Sculpt із великим пензлем підніми пагорби довкола середини. Потім вибери Flatten і проведи через середину вздовж осі Y смугу завширшки близько 30 м і завдовжки 160 м, приблизно від Y -80 м до Y 80 м. Новий ландшафт стоїть центром у центрі світу. Має вийти пагорби довкола пласкої смуги. [screenshot]\n   3. Перетягни BP_StreetSpline на смугу й задай Location X 0, Y -7500. Додавай точки в бік +Y перетягуванням з Alt через кожні 20–30 м приблизно до Y 7500. На кожній точці натисни End (або правою кнопкою > Snap/Align > Snap to Floor, як у День 62). Лінія вулиці лежить на смузі.\n   4. Постав PCG Volume (Scale 100, 100, 30) у X 0, Y 0 і дай йому той самий Location Z, що й BP_StreetSpline, щоб центр лежав на вулиці: точки маски з уроку 4 будуть на цій висоті. Задай Graph PCG_Street_Base і клацни Generate. Розстановка з Дня 81 з'являється на новій вулиці без жодної зміни графа. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Той самий граф, нове місце: тьютор називає чотири місця — вулиця через пагорб; дві вулиці, що перетинаються; вулиця наполовину поза об'ємом; вулиця без тегу. Для кожного передбач, що зробить PCG_Street_Base, а потім перевір одне. Otherwise skip it.\n6. Review: ask me these questions from earlier days, one at a time, and correct me kindly: Day 79: Why does each Random Value in GN_Rocks get the Seed in its ID socket? | Day 75: What does EUW_TechTools show after you click Check?\n7. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n8. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me

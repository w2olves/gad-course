<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 105</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

through three flyable gaps in the chosen seed, touching nothing.", "uk": "LaneGauge уздовж кожного коридору і крізь три прогалини, крізь які можна пролетіти, у вибраному зерні — нічого не торкається."}, {"en": "review_day105.md: every line of design_doc.md's Outputs, Settings and Done means marked met, partly or not yet, each with its proof (a picture, a number or a check line), and every not-yet line placed into one of Days 106 to 110.", "uk": "review_day105.md: кожен рядок розділів Outputs, Settings і Done means з design_doc.md позначено met, partly або not yet, кожен із доказом (картинка, число чи рядок перевірки), а кожен рядок not yet розподілено на один із Днів 106–110."}, {"en": "Committed and pushed with no tag today: the next release is 2.0 on Day 108. Bronze, Silver and Gold as listed below.", "uk": "Зроблено коміт і надіслано, без тегу сьогодні: наступний реліз — 2.0 у День 108. Бронза, Срібло і Золото — як у списку нижче."}], "piece1": "The one-click chain, the checks and the same-seed proof (practised in the micro-lessons)", "piece2": {"en": "The three seeds, the contact sheet, the corridor flights, the review, and Gold's second real place", "uk": "Три зерна, аркуш порівняння, прольоти коридорів, огляд, а для Золота — друге справжнє місце"}, "steps": [{"text": {"en": "Check: the results of today's lessons are there (the two bookmarks in L_District, and the one-click chain you practised in lesson 1). Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it. Weak PC (16 GB of RAM or less): shrink the PCG volumes to 100 x 100 m while you build and grow them for the final pictures (see the weak-PC section of ACCOUNTS-AND-INSTALLS.html). Start the clock: Bronze by hour 2, the full build by about 3.5 hours. Write the start time at the top of boss_day105.md. Check: the start time is written.", "uk": "Перевір, чи є результати сьогоднішніх уроків: дві закладки в L_District і ланцюжок одним клацанням, відпрацьований на уроці 1. Чогось бракує? Пройди зараз кроки «Разом із тьютором» того уроку (близько 25 хвилин): самостійна робота спирається на них. Слабкий ПК (16 ГБ оперативної пам'яті чи менше): під час роботи зменш об'єми PCG до 100 × 100 м, а для фінальних картинок збільш (див. розділ про слабкі ПК в ACCOUNTS-AND-INSTALLS.html). Запусти годинник: Бронза — до 2-ї години, уся самостійна робота — приблизно за 3 години 30 хвилин. Запиши час початку вгорі boss_day105.md. Перевірка: час початку записано."}, "lesson": 2}, {"text": {"en": "Add Green (Actor, Instance Editable, Category Links), pick the PCG_DistrictGreen volume, and Generate it at the end of Regenerate the same way as the Dresser, with an orange warning when it is empty. Check: one click now runs both PCG volumes.", "uk": "Додай Green (Actor, Instance Editable, Category Links), вибери об'єм PCG_DistrictGreen і запускай для нього Generate наприкінці Regenerate так само, як для Dresser, з помаранчевим попередженням, коли Green порожній. Перевірка: одне клацання тепер запускає обидва об'єми PCG."}, "lesson": 1}, {"text": {"en": "Click Clear, then Regenerate once. Check: roads, junction tables, houses, the landmark, the features, dressed streets and parks all appear, and one summary line counts roads, junctions, buildings and features.", "uk": "Клацни Clear, потім один раз Regenerate. Перевірка: з'являються дороги, майданчики перехресть, будинки, орієнтир, об'єкти площі, обставлені вулиці й парки, а один підсумковий рядок рахує дороги, перехрестя, будинки й об'єкти."}, "lesson": 1}, {"text": {"en": "Click Check Town. Check: 0 problems; any problem fixed at its cause (a rule, a corridor, a zone), then Regenerate and check again.", "uk": "Клацни Check Town. Перевірка: 0 проблем. Кожну проблему виправлено в причині (правило, коридор, зона), потім Regenerate і повторна перевірка."}, "lesson": "D90.1"}, {"text": {"en": "Same seed twice: from the 120 m bookmark, Regenerate twice. Check: identical, house for house; Bronze is reached, so write the time in boss_day105.md.", "uk": "Те саме зерно двічі: із закладки на 120 м двічі клацни Regenerate. Перевірка: однаково, будинок у будинок. Бронзу здобуто: запиши час у boss_day105.md."}, "lesson": 1}, {"text": {"en": "Save as L_District_SeedA; make L_District_SeedB and L_District_SeedC with two new seeds, Regenerate and Check Town in each. From the same two bookmarks take view_120m and street_2m for each seed. Check: 0 problems in all three, and six pictures with the same two views.", "uk": "Збережи як L_District_SeedA; створи L_District_SeedB і L_District_SeedC з двома новими зернами, у кожному клацни Regenerate і Check Town. З тих самих двох закладок зроби view_120m і street_2m для кожного зерна. Перевірка: 0 проблем в усіх трьох і шість картинок з тими самими двома видами."}, "lesson": 3}, {"text": {"en": "Make contact_sheet_day105.png in Krita: map_box.png beside the three 120 m views, each labelled with its seed and Check Town line, and one sentence on the seed you would ship. Check: the three read as one real place with different details.", "uk": "Зроби в Krita contact_sheet_day105.png: map_box.png поруч із трьома видами з 120 м, кожен підписаний зерном і рядком Check Town, і одне речення про зерно, яке ти здаси. Перевірка: усі три впізнаються як одне справжнє місце з різними дрібницями."}, "lesson": 3}, {"text": {"en": "Fly LaneGauge along every corridor and through three flyable gaps in your chosen seed. Check: it touches nothing.", "uk": "Пролети LaneGauge уздовж кожного коридору і крізь три прогалини у вибраному зерні. Перевірка: він нічого не торкається."}, "lesson": "D90.3"}, {"text": {"en": "Write review_day105.md: every Outputs, Settings and Done means line of design_doc.md marked met, partly or not yet with its proof, and each not-yet line placed into one of Days 106 to 110. Check: no line without a mark and a proof; Silver is reached, so log the time.", "uk": "Напиши review_day105.md: кожен рядок Outputs, Settings і Done means з design_doc.md позначено met, partly або not yet з доказом, а кожен рядок not yet розподілено на один із Днів 106–110. Перевірка: немає рядка без позначки й доказу. Срібло здобуто: запиши час."}, "lesson": 4}, {"text": {"en": "Gold: export a second real place, run osm_to_layout.py with new SRC and OUT, import DT_DistrictRoads_B, copy the rules as DA_TownRules_District_B with zones from its own map, and Regenerate in a new level. Check: a second real town built in under 60 minutes, with Check Town at 0 problems.", "uk": "Золото: експортуй друге справжнє місце, запусти osm_to_layout.py з новими SRC і OUT, імпортуй DT_DistrictRoads_B, скопіюй правила як DA_TownRules_District_B із зонами з його власної мапи і клацни Regenerate у новому рівні. Перевірка: друге справжнє містечко збудовано менш ніж за 60 хвилин, Check Town показує 0 проблем."}, "lesson": "D102.3"}, {"text": {"en": "Commit and push (no tag today: the next release is 2.0 on Day 108). Record clip_day105.mp4 (Clear, one click on Regenerate, the district appearing, then a flight down the main street to the landmark; 60 seconds, under 50 MB) with OBS Studio (Display Capture) or Win+Shift+R (Snipping Tool, select the whole screen). Check: the clip is in today's Work folder and under 50 MB.", "uk": "Зроби коміт і надішли (сьогодні без тегу: наступний реліз — 2.0 у День 108). Запиши clip_day105.mp4 (Clear, одне клацання Regenerate, район з'являється, потім проліт головною вулицею до орієнтира; 60 секунд, менше за 50 МБ) в OBS Studio (Display Capture) або Win+Shift+R (Snipping Tool, виділи весь екран). Перевірка: кліп у робочій папці дня, менший за 50 МБ."}, "lesson": 2}, {"text": {"en": "Click Copy the day report, paste it into a new tutor chat, answer its questions and save its answer as summary.md in today's Work folder. Drag the files listed under What you hand in (the three levels can stay on your PC) into today's hand-in folder (the button on this page); no need to hand in the Unreal project or level folders (they're very big). Check: the hand-in folder lists all the files, each over 1 KB.", "uk": "Клацни «Копіювати звіт дня», встав у новий чат із тьютором, дай відповіді на його питання і збережи його відповідь як summary.md у робочій папці дня. Перетягни файли з розділу «Що здати» (ніколи не три рівні) в папку здачі (кнопка на цій сторінці). Папку проєкту чи рівня Unreal здавати не треба: вона дуже велика. Перевірка: у папці здачі всі файли, кожен більший за 1 КБ."}, "lesson": 2}], "boss": [{"en": "Bronze: one click from a cleared level builds the whole district (roads, junction tables, houses, the landmark, dressed streets, parks) with Check Town at 0 problems, and the same seed builds the same district twice, inside 2 hours.", "uk": "Бронза: одне клацання з очищеного рівня будує весь район (дороги, майданчики перехресть, будинки, орієнтир, обставлені вулиці, парки), Check Town показує 0 проблем, а те саме зерно двічі будує той самий район — за 2 години."}, {"en": "Silver: Bronze, plus three seeds on contact_sheet_day105.png beside the real map, LaneGauge clear along every corridor, and review_day105.md with every design-doc line marked and proved, inside 3 hours.", "uk": "Срібло: Бронза, плюс три зерна на contact_sheet_day105.png поруч зі справжньою мапою, LaneGauge вільно проходить уздовж кожного коридору, а в review_day105.md кожен рядок проєктного документа позначено й доведено — за 3 години."}, {"en": "Gold: Silver, plus a second real place (a new OpenStreetMap extract through osm_to_layout.py, with its own Data Table and rules asset) built by the same Blueprint in under 60 minutes, with Check Town at 0 problems.", "uk": "Золото: Срібло, плюс друге справжнє місце (нова вибірка OpenStreetMap через osm_to_layout.py з власною Data Table і асетом правил), збудоване тим самим Blueprint менш ніж за 60 хвилин, з 0 проблем у Check Town."}], "assets": ["techart/design-doc-template.md", "techart/tool-review-checklist.md"], "next": {"en": "review_day105.md decides the work of Days 106 to 110: polish (Day 106), validation (Day 107), the 2.0 release (Day 108), the demo (Day 109) and the hand-over (Day 110).", "uk": "review_day105.md визначає роботу Днів 106–110: доведення (День 106), перевірка (День 107), реліз 2.0 (День 108), демо (День 109) і передача (День 110)."}}, "lessons": [{"title": {"en": "One click: the whole chain", "uk": "Одне клацання: увесь ланцюжок"}, "minutes": 30, "goals": [{"en": "Read Regenerate's chain from Check Inputs to the summary line and make sure every step runs, in order.", "uk": "Читати ланцюжок Regenerate від Check Inputs до підсумкового рядка і стежити, щоб кожен крок виконувався по порядку."}, {"en": "Link both PCG volumes, with a warning when a link is missing.", "uk": "Зв'язувати обидва об'єми PCG, з попередженням, коли зв'язку бракує."}, {"en": "Prove the click repeats: nothing left behind, nothing doubled.", "uk": "Доводити, що клацання повторюється: нічого не лишається і нічого не подвоюється."}], "doalong": [{"en": "Add Green (Actor, Instance Editable, Category Links) and, after the Dresser's Generate, the same nodes for Green: Get Component by Class (PCG Component) > Generate Local with Force ticked (or Generate if your version offers only that), with an orange warning when Green is empty. You see one click run both graphs.", "uk": "Додай Green (Actor, Instance Editable, Category Links), а після Generate для Dresser — ті самі вузли для Green: Get Component by Class (PCG Component) > Generate Local з позначеним Force (або Generate, якщо у твоїй версії є лише він), з помаранчевим попередженням, коли Green порожній. Має вийти: одне клацання запускає обидва графи."}, {"en": "Open Regenerate and follow its chain once: Check Inputs; Read Rows; the streams; Clear Town; the Spawn functions; Generate the Dresser and Green; the summary. You see the whole tool in one row of nodes.", "uk": "Відкрий Regenerate і пройди його ланцюжок один раз: Check Inputs; Read Rows; потоки; Clear Town; функції Spawn; Generate для Dresser і Green; підсумок. Має вийти: увесь інструмент в одному ряду вузлів."}, {"en": "Make the summary line with Format Text: District seed {Seed}: {Roads} roads, {Junctions} junctions, {Buildings} buildings, {Features} features. You see one readable sentence after every Regenerate.", "uk": "Зроби підсумковий рядок через Format Text: District seed {Seed}: {Roads} roads, {Junctions} junctions, {Buildings} buildings, {Features} features. Має вийти: одне читабельне речення після кожного Regenerate."}, {"en": "Click Clear, then Regenerate twice with the same seed, watching the Outliner's actor count. You see the same count each time: nothing left behind and nothing doubled.", "uk": "Клацни Clear, потім двічі Regenerate з тим самим зерном, стежачи за кількістю акторів в Outliner. Кількість щоразу та сама: нічого не лишилося і нічого не подвоїлося."}], "play": {"en": "Broken chain: the tutor describes four results (houses but no roads; roads but houses in the air; everything but the parks; everything doubled after a second click). For each I name the step of the chain that is missing or out of order.", "uk": "Зламаний ланцюжок: тьютор описує чотири результати (будинки, але без доріг; дороги, але будинки в повітрі; усе, крім парків; усе подвоєно після другого клацання). Для кожного я називаю крок ланцюжка, якого бракує чи який стоїть не на місці."}, "video": {"search": "unreal engine blueprint editor tool call in editor regenerate"}, "prompt": "You are my tutor for one 30-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Одне клацання: увесь ланцюжок (Day 105, lesson 1 of 4). Today's build: BP_DistrictGenerator v1 в L_District: увесь район одним клацанням з одного зерна, перевірений, з прольотом коридорів, порівняний на трьох зернах поруч зі справжньою мапою, звірений із design_doc.md і закомічений у Git.\nWhat I already know: Дні 101–104: design_doc.md, DT_DistrictRoads, DA_TownRules_District, BP_DistrictGenerator і обставляння; День 90: Check Town, LaneGauge, аркуші порівняння (contact sheet) і правило однієї закладки; День 99: доказ «те саме зерно» і теги в Git; День 89: ланцюжок Regenerate і зв'язок із Dresser.\n\nBy the end of this lesson I can:\n1. Читати ланцюжок Regenerate від Check Inputs до підсумкового рядка і стежити, щоб кожен крок виконувався по порядку.\n2. Зв'язувати обидва об'єми PCG, з попередженням, коли зв'язку бракує.\n3. Доводити, що клацання повторюється: нічого не лишається і нічого не подвоюється.\n\nRun the lesson in this order; it should take 30 to 40 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: За цей тиждень з'явилися проєктний документ, справжня мапа, перетворена на дані, дороги, перехрестя, ділянки й будинки, збудовані з неї, і обставлений район. Today: Ти доводиш District Generator v1: одне клацання, одне зерно, цілий район, звірений із твоїм проєктним документом. One encouraging line: Хоч які рядки ввечері ще лишаться not yet, робочий генератор зі справжньої мапи вже збудовано — і це справжнє досягнення.); 2 lines on why today matters and where it comes back, in plain words (from this: Генератору довіряють, коли одна кнопка дає повний, правильний, повторюваний результат, а його автор може показати це проти письмового плану, рядок за рядком. Саме так інструменти приймають у студіях: не «виглядає нормально», а «ось кожна обіцянка і її доказ». Сьогодні твій випускний проєкт стає робочим інструментом. It comes back: review_day105.md визначає роботу Днів 106–110: доведення (День 106), перевірка (День 107), реліз 2.0 (День 108), демо (День 109) і передача (День 110).); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-105-boss-district-generator-v1 exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (Ланцюжок одним клацанням, перевірки і доказ «те саме зерно» (відпрацьовані на міні-уроках)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Додай Green (Actor, Instance Editable, Category Links), а після Generate для Dresser — ті самі вузли для Green: Get Component by Class (PCG Component) > Generate Local з позначеним Force (або Generate, якщо у твоїй версії є лише він), з помаранчевим попередженням, коли Green порожній. Має вийти: одне клацання запускає обидва графи.\n   2. Відкрий Regenerate і пройди його ланцюжок один раз: Check Inputs; Read Rows; потоки; Clear Town; функції Spawn; Generate для Dresser і Green; підсумок. Має вийти: увесь інструмент в одному ряду вузлів. [screenshot]\n   3. Зроби підсумковий рядок через Format Text: District seed {Seed}: {Roads} roads, {Junctions} junctions, {Buildings} buildings, {Features} features. Має вийти: одне читабельне речення після кожного Regenerate.\n   4. Клацни Clear, потім двічі Regenerate з тим самим зерном, стежачи за кількістю акторів в Outliner. Кількість щоразу та сама: нічого не лишилося і нічого не подвоїлося. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Зламаний ланцюжок: тьютор описує чотири результати (будинки, але без доріг; дороги, але будинки в повітрі; усе, крім парків; усе подвоєно після другого клацання). Для кожного я називаю крок ланцюжка, якого бракує чи який стоїть не на місці. Otherwise skip it.\n6. Review: ask me these questions from earlier days, one at a time, and correct me kindly: Day 102: Why must y count south from the north edge in osm_to_layout.py? | Day 98: What is the difference between a stop and a warning in your tools?\n7. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n8. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path inste оруч і три види з 120 м поруч, кожен підписаний зерном і рядком Check Town. Має вийти: справжнє місце і три його згенеровані версії поруч.\n   4. Напиши під ними одне речення: яке зерно ти здаси, оцінивши за правилами Дня 90 (орієнтир, висоти ростуть від берега, стилі родинами, прогалини для прольоту). Має вийти: вибір за правилами, а не лише за смаком. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Те саме місце? Тьютор описує три зерна (одне з площею, забудованою будинками; одне, де всі будинки однакової висоти; одне, що йде за ритмом мапи). Для кожного я кажу, чи воно ще впізнається як справжнє місце і яке правило не спрацювало. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainia енти приймають у студіях: не «виглядає нормально», а «ось кожна обіцянка і її доказ». Сьогодні твій випускний проєкт стає робочим інструментом. It comes back: review_day105.md визначає роботу Днів 106–110: доведення (День 106), перевірка (День 107), реліз 2.0 (День 108), демо (День 109) і передача (День 110).); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-105-boss-district-generator-v1 exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (Ланцюжок одним клацанням, перевірки і доказ «те саме зерно» (відпрацьовані на міні-уроках)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Пройди review_day105.md рядок за рядком і запиши кожен доказ, наприклад 'Check Town seed 3: 0 problems' або 'contact_sheet_day105.png'. Має вийти: видно, які обіцянки мають докази.\n   2. Познач кожен рядок met, partly або not yet. Тримай суворий стандарт: «виглядає нормально» — не доказ. Має вийти: чесна картина v1. [screenshot]\n   3. Дай кожному рядку partly чи not yet день, який його виправить: 106 доведення, 107 перевірка, 108 можливість імпорту, 109 демо, 110 передача. Має вийти: решта курсу націлена на твої справжні прогалини.\n   4. Попроси тьютора прочитати огляд, як провідний технічний художник: яку позначку він би оскаржив? Виправ цей рядок або зміни позначку. Має вийти: огляд, що витримає перевірку в студії. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Доказ чи ні: тьютор дає мені шість доказів ('I checked it'; 'Check Town seed 3: 0 problems'; скриншот із випадкового ракурсу; contact_sheet_day105.png; 'it felt fast'; perf_report.md з маршруту). Про кожен я кажу, чи він щось доводить, і що довело б. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; tier (Bronze, Silver, Gold) = медаль (Бронза, Срібло, Золото); lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; review (by tutor or art director) = огляд; checklist = чек-лист; credits line = рядок авторства; comparison sheet, board (an image) = аркуш (аркуш порівняння, аркуш референсів); click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); File Explorer = Провідник; vertex / edge / face = вершина / ребро / грань; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; material slot / node / pin = слот матеріалу / вузол / вхід; volume (PCG Volume, Post Process Volume) = об'єм; seed = зерно (налаштування Seed); map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; district / plot / plot plan = район / ділянка / план ділянки; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; vista / blockout / landmark = панорама / блокаут / орієнтир; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}], "handin": [{"en": "summary.md", "uk": "summary.md (звіт дня)"}, {"en": "boss_day105.md (the promise from design_doc.md, start time and tier times) (Boss)", "uk": "boss_day105.md (обіцянка з design_doc.md, час початку і час кожної медалі) (День боса)"}, {"en": "review_day105.md (every design-doc line marked and proved, not-yet lines placed in Days 106 to 110) (→ Day 106)", "uk": "review_day105.md (кожен рядок проєктного документа позначено й доведено, рядки not yet розподілено між Днями 106–110) (→ День 106)"}, {"en": "contact_sheet_day105.png (the three seeds beside the real map) (proof)", "uk": "contact_sheet_day105.png (три зерна поруч зі справжньою мапою) (доказ)"}, {"en": "view_120m and street_2m for seeds A, B and C (Boss)", "uk": "view_120m і street_2m для зерен A, B і C (День боса)"}, {"en": "clip_day105.mp4 (Clear, one click, the district appearing, a flight to the landmark; 60 seconds, under 50 MB) (Boss)", "uk": "clip_day105.mp4 (Clear, одне клацання, район з'являється, проліт до орієнтира; 60 секунд, менше за 50 МБ) (День боса)"}], "goal": {"en": "By the end of today you have District Generator v1: one click on Regenerate builds your whole 200 x 200 m district from the real street plan, the rules and one seed (roads, junction tables, houses, the landmark, dressed streets and parks), Check Town reports 0 problems, three seeds give three versions of one real place, and review_day105.md checks every line of your design document.", "uk": "До кінця дня в тебе є District Generator v1. Одне клацання Regenerate будує весь район 200 × 200 м зі справжнього плану вулиць, правил і одного зерна: дороги, майданчики перехресть, будинки, орієнтир, обставлені вулиці й парки. Check Town показує 0 проблем, три зерна дають три версії одного справжнього місця, а review_day105.md перевіряє кожен рядок проєктного документа."}, "uses": [{"en": "Days 101 to 104: design_doc.md, DT_DistrictRoads, DA_TownRules_District, BP_DistrictGenerator and the dressing", "uk": "Дні 101–104: design_doc.md, DT_DistrictRoads, DA_TownRules_District, BP_DistrictGenerator і обставляння"}, {"en": "Day 90: Check Town, LaneGauge, contact sheets and the same-bookmark rule", "uk": "День 90: Check Town, LaneGauge, аркуші порівняння (contact sheet) і правило однієї закладки"}, {"en": "Day 99: the same-seed proof and tags in Git", "uk": "День 99: доказ «те саме зерно» і теги в Git"}, {"en": "Day 89: Regenerate's chain and the Dresser link", "uk": "День 89: ланцюжок Regenerate і зв'язок із Dresser"}], "quiz": [{"q": {"en": "Day 101: What does the 'done means' section of a design document hold?", "uk": "День 101: що містить розділ done means проєктного документа?"}, "options": [{"en": "The exact proofs that the tool is finished: pictures, the video, the performance report, the checker, the install test", "uk": "Точні докази того, що інструмент готовий: картинки, відео, звіт про продуктивність, перевірку, тест встановлення"}, {"en": "A list of wishes for later", "uk": "Список побажань на потім"}, {"en": "The tool's code", "uk": "Код інструмента"}, {"en": "The credits", "uk": "Рядки авторства"}], "answer": 0, "explain": {"en": "Done means is the finish line written as proofs, so nobody argues about whether it is finished.", "uk": "Done means — це фініш, записаний як докази, тож ніхто не сперечається, чи роботу завершено."}}, {"q": {"en": "Day 101: Why build the district from a real place?", "uk": "День 101: навіщо будувати район за справжнім місцем?"}, "options": [{"en": "Real places are always smaller", "uk": "Справжні місця завжди менші"}, {"en": "Real towns carry real logic, such as streets along the shore and a square at the church, so the district reads as a place", "uk": "Справжні міста несуть справжню логіку, як-от вулиці вздовж берега і площа біля церкви, тож район впізнається як місце"}, {"en": "Unreal requires a real place", "uk": "Unreal вимагає справжнього місця"}, {"en": "Map data replaces the rules asset", "uk": "Картографічні дані замінюють асет правил"}], "answer": 1, "explain": {"en": "Generated detail on top of a real plan looks designed, because the plan was designed by the people who built the town.", "uk": "Згенеровані дрібниці на справжньому плані виглядають продуманими, бо план продумали люди, які будували місто."}}, {"q": {"en": "Day 102: Your preview is mirrored compared with the map. What fixes it?", "uk": "День 102: перегляд дзеркальний відносно мапи. Що це виправить?"}, "options": [{"en": "Rotate the generator 180 degrees", "uk": "Повернути генератор на 180 градусів"}, {"en": "Reimport the Data Table", "uk": "Повторно імпортувати Data Table"}, {"en": "y = (max_lat - lat) x 110540, so Y counts south from the north edge as Unreal's Y does", "uk": "y = (max_lat - lat) × 110540, щоб Y рахувався на південь від північного краю, як Y в Unreal"}, {"en": "Scale the generator by -1 in X", "uk": "Масштабувати генератор на -1 по X"}], "answer": 2, "explain": {"en": "With X pointing east, Unreal's Y points south; counting y northwards mirrors the plan.", "uk": "Коли X дивиться на схід, Y в Unreal дивиться на південь. Якщо рахувати y на північ, план дзеркалиться."}}, {"q": {"en": "Day 102: Why does every row of district_roads.csv start with a name like R3_P7?", "uk": "День 102: чому кожен рядок district_roads.csv починається з назви на кшталт R3_P7?"}, "options": [{"en": "A Data Table's first column becomes the row name, and row names must be unique", "uk": "Перший стовпець Data Table стає назвою рядка, а назви рядків мають бути унікальними"}, {"en": "It sorts the rows", "uk": "Це сортує рядки"}, {"en": "OpenStreetMap requires it", "uk": "Цього вимагає OpenStreetMap"}, {"en": "The seed reads it", "uk": "Його читає зерно"}], "answer": 0, "explain": {"en": "With only the road number first, rows of one road would share a name and overwrite each other.", "uk": "Якби першим стояв лише номер дороги, рядки однієї дороги мали б однакову назву і перезаписували б один одного."}}, {"q": {"en": "Day 103: Houses stand in the middle of a crossing street near a junction. Which rule do you tune?", "uk": "День 103: будинки стоять посеред вулиці, що перетинає іншу біля перехрестя. Яке правило підлаштувати?"}, "options": [{"en": "Gap Chance", "uk": "Gap Chance"}, {"en": "House Clear (or Junction Clear): the distance kept from other roads and from road ends", "uk": "House Clear (або Junction Clear): відстань від інших доріг і від кінців доріг"}, {"en": "Bay Width", "uk": "Bay Width"}, {"en": "The seed", "uk": "Зерно"}], "answer": 1, "explain": {"en": "Too Close measures each house's centre against every other road; a bigger clearance keeps corners free.", "uk": "Too Close міряє центр кожного будинку проти кожної іншої дороги. Більший відступ тримає кути вільними."}}, {"q": {"en": "Day 103: Why is Spawn One Road called again on the loop's Completed pin?", "uk": "День 103: навіщо Spawn One Road викликають ще раз на виході Completed циклу?"}, "options": [{"en": "To build one extra road", "uk": "Щоб збудувати одну зайву дорогу"}, {"en": "To clear the list", "uk": "Щоб очистити список"}, {"en": "To place the junctions", "uk": "Щоб поставити перехрестя"}, {"en": "Without it the last road is never built, because no new road number follows it", "uk": "Без цього останню дорогу ніколи не збудують, бо після неї немає нового номера дороги"}], "answer": 3, "explain": {"en": "Grouping builds a road when the next one starts; the last group needs a final call.", "uk": "Групування будує дорогу, коли починається наступна. Остання група потребує фінального виклику."}}, {"q": {"en": "Day 104: A tree from PCG_DistrictGreen stands in KO_Corridor02. What do you check?", "uk": "День 104: дерево з PCG_DistrictGreen стоїть у KO_Corridor02. Що перевірити?"}, "options": [{"en": "That PCG_KeepOuts is on the green graph's branch and KO_Corridor02 carries the tag KeepOutWide", "uk": "Чи стоїть PCG_KeepOuts на гілці зеленого графа і чи має KO_Corridor02 тег KeepOutWide"}, {"en": "The tree mesh", "uk": "Меш дерева"}, {"en": "The seed", "uk": "Зерно"}, {"en": "The landmark", "uk": "Орієнтир"}], "answer": 0, "explain": {"en": "Every generator must read the same corridors; a missing branch or tag lets things through.", "uk": "Кожен генератор має читати ті самі коридори. Якщо бракує гілки чи тегу, щось проходить."}}, {"q": {"en": "Day 105: Your review says 'parks: met' with the proof 'looks fine'. What would be a real proof?", "uk": "День 105: в огляді написано 'parks: met' з доказом 'looks fine'. Що було б справжнім доказом?"}, "options": [{"en": "Another opinion", "uk": "Ще одна думка"}, {"en": "The seed number", "uk": "Номер зерна"}, {"en": "A picture from the 120 m bookmark showing the parks where the map has them, with no house inside a zone", "uk": "Картинка із закладки на 120 м, де парки стоять там, де їх показує мапа, і в жодній зоні немає будинку"}, {"en": "The commit message", "uk": "Повідомлення коміту"}], "answer": 2, "explain": {"en": "A proof is something another person can check: a fixed view, a number or a check line.", "uk": "Доказ — це те, що інша людина може перевірити: фіксований вид, число чи рядок перевірки."}}], "weekInfo": null, "morning": {"sofar": {"en": "This week you wrote a design document, turned a real map into data, built roads, junctions, plots and houses from it, and dressed the district.", "uk": "За цей тиждень з'явилися проєктний документ, справжня мапа, перетворена на дані, дороги, перехрестя, ділянки й будинки, збудовані з неї, і обставлений район."}, "today": {"en": "You prove District Generator v1: one click, one seed, a whole district, checked against your own design document.", "uk": "Ти доводиш District Generator v1: одне клацання, одне зерно, цілий район, звірений із твоїм проєктним документом."}, "cheer": {"en": "Whatever lines are still 'not yet' tonight, you have built a working generator from a real map; that is a real achievement.", "uk": "Хоч які рядки ввечері ще лишаться not yet, робочий генератор зі справжньої мапи вже збудовано — і це справжнє досягнення."}, "quote": {"text": {"en": "A complex system that works is invariably found to have evolved from a simple system that worked.", "uk": "Складна система, що працює, неодмінно виросла з простої системи, яка працювала."}, "author": {"en": "John Gall", "uk": "Джон Ґолл"}, "source": "General Systemantics (book), 1975; later published as Systemantics"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-105-boss-district-generator-v1", "mapHref": "../../COURSE.html", "prevHref": "../Day-104-district-dressing-parks-corridors/START-HERE.html", "nextHref": "../Day-106-district-polish-rules/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8, Krita and Git. I am a beginner on Day 105. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me: when my Blueprint or script fails, ask for the error message or a screenshot of the graph, point to the line or node that is wrong and explain why, then let me fix it myself. Never write the whole tool for me.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: Три зерна, аркуш порівняння, прольоти коридорів, огляд, а для Золота — друге справжнє місце.\nIt's part of: BP_DistrictGenerator v1 в L_District: увесь район одним клацанням з одного зерна, перевірений, з прольотом коридорів, порівняний на трьох зернах поруч зі справжньою мапою, звірений із design_doc.md і закомічений у Git (L_District з копіями L_District_SeedA, L_District_SeedB і L_District_SeedC у /TechTools/District; огляд і картинки — у робочій папці дня.).\nWhy it matters: Генератору довіряють, коли одна кнопка дає повний, правильний, повторюваний результат, а його автор може показати це проти письмового плану, рядок за рядком. Саме так інструменти приймають у студіях: не «виглядає нормально», а «ось кожна обіцянка і її доказ». Сьогодні твій випускний проєкт стає робочим інструментом. It comes back: review_day105.md визначає роботу Днів 106–110: доведення (День 106), перевірка (День 107), реліз 2.0 (День 108), демо (День 109) і передача (День 110).\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-105-boss-district-generator-v1 (on the drive I chose on Day 0).\nWhat I already know: Дні 101–104: design_doc.md, DT_DistrictRoads, DA_TownRules_District, BP_DistrictGenerator і обставляння; День 90: Check Town, LaneGauge, аркуші порівняння (contact sheet) і правило однієї закладки; День 99: доказ «те саме зерно» і теги в Git; День 89: ланцюжок Regenerate і зв'язок із Dresser; today's lessons: Одне клацання: увесь ланцюжок; План боса: одне клацання, одне зерно, одна обіцянка (міні-урок); Три зерна одного справжнього місця (міні-урок); Огляд проти проєктного документа (міні-урок). Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- boss_day105.md: обіцянка, скопійована з design_doc.md, час початку і час, коли здобуто кожну медаль.\n- BP_DistrictGenerator отримує Green (Actor, Instance Editable, Category Links) для об'єму PCG_DistrictGreen. Regenerate одним клацанням із очищеного рівня виконує: Check Inputs, Read Rows, потоки, Clear Town, Spawn Roads, Spawn Junctions, Make Plots, Spawn Buildings, Spawn Landmark, Spawn Features, Generate на Dresser і на Green (кожен із попередженням, якщо його немає) і один підсумковий рядок через Format Text із кількістю доріг, перехресть, будинків і об'єктів площі.\n- Check Town показує 0 проблем. Те саме зерно двічі дає однакові картинки з однієї закладки. Clear прибирає лише те, що зробив інструмент.\n- Три зерна збережено як L_District_SeedA, B і C. Для кожного є картинки view_120m і street_2m з тих самих двох закладок. contact_sheet_day105.png: map_box.png поруч із трьома видами з 120 м, кожен підписаний зерном і рядком Check Town, і одне речення про те, яке зерно ти здаси і чому.\n- LaneGauge уздовж кожного коридору і крізь три прогалини, крізь які можна пролетіти, у вибраному зерні — нічого не торкається.\n- review_day105.md: кожен рядок розділів Outputs, Settings і Done means з design_doc.md позначено met, partly або not yet, кожен із доказом (картинка, число чи рядок перевірки), а кожен рядок not yet розподілено на один із Днів 106–110.\n- Зроблено коміт і надіслано, без тегу сьогодні: наступний реліз — 2.0 у День 108. Бронза, Срібло і Золото — як у списку нижче.\n\nMy checklist (the same numbers show on my course page):\n1. Перевір, чи є результати сьогоднішніх уроків: дві закладки в L_District і ланцюжок одним клацанням, відпрацьований на уроці 1. Чогось бракує? Пройди зараз кроки «Разом із тьютором» того уроку (близько 25 хвилин): самостійна робота спирається на них. Слабкий ПК (16 ГБ оперативної пам'яті чи менше): під час роботи зменш об'єми PCG до 100 × 100 м, а для фінальних картинок збільш (див. розділ про слабкі ПК в ACCOUNTS-AND-INSTALLS.html). Запусти годинник: Бронза — до 2-ї години, уся самостійна робота — приблизно за 3 години 30 хвилин. Запиши час початку вгорі boss_day105.md. Перевірка: час початку записано. (from lesson 2)\n2. Додай Green (Actor, Instance Editable, Category Links), вибери об'єм PCG_DistrictGreen і запускай для нього Generate наприкінці Regenerate так само, як для Dresser, з помаранчевим попередженням, коли Green порожній. Перевірка: одне клацання тепер запускає обидва об'єми PCG. (from lesson 1)\n3. Клацни Clear, потім один раз Regenerate. Перевірка: з'являються дороги, майданчики перехресть, будинки, орієнтир, об'єкти площі, обставлені вулиці й парки, а один підсумковий рядок рахує дороги, перехрестя, будинки й об'єкти. (from lesson 1)\n4. Клацни Check Town. Перевірка: 0 проблем. Кожну проблему виправлено в причині (правило, коридор, зона), потім Regenerate і повторна перевірка. (from day 90, lesson 1)\n5. Те саме зерно двічі: із закладки на 120 м двічі клацни Regenerate. Перевірка: однаково, будинок у будинок. Бронзу здобуто: запиши час у boss_day105.md. (from lesson 1)\n6. Збережи як L_District_SeedA; створи L_District_SeedB і L_District_SeedC з двома новими зернами, у кожному клацни Regenerate і Check Town. З тих самих двох закладок зроби view_120m і street_2m для кожного зерна. Перевірка: 0 проблем в усіх трьох і шість картинок з тими самими двома видами. (from lesson 3)\n7. Зроби в Krita contact_sheet_day105.png: map_box.png поруч із трьома видами з 120 м, кожен підписаний зерном і рядком Check Town, і одне речення про зерно, яке ти здаси. Перевірка: усі три впізнаються як одне справжнє місце з різними дрібницями. (from lesson 3)\n8. Пролети LaneGauge уздовж кожного коридору і крізь три прогалини у вибраному зерні. Перевірка: він нічого не торкається. (from day 90, lesson 3)\n9. Напиши review_day105.md: кожен рядок Outputs, Settings і Done means з design_doc.md позначено met, partly або not yet з доказом, а кожен рядок not yet розподілено на один із Днів 106–110. Перевірка: немає рядка без позначки й доказу. Срібло здобуто: запиши час. (from lesson 4)\n10. Золото: експортуй друге справжнє місце, запусти osm_to_layout.py з новими SRC і OUT, імпортуй DT_DistrictRoads_B, скопіюй правила як DA_TownRules_District_B із зонами з його власної мапи і клацни Regenerate у новому рівні. Перевірка: друге справжнє містечко збудовано менш ніж за 60 хвилин, Check Town показує 0 проблем. (from day 102, lesson 3)\n11. Зроби коміт і надішли (сьогодні без тегу: наступний реліз — 2.0 у День 108). Запиши clip_day105.mp4 (Clear, одне клацання Regenerate, район з'являється, потім проліт головною вулицею до орієнтира; 60 секунд, менше за 50 МБ) в OBS Studio (Display Capture) або Win+Shift+R (Snipping Tool, виділи весь екран). Перевірка: кліп у робочій папці дня, менший за 50 МБ. (from lesson 2)\n12. Клацни «Копіювати звіт дня», встав у новий чат із тьютором, дай відповіді на його питання і збережи його відповідь як summary.md у робочій папці дня. Перетягни файли з розділу «Що здати» (ніколи не три рівні) в папку здачі (кнопка на цій сторінці). Папку проєкту чи рівня Unreal здавати не треба: вона дуже велика. Перевірка: у папці здачі всі файли, кожен більший за 1 КБ. (from lesson 2)\n\nToday is a BOSS build. Ask me what time I started; whenever I tell you the time, tell me which tier I'm on track for. At the end, ask my finish time. Tiers:\n- Бронза: одне клацання з очищеного рівня будує весь район (дороги, майданчики перехресть, будинки, орієнтир, обставлені вулиці, парки), Check Town показує 0 проблем, а те саме зерно двічі будує той самий район — за 2 години.\n- Срібло: Бронза, плюс три зерна на contact_sheet_day105.png поруч зі справжньою мапою, LaneGauge вільно проходить уздовж кожного коридору, а в review_day105.md кожен рядок проєктного документа позначено й доведено — за 3 години.\n- Золото: Срібло, плюс друге справжнє місце (нова вибірка OpenStreetMap через osm_to_layout.py з власною Data Table і асетом правил), збудоване тим самим Blueprint менш ніж за 60 хвилин, з 0 проблем у Check Town.\n\nHow to help: ask which step number I'm on, then give me only the next step: the exact clicks and what I should see. When I send a screenshot, compare it with my reference, my sizes and the spec, and name one thing to fix at a time.\nCheck every save and export by reopening it before we move on:\n- a Blueprint or script: compile or run it once more and see it work, with no errors\n- a .md or .txt: open it with Notepad; the text is there, and the name doesn't end in .md.txt\n- the clip: right-click > Properties shows 30 to 60 seconds and under 50 MB\nWhen I write \"готово\", and in any case before the day ends, check with me one item at a time (yes/no): each spec point, then each file on my hand-in list, ready in my day work folder (skip summary.md: the day report writes it next):\n1. boss_day105.md (обіцянка з design_doc.md, час початку і час кожної медалі) (День боса)\n2. review_day105.md (кожен рядок проєктного документа позначено й доведено, рядки not yet розподілено між Днями 106–110) (→ День 106)\n3. contact_sheet_day105.png (три зерна поруч зі справжньою мапою) (доказ)\n4. view_120m і street_2m для зерен A, B і C (День боса)\n5. clip_day105.mp4 (Clear, одне клацання, район з'являється, проліт до орієнтира; 60 секунд, менше за 50 МБ) (День боса)\nFinish with a short list of anything missing, the tier I reached, and one line on where this work comes back and what it will look like there. Then tell me the order for the end of the day: first the day report (the Copy the day report button at the bottom of my course page) into summary.md, and only then hand in all the files on the list, summary.md too.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; tier (Bronze, Silver, Gold) = медаль (Бронза, Срібло, Золото); lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; review (by tutor or art director) = огляд; see-why-fix note = нотатка «бачу, чому, як виправити»; checklist = чек-лист; credits line = рядок авторства; reference photo / hero photo = фото-референс / ключове фото; comparison sheet, board (an image) = аркуш (аркуш порівняння, аркуш референсів); click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); vertex / edge / face = вершина / ребро / грань; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; material slot / node / pin = слот матеріалу / вузол / вхід; volume (PCG  return '<section class="card glass morning"><div class="mgrid">'+(m.sofar?'<div>'+lab(u('sofar'),'gold')+shelf+'<p class="mtxt">'+lk(x(m.sofar))+'</p></div>':'')+(m.today?'<div>'+lab(u('todayL'))+'<p class="mtxt">'+lk(x(m.today))+'</p></div>':'')+'</div>'+(m.cheer?'<p class="cheer">'+esc(x(m.cheer))+'</p>':'')+(qt?'<figure class="quote well">'+kn('quote')+'<blockquote>'+esc(qt)+'</blockquote>'+(q.author?'<figcaption>'+esc(x(q.author))+'</figcaption>':'')+'</figure>':'')+'</section>'}
function setLang(l){lang=l;try{localStorage.setItem('devteam:lang',lang)}catch(e){};render()}
function toggleLang(){setLang(lang==='uk'?'en':'uk')}
/* keep open sections and keyboard focus across re-renders */
const openD=new Set();
function tg(e){if(e.open)openD.add(e.id);else openD.delete(e.id)}
const op=id=>openD.has(id)?' open':'';
function render(){const ae=document.activeElement,fid=ae&&(ae.id||(ae.getAttribute('data-th')?'th-'+ae.getAttribute('data-th'):ae.getAttribute('lang')&&ae.closest('.seg')?'lg-'+ae.getAttribute('lang'):''));
 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);
 const b=D.build,P=Math.round(prog()*100);
 document.getElementById('top').innerHTML='<div class="topin glass"><a class="maplink" href="'+esc(D.mapHref)+'">'+kn('map')+u('map')+'</a><div class="crumb"><b>'+esc(x(D.learnerName))+'</b><span>'+u('week')+' '+D.week+'</span><span>'+u('day')+' '+D.day+' '+u('of')+' '+D.total+'</span></div>'+controls(lang,'setLang')+'</div><div class="tline"><i style="width:'+P+'%"></i></div>';
 const state=w=>w<D.week?'b':w===D.week?'n':'p';
 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 let wk='';if(D.weekInfo){const w=D.weekInfo;wk='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}
 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p>'+(b.next?'<div class="back well">'+kn('arrow')+'<div><b>'+u('comes')+'</b><br>'+lk(x(b.next))+'</div></div>':'')+'<div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.assetFiles&&D.assetFiles.length?'<p class="files">'+ic('folder')+'<span>'+u('filesL')+' '+D.assetFiles.map(f=>'<a href="assets/'+encodeURIComponent(f)+'" target="_blank" rel="noopener">'+esc(f)+'</a>').join(', ')+'</span></p>':D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+=handinCard();h+=beforeCard();
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div><label class="rcpt" for="r'+i+'"><span class="eyebrow">'+u('rcpt')+'</span><textarea id="r'+i+'" rows="2" placeholder="'+esc(u('rcptPh'))+'" oninput="st.r'+i+'=this.value;save()">'+esc(st['r'+i]||'')+'</textarea></label>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+hList()+chkList()+(hasClip?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<h3>1 · '+u('copyR')+'</h3><p class="muted">'+u('report')+'</p><div class="row"><button class="btn ghost" onclick="cp(reportText())">'+ic('copy')+u('copyR')+'</button></div><h3>2 · '+u('ship')+'</h3>'+hf()+'<p class="muted" style="margin:12px 0 0">'+u('hNote')+'</p></section>';
 h+=qCard();h+=wk;
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();
</script>

<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 91</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

PUTime, як у День 41."}, {"en": "One Unreal Insights recording of 20 to 30 seconds of flight: the slowest frame found in the Frames panel and its three biggest timers written down, with insights_frame.png.", "uk": "Один запис Unreal Insights: 20–30 секунд прольоту. На панелі Frames знайдено найповільніший кадр, його три найбільші таймери записано, є insights_frame.png."}, {"en": "A cost table by subtraction from V1, one change at a time: everything; the dresser cleaned up; the buildings hidden; Tree Gap 1. Each row has GPU ms and draw calls, and everything is restored afterwards.", "uk": "Таблиця вартості методом віднімання з V1, по одній зміні за раз: усе; дрібниці прибрано (Cleanup); будинки сховано; Tree Gap 1. У кожному рядку — GPU у мс і draw calls. Наприкінці все повернуто."}, {"en": "Two view-mode pictures from V2 (Quad Overdraw or Shader Complexity, and Nanite Overview), and three ranked suspects for Day 95, each with the tool setting that controls it.", "uk": "Дві картинки режимів перегляду з V2 (Quad Overdraw або Shader Complexity, і Nanite Overview). Три підозрювані для Дня 95 за рангом, кожен із налаштуванням інструмента, яке ним керує."}], "piece1": "The stat views, the CSV capture and the Insights recording (built in the lessons)", "piece2": {"en": "The cost table by subtraction and your three ranked suspects, on your own", "uk": "Таблиця вартості методом віднімання і три підозрювані за рангом — самостійно"}, "steps": [{"text": {"en": "Check: the results of today's lessons are there (the stat views, csv_day91.csv and an Insights recording, all from L_Day91). Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it. Open L_Day91 and check it against the spec: the quarter regenerated with your seed, GameModeBase, the Player Start 30 m up, and the three bookmarks. Check: Play flies you over the quarter, and pressing 1, 2 and 3 in the editor jumps to V1, V2 and V3.", "uk": "Перевір, чи є результати сьогоднішніх уроків: показники stat, csv_day91.csv і запис Insights, усе з L_Day91. Чогось бракує? Пройди зараз кроки «Разом із тьютором» того уроку (близько 25 хвилин): самостійна частина спирається на них. Відкрий L_Day91 і звір із вимогами: мікрорайон перегенеровано з твоїм зерном, GameModeBase, Player Start на 30 м угорі, три закладки. Перевірка: у Play ти летиш над мікрорайоном, а клавіші 1, 2 і 3 в редакторі перемикають V1, V2 і V3."}, "lesson": 1}, {"text": {"en": "Write the settings block of perf_baseline.md in today's Work folder: Engine Scalability High, a New Editor Window at 1920 x 1080, your PC, and the budget. If your PC is below the course minimum (16 GB RAM, a 6 GB graphics card), write that here: you will still measure at 1920 x 1080 and judge every change by before and after on this same PC. Check: the block has six filled lines.", "uk": "Напиши блок налаштувань perf_baseline.md у сьогоднішній папці Work: Engine Scalability High, New Editor Window у 1920 × 1080, твій ПК і бюджет. Якщо твій ПК слабший за мінімум курсу (16 ГБ оперативної пам'яті, відеокарта з 6 ГБ), так і напиши. Ти все одно міряєш у 1920 × 1080 і оцінюєш кожну зміну «до і після» на цьому самому ПК. Перевірка: у блоці шість заповнених рядків."}, "lesson": 1}, {"text": {"en": "Stat views: at V1, V2 and V3 write Frame, Game, Draw and GPU from stat unit, the draw calls from stat RHI and the five biggest stat gpu lines. Check: a table of three rows and three short lists, and one sentence naming what limits your frame.", "uk": "Показники stat: у V1, V2 і V3 запиши Frame, Game, Draw і GPU зі stat unit, draw calls зі stat RHI і п'ять найбільших рядків stat gpu. Перевірка: таблиця з трьох рядків, три короткі списки й одне речення про те, що обмежує твій кадр."}, "lesson": 1}, {"text": {"en": "CSV capture: Play in a New Editor Window, type csvprofile start, fly 60 seconds at a steady speed (waterfront, shop street, square, over the roofs), then type csvprofile stop. Check: a new .csv in IslandCourse/Saved/Profiling/CSV, copied into today's Work folder as csv_day91.csv.", "uk": "CSV-захоплення: запусти Play in a New Editor Window і введи csvprofile start. Лети 60 секунд з рівною швидкістю: набережна, вулиця з крамницями, площа, над дахами. Потім введи csvprofile stop. Перевірка: новий .csv у IslandCourse/Saved/Profiling/CSV скопійовано в сьогоднішню папку Work як csv_day91.csv."}, "lesson": "D41.4"}, {"text": {"en": "Open csv_day91.csv in LibreOffice Calc (Language English (USA)) and work out =AVERAGE and =PERCENTILE(...,0.95) of FrameTime and GPUTime, stopping above the text rows at the bottom. Check: four numbers in milliseconds in perf_baseline.md, and one line saying pass or fail against the budget.", "uk": "Відкрий csv_day91.csv у LibreOffice Calc (Language English (USA)). Порахуй =AVERAGE і =PERCENTILE(...,0.95) для FrameTime і GPUTime, не захоплюючи текстові рядки внизу. Перевірка: у perf_baseline.md чотири числа в мілісекундах і один рядок: бюджет пройдено чи ні."}, "lesson": "D41.4"}, {"text": {"en": "Insights: record 20 to 30 seconds of flight, open it in Unreal Insights, click the tallest bar in the Frames panel and sort the Timers by Inclusive time. Check: insights_frame.png shows the slow frame selected, and its three biggest timers are written down with one plain line each on what they do.", "uk": "Insights: запиши 20–30 секунд прольоту і відкрий запис в Unreal Insights. Клацни найвищу смужку на панелі Frames і відсортуй Timers за Inclusive. Перевірка: на insights_frame.png виділено повільний кадр, а три його найбільші таймери записано, до кожного — простий рядок про те, що він робить."}, "lesson": 2}, {"text": {"en": "View modes from V2: overdraw.png (Quad Overdraw, or Shader Complexity if it is greyed out) and nanite.png (Nanite Visualization > Overview). Check: you can point to the hottest area in the first, and you have listed every mesh that is not Nanite from the second.", "uk": "Режими перегляду з V2: overdraw.png (Quad Overdraw, або Shader Complexity, якщо той сірий) і nanite.png (Nanite Visualization > Overview). Перевірка: на першій картинці ти можеш показати найгарячішу ділянку, а з другої виписано всі меші без Nanite."}, "lesson": 3}, {"text": {"en": "Write one line per big cost (instances and draw calls, overdraw, shadows, non-Nanite meshes, Lumen) with where it shows in your quarter and the setting that controls it. Check: five lines, each naming a real object from your quarter and a knob in your tools.", "uk": "Напиши по рядку на кожну велику вартість: інстанси й draw calls, overdraw, тіні, меші без Nanite, Lumen. У рядку — де це видно у твоєму мікрорайоні і яке налаштування цим керує. Перевірка: п'ять рядків, у кожному справжній об'єкт із мікрорайону і регулятор у твоїх інструментах."}, "lesson": 3}, {"text": {"en": "On your own: the cost table. From V1, one change at a time, each read 5 seconds after the change: everything; Cleanup on the dresser; buildings hidden with the Outliner's eye icon; Tree Gap 1 on the dresser and Generate. Check: four rows of GPU ms and draw calls, and after restoring everything the first row's numbers come back within 0.5 ms.", "uk": "Самостійно: таблиця вартості. З V1 роби по одній зміні й читай числа через 5 секунд після кожної: усе; Cleanup на розставлянні дрібниць (dresser); будинки сховано значком ока в Outliner; Tree Gap 1 на dresser і Generate. Перевірка: чотири рядки GPU у мс і draw calls. Коли все повернуто, числа першого рядка повертаються з точністю до 0,5 мс."}, "lesson": 4}, {"text": {"en": "On your own: work out each row's saving (row 1 minus that row), then rank three suspects for Day 95, each with the tool setting that controls it (for example Tree Gap, Cast Shadow on the props, Nanite on the kit). Check: three ranked lines, each with a number in ms and a knob.", "uk": "Самостійно: порахуй економію кожного рядка (рядок 1 мінус цей рядок). Потім розстав за рангом три підозрювані для Дня 95, кожен із налаштуванням інструмента, яке ним керує (наприклад, Tree Gap, Cast Shadow на пропсах, Nanite на наборі). Перевірка: три рядки за рангом, у кожному число в мс і регулятор."}, "lesson": 4}, {"text": {"en": "Click Copy the day report, paste it into a new tutor chat, answer its questions and save its answer as summary.md in today's Work folder. Drag summary.md, perf_baseline.md, csv_day91.csv and the three pictures into today's hand-in folder (the button on this page); never a project or level folder. Check: the hand-in folder lists 6 files, each over 1 KB.", "uk": "Клацни «Копіювати звіт дня», встав у новий чат із тьютором, дай відповіді на його питання і збережи його відповідь як summary.md у сьогоднішній папці Work. Перетягни summary.md, perf_baseline.md, csv_day91.csv і три картинки в папку здачі (кнопка на цій сторінці). Ніколи не перетягуй папку проєкту чи рівня. Перевірка: у папці здачі 6 файлів, кожен більший за 1 КБ."}, "lesson": 2}], "assets": ["techart/standards-sheet.md"], "next": {"en": "csv_day91.csv is the test data for tomorrow's perf_report.py (Day 92), and perf_baseline.md with its three suspects is the before column of your report on Friday (Day 95).", "uk": "csv_day91.csv — тестові дані для завтрашнього perf_report.py (День 92). perf_baseline.md з трьома підозрюваними — це стовпець «до» у твоєму звіті в п'ятницю (День 95)."}}, "lessons": [{"title": {"en": "A frame budget for a generated world (micro-recap)", "uk": "Бюджет кадру для згенерованого світу (коротке повторення)"}, "minutes": 40, "goals": [{"en": "Recall the budget: at 1920 x 1080, an average frame under 16.6 ms (60 fps) and a 95th percentile under 33.3 ms, which means only the slowest 5 frames in 100 may take longer.", "uk": "Пам'ятати бюджет: у 1920 × 1080 середній кадр менше за 16,6 мс (60 кадрів/с), а 95-й перцентиль менше за 33,3 мс. Тобто довше можуть тривати лише 5 найповільніших кадрів зі 100."}, {"en": "Read stat unit as Game (the game's logic), Draw (the processor preparing the picture) and GPU (the graphics card), and say which one sets the frame.", "uk": "Читати stat unit як Game (логіка гри), Draw (процесор готує картинку) і GPU (відеокарта) та називати, що з них визначає кадр."}, {"en": "Set up a fair test: the same level, settings, views and PC every time.", "uk": "Налаштовувати чесний тест: щоразу той самий рівень, налаштування, види і ПК."}], "doalong": [{"en": "In Content/Tools/Day91 save your Day 90 level as L_Day91 (File > Save Current Level As). Select BP_TownGenerator, check its Seed, click Regenerate and untick Show Preview. You see your finished quarter and its summary line in the Output Log.", "uk": "У Content/Tools/Day91 збережи свій рівень Дня 90 як L_Day91 (File > Save Current Level As). Вибери BP_TownGenerator, перевір його Seed, клацни Regenerate і зніми прапорець Show Preview. Має вийти: готовий мікрорайон, а в Output Log — його підсумковий рядок."}, {"en": "Open Window > World Settings, set GameMode Override to GameModeBase, and drag a Player Start 30 m above the quarter, as on Day 33. Press Play in a New Editor Window (the three dots next to Play). You see yourself flying over the quarter; Esc stops.", "uk": "Відкрий Window > World Settings, постав GameMode Override на GameModeBase і перетягни Player Start на 30 м над мікрорайоном, як у День 33. Запусти Play in a New Editor Window (три крапки біля Play). Ти летиш над мікрорайоном; Esc зупиняє."}, {"en": "Set Settings > Engine Scalability Settings to High, and Edit > Editor Preferences > Level Editor > Play > New Viewport Resolution to 1920 x 1080. Write both at the top of perf_baseline.md, with your PC from Task Manager > Performance. You see the test conditions written down.", "uk": "Постав Settings > Engine Scalability Settings на High, а Edit > Editor Preferences > Level Editor > Play > New Viewport Resolution — на 1920 × 1080. Запиши обидва значення вгорі perf_baseline.md разом зі своїм ПК з Task Manager > Performance. Має вийти: умови тесту записано."}, {"en": "In the editor viewport fly to 120 m over the quarter and press Ctrl+1; then 15 m along the waterfront and press Ctrl+2; then 2 m in the shop street and press Ctrl+3. Press 1, 2 and 3. You see the camera jump exactly between three fixed views.", "uk": "У в'юпорті редактора підлети на 120 м над мікрорайоном і натисни Ctrl+1. Потім на 15 м уздовж набережної — Ctrl+2. Потім на 2 м на вулиці з крамницями — Ctrl+3. Натисни 1, 2 і 3. Камера точно перескакує між трьома фіксованими видами."}, {"en": "At each view open the console (the key under Esc; if it does nothing, use the Cmd box at the bottom of Window > Output Log) and type stat unit, then stat RHI, then stat gpu (type a command again to hide it).", "uk": "У кожному виді відкрий консоль: клавіша під Esc. Якщо вона нічого не робить, користуйся полем Cmd унизу Window > Output Log. Введи stat unit, потім stat RHI, потім stat gpu. Щоб сховати показник, введи команду ще раз."}, {"en": "If a stat command shows nothing in your version, use stat fps and note it. You see which of Game, Draw and GPU is biggest: that one sets your frame.", "uk": "Якщо команда stat у твоїй версії нічого не показує, введи stat fps і запиши це. Має вийти: видно, що з Game, Draw і GPU найбільше. Саме воно визначає твій кадр."}], "play": {"en": "Bottleneck detective: the tutor gives me four stat unit readings (Game 4, Draw 6, GPU 21; Game 18, Draw 5, GPU 9; Game 3, Draw 15, GPU 12; all three under 8). For each I say what limits the frame and one thing in a generated town that could cause it.", "uk": "Детектив вузьких місць: тьютор дає мені чотири набори показників stat unit (Game 4, Draw 6, GPU 21; Game 18, Draw 5, GPU 9; Game 3, Draw 15, GPU 12; усі три менше за 8). Для кожного я кажу, що обмежує кадр, і називаю одну річ у згенерованому місті, яка могла б це спричинити."}, "video": {"search": "unreal engine 5 stat unit stat gpu performance basics"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Бюджет кадру для згенерованого світу (коротке повторення) (Day 91, lesson 1 of 4). Today's build: perf_baseline.md: вартість одного згенерованого міського мікрорайону на твоєму ПК, виміряна чотирма способами: показники stat, CSV-захоплення, запис Insights і таблиця вартості методом віднімання. Усе — у тренувальній копії мікрорайону Дня 90.\nWhat I already know: День 90: L_Day90_SeedA (або варіант, обраний для здачі) і його закладка на 120 м; День 89: BP_TownGenerator з Regenerate і Clear; День 85: PCG_StreetDresser на своєму PCG Volume, з Tree Gap; День 70: stat unit, stat RHI і perf_day70.md; Дні 41 і 56: budget.md, csvprofile start і stop та метод з електронною таблицею.\n\nBy the end of this lesson I can:\n1. Пам'ятати бюджет: у 1920 × 1080 середній кадр менше за 16,6 мс (60 кадрів/с), а 95-й перцентиль менше за 33,3 мс. Тобто довше можуть тривати лише 5 найповільніших кадрів зі 100.\n2. Читати stat unit як Game (логіка гри), Draw (процесор готує картинку) і GPU (відеокарта) та називати, що з них визначає кадр.\n3. Налаштовувати чесний тест: щоразу той самий рівень, налаштування, види і ПК.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: У тебе є BP_TownGenerator: він будує цілий міський мікрорайон з посадкою на ґрунт і дрібницями за розкладкою, правилами й зерном. А Check Town доводить, що крізь мікрорайон можна пролетіти. Today: Ти вимірюєш, скільки цей мікрорайон коштує твоєму ПК, чотирма способами, щоб кожну пізнішу зміну доводили числа. One encouraging line: Після трьох тижнів будування вимірювання здається повільним. Але саме ця базова лінія перетворює наступне виправлення з вгадування на доказ.); 2 lines on why today matters and where it comes back, in plain words (from this: З генератором легко побудувати більше, ніж ПК може намалювати: один Regenerate додає тисячі інстансів, тіней і draw calls. Перш ніж щось оптимізувати, потрібна базова лінія, щоразу виміряна однаково. Тоді пізнішу зміну доводять числа, а не відчуття. Студії питають технічних художників саме про це: скільки коштує генератор і куди йде час? It comes back: csv_day91.csv — тестові дані для завтрашнього perf_report.py (День 92). perf_baseline.md з трьома підозрюваними — це стовпець «до» у твоєму звіті в п'ятницю (День 95).); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-91-profiling-generated-worlds exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (Показники stat, CSV-захоплення і запис Insights (робиш на уроках)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. У Content/Tools/Day91 збережи свій рівень Дня 90 як L_Day91 (File > Save Current Level As). Вибери BP_TownGenerator, перевір його Seed, клацни Regenerate і зніми прапорець Show Preview. Має вийти: готовий мікрорайон, а в Output Log — його підсумковий рядок.\n   2. Відкрий Window > World Settings, постав GameMode Override на GameModeBase і перетягни Player Start на 30 м над мікрорайоном, як у День 33. Запусти Play in a New Editor Window (три крапки біля Play). Ти летиш над мікрорайоном; Esc зупиняє.\n   3. Постав Settings > Engine Scalability Settings на High, а Edit > Editor Preferences > Level Editor > Play > New Viewport Resolution — на 1920 × 1080. Запиши обидва значення вгорі perf_baseline.md разом зі своїм ПК з Task Manager > Performance. Має вийти: умови тесту записано. [screenshot]\n   4. У в'юпорті редактора підлети на 120 м над мікрорайоном і натисни Ctrl+1. Потім на 15 м уздовж набережної — Ctrl+2. Потім на 2 м на вулиці з крамницями — Ctrl+3. Натисни 1, 2 і 3. Камера точно перескакує між трьома фіксованими видами.\n   5. У кожному виді відкрий консоль: клавіша під Esc. Якщо вона нічого не робить, користуйся полем Cmd унизу Window > Output Log. Введи stat unit, потім stat RHI, потім stat gpu. Щоб сховати показник, введи команду ще раз.\n   6. Якщо команда stat у твоїй версії нічого не показує, введи stat fps і запиши це. Має вийти: видно, що з Game, Draw і GPU найбільше. Саме воно визначає твій кадр. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute t  показники stat, числа CSV, таймери Insights, таблиця вартості і три підозрювані за рангом) (→ День 95)"}, {"en": "csv_day91.csv (your 60-second capture) (→ Day 92)", "uk": "csv_day91.csv (твоє 60-секундне захоплення) (→ День 92)"}, {"en": "insights_frame.png, overdraw.png and nanite.png (proof)", "uk": "insights_frame.png, overdraw.png і nanite.png (доказ)"}], "goal": {"en": "By the end of today you have perf_baseline.md for one of your Day 90 town quarters: stat numbers at three fixed views, a 60-second CSV capture with its average and 95th percentile, an Unreal Insights recording of the slowest frame, and a cost table that shows what the buildings, the props and the trees each cost.", "uk": "До кінця дня в тебе є perf_baseline.md для одного з міських мікрорайонів Дня 90. У ньому числа stat у трьох фіксованих видах, 60-секундне CSV-захоплення з середнім і 95-м перцентилем, запис Unreal Insights найповільнішого кадру і таблиця вартості: скільки коштують будинки, пропси й дерева."}, "uses": [{"en": "Day 90: L_Day90_SeedA (or the variant you chose to ship) and its 120 m bookmark", "uk": "День 90: L_Day90_SeedA (або варіант, обраний для здачі) і його закладка на 120 м"}, {"en": "Day 89: BP_TownGenerator with Regenerate and Clear", "uk": "День 89: BP_TownGenerator з Regenerate і Clear"}, {"en": "Day 85: PCG_StreetDresser on its PCG Volume, with Tree Gap", "uk": "День 85: PCG_StreetDresser на своєму PCG Volume, з Tree Gap"}, {"en": "Day 70: stat unit, stat RHI and perf_day70.md", "uk": "День 70: stat unit, stat RHI і perf_day70.md"}, {"en": "Days 41 and 56: budget.md, csvprofile start and stop, and the spreadsheet method", "uk": "Дні 41 і 56: budget.md, csvprofile start і stop та метод з електронною таблицею"}], "quiz": [{"q": {"en": "stat unit shows Game 4 ms, Draw 5 ms and GPU 22 ms. What limits your frame?", "uk": "stat unit показує Game 4 мс, Draw 5 мс і GPU 22 мс. Що обмежує твій кадр?"}, "options": [{"en": "The game logic", "uk": "Ігрова логіка"}, {"en": "The graphics card", "uk": "Відеокарта"}, {"en": "The processor preparing draw calls", "uk": "Процесор, що готує draw calls"}, {"en": "Nothing: 22 ms is inside the budget", "uk": "Нічого: 22 мс у межах бюджету"}], "answer": 1, "explain": {"en": "A frame waits for its slowest part; here the graphics card takes 22 ms, so look at GPU costs such as shadows, overdraw or Lumen.", "uk": "Кадр чекає на найповільнішу частину. Тут відеокарті треба 22 мс, тож дивись на витрати GPU: тіні, overdraw чи Lumen."}}, {"q": {"en": "What does the 95th percentile frame time tell you that the average does not?", "uk": "Що показує 95-й перцентиль часу кадру, чого не показує середнє?"}, "options": [{"en": "The fastest frame of the flight", "uk": "Найшвидший кадр прольоту"}, {"en": "How many draw calls there were", "uk": "Скільки було draw calls"}, {"en": "How slow the slow frames are: only 5 frames in 100 take longer", "uk": "Наскільки повільні повільні кадри: довше тривають лише 5 кадрів зі 100"}, {"en": "The average GPU time", "uk": "Середній час GPU"}], "answer": 2, "explain": {"en": "A smooth average can hide hitches; the 95th percentile shows how bad the slowest frames get.", "uk": "Рівне середнє може ховати затримки кадрів. 95-й перцентиль показує, наскільки поганими стають найповільніші кадри."}}, {"q": {"en": "You hide the buildings and read stat unit one second later: the GPU time has hardly moved. What do you do before trusting it?", "uk": "Ти ховаєш будинки й читаєш stat unit через секунду: час GPU майже не змінився. Що зробити, перш ніж довіряти цьому числу?"}, "options": [{"en": "Wait about 5 seconds from the same bookmark and read again", "uk": "Зачекати близько 5 секунд з тієї самої закладки й прочитати знову"}, {"en": "Hide the roads too", "uk": "Сховати ще й дороги"}, {"en": "Switch the viewport to Unlit", "uk": "Перемкнути в'юпорт на Unlit"}, {"en": "Turn Nanite off", "uk": "Вимкнути Nanite"}], "answer": 0, "explain": {"en": "Numbers need a moment to settle after a change; a fair test keeps the view the same and reads after it settles.", "uk": "Після зміни числам треба трохи часу, щоб усталитися. Чесний тест тримає той самий вид і читає числа після цього."}}, {"q": {"en": "How do you find the slowest frame of a recording in Unreal Insights?", "uk": "Як знайти найповільніший кадр запису в Unreal Insights?"}, "options": [{"en": "Sort the Content Browser by size", "uk": "Відсортувати Content Browser за розміром"}, {"en": "Type stat gpu in the console", "uk": "Ввести stat gpu в консолі"}, {"en": "Wait for the 'trace started' pop-up", "uk": "Дочекатися вікна «trace started»"}, {"en": "Click the tallest bar in the Frames panel", "uk": "Клацнути найвищу смужку на панелі Frames"}], "answer": 3, "explain": {"en": "Each bar is one frame and its height is its time; clicking it shows that frame's timers.", "uk": "Кожна смужка — один кадр, а її висота — його час. Клацни смужку, і побачиш таймери цього кадру."}}, {"q": {"en": "Quad Overdraw shows your street trees bright white from the waterfront view. What is the likely cost?", "uk": "Quad Overdraw показує вуличні дерева яскраво-білими з виду набережної. Яка вартість найімовірніша?"}, "options": [{"en": "Many leaf cards drawn on top of each other, so the same pixels are shaded many times", "uk": "Багато площин листя накладаються одна на одну, тож ті самі пікселі зафарбовуються багато разів"}, {"en": "Too many draw calls from the roads", "uk": "Забагато draw calls від доріг"}, {"en": "The trees have no collision", "uk": "У дерев немає колізії"}, {"en": "Lumen is switched off", "uk": "Lumen вимкнено"}], "answer": 0, "explain": {"en": "Overlapping leaves make the graphics card shade the same pixel again and again; fewer or simpler trees, or a cull distance, reduce it.", "uk": "Через листя, що перекривається, відеокарта знову й знову зафарбовує той самий піксель. Менше або простіші дерева чи відстань відсікання зменшують це."}}], "weekInfo": null, "morning": {"sofar": {"en": "You have BP_TownGenerator, which builds a whole grounded, dressed town quarter from a layout, rules and a seed, and Check Town, which proves it is flyable.", "uk": "У тебе є BP_TownGenerator: він будує цілий міський мікрорайон з посадкою на ґрунт і дрібницями за розкладкою, правилами й зерном. А Check Town доводить, що крізь мікрорайон можна пролетіти."}, "today": {"en": "You measure what that quarter costs your PC, four ways, so every later change can be proved by numbers.", "uk": "Ти вимірюєш, скільки цей мікрорайон коштує твоєму ПК, чотирма способами, щоб кожну пізнішу зміну доводили числа."}, "cheer": {"en": "Measuring feels slow after three weeks of building, but this baseline is what turns your next fix from a guess into proof.", "uk": "Після трьох тижнів будування вимірювання здається повільним. Але саме ця базова лінія перетворює наступне виправлення з вгадування на доказ."}, "quote": {"text": {"en": "We should forget about small efficiencies, say about 97% of the time: premature optimization is the root of all evil.", "uk": "Про дрібну ефективність слід забути десь у 97% випадків: передчасна оптимізація — корінь усього зла."}, "author": {"en": "Donald Knuth", "uk": "Дональд Кнут"}, "source": "Structured Programming with go to Statements, ACM Computing Surveys, December 1974"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-91-profiling-generated-worlds", "mapHref": "../../COURSE.html", "prevHref": "../Day-90-boss-three-town-quarters/START-HERE.html", "nextHref": "../Day-92-perf-report-python/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8, Unreal Insights and a free spreadsheet. I am a beginner on Day 91. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me: when my Blueprint or script fails, ask for the error message or a screenshot of the graph, point to the line or node that is wrong and explain why, then let me fix it myself. Never write the whole tool for me.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: Таблиця вартості методом віднімання і три підозрювані за рангом — самостійно.\nIt's part of: perf_baseline.md: вартість одного згенерованого міського мікрорайону на твоєму ПК, виміряна чотирма способами: показники stat, CSV-захоплення, запис Insights і таблиця вартості методом віднімання. Усе — у тренувальній копії мікрорайону Дня 90 (Content/Tools/Day91/L_Day91 — копія L_Day90_SeedA (або варіанта, обраного в День 90). Нотатки, захоплення й зображення — у сьогоднішній папці Work.).\nWhy it matters: З генератором легко побудувати більше, ніж ПК може намалювати: один Regenerate додає тисячі інстансів, тіней і draw calls. Перш ніж щось оптимізувати, потрібна базова лінія, щоразу виміряна однаково. Тоді пізнішу зміну доводять числа, а не відчуття. Студії питають технічних художників саме про це: скільки коштує генератор і куди йде час? It comes back: csv_day91.csv — тестові дані для завтрашнього perf_report.py (День 92). perf_baseline.md з трьома підозрюваними — це стовпець «до» у твоєму звіті в п'ятницю (День 95).\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-91-profiling-generated-worlds (on the drive I chose on Day 0).\nWhat I already know: День 90: L_Day90_SeedA (або варіант, обраний для здачі) і його закладка на 120 м; День 89: BP_TownGenerator з Regenerate і Clear; День 85: PCG_StreetDresser на своєму PCG Volume, з Tree Gap; День 70: stat unit, stat RHI і perf_day70.md; Дні 41 і 56: budget.md, csvprofile start і stop та метод з електронною таблицею; today's lessons: Бюджет кадру для згенерованого світу (коротке повторення); Unreal Insights: запис кожного кадру; Скільки коштують згенеровані світи; Вартість методом віднімання. Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- L_Day91 збережено як копію обраного рівня Дня 90 і перегенеровано з його зерном. GameMode Override стоїть на GameModeBase, а Player Start — на 30 м над мікрорайоном, тож у Play ти летиш (як у День 33).\n- Блок налаштувань угорі perf_baseline.md: Engine Scalability High, Play in a New Editor Window у 1920 × 1080, твій ПК (процесор, відеокарта і її пам'ять, оперативна пам'ять — з Task Manager > Performance) і бюджет. Бюджет: середній час кадру менше за 16,6 мс (60 кадрів/с) і 95-й перцентиль менше за 33,3 мс уздовж маршруту прольоту.\n- Три закладки камери: V1 на 120 м над мікрорайоном (Ctrl+1), V2 на 15 м уздовж набережної (Ctrl+2), V3 на 2 м на вулиці з крамницями (Ctrl+3). У кожному виді: stat unit (Frame, Game, Draw, GPU), draw calls зі stat RHI і п'ять найбільших рядків stat gpu.\n- Одне CSV-захоплення 60-секундного прольоту в Play (csvprofile start, csvprofile stop). Його відкрито в електронній таблиці, є середнє і 95-й перцентиль FrameTime та GPUTime, як у День 41.\n- Один запис Unreal Insights: 20–30 секунд прольоту. На панелі Frames знайдено найповільніший кадр, його три найбільші таймери записано, є insights_frame.png.\n- Таблиця вартості методом віднімання з V1, по одній зміні за раз: усе; дрібниці прибрано (Cleanup); будинки сховано; Tree Gap 1. У кожному рядку — GPU у мс і draw calls. Наприкінці все повернуто.\n- Дві картинки режимів перегляду з V2 (Quad Overdraw або Shader Complexity, і Nanite Overview). Три підозрювані для Дня 95 за рангом, кожен із налаштуванням інструмента, яке ним керує.\n\nMy checklist (the same numbers show on my course page):\n1. Перевір, чи є результати сьогоднішніх уроків: показники stat, csv_day91.csv і запис Insights, усе з L_Day91. Чогось бракує? Пройди зараз кроки «Разом із тьютором» того уроку (близько 25 хвилин): самостійна частина спирається на них. Відкрий L_Day91 і звір із вимогами: мікрорайон перегенеровано з твоїм зерном, GameModeBase, Player Start на 30 м угорі, три закладки. Перевірка: у Play ти летиш над мікрорайоном, а клавіші 1, 2 і 3 в редакторі перемикають V1, V2 і V3. (from lesson 1)\n2. Напиши блок налаштувань perf_baseline.md у сьогоднішній папці Work: Engine Scalability High, New Editor Window у 1920 × 1080, твій ПК і бюджет. Якщо твій ПК слабший за мінімум курсу (16 ГБ оперативної пам'яті, відеокарта з 6 ГБ), так і напиши. Ти все одно міряєш у 1920 × 1080 і оцінюєш кожну зміну «до і після» на цьому самому ПК. Перевірка: у блоці шість заповнених рядків. (from lesson 1)\n3. Показники stat: у V1, V2 і V3 запиши Frame, Game, Draw і GPU зі stat unit, draw calls зі stat RHI і п'ять найбільших рядків stat gpu. Перевірка: таблиця з трьох рядків, три короткі списки й одне речення про те, що обмежує твій кадр. (from lesson 1)\n4. CSV-захоплення: запусти Play in a New Editor Window і введи csvprofile start. Лети 60 секунд з рівною швидкістю: набережна, вулиця з крамницями, площа, над дахами. Потім введи csvprofile stop. Перевірка: новий .csv у IslandCourse/Saved/Profiling/CSV скопійовано в сьогоднішню папку Work як csv_day91.csv. (from day 41, lesson 4)\n5. Відкрий csv_day91.csv у LibreOffice Calc (Language English (USA)). Порахуй =AVERAGE і =PERCENTILE(...,0.95) для FrameTime і GPUTime, не захоплюючи текстові рядки внизу. Перевірка: у perf_baseline.md чотири числа в мілісекундах і один рядок: бюджет пройдено чи ні. (from day 41, lesson 4)\n6. Insights: запиши 20–30 секунд прольоту і відкрий запис в Unreal Insights. Клацни найвищу смужку на панелі Frames і відсортуй Timers за Inclusive. Перевірка: на insights_frame.png виділено повільний кадр, а три його найбільші таймери записано, до кожного — простий рядок про те, що він робить. (from lesson 2)\n7. Режими перегляду з V2: overdraw.png (Quad Overdraw, або Shader Complexity, якщо той сірий) і nanite.png (Nanite Visualization > Overview). Перевірка: на першій картинці ти можеш показати найгарячішу ділянку, а з другої виписано всі меші без Nanite. (from lesson 3)\n8. Напиши по рядку на кожну велику вартість: інстанси й draw calls, overdraw, тіні, меші без Nanite, Lumen. У рядку — де це видно у твоєму мікрорайоні і яке налаштування цим керує. Перевірка: п'ять рядків, у кожному справжній об'єкт із мікрорайону і регулятор у твоїх інструментах. (from lesson 3)\n9. Самостійно: таблиця вартості. З V1 роби по одній зміні й читай числа через 5 секунд після кожної: усе; Cleanup на розставлянні дрібниць (dresser); будинки сховано значком ока в Outliner; Tree Gap 1 на dresser і Generate. Перевірка: чотири рядки GPU у мс і draw calls. Коли все повернуто, числа першого рядка повертаються з точністю до 0,5 мс. (from lesson 4)\n10. Самостійно: порахуй економію кожного рядка (рядок 1 мінус цей рядок). Потім розстав за рангом три підозрювані для Дня 95, кожен із налаштуванням інструмента, яке ним керує (наприклад, Tree Gap, Cast Shadow на пропсах, Nanite на наборі). Перевірка: три рядки за рангом, у кожному число в мс і регулятор. (from lesson 4)\n11. Клацни «Копіювати звіт дня», встав у новий чат із тьютором, дай відповіді на його питання і збережи його відповідь як summary.md у сьогоднішній папці Work. Перетягни summary.md, perf_baseline.md, csv_day91.csv і три картинки в папку здачі (кнопка на цій сторінці). Ніколи не перетягуй папку проєкту чи рівня. Перевірка: у папці здачі 6 файлів, кожен більший за 1 КБ. (from lesson 2)\n\nHow to help: ask which step number I'm on, then give me only the next st   return '<section class="card glass fbcard">'+lab(u('fbTitle'),'ok')+'<div class="row" style="align-items:baseline;gap:12px"><span class="eyebrow">'+u('fbScore')+'</span><span class="big">'+esc(f.score)+'/'+esc(f.max||10)+'</span></div>'+(fbNote(f)?'<p class="note">'+esc(fbNote(f))+'</p>':'')+'<p class="muted">'+u('fbFull')+(D.handinUrl?': <a href="'+esc(D.handinUrl)+'" target="_blank" rel="noopener">'+u('hOpen')+'</a>':': <code>'+esc(D.workPath)+'</code>')+'</p></section>'}
 return '<section class="card glass fbcard">'+lab(u('fbTitle'),f.s==='missing'?'':'ok')+'<p class="note">'+u(f.s==='missing'?'fbMiss':'fbWait')+'</p>'+(f.s==='missing'?hf():'')+'</section>'}
/* fix phase 1 (2026-10-22): the hand-in folder (a button when the roster has a link, else the folder path), the hand-in card,
   Day 0's "Before lesson 1", the checks before handing in, the Questions card, and the day report with the pasted lesson summaries */
const HIN=(D.handin||[]).map(v=>(v&&v.en)||(typeof v==='string'?v:'')).join(' ').toLowerCase(),hasClip=/\.mp4|clip/.test(HIN);
function hItem(v){return x(v)}
function hList(){return '<ul class="ticks">'+(D.handin||[]).map(v=>'<li>'+lk(hItem(v))+'</li>').join('')+'</ul>'}
const NFILES=new Set((HIN.match(/[\w-]+\.(?:blend|glb|fbx|png|jpe?g|md|txt|mp4|csv|zip|pdf|webp|kra|psd|tga|exr|json|py|uasset|umap)\b/g)||[])).size;
function nFiles(n){if(!n)return '';if(lang==='en')return ' · '+n+(n===1?' file':' files');const a=n%10,b=n%100;return ' · '+n+' '+(a===1&&b!==11?'файл':a>=2&&a<=4&&(b<12||b>14)?'файли':'файлів')}
function hf(){return D.handinUrl?'<div class="row"><a class="btn s" href="'+esc(D.handinUrl)+'" target="_blank" rel="noopener">'+ic('folder')+u('hOpen')+'</a></div>':'<p class="path">'+ic('folder')+'<span>'+u('hPath')+' <code>'+esc(D.workPath)+'</code></span></p>'}
function handinCard(){if(!D.handin||!D.handin.length)return '';return '<section class="card glass handin">'+lab(u('hTitle')+nFiles(NFILES),'ok')+hList()+hf()+'<p class="muted" style="margin:12px 0 0">'+u('hNote')+'</p></section>'}
function beforeCard(){if(!D.before||!D.before.length)return '';return '<section class="card glass before">'+lab(u('before'),'gold')+list(D.before,'ol','steps')+'</section>'}
function chkList(){const a=[];if(HIN.indexOf('.blend')>=0)a.push('chk1');if(/\.(glb|fbx)\b/.test(HIN))a.push('chk2');a.push('chk3');if(hasClip)a.push('chk4');return '<h3>'+u('chk')+'</h3><ol class="steps">'+a.map(k=>'<li>'+u(k)+'</li>').join('')+'</ol>'}
function qCard(){return '<section class="card glass qcard">'+lab(u('qTitle'))+'<ul class="ticks"><li>'+u('q1')+'</li><li>'+u('q2')+'</li><li>'+u('q3')+'</li><li>'+u('q4')+'</li><li>'+u('q5')+'</li></ul></section>'}
function reportText(){let t=D.reportPrompt;const r=D.lessons.map((l,i)=>{const v=(st['r'+i]||'').trim();return v?'Lesson '+(i+1)+': '+v:''}).filter(Boolean);
 if(r.length)t+='\n\nMy lesson summaries, pasted from my course page:\n'+r.join('\n');
 if(st.qs1)t+='\nMy first score in the Check yourself quiz: '+st.qs1[0]+' of '+st.qs1[1]+'.';
 return t}
function qDone(){return D.quiz&&D.quiz.length&&st.qa&&D.quiz.every((q,i)=>st.qa[i]!=null)}
function prog(){const Q=(D.quiz&&D.quiz.length)?1:0,L=D.lessons.length,C=D.build.steps.length;let n=0;D.lessons.forEach((l,i)=>{if(st['q'+i])n++});D.build.steps.forEach((s,i)=>{if(st['c'+i])n++});if(Q&&qDone())n++;return (L+C+Q)?n/(L+C+Q):0}
function qScore(){let n=0;D.quiz.forEach((q,i)=>{if((st.qa||{})[i]===q.answer)n++});return n}
function pick(i,k){st.qa=st.qa||{};if(st.qa[i]!=null)return;st.qa[i]=k;if(qDone()){st.qs=[qScore(),D.quiz.length];if(!st.qs1)st.qs1=st.qs.slice()}save();render();const e=document.getElementById('e'+i);if(e)e.focus({preventScroll:true})}
function retry(){st.qa={};delete st.qs;save();render();const e=document.getElementById('o0_0');if(e)e.focus()}
const isBoss=!!(D.build&&D.build.boss&&D.build.boss.length),isFin=D.day===D.total;
document.body.className=isFin?'fin':isBoss?'boss':'';
const lk=s=>esc(s).replace(/https?:\/\/[^\s<']*[^\s<.,;:)']/g,m=>'<a href="'+m+'" target="_blank" rel="noopener">'+m+'</a>');
function list(a,tag,cls){return '<'+tag+(cls?' class="'+cls+'"':'')+'>'+(a||[]).map(i=>'<li>'+lk(x(i))+'</li>').join('')+'</'+tag+'>'}
const lab=(t,k)=>'<div class="lab'+(k?' k-'+k:'')+'"><span class="dotc"></span>'+t+'</div>';
const kn=n=>'<span class="kn">'+ic(n)+'</span>';
const slider=p=>'<div class="slider"><i style="width:calc('+p+'% - 6px)"></i><b style="left:clamp(13px,'+p+'%,calc(100% - 13px))"></b></div>';
function quiz(){if(!D.quiz||!D.quiz.length)return '';const a=st.qa||{};let ok=0;const L=u('letters');
 const pips='<div class="pips well" aria-hidden="true">'+D.quiz.map((q,i)=>'<i class="'+(a[i]==null?'':a[i]===q.answer?'r':'w')+'"></i>').join('')+'</div>';
 const qs=D.quiz.map((q,i)=>{const c=a[i];if(c===q.answer)ok++;return '<div class="qz"><p class="qq"><span class="qn">'+(i+1)+'</span><span>'+lk(x(q.q))+'</span></p>'+q.options.map((o,k)=>{let cls='opt',mk='<span></span>';if(c!=null){if(k===q.answer){cls+=' right';mk=ic('check','mk')}else if(k===c){cls+=' wrong';mk=ic('x','mk')}}return '<button class="'+cls+'" id="o'+i+'_'+k+'"'+(c!=null?' disabled':'')+' onclick="pick('+i+','+k+')"><span class="lt">'+(L[k]||k+1)+'</span><span>'+esc(x(o))+'</span>'+mk+'</button>'}).join('')+(c!=null?'<p class="exp '+(c===q.answer?'r':'w')+'" id="e'+i+'" tabindex="-1"><b>'+(c===q.answer?u('right'):u('wrong'))+'</b>'+lk(x(q.explain))+'</p>':'')+'</div>'}).join('');
 return '<section class="card glass quiz">'+lab(u('quiz'),'gold')+'<p class="muted" style="margin:-6px 0 14px">'+u('quizSub')+'</p>'+pips+qs+(qDone()?'<div class="score well" role="status"><span class="eyebrow">'+u('score')+'</span><span class="lcd" aria-label="'+ok+' / '+D.quiz.length+'">'+seg(ok+'/'+D.quiz.length)+'</span>'+(st.qs1?'<span class="muted">'+u('first')+': '+st.qs1[0]+'/'+st.qs1[1]+'</span>':'')+'<div class="row"><button class="btn ghost" id="retry" onclick="retry()">'+u('retry')+'</button></div></div>':'')+'</section>'}
function vid(v){if(!v)return '';const link=v.url?'<a href="'+esc(v.url)+'" target="_blank" rel="noopener">'+esc(x(v.title)||v.url)+'</a>'+(v.channel?' <span class="muted">· '+esc(v.channel)+(v.length?' · '+esc(v.length):'')+'</span>':''):'';const s=v.search?'<a href="https://www.youtube.com/results?search_query='+encodeURIComponent(v.search)+'" target="_blank" rel="noopener">'+u('noVid')+': '+esc(v.search)+'</a>':'';const alt=v.alt&&v.alt.url?'<br><span class="eyebrow">UA</span> <a href="'+esc(v.alt.url)+'" target="_blank" rel="noopener">'+esc(v.alt.title||v.alt.url)+'</a>'+(v.alt.channel?' <span class="muted">· '+esc(v.alt.channel)+'</span>':''):'';return '<div class="vid well">'+kn('play')+'<div><b>'+u('more')+'?</b><br>'+(link||s)+alt+(link&&s?'<br><span class="muted" style="font-size:14px">'+s+'</span>':'')+'</div></div>'}
function morning(){const m=D.morning;if(!m)return '';const q=m.quote||{};
 let shelf='';if(D.day>0){shelf='<div class="shelf" aria-hidden="true">';let g='';for(let d=0;d<D.day;d++){let p=0;try{p=(JSON.parse(localStorage.getItem('devteam:'+D.learner+':'+d))||{}).pct||0}catch(e){}g+='<i class="'+(p>=1?'d':'')+(d>0&&d%5===0?' bs':'')+'"></i>';if(d%5===0||d===D.day-1){shelf+='<span class="wkg">'+g+'</span>';g=''}}shelf+='</div>'}
 const qt=lang==='uk'&&q.original?q.original:x(q.text);
 return '<section class="card glass morning"><div class="mgrid">'+(m.sofar?'<div>'+lab(u('sofar'),'gold')+shelf+'<p class="mtxt">'+lk(x(m.sofar))+'</p></div>':'')+(m.today?'<div>'+lab(u('todayL'))+'<p class="mtxt">'+lk(x(m.today))+'</p></div>':'')+'</div>'+(m.cheer?'<p class="cheer">'+esc(x(m.cheer))+'</p>':'')+(qt?'<figure class="quote well">'+kn('quote')+'<blockquote>'+esc(qt)+'</blockquote>'+(q.author?'<figcaption>'+esc(x(q.author))+'</figcaption>':'')+'</figure>':'')+'</section>'}
function setLang(l){lang=l;try{localStorage.setItem('devteam:lang',lang)}catch(e){};render()}
function toggleLang(){setLang(lang==='uk'?'en':'uk')}
/* keep open sections and keyboard focus across re-renders */
const openD=new Set();
function tg(e){if(e.open)openD.add(e.id);else openD.delete(e.id)}
const op=id=>openD.has(id)?' open':'';
function render(){const ae=document.activeElement,fid=ae&&(ae.id||(ae.getAttribute('data-th')?'th-'+ae.getAttribute('data-th'):ae.getAttribute('lang')&&ae.closest('.seg')?'lg-'+ae.getAttribute('lang'):''));
 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);
 const b=D.build,P=Math.round(prog()*100);
 document.getElementById('top').innerHTML='<div class="topin glass"><a class="maplink" href="'+esc(D.mapHref)+'">'+kn('map')+u('map')+'</a><div class="crumb"><b>'+esc(x(D.learnerName))+'</b><span>'+u('week')+' '+D.week+'</span><span>'+u('day')+' '+D.day+' '+u('of')+' '+D.total+'</span></div>'+controls(lang,'setLang')+'</div><div class="tline"><i style="width:'+P+'%"></i></div>';
 const state=w=>w<D.week?'b':w===D.week?'n':'p';
 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 let wk='';if(D.weekInfo){const w=D.weekInfo;wk='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}
 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p>'+(b.next?'<div class="back well">'+kn('arrow')+'<div><b>'+u('comes')+'</b><br>'+lk(x(b.next))+'</div></div>':'')+'<div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.assetFiles&&D.assetFiles.length?'<p class="files">'+ic('folder')+'<span>'+u('filesL')+' '+D.assetFiles.map(f=>'<a href="assets/'+encodeURIComponent(f)+'" target="_blank" rel="noopener">'+esc(f)+'</a>').join(', ')+'</span></p>':D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+=handinCard();h+=beforeCard();
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div><label class="rcpt" for="r'+i+'"><span class="eyebrow">'+u('rcpt')+'</span><textarea id="r'+i+'" rows="2" placeholder="'+esc(u('rcptPh'))+'" oninput="st.r'+i+'=this.value;save()">'+esc(st['r'+i]||'')+'</textarea></label>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+hList()+chkList()+(hasClip?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<h3>1 · '+u('copyR')+'</h3><p class="muted">'+u('report')+'</p><div class="row"><button class="btn ghost" onclick="cp(reportText())">'+ic('copy')+u('copyR')+'</button></div><h3>2 · '+u('ship')+'</h3>'+hf()+'<p class="muted" style="margin:12px 0 0">'+u('hNote')+'</p></section>';
 h+=qCard();h+=wk;
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();
</script>

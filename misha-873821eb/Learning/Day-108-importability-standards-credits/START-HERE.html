<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 108</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

ls.uplugin із \"EngineVersion\": \"5.8.0\", VersionName 2.0 і Version 3 та списком Plugins, що називає кожен потрібний плагін (PCG, PythonScriptPlugin, EditorScriptingUtilities і Water лише якщо використовується); Requirements у README збігаються з ним."}, {"en": "Licences: a sources table in standards_check.md for every outside asset (your own work; CC0 from Poly Haven; CC BY or CC BY-SA from Wikimedia Commons; OpenStreetMap data under the ODbL); any asset whose licence does not let you share its files (for example a Fab item under the Fab Standard License, or anything paid) replaced with your own or a CC0 one and deleted from the plugin and the repository, named in CREDITS.md and README with where users can get it themselves; if it was ever committed, the hand-over is the zip, not access to the repository.", "uk": "Ліцензії: таблиця джерел у standards_check.md для кожного стороннього асета (твоя власна робота; CC0 із Poly Haven; CC BY чи CC BY-SA з Wikimedia Commons; дані OpenStreetMap за ODbL); будь-який асет, ліцензія якого не дозволяє ділитися його файлами (наприклад, річ із Fab за Fab Standard License або будь-що платне), замінено своїм власним або CC0 і видалено з плагіна та репозиторію, названо в CREDITS.md і README із зазначенням, де користувачі можуть отримати його самі; якщо його колись комітили, передача — це zip, а не доступ до репозиторію."}, {"en": "CREDITS.md rebuilt from credits-template.md: every outside asset with name, author, source link and licence, and the OpenStreetMap credit naming both the map data and district_roads.csv (derived data under the ODbL).", "uk": "CREDITS.md, перебудований за credits-template.md: кожен сторонній асет з назвою, автором, посиланням на джерело й ліцензією та зазначення OpenStreetMap, що називає і картографічні дані, і district_roads.csv (похідні дані за ODbL)."}, {"en": "L_District_Demo in /TechTools/District: ground, light, generator, PCG volumes, green zones, corridors, LS_DistrictRoute and BP_PerfFlight (Run On Play unticked) set up and the generator cleared, so a user opens it and clicks Regenerate; a clean install from a new clone into TechToolsImport (Games > Blank, Blueprint, Unreal 5.8) with no 'Failed to load' lines, Regenerate, Check Town at 0 problems and a clean check_assets.py report; install_test_day108.md; any gap fixed at its source and retested; CHANGELOG ## [2.0.0]; tagged v2.0 and pushed.", "uk": "L_District_Demo у /TechTools/District: земля, світло, генератор, об'єми PCG, зелені зони, коридори, LS_DistrictRoute і BP_PerfFlight (Run On Play знято), налаштовані, а генератор очищений, тож користувач відкриває його й клацає Regenerate; чисте встановлення зі свіжого клону в TechToolsImport (Games > Blank, Blueprint, Unreal 5.8) без рядків 'Failed to load', Regenerate, Check Town на 0 проблем і чистий звіт check_assets.py; install_test_day108.md; кожну прогалину виправлено в джерелі та перевірено знову; CHANGELOG ## [2.0.0]; позначено тегом v2.0 і запушено."}], "piece1": "The standards check, the licences and credits, and the 2.0 descriptor (built in the lessons)", "piece2": {"en": "The demo level and the clean install from a new clone, on your own", "uk": "Демо-рівень і чисте встановлення зі свіжого клону — самостійно"}, "steps": [{"text": {"en": "Copy every line of standards-sheet.md into standards_check.md as a table: Line, Result, Proof. Check: the table has a row for every line of the sheet.", "uk": "Скопіюй кожен рядок standards-sheet.md у standards_check.md як таблицю: Line, Result, Proof. Перевірка: таблиця має рядок для кожного рядка аркуша."}, "lesson": 1}, {"text": {"en": "Scale: measure a kit door and a road section beside the mannequin in an orthographic view (middle-mouse drag). Check: the door is 200 to 220 cm and the road 12 m, both written with a picture as proof.", "uk": "Масштаб: виміряй двері набору й переріз дороги поруч із манекеном в ортографічному виді (перетягування середньою кнопкою миші). Перевірка: двері мають 200-220 см, а дорога 12 м, обидва записані із зображенням як доказом."}, "lesson": 1}, {"text": {"en": "Names: run rename_by_rules.py with FOLDER = '/TechTools' and DRY_RUN = True. Check: 0 planned changes, or each planned change made, checked and the dry run repeated to 0.", "uk": "Імена: запусти rename_by_rules.py із FOLDER = '/TechTools' і DRY_RUN = True. Перевірка: 0 запланованих змін або кожну заплановану зміну зроблено, перевірено й пробний запуск повторено до 0."}, "lesson": 1}, {"text": {"en": "Set EngineVersion 5.8.0, VersionName 2.0 and Version 3 in TechTools.uplugin, check its Plugins list against what your tools use, and restart. Check: Edit > Plugins shows TechTools 2.0, and README's Requirements match the list.", "uk": "Задай EngineVersion 5.8.0, VersionName 2.0 і Version 3 у TechTools.uplugin, звір його список Plugins із тим, що використовують твої інструменти, і перезапусти. Перевірка: Edit > Plugins показує TechTools 2.0, а Requirements у README збігаються зі списком."}, "lesson": 3}, {"text": {"en": "Licences: fill the sources table for every outside asset (Size Map on the TechTools folder or Reference Viewer on its assets, your notes, CREDITS.md). Check: every outside asset has a source and a licence that lets you share it; anything that doesn't is removed or replaced, and README says where to get it.", "uk": "Ліцензії: заповни таблицю джерел для кожного стороннього асета (Size Map на папці TechTools або Reference Viewer на її асетах, твої нотатки, CREDITS.md). Перевірка: кожен сторонній асет має джерело й ліцензію, що дозволяє ним ділитися; усе, що не дозволяє, видалено чи замінено, а README каже, де його отримати."}, "lesson": 2}, {"text": {"en": "Rebuild CREDITS.md from credits-template.md: name, author, link and licence for each outside asset, and the OpenStreetMap lines for the map data and district_roads.csv. Check: no outside asset is missing.", "uk": "Перебудуй CREDITS.md за credits-template.md: назва, автор, посилання й ліцензія для кожного стороннього асета та рядки OpenStreetMap для картографічних даних і district_roads.csv. Перевірка: жодного стороннього асета не бракує."}, "lesson": 2}, {"text": {"en": "On your own: save L_District as L_District_Demo with everything set up, the generator cleared and BP_PerfFlight's Run On Play unticked, and add a Demo section to README. Add ## [2.0.0] to CHANGELOG.md. Check: opening the demo level and clicking Regenerate builds the district with no other step.", "uk": "Самостійно: збережи L_District як L_District_Demo з усім налаштованим, очищеним генератором і знятим Run On Play у BP_PerfFlight, і додай розділ Demo до README. Додай ## [2.0.0] до CHANGELOG.md. Перевірка: відкриття демо-рівня й клік на Regenerate будує район без жодного іншого кроку."}, "lesson": 3}, {"text": {"en": "On your own: commit and push, then clone into a new empty folder. Check: the clone's Plugins/TechTools holds real files, not LFS pointers.", "uk": "Самостійно: закоміть і запуш, потім клонуй у нову порожню папку. Перевірка: Plugins/TechTools клону містить справжні файли, а не вказівники LFS."}, "lesson": "D100.2"}, {"text": {"en": "On your own: make TechToolsImport (Games > Blank, Blueprint, Unreal 5.8), copy only the plugin into its Plugins folder, open it and type Failed into the Output Log's search. Check: no 'Failed to load' lines.", "uk": "Самостійно: створи TechToolsImport (Games > Blank, Blueprint, Unreal 5.8), скопіюй лише плагін у його папку Plugins, відкрий його й набери Failed у пошуку Output Log. Перевірка: жодних рядків 'Failed to load'."}, "lesson": 4}, {"text": {"en": "On your own: open L_District_Demo, click Regenerate and Check Town, then run Check from EUW_TechTools on /TechTools. Check: the district builds, Check Town reports 0 problems, the report is clean, and install_test_day108.md records each result.", "uk": "Самостійно: відкрий L_District_Demo, клацни Regenerate і Check Town, потім запусти Check із EUW_TechTools на /TechTools. Перевірка: район будується, Check Town повідомляє 0 проблем, звіт чистий, а install_test_day108.md записує кожен результат."}, "lesson": 4}, {"text": {"en": "Fix any gap at its source, push, clone again and retest that one thing. Check: every gap in install_test_day108.md has a commit and a passed retest.", "uk": "Виправ кожну прогалину в джерелі, запуш, клонуй знову й перевір лише цю одну річ. Перевірка: кожна прогалина в install_test_day108.md має коміт і пройдену повторну перевірку."}, "lesson": "D100.4"}, {"text": {"en": "Tag the release: git tag -a v2.0 -m 'TechTools 2.0' and git push --follow-tags (only annotated tags travel with it). Take demo_level.png and import_test.png. Record clip_day108.mp4 (60 seconds): the clone, the new project, the demo level, Regenerate and Check Town. Check: the tag on GitHub, and the pictures and the clip in today's Work folder.", "uk": "Познач реліз тегом: git tag -a v2.0 -m 'TechTools 2.0' і git push --follow-tags (разом із ним їдуть лише анотовані теги). Зроби demo_level.png і import_test.png. Запиши clip_day108.mp4 (60 секунд): клон, новий проєкт, демо-рівень, Regenerate і Check Town. Перевірка: тег на GitHub, а зображення й кліп у папці Work за сьогодні."}, "lesson": "D99.4"}, {"text": {"en": "Click Copy the day report, paste it into a new tutor chat, answer its questions and save its answer as summary.md. Check: summary.md is in today's Work folder with Made, To look at, Hours and To revisit filled in.", "uk": "Клацни Copy the day report (скопіювати звіт дня), встав у новий чат із тьютором, дай відповіді на його запитання й збережи його відповідь як summary.md. Перевірка: summary.md лежить у папці Work за сьогодні, а Made, To look at, Hours і To revisit заповнені."}, "lesson": 1}], "assets": ["techart/standards-sheet.md", "world/credits-template.md", "techart/tool-review-checklist.md"]}, "lessons": [{"title": {"en": "The standards sheet, line by line", "uk": "Аркуш стандартів, рядок за рядком"}, "minutes": 40, "goals": [{"en": "Read standards-sheet.md as a contract: every line needs a proof.", "uk": "Читай standards-sheet.md як контракт: кожен рядок потребує доказу."}, {"en": "Check real scale with a ruler and the mannequin, and names with a dry run.", "uk": "Перевіряй справжній масштаб лінійкою й манекеном, а імена пробним запуском."}, {"en": "Record the results in a table another person can check.", "uk": "Записуй результати в таблицю, яку може перевірити інша людина."}], "doalong": [{"en": "Open standards-sheet.md and copy each line into standards_check.md as a table with the columns Line, Result and Proof. You see the sheet turned into a checklist.", "uk": "Відкрий standards-sheet.md і скопіюй кожен рядок у standards_check.md як таблицю зі стовпцями Line, Result і Proof. Ти бачиш аркуш, перетворений на контрольний список."}, {"en": "Place the Third Person template's mannequin (or a 180 cm tall cube) beside a kit door and a road section. In a Front view, middle-mouse drag from the floor to the top of the door. You see the door's height in cm next to a person-sized figure; write it as the proof for real scale.", "uk": "Постав манекен із шаблону Third Person (або куб заввишки 180 см) поруч із дверима набору та перерізом дороги. У виді Front перетягни середньою кнопкою миші від підлоги до верху дверей. Ти бачиш висоту дверей у см поруч із фігурою зростом із людину; запиши її як доказ справжнього масштабу."}, {"en": "Set rename_by_rules.py's FOLDER to '/TechTools', keep DRY_RUN = True, and run. You see the planned renames, ideally none; each one would be a name that breaks the prefix rules.", "uk": "Постав FOLDER у rename_by_rules.py на '/TechTools', залиш DRY_RUN = True і запусти. Ти бачиш заплановані перейменування, в ідеалі жодного; кожне було б іменем, що порушує правила префіксів."}, {"en": "Read ten asset names from different plugin folders: prefix, CamelCase, no spaces. You see whether the rules hold everywhere; note the result as a proof.", "uk": "Прочитай десять імен асетів з різних папок плагіна: префікс, CamelCase, без пробілів. Ти бачиш, чи правила діють скрізь; запиши результат як доказ."}], "play": {"en": "Pass or fail: the tutor names six findings (a door 180 cm tall; an asset named BP_district generator v2 final; a 4096 px roof texture with a written reason; SM_Bench with its pivot 30 cm below its feet; a tool that needs Water but does not say so; a lamp post 4.5 m tall). For each I say pass or fail against the standards sheet, and the fix.", "uk": "Пройдено чи ні: тьютор називає шість знахідок (двері заввишки 180 см; асет під назвою BP_district generator v2 final; дахова текстура 4096 пікселів із письмовою причиною; SM_Bench з опорною точкою на 30 см нижче його ніг; інструмент, якому потрібен Water, але він цього не каже; ліхтарний стовп заввишки 4.5 м). Для кожної я кажу pass або fail щодо аркуша стандартів і виправлення."}, "video": {"search": "game asset naming conventions real world scale unreal engine"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: The standards sheet, line by line (Day 108, lesson 1 of 4).\nToday's build: standards_check.md (every line of standards-sheet.md with its proof), CREDITS.md complete, L_District_Demo in the plugin, TechTools.uplugin at 2.0, and install_test_day108.md from a fresh clone into a new Unreal 5.8 project.\n\nBy the end of this lesson I can:\n1. Read standards-sheet.md as a contract: every line needs a proof.\n2. Check real scale with a ruler and the mannequin, and names with a dry run.\n3. Record the results in a table another person can check.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (Your District Generator is polished and validated: assets checked, the world checked on three seeds, and a performance report along a real route.), what I will learn today (You make it importable: the standards sheet line by line, licences and credits, a demo level, and a clean install from a fresh clone.), encourage me (Today is careful, quiet work, and it is exactly what makes studios trust a tool maker; take it one line at a time.), and share today's quote: \"An ounce of prevention is worth a pound of cure.\" (Benjamin Franklin).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 105: What makes a proof in a review, rather than an opinion? | Day 101: What does OpenStreetMap's licence ask of you?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Pass or fail: the tutor names six findings (a door 180 cm tall; an asset named BP_district generator v2 final; a 4096 px roof texture with a written reason; SM_Bench with its pivot 30 cm below its feet; a tool that needs Water but does not say so; a lamp post 4.5 m tall). For each I say pass or fail against the standards sheet, and the fix.\n6. Do-along on today's build (The standards check, the licences and credits, and the 2.0 descriptor (built in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Open standards-sheet.md and copy each line into standards_check.md as a table with the columns Line, Result and Proof. You see the sheet turned into a checklist.\n   - Place the Third Person template's mannequin (or a 180 cm tall cube) beside a kit door and a road section. In a Front view, middle-mouse drag from the floor to the top of the door. You see the door's height in cm next to a person-sized figure; write it as the proof for real scale.\n   - Set rename_by_rules.py's FOLDER to '/TechTools', keep DRY_RUN = True, and run. You see the planned renames, ideally none; each one would be a name that breaks the prefix rules.\n   - Read ten asset names from different plugin folders: prefix, CamelCase, no spaces. You see whether the rules hold everywhere; note the result as a proof.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Licences and credits", "uk": "Ліцензії та подяки"}, "minutes": 40, "goals": [{"en": "Read a licence for one question: may I share these files inside my plugin?", "uk": "Читай ліцензію заради одного запитання: чи можна ділитися цими файлами всередині мого плагіна?"}, {"en": "List every outside asset with its source and licence, and remove what you may not share.", "uk": "Перелічи кожен сторонній асет із його джерелом і ліцензією та прибери те, чим ділитися не можна."}, {"en": "Write CREDITS.md from credits-template.md, including the open-data credit.", "uk": "Напиши CREDITS.md за credits-template.md, зокрема зазначення відкритих даних."}], "doalong": [{"en": "Right-click the TechTools folder > Size Map (or select the assets in /TechTools/District and right-click > Reference Viewer) and list every asset you did not make yourself, and any asset whose path starts with /Game/ (it sits outside the plugin: move it in); add those named in CREDITS.md and your notes. You see the plugin's outside assets.", "uk": "Клацни правою кнопкою на папці TechTools > Size Map (або виділи асети в /TechTools/District і правий клік > Reference Viewer) і перелічи кожен асет, якого ти не робив сам, і будь-який асет, чий шлях починається з /Game/ (він лежить поза плагіном: перенеси його всередину); додай названі в CREDITS.md і твоїх нотатках. Ти бачиш сторонні асети плагіна."}, {"en": "For each, find its licence: CC0 (Poly Haven: free for any use, credit given anyway); CC BY or CC BY-SA (Wikimedia Commons: credit the author, and for SA keep the same licence); the ODbL (OpenStreetMap data); the Fab Standard License (its summary lets you use an item in your projects and share it with collaborators on the same project, for example through your private repository, but not give its files away on their own; a plugin other people receive for their own projects must not carry them). You see which assets may travel in your plugin.", "uk": "Для кожного знайди ліцензію: CC0 (Poly Haven: вільно для будь-якого використання, подяку все одно варто зазначити); CC BY чи CC BY-SA (Wikimedia Commons: зазнач автора, а для SA залиш ту саму ліцензію); ODbL (дані OpenStreetMap); Fab Standard License (її короткий виклад дозволяє використовувати річ у твоїх проєктах і ділитися нею зі співавторами того самого проєкту, наприклад через твій приватний репозиторій, але не роздавати її файли окремо; плагін, який інші люди отримують для власних проєктів, не повинен їх містити). Ти бачиш, які асети можуть подорожувати у твоєму плагіні."}, {"en": "Replace any asset you may not share with your own model or a CC0 one, so nothing breaks, then delete the original from the plugin and the repository (git rm); name it in CREDITS.md and README with its Fab link as an optional upgrade. Git keeps old commits, so if such a file was ever committed, hand over the zip (Day 110), never access to this repository. You see a plugin with nothing that could block its use.", "uk": "Заміни будь-який асет, яким ділитися не можна, власною моделлю або CC0, щоб нічого не зламалося, потім видали оригінал із плагіна та репозиторію (git rm); назви його в CREDITS.md і README із посиланням на Fab як необов'язкове покращення. Git зберігає старі коміти, тож якщо такий файл колись комітили, передай zip (День 110), а ніколи не доступ до цього репозиторію. Ти бачиш плагін, у якому немає нічого, що могло б заблокувати його використання."}, {"en": "Open credits-template.md and rebuild CREDITS.md: name, author, source link and licence for each outside asset, then 'Map data and district_roads.csv: © OpenStreetMap contributors, Open Database License (ODbL), openstreetmap.org/copyright'. You see everyone whose work is inside your tool named.", "uk": "Відкрий credits-template.md і перебудуй CREDITS.md: назва, автор, посилання на джерело й ліцензія для кожного стороннього асета, потім 'Map data and district_roads.csv: © OpenStreetMap contributors, Open Database License (ODbL), openstreetmap.org/copyright'. Ти бачиш усіх, чия робота всередині твого інструмента, названими."}], "play": {"en": "Can it ship? The tutor names six assets (a Poly Haven CC0 texture; a Wikimedia Commons photo under CC BY 4.0 used only as a reference; a free Fab tree under the Fab Standard License inside the plugin; your own Blender rocks; a texture from a website with no licence; OpenStreetMap streets in a CSV). For each I say ship, ship with credit, or remove, and why.", "uk": "Чи можна випускати? Тьютор називає шість асетів (текстура CC0 із Poly Haven; фото з Wikimedia Commons за CC BY 4.0, використане лише як референс; безкоштовне дерево з Fab за Fab Standard License усередині плагіна; твої власні скелі з Blender; текстура із сайту без ліцензії; вулиці OpenStreetMap у CSV). Для кожного я кажу: випускати, випускати із зазначенням авторства чи видалити, і чому."}, "video": {"search": "creative commons licenses explained cc0 cc by attribution"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Licences and credits (Day 108, lesson 2 of 4).\nToday's build: standards_check.md (every line of standards-sheet.md with its proof), CREDITS.md complete, L_District_Demo in the plugin, TechTools.uplugin at 2.0, and install_test_day108.md from a fresh clone into a new Unreal 5.8 project.\nEarlier today I already did: lesson 1 (The standards sheet, line by line). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Read a licence for one question: may I share these files inside my plugin?\n2. List every outside asset with its source and licence, and remove what you may not share.\n3. Write CREDITS.md from credits-template.md, including the open-data credit.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Can it ship? The tutor names six assets (a Poly Haven CC0 texture; a Wikimedia Commons photo under CC BY 4.0 used only as a reference; a free Fab tree under the Fab Standard License inside the plugin; your own Blender rocks; a texture from a website with no licence; OpenStreetMap streets in a CSV). For each I say ship, ship with credit, or remove, and why.\n4. Do-along on today's build (The standards check, the licences and credits, and the 2.0 descriptor (built in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Right-click the TechTools folder > Size Map (or select the assets in /TechTools/District and right-click > Reference Viewer) and list every asset you did not make yourself, and any asset whose path starts with /Game/ (it sits outside the plugin: move it in); add those named in CREDITS.md and your notes. You see the plugin's outside assets.\n   - For each, find its licence: CC0 (Poly Haven: free for any use, credit given anyway); CC BY or CC BY-SA (Wikimedia Commons: credit the author, and for SA keep the same licence); the ODbL (OpenStreetMap data); the Fab Standard License (its summary lets you use an item in your projects and share it with collaborators on the same project, for example through your private repository, but not give its files away on their own; a plugin other people receive for their own projects must not carry them). You see which assets may travel in your plugin.\n   - Replace any asset you may not share with your own model or a CC0 one, so nothing breaks, then delete the original from the plugin and the repository (git rm); name it in CREDITS.md and README with its Fab link as an optional upgrade. Git keeps old commits, so if such a file was ever committed, hand over the zip (Day 110), never access to this repository. You see a plugin with nothing that could block its use.\n   - Open credits-template.md and rebuild CREDITS.md: name, author, source link and licence for each outside asset, then 'Map data and district_roads.csv: © OpenStreetMap contributors, Open Database License (ODbL), openstreetmap.org/copyright'. You see everyone whose work is inside your tool named.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "A self-contained plugin: engine, dependencies and a demo level", "uk": "Самодостатній плагін: рушій, залежності та демо-рівень"}, "minutes": 40, "goals": [{"en": "Set the plugin's engine version and dependencies, so Unreal can tell a user what it needs.", "uk": "Задай версію рушія й залежності плагіна, щоб Unreal міг сказати користувачеві, що йому потрібно."}, {"en": "Make a demo level that works with one click.", "uk": "Зроби демо-рівень, що працює в один клік."}, {"en": "Describe version 2.0 in the changelog and the README.", "uk": "Опиши версію 2.0 у changelog і README."}], "doalong": [{"en": "Open TechTools.uplugin and add \"EngineVersion\": \"5.8.0\"; set \"VersionName\": \"2.0\" and \"Version\": 3. Check the Plugins list against your tools: PCG for the graphs, PythonScriptPlugin and EditorScriptingUtilities for the scripts, and Water only if a level uses it. Restart. You see TechTools 2.0 in Edit > Plugins.", "uk": "Відкрий TechTools.uplugin і додай \"EngineVersion\": \"5.8.0\"; постав \"VersionName\": \"2.0\" і \"Version\": 3. Звір список Plugins із твоїми інструментами: PCG для графів, PythonScriptPlugin і EditorScriptingUtilities для скриптів, а Water лише якщо його використовує рівень. Перезапусти. Ти бачиш TechTools 2.0 в Edit > Plugins."}, {"en": "Save L_District as L_District_Demo in /TechTools/District. Click Clear on the generator so the level holds only the set-up (ground, light, generator, PCG volumes, green zones, corridors, LS_DistrictRoute and BP_PerfFlight), untick BP_PerfFlight's Run On Play so Play lets a user fly by hand, and save. You see a small level a user opens and fills with one click.", "uk": "Збережи L_District як L_District_Demo у /TechTools/District. Клацни Clear на генераторі, щоб рівень містив лише налаштування (земля, світло, генератор, об'єми PCG, зелені зони, коридори, LS_DistrictRoute і BP_PerfFlight), зніми Run On Play у BP_PerfFlight, щоб Play дозволяв користувачеві літати вручну, і збережи. Ти бачиш невеликий рівень, який користувач відкриває й наповнює одним кліком."}, {"en": "Add a Demo section to README: 'Open /TechTools/District/L_District_Demo, select BP_DistrictGenerator and click Regenerate.', followed by a settings table for BP_DistrictGenerator. You see the manual cover the capstone.", "uk": "Додай розділ Demo до README: 'Open /TechTools/District/L_District_Demo, select BP_DistrictGenerator and click Regenerate.', а далі таблицю налаштувань BP_DistrictGenerator. Ти бачиш, що посібник охоплює випускний проєкт."}, {"en": "Add ## [2.0.0] to CHANGELOG.md (Added: the District Generator, osm_to_layout.py, the demo level, validation; Changed: the standards and credits "}, "video": {"search": "unreal engine install plugin new project test"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: The clean install test (Day 108, lesson 4 of 4).\nToday's build: standards_check.md (every line of standards-sheet.md with its proof), CREDITS.md complete, L_District_Demo in the plugin, TechTools.uplugin at 2.0, and install_test_day108.md from a fresh clone into a new Unreal 5.8 project.\nEarlier today I already did: lesson 1 (The standards sheet, line by line); lesson 2 (Licences and credits); lesson 3 (A self-contained plugin: engine, dependencies and a demo level). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Install from a fresh clone into a new project, as a stranger would.\n2. Run the demo, the world check and the asset check there.\n3. Record the result, and fix any gap at its source.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Ship or wait: the tutor describes four install results (everything works; one 'Failed to load' for a texture; the demo needs a click the README doesn't mention; the district builds but Check Town reports 2 floating houses). For each I say ship or wait, and the fix.\n4. Do-along on today's build (The standards check, the licences and credits, and the 2.0 descriptor (built in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Commit and push. In a new empty folder clone the repository and look at one .uasset's size. You see real files, not LFS pointers.\n   - Create TechToolsImport (Games > Blank, Blueprint, Unreal 5.8), copy only Plugins/TechTools into its Plugins folder and open it. Type Failed into the Output Log's search. You see no load failures.\n   - Open L_District_Demo, click Regenerate, then Check Town; then run EUW_TechTools > Check with FOLDER '/TechTools'. You see the district build in a project that has never seen your island, 0 problems and a clean report.\n   - Write install_test_day108.md: each step, its result and any gap; fix each gap in IslandCourse, push, clone again and retest. You see a plugin that installs cleanly, proved twice.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "stan , "uk": "Дні 59, 101 і 102: подяки та ліцензії, зазначення ODbL і district_roads.csv"}], "quiz": [{"q": {"en": "In a user's project your doors are 180 cm tall, smaller than their characters. Which standards line fails?", "uk": "У проєкті користувача твої двері заввишки 180 см, менші за його персонажів. Який рядок стандартів провалюється?"}, "options": [{"en": "Names", "uk": "Імена"}, {"en": "Real scale: 1 unit = 1 cm, and a door about 210 cm tall", "uk": "Справжній масштаб: 1 одиниця = 1 см, а двері приблизно 210 см заввишки"}, {"en": "Credits", "uk": "Подяки"}, {"en": "Engine version", "uk": "Версія рушія"}], "answer": 1, "explain": {"en": "Wrong scale breaks every placement and every character; the ruler and the mannequin catch it in a minute.", "uk": "Неправильний масштаб ламає кожне розміщення й кожного персонажа; лінійка й манекен ловлять це за хвилину."}}, {"q": {"en": "May a CC0 texture from Poly Haven go into the plugin you share?", "uk": "Чи можна текстуру CC0 із Poly Haven класти в плагін, яким ти ділишся?"}, "options": [{"en": "Yes: CC0 allows any use, and crediting it anyway is good practice", "uk": "Так: CC0 дозволяє будь-яке використання, а зазначити подяку все одно — добра практика"}, {"en": "No, never", "uk": "Ні, ніколи"}, {"en": "Only after a payment", "uk": "Лише після оплати"}, {"en": "Only inside IslandCourse", "uk": "Лише всередині IslandCourse"}], "answer": 0, "explain": {"en": "CC0 places no conditions on use; a credit still tells people where it came from.", "uk": "CC0 не ставить жодних умов використання; подяка все одно каже людям, звідки це."}}, {"q": {"en": "Your plugin holds a free Fab tree whose licence limits sharing its files. What do you do before handing it over?", "uk": "Твій плагін містить безкоштовне дерево з Fab, ліцензія якого обмежує поширення його файлів. Що ти робиш перед передачею?"}, "options": [{"en": "Keep it: free means shareable", "uk": "Залишаю: безкоштовне означає, що ним можна ділитися"}, {"en": "Rename it", "uk": "Перейменовую"}, {"en": "Replace it with your own or a CC0 tree, delete it from the plugin and the repository, and say in README where users can get the original", "uk": "Замінюю власним або CC0 деревом, видаляю з плагіна й репозиторію та кажу в README, де користувачі можуть отримати оригінал"}, {"en": "Hide it in a subfolder", "uk": "Ховаю в підпапці"}], "answer": 2, "explain": {"en": "Free to use is not the same as free to share; the licence decides what may travel in your plugin.", "uk": "Безкоштовне для використання — не те саме, що безкоштовне для поширення; ліцензія вирішує, що може подорожувати в твоєму плагіні."}}, {"q": {"en": "Why does TechTools.uplugin name EngineVersion 5.8.0 and its plugins?", "uk": "Чому TechTools.uplugin називає EngineVersion 5.8.0 і свої плагіни?"}, "options": [{"en": "It makes the plugin smaller", "uk": "Це робить плагін меншим"}, {"en": "GitHub requires it", "uk": "Цього вимагає GitHub"}, {"en": "The seed reads it", "uk": "Зерно його читає"}, {"en": "So Unreal knows which engine it was made for and switches on the plugins it needs", "uk": "Щоб Unreal знав, для якого рушія його зроблено, і вмикав потрібні плагіни"}], "answer": 3, "explain": {"en": "A descriptor that names its needs installs cleanly; one that hides them fails in someone else's project.", "uk": "Дескриптор, що називає свої потреби, встановлюється чисто; той, що їх ховає, ламається в чужому проєкті."}}, {"q": {"en": "What must CREDITS.md say about district_roads.csv?", "uk": "Що CREDITS.md має казати про district_roads.csv?"}, "options": [{"en": "Nothing, because you wrote the script", "uk": "Нічого, бо скрипт написав ти"}, {"en": "That it is derived from OpenStreetMap data, © OpenStreetMap contributors, under the ODbL", "uk": "Що він похідний від даних OpenStreetMap, © OpenStreetMap contributors, за ODbL"}, {"en": "Only the town's name", "uk": "Лише назву міста"}, {"en": "The date it was made", "uk": "Дату створення"}], "answer": 1, "explain": {"en": "Derived map data keeps the OpenStreetMap credit and its open licence wherever it goes.", "uk": "Похідні картографічні дані зберігають зазначення OpenStreetMap і його відкриту ліцензію, куди б вони не потрапили."}}], "weekInfo": null, "morning": {"sofar": {"en": "Your District Generator is polished and validated: assets checked, the world checked on three seeds, and a performance report along a real route.", "uk": "Твій Генератор району доведений і перевірений: асети перевірено, світ перевірено на трьох зернах і є звіт про продуктивність уздовж справжнього маршруту."}, "today": {"en": "You make it importable: the standards sheet line by line, licences and credits, a demo level, and a clean install from a fresh clone.", "uk": "Ти робиш його придатним до імпорту: аркуш стандартів рядок за рядком, ліцензії та подяки, демо-рівень і чисте встановлення зі свіжого клону."}, "cheer": {"en": "Today is careful, quiet work, and it is exactly what makes studios trust a tool maker; take it one line at a time.", "uk": "Сьогодні ретельна, тиха робота, і саме вона змушує студії довіряти творцю інструментів; роби її по одному рядку."}, "quote": {"text": {"en": "An ounce of prevention is worth a pound of cure.", "uk": "Грам профілактики вартий кілограма лікування."}, "author": {"en": "Benjamin Franklin", "uk": "Бенджамін Франклін"}, "source": "Letter signed 'Old Citizen', The Pennsylvania Gazette, 4 February 1735"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-108-importability-standards-credits", "mapHref": "../../COURSE.html", "prevHref": "../Day-107-district-validation/START-HERE.html", "nextHref": "../Day-109-district-demo-video-manual/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8, Git and a text editor. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me: when my Blueprint or script fails, ask for the error message or a screenshot of the graph, point to the line or node that is wrong and explain why, then let me fix it myself. Never write the whole tool for me. Keep me moving and make it feel like a game.\n\nToday I build on my own: The demo level and the clean install from a new clone, on your own.\nIt's part of: standards_check.md (every line of standards-sheet.md with its proof), CREDITS.md complete, L_District_Demo in the plugin, TechTools.uplugin at 2.0, and install_test_day108.md from a fresh clone into a new Unreal 5.8 project (IslandCourse/Plugins/TechTools (CREDITS.md, README.md, CHANGELOG.md, Docs, and /TechTools/District/L_District_Demo); the clean install in a new project, TechToolsImport, from a new clone.).\n\nSpec:\n- standards_check.md: every line of standards-sheet.md as a row with its result (pass, fixed or explained) and its proof (a report line, a picture or a measurement); the performance line proved by perf_district_after.md from Day 107 (average under 16.6 ms and 95th percentile under 33.3 ms at 1920 x 1080, along the route).\n- Real scale: a kit door 200 to 220 cm tall and a road section 12 m wide, measured beside the Third Person mannequin (about 180 cm); 1 unit = 1 cm; pivots at the base.\n- Names: rename_by_rules.py with FOLDER = '/TechTools' and DRY_RUN = True plans 0 changes (or each planned change is made, checked and the dry run repeated to 0); no spaces or special characters; CamelCase after the prefix.\n- Engine and plugins: TechTools.uplugin with \"EngineVersion\": \"5.8.0\", VersionName 2.0 and Version 3, and a Plugins list naming every plugin it needs (PCG, PythonScriptPlugin, EditorScriptingUtilities, and Water only if used); README's Requirements match it.\n- Licences: a sources table in standards_check.md for every outside asset (your own work; CC0 from Poly Haven; CC BY or CC BY-SA from Wikimedia Commons; OpenStreetMap data under the ODbL); any asset whose licence does not let you share its files (for example a Fab item under the Fab Standard License, or anything paid) replaced with your own or a CC0 one and deleted from the plugin and the repository, named in CREDITS.md and README with where users can get it themselves; if it was ever committed, the hand-over is the zip, not access to the repository.\n- CREDITS.md rebuilt from credits-template.md: every outside asset with name, author, source link and licence, and the OpenStreetMap credit naming both the map data and district_roads.csv (derived data under the ODbL).\n- L_District_Demo in /TechTools/District: ground, light, generator, PCG volumes, green zones, corridors, LS_DistrictRoute and BP_PerfFlight (Run On Play unticked) set up and the generator cleared, so a user opens it and clicks Regenerate; a clean install from a new clone into TechToolsImport (Games > Blank, Blueprint, Unreal 5.8) with no 'Failed to load' lines, Regenerate, Check Town at 0 problems and a clean check_assets.py report; install_test_day108.md; any gap fixed at its source and retested; CHANGELOG ## [2.0.0]; tagged v2.0 and pushed.\n\nMy checklist:\n1. Copy every line of standards-sheet.md into standards_check.md as a table: Line, Result, Proof. Check: the table has a row for every line of the sheet. (from lesson 1)\n2. Scale: measure a kit door and a road section beside the mannequin in an orthographic view (middle-mouse drag). Check: the door is 200 to 220 cm and the road 12 m, both written with a picture as proof. (from lesson 1)\n3. Names: run rename_by_rules.py with FOLDER = '/TechTools' and DRY_RUN = True. Check: 0 planned changes, or each planned change made, checked and the dry run repeated to 0. (from lesson 1)\n4. Set EngineVersion 5.8.0, VersionName 2.0 and Version 3 in TechTools.uplugin, check its Plugins list against what your tools use, and restart. Check: Edit > Plugins shows TechTools 2.0, and README's Requirements match the list. (from lesson 3)\n5. Licences: fill the sources table for every outside asset (Size Map on the TechTools folder or Reference Viewer on its assets, your notes, CREDITS.md). Check: every outside asset has a source and a licence that lets you share it; anything that doesn't is removed or replaced, and README says where to get it. (from lesson 2)\n6. Rebuild CREDITS.md from credits-template.md: name, author, link and licence for each outside asset, and the OpenStreetMap lines for the map data and district_roads.csv. Check: no outside asset is missing. (from lesson 2)\n7. On your own: save L_District as L_District_Demo with everything set up, the generator cleared and BP_PerfFlight's Run On Play unticked, and add a Demo section to README. Add ## [2.0.0] to CHANGELOG.md. Check: opening the demo level and clicking Regenerate builds the district with no other step. (from lesson 3)\n8. On your own: commit and push, then clone into a new empty folder. Check: the clone's Plugins/TechTools holds real files, not LFS pointers. (from day 100, lesson 2)\n9. On your own: make TechToolsImport (Games > Blank, Blueprint, Unreal 5.8), copy only the plugin into its Plugins folder, open it and type Failed into the Output Log's search. Check: no 'Failed to load' lines. (from lesson 4)\n10. On your own: open L_District_Demo, click Regenerate and Check Town, then run Check from EUW_TechTools on /TechTools. Check: the district builds, Check Town reports 0 problems, the report is clean, and install_test_day108.md records each result. (from lesson 4)\n11. Fix any gap at its source, push, clone again and retest that one thing. Check: every gap in install_test_day108.md has a commit and a passed retest. (from day 100, lesson 4)\n12. Tag the release: git tag -a v2.0 -m 'TechTools 2.0' and git push --follow-tags (only annotated tags travel with it). Take demo_level.png and import_test.png. Record clip_day108.mp4 (60 seconds): the clone, the new project, the demo level, Regenerate and Check Town. Check: the tag on GitHub, and the pictures and the clip in today's Work folder. (from day 99, lesson 4)\n13. Click Copy the day report, paste it into a new tutor chat, answer its questions and save its answer as summary.md. Check: summary.md is in today's Work folder with Made, To look at, Hours and To revisit filled in. (from lesson 1)\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Misha\nDay 108: Importability: the standards sheet, licences, credits and a clean install. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

function quiz(){if(!D.quiz||!D.quiz.length)return '';const a=st.qa||{};let ok=0;const L=u('letters');
 const pips='<div class="pips well" aria-hidden="true">'+D.quiz.map((q,i)=>'<i class="'+(a[i]==null?'':a[i]===q.answer?'r':'w')+'"></i>').join('')+'</div>';
 const qs=D.quiz.map((q,i)=>{const c=a[i];if(c===q.answer)ok++;return '<div class="qz"><p class="qq"><span class="qn">'+(i+1)+'</span><span>'+lk(x(q.q))+'</span></p>'+q.options.map((o,k)=>{let cls='opt',mk='<span></span>';if(c!=null){if(k===q.answer){cls+=' right';mk=ic('check','mk')}else if(k===c){cls+=' wrong';mk=ic('x','mk')}}return '<button class="'+cls+'" id="o'+i+'_'+k+'"'+(c!=null?' disabled':'')+' onclick="pick('+i+','+k+')"><span class="lt">'+(L[k]||k+1)+'</span><span>'+esc(x(o))+'</span>'+mk+'</button>'}).join('')+(c!=null?'<p class="exp '+(c===q.answer?'r':'w')+'" id="e'+i+'" tabindex="-1"><b>'+(c===q.answer?u('right'):u('wrong'))+'</b>'+lk(x(q.explain))+'</p>':'')+'</div>'}).join('');
 return '<section class="card glass quiz">'+lab(u('quiz'),'gold')+'<p class="muted" style="margin:-6px 0 14px">'+u('quizSub')+'</p>'+pips+qs+(qDone()?'<div class="score well" role="status"><span class="eyebrow">'+u('score')+'</span><span class="lcd" aria-label="'+ok+' / '+D.quiz.length+'">'+seg(ok+'/'+D.quiz.length)+'</span><div class="row"><button class="btn ghost" id="retry" onclick="retry()">'+u('retry')+'</button></div></div>':'')+'</section>'}
function vid(v){if(!v)return '';const link=v.url?'<a href="'+esc(v.url)+'" target="_blank" rel="noopener">'+esc(x(v.title)||v.url)+'</a>'+(v.channel?' <span class="muted">· '+esc(v.channel)+(v.length?' · '+esc(v.length):'')+'</span>':''):'';const s=v.search?'<a href="https://www.youtube.com/results?search_query='+encodeURIComponent(v.search)+'" target="_blank" rel="noopener">'+u('noVid')+': '+esc(v.search)+'</a>':'';const alt=v.alt&&v.alt.url?'<br><span class="eyebrow">UA</span> <a href="'+esc(v.alt.url)+'" target="_blank" rel="noopener">'+esc(v.alt.title||v.alt.url)+'</a>'+(v.alt.channel?' <span class="muted">· '+esc(v.alt.channel)+'</span>':''):'';return '<div class="vid well">'+kn('play')+'<div><b>'+u('more')+'?</b><br>'+(link||s)+alt+(link&&s?'<br><span class="muted" style="font-size:14px">'+s+'</span>':'')+'</div></div>'}
function morning(){const m=D.morning;if(!m)return '';const q=m.quote||{};
 let shelf='';if(D.day>0){shelf='<div class="shelf" aria-hidden="true">';let g='';for(let d=0;d<D.day;d++){let p=0;try{p=(JSON.parse(localStorage.getItem('devteam:'+D.learner+':'+d))||{}).pct||0}catch(e){}g+='<i class="'+(p>=1?'d':'')+(d>0&&d%5===0?' bs':'')+'"></i>';if(d%5===0||d===D.day-1){shelf+='<span class="wkg">'+g+'</span>';g=''}}shelf+='</div>'}
 const qt=lang==='uk'&&q.original?q.original:x(q.text);
 return '<section class="card glass morning"><div class="mgrid">'+(m.sofar?'<div>'+lab(u('sofar'),'gold')+shelf+'<p class="mtxt">'+lk(x(m.sofar))+'</p></div>':'')+(m.today?'<div>'+lab(u('todayL'))+'<p class="mtxt">'+lk(x(m.today))+'</p></div>':'')+'</div>'+(m.cheer?'<p class="cheer">'+esc(x(m.cheer))+'</p>':'')+(qt?'<figure class="quote well">'+kn('quote')+'<blockquote>'+esc(qt)+'</blockquote>'+(q.author?'<figcaption>'+esc(x(q.author))+'</figcaption>':'')+'</figure>':'')+'</section>'}
function setLang(l){lang=l;try{localStorage.setItem('devteam:lang',lang)}catch(e){};render()}
function toggleLang(){setLang(lang==='uk'?'en':'uk')}
/* keep open sections and keyboard focus across re-renders */
const openD=new Set();
function tg(e){if(e.open)openD.add(e.id);else openD.delete(e.id)}
const op=id=>openD.has(id)?' open':'';
function render(){const ae=document.activeElement,fid=ae&&(ae.id||(ae.getAttribute('data-th')?'th-'+ae.getAttribute('data-th'):ae.getAttribute('lang')&&ae.closest('.seg')?'lg-'+ae.getAttribute('lang'):''));
 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);
 const b=D.build,P=Math.round(prog()*100);
 document.getElementById('top').innerHTML='<div class="topin glass"><a class="maplink" href="'+esc(D.mapHref)+'">'+kn('map')+u('map')+'</a><div class="crumb"><b>'+esc(x(D.learnerName))+'</b><span>'+u('week')+' '+D.week+'</span><span>'+u('day')+' '+D.day+' '+u('of')+' '+D.total+'</span></div>'+controls(lang,'setLang')+'</div><div class="tline"><i style="width:'+P+'%"></i></div>';
 const state=w=>w<D.week?'b':w===D.week?'n':'p';
 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 if(D.weekInfo){const w=D.weekInfo;h+='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}
 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p><div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+list(D.handin,'ul','ticks')+'<p class="path">'+ic('folder')+'<span>'+u('shipTo')+' <code>'+esc(D.workPath)+'</code></span></p>'+(D.lessons.length?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<p class="muted">'+u('report')+'</p><div class="row"><button class="btn s" onclick="cp(D.reportPrompt)">'+ic('copy')+u('copyR')+'</button></div></section>';
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();
</script>
</body>
</html>

<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 110</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

g the route), with the PC it was measured on.", "uk": "Доказ продуктивності повторено в примітках до релізу і в портфоліо: результат маршруту з perf_district_after.md за бюджетом (середнє менше за 16,6 мс і 95-й перцентиль менше за 33,3 мс у 1920 × 1080 уздовж маршруту) і ПК, на якому міряли."}, {"en": "portfolio.md: a headline, a three-line summary, a link to the demo video, six images (map and district, three seeds, noon and dusk, the EUW_TechTools panel, a Blueprint graph, the before-and-after performance table) with captions, what you built (one line per tool, Weeks 13 to 22), real numbers (district size, buildings, instances, frame times), the skills you can show, and credits (images made from the map: © OpenStreetMap contributors, openstreetmap.org/copyright).", "uk": "portfolio.md: заголовок, підсумок у три рядки, посилання на демо-відео, шість зображень із підписами (мапа й район, три зерна, полудень і сутінки, панель EUW_TechTools, граф Blueprint, таблиця продуктивності «до і після»), що збудовано (по рядку на інструмент, Тижні 13–22), справжні числа (розмір району, будинки, інстанси, час кадру), навички, які можна показати, і рядки авторства (зображення, зроблені з мапи: © OpenStreetMap contributors, openstreetmap.org/copyright)."}, {"en": "handover_check.md: each finish-line item with its proof and a pass; the self-review with the tutor scored on a five-line rubric (works in a fresh project; readable and documented; safe and seeded; fast enough and proved; licensed and credited), 0 to 2 each, with one improvement per line; the final quiz score and one line for every wrong answer.", "uk": "handover_check.md: кожен пункт фінішу з доказом і позначкою pass. Самоперевірка з тьютором за таблицею оцінювання з п'яти рядків (працює в новому проєкті; читабельний і задокументований; безпечний і з зерном; достатньо швидкий і доведено; ліцензований і з рядками авторства), по 0–2 на рядок, з одним покращенням на рядок. Результат фінального тесту й рядок на кожну помилку."}, {"en": "Bronze, Silver and Gold as listed below.", "uk": "Бронза, Срібло і Золото — як у списку нижче."}], "piece1": "The plan, the release and the portfolio page (practised in the micro-lessons)", "piece2": {"en": "The final install test, the self-review and the 15-question final quiz", "uk": "Фінальний тест встановлення, самоперевірка і фінальний тест із 15 питань"}, "steps": [{"text": {"en": "Check: the results of today's lessons are there (boss_day110.md with the five finish-line items, and the release steps you practised in lesson 2). Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it. Start the clock. Write boss_day110.md: the five finish-line items with their proofs, the tiers and the minutes. Check: every item names a file or a picture that proves it.", "uk": "Перевір, чи є результати сьогоднішніх уроків: boss_day110.md з п'ятьма пунктами фінішу і кроки релізу, відпрацьовані на уроці 2. Чогось бракує? Пройди зараз кроки «Разом із тьютором» того уроку (близько 25 хвилин): самостійна частина спирається на них. Запусти годинник. Напиши boss_day110.md: п'ять пунктів фінішу з доказами, медалі й хвилини. Перевірка: кожен пункт називає файл чи картинку, що його доводить."}, "lesson": 1}, {"text": {"en": "Clone the repository into a new empty folder and zip only Plugins/TechTools as TechTools-2.0.zip. Check: the zip holds TechTools.uplugin, Content, TechData, Docs, README.md, CHANGELOG.md and CREDITS.md, and no Binaries, Intermediate or Saved.", "uk": "Клонуй репозиторій у нову порожню папку і запакуй лише Plugins/TechTools як TechTools-2.0.zip. Перевірка: у zip є TechTools.uplugin, Content, TechData, Docs, README.md, CHANGELOG.md і CREDITS.md, і немає Binaries, Intermediate чи Saved."}, "lesson": 2}, {"text": {"en": "Install the zip once more: unzip it into a new Blank Unreal 5.8 project's Plugins folder, open L_District_Demo, click Regenerate, then Check Town. Check: the district builds and Check Town reports 0 problems.", "uk": "Ще раз встанови zip: розпакуй його в папку Plugins нового проєкту Blank Unreal 5.8, відкрий L_District_Demo, клацни Regenerate, потім Check Town. Перевірка: район будується, а Check Town показує 0 проблем."}, "lesson": "D108.4"}, {"text": {"en": "Make the release: on GitHub open Releases > Draft a new release, choose the tag v2.0, title it 'TechTools 2.0: District Generator', paste the 2.0.0 notes, three install lines and the route result against the budget, and attach TechTools-2.0.zip. Check: the published release shows the zip and the notes.", "uk": "Зроби реліз: на GitHub відкрий Releases > Draft a new release, вибери тег v2.0, назви його 'TechTools 2.0: District Generator', встав примітки 2.0.0, три рядки про встановлення і результат маршруту за бюджетом і додай TechTools-2.0.zip. Перевірка: опублікований реліз показує zip і примітки."}, "lesson": 2}, {"text": {"en": "Write handover_check.md: the five finish-line items, each with its proof (a release file, a picture, a report line) and a pass. Check: five passes; Bronze is reached, so log the time.", "uk": "Напиши handover_check.md: п'ять пунктів фінішу, кожен із доказом (файл релізу, картинка, рядок звіту) і позначкою pass. Перевірка: п'ять pass. Бронзу здобуто: запиши час."}, "lesson": 1}, {"text": {"en": "Attach demo_district.mp4 and perf_district_after.md to the release (each file under 2 GiB). Check: both download from the release page.", "uk": "Додай до релізу demo_district.mp4 і perf_district_after.md (кожен файл менший за 2 ГіБ). Перевірка: обидва завантажуються зі сторінки релізу."}, "lesson": 2}, {"text": {"en": "Write portfolio.md in the repository's top folder with its six images in a portfolio folder. Check: it reads well in two minutes in the Markdown preview, and every number in it matches a report.", "uk": "Напиши portfolio.md у верхній папці репозиторію, а шість зображень поклади в папку portfolio. Перевірка: у перегляді Markdown він добре читається за дві хвилини, а кожне число в ньому збігається зі звітом."}, "lesson": 3}, {"text": {"en": "Self-review with the tutor: score the five-line rubric 0 to 2 per line and write one improvement for each. Check: the scores, the improvements and your tier are in handover_check.md; Silver is reached, so log the time.", "uk": "Самоперевірка з тьютором: оціни таблицю з п'яти рядків по 0–2 на рядок і напиши одне покращення на кожен. Перевірка: оцінки, покращення і твоя медаль є в handover_check.md. Срібло здобуто: запиши час."}, "lesson": 4}, {"text": {"en": "Commit and push portfolio.md and its images. Check: GitHub shows portfolio.md with every picture.", "uk": "Зроби коміт і надішли portfolio.md і його зображення. Перевірка: GitHub показує portfolio.md з кожною картинкою."}, "lesson": "D96.4"}, {"text": {"en": "Gold: publish your portfolio page where people can see it, sharing only what you choose, for example a separate public repository with portfolio.md, its images and the video link, while your tools repository stays private if you prefer. Check: the page opens in a private browser window without signing in.", "uk": "Золото: опублікуй сторінку портфоліо там, де її можуть бачити люди, ділячись лише тим, що вибираєш ти. Наприклад, окремий публічний репозиторій із portfolio.md, зображеннями й посиланням на відео, а репозиторій інструментів, якщо хочеш, лишається приватним. Перевірка: сторінка відкривається в приватному вікні браузера без входу."}, "lesson": 3}, {"text": {"en": "The final quiz: answer the 15 questions without notes, then look up each wrong answer on its day. Check: your score and one explaining line per wrong answer in handover_check.md (Gold: 13 or more correct).", "uk": "Фінальний тест: дай відповіді на 15 питань без нотаток, потім знайди кожну помилку в її дні. Перевірка: твій результат і по рядку пояснення на кожну помилку в handover_check.md (Золото: 13 чи більше правильних)."}, "lesson": 4}, {"text": {"en": "Take release_day110.png (the release page with TechTools-2.0.zip, demo_district.mp4 and perf_district_after.md). Copy portfolio.md and its six images into today's Work folder: the reviewer cannot open your private repository. Record clip_day110.mp4 (the release page, the zip installing into a new project, one click on Regenerate, and portfolio.md; 60 seconds, under 50 MB) with OBS Studio (Display Capture) or Win+Shift+R (Snipping Tool, select the whole screen). Check: the picture, the copies and a clip under 50 MB are in today's Work folder.", "uk": "Зроби скриншот release_day110.png (сторінка релізу з TechTools-2.0.zip, demo_district.mp4 і perf_district_after.md). Скопіюй portfolio.md і шість його зображень у сьогоднішню папку Work: рецензент не може відкрити твій приватний репозиторій. Запиши clip_day110.mp4 (сторінка релізу, zip встановлюється в новий проєкт, одне клацання Regenerate і portfolio.md; 60 секунд, менше за 50 МБ) в OBS Studio (Display Capture) або Win+Shift+R (Snipping Tool, виділи весь екран). Перевірка: картинка, копії і кліп менший за 50 МБ лежать у сьогоднішній папці Work."}, "lesson": 1}, {"text": {"en": "Click Copy the day report, paste it into a new tutor chat, answer its questions and save its answer as summary.md, adding a last line on what you will build next. Then drag the files listed under What you hand in into today's hand-in folder (the button on this page); never the zip, a project or a level folder. Check: summary.md has Made, To look at, Hours, To revisit and Next filled in, and the hand-in folder lists every file, each over 1 KB.", "uk": "Клацни «Копіювати звіт дня», встав у новий чат із тьютором, дай відповіді на його питання і збережи його відповідь як summary.md, додавши останній рядок про те, що ти збудуєш далі. Потім перетягни файли з розділу «Що здати» в папку здачі (кнопка на цій сторінці). Ніколи не перетягуй zip, папку проєкту чи рівня. Перевірка: у summary.md заповнено Made, To look at, Hours, To revisit і Next, а в папці здачі всі файли, кожен більший за 1 КБ."}, "lesson": 4}], "boss": [{"en": "Bronze: the v2.0 release with TechTools-2.0.zip from a fresh clone (installed once more and working), the README, CHANGELOG and CREDITS, and handover_check.md with the five finish-line items proved, inside 2 hours.", "uk": "Бронза: реліз v2.0 з TechTools-2.0.zip зі свіжого клону (ще раз встановлений і робочий), README, CHANGELOG і CREDITS, а handover_check.md доводить п'ять пунктів фінішу — за 2 години."}, {"en": "Silver: Bronze, plus the demo video and the performance report on the release (the route under budget: average under 16.6 ms and 95th percentile under 33.3 ms at 1920 x 1080, or the honest gap and its plan), portfolio.md with six images and real numbers, and the self-review rubric scored with the tutor, inside 3 hours.", "uk": "Срібло: Бронза, плюс демо-відео і звіт про продуктивність у релізі (маршрут у межах бюджету: середнє менше за 16,6 мс і 95-й перцентиль менше за 33,3 мс у 1920 × 1080, або чесний залишок і план), portfolio.md з шістьма зображеннями і справжніми числами, а таблицю самоперевірки оцінено з тьютором — за 3 години."}, {"en": "Gold: Silver, plus the portfolio page published where people can see it, sharing only what you choose, and the final quiz at 13 of 15 or better with every wrong answer explained.", "uk": "Золото: Срібло, плюс сторінка портфоліо, опублікована там, де її можуть бачити люди, з тим, що ти вибираєш показати, і фінальний тест на 13 з 15 чи краще з поясненням кожної помилки."}], "assets": ["techart/standards-sheet.md", "techart/tool-review-checklist.md", "world/credits-template.md"], "next": {"en": "What next with your portfolio: send its link and the demo video with every application, keep TechTools in Git and add one small tool a month, and feed a second real town into the generator to show it travels.", "uk": "Що далі з портфоліо: надсилай посилання на нього й демо-відео з кожною заявкою на роботу, тримай TechTools у Git і додавай по одному маленькому інструменту на місяць, а ще подай у генератор друге справжнє містечко, щоб показати, що він переноситься."}}, "lessons": [{"title": {"en": "Final Boss briefing: what a studio receives (micro-lesson)", "uk": "Брифінг фінального боса: що отримує студія (міні-урок)"}, "minutes": 20, "goals": [{"en": "List what a hand-over pack holds: the tool, how to install it, how to use it, proof that it works, credits and a way to get updates.", "uk": "Перелічувати, що містить пакет передачі: інструмент, як його встановити, як ним користуватися, доказ, що він працює, рядки авторства і спосіб отримувати оновлення."}, {"en": "Match the five finish-line items to proofs you already have.", "uk": "Зіставляти п'ять пунктів фінішу з доказами, які вже є."}, {"en": "Plan the tiers in minutes.", "uk": "Планувати медалі у хвилинах."}], "doalong": [{"en": "Write the five finish-line items in boss_day110.md: the District Generator; the checker with its editor panel; the Blender pipeline; the performance report; the plugin in Git with manual, video and portfolio. You see the whole module in five lines.", "uk": "Запиши п'ять пунктів фінішу в boss_day110.md: District Generator; перевірка з панеллю редактора; конвеєр для Blender; звіт про продуктивність; плагін у Git із посібником, відео і портфоліо. Має вийти: увесь модуль у п'яти рядках."}, {"en": "Beside each, name its proof: for example contact_sheet_day105.png and the Check Town lines; asset_report.md and EUW_TechTools; export_log.md and the ten rocks; perf_district_after.md; the v2.0 tag, the README and demo_district.mp4. You see that the evidence already exists.", "uk": "Біля кожного назви доказ: наприклад, contact_sheet_day105.png і рядки Check Town; asset_report.md і EUW_TechTools; export_log.md і десять скель; perf_district_after.md; тег v2.0, README і demo_district.mp4. Має вийти: видно, що докази вже є."}, {"en": "List what a studio downloads: TechTools-2.0.zip, the README (install and use), CHANGELOG (what changed), CREDITS (whose work is inside), the video and the performance report. You see the release's contents.", "uk": "Перелічи, що завантажує студія: TechTools-2.0.zip, README (встановлення і користування), CHANGELOG (що змінилося), CREDITS (чия робота всередині), відео і звіт про продуктивність. Має вийти: вміст релізу."}, {"en": "Give each stage minutes: Bronze in 2 hours, Silver in 3, Gold in 4. You see a timed plan.", "uk": "Дай кожному етапу хвилини: Бронза за 2 години, Срібло за 3, Золото за 4. Має вийти: план із часом."}], "play": {"en": "Receiving studio: the tutor plays a lead at a studio opening my pack and asks five questions (Which engine? How do I install it? What does it need? Does it hold 60 fps? Whose assets are inside?). I answer each by pointing to a file.", "uk": "Студія отримує: тьютор грає ліда студії, який відкриває мій пакет і ставить п'ять питань (Який рушій? Як встановити? Що йому потрібно? Чи тримає він 60 кадрів/с? Чиї асети всередині?). На кожне я відповідаю, показуючи файл."}, "video": {"search": "game tools handoff documentation release"}, "prompt": "You are my tutor for one 20-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Брифінг фінального боса: що отримує студія (міні-урок) (Day 110, lesson 1 of 4). Today's build: Пакет передачі: реліз GitHub v2.0 (zip плагіна, примітки до релізу, демо-відео і звіт про продуктивність), README, CHANGELOG і CREDITS у плагіні, portfolio.md і handover_check.md, що доводить кожен із п'яти пунктів фінішу.\nWhat I already know: Дні 101–109: District Generator, доведення, перевірка, можливість імпорту, демо-відео і README; Дні 96–100: Git, плагін, тег v1.1 і тест чистої кімнати; Дні 91–95: perf_report.py і метод звіту про продуктивність; Дні 61–90: кожен інструмент на Blueprint, Python, Blender і PCG у TechTools; Рядки навичок Тижнів 13–22.\n\nBy the end of this lesson I can:\n1. Перелічувати, що містить пакет передачі: інструмент, як його встановити, як ним користуватися, доказ, що він працює, рядки авторства і спосіб отримувати оновлення.\n2. Зіставляти п'ять пунктів фінішу з доказами, які вже є.\n3. Планувати медалі у хвилинах.\n\nRun the lesson in this order; it should take 20 to 30 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: За десять тижнів з'явилися інструменти на Blueprint, конвеєри на Python і для Blender, графи PCG, генератор міста, набір інструментів продуктивності і District Generator зі справжньою мапою на вході — усе в одному плагіні в Git. Today: Ти передаєш усе це як професіонал: реліз, посібник, відео, звіт про продуктивність і сторінка портфоліо, а потім — фінальний тест. One encouraging line: Згадай свій перший ряд стовпчиків у День 61. Усе, що було далі, збудовано малими перевіреними кроками, і кожен із них — твій.); 2 lines on why today matters and where it comes back, in plain words (from this: Студія отримує інструменти пакетом: що встановити, що прочитати, доказ, що все працює, і спосіб отримувати оновлення. Чиста передача — остання навичка технічного художника і перше враження, яке ти справляєш на нового роботодавця. Сторінка портфоліо перетворює десять тижнів інструментів на історію, яку будь-хто прочитає за дві хвилини. It comes back: Що далі з портфоліо: надсилай посилання на нього й демо-відео з кожною заявкою на роботу, тримай TechTools у Git і додавай по одному маленькому інструменту на місяць, а ще подай у генератор друге справжнє містечко, щоб показати, що він переноситься.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-110-final-boss-hand-over-pack exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (План, реліз і сторінка портфоліо (відпрацьовані на міні-уроках)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Запиши п'ять пунктів фінішу в boss_day110.md: District Generator; перевірка з панеллю редактора; конвеєр для Blender; звіт про продуктивність; плагін у Git із посібником, відео і портфоліо. Має вийти: увесь модуль у п'яти рядках.\n   2. Біля кожного назви доказ: наприклад, contact_sheet_day105.png і рядки Check Town; asset_report.md і EUW_TechTools; export_log.md і десять скель; perf_district_after.md; тег v2.0, READ )"}], "goal": {"en": "By the end of today you have the hand-over pack: a v2.0 release on your GitHub repository with the TechTools plugin zipped from a fresh clone, the README manual, CHANGELOG and CREDITS, the demo video and the performance report, plus portfolio.md, your portfolio page; and you have taken the 15-question final quiz on the whole module.", "uk": "До кінця дня в тебе є пакет передачі: реліз v2.0 у репозиторії GitHub із плагіном TechTools, запакованим у zip зі свіжого клону, посібник README, CHANGELOG і CREDITS, демо-відео і звіт про продуктивність, а також portfolio.md — сторінка портфоліо. І ти проходиш фінальний тест із 15 питань на весь модуль."}, "uses": [{"en": "Days 101 to 109: the District Generator, the polish, validation, importability, the demo video and the README", "uk": "Дні 101–109: District Generator, доведення, перевірка, можливість імпорту, демо-відео і README"}, {"en": "Days 96 to 100: Git, the plugin, the v1.1 tag and the clean-room test", "uk": "Дні 96–100: Git, плагін, тег v1.1 і тест чистої кімнати"}, {"en": "Days 91 to 95: perf_report.py and the performance report method", "uk": "Дні 91–95: perf_report.py і метод звіту про продуктивність"}, {"en": "Days 61 to 90: every Blueprint, Python, Blender and PCG tool in TechTools", "uk": "Дні 61–90: кожен інструмент на Blueprint, Python, Blender і PCG у TechTools"}, {"en": "The skills lines of Weeks 13 to 22", "uk": "Рядки навичок Тижнів 13–22"}], "quiz": [{"q": {"en": "Day 61: Count is 5 but you see 6 bollards. What is wrong?", "uk": "День 61: Count дорівнює 5, але стовпчиків 6. Що не так?"}, "options": [{"en": "Spacing is too small", "uk": "Spacing замалий"}, {"en": "Last Index is Count instead of Count minus 1", "uk": "Last Index дорівнює Count замість Count мінус 1"}, {"en": "Instance Editable is ticked", "uk": "Позначено Instance Editable"}, {"en": "The mesh is missing", "uk": "Немає мешу"}], "answer": 1, "explain": {"en": "A For Loop runs from First to Last Index inclusive, so 0 to 5 is six steps.", "uk": "For Loop іде від First до Last Index включно, тож від 0 до 5 — шість кроків."}}, {"q": {"en": "Day 64: Why does BP_StreetLamp use a timer instead of Tick?", "uk": "День 64: чому BP_StreetLamp використовує таймер, а не Tick?"}, "options": [{"en": "Tick does not work on lights", "uk": "Tick не працює на світлі"}, {"en": "Timers make the light brighter", "uk": "Таймери роблять світло яскравішим"}, {"en": "A check every 2 seconds costs far less than one every frame, and a lamp needs no more", "uk": "Перевірка раз на 2 секунди коштує набагато менше, ніж щокадру, а ліхтарю більше не треба"}, {"en": "Lamps cannot use Tick", "uk": "Ліхтарі не можуть використовувати Tick"}], "answer": 2, "explain": {"en": "Static or slow-changing things should not pay a cost every frame.", "uk": "Статичні чи повільні речі не мають платити щокадру."}}, {"q": {"en": "Day 69: Why do houses come from DT_StreetMix by weight?", "uk": "День 69: чому будинки беруться з DT_StreetMix за вагами?"}, "options": [{"en": "Designers can change the mix in a table without touching the Blueprint", "uk": "Дизайнери можуть змінювати суміш у таблиці, не чіпаючи Blueprint"}, {"en": "Data Tables draw faster", "uk": "Data Tables вибирають швидше"}, {"en": "Weights make houses taller", "uk": "Ваги роблять будинки вищими"}, {"en": "Unreal requires it", "uk": "Цього вимагає Unreal"}], "answer": 0, "explain": {"en": "Data-driven tools separate the rules (in data) from the logic (in the Blueprint).", "uk": "Інструменти, керовані даними, відділяють правила (у даних) від логіки (у Blueprint)."}}, {"q": {"en": "Day 72: Why does rename_by_rules.py print a plan before renaming anything?", "uk": "День 72: чому rename_by_rules.py друкує план, перш ніж щось перейменувати?"}, "options": [{"en": "Python must print before it renames", "uk": "Python мусить друкувати перед перейменуванням"}, {"en": "It makes the script slower and safer", "uk": "Так скрипт повільніший і безпечніший"}, {"en": "Unreal renames cannot be undone", "uk": "Перейменування в Unreal не можна скасувати"}, {"en": "A dry run shows every change first, so a mistake costs nothing", "uk": "Пробний запуск спершу показує кожну зміну, тож помилка нічого не коштує"}], "answer": 3, "explain": {"en": "Anything that renames, moves or deletes gets a dry run and a question before it acts.", "uk": "Усе, що перейменовує, переміщує чи видаляє, отримує пробний запуск і питання перед дією."}}, {"q": {"en": "Day 77: export_kit.py skips SM_LampPost with 'not at the world origin'. What do you do?", "uk": "День 77: export_kit.py пропускає SM_LampPost з повідомленням 'not at the world origin'. Що ти робиш?"}, "options": [{"en": "Delete the check from the script", "uk": "Видаляю перевірку зі скрипту"}, {"en": "Move the object to the world origin in Blender and run again", "uk": "Переміщую об'єкт у центр світу в Blender і запускаю знову"}, {"en": "Rename the collection", "uk": "Перейменовую колекцію"}, {"en": "Export it by hand", "uk": "Експортую вручну"}], "answer": 1, "explain": {"en": "The check protects the pivot rule; fix the asset, not the check.", "uk": "Перевірка захищає правило точки опори. Виправляй асет, а не перевірку."}}, {"q": {"en": "Day 79: range(1, COUNT) makes 9 rocks when COUNT is 10. Why?", "uk": "День 79: range(1, COUNT) робить 9 скель, коли COUNT дорівнює 10. Чому?"}, "options": [{"en": "range stops before its end number; range(1, COUNT + 1) gives 1 to 10", "uk": "range зупиняється перед кінцевим числом; range(1, COUNT + 1) дає від 1 до 10"}, {"en": "COUNT is wrong", "uk": "COUNT неправильний"}, {"en": "Blender limits the number of rocks", "uk": "Blender обмежує кількість скель"}, {"en": "The seed", "uk": "Зерно"}], "answer": 0, "explain": {"en": "Python's range never includes its end, which is a classic off-by-one mistake.", "uk": "range у Python ніколи не включає кінець — класична помилка на одиницю."}}, {"q": {"en": "Day 83: What does a custom PCG node such as PCGE_DistanceToSea add?", "uk": "День 83: що додає власний вузол PCG, як-от PCGE_DistanceToSea?"}, "options": [{"en": "A new mesh for each point", "uk": "Новий меш для кожної точки"}, {"en": "A faster renderer", "uk": "Швидший рендерер"}, {"en": "A rule the node library lacks: a value per point that other nodes can filter on", "uk": "Правило, якого немає в бібліотеці вузлів: значення на кожну точку, за яким можуть фільтрувати інші вузли"}, {"en": "A random seed", "uk": "Випадкове зерно"}], "answer": 2, "explain": {"en": "Custom nodes add your own rules to PCG, here a distance that chooses styles and turns benches.", "uk": "Власні вузли додають у PCG твої правила — тут відстань, що вибирає стилі й повертає лавки."}}, {"q": {"en": "Day 85: A lamp stands inside KO_Corridor01 after Generate. What do you check?", "uk": "День 85: після Generate ліхтар стоїть у KO_Corridor01. Що перевірити?"}, "options": [{"en": "The lamp mesh", "uk": "Меш ліхтаря"}, {"en": "The seed", "uk": "Зерно"}, {"en": "stat unit", "uk": "stat unit"}, {"en": "That PCG_KeepOuts is on the lamp branch and the corridor carries the tag KeepOutWide", "uk": "Чи стоїть PCG_KeepOuts на гілці ліхтарів і чи має коридор тег KeepOutWide"}], "answer": 3, "explain": {"en": "Corridors are kept clear by rule; a missing branch or tag lets things through.", "uk": "Коридори тримаються вільними за правилом. Якщо бракує гілки чи тегу, щось проходить."}}, {"q": {"en": "Day 89: Two Regenerates with one seed give different styles. What do you change?", "uk": "День 89: два Regenerate з одним зерном дають різні стилі. Що змінити?"}, "options": [{"en": "Use Random Integer in Range from Stream, fed by a stream made from the Seed", "uk": "Брати Random Integer in Range from Stream з потоку, зробленого із Seed"}, {"en": "Change the seed each time", "uk": "Щоразу змінювати зерно"}, {"en": "Remove Clear Town", "uk": "Прибрати Clear Town"}, {"en": "Lower the floors", "uk": "Зменшити поверхи"}], "answer": 0, "explain": {"en": "Every random choice in a generator must come from the seeded stream.", "uk": "Кожен випадковий вибір у генераторі має йти з потоку із зерном."}}, {"q": {"en": "Day 92: A capture has an average of 15.8 ms and a 95th percentile of 50 ms. Does it meet the budget?", "uk": "День 92: у захопленні середнє 15,8 мс, а 95-й перцентиль — 50 мс. Чи вкладається воно в бюджет?"}, "options": [{"en": "Yes, the average is under 16.6 ms", "uk": "Так, середнє менше за 16,6 мс"}, {"en": "No: the 95th percentile must be under 33.3 ms too", "uk": "Ні: 95-й перцентиль теж має бути менший за 33,3 мс"}, {"en": "Only at 4K", "uk": "Лише в 4K"}, {"en": "Only if the GPU time is lower", "uk": "Лише якщо час GPU менший"}], "answer": 1, "explain": {"en": "The budget at 1920 x 1080 needs both: an average under 16.6 ms and a 95th percentile under 33.3 ms.", "uk": "Бюджет у 1920 × 1080 вимагає обох: середнє менше за 16,6 мс і 95-й перцентиль менше за 33,3 мс."}}, {"q": {"en": "Day 96: Why must .gitattributes, with the Git LFS rules, be in the first commit, before any asset?", "uk": "День 96: чому .gitattributes із правилами Git LFS має бути в першому коміті, раніше за будь-який асет?"}, "options": [{"en": "So every .uasset and .umap is stored with Git LFS from the start; assets committed before the rules sit in normal Git history and make every clone heavy", "uk": "Щоб кожен .uasset і .umap від початку зберігався в Git LFS; асети, закомічені до правил, лежать у звичайній історії Git і роблять кожен клон важким"}, {"en": "Git cannot start without it", "uk": "Без нього Git не запускається"}, {"en": "It hides your email address", "uk": "Він ховає твою адресу пошти"}, {"en": "GitHub charges for repositories without it", "uk": "GitHub бере гроші за репозиторії без нього"}], "answer": 0, "explain": {"en": "Tracking rules only apply to files added after them; old commits keep the big files as they were.", "uk": "Правила відстеження діють лише на файли, додані після них. Старі коміти зберігають великі файли як були."}}, {"q": {"en": "Day 97: In a fresh project the buildings are grey boxes and the log says Failed to load /Game/... What happened?", "uk": "День 97: у новому проєкті будинки — сірі коробки, а журнал каже Failed to load /Game/... Що сталося?"}, "options": [{"en": "Nanite is off in the new project", "uk": "У новому проєкті вимкнено Nanite"}, {"en": "The seed changed", "uk": "Змінилося зерно"}, {"en": "Python is not installed", "uk": "Python не встановлено"}, {"en": "The plugin points at assets it does not carry; move them into the plugin and retest", "uk": "Плагін вказує на асети, яких не несе; перемісти їх у плагін і перевір знову"}], "answer": 3, "explain": {"en": "An importable plugin carries everything its assets reference.", "uk": "Плагін, придатний до імпорту, несе все, на що посилаються його асети."}}, {"q": {"en": "Day 102: Your street preview is mirrored compared with the map. What do you fix?", "uk": "День 102: перегляд вулиць дзеркальний відносно мапи. Що виправити?"}, "options": [{"en": "Rotate the generator 180 degrees", "uk": "Повернути генератор на 180 градусів"}, {"en": "The y formula, so Y counts south from the north edge as Unreal's Y does", "uk": "Формулу y, щоб Y рахувався на південь від північного краю, як Y в Unreal"}, {"en": "Reimport the Data Table", "uk": "Повторно імпортувати Data Table"}, {"en": "Scale the level by -1", "uk": "Масштабувати рівень на -1"}], "answer": 1, "explain": {"en": "With X pointing east, Unreal's Y points south; a northward y mirrors the town.", "uk": "Коли X дивиться на схід, Y в Unreal дивиться на південь. Y, що рахується на північ, дзеркалить місто."}}, {"q": {"en": "Day 106: Spawned puddle decals set to rotation 0, 0, 0 show no round puddles on the ground. What fixes them?", "uk": "День 106: поставлені декалі калюж з обертанням 0, 0, 0 не дають круглих калюж на ґрунті. Що їх виправить?"}, "options": [{"en": "A brighter material", "uk": "Яскравіший матеріал"}, {"en": "More decals", "uk": "Більше декалей"}, {"en": "Pitch -90, because a decal projects along its X axis", "uk": "Pitch -90, бо декаль проєктується вздовж осі X"}, {"en": "A bigger Fade Screen Size", "uk": "Більший Fade Screen Size"}], "answer": 2, "explain": {"en": "Ground decals must point down; comparing with a hand-placed decal shows the value.", "uk": "Декалі на ґрунті мають дивитися вниз. Порівняння з декаллю, поставленою вручну, показує значення."}}, {"q": {"en": "Day 108: A free Fab tree whose licence limits sharing its files is inside your plugin. What do you do before handing it over?", "uk": "День 108: у плагіні є безкоштовне дерево з Fab, ліцензія якого обмежує поширення файлів. Що зробити перед передачею?"}, "options": [{"en": "Remove or replace it, and say in README where users can get it themselves", "uk": "Прибрати чи замінити його і написати в README, де користувачі можуть взяти його самі"}, {"en": "Keep it, because it was free", "uk": "Лишити, бо воно безкоштовне"}, {"en": "Rename it", "uk": "Перейменувати"}, {"en": "Zip it separately", "uk": "Запакувати окремо"}], "answer": 0, "explain": {"en": "Free to use is not free to share; only assets you may share travel in the plugin.", "uk": "Вільно використовувати — не те саме, що вільно поширювати. У плагіні подорожують лише асети, якими можна ділитися."}}], "weekInfo": null, "morning": {"sofar": {"en": "In ten weeks you built Blueprint tools, Python and Blender pipelines, PCG graphs, a town generator, a performance toolkit and a District Generator fed by a real map, all in one plugin kept in Git.", "uk": "За десять тижнів з'явилися інструменти на Blueprint, конвеєри на Python і для Blender, графи PCG, генератор міста, набір інструментів продуктивності і District Generator зі справжньою мапою на вході — усе в одному плагіні в Git."}, "today": {"en": "You hand it over like a professional: a release, a manual, a video, a performance report and a portfolio page, then the final quiz.", "uk": "Ти передаєш усе це як професіонал: реліз, посібник, відео, звіт про продуктивність і сторінка портфоліо, а потім — фінальний тест."}, "cheer": {"en": "Look back at your first row of bollards on Day 61; everything since was built one small, checked step at a time, and you did every one of them.", "uk": "Згадай свій перший ряд стовпчиків у День 61. Усе, що було далі, збудовано малими перевіреними кроками, і кожен із них — твій."}, "quote": {"text": {"en": "The reward of a thing well done, is to have done it.", "uk": "Нагорода за добре зроблену справу — те, що її зроблено."}, "author": {"en": "Ralph Waldo Emerson", "uk": "Ральф Волдо Емерсон"}, "source": "New England Reformers (lecture, 1844), in Essays: Second Series"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-110-final-boss-hand-over-pack", "mapHref": "../../COURSE.html", "prevHref": "../Day-109-district-demo-video-manual/START-HERE.html", "nextHref": "", "buildPrompt": "You are my build coach for this afternoon in Git and GitHub, Unreal Engine 5.8 and a Markdown editor. I am a beginner on Day 110. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me: when my Blueprint or script fails, ask for the error message or a screenshot of the graph, point to the line or node that is wrong and explain why, then let me fix it myself. Never write the whole tool for me.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: Фінальний тест встановлення, самоперевірка і фінальний тест із 15 питань.\nIt's part of: Пакет передачі: реліз GitHub v2.0 (zip плагіна, примітки до релізу, демо-відео і звіт про продуктивність), README, CHANGELOG і CREDITS у плагіні, portfolio.md і handover_check.md, що доводить кожен із п'яти пунктів фінішу (Твій репозиторій GitHub (реліз 'TechTools 2.0: District Generator' на тегу v2.0); portfolio.md і папка portfolio із зображеннями — у верхній папці репозиторію; handover_check.md і фінальний огляд — у сьогоднішній папці Work.).\nWhy it matters: Студія отримує інструменти пакетом: що встановити, що прочитати, доказ, що все працює, і спосіб отримувати оновлення. Чиста передача — остання навичка технічного художника і перше враження, яке ти справляєш на нового роботодавця. Сторінка портфоліо перетворює десять тижнів інструментів на історію, яку будь-хто прочитає за дві хвилини. It comes back: Що далі з портфоліо: надсилай посилання на нього й демо-відео з кожною заявкою на роботу, тримай TechTools у Git і додавай по одному маленькому інструменту на місяць, а ще подай у генератор друге справжнє містечко, щоб показати, що він переноситься.\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-110-final-boss-hand-over-pack (on the drive I chose on Day 0).\nWhat I already know: Дні 101–109: District Generator, доведення, перевірка, можливість імпорту, демо-відео і README; Дні 96–100: Git, плагін, тег v1.1 і тест чистої кімнати; Дні 91–95: perf_report.py і метод звіту про продуктивність; Дні 61–90: кожен інструмент на Blueprint, Python, Blender і PCG у TechTools; Рядки навичок Тижнів 13–22; today's lessons: Брифінг фінального боса: що отримує студія (міні-урок); Пакуємо реліз; Сторінка портфоліо; Фінальний огляд і що далі (міні-урок). Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- Спершу boss_day110.md: п'ять пунктів фінішу (District Generator; перевірка з панеллю редактора; конвеєр для Blender; звіт про продуктивність; плагін у Git із посібником, демо-відео і сторінкою портфоліо), кожен із файлом чи картинкою, що його доводить, плюс медалі й хвилини.\n- TechTools-2.0.zip зроблено зі свіжого клону (лише Plugins/TechTools: TechTools.uplugin, Content, TechData, Docs, README.md, CHANGELOG.md, CREDITS.md; без Binaries, Intermediate чи Saved) і ще раз встановлено в новий проєкт Blank Unreal 5.8: L_District_Demo, Regenerate, Check Town з 0 проблем.\n- Реліз GitHub на тегу v2.0 з назвою 'TechTools 2.0: District Generator', з примітками з ## [2.0.0] у CHANGELOG.md, трьома рядками про встановлення і доданими TechTools-2.0.zip, demo_district.mp4 і perf_district_after.md.\n- Доказ продуктивності повторено в примітках до релізу і в портфоліо: результат маршруту з perf_district_after.md за бюджетом (середнє менше за 16,6 мс і 95-й перцентиль менше за 33,3 мс у 1920 × 1080 уздовж маршруту) і ПК, на якому міряли.\n- portfolio.md: заголовок, підсумок у три рядки, посилання на демо-відео, шість зображень із підписами (мапа й район, три зерна, полудень і сутінки, панель EUW_TechTools, граф Blueprint, таблиця продуктивності «до і після»), що збудовано (по рядку на інструмент, Тижні 13–22), справжні числа (розмір району, будинки, інстанси, час кадру), навички, які можна показати, і рядки авторства (зображення, зроблені з мапи: © OpenStreetMap contributors, openstreetmap.org/copyright).\n- handover_check.md: кожен пункт фінішу з доказом і позначкою pass. Самоперевірка з тьютором за таблицею оцінювання з п'яти рядків (працює в новому проєкті; читабельний і задокументований; безпечний і з зерном; достатньо швидкий і доведено; ліцензований і з рядками авторства), по 0–2 на рядок, з одним покращенням на рядок. Результат фінального тесту й рядок на кожну помилку.\n- Бронза, Срібло і Золото — як у списку нижче.\n\nMy checklist (the same numbers andover_check.md. Срібло здобуто: запиши час. (from lesson 4)\n9. Зроби коміт і надішли portfolio.md і його зображення. Перевірка: GitHub показує portfolio.md з кожною картинкою. (from day 96, lesson 4)\n10. Золото: опублікуй сторінку портфоліо там, де її можуть бачити люди, ділячись лише тим, що вибираєш ти. Наприклад, окремий публічний репозиторій із portfolio.md, зображеннями й посиланням на відео, а репозиторій інструментів, якщо хочеш, лишається приватним. Перевірка: сторінка відкривається в приватному вікні браузера без входу. (from lesson 3)\n11. Фінальний тест: дай відповіді на 15 питань без нотаток, потім знайди кожну помилку в її дні. Перевірка: твій результат і по рядку пояснення на кожну помилку в handover_check.md (Золото: 13 чи більше правильних). (from lesson 4)\n12. Зроби скриншот release_day110.png (сторінка релізу з TechTools-2.0.zip, demo_district.mp4 і perf_district_after.md). Скопіюй portfolio.md і шість його зображень у сьогоднішню папку Work: рецензент не може відкрити твій приватний репозиторій. Запиши clip_day110.mp4 (сторінка релізу, zip встановлюється в новий проєкт, одне клацання Regenerate і portfolio.md; 60 секунд, менше за 50 МБ) в OBS Studio (Display Capture) або Win+Shift+R (Snipping Tool, виділи весь екран). Перевірка: картинка, копії і кліп менший за 50 МБ лежать у сьогоднішній папці Work. (from lesson 1)\n13. Клацни «Копіювати звіт дня», встав у новий чат із тьютором, дай відповіді на його питання і збережи його відповідь як summary.md, додавши останній рядок про те, що ти збудуєш далі. Потім перетягни файли з розділу «Що здати» в папку здачі (кнопка на цій сторінці). Ніколи не перетягуй zip, папку проєкту чи рівня. Перевірка: у summary.md заповнено Made, To look at, Hours, To revisit і Next, а в папці здачі всі файли, кожен більший за 1 КБ. (from lesson 4)\n\nToday is a BOSS build. Ask me what time I started; whenever I tell you the time, tell me which tier I'm on track for. At the end, ask my finish time. Tiers:\n- Бронза: реліз ше за 50 МБ) (День боса)\nFinish with a short list of anything missing, the tier I reached, and one line on where this work comes back and what it will look like there. Then tell me the order for the end of the day: first the day report (the Copy the day report button at the bottom of my course page) into summary.md, and only then hand in all the files on the list, summary.md too.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; tier (Bronze, Silver, Gold) = медаль (Бронза, Срібло, Золото); lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; rubric = таблиця оцінювання; self-review = самоперевірка; review (by tutor or art director) = огляд; see-why-fix note = нотатка «бачу, чому, як виправити»; checklist = чек-лист; credits line = рядок авторства; reference photo / hero photo = фото-референс / ключове фото; click / right-click = клацни / клацни правою кнопкою; screenshot /* keep open sections and keyboard focus across re-renders */
const openD=new Set();
function tg(e){if(e.open)openD.add(e.id);else openD.delete(e.id)}
const op=id=>openD.has(id)?' open':'';
function render(){const ae=document.activeElement,fid=ae&&(ae.id||(ae.getAttribute('data-th')?'th-'+ae.getAttribute('data-th'):ae.getAttribute('lang')&&ae.closest('.seg')?'lg-'+ae.getAttribute('lang'):''));
 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);
 const b=D.build,P=Math.round(prog()*100);
 document.getElementById('top').innerHTML='<div class="topin glass"><a class="maplink" href="'+esc(D.mapHref)+'">'+kn('map')+u('map')+'</a><div class="crumb"><b>'+esc(x(D.learnerName))+'</b><span>'+u('week')+' '+D.week+'</span><span>'+u('day')+' '+D.day+' '+u('of')+' '+D.total+'</span></div>'+controls(lang,'setLang')+'</div><div class="tline"><i style="width:'+P+'%"></i></div>';
 const state=w=>w<D.week?'b':w===D.week?'n':'p';
 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 let wk='';if(D.weekInfo){const w=D.weekInfo;wk='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}
 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p>'+(b.next?'<div class="back well">'+kn('arrow')+'<div><b>'+u('comes')+'</b><br>'+lk(x(b.next))+'</div></div>':'')+'<div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.assetFiles&&D.assetFiles.length?'<p class="files">'+ic('folder')+'<span>'+u('filesL')+' '+D.assetFiles.map(f=>'<a href="assets/'+encodeURIComponent(f)+'" target="_blank" rel="noopener">'+esc(f)+'</a>').join(', ')+'</span></p>':D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+=handinCard();h+=beforeCard();
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div><label class="rcpt" for="r'+i+'"><span class="eyebrow">'+u('rcpt')+'</span><textarea id="r'+i+'" rows="2" placeholder="'+esc(u('rcptPh'))+'" oninput="st.r'+i+'=this.value;save()">'+esc(st['r'+i]||'')+'</textarea></label>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+hList()+chkList()+(hasClip?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<h3>1 · '+u('copyR')+'</h3><p class="muted">'+u('report')+'</p><div class="row"><button class="btn ghost" onclick="cp(reportText())">'+ic('copy')+u('copyR')+'</button></div><h3>2 · '+u('ship')+'</h3>'+hf()+'<p class="muted" style="margin:12px 0 0">'+u('hNote')+'</p></section>';
 h+=qCard();h+=wk;
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();
</script>
</body>
</html>

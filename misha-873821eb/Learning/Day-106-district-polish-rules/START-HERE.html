<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 106</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

<script id="data" type="application/json">{"learner": "ib-misha-873821eb", "learnerName": {"en": "Misha", "uk": "Міша"}, "day": 106, "week": 22, "total": 110, "title": {"en": "Polish by rule: variety, storytelling details, light and automated grime", "uk": "Доведення за правилами: різноманітність, сліди історії, світло й автоматичний бруд"}, "theme": {"en": "Week 22: Capstone 2: finish, prove, hand over", "uk": "Тиждень 22: Випускний проєкт 2: доробити, довести, передати"}, "build": {"item": {"en": "Four polish rules in BP_DistrictGenerator (No Triples with Corner Lift, Spawn Vignettes, Spawn Decals, and a first dusk test) and the polished district, before and after", "uk": "Чотири правила доведення в BP_DistrictGenerator (No Triples із Corner Lift, Spawn Vignettes, Spawn Decals і перший тест сутінків) і доведений район «до і після»"}, "why": {"en": "The difference between a generated town and a designed one lies in rules a viewer never notices: no three identical houses in a row, corners that stand a little taller, a bicycle by a shop door, damp along a sea wall. Written as rules, that care happens on every seed for free. Art directors call it storytelling; for a technical artist it is four more functions.", "uk": "Різниця між згенерованим і спроєктованим містом — у правилах, яких глядач ніколи не помічає: жодних трьох однакових будинків поспіль, кути трохи вищі, велосипед біля дверей крамниці, вогкість уздовж морської стіни. Записана як правила, ця турбота з'являється в кожному зерні задарма. Арт-директори називають це розповіддю через оточення, а для технічного художника це ще чотири функції."}, "where": {"en": "BP_DistrictGenerator and three vignette Blueprints (BP_Vignette_Shop, BP_Vignette_Home, BP_Vignette_Quay) in /TechTools/District; L_District.", "uk": "BP_DistrictGenerator і три Blueprint віньєток (BP_Vignette_Shop, BP_Vignette_Home, BP_Vignette_Quay) у /TechTools/District; L_District."}, "spec": [{"en": "polish_plan.md first: before pictures from both bookmarks, the polish lines from review_day105.md, and the four rules, each with one real photo that shows why.", "uk": "Спершу polish_plan.md: картинки «до» з обох закладок, рядки про доведення з review_day105.md і чотири правила, кожне з одним справжнім фото, яке показує навіщо."}, {"en": "Variety: Spawn Buildings remembers Last Style and Run Count; when a drawn style would make a third house in a row of the same style, it draws again from the Build Stream (up to 3 tries); waterfront houses keep Sea Style. Corner Lift: a plot whose distance along its road is within Junction Clear + Plot Width of either end gets one extra floor, never above Max Floors.", "uk": "Різноманітність: Spawn Buildings пам'ятає Last Style і Run Count. Коли вибраний стиль дав би третій поспіль будинок того самого стилю, вона вибирає знову з Build Stream (до 3 спроб). Будинки на набережній зберігають Sea Style. Corner Lift: ділянка, чия відстань уздовж дороги від будь-якого кінця менша за Junction Clear + Plot Width, отримує один додатковий поверх, але не більше за Max Floors."}, {"en": "Vignettes: three Blueprints of hand-arranged kit props (shop: a bicycle, a planter, a sign; home: pots, a bench, a bin; quay: crates, nets, a bollard), each with Variant (Integer, 0 to 2, Expose on Spawn) showing one of three arrangements; Spawn Vignettes places one 1 m in front of the house and 1 m in from its origin corner (the smaller-X end of its front) on chosen plots (shops 70 per cent, homes 25 per cent, the quay kit within Sea Style Distance), seeded from the Build Stream, none in a corridor, capped by Max Vignettes (default 40).", "uk": "Віньєтки: три Blueprint із пропсів набору, розставлених вручну (крамниця: велосипед, вазон, вивіска; дім: горщики, лавка, урна; причал: ящики, сіті, стовпчик). Кожен має Variant (Integer, 0–2, Expose on Spawn), що показує одну з трьох розстановок. Spawn Vignettes ставить віньєтку за 1 м перед будинком і за 1 м від кута з origin (кінець фасаду з меншим X) на вибраних ділянках: крамниці — 70 відсотків, доми — 25 відсотків, набір причалу — у межах Sea Style Distance. Зерно — з Build Stream, жодної в коридорі, ліміт — Max Vignettes (типово 40)."}, {"en": "Light: lesson 3's dusk test only. The full blue-hour recipe and the noon and dusk pictures move to Day 109, where the demo needs them.", "uk": "Світло: лише тест сутінків з уроку 3. Повний рецепт синьої години й картинки опівдні та в сутінках переходять на День 109, де вони потрібні для демо."}, {"en": "Decals: M_Decal_Master, the MI_Decal_* instances and their textures moved into /TechTools/Kit/Decals; Spawn Decals places, from the Build Stream, with Set Actor Rotation after each spawn, MI_Decal_Algae or MI_Decal_SaltLine along the base of sea-facing fronts (Yaw + 90, so the decal projects into the wall), MI_Decal_Puddle on about a third of the junction tables and MI_Decal_TyreTrack along BP_Road carriageways every 40 to 80 m (both Pitch -90, projecting down); each added to Spawned and capped by Max Decals (default 60).", "uk": "Декалі: M_Decal_Master, інстанси MI_Decal_* та їхні текстури переміщено в /TechTools/Kit/Decals. Spawn Decals ставить з Build Stream, із Set Actor Rotation після кожної появи: MI_Decal_Algae або MI_Decal_SaltLine уздовж низу фасадів до моря (Yaw + 90, щоб декаль проєктувалася в стіну), MI_Decal_Puddle приблизно на третині майданчиків перехресть і MI_Decal_TyreTrack уздовж проїзної частини BP_Road кожні 40–80 м (обидві з Pitch -90, проєкція вниз). Кожна додається в Spawned, ліміт — Max Decals (типово 60)."}, {"en": "The planned mistake found and fixed: puddles given Set Actor Rotation 0, 0, 0 ('a puddle lies flat') show no round puddles, because a decal projects along its own X axis; found by comparing with a hand-placed Decal Actor's rotation (Pitch -90), fixed with Pitch -90.", "uk": "Заплановану помилку знайдено й виправлено. Калюжі з Set Actor Rotation 0, 0, 0 («калюжа лежить пласко») не дають круглих калюж, бо декаль проєктується вздовж власної осі X. Причину знайдено порівнянням з обертанням вручну поставленого Decal Actor (Pitch -90), виправлено через Pitch -90."}, {"en": "The same seed still builds the same district, Check Town reports 0 problems, and stat unit from 120 m stays within 1.5 ms of Day 104's reading (or the caps are lowered until it does); polish_compare.png shows the before-and-after pairs from both bookmarks.", "uk": "Те саме зерно й далі будує той самий район, Check Town показує 0 проблем, а stat unit з 120 м відрізняється від показника Дня 104 не більше ніж на 1,5 мс (або ліміти знижено, доки так не стане). polish_compare.png показує пари «до і після» з обох закладок."}], "piece1": "No Triples, Corner Lift, the vignettes and the decals with the planned mistake (built in the lessons)", "piece2": {"en": "The tyre tracks and the cost check, on your own (the light recipe moves to Day 109)", "uk": "Сліди шин і перевірка вартості — самостійно (рецепт світла переходить на День 109)"}, "steps": [{"text": {"en": "Check: the results of today's lessons are there (No Triples and Corner Lift in Spawn Buildings, the three vignette Blueprints, and Spawn Decals with the puddle fix). Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it. Weak PC (16 GB of RAM or less): shrink the PCG volumes to 100 x 100 m while you build and grow them for the final pictures (see the weak-PC section of ACCOUNTS-AND-INSTALLS.html). Write polish_plan.md in today's Work folder with before_120m.png and before_street.png from both bookmarks, the polish lines from review_day105.md, and the four rules with a real photo each. Check: four rules, four photos and two before pictures.", "uk": "Перевір, чи є результати сьогоднішніх уроків: No Triples і Corner Lift у Spawn Buildings, три Blueprint віньєток і Spawn Decals з виправленням калюж. Чогось бракує? Пройди зараз кроки «Разом із тьютором» того уроку (близько 25 хвилин): самостійна частина спирається на них. Слабкий ПК (16 ГБ оперативної пам'яті чи менше): під час роботи зменш об'єми PCG до 100 × 100 м, а для фінальних картинок збільш (див. розділ про слабкі ПК в ACCOUNTS-AND-INSTALLS.html). Напиши polish_plan.md у сьогоднішній папці Work з before_120m.png і before_street.png з обох закладок, рядками про доведення з review_day105.md і чотирма правилами, кожне зі справжнім фото. Перевірка: чотири правила, чотири фото і дві картинки «до»."}, "lesson": 1}, {"text": {"en": "Add No Triples to Spawn Buildings and Regenerate. Check: along every street no three neighbours share a style, the waterfront keeps its style, and the same seed still builds the same district twice.", "uk": "Додай No Triples у Spawn Buildings і клацни Regenerate. Перевірка: уздовж кожної вулиці жодні три сусіди не мають одного стилю, набережна зберігає свій стиль, а те саме зерно двічі будує той самий район."}, "lesson": 1}, {"text": {"en": "Add Corner Lift and Regenerate. Check: houses beside junctions stand one floor taller than their row, never above Max Floors, and the skyline steps up at the corners.", "uk": "Додай Corner Lift і клацни Regenerate. Перевірка: будинки біля перехресть на поверх вищі за свій ряд, але не вищі за Max Floors, а лінія дахів піднімається на кутах."}, "lesson": 1}, {"text": {"en": "Build BP_Vignette_Shop, BP_Vignette_Home and BP_Vignette_Quay with three arrangements each. Check: changing Variant on a placed copy shows another arrangement, with every prop standing on the ground.", "uk": "Збудуй BP_Vignette_Shop, BP_Vignette_Home і BP_Vignette_Quay, кожен із трьома розстановками. Перевірка: зміна Variant на поставленій копії показує іншу розстановку, а кожен пропс стоїть на ґрунті."}, "lesson": 2}, {"text": {"en": "Add Spawn Vignettes and Regenerate. Check: vignettes by shop doors, a few by homes, crates and nets on the waterfront, none in a corridor, no more than Max Vignettes, and the summary line counts them.", "uk": "Додай Spawn Vignettes і клацни Regenerate. Перевірка: віньєтки біля дверей крамниць, кілька біля домів, ящики й сіті на набережній, жодної в коридорі, не більше за Max Vignettes, а підсумковий рядок їх рахує."}, "lesson": 2}, {"text": {"en": "Add the wall decals to Spawn Decals and Regenerate. Check: algae or salt bands along the base of sea-facing fronts, not floating and not on the street.", "uk": "Додай у Spawn Decals декалі на стінах і клацни Regenerate. Перевірка: смуги водоростей чи солі вздовж низу фасадів до моря, не в повітрі й не на вулиці."}, "lesson": 4}, {"text": {"en": "Planned mistake, written up: add the puddles with Set Actor Rotation 0, 0, 0, see no round puddles, compare with a hand-placed Decal Actor, fix with Pitch -90 and Regenerate. Check: puddles shine on about a third of the junction tables, and the error, the value and the change are written in polish_plan.md.", "uk": "Запланована помилка, з описом: додай калюжі з Set Actor Rotation 0, 0, 0 — круглих калюж немає. Порівняй із вручну поставленим Decal Actor, виправ на Pitch -90 і клацни Regenerate. Перевірка: калюжі блищать приблизно на третині майданчиків перехресть, а помилку, значення і зміну записано в polish_plan.md."}, "lesson": 4}, {"text": {"en": "On your own: tyre tracks along BP_Road carriageways every 40 to 80 m (Set Actor Rotation: Pitch -90 and the road's Yaw from Get Transform at Distance Along Spline), stopping at Max Decals. Check: tracks lie along main carriageways, never on pavements, lanes or tables.", "uk": "Самостійно: сліди шин уздовж проїзної частини BP_Road кожні 40–80 м (Set Actor Rotation: Pitch -90 і Yaw дороги з Get Transform at Distance Along Spline), до межі Max Decals. Перевірка: сліди лежать уздовж головних проїзних частин і ніколи на тротуарах, провулках чи майданчиках."}, "lesson": 4}, {"text": {"en": "Regenerate the same seed twice, then click Check Town. Check: identical pictures and 0 problems.", "uk": "Двічі клацни Regenerate з тим самим зерном, потім Check Town. Перевірка: однакові картинки й 0 проблем."}, "lesson": "D105.2"}, {"text": {"en": "Cost: stat unit from 120 m with all the polish on, and the vignette and decal counts from the summary line. Check: within 1.5 ms of Day 104's reading, or Max Vignettes and Max Decals lowered until it is; the numbers in polish_plan.md.", "uk": "Вартість: stat unit з 120 м з усім доведенням і кількість віньєток і декалей з підсумкового рядка. Перевірка: відхилення від показника Дня 104 до 1,5 мс, або Max Vignettes і Max Decals знижено, доки так не стане. Числа записано в polish_plan.md."}, "lesson": "D91.4"}, {"text": {"en": "Make polish_compare.png (before and after from both bookmarks). Save L_District, then commit and push ('Polish rules: variety, vignettes, decals'). Check: the picture is in today's Work folder and the commit is on GitHub.", "uk": "Зроби polish_compare.png («до» і «після» з обох закладок). Збережи L_District, потім зроби коміт і надішли ('Polish rules: variety, vignettes, decals'). Перевірка: картинка в сьогоднішній папці Work, а коміт — на GitHub."}, "lesson": 3}, {"text": {"en": "Click Copy the day report, paste it into a new tutor chat, answer its questions and save its answer as summary.md in today's Work folder. Drag summary.md, polish_plan.md and polish_compare.png into today's hand-in folder (the button on this page); never a project or level folder. Check: the hand-in folder lists 3 files, each over 1 KB.", "uk": "Клацни «Копіювати звіт дня», встав у новий чат із тьютором, дай відповіді на його питання і збережи його відповідь як summary.md у сьогоднішній папці Work. Перетягни summary.md, polish_plan.md і polish_compare.png у папку здачі (кнопка на цій сторінці). Ніколи не перетягуй папку проєкту чи рівня. Перевірка: у папці здачі 3 файли, кожен більший за 1 КБ."}, "lesson": 1}], "assets": ["techart/code-style.md", "techart/street-dimensions.md"], "next": {"en": "Tomorrow (Day 107) validation measures what this polish costs along a flight route, and on Day 109 the dusk light recipe and these details star in your demo.", "uk": "Завтра (День 107) перевірка вимірює, скільки коштує це доведення вздовж маршруту прольоту, а в День 109 рецепт сутінкового світла і ці дрібниці стануть зірками твого демо."}}, "lessons": [{"title": {"en": "Variety without chaos: neighbours and corners", "uk": "Різноманітність без хаосу: сусіди й кути"}, "minutes": 40, "goals": [{"en": "Explain variety without chaos: change is welcome, but inside families and patterns a viewer can read.", "uk": "Пояснювати, що таке різноманітність без хаосу: зміни вітаються, але в межах родин і шаблонів, які глядач може прочитати."}, {"en": "Give Spawn Buildings a memory so no three neighbours share a style.", "uk": "Давати Spawn Buildings пам'ять, щоб жодні три сусіди не мали одного стилю."}, {"en": "Lift corner houses by one floor, as real towns often do at junctions.", "uk": "Піднімати кутові будинки на один поверх, як часто буває біля перехресть у справжніх містах."}], "doalong": [{"en": "Look at two of your photos and count the styles along one street: they change often but rarely repeat three times, and corner buildings are often taller. Write both rules in polish_plan.md. You see the reasons behind today's code.", "uk": "Подивись на два свої фото і порахуй стилі вздовж однієї вулиці: вони часто змінюються, але рідко повторюються тричі, а кутові будинки часто вищі. Запиши обидва правила в polish_plan.md. Має вийти: причини сьогоднішнього коду."}, {"en": "In Spawn Buildings add local variables Last Style (PDA_BuildingStyle) and Run Count (Integer). After a style is drawn: if it equals Last Style and Run Count is 2 or more, draw again with Pick Street Mix (a For Loop with Break, up to 3 tries, that breaks when the style differs).", "uk": "У Spawn Buildings додай локальні змінні Last Style (PDA_BuildingStyle) і Run Count (Integer). Після вибору стилю: якщо він дорівнює Last Style, а Run Count — 2 чи більше, вибери знову через Pick Street Mix (For Loop with Break, до 3 спроб, з виходом, коли стиль інший)."}, {"en": "Then set Run Count to Run Count + 1 when the style equals Last Style, otherwise to 1, and set Last Style. You see a memory of the last two houses.", "uk": "Потім постав Run Count на Run Count + 1, коли стиль дорівнює Last Style, інакше на 1, і задай Last Style. Має вийти: пам'ять про два останні будинки."}, {"en": "Sea Style plots are chosen by rule, not drawn: skip the test for them, so the waterfront keeps its style. Compile and Regenerate. You see mixed streets with no runs of three, and the waterfront unchanged.", "uk": "Ділянки Sea Style вибирає правило, а не жереб: для них пропусти перевірку, щоб набережна зберегла свій стиль. Клацни Compile і Regenerate. Має вийти: змішані вулиці без трійок поспіль, а набережна без змін."}, {"en": "Corner Lift: in Make Plots, when Dist is less than (Junction Clear + Plot Width) x 100 from either end of the road, add 1 to the plot's Floors after Apply Plot Rules and clamp it to Max Floors. Regenerate. You see the corners stand taller, like a frame round each block.", "uk": "Corner Lift: у Make Plots, коли Dist менше за (Junction Clear + Plot Width) × 100 від будь-якого кінця дороги, після Apply Plot Rules додай 1 до Floors ділянки й обмеж значенням Max Floors. Клацни Regenerate. Має вийти: кути вищі, як рамка навколо кожного кварталу."}, {"en": "Regenerate the same seed twice. You see the same district: the extra draws come from the same Build Stream in the same order every time.", "uk": "Двічі клацни Regenerate з тим самим зерном. Має вийти: той самий район. Додаткові вибори щоразу йдуть з того самого Build Stream у тому самому порядку."}], "play": {"en": "Chaos or calm: the tutor describes four streets (every house a different style and height; every house the same style; families of two styles with taller corners; random colours on identical houses). I say which reads as a real town from 60 m, and which rule makes it.", "uk": "Хаос чи спокій: тьютор описує чотири вулиці (кожен будинок іншого стилю й висоти; усі будинки одного стилю; родини з двох стилів і вищі кути; випадкові кольори на однакових будинках). Я кажу, яка з 60 м виглядає як справжнє місто і яке правило її дає."}, "video": {"search": "procedural buildings variation rules art direction"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Різноманітність без хаосу: сусіди й кути (Day 106, lesson 1 of 4). Today's build: Чотири правила доведення в BP_DistrictGenerator (No Triples із Corner Lift, Spawn Vignettes, Spawn Decals і перший тест сутінків) і доведений район «до і після».\nWhat I already know: День 105: District Generator v1 і рядки про доведення в review_day105.md; День 18: M_Decal_Master і MI_Decal_Algae, MI_Decal_SaltLine, MI_Decal_Puddle та MI_Decal_TyreTrack; Дні 68 і 89: Pick Street Mix, Bag і Build Stream; Дні 64 і 104: Night у MPC_World, BP_StreetLamp і орієнтир, що світиться; День 94: MF_GroundGrime і Wetness у MPC_World.\n\nBy the end of this lesson I can:\n1. Пояснювати, що таке різноманітність без хаосу: зміни вітаються, але в межах родин і шаблонів, які глядач може прочитати.\n2. Давати Spawn Buildings пам'ять, щоб жодні три сусіди не мали одного стилю.\n3. Піднімати кутові будинки на один поверх, як часто буває біля перехресть у справжніх містах.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: District Generator v1 будує цілий справжній район одним клацанням з одного зерна, звірений із твоїм проєктним документом. Today: Ти додаєш доведення, завдяки якому район здається спроєктованим: правила різноманітності, віньєтки-історії, сутінкове світло й автоматичний бруд. One encouraging line: Доведення — це місце, де око художника зустрічає нові навички програмування. Сьогодні довіряй обом.); 2 lines on why today matters and where it comes back, in plain words (from this: Різниця між згенерованим і спроєктованим містом — у правилах, яких глядач ніколи не помічає: жодних трьох однакових будинків поспіль, кути трохи вищі, велосипед біля дверей крамниці, вогкість уздовж морської стіни. Записана як правила, ця турбота з'являється в кожному зерні задарма. Арт-директори називають це розповіддю через оточення, а для технічного художника це ще чотири функції. It comes back: Завтра (День 107) перевірка вимірює, скільки коштує це доведення вздовж маршруту прольоту, а в День 109 рецепт сутінкового світла і ці дрібниці стануть зірками твого демо.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-106-district-polish-rules exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (No Triples, Corner Lift, віньєтки й декалі із запланованою помилкою (робиш на уроках)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Подивись на два свої фото і порахуй стилі вздовж однієї вулиці: вони часто змінюються, але рідко повторюються тричі, а кутові будинки часто вищі. Запиши обидва правила в polish_plan.md. Має вийти: причини сьогоднішнього коду.\n   2. У Spawn Buildings додай локальні змінні Last Style (PDA_BuildingStyle) і Run Count (Integer). Після вибору стилю: якщо він дорівнює Last Style, а Run Count — 2 чи більше, вибери знову через Pick Street Mix (For Loop with Break, до 3 спроб, з виходом, коли стиль інший).\n   3. Потім постав Run Count на Run Count + 1, коли стиль дорівнює Last Style, інакше на 1, і задай Last Style. Має вийти: пам'ять про два останні будинки. [screenshot]\n   4. Ділянки Sea Style вибирає правило, а не жереб: для них пропусти перевірку, щоб набережна зберегла свій стиль. Клацни Compile і Regenerate. Має вийти: змішані вулиці без трійок поспіль, а набережна без змін.\n   5. Corner Lift: у Make Plots, коли Dist менше за (Junction Clear + Plot Width) × 100 від будь-якого кінця дороги, після Apply Plot Rules додай 1 до Floors ділянки й обмеж значенням Max Floors. Клацни Regenerate. Має вийти: кути вищі, як рамка навколо кожного кварталу.\n   6. Двічі клацни Regenerate з тим самим зерном. Має вийти: той самий район. Додаткові вибори щоразу йдуть з того самого Build Stream у тому самому порядку. [screenshot]\n4. If a goal above ім виправ редиректори і збережи. Має вийти: декалі всередині плагіна, тож він переносить їх в інші проєкти."}, {"en": "Drag a Decal Actor from Place Actors onto a junction table and give it MI_Decal_Puddle.", "uk": "Перетягни Decal Actor з Place Actors на майданчик перехрестя і дай йому MI_Decal_Puddle."}, {"en": "Read its Details: Rotation (Y, the Pitch, reads -90: it points down) and Decal Size (often 128, 256, 256 cm: how far the box reaches each way from its centre; the actor's Scale multiplies it). You see a puddle on the table and the numbers that make it work.", "uk": "Прочитай його Details: Rotation (Y, тобто Pitch, показує -90: декаль дивиться вниз) і Decal Size (часто 128, 256, 256 см — наскільки коробка сягає в кожен бік від центру; Scale актора це множить). Має вийти: калюжа на майданчику і числа, завдяки яким вона працює."}, {"en": "Add Max Decals (Integer, default 60, Category Polish) and a function Spawn Decals.", "uk": "Додай Max Decals (Integer, типово 60, Category Polish) і функцію Spawn Decals."}, {"en": "Walls first: For Each over Plots, skipping gaps and the landmark, whose Sea Distance is below Sea Style Distance: Spawn Actor from Class (Decal Actor) at the world front + (0, 0, 60).", "uk": "Спершу стіни: For Each по Plots, пропускаючи прогалини й орієнтир, у яких Sea Distance менша за Sea Style Distance: Spawn Actor from Class (Decal Actor) у фронт у світі + (0, 0, 60)."}, {"en": "Then from its Return Value, Set Actor Rotation with Make Rotator Z (Yaw) = Yaw + 90, so its X points into the wall (always set a decal's rotation after spawning, then you know where it points).", "uk": "Потім з його Return Value — Set Actor Rotation з Make Rotator, де Z (Yaw) = Yaw + 90, щоб його X дивився в стіну. Завжди задавай обертання декалі після появи, тоді знаєш, куди вона дивиться."}, {"en": "Set Decal Material (drag from Return Value and search; it works on the actor's Decal component) with MI_Decal_Algae or MI_Decal_SaltLine, picked by the Build Stream.", і всередині плагіна, тож він переносить їх в інші проєкти.\n   2. Перетягни Decal Actor з Place Actors на майданчик перехрестя і дай йому MI_Decal_Puddle.\n   3. Прочитай його Details: Rotation (Y, тобто Pitch, показує -90: декаль дивиться вниз) і Decal Size (часто 128, 256, 256 см — наскільки коробка сягає в кожен бік від центру; Scale актора це множить). Має вийти: калюжа на майданчику і числа, завдяки яким вона працює.\n   4. Додай Max Decals (Integer, типово 60, Category Polish) і функцію Spawn Decals.\n   5. Спершу стіни: For Each по Plots, пропускаючи прогалини й орієнтир, у яких Sea Distance менша за Sea Style Distance: Spawn Actor from Class (Decal Actor) у фронт у світі + (0, 0, 60).\n   6. Потім з його Return Value — Set Actor Rotation з Make Rotator, де Z (Yaw) = Yaw + 90, щоб його X дивився в стіну. Завжди задавай обертання декалі після появи, тоді знаєш, куди вона дивиться.\n   7. Set Decal Material (потягни з Return Value і знайди пошуком; працює на компоненті Decal актора) з MI_Decal_Algae або MI_Decal_SaltLine, вибраним через Build Stream. [screenshot]\n   8. Set Actor Scale 3D (0.2, Bays × Bay Width × 50 / 256, 0.2): коробка близько 0,5 м углиб, завширшки з будинок і 1 м заввишки, від 10 см над ґрунтом. Add у Spawned. Клацни Regenerate. Має вийти: вогкі смуги вздовж фасадів до моря.\n   9. Запланована помилка: додай калюжі. For Each по Spawned, Cast To BP_JunctionTable; коли Random Float from Stream (Build Stream) менший за 0.35: Spawn Actor from Class (Decal Actor) у позицію майданчика + (0, 0, 22), Set Actor Rotation (0, 0, 0), бо калюжа лежить пласко, Set Decal Material MI_Decal_Puddle, Set Actor Scale 3D (0.5, 0.5, 0.5), Add у Spawned.\n   10. Клацни Regenerate. На майданчиках немає круглих калюж — щонайбільше тонкий мазок.\n   11. Порівняй і зміни одне: калюжа, поставлена вручну, показує Pitch -90, бо декаль проєктується вздовж осі X і має дивитися вниз, щоб дістати ґрунт.\n   12. У ланцюжку калюж постав Y (Pitch) у Make Rotator на -90, а Z (Yaw) — на Random Float in Range from Stream (0 to 360), і клацни Regenerate. Має вийти: круглі калюжі приблизно на третині майданчиків. Видали калюжу, поставлену вручну.\n   13. Рахуй кожну поставлену декаль і зупиняйся на Max Decals. Спитай тьютора, чому далекі дрібні декалі все одно можуть коштувати часу, і подивись на Fade Screen Size (День 18; Set Fade Screen Size працює на поставлених). Має вийти: ліміт і згасання, що тримають декалі дешевими. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Куди вона проєктується? Тьютор дає мені п'ять декалей з обертаннями (калюжа на 0, 0, 0; калюжа з Pitch -90; смуга на стіні з Yaw будинку; смуга на стіні з Yaw + 90; слід на дорозі з Pitch -90 і Yaw дороги). Для кожної я кажу, де вона видна, якщо видна взагалі. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; review (by tutor or art director) = огляд; see-why-fix note = нотатка «бачу, чому, як виправити»; credits line = рядок авторства; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; default value = типове значення; File Explorer = Провідник; mesh = меш; vertex / edge / face = вершина / ребро / грань; origin (and kit pivot) = origin — точка, за яку об'єкт ставлять і обертають; world origin / 3D cursor = центр світу / 3D-курсор; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor ": "What does the No Triples rule do?", "uk": "Що робить правило No Triples?"}, "options": [{"en": "Draws again from the Build Stream when a third neighbour in a row would share a style", "uk": "Вибирає знову з Build Stream, коли третій сусід поспіль мав би той самий стиль"}, {"en": "Removes every third house", "uk": "Прибирає кожен третій будинок"}, {"en": "Gives every house three floors", "uk": "Дає кожному будинку три поверхи"}, {"en": "Builds three seeds at once", "uk": "Будує три зерна одразу"}], "answer": 0, "explain": {"en": "Real streets change often but rarely repeat three times; the rule keeps families without monotony.", "uk": "Справжні вулиці часто змінюються, але рідко повторюються тричі. Правило зберігає родини без одноманітності."}}, {"q": {"en": "After adding vignettes, the houses of seed 1 changed compared with this morning. What is the likely cause?", "uk": "Після додавання віньєток будинки зерна 1 змінилися проти ранку. Яка причина найімовірніша?"}, "options": [{"en": "Vignettes always move houses", "uk": "Віньєтки завжди зсувають будинки"}, {"en": "The seed is broken", "uk": "Зерно зламане"}, {"en": "Spawn Vignettes ran before Spawn Buildings and used draws from the same stream, shifting the houses' draws; run it after", "uk": "Spawn Vignettes спрацювала раніше за Spawn Buildings і брала вибори з того самого потоку, зсунувши вибори будинків; запускай її після"}, {"en": "The decal cap", "uk": "Ліміт декалей"}], "answer": 2, "explain": {"en": "Every function that draws from one stream must run in a fixed order; new draws belong after the old ones.", "uk": "Кожна функція, що бере вибори з одного потоку, має працювати у фіксованому порядку. Нові вибори йдуть після старих."}}, {"q": {"en": "Why cap vignettes and decals with Max Vignettes and Max Decals?", "uk": "Навіщо обмежувати віньєтки й декалі через Max Vignettes і Max Decals?"}, "options": [{"en": "Unreal allows only 60 decals", "uk": "Unreal дозволяє лише 60 декалей"}, {"en": "Caps make them look better", "uk": "З лімітами вони краще виглядають"}, {"en": "Decal materials need a number", "uk": "Матеріалам декалей потрібне число"}, {"en": "Each one is an extra actor, so a cap keeps the cost known whatever the seed or the place", "uk": "Кожна з них — додатковий актор, тож ліміт тримає вартість відомою, хоч яке зерно чи місце"}], "answer": 3, "explain": {"en": "A big real place could ask for hundreds; a cap keeps the frame time predictable.", "uk": "Велике справжнє місце може попросити сотні. Ліміт тримає час кадру передбачуваним."}}, {"q": {"en": "In the dusk recipe, why lock the exposure?", "uk": "Навіщо в рецепті сутінків фіксувати експозицію?"}, "options": [{"en": "So the picture's brightness does not shift while you fly, and every shot matches", "uk": "Щоб яскравість картинки не змінювалася під час польоту і кожен кадр збігався"}, {"en": "To make the scene darker", "uk": "Щоб сцена стала темнішою"}, {"en": "The lamps need it", "uk": "Цього потребують ліхтарі"}, {"en": "The fog needs it", "uk": "Цього потребує туман"}], "answer": 0, "explain": {"en": "Auto exposure changes with what is on screen; a locked value keeps pairs and video shots comparable.", "uk": "Автоекспозиція змінюється з тим, що на екрані. Зафіксоване значення тримає пари кадрів і відео порівнянними."}}], "weekInfo": null, "morning": {"sofar": {"en": "District Generator v1 builds a whole real district from one click and one seed, checked against your design document.", "uk": "District Generator v1 будує цілий справжній район одним клацанням з одного зерна, звірений із твоїм проєктним документом."}, "today": {"en": "You add the polish that makes it feel designed: variety rules, storytelling vignettes, a dusk light and automated grime.", "uk": "Ти додаєш доведення, завдяки якому район здається спроєктованим: правила різноманітності, віньєтки-історії, сутінкове світло й автоматичний бруд."}, "cheer": {"en": "Polish is where your artist's eye meets your new programming skills; trust both today.", "uk": "Доведення — це місце, де око художника зустрічає нові навички програмування. Сьогодні довіряй обом."}, "quote": {"text": {"en": "To me every hour of the light and dark is a miracle.", "uk": "Для мене кожна година світла й темряви — диво."}, "author": {"en": "Walt Whitman", "uk": "Волт Вітмен"}, "source": "Miracles (poem), in Leaves of Grass, 1881 edition"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-106-district-polish-rules", "mapHref": "../../COURSE.html", "prevHref": "../Day-105-boss-district-generator-v1/START-HERE.html", "nextHref": "../Day-107-district-validation/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8. I am a beginner on Day 106. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me: when my Blueprint or script fails, ask for the error message or a screenshot of the graph, point to the line or node that is wrong and explain why, then let me fix it myself. Never write the whole tool for me.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: Сліди шин і перевірка вартості — самостійно (рецепт світла переходить на День 109).\nIt's part of: Чотири правила доведення в BP_DistrictGenerator (No Triples із Corner Lift, Spawn Vignettes, Spawn Decals і перший тест сутінків) і доведений район «до і після» (BP_DistrictGenerator і три Blueprint віньєток (BP_Vignette_Shop, BP_Vignette_Home, BP_Vignette_Quay) у /TechTools/District; L_District.).\nWhy it matters: Різниця між згенерованим і спроєктованим містом — у правилах, яких глядач ніколи не помічає: жодних трьох однакових будинків поспіль, кути трохи вищі, велосипед біля дверей крамниці, вогкість уздовж морської стіни. Записана як правила, ця турбота з'являється в кожному зерні задарма. Арт-директори називають це розповіддю через оточення, а для технічного художника це ще чотири функції. It comes back: Завтра (День 107) перевірка вимірює, скільки коштує це доведення вздовж маршруту прольоту, а в День 109 рецепт сутінкового світла і ці дрібниці стануть зірками твого демо.\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-106-district-polish-rules (on the drive I chose on Day 0).\nWhat I already know: День 105: District Generator v1 і рядки про доведення в review_day105.md; День 18: M_Decal_Master і MI_Decal_Algae, MI_Decal_SaltLine, MI_Decal_Puddle та MI_Decal_TyreTrack; Дні 68 і 89: Pick Street Mix, Bag і Build Stream; Дні 64 і 104: Night у MPC_World, BP_StreetLamp і орієнтир, що світиться; День 94: MF_GroundGrime і Wetness у MPC_World; today's lessons: Різноманітність без хаосу: сусіди й кути; Сліди історії: віньєтки за правилом; Світло для висоти дрона: рецепт сутінків; Автоматичний бруд і декалі та запланована помилка. Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- Спершу polish_plan.md: картинки «до» з обох закладок, рядки про доведення з review_day105.md і чотири правила, кожне з одним справжнім фото, яке показує навіщо.\n- Різноманітність: Spawn Buildings пам'ятає Last Style і Run Count. Коли вибраний стиль дав би третій поспіль будинок того самого стилю, вона вибирає знову з Build Stream (до 3 спроб). Будинки на набережній зберігають Sea Style. Corner Lift: ділянка, чия відстань уздовж дороги від будь-якого кінця менша за Junction Clear + Plot Width, отримує один додатковий поверх, але не більше за Max Floors.\n- Віньєтки: три Blueprint із пропсів набору, розставлених вручну (крамниця: велосипед, вазон, вивіска; дім: горщики, лавка, урна; причал: ящики, сіті, стовпчик). Кожен має Variant (Integer, 0–2, Expose on Spawn), що показує одну з трьох розстановок. Spawn Vignettes ставить віньєтку за 1 м перед будинком і за 1 м від кута з origin (кінець фасаду з меншим X) на вибраних ділянках: крамниці — 70 відсотків, доми — 25 відсотків, набір причалу — у межах Sea Style Distance. Зерно — з Build Stream, жодної в коридорі, ліміт — Max Vignettes (типово 40).\n- Світло: лише тест сутінків з уроку 3. Повний рецепт синьої години й картинки опівдні та в сутінках переходять на День 109, де вони потрібні для демо.\n- Декалі: M_Decal_Master, інстанси MI_Decal_* та їхні текстури переміщено в /TechTools/Kit/Decals. Spawn Decals ставить з Build Stream, із Set Actor Rotation після кожної появи: MI_Decal_Algae або MI_Decal_SaltLine уздовж низу фасадів до моря (Yaw + 90, щоб декаль проєктувалася в стіну), MI_Decal_Puddle приблизно на третині майданчиків перехресть і MI_Decal_TyreTrack уздовж проїзної частини BP_Road кожні 40–80 м (обидві з Pitch -90, проєкція вниз). Кожна додається в Spawned, ліміт — Max Decals (типово 60).\n- Заплановану помилку знайдено й виправлено. Калюжі з Set Actor Rotation 0, 0, 0 («калюжа лежить пласко») не дають круглих калюж, бо декаль проєктується вздовж власної осі X. Причину знайдено порівнянням з обертанням вручну поставленого Decal Actor (Pitch -90), виправлено через Pitch -90.\n- Те саме зерно й далі будує той самий район, Check Town показує 0 проблем, а stat unit з 120 м відрізняється від показника Дня 104 не більше ніж на 1,5 мс (або ліміти знижено, доки так не стане). polish_compare.png показує пари «до і після» з обох закладок.\n\nMy checklist (the same numbers show on my course page):\n1. Перевір, чи є результати сьогоднішніх уроків: No Triples і Corner Lift у Spawn Buildings, три Blueprint віньєток і Spawn Decals з виправленням калюж. Чогось бракує? Пройди зараз кроки «Разом із тьютором» того уроку (близько 25 хвилин): самостійна частина спирається на них. Слабкий ПК (16 ГБ оперативної пам'яті чи менше): під час роботи зменш об'єми PCG до 100 × 100 м, а для фінальних картинок збільш (див. розділ про слабкі ПК в ACCOUNTS-AND-INSTALLS.html). Напиши polish_plan.md у сьогоднішній папці Work з before_120m.png і before_street.png з обох закладок, рядками про доведення з review_day105.md і чотирма правилами, кожне зі справжнім фото. Перевірка: чотири правила, чотири фото і дві картинки «до». (from lesson 1)\n2. Додай No Triples у Spawn Buildings і клацни Regenerate. Перевірка: уздовж кожної вулиці жодні три сусіди не мають одного стилю, набережна зберігає свій стиль, а те саме зерно двічі будує той самий район. (from lesson 1)\n3. Додай Corner Lift і клацни Regenerate. Перевірка: будинки біля перехресть на поверх вищі за свій ряд, але не вищі за Max Floors, а лінія дахів піднімається на кутах. (from lesson 1)\n4. Збудуй BP_Vignette_Shop, BP_Vignette_Home і BP_Vignette_Quay, кожен із трьома розстановками. Перевірка: зміна Variant на поставленій копії показує іншу розстановку, а кожен пропс стоїть на ґрунті. (from lesson 2)\n5. Додай Spawn Vignettes і клацни Regenerate. Перевірка: віньєтки біля дверей крамниць, кілька біля домів, ящики й сіті на набережній, жодної в коридорі, не більше за Max Vignettes, а підсумковий рядок їх рахує. (from lesson 2)\n6. Додай у Spawn Decals декалі на стінах і клацни Regenerate. Перевірка: смуги водоростей чи солі вздовж низу фасадів до моря, не в повітрі й не на вулиці. (from lesson 4)\n7. Запланована помилка, з описом: додай калюжі з Set Actor Rotation 0, 0, 0 — круглих калюж немає. Порівняй із вручну поставленим Decal Actor, виправ на Pitch -90 і клацни Regenerate. Перевірка: калюжі блищать приблизно на третині майданчиків перехресть, а помилку, значення і зміну записано в polish_plan.md. (from lesson 4)\n8. Самостійно: сліди шин уздовж проїзної частини BP_Road кожні 40–80 м (Set Actor Rotation: Pitch -90 і Yaw дороги з Get Transform at Distance Along Spline), до межі Max Decals. Перевірка: сліди лежать уздовж головних проїзних частин і ніколи на тротуарах, провулках чи майданчиках. (from lesson 4)\n9. Двічі клацни Regenerate з тим самим зерном, потім Check Town. Перевірка: однакові картинки й 0 проблем. (from day 105, lesson 2)\n10. Вартість: stat unit з 120 м з усім доведенням і кількість віньєток і декалей з підсумкового рядка. Перевірка: відхилення від показника Дня 104 до 1,5 мс, або Max Vignettes і Max Decals знижено, доки так не стане. Числа записано в polish_plan.md. (from day 91, lesson 4)\n11. Зроби polish_compare.png («до» і «після» з обох закладок). Збережи L_District, потім зроби коміт і надішли ('Polish rules: variety, vignettes, decals'). Перевірка: картинка в сьогоднішній папці Work, а коміт — на GitHub. (from lesson 3)\n12. Клацни «Копіювати звіт дня», встав у новий чат із тьютором, дай відповіді на його питання і збережи його відповідь як summary.md у сьогоднішній папці Work. Перетягни summary.md, polish_plan.md і polish_compare.png у папку здачі (кнопка на цій сторінці). Ніколи не перетягуй папку проєкту чи рівня. Перевірка: у папці здачі 3 файли, кожен більший за 1 КБ. (from lesson 1)\n\nHow to help: ask which step number I'm on, then give me only the next step: the exact clicks and what I should see. When I send a screenshot, compare it with my reference, my sizes and the spec, and name one thing to fix at a time.\nCheck every save and export by reopening it before we move on:\n- a Blueprint or script: compile or run it once more and see it work, with no errors\n- a .md or .txt: open it with Notepad; the text is there, and the name doesn't end in .md.txt\nWhen I write \"готово\", and in any case before t  /* the dial around it: a ring with the progress arc and a label running along the rim */

 s+='<circle class="arc" cx="200" cy="200" r="176" stroke="url(#'+id+'g)" stroke-dasharray="'+(C*p).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 200 200)"/>';
 if(p>0){const A=-Math.PI/2+p*TAU;s+='<circle class="knob'+(p<1?' go':'')+'" cx="'+(200+176*Math.cos(A)).toFixed(1)+'" cy="'+(200+176*Math.sin(A)).toFixed(1)+'" r="7"/>'}

/* fix phase 1 (2026-10-22): the hand-in folder (a button when the roster has a link, else the folder path), the hand-in card,

const HIN=(D.handin||[]).map(v=>(v&&v.en)||(typeof v==='string'?v:'')).join(' ').toLowerCase(),hasClip=/\.mp4|clip/.test(HIN);

function nFiles(n){if(!n)return '';if(lang==='en')return ' · '+n+(n===1?' file':' files');const a=n%10,b=n%100;return ' · '+n+' '+(a===1&&b!==11?'файл':a>=2&&a<=4&&(b<12||b>14)?'файли':'файлів')}

function reportText(){let t=D.reportPrompt;const r=D.lessons.map((l,i)=>{const v=(st['r'+i]||'').trim();return v?'Lesson '+(i+1)+': '+v:''}).filter(Boolean);
 if(r.length)t+='\n\nMy lesson summaries, pasted from my course page:\n'+r.join('\n');

 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);

y.data.collections[ROOT].children:`. Рядок 3 (4): `problems = check(col)`."}, {"en": "Line 4 (4): `if problems:`. Line 5 (8): `log.append(f'- {col.name}: SKIPPED: ' + '; '.join(problems))`. Line 6 (8): `continue` (go on with the next collection). You see the first half of the loop.", "uk": "Рядок 4 (4): `if problems:`. Рядок 5 (8): `log.append(f'- {col.name}: SKIPPED: ' + '; '.join(problems))`. Рядок 6 (8): `continue` — перейти до наступної колекції. Має вийти перша половина циклу."}, {"en": "Line 7 (4): `path = os.path.join(OUT, col.name + '.fbx')` (the folder plus the file name). Line 8 (4): `log.append(f'- {col.name}: OK -> exports/{col.name}.fbx')`. Line 9 (4): `if not DRY_RUN: export(col, path)`. Line 10, at the left edge: `print('\\n'.join(log))` (\\n starts a new line). Run with DRY_RUN = True. You see four OK lines and no FBX files yet.", "uk": "Рядок 7 (4): `path = os.path.join(OUT, col.name + '.fbx')` — папка плюс назва файлу. Рядок 8 (4): `log.append(f'- {col.name}: OK -> exports/{col.name}.fbx')`. Рядок 9 (4): `if not DRY_RUN: export(col, path)`. Рядок 10 від лівого краю: `print('\\n'.join(log))` — \\n починає новий рядок. Запусти з DRY_RUN = True. Має вийти чотири рядки OK і поки жодного FBX."}, {"en": "Save the .blend, set DRY_RUN = False and run. You see four .fbx files appear in TechArt/Blender/exports. Keep every collection under EXPORT visible when you export: a hidden object is left out of a selection export. Set DRY_RUN = True again and save the script.", "uk": "Збережи .blend, встанови DRY_RUN = False і запусти. У TechArt/Blender/exports з'являються чотири файли .fbx. Під час експорту тримай кожну колекцію під EXPORT видимою: прихований об'єкт випадає з експорту виділеного. Поверни DRY_RUN = True і збережи скрипт."}], "play": {"en": "Settings match: the tutor reads out eight export options in plain words (only what I selected; meshes only; FBX All scaling; modifiers applied; face smoothing; copy textures; embed them; the file name). For each I point to the word in my export call that does it.", "uk": "Налаштування збігаються: тьютор простими словами читає вісім опцій експорту — лише виділене; лише меші; масштабування FBX All; модифікатори застосовано; згладжування граней; копіювати текстури; вбудувати їх; назва файлу. Для кожної покажи слово у своєму виклику експорту, що це робить."}, "video": {"search": "blender python export_scene.fbx use_selection batch export script"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Експорт, записаний кодом (Day 77, lesson 3 of 4). Today's build: export_kit.py і props_kit.blend: твої чотири вуличні пропси в одному файлі, по колекції на кожен. Їх експортує один скрипт із перевірками й журналом, а потім вони імпортуються в Unreal..\nWhat I already know: День 76: твої перші скрипти Blender — списки, if, функції та пробний запуск; День 4 і День 5: налаштування чистого експорту FBX, блоки UCX і твої чотири вуличні пропси. Пропущено ці дні? Візьми будь-які дві деталі набору з їхніми блоками UCX і CHECK_BASE = False з кроку 2.; День 6: твій чек-лист імпорту; День 74: check_assets.py, щоб перевіряти пропси в Unreal.\nEarlier today I already did: lesson 1 (Один файл, одна колекція на асет); lesson 2 (Перевірки, що пояснюють себе самі). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Перетворювати вікно експорту з Дня 4 на один виклик функції: bpy.ops.export_scene.fbx з іменованими налаштуваннями (name=value).\n2. Виділяти рівно об'єкти одного асета перед кожним експортом, бо експортер бере виділене.\n3. Запускати цикл: перевірка, журнал і експорт, лише коли пробний запуск вимкнено.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: 2 lines on why today matters and where it comes back, in plain words (from this: Експорт уручну — це щоразу ті самі вісім опцій, а одна пропущена (масштаб, згладжування, хибна назва блоку UCX) ламає пропс в Unreal. Скрипт експортує один пропс чи сотню однаково, не бере неготового й лишає журнал із причинами. Такий інструмент є в кожній студії, і людина, що вміє його писати й лагодити, тримає чистим увесь арт-конвеєр. It comes back: export_kit.py без змін експортує пропси з Geometry Nodes у День 78 і скелі із зерна в День 79 і День 80. У День 108 він стане частиною конвеєра, який описує посібник твого плагіна.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-77-export-kit-script exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (export_kit.py на твоїх чотирьох вуличних пропсах (крок за кроком на уроках)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Над тестовим циклом додай функцію експорту. Рядок 1: `def export(col, path):`. Рядок 2 (4): `bpy.ops.object.select_all(action='DESELECT')`. Рядок 3 (4): `for o in col.objects: o.select_set(True)` — меш і його блоки UCX; ця функція виділяє один асет. Рядок 4 (4): `bpy.ops.export_scene.fbx(filepath=path, use_selection=True, object_types={'MESH'},`, потім рядок 5 (8): `apply_scale_options='FBX_SCALE_ALL', use_mesh_modifiers=True, mesh_smooth_type='FACE',` і рядок 6 (8): `path_mode='COPY', embed_textures=True)`.\n   2. Кожне налаштування — одна опція вікна з Дня 4: Limit to Selected Objects, Object Types Mesh, Apply Scalings FBX All, Apply Modifiers, Smoothing Face, Path Mode Copy з Embed Textures. Якщо Blender напише, що mesh_smooth_type невідомий, видали це налаштування й скажи тьюторові: тоді Unreal лише попередить про згладжування. Функцію експорту завершено.\n   3. Заміни тестовий цикл справжнім. Рядок 1: `os.makedirs(OUT, exist_ok=True)` — створити папку exports, якщо її немає. Рядок 2: `for col in bpy.data.collections[ROOT].children:`. Рядок 3 (4): `problems = check(col)`. [screenshot]\n   4. Рядок 4 (4): `if problems:`. Рядок 5 (8): `log.append(f'- {col.name}: SKIPPED: ' + '; '.join(problems))`. Рядок 6 (8): `continue` — перейти до наступної колекції. Має вийти перша половина циклу.\n   5. Рядок 7 (4): `path = os.path.join(OUT, col.name + '.fbx')` — папка плюс назва файлу. Рядок 8 (4): `log.append(f'- {col.name}: OK -> exports/{col.name}.fbx')`. Рядок 9 (4): `if not DRY_RUN: export(col, path)`. Рядок 10 від лівого краю: `print('\\n'.join(log))` — \\n починає новий рядок. Запусти з DRY_RUN = True. Має вийти чотири рядки OK і поки жодного FBX.\n   6. Збережи .blend, встанови DRY_RUN = False і запусти. У TechArt/Blender/exports з'являються чотири файли .fbx. Під час експорту тримай кожну колекцію під EXPORT видимою: прихований об'єкт випадає з експорту виділеного. Поверни DRY_RUN = True і збережи скрипт. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Налаштування збігаються: тьютор простими словами читає вісім опцій експорту — лише виділене; лише меші; масштабування FBX All; модифікатори застосовано; згладжування граней; копіювати текстури; вбудувати їх; назва файлу. Для кожної покажи слово у своєму виклику експорту, що це робить. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; review (by tutor or art director) = огляд; checklist = чек-лист; credits line = рядок авторства; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; File Explorer = Провідник; mesh = меш; vertex / edge / face = вершина / ребро / грань; origin (and kit pivot) = origin — точка, за яку об'єкт ставлять і обертають; world origin / 3D cursor = центр світу / 3D-курсор; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); modifier = модифікатор; level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; collision / UCX collision box = колізія / блок UCX; material slot / node / pin = слот матеріалу / вузол / вхід; volume (PCG Volume, Post Process Volume) = об'єм; seed = зерно (налаштування Seed); keep-out zone / footprint test / grounding = зона-виняток / тест опори / посадка на ґрунт; kit / kit piece / part of one object = набір / деталь / частина; district / plot / plot plan = район / ділянка / план ділянки; harbour / quay / waterfront / pier = гавань / причал / набережна / пірс; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; vista / blockout / landmark = панорама / блокаут / орієнтир; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}, {"title": {"en": "A log, and the round trip into Unreal", "uk": "Журнал і шлях туди й назад через Unreal"}, "minutes": 40, "goals": [{"en": "Write a log file with open(...) inside a with block, so every run leaves a record of what was exported and what was skipped.", "uk": "Записувати файл журналу функцією open(...) у блоці with, щоб кожен запуск лишав запис про експортоване й пропущене."}, {"en": "Read a SKIPPED line and fix the asset at its source in Blender, then run again.", "uk": "Читати рядок SKIPPED і виправляти асет у джерелі в Blender, потім запускати знову."}, {"en": "Import the exports into Unreal and confirm them with check_assets.py.", "uk": "Імпортувати експортовані файли в Unreal і підтверджувати їх скриптом check_assets.py."}], "doalong": [{"en": "At the very bottom, replace the print line. Line 1: `with open(os.path.join(OUT, 'export_log.md'), 'w', encoding='utf-8') as f:` (open a text file for writing; with closes it safely). Line 2 (4): `f.write('# Export log (' + ('dry run' if DRY_RUN else 'exported') + ')\\n\\n')`.", "uk": "У самому низу заміни рядок print. Рядок 1: `with open(os.path.join(OUT, 'export_log.md'), 'w', encoding='utf-8') as f:` — відкрити текстовий файл для запису; with безпечно його закриє. Рядок 2 (4): `f.write('# Export log (' + ('dry run' if DRY_RUN else 'exported') + ')\\n\\n')`."}, {"en": "Line 3 (4): `f.write('\\n'.join(log) + '\\n')`. Line 4, at the left edge: `print('\\n'.join(log))`. Dry-run it. You see exports/export_log.md appear; open it in Notepad and read four OK lines under a heading.", "uk": "Рядок 3 (4): `f.write('\\n'.join(log) + '\\n')`. Рядок 4 від лівого краю: `print('\\n'.join(log))`. Зроби пробний запуск. З'являється exports/export_log.md. Відкрий його в Блокноті: під заголовком чотири рядки OK."}, {"en": "Move SM_LampPost 1 m along X and dry-run. You see SM_LampPost: SKIPPED: not at the world origin in the console and in the log.", "uk": "Пересунь SM_LampPost на 1 м уздовж X і зроби пробний запуск. У консолі й журналі з'являється SM_LampPost: SKIPPED: not at the world origin."}, {"en": "Type 0 in its X Location in the N panel and dry-run again: OK. (Ctrl+Z would first undo the dry run, because every script run is an undo step.) The log tells you what to fix before anything reaches Unreal.", "uk": "Введи 0 в X Location на панелі N і знову зроби пробний запуск: OK. Ctrl+Z спершу скасував би пробний запуск, бо кожен запуск скрипта — крок скасування. Журнал каже, що виправити, ще до того, як щось потрапить в Unreal."}, {"en": "In IslandCourse make Content/Tools/Day77, drag the four FBX files in and import them with your Day 6 checklist. Double-click SM_Bin and click Show > Simple Collision. You see your UCX boxes as green lines.", "uk": "В IslandCourse створи Content/Tools/Day77, перетягни туди чотири FBX і імпортуй їх за чек-листом з Дня 6. Двічі клацни SM_Bin і натисни Show > Simple Collision. Твої блоки UCX видно як зелені лінії."}, {"en": "Set FOLDER = '/Game/Tools/Day77' at the top of check_assets.py and run it as on Day 74, or click Check in EUW_TechTools. Open IslandCourse/Saved/TechTools/asset_report.md. You see no problem listed for the four meshes. Any problem it shows, you fix in props_kit.blend, export again with the same file name, then right-click the mesh in Unreal > Reimport.", "uk": "Встанови FOLDER = '/Game/Tools/Day77' на початку check_assets.py і запусти, як у День 74, або клацни Check в EUW_TechTools. Відкрий IslandCourse/Saved/TechTools/asset_report.md: для чотирьох мешів проблем немає. Якщо проблема є, виправ її в props_kit.blend, експортуй знову з тією самою назвою файлу, потім клацни правою кнопкою на меші в Unreal > Reimport."}], "play": {"en": "Log detective: the tutor shows me a log with six lines (two OK and four SKIPPED for different reasons). For each SKIPPED line I say what I would do in Blender, in which order, and which one I would fix first because it might hide the others.", "uk": "Детектив журналу: тьютор показує журнал із шести рядків — два OK і чотири SKIPPED з різних причин. Для кожного SKIPPED скажи, що зробиш у Blender і в якому порядку. Який виправиш першим, бо він може ховати решту?"}, "video": {"search": "unreal engine 5 import fbx ucx collision reimport from blender"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Журнал і шлях туди й назад через Unreal (Day 77, lesson 4 of 4). Today's build: export_kit.py і props_kit.blend: твої чотири вуличні пропси в одному файлі, по колекції на кожен. Їх експортує один скрипт із перевірками й журналом, а потім вони імпортуються в Unreal..\nWhat I already know: День 76: твої перші скрипти Blender — списки, if, функції та пробний запуск; День 4 і День 5: налаштування чистого експорту FBX, блоки UCX і твої чотири вуличні пропси. Пропущено ці дні? Візьми будь-які дві деталі набору з їхніми блоками UCX і CHECK_BASE = False з кроку 2.; День 6: твій чек-лист імпорту; День 74: check_assets.py, щоб перевіряти пропси в Unreal.\nEarlier today I already did: lesson 1 (Один файл, одна колекція на асет); lesson 2 (Перевірки, що пояснюють себе самі); lesson 3 (Експорт, записаний кодом). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Записувати файл журналу функцією open(...) у блоці with, щоб кожен запуск лишав запис про експортоване й пропущене.\n2. Читати рядок SKIPPED і виправляти асет у джерелі в Blender, потім запускати знову.\n3. Імпортувати експортовані файли в Unreal і підтверджувати їх скриптом check_assets.py.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: 2 lines on why today matters and where it comes back, in plain words (from this: Експорт уручну — це щоразу ті самі вісім опцій, а одна пропущена (масштаб, згладжування, хибна назва блоку UCX) ламає пропс в Unreal. Скрипт експортує один пропс чи сотню однаково, не бере неготового й лишає журнал із причинами. Такий інструмент є в кожній студії, і людина, що вміє його писати й лагодити, тримає чистим увесь арт-конвеєр. It comes back: export_kit.py без змін експортує пропси з Geometry Nodes у День 78 і скелі із зерна в День 79 і День 80. У День 108 він стане частиною конвеєра, який описує посібник твого плагіна.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-77-export-kit-script exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (export_kit.py на твоїх чотирьох вуличних пропсах (крок за кроком на уроках)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. У самому низу заміни рядок print. Рядок 1: `with open(os.path.join(OUT, 'export_log.md'), 'w', encoding='utf-8') as f:` — відкрити текстовий файл для запису; with безпечно його закриє. Рядок 2 (4): `f.write('# Export log (' + ('dry run' if DRY_RUN else 'exported') + ')\\n\\n')`.\n   2. Рядок 3 (4): `f.write('\\n'.join(log) + '\\n')`. Рядок 4 від лівого краю: `print('\\n'.join(log))`. Зроби пробний запуск. З'являється exports/export_log.md. Відкрий його в Блокноті: під заголовком чотири рядки OK.\n   3. Пересунь SM_LampPost на 1 м уздовж X і зроби пробний запуск. У консолі й журналі з'являється SM_LampPost: SKIPPED: not at the world origin. [screenshot]\n   4. Введи 0 в X Location на панелі N і знову зроби пробний запуск: OK. Ctrl+Z спершу скасував би пробний запуск, бо кожен запуск скрипта — крок скасування. Журнал каже, що виправити, ще до того, як щось потрапить в Unreal.\n   5. В IslandCourse створи Content/Tools/Day77, перетягни туди чотири FBX і імпортуй їх за чек-листом з Дня 6. Двічі клацни SM_Bin і натисни Show > Simple Collision. Твої блоки UCX видно як зелені лінії.\n   6. Встанови FOLDER = '/Game/Tools/Day77' на початку check_assets.py і запусти, як у День 74, або клацни Check в EUW_TechTools. Відкрий IslandCourse/Saved/TechTools/asset_report.md: для чотирьох мешів проблем немає. Якщо проблема є, виправ її в props_kit.blend, експортуй знову з тією самою назвою файлу, потім клацни правою кнопкою на меші в Unreal > Reimport. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Детектив журналу: тьютор показує журнал із шести рядків — два OK і чотири SKIPPED з різних причин. Для кожного SKIPPED скажи, що зробиш у Blender і в якому порядку. Який виправиш першим, бо він може ховати решту? Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; review (by tutor or art director) = огляд; checklist = чек-лист; credits line = рядок авторства; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; File Explorer = Провідник; mesh = меш; vertex / edge / face = вершина / ребро / грань; origin (and kit pivot) = origin — точка, за яку об'єкт ставлять і обертають; world origin / 3D cursor = центр світу / 3D-курсор; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); modifier = модифікатор; level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; collision / UCX collision box = колізія / блок UCX; material slot / node / pin = слот матеріалу / вузол / вхід; seed = зерно (налаштування Seed); kit / kit piece / part of one object = набір / деталь / частина; district / plot / plot plan = район / ділянка / план ділянки; harbour / quay / waterfront / pier = гавань / причал / набережна / пірс; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; vista / blockout / landmark = панорама / блокаут / орієнтир; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}], "handin": [{"en": "summary.md", "uk": "summary.md (звіт дня)"}, {"en": "export_kit.py and export_log.md (from a real export) (→ Day 80)", "uk": "export_kit.py та export_log.md (зі справжнього експорту) (→ День 80)"}, {"en": "import_day77.png (the four props in L_Day77, Player Collision view) (proof)", "uk": "import_day77.png (чотири пропси в L_Day77, вид Player Collision) (доказ)"}], "goal": {"en": "By the end of today you have export_kit.py: one run checks every asset collection in props_kit.blend (name, scale, world origin, base and UCX boxes), exports the good ones as FBX with your Day 4 settings, skips the others with a reason, and writes export_log.md; your four street props come out of it and import cleanly into Unreal.", "uk": "До кінця дня ти матимеш export_kit.py. Один запуск перевіряє кожну колекцію асета в props_kit.blend: назву, масштаб, центр світу, основу й блоки UCX. Придатні він експортує як FBX з твоїми налаштуваннями з Дня 4, решту пропускає з причиною і пише export_log.md. Твої чотири вуличні пропси проходять через нього й чисто імпортуються в Unreal."}, "uses": [{"en": "Day 76: your first Blender scripts: lists, if, functions and the dry run", "uk": "День 76: твої перші скрипти Blender — списки, if, функції та пробний запуск"}, {"en": "Days 4 and 5: the clean FBX export settings, UCX boxes and your four street props (skipped them? use any two of your kit pieces with their UCX boxes, and CHECK_BASE = False from step 2)", "uk": "День 4 і День 5: налаштування чистого експорту FBX, блоки UCX і твої чотири вуличні пропси. Пропущено ці дні? Візьми будь-які дві деталі набору з їхніми блоками UCX і CHECK_BASE = False з кроку 2."}, {"en": "Day 6: your import checklist", "uk": "День 6: твій чек-лист імпорту"}, {"en": "Day 74: check_assets.py, to check the props in Unreal", "uk": "День 74: check_assets.py, щоб перевіряти пропси в Unreal"}], "quiz": [{"q": {"en": "Your log says SM_Bench: SKIPPED: UCX names do not match: UCX_Bench_00. What do you change?", "uk": "Журнал пише SM_Bench: SKIPPED: UCX names do not match: UCX_Bench_00. Що змінити?"}, "options": [{"en": "Rename the bench to Bench", "uk": "Перейменувати лавку на Bench"}, {"en": "Rename the box to UCX_SM_Bench_00", "uk": "Перейменувати блок на UCX_SM_Bench_00"}, {"en": "Delete the box", "uk": "Видалити блок"}, {"en": "Set DRY_RUN to False", "uk": "Встановити DRY_RUN на False"}], "answer": 1, "explain": {"en": "Unreal pairs a UCX box with its mesh by the full name after UCX_, so the box must be called UCX_SM_Bench_00.", "uk": "Unreal пов'язує блок UCX з мешем за повною назвою після UCX_, тож блок має зватися UCX_SM_Bench_00."}}, {"q": {"en": "What does bpy.path.abspath('//exports') point to?", "uk": "На що вказує bpy.path.abspath('//exports')?"}, "options": [{"en": "The exports folder next to the saved .blend file", "uk": "На папку exports поруч зі збереженим файлом .blend"}, {"en": "A folder called exports on drive C", "uk": "На папку exports на диску C"}, {"en": "Blender's install folder", "uk": "На папку встановлення Blender"}, {"en": "The last folder you exported to", "uk": "На останню папку, у яку виконано експорт"}], "answer": 0, "explain": {"en": "// means 'the folder of this .blend file'; save the file first, or the path points somewhere unexpected.", "uk": "// означає «папка цього файлу .blend». Спершу збережи файл, інакше шлях вестиме невідомо куди."}}, {"q": {"en": "Why does export() select one collection's objects before it calls the exporter?", "uk": "Чому export() виділяє об'єкти однієї колекції, перш ніж викликати експортер?"}, "options": [{"en": "Selecting makes the export faster", "uk": "Виділення пришвидшує експорт"}, {"en": "The exporter can't see unselected meshes", "uk": "Експортер не бачить невиділених мешів"}, {"en": "So the log can count them", "uk": "Щоб журнал міг їх порахувати"}, {"en": "use_selection=True exports only the selection, so each FBX gets one asset and its boxes", "uk": "use_selection=True експортує лише виділене, тож кожен FBX отримує один асет і його блоки"}], "answer": 3, "explain": {"en": "With use_selection=True the exporter takes what is selected, so selecting one collection at a time gives one clean FBX per asset.", "uk": "З use_selection=True експортер бере виділене, тож якщо виділяти одну колекцію за раз, виходить один чистий FBX на асет."}}, {"q": {"en": "Which check catches a prop that would arrive in Unreal floating 20 cm above the floor?", "uk": "Яка перевірка ловить пропс, що в Unreal висів би на 20 см над підлогою?"}, "options": [{"en": "The SM_ prefix check", "uk": "Перевірка префікса SM_"}, {"en": "The scale check", "uk": "Перевірка масштабу"}, {"en": "The base check: lowest point more than 1 cm from the origin", "uk": "Перевірка основи: найнижча точка далі ніж 1 см від origin"}, {"en": "The UCX check", "uk": "Перевірка UCX"}], "answer": 2, "explain": {"en": "If the lowest vertex is 20 cm above the origin, the mesh stands 20 cm above whatever you drop it on.", "uk": "Якщо найнижча вершина на 20 см вище за origin, меш стоятиме на 20 см вище за поверхню, на яку його ставлять."}}, {"q": {"en": "A dry run prints four OK lines but the exports folder has no FBX files. Is something broken?", "uk": "Пробний запуск друкує чотири рядки OK, але в папці exports немає FBX. Щось зламалося?"}, "options": [{"en": "Yes: the export function failed", "uk": "Так: функція експорту збоїть"}, {"en": "No: a dry run checks and logs but exports nothing", "uk": "Ні: пробний запуск перевіряє й пише журнал, але нічого не експортує"}, {"en": "Yes: the folder is wrong", "uk": "Так: папка хибна"}, {"en": "No: Blender exports later, when you save", "uk": "Ні: Blender експортує пізніше, під час збереження"}], "answer": 1, "explain": {"en": "That is exactly what DRY_RUN = True promises; switch it off only after the log reads right.", "uk": "Саме це й обіцяє DRY_RUN = True. Вимикай його лише тоді, коли журнал виглядає правильно."}}], "weekInfo": null, "morning": {"sofar": {"en": "You can write Blender scripts that build, report and fix a scene, with a dry run before every change.", "uk": "Ти вмієш писати скрипти Blender, що будують, звітують і виправляють сцену, з пробним запуском перед кожною зміною."}, "today": {"en": "You write export_kit.py, a tool that checks every prop, exports the good ones the same way every time and logs the rest.", "uk": "Ти пишеш export_kit.py — інструмент, що перевіряє кожен пропс, щоразу однаково експортує придатні й записує решту в журнал."}, "cheer": {"en": "Every line you write today saves you clicks for the rest of the course; when the log says SKIPPED, that is your tool doing its job.", "uk": "Кожен рядок, написаний сьогодні, заощадить тобі кліки до кінця курсу. Коли журнал пише SKIPPED, це твій інструмент робить свою справу."}, "quote": {"text": {"en": "Lost time is never found again.", "uk": "Втрачений час ніколи не знайдеш."}, "author": {"en": "Benjamin Franklin", "uk": "Бенджамін Франклін"}, "source": "The Way to Wealth (preface to Poor Richard's Almanack), 1758"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-77-export-kit-script", "mapHref": "../../COURSE.html", "prevHref": "../Day-76-blender-python-from-zero/START-HERE.html", "nextHref": "../Day-78-geometry-nodes-planter/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Blender 5.x and Unreal Engine 5.8. I am a beginner on Day 77. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me: when my Blueprint or script fails, ask for the error message or a screenshot of the graph, point to the line or node that is wrong and explain why, then let me fix it myself. Never write the whole tool for me.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: Самостійно: скрипт на деталях набору гавані, перевірений перемикачем CHECK_BASE для деталей з правилом origin набору.\nIt's part of: export_kit.py і props_kit.blend: твої чотири вуличні пропси в одному файлі, по колекції на кожен. Їх експортує один скрипт із перевірками й журналом, а потім вони імпортуються в Unreal. (TechArt/Blender/props_kit.blend і скрипт TechArt/Blender/scripts/export_kit.py; файли FBX і export_log.md у TechArt/Blender/exports. В Unreal — Content/Tools/Day77 і рівень L_Day77.).\nWhy it matters: Експорт уручну — це щоразу ті самі вісім опцій, а одна пропущена (масштаб, згладжування, хибна назва блоку UCX) ламає пропс в Unreal. Скрипт експортує один пропс чи сотню однаково, не бере неготового й лишає журнал із причинами. Такий інструмент є  for(let i=0;i<=110;i++){const t=i/110,a=t0+t*turns*TAU,s=1.1-t*.98,q=pt(a,s,0);P.push(q);if(last&&t<=(last-1)/11+1e-9)D.push(q)}
 o+='<path class="rt" d="'+smooth(P,false)+'"/>';
 if(D.length>1)o+='<path class="rtd" d="'+smooth(D,false)+'"/>';
 for(let w=1;w<=12;w++){const c=state(w),{a,s}=wp(w),q=pt(a,s,0),lx=q[0]+(Math.cos(a)>=0?15:-15),an=Math.cos(a)>=0?'start':'end';
  o+='<g class="w '+c+'">'+(c==='n'?'<circle class="halo" cx="'+f(q[0])+'" cy="'+f(q[1])+'" r="12"/>':'')+'<circle class="dot" cx="'+f(q[0])+'" cy="'+f(q[1])+'" r="'+(c==='p'?4.5:c==='n'?8:6)+'"/><text x="'+f(lx)+'" y="'+f(q[1]+5.5)+'" text-anchor="'+an+'">'+String(w).padStart(2,'0')+'</text></g>'}
 /* the dial around it: a ring with the progress arc and a label running along the rim */
 const C=2*Math.PI*176,p=Math.max(0,Math.min(1,pct||0)),id='rim'+Math.random().toString(36).slice(2,7);
 let s='<svg class="dial" viewBox="0 0 400 400" aria-hidden="true" focusable="false"><defs><linearGradient id="'+id+'g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--acc2)"/><stop offset="1" style="stop-color:var(--acc)"/></linearGradient><path id="'+id+'" d="M200 200m-191 0a191 191 0 1 1 382 0a191 191 0 1 1-382 0"/></defs>';
 s+='<circle class="face" cx="200" cy="200" r="168"/><circle class="track" cx="200" cy="200" r="176"/>';
 s+='<circle class="arc" cx="200" cy="200" r="176" stroke="url(#'+id+'g)" stroke-dasharray="'+(C*p).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 200 200)"/>';
 if(p>0){const A=-Math.PI/2+p*TAU;s+='<circle class="knob'+(p<1?' go':'')+'" cx="'+(200+176*Math.cos(A)).toFixed(1)+'" cy="'+(200+176*Math.sin(A)).toFixed(1)+'" r="7"/>'}
 if(label)s+='<text class="rimt"><textPath href="#'+id+'" startOffset="25%" text-anchor="middle">'+label+'</textPath></text>';
 s+='<svg class="topo" x="40" y="62" width="320" height="276" viewBox="40 20 520 370">'+o+'</svg>';
 return s+'</svg>'}

function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2600)}
async function cp(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e2){}a.remove()}toast(u('copied'))}
function tagTxt(v){v=String(v);const m=v.match(/^D(\d+)\.(\d+)$/i);return m?u('day')+' '+m[1]+', '+u('lesson')+' '+m[2]:u('lesson')+' '+v}
function fbCard(){const f=FB[D.day];if(!f)return '';
 if(f.s==='reviewed'){try{const z=fbSeen();if(z[D.day]!==f.at){z[D.day]=f.at;localStorage.setItem(fbSeenKey,JSON.stringify(z))}}catch(e){}
  return '<section class="card glass fbcard">'+lab(u('fbTitle'),'ok')+'<div class="row" style="align-items:baseline;gap:12px"><span class="eyebrow">'+u('fbScore')+'</span><span class="big">'+esc(f.score)+'/'+esc(f.max||10)+'</span></div>'+(fbNote(f)?'<p class="note">'+esc(fbNote(f))+'</p>':'')+'<p class="muted">'+u('fbFull')+(D.handinUrl?': <a href="'+esc(D.handinUrl)+'" target="_blank" rel="noopener">'+u('hOpen')+'</a>':': <code>'+esc(D.workPath)+'</code>')+'</p></section>'}
 return '<section class="card glass fbcard">'+lab(u('fbTitle'),f.s==='missing'?'':'ok')+'<p class="note">'+u(f.s==='missing'?'fbMiss':'fbWait')+'</p>'+(f.s==='missing'?hf():'')+'</section>'}
/* fix phase 1 (2026-10-22): the hand-in folder (a button when the roster has a link, else the folder path), the hand-in card,
   Day 0's "Before lesson 1", the checks before handing in, the Questions card, and the day report with the pasted lesson summaries */
const HIN=(D.handin||[]).map(v=>(v&&v.en)||(typeof v==='string'?v:'')).join(' ').toLowerCase(),hasClip=/\.mp4|clip/.test(HIN);
function hItem(v){return x(v)}
function hList(){return '<ul class="ticks">'+(D.handin||[]).map(v=>'<li>'+lk(hItem(v))+'</li>').join('')+'</ul>'}
const NFILES=new Set((HIN.match(/[\w-]+\.(?:blend|glb|fbx|png|jpe?g|md|txt|mp4|csv|zip|pdf|webp|kra|psd|tga|exr|json|py|uasset|umap)\b/g)||[])).size;
function nFiles(n){if(!n)return '';if(lang==='en')return ' · '+n+(n===1?' file':' files');const a=n%10,b=n%100;return ' · '+n+' '+(a===1&&b!==11?'файл':a>=2&&a<=4&&(b<12||b>14)?'файли':'файлів')}
function hf(){return D.handinUrl?'<div class="row"><a class="btn s" href="'+esc(D.handinUrl)+'" target="_blank" rel="noopener">'+ic('folder')+u('hOpen')+'</a></div>':'<p class="path">'+ic('folder')+'<span>'+u('hPath')+' <code>'+esc(D.workPath)+'</code></span></p>'}
function handinCard(){if(!D.handin||!D.handin.length)return '';return '<section class="card glass handin">'+lab(u('hTitle')+nFiles(NFILES),'ok')+hList()+hf()+'<p class="muted" style="margin:12px 0 0">'+u('hNote')+'</p></section>'}
function beforeCard(){if(!D.before||!D.before.length)return '';return '<section class="card glass before">'+lab(u('before'),'gold')+list(D.before,'ol','steps')+'</section>'}
function chkList(){const a=[];if(HIN.indexOf('.blend')>=0)a.push('chk1');if(/\.(glb|fbx)\b/.test(HIN))a.push('chk2');a.push('chk3');if(hasClip)a.push('chk4');return '<h3>'+u('chk')+'</h3><ol class="steps">'+a.map(k=>'<li>'+u(k)+'</li>').join('')+'</ol>'}
function qCard(){return '<section class="card glass qcard">'+lab(u('qTitle'))+'<ul class="ticks"><li>'+u('q1')+'</li><li>'+u('q2')+'</li><li>'+u('q3')+'</li><li>'+u('q4')+'</li><li>'+u('q5')+'</li></ul></section>'}
function reportText(){let t=D.reportPrompt;const r=D.lessons.map((l,i)=>{const v=(st['r'+i]||'').trim();return v?'Lesson '+(i+1)+': '+v:''}).filter(Boolean);
 if(r.length)t+='\n\nMy lesson summaries, pasted from my course page:\n'+r.join('\n');
 if(st.qs1)t+='\nMy first score in the Check yourself quiz: '+st.qs1[0]+' of '+st.qs1[1]+'.';
 return t}
function qDone(){return D.quiz&&D.quiz.length&&st.qa&&D.quiz.every((q,i)=>st.qa[i]!=null)}
function prog(){const Q=(D.quiz&&D.quiz.length)?1:0,L=D.lessons.length,C=D.build.steps.length;let n=0;D.lessons.forEach((l,i)=>{if(st['q'+i])n++});D.build.steps.forEach((s,i)=>{if(st['c'+i])n++});if(Q&&qDone())n++;return (L+C+Q)?n/(L+C+Q):0}
function qScore(){let n=0;D.quiz.forEach((q,i)=>{if((st.qa||{})[i]===q.answer)n++});return n}
function pick(i,k){st.qa=st.qa||{};if(st.qa[i]!=null)return;st.qa[i]=k;if(qDone()){st.qs=[qScore(),D.quiz.length];if(!st.qs1)st.qs1=st.qs.slice()}save();render();const e=document.getElementById('e'+i);if(e)e.focus({preventScroll:true})}
function retry(){st.qa={};delete st.qs;save();render();const e=document.getElementById('o0_0');if(e)e.focus()}
const isBoss=!!(D.build&&D.build.boss&&D.build.boss.length),isFin=D.day===D.total;
document.body.className=isFin?'fin':isBoss?'boss':'';
const lk=s=>esc(s).replace(/https?:\/\/[^\s<']*[^\s<.,;:)']/g,m=>'<a href="'+m+'" target="_blank" rel="noopener">'+m+'</a>');
function list(a,tag,cls){return '<'+tag+(cls?' class="'+cls+'"':'')+'>'+(a||[]).map(i=>'<li>'+lk(x(i))+'</li>').join('')+'</'+tag+'>'}
const lab=(t,k)=>'<div class="lab'+(k?' k-'+k:'')+'"><span class="dotc"></span>'+t+'</div>';
const kn=n=>'<span class="kn">'+ic(n)+'</span>';
const slider=p=>'<div class="slider"><i style="width:calc('+p+'% - 6px)"></i><b style="left:clamp(13px,'+p+'%,calc(100% - 13px))"></b></div>';
function quiz(){if(!D.quiz||!D.quiz.length)return '';const a=st.qa||{};let ok=0;const L=u('letters');
 const pips='<div class="pips well" aria-hidden="true">'+D.quiz.map((q,i)=>'<i class="'+(a[i]==null?'':a[i]===q.answer?'r':'w')+'"></i>').join('')+'</div>';
 const qs=D.quiz.map((q,i)=>{const c=a[i];if(c===q.answer)ok++;return '<div class="qz"><p class="qq"><span class="qn">'+(i+1)+'</span><span>'+lk(x(q.q))+'</span></p>'+q.options.map((o,k)=>{let cls='opt',mk='<span></span>';if(c!=null){if(k===q.answer){cls+=' right';mk=ic('check','mk')}else if(k===c){cls+=' wrong';mk=ic('x','mk')}}return '<button class="'+cls+'" id="o'+i+'_'+k+'"'+(c!=null?' disabled':'')+' onclick="pick('+i+','+k+')"><span class="lt">'+(L[k]||k+1)+'</span><span>'+esc(x(o))+'</span>'+mk+'</button>'}).join('')+(c!=null?'<p class="exp '+(c===q.answer?'r':'w')+'" id="e'+i+'" tabindex="-1"><b>'+(c===q.answer?u('right'):u('wrong'))+'</b>'+lk(x(q.explain))+'</p>':'')+'</div>'}).join('');
 return '<section class="card glass quiz">'+lab(u('quiz'),'gold')+'<p class="muted" style="margin:-6px 0 14px">'+u('quizSub')+'</p>'+pips+qs+(qDone()?'<div class="score well" role="status"><span class="eyebrow">'+u('score')+'</span><span class="lcd" aria-label="'+ok+' / '+D.quiz.length+'">'+seg(ok+'/'+D.quiz.length)+'</span>'+(st.qs1?'<span class="muted">'+u('first')+': '+st.qs1[0]+'/'+st.qs1[1]+'</span>':'')+'<div class="row"><button class="btn ghost" id="retry" onclick="retry()">'+u('retry')+'</button></div></div>':'')+'</section>'}
function vid(v){if(!v)return '';const link=v.url?'<a href="'+esc(v.url)+'" target="_blank" rel="noopener">'+esc(x(v.title)||v.url)+'</a>'+(v.channel?' <span class="muted">· '+esc(v.channel)+(v.length?' · '+esc(v.length):'')+'</span>':''):'';const s=v.search?'<a href="https://www.youtube.com/results?search_query='+encodeURIComponent(v.search)+'" target="_blank" rel="noopener">'+u('noVid')+': '+esc(v.search)+'</a>':'';const alt=v.alt&&v.alt.url?'<br><span class="eyebrow">UA</span> <a href="'+esc(v.alt.url)+'" target="_blank" rel="noopener">'+esc(v.alt.title||v.alt.url)+'</a>'+(v.alt.channel?' <span class="muted">· '+esc(v.alt.channel)+'</span>':''):'';return '<div class="vid well">'+kn('play')+'<div><b>'+u('more')+'?</b><br>'+(link||s)+alt+(link&&s?'<br><span class="muted" style="font-size:14px">'+s+'</span>':'')+'</div></div>'}
function morning(){const m=D.morning;if(!m)return '';const q=m.quote||{};
 let shelf='';if(D.day>0){shelf='<div class="shelf" aria-hidden="true">';let g='';for(let d=0;d<D.day;d++){let p=0;try{p=(JSON.parse(localStorage.getItem('devteam:'+D.learner+':'+d))||{}).pct||0}catch(e){}g+='<i class="'+(p>=1?'d':'')+(d>0&&d%5===0?' bs':'')+'"></i>';if(d%5===0||d===D.day-1){shelf+='<span class="wkg">'+g+'</span>';g=''}}shelf+='</div>'}
 const qt=lang==='uk'&&q.original?q.original:x(q.text);
 return '<section class="card glass morning"><div class="mgrid">'+(m.sofar?'<div>'+lab(u('sofar'),'gold')+shelf+'<p class="mtxt">'+lk(x(m.sofar))+'</p></div>':'')+(m.today?'<div>'+lab(u('todayL'))+'<p class="mtxt">'+lk(x(m.today))+'</p></div>':'')+'</div>'+(m.cheer?'<p class="cheer">'+esc(x(m.cheer))+'</p>':'')+(qt?'<figure class="quote well">'+kn('quote')+'<blockquote>'+esc(qt)+'</blockquote>'+(q.author?'<figcaption>'+esc(x(q.author))+'</figcaption>':'')+'</figure>':'')+'</section>'}

function toggleLang(){setLang(lang==='uk'?'en':'uk')}
/* keep open sections and keyboard focus across re-renders */
const openD=new Set();
function tg(e){if(e.open)openD.add(e.id);else openD.delete(e.id)}
const op=id=>openD.has(id)?' open':'';

 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);
 const b=D.build,P=Math.round(prog()*100);
 document.getElementById('top').innerHTML='<div class="topin glass"><a class="maplink" href="'+esc(D.mapHref)+'">'+kn('map')+u('map')+'</a><div class="crumb"><b>'+esc(x(D.learnerName))+'</b><span>'+u('week')+' '+D.week+'</span><span>'+u('day')+' '+D.day+' '+u('of')+' '+D.total+'</span></div>'+controls(lang,'setLang')+'</div><div class="tline"><i style="width:'+P+'%"></i></div>';
 const state=w=>w<D.week?'b':w===D.week?'n':'p';
 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 let wk='';if(D.weekInfo){const w=D.weekInfo;wk='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}

 h+=handinCard();h+=beforeCard();

 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];

 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+hList()+chkList()+(hasClip?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<h3>1 · '+u('copyR')+'</h3><p class="muted">'+u('report')+'</p><div class="row"><button class="btn ghost" onclick="cp(reportText())">'+ic('copy')+u('copyR')+'</button></div><h3>2 · '+u('ship')+'</h3>'+hf()+'<p class="muted" style="margin:12px 0 0">'+u('hNote')+'</p></section>';

 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();

<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 77</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

<script id="data" type="application/json">{"learner": "ib-misha-873821eb", "learnerName": {"en": "Misha", "uk": "Міша"}, "day": 77, "week": 16, "total": 110, "title": {"en": "export_kit.py: every prop exported clean, checked and logged", "uk": "export_kit.py: кожен пропс експортовано чисто, перевірено й записано в журнал"}, "theme": {"en": "Week 16: Blender Python and Geometry Nodes", "uk": "Тиждень 16: Blender Python і Geometry Nodes"}, "build": {"item": {"en": "export_kit.py and props_kit.blend: your four street props in one file, one collection each, exported by one script with checks and a log, then imported into Unreal", "uk": "export_kit.py і props_kit.blend: твої чотири вуличні пропси в одному файлі, по колекції на кожен. Їх експортує один скрипт із перевірками й журналом, а потім вони імпортуються в Unreal."}, "why": {"en": "Exporting by hand means setting the same eight options every time, and one missed option (scale, smoothing, a badly named UCX box) breaks a prop in Unreal. A script exports one prop or a hundred the same way, refuses what is not ready, and leaves a log that says why. Every studio has a tool like this, and the person who can write and fix it keeps the whole art pipeline clean.", "uk": "Експорт уручну — це щоразу ті самі вісім опцій, а одна пропущена (масштаб, згладжування, хибна назва блоку UCX) ламає пропс в Unreal. Скрипт експортує один пропс чи сотню однаково, не бере неготового й лишає журнал із причинами. Такий інструмент є в кожній студії, і людина, що вміє його писати й лагодити, тримає чистим увесь арт-конвеєр."}, "where": {"en": "TechArt/Blender/props_kit.blend with TechArt/Blender/scripts/export_kit.py; the FBX files and export_log.md in TechArt/Blender/exports; in Unreal, Content/Tools/Day77 and the level L_Day77.", "uk": "TechArt/Blender/props_kit.blend і скрипт TechArt/Blender/scripts/export_kit.py; файли FBX і export_log.md у TechArt/Blender/exports. В Unreal — Content/Tools/Day77 і рівень L_Day77."}, "spec": [{"en": "props_kit.blend: a collection EXPORT, and inside it one collection per asset named exactly like its mesh (SM_Bollard, SM_Bench, SM_LampPost, SM_Bin), each holding that mesh and its UCX_<name>_NN boxes, appended from your Day 4 and 5 files and standing at the world origin.", "uk": "props_kit.blend: колекція EXPORT, а в ній по колекції на асет із назвою, точно як у його меша (SM_Bollard, SM_Bench, SM_LampPost, SM_Bin). Кожна містить свій меш і блоки UCX_<name>_NN, додані з файлів Дня 4 і Дня 5 і поставлені в центр світу."}, {"en": "export_kit.py with settings at the top: DRY_RUN = True, ROOT = 'EXPORT', OUT = bpy.path.abspath('//exports') (the exports folder next to the .blend) an empty log list, and CHECK_BASE = True (set it to False for kit pieces, which follow your kit's pivot rule).", "uk": "export_kit.py з налаштуваннями на початку: DRY_RUN = True, ROOT = 'EXPORT', OUT = bpy.path.abspath('//exports') (папка exports поруч із .blend), порожній список журналу і CHECK_BASE = True. Для деталей набору, що йдуть за правилом origin набору, встанови False."}, {"en": "A function check(col) that returns a list of problems: not exactly one visible mesh, mesh name differs from the collection name, no SM_ prefix, scale not applied, mesh not at the world origin, lowest point more than 1 cm from the origin, no UCX_ box, or UCX names that don't match, or any object hidden.", "uk": "Функція check(col) повертає список проблем. Не рівно один видимий меш; назва меша не збігається з назвою колекції; немає префікса SM_; масштаб не застосовано; меш не в центрі світу; найнижча точка далі ніж 1 см від origin; немає блоку UCX_; назви UCX не збігаються; якийсь об'єкт приховано."}, {"en": "A function export(col, path) that selects the collection's objects and calls bpy.ops.export_scene.fbx with your Day 4 settings: selected objects only, Mesh only, Apply Scalings FBX All, Apply Modifiers, Smoothing Face, Path Mode Copy with Embed Textures.", "uk": "Функція export(col, path) виділяє об'єкти колекції й викликає bpy.ops.export_scene.fbx з налаштуваннями Дня 4: лише виділені об'єкти, лише Mesh, Apply Scalings FBX All, Apply Modifiers, Smoothing Face, Path Mode Copy з Embed Textures."}, {"en": "A loop over the collections in EXPORT that logs OK or SKIPPED with reasons and exports only when DRY_RUN is False; export_log.md written on every run, dry or real.", "uk": "Цикл по колекціях в EXPORT пише в журнал OK або SKIPPED з причинами й експортує лише тоді, коли DRY_RUN дорівнює False. export_log.md пишеться під час кожного запуску, і пробного, і справжнього."}, {"en": "The four FBX files imported into Content/Tools/Day77 with your import checklist, placed in L_Day77, and check_assets.py run on that folder (FOLDER = '/Game/Tools/Day77', or the Check button of EUW_TechTools), its asset_report.md read.", "uk": "Чотири FBX імпортовано в Content/Tools/Day77 за чек-листом імпорту й розставлено в L_Day77. На цій папці запущено check_assets.py (FOLDER = '/Game/Tools/Day77' або кнопка Check в EUW_TechTools) і прочитано asset_report.md."}], "piece1": "export_kit.py on your four street props (built step by step in the lessons)", "piece2": {"en": "On your own: the script on your harbour kit pieces, tested with the CHECK_BASE switch for pieces that use the kit's pivot rule", "uk": "Самостійно: скрипт на деталях набору гавані, перевірений перемикачем CHECK_BASE для деталей з правилом origin набору"}, "steps": [{"text": {"en": "Check: the results of today's lessons are there (export_kit.py in TechArt/Blender/scripts with check(), export() and the log, and props_kit.blend with its EXPORT collection). Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it. Open props_kit.blend and check the Outliner against the spec: EXPORT, four asset collections named like their meshes, every UCX box inside its asset's collection, every eye open. Check: each asset collection shows one mesh and its UCX boxes, nothing hidden.", "uk": "Спершу переконайся, що результати сьогоднішніх уроків на місці: export_kit.py в TechArt/Blender/scripts з check(), export() і журналом та props_kit.blend з колекцією EXPORT. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Відкрий props_kit.blend і звір Outliner з вимогами: EXPORT, чотири колекції асетів з назвами їхніх мешів, кожен блок UCX у колекції свого асета, усі очі відкриті. Перевірка: у кожній колекції асета один меш і його блоки UCX, нічого не приховано."}, "lesson": 1}, {"text": {"en": "Open export_kit.py in the Text Editor. Add CHECK_BASE = True to the settings and put the base check (lines 15 to 17) under if CHECK_BASE: (indent those lines 4 more). If your four assets are kit pieces because you skipped Days 1 to 5, set it to False now. Check: you can say in one sentence what each of the five parts does.", "uk": "Відкрий export_kit.py у Text Editor. Додай у налаштування CHECK_BASE = True і постав перевірку основи (рядки 15–17) під if CHECK_BASE: — зсунь ці рядки ще на 4 пробіли. Якщо твої чотири асети — деталі набору, бо Дні 1–5 пропущено, встанови False одразу. Перевірка: ти можеш одним реченням сказати, що робить кожна з п'яти частин."}, "lesson": 2}, {"text": {"en": "Run it with DRY_RUN = True. Check: the system console and TechArt/Blender/exports/export_log.md both list four lines marked OK, and the exports folder holds only the log.", "uk": "Запусти з DRY_RUN = True. Перевірка: і системна консоль, і TechArt/Blender/exports/export_log.md показують чотири рядки з OK, а в папці exports лише журнал."}, "lesson": 4}, {"text": {"en": "Break things on purpose, one at a time, and dry-run after each: scale SM_Bin to 1.2 (S 1.2) without applying; rename UCX_SM_Bench_00 to UCX_Bench_00; move SM_LampPost 1 m along X; hide a UCX box with H. Put each one back by hand before the next (Scale 1, the old name, X Location 0): Ctrl+Z would first undo the dry run, because every script run is an undo step. Check: each run marks exactly that asset SKIPPED with the matching reason.", "uk": "Навмисно ламай по одній речі й після кожної роби пробний запуск. Масштабуй SM_Bin до 1.2 (S 1.2) без застосування. Перейменуй UCX_SM_Bench_00 на UCX_Bench_00. Пересунь SM_LampPost на 1 м уздовж X. Сховай блок UCX клавішею H. Перед наступною поломкою повертай усе вручну (Scale 1, стара назва, X Location 0): Ctrl+Z спершу скасує пробний запуск, бо кожен запуск скрипта — крок скасування. Перевірка: щоразу саме цей асет позначено SKIPPED з відповідною причиною."}, "lesson": 2}, {"text": {"en": "Save the .blend, set DRY_RUN = False and run. Then set DRY_RUN back to True and save the script. Check: exports holds SM_Bollard.fbx, SM_Bench.fbx, SM_LampPost.fbx and SM_Bin.fbx with today's time, each over 10 KB (1 KB or 4 KB means an empty export), and export_log.md says exported at the top.", "uk": "Збережи .blend, встанови DRY_RUN = False і запусти. Потім поверни DRY_RUN = True і збережи скрипт. Перевірка: у exports лежать SM_Bollard.fbx, SM_Bench.fbx, SM_LampPost.fbx і SM_Bin.fbx із сьогоднішнім часом, кожен більший за 10 КБ (1 КБ чи 4 КБ означає порожній експорт), а на початку export_log.md написано exported."}, "lesson": 3}, {"text": {"en": "In IslandCourse make the folder Content/Tools/Day77 and drag the four FBX files in; use your Day 6 import checklist (Collision and Import Collision According To Mesh Name ticked, Fallback Collision Type None, Generate Lightmap UVs off). Check: four static meshes, and each one's Approx Size in the Static Mesh Editor matches your Day 5 sizes within 1 cm.", "uk": "В IslandCourse створи папку Content/Tools/Day77 і перетягни туди чотири FBX. Користуйся чек-листом імпорту з Дня 6: Collision та Import Collision According To Mesh Name увімкнено, Fallback Collision Type None, Generate Lightmap UVs вимкнено. Перевірка: чотири static mesh, і Approx Size кожного в Static Mesh Editor збігається з розмірами з Дня 5 з точністю до 1 см."}, "lesson": 4}, {"text": {"en": "Set FOLDER = '/Game/Tools/Day77' at the top of check_assets.py and run it (File > Execute Python Script), or use the Check button of EUW_TechTools. Check: Saved/TechTools/asset_report.md shows no problem for the four meshes (collision, scale, SM_ names).", "uk": "Встанови FOLDER = '/Game/Tools/Day77' на початку check_assets.py і запусти (File > Execute Python Script) або клацни Check в EUW_TechTools. Перевірка: Saved/TechTools/asset_report.md не показує проблем для чотирьох мешів (колізія, масштаб, назви SM_)."}, "lesson": 4}, {"text": {"en": "Make the level L_Day77 in Content/Tools/Day77, place the four props, drop each with End (or right-click > Snap/Align > Snap to Floor) and switch the viewport to Player Collision. Save the level (Ctrl+S), open any other level and open L_Day77 again. Check: the four props are still there, nothing floats, and the collision matches each prop's shape.", "uk": "Створи рівень L_Day77 у Content/Tools/Day77, постав чотири пропси, опусти кожен клавішею End (або правою кнопкою > Snap/Align > Snap to Floor) і перемкни в'юпорт на Player Collision. Збережи рівень (Ctrl+S), відкрий будь-який інший рівень, а тоді знову L_Day77. Перевірка: чотири пропси на місці, ніщо не висить, а колізія відповідає формі кожного пропса."}, "lesson": 4}, {"text": {"en": "On your own: append your harbour kit pieces SM_QuayEdge_4m and SM_PierDeck_4m with their UCX boxes (Day 7) into props_kit.blend, each in its own collection under EXPORT, and dry-run. Check: they are SKIPPED with 'origin not at the base', because kit pieces follow your kit's pivot rule (the top corner at Z = 0), not the prop rule.", "uk": "Самостійно: додай у props_kit.blend деталі набору гавані SM_QuayEdge_4m і SM_PierDeck_4m з їхніми блоками UCX (День 7), кожну в окрему колекцію під EXPORT, і зроби пробний запуск. Перевірка: їх пропущено (SKIPPED) з причиною 'origin not at the base'. Деталі набору йдуть за правилом origin набору (верхній кут на Z = 0), а не за правилом пропса."}, "lesson": 2}, {"text": {"en": "On your own: dry-run with CHECK_BASE = False, then with True. Check: the kit pieces pass with False and are skipped again with True.", "uk": "Самостійно: зроби пробний запуск із CHECK_BASE = False, потім із True. Перевірка: з False деталі набору проходять, а з True їх знову пропущено."}, "lesson": 2}, {"text": {"en": "Take import_day77.png (the four props in L_Day77, Player Collision view). Check: the picture is in today's Work folder.", "uk": "Зроби скриншот import_day77.png: чотири пропси в L_Day77 у режимі Player Collision. Перевірка: зображення в робочій папці дня."}, "lesson": 4}, {"text": {"en": "Copy export_kit.py and export_log.md into today's Work folder. Click Copy the day report, paste it into a new tutor chat, answer its questions and save its answer as summary.md in today's Work folder. Drag summary.md, export_kit.py, export_log.md and import_day77.png into today's hand-in folder (the button on this page); never a project or level folder. Check: the hand-in folder lists 4 files, each over 1 KB.", "uk": "Скопіюй export_kit.py і export_log.md у робочу папку дня. Клацни «Копіювати звіт дня», встав текст у новий чат із тьютором, дай відповіді на його запитання й збережи відповідь як summary.md у робочій папці дня. Здай роботу: перетягни файли в сьогоднішню папку здачі (кнопка на цій сторінці): summary.md, export_kit.py, export_log.md і import_day77.png. Ніколи не здавай папку проєкту чи рівня. Перевірка: у папці здачі 4 файли, кожен більший за 1 КБ."}, "lesson": 1}], "assets": ["techart/code-style.md", "techart/standards-sheet.md"], "next": {"en": "export_kit.py exports your Geometry Nodes props on Day 78 and your seeded rocks on Days 79 and 80 without a change, and on Day 108 it is part of the pipeline your plugin's manual describes.", "uk": "export_kit.py без змін експортує пропси з Geometry Nodes у День 78 і скелі із зерна в День 79 і День 80. У День 108 він стане частиною конвеєра, який описує посібник твого плагіна."}}, "lessons": [{"title": {"en": "One file, one collection per asset", "uk": "Один файл, одна колекція на асет"}, "minutes": 40, "goals": [{"en": "Explain collections in Python: bpy.data.collections holds every collection by name, and each one has .objects (what is in it) and .children (the collections inside it).", "uk": "Пояснювати колекції в Python: bpy.data.collections тримає всі колекції за назвою, а в кожної є .objects (вміст) і .children (вкладені колекції)."}, {"en": "Bring your four props into one file with File > Append and give each its own collection, named like its mesh.", "uk": "Збирати чотири пропси в один файл командою File > Append і давати кожному власну колекцію з назвою його меша."}, {"en": "Build a file path from the .blend's own folder with bpy.path.abspath('//'), and read an error message from its last line.", "uk": "Будувати шлях до файлу від папки .blend функцією bpy.path.abspath('//') і читати помилки з останнього рядка."}], "doalong": [{"en": "Choose File > New > General, delete the cube, check Units (Metric, Unit Scale 1.0) and save props_kit.blend in TechArt/Blender. Choose File > Append, open your bollard file (bollard_day1.blend, which got its UCX box on Day 4, or your own latest one), open Object, Ctrl+click SM_Bollard and UCX_SM_Bollard_00 and click Append. You see both in the Outliner, standing at the world origin.", "uk": "Вибери File > New > General, видали куб, перевір Units (Metric, Unit Scale 1.0) і збережи props_kit.blend у TechArt/Blender. Вибери File > Append і відкрий файл стовпчика (bollard_day1.blend, що отримав блок UCX у День 4, або свій найновіший). Відкрий Object, з Ctrl клацни SM_Bollard і UCX_SM_Bollard_00 і клацни Append. Обидва з'являються в Outliner і стоять у центрі світу."}, {"en": "Append SM_Bench, SM_LampPost and SM_Bin with all their UCX boxes the same way, from bench_day5_v01.blend, lamp_day5_v01.blend and bin_day4.blend (or your own latest files). You see four props standing inside each other at the origin: the course rule is that every piece is exported from the world origin.", "uk": "Так само додай SM_Bench, SM_LampPost і SM_Bin з усіма блоками UCX з bench_day5_v01.blend, lamp_day5_v01.blend і bin_day4.blend (або найновіших файлів). Чотири пропси стоять один в одному в центрі світу: за правилом курсу кожна деталь експортується з центру світу."}, {"en": "In the Outliner right-click Scene Collection > New Collection and rename it EXPORT (double-click the name). Right-click EXPORT > New Collection four times and name the new ones SM_Bollard, SM_Bench, SM_LampPost and SM_Bin. Drag each prop and its UCX boxes into its collection. You see EXPORT holding four collections, each with one mesh and its boxes.", "uk": "В Outliner клацни правою кнопкою на Scene Collection > New Collection і перейменуй її на EXPORT (двічі клацни назву). Клацни правою кнопкою на EXPORT > New Collection чотири рази й назви нові колекції SM_Bollard, SM_Bench, SM_LampPost і SM_Bin. Перетягни кожен пропс і його блоки UCX у свою колекцію. Має вийти EXPORT із чотирма колекціями, у кожній один меш і його блоки."}, {"en": "New text, saved as scripts/export_kit.py. Line 1: `import bpy, os` (os works with folders and paths). Line 2: `for col in bpy.data.collections['EXPORT'].children:` (each collection inside EXPORT). Line 3, indented 4: `print(col.name, [o.name for o in col.objects])`. Run it. You see four lines, each with a collection's name and its objects.", "uk": "Новий текст, збережений як scripts/export_kit.py. Рядок 1: `import bpy, os` — os працює з папками й шляхами. Рядок 2: `for col in bpy.data.collections['EXPORT'].children:` — кожна колекція в EXPORT. Рядок 3 з відступом 4: `print(col.name, [o.name for o in col.objects])`. Запусти. Має вийти чотири рядки, у кожному назва колекції та її об'єкти."}, {"en": "Error-reading practice: change 'EXPORT' to 'Export' and run. The console ends with KeyError: 'bpy_prop_collection[key]: key \"Export\" not found'. Read the last line first: it names the exact key that is missing. Put 'EXPORT' back and run. You see the four lines return.", "uk": "Тренування з помилкою: зміни 'EXPORT' на 'Export' і запусти. Консоль закінчується на KeyError: 'bpy_prop_collection[key]: key \"Export\" not found'. Читай спершу останній рядок: він називає точний ключ, якого бракує. Поверни 'EXPORT' і запусти: чотири рядки повернулися."}, {"en": "Replace the three lines with the top of the real tool. Line 1: `import bpy, os`. Line 2: `DRY_RUN = True`. Line 3: `ROOT = 'EXPORT'` (the collection that holds one collection per asset). Line 4: `OUT = bpy.path.abspath('//exports')` (// means 'the folder of this .blend'). Line 5: `log = []` (the log's lines, filled as the script goes). Line 6: `print(OUT)`. Run it. You see the full path of TechArt/Blender/exports; if it points elsewhere, save the .blend first, because // needs a saved file.", "uk": "Заміни три рядки на початок справжнього інструмента. Рядок 1: `import bpy, os`. Рядок 2: `DRY_RUN = True`. Рядок 3: `ROOT = 'EXPORT'` — колекція, що тримає по колекції на асет. Рядок 4: `OUT = bpy.path.abspath('//exports')` — // означає «папка цього .blend». Рядок 5: `log = []` — рядки журналу, які скрипт заповнює по ходу. Рядок 6: `print(OUT)`. Запусти: має вийти повний шлях до TechArt/Blender/exports. Якщо він веде кудись інде, спершу збережи .blend: // потребує збереженого файлу."}], "play": {"en": "Where does it land? The tutor gives me five paths (bpy.path.abspath('//exports') in a saved file; the same in a never-saved file; os.path.join(OUT, 'SM_Bin.fbx'); '//scripts'; 'C:/temp'). For each I say which folder the file ends up in and whether that is safe for a pipeline.", "uk": "Куди це потрапить: тьютор дає п'ять шляхів — bpy.path.abspath('//exports') у збереженому файлі; те саме у файлі, який ще не зберігали; os.path.join(OUT, 'SM_Bin.fbx'); '//scripts'; 'C:/temp'. Для кожного скажи, у яку папку потрапить файл і чи це безпечно для конвеєра."}, "video": {"search": "blender python collections bpy.data.collections children objects"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Один файл, одна колекція на асет (Day 77, lesson 1 of 4). Today's build: export_kit.py і props_kit.blend: твої чотири вуличні пропси в одному файлі, по колекції на кожен. Їх експортує один скрипт із перевірками й журналом, а потім вони імпортуються в Unreal..\nWhat I already know: День 76: твої перші скрипти Blender — списки, if, функції та пробний запуск; День 4 і День 5: налаштування чистого експорту FBX, блоки UCX і твої чотири вуличні пропси. Пропущено ці дні? Візьми будь-які дві деталі набору з їхніми блоками UCX і CHECK_BASE = False з кроку 2.; День 6: твій чек-лист імпорту; День 74: check_assets.py, щоб перевіряти пропси в Unreal.\n\nBy the end of this lesson I can:\n1. Пояснювати колекції в Python: bpy.data.collections тримає всі колекції за назвою, а в кожної є .objects (вміст) і .children (вкладені колекції).\n2. Збирати чотири пропси в один файл командою File > Append і давати кожному власну колекцію з назвою його меша.\n3. Будувати шлях до файлу від папки .blend функцією bpy.path.abspath('//') і читати помилки з останнього рядка.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: Ти вмієш писати скрипти Blender, що будують, звітують і виправляють сцену, з пробним запуском перед кожною зміною. Today: Ти пишеш export_kit.py — інструмент, що перевіряє кожен пропс, щоразу однаково експортує придатні й записує решту в журнал. One encouraging line: Кожен рядок, написаний сьогодні, заощадить тобі кліки до кінця курсу. Коли журнал пише SKIPPED, це твій інструмент робить свою справу.); 2 lines on why today matters and where it comes back, in plain words (from this: Експорт уручну — це щоразу ті самі вісім опцій, а одна пропущена (масштаб, згладжування, хибна назва блоку UCX) ламає пропс в Unreal. Скрипт експортує один пропс чи сотню однаково, не бере неготового й лишає журнал із причинами. Такий інструмент є в кожній студії, і людина, що вміє його писати й лагодити, тримає чистим увесь арт-конвеєр. It comes back: export_kit.py без змін експортує пропси з Geometry Nodes у День 78 і скелі із зерна в День 79 і День 80. У День 108 він стане частиною конвеєра, який описує посібник твого плагіна.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-77-export-kit-script exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n er. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; review (by tutor or art director) = огляд; checklist = чек-лист; credits line = рядок авторства; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; File Explorer = Провідник; mesh = меш; vertex / edge / face = вершина / ребро / грань; origin (and kit pivot) = origin — точка, за яку об'єкт ставлять і обертають; world origin / 3D cursor = центр світу / 3D-курсор; apply scale / apply all transforms = застосувати масштаб / застосувати всі трансформації; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance =

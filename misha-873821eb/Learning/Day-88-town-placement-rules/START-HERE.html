<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 88</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

<script id="data" type="application/json">{"learner": "ib-misha-873821eb", "learnerName": {"en": "Misha", "uk": "Міша"}, "day": 88, "week": 18, "total": 110, "title": {"en": "Placement rules: setbacks, frontage, height zones, a landmark and keep-outs", "uk": "Правила розстановки: відступи, лінія фасадів, зони висот, орієнтир і зони-винятки"}, "theme": {"en": "Week 18: Procedural roads and towns", "uk": "Тиждень 18: Процедурні дороги й міста"}, "build": {"item": {"en": "DA_TownRules (with its class PDA_TownRules) and BP_TownGenerator's plan following it: setbacks, frontage, height zones from the sea, a landmark square, shop plots, seeded gaps and corridor keep-outs", "uk": "DA_TownRules (з класом PDA_TownRules) і план BP_TownGenerator, що його дотримується: відступи, лінія фасадів, зони висот від моря, площа з орієнтиром, ділянки крамниць, проміжки із зерна й зони-винятки коридорів"}, "why": {"en": "A generator without rules makes a pattern; rules make a place. Real towns set buildings back from the pavement, face them to the street, build taller away from the water, open a square round a landmark, and here they must also leave drone corridors clear. Keeping these rules in one data asset lets you swap the character of a whole quarter by swapping one asset, and the same seed always gives the same plan.", "uk": "Генератор без правил робить візерунок, а правила роблять місце. Справжні міста відсувають будинки від тротуару, повертають їх до вулиці, будують вище подалі від води й відкривають площу довкола орієнтира. А тут треба ще й лишати вільні коридори для дронів. Коли ці правила лежать в одному асеті даних, характер усього мікрорайону змінює заміна одного асета, а те саме зерно завжди дає той самий план."}, "where": {"en": "Content/Tools/Data (PDA_TownRules, DA_TownRules_Harbour), BP_TownGenerator in Content/Tools/Blueprints, the practice level Content/Tools/Day88/L_Day88 (a copy of L_Day87).", "uk": "Content/Tools/Data (PDA_TownRules, DA_TownRules_Harbour), BP_TownGenerator у Content/Tools/Blueprints, тренувальний рівень Content/Tools/Day88/L_Day88 (копія L_Day87)."}, "spec": [{"en": "PDA_TownRules and DA_TownRules_Harbour with tooltips and units: Setback (m, 2), Plot Width (m, 12), Plot Depth (m, 16), Bay Width (m, 2: your styles' Bay Width of 200 cm, Day 66), Gap Chance (0 to 1, 0.12), Min Floors (2), Max Floors (6), Floor Height (m, 3: your styles' Floor Height), Shore Point (Vector, m; for the practice quarter 0, -20, 0), Inland Direction (Vector, 0, 1, 0), Sea Max Distance (m, 200), Landmark Point (Vector, m, for example 150, 150, 0), Shop Zone Min and Shop Zone Max (Vectors, m), Corridor Half Width (m, 7), Front Turn (degrees, 0, because BP_Building's front already faces -Y) and House Depth (m, 4: BP_Building's depth, Day 67).", "uk": "PDA_TownRules і DA_TownRules_Harbour з підказками й одиницями: Setback (м, 2), Plot Width (м, 12), Plot Depth (м, 16), Bay Width (м, 2 — Bay Width твоїх стилів, 200 см, День 66), Gap Chance (від 0 до 1, 0.12), Min Floors (2), Max Floors (6), Floor Height (м, 3 — Floor Height твоїх стилів), Shore Point (Vector, м; для тренувального мікрорайону 0, -20, 0), Inland Direction (Vector, 0, 1, 0), Sea Max Distance (м, 200), Landmark Point (Vector, м, наприклад 150, 150, 0), Shop Zone Min і Shop Zone Max (Vector, м), Corridor Half Width (м, 7), Front Turn (градуси, 0, бо фасад BP_Building уже дивиться на -Y) і House Depth (м, 4 — глибина BP_Building, День 67)."}, {"en": "S_Plot gains Front (Vector, cm: the middle of the house's front, on the setback line), Floors (Integer), Bays (Integer), Yaw (Float), Sea Distance (Float, m), Is Gap, Is Shop and Is Landmark (Booleans); BP_TownGenerator gains Rules (PDA_TownRules), Seed (Integer) and Keep Outs (Actor array), all Instance Editable, plus PreviewShops and PreviewLandmark components.", "uk": "S_Plot отримує Front (Vector, см: середина фасаду будинку на лінії відступу), Floors (Integer), Bays (Integer), Yaw (Float), Sea Distance (Float, м), Is Gap, Is Shop і Is Landmark (Boolean). BP_TownGenerator отримує Rules (PDA_TownRules), Seed (Integer) і Keep Outs (масив Actor), усі Instance Editable, а також компоненти PreviewShops і PreviewLandmark."}, {"en": "The Construction Script makes a Random Stream from Seed first; every random choice uses it, drawn in the same order for every plot, so one seed always gives one plan.", "uk": "Construction Script спершу робить Random Stream із Seed. Кожен випадковий вибір бере числа з нього в однаковому порядку для кожної ділянки, тож одне зерно завжди дає один план."}, {"en": "Fill Row applies the rules: depth limited to half the block minus the setback; fronts on the setback line; Bays = Floor((plot width - 1 m) / Bay Width), at least 1, so neighbours keep a gap; the preview box shows the house itself (Bays x Bay Width wide, House Depth deep, Floors x Floor Height tall) behind its front; Yaw = Front Turn for rows facing -Y and Front Turn + 180 for rows facing +Y; Floors from the distance to the sea (the same maths as PCGE_DistanceToSea) mapped onto Min to Max Floors, plus or minus 1 from the stream; gaps by Gap Chance; shops inside the Shop Zone; plots within Corridor Half Width of any Keep Outs spline left out.", "uk": "Fill Row застосовує правила. Глибина — не більше половини кварталу мінус відступ; фасади на лінії відступу. Bays = Floor((ширина ділянки - 1 м) / Bay Width), не менше 1, тож між сусідами лишається проміжок. Блок попереднього перегляду показує сам будинок за фасадом: Bays × Bay Width завширшки, House Depth завглибшки, Floors × Floor Height заввишки. Yaw = Front Turn для рядів, що дивляться на -Y, і Front Turn + 180 для рядів на +Y. Floors береться з відстані до моря (та сама математика, що в PCGE_DistanceToSea), переведеної в діапазон Min–Max Floors, плюс-мінус 1 з потоку. Проміжки — за Gap Chance, крамниці — у Shop Zone. Ділянки ближче за Corridor Half Width до будь-якого сплайна з Keep Outs пропускаються."}, {"en": "The block holding Landmark Point gets no rows: one landmark plot at its centre with an open square round it.", "uk": "Клітинка з Landmark Point не отримує рядів: одна ділянка-орієнтир у її центрі, а довкола відкрита площа."}, {"en": "T_Mask_Shops repainted for the quarter (keep the old PNG as a backup), and the Shop Zone read from where its white points land in the level.", "uk": "T_Mask_Shops перемальовано під мікрорайон (стару PNG збережено як копію), а Shop Zone зчитано з того, куди на рівні лягають її білі точки."}], "piece1": "Setbacks, frontage, height zones and gaps in the plan (built in the lessons)", "piece2": {"en": "On your own: a second rule set DA_TownRules_Inland with a different character", "uk": "Самостійно: другі правила DA_TownRules_Inland з іншим характером"}, "steps": [{"text": {"en": "Check: the results of today's lessons are there (PDA_TownRules, DA_TownRules_Harbour, and BP_TownGenerator's plan with setbacks, frontage, height zones and gaps). Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it. Weak PC (16 GB of RAM or less): shrink the PCG volume to 100 x 100 m while you build and grow it for the final pictures (see the weak-PC section of ACCOUNTS-AND-INSTALLS.html). Open L_Day88, select BP_TownGenerator (Layout DA_RoadLayout, Rules DA_TownRules_Harbour, Seed 1) and look from the Top view and from 60 m. Check: plot boxes set back from the roads, taller boxes further from the shore, a few gaps, yellow shop plots, one tall landmark box in an open block.", "uk": "Спершу переконайся, що результати сьогоднішніх уроків на місці: PDA_TownRules, DA_TownRules_Harbour і план BP_TownGenerator з відступами, лінією фасадів, зонами висот і проміжками. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Слабкий ПК (16 ГБ оперативної пам'яті або менше): під час роботи зменш об'єм PCG до 100 × 100 м, а для фінальних зображень збільш (див. розділ «Слабкий ПК» на сторінці ACCOUNTS-AND-INSTALLS.html). Відкрий L_Day88, вибери BP_TownGenerator (Layout DA_RoadLayout, Rules DA_TownRules_Harbour, Seed 1) і подивись на виді Top і з 60 м. Перевірка: блоки ділянок відступають від доріг, далі від берега вищі, є кілька проміжків, жовті ділянки крамниць і один високий блок-орієнтир у відкритій клітинці."}, "lesson": 2}, {"text": {"en": "Change Seed to 2, then back to 1, nudging the generator each time. Check: Seed 2 moves the gaps and changes some heights; Seed 1 brings back exactly the first plan.", "uk": "Зміни Seed на 2, потім поверни 1, щоразу трохи посуваючи генератор. Перевірка: Seed 2 переносить проміжки й змінює частину висот, а Seed 1 точно повертає перший план."}, "lesson": 2}, {"text": {"en": "Change Setback to 5 in DA_TownRules_Harbour, save and nudge the generator. Check: every row steps back 3 m more from its road, and no row crosses the middle of its block; set it back to 2.", "uk": "Зміни Setback на 5 у DA_TownRules_Harbour, збережи й посунь генератор. Перевірка: кожен ряд відступає від своєї дороги ще на 3 м, і жоден ряд не перетинає середину кварталу. Поверни 2."}, "lesson": 2}, {"text": {"en": "Place one BP_Building by hand at the corner of a preview box's front where the house starts, its origin (on a row facing -Y the front corner with the smaller X; on a row facing +Y the one with the larger X), with the plot's Yaw (0 on a row facing -Y, 180 on a row facing +Y). Check: its front lines up with the preview box's front and faces the road; if not, fix Front Turn.", "uk": "Постав вручну один BP_Building origin у кут фасаду блоку попереднього перегляду, де починається будинок: у ряду на -Y — кут фасаду з меншим X, у ряду на +Y — з більшим X. Yaw — як у ділянки: 0 у ряду на -Y, 180 у ряду на +Y. Перевірка: його фасад збігається з фасадом блоку й дивиться на дорогу. Якщо ні, виправ Front Turn."}, "lesson": 1}, {"text": {"en": "Move the landmark: change Landmark Point to a spot in another block and nudge the generator. Check: that block becomes the open square with the tall landmark box, and the old one fills with plots again.", "uk": "Перенеси орієнтир: зміни Landmark Point на місце в іншому кварталі й посунь генератор. Перевірка: той квартал стає відкритою площею з високим блоком-орієнтиром, а старий знову заповнюється ділянками."}, "lesson": 4}, {"text": {"en": "Move KO_Corridor01 across a block (it must be in the generator's Keep Outs list), then nudge the generator. Save L_Day88, open any other level and open L_Day88 again. Check: no plot box within 7 m of the corridor line, and LaneGauge slides along it at 15 m touching nothing.", "uk": "Пересунь KO_Corridor01 через квартал (він має бути в списку Keep Outs генератора), потім посунь генератор. Збережи L_Day88, відкрий будь-який інший рівень, а тоді знову L_Day88. Перевірка: ближче 7 м від лінії коридору немає жодного блоку ділянки, а LaneGauge ковзає вздовж нього на висоті 15 м, нічого не торкаючись."}, "lesson": 4}, {"text": {"en": "Turn the Sea Max Distance down to 80 and nudge. Check: the tall boxes now start much closer to the shore; keep the value you prefer.", "uk": "Зменш Sea Max Distance до 80 і посунь генератор. Перевірка: високі блоки тепер починаються набагато ближче до берега. Лиши значення, яке тобі більше подобається."}, "lesson": 3}, {"text": {"en": "Check the shop plots: Generate the PCG Volume with PCG_StreetDresser over the quarter, press D on its mask Density Filter. Check: the yellow shop plots sit along the same street edge as the white mask points.", "uk": "Перевір ділянки крамниць: клацни Generate на PCG Volume з PCG_StreetDresser над мікрорайоном і натисни D на Density Filter його маски. Перевірка: жовті ділянки крамниць лежать уздовж того самого краю вулиці, що й білі точки маски."}, "lesson": 3}, {"text": {"en": "On your own: duplicate DA_TownRules_Harbour as DA_TownRules_Inland and give it another character (for example Setback 4, Plot Width 18, Min Floors 1, Max Floors 3, Gap Chance 0.25, no Shop Zone). Check: swapping Rules on the generator turns the same roads into a quieter, lower quarter.", "uk": "Самостійно: продублюй DA_TownRules_Harbour як DA_TownRules_Inland і дай йому інший характер, наприклад: Setback 4, Plot Width 18, Min Floors 1, Max Floors 3, Gap Chance 0.25, без Shop Zone. Перевірка: заміна Rules на генераторі перетворює ті самі дороги на тихіший, нижчий мікрорайон."}, "lesson": 1}, {"text": {"en": "Take rules_60m_day88.png (the plan from 60 m at an angle, heights readable). Check: the picture is in today's Work folder.", "uk": "Зроби скриншот rules_60m_day88.png: план з 60 м під кутом, висоти добре видно. Перевірка: зображення в робочій папці дня."}, "lesson": 2}, {"text": {"en": "Click Copy the day report, paste it into a new tutor chat, answer its questions and save its answer as summary.md in today's Work folder. Drag summary.md and rules_60m_day88.png into today's hand-in folder (the button on this page); no need to hand in the Unreal project or level folders (they're very big). Check: the hand-in folder lists 2 files, each over 1 KB.", "uk": "Клацни «Копіювати звіт дня», встав текст у новий чат із тьютором, дай відповіді на його запитання й збережи відповідь як summary.md у робочій папці дня. Здай роботу: перетягни файли в сьогоднішню папку здачі (кнопка на цій сторінці): summary.md і rules_60m_day88.png. Папку проєкту чи рівня Unreal здавати не треба: вона дуже велика. Перевірка: у папці здачі 2 файли, кожен більший за 1 КБ."}, "lesson": 1}], "assets": ["techart/street-dimensions.md"], "next": {"en": "BP_TownGenerator turns this plan into roads, buildings and props tomorrow (Day 89), and on Day 104 the same rules and keep-outs shape your real district.", "uk": "Завтра (День 89) BP_TownGenerator перетворить цей план на дороги, будинки й пропси, а в День 104 ті самі правила й зони-винятки сформують твій справжній район."}}, "lessons": [{"title": {"en": "Rules from real towns, written as data", "uk": "Правила зі справжніх міст, записані як дані"}, "minutes": 40, "goals": [{"en": "Read placement rules from real streets: setbacks, plot widths, building heights and open squares.", "uk": "Читати правила розстановки на справжніх вулицях: відступи, ширину ділянок, висоту будинків і відкриті площі."}, {"en": "Make PDA_TownRules and DA_TownRules_Harbour, and let the generator read its plot sizes from them.", "uk": "Робити PDA_TownRules і DA_TownRules_Harbour і давати генератору брати з них розміри ділянок."}, {"en": "Measure how your BP_Building faces and where its origin sits, so the generator can turn and place it right.", "uk": "Вимірювати, куди дивиться BP_Building і де його origin, щоб генератор правильно його повертав і ставив."}], "doalong": [{"en": "Save L_Day87 as L_Day88 in Content/Tools/Day88. In Content/Tools/Data make a Primary Data Asset Blueprint PDA_TownRules with the fields in the spec (each Instance Editable with a tooltip that names its unit). Compile, then make the data asset DA_TownRules_Harbour and fill it with the values in the spec. You see one asset holding every rule.", "uk": "Збережи L_Day87 як L_Day88 у Content/Tools/Day88. У Content/Tools/Data створи Primary Data Asset Blueprint PDA_TownRules з полями з вимог, кожне Instance Editable з підказкою, що називає одиницю. Клацни Compile, потім створи асет даних DA_TownRules_Harbour і заповни його значеннями з вимог. Має вийти один асет із усіма правилами."}, {"en": "In BP_TownGenerator add Rules (PDA_TownRules, Instance Editable) and an Is Valid check on it next to the Layout check. Replace the generator's own Plot Width and Plot Depth with Rules > Plot Width and Rules > Plot Depth, then delete the old variables. Compile. You see the same plan as yesterday, now read from the rules.", "uk": "У BP_TownGenerator додай Rules (PDA_TownRules, Instance Editable) і перевірку Is Valid на ньому поруч із перевіркою Layout. Заміни власні Plot Width і Plot Depth генератора на Rules > Plot Width і Rules > Plot Depth, а старі змінні видали. Клацни Compile. План той самий, що вчора, але тепер береться з правил."}, {"en": "Drag BP_Building into the level at 0, 0, 0 with rotation 0 and select it. You see its gizmo on the ground at the end of its front with the smaller X (on your right when you stand in the street facing the door) and its door facing -Y, as you built it on Day 67.", "uk": "Перетягни BP_Building на рівень у 0, 0, 0 з поворотом 0 і вибери його. Гізмо стоїть на землі на краю фасаду з меншим X — праворуч від тебе, коли стоїш на вулиці лицем до дверей. Двері дивляться на -Y, як у День 67."}, {"en": "So Front Turn is 0, and the generator must place each house by that corner, not by its middle. Delete the test building.", "uk": "Отже, Front Turn дорівнює 0, і генератор має ставити кожен будинок за цим кутом, а не за серединою. Видали тестовий будинок."}], "play": {"en": "Rule from a photo: the tutor describes four street photos (a seafront of low painted houses; a main street of five-storey blocks; a lane of terraced houses with front gardens; a square with a church). For each I write the setback, plot width and floor range I would put in a rule set.", "uk": "Правило з фото: тьютор описує чотири фото вулиць — набережна з низьких фарбованих будинків; головна вулиця з п'ятиповерхових будинків; провулок рядової забудови з палісадниками; площа з церквою. Для кожного запиши відступ, ширину ділянки й діапазон поверхів для набору правил."}, "video": {"search": "urban design setback frontage building height zoning explained"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Правила зі справжніх міст, записані як дані (Day 88, lesson 1 of 4). Today's build: DA_TownRules (з класом PDA_TownRules) і план BP_TownGenerator, що його дотримується: відступи, лінія фасадів, зони висот від моря, площа з орієнтиром, ділянки крамниць, проміжки із зерна й зони-винятки коридорів.\nWhat I already know: День 87: DA_RoadLayout, а також план і попередній перегляд BP_TownGenerator; День 83: PCGE_DistanceToSea і його математика відстані; День 82: T_Mask_Shops; День 84 і День 85: KO_Corridor01, півширина коридору 7 м і LaneGauge; День 63 і День 68: Random Stream, поверхи й секції BP_Building.\n\nBy the end of this lesson I can:\n1. Читати правила розстановки на справжніх вулицях: відступи, ширину ділянок, висоту будинків і відкриті площі.\n2. Робити PDA_TownRules і DA_TownRules_Harbour і давати генератору брати з них розміри ділянок.\n3. Вимірювати, куди дивиться BP_Building і де його origin, щоб генератор правильно його повертав і ставив.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: Ти маєш BP_Road і живий план міста в BP_TownGenerator: дороги, перехрестя, квартали й ділянки з DA_RoadLayout. Today: Ти даєш плану правила: відступи, лінію фасадів, висоти від моря, площу з орієнтиром, крамниці з маски й смуги, вільні для дронів. One encouraging line: Правила — це місце, де твій смак дизайнера входить у код. Не поспішай із числами: вони вирішують, чи відчуватиметься мікрорайон справжнім місцем.); 2 lines on why today matters and where it comes back, in plain words (from this: Генератор без правил робить візерунок, а правила роблять місце. Справжні міста відсувають будинки від тротуару, повертають їх до вулиці, будують вище подалі від води й відкривають площу довкола орієнтира. А тут треба ще й лишати вільні коридори для дронів. Коли ці правила лежать в одному асеті даних, характер усього мікрорайону змінює заміна одного асета, а те саме зерно завжди дає той самий план. It comes back: Завтра (День 89) BP_TownGenerator перетворить цей план на дороги, будинки й пропси, а в День 104 ті самі правила й зони-винятки сформують твій справжній район.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-88-town-placement-rules exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (Відступи, лінія фасадів, зони висот і проміжки в плані (на уроках)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Збережи L_Day87 як L_Day88 у Content/Tools/Day88. У Content/Tools/Data створи Primary Data Asset Blueprint PDA_TownRules з полями з вимог, кожне Instance Editable з підказкою, що називає одиницю. Клацни Compile, потім створи асет даних DA_TownRules_Harbour і заповни його значеннями з вимог. Має вийти один асет із усіма правилами.\n   2. У BP_TownGenerator додай Rules (PDA_TownRules, Instance Editable) і перевірку Is Valid на ньому поруч із перевіркою Layout. Заміни власні Plot Width і Plot Depth генератора на Rules > Plot Width і Rules > Plot Depth, а старі змінні видали. Клацни Compile. План той самий, що вчора, але тепер береться з правил. [screenshot]\n   3. Перетягни BP_Building на рівень у 0, 0, 0 з поворотом 0 і вибери його. Гізмо стоїть на землі на краю фасаду з меншим X — праворуч від тебе, коли стоїш на вулиці лицем до дверей. Двері дивляться на -Y, як у День 67.\n   4. Отже, Front Turn дорівнює 0, і генератор має ставити кожен будинок за цим кутом, а не за серединою. Видали тестовий будинок. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Правило з фото: тьютор описує чотири фото вулиць — набережна з низьких фарбованих будинків; головна вулиця з п'ятиповерхових будинків; провулок рядової забудови з палісадниками; площа з церквою. Для кожного запиши відступ, ширину ділянки й діапазон поверхів для набору правил. Otherwise skip it.\n6. Review: ask me these questions from earlier days, one at a time, and correct me kindly: Day 85: Why does PCG_KeepOuts go only on the lamp and tree branches of PCG_StreetDresser? | Day 81: What does $Index modulo 5 give point number 12?\n7. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n8. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, spl d (Відступи, лінія фасадів, зони висот і проміжки в плані (на уроках)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Додай Seed (Integer, Instance Editable) і змінну Random Stream з назвою Stream. На початку Construction Script зроби Make Random Stream із Seed і Set Stream. Додай нові поля в S_Plot (Front, Floors, Bays, Yaw, Sea Distance, Is Gap, Is Shop, Is Landmark). Структура росте, а Unreal оновлює кожен вузол, що її використовує.\n   2. У Fill Row зміни Depth на Min(Plot Depth, Block Depth / 2 - Setback), а центр Y — на Front Y - Front Dir × (Setback + Depth / 2). Клацни Compile і подивись на виді Top. Між кожним тротуаром і його рядом ділянок смуга 2 м.\n   3. У Fill Row додай Bays = Max(1, Floor((Width - 1) / Bay Width)) — проміжок 1 м до сусіда — і Front = (центр X, Front Y - Front Dir × Setback, 0) × 100: середина фасаду будинку. [screenshot]\n   4. Зроби блок попереднього перегляду самим будинком: центр — Front мінус (0, Front Dir × House Depth × 50, 0), розмір — Bays × Bay Width × 100 на House Depth × 100. Додай Yaw = Select Float: Front Dir < 0 вибирає Front Turn, інакше Front Turn + 180. Подай Front, Bays і Yaw у Make S_Plot. Будинки стоять на лініях відступу з проміжками між сусідами.\n   5. Проміжки: на початку кожної ділянки бери Random Float from Stream (Stream) і задавай Is Gap, якщо число менше за Gap Chance. Бери це число для кожної ділянки, навіть тих, які згодом відкинеш, щоб порядок ніколи не змінювався.\n   6. Нехай попередній перегляд пропускає ділянки-проміжки (Branch на Is Gap перед Add Box). Клацни Compile і зміни Seed. Кількох ділянок бракує — для кожного зерна інших, а з поверненням зерна тих самих. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Порядок потоку: тьютор дає ряд із п'яти ділянок і перші десять чисел потоку. З Gap Chance 0.2 я кажу, які ділянки стануть проміжками. Потім тьютор прибирає одне випадкове число з середини, і я показую, як зміщується кожна наступна ділянка. Тому порядок має бути незмінним. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; credits line = рядок авторства; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; File Explorer = Провідник; vertex / edge / face = вершина / ребро / грань; origin (and kit pivot) = origin — точка, за яку об'єкт ставлять і обертають; world origin / 3D cursor = центр світу / 3D-курсор; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; collision / UCX collision box = колізія / блок UCX; material slot / node / pin = слот матеріалу / вузол / вхід; volume (PCG Volume, Post Process Volume) = об'єм; seed = зерно (налаштування Seed); map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; district / plot / plot plan = район / ділянка / план ділянки; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; shop front / shop window = фасад крамниці / вітрина; vista / blockout / landmark = панорама / блокаут / орієнтир; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ; shot set = серія кадрів.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}, {"title": {"en": "Height zones from the sea, and shops from the mask", "uk": "Зони висот від моря та крамниці з маски"}, "minutes": 40, "goals": [{"en": "Reuse PCGE_DistanceToSea's maths in a Blueprint function, Sea Distance, to give each plot its distance inland in metres.", "uk": "Переносити математику PCGE_DistanceToSea у функцію Blueprint Sea Distance, щоб кожна ділянка знала свою відстань углиб суходолу в метрах."}, {"en": "Map that distance onto Min to Max Floors, add a seeded plus or minus one, and clamp it.", "uk": "Переводити цю відстань у діапазон Min–Max Floors, додавати плюс-мінус один із зерна й обмежувати результат."}, {"en": "Mark shop plots inside the Shop Zone, read from where T_Mask_Shops lands in the level.", "uk": "Позначати ділянки крамниць у межах Shop Zone, зчитаної з того, куди T_Mask_Shops лягає на рівні."}], "doalong": [{"en": "Open PCGE_DistanceToSea's Point Loop Body, select the Subtract, Normalize, Dot Product and Divide nodes and copy them (Ctrl+C). In BP_TownGenerator make a function Sea Distance (input Point, Vector cm; output Metres, Float) and paste (Ctrl+V).", "uk": "Відкрий Point Loop Body у PCGE_DistanceToSea, виділи вузли Subtract, Normalize, Dot Product і Divide і скопіюй їх (Ctrl+C). У BP_TownGenerator створи функцію Sea Distance (вхід Point, Vector, см; вихід Metres, Float) і встав вузли (Ctrl+V)."}, {"en": "Then right-click the red-marked variable nodes > Create variable, or wire Rules > Shore Point x 100 (a Multiply node: the rules keep metres, this maths works in centimetres) and Rules > Inland Direction instead. You see your Day 83 maths working in a new place.", "uk": "Потім клацни правою кнопкою на вузлах змінних із червоною позначкою > Create variable. Або подай замість них Rules > Shore Point × 100 (вузол Multiply: правила тримають метри, а ця математика — сантиметри) і Rules > Inland Direction. Твоя математика з Дня 83 працює на новому місці."}, {"en": "In Fill Row call Sea Distance on the plot centre plus Get Actor Location; store it in Sea Distance. Then Floors = Clamp(Round(Map Range Clamped(Sea Distance, 0, Sea Max Distance, Min Floors, Max Floors)) + Random Integer in Range from Stream(-1, 1), Min Floors, Max Floors). Use Floors x Floor Height x 100 as the box's height. Compile. You see low boxes near the shore and tall ones inland.", "uk": "У Fill Row виклич Sea Distance для центру ділянки плюс Get Actor Location і збережи в Sea Distance. Потім Floors = Clamp(Round(Map Range Clamped(Sea Distance, 0, Sea Max Distance, Min Floors, Max Floors)) + Random Integer in Range from Stream(-1, 1), Min Floors, Max Floors). Висота блоку — Floors × Floor Height × 100. Клацни Compile. Біля берега низькі блоки, углиб суходолу — високі."}, {"en": "Repaint the mask for the quarter: copy T_Mask_Shops.png to T_Mask_Shops_day82.png as a backup. Take a Top view of the generator's preview framed to the 200 m quarter, paint white along the pavement of one shop street in Krita (as on Day 82), export over T_Mask_Shops.png and Reimport.", "uk": "Перемалюй маску під мікрорайон. Спершу скопіюй T_Mask_Shops.png як T_Mask_Shops_day82.png про запас. Зроби вид Top на попередній перегляд генератора, кадр — мікрорайон 200 м. У Krita намалюй біле вздовж тротуару однієї торгової вулиці (як у День 82), експортуй поверх T_Mask_Shops.png і зроби Reimport."}, {"en": "Place a PCG Volume with PCG_StreetDresser over the quarter (Location 10000, 10000, 0, Scale 100, 100, 30), Generate and press D on the mask's Density Filter. You see the white points along your shop street. Drop two small cubes on the two far corners of the white points and read their Locations; divide by 100 and type them as Shop Zone Min and Max in DA_TownRules_Harbour.", "uk": "Постав над мікрорайоном PCG Volume з PCG_StreetDresser (Location 10000, 10000, 0, Scale 100, 100, 30), клацни Generate і натисни D на Density Filter маски: білі точки лежать уздовж торгової вулиці. Постав два маленькі куби на два протилежні кути білих точок і прочитай їхні Location. Поділи на 100 і введи як Shop Zone Min і Max у DA_TownRules_Harbour."}, {"en": "In Fill Row set Is Shop when the plot centre (in metres) is In Range on X and on Y; send shop plots to PreviewShops instead of PreviewPlots. You see yellow boxes along the shop street.", "uk": "У Fill Row задавай Is Shop, коли центр ділянки (у метрах) In Range і по X, і по Y. Ділянки крамниць подавай у PreviewShops замість PreviewPlots. Уздовж торгової вулиці жовті блоки."}], "play": {"en": "Zone check: the tutor names five plots by their distance inland and whether they are in the Shop Zone (10 m and in; 50 m and out; 120 m and in; 200 m and out; -5 m). With Min 2, Max 6 and Sea Max Distance 200, I give each one's floors before the plus or minus one, and its colour in the preview.", "uk": "Перевірка зон: тьютор називає п'ять ділянок за відстанню вглиб суходолу і за тим, чи вони в Shop Zone — 10 м і всередині; 50 м і поза; 120 м і всередині; 200 м і поза; -5 м. З Min 2, Max 6 і Sea Max Distance 200 я називаю поверхи кожної з точністю до одного й колір у попередньому перегляді."}, "video": {"search": "unreal engine 5 blueprint map range clamped random integer in range from stream"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Зони висот від моря та крамниці з маски (Day 88, lesson 3 of 4). Today's build: DA_TownRules (з класом PDA_TownRules) і план BP_TownGenerator, що його дотримується: відступи, лінія фасадів, зони висот від моря, площа з орієнтиром, ділянки крамниць, проміжки із зерна й зони-винятки коридорів.\nWhat I already know: День 87: DA_RoadLayout, а також план і попередній перегляд BP_TownGenerator; День 83: PCGE_DistanceToSea і його математика відстані; День 82: T_Mask_Shops; День 84 і День 85: KO_Corridor01, півширина коридору 7 м і LaneGauge; День 63 і День 68: Random Stream, поверхи й секції BP_Building.\nEarlier today I already did: lesson 1 (Правила зі справжніх міст, записані як дані); lesson 2 (Відступи, лінія фасадів і проміжки із зерна). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Переносити математику PCGE_DistanceToSea у функцію Blueprint Sea Distance, щоб кожна ділянка знала свою відстань углиб суходолу в метрах.\n2. Переводити цю відстань у діапазон Min–Max Floors, додавати плюс-мінус один із зерна й обмежувати результат.\n3. Позначати ділянки крамниць у межах Shop Zone, зчитаної з того, куди T_Mask_Shops лягає на рівні.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: 2 lines on why today matters and where it comes back, in plain words (from this: Генератор без правил робить візерунок, а правила роблять місце. Справжні міста відсувають будинки від тротуару, повертають їх до вулиці, будують вище подалі від води й відкривають площу довкола орієнтира. А тут треба ще й лишати вільні коридори для дронів. Коли ці правила лежать в одному асеті даних, характер усього мікрорайону змінює заміна одного асета, а те саме зерно завжди дає той самий план. It comes back: Завтра (День 89) BP_TownGenerator перетворить цей план на дороги, будинки й пропси, а в День 104 ті самі правила й зони-винятки сформують твій справжній район.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-88-town-placement-rules exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (Відступи, лінія фасадів, зони висот і проміжки в плані (на уроках)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Відкрий Point Loop Body у PCGE_DistanceToSea, виділи вузли Subtract, Normalize, Dot Product і Divide і скопіюй їх (Ctrl+C). У BP_TownGenerator створи функцію Sea Distance (вхід Point, Vector, см; вихід Metres, Float) і встав вузли (Ctrl+V).\n   2. Потім клацни правою кнопкою на вузлах змінних із червоною позначкою > Create variable. Або подай замість них Rules > Shore Point × 100 (вузол Multiply: правила тримають метри, а ця математика — сантиметри) і Rules > Inland Direction. Твоя математика з Дня 83 працює на новому місці.\n   3. У Fill Row виклич Sea Distance для центру ділянки плюс Get Actor Location і збережи в Sea Distance. Потім Floors = Clamp(Round(Map Range Clamped(Sea Distance, 0, Sea Max Distance, Min Floors, Max Floors)) + Random Integer in Range from Stream(-1, 1), Min Floors, Max Floors). Висота блоку — Floors × Floor Height × 100. Клацни Compile. Біля берега низькі блоки, углиб суходолу — високі. [screenshot]\n   4. Перемалюй маску під мікрорайон. Спершу скопіюй T_Mask_Shops.png як T_Mask_Shops_day82.png про запас. Зроби вид Top на попередній перегляд генератора, кадр — мікрорайон 200 м. У Krita намалюй біле вздовж тротуару однієї торгової вулиці (як у День 82), експортуй поверх T_Mask_Shops.png і зроби Reimport.\n   5. Постав над мікрорайоном PCG Volume з PCG_StreetDresser (Location 10000, 10000, 0, Scale 100, 100, 30), клацни Generate і натисни D на Density Filter маски: білі точки лежать уздовж торгової вулиці. Постав два маленькі куби на два протилежні кути білих точок і прочитай їхні Location. Поділи на 100 і введи як Shop Zone Min і Max у DA_TownRules_Harbour.\n   6. У Fill Row задавай Is Shop, коли центр ділянки (у метрах) In Range і по X, і по Y. Ділянки крамниць подавай у PreviewShops замість PreviewPlots. Уздовж торгової вулиці жовті блоки. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Перевірка зон: тьютор називає п'ять ділянок за відстанню вглиб суходолу і за тим, чи вони в Shop Zone — 10 м і всередині; 50 м і поза; 120 м і всередині; 200 м і поза; -5 м. З Min 2, Max 6 і Sea Max Distance 200 я називаю поверхи кожної з точністю до одного й колір у попередньому перегляді. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the nutes": 40, "goals": [{"en": "Reserve a landmark slot: the block holding Landmark Point gets an open square with one landmark plot at its centre.", "uk": "Резервувати місце під орієнтир: квартал з Landmark Point стає відкритою площею з однією ділянкою-орієнтиром у центрі."}, {"en": "Keep flight corridors clear: leave out any plot closer than Corridor Half Width to a keep-out spline, using Find Location Closest to World Location.", "uk": "Тримати польотні коридори вільними: пропускати кожну ділянку ближче за Corridor Half Width до сплайна зони-винятку, за допомогою Find Location Closest to World Location."}, {"en": "Draw the random numbers before the corridor test, so moving a corridor never reshuffles the rest of the town.", "uk": "Брати випадкові числа до перевірки коридору, щоб переміщення коридору ніколи не перетасовувало решту міста."}], "doalong": [{"en": "In the block loop, before the two Fill Row calls, add a Branch: Landmark Point's X In Range x0 to x1 AND its Y In Range y0 to y1. On True, add one S_Plot at the block's centre with Is Landmark ticked, and Add Box on PreviewLandmark (a 12 x 12 x 30 m box); skip the Fill Rows. On False, the two Fill Rows as before.", "uk": "У циклі кварталів перед двома викликами Fill Row додай Branch: X точки Landmark Point In Range від x0 до x1 AND її Y In Range від y0 до y1. При True додай один S_Plot у центрі кварталу з позначеним Is Landmark і Add Box на PreviewLandmark (блок 12 × 12 × 30 м), а Fill Row пропусти. При False — два Fill Row, як раніше."}, {"en": "Compile. You see one block turn into an open square with a tall box in the middle. A whole block is far bigger than a lively real square (short side 14 to 18 m, street-dimensions.md): keep it this big so the landmark reads from drone height; trees, benches and a café will fill it later.", "uk": "Клацни Compile. Один квартал стає відкритою площею з високим блоком посередині. Цілий квартал набагато більший за жваву справжню площу (коротший бік 14–18 м, street-dimensions.md). Лиши його таким, щоб орієнтир було видно з висоти дрона; дерева, лавки й кафе заповнять його згодом."}, {"en": "Add Keep Outs (Actor, Array, Instance Editable) and pick KO_Corridor01 with the eyedropper (first draw KO_Corridor01 across one block about 15 m up, tag KeepOutWide, as on Day 84; untick Is Spatially Loaded only if your level uses World Partition). Make a function Is In Corridor (inputs Point and Radius, cm; output Boolean): For Each Keep Outs > Get Component by Class (Spline Component) > Is Valid > Find Location Closest to World Location (World Location = Point, Coordinate Space World).", "uk": "Спершу проведи KO_Corridor01 через один квартал на висоті близько 15 м, тег KeepOutWide, як у День 84; прапорець Is Spatially Loaded зніми, лише якщо рівень використовує World Partition. Додай Keep Outs (Actor, Array, Instance Editable) і вибери KO_Corridor01 піпеткою. Створи функцію Is In Corridor (входи Point і Radius, см; вихід Boolean): For Each по Keep Outs > Get Component by Class (Spline Component) > Is Valid > Find Location Closest to World Location (World Location = Point, Coordinate Space World)."}, {"en": "Distance2D (Vector) between it and Point; if it is below Corridor Half Width x 100 + Radius, Return true. After the loop, Return false. You see a small, readable test. If Find Location Closest to World Location is not offered, drag from the spline component and search closest.", "uk": "Distance2D (Vector) між знайденою точкою й Point. Якщо вона менша за Corridor Half Width × 100 + Radius, Return true. Після циклу — Return false. Має вийти маленька зрозуміла перевірка. Якщо Find Location Closest to World Location немає, потягни від компонента сплайна й пошукай closest."}, {"en": "In Fill Row, after all the random draws for a plot, call Is In Corridor with the plot's world centre and half its width as Radius; on true, don't add the plot or its box. Compile and nudge the generator. You see a clear lane through the block under the corridor. If Distance2D is not offered, set both points' Z to 0 and use Distance (Vector).", "uk": "У Fill Row, після всіх випадкових чисел для ділянки, виклич Is In Corridor зі світовим центром ділянки й половиною її ширини як Radius. При true не додавай ні ділянку, ні її блок. Клацни Compile і посунь генератор: під коридором через квартал тягнеться вільна смуга. Якщо Distance2D немає, встанови Z обох точок на 0 і візьми Distance (Vector)."}, {"en": "Move KO_Corridor01, then nudge the generator (the plan rebuilds when the generator changes, not when the corridor moves). You see the lane follow the corridor while every other plot keeps its gap and its height.", "uk": "Пересунь KO_Corridor01, потім посунь генератор: план перебудовується, коли змінюється генератор, а не коли рухається коридор. Смуга йде за коридором, а кожна інша ділянка зберігає свій проміжок і висоту."}], "play": {"en": "Corridor judge: the tutor gives me four plots (centre 3 m from the corridor and 12 m wide; 15 m away and 12 m wide; 9 m away and 6 m wide; 30 m away). With Corridor Half Width 7 m, I say which stay and which go, and why the plot's own half-width counts.", "uk": "Суддя коридору: тьютор дає чотири ділянки — центр за 3 м від коридору, ширина 12 м; за 15 м, ширина 12 м; за 9 м, ширина 6 м; за 30 м. З Corridor Half Width 7 м я кажу, які лишаються, а які ні, і чому враховується півширина самої ділянки."}, "video": {"search": "unreal engine 5 blueprint find location closest to world location spline distance"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Площа з орієнтиром і польотні коридори (Day 88, lesson 4 of 4). Today's build: DA_TownRules (з класом PDA_TownRules) і план BP_TownGenerator, що його дотримується: відступи, лінія фасадів, зони висот від моря, площа з орієнтиром, ділянки крамниць, проміжки із зерна й зони-винятки коридорів.\nWhat I already know: День 87: DA_RoadLayout, а також план і попередній перегляд BP_TownGenerator; День 83: PCGE_DistanceToSea і його математика відстані; День 82: T_Mask_Shops; День 84 і День 85: KO_Corridor01, півширина коридору 7 м і LaneGauge; День 63 і День 68: Random Stream, поверхи й секції BP_Building.\nEarlier today I already did: lesson 1 (Правила зі справжніх міст, записані як дані); lesson 2 (Відступи, лінія фасадів і проміжки із зерна); lesson 3 (Зони висот від моря та крамниці з маски). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Резервувати місце під орієнтир: квартал з Landmark Point стає відкритою площею з однією ділянкою-орієнтиром у центрі.\n2. Тримати польотні коридори вільними: пропускати кожну ділянку ближче за Corridor Half Width до сплайна зони-винятку, за допомогою Find Location Closest to World Location.\n3. Брати випадкові числа до перевірки коридору, щоб переміщення коридору ніколи не перетасовувало решту міста.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your fir

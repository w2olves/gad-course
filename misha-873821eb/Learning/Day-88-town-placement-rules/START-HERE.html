алу з позначеним Is Landmark і Add Box на PreviewLandmark (блок 12 × 12 × 30 м), а Fill Row пропусти. При False — два Fill Row, як раніше.\n   2. Клацни Compile. Один квартал стає відкритою площею з високим блоком посередині. Цілий квартал набагато більший за жваву справжню площу (коротший бік 14–18 м, street-dimensions.md). Лиши його таким, щоб орієнтир було видно з висоти дрона; дерева, лавки й кафе заповнять його згодом.\n   3. Спершу проведи KO_Corridor01 через один квартал на висоті близько 15 м, тег KeepOutWide, як у День 84; прапорець Is Spatially Loaded зніми, лише якщо рівень використовує World Partition. Додай Keep Outs (Actor, Array, Instance Editable) і вибери KO_Corridor01 піпеткою. Створи функцію Is In Corridor (входи Point і Radius, см; вихід Boolean): For Each по Keep Outs > Get Component by Class (Spline Component) > Is Valid > Find Location Closest to World Location (World Location = Point, Coordinate Space World). [screenshot]\n   4. Distance2D (Vector) між знайденою точкою й Point. Якщо вона менша за Corridor Half Width × 100 + Radius, Return true. Після циклу — Return false. Має вийти маленька зрозуміла перевірка. Якщо Find Location Closest to World Location немає, потягни від компонента сплайна й пошукай closest.\n   5. У Fill Row, після всіх випадкових чисел для ділянки, виклич Is In Corridor зі світовим центром ділянки й половиною її ширини як Radius. При true не додавай ні ділянку, ні її блок. Клацни Compile і посунь генератор: під коридором через квартал тягнеться вільна смуга. Якщо Distance2D немає, встанови Z обох точок на 0 і візьми Distance (Vector).\n   6. Пересунь KO_Corridor01, потім посунь генератор: план перебудовується, коли змінюється генератор, а не коли рухається коридор. Смуга йде за коридором, а кожна інша ділянка зберігає свій проміжок і висоту. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Суддя коридору: тьютор дає чотири ділянки — центр за 3 м від коридору, ширина 12 м; за 15 м, ширина 12 м; за 9 м, ширина 6 м; за 30 м. З Corridor Half Width 7 м я кажу, які лишаються, а які ні, і чому враховується півширина самої ділянки. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; see-why-fix note = нотатка «бачу, чому, як виправити»; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); File Explorer = Провідник; vertex / edge / face = вершина / ребро / грань; origin (and kit pivot) = origin — точка, за яку об'єкт ставлять і обертають; world origin / 3D cursor = центр світу / 3D-курсор; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; collision / UCX collision box = колізія / блок UCX; material slot / node / pin = слот матеріалу / вузол / вхід; volume (PCG Volume, Post Process Volume) = об'єм; seed = зерно (налаштування Seed); drone flight corridor = польотний коридор; kit / kit piece / part of one object = набір / деталь / частина; map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; district / plot / plot plan = район / ділянка / план ділянки; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; shop front / shop window = фасад крамниці / вітрина; vista / blockout / landmark = панорама / блокаут / орієнтир; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}], "handin": [{"en": "summary.md", "uk": "summary.md (звіт дня)"}, {"en": "rules_60m_day88.png (the rule-following plan: setbacks, height zones, a landmark square, a corridor) (proof)", "uk": "rules_60m_day88.png (план за правилами: відступи, зони висот, площа з орієнтиром, коридор) (доказ)"}], "goal": {"en": "By the end of today you have a BP_TownGenerator plan that follows DA_TownRules: plots set back from the pavement, fronts facing the street, heights rising away from the sea, a landmark square, shop plots matching T_Mask_Shops, seeded gaps, and no plot under a flight corridor, all visible in the preview and repeatable from one seed.", "uk": "До кінця дня план BP_TownGenerator дотримуватиметься DA_TownRules. Ділянки відступають від тротуару, фасади дивляться на вулицю, висоти ростуть від моря, є площа з орієнтиром, ділянки крамниць за T_Mask_Shops, проміжки із зерна й жодної ділянки під польотним коридором. Усе видно в попередньому перегляді й повторюється з одного зерна."}, "uses": [{"en": "Day 87: DA_RoadLayout and BP_TownGenerator's plan and preview", "uk": "День 87: DA_RoadLayout, а також план і попередній перегляд BP_TownGenerator"}, {"en": "Day 83: PCGE_DistanceToSea and its distance maths", "uk": "День 83: PCGE_DistanceToSea і його математика відстані"}, {"en": "Day 82: T_Mask_Shops", "uk": "День 82: T_Mask_Shops"}, {"en": "Days 84 and 85: KO_Corridor01, the 7 m corridor half-width and LaneGauge", "uk": "День 84 і День 85: KO_Corridor01, півширина коридору 7 м і LaneGauge"}, {"en": "Days 63 and 68: Random Streams and BP_Building's floors and bays", "uk": "День 63 і День 68: Random Stream, поверхи й секції BP_Building"}], "quiz": [{"q": {"en": "Seed 1 gives a different plan after you add a corridor somewhere else. What breaks the rule?", "uk": "Після того як ти додаєш коридор деінде, Seed 1 дає інший план. Що порушує правило?"}, "options": [{"en": "The corridor test runs before some random draws, so dropped plots skip their numbers and every later plot shifts", "uk": "Перевірка коридору стоїть перед частиною випадкових чисел, тож відкинуті ділянки пропускають свої числа, і всі наступні зсуваються"}, {"en": "The Seed is too small", "uk": "Seed замалий"}, {"en": "Keep Outs is empty", "uk": "Keep Outs порожній"}, {"en": "The landmark moved", "uk": "Орієнтир переїхав"}], "answer": 0, "explain": {"en": "Draw every plot's numbers first, then decide whether to drop it, so the stream stays in step.", "uk": "Спершу бери всі числа ділянки, потім вирішуй, чи її відкинути, — так потік лишається синхронним."}}, {"q": {"en": "Your buildings show their backs to the street on the +Y edge of every block. What do you change?", "uk": "На краю +Y кожного кварталу будинки стоять до вулиці спиною. Що змінити?"}, "options": [{"en": "Setback", "uk": "Setback"}, {"en": "Front Turn, or the + 180 for rows facing +Y", "uk": "Front Turn або + 180 для рядів на +Y"}, {"en": "Gap Chance", "uk": "Gap Chance"}, {"en": "The Shop Zone", "uk": "Shop Zone"}], "answer": 1, "explain": {"en": "Yaw comes from Front Turn and Front Dir; one of them doesn't match how your building faces.", "uk": "Yaw береться з Front Turn і Front Dir, і одне з них не відповідає тому, куди дивиться твій будинок."}}, {"q": {"en": "What does Map Range Clamped(Sea Distance, 0, 200, 2, 6) give for a plot 100 m inland?", "uk": "Що дає Map Range Clamped(Sea Distance, 0, 200, 2, 6) для ділянки за 100 м углиб суходолу?"}, "options": [{"en": "2", "uk": "2"}, {"en": "6", "uk": "6"}, {"en": "100", "uk": "100"}, {"en": "4", "uk": "4"}], "answer": 3, "explain": {"en": "100 m is halfway from 0 to 200, so it maps halfway from 2 to 6: 4 floors before the plus or minus one.", "uk": "100 м — середина від 0 до 200, тож це середина від 2 до 6: 4 поверхи плюс-мінус один."}}, {"q": {"en": "Why is the corridor test Distance2D and not Distance?", "uk": "Чому перевірка коридору використовує Distance2D, а не Distance?"}, "options": [{"en": "Distance2D is faster", "uk": "Distance2D швидша"}, {"en": "Distance needs a seed", "uk": "Distance потребує зерна"}, {"en": "The corridor flies 15 m up; a 3D distance would add that height and let plots stay under it", "uk": "Коридор на висоті 15 м: 3D-відстань додала б цю висоту, і ділянки під ним лишилися б"}, {"en": "Splines have no Z", "uk": "У сплайнів немає Z"}], "answer": 2, "explain": {"en": "A corridor is a column of air over the ground; only the distance across the ground decides if a building would block it.", "uk": "Коридор — це стовп повітря над землею, і лише відстань по землі вирішує, чи будинок його перекриє."}}, {"q": {"en": "Why keep the rules in DA_TownRules instead of on the generator?", "uk": "Чому правила краще тримати в DA_TownRules, а не на генераторі?"}, "options": [{"en": "Data assets compile faster", "uk": "Асети даних компілюються швидше"}, {"en": "One swap of the Rules asset changes the character of the whole quarter, and rule sets can be shared", "uk": "Заміна одного асета Rules змінює характер усього мікрорайону, а правила можна ділити між генераторами"}, {"en": "Blueprints can't hold numbers", "uk": "Blueprint не можуть тримати числа"}, {"en": "PCG needs data assets", "uk": "PCG потребує асетів даних"}], "answer": 1, "explain": {"en": "A rule set is a design decision; keeping it as data lets you compare and reuse characters without touching the graph.", "uk": "Набір правил — дизайнерське рішення. Якщо тримати його як дані, характери можна порівнювати й повторно використовувати, не чіпаючи графа."}}], "weekInfo": null, "morning": {"sofar": {"en": "You have BP_Road and a live town plan in BP_TownGenerator: roads, junctions, blocks and plots from DA_RoadLayout.", "uk": "Ти маєш BP_Road і живий план міста в BP_TownGenerator: дороги, перехрестя, квартали й ділянки з DA_RoadLayout."}, "today": {"en": "You give the plan rules: setbacks, frontage, heights by the sea, a landmark square, shops from your mask, and lanes kept clear for drones.", "uk": "Ти даєш плану правила: відступи, лінію фасадів, висоти від моря, площу з орієнтиром, крамниці з маски й смуги, вільні для дронів."}, "cheer": {"en": "Rules are where your taste as a designer enters the code; take time with the numbers, because they decide whether the quarter feels like a real place.", "uk": "Правила — це місце, де твій смак дизайнера входить у код. Не поспішай із числами: вони вирішують, чи відчуватиметься мікрорайон справжнім місцем."}, "quote": {"text": {"en": "Looking at cities can give a special pleasure, however commonplace the sight may be.", "uk": "Дивитися на міста може бути особливою втіхою, як би буденно не виглядало це видовище."}, "author": {"en": "Kevin Lynch", "uk": "Кевін Лінч"}, "source": "The Image of the City (book), 1960"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-88-town-placement-rules", "mapHref": "../../COURSE.html", "prevHref": "../Day-87-road-layout-junctions-plots/START-HERE.html", "nextHref": "../Day-89-town-generator-v1-regenerate/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8 and Krita. I am a beginner on Day 88. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me: when my Blueprint or script fails, ask for the error message or a screenshot of the graph, point to the line or node that is wrong and explain why, then let me fix it myself. Never write the whole tool for me.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: Самостійно: другі правила DA_TownRules_Inland з іншим характером.\nIt's part of: DA_TownRules (з класом PDA_TownRules) і план BP_TownGenerator, що його дотримується: відступи, лінія фасадів, зони висот від моря, площа з орієнтиром, ділянки крамниць, проміжки із зерна й зони-винятки коридорів (Content/Tools/Data (PDA_TownRules, DA_TownRules_Harbour), BP_TownGenerator у Content/Tools/Blueprints, тренувальний рівень Content/Tools/Day88/L_Day88 (копія L_Day87).).\nWhy it matters: Генератор без правил робить візерунок, а правила роблять місце. Справжні міста відсувають будинки від тротуару, повертають їх до вулиці, будують вище подалі від води й відкривають площу довкола орієнтира. А тут треба ще й лишати вільні коридори для дронів. Коли ці правила лежать в одному асеті даних, характер усього мікрорайону змінює заміна одного асета, а те саме зерно завжди дає той самий план. It comes back: Завтра (День 89) BP_TownGenerator перетворить цей план на дороги, будинки й пропси, а в День 104 ті самі правила й зони-винятки сформують твій справжній район.\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-88-town-placement-rules (on the drive I chose on Day 0).\nWhat I already know: День 87: DA_RoadLayout, а також план і попередній перегляд BP_TownGenerator; День 83: PCGE_DistanceToSea і його математика відстані; День 82: T_Mask_Shops; День 84 і День 85: KO_Corridor01, півширина коридору 7 м і LaneGauge; День 63 і День 68: Random Stream, поверхи й секції BP_Building; today's lessons: Правила зі справжніх міст, записані як дані; Відступи, лінія фасадів і проміжки із зерна; Зони висот від моря та крамниці з маски; Площа з орієнтиром і польотні коридори. Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- PDA_TownRules і DA_TownRules_Harbour з підказками й одиницями: Setback (м, 2), Plot Width (м, 12), Plot Depth (м, 16), Bay Width (м, 2 — Bay Width твоїх стилів, 200 см, День 66), Gap Chance (від 0 до 1, 0.12), Min Floors (2), Max Floors (6), Floor Height (м, 3 — Floor Height твоїх стилів), Shore Point (Vector, м; для тренувального мікрорайону 0, -20, 0), Inland Direction (Vector, 0, 1, 0), Sea Max Distance (м, 200), Landmark Point (Vector, м, наприклад 150, 150, 0), Shop Zone Min і Shop Zone Max (Vector, м), Corridor Half Width (м, 7), Front Turn (градуси, 0, бо фасад BP_Building уже дивиться на -Y) і House Depth (м, 4 — глибина BP_Building, День 67).\n- S_Plot отримує Front (Vector, см: середина фасаду будинку на лінії відступу), Floors (Integer), Bays (Integer), Yaw (Float), Sea Distance (Float, м), Is Gap, Is Shop і Is Landmark (Boolean). BP_TownGenerator отримує Rules (PDA_TownRules), Seed (Integer) і Keep Outs (масив Actor), усі Instance Editable, а також компоненти PreviewShops і PreviewLandmark.\n- Construction Script спершу робить Random Stream із Seed. Кожен випадковий вибір бере числа з нього в однаковому порядку для кожної ділянки, тож одне зерно завжди дає один план.\n- Fill Row застосовує правила. Глибина — не більше половини кварталу мінус відступ; фасади на лінії відступу. Bays = Floor((ширина ділянки - 1 м) / Bay Width), не менше 1, тож між сусідами лишається проміжок. Блок попереднього перегляду показує сам будинок за фасадом: Bays × Bay Width завширшки, House Depth завглибшки, Floors × Floor Height заввишки. Yaw = Front Turn для рядів, що дивляться на -Y, і Front Turn + 180 для рядів на +Y. Floors береться з відстані до моря (та сама математика, що в PCGE_DistanceToSea), переведеної в діапазон Min–Max Floors, плюс-мінус 1 з потоку. Проміжки — за Gap Chance, крамниці — у Shop Zone. Ділянки ближче за Corridor Half Width до будь-якого сплайна з Keep Outs пропускаються.\n- Клітинка з Landmark Point не отримує рядів: одна ділянка-орієнтир у її центрі, а довкола відкрита площа.\n- T_Mask_Shops перемальовано під мікрорайон (стару PNG збережено як копію), а Shop Zone зчитано з того, куди на рівні лягають її білі точки.\n\nMy checklist (the same numbers show on my course page):\n1. Спершу переконайся, що результати сьогоднішніх уроків на місці: PDA_TownRules, DA_TownRules_Harbour і план BP_TownGenerator з відступами, лінією фасадів, зонами висот і проміжками. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Слабкий ПК (16 ГБ оперативної пам'яті або менше): під час роботи зменш об'єм PCG до 100 × 100 м, а для фінальних зображень збільш (див. розділ «Слабкий ПК» на сторінці ACCOUNTS-AND-INSTALLS.html). Відкрий L_Day88, вибери BP_TownGenerator (Layout DA_RoadLayout, Rules DA_TownRules_Harbour, Seed 1) і подивись на виді Top і з 60 м. Перевірка: блоки ділянок відступають від доріг, далі від берега вищі, є кілька проміжків, жовті ділянки крамниць і один високий блок-орієнтир у відкритій клітинці. (from lesson 2)\n2. Зміни Seed на 2, потім поверни 1, щоразу трохи посуваючи генератор. Перевірка: Seed 2 переносить проміжки й змінює частину висот, а Seed 1 точно повертає перший план. (from lesson 2)\n3. Зміни Setback на 5 у DA_TownRules_Harbour, збережи й посунь генератор. Перевірка: кожен ряд відступає від своєї дороги ще на 3 м, і жоден ряд не перетинає середину кварталу. Поверни 2. (from lesson 2)\n4. Постав вручну один BP_Building origin у кут фасаду блоку попереднього перегляду, де починається будинок: у ряду на -Y — кут фасаду з меншим X, у ряду на +Y — з більшим X. Yaw — як у ділянки: 0 у ряду на -Y, 180 у ряду на +Y. Перевірка: його фасад збігається з фасадом блоку й дивиться на дорогу. Якщо ні, виправ Front Turn. (from lesson 1)\n5. Перенеси орієнтир: зміни Landmark Point на місце в іншому кварталі й посунь генератор. Перевірка: той квартал стає відкритою площею з високим блоком-орієнтиром, а старий знову заповнюється ділянками. (from lesson 4)\n6. Пересунь KO_Corridor01 через квартал (він має бути в списку Keep Outs генератора), потім посунь генератор. Збережи L_Day88, відкрий будь-який інший рівень, а тоді знову L_Day88. Перевірка: ближче 7 м від лінії коридору немає жодного блоку ділянки, а LaneGauge ковзає вздовж нього на висоті 15 м, нічого не торкаючись. (from lesson 4)\n7. Зменш Sea Max Distance до 80 і посунь генератор. Перевірка: високі блоки тепер починаються набагато ближче до берега. Лиши значення, яке тобі більше подобається. (from lesson 3)\n8. Перевір ділянки крамниць: клацни Generate на PCG Volume з PCG_StreetDresser над мікрорайоном і натисни D на Density Filter його маски. Перевірка: жовті ділянки крамниць лежать уздовж того самого краю вулиці, що й білі точки маски. (from lesson 3)\n9. Самостійно: продублюй DA_TownRules_Harbour як DA_TownRules_Inland і дай йому інший характер, наприклад: Setback 4, Plot Width 18, Min Floors 1, Max Floors 3, Gap Chance 0.25, без Shop Zone. Перевірка: заміна Rules на генераторі перетворює ті самі дороги на тихіший, нижчий мікрорайон. (from lesson 1)\n10. Зроби скриншот rules_60m_day88.png: план з 60 м під кутом, висоти добре видно. Перевірка: зображення в робочій папці дня. (from lesson 2)\n11. Клацни «Копіювати звіт дня», встав текст у новий чат із тьютором, дай відповіді на його запитання й збережи відповідь як summary.md у робочій папці дня. Здай роботу: перетягни файли в сьогоднішню папку здачі (кнопка на цій сторінці): summary.md і rules_60m_day88.png. Папку проєкту чи рівня Unreal здавати не треба: вона дуже велика. Перевірка: у папці здачі 2 файли, кожен більший за 1 КБ. (from lesson 1)\n\nHow to help: ask whi const HIN=(D.handin||[]).map(v=>(v&&v.en)||(typeof v==='string'?v:'')).join(' ').toLowerCase(),hasClip=/\.mp4|clip/.test(HIN);
function hItem(v){return x(v)}
function hList(){return '<ul class="ticks">'+(D.handin||[]).map(v=>'<li>'+lk(hItem(v))+'</li>').join('')+'</ul>'}
const NFILES=new Set((HIN.match(/[\w-]+\.(?:blend|glb|fbx|png|jpe?g|md|txt|mp4|csv|zip|pdf|webp|kra|psd|tga|exr|json|py|uasset|umap)\b/g)||[])).size;
function nFiles(n){if(!n)return '';if(lang==='en')return ' · '+n+(n===1?' file':' files');const a=n%10,b=n%100;return ' · '+n+' '+(a===1&&b!==11?'файл':a>=2&&a<=4&&(b<12||b>14)?'файли':'файлів')}
function hf(){return D.handinUrl?'<div class="row"><a class="btn s" href="'+esc(D.handinUrl)+'" target="_blank" rel="noopener">'+ic('folder')+u('hOpen')+'</a></div>':'<p class="path">'+ic('folder')+'<span>'+u('hPath')+' <code>'+esc(D.workPath)+'</code></span></p>'}
function handinCard(){if(!D.handin||!D.handin.length)return '';return '<section class="card glass handin">'+lab(u('hTitle')+nFiles(NFILES),'ok')+hList()+hf()+'<p class="muted" style="margin:12px 0 0">'+u('hNote')+'</p></section>'}
function beforeCard(){if(!D.before||!D.before.length)return '';return '<section class="card glass before">'+lab(u('before'),'gold')+list(D.before,'ol','steps')+'</section>'}
function chkList(){const a=[];if(HIN.indexOf('.blend')>=0)a.push('chk1');if(/\.(glb|fbx)\b/.test(HIN))a.push('chk2');a.push('chk3');if(hasClip)a.push('chk4');return '<h3>'+u('chk')+'</h3><ol class="steps">'+a.map(k=>'<li>'+u(k)+'</li>').join('')+'</ol>'}
function qCard(){return '<section class="card glass qcard">'+lab(u('qTitle'))+'<ul class="ticks"><li>'+u('q1')+'</li><li>'+u('q2')+'</li><li>'+u('q3')+'</li><li>'+u('q4')+'</li><li>'+u('q5')+'</li></ul></section>'}
function reportText(){let t=D.reportPrompt;const r=D.lessons.map((l,i)=>{const v=(st['r'+i]||'').trim();return v?'Lesson '+(i+1)+': '+v:''}).filter(Boolean);
 if(r.length)t+='\n\nMy lesson summaries, pasted from my course page:\n'+r.join('\n');
 if(st.qs1)t+='\nMy first score in the Check yourself quiz: '+st.qs1[0]+' of '+st.qs1[1]+'.';
 return t}
function qDone(){return D.quiz&&D.quiz.length&&st.qa&&D.quiz.every((q,i)=>st.qa[i]!=null)}
function prog(){const Q=(D.quiz&&D.quiz.length)?1:0,L=D.lessons.length,C=D.build.steps.length;let n=0;D.lessons.forEach((l,i)=>{if(st['q'+i])n++});D.build.steps.forEach((s,i)=>{if(st['c'+i])n++});if(Q&&qDone())n++;return (L+C+Q)?n/(L+C+Q):0}
function qScore(){let n=0;D.quiz.forEach((q,i)=>{if((st.qa||{})[i]===q.answer)n++});return n}
function pick(i,k){st.qa=st.qa||{};if(st.qa[i]!=null)return;st.qa[i]=k;if(qDone()){st.qs=[qScore(),D.quiz.length];if(!st.qs1)st.qs1=st.qs.slice()}save();render();const e=document.getElementById('e'+i);if(e)e.focus({preventScroll:true})}
function retry(){st.qa={};delete st.qs;save();render();const e=document.getElementById('o0_0');if(e)e.focus()}
const isBoss=!!(D.build&&D.build.boss&&D.build.boss.length),isFin=D.day===D.total;
document.body.className=isFin?'fin':isBoss?'boss':'';
const lk=s=>esc(s).replace(/https?:\/\/[^\s<']*[^\s<.,;:)']/g,m=>'<a href="'+m+'" target="_blank" rel="noopener">'+m+'</a>');
function list(a,tag,cls){return '<'+tag+(cls?' class="'+cls+'"':'')+'>'+(a||[]).map(i=>'<li>'+lk(x(i))+'</li>').join('')+'</'+tag+'>'}
const lab=(t,k)=>'<div class="lab'+(k?' k-'+k:'')+'"><span class="dotc"></span>'+t+'</div>';
const kn=n=>'<span class="kn">'+ic(n)+'</span>';
const slider=p=>'<div class="slider"><i style="width:calc('+p+'% - 6px)"></i><b style="left:clamp(13px,'+p+'%,calc(100% - 13px))"></b></div>';
function quiz(){if(!D.quiz||!D.quiz.length)return '';const a=st.qa||{};let ok=0;const L=u('letters');
 const pips='<div class="pips well" aria-hidden="true">'+D.quiz.map((q,i)=>'<i class="'+(a[i]==null?'':a[i]===q.answer?'r':'w')+'"></i>').join('')+'</div>';
 const qs=D.quiz.map((q,i)=>{const c=a[i];if(c===q.answer)ok++;return '<div class="qz"><p class="qq"><span class="qn">'+(i+1)+'</span><span>'+lk(x(q.q))+'</span></p>'+q.options.map((o,k)=>{let cls='opt',mk='<span></span>';if(c!=null){if(k===q.answer){cls+=' right';mk=ic('check','mk')}else if(k===c){cls+=' wrong';mk=ic('x','mk')}}return '<button class="'+cls+'" id="o'+i+'_'+k+'"'+(c!=null?' disabled':'')+' onclick="pick('+i+','+k+')"><span class="lt">'+(L[k]||k+1)+'</span><span>'+esc(x(o))+'</span>'+mk+'</button>'}).join('')+(c!=null?'<p class="exp '+(c===q.answer?'r':'w')+'" id="e'+i+'" tabindex="-1"><b>'+(c===q.answer?u('right'):u('wrong'))+'</b>'+lk(x(q.explain))+'</p>':'')+'</div>'}).join('');
 return '<section class="card glass quiz">'+lab(u('quiz'),'gold')+'<p class="muted" style="margin:-6px 0 14px">'+u('quizSub')+'</p>'+pips+qs+(qDone()?'<div class="score well" role="status"><span class="eyebrow">'+u('score')+'</span><span class="lcd" aria-label="'+ok+' / '+D.quiz.length+'">'+seg(ok+'/'+D.quiz.length)+'</span>'+(st.qs1?'<span class="muted">'+u('first')+': '+st.qs1[0]+'/'+st.qs1[1]+'</span>':'')+'<div class="row"><button class="btn ghost" id="retry" onclick="retry()">'+u('retry')+'</button></div></div>':'')+'</section>'}
function vid(v){if(!v)return '';const link=v.url?'<a href="'+esc(v.url)+'" target="_blank" rel="noopener">'+esc(x(v.title)||v.url)+'</a>'+(v.channel?' <span class="muted">· '+esc(v.channel)+(v.length?' · '+esc(v.length):'')+'</span>':''):'';const s=v.search?'<a href="https://www.youtube.com/results?search_query='+encodeURIComponent(v.search)+'" target="_blank" rel="noopener">'+u('noVid')+': '+esc(v.search)+'</a>':'';const alt=v.alt&&v.alt.url?'<br><span class="eyebrow">UA</span> <a href="'+esc(v.alt.url)+'" target="_blank" rel="noopener">'+esc(v.alt.title||v.alt.url)+'</a>'+(v.alt.channel?' <span class="muted">· '+esc(v.alt.channel)+'</span>':''):'';return '<div class="vid well">'+kn('play')+'<div><b>'+u('more')+'?</b><br>'+(link||s)+alt+(link&&s?'<br><span class="muted" style="font-size:14px">'+s+'</span>':'')+'</div></div>'}
function morning(){const m=D.morning;if(!m)return '';const q=m.quote||{};
 let shelf='';if(D.day>0){shelf='<div class="shelf" aria-hidden="true">';let g='';for(let d=0;d<D.day;d++){let p=0;try{p=(JSON.parse(localStorage.getItem('devteam:'+D.learner+':'+d))||{}).pct||0}catch(e){}g+='<i class="'+(p>=1?'d':'')+(d>0&&d%5===0?' bs':'')+'"></i>';if(d%5===0||d===D.day-1){shelf+='<span class="wkg">'+g+'</span>';g=''}}shelf+='</div>'}
 const qt=lang==='uk'&&q.original?q.original:x(q.text);
 return '<section class="card glass morning"><div class="mgrid">'+(m.sofar?'<div>'+lab(u('sofar'),'gold')+shelf+'<p class="mtxt">'+lk(x(m.sofar))+'</p></div>':'')+(m.today?'<div>'+lab(u('todayL'))+'<p class="mtxt">'+lk(x(m.today))+'</p></div>':'')+'</div>'+(m.cheer?'<p class="cheer">'+esc(x(m.cheer))+'</p>':'')+(qt?'<figure class="quote well">'+kn('quote')+'<blockquote>'+esc(qt)+'</blockquote>'+(q.author?'<figcaption>'+esc(x(q.author))+'</figcaption>':'')+'</figure>':'')+'</section>'}
function setLang(l){lang=l;try{localStorage.setItem('devteam:lang',lang)}catch(e){};render()}
function toggleLang(){setLang(lang==='uk'?'en':'uk')}
/* keep open sections and keyboard focus across re-renders */
const openD=new Set();
function tg(e){if(e.open)openD.add(e.id);else openD.delete(e.id)}
const op=id=>openD.has(id)?' open':'';
function render(){const ae=document.activeElement,fid=ae&&(ae.id||(ae.getAttribute('data-th')?'th-'+ae.getAttribute('data-th'):ae.getAttribute('lang')&&ae.closest('.seg')?'lg-'+ae.getAttribute('lang'):''));
 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);
 const b=D.build,P=Math.round(prog()*100);
 document.getElementById('top').innerHTML='<div class="topin glass"><a class="maplink" href="'+esc(D.mapHref)+'">'+kn('map')+u('map')+'</a><div class="crumb"><b>'+esc(x(D.learnerName))+'</b><span>'+u('week')+' '+D.week+'</span><span>'+u('day')+' '+D.day+' '+u('of')+' '+D.total+'</span></div>'+controls(lang,'setLang')+'</div><div class="tline"><i style="width:'+P+'%"></i></div>';
 const state=w=>w<D.week?'b':w===D.week?'n':'p';
 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 let wk='';if(D.weekInfo){const w=D.weekInfo;wk='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}
 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p>'+(b.next?'<div class="back well">'+kn('arrow')+'<div><b>'+u('comes')+'</b><br>'+lk(x(b.next))+'</div></div>':'')+'<div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.assetFiles&&D.assetFiles.length?'<p class="files">'+ic('folder')+'<span>'+u('filesL')+' '+D.assetFiles.map(f=>'<a href="assets/'+encodeURIComponent(f)+'" target="_blank" rel="noopener">'+esc(f)+'</a>').join(', ')+'</span></p>':D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+=handinCard();h+=beforeCard();
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div><label class="rcpt" for="r'+i+'"><span class="eyebrow">'+u('rcpt')+'</span><textarea id="r'+i+'" rows="2" placeholder="'+esc(u('rcptPh'))+'" oninput="st.r'+i+'=this.value;save()">'+esc(st['r'+i]||'')+'</textarea></label>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+hList()+chkList()+(hasClip?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<h3>1 · '+u('copyR')+'</h3><p class="muted">'+u('report')+'</p><div class="row"><button class="btn ghost" onclick="cp(reportText())">'+ic('copy')+u('copyR')+'</button></div><h3>2 · '+u('ship')+'</h3>'+hf()+'<p class="muted" style="margin:12px 0 0">'+u('hNote')+'</p></section>';
 h+=qCard();h+=wk;
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();
</script>
</body>
</html>

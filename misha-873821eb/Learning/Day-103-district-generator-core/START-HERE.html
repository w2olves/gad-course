<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 103</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

<script id="data" type="application/json">{"learner": "ib-misha-873821eb", "learnerName": {"en": "Misha", "uk": "Міша"}, "day": 103, "week": 21, "total": 110, "title": {"en": "Generator core: roads, junctions, plots and houses from the real plan", "uk": "Ядро генератора: дороги, перехрестя, ділянки й будинки за справжнім планом"}, "theme": {"en": "Week 21: Capstone 1: the District Generator", "uk": "Тиждень 21: Випускний проєкт 1: District Generator"}, "build": {"item": {"en": "BP_DistrictGenerator's core: Spawn Roads (BP_Road or BP_Lane per street, shaped through a new Points pin), Spawn Junctions (BP_JunctionTable wherever streets meet), Make Plots (plots along each road's own spline, kept off other roads, the square and each other), and the reused Spawn Buildings and Spawn Landmark", "uk": "Ядро BP_DistrictGenerator: Spawn Roads (BP_Road або BP_Lane на кожну вулицю, форма — через новий вхід Points), Spawn Junctions (BP_JunctionTable там, де сходяться вулиці), Make Plots (ділянки вздовж власного сплайна кожної дороги, на відстані від інших доріг, площі й одна від одної) і повторно використані Spawn Buildings та Spawn Landmark"}, "why": {"en": "This is where real streets become a town: every street gets its road, every crossing its junction and every frontage its houses, following the curves the way real builders did. Real street networks break the neat rules of a grid, so the generator has to measure from the roads themselves. Building along splines instead of a grid is what lets your tool take any town.", "uk": "Тут справжні вулиці стають містом: кожна вулиця отримує дорогу, кожне перехрестя — майданчик, а кожен фронт — будинки, що йдуть за вигинами, як у справжніх будівничих. Справжні мережі вулиць ламають акуратні правила сітки, тож генератор мусить міряти від самих доріг. Будування вздовж сплайнів замість сітки — те, що дає твоєму інструменту взяти будь-яке місто."}, "where": {"en": "BP_DistrictGenerator, BP_Road and the new BP_JunctionTable in the TechTools plugin; tested in L_District.", "uk": "BP_DistrictGenerator, BP_Road і новий BP_JunctionTable у плагіні TechTools; перевірка — в L_District."}, "spec": [{"en": "BP_Road gains Points (Vector array, cm, local to the road; Instance Editable, Expose on Spawn, Category Road, with a tooltip): with 2 or more points, the Construction Script first calls Set Spline Points (Points, Local) on Path; BP_Lane inherits it; an empty Points list leaves hand-made roads as they were. BP_Road's Class Defaults gain a second actor tag, Road; BP_Lane's tags become Lane and Road (no Street), so the street dresser furnishes main streets only and lane fronts stay clear.", "uk": "BP_Road отримує Points (масив Vector, см, локально до дороги; Instance Editable, Expose on Spawn, Category Road, з підказкою). Якщо точок 2 чи більше, Construction Script спершу викликає Set Spline Points (Points, Local) на Path; BP_Lane це успадковує; порожній Points лишає ручні дороги як були. У Class Defaults BP_Road з'являється другий тег актора, Road. Теги BP_Lane стають Lane і Road (без Street), тож розставляння дрібниць на вулицях обставляє лише головні вулиці, а фронти провулків лишаються вільними."}, {"en": "BP_JunctionTable in /TechTools/District: a Static Mesh component Table using /Engine/BasicShapes/Cylinder with MI_Setts (an M_Master instance with a paving texture you own or a CC0 one), and Diameter (Float, m, 8 to 20, default 14, Expose on Spawn); Scale (Diameter, Diameter, 0.18) and Relative Location (0, 0, 9): a raised paved table 18 cm high, above the 12.5 cm kerbs, as many old towns have at junctions; a short Spline component Clear and the actor tags KeepOutWide and KeepOutJunction, so lamps and trees (PCG_KeepOuts) and benches, bins and bollards (PCG_JunctionKeepOuts, Day 90) keep back from it.", "uk": "BP_JunctionTable у /TechTools/District: компонент Static Mesh з назвою Table на /Engine/BasicShapes/Cylinder з MI_Setts (інстанс M_Master з власною або CC0-текстурою бруківки) і Diameter (Float, м, 8–20, типово 14, Expose on Spawn). Scale (Diameter, Diameter, 0.18) і Relative Location (0, 0, 9): піднесений вимощений майданчик заввишки 18 см, вищий за бордюри 12,5 см, як на перехрестях багатьох старих міст. Короткий компонент Spline з назвою Clear і теги актора KeepOutWide і KeepOutJunction, щоб ліхтарі й дерева (PCG_KeepOuts) та лавки, урни й стовпчики (PCG_JunctionKeepOuts, День 90) трималися від нього на відстані."}, {"en": "Spawn Roads: one road per Road number from consecutive rows; Width 8 m or more spawns BP_Road (the 12 m section), less spawns BP_Lane (6 m); location = generator + the first point; Points = each point minus the first; each road added to Spawned, Road Actors (BP_Road array) and Road Halves (6 or 3 m); the last road spawned on the loop's Completed pin.", "uk": "Spawn Roads: одна дорога на кожен номер Road з послідовних рядків. Width 8 м і більше ставить BP_Road (секція 12 м), менше — BP_Lane (6 м). Location = генератор + перша точка; Points = кожна точка мінус перша. Кожна дорога додається в Spawned, Road Actors (масив BP_Road) і Road Halves (6 або 3 м). Остання дорога ставиться на виході Completed циклу."}, {"en": "Spawn Junctions: a BP_JunctionTable at every point shared (within 1 m) by two different roads, skipping any within 3 m of a table already placed; Diameter = the wider road's width (12 or 6 m) + 2 m.", "uk": "Spawn Junctions: BP_JunctionTable у кожній точці, спільній (до 1 м) для двох різних доріг, з пропуском, якщо в межах 3 м уже стоїть майданчик. Diameter = ширина ширшої дороги (12 або 6 м) + 2 м."}, {"en": "Make Plots: for each road and each side, a plot every Plot Width along its spline from Junction Clear to the length minus Junction Clear, using Get Transform at Distance Along Spline (World) and its Right Vector; Front on the setback line, Yaw = the road's yaw (plus 180 on the left side); Apply Plot Rules first, so the random draws stay in order; then the plot dropped when the house's centre is within another road's half width + House Clear, within Square Radius of the Landmark Point, or within 0.9 Plot Width of a plot already kept; a landmark plot added at the Landmark Point.", "uk": "Make Plots: для кожної дороги і кожного боку — ділянка через кожні Plot Width уздовж сплайна, від Junction Clear до довжини мінус Junction Clear, через Get Transform at Distance Along Spline (World) і його Right Vector. Front — на лінії відступу, Yaw = поворот дороги (плюс 180 на лівому боці). Спершу Apply Plot Rules, щоб випадкові вибори йшли по порядку. Потім ділянку відкидають, якщо центр будинку ближчий до іншої дороги, ніж її половина ширини + House Clear, якщо він у межах Square Radius від Landmark Point або в межах 0,9 Plot Width від уже залишеної ділянки. Ділянку орієнтира додано в Landmark Point."}, {"en": "PDA_TownRules gains Junction Clear (m, 8), House Clear (m, 6) and Square Radius (m, 20), with tooltips; DA_TownRules_District filled.", "uk": "PDA_TownRules отримує Junction Clear (м, 8), House Clear (м, 6) і Square Radius (м, 20) з підказками; DA_TownRules_District заповнено."}, {"en": "Regenerate in order: Check Inputs (Roads Table and Rules), Read Rows, Stream and Build Stream made from Seed (Build Plan is no longer called), Clear Town, Spawn Roads, Spawn Junctions, Make Plots, Spawn Buildings, Spawn Landmark, the summary line; the same seed twice gives the same district; Check Town reports 0 problems; no Tick.", "uk": "Regenerate по порядку: Check Inputs (Roads Table і Rules), Read Rows, Stream і Build Stream із Seed (Build Plan більше не викликається), Clear Town, Spawn Roads, Spawn Junctions, Make Plots, Spawn Buildings, Spawn Landmark, підсумковий рядок. Те саме зерно двічі дає той самий район; Check Town показує 0 проблем; Tick немає."}], "piece1": "Roads, junction tables and plots along curved streets (built in the lessons)", "piece2": {"en": "Houses on the plots, the landmark square and the repeatability test, on your own", "uk": "Будинки на ділянках, площа орієнтира і тест повторюваності — самостійно"}, "steps": [{"text": {"en": "Check: the results of today's lessons are there (BP_Road with its Points pin, BP_JunctionTable, and Spawn Roads, Spawn Junctions and Make Plots in BP_DistrictGenerator). Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it. Weak PC (16 GB of RAM or less): shrink the PCG volumes to 100 x 100 m while you build and grow them for the final pictures (see the weak-PC section of ACCOUNTS-AND-INSTALLS.html). Open BP_Road and check Points against the spec, then place a BP_Road and give it three points by hand in Details. Check: the road bends through all three, and a road with Points empty behaves as before.", "uk": "Перевір, чи є результати сьогоднішніх уроків: BP_Road з входом Points, BP_JunctionTable, а також Spawn Roads, Spawn Junctions і Make Plots у BP_DistrictGenerator. Чогось бракує? Пройди зараз кроки «Разом із тьютором» того уроку (близько 25 хвилин): самостійна робота спирається на них. Слабкий ПК (16 ГБ оперативної пам'яті чи менше): під час роботи зменш об'єми PCG до 100 × 100 м, а для фінальних картинок збільш (див. розділ про слабкі ПК в ACCOUNTS-AND-INSTALLS.html). Відкрий BP_Road, звір Points із вимогами, потім постав BP_Road і дай йому три точки вручну в Details. Перевірка: дорога згинається через усі три, а дорога з порожнім Points поводиться як раніше."}, "lesson": 1}, {"text": {"en": "In L_District click Regenerate with only Spawn Roads connected. Check: a BP_Road or BP_Lane lies on every grey preview strip, main streets wide and lanes narrow, and the Output Log counts them.", "uk": "В L_District клацни Regenerate, коли під'єднано лише Spawn Roads. Перевірка: на кожній сірій смузі перегляду лежить BP_Road або BP_Lane, головні вулиці широкі, провулки вузькі, а Output Log їх рахує."}, "lesson": 1}, {"text": {"en": "Untick Show Preview and fly the streets at 10 m. Check: no road floats or sinks, and curved streets bend smoothly.", "uk": "Зніми прапорець Show Preview і пролети вулицями на 10 м. Перевірка: жодна дорога не висить і не тоне, а криві вулиці плавно згинаються."}, "lesson": 1}, {"text": {"en": "Connect Spawn Junctions and Regenerate. Check: a paved table at every crossing and T-junction, none on a plain bend, and the meeting kerbs hidden under each table.", "uk": "Під'єднай Spawn Junctions і клацни Regenerate. Перевірка: вимощений майданчик на кожному перехресті й Т-подібному перехресті, жодного на простому вигині, а бордюри, що сходяться, сховано під кожним майданчиком."}, "lesson": 2}, {"text": {"en": "Connect Make Plots and look at the plot boxes from above. Check: boxes along both sides of every street, facing it, none on a road or in the square.", "uk": "Під'єднай Make Plots і подивись на коробки ділянок згори. Перевірка: коробки з обох боків кожної вулиці дивляться на неї, жодна не стоїть на дорозі чи на площі."}, "lesson": 3}, {"text": {"en": "Find the tightest corner where two streets meet and look at its plots. Check: no plot overlaps the other street; if one does, raise House Clear by 1 m and Regenerate.", "uk": "Знайди найтісніший кут, де сходяться дві вулиці, і подивись на його ділянки. Перевірка: жодна ділянка не заходить на іншу вулицю. Якщо заходить, збільш House Clear на 1 м і клацни Regenerate."}, "lesson": 4}, {"text": {"en": "On your own: connect Spawn Buildings and Spawn Landmark (unchanged from Day 89) and Regenerate. Check: a house on every kept plot, its front on the setback line facing its street, and the landmark in its square.", "uk": "Самостійно: під'єднай Spawn Buildings і Spawn Landmark (без змін з Дня 89) і клацни Regenerate. Перевірка: на кожній залишеній ділянці будинок, його фасад на лінії відступу дивиться на свою вулицю, а орієнтир стоїть на своїй площі."}, "lesson": "D89.3"}, {"text": {"en": "On your own: click Check Town. Check: 0 problems; any problem is fixed at its cause (a rule, a corridor, a zone), never by moving a house by hand.", "uk": "Самостійно: клацни Check Town. Перевірка: 0 проблем. Кожну проблему виправлено в причині (правило, коридор, зона), а не перетягуванням будинку вручну."}, "lesson": "D90.1"}, {"text": {"en": "Take district_120m.png from a 120 m bookmark and compare it with map_box.png, then save L_District, open any other level and open L_District again. Check: the reopened district is still there, and the street pattern, the square and the waterfront read as the real place.", "uk": "Зроби district_120m.png із закладки на 120 м і порівняй його з map_box.png, потім збережи L_District, відкрий будь-який інший рівень і знову відкрий L_District. Перевірка: після повторного відкриття район на місці, а план вулиць, площа і набережна впізнаються як справжнє місце."}, "lesson": 4}, {"text": {"en": "Commit and push ('District core: roads, junctions, plots, houses'). Check: the commit is on GitHub.", "uk": "Зроби коміт і надішли ('District core: roads, junctions, plots, houses'). Перевірка: коміт є на GitHub."}, "lesson": 4}, {"text": {"en": "Click Copy the day report, paste it into a new tutor chat, answer its questions and save its answer as summary.md in today's Work folder. Drag summary.md and district_120m.png into today's hand-in folder (the button on this page); no need to hand in the Unreal project or level folders (they're very big). Check: the hand-in folder lists 2 files, each over 1 KB.", "uk": "Клацни «Копіювати звіт дня», встав у новий чат із тьютором, дай відповіді на його питання і збережи його відповідь як summary.md у робочій папці дня. Перетягни summary.md і district_120m.png у папку здачі (кнопка на цій сторінці). Папку проєкту чи рівня Unreal здавати не треба: вона дуже велика. Перевірка: у папці здачі 2 файли, кожен більший за 1 КБ."}, "lesson": 1}, {"text": {"en": "Gold (optional, after the hand-in): the same seed twice. Take seed1_a.png from a 120 m bookmark, Regenerate, take seed1_b.png. Check: the two are identical, and seed 2 gives a different district on the same streets (Friday's Boss asks for this proof anyway).", "uk": "Золото (за бажанням, після здачі): те саме зерно двічі. Зроби seed1_a.png із закладки на 120 м, клацни Regenerate, зроби seed1_b.png. Перевірка: картинки однакові, а зерно 2 дає інший район на тих самих вулицях (у п'ятницю бос усе одно попросить цей доказ)."}, "lesson": 4}], "assets": ["techart/street-dimensions.md", "techart/code-style.md"], "next": {"en": "Tomorrow (Day 104) the street dressing, parks and the landmark go on top of this core, and on Friday (Day 105) the whole district must build from one click and one seed.", "uk": "Завтра (День 104) на це ядро лягають дрібниці на вулицях, парки й орієнтир, а в п'ятницю (День 105) увесь район має будуватися одним клацанням з одного зерна."}}, "lessons": [{"title": {"en": "Roads from the table", "uk": "Дороги з таблиці"}, "minutes": 40, "goals": [{"en": "Give BP_Road a Points input, so a spawned road takes any shape.", "uk": "Давати BP_Road вхід Points, щоб поставлена дорога набувала будь-якої форми."}, {"en": "Group consecutive rows into one road with a running list, and remember the last road after the loop.", "uk": "Групувати послідовні рядки в одну дорогу наростаючим списком і пам'ятати про останню дорогу після циклу."}, {"en": "Choose BP_Road or BP_Lane by width with Select.", "uk": "Вибирати BP_Road чи BP_Lane за шириною через Select."}], "doalong": [{"en": "Open BP_Road and add Points (Vector, Array; Instance Editable, Expose on Spawn, Category Road; tooltip 'Spline points in cm, local to the road; leave empty to shape the spline by hand'). At the start of the Construction Script: Branch on Points' Length >= 2; on True, Path > Set Spline Points (Points; Coordinate Space Local), then carry on as before; on False, carry on. If Set Spline Points is not offered, use Clear Spline Points and then a For Each Loop with Add Spline Point (Local). Compile.", "uk": "Відкрий BP_Road і додай Points (Vector, Array; Instance Editable, Expose on Spawn, Category Road; підказка 'Spline points in cm, local to the road; leave empty to shape the spline by hand'). На початку Construction Script: Branch за умовою Length масиву Points >= 2. На True — Path > Set Spline Points (Points; Coordinate Space Local), далі як раніше; на False — далі як раніше. Якщо Set Spline Points не пропонується, скористайся Clear Spline Points, а потім For Each Loop з Add Spline Point (Local). Клацни Compile."}, {"en": "In Class Defaults add a second actor tag, Road; then open BP_Lane's Class Defaults and change its tags to Lane and Road (remove Street), so PCG_StreetDresser, which looks for Street, dresses main streets only. You see BP_Lane, its child, gain Points too, with its own tags. In BP_DistrictGenerator add two variables, Road Actors (BP_Road Object Reference, Array) and Road Halves (Float, Array), then make a function Spawn One Road (inputs Pts, a Vector array, and Width, Float, m). Start = Pts[0]; a local array Local Pts filled by a For Each over Pts with (point - Start).", "uk": "У Class Defaults додай другий тег актора, Road. Потім відкрий Class Defaults BP_Lane і зміни його теги на Lane і Road (Street прибери), щоб PCG_StreetDresser, який шукає Street, обставляв лише головні вулиці. Дочірній BP_Lane теж отримує Points, але з власними тегами. У BP_DistrictGenerator додай дві змінні: Road Actors (BP_Road Object Reference, Array) і Road Halves (Float, Array). Потім створи функцію Spawn One Road (входи Pts — масив Vector, і Width — Float, м). Start = Pts[0]; локальний масив Local Pts заповнюється через For Each по Pts значенням (точка - Start)."}, {"en": "Select (Width >= 8: BP_Road, otherwise BP_Lane) into a local variable of type BP_Road Class Reference. Spawn Actor from Class with that class, Location = Get Actor Location + Start, and Points = Local Pts. Add the result to Spawned and to Road Actors, and add 6 or 3 (a Select Float on the same test) to Road Halves. You see one function that builds any street.", "uk": "Select (Width >= 8: BP_Road, інакше BP_Lane) у локальну змінну типу BP_Road Class Reference. Spawn Actor from Class з цим класом, Location = Get Actor Location + Start, Points = Local Pts. Додай результат у Spawned і в Road Actors, а в Road Halves — 6 або 3 (Select Float за тією самою умовою). Має вийти: одна функція, що будує будь-яку вулицю."}, {"en": "Open the Spawn Roads function copied from BP_TownGenerator and delete the nodes inside it (they read the old grid), keeping its entry; Regenerate's call to it stays. Rebuild it with local variables Current Pts (Vector array), Current Road (Integer, -1) and Current Width (Float); first Clear Road Actors and Road Halves. For Each Loop over Rows Road: if the element is not Current Road, then call Spawn One Road (Current Pts, Current Width) when Current Pts has 2 or more points, Clear Current Pts, and set Current Road and Current Width from this row; then add Rows Point at this index to Current Pts. You see rows grouped into roads.", "uk": "Відкрий функцію Spawn Roads, скопійовану з BP_TownGenerator, і видали вузли всередині (вони читають стару сітку), лишивши вхід; виклик у Regenerate лишається. Збудуй її заново з локальними змінними Current Pts (масив Vector), Current Road (Integer, -1) і Current Width (Float); спершу Clear для Road Actors і Road Halves. For Each Loop по Rows Road: якщо елемент не дорівнює Current Road, виклич Spawn One Road (Current Pts, Current Width), коли в Current Pts 2 чи більше точок, очисти Current Pts і задай Current Road і Current Width з цього рядка. Потім додай Rows Point з цим індексом у Current Pts. Має вийти: рядки згруповано в дороги."}, {"en": "On the loop's Completed pin call Spawn One Road (Current Pts, Current Width) once more. Ask the tutor what happens without it. You see why: the last road would never be built, because no new road number comes after it. In Regenerate change Check Inputs to test Roads Table (instead of Layout, Roads X and Roads Y) and Rules.", "uk": "На виході Completed циклу ще раз виклич Spawn One Road (Current Pts, Current Width). Спитай тьютора, що буде без цього виклику. Відповідь: останню дорогу ніколи не збудують, бо після неї немає нового номера дороги. У Regenerate зміни Check Inputs, щоб перевіряти Roads Table (замість Layout, Roads X і Roads Y) і Rules."}, {"en": "Replace the Build Plan call with Read Rows, then Make Random Stream from Seed > Set Stream (Build Plan used to do this, and Apply Plot Rules draws from Stream); keep Set Build Stream, clearing the Bag, Clear Town and Spawn Roads; unhook the later calls for now and end with a Print String of Road Actors' Length. Click Regenerate. You see real streets with kerbs and pavements, wide and narrow, along the preview.", "uk": "Заміни виклик Build Plan на Read Rows, потім Make Random Stream із Seed > Set Stream (раніше це робив Build Plan, а Apply Plot Rules бере вибори зі Stream). Лиши Set Build Stream, очищення Bag, Clear Town і Spawn Roads. Пізніші виклики поки від'єднай і закінчи Print String з Length масиву Road Actors. Клацни Regenerate. Має вийти: справжні вулиці з бордюрами й тротуарами, широкі й вузькі, уздовж перегляду."}], "play": {"en": "Rows to roads: the tutor gives me a list of rows (road 1 with 3 points; road 2 with 1 point; road 3 with 4 points; road 4 with 2 points). I say how many roads Spawn Roads builds, which one it skips and why, and what goes wrong without the Completed call.", "uk": "Рядки в дороги: тьютор дає мені список рядків (дорога 1 з 3 точками; дорога 2 з 1 точкою; дорога 3 з 4 точками; дорога 4 з 2 точками). Я кажу, скільки доріг збудує Spawn Roads, яку пропустить і чому, і що піде не так без виклику на Completed."}, "video": {"search": "unreal engine set spline points blueprint spawn actor expose on spawn"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Дороги з таблиці (Day 103, lesson 1 of 4). Today's build: Ядро BP_DistrictGenerator: Spawn Roads (BP_Road або BP_Lane на кожну вулицю, форма — через новий вхід Points), Spawn Junctions (BP_JunctionTable там, де сходяться вулиці), Make Plots (ділянки вздовж власного сплайна кожної дороги, на відстані від інших доріг, площі й одна від одної) і повторно використані Spawn Buildings та Spawn Landmark.\nWhat I already know: День 102: DT_DistrictRoads, Read Rows, перегляд і DA_TownRules_District; День 99: Apply Plot Rules; День 89: Regenerate, Clear Town, Spawned, Spawn Buildings і Spawn Landmark; День 86: BP_Road, BP_Lane і Expose on Spawn (Length Override); Дні 62 і 88: Get Transform at Distance Along Spline, Find Location Closest to World Location і Distance2D.\n\nBy the end of this lesson I can:\n1. Давати BP_Road вхід Points, щоб поставлена дорога набувала будь-якої форми.\n2. Групувати послідовні рядки в одну дорогу наростаючим списком і пам'ятати про останню дорогу після циклу.\n3. Вибирати BP_Road чи BP_Lane за шириною через Select.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: У тебе є проєктний документ, справжній план вулиць у DT_DistrictRoads, зони з мапи і живий перегляд в L_District. Today: Ти будуєш ядро генератора: дороги, майданчики перехресть, ділянки вздовж кривих вулиць і будинок на кожній ділянці — з одного зерна. One encouraging line: Сьогодні справжня мапа стає містом, крізь яке можна пролетіти. Не поспішай із циклами і святкуй першу вулицю, що з'явиться.); 2 lines on why today matters and where it comes back, in plain words (from this: Тут справжні вулиці стають містом: кожна вулиця отримує дорогу, кожне перехрестя — майданчик, а кожен фронт — будинки, що йдуть за вигинами, як у справжніх будівничих. Справжні мережі вулиць ламають акуратні правила сітки, тож генератор мусить міряти від самих доріг. Будування вздовж сплайнів замість сітки — те, що дає твоєму інструменту взяти будь-яке місто. It comes back: Завтра (День 104) на це ядро лягають дрібниці на вулицях, парки й орієнтир, а в п'ятницю (День 105) увесь район має будуватися одним клацанням з одного зерна.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-103-district-generator-core exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (Дороги, майданчики перехресть і ділянки вздовж кривих вулиць (робиш на уроках)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Відкрий BP_Road і додай Points (Vector, Array; Instance Editable, Expose on Spawn, Category Road; підказка 'Spline points in cm, local to the road; leave empty to shape the spline by hand'). На початку Construction Script: Branch за умовою Length масиву Points >= 2. На True — Path > Set Spline Points (Points; Coordinate Space Local), далі як раніше; на False — далі як раніше. Якщо Set Spline Points не пропонується, скористайся Clear Spline Points, а потім For Each Loop з Add Spline Point (Local). Клацни Compile.\n   2. У Class Defaults додай другий тег актора, Road. Потім відкрий Class Defaults BP_Lane і зміни його теги на Lane і Road (Street прибери), щоб PCG_StreetDresser, який шукає Street, обставляв лише головні вулиці. Дочірній BP_Lane теж отримує Points, але з власними тегами. У BP_DistrictGenerator додай дві змінні: Road Actors (BP_Road Object Reference, Array) і Road Halves (Float, Array). Потім створи функцію Spawn One Road (входи Pts — масив Vector, і Width — Float, м). Start = Pts[0]; локальний масив Local Pts заповнюється через For Each по Pts значенням (точка - Start).\n   3. Select (Width >= 8: BP_Road, інакше BP_Lane) у локальну змінну типу BP_Road Class Reference. Spawn Actor from Class з цим класом, Location = Get Actor Location + Start, Points = Local Pts. Додай результат у Spawned і в Road Actors, а в Road Halves — 6 або 3 (Select Float за тією самою умовою). Має вийти: одна функція, що будує будь-яку вулицю. [screenshot]\n   4. Відкрий функцію Spawn Roads, скопійовану з BP_TownGenerator, і видали вузли всередині (вони читають стару сітку), лишивши вхід; виклик у Regenerate лишається. Збудуй її заново з локальними змінними Current Pts (масив Vector), Current Road (Integer, -1) і Current Width (Float); спершу Clear для Road Actors і Road Halves. For Each Loop по Rows Road: якщо елемент не дорівнює Current Road, виклич Spawn One Road (Current Pts, Current Width), коли в Current Pts 2 чи більше точок, очисти Current Pts і задай Current Road і Current Width з цього рядка. Потім додай Rows Point з цим індексом у Current Pts. Має вийти: рядки згруповано в дороги.\n   5. На виході Completed циклу ще раз виклич Spawn One Road (Current Pts, Current Width). Спитай тьютора, що буде без цього виклику. Відповідь: останню дорогу ніколи не збудують, бо після неї немає нового номера дороги. У Regenerate зміни Check Inputs, щоб перевіряти Roads Table (замість Layout, Roads X і Roads Y) і Rules.\n   6. Заміни виклик Build Plan на Read Rows, потім Make Random Stream із Seed > Set Stream (раніше це робив Build Plan, а Apply Plot Rules бере вибори зі Stream). Лиши Set Build Stream, очищення Bag, Clear Town і Spawn Roads. Пізніші виклики поки від'єднай і закінчи Print String з Length масиву Road Actors. Клацни Regenerate. Має вийти: справжні вулиці з бордюрами й тротуарами, широкі й вузькі, уздовж перегляду. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Рядки в дороги: тьютор дає мені список рядків (дорога 1 з 3 точками; дорога 2 з 1 точкою; дорога 3 з 4 точками; дорога 4 з 2 точками). Я кажу, скільки доріг збудує Spawn Roads, яку пропустить і чому, і що піде не так без виклику на Completed. Otherwise skip it.\n6. Review: ask me these questions from earlier days, one at a time, and correct me kindly: Day 100: Why are gaps fixed in the plugin and never by hand in the test project? | Day 96: What does git restore do?\n7. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n8. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; rubric = таблиця оцінювання; review (by tutor or art director) = огляд; see-why-fix note = нотатка «бачу, чому, як виправити»; credits line = рядок авторства; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); File Explorer = Провідник; mesh = меш; grid = сітка (тільки grid, ніколи mesh); vertex / edge / face = вершина / ребро / грань; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; material instance / child instance = інстанс / дочірній інстанс; material slot / node / pin = слот матеріалу / вузол / вхід; volume (PCG Volume, Post Process Volume) = об'єм; seed = зерно (налаштування Seed); kit / kit piece / part of one object = набір / деталь / частина; map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; district / plot / plot plan = район / ділянка / план ділянки; harbour / quay / waterfront / pier = гавань / причал / набережна / пірс; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; vista / blockout / landmark = панорама / блокаут / орієнтир; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; hero shot = головний кадр (hero shot); proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}, {"title": {"en": "Junction tables where streets meet", "uk": "Майданчики там, де сходяться вулиці"}, "minutes": 40, "goals": [{"en": "Find junctions as points shared by two different roads.", "uk": "Знаходити перехрестя як точки, спільні для двох різних доріг."}, {"en": "Avoid doubles: skip a junction within 3 m of one already placed.", "uk": "Уникати дублів: пропускати перехрестя в межах 3 м від уже поставленого."}, {"en": "Make BP_JunctionTable, a raised paved table that covers the meeting kerbs.", "uk": "Створювати BP_JunctionTable — піднесений вимощений майданчик, що накриває бордюри, які сходяться."}], "doalong": [{"en": "Make BP_JunctionTable in /TechTools/District: an Actor with a Static Mesh component Table (/Engine/BasicShapes/Cylinder, material MI_Setts, a new M_Master instance with a paving texture). Add Diameter (Float, m, 8 to 20, default 14, Expose on Spawn). Construction Script: Table > Set Relative Scale 3D (Diameter, Diameter, 0.18) and Set Relative Location (0, 0, 9).", "uk": "Створи BP_JunctionTable у /TechTools/District: Actor з компонентом Static Mesh з назвою Table (/Engine/BasicShapes/Cylinder, матеріал MI_Setts — новий інстанс M_Master з текстурою бруківки). Додай Diameter (Float, м, 8–20, типово 14, Expose on Spawn). Construction Script: Table > Set Relative Scale 3D (Diameter, Diameter, 0.18) і Set Relative Location (0, 0, 9)."}, {"en": "Add a Spline component Clear (its default short line is enough) and, in Class Defaults, the actor tags KeepOutWide and KeepOutJunction, so PCG_KeepOuts keeps lamps and trees, and PCG_JunctionKeepOuts benches, bins and bollards, about 7 m back from every table's centre, as BP_Junction did on Day 90.", "uk": "Додай компонент Spline з назвою Clear (типової короткої лінії досить) і в Class Defaults — теги актора KeepOutWide і KeepOutJunction. Тоді PCG_KeepOuts тримає ліхтарі й дерева, а PCG_JunctionKeepOuts — лавки, урни й стовпчики приблизно за 7 м від центру кожного майданчика, як BP_Junction у День 90."}, {"en": "You see a paved disc 18 cm high: the basic cylinder is 1 m across and 1 m tall, centred on its pivot. Empty the Spawn Junctions function copied from BP_TownGenerator, as you did Spawn Roads, and rebuild it with a local Vector array Placed.", "uk": "Має вийти: вимощений диск заввишки 18 см. Базовий циліндр має 1 м у діаметрі й 1 м у висоту і центрований на своїй точці опори. Очисти функцію Spawn Junctions, скопійовану з BP_TownGenerator, так само, як Spawn Roads, і збудуй її заново з локальним масивом Vector з назвою Placed."}, {"en": "For Loop i over Rows Point and, inside it, For Loop j over Rows Point; Branch on Rows Road[i] not equal to Rows Road[j] AND Distance (Rows Point[i], Rows Point[j]) < 100. You see the test for a point that two roads share. On True: For Each over Placed, and skip if any is within 300 cm of Rows Point[i].", "uk": "For Loop i по Rows Point, а всередині — For Loop j по Rows Point. Branch за умовою: Rows Road[i] не дорівнює Rows Road[j] AND Distance (Rows Point[i], Rows Point[j]) < 100. Це перевірка точки, спільної для двох доріг. На True: For Each по Placed і пропуск, якщо будь-яка з них у межах 300 см від Rows Point[i]."}, {"en": "Otherwise Spawn Actor from Class BP_JunctionTable at Get Actor Location + Rows Point[i], with Diameter = Max (12 if Rows Width[i] >= 8, else 6; the same for j) + 2; add it to Spawned and to Placed. You see one table per junction. Call Spawn Junctions after Spawn Roads and Regenerate. Fly to a crossing at 3 m. You see a paved table over the meeting point with its edge above the kerbs; on a plain bend, no table.", "uk": "Інакше Spawn Actor from Class BP_JunctionTable у Get Actor Location + Rows Point[i] з Diameter = Max (12, якщо Rows Width[i] >= 8, інакше 6; те саме для j) + 2. Додай його в Spawned і в Placed. Має вийти: один майданчик на перехрестя. Виклич Spawn Junctions після Spawn Roads і клацни Regenerate. Підлети до перехрестя на 3 м. Має вийти: вимощений майданчик над точкою зустрічі, його край вище за бордюри; на простому вигині майданчика немає."}, {"en": "Ask the tutor how many tests the double loop makes for 300 points (90,000) and why that is fine on a button but never in Tick. You see why Regenerate is a button. If the Output Log ever says Infinite loop detected, raise Project Settings > Engine > General Settings > Blueprints > Maximum Loop Iteration Count (for example to 10000000).", "uk": "Спитай тьютора, скільки перевірок робить подвійний цикл для 300 точок (90 000) і чому це нормально для кнопки, але ніколи для Tick. Звідси видно, чому Regenerate — кнопка. Якщо Output Log колись скаже Infinite loop detected, збільш Project Settings > Engine > General Settings > Blueprints > Maximum Loop Iteration Count (наприклад, до 10000000)."}], "play": {"en": "Junction or not: the tutor describes five meeting points (a main street crossing a lane; a road that bends with no other road; two lanes ending at the same point; a T-junction; two points 0.5 m apart on the same road). For each I say whether a table is placed, and why.", "uk": "Перехрестя чи ні: тьютор описує п'ять точок зустрічі (головна вулиця перетинає провулок; дорога згинається, і жодної іншої дороги; два провулки закінчуються в одній точці; Т-подібне перехрестя; дві точки за 0,5 м одна від одної на тій самій дорозі). Для кожної я кажу, чи поставлять майданчик, і чому."}, "video": {"search": "unreal engine blueprint nested for loop distance spawn actor"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Майданчики там, де сходяться вулиці (Day 103, lesson 2 of 4). Today's build: Ядро BP_DistrictGenerator: Spawn Roads (BP_Road або BP_Lane на кожну вулицю, форма — через новий вхід Points), Spawn Junctions (BP_JunctionTable там, де сходяться вулиці), Make Plots (ділянки вздовж власного сплайна кожної дороги, на відстані від інших доріг, площі й одна від одної) і повторно використані Spawn Buildings та Spawn Landmark.\nWhat I already know: День 102: DT_DistrictRoads, Read Rows, перегляд і DA_TownRules_District; День 99: Apply Plot Rules; День 89: Regenerate, Clear Town, Spawned, Spawn Buildings і Spawn Landmark; День 86: BP_Road, BP_Lane і Expose on Spawn (Length Override); Дні 62 і 88: Get Transform at Distance Along Spline, Find Location Closest to World Location і Distance2D.\nEarlier today I already did: lesson 1 (Дороги з таблиці). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Знаходити перехрестя як точки, спільні для двох різних доріг.\n2. Уникати дублів: пропускати перехрестя в межах 3 м від уже поставленого.\n3. Створювати BP_JunctionTable — піднесений вимощений майданчик, що накриває бордюри, які сходяться.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: 2 lines on why today matters and where it comes back, in plain words (from this: Тут справжні вулиці стають містом: кожна вулиця отримує дорогу, кожне перехрестя — майданчик, а кожен фронт — будинки, що йдуть за вигинами, як у справжніх будівничих. Справжні мережі вулиць ламають акуратні правила сітки, тож генератор мусить міряти від самих доріг. Будування вздовж сплайнів замість сітки — те, що дає твоєму інструменту взяти будь-яке місто. It comes back: Завтра (День 104) на це ядро лягають дрібниці на вулицях, парки й орієнтир, а в п'ятницю (День 105) увесь район має будуватися одним клацанням з одного зерна.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-103-district-generator-core exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (Дороги, майданчики перехресть і ділянки вздовж кривих вулиць (робиш на уроках)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Створи BP_JunctionTable у /TechTools/District: Actor з компонентом Static Mesh з назвою Table (/Engine/BasicShapes/Cylinder, матеріал MI_Setts — новий інстанс M_Master з текстурою бруківки). Додай Diameter (Float, м, 8–20, типово 14, Expose on Spawn). Construction Script: Table > Set Relative Scale 3D (Diameter, Diameter, 0.18) і Set Relative Location (0, 0, 9).\n   2. Додай компонент Spline з назвою Clear (типової короткої лінії досить) і в Class Defaults — теги актора KeepOutWide і KeepOutJunction. Тоді PCG_KeepOuts тримає ліхтарі й дерева, а PCG_JunctionKeepOuts — лавки, урни й стовпчики приблизно за 7 м від центру кожного майданчика, як BP_Junction у День 90.\n   3. Має вийти: вимощений диск заввишки 18 см. Базовий циліндр має 1 м у діаметрі й 1 м у висоту і центрований на своїй точці опори. Очисти функцію Spawn Junctions, скопійовану з BP_TownGenerator, так само, як Spawn Roads, і збудуй її заново з локальним масивом Vector з назвою Placed. [screenshot]\n   4. For Loop i по Rows Point, а всередині — For Loop j по Rows Point. Branch за умовою: Rows Road[i] не дорівнює Rows Road[j] AND Distance (Rows Point[i], Rows Point[j]) < 100. Це перевірка точки, спільної для двох доріг. На True: For Each по Placed і пропуск, якщо будь-яка з них у межах 300 см від Rows Point[i].\n   5. Інакше Spawn Actor from Class BP_JunctionTable у Get Actor Location + Rows Point[i] з Diameter = Max (12, якщо Rows Width[i] >= 8, інакше 6; те саме для j) + 2. Додай його в Spawned і в Placed. Має вийти: один майданчик на перехрестя. Виклич Spawn Junctions після Spawn Roads і клацни Regenerate. Підлети до перехрестя на 3 м. Має вийти: вимощений майданчик над точкою зустрічі, його край вище за бордюри; на простому вигині майданчика немає.\n   6. Спитай тьютора, скільки перевірок робить подвійний цикл для 300 точок (90 000) і чому це нормально для кнопки, але ніколи для Tick. Звідси видно, чому Regenerate — кнопка. Якщо Output Log колись скаже Infinite loop detected, збільш Project Settings > Engine > General Settings > Blueprints > Maximum Loop Iteration Count (наприклад, до 10000000). [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Перехрестя чи ні: тьютор описує п'ять точок зустрічі (головна вулиця перетинає провулок; дорога згинається, і жодної іншої дороги; два провулки закінчуються в одній точці; Т-подібне перехрестя; дві точки за 0,5 м одна від одної на тій самій дорозі). Для кожної я кажу, чи поставлять майданчик, і чому. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; rubric = таблиця оцінювання; see-why-fix note = нотатка «бачу, чому, як виправити»; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; default value = типове значення; File Explorer = Провідник; mesh = меш; grid = сітка (тільки grid, ніколи mesh); vertex / edge / face = вершина / ребро / грань; world origin / 3D cursor = центр світу / 3D-курсор; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; material instance / child instance = інстанс / дочірній інстанс; material slot / node / pin = слот матеріалу / вузол / вхід; volume (PCG Volume, Post Process Volume) = об'єм; seed = зерно (налаштування Seed); map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; district / plot / plot plan = район / ділянка / план ділянки; harbour / quay / waterfront / pier = гавань / причал / набережна / пірс; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; vista / blockout / landmark = панорама / блокаут / орієнтир; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; hero shot = головний кадр (hero shot); proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}, {"title": {"en": "Plots along curved roads", "uk": "Ділянки вздовж кривих доріг"}, "minutes": 40, "goals": [{"en": "Place plot fronts along a spline with Get Transform at Distance Along Spline and its Right Vector, on both sides.", "uk": "Ставити фронти ділянок уздовж сплайна з обох боків через Get Transform at Distance Along Spline і його Right Vector."}, {"en": "Turn each house to face its street: the road's yaw on the right side, plus 180 on the left.", "uk": "Повертати кожен будинок до своєї вулиці: поворот дороги на правому боці, плюс 180 на лівому."}, {"en": "Draw every plot's random numbers first with Apply Plot Rules, so the seed stays repeatable.", "uk": "Брати випадкові числа кожної ділянки спершу, через Apply Plot Rules, щоб зерно лишалося повторюваним."}], "doalong": [{"en": "Add to PDA_TownRules Junction Clear (m, 8), House Clear (m, 6) and Square Radius (m, 20), each with a tooltip, and fill them in DA_TownRules_District. You see the new rules in the asset.", "uk": "Додай у PDA_TownRules Junction Clear (м, 8), House Clear (м, 6) і Square Radius (м, 20), кожне з підказкою, і заповни їх у DA_TownRules_District. Має вийти: нові правила в асеті."}, {"en": "Make a function Make Plots: Clear Plots and Clear Instances on PreviewPlots; For Each over Road Actors (index r): Length = its Path > Get Spline Length; For Loop s from 0 to 1 with Side = s x 2 - 1 (-1, then +1).", "uk": "Створи функцію Make Plots: Clear для Plots і Clear Instances на PreviewPlots. For Each по Road Actors (індекс r): Length = його Path > Get Spline Length. For Loop s від 0 до 1 із Side = s × 2 - 1 (спершу -1, потім +1)."}, {"en": "Count = Floor((Length - 2 x Junction Clear x 100) / (Plot Width x 100)); For Loop k from 0 to Count - 1 with Dist = Junction Clear x 100 + (k + 0.5) x Plot Width x 100. You see three loops inside each other: roads, sides, plots.", "uk": "Count = Floor((Length - 2 × Junction Clear × 100) / (Plot Width × 100)).  the same road, left side; a road running north, right side; a curved road where it turns from east to south). For each I say the Yaw and which way the house's front faces.", "uk": "Куди він дивиться? Тьютор дає мені чотири ділянки (дорога йде на схід, правий бік; та сама дорога, лівий бік; дорога йде на північ, правий бік; крива дорога там, де вона повертає зі сходу на південь). Для кожної я кажу Yaw і куди дивиться фасад будинку."}, "video": {"search": "unreal engine get transform at distance along spline place actors along spline"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Ділянки вздовж кривих доріг (Day 103, lesson 3 of 4). Today's build: Ядро BP_DistrictGenerator: Spawn Roads (BP_Road або BP_Lane на кожну вулицю, форма — через новий вхід Points), Spawn Junctions (BP_JunctionTable там, де сходяться вулиці), Make Plots (ділянки вздовж власного сплайна кожної дороги, на відс sts (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (Дороги, майданчики перехресть і ділянки вздовж кривих вулиць (робиш на уроках)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Додай у PDA_TownRules Junction Clear (м, 8), House Clear (м, 6) і Square Radius (м, 20), кожне з підказкою, і заповни їх у DA_TownRules_District. Має вийти: нові правила в асеті.\n   2. Створи функцію Make Plots: Clear для Plots і Clear Instances на PreviewPlots. For Each по Road Actors (індекс r): Length = його Path > Get Spline Length. For Loop s від 0 до 1 із Side = s × 2 - 1 (спершу -1, потім +1).\n   3. Count = Floor((Length - 2 × Junction Clear × 100) / (Plot Width × 100)). For Loop k від 0 до Count - 1 з Dist = Junction Clear × 100 + (k + 0.5) × Plot Width × 100. Має вийти: три вкладені цикли — дороги, боки, ділянки. [screenshot]\n   4. Усередині: Get Transform at Distance Along Spline (Path, Dist, World) > Break Transform; Right = Get Right Vector його Rotation. Front = Location + Right × Side × (Road Halves[r] + Setback) × 100. Yaw = Yaw з Rotation, плюс 180, коли Side дорівнює -1 (Select Float). Centre = Front + Right × Side × House Depth × 50. Має вийти: де стоїть кожен будинок і куди дивиться.\n   5. Створи S_Plot з Front = Front - Get Actor Location, Yaw, Bays = Max(1, Floor((Plot Width - 1) / Bay Width)) і Center = Centre

позначеним Is Landmark. Під'єднай Spawn Buildings і Spawn Landmark після Make Plots, як у День 89, і клацни Regenerate. Має вийти: будинки вздовж кожної вулиці фасадами до неї, а орієнтир — на своїй площі.\n   6. Підлети до найтіснішого кута свого плану на 5 м. На дорозі не має бути жодного будинку. Якщо будинок стоїть на іншій вулиці, збільш House Clear на 1 м у DA_TownRules_District і клацни Regenerate. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Чому її відкинуто? Тьютор описує чотири відсутні ділянки (у самому кінці дороги; за 4 м від краю іншої вулиці; усередині площі; що на вигині заходить на сусідню). Для кожної я називаю правило, яке її відкинуло, і налаштування, яке це змінює. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; rubric = таблиця оцінювання; see-why-fix note = нотатка «бачу, чому, як виправити»; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; File Explorer = Провідник; mesh = меш; grid = сітка (тільки grid, ніколи mesh); vertex / edge / face = вершина / ребро / грань; look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; material slot / node / pin = слот матеріалу / вузол / вхід; volume (PCG Volume, Post Process Volume) = об'єм; seed = зерно (налаштування Seed); map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; district / plot / plot plan = район / ділянка / план ділянки; harbour / quay / waterfront / pier = гавань / причал / набережна / пірс; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; shop front / shop window = фасад крамниці / вітрина; vista / blockout / landmark = панорама / блокаут / орієнтир; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}], "handin": [{"en": "summary.md", "uk": "summary.md (звіт дня)"}, {"en": "district_120m.png (your real town's streets, junctions and houses, generated from the map) (proof)", "uk": "district_120m.png (вулиці, перехрестя й будинки твого справжнього міста, згенеровані з мапи) (доказ)"}], "goal": {"en": "By the end of today you have BP_DistrictGenerator building the real street plan: BP_Road and BP_Lane along every street, a raised paved junction table wherever streets meet, plots along both sides of every curved street that keep off other roads, and BP_Building on every plot, grounded and repeatable from one seed.", "uk": "До кінця дня BP_DistrictGenerator будує справжній план вулиць: BP_Road і BP_Lane уздовж кожної вулиці, піднесений вимощений майданчик на кожному перехресті, ділянки з обох боків кожної кривої вулиці на відстані від інших доріг і BP_Building на кожній ділянці — з посадкою на ґрунт і повторювано з одного зерна."}, "uses": [{"en": "Day 102: DT_DistrictRoads, Read Rows, the preview and DA_TownRules_District", "uk": "День 102: DT_DistrictRoads, Read Rows, перегляд і DA_TownRules_District"}, {"en": "Day 99: Apply Plot Rules", "uk": "День 99: Apply Plot Rules"}, {"en": "Day 89: Regenerate, Clear Town, Spawned, Spawn Buildings and Spawn Landmark", "uk": "День 89: Regenerate, Clear Town, Spawned, Spawn Buildings і Spawn Landmark"}, {"en": "Day 86: BP_Road, BP_Lane and Expose on Spawn (Length Override)", "uk": "День 86: BP_Road, BP_Lane і Expose on Spawn (Length Override)"}, {"en": "Days 62 and 88: Get Transform at Distance Along Spline, Find Location Closest to World Location and Distance2D", "uk": "Дні 62 і 88: Get Transform at Distance Along Spline, Find Location Closest to World Location і Distance2D"}], "quiz": [{"q": {"en": "Your district is missing its last street, though its rows are in the table. What is the likely cause?", "uk": "У районі бракує останньої вулиці, хоча її рядки є в таблиці. Яка причина найімовірніша?"}, "options": [{"en": "Spawn One Road is not called again on the loop's Completed pin, so the last road is never built", "uk": "Spawn One Road не викликано ще раз на виході Completed циклу, тож останню дорогу не збудовано"}, {"en": "The seed", "uk": "Зерно"}, {"en": "BP_Lane is broken", "uk": "BP_Lane зламаний"}, {"en": "The street is too short to see", "uk": "Вулиця закоротка, щоб її побачити"}], "answer": 0, "explain": {"en": "Grouping rows builds a road when the next road starts; the last road has no next one, so it needs the Completed call.", "uk": "Групування рядків будує дорогу, коли починається наступна. В останньої наступної немає, тож їй потрібен виклик на Completed."}}, {"q": {"en": "Why does BP_Road take its points through an Expose on Spawn pin?", "uk": "Чому BP_Road отримує точки через вхід Expose on Spawn?"}, "options": [{"en": "Expose on Spawn makes roads cheaper", "uk": "Expose on Spawn робить дороги дешевшими"}, {"en": "The values are set before its Construction Script runs, so the road is built in the right shape at once", "uk": "Значення задаються до того, як спрацює його Construction Script, тож дорога одразу будується правильної форми"}, {"en": "Splines cannot change after spawning", "uk": "Сплайни не можна змінювати після появи"}, {"en": "Data Tables require it", "uk": "Цього вимагають Data Tables"}], "answer": 1, "explain": {"en": "Exposed values arrive before construction, exactly as Length Override did on Day 89.", "uk": "Відкриті значення приходять до побудови — так само, як Length Override у День 89."}}, {"q": {"en": "Houses on the left side of every street face away from it. What do you check?", "uk": "Будинки на лівому боці кожної вулиці стоять до неї спиною. Що перевірити?"}, "options": [{"en": "The number of bays", "uk": "Кількість прольотів фасаду"}, {"en": "The seed", "uk": "Зерно"}, {"en": "The Yaw: the left side needs the road's yaw plus 180", "uk": "Yaw: лівому боку потрібен поворот дороги плюс 180"}, {"en": "Junction Clear", "uk": "Junction Clear"}], "answer": 2, "explain": {"en": "BP_Building's front faces -Y; on the left side the house must be turned round to face the road.", "uk": "Фасад BP_Building дивиться в -Y. На лівому боці будинок треба розвернути, щоб він дивився на дорогу."}}, {"q": {"en": "Why is Apply Plot Rules called before the drop tests?", "uk": "Чому Apply Plot Rules викликають перед перевірками на відкидання?"}, "options": [{"en": "It runs faster that way", "uk": "Так швидше"}, {"en": "The drop tests need the floor count", "uk": "Перевіркам потрібна кількість поверхів"}, {"en": "Unreal requires functions to come first", "uk": "Unreal вимагає, щоб функції йшли першими"}, {"en": "So every plot draws its random numbers in the same order, whatever is dropped, and the seed stays repeatable", "uk": "Щоб кожна ділянка брала випадкові числа в тому самому порядку, хоч що відкинуто, і зерно лишалося повторюваним"}], "answer": 3, "explain": {"en": "A stream gives numbers in order; skipping a draw for a dropped plot would shift every draw after it.", "uk": "Потік дає числа по порядку. Якщо пропустити вибір для відкинутої ділянки, зсунуться всі наступні."}}, {"q": {"en": "Paved junction tables appear on plain bends where no other street meets. What is wrong?", "uk": "Вимощені майданчики з'являються на простих вигинах, де не сходиться жодна інша вулиця. Що не так?"}, "options": [{"en": "The test compares points of the same road; it must check that Rows Road[i] is not Rows Road[j]", "uk": "Перевірка порівнює точки однієї дороги; треба перевіряти, що Rows Road[i] не дорівнює Rows Road[j]"}, {"en": "The table's diameter", "uk": "Діаметр майданчика"}, {"en": "The paving material", "uk": "Матеріал бруківки"}, {"en": "Set Spline Points", "uk": "Set Spline Points"}], "answer": 0, "explain": {"en": "Without that test every point matches itself (distance 0), so every point of every road gets a table; only points shared by two different roads are junctions.", "uk": "Без цієї перевірки кожна точка збігається сама із собою (відстань 0), тож майданчик отримує кожна точка кожної дороги. Перехрестя — лише точки, спільні для двох різних доріг."}}], "weekInfo": null, "morning": {"sofar": {"en": "You have a design document, the real street plan in DT_DistrictRoads, zones from the map and a live preview in L_District.", "uk": "У тебе є проєктний документ, справжній план вулиць у DT_DistrictRoads, зони з мапи і живий перегляд в L_District."}, "today": {"en": "You build the generator's core: roads, junction tables, plots along curved streets and a house on every plot, from one seed.", "uk": "Ти будуєш ядро генератора: дороги, майданчики перехресть, ділянки вздовж кривих вулиць і будинок на кожній ділянці — з одного зерна."}, "cheer": {"en": "Today the real map turns into a town you can fly through; take the loops slowly and celebrate the first street that appears.", "uk": "Сьогодні справжня мапа стає містом, крізь яке можна пролетіти. Не поспішай із циклами і святкуй першу вулицю, що з'явиться."}, "quote": {"text": {"en": "Far and away the best prize that life offers is the chance to work hard at work worth doing.", "uk": "Найкраща нагорода, яку дає життя, — це змога наполегливо працювати над справою, вартою праці."}, "author": {"en": "Theodore Roosevelt", "uk": "Теодор Рузвельт"}, "source": "Labor Day address at the New York State Fair, Syracuse, 7 September 1903"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-103-district-generator-core", "mapHref": "../../COURSE.html", "prevHref": "../Day-102-osm-inputs-road-layout/START-HERE.html", "nextHref": "../Day-104-district-dressing-parks-corridors/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8. I am a beginner on Day 103. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me: when my Blueprint or script fails, ask for the error message or a screenshot of the graph, point to the line or node that is wrong and explain why, then let me fix it myself. Never write the whole tool for me.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: Будинки на ділянках, площа орієнтира і тест повторюваності — самостійно.\nIt's part of: Ядро BP_DistrictGenerator: Spawn Roads (BP_Road або BP_Lane на кожну вулицю, форма — через новий вхід Points), Spawn Junctions (BP_JunctionTable там, де сходяться вулиці), Make Plots (ділянки вздовж власного сплайна кожної дороги, на відстані від інших доріг, площі й одна від одної) і повторно використані Spawn Buildings та Spawn Landmark (BP_DistrictGenerator, BP_Road і новий BP_JunctionTable у плагіні TechTools; перевірка — в L_District.).\nWhy it matters: Тут справжні вулиці стають містом: кожна вулиця отримує дорогу, кожне перехрестя — майданчик, а кожен фронт — будинки, що йдуть за вигинами, як у справжніх будівничих. Справжні мережі вулиць ламають акуратні правила сітки, тож генератор мусить міряти від самих доріг. Будування вздовж сплайнів замість сітки — те, що дає твоєму інструменту взяти будь-яке місто. It comes back: Завтра (День 104) на це ядро лягають дрібниці на вулицях, парки й орієнтир, а в п'ятницю (День 105) увесь район має будуватися одним клацанням з одного зерна.\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-103-district-generator-core (on the drive I chose on Day 0).\nWhat I already know: День 102: DT_DistrictRoads, Read Rows, перегляд і DA_TownRules_District; День 99: Apply Plot Rules; День 89: Regenerate, Clear Town, Spawned, Spawn Buildings і Spawn Landmark; День 86: BP_Road, BP_Lane і Expose on Spawn (Length Override); Дні 62 і 88: Get Transform at Distance Along Spline, Find Location Closest to World Location і Distance2D; today's lessons: Дороги з таблиці; Майданчики там, де сходяться вулиці; Ділянки вздовж кривих доріг; Розводимо ділянки, потім будинки. Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- BP_Road отримує Points (масив Vector, см, локально до дороги; Instance Editable, Expose on Spawn, Category Road, з підказкою). Якщо точок 2 чи більше, Construction Script спершу викликає Set Spline Points (Points, Local) на Path; BP_Lane це успадковує; порожній Points лишає ручні дороги як були. У Class Defaults BP_Road з'являється другий тег актора, Road. Теги BP_Lane стають Lane і Road (без Street), тож розставляння дрібниць на вулицях обставляє лише головні вулиці, а фронти провулків лишаються вільними.\n- BP_JunctionTable у /TechTools/District: компонент Static Mesh з назвою Table на /Engine/BasicShapes/Cylinder з MI_Setts (інстанс M_Master з власною або CC0-текстурою бруківки) і Diameter (Float, м, 8–20, типово 14, Expose on Spawn). Scale (Diameter, Diameter, 0.18) і Relative Location (0, 0, 9): піднесений вимощений майданчик заввишки 18 см, вищий за бордюри 12,5 см, як на перехрестях багатьох старих міст. Короткий компонент Spline з назвою Clear і теги актора KeepOutWide і KeepOutJunction, щоб ліхтарі й дерева (PCG_KeepOuts) та лавки, урни й стовпчики (PCG_JunctionKeepOuts, День 90) трималися від нього на відстані.\n- Spawn Roads: одна дорога на кожен номер Road з послідовних рядків. Width 8 м і більше ставить BP_Road (секція 12 м), менше — BP_Lane (6 м). Location = генератор + перша точка; Points = кожна точка мінус перша. Кожна дорога додається в Spawned, Road Actors (масив BP_Road) і Road Halves (6 або 3 м). Остання дорога ставиться на виході Completed циклу.\n- Spawn Junctions: BP_JunctionTable у кожній точці, спільній (до 1 м) для двох різних доріг, з пропуском, якщо в межах 3 м уже стоїть майданчик. Diameter = ширина ширшої дороги (12 або 6 м) + 2 м.\n- Make Plots: для кожної дороги і кожного боку — ділянка через кожні Plot Width уздовж сплайна, від Junction Clear до довжини мінус Junction Clear, через Get Transform at Distance Along Spline (World) і його Right Vector. Front — на лінії відступу, Yaw = поворот дороги (плюс 180 на лівому боці). Спершу Apply Plot Rules, щоб випадкові вибори йшли по порядку. Потім ділянку відкидають, якщо центр будинку ближчий до іншої дороги, ніж її половина ширини + House Clear, якщо він у межах Square Radius від Landmark Point або в межах 0,9 Plot Width від уже залишеної ділянки. Ділянку орієнтира додано в Landmark Point.\n- PDA_TownRules отримує Junction Clear (м, 8), House Clear (м, 6) і Square Radius (м, 20) з підказками; DA_TownRules_District заповнено.\n- Regenerate по порядку: Check Inputs (Roads Table і Rules), Read Rows, Stream і Build Stream із Seed (Build Plan більше не викликається), Clear Town, Spawn Roads, Spawn Junctions, Make Plots, Spawn Buildings, Spawn Landmark, підсумковий рядок. Те саме зерно двічі дає той самий район; Check Town показує 0 проблем; Tick немає.\n\nMy checklist (the same numbers show on my course page):\n1. Перевір, чи є результати сьогоднішніх уроків: BP_Road з входом Points, BP_JunctionTable, а також Spawn Roads, Spawn Junctions і Make Plots у BP_DistrictGenerator. Чогось бракує? Пройди зараз кроки «Разом із тьютором» того уроку (близько 25 хвилин): самостійна робота спирається на них. Слабкий ПК (16 ГБ оперативної пам'яті чи менше): під час роботи зменш об'єми PCG до 100 × 100 м, а для фінальних картинок збільш (див. розділ про слабкі ПК в ACCOUNTS-AND-INSTALLS.html). Відкрий BP_Road, звір Points із вимогами, потім постав BP_Road і дай йому три точки вручну в Details. Перевірка: дорога згинається через усі три, а дорога з порожнім Points поводиться як раніше. (from lesson 1)\n2. В L_District клацни Regenerate, коли під'єднано лише Spawn Roads. Перевірка: на кожній сірій смузі перегляду лежить BP_Road або BP_Lane, головні вулиці широкі, провулки вузькі, а Output Log їх рахує. (from lesson 1)\n3. Зніми прапорець Show Preview і пролети вулицями на 10 м. Перевірка: жодна дорога не висить і не тоне, а криві вулиці плавно згинаються. (from lesson 1)\n4. Під'єднай Spawn Junctions і клацни Regenerate. Перевірка: вимощений майданчик на кожному перехресті й Т-подібному перехресті, жодного на простому вигині, а бордюри, що сходяться, сховано під кожним майданчиком. (from lesson 2)\n5. Під'єднай Make Plots і подивись на коробки ділянок згори. Перевірка: коробки з обох боків кожної вулиці дивляться на неї, жодна не стоїть на дорозі чи на площі. (from lesson 3)\n6. Знайди найтісніший кут, де сходяться дві вулиці, і подивись на його ділянки. Перевірка: жодна ділянка не заходить на іншу вулицю. Якщо заходить, збільш House Clear на 1 м і клацни Regenerate. (from lesson 4)\n7. Самостійно: під'єднай Spawn Buildings і Spawn Landmark (без змін з Дня 89) і клацни Regenerate. Перевірка: на кожній залишеній  for(let i=0;i<=110;i++){const t=i/110,a=t0+t*turns*TAU,s=1.1-t*.98,q=pt(a,s,0);P.push(q);if(last&&t<=(last-1)/11+1e-9)D.push(q)}
 o+='<path class="rt" d="'+smooth(P,false)+'"/>';
 if(D.length>1)o+='<path class="rtd" d="'+smooth(D,false)+'"/>';
 for(let w=1;w<=12;w++){const c=state(w),{a,s}=wp(w),q=pt(a,s,0),lx=q[0]+(Math.cos(a)>=0?15:-15),an=Math.cos(a)>=0?'start':'end';
  o+='<g class="w '+c+'">'+(c==='n'?'<circle class="halo" cx="'+f(q[0])+'" cy="'+f(q[1])+'" r="12"/>':'')+'<circle class="dot" cx="'+f(q[0])+'" cy="'+f(q[1])+'" r="'+(c==='p'?4.5:c==='n'?8:6)+'"/><text x="'+f(lx)+'" y="'+f(q[1]+5.5)+'" text-anchor="'+an+'">'+String(w).padStart(2,'0')+'</text></g>'}
 /* the dial around it: a ring with the progress arc and a label running along the rim */
 const C=2*Math.PI*176,p=Math.max(0,Math.min(1,pct||0)),id='rim'+Math.random().toString(36).slice(2,7);
 let s='<svg class="dial" viewBox="0 0 400 400" aria-hidden="true" focusable="false"><defs><linearGradient id="'+id+'g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--acc2)"/><stop offset="1" style="stop-color:var(--acc)"/></linearGradient><path id="'+id+'" d="M200 200m-191 0a191 191 0 1 1 382 0a191 191 0 1 1-382 0"/></defs>';
 s+='<circle class="face" cx="200" cy="200" r="168"/><circle class="track" cx="200" cy="200" r="176"/>';
 s+='<circle class="arc" cx="200" cy="200" r="176" stroke="url(#'+id+'g)" stroke-dasharray="'+(C*p).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 200 200)"/>';
 if(p>0){const A=-Math.PI/2+p*TAU;s+='<circle class="knob'+(p<1?' go':'')+'" cx="'+(200+176*Math.cos(A)).toFixed(1)+'" cy="'+(200+176*Math.sin(A)).toFixed(1)+'" r="7"/>'}
 if(label)s+='<text class="rimt"><textPath href="#'+id+'" startOffset="25%" text-anchor="middle">'+label+'</textPath></text>';
 s+='<svg class="topo" x="40" y="62" width="320" height="276" viewBox="40 20 520 370">'+o+'</svg>';
 return s+'</svg>'}

function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2600)}
async function cp(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e2){}a.remove()}toast(u('copied'))}
function tagTxt(v){v=String(v);const m=v.match(/^D(\d+)\.(\d+)$/i);return m?u('day')+' '+m[1]+', '+u('lesson')+' '+m[2]:u('lesson')+' '+v}
function fbCard(){const f=FB[D.day];if(!f)return '';
 if(f.s==='reviewed'){try{const z=fbSeen();if(z[D.day]!==f.at){z[D.day]=f.at;localStorage.setItem(fbSeenKey,JSON.stringify(z))}}catch(e){}
  return '<section class="card glass fbcard">'+lab(u('fbTitle'),'ok')+'<div class="row" style="align-items:baseline;gap:12px"><span class="eyebrow">'+u('fbScore')+'</span><span class="big">'+esc(f.score)+'/'+esc(f.max||10)+'</span></div>'+(fbNote(f)?'<p class="note">'+esc(fbNote(f))+'</p>':'')+'<p class="muted">'+u('fbFull')+(D.handinUrl?': <a href="'+esc(D.handinUrl)+'" target="_blank" rel="noopener">'+u('hOpen')+'</a>':': <code>'+esc(D.workPath)+'</code>')+'</p></section>'}
 return '<section class="card glass fbcard">'+lab(u('fbTitle'),f.s==='missing'?'':'ok')+'<p class="note">'+u(f.s==='missing'?'fbMiss':'fbWait')+'</p>'+(f.s==='missing'?hf():'')+'</section>'}
/* fix phase 1 (2026-10-22): the hand-in folder (a button when the roster has a link, else the folder path), the hand-in card,
   Day 0's "Before lesson 1", the checks before handing in, the Questions card, and the day report with the pasted lesson summaries */
const HIN=(D.handin||[]).map(v=>(v&&v.en)||(typeof v==='string'?v:'')).join(' ').toLowerCase(),hasClip=/\.mp4|clip/.test(HIN);
function hItem(v){return x(v)}
function hList(){return '<ul class="ticks">'+(D.handin||[]).map(v=>'<li>'+lk(hItem(v))+'</li>').join('')+'</ul>'}
const NFILES=new Set((HIN.match(/[\w-]+\.(?:blend|glb|fbx|png|jpe?g|md|txt|mp4|csv|zip|pdf|webp|kra|psd|tga|exr|json|py|uasset|umap)\b/g)||[])).size;
function nFiles(n){if(!n)return '';if(lang==='en')return ' · '+n+(n===1?' file':' files');const a=n%10,b=n%100;return ' · '+n+' '+(a===1&&b!==11?'файл':a>=2&&a<=4&&(b<12||b>14)?'файли':'файлів')}
function hf(){return D.handinUrl?'<div class="row"><a class="btn s" href="'+esc(D.handinUrl)+'" target="_blank" rel="noopener">'+ic('folder')+u('hOpen')+'</a></div>':'<p class="path">'+ic('folder')+'<span>'+u('hPath')+' <code>'+esc(D.workPath)+'</code></span></p>'}
function handinCard(){if(!D.handin||!D.handin.length)return '';return '<section class="card glass handin">'+lab(u('hTitle')+nFiles(NFILES),'ok')+hList()+hf()+'<p class="muted" style="margin:12px 0 0">'+u('hNote')+'</p></section>'}
function beforeCard(){if(!D.before||!D.before.length)return '';return '<section class="card glass before">'+lab(u('before'),'gold')+list(D.before,'ol','steps')+'</section>'}
function chkList(){const a=[];if(HIN.indexOf('.blend')>=0)a.push('chk1');if(/\.(glb|fbx)\b/.test(HIN))a.push('chk2');a.push('chk3');if(hasClip)a.push('chk4');return '<h3>'+u('chk')+'</h3><ol class="steps">'+a.map(k=>'<li>'+u(k)+'</li>').join('')+'</ol>'}
function qCard(){return '<section class="card glass qcard">'+lab(u('qTitle'))+'<ul class="ticks"><li>'+u('q1')+'</li><li>'+u('q2')+'</li><li>'+u('q3')+'</li><li>'+u('q4')+'</li><li>'+u('q5')+'</li></ul></section>'}
function reportText(){let t=D.reportPrompt;const r=D.lessons.map((l,i)=>{const v=(st['r'+i]||'').trim();return v?'Lesson '+(i+1)+': '+v:''}).filter(Boolean);
 if(r.length)t+='\n\nMy lesson summaries, pasted from my course page:\n'+r.join('\n');
 if(st.qs1)t+='\nMy first score in the Check yourself quiz: '+st.qs1[0]+' of '+st.qs1[1]+'.';
 return t}
function qDone(){return D.quiz&&D.quiz.length&&st.qa&&D.quiz.every((q,i)=>st.qa[i]!=null)}
function prog(){const Q=(D.quiz&&D.quiz.length)?1:0,L=D.lessons.length,C=D.build.steps.length;let n=0;D.lessons.forEach((l,i)=>{if(st['q'+i])n++});D.build.steps.forEach((s,i)=>{if(st['c'+i])n++});if(Q&&qDone())n++;return (L+C+Q)?n/(L+C+Q):0}
function qScore(){let n=0;D.quiz.forEach((q,i)=>{if((st.qa||{})[i]===q.answer)n++});return n}
function pick(i,k){st.qa=st.qa||{};if(st.qa[i]!=null)return;st.qa[i]=k;if(qDone()){st.qs=[qScore(),D.quiz.length];if(!st.qs1)st.qs1=st.qs.slice()}save();render();const e=document.getElementById('e'+i);if(e)e.focus({preventScroll:true})}
function retry(){st.qa={};delete st.qs;save();render();const e=document.getElementById('o0_0');if(e)e.focus()}
const isBoss=!!(D.build&&D.build.boss&&D.build.boss.length),isFin=D.day===D.total;
document.body.className=isFin?'fin':isBoss?'boss':'';
const lk=s=>esc(s).replace(/https?:\/\/[^\s<']*[^\s<.,;:)']/g,m=>'<a href="'+m+'" target="_blank" rel="noopener">'+m+'</a>');
function list(a,tag,cls){return '<'+tag+(cls?' class="'+cls+'"':'')+'>'+(a||[]).map(i=>'<li>'+lk(x(i))+'</li>').join('')+'</'+tag+'>'}
const lab=(t,k)=>'<div class="lab'+(k?' k-'+k:'')+'"><span class="dotc"></span>'+t+'</div>';
const kn=n=>'<span class="kn">'+ic(n)+'</span>';
const slider=p=>'<div class="slider"><i style="width:calc('+p+'% - 6px)"></i><b style="left:clamp(13px,'+p+'%,calc(100% - 13px))"></b></div>';
function quiz(){if(!D.quiz||!D.quiz.length)return '';const a=st.qa||{};let ok=0;const L=u('letters');
 const pips='<div class="pips well" aria-hidden="true">'+D.quiz.map((q,i)=>'<i class="'+(a[i]==null?'':a[i]===q.answer?'r':'w')+'"></i>').join('')+'</div>';
 const qs=D.quiz.map((q,i)=>{const c=a[i];if(c===q.answer)ok++;return '<div class="qz"><p class="qq"><span class="qn">'+(i+1)+'</span><span>'+lk(x(q.q))+'</span></p>'+q.options.map((o,k)=>{let cls='opt',mk='<span></span>';if(c!=null){if(k===q.answer){cls+=' right';mk=ic('check','mk')}else if(k===c){cls+=' wrong';mk=ic('x','mk')}}return '<button class="'+cls+'" id="o'+i+'_'+k+'"'+(c!=null?' disabled':'')+' onclick="pick('+i+','+k+')"><span class="lt">'+(L[k]||k+1)+'</span><span>'+esc(x(o))+'</span>'+mk+'</button>'}).join('')+(c!=null?'<p class="exp '+(c===q.answer?'r':'w')+'" id="e'+i+'" tabindex="-1"><b>'+(c===q.answer?u('right'):u('wrong'))+'</b>'+lk(x(q.explain))+'</p>':'')+'</div>'}).join('');
 return '<section class="card glass quiz">'+lab(u('quiz'),'gold')+'<p class="muted" style="margin:-6px 0 14px">'+u('quizSub')+'</p>'+pips+qs+(qDone()?'<div class="score well" role="status"><span class="eyebrow">'+u('score')+'</span><span class="lcd" aria-label="'+ok+' / '+D.quiz.length+'">'+seg(ok+'/'+D.quiz.length)+'</span>'+(st.qs1?'<span class="muted">'+u('first')+': '+st.qs1[0]+'/'+st.qs1[1]+'</span>':'')+'<div class="row"><button class="btn ghost" id="retry" onclick="retry()">'+u('retry')+'</button></div></div>':'')+'</section>'}
function vid(v){if(!v)return '';const link=v.url?'<a href="'+esc(v.url)+'" target="_blank" rel="noopener">'+esc(x(v.title)||v.url)+'</a>'+(v.channel?' <span class="muted">· '+esc(v.channel)+(v.length?' · '+esc(v.length):'')+'</span>':''):'';const s=v.search?'<a href="https://www.youtube.com/results?search_query='+encodeURIComponent(v.search)+'" target="_blank" rel="noopener">'+u('noVid')+': '+esc(v.search)+'</a>':'';const alt=v.alt&&v.alt.url?'<br><span class="eyebrow">UA</span> <a href="'+esc(v.alt.url)+'" target="_blank" rel="noopener">'+esc(v.alt.title||v.alt.url)+'</a>'+(v.alt.channel?' <span class="muted">· '+esc(v.alt.channel)+'</span>':''):'';return '<div class="vid well">'+kn('play')+'<div><b>'+u('more')+'?</b><br>'+(link||s)+alt+(link&&s?'<br><span class="muted" style="font-size:14px">'+s+'</span>':'')+'</div></div>'}
function morning(){const m=D.morning;if(!m)return '';const q=m.quote||{};
 let shelf='';if(D.day>0){shelf='<div class="shelf" aria-hidden="true">';let g='';for(let d=0;d<D.day;d++){let p=0;try{p=(JSON.parse(localStorage.getItem('devteam:'+D.learner+':'+d))||{}).pct||0}catch(e){}g+='<i class="'+(p>=1?'d':'')+(d>0&&d%5===0?' bs':'')+'"></i>';if(d%5===0||d===D.day-1){shelf+='<span class="wkg">'+g+'</span>';g=''}}shelf+='</div>'}
 const qt=lang==='uk'&&q.original?q.original:x(q.text);
 return '<section class="card glass morning"><div class="mgrid">'+(m.sofar?'<div>'+lab(u('sofar'),'gold')+shelf+'<p class="mtxt">'+lk(x(m.sofar))+'</p></div>':'')+(m.today?'<div>'+lab(u('todayL'))+'<p class="mtxt">'+lk(x(m.today))+'</p></div>':'')+'</div>'+(m.cheer?'<p class="cheer">'+esc(x(m.cheer))+'</p>':'')+(qt?'<figure class="quote well">'+kn('quote')+'<blockquote>'+esc(qt)+'</blockquote>'+(q.author?'<figcaption>'+esc(x(q.author))+'</figcaption>':'')+'</figure>':'')+'</section>'}

function toggleLang(){setLang(lang==='uk'?'en':'uk')}
/* keep open sections and keyboard focus across re-renders */
const openD=new Set();
function tg(e){if(e.open)openD.add(e.id);else openD.delete(e.id)}
const op=id=>openD.has(id)?' open':'';

 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);
 const b=D.build,P=Math.round(prog()*100);
 document.getElementById('top').innerHTML='<div class="topin glass"><a class="maplink" href="'+esc(D.mapHref)+'">'+kn('map')+u('map')+'</a><div class="crumb"><b>'+esc(x(D.learnerName))+'</b><span>'+u('week')+' '+D.week+'</span><span>'+u('day')+' '+D.day+' '+u('of')+' '+D.total+'</span></div>'+controls(lang,'setLang')+'</div><div class="tline"><i style="width:'+P+'%"></i></div>';
 const state=w=>w<D.week?'b':w===D.week?'n':'p';
 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 let wk='';if(D.weekInfo){const w=D.weekInfo;wk='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}

 h+=handinCard();h+=beforeCard();

 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];

 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+hList()+chkList()+(hasClip?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<h3>1 · '+u('copyR')+'</h3><p class="muted">'+u('report')+'</p><div class="row"><button class="btn ghost" onclick="cp(reportText())">'+ic('copy')+u('copyR')+'</button></div><h3>2 · '+u('ship')+'</h3>'+hf()+'<p class="muted" style="margin:12px 0 0">'+u('hNote')+'</p></section>';

 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();

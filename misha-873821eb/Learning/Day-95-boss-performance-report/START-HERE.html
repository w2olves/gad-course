<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 95</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

nder 33.3 ms at 1920 x 1080, along the route, for the whole route and each section), Looks (three before-and-after pairs) and Next. If your PC is below the course minimum, say so plainly, keep 1920 x 1080 and Engine Scalability High, judge the change by before and after on this PC, and name the setting you would lower to reach the budget.", "uk": "perf_report_day95.md з розділами Test (рівень, зерно, маршрут, налаштування, ПК), Before, Cause, Change, After, Result (бюджет: середнє менше за 16.6 мс і 95-й перцентиль менше за 33.3 мс у 1920 x 1080, уздовж маршруту, для всього маршруту та кожної ділянки), Looks (три пари «до і після») і Next. Якщо твій ПК слабший за мінімум курсу, скажи про це прямо, залиш 1920 x 1080 і Engine Scalability High, оціни зміну за порівнянням «до і після» на цьому ПК і назви налаштування, яке варто знизити, щоб досягти бюджету."}, {"en": "Bronze, Silver and Gold as listed below; nothing floating and Check Town at 0 problems after the change.", "uk": "Бронза, Срібло і Золото, як зазначено нижче; нічого не висить, а Check Town показує 0 проблем після зміни."}], "piece1": "The before capture, the diagnosis and the change (planned and practised in the micro-lessons)", "piece2": {"en": "The after capture, the written report, and Gold's repeated runs and HLOD test", "uk": "Захоплення «після», написаний звіт, а також повторювані запуски та тест HLOD для Золота"}, "steps": [{"text": {"en": "Start a 4-hour timer. Write boss_day95.md: tiers, minutes per step, and the three suspects from perf_baseline.md with the setting each one changes. Check: every step has a time and the total is under 4 hours.", "uk": "Запусти 4-годинний таймер. Напиши boss_day95.md: рівні, хвилини на крок і три підозрювані з perf_baseline.md із налаштуванням, яке змінює кожен. Перевірка: кожен крок має час, а загалом менше за 4 години."}, "lesson": 1}, {"text": {"en": "Save L_Day94 as L_Day95 in Content/Tools/Day95, check BP_PerfFlight's Route and the seed, and take before_V1.png, before_V2.png and before_V3.png from the three bookmarks. Check: three pictures in today's Work folder and the level saved.", "uk": "Збережи L_Day94 як L_Day95 у Content/Tools/Day95, перевір Route у BP_PerfFlight і зерно та зроби before_V1.png, before_V2.png і before_V3.png із трьох закладок. Перевірка: три зображення в сьогоднішній папці Work, а рівень збережено."}, "lesson": 1}, {"text": {"en": "Before: tick perf_checklist.md, make a warm-up run, then a kept run, and save the report as perf_before.md. Check: four sections and a Whole route row, and the worst section named in boss_day95.md.", "uk": "До: познач perf_checklist.md, зроби прогрівальний запуск, потім збережений запуск і збережи звіт як perf_before.md. Перевірка: чотири ділянки та рядок Whole route, а найгіршу ділянку названо в boss_day95.md."}, "lesson": "D93.3"}, {"text": {"en": "Diagnose: go to the worst section's mark (bookmark 4) and read stat gpu's five biggest lines; then record an Insights trace of one BP_PerfFlight run and click the tallest bar in the worst section's quarter, as in lesson 2. Check: insights_before.png with the slowest frame's three biggest timers, and one sentence naming the cause.", "uk": "Діагностуй: перейди до позначки найгіршої ділянки (закладка 4) і прочитай п'ять найбільших рядків stat gpu; потім запиши трасу Insights одного запуску BP_PerfFlight і клацни найвищу смужку в чверті найгіршої ділянки, як на уроці 2. Перевірка: insights_before.png із трьома найбільшими таймерами найповільнішого кадру та одне речення, що називає причину."}, "lesson": 2}, {"text": {"en": "Pick one change that matches the cause, write it in one line, and predict which number falls and by roughly how much. Check: one change only, with a prediction in ms.", "uk": "Обери одну зміну, що відповідає причині, запиши її одним рядком і передбач, яке число впаде і приблизно на скільки. Перевірка: лише одна зміна, з прогнозом у мс."}, "lesson": 2}, {"text": {"en": "Make the change (for Nanite, set_nanite.py's dry run first, then Yes; for spawner settings, Generate the dresser again), then click Check Town. Check: the change shows in its settings and Check Town reports 0 problems.", "uk": "Зроби зміну (для Nanite спершу пробний запуск set_nanite.py, потім Yes; для налаштувань спавнера знову Generate дресера), потім натисни Check Town. Перевірка: зміна видна в її налаштуваннях, а Check Town повідомляє про 0 проблем."}, "lesson": 3}, {"text": {"en": "Looks: take after_V1.png, after_V2.png and after_V3.png from the same bookmarks and compare each pair side by side. Check: you cannot see the change at V1 and V2, and any difference at V3 is acceptable; if not, soften the change (a longer cull distance, for example) and check again.", "uk": "Вигляд: зроби after_V1.png, after_V2.png і after_V3.png із тих самих закладок і порівняй кожну пару пліч-о-пліч. Перевірка: ти не бачиш зміни у V1 і V2, а будь-яка різниця у V3 прийнятна; якщо ні, пом'якши зміну (наприклад, більша дистанція відсікання) і перевір знову."}, "lesson": 3}, {"text": {"en": "After: the same checklist, a warm-up run and a kept run; save the report as perf_after.md. Check: the worst section moved by about the amount you predicted, or you can say why not.", "uk": "Після: той самий контрольний список, прогрівальний запуск і збережений запуск; збережи звіт як perf_after.md. Перевірка: найгірша ділянка зрушила приблизно на передбачену тобою величину, або ти можеш сказати чому ні."}, "lesson": "D93.3"}, {"text": {"en": "Bronze check: write perf_report_day95.md with Test, Before, Cause, Change, After, Result, Looks and Next, honest about your PC. Check: every claim in it has a number from a report or a picture behind it.", "uk": "Перевірка Бронзи: напиши perf_report_day95.md з Test, Before, Cause, Change, After, Result, Looks і Next, чесний щодо твого ПК. Перевірка: за кожним твердженням у ньому стоїть число зі звіту або зображення."}, "lesson": 4}, {"text": {"en": "Silver check: compare every row of perf_after.md with the budget, and put the three picture pairs side by side as looks_day95.png. Check: average under 16.6 ms and 95th percentile under 33.3 ms in every row, and the pairs look the same.", "uk": "Перевірка Срібла: порівняй кожен рядок perf_after.md із бюджетом і поклади три пари зображень пліч-о-пліч як looks_day95.png. Перевірка: середнє менше за 16.6 мс і 95-й перцентиль менше за 33.3 мс у кожному рядку, а пари виглядають однаково."}, "lesson": 4}, {"text": {"en": "Gold: three kept runs before (undo the change, warm up, three runs) and three after, with the smallest and largest Whole route average of each set; then make the same change in L_Day93_WP, drag LS_PerfRoute into it (Auto Play unticked) and place BP_PerfFlight with Route set to it, Build HLODs and run the route there. Check: the two ranges do not overlap, and the HLOD level's result is in the report.", "uk": "Золото: три збережені запуски до (скасуй зміну, прогрій, три запуски) і три після, з найменшим і найбільшим середнім Whole route кожного набору; потім зроби ту саму зміну в L_Day93_WP, перетягни в нього LS_PerfRoute (Auto Play без галочки) і розмісти BP_PerfFlight із Route, встановленим на нього, зроби Build HLODs і запусти там маршрут. Перевірка: два діапазони не перекриваються, а результат рівня HLOD є у звіті."}, "lesson": 4}, {"text": {"en": "Self-review perf_report_day95.md with the tutor: is the test fair, is the cause shown, is the change isolated, could a stranger repeat it? Fix the weakest line. Check: the review notes and the fix are in boss_day95.md.", "uk": "Самоперевірка perf_report_day95.md з тьютором: чи тест чесний, чи показано причину, чи зміну ізольовано, чи зміг би сторонній це повторити? Виправ найслабший рядок. Перевірка: нотатки самоперевірки та виправлення є в boss_day95.md."}, "lesson": 4}, {"text": {"en": "Record clip_day95.mp4 (60 seconds): BP_PerfFlight flying the route after the change, then the before and after tables. Click Copy the day report, paste it into a new tutor chat and save its answer as summary.md. Check: the clip and summary.md are in today's Work folder.", "uk": "Запиши clip_day95.mp4 (60 секунд): BP_PerfFlight пролітає маршрут після зміни, потім таблиці «до» і «після». Натисни Copy the day report, встав у новий чат із тьютором і збережи його відповідь як summary.md. Перевірка: кліп і summary.md лежать у сьогоднішній папці Work."}, "lesson": 1}], "boss": [{"en": "Bronze: perf_before.md, one change, perf_after.md and perf_report_day95.md written honestly with the cause named, inside 4 hours.", "uk": "Бронза: perf_before.md, одна зміна, perf_after.md і perf_report_day95.md, написані чесно з названою причиною, за 4 години."}, {"en": "Silver: Bronze, with the whole route and every section under budget after the change (average under 16.6 ms and 95th percentile under 33.3 ms at 1920 x 1080) and three before-and-after picture pairs that look the same.", "uk": "Срібло: Бронза, з усім маршрутом і кожною ділянкою в межах бюджету після зміни (середнє менше за 16.6 мс і 95-й перцентиль менше за 33.3 мс у 1920 x 1080) і трьома парами зображень «до і після», що виглядають однаково."}, {"en": "Gold: Silver, plus three kept runs before and three after with the range of each set, and the same change tested in L_Day93_WP with HLODs built.", "uk": "Золото: Срібло, плюс три збережені запуски до і три після з діапазоном кожного набору, і та сама зміна, перевірена в L_Day93_WP зі збудованими HLOD."}], "assets": ["techart/standards-sheet.md", "techart/tool-review-checklist.md"]}, "lessons": [{"title": {"en": "Boss briefing: a report people trust (micro-lesson)", "uk": "Інструктаж боса: звіт, якому довіряють (мікроурок)"}, "minutes": 40, "goals": [{"en": "Know the parts of a performance report: test, before, cause, change, after, result, looks and next.", "uk": "Знай частини звіту про продуктивність: test, before, cause, change, after, result, looks і next."}, {"en": "Plan Bronze, Silver and Gold in minutes.", "uk": "Сплануй Бронзу, Срібло та Золото в хвилинах."}, {"en": "Say what you do if your PC is below the course minimum: measure honestly at the same settings and judge by before and after on this PC.", "uk": "Скажи, що ти робиш, якщо твій ПК слабший за мінімум курсу: вимірюй чесно за тих самих налаштувань і оцінюй за порівнянням «до і після» на цьому ПК."}], "doalong": [{"en": "Open boss_day95.md and copy in the build steps as a checklist. Give each a time; the total must be under 4 hours. You see a timed plan.", "uk": "Відкрий boss_day95.md і скопіюй туди кроки збірки як контрольний список. Дай кожному час; загалом має бути менше за 4 години. Ти бачиш план із часом."}, {"en": "Write the report's skeleton in perf_report_day95.md: the headings Test, Before, Cause, Change, After, Result, Looks and Next. You see an empty report waiting for numbers.", "uk": "Напиши скелет звіту в perf_report_day95.md: заголовки Test, Before, Cause, Change, After, Result, Looks і Next. Ти бачиш порожній звіт, що чекає на числа."}, {"en": "Under Test write the level, the seed, the route (LS_PerfRoute, 80 s, sections A to D), the settings from perf_checklist.md and your PC. You see a block from which anyone could repeat your test.", "uk": "Під Test напиши рівень, зерно, маршрут (LS_PerfRoute, 80 с, ділянки від A до D), налаштування з perf_checklist.md і свій ПК. Ти бачиш блок, за яким будь-хто міг би повторити твій тест."}, {"en": "Talk with the tutor about a PC below the minimum: you still measure at 1920 x 1080 and Engine Scalability High, report the numbers as they are, prove the change by before and after on the same PC, and name the one setting (for example Shadows at Medium) you would lower to reach the budget. You see an honest plan for any PC.", "uk": "Поговори з тьютором про ПК, слабший за мінімум: ти все одно вимірюєш у 1920 x 1080 і Engine Scalability High, повідомляєш числа як є, доводиш зміну порівнянням «до і після» на тому самому ПК і називаєш одне налаштування (наприклад, Shadows на Medium), яке варто знизити, щоб досягти бюджету. Ти бачиш чесний план для будь-якого ПК."}], "play": {"en": "Producer: the tutor plays a producer who reads my skeleton and asks five hard questions (Is it the same route? Was anything else running? How do you know the change caused it? Does it still look the same? Will it hold on a slower PC?). I answer each from my plan.", "uk": "Продюсер: тьютор грає продюсера, який читає мій скелет і ставить п'ять важких запитань (Це той самий маршрут? Чи щось ще було запущене? Звідки ти знаєш, що зміна спричинила це? Чи воно все ще виглядає так само? Чи витримає це слабший ПК?). Я відповідаю на кожне з мого плану."}, "video": {"search": "game performance optimization before after measurement methodology"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Boss briefing: a report people trust (micro-lesson) (Day 95, lesson 1 of 4).\nToday's build: perf_report_day95.md: one town quarter, one route, one optimisation, measured before and after with the same checklist and judged against the 60 fps budget.\n\nBy the end of this lesson I can:\n1. Know the parts of a performance report: test, before, cause, change, after, result, looks and next.\n2. Plan Bronze, Silver and Gold in minutes.\n3. Say what you do if your PC is below the course minimum: measure honestly at the same settings and judge by before and after on this PC.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (This week you built a performance toolkit: a baseline, perf_report.py, a camera route that records itself with a checklist, and weathering materials.), what I will learn today (You use it all to write one real performance report: before, cause, one change, after, and proof against the budget.), encourage me (Whatever your PC, an honest report is a good report; the numbers are information about the world, not a mark on you.), and share today's quote: \"Extraordinary claims require extraordinary evidence.\" (Carl Sagan).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 92: Why does by_section add up frame times instead of counting frames? | Day 88: What does Corridor Half Width do to the plots near KO_Corridor01?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Producer: the tutor plays a producer who reads my skeleton and asks five hard questions (Is it the same route? Was anything else running? How do you know the change caused it? Does it still look the same? Will it hold on a slower PC?). I answer each from my plan.\n6. Do-along on today's build (The before capture, the diagnosis and the change (planned and practised in the micro-lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Open boss_day95.md and copy in the build steps as a checklist. Give each a time; the total must be under 4 hours. You see a timed plan.\n   - Write the report's skeleton in perf_report_day95.md: the headings Test, Before, Cause, Change, After, Result, Looks and Next. You see an empty report waiting for numbers.\n   - Under Test write the level, the seed, the route (LS_PerfRoute, 80 s, sections A to D), the settings from perf_checklist.md and your PC. You see a block from which anyone could repeat your test.\n   - Talk with the tutor about a PC below the minimum: you still measure at 1920 x 1080 and Engine Scalability High, report the numbers as they are, prove the change by before and after on the same PC, and name the one setting (for example Shadows at Medium) you would lower to reach the budget. You see an honest plan for any PC.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "From a slow section to a cause (micro-lesson)", "uk": "Від повільної ділянки до причини (мікроурок)"}, "minutes": 40, "goals": [{"en": "Go from the worst row in perf_before.md to the place on the route, using the section marks.", "uk": "Перейди від найгіршого рядка в perf_before.md до місця на маршруті за позначками ділянок."}, {"en": "Confirm the cause with stat gpu and an Insights trace at that place.", "uk": "Підтверди причину за допомогою stat gpu і траси Insights у тому місці."}, {"en": "Choose one change that matches the cause, and predict its saving.", "uk": "Обери одну зміну, що відповідає причині, і передбач її економію."}], "doalong": [{"en": "In LS_PerfRoute put the playhead at the worst section's mark and pilot CAM_PerfRoute: that is the view the capture saw. Save a bookmark there with Ctrl+4. You see the slow view.", "uk": "У LS_PerfRoute постав курсор відтворення на позначку найгіршої ділянки та пілотуй CAM_PerfRoute: це ракурс, який бачило захоплення. Збережи там закладку через Ctrl+4. Ти бачиш повільний ракурс."}, {"en": "Type stat gpu and write its five biggest lines. You see the job that costs most, for example ShadowDepths (shadows), BasePass (drawing surfaces), Lumen or Translucency.", "uk": "Введи stat gpu і запиши його п'ять найбільших рядків. Ти бачиш завдання, що коштує найдорожче, наприклад ShadowDepths (тіні), BasePass (малювання поверхонь), Lumen або Translucency."}, {"en": "Record the route itself (BP_PerfFlight takes over Play in this level, so you cannot fly by hand): click Start Trace, press Play and let the route run; when Play closes, click Stop Trace. Open the trace: the bars run in time order and the route fills the stretch after the 3-second wait, a quarter per section, so click the tallest bar inside the worst section's quarter. You see the same job near the top of the Timers list, or another one that tells you more.", "uk": "Запиши сам маршрут (BP_PerfFlight перебирає Play на себе на цьому рівні, тож вручну літати не можна): клацни Start Trace, натисни Play і дай маршруту пройти; коли Play закриється, клацни Stop Trace. Відкрий трасу: смужки йдуть у порядку часу, а маршрут заповнює відрізок після 3-секундного очікування, по чверті на ділянку, тож клацни найвищу смужку всередині чверті найгіршої ділянки. Ти бачиш те саме завдання вгорі списку Timers або інше, що каже тобі більше."}, {"en": "Match the cause to a change with the tutor: shadows from many small props (Cast Shadow off on them); too many far instances (cull distances); meshes without Nanite (set_nanite.py); leaf overdraw (fewer street trees). Write which number should fall, and by roughly how much. You see one change chosen for a reason.", "uk": "Зістав причину зі зміною разом із тьютором: тіні від багатьох малих пропсів (Cast Shadow вимкнути на них); забагато далеких інстансів (дистанції відсікання); меші без Nanite (set_nanite.py); overdraw листя (менше вуличних дерев). Напиши, яке число має впасти і приблизно на скільки. Ти бачиш одну зміну, обрану не просто так."}], "play": {"en": "Cause and cure: the tutor gives me five stat gpu tops (ShadowDepths 6 ms; BasePass 5 ms with 4,000 draw calls; Translucency 3 ms; Lumen 7 ms; every GPU line small but the frame still 25 ms with Game at 24 ms). For each I name the likely cause in a generated town and one change to test.", "uk": "Причина і ліки: тьютор дає мені п'ять топів stat gpu (ShadowDepths 6 мс; BasePass 5 мс при 4 000 draw calls; Translucency 3 мс; Lumen 7 мс; кожен рядок GPU малий, але кадр усе одно 25 мс, а Game 24 мс). Для кожного я називаю ймовірну причину в згенерованому місті та одну зміну для перевірки."}, "video": {"search": "unreal engine 5 stat gpu shadowdepths basepass optimization"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: From a slow section to a cause (micro-lesson) (Day 95, lesson 2 of 4).\nToday's build: perf_report_day95.md: one town quarter, one route, one optimisation, measured before and after with the same checklist and judged against the 60 fps budget.\nEarlier today I already did: lesson 1 (Boss briefing: a report people trust (micro-lesson)). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Go from the worst row in perf_before.md to the place on the route, using the section marks.\n2. Confirm the cause with stat gpu and an Insights trace at that place.\n3. Choose one change that matches the cause, and predict its saving.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Cause and cure: the tutor gives me five stat gpu tops (ShadowDepths 6 ms; BasePass 5 ms with 4,000 draw calls; Translucency 3 ms; Lumen 7 ms; every GPU line small but the frame still 25 ms with Game at 24 ms). For each I name the likely cause in a generated town and one change to test.\n4. Do-along on today's build (The before capture, the diagnosis and the change (planned and practised in the micro-lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - In LS_PerfRoute put the playhead at the worst section's mark and pilot CAM_PerfRoute: that is the view the capture saw. Save a bookmark there with Ctrl+4. You see the slow view.\n   - Type stat gpu and write its five biggest lines. You see the job that costs most, for example ShadowDepths (shadows), BasePass (drawing surfaces), Lumen or Translucency.\n   - Record the route itself (BP_PerfFlight takes over Play in this level, so you cannot fly by hand): click Start Trace, press Play and let the route run; when Play closes, click Stop Trace. Open the trace: the bars run in time order and the route fills the stretch after the 3-second wait, a quarter per section, so click the tallest bar inside the worst section's quarter. You see the same job near the top of the Timers list, or another one that tells you more.\n   - Match the cause to a change with the tutor: shadows from many small props (Cast Shadow off on them); too many far instances (cull distances); meshes without Nanite (set_nanite.py); leaf overdraw (fewer street trees). Write which number should fall, and by roughly how much. You see one change chosen for a reason.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "One change, and looks that don't move (micro-lesson)", "uk": "Одна зміна, і вигляд, що не рухається (мікроурок)"}, "minutes": 40, "goals": [{"en": "Change one thing only, so the result can be explained.", "uk": "Змінюй лише одну річ, щоб результат можна було пояснити."}, {"en": "Check the looks from the same three bookmarks, so a saving never costs the picture.", "uk": "Перевіряй вигляд із тих самих трьох закладок, щоб економія ніколи не коштувала картинки."}, {"en": "Know the common fixes for generated content and their side effects.", "uk": "Знай поширені виправлення для згенерованого вмісту та їхні побічні ефекти."}], "doalong": [{"en": "If your change is Cast Shadow: open PCG_StreetDresser, untick Cast Shadow in the bollard, bin and bench spawners' mesh descriptors (keep it on trees and lamps) and Generate. You see the small props lose their shadows, which hardly shows from drone height.", "uk": "Якщо твоя зміна — Cast Shadow: відкрий PCG_StreetDresser, зніми галочку Cast Shadow у дескрипторах мешів спавнерів стовпчиків, смітників і лавок (залиш на деревах і ліхтарях) і Generate. Ти бачиш, як малі пропси втрачають тіні, що ледь помітно з висоти дрона."}, {"en": "If your change is cull distances: set Instance Start Cull Distance and Instance End Cull Distance in the props' spawner descriptors (for example 8000 and 12000 cm, as on Day 56) and Generate. You see small props fade out far away but not near the camera.", "uk": "Якщо твоя зміна — дистанції відсікання: встанови Instance Start Cull Distance і Instance End Cull Distance у дескрипторах спавнерів пропсів (наприклад, 8000 і 12000 см, як на Дні 56) і Generate. Ти бачиш, як малі пропси зникають удалині, але не біля камери."}, {"en": "If your change is Nanite: run set_nanite.py on the folder holding the plain meshes from nanite.png, dry run first, then Yes. You see them in colour in Nanite Visualization > Overview.", "uk": "Якщо твоя зміна — Nanite: запусти set_nanite.py на папці з простими мешами з nanite.png, спершу пробний запуск, потім Yes. Ти бачиш їх кольоровими в Nanite Visualization > Overview."}, {"en": "Whatever you changed, take the three after pictures from V1, V2 and V3 and put each beside its before picture. You see whether the change shows; if it does, soften it before you measure.", "uk": "Яка б не була твоя зміна, зроби три картинки «після» з V1, V2 і V3 і поклади кожну поруч зі своєю картинкою «до». Ти бачиш, чи видно зміну; якщо видно, пом'якши її, перш ніж вимірювати."}], "play": {"en": "Side effects: the tutor names five fixes (shadows off on every tree; a 30 m cull distance on lamps; Nanite on glass; halving every building's floors; one HLOD for everything). For each I name the side effect a player would notice.", "uk": "Побічні ефекти: тьютор називає п'ять виправлень (тіні вимкнено на кожному дереві; дистанція відсікання 30 м на ліхтарях; Nanite на склі; половина поверхів у кожній будівлі; один HLOD на все). Для кожного я називаю побічний ефект, який помітив би гравець."}, "video": {"search": "unreal engine 5 pcg static mesh spawner cull distance cast shadow"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: One change, and looks that don't move (micro-lesson) (Day 95, lesson 3 of 4).\nToday's build: perf_report_day95.md: one town quarter, one route, one optimisation, measured before and after with the same checklist and judged against the 60 fps budget.\nEarlier today I already did: lesson 1 (Boss briefing: a report people trust (micro-lesson)); lesson 2 (From a slow section to a cause (micro-lesson)). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Change one thing only, so the result can be explained.\n2. Check the looks from the same three bookmarks, so a saving never costs the picture.\n3. Know the common fixes for generated content and their side effects.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Side effects: the tutor names five fixes (shadows off on every tree; a 30 m cull distance on lamps; Nanite on glass; halving every building's floors; one HLOD for everything). For each I name the side effect a player would notice.\n4. Do-along on today's build (The before capture, the diagnosis and the change (planned and practised in the micro-lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - If your change is Cast Shadow: open PCG_StreetDresser, untick Cast Shadow in the bollard, bin and bench spawners' mesh descriptors (keep it on trees and lamps) and Generate. You see the small props lose their shadows, which hardly shows from drone height.\n   - If your change is cull distances: set Instance Start Cull Distance and Instance End Cull Distance in the props' spawner descriptors (for example 8000 and 12000 cm, as on Day 56) and Generate. You see small props fade out far away but not near the camera.\n   - If your change is Nanite: run set_nanite.py on the folder holding the plain meshes from nanite.png, dry run first, then Yes. You see them in colour in Nanite Visualization > Overview.\n   - Whatever you changed, take the three after pictures from V1, V2 and V3 and put each beside its before picture. You see whether the change shows; if it does, soften it before you measure.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Writing the result, and the self-review (micro-lesson)", "uk": "Написання результату та самоперевірка (мікроурок)"}, "minutes": 40, "goals": [{"en": "Write the result against the budget, section by section, without hiding a failing row.", "uk": "Напиши результат за бюджетом, ділянка за ділянкою, не ховаючи рядок, що не проходить."}, {"en": "Show the spread of repeated runs (Gold), so a 0.3 ms change is not mistaken for proof.", "uk": "Покажи розкид повторюваних запусків (Золото), щоб зміну на 0.3 мс не прийняли за доказ."}, {"en": "Self-review the report with the tutor and fix its weakest line.", "uk": "Зроби самоперевірку звіту з тьютором і виправ його найслабший рядок."}], "doalong": [{"en": "Paste the before and after tables into perf_report_day95.md and add a third table: Section, Before average, After average, Change. You see the saving per section.", "uk": "Встав таблиці «до» і «після» в perf_report_day95.md і додай третю таблицю: Section, Before average, After average, Change. Ти бачиш економію за ділянками."}, {"en": "Write the Result: PASS or FAIL against the budget for the whole route and for each section, one sentence each. If a section still fails, say so and name your next change. You see an honest result.", "uk": "Напиши Result: PASS або FAIL за бюджетом для всього маршруту та для кожної ділянки, по одному реченню. Якщо ділянка все ще не проходить, скажи про це та назви свою наступну зміну. Ти бачиш чесний результат."}, {"en": "Add Looks: looks_day95.png with the three pairs, and one line on what changed visibly (ideally nothing). You see the cost of the saving in pictures.", "uk": "Додай Looks: looks_day95.png із трьома парами та один рядок про те, що змінилося видимо (в ідеалі нічого). Ти бачиш ціну економії в картинках."}, {"en": "Ask the tutor to review the report as a lead technical artist would: a fair test? the cause shown? one change? could a stranger repeat it? Fix the weakest line. You see a report ready to show.", "uk": "Попроси тьютора переглянути звіт так, як це зробив би провідний технічний художник: чесний тест? показано причину? одна зміна? чи зміг би сторонній це повторити? Виправ найслабший рядок. Ти бачиш звіт, готовий до показу."}], "play": {"en": "Red pen: the tutor shows me a weak report (no route named; two changes at once; 'feels smoother'; no PC listed; only the average). I rewrite three lines so each can be measured.", "uk": "Червоний олівець: тьютор показує мені слабкий звіт (маршрут не названо; дві зміни одночасно; «відчувається плавніше»; ПК не вказано; лише середнє). Я переписую три рядки так, щоб кожен можна було виміряти."}, "video": {"search": "how to present game performance results profiling report"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Writing the result, and the self-review (micro-lesson) (Day 95, lesson 4 of 4).\nToday's build: perf_report_day95.md: one town quarter, one route, one optimisation, measured before and after with the same checklist and judged against the 60 fps budget.\nEarlier today I already did: lesson 1 (Boss briefing: a report people trust (micro-lesson)); lesson 2 (From a slow section to a cause (micro-lesson)); lesson 3 (One change, and looks that don't move (micro-lesson)). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Write the result against the budget, section by section, without hiding a failing row.\n2. Show the spread of repeated runs (Gold), so a 0.3 ms change is not mistaken for proof.\n3. Self-review the report with the tutor and fix its weakest line.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Red pen: the tutor shows me a weak report (no route named; two changes at once; 'feels smoother'; no PC listed; only the average). I rewrite three lines so each can be measured.\n4. Do-along on today's build (The before capture, the diagnosis and the change (planned and practised in the micro-lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Paste the before and after tables into perf_report_day95.md and add a third table: Section, Before average, After average, Change. You see the saving per section.\n   - Write the Result: PASS or FAIL against the budget for the whole route and for each section, one sentence each. If a section still fails, say so and name your next change. You see an honest result.\n   - Add Looks: looks_day95.png with the three pairs, and one line on what changed visibly (ideally nothing). You see the cost of the saving in pictures.\n   - Ask the tutor to review the report as a lead technical artist would: a fair test? the cause shown? one change? could a stranger repeat it? Fix the weakest line. You see a report ready to show.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "boss_day95.md (plan with times, tiers, prediction, self-review notes and fix)", "uk": "boss_day95.md (план із часом, рівні, прогноз, нотатки самоперевірки та виправлення)"}, {"en": "perf_before.md, perf_after.md and perf_report_day95.md", "uk": "perf_before.md, perf_after.md і perf_report_day95.md"}, {"en": "insights_before.png and looks_day95.png (three before-and-after pairs)", "uk": "insights_before.png і looks_day95.png (три пари «до і після»)"}, {"en": "clip_day95.mp4 (60 seconds: the route after the change, then both tables)", "uk": "clip_day95.mp4 (60 секунд: маршрут після зміни, потім обидві таблиці)"}, {"en": "summary.md", "uk": "summary.md"}], "goal": {"en": "By the end of today you have perf_report_day95.md: your town quarter flown along LS_PerfRoute before and after one measured optimisation, with perf_report.py's tables, the cause found with stat gpu and Insights, and the result judged against the budget (average under 16.6 ms and 95th percentile under 33.3 ms at 1920 x 1080), honest about your PC.", "uk": "До кінця сьогодні ти маєш perf_report_day95.md: твій міський квартал, пролетений уздовж LS_PerfRoute до і після однієї виміряної оптимізації, з таблицями perf_report.py, причиною, знайденою через stat gpu та Insights, і результатом, оціненим за бюджетом (середнє менше за 16.6 мс і 95-й перцентиль менше за 33.3 мс у 1920 x 1080), чесним щодо твого ПК."}, "uses": [{"en": "Day 93: LS_PerfRoute, BP_PerfFlight and perf_checklist.md", "uk": "День 93: LS_PerfRoute, BP_PerfFlight і perf_checklist.md"}, {"en": "Day 92: perf_report.py", "uk": "День 92: perf_report.py"}, {"en": "Day 91: perf_baseline.md and its three ranked suspects", "uk": "День 91: perf_baseline.md і його три підозрювані за рангом"}, {"en": "Day 94: the weathered materials on every house", "uk": "День 94: матеріали зі старінням на кожному будинку"}, {"en": "Days 72 and 85: set_nanite.py and the dresser's spawner settings", "uk": "Дні 72 і 85: set_nanite.py і налаштування спавнера дресера"}], "quiz": [{"q": {"en": "Day 91: stat unit shows Game 3 ms, Draw 4 ms and GPU 19 ms. Where do you look first?", "uk": "День 91: stat unit показує Game 3 мс, Draw 4 мс і GPU 19 мс. Куди ти дивишся першим?"}, "options": [{"en": "The Blueprint logic", "uk": "Логіка Blueprint"}, {"en": "The draw-call count only", "uk": "Лише кількість draw calls"}, {"en": "GPU costs such as shadows, overdraw and Lumen", "uk": "Витрати GPU, як-от тіні, overdraw та Lumen"}, {"en": "Nowhere: the frame is fine", "uk": "Нікуди: з кадром усе гаразд"}], "answer": 2, "explain": {"en": "The graphics card is the slowest part, so the frame waits for it.", "uk": "Відеокарта — найповільніша частина, тож кадр чекає на неї."}}, {"q": {"en": "Day 91: You hide the buildings and the GPU time drops by 6 ms from the same bookmark. What does that tell you?", "uk": "День 91: Ти ховаєш будинки, і час GPU падає на 6 мс з тієї самої закладки. Що це тобі каже?"}, "options": [{"en": "The buildings cost about 6 ms from this view, so they are a suspect", "uk": "Будинки коштують близько 6 мс з цього ракурсу, тож вони підозрювані"}, {"en": "The buildings are broken", "uk": "Будинки зламані"}, {"en": "Nothing: hiding always saves time", "uk": "Нічого: ховання завжди економить час"}, {"en": "The seed is wrong", "uk": "Зерно хибне"}], "answer": 0, "explain": {"en": "Taking one thing away at a time measures its cost; that is what the cost table is for.", "uk": "Прибирання по одній речі за раз вимірює її вартість; для цього й існує таблиця вартості."}}, {"q": {"en": "Day 92: One frame in ten takes 50 ms and the rest take 12 ms. Which number shows the problem?", "uk": "День 92: Один кадр із десяти триває 50 мс, а решта 12 мс. Яке число показує проблему?"}, "options": [{"en": "The average, which is over budget", "uk": "Середнє, яке виходить за бюджет"}, {"en": "The 95th percentile, which is 50 ms, over 33.3 ms", "uk": "95-й перцентиль, який дорівнює 50 мс, понад 33.3 мс"}, {"en": "Neither: both pass", "uk": "Жодне: обидва проходять"}, {"en": "The number of frames", "uk": "Кількість кадрів"}], "answer": 1, "explain": {"en": "The average is about 15.8 ms and passes, but 10 frames in 100 take 50 ms, so the 95th percentile fails.", "uk": "Середнє становить близько 15.8 мс і проходить, але 10 кадрів зі 100 тривають 50 мс, тож 95-й перцентиль не проходить."}}, {"q": {"en": "Day 92: Why does read_frames use try and except?", "uk": "День 92: Чому read_frames використовує try і except?"}, "options": [{"en": "To skip the text rows at the end of a capture, which are not frames", "uk": "Щоб пропустити текстові рядки в кінці захоплення, які не є кадрами"}, {"en": "To make reading faster", "uk": "Щоб читання було швидшим"}, {"en": "To hide every possible error", "uk": "Щоб приховати кожну можливу помилку"}, {"en": "To sort the frames", "uk": "Щоб відсортувати кадри"}], "answer": 0, "explain": {"en": "Only rows that fail to become numbers are skipped; other mistakes still show.", "uk": "Пропускаються лише рядки, що не стають числами; інші помилки все одно видно."}}, {"q": {"en": "Day 93: Why does BP_PerfFlight wait Start Delay seconds before csvprofile start?", "uk": "День 93: Чому BP_PerfFlight чекає Start Delay секунд перед csvprofile start?"}, "options": [{"en": "Because Sequencer needs it", "uk": "Бо цього потребує Sequencer"}, {"en": "To make the capture longer", "uk": "Щоб захоплення було довшим"}, {"en": "So the level settles before recording starts", "uk": "Щоб рівень встиг стабілізуватися, перш ніж почнеться запис"}, {"en": "Every console command needs a Delay", "uk": "Кожна консольна команда потребує Delay"}], "answer": 2, "explain": {"en": "The first moments of Play load and settle; recording after them keeps runs comparable.", "uk": "Перші моменти Play завантажуються та стабілізуються; запис після них робить запуски порівнянними."}}, {"q": {"en": "Day 93: You run the route twice and the Whole route averages differ by 4 ms, though the level did not change. What is the most likely cause?", "uk": "День 93: Ти запускаєш маршрут двічі, і середні Whole route відрізняються на 4 мс, хоча рівень не змінювався. Яка найімовірніша причина?"}, "options": [{"en": "The seed", "uk": "Зерно"}, {"en": "The test conditions: no warm-up run, another program, the editor viewport drawing, or a stat display", "uk": "Умови тесту: немає прогрівального запуску, інша програма, вікно перегляду редактора малює або відображення stat"}, {"en": "HLOD_Town", "uk": "HLOD_Town"}, {"en": "The marks in Sequencer", "uk": "Позначки в Sequencer"}], "answer": 1, "explain": {"en": "When the level is the same, the conditions changed; perf_checklist.md lists them.", "uk": "Коли рівень той самий, змінилися умови; perf_checklist.md перелічує їх."}}, {"q": {"en": "Day 94: Why is UseWeathering a Static Switch Parameter in M_Master?", "uk": "День 94: Чому UseWeathering — це Static Switch Parameter в M_Master?"}, "options": [{"en": "Static switches make textures smaller", "uk": "Static switches роблять текстури меншими"}, {"en": "MPC_World needs it", "uk": "Цього потребує MPC_World"}, {"en": "So it can change every frame", "uk": "Щоб він міг змінюватися кожен кадр"}, {"en": "So old instances keep their look and pay nothing until you tick it", "uk": "Щоб старі інстанси зберігали свій вигляд і нічого не коштували, поки ти його не позначиш"}], "answer": 3, "explain": {"en": "A switch that is off removes those nodes from the instance's shader, so old materials are unchanged and cost the same.", "uk": "Вимкнений перемикач прибирає ці вузли із шейдера інстанса, тож старі матеріали не змінюються і коштують стільки ж."}}, {"q": {"en": "Day 95: Your after run is 0.3 ms faster than your before run, one run each. What can you honestly say?", "uk": "День 95: Твій запуск «після» швидший за запуск «до» на 0.3 мс, по одному запуску. Що ти можеш чесно сказати?"}, "options": [{"en": "The change saved 0.3 ms for sure", "uk": "Зміна напевно зекономила 0.3 мс"}, {"en": "The difference is within the normal spread between runs; repeated runs are needed to prove it", "uk": "Різниця в межах звичайного розкиду між запусками; щоб це довести, потрібні повторювані запуски"}, {"en": "The change made things worse", "uk": "Зміна погіршила ситуацію"}, {"en": "The budget is met", "uk": "Бюджет досягнуто"}], "answer": 1, "explain": {"en": "Runs vary a little even when nothing changes; only a difference bigger than that spread proves the change.", "uk": "Запуски трохи відрізняються, навіть коли нічого не змінюється; лише різниця, більша за цей розкид, доводить зміну."}}], "weekInfo": null, "morning": {"sofar": {"en": "This week you built a performance toolkit: a baseline, perf_report.py, a camera route that records itself with a checklist, and weathering materials.", "uk": "Цього тижня в тебе з'явився набір інструментів продуктивності: базова лінія, perf_report.py, маршрут камери, що записує себе, з контрольним списком, і матеріали зі старінням."}, "today": {"en": "You use it all to write one real performance report: before, cause, one change, after, and proof against the budget.", "uk": "Ти використовуєш усе це, щоб написати один справжній звіт про продуктивність: до, причина, одна зміна, після та доказ за бюджетом."}, "cheer": {"en": "Whatever your PC, an honest report is a good report; the numbers are information about the world, not a mark on you.", "uk": "Який би не був твій ПК, чесний звіт — це добрий звіт; числа — це інформація про світ, а не оцінка тобі."}, "quote": {"text": {"en": "Extraordinary claims require extraordinary evidence.", "uk": "Надзвичайні твердження потребують надзвичайних доказів."}, "author": {"en": "Carl Sagan", "uk": "Карл Саган"}, "source": "Cosmos (television series), episode 12, Encyclopaedia Galactica, 1980"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-95-boss-performance-report", "mapHref": "../../COURSE.html", "prevHref": "../Day-94-material-functions-weathering/START-HERE.html", "nextHref": "../Day-96-git-from-zero/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8, Unreal Insights and perf_report.py. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me: when my Blueprint or script fails, ask for the error message or a screenshot of the graph, point to the line or node that is wrong and explain why, then let me fix it myself. Never write the whole tool for me. Keep me moving and make it feel like a game.\n\nToday I build on my own: The after capture, the written report, and Gold's repeated runs and HLOD test.\nIt's part of: perf_report_day95.md: one town quarter, one route, one optimisation, measured before and after with the same checklist and judged against the 60 fps budget (Content/Tools/Day95/L_Day95, a copy of L_Day94 with LS_PerfRoute and BP_PerfFlight; reports in IslandCourse/Saved/TechTools, copied with the pictures into today's Work folder.).\n\nSpec:\n- boss_day95.md first: the plan with times, the tiers, and the three suspects from perf_baseline.md with the setting each one changes.\n- Before: perf_checklist.md ticked, one warm-up run, then a kept run; perf_before.md from perf_report.py with sections A to D and the worst section named.\n- Diagnosis at the worst section's mark: stat gpu's five biggest lines and one Insights recording with the slowest frame's three biggest timers; one sentence naming the cause.\n- One optimisation, one change only, chosen from the cause: for example Cast Shadow off on the small props in PCG_StreetDresser's spawners; cull distances on props and street trees (as on Day 56); Nanite on the remaining plain kit meshes with set_nanite.py (dry run first); fewer street trees through Tree Chance. The looks checked from V1, V2 and V3 against the before pictures.\n- After: the same checklist and route, perf_after.md, and the change in ms per section.\n- perf_report_day95.md with Test (level, seed, route, settings, PC), Before, Cause, Change, After, Result (the budget: average under 16.6 ms and 95th percentile under 33.3 ms at 1920 x 1080, along the route, for the whole route and each section), Looks (three before-and-after pairs) and Next. If your PC is below the course minimum, say so plainly, keep 1920 x 1080 and Engine Scalability High, judge the change by before and after on this PC, and name the setting you would lower to reach the budget.\n- Bronze, Silver and Gold as listed below; nothing floating and Check Town at 0 problems after the change.\n\nMy checklist:\n1. Start a 4-hour timer. Write boss_day95.md: tiers, minutes per step, and the three suspects from perf_baseline.md with the setting each one changes. Check: every step has a time and the total is under 4 hours. (from lesson 1)\n2. Save L_Day94 as L_Day95 in Content/Tools/Day95, check BP_PerfFlight's Route and the seed, and take before_V1.png, before_V2.png and before_V3.png from the three bookmarks. Check: three pictures in today's Work folder and the level saved. (from lesson 1)\n3. Before: tick perf_checklist.md, make a warm-up run, then a kept run, and save the report as perf_before.md. Check: four sections and a Whole route row, and the worst section named in boss_day95.md. (from day 93, lesson 3)\n4. Diagnose: go to the worst section's mark (bookmark 4) and read stat gpu's five biggest lines; then record an Insights trace of one BP_PerfFlight run and click the tallest bar in the worst section's quarter, as in lesson 2. Check: insights_before.png with the slowest frame's three biggest timers, and one sentence naming the cause. (from lesson 2)\n5. Pick one change that matches the cause, write it in one line, and predict which number falls and by roughly how much. Check: one change only, with a prediction in ms. (from lesson 2)\n6. Make the change (for Nanite, set_nanite.py's dry run first, then Yes; for spawner settings, Generate the dresser again), then click Check Town. Check: the change shows in its settings and Check Town reports 0 problems. (from lesson 3)\n7. Looks: take after_V1.png, after_V2.png and after_V3.png from the same bookmarks and compare each pair side by side. Check: you cannot see the change at V1 and V2, and any difference at V3 is acceptable; if not, soften the change (a longer cull distance, for example) and check again. (from lesson 3)\n8. After: the same checklist, a warm-up run and a kept run; save the report as perf_after.md. Check: the worst section moved by about the amount you predicted, or you can say why not. (from day 93, lesson 3)\n9. Bronze check: write perf_report_day95.md with Test, Before, Cause, Change, After, Result, Looks and Next, honest about your PC. Check: every claim in it has a number from a report or a picture behind it. (from lesson 4)\n10. Silver check: compare every row of perf_after.md with the budget, and put the three picture pairs side by side as looks_day95.png. Check: average under 16.6 ms and 95th percentile under 33.3 ms in every row, and the pairs look the same. (from lesson 4)\n11. Gold: three kept runs before (undo the change, warm up, three runs) and three after, with the smallest and largest Whole route average of each set; then make the same change in L_Day93_WP, drag LS_PerfRoute into it (Auto Play unticked) and place BP_PerfFlight with Route set to it, Build HLODs and run the route there. Check: the two ranges do not overlap, and the HLOD level's result is in the report. (from lesson 4)\n12. Self-review perf_report_day95.md with the tutor: is the test fair, is the cause shown, is the change isolated, could a stranger repeat it? Fix the weakest line. Check: the review notes and the fix are in boss_day95.md. (from lesson 4)\n13. Record clip_day95.mp4 (60 seconds): BP_PerfFlight flying the route after the change, then the before and after tables. Click Copy the day report, paste it into a new tutor chat and save its answer as summary.md. Check: the clip and summary.md are in today's Work folder. (from lesson 1)\n\nToday is a BOSS build: help me keep time against the tiers below. Tiers:\n- Bronze: perf_before.md, one change, perf_after.md and perf_report_day95.md written honestly with the cause named, inside 4 hours.\n- Silver: Bronze, with the whole route and every section under budget after the change (average under 16.6 ms and 95th percentile under 33.3 ms at 1920 x 1080) and three before-and-after picture pairs that look the same.\n- Gold: Silver, plus three kept runs before and three after with the range of each set, and the same change tested in L_Day93_WP with HLODs built.\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me and tell me which tier I reached.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Misha\nDay 95: Boss: a performance report for your town quarter, before and after. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; boss tier: <bronze / silver / gold / none>; quiz: <score> of 8\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

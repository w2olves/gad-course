<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 95</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

.md: час початку, три підозрювані з perf_baseline.md, кожен із налаштуванням, яке він змінює, і твій прогноз."}, {"en": "Before: perf_checklist.md ticked, one warm-up run, then a kept run; perf_before.md from perf_report.py with sections A to D and the worst section named.", "uk": "«До»: perf_checklist.md відмічено, один прогрівальний запуск, потім збережений. perf_before.md з perf_report.py з відрізками A–D, найгірший відрізок названо."}, {"en": "Diagnosis at the worst section's mark: stat gpu's five biggest lines and one Insights recording with the slowest frame's three biggest timers; one sentence naming the cause.", "uk": "Діагноз на позначці найгіршого відрізка: п'ять найбільших рядків stat gpu і один запис Insights із трьома найбільшими таймерами найповільнішого кадру. Одне речення називає причину."}, {"en": "One optimisation, one change only, chosen from the cause: for example Cast Shadow off on the small props in PCG_StreetDresser's spawners; cull distances on props and street trees (as on Day 56); Nanite on the remaining plain kit meshes with set_nanite.py (dry run first); fewer street trees through Tree Gap. The looks checked from V1, V2 and V3 against the before pictures.", "uk": "Одна оптимізація, лише одна зміна, вибрана за причиною. Наприклад: Cast Shadow вимкнено на дрібних пропсах у спавнерах PCG_StreetDresser; відстані відсікання на пропсах і вуличних деревах (як у День 56); Nanite на решті простих мешів набору через set_nanite.py (спершу пробний запуск); менше вуличних дерев через Tree Gap. Вигляд перевірено з V1, V2 і V3 проти картинок «до»."}, {"en": "After: the same checklist and route, perf_after.md, and the change in ms per section.", "uk": "«Після»: той самий чек-лист і маршрут, perf_after.md і зміна в мс для кожного відрізка."}, {"en": "perf_report_day95.md with Test (level, seed, route, settings, PC), Before, Cause, Change, After, Result (the budget: average under 16.6 ms and 95th percentile under 33.3 ms at 1920 x 1080, along the route, for the whole route and each section), Looks (three before-and-after pairs) and Next. If your PC is below the course minimum, say so plainly, keep 1920 x 1080 and Engine Scalability High, judge the change by before and after on this PC, and name the setting you would lower to reach the budget.", "uk": "perf_report_day95.md з розділами Test (рівень, зерно, маршрут, налаштування, ПК), Before, Cause, Change, After, Result, Looks (три пари «до і після») і Next. Result — це бюджет уздовж маршруту для всього маршруту і кожного відрізка: середнє менше за 16,6 мс і 95-й перцентиль менше за 33,3 мс у 1920 × 1080. Якщо твій ПК слабший за мінімум курсу, скажи це прямо. Лиши 1920 × 1080 і Engine Scalability High, оцінюй зміну «до і після» на цьому ПК і назви налаштування, яке знизиш, щоб вкластися в бюджет."}, {"en": "Bronze, Silver and Gold as listed below; nothing floating and Check Town at 0 problems after the change.", "uk": "Бронза, Срібло і Золото — як у списку нижче. Після зміни ніщо не висить у повітрі, а Check Town показує 0 проблем."}], "piece1": "The before capture, the diagnosis and the change (planned and practised in the micro-lessons)", "piece2": {"en": "The after capture, the written report, and Gold's repeated runs and HLOD test", "uk": "Захоплення «після», письмовий звіт, а для Золота — повторні запуски і тест з HLOD"}, "steps": [{"text": {"en": "Check: the results of today's lessons are there (your three suspects from perf_baseline.md, perf_report_day95.md's Test block, and the diagnosis and change you practised in lessons 1 and 3). Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it. Start the clock: Bronze by hour 2, the full build by about 3.5 hours. Write the start time at the top of boss_day95.md. Check: the start time is written.", "uk": "Перевір, чи є результати сьогоднішніх уроків: три підозрювані з perf_baseline.md, блок Test у perf_report_day95.md, а також діагноз і зміна, відпрацьовані на уроках 1 і 3. Чогось бракує? Пройди зараз кроки «Разом із тьютором» того уроку (близько 25 хвилин): самостійна робота спирається на них. Запусти годинник: Бронза — до 2-ї години, уся самостійна робота — приблизно за 3 години 30 хвилин. Запиши час початку вгорі boss_day95.md. Перевірка: час початку записано."}, "lesson": 2}, {"text": {"en": "Save L_Day94 as L_Day95 in Content/Tools/Day95, check BP_PerfFlight's Route and the seed, and take before_V1.png, before_V2.png and before_V3.png from the three bookmarks. Check: three pictures in today's Work folder and the level saved.", "uk": "Збережи L_Day94 як L_Day95 у Content/Tools/Day95, перевір Route у BP_PerfFlight і зерно. Зроби скриншоти before_V1.png, before_V2.png і before_V3.png з трьох закладок. Перевірка: три картинки в робочій папці дня, рівень збережено."}, "lesson": 2}, {"text": {"en": "Before: tick perf_checklist.md, make a warm-up run, then a kept run, and copy IslandCourse/Saved/TechTools/perf_report.md into today's Work folder as perf_before.md. Check: four sections and a Whole route row, and the worst section named in boss_day95.md.", "uk": "«До»: відміть perf_checklist.md, зроби прогрівальний запуск, потім збережений. Скопіюй IslandCourse/Saved/TechTools/perf_report.md у робочу папку дня як perf_before.md. Перевірка: чотири відрізки і рядок Whole route, а найгірший відрізок названо в boss_day95.md."}, "lesson": "D93.3"}, {"text": {"en": "Diagnose: go to the worst section's mark (bookmark 4) and read stat gpu's five biggest lines; then record an Insights trace of one BP_PerfFlight run and click the tallest bar in the worst section's quarter, as in lesson 1. Check: insights_before.png with the slowest frame's three biggest timers, and one sentence naming the cause.", "uk": "Діагноз: перейди на позначку найгіршого відрізка (закладка 4) і прочитай п'ять найбільших рядків stat gpu. Потім запиши трасування Insights одного запуску BP_PerfFlight і клацни найвищу смужку в чверті найгіршого відрізка, як на уроці 1. Перевірка: insights_before.png із трьома найбільшими таймерами найповільнішого кадру й одне речення, що називає причину."}, "lesson": 1}, {"text": {"en": "Pick one change that matches the cause, write it in one line, and predict which number falls and by roughly how much. Then make the change (for Nanite, set_nanite.py's dry run first, then Yes; for spawner settings, Generate the dresser again), then click Check Town. Check: the change shows in its settings and Check Town reports 0 problems.", "uk": "Вибери одну зміну, яка відповідає причині, запиши її одним рядком і передбач, яке число впаде і приблизно на скільки. Потім зроби зміну (для Nanite — спершу пробний запуск set_nanite.py, потім Yes; для налаштувань спавнера — знову Generate на розставлянні) і клацни Check Town. Перевірка: зміну видно в налаштуваннях, а Check Town показує 0 проблем."}, "lesson": 3}, {"text": {"en": "Looks: take after_V1.png, after_V2.png and after_V3.png from the same bookmarks and compare each pair side by side. Check: you cannot see the change at V1 and V2, and any difference at V3 is acceptable; if not, soften the change (a longer cull distance, for example) and check again.", "uk": "Вигляд: зроби скриншоти after_V1.png, after_V2.png і after_V3.png з тих самих закладок і порівняй кожну пару поруч. Перевірка: у V1 і V2 зміни не видно, а будь-яка різниця у V3 прийнятна. Якщо ні, пом'якши зміну (наприклад, довша відстань відсікання) і перевір знову."}, "lesson": 3}, {"text": {"en": "After: the same checklist, a warm-up run and a kept run; copy IslandCourse/Saved/TechTools/perf_report.md into today's Work folder as perf_after.md. Check: the worst section moved by about the amount you predicted, or you can say why not.", "uk": "«Після»: той самий чек-лист, прогрівальний запуск і збережений. Скопіюй IslandCourse/Saved/TechTools/perf_report.md у робочу папку дня як perf_after.md. Перевірка: найгірший відрізок змінився приблизно на передбачену величину, або ти можеш пояснити, чому ні."}, "lesson": "D93.3"}, {"text": {"en": "Bronze check: write perf_report_day95.md with Test, Before, Cause, Change, After, Result, Looks and Next, honest about your PC. Check: every claim in it has a number from a report or a picture behind it.", "uk": "Бронза: напиши perf_report_day95.md з розділами Test, Before, Cause, Change, After, Result, Looks і Next, чесно щодо свого ПК. Перевірка: за кожним твердженням стоїть число зі звіту або картинка."}, "lesson": 4}, {"text": {"en": "Silver check: compare every row of perf_after.md with the budget, and put the three picture pairs side by side as looks_day95.png. Check: average under 16.6 ms and 95th percentile under 33.3 ms in every row, and the pairs look the same.", "uk": "Срібло: порівняй кожен рядок perf_after.md з бюджетом і склади три пари картинок поруч як looks_day95.png. Перевірка: у кожному рядку середнє менше за 16,6 мс і 95-й перцентиль менше за 33,3 мс, а пари виглядають однаково."}, "lesson": 4}, {"text": {"en": "Gold: three kept runs before (undo the change, warm up, three runs) and three after, with the smallest and largest Whole route average of each set; then make the same change in L_Day93_WP (Day 93's Gold; if you skipped it, build it first), drag LS_PerfRoute into it (Auto Play unticked) and place BP_PerfFlight with Route set to it, Build HLODs and run the route there. Check: the two ranges do not overlap, and the HLOD level's result is in the report.", "uk": "Золото: три збережені запуски «до» (скасуй зміну, прогрівальний запуск, три запуски) і три «після», з найменшим і найбільшим середнім Whole route кожного набору. Потім зроби ту саму зміну в L_Day93_WP (Золото Дня 93; якщо його пропущено, спершу збудуй). Перетягни туди LS_PerfRoute (Auto Play знято), постав BP_PerfFlight з Route на нього, клацни Build HLODs і пролети маршрут там. Перевірка: два діапазони не перекриваються, а результат рівня з HLOD є у звіті."}, "lesson": 4}, {"text": {"en": "Record clip_day95.mp4 (BP_PerfFlight flying the route after the change, then the before and after tables; 60 seconds, under 50 MB) with OBS Studio (Display Capture) or Win+Shift+R (Snipping Tool, select the whole screen). Back up: zip Content/Tools and Content/Python to a folder outside the project. Check: the clip is in today's Work folder and under 50 MB, and the zip is over 1 MB.", "uk": "Запиши clip_day95.mp4 (BP_PerfFlight пролітає маршрут після зміни, потім таблиці «до» і «після»; 60 секунд, менше за 50 МБ) в OBS Studio (Display Capture) або Win+Shift+R (Snipping Tool, виділи весь екран). Резервна копія: запакуй Content/Tools і Content/Python у zip у папку поза проєктом. Перевірка: кліп у робочій папці дня, менший за 50 МБ, а zip більший за 1 МБ."}, "lesson": 2}, {"text": {"en": "Click Copy the day report, paste it into a new tutor chat, answer its questions and save its answer as summary.md in today's Work folder. Drag the files listed under What you hand in into today's hand-in folder (the button on this page); no need to hand in the Unreal project or level folders (they're very big). Check: the hand-in folder lists all the files, each over 1 KB.", "uk": "Клацни «Копіювати звіт дня», встав у новий чат із тьютором, дай відповіді на його питання і збережи його відповідь як summary.md у робочій папці дня. Перетягни файли з розділу «Що здати» в папку здачі (кнопка на цій сторінці). Папку проєкту чи рівня Unreal здавати не треба: вона дуже велика. Перевірка: у папці здачі всі файли, кожен більший за 1 КБ."}, "lesson": 4}], "boss": [{"en": "Bronze: perf_before.md, one change, perf_after.md and perf_report_day95.md written honestly with the cause named, inside 2 hours.", "uk": "Бронза: perf_before.md, одна зміна, perf_after.md і чесно написаний perf_report_day95.md з названою причиною — за 2 години."}, {"en": "Silver: Bronze, with the whole route and every section under budget after the change (average under 16.6 ms and 95th percentile under 33.3 ms at 1920 x 1080) and three before-and-after picture pairs that look the same.", "uk": "Срібло: Бронза, а після зміни весь маршрут і кожен відрізок у межах бюджету (середнє менше за 16,6 мс і 95-й перцентиль менше за 33,3 мс у 1920 × 1080), і три пари картинок «до і після» виглядають однаково."}, {"en": "Gold: Silver, plus three kept runs before and three after with the range of each set, and the same change tested in L_Day93_WP with HLODs built.", "uk": "Золото: Срібло, плюс три збережені запуски «до» і три «після» з діапазоном кожного набору, і та сама зміна, перевірена в L_Day93_WP зі збудованими HLOD."}], "assets": ["techart/standards-sheet.md", "techart/tool-review-checklist.md"], "next": {"en": "perf_report_day95.md is the model for your district's validation on Day 107, and its before-and-after shots return in the demo on Day 109.", "uk": "perf_report_day95.md — зразок для перевірки твого району в День 107, а його кадри «до і після» повертаються в демо в День 109."}}, "lessons": [{"title": {"en": "From a slow section to a cause", "uk": "Від повільного відрізка до причини"}, "minutes": 30, "goals": [{"en": "Go from the worst row in perf_before.md to the place on the route, using the section marks.", "uk": "Переходити від найгіршого рядка perf_before.md до місця на маршруті за позначками ділянок."}, {"en": "Confirm the cause with stat gpu and an Insights trace at that place.", "uk": "Підтверджувати причину через stat gpu і трасування Insights у цьому місці."}, {"en": "Choose one change that matches the cause, and predict its saving.", "uk": "Вибирати одну зміну, що відповідає причині, і передбачати економію."}], "doalong": [{"en": "In LS_PerfRoute put the playhead at the worst section's mark and pilot CAM_PerfRoute: that is the view the capture saw. Save a bookmark there with Ctrl+4. You see the slow view.", "uk": "У LS_PerfRoute постав курсор відтворення на позначку найгіршого відрізка й керуй камерою CAM_PerfRoute (Pilot): це той вид, який бачило захоплення. Збережи там закладку через Ctrl+4. Має вийти: повільний вид перед тобою."}, {"en": "Type stat gpu and write its five biggest lines. You see the job that costs most, for example ShadowDepths (shadows), BasePass (drawing surfaces), Lumen or Translucency.", "uk": "Введи stat gpu і запиши п'ять найбільших рядків. Має вийти: видно завдання, що коштує найбільше, наприклад ShadowDepths (тіні), BasePass (малювання поверхонь), Lumen або Translucency."}, {"en": "Record the route itself (BP_PerfFlight takes over Play in this level, so you cannot fly by hand): click Start Trace, press Play and let the route run; when Play closes, click Stop Trace.", "uk": "Запиши сам маршрут: у цьому рівні BP_PerfFlight перебирає Play на себе, тож вручну не полетиш. Клацни Start Trace, запусти Play і дай маршруту пройти. Коли Play закриється, клацни Stop Trace."}, {"en": "Open the trace: the bars run in time order and the route fills the stretch after the 3-second wait, a quarter per section, so click the tallest bar inside the worst section's quarter. You see the same job near the top of the Timers list, or another one that tells you more.", "uk": "Відкрий трасування. Смужки йдуть за часом, а маршрут займає проміжок після 3-секундного очікування, по чверті на відрізок. Тож клацни найвищу смужку в чверті найгіршого відрізка. Має вийти: те саме завдання вгорі списку Timers або інше, що каже більше."}, {"en": "Match the cause to a change with the tutor: shadows from many small props (Cast Shadow off on them); too many far instances (cull distances); meshes without Nanite (set_nanite.py); leaf overdraw (fewer street trees). Write which number should fall, and by roughly how much. You see one change chosen for a reason.", "uk": "Разом із тьютором підбери до причини зміну: тіні від багатьох дрібних пропсів (вимкнути на них Cast Shadow); забагато далеких інстансів (відстані відсікання); меші без Nanite (set_nanite.py); overdraw листя (менше вуличних дерев). Запиши, яке число має впасти і приблизно на скільки. Має вийти: одна зміна, вибрана з причиною."}], "play": {"en": "Cause and cure: the tutor gives me five stat gpu tops (ShadowDepths 6 ms; BasePass 5 ms with 4,000 draw calls; Translucency 3 ms; Lumen 7 ms; every GPU line small but the frame still 25 ms with Game at 24 ms). For each I name the likely cause in a generated town and one change to test.", "uk": "Причина і ліки: тьютор дає мені п'ять наборів верхніх рядків stat gpu (ShadowDepths 6 мс; BasePass 5 мс при 4 000 draw calls; Translucency 3 мс; Lumen 7 мс; усі рядки GPU малі, але кадр 25 мс, а Game — 24 мс). Для кожної я називаю ймовірну причину в згенерованому місті й одну зміну для перевірки."}, "video": {"search": "unreal engine 5 stat gpu shadowdepths basepass optimization"}, "prompt": "You are my tutor for one 30-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Від повільного відрізка до причини (Day 95, lesson 1 of 4). Today's build: perf_report_day95.md: один міський мікрорайон, один маршрут, одна оптимізація, виміряна до і після за тим самим чек-листом і оцінена за бюджетом 60 кадрів/с.\nWhat I already know: День 93: LS_PerfRoute, BP_PerfFlight і perf_checklist.md; День 92: perf_report.py; День 91: perf_baseline.md і три підозрювані за рангом; День 94: матеріали зі зношеністю на кожному будинку; Дні 72 і 85: set_nanite.py і налаштування спавнерів розставляння.\n\nBy the end of this lesson I can:\n1. Переходити від найгіршого рядка perf_before.md до місця на маршруті за позначками ділянок.\n2. Підтверджувати причину через stat gpu і трасування Insights у цьому місці.\n3. Вибирати одну зміну, що відповідає причині, і передбачати економію.\n\nRun the lesson in this order; it should take 30 to 40 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: За цей тиждень у тебе з'явився набір інструментів продуктивності: базова лінія, perf_report.py, маршрут камери, що сам себе записує, з чек-листом, і матеріали зі зношеністю. Today: Ти використовуєш усе це, щоб написати один справжній звіт про продуктивність: «до», причина, одна зміна, «після» і доказ за бюджетом. One encouraging line: Хоч який у тебе ПК, чесний звіт — добрий звіт. Числа — це інформація про світ, а не оцінка тобі.); 2 lines on why today matters and where it comes back, in plain words (from this: Твердження про продуктивність без чисел — лише думка. Короткий звіт, який показує тест, причину, зміну і результат до і після та чесно називає залізо, — саме такому вірять ліди й продюсери. Це також одна з найсильніших робіт у портфоліо технічного художника. Сьогодні ти пишеш такий звіт від початку до кінця. It comes back: perf_report_day95.md — зразок для перевірки твого району в День 107, а його кадри «до і після» повертаються в демо в День 109.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-95-boss-performa "}, "prompt": "You are my tutor for one 20-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Пишемо результат і самоперевірку (міні-урок) (Day 95, lesson 4 of 4). Today's build: perf_report_day95.md: один міський мікрорайон, один маршрут, одна оптимізація, виміряна до і після за тим самим чек-листом і оцінена за бюджетом 60 кадрів/с.\nWhat I already know: День 93: LS_PerfRoute, BP_PerfFlight і perf_checklist.md; День 92: perf_report.py; День 91: perf_baseline.md і три підозрювані за рангом; День 94: матеріали зі зношеністю на кожному будинку; Дні 72 і 85: set_nanite.py і налаштування спавнерів розставляння.\nEarlier today I already did: lesson 1 (Від повільного відрізка до причини); lesson 2 (План боса: звіт, якому вірять (міні-урок)); lesson 3 (Одна зміна, а вигляд не рухається). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Записувати результат за бюджетом, відрізок за відрізком, не ховаючи рядо ля зміни, потім обидві таблиці; 60 секунд, менше за 50 МБ) (День боса)"}], "goal": {"en": "By the end of today you have perf_report_day95.md: your town quarter flown along LS_PerfRoute before and after one measured optimisation, with perf_report.py's tables, the cause found with stat gpu and Insights, and the result judged against the budget (average under 16.6 ms and 95th percentile under 33.3 ms at 1920 x 1080), honest about your PC.", "uk": "До кінця дня в тебе є perf_report_day95.md. Твій міський мікрорайон пролітають маршрутом LS_PerfRoute до і після однієї виміряної оптимізації. У звіті — таблиці perf_report.py, причина, знайдена через stat gpu та Insights, і результат за бюджетом (середнє менше за 16,6 мс і 95-й перцентиль менше за 33,3 мс у 1920 × 1080). І все чесно щодо твого ПК."}, "uses": [{"en": "Day 93: LS_PerfRoute, BP_PerfFlight and perf_checklist.md", "uk": "День 93: LS_PerfRoute, BP_PerfFlight і perf_checklist.md"}, {"en": "Day 92: perf_report.py", "uk": "День 92: perf_report.py"}, {"en": "Day 91: perf_baseline.md and its three ranked suspects", "uk": "День 91: perf_baseline.md і три підозрювані за рангом"}, {"en": "Day 94: the weathered materials on every house", "uk": "День 94: матеріали зі зношеністю на кожному будинку"}, {"en": "Days 72 and 85: set_nanite.py and the dresser's spawner settings", "uk": "Дні 72 і 85: set_nanite.py і налаштування спавнерів розставляння"}], "quiz": [{"q": {"en": "Day 91: stat unit shows Game 3 ms, Draw 4 ms and GPU 19 ms. Where do you look first?", "uk": "День 91: stat unit показує Game 3 мс, Draw 4 мс і GPU 19 мс. Куди дивитися першим?"}, "options": [{"en": "The Blueprint logic", "uk": "На логіку Blueprint"}, {"en": "The draw-call count only", "uk": "Лише на кількість draw calls"}, {"en": "GPU costs such as shadows, overdraw and Lumen", "uk": "На витрати GPU: тіні, overdraw і Lumen"}, {"en": "Nowhere: the frame is fine", "uk": "Нікуди: з кадром усе гаразд"}], "answer": 2, "explain": {"en": "The graphics card is the slowest part, so the frame waits for it.", "uk": "Відеокарта — найповільніша частина, тож кадр чекає на неї."}}, {"q": {"en": "Day 91: You hide the buildings and the GPU time drops by 6 ms from the same bookmark. What does that tell you?", "uk": "День 91: ти ховаєш будинки, і з тієї самої закладки час GPU падає на 6 мс. Про що це каже?"}, "options": [{"en": "The buildings cost about 6 ms from this view, so they are a suspect", "uk": "З цього виду будинки коштують близько 6 мс, тож вони — підозрювані"}, {"en": "The buildings are broken", "uk": "Будинки зламані"}, {"en": "Nothing: hiding always saves time", "uk": "Ні про що: ховання завжди економить час"}, {"en": "The seed is wrong", "uk": "Зерно неправильне"}], "answer": 0, "explain": {"en": "Taking one thing away at a time measures its cost; that is what the cost table is for.", "uk": "Якщо прибирати по одній речі, вимірюєш її вартість. Для цього й потрібна таблиця вартості."}}, {"q": {"en": "Day 92: One frame in ten takes 50 ms and the rest take 12 ms. Which number shows the problem?", "uk": "День 92: кожен десятий кадр триває 50 мс, а решта — 12 мс. Яке число показує проблему?"}, "options": [{"en": "The average, which is over budget", "uk": "Середнє, бо воно за бюджетом"}, {"en": "The 95th percentile, which is 50 ms, over 33.3 ms", "uk": "95-й перцентиль: він 50 мс, більше за 33,3 мс"}, {"en": "Neither: both pass", "uk": "Жодне: обидва проходять"}, {"en": "The number of frames", "uk": "Кількість кадрів"}], "answer": 1, "explain": {"en": "The average is about 15.8 ms and passes, but 10 frames in 100 take 50 ms, so the 95th percentile fails.", "uk": "Середнє — близько 15,8 мс, і воно проходить. Але 10 кадрів зі 100 тривають 50 мс, тож 95-й перцентиль не проходить."}}, {"q": {"en": "Day 92: Why does read_frames use try and except?", "uk": "День 92: навіщо read_frames використовує try і except?"}, "options": [{"en": "To skip the text rows at the end of a capture, which are not frames", "uk": "Щоб пропустити текстові рядки в кінці захоплення, які не є кадрами"}, {"en": "To make reading faster", "uk": "Щоб читати швидше"}, {"en": "To hide every possible error", "uk": "Щоб сховати будь-яку можливу помилку"}, {"en": "To sort the frames", "uk": "Щоб відсортувати кадри"}], "answer": 0, "explain": {"en": "Only rows that fail to become numbers are skipped; other mistakes still show.", "uk": "Пропускаються лише рядки, які не вдається перетворити на числа. Інші помилки все одно видно."}}, {"q": {"en": "Day 93: Why does BP_PerfFlight wait Start Delay seconds before csvprofile start?", "uk": "День 93: навіщо BP_PerfFlight чекає Start Delay секунд перед csvprofile start?"}, "options": [{"en": "Because Sequencer needs it", "uk": "Цього вимагає Sequencer"}, {"en": "To make the capture longer", "uk": "Щоб захоплення було довшим"}, {"en": "So the level settles before recording starts", "uk": "Щоб рівень усталився до початку запису"}, {"en": "Every console command needs a Delay", "uk": "Кожна консольна команда потребує Delay"}], "answer": 2, "explain": {"en": "The first moments of Play load and settle; recording after them keeps runs comparable.", "uk": "У перші миті Play усе завантажується й усталюється. Якщо записувати після них, запуски можна порівнювати."}}, {"q": {"en": "Day 93: You run the route twice and the Whole route averages differ by 4 ms, though the level did not change. What is the most likely cause?", "uk": "День 93: ти двічі проходиш маршрут, і середні Whole route відрізняються на 4 мс, хоча рівень не змінювався. Яка причина найімовірніша?"}, "options": [{"en": "The seed", "uk": "Зерно"}, {"en": "The test conditions: no warm-up run, another program, the editor viewport drawing, or a stat display", "uk": "Умови тесту: немає прогрівального запуску, працює інша програма, малює в'юпорт редактора або на екрані показник stat"}, {"en": "HLOD_Town", "uk": "HLOD_Town"}, {"en": "The marks in Sequencer", "uk": "Позначки в Sequencer"}], "answer": 1, "explain": {"en": "When the level is the same, the conditions changed; perf_checklist.md lists them.", "uk": "Якщо рівень той самий, змінилися умови. perf_checklist.md їх перелічує."}}, {"q": {"en": "Day 94: Why is UseWeathering a Static Switch Parameter in M_Master?", "uk": "День 94: чому UseWeathering у M_Master — це Static Switch Parameter?"}, "options": [{"en": "Static switches make textures smaller", "uk": "Статичні перемикачі зменшують текстури"}, {"en": "MPC_World needs it", "uk": "Цього вимагає MPC_World"}, {"en": "So it can change every frame", "uk": "Щоб він міг змінюватися щокадру"}, {"en": "So old instances keep their look and pay nothing until you tick it", "uk": "Щоб старі інстанси зберегли вигляд і нічого не платили, доки ти його не ввімкнеш"}], "answer": 3, "explain": {"en": "A switch that is off removes those nodes from the instance's shader, so old materials are unchanged and cost the same.", "uk": "Вимкнений перемикач прибирає ці вузли із шейдера інстансу, тож старі матеріали не змінюються і коштують стільки ж."}}, {"q": {"en": "Day 95: Your after run is 0.3 ms faster than your before run, one run each. What can you honestly say?", "uk": "День 95: запуск «після» на 0,3 мс швидший за запуск «до», по одному запуску. Що можна чесно сказати?"}, "options": [{"en": "The change saved 0.3 ms for sure", "uk": "Зміна точно зекономила 0,3 мс"}, {"en": "The difference is within the normal spread between runs; repeated runs are needed to prove it", "uk": "Різниця в межах звичного розкиду між запусками; щоб це довести, потрібні повторні запуски"}, {"en": "The change made things worse", "uk": "Зміна все погіршила"}, {"en": "The budget is met", "uk": "Бюджет виконано"}], "answer": 1, "explain": {"en": "Runs vary a little even when nothing changes; only a difference bigger than that spread proves the change.", "uk": "Запуски трохи різняться, навіть коли нічого не змінюється. Зміну доводить лише різниця, більша за цей розкид."}}], "weekInfo": null, "morning": {"sofar": {"en": "This week you built a performance toolkit: a baseline, perf_report.py, a camera route that records itself with a checklist, and weathering materials.", "uk": "За цей тиждень у тебе з'явився набір інструментів продуктивності: базова лінія, perf_report.py, маршрут камери, що сам себе записує, з чек-листом, і матеріали зі зношеністю."}, "today": {"en": "You use it all to write one real performance report: before, cause, one change, after, and proof against the budget.", "uk": "Ти використовуєш усе це, щоб написати один справжній звіт про продуктивність: «до», причина, одна зміна, «після» і доказ за бюджетом."}, "cheer": {"en": "Whatever your PC, an honest report is a good report; the numbers are information about the world, not a mark on you.", "uk": "Хоч який у тебе ПК, чесний звіт — добрий звіт. Числа — це інформація про світ, а не оцінка тобі."}, "quote": {"text": {"en": "Extraordinary claims require extraordinary evidence.", "uk": "Надзвичайні твердження потребують надзвичайних доказів."}, "author": {"en": "Carl Sagan", "uk": "Карл Саган"}, "source": "Cosmos (television series), episode 12, Encyclopaedia Galactica, 1980"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-95-boss-performance-report", "mapHref": "../../COURSE.html", "prevHref": "../Day-94-material-functions-weathering/START-HERE.html", "nextHref": "../Day-96-git-from-zero/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8, Unreal Insights and perf_report.py. I am a beginner on Day 95. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me: when my Blueprint or script fails, ask for the error message or a screenshot of the graph, point to the line or node that is wrong and explain why, then let me fix it myself. Never write the whole tool for me.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: Захоплення «після», письмовий звіт, а для Золота — повторні запуски і тест з HLOD.\nIt's part of: perf_report_day95.md: один міський мікрорайон, один маршрут, одна оптимізація, виміряна до і після за тим самим чек-листом і оцінена за бюджетом 60 кадрів/с (Content/Tools/Day95/L_Day95 — копія L_Day94 з LS_PerfRoute і BP_PerfFlight. Звіти — в IslandCourse/Saved/TechTools; їх разом із картинками копіюєш у робочу папку дня.).\nWhy it matters: Твердження про продуктивність без чисел — лише думка. Короткий звіт, який показує тест, причину, зміну і результат до і після та чесно називає залізо, — саме такому вірять ліди й продюсери. Це також одна з найсильніших робіт у портфоліо технічного художника. Сьогодні ти пишеш такий звіт від початку до кінця. It comes back: perf_report_day95.md — зразок для перевірки твого району в День 107, а його кадри «до і після» повертаються в демо в День 109.\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-95-boss-performance-report (on the drive I chose on Day 0).\nWhat I already know: День 93: LS_PerfRoute, BP_PerfFlight і perf_checklist.md; День 92: perf_report.py; День 91: perf_baseline.md і три підозрювані за рангом; День 94: матеріали зі зношеністю на кожному будинку; Дні 72 і 85: set_nanite.py і налаштування спавнерів розставляння; today's lessons: Від повільного відрізка до причини; План боса: звіт, якому вірять (міні-урок); Одна зміна, а вигляд не рухається; Пишемо результат і самоперевірку (міні-урок). Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- boss_day95.md: час початку, три підозрювані з perf_baseline.md, кожен із налаштуванням, яке він змінює, і твій прогноз.\n- «До»: perf_checklist.md відмічено, один прогрівальний запуск, потім збережений. perf_before.md з perf_report.py з відрізками A–D, найгірший відрізок названо.\n- Діагноз на позначці найгіршого відрізка: п'ять найбільших рядків stat gpu і один запис Insights із трьома найбільшими таймерами найповільнішого кадру. Одне речення називає причину.\n- Одна оптимізація, лише одна зміна, вибрана за причиною. Наприклад: Cast Shadow вимкнено на дрібних пропсах у спавнерах PCG_StreetDresser; відстані відсікання на пропсах і вуличних деревах (як у День 56); Nanite на решті простих мешів набору через set_nanite.py (спершу пробний запуск); менше вуличних дерев через Tree Gap. Вигляд перевірено з V1, V2 і V3 проти картинок «до».\n- «Після»: той самий чек-лист і маршрут, perf_after.md і зміна в мс для кожного відрізка.\n- perf_report_day95.md з розділами Test (рівень, зерно, маршрут, налаштування, ПК), Before, Cause, Change, After, Result, Looks (три пари «до і після») і Next. Result — це бюджет уздовж маршруту для всього маршруту і кожного відрізка: середнє менше за 16,6 мс і 95-й перцентиль менше за 33,3 мс у 1920 × 1080. Якщо твій ПК слабший за мінімум курсу, скажи це прямо. Лиши 1920 × 1080 і Engine Scalability High, оцінюй зміну «до і після» на цьому ПК і назви налаштування, яке знизиш, щоб вкластися в бюджет.\n- Бронза, Срібло і Золото — як у списку нижче. Після зміни ніщо не висить у повітрі, а Check Town показує 0 проблем.\n\nMy checklist (the same numbers show on my course page):\n1. Перевір, чи є результати сьогоднішніх уроків: три підозрювані з perf_baseline.md, блок Test у perf_report_day95.md, а також діагноз і зміна, відпрацьовані на уроках 1 і 3. Чогось бракує? Пройди зараз кроки «Разом із тьютором» того уроку (близько 25 хвилин): самостійна робота спирається на них. Запусти годинник: Бронза — до 2-ї години, уся самостійна робота — приблизно за 3 години 30 хвилин. Запиши час початку вгорі boss_day95.md. Перевірка: час початку записано. (from lesson 2)\n2. Збережи L_Day94 як L_Day95 у Content/Tools/Day95, перевір Route у BP_PerfFlight і зерно. Зроби скриншоти before_V1.png, before_V2.png і before_V3.png з трьох закладок. Перевірка: три картинки в робочій папці дня, рівень збережено. (from lesson 2)\n3. «До»: відміть perf_checklist.md, зроби прогрівальний запуск, потім збережений. Скопіюй IslandCourse/Saved/TechTools/perf_report.md у робочу папку дня як perf_before.md. Перевірка: чотири відрізки і рядок Whole route, а найгірший відрізок названо в boss_day95.md. (from day 93, lesson 3)\n4. Діагноз: перейди на позначку найгіршого відрізка (закладка 4) і прочитай п'ять найбільших рядків stat gpu. Потім запиши трасування Insights одного запуску BP_PerfFlight і клацни найвищу смужку в чверті найгіршого відрізка, як на уроці 1. Перевірка: insights_before.png із трьома найбільшими таймерами найповільнішого кадру й одне речення, що називає причину. (from lesson 1)\n5. Вибери одну зміну, яка відповідає причині, запиши її одним рядком і передбач, яке число впаде і приблизно на скільки. Потім зроби зміну (для Nanite — спершу пробний запуск set_nanite.py, потім Yes; для налаштувань спавнера — знову Generate на розставлянні) і клацни Check Town. Перевірка: зміну видно в налаштуваннях, а Check Town показує 0 проблем. (from lesson 3)\n6. Вигляд: зроби скриншоти after_V1.png, after_V2.png і after_V3.png з тих самих закладок і порівняй кожну пару поруч. Перевірка: у V1 і V2 зміни не видно, а будь-яка різниця у V3 прийнятна. Якщо ні, пом'якши зміну (наприклад, довша відстань відсікання) і перевір знову. (from lesson 3)\n7. «Після»: той самий чек-лист, прогрівальний запуск і збережений. Скопіюй IslandCourse/Saved/TechTools/perf_report.md у робочу папку дня як perf_after.md. Перевірка: найгірший відрізок змінився приблизно на передбачену величину, або ти можеш пояснити, чому ні. (from day 93, lesson 3)\n8. Бронза: напиши perf_report_day95.md з розділами Test, Before, Cause, Change, After, Result, Looks і Next, чесно щодо свого ПК. Перевірка: за кожним твердженням стоїть число зі звіту або картинка. (from lesson 4)\n9. Срібло: порівняй кожен рядок perf_after.md з бюджетом і склади три пари картинок поруч як looks_day95.png. Перевірка: у кожному рядку середнє менше за 16,6 мс і 95-й перцентиль менше за 33,3 мс, а пари виглядають однаково. (from lesson 4)\n10. Золото: три збережені запуски «до» (скасуй зміну, прогрівальний запуск, три запуски) і три «після», з найменшим і найбільшим середнім Whole route кожного набору. Потім зроби ту саму зміну в L_Day93_WP (Золото Дня 93; якщо його пропущено, спершу збудуй). Перетягни туди LS_PerfRoute (Auto Play знято), постав BP_PerfFlight з Route на нього, клацни Build HLODs і пролети маршрут там. Перевірка: два діапазони не перекриваються, а результат рівня з HLOD є у звіті. (from lesson 4)\n11. Запиши clip_day95.mp4 (BP_PerfFlight пролітає маршрут після зміни, потім таблиці «до» і «після»; 60 секунд, менше за 50 МБ) в OBS Studio (Display Capture) або Win+Shift+R (Snipping Tool, виділи весь екран). Резервна копія: запакуй Content/Tools і Content/Python у zip у папку поза проєктом. Перевірка: кліп у робочій папці дня, менший за 50 МБ, а zip більший за 1 МБ. (from lesson 2)\n12. Клацни «Копіювати звіт дня», встав у новий чат із тьютором, дай відповіді на його питання і збережи його відповідь як summary.md у робочій папці дня. Перетягни файли з розділу «Що здати» в папку здачі (кнопка на цій сторінці). Папку проєкту чи рівня Unreal здавати не треба: вона дуже велика. Перевірка: у папці здачі всі файли, кожен більший за 1 КБ. (from lesson 4)\n\nToday is a BOSS build. Ask me what time I started; whenever I tell you t const HIN=(D.handin||[]).map(v=>(v&&v.en)||(typeof v==='string'?v:'')).join(' ').toLowerCase(),hasClip=/\.mp4|clip/.test(HIN);
function hItem(v){return x(v)}
function hList(){return '<ul class="ticks">'+(D.handin||[]).map(v=>'<li>'+lk(hItem(v))+'</li>').join('')+'</ul>'}
const NFILES=new Set((HIN.match(/[\w-]+\.(?:blend|glb|fbx|png|jpe?g|md|txt|mp4|csv|zip|pdf|webp|kra|psd|tga|exr|json|py|uasset|umap)\b/g)||[])).size;
function nFiles(n){if(!n)return '';if(lang==='en')return ' · '+n+(n===1?' file':' files');const a=n%10,b=n%100;return ' · '+n+' '+(a===1&&b!==11?'файл':a>=2&&a<=4&&(b<12||b>14)?'файли':'файлів')}
function hf(){return D.handinUrl?'<div class="row"><a class="btn s" href="'+esc(D.handinUrl)+'" target="_blank" rel="noopener">'+ic('folder')+u('hOpen')+'</a></div>':'<p class="path">'+ic('folder')+'<span>'+u('hPath')+' <code>'+esc(D.workPath)+'</code></span></p>'}
function handinCard(){if(!D.handin||!D.handin.length)return '';return '<section class="card glass handin">'+lab(u('hTitle')+nFiles(NFILES),'ok')+hList()+hf()+'<p class="muted" style="margin:12px 0 0">'+u('hNote')+'</p></section>'}
function beforeCard(){if(!D.before||!D.before.length)return '';return '<section class="card glass before">'+lab(u('before'),'gold')+list(D.before,'ol','steps')+'</section>'}
function chkList(){const a=[];if(HIN.indexOf('.blend')>=0)a.push('chk1');if(/\.(glb|fbx)\b/.test(HIN))a.push('chk2');a.push('chk3');if(hasClip)a.push('chk4');return '<h3>'+u('chk')+'</h3><ol class="steps">'+a.map(k=>'<li>'+u(k)+'</li>').join('')+'</ol>'}
function qCard(){return '<section class="card glass qcard">'+lab(u('qTitle'))+'<ul class="ticks"><li>'+u('q1')+'</li><li>'+u('q2')+'</li><li>'+u('q3')+'</li><li>'+u('q4')+'</li><li>'+u('q5')+'</li></ul></section>'}
function reportText(){let t=D.reportPrompt;const r=D.lessons.map((l,i)=>{const v=(st['r'+i]||'').trim();return v?'Lesson '+(i+1)+': '+v:''}).filter(Boolean);
 if(r.length)t+='\n\nMy lesson summaries, pasted from my course page:\n'+r.join('\n');
 if(st.qs1)t+='\nMy first score in the Check yourself quiz: '+st.qs1[0]+' of '+st.qs1[1]+'.';
 return t}
function qDone(){return D.quiz&&D.quiz.length&&st.qa&&D.quiz.every((q,i)=>st.qa[i]!=null)}
function prog(){const Q=(D.quiz&&D.quiz.length)?1:0,L=D.lessons.length,C=D.build.steps.length;let n=0;D.lessons.forEach((l,i)=>{if(st['q'+i])n++});D.build.steps.forEach((s,i)=>{if(st['c'+i])n++});if(Q&&qDone())n++;return (L+C+Q)?n/(L+C+Q):0}
function qScore(){let n=0;D.quiz.forEach((q,i)=>{if((st.qa||{})[i]===q.answer)n++});return n}
function pick(i,k){st.qa=st.qa||{};if(st.qa[i]!=null)return;st.qa[i]=k;if(qDone()){st.qs=[qScore(),D.quiz.length];if(!st.qs1)st.qs1=st.qs.slice()}save();render();const e=document.getElementById('e'+i);if(e)e.focus({preventScroll:true})}
function retry(){st.qa={};delete st.qs;save();render();const e=document.getElementById('o0_0');if(e)e.focus()}
const isBoss=!!(D.build&&D.build.boss&&D.build.boss.length),isFin=D.day===D.total;
document.body.className=isFin?'fin':isBoss?'boss':'';
const lk=s=>esc(s).replace(/https?:\/\/[^\s<']*[^\s<.,;:)']/g,m=>'<a href="'+m+'" target="_blank" rel="noopener">'+m+'</a>');
function list(a,tag,cls){return '<'+tag+(cls?' class="'+cls+'"':'')+'>'+(a||[]).map(i=>'<li>'+lk(x(i))+'</li>').join('')+'</'+tag+'>'}
const lab=(t,k)=>'<div class="lab'+(k?' k-'+k:'')+'"><span class="dotc"></span>'+t+'</div>';
const kn=n=>'<span class="kn">'+ic(n)+'</span>';
const slider=p=>'<div class="slider"><i style="width:calc('+p+'% - 6px)"></i><b style="left:clamp(13px,'+p+'%,calc(100% - 13px))"></b></div>';
function quiz(){if(!D.quiz||!D.quiz.length)return '';const a=st.qa||{};let ok=0;const L=u('letters');
 const pips='<div class="pips well" aria-hidden="true">'+D.quiz.map((q,i)=>'<i class="'+(a[i]==null?'':a[i]===q.answer?'r':'w')+'"></i>').join('')+'</div>';
 const qs=D.quiz.map((q,i)=>{const c=a[i];if(c===q.answer)ok++;return '<div class="qz"><p class="qq"><span class="qn">'+(i+1)+'</span><span>'+lk(x(q.q))+'</span></p>'+q.options.map((o,k)=>{let cls='opt',mk='<span></span>';if(c!=null){if(k===q.answer){cls+=' right';mk=ic('check','mk')}else if(k===c){cls+=' wrong';mk=ic('x','mk')}}return '<button class="'+cls+'" id="o'+i+'_'+k+'"'+(c!=null?' disabled':'')+' onclick="pick('+i+','+k+')"><span class="lt">'+(L[k]||k+1)+'</span><span>'+esc(x(o))+'</span>'+mk+'</button>'}).join('')+(c!=null?'<p class="exp '+(c===q.answer?'r':'w')+'" id="e'+i+'" tabindex="-1"><b>'+(c===q.answer?u('right'):u('wrong'))+'</b>'+lk(x(q.explain))+'</p>':'')+'</div>'}).join('');
 return '<section class="card glass quiz">'+lab(u('quiz'),'gold')+'<p class="muted" style="margin:-6px 0 14px">'+u('quizSub')+'</p>'+pips+qs+(qDone()?'<div class="score well" role="status"><span class="eyebrow">'+u('score')+'</span><span class="lcd" aria-label="'+ok+' / '+D.quiz.length+'">'+seg(ok+'/'+D.quiz.length)+'</span>'+(st.qs1?'<span class="muted">'+u('first')+': '+st.qs1[0]+'/'+st.qs1[1]+'</span>':'')+'<div class="row"><button class="btn ghost" id="retry" onclick="retry()">'+u('retry')+'</button></div></div>':'')+'</section>'}
function vid(v){if(!v)return '';const link=v.url?'<a href="'+esc(v.url)+'" target="_blank" rel="noopener">'+esc(x(v.title)||v.url)+'</a>'+(v.channel?' <span class="muted">· '+esc(v.channel)+(v.length?' · '+esc(v.length):'')+'</span>':''):'';const s=v.search?'<a href="https://www.youtube.com/results?search_query='+encodeURIComponent(v.search)+'" target="_blank" rel="noopener">'+u('noVid')+': '+esc(v.search)+'</a>':'';const alt=v.alt&&v.alt.url?'<br><span class="eyebrow">UA</span> <a href="'+esc(v.alt.url)+'" target="_blank" rel="noopener">'+esc(v.alt.title||v.alt.url)+'</a>'+(v.alt.channel?' <span class="muted">· '+esc(v.alt.channel)+'</span>':''):'';return '<div class="vid well">'+kn('play')+'<div><b>'+u('more')+'?</b><br>'+(link||s)+alt+(link&&s?'<br><span class="muted" style="font-size:14px">'+s+'</span>':'')+'</div></div>'}
function morning(){const m=D.morning;if(!m)return '';const q=m.quote||{};
 let shelf='';if(D.day>0){shelf='<div class="shelf" aria-hidden="true">';let g='';for(let d=0;d<D.day;d++){let p=0;try{p=(JSON.parse(localStorage.getItem('devteam:'+D.learner+':'+d))||{}).pct||0}catch(e){}g+='<i class="'+(p>=1?'d':'')+(d>0&&d%5===0?' bs':'')+'"></i>';if(d%5===0||d===D.day-1){shelf+='<span class="wkg">'+g+'</span>';g=''}}shelf+='</div>'}
 const qt=lang==='uk'&&q.original?q.original:x(q.text);
 return '<section class="card glass morning"><div class="mgrid">'+(m.sofar?'<div>'+lab(u('sofar'),'gold')+shelf+'<p class="mtxt">'+lk(x(m.sofar))+'</p></div>':'')+(m.today?'<div>'+lab(u('todayL'))+'<p class="mtxt">'+lk(x(m.today))+'</p></div>':'')+'</div>'+(m.cheer?'<p class="cheer">'+esc(x(m.cheer))+'</p>':'')+(qt?'<figure class="quote well">'+kn('quote')+'<blockquote>'+esc(qt)+'</blockquote>'+(q.author?'<figcaption>'+esc(x(q.author))+'</figcaption>':'')+'</figure>':'')+'</section>'}
function setLang(l){lang=l;try{localStorage.setItem('devteam:lang',lang)}catch(e){};render()}
function toggleLang(){setLang(lang==='uk'?'en':'uk')}
/* keep open sections and keyboard focus across re-renders */
const openD=new Set();
function tg(e){if(e.open)openD.add(e.id);else openD.delete(e.id)}
const op=id=>openD.has(id)?' open':'';
function render(){const ae=document.activeElement,fid=ae&&(ae.id||(ae.getAttribute('data-th')?'th-'+ae.getAttribute('data-th'):ae.getAttribute('lang')&&ae.closest('.seg')?'lg-'+ae.getAttribute('lang'):''));
 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);
 const b=D.build,P=Math.round(prog()*100);
 document.getElementById('top').innerHTML='<div class="topin glass"><a class="maplink" href="'+esc(D.mapHref)+'">'+kn('map')+u('map')+'</a><div class="crumb"><b>'+esc(x(D.learnerName))+'</b><span>'+u('week')+' '+D.week+'</span><span>'+u('day')+' '+D.day+' '+u('of')+' '+D.total+'</span></div>'+controls(lang,'setLang')+'</div><div class="tline"><i style="width:'+P+'%"></i></div>';
 const state=w=>w<D.week?'b':w===D.week?'n':'p';
 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 let wk='';if(D.weekInfo){const w=D.weekInfo;wk='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}
 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p>'+(b.next?'<div class="back well">'+kn('arrow')+'<div><b>'+u('comes')+'</b><br>'+lk(x(b.next))+'</div></div>':'')+'<div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.assetFiles&&D.assetFiles.length?'<p class="files">'+ic('folder')+'<span>'+u('filesL')+' '+D.assetFiles.map(f=>'<a href="assets/'+encodeURIComponent(f)+'" target="_blank" rel="noopener">'+esc(f)+'</a>').join(', ')+'</span></p>':D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+=handinCard();h+=beforeCard();
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div><label class="rcpt" for="r'+i+'"><span class="eyebrow">'+u('rcpt')+'</span><textarea id="r'+i+'" rows="2" placeholder="'+esc(u('rcptPh'))+'" oninput="st.r'+i+'=this.value;save()">'+esc(st['r'+i]||'')+'</textarea></label>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+hList()+chkList()+(hasClip?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<h3>1 · '+u('copyR')+'</h3><p class="muted">'+u('report')+'</p><div class="row"><button class="btn ghost" onclick="cp(reportText())">'+ic('copy')+u('copyR')+'</button></div><h3>2 · '+u('ship')+'</h3>'+hf()+'<p class="muted" style="margin:12px 0 0">'+u('hNote')+'</p></section>';
 h+=qCard();h+=wk;
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();
</script>
</body>
</html>

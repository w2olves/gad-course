<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 14</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

<script id="data" type="application/json">{"learner": "ib-misha-873821eb", "learnerName": {"en": "Misha", "uk": "Міша"}, "day": 14, "week": 3, "total": 110, "title": {"en": "Texture painting and wear: salt, sun and edges, with a Wear slider", "uk": "Малювання текстур і зношеність: сіль, сонце й краї, з повзунком Wear"}, "theme": {"en": "Week 3: Surfaces", "uk": "Тиждень 3: Поверхні"}, "build": {"item": {"en": "Wear masks painted in Blender and a Wear slider on the kit's instances", "uk": "Маски зношеності, намальовані в Blender, і повзунок Wear на інстансах набору"}, "why": {"en": "New paint and clean stone look like a toy from the air. Real harbour surfaces fade in the sun, grow salt lines near the water and wear at edges where hands, feet and boats rub; artists call this weathering. A painted mask says where the wear goes and a Wear slider says how much. A level designer can then age a piece with one slider: fresh near the shops, old on the windy pier.", "uk": "Свіжа фарба й чистий камінь з повітря виглядають як іграшка. Справжні поверхні в гавані вигорають на сонці, біля води на них з'являються сольові лінії, а краї стираються там, де їх торкаються руки, ноги й човни; художники називають це зістарюванням (weathering). Намальована маска каже, де буде зношеність, а повзунок Wear — наскільки сильна. Тоді левел-дизайнер може зістарити деталь одним повзунком: свіжа біля крамниць, стара на вітряному пірсі."}, "where": {"en": "L_KitTest: the quay edge, the door wall, the pier deck and the shop front.", "uk": "L_KitTest: край набережної, стіна з дверима, настил пірса й фасад крамниці."}, "spec": [{"en": "Each painted piece gets a second UV map named Paint (Smart UV Project: islands inside the square, none overlapping); the first map stays exactly as it is.", "uk": "Кожна розмальована деталь отримує другу UV-розгортку з назвою Paint (Smart UV Project: острівці всередині квадрата, жоден не перекривається); перша розгортка лишається точно такою, як є."}, {"en": "A 1024 x 1024 mask per piece, T_<Piece>_Wear (a mask is a black-and-white image: white means worn, black means clean).", "uk": "Маска 1024 x 1024 для кожної деталі, T_<Piece>_Wear (маска — чорно-біле зображення: біле означає зношене, чорне — чисте)."}, {"en": "Wear only where its cause is: salt rising 10 to 40 cm from the bottom near the water, sun fade on top surfaces, edge wear on corners and where people touch. Most of each mask stays black.", "uk": "Зношеність лише там, де є її причина: сіль піднімається на 10–40 см від низу біля води, сонце вибілює верхні поверхні, краї стираються на кутах і там, де торкаються люди. Більша частина кожної маски лишається чорною."}, {"en": "M_Master gains four parameters: WearMask (read from UV channel 1, the Paint map), Wear (0 to 1), WornColour and WornRoughness.", "uk": "M_Master отримує чотири нові параметри: WearMask (читається з UV-каналу 1, розгортки Paint), Wear (від 0 до 1), WornColour і WornRoughness."}, {"en": "A child instance for each piece's main slot (for example MI_Stone_QuayEdge, whose parent is MI_Stone), with its own WearMask and Wear.", "uk": "Дочірній інстанс для головного слота кожної деталі (наприклад, MI_Stone_QuayEdge, чий батьківський інстанс — MI_Stone), з власними WearMask і Wear."}, {"en": "Every painted image saved as a PNG and packed into the .blend before export; in Unreal, Generate Lightmap UVs is off on each painted mesh, so Unreal can't write over the Paint map.", "uk": "Кожне намальоване зображення збережене як PNG і запаковане в .blend перед експортом; в Unreal на кожній розмальованій сітці вимкнено Generate Lightmap UVs, щоб Unreal не перезаписав розгортку Paint."}, {"en": "Four pieces done: SM_QuayEdge_4m, SM_Wall_Door, SM_PierDeck_4m and SM_ShopFront_A.", "uk": "Чотири деталі готові: SM_QuayEdge_4m, SM_Wall_Door, SM_PierDeck_4m і SM_ShopFront_A."}], "piece1": "SM_QuayEdge_4m: a salt line and worn coping (shared with the lessons)", "piece2": {"en": "SM_Wall_Door, SM_PierDeck_4m and SM_ShopFront_A, on your own", "uk": "SM_Wall_Door, SM_PierDeck_4m і SM_ShopFront_A, самостійно"}, "steps": [{"text": {"en": "Collect four photos of old harbour walls, doors and timber decks from Wikimedia Commons and credit them. In Krita, circle where salt, sun fade and edge wear show. Check: wear_references.png shows four photos with circles, and credits.md lists them.", "uk": "Збери на Wikimedia Commons чотири фото старих стін гавані, дверей і дерев'яних настилів і вкажи їхніх авторів. У Krita обведи, де видно сіль, вигорання й стерті краї. Перевірка: wear_references.png показує чотири фото з обведеннями, а credits.md їх перелічує."}, "lesson": 2}, {"text": {"en": "SM_PierDeck_4m (in quaykit_day14.blend, the file from the lessons): add the Paint map, then paint T_PierDeck_Wear: a faint sun fade over the top, a soft worn band along the middle where people walk, and edge wear where boats rub. Save it. Check: the walking band is soft and uneven, not a ruled stripe.", "uk": "SM_PierDeck_4m (у quaykit_day14.blend, файлі з уроків): додай розгортку Paint, потім намалюй T_PierDeck_Wear: ледь помітне вигорання зверху, м'яку стерту смугу посередині, де ходять люди, і стерті краї там, де труться човни. Збережи. Перевірка: смуга ходіння м'яка й нерівна, а не рівна, як під лінійку."}, "lesson": 2}, {"text": {"en": "Open buildkit_day13.blend and save it as buildkit_day14.blend. SM_Wall_Door: add the Paint UV map and Smart UV Project it, as in lesson 1. Check: in the UV Editor, the Paint map's islands sit inside the square with no overlaps.", "uk": "Відкрий buildkit_day13.blend і збережи його як buildkit_day14.blend. SM_Wall_Door: додай UV-розгортку Paint і зроби для неї Smart UV Project, як в уроці 1. Перевірка: в UV Editor острівці розгортки Paint лежать усередині квадрата без перекриттів."}, "lesson": 1}, {"text": {"en": "Paint T_WallDoor_Wear: salt rising from the bottom, edge wear round the door opening and on the handle side. Save the image at once (Image > Save As). Check: from the front, most of the wall is still black.", "uk": "Намалюй T_WallDoor_Wear: сіль, що піднімається знизу, стерті краї навколо дверного отвору й з боку ручки. Одразу збережи зображення (Image > Save As). Перевірка: спереду більша частина стіни досі чорна."}, "lesson": 2}, {"text": {"en": "SM_ShopFront_A: add the Paint map, then paint T_ShopFront_A_Wear: salt on the plinth, wear on the door edges and the sill. Save it. Check: the fascia and the window frame stay mostly clean.", "uk": "SM_ShopFront_A: додай розгортку Paint, потім намалюй T_ShopFront_A_Wear: сіль на цоколі, стертість на краях дверей і на підвіконні. Збережи. Перевірка: вивісна дошка й віконна рама лишаються здебільшого чистими."}, "lesson": 2}, {"text": {"en": "Pack and save both files (quaykit_day14.blend and buildkit_day14.blend): File > External Data > Pack Resources, then File > Save. Close Blender and open each file again. Check: all four masks still show their paint.", "uk": "Запакуй і збережи обидва файли (quaykit_day14.blend і buildkit_day14.blend): File > External Data > Pack Resources, потім File > Save. Закрий Blender і знову відкрий кожен файл. Перевірка: усі чотири маски досі показують розпис."}, "lesson": 3}, {"text": {"en": "Export SM_Wall_Door, SM_PierDeck_4m and SM_ShopFront_A over their FBX files and Reimport them in Unreal. In each Static Mesh Editor, check that Generate Lightmap UVs is off (untick it and Apply Changes if not), as in lesson 3. Import the three masks into Course/Day14. Check: in each Static Mesh Editor, UV > UV Channel 1 shows that piece's Paint layout.", "uk": "Експортуй SM_Wall_Door, SM_PierDeck_4m і SM_ShopFront_A поверх їхніх FBX-файлів і зроби Reimport в Unreal. У кожному Static Mesh Editor перевір, що Generate Lightmap UVs вимкнено (якщо ні, зніми галочку й натисни Apply Changes), як в уроці 3. Імпортуй три маски в Course/Day14. Перевірка: у кожному Static Mesh Editor UV > UV Channel 1 показує розкладку Paint цієї деталі."}, "lesson": 3}, {"text": {"en": "Child instances for each piece's main slot: MI_Plaster_WallDoor (parent MI_Plaster), MI_Wood_PierDeck (parent MI_Wood) and MI_Trim_ShopFront_A (parent MI_Trim_Harbour), each with its WearMask, set on the mesh asset. Check: dragging Wear from 0 to 1 ages each piece in the viewport. (If an instance shows an error about the sampler type, open the mask texture and make sure sRGB is ticked, the default.)", "uk": "Дочірні інстанси для головного слота кожної деталі: MI_Plaster_WallDoor (батьківський MI_Plaster), MI_Wood_PierDeck (батьківський MI_Wood) і MI_Trim_ShopFront_A (батьківський MI_Trim_Harbour), кожен зі своєю WearMask, призначені на асеті сітки. Перевірка: якщо тягнути Wear від 0 до 1, кожна деталь у в'юпорті старіє. (Якщо інстанс показує помилку про тип семплера, відкрий текстуру маски й переконайся, що sRGB має галочку, як за замовчуванням.)"}, "lesson": 4}, {"text": {"en": "Set WornColour from your photos: a pale salt grey for stone and plaster, a silver grey for old timber; WornRoughness 0.9. Check: at Wear 1 the worn parts look dry and faded, not dirty.", "uk": "Задай WornColour за своїми фото: блідий сольовий сірий для каменю й штукатурки, сріблясто-сірий для старого дерева; WornRoughness 0.9. Перевірка: при Wear 1 зношені частини виглядають сухими й вигорілими, а не брудними."}, "lesson": 4}, {"text": {"en": "Choose Wear by where each piece usually stands: quay edge and pier deck 0.7 to 0.8 (waves, salt and boats), the door wall 0.5, the shop front 0.4. Write the values in wear_map.md. Check: from 10 m the kit looks used but not dirty.", "uk": "Вибери Wear за тим, де деталь зазвичай стоїть: край набережної й настил пірса 0.7–0.8 (хвилі, сіль і човни), стіна з дверима 0.5, фасад крамниці 0.4. Запиши значення в wear_map.md. Перевірка: з 10 м набір виглядає вживаним, але не брудним."}, "lesson": 4}, {"text": {"en": "Before/after capture: L_KitTest from the same view with every Wear at 0 and at your chosen values. Then a 60-second clip flying low along the quay. Save today's clip as flythrough_day14.mp4 and check that you also have T_WallDoor_Wear.png, T_PierDeck_Wear.png, T_ShopFront_A_Wear.png, m_master_wear.png and before_after_day14.png (each is described in today's hand-in list; take any you are missing now). Check: the salt line and the worn edges show in the clip.", "uk": "Знімок «до/після»: L_KitTest з того самого ракурсу з усіма Wear на 0 і з вибраними значеннями. Потім 60-секундний кліп низького прольоту вздовж набережної. Збережи сьогоднішній кліп як flythrough_day14.mp4 і перевір, що в тебе також є T_WallDoor_Wear.png, T_PierDeck_Wear.png, T_ShopFront_A_Wear.png, m_master_wear.png і before_after_day14.png (кожен описано в сьогоднішньому списку «Здати роботу»; зроби зараз ті, яких бракує). Перевірка: у кліпі видно сольову лінію й стерті краї."}, "lesson": 4}]}, "lessons": [{"title": {"en": "A second UV map for painting", "uk": "Друга UV-розгортка для малювання"}, "minutes": 40, "goals": [{"en": "Explain why painting needs its own UVs: every island inside the square and none overlapping, so each spot on the model has its own pixels.", "uk": "Поясни, чому для малювання потрібні власні UV: кожен острівець усередині квадрата й жоден не перекривається, тож кожна точка моделі має власні пікселі."}, {"en": "Add a second UV map named Paint and unwrap it with Smart UV Project, leaving the first map untouched.", "uk": "Додай другу UV-розгортку з назвою Paint і розгорни її через Smart UV Project, не чіпаючи першої."}, {"en": "Set up Texture Paint mode (painting straight onto the model) with a new black image on the Paint map.", "uk": "Налаштуй режим Texture Paint (малювання просто на моделі) з новим чорним зображенням на розгортці Paint."}], "doalong": [{"en": "Open quaykit_day11.blend and save it as quaykit_day14.blend. Select SM_QuayEdge_4m. In the Properties editor, click Object Data Properties (the green triangle icon). Under UV Maps press +, then double-click the new map and name it Paint. Leave the camera icon on the first map. You see two maps in the list.", "uk": "Відкрий quaykit_day11.blend і збережи його як quaykit_day14.blend. Виділи SM_QuayEdge_4m. У редакторі Properties клацни Object Data Properties (іконка зеленого трикутника). У розділі UV Maps натисни +, потім двічі клацни нову розгортку й назви її Paint. Іконку камери залиш на першій розгортці. Ти бачиш дві розгортки в списку."}, {"en": "Click Paint so it is highlighted (active). Tab into Edit Mode, press A, then U > Smart UV Project, Island Margin 0.02, OK. You see islands packed inside the UV square, none overlapping.", "uk": "Клацни Paint, щоб вона підсвітилася (стала активною). Перейди в Edit Mode (Tab), натисни A, потім U > Smart UV Project, Island Margin 0.02, OK. Ти бачиш острівці, складені всередині UV-квадрата, жоден не перекривається."}, {"en": "Click the first map in the list and look at the UV Editor: your Day 11 UVs are unchanged. Click Paint again. You see that each map keeps its own layout.", "uk": "Клацни першу розгортку в списку й подивися на UV Editor: твої UV з Дня 11 не змінилися. Знову клацни Paint. Ти бачиш, що кожна розгортка зберігає власну розкладку."}, {"en": "Tab back to Object Mode and click the Texture Paint tab at the top. In the tool settings on the right (the Tool tab of the Properties editor), find Texture Slots and set Mode to Single Image (if your screen looks different, send the tutor a screenshot). Press New: name T_QuayEdge_Wear, 1024 x 1024, Color black, Alpha unticked, OK. Set UV Map to Paint. You see the quay edge turn black.", "uk": "Повернись в Object Mode (Tab) і клацни вкладку Texture Paint угорі. У налаштуваннях інструмента праворуч (вкладка Tool редактора Properties) знайди Texture Slots і постав Mode на Single Image (якщо твій екран виглядає інакше, надішли тьюторові скриншот). Натисни New: назва T_QuayEdge_Wear, 1024 x 1024, Color чорний, Alpha без галочки, OK. Постав UV Map на Paint. Ти бачиш, що край набережної став чорним."}, {"en": "Press X until the brush colour is white, then left-drag one short stroke on the bottom of the front face. You see the stroke on the model and in the Image Editor on the left.", "uk": "Натискай X, доки колір пензля не стане білим, потім проведи лівою кнопкою один короткий мазок унизу передньої грані. Ти бачиш мазок на моделі й в Image Editor ліворуч."}], "play": {"en": "Overlap hunt: the tutor describes three UV layouts (islands stacked on top of each other, islands outside the square, a clean pack). I say which one will paint correctly and why, in 30 seconds each.", "uk": "Полювання на перекриття: тьютор описує три UV-розкладки (острівці складені один на одного, острівці поза квадратом, чиста розкладка). За 30 секунд на кожну я кажу, яка з них правильно прийме розпис, і чому."}, "video": {"url": "https://www.youtube.com/watch?v=iwWoXMWzC_c", "title": "Blender 4.0 - Texture Painting quick start guide", "channel": "Jamie Dunbar", "length": "5:31", "search": "blender texture painting quick start"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: A second UV map for painting (Day 14, lesson 1 of 4).\nToday's build: Wear masks painted in Blender and a Wear slider on the kit's instances.\n\nBy the end of this lesson I can:\n1. Explain why painting needs its own UVs: every island inside the square and none overlapping, so each spot on the model has its own pixels.\n2. Add a second UV map named Paint and unwrap it with Smart UV Project, leaving the first map untouched.\n3. Set up Texture Paint mode (painting straight onto the model) with a new black image on the Paint map.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (You have a textured harbour kit, a trim sheet and your first shop front, SM_ShopFront_A, standing in L_KitTest.), what I will learn today (You paint salt, sun and edge wear onto four kit pieces and add a Wear slider to M_Master, so each piece can age from new to old.), encourage me (Wear is about observation, not perfection: look at your photos, paint a little, and look again.), and share today's quote: \"A work-room should be like an old shoe; no matter how shabby, it's better than a new one.\" (Willa Cather).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 11: what is the kit standard texel density, and how much of the model does one UV square cover? | Day 8: why does every kit piece follow one naming pattern, such as SM_QuayEdge_4m?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Overlap hunt: the tutor describes three UV layouts (islands stacked on top of each other, islands outside the square, a clean pack). I say which one will paint correctly and why, in 30 seconds each.\n6. Do-along on today's build (SM_QuayEdge_4m: a salt line and worn coping (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Open quaykit_day11.blend and save it as quaykit_day14.blend. Select SM_QuayEdge_4m. In the Properties editor, click Object Data Properties (the green triangle icon). Under UV Maps press +, then double-click the new map and name it Paint. Leave the camera icon on the first map. You see two maps in the list.\n   - Click Paint so it is highlighted (active). Tab into Edit Mode, press A, then U > Smart UV Project, Island Margin 0.02, OK. You see islands packed inside the UV square, none overlapping.\n   - Click the first map in the list and look at the UV Editor: your Day 11 UVs are unchanged. Click Paint again. You see that each map keeps its own layout.\n   - Tab back to Object Mode and click the Texture Paint tab at the top. In the tool settings on the right (the Tool tab of the Properties editor), find Texture Slots and set Mode to Single Image (if your screen looks different, send the tutor a screenshot). Press New: name T_QuayEdge_Wear, 1024 x 1024, Color black, Alpha unticked, OK. Set UV Map to Paint. You see the quay edge turn black.\n   - Press X until the brush colour is white, then left-drag one short stroke on the bottom of the front face. You see the stroke on the model and in the Image Editor on the left.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Blender 4.0 - Texture Painting quick start guide\" by Jamie Dunbar: https://www.youtube.com/watch?v=iwWoXMWzC_c\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Reading wear, and painting salt, sun and edges", "uk": "Читаємо зношеність і малюємо сіль, сонце й краї"}, "minutes": 40, "goals": [{"en": "Read real wear from photos: salt and algae near the water, sun fade on top surfaces, wear on edges and where hands and feet touch.", "uk": "Читай справжню зношеність з фото: сіль і водорості біля води, вигорання на верхніх поверхнях, стертість на краях і там, де торкаються руки й ноги."}, {"en": "Paint a wear mask with a soft brush: radius with F, strength with Shift+F, white for worn and black to remove.", "uk": "Намалюй маску зношеності м'яким пензлем: радіус — F, сила — Shift+F, білий для зношеного, чорний — щоб стерти."}, {"en": "Keep it subtle: wear only where its cause is, with most of the surface clean.", "uk": "Тримай міру: зношеність лише там, де є її причина, а більша частина поверхні чиста."}], "doalong": [{"en": "Open two Wikimedia Commons photos of old quay walls. Find the salt line and see how high it rises. You see that it follows the water and the splashes, never a ruler line.", "uk": "Відкрий два фото старих стінок набережної з Wikimedia Commons. Знайди сольову лінію й подивися, як високо вона піднімається. Ти бачиш, що вона йде за водою й бризками, а не по лінійці."}, {"en": "On T_QuayEdge_Wear, pick a soft brush (for example Paint Soft or Airbrush) from the brush list (at the top of the 3D view or in the tool settings), colour white, strength about 0.3 (press Shift+F and move the mouse). Paint uneven streaks rising 10 to 40 cm from the bottom of the face that meets the water. You see a soft, broken band.", "uk": "На T_QuayEdge_Wear вибери м'який пензель (наприклад, Paint Soft або Airbrush) у списку пензлів (угорі 3D-вікна або в налаштуваннях інструмента), колір білий, сила близько 0.3 (натисни Shift+F і порухай мишею). Намалюй нерівні патьоки, що піднімаються на 10–40 см від низу грані, яка торкається води. Ти бачиш м'яку уривчасту смугу."}, {"en": "Make the brush small (press F and move the mouse) and paint thin edge wear along the coping's front edge and its corners, stronger where feet and ropes rub. You see bright lines only on edges.", "uk": "Зменш пензель (натисни F і порухай мишею) і намалюй тонку стертість уздовж переднього краю парапету та на його кутах, сильнішу там, де труться ноги й мотузки. Ти бачиш яскраві лінії лише на краях."}, {"en": "Make the brush large and set strength to 0.1. Paint a faint sun fade over the top face. You see the top slightly grey, not white.", "uk": "Збільш пензель і постав силу 0.1. Намалюй ледь помітне вигорання на верхній грані. Ти бачиш, що верх трохи посірів, але не став білим."}, {"en": "Press X to swap to black and paint out anything that looks like a stripe or a blob. Then, in the Image Editor on the left, Image > Save As: T_QuayEdge_Wear.png in your Day14 folder. You see the image name with no asterisk (*).", "uk": "Натисни X, щоб перемкнутися на чорний, і зафарбуй усе, що схоже на смугу чи пляму. Потім в Image Editor ліворуч Image > Save As: T_QuayEdge_Wear.png у папку Day14. Ти бачиш назву зображення без зірочки (*)."}], "play": {"en": "Cause and effect: the tutor names five marks (a white crust low on a wall, a pale top, a bare corner, a dark ring round a handle, a green band at the waterline). I name the cause and where it belongs on my kit.", "uk": "Причина й наслідок: тьютор називає п'ять слідів (біла кірка внизу стіни, блідий верх, оголений кут, темне кільце навколо ручки, зелена смуга біля ватерлінії). Я називаю причину й місце, де такий слід має бути на моєму наборі."}, "video": {"url": "https://www.youtube.com/watch?v=bR4HtqxA9tk", "title": "Texture Paint Metallic Maps and Edge Wear (Blender Tutorial)", "channel": "Ryan King Art", "length": "18:45", "search": "blender texture paint edge wear"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Reading wear, and painting salt, sun and edges (Day 14, lesson 2 of 4).\nToday's build: Wear masks painted in Blender and a Wear slider on the kit's instances.\nEarlier today I already did: lesson 1 (A second UV map for painting). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Read real wear from photos: salt and algae near the water, sun fade on top surfaces, wear on edges and where hands and feet touch.\n2. Paint a wear mask with a soft brush: radius with F, strength with Shift+F, white for worn and black to remove.\n3. Keep it subtle: wear only where its cause is, with most of the surface clean.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Cause and effect: the tutor names five marks (a white crust low on a wall, a pale top, a bare corner, a dark ring round a handle, a green band at the waterline). I name the cause and where it belongs on my kit.\n4. Do-along on today's build (SM_QuayEdge_4m: a salt line and worn coping (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Open two Wikimedia Commons photos of old quay walls. Find the salt line and see how high it rises. You see that it follows the water and the splashes, never a ruler line.\n   - On T_QuayEdge_Wear, pick a soft brush (for example Paint Soft or Airbrush) from the brush list (at the top of the 3D view or in the tool settings), colour white, strength about 0.3 (press Shift+F and move the mouse). Paint uneven streaks rising 10 to 40 cm from the bottom of the face that meets the water. You see a soft, broken band.\n   - Make the brush small (press F and move the mouse) and paint thin edge wear along the coping's front edge and its corners, stronger where feet and ropes rub. You see bright lines only on edges.\n   - Make the brush large and set strength to 0.1. Paint a faint sun fade over the top face. You see the top slightly grey, not white.\n   - Press X to swap to black and paint out anything that looks like a stripe or a blob. Then, in the Image Editor on the left, Image > Save As: T_QuayEdge_Wear.png in your Day14 folder. You see the image name with no asterisk (*).\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Texture Paint Metallic Maps and Edge Wear (Blender Tutorial)\" by Ryan King Art: https://www.youtube.com/watch?v=bR4HtqxA9tk\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Saving, packing and two UV maps into Unreal", "uk": "Збереження, пакування й дві UV-розгортки в Unreal"}, "minutes": 40, "goals": [{"en": "Know why painted images vanish: an unsaved image lives only in memory, and an asterisk (*) on the Image menu means unsaved.", "uk": "Знай, чому намальовані зображення зникають: незбережене зображення живе лише в пам'яті, а зірочка (*) біля меню Image означає «не збережено»."}, {"en": "Save every image and pack it into the .blend (File > External Data > Pack Resources), then export an FBX that carries both UV maps.", "uk": "Збережи кожне зображення й запакуй його в .blend (File > External Data > Pack Resources), потім експортуй FBX, що несе обидві UV-розгортки."}, {"en": "Reimport in Unreal, check that Generate Lightmap UVs is off (your Day 6 checklist) so Unreal can't overwrite it, and check the second UV map, which Unreal calls UV Channel 1 (the first is UV Channel 0).", "uk": "Зроби Reimport в Unreal, перевір, що Generate Lightmap UVs вимкнено (твій чекліст з Дня 6), щоб Unreal не перезаписав розгортку, і перевір другу UV-розгортку, яку Unreal називає UV Channel 1 (перша — UV Channel 0)."}], "doalong": [{"en": "In the Image Editor, look at the Image menu at the top: Image* means unsaved. Click Image > Save. You see the asterisk disappear.", "uk": "В Image Editor подивися на меню Image угорі: Image* означає «не збережено». Клацни Image > Save. Ти бачиш, що зірочка зникла."}, {"en": "File > External Data > Pack Resources, then File > Save. Close Blender and open the file again. You see your paint is still there.", "uk": "File > External Data > Pack Resources, потім File > Save. Закрий Blender і знову відкрий файл. Ти бачиш, що твій розпис на місці."}, {"en": "Select SM_QuayEdge_4m and its UCX boxes and export over its FBX with your usual settings; both UV maps go into the file. You see the file date change in Explorer.", "uk": "Виділи SM_QuayEdge_4m та її коробки UCX і експортуй поверх її FBX зі звичними налаштуваннями; обидві UV-розгортки потрапляють у файл. Ти бачиш, що дата файлу в Explorer змінилася."}, {"en": "In Unreal, right-click SM_QuayEdge_4m > Reimport. You see the reimport message at the bottom right.", "uk": "В Unreal клацни правою кнопкою SM_QuayEdge_4m > Reimport. Ти бачиш повідомлення про повторний імпорт унизу праворуч."}, {"en": "Double-click the mesh. In Details, open LOD0 > Build Settings (click the small arrow) and check that Generate Lightmap UVs is unticked. Your Day 6 import checklist turns it off; if a mesh was imported before that, untick it now and click Apply Changes. Lightmaps are old baked-light images that Unreal would write into UV Channel 1, right over your Paint map; your project uses Lumen (Unreal's live lighting) and needs none.", "uk": "Двічі клацни сітку. У Details відкрий LOD0 > Build Settings (клацни маленьку стрілку) і перевір, що Generate Lightmap UVs без галочки. Твій чекліст імпорту з Дня 6 вимикає цей параметр; якщо сітку імпортовано раніше, зніми галочку зараз і клацни Apply Changes. Лайтмапи — це старі зображення із запеченим світлом, які Unreal записав би в UV Channel 1, просто поверх твоєї розгортки Paint; твій проєкт використовує Lumen (живе освітлення Unreal) і лайтмап не потребує."}, {"en": "In the Static Mesh Editor's toolbar click UV and choose UV Channel 1. You see your Paint layout drawn over the viewport. (A different, tightly packed layout means Generate Lightmap UVs is still on.) Then import T_QuayEdge_Wear.png into Course/Day14. You see the mask in the Content Browser.", "uk": "На панелі інструментів Static Mesh Editor клацни UV і вибери UV Channel 1. Ти бачиш свою розкладку Paint поверх в'юпорта. (Інша, щільно складена розкладка означає, що Generate Lightmap UVs досі ввімкнено.) Потім імпортуй T_QuayEdge_Wear.png у Course/Day14. Ти бачиш маску в Content Browser."}], "play": {"en": "Disaster drill: the tutor has me paint a stroke on a scrap image, close Blender without saving and reopen it. Then I explain the save-and-pack rule in one sentence.", "uk": "Навчальна тривога: тьютор просить мене намалювати мазок на чорновому зображенні, закрити Blender без збереження й відкрити знову. Потім я пояснюю правило «збережи й запакуй» одним реченням."}, "video": {"url": "https://www.youtube.com/watch?v=SqwEGDIPTY8", "title": "How to Pack Files into Blender (Quick Tip)", "channel": "Ryan King Art", "length": "5:32", "search": "blender pack images file"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Saving, packing and two UV maps into Unreal (Day 14, lesson 3 of 4).\nToday's build: Wear masks painted in Blender and a Wear slider on the kit's instances.\nEarlier today I already did: lesson 1 (A second UV map for painting); lesson 2 (Reading wear, and painting salt, sun and edges). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Know why painted images vanish: an unsaved image lives only in memory, and an asterisk (*) on the Image menu means unsaved.\n2. Save every image and pack it into the .blend (File > External Data > Pack Resources), then export an FBX that carries both UV maps.\n3. Reimport in Unreal, check that Generate Lightmap UVs is off (your Day 6 checklist) so Unreal can't overwrite it, and check the second UV map, which Unreal calls UV Channel 1 (the first is UV Channel 0).\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Disaster drill: the tutor has me paint a stroke on a scrap image, close Blender without saving and reopen it. Then I explain the save-and-pack rule in one sentence.\n4. Do-along on today's build (SM_QuayEdge_4m: a salt line and worn coping (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - In the Image Editor, look at the Image menu at the top: Image* means unsaved. Click Image > Save. You see the asterisk disappear.\n   - File > External Data > Pack Resources, then File > Save. Close Blender and open the file again. You see your paint is still there.\n   - Select SM_QuayEdge_4m and its UCX boxes and export over its FBX with your usual settings; both UV maps go into the file. You see the file date change in Explorer.\n   - In Unreal, right-click SM_QuayEdge_4m > Reimport. You see the reimport message at the bottom right.\n   - Double-click the mesh. In Details, open LOD0 > Build Settings (click the small arrow) and check that Generate Lightmap UVs is unticked. Your Day 6 import checklist turns it off; if a mesh was imported before that, untick it now and click Apply Changes. Lightmaps are old baked-light images that Unreal would write into UV Channel 1, right over your Paint map; your project uses Lumen (Unreal's live lighting) and needs none.\n   - In the Static Mesh Editor's toolbar click UV and choose UV Channel 1. You see your Paint layout drawn over the viewport. (A different, tightly packed layout means Generate Lightmap UVs is still on.) Then import T_QuayEdge_Wear.png into Course/Day14. You see the mask in the Content Browser.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"How to Pack Files into Blender (Quick Tip)\" by Ryan King Art: https://www.youtube.com/watch?v=SqwEGDIPTY8\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "A Wear slider in M_Master", "uk": "Повзунок Wear у M_Master"}, "minutes": 40, "goals": [{"en": "Explain a Lerp node (short for linear interpolate): it blends from input A to input B by Alpha, where 0 gives A, 1 gives B and 0.5 a mix.", "uk": "Поясни, що робить вузол Lerp (скорочення від linear interpolate, лінійна інтерполяція): він змішує вхід A з входом B за значенням Alpha, де 0 дає A, 1 дає B, а 0.5 — суміш."}, {"en": "Add WearMask (on UV channel 1), Wear, WornColour and WornRoughness to M_Master and blend them in with two Lerps.", "uk": "Додай до M_Master параметри WearMask (на UV-каналі 1), Wear, WornColour і WornRoughness та вмішай їх двома вузлами Lerp."}, {"en": "Make a child instance (an instance of an instance: it copies its parent and changes only a few values) for each painted piece.", "uk": "Створи дочірній інстанс (інстанс інстанса: він копіює батьківський і змінює лише кілька значень) для кожної розмальованої деталі."}], "doalong": [{"en": "Open M_Master. Add a Texture Sample (hold T, click), Convert to Parameter, name it WearMask, and set its Texture to Black (an engine texture). Hold U and click for a TexCoord; in its Details set Coordinate Index to 1 and wire it into WearMask's UVs. You see a black node preview.", "uk": "Відкрий M_Master. Додай Texture Sample (затисни T, клацни), Convert to Parameter, назви його WearMask і постав його Texture на Black (текстура рушія). Затисни U і клацни, щоб додати TexCoord; у його Details постав Coordinate Index на 1 і з'єднай його з UVs вузла WearMask. Ти бачиш чорний попередній перегляд вузла."}, {"en": "Hold S and click for a Scalar Parameter, Wear (Default 0). Add a Multiply: WearMask's R times Wear. This is the wear amount. You see a new Multiply node.", "uk": "Затисни S і клацни, щоб додати Scalar Parameter Wear (Default 0). Додай Multiply: R від WearMask, помножений на Wear. Це кількість зношеності. Ти бачиш новий вузол Multiply."}, {"en": "Hold V and click for a Vector Parameter, WornColour (a pale grey). Hold L and click for a Lerp. Wire A = the BaseColor-times-Tint Multiply, B = WornColour, Alpha = the wear amount, and the Lerp into Base Color. You see the preview unchanged, because Wear is 0.", "uk": "Затисни V і клацни, щоб додати Vector Parameter WornColour (блідо-сірий). Затисни L і клацни, щоб додати Lerp. З'єднай: A = Multiply «BaseColor на Tint», B = WornColour, Alpha = кількість зношеності, а Lerp — з Base Color. Попередній перегляд не змінився, бо Wear дорівнює 0."}, {"en": "Add a Scalar Parameter WornRoughness (0.9) and a second Lerp: A = the Roughness parameter, B = WornRoughness, Alpha = the wear amount, into Roughness. Apply and Save. You see the material compile with no errors.", "uk": "Додай Scalar Parameter WornRoughness (0.9) і другий Lerp: A = параметр Roughness, B = WornRoughness, Alpha = кількість зношеності, вихід — у Roughness. Apply і Save. Ти бачиш, що матеріал компілюється без помилок."}, {"en": "Right-click MI_Stone > Create Material Instance, name it MI_Stone_QuayEdge. Tick WearMask (T_QuayEdge_Wear) and Wear. Set it on SM_QuayEdge_4m's Stone slot in the Static Mesh Editor. Do the same for its Trim slot (the coping from Day 13) with MI_Trim_QuayEdge and the same mask. Drag Wear from 0 to 1 in both. You see salt and worn edges appear where you painted.", "uk": "Клацни правою кнопкою MI_Stone > Create Material Instance, назви його MI_Stone_QuayEdge. Постав галочки WearMask (T_QuayEdge_Wear) і Wear. Признач його слоту Stone у SM_QuayEdge_4m у Static Mesh Editor. Зроби те саме для її слота Trim (парапет з Дня 13) з MI_Trim_QuayEdge і тією самою маскою. Потягни Wear від 0 до 1 в обох. Ти бачиш, як сіль і стерті краї з'являються там, де ти малюєш."}], "play": {"en": "Age guess: I set three pieces to secret Wear values. The tutor guesses each value from my screenshot. I score when it's within 0.2.", "uk": "Вгадай вік: я ставлю трьом деталям таємні значення Wear. Тьютор вгадує кожне значення з мого скриншота. Бал мені, якщо похибка не більше 0.2."}, "video": {"url": "https://www.youtube.com/watch?v=jEGeqewASV8", "title": "Scratch, Grime & Grunge Imperfections Textures In Unreal Engine 5 - Introduction & Master Material", "channel": "BuildGamesWithJon", "length": "18:24", "search": "unreal engine 5 grunge imperfections material"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: A Wear slider in M_Master (Day 14, lesson 4 of 4).\nToday's build: Wear masks painted in Blender and a Wear slider on the kit's instances.\nEarlier today I already did: lesson 1 (A second UV map for painting); lesson 2 (Reading wear, and painting salt, sun and edges); lesson 3 (Saving, packing and two UV maps into Unreal). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Explain a Lerp node (short for linear interpolate): it blends from input A to input B by Alpha, where 0 gives A, 1 gives B and 0.5 a mix.\n2. Add WearMask (on UV channel 1), Wear, WornColour and WornRoughness to M_Master and blend them in with two Lerps.\n3. Make a child instance (an instance of an instance: it copies its parent and changes only a few values) for each painted piece.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Age guess: I set three pieces to secret Wear values. The tutor guesses each value from my screenshot. I score when it's within 0.2.\n4. Do-along on today's build (SM_QuayEdge_4m: a salt line and worn coping (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Open M_Master. Add a Texture Sample (hold T, click), Convert to Parameter, name it WearMask, and set its Texture to Black (an engine texture). Hold U and click for a TexCoord; in its Details set Coordinate Index to 1 and wire it into WearMask's UVs. You see a black node preview.\n   - Hold S and click for a Scalar Parameter, Wear (Default 0). Add a Multiply: WearMask's R times Wear. This is the wear amount. You see a new Multiply node.\n   - Hold V and click for a Vector Parameter, WornColour (a pale grey). Hold L and click for a Lerp. Wire A = the BaseColor-times-Tint Multiply, B = WornColour, Alpha = the wear amount, and the Lerp into Base Color. You see the preview unchanged, because Wear is 0.\n   - Add a Scalar Parameter WornRoughness (0.9) and a second Lerp: A = the Roughness parameter, B = WornRoughness, Alpha = the wear amount, into Roughness. Apply and Save. You see the material compile with no errors.\n   - Right-click MI_Stone > Create Material Instance, name it MI_Stone_QuayEdge. Tick WearMask (T_QuayEdge_Wear) and Wear. Set it on SM_QuayEdge_4m's Stone slot in the Static Mesh Editor. Do the same for its Trim slot (the coping from Day 13) with MI_Trim_QuayEdge and the same mask. Drag Wear from 0 to 1 in both. You see salt and worn edges appear where you painted.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Scratch, Grime & Grunge Imperfections Textures In Unreal Engine 5 - Introduction & Master Material\" by BuildGamesWithJon: https://www.youtube.com/watch?v=jEGeqewASV8\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "quaykit_day14.blend and buildkit_day14.blend (resources packed)", "uk": "quaykit_day14.blend і buildkit_day14.blend (ресурси запаковано)"}, {"en": "T_QuayEdge_Wear.png, T_WallDoor_Wear.png, T_PierDeck_Wear.png and T_ShopFront_A_Wear.png", "uk": "T_QuayEdge_Wear.png, T_WallDoor_Wear.png, T_PierDeck_Wear.png і T_ShopFront_A_Wear.png"}, {"en": "wear_references.png and wear_map.md", "uk": "wear_references.png і wear_map.md"}, {"en": "m_master_wear.png (the new part of the M_Master graph)", "uk": "m_master_wear.png (нова частина графа M_Master)"}, {"en": "before_after_day14.png (Wear 0 and your values, same view)", "uk": "before_after_day14.png (Wear 0 і твої значення, той самий ракурс)"}, {"en": "flythrough_day14.mp4 (60 seconds)", "uk": "flythrough_day14.mp4 (60 секунд)"}, {"en": "summary.md", "uk": "звіт дня (summary.md)"}], "goal": {"en": "By the end of today you have painted wear masks for four kit pieces and a Wear slider in M_Master, so each piece can age from new (0) to old (1) in L_KitTest.", "uk": "Наприкінці сьогоднішнього дня в тебе є намальовані маски зношеності для чотирьох деталей набору й повзунок Wear у M_Master, тож у L_KitTest кожна деталь може старіти від нової (0) до старої (1)."}, "uses": [{"en": "Day 11: your kit's UVs in quaykit_day11.blend (the first UV map stays as it is)", "uk": "День 11: UV твого набору в quaykit_day11.blend (перша UV-розгортка лишається як є)"}, {"en": "Day 12: M_Master and its instances MI_Stone, MI_Plaster and MI_Wood", "uk": "День 12: M_Master та його інстанси MI_Stone, MI_Plaster і MI_Wood"}, {"en": "Day 13: SM_ShopFront_A, MI_Trim_Harbour and buildkit_day13.blend", "uk": "День 13: SM_ShopFront_A, MI_Trim_Harbour і buildkit_day13.blend"}], "quiz": [{"q": {"en": "Why does painting need a second UV map?", "uk": "Навіщо для малювання друга UV-розгортка?"}, "options": [{"en": "Unreal can only read two maps", "uk": "Unreal може читати лише дві розгортки"}, {"en": "The first map has too many triangles", "uk": "Перша розгортка має забагато трикутників"}, {"en": "Each spot needs its own pixels, so islands must sit inside the square with no overlaps", "uk": "Кожній точці потрібні власні пікселі, тож острівці мають лежати всередині квадрата без перекриттів"}, {"en": "Second maps are brighter", "uk": "Другі розгортки яскравіші"}], "answer": 2, "explain": {"en": "Your Day 11 map lets islands overlap and run outside the square, which is fine for tiling. A mask needs a unique spot for every part of the model.", "uk": "Твоя розгортка з Дня 11 дозволяє острівцям перекриватися й виходити за квадрат, і для тайлінгу це нормально. Масці потрібне унікальне місце для кожної частини моделі."}}, {"q": {"en": "You painted salt on the quay edge, closed Blender, and the next day the paint is gone. What happened?", "uk": "Ти малюєш сіль на краю набережної, закриваєш Blender, а наступного дня розпису немає. Що сталося?"}, "options": [{"en": "The FBX was too big", "uk": "FBX був завеликий"}, {"en": "Unreal deleted the UV map", "uk": "Unreal видалив UV-розгортку"}, {"en": "Smart UV Project erases paint", "uk": "Smart UV Project стирає розпис"}, {"en": "The image was never saved or packed: unsaved images live only in memory", "uk": "Зображення не збережено й не запаковано: незбережені зображення живуть лише в пам'яті"}], "answer": 3, "explain": {"en": "A painted image is not part of the .blend until you save it or pack it. Save, pack, then save the file.", "uk": "Намальоване зображення не є частиною .blend, доки ти його не збережеш або не запакуєш. Збережи, запакуй, потім збережи файл."}}, {"q": {"en": "In M_Master, what does the Lerp do with the wear amount?", "uk": "Що робить Lerp у M_Master з кількістю зношеності?"}, "options": [{"en": "It blends from the clean colour (A) to the worn colour (B) by the amount in Alpha", "uk": "Змішує чистий колір (A) зі зношеним (B) за значенням в Alpha"}, {"en": "It adds triangles where the wear is", "uk": "Додає трикутники там, де є зношеність"}, {"en": "It turns the mask into collision", "uk": "Перетворює маску на колізію"}], "answer": 0, "explain": {"en": "At wear amount 0 you get the clean colour; at 1, the worn colour. Values between mix the two.", "uk": "При кількості зношеності 0 виходить чистий колір; при 1 — зношений. Значення між ними змішують обидва."}}, {"q": {"en": "At Wear 1 your whole wall turns pale grey, not just the bottom. What is the likely cause?", "uk": "При Wear 1 уся стіна стає блідо-сірою, а не лише низ. Яка найімовірніша причина?"}, "options": [{"en": "Wear must never go above 0.5", "uk": "Wear ніколи не має перевищувати 0.5"}, {"en": "WearMask reads UV channel 0 instead of 1, or the mask is white everywhere", "uk": "WearMask читає UV-канал 0 замість 1, або маска скрізь біла"}, {"en": "The wall has no collision", "uk": "Стіна не має колізії"}, {"en": "The sun is too high", "uk": "Сонце зависоко"}], "answer": 1, "explain": {"en": "The mask should be mostly black. Check its TexCoord uses Coordinate Index 1 and that the painted image is mostly black.", "uk": "Маска має бути здебільшого чорною. Перевір, що її TexCoord має Coordinate Index 1, а намальоване зображення здебільшого чорне."}}, {"q": {"en": "Which piece should get the highest Wear?", "uk": "Якій деталі потрібен найвищий Wear?"}, "options": [{"en": "A wall in a sheltered back street", "uk": "Стіні в захищеному тихому провулку"}, {"en": "A new shop front by the square", "uk": "Новому фасаду крамниці біля площі"}, {"en": "The quay edge where waves splash and ropes rub", "uk": "Краю набережної, де б'ють хвилі й труться мотузки"}], "answer": 2, "explain": {"en": "Wear follows its cause. The quay edge meets water, salt and boats every day.", "uk": "Зношеність іде за своєю причиною. Край набережної щодня зустрічається з водою, сіллю й човнами."}}], "weekInfo": {"week": 3, "title": {"en": "Surfaces", "uk": "Поверхні"}, "goal": {"en": "By Friday you have your whole harbour kit unwrapped at one texel density, textured with M_Master instances and a trim sheet, weathered with painted wear masks and a Wear slider, and shown beside real harbour photos.", "uk": "До п'ятниці в тебе є весь портовий набір: розгорнутий з однією щільністю текселів, затекстурований інстансами M_Master і трим-шитом, зістарений намальованими масками зношеності й повзунком Wear і показаний поруч зі справжніми фото гавані."}, "skills": [{"en": "UV unwrapping with clean seams and consistent texel density for modular kits", "uk": "UV-розгортка з акуратними швами й однаковою щільністю текселів для модульних наборів"}, {"en": "PBR material authoring: master materials and material instances in Unreal Engine 5", "uk": "Створення PBR-матеріалів: майстер-матеріали та інстанси матеріалів в Unreal Engine 5"}, {"en": "Trim sheet design and UV layout for modular environment kits", "uk": "Дизайн трим-шитів і UV-розкладка для модульних наборів оточення"}, {"en": "Texture painting and parameter-driven weathering (wear masks on a second UV channel)", "uk": "Малювання текстур і зношеність, керована параметрами (маски зношеності на другому UV-каналі)"}, {"en": "Look-development review against real photo reference", "uk": "Перевірка вигляду (look development) за справжніми фото-референсами"}]}, "morning": {"sofar": {"en": "You have a textured harbour kit, a trim sheet and your first shop front, SM_ShopFront_A, standing in L_KitTest.", "uk": "У тебе є текстурований портовий набір, трим-шит і перша вітрина, SM_ShopFront_A, яка вже стоїть у L_KitTest."}, "today": {"en": "You paint salt, sun and edge wear onto four kit pieces and add a Wear slider to M_Master, so each piece can age from new to old.", "uk": "Сьогодні ти малюєш сіль, вигоряння на сонці й потертості країв на чотирьох частинах набору й додаєш до M_Master повзунок Wear, щоб кожна частина могла старіти від нової до старої."}, "cheer": {"en": "Wear is about observation, not perfection: look at your photos, paint a little, and look again.", "uk": "Зношеність — це про спостережливість, а не про досконалість: подивись на фото, трохи помалюй і подивись знову."}, "quote": {"text": {"en": "A work-room should be like an old shoe; no matter how shabby, it's better than a new one.", "uk": "Робоча кімната має бути як старий черевик: хай яка вона пошарпана, вона все одно краща за нову."}, "author": {"en": "Willa Cather", "uk": "Вілла Кезер"}, "source": "https://en.wikiquote.org/wiki/Willa_Cather"}}, "hasAssets": false, "workPath": "Work\\Assignment\\Day-14-texture-painting-and-wear", "mapHref": "../../COURSE.html", "prevHref": "../Day-13-trim-sheet-and-shop-front/START-HERE.html", "nextHref": "../Day-17-seamless-textures/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Blender and Unreal Engine 5.8. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me and don't write code. Keep me moving and make it feel like a game.\n\nToday I build on my own: SM_Wall_Door, SM_PierDeck_4m and SM_ShopFront_A, on your own.\nIt's part of: Wear masks painted in Blender and a Wear slider on the kit's instances (L_KitTest: the quay edge, the door wall, the pier deck and the shop front.).\n\nSpec:\n- Each painted piece gets a second UV map named Paint (Smart UV Project: islands inside the square, none overlapping); the first map stays exactly as it is.\n- A 1024 x 1024 mask per piece, T_<Piece>_Wear (a mask is a black-and-white image: white means worn, black means clean).\n- Wear only where its cause is: salt rising 10 to 40 cm from the bottom near the water, sun fade on top surfaces, edge wear on corners and where people touch. Most of each mask stays black.\n- M_Master gains four parameters: WearMask (read from UV channel 1, the Paint map), Wear (0 to 1), WornColour and WornRoughness.\n- A child instance for each piece's main slot (for example MI_Stone_QuayEdge, whose parent is MI_Stone), with its own WearMask and Wear.\n- Every painted image saved as a PNG and packed into the .blend before export; in Unreal, Generate Lightmap UVs is off on each painted mesh, so Unreal can't write over the Paint map.\n- Four pieces done: SM_QuayEdge_4m, SM_Wall_Door, SM_PierDeck_4m and SM_ShopFront_A.\n\nMy checklist:\n1. Collect four photos of old harbour walls, doors and timber decks from Wikimedia Commons and credit them. In Krita, circle where salt, sun fade and edge wear show. Check: wear_references.png shows four photos with circles, and credits.md lists them. (from lesson 2)\n2. SM_PierDeck_4m (in quaykit_day14.blend, the file from the lessons): add the Paint map, then paint T_PierDeck_Wear: a faint sun fade over the top, a soft worn band along the middle where people walk, and edge wear where boats rub. Save it. Check: the walking band is soft and uneven, not a ruled stripe. (from lesson 2)\n3. Open buildkit_day13.blend and save it as buildkit_day14.blend. SM_Wall_Door: add the Paint UV map and Smart UV Project it, as in lesson 1. Check: in the UV Editor, the Paint map's islands sit inside the square with no overlaps. (from lesson 1)\n4. Paint T_WallDoor_Wear: salt rising from the bottom, edge wear round the door opening and on the handle side. Save the image at once (Image > Save As). Check: from the front, most of the wall is still black. (from lesson 2)\n5. SM_ShopFront_A: add the Paint map, then paint T_ShopFront_A_Wear: salt on the plinth, wear on the door edges and the sill. Save it. Check: the fascia and the window frame stay mostly clean. (from lesson 2)\n6. Pack and save both files (quaykit_day14.blend and buildkit_day14.blend): File > External Data > Pack Resources, then File > Save. Close Blender and open each file again. Check: all four masks still show their paint. (from lesson 3)\n7. Export SM_Wall_Door, SM_PierDeck_4m and SM_ShopFront_A over their FBX files and Reimport them in Unreal. In each Static Mesh Editor, check that Generate Lightmap UVs is off (untick it and Apply Changes if not), as in lesson 3. Import the three masks into Course/Day14. Check: in each Static Mesh Editor, UV > UV Channel 1 shows that piece's Paint layout. (from lesson 3)\n8. Child instances for each piece's main slot: MI_Plaster_WallDoor (parent MI_Plaster), MI_Wood_PierDeck (parent MI_Wood) and MI_Trim_ShopFront_A (parent MI_Trim_Harbour), each with its WearMask, set on the mesh asset. Check: dragging Wear from 0 to 1 ages each piece in the viewport. (If an instance shows an error about the sampler type, open the mask texture and make sure sRGB is ticked, the default.) (from lesson 4)\n9. Set WornColour from your photos: a pale salt grey for stone and plaster, a silver grey for old timber; WornRoughness 0.9. Check: at Wear 1 the worn parts look dry and faded, not dirty. (from lesson 4)\n10. Choose Wear by where each piece usually stands: quay edge and pier deck 0.7 to 0.8 (waves, salt and boats), the door wall 0.5, the shop front 0.4. Write the values in wear_map.md. Check: from 10 m the kit looks used but not dirty. (from lesson 4)\n11. Before/after capture: L_KitTest from the same view with every Wear at 0 and at your chosen values. Then a 60-second clip flying low along the quay. Save today's clip as flythrough_day14.mp4 and check that you also have T_WallDoor_Wear.png, T_PierDeck_Wear.png, T_ShopFront_A_Wear.png, m_master_wear.png and before_after_day14.png (each is described in today's hand-in list; take any you are missing now). Check: the salt line and the worn edges show in the clip. (from lesson 4)\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Misha\nDay 14: Texture painting and wear: salt, sun and edges, with a Wear slider. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

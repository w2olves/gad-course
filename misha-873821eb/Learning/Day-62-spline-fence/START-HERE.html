<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 62</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

st Scale; рейки йдуть за схилом, мають довжину рівно Spacing (Scale X = Spacing / 100) і товщину 5 см (Scale Y і Z = 0.05)."}, {"en": "Edge cases work: a spline shorter than Spacing gives 1 post and no rails; a 100 m spline rebuilds at once when you drag a point. No Event Graph code and no Tick.", "uk": "Крайні випадки працюють: сплайн коротший за Spacing дає 1 стовп і жодної рейки; сплайн завдовжки 100 м одразу перебудовується, коли ти тягнеш точку. Жодного коду в Event Graph і жодного Tick."}, {"en": "L_Day62 saved with an S-shaped fence and a fence with a sharp corner; one fence on your island with every post on the ground and nothing floating.", "uk": "L_Day62 збережено з парканом S-подібної форми й парканом із різким кутом; один паркан на твоєму острові, кожен стовп на землі, і нічого не висить у повітрі."}], "piece1": "Posts along the spline (built step by step in the lessons)", "piece2": {"en": "Rails between the posts, and a fence on your island, on your own", "uk": "Рейки між стовпами й паркан на твоєму острові, самостійно"}, "steps": [{"text": {"en": "Open BP_SplineFence and check it against the spec: the Path and Posts components, Spacing and Post Scale (Instance Editable, Category Tool, ranges, tooltips), and the post chain Clear Instances > For Loop (0 to Gaps) > Add Instance with the upright rotation. Click Compile. Check: a green tick, and the Compiler Results panel shows no warnings.", "uk": "Відкрий BP_SplineFence і звір зі специфікацією: компоненти Path і Posts, Spacing і Post Scale (Instance Editable, категорія Tool, діапазони, підказки) та ланцюжок для стовпів Clear Instances > For Loop (від 0 до Gaps) > Add Instance з вертикальним поворотом. Натисни Compile. Перевірка: зелена позначка, а панель Compiler Results не показує попереджень."}, "lesson": 4}, {"text": {"en": "In L_Day62 place a BP_SplineFence and shape an S-curve of about 20 m with at least four points (Alt+drag a point to add one). Check: posts follow the S at an even spacing, and the last post stands less than one Spacing from the end point.", "uk": "У L_Day62 розмісти BP_SplineFence і сформуй S-подібну криву приблизно 20 м щонайменше з чотирма точками (Alt+перетягування точки додає нову). Перевірка: стовпи йдуть за S з рівними проміжками, а останній стовп стоїть на відстані менше одного Spacing від кінцевої точки."}, "lesson": 1}, {"text": {"en": "Add the Rails component (Instanced Static Mesh, mesh /Engine/BasicShapes/Cube) and a Float variable Rail Height (default 90, ranges 20 to 300, Instance Editable, Category Tool, tooltip Height of the rail above the ground, in centimetres). Add Clear Instances for Rails right after the one for Posts. Check: Rail Height shows under Tool on a placed fence, and the Blueprint compiles.", "uk": "Додай компонент Rails (Instanced Static Mesh, модель /Engine/BasicShapes/Cube) і змінну Float Rail Height (за замовчуванням 90, діапазони від 20 до 300, Instance Editable, категорія Tool, підказка Height of the rail above the ground, in centimetres). Додай Clear Instances для Rails одразу після того, що для Posts. Перевірка: Rail Height показується під Tool на розміщеному паркані, і Blueprint компілюється."}, "lesson": "D61.2"}, {"text": {"en": "From the post loop's Completed pin add a second For Loop: First Index 0, Last Index = Gaps minus 1 (a Subtract node, as on Day 61). Distance = (Index + 0.5) x Spacing, into a new Get Transform at Distance Along Spline (Coordinate Space Local). Print String the Distance for a moment. Check: for Spacing 200 you see 100, 300, 500 and so on in the Output Log; then delete the Print String.", "uk": "Від піна Completed циклу стовпів додай другий For Loop: First Index 0, Last Index = Gaps мінус 1 (вузол Subtract, як у День 61). Distance = (Index + 0.5) x Spacing, у новий Get Transform at Distance Along Spline (Coordinate Space Local). На мить виведи Distance через Print String. Перевірка: для Spacing 200 в Output Log ти бачиш 100, 300, 500 і так далі; потім видали Print String."}, "lesson": 3}, {"text": {"en": "Break Transform the rail's transform. Add Make Vector (0, 0, Rail Height) to its Location with an Add node. Make Transform from that location, the full Rotation, and Scale = Make Vector (Spacing / 100, 0.05, 0.05). Connect it to Rails: Add Instance. Check: one rail between each pair of posts, at Rail Height, touching both posts.", "uk": "Застосуй Break Transform до трансформу рейки. Додай Make Vector (0, 0, Rail Height) до його Location вузлом Add. Зроби Make Transform з цього розташування, повного Rotation і Scale = Make Vector (Spacing / 100, 0.05, 0.05). З'єднай його з Rails: Add Instance. Перевірка: по одній рейці між кожною парою стовпів, на висоті Rail Height, що торкається обох стовпів."}, "lesson": 4}, {"text": {"en": "Edge tests: drag the end point back until the spline is shorter than Spacing; then stretch it to about 100 m; then raise one middle point 3 m. Check: 1 post and no rails, then a long fence that rebuilds smoothly, then upright posts with rails sloping between them.", "uk": "Тести крайніх випадків: тягни кінцеву точку назад, доки сплайн не стане коротшим за Spacing; потім розтягни його приблизно до 100 м; потім підніми одну середню точку на 3 м. Перевірка: 1 стовп і жодної рейки, потім довгий паркан, що плавно перебудовується, потім вертикальні стовпи з рейками, що нахилені між ними."}, "lesson": 4}, {"text": {"en": "Right-click one spline point > Spline Point Type > Linear and pull its neighbours into a right angle. Check: a sharp corner where the curve was round, with posts and rails still following the line.", "uk": "Клацни правою кнопкою на одній точці сплайна > Spline Point Type > Linear і зведи її сусідів у прямий кут. Перевірка: різкий кут там, де крива була округлою, а стовпи й рейки далі йдуть за лінією."}, "lesson": 1}, {"text": {"en": "Save L_Day62. Open your island level (L_Island, or your own level if you followed the fast track) and place one BP_SplineFence along a real edge; snap its points to the ground and add points wherever the ground changes. Check: from about 30 m up the fence follows the edge, every post stands on the ground, and nothing floats.", "uk": "Збережи L_Day62. Відкрий рівень свого острова (L_Island або власний рівень, якщо ти проходиш курс швидким шляхом) і розмісти один BP_SplineFence уздовж реального краю; прив'яжи його точки до землі й додай точки всюди, де земля змінюється. Перевірка: приблизно з 30 м угорі паркан іде за краєм, кожен стовп стоїть на землі, і нічого не висить."}, "lesson": 4}, {"text": {"en": "Take fence_graph.png (the whole Construction Script of BP_SplineFence, node names readable), fence_day62.png (L_Day62 from above) and island_day62.png (your fence on the island). Check: three pictures in today's Work folder, and you can read the node names in the first.", "uk": "Зроби fence_graph.png (весь Construction Script у BP_SplineFence, назви вузлів читаються), fence_day62.png (L_Day62 зверху) і island_day62.png (твій паркан на острові). Перевірка: три картинки в сьогоднішній папці Work, і на першій можна прочитати назви вузлів."}, "lesson": 1}, {"text": {"en": "Record flythrough_day62.mp4 (60 seconds): drag spline points, add a point, and change Spacing, Post Scale and Rail Height while the fence rebuilds. Check: the clip is in today's Work folder and shows at least four live changes.", "uk": "Запиши flythrough_day62.mp4 (60 секунд): тягни точки сплайна, додай точку й змінюй Spacing, Post Scale і Rail Height, поки паркан перебудовується. Перевірка: кліп лежить у сьогоднішній папці Work і показує щонайменше чотири зміни наживо."}, "lesson": 4}, {"text": {"en": "Add a BP_SplineFence section to tool_notes.md: one line per variable (what it does and its range), and one line on the fencepost rule in your own words. Check: the section has at least four lines.", "uk": "Додай до tool_notes.md розділ про BP_SplineFence: по одному рядку на змінну (що вона робить і який її діапазон) і один рядок про правило стовпа огорожі своїми словами. Перевірка: у розділі щонайменше чотири рядки."}, "lesson": 3}, {"text": {"en": "Click Copy the day report, paste it into a new tutor chat, answer its questions and save its answer as summary.md. Check: summary.md is in today's Work folder with Made, To look at, Hours and To revisit filled in.", "uk": "Натисни Copy the day report, встав його в новий чат із тьютором, дай відповіді на його запитання й збережи його відповідь як summary.md. Перевірка: summary.md лежить у сьогоднішній папці Work із заповненими Made, To look at, Hours і To revisit."}, "lesson": 4}], "assets": ["techart/code-style.md"]}, "lessons": [{"title": {"en": "Splines: a line you can draw in the level", "uk": "Сплайни: лінія, яку можна намалювати на рівні"}, "minutes": 40, "goals": [{"en": "Explain a spline: a smooth line through points you place in the level, which a Blueprint can read at any distance along it.", "uk": "Поясни, що таке сплайн: гладка лінія через точки, які ти ставиш на рівні, і яку Blueprint може зчитати на будь-якій відстані вздовж неї."}, {"en": "Add a Spline component to a new Blueprint and shape it in the level: add, move and delete points.", "uk": "Додай компонент Spline до нового Blueprint і сформуй його на рівні: додавай, пересувай і видаляй точки."}, {"en": "Read the spline's length with Get Spline Length and Print String.", "uk": "Зчитай довжину сплайна через Get Spline Length і Print String."}], "doalong": [{"en": "In Content/Tools create the folder Day62, then choose File > New Level > Basic and save it as L_Day62 in Content/Tools/Day62. In Content/Tools/Blueprints right-click > Blueprint Class > Actor, name it BP_SplineFence and open it. You see an empty Blueprint with only a DefaultSceneRoot.", "uk": "У Content/Tools створи папку Day62, потім вибери File > New Level > Basic і збережи як L_Day62 у Content/Tools/Day62. У Content/Tools/Blueprints клацни правою кнопкою > Blueprint Class > Actor, назви його BP_SplineFence і відкрий. Ти бачиш порожній Blueprint лише з DefaultSceneRoot."}, {"en": "In the Components panel click + Add, type Spline and choose it; name it Path. Compile, Save, and drag BP_SplineFence into L_Day62. You see a thin white line about 1 m long with a small point at each end.", "uk": "На панелі Components натисни + Add, введи Spline і вибери його; назви його Path. Натисни Compile, Save і перетягни BP_SplineFence у L_Day62. Ти бачиш тонку білу лінію завдовжки близько 1 м з маленькою точкою на кожному кінці."}, {"en": "In the level click the end point of the line and drag it with the move arrows to about 10 m away. Then hold Alt and drag that point: a new point appears. Make an S-shape with four points. You see a smooth curve through your points.", "uk": "На рівні клацни кінцеву точку лінії й перетягни її стрілками пересування приблизно на 10 м. Потім утримуй Alt і тягни цю точку: з'явиться нова точка. Зроби S-подібну форму з чотирьох точок. Ти бачиш гладку криву через свої точки."}, {"en": "Right-click the line between two points and choose Add Spline Point Here; then click a point and press Delete. You see a point appear and disappear, and the curve smooth itself each time.", "uk": "Клацни правою кнопкою на лінії між двома точками й вибери Add Spline Point Here; потім клацни точку й натисни Delete. Ти бачиш, як точка з'являється й зникає, а крива щоразу вирівнюється."}, {"en": "In BP_SplineFence's Construction Script drag in Path (Get), drag from its pin and add Get Spline Length (if it is not offered, untick Context Sensitive and search again); connect its result to a Print String's In String, and the Construction Script's white pin to Print String. Compile, open Window > Output Log and move a point in the level. You see the length in centimetres every time the curve changes (2000 means 20 m). Delete the Print String when you are done.", "uk": "У Construction Script BP_SplineFence перетягни Path (Get), потягни від його піна й додай Get Spline Length (якщо його не пропонує, зніми позначку Context Sensitive і пошукай ще раз); з'єднай його результат з In String у Print String, а білий пін Construction Script з Print String. Натисни Compile, відкрий Window > Output Log і пересунь точку на рівні. Ти бачиш довжину в сантиметрах щоразу, коли крива змінюється (2000 означає 20 м). Коли закінчиш, видали Print String."}], "play": {"en": "Spline or not: the tutor names six level jobs (a fence along a cliff, one statue, a river bank, a row of trees on a curving road, a door, a power line). For each I say whether a spline tool fits and why.", "uk": "Сплайн чи ні: тьютор називає шість завдань рівня (паркан уздовж скелі, одна статуя, берег річки, ряд дерев уздовж звивистої дороги, двері, лінія електропередач). Для кожного я кажу, чи підходить сплайн-інструмент, і чому."}, "video": {"search": "unreal engine 5 blueprint spline component construction script beginners"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Splines: a line you can draw in the level (Day 62, lesson 1 of 4).\nToday's build: BP_SplineFence: a fence tool that lays posts at an even spacing along a spline you shape in the level, with rails between the posts, plus one fence on your island.\n\nBy the end of this lesson I can:\n1. Explain a spline: a smooth line through points you place in the level, which a Blueprint can read at any distance along it.\n2. Add a Spline component to a new Blueprint and shape it in the level: add, move and delete points.\n3. Read the spline's length with Get Spline Length and Print String.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (You have BP_BollardRow and BP_PlanterRow: two tools that lay rows of meshes from numbers, built with a Construction Script and a loop.), what I will learn today (You make a fence that follows any line you draw, using a spline and a little arithmetic.), encourage me (A curve is only many small straight steps; take the nodes one at a time and your fence will bend wherever you lead it.), and share today's quote: \"Little strokes fell great oaks.\" (Benjamin Franklin).\n2. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n3. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n4. Game for this lesson: Spline or not: the tutor names six level jobs (a fence along a cliff, one statue, a river bank, a row of trees on a curving road, a door, a power line). For each I say whether a spline tool fits and why.\n5. Do-along on today's build (Posts along the spline (built step by step in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - In Content/Tools create the folder Day62, then choose File > New Level > Basic and save it as L_Day62 in Content/Tools/Day62. In Content/Tools/Blueprints right-click > Blueprint Class > Actor, name it BP_SplineFence and open it. You see an empty Blueprint with only a DefaultSceneRoot.\n   - In the Components panel click + Add, type Spline and choose it; name it Path. Compile, Save, and drag BP_SplineFence into L_Day62. You see a thin white line about 1 m long with a small point at each end.\n   - In the level click the end point of the line and drag it with the move arrows to about 10 m away. Then hold Alt and drag that point: a new point appears. Make an S-shape with four points. You see a smooth curve through your points.\n   - Right-click the line between two points and choose Add Spline Point Here; then click a point and press Delete. You see a point appear and disappear, and the curve smooth itself each time.\n   - In BP_SplineFence's Construction Script drag in Path (Get), drag from its pin and add Get Spline Length (if it is not offered, untick Context Sensitive and search again); connect its result to a Print String's In String, and the Construction Script's white pin to Print String. Compile, open Window > Output Log and move a point in the level. You see the length in centimetres every time the curve changes (2000 means 20 m). Delete the Print String when you are done.\n6. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n7. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Posts at a distance along the spline", "uk": "Стовпи на відстані вздовж сплайна"}, "minutes": 40, "goals": [{"en": "Use Get Transform at Distance Along Spline: give it a distance in centimetres from the start, and it gives back a position and a rotation at that point of the curve.", "uk": "Використай Get Transform at Distance Along Spline: дай йому відстань у сантиметрах від початку, і він поверне позицію та поворот у цій точці кривої."}, {"en": "Lay posts with a For Loop in which the distance is Index x Spacing.", "uk": "Розстав стовпи циклом For Loop, у якому відстань дорівнює Index x Spacing."}, {"en": "Choose the Coordinate Space Local, because Add Instance places instances in the actor's own space.", "uk": "Обери Coordinate Space Local, бо Add Instance розміщує інстанси у власному просторі актора."}], "doalong": [{"en": "Add an Instanced Static Mesh component named Posts and set its Static Mesh to SM_RailingPost (or /Engine/BasicShapes/Cylinder; leave the component's Scale at 1, 1, 1, because a component's scale also squeezes the spacing; lesson 4 makes the cylinder thin). Add a Float variable Spacing: default 200, Instance Editable, Category Tool, both ranges 50 to 1000, tooltip Distance between posts, in centimetres. Compile. You see Spacing under Tool on the placed fence.", "uk": "Додай компонент Instanced Static Mesh на ім'я Posts і встанови його Static Mesh на SM_RailingPost (або /Engine/BasicShapes/Cylinder; залиш Scale компонента на 1, 1, 1, бо масштаб компонента стискає й проміжки; на уроці 4 циліндр стає тонким). Додай змінну Float Spacing: за замовчуванням 200, Instance Editable, категорія Tool, обидва діапазони від 50 до 1000, підказка Distance between posts, in centimetres. Натисни Compile. Ти бачиш Spacing під Tool на розміщеному паркані."}, {"en": "In the Construction Script build the start you know from Day 61: Construction Script > Posts: Clear Instances > For Loop. For now type 9 into Last Index. You see the same opening as BP_BollardRow.", "uk": "У Construction Script збудуй початок, який ти знаєш з Дня 61: Construction Script > Posts: Clear Instances > For Loop. Поки що введи 9 у Last Index. Ти бачиш той самий початок, що в BP_BollardRow."}, {"en": "Drag in Path (Get), drag from its pin and type Get Transform at Distance Along Spline; set its Coordinate Space to Local. If the node is not offered, untick Context Sensitive at the top of the search menu and search again; if it is still missing, use Get Location at Distance Along Spline and plug its result into a Make Transform's Location. You see a node with a Distance input and a Return Value transform.", "uk": "Перетягни Path (Get), потягни від його піна й введи Get Transform at Distance Along Spline; встанови його Coordinate Space на Local. Якщо вузол не пропонується, зніми позначку Context Sensitive угорі меню пошуку й пошукай ще раз; якщо його досі немає, візьми Get Location at Distance Along Spline і підключи його результат до Location у Make Transform. Ти бачиш вузол із входом Distance і трансформом Return Value."}, {"en": "Multiply the For Loop's Index by Spacing and connect the result to Distance. From Loop Body add Posts: Add Instance, with Instance Transform = the Return Value. Compile. You see 10 posts following the curve, 2 m apart, each turned along the line.", "uk": "Помнож Index вузла For Loop на Spacing і з'єднай результат із Distance. Від Loop Body додай Posts: Add Instance, де Instance Transform = Return Value. Натисни Compile. Ти бачиш 10 стовпів, що йдуть за кривою, на відстані 2 м один від одного, кожен повернутий уздовж лінії."}, {"en": "Drag the last spline point far away, then close to the start. You see 10 posts every time: too few on a long curve, and on a short one the extra posts pile up at the end point, because a distance past the end stays at the end. Lesson 3 fixes the count.", "uk": "Відтягни останню точку сплайна далеко, а потім близько до початку. Ти щоразу бачиш 10 стовпів: замало на довгій кривій, а на короткій зайві стовпи нагромаджуються в кінцевій точці, бо відстань за кінцем лишається в кінці. Урок 3 виправляє кількість."}], "play": {"en": "Distance drill: the tutor gives me a Spacing and an Index (200 and 3; 150 and 0; 250 and 8). I say the distance in centimetres and in metres before I check it with Print String.", "uk": "Тренування з відстаней: тьютор дає мені Spacing і Index (200 і 3; 150 і 0; 250 і 8). Я називаю відстань у сантиметрах і в метрах, перш ніж перевірити її через Print String."}, "video": {"search": "unreal engine 5 get transform at distance along spline instanced static mesh"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Posts at a distance along the spline (Day 62, lesson 2 of 4).\nToday's build: BP_SplineFence: a fence tool that lays posts at an even spacing along a spline you shape in the level, with rails between the posts, plus one fence on your island.\nEarlier today I already did: lesson 1 (Splines: a line you can draw in the level). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Use Get Transform at Distance Along Spline: give it a distance in centimetres from the start, and it gives back a position and a rotation at that point of the curve.\n2. Lay posts with a For Loop in which the distance is Index x Spacing.\n3. Choose the Coordinate Space Local, because Add Instance places instances in the actor's own space.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Distance drill: the tutor gives me a Spacing and an Index (200 and 3; 150 and 0; 250 and 8). I say the distance in centimetres and in metres before I check it with Print String.\n4. Do-along on today's build (Posts along the spline (built step by step in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Add an Instanced Static Mesh component named Posts and set its Static Mesh to SM_RailingPost (or /Engine/BasicShapes/Cylinder; leave the component's Scale at 1, 1, 1, because a component's scale also squeezes the spacing; lesson 4 makes the cylinder thin). Add a Float variable Spacing: default 200, Instance Editable, Category Tool, both ranges 50 to 1000, tooltip Distance between posts, in centimetres. Compile. You see Spacing under Tool on the placed fence.\n   - In the Construction Script build the start you know from Day 61: Construction Script > Posts: Clear Instances > For Loop. For now type 9 into Last Index. You see the same opening as BP_BollardRow.\n   - Drag in Path (Get), drag from its pin and type Get Transform at Distance Along Spline; set its Coordinate Space to Local. If the node is not offered, untick Context Sensitive at the top of the search menu and search again; if it is still missing, use Get Location at Distance Along Spline and plug its result into a Make Transform's Location. You see a node with a Distance input and a Return Value transform.\n   - Multiply the For Loop's Index by Spacing and connect the result to Distance. From Loop Body add Posts: Add Instance, with Instance Transform = the Return Value. Compile. You see 10 posts following the curve, 2 m apart, each turned along the line.\n   - Drag the last spline point far away, then close to the start. You see 10 posts every time: too few on a long curve, and on a short one the extra posts pile up at the end point, because a distance past the end stays at the end. Lesson 3 fixes the count.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "The fencepost rule: count from the length", "uk": "Правило стовпа огорожі: рахуй за довжиною"}, "minutes": 40, "goals": [{"en": "Explain the fencepost rule: a fence with 5 gaps has 6 posts, so this loop runs from 0 to Gaps, not to Gaps minus 1.", "uk": "Поясни правило стовпа огорожі: у паркані з 5 проміжками 6 стовпів, тож цей цикл іде від 0 до Gaps, а не до Gaps мінус 1."}, {"en": "Work out Gaps from the spline: Get Spline Length divided by Spacing, then Truncate (drop the decimals) to get a whole number.", "uk": "Обчисли Gaps зі сплайна: Get Spline Length, поділена на Spacing, потім Truncate (відкинути десяткову частину), щоб отримати ціле число."}, {"en": "Explain why the last post may stop short of the spline's end, and how to make it land exactly.", "uk": "Поясни, чому останній стовп може не доходити до кінця сплайна, і як зробити, щоб він став точно в кінці."}], "doalong": [{"en": "On paper, draw a 10 m line with posts every 2 m. Count the gaps and the posts. You see 5 gaps and 6 posts, at 0, 2, 4, 6, 8 and 10 m.", "uk": "На папері намалюй лінію 10 м зі стовпами через кожні 2 м. Порахуй проміжки й стовпи. Ти бачиш 5 проміжків і 6 стовпів, на 0, 2, 4, 6, 8 і 10 м."}, {"en": "In the Construction Script drag Get Spline Length from Path again, add a Division node, and connect Spacing to its lower input. Drag from the result and type Truncate. You see a node that turns 5.7 into 5: a Float becomes an Integer by dropping its decimals.", "uk": "У Construction Script знову перетягни Get Spline Length з Path, додай вузол Division і з'єднай Spacing з його нижнім входом. Потягни від результату й введи Truncate. Ти бачиш вузол, що перетворює 5.7 на 5: Float стає Integer, коли відкинути його десяткову частину."}, {"en": "Connect Truncate's result to the For Loop's Last Index (no Subtract this time). Compile and make the spline just over 10 m long, between 1000 and 1010 (watch the length with a Print String). You see 6 posts with Spacing 200: one at each end. At exactly 1000 the length can print as 999.99, because computers store decimals with tiny errors, and Truncate then drops a gap.", "uk": "З'єднай результат Truncate з Last Index вузла For Loop (цього разу без Subtract). Натисни Compile і зроби сплайн трохи довшим за 10 м, від 1000 до 1010 (стеж за довжиною через Print String). Ти бачиш 6 стовпів при Spacing 200: по одному на кожному кінці. Рівно при 1000 довжина може вивестися як 999.99, бо комп'ютери зберігають десяткові числа з крихітними похибками, і тоді Truncate відкидає один проміжок."}, {"en": "Make the spline about 10.9 m long. You see still 6 posts; the last stands 0.9 m before the end, because 10.9 / 2 = 5.45 is truncated to 5 gaps. Tell the tutor two ways to make a post land exactly at the end (change Spacing, or move the end point).", "uk": "Зроби сплайн приблизно 10,9 м завдовжки. Ти досі бачиш 6 стовпів; останній стоїть за 0,9 м до кінця, бо 10.9 / 2 = 5.45 відкидається до 5 проміжків. Скажи тьюторові два способи зробити так, щоб стовп став точно в кінці (змінити Spacing або пересунути кінцеву точку)."}, {"en": "Print String the Truncate result while you stretch the spline slowly, then delete the Print String. You see Gaps grow by one each time the length passes another multiple of Spacing.", "uk": "Виводь результат Truncate через Print String, поки повільно розтягуєш сплайн, а потім видали Print String. Ти бачиш, що Gaps росте на одиницю щоразу, коли довжина проходить ще одне кратне Spacing."}], "play": {"en": "Fencepost quiz: the tutor gives lengths and spacings (30 m and 3 m; 7.5 m and 2 m; 1 m and 2 m). I say the gaps, the posts and where the last post stands.", "uk": "Вікторина про стовп огорожі: тьютор дає довжини й проміжки (30 м і 3 м; 7,5 м і 2 м; 1 м і 2 м). Я називаю кількість проміжків, стовпів і де стоїть останній стовп."}, "video": {"search": "fencepost error off by one explained"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: The fencepost rule: count from the length (Day 62, lesson 3 of 4).\nToday's build: BP_SplineFence: a fence tool that lays posts at an even spacing along a spline you shape in the level, with rails between the posts, plus one fence on your island.\nEarlier today I already did: lesson 1 (Splines: a line you can draw in the level); lesson 2 (Posts at a distance along the spline). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Explain the fencepost rule: a fence with 5 gaps has 6 posts, so this loop runs from 0 to Gaps, not to Gaps minus 1.\n2. Work out Gaps from the spline: Get Spline Length divided by Spacing, then Truncate (drop the decimals) to get a whole number.\n3. Explain why the last post may stop short of the spline's end, and how to make it land exactly.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Fencepost quiz: the tutor gives lengths and spacings (30 m and 3 m; 7.5 m and 2 m; 1 m and 2 m). I say the gaps, the posts and where the last post stands.\n4. Do-along on today's build (Posts along the spline (built step by step in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - On paper, draw a 10 m line with posts every 2 m. Count the gaps and the posts. You see 5 gaps and 6 posts, at 0, 2, 4, 6, 8 and 10 m.\n   - In the Construction Script drag Get Spline Length from Path again, add a Division node, and connect Spacing to its lower input. Drag from the result and type Truncate. You see a node that turns 5.7 into 5: a Float becomes an Integer by dropping its decimals.\n   - Connect Truncate's result to the For Loop's Last Index (no Subtract this time). Compile and make the spline just over 10 m long, between 1000 and 1010 (watch the length with a Print String). You see 6 posts with Spacing 200: one at each end. At exactly 1000 the length can print as 999.99, because computers store decimals with tiny errors, and Truncate then drops a gap.\n   - Make the spline about 10.9 m long. You see still k": "Перевір інструмент на краях: дуже короткий сплайн, схил і різкий кут."}], "doalong": [{"en": "Raise one spline point 3 m in the level. You see posts leaning with the slope: Get Transform at Distance Along Spline also gives pitch (tilt), and real posts stand upright.", "uk": "Підніми одну точку сплайна на 3 м на рівні. Ти бачиш стовпи, що нахилені разом зі схилом: Get Transform at Distance Along Spline дає й pitch (нахил), а справжні стовпи стоять вертикально."}, {"en": "Between Get Transform at Distance Along Spline and Add Instance add Break Transform. Drag from its Rotation pin and add Break Rotator; add a Make Rotator and connect only Z (Yaw) from Break Rotator to Make Rotator's Z (Yaw). You see a chain that keeps only the turn.", "uk": "Між Get Transform at Distance Along Spline і Add Instance додай Break Transform. Потягни від його піна Rotation і додай Break Rotator; додай Make Rotator і з'єднай лише Z (Yaw) від Break Rotator із Z (Yaw) у Make Rotator. Ти бачиш ланцюжок, що залишає лише поворот."}, {"en": "Add a Float variable Post Scale (default 1, ranges 0.5 to 3, Instance Editable, Category Tool). Add Make Transform: Location from Break Transform, Rotation from Make Rotator, Scale from a Make Vector (1, 1, Post Scale; type 0.1 into X and Y if your post is the cylinder). Connect it to Add Instance and Compile. You see upright posts on the slope, and Post Scale 1.5 makes them taller.", "uk": "Додай змінну Float Post Scale (за замовчуванням 1, діапазони від 0.5 до 3, Instance Editable, категорія Tool). Додай Make Transform: Location від Break Transform, Rotation від Make Rotator, Scale від Make Vector (1, 1, Post Scale; якщо твій стовп — циліндр, введи 0.1 в X і Y). З'єднай його з Add Instance і натисни Compile. Ти бачиш вертикальні стовпи на схилі, а Post Scale 1.5 робить їх вищими."}, {"en": "Right-click a spline point > Snap/Align > Snap to Floor (or select the point and press End). If neither works, move the point down with the blue Z arrow until it touches the ground. You see the curve meet the ground at that point.", "uk": "Клацни правою кнопкою на точці сплайна > Snap/Align > Snap to Floor (або вибери точку й натисни End). Якщо жоден варіант не спрацював, опусти точку синьою стрілкою Z, доки вона не торкнеться землі. Ти бачиш, що крива в цій точці сходиться із землею."}, {"en": "Shorten the spline to under 2 m. You see one post and nothing else, and no error: the tool handles the smallest case.", "uk": "Скороти сплайн до менш ніж 2 м. Ти бачиш один стовп і більше нічого, і жодної помилки: інструмент справляється з найменшим випадком."}], "play": {"en": "Bug hunt: the tutor describes four broken fences (every post at the spline's start; posts leaning on a hill; the last post missing; posts piled up at the end). For each I name the node or pin I would check first.", "uk": "Полювання на помилки: тьютор описує чотири зламані паркани (кожен стовп на початку сплайна; стовпи нахилені на пагорбі; бракує останнього стовпа; стовпи нагромаджені в кінці). Для кожного я називаю вузол або пін, який перевірю першим."}, "video": {"search": "unreal engine 5 break transform make transform rotator yaw blueprint"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Upright posts, a height setting and edge tests (Day 62, lesson 4 of 4).\nToday's build: BP_SplineFence: a fence tool that lays posts at an even spacing along a spline you shape in the level, with rails between the posts, plus one fence on your island.\nEarlier today I already did: lesson 1 (Splines: a line you can draw in the level); lesson 2 (Posts at a distance along the spline); lesson 3 (The fencepost rule: count from the length). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Use Break Transform and Make Transform to change one part of a transform: keep the location, change the rotation or the scale.\n2. Keep posts upright on slopes by keeping only the spline's Yaw (the turn around the up axis), and size them with Post Scale.\n3. Test the tool at its edges: a very short spline, a slope and a sharp corner.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Bug hunt: the tutor describes four broken fences (every post at the spline's start; posts leaning on a hill; the last post missing; posts piled up at the end). For each I name the node or pin I would check first.\n4. Do-along on today's build (Posts along the spline (built step by step in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Raise one spline point 3 m in the level. You see posts leaning with the slope: Get Transform at Distance Along Spline also gives pitch (tilt), and real posts stand upright.\n   - Between Get Transform at Distance Along Spline and Add Instance add Break Transform. Drag from its Rotation pin and add Break Rotator; add a Make Rotator and connect only Z (Yaw) from Break Rotator to Make Rotator's Z (Yaw). You see a chain that keeps only the turn.\n   - Add a Float variable Post Scale (default 1, ranges 0.5 to 3, Instance Editable, Category Tool). Add Make Transform: Location from Break Transform, Rotation from Make Rotator, Scale from a Make Vector (1, 1, Post Scale; type 0.1 into X and Y if your post is the cylinder). Connect it to Add Instance and Compile. You see upright posts on the slope, and Post Scale 1.5 makes them taller.\n   - Right-click a spline point > Snap/Align > Snap to Floor (or select the point and press End). If neither works, move the point down with the blue Z arrow until it touches the ground. You see the curve meet the ground at that point.\n   - Shorten the spline to under 2 m. You see one post and nothing else, and no error: the tool handles the smallest case.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "fence_graph.png (the Construction Script of BP_SplineFence, node names readable)", "uk": "fence_graph.png (Construction Script у BP_SplineFence, назви вузлів читаються)"}, {"en": "fence_day62.png (L_Day62 from above) and island_day62.png (your fence on the island)", "uk": "fence_day62.png (L_Day62 зверху) і island_day62.png (твій паркан на острові)"}, {"en": "tool_notes.md (with a BP_SplineFence section)", "uk": "tool_notes.md (з розділом про BP_SplineFence)"}, {"en": "flythrough_day62.mp4 (60 seconds of live spline and setting changes)", "uk": "flythrough_day62.mp4 (60 секунд змін сплайна й налаштувань наживо)"}, {"en": "summary.md", "uk": "summary.md"}], "goal": {"en": "By the end of today you have BP_SplineFence: you drag the points of a curve in the level and posts appear at an even spacing along it, with rails between them, and one fence stands along a real edge of your island.", "uk": "До кінця сьогодні ти матимеш BP_SplineFence: ти тягнеш точки кривої на рівні, а стовпи з'являються через рівні проміжки вздовж неї, з рейками між ними, і один паркан стоїть уздовж реального краю твого острова."}, "uses": [{"en": "Day 61: BP_BollardRow (Construction Script, For Loop, Add Instance, Instance Editable variables with ranges)", "uk": "День 61: BP_BollardRow (Construction Script, For Loop, Add Instance, змінні Instance Editable з діапазонами)"}, {"en": "Day 8: SM_RailingPost (or any post mesh from your kit; /Engine/BasicShapes/Cylinder works too)", "uk": "День 8: SM_RailingPost (або будь-яка модель стовпа з твого набору; /Engine/BasicShapes/Cylinder теж підійде)"}], "quiz": [{"q": {"en": "Your fence posts all stack at the spline's start. What is the most likely cause?", "uk": "Усі стовпи твого паркана нагромаджуються на початку сплайна. Яка найімовірніша причина?"}, "options": [{"en": "Spacing is too big", "uk": "Spacing завеликий"}, {"en": "Nothing is connected to Distance, so every post gets distance 0", "uk": "Ніщо не підключено до Distance, тож кожен стовп отримує відстань 0"}, {"en": "Coordinate Space is set to Local", "uk": "Coordinate Space встановлено на Local"}, {"en": "The spline has only two points", "uk": "Сплайн має лише дві точки"}], "answer": 1, "explain": {"en": "Get Transform at Distance Along Spline with distance 0 always returns the start point, so every post lands there.", "uk": "Get Transform at Distance Along Spline з відстанню 0 завжди повертає початкову точку, тож кожен стовп опиняється там."}}, {"q": {"en": "A 12 m spline with Spacing 300: how many posts does BP_SplineFence lay?", "uk": "Сплайн 12 м зі Spacing 300: скільки стовпів поставить BP_SplineFence?"}, "options": [{"en": "4", "uk": "4"}, {"en": "5", "uk": "5"}, {"en": "3", "uk": "3"}, {"en": "6", "uk": "6"}], "answer": 1, "explain": {"en": "12 / 3 = 4 gaps, and a fence has one more post than gaps: 5 posts.", "uk": "12 / 3 = 4 проміжки, а в паркані на один стовп більше, ніж проміжків: 5 стовпів."}}, {"q": {"en": "Why does the post loop run from 0 to Gaps while the rail loop runs from 0 to Gaps minus 1?", "uk": "Чому цикл стовпів іде від 0 до Gaps, а цикл рейок від 0 до Gaps мінус 1?"}, "options": [{"en": "Because rails are drawn after posts", "uk": "Бо рейки малюються після стовпів"}, {"en": "Because Truncate rounds down", "uk": "Бо Truncate округлює вниз"}, {"en": "Because a fence has one more post than gaps, and each rail fills one gap", "uk": "Бо в паркані на один стовп більше, ніж проміжків, а кожна рейка заповнює один проміжок"}], "answer": 2, "explain": {"en": "Posts mark both ends of every gap, so there is always one more post than rails.", "uk": "Стовпи позначають обидва кінці кожного проміжку, тож стовпів завжди на один більше, ніж рейок."}}, {"q": {"en": "On a hillside your posts lean with the slope. What fixes it?", "uk": "На схилі пагорба твої стовпи нахиляються разом зі схилом. Що це виправляє?"}, "options": [{"en": "Build the rotation from the spline's Yaw only, with Break Rotator and Make Rotator", "uk": "Побудувати поворот лише з Yaw сплайна, через Break Rotator і Make Rotator"}, {"en": "Set Spacing to 50", "uk": "Встановити Spacing на 50"}, {"en": "Switch Coordinate Space to World", "uk": "Переключити Coordinate Space на World"}], "answer": 0, "explain": {"en": "Keeping only the Yaw turns each post along the line while it stays upright.", "uk": "Якщо залишити лише Yaw, кожен стовп повертається вздовж лінії, але лишається вертикальним."}}, {"q": {"en": "What does Truncate do to 5.9?", "uk": "Що робить Truncate з 5.9?"}, "options": [{"en": "Makes it 6", "uk": "Робить 6"}, {"en": "Makes it 0.9", "uk": "Робить 0.9"}, {"en": "Leaves it at 5.9", "uk": "Лишає 5.9"}, {"en": "Makes it 5", "uk": "Робить 5"}], "answer": 3, "explain": {"en": "Truncate drops the decimals and keeps the whole number, so 5.9 becomes 5.", "uk": "Truncate відкидає десяткову частину й лишає ціле число, тож 5.9 стає 5."}}], "weekInfo": null, "morning": {"sofar": {"en": "You have BP_BollardRow and BP_PlanterRow: two tools that lay rows of meshes from numbers, built with a Construction Script and a loop.", "uk": "Ти маєш BP_BollardRow і BP_PlanterRow: два інструменти, що розставляють ряди моделей за числами, зроблені через Construction Script і цикл."}, "today": {"en": "You make a fence that follows any line you draw, using a spline and a little arithmetic.", "uk": "Ти робиш паркан, що йде за будь-якою лінією, яку ти намалюєш, за допомогою сплайна й трохи арифметики."}, "cheer": {"en": "A curve is only many small straight steps; take the nodes one at a time and your fence will bend wherever you lead it.", "uk": "Крива — це лише багато маленьких прямих кроків; проходь вузли по одному, і твій паркан вигинатиметься, куди ти його поведеш."}, "quote": {"text": {"en": "Little strokes fell great oaks.", "uk": "Малі удари валять великі дуби."}, "author": {"en": "Benjamin Franklin", "uk": "Бенджамін Франклін"}, "source": "Poor Richard's Almanack, 1750"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-62-spline-fence", "mapHref": "../../COURSE.html", "prevHref": "../Day-61-blueprint-basics-bollard-row/START-HERE.html", "nextHref": "../Day-63-spline-scatter-seeded/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me: when my Blueprint or script fails, ask for the error message or a screenshot of the graph, point to the line or node that is wrong and explain why, then let me fix it myself. Never write the whole tool for me. Keep me moving and make it feel like a game.\n\nToday I build on my own: Rails between the posts, and a fence on your island, on your own.\nIt's part of: BP_SplineFence: a fence tool that lays posts at an even spacing along a spline you shape in the level, with rails between the posts, plus one fence on your island (A practice level, Content/Tools/Day62/L_Day62, then one fence along a real edge of your island (a cliff path, a quay without a railing or a garden).).\n\nSpec:\n- BP_SplineFence, an Actor Blueprint in Content/Tools/Blueprints, with a Spline component named Path and two Instanced Static Mesh components: Posts (SM_RailingPost, or /Engine/BasicShapes/Cylinder made thin with 0.1, 0.1 in the instance Scale, never by scaling the component) and Rails (/Engine/BasicShapes/Cube).\n- Variables, all Instance Editable, in the Category Tool, each with a tooltip and a Slider Range and Value Range: Spacing (Float, centimetres, default 200, 50 to 1000), Post Scale (Float, default 1, 0.5 to 3) and Rail Height (Float, centimetres, default 90, 20 to 300).\n- Construction Script: Clear Instances on both components; Gaps = Truncate(Get Spline Length / Spacing); a For Loop from 0 to Gaps adds one post at distance Index x Spacing (posts = gaps + 1); a second For Loop from 0 to Gaps minus 1 adds one rail at distance (Index + 0.5) x Spacing.\n- Posts stand upright on slopes (only the spline's Yaw is used) and grow with Post Scale; rails follow the slope, are exactly Spacing long (Scale X = Spacing / 100) and 5 cm thick (Scale Y and Z = 0.05).\n- Edge cases work: a spline shorter than Spacing gives 1 post and no rails; a 100 m spline rebuilds at once when you drag a point. No Event Graph code and no Tick.\n- L_Day62 saved with an S-shaped fence and a fence with a sharp corner; one fence on your island with every post on the ground and nothing floating.\n\nMy checklist:\n1. Open BP_SplineFence and check it against the spec: the Path and Posts components, Spacing and Post Scale (Instance Editable, Category Tool, ranges, tooltips), and the post chain Clear Instances > For Loop (0 to Gaps) > Add Instance with the upright rotation. Click Compile. Check: a green tick, and the Compiler Results panel shows no warnings. (from lesson 4)\n2. In L_Day62 place a BP_SplineFence and shape an S-curve of about 20 m with at least four points (Alt+drag a point to add one). Check: posts follow the S at an even spacing, and the last post stands less than one Spacing from the end point. (from lesson 1)\n3. Add the Rails component (Instanced Static Mesh, mesh /Engine/BasicShapes/Cube) and a Float variable Rail Height (default 90, ranges 20 to 300, Instance Editable, Category Tool, tooltip Height of the rail above the ground, in centimetres). Add Clear Instances for Rails right after the one for Posts. Check: Rail Height shows under Tool on a placed fence, and the Blueprint compiles. (from day 61, lesson 2)\n4. From the post loop's Completed pin add a second For Loop: First Index 0, Last Index = Gaps minus 1 (a Subtract node, as on Day 61). Distance = (Index + 0.5) x Spacing, into a new Get Transform at Distance Along Spline (Coordinate Space Local). Print String the Distance for a moment. Check: for Spacing 200 you see 100, 300, 500 and so on in the Output Log; then delete the Print String. (from lesson 3)\n5. Break Transform the rail's transform. Add Make Vector (0, 0, Rail Height) to its Location with an Add node. Make Transform from that location, the full Rotation, and Scale = Make Vector (Spacing / 100, 0.05, 0.05). Connect it to Rails: Add Instance. Check: one rail between each pair of posts, at Rail Height, touching both posts. (from lesson 4)\n6. Edge tests: drag the end point back until the spline is shorter than Spacing; then stretch it to about 100 m; then raise one middle point 3 m. Check: 1 post and no rails, then a long fence that rebuilds smoothly, then upright posts with rails sloping between them. (from lesson 4)\n7. Right-click one spline point > Spline Point Type > Linear and pull its neighbours into a right angle. Check: a sharp corner where the curve was round, with posts and rails still following the line. (from lesson 1)\n8. Save L_Day62. Open your island level (L_Island, or your own level if you followed the fast track) and place one BP_SplineFence along a real edge; snap its points to the ground and add points wherever the ground changes. Check: from about 30 m up the fence follows the edge, every post stands on the ground, and nothing floats. (from lesson 4)\n9. Take fence_graph.png (the whole Construction Script of BP_SplineFence, node names readable), fence_day62.png (L_Day62 from above) and island_day62.png (your fence on the island). Check: three pictures in today's Work folder, and you can read the node names in the first. (from lesson 1)\n10. Record flythrough_day62.mp4 (60 seconds): drag spline points, add a point, and change Spacing, Post Scale and Rail Height while the fence rebuilds. Check: the clip is in today's Work folder and shows at least four live changes. (from lesson 4)\n11. Add a BP_SplineFence section to tool_notes.md: one line per variable (what it does and its range), and one line on the fencepost rule in your own words. Check: the section has at least four lines. (from lesson 3)\n12. Click Copy the day report, paste it into a new tutor chat, answer its questions and save its answer as summary.md. Check: summary.md is in today's Work folder with Made, To look at, Hours and To revisit filled in. (from lesson 4)\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me.\n\nStart by asking which step  h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p><div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+list(D.handin,'ul','ticks')+'<p class="path">'+ic('folder')+'<span>'+u('shipTo')+' <code>'+esc(D.workPath)+'</code></span></p>'+(D.lessons.length?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<p class="muted">'+u('report')+'</p><div class="row"><button class="btn s" onclick="cp(D.reportPrompt)">'+ic('copy')+u('copyR')+'</button></div></section>';
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();

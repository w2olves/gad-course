<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 62</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

<script id="data" type="application/json">{"learner": "ib-misha-873821eb", "learnerName": {"en": "Misha", "uk": "Міша"}, "day": 62, "week": 13, "total": 110, "title": {"en": "Splines: a fence that follows any line you draw", "uk": "Сплайни: паркан, що йде за будь-якою лінією, яку ти намалюєш"}, "theme": {"en": "Week 13: Blueprints for world builders", "uk": "Тиждень 13: Blueprint для творців світів"}, "build": {"item": {"en": "BP_SplineFence: a fence tool that lays posts at an even spacing along a spline you shape in the level, with rails between the posts, plus one fence on your island", "uk": "BP_SplineFence: інструмент-паркан, що ставить стовпи з рівними проміжками вздовж сплайна, який ти формуєш на рівні, і рейки між ними. Плюс один паркан на твоєму острові."}, "why": {"en": "Real edges are never straight: quays bend, paths curve and cliff tops wander. A spline lets you draw any line in the level, and the tool fills it, so a 200 m fence takes a minute and stays editable. Spline tools are among the most requested technical-art tools in studios, because level designers reshape them every day.", "uk": "Справжні краї ніколи не бувають прямими: набережні згинаються, стежки петляють, а краї скель звиваються. Сплайн дає намалювати на рівні будь-яку лінію, а інструмент заповнює її: паркан завдовжки 200 м готовий за хвилину й лишається редагованим. Сплайн-інструменти — одні з найпотрібніших у студіях, бо дизайнери рівнів змінюють їх щодня."}, "where": {"en": "A practice level, Content/Tools/Day62/L_Day62, then one fence along a real edge of your island (a cliff path, a quay without a railing or a garden).", "uk": "Тренувальний рівень Content/Tools/Day62/L_Day62, а потім один паркан уздовж справжнього краю твого острова: стежки над скелею, набережної без поручнів або саду."}, "spec": [{"en": "BP_SplineFence, an Actor Blueprint in Content/Tools/Blueprints, with a Spline component named Path and two Instanced Static Mesh components: Posts (SM_RailingPost, or /Engine/BasicShapes/Cylinder made thin with 0.1, 0.1 in the instance Scale, never by scaling the component) and Rails (/Engine/BasicShapes/Cube).", "uk": "BP_SplineFence — Actor Blueprint у Content/Tools/Blueprints з компонентом Spline на ім'я Path і двома компонентами Instanced Static Mesh. Posts: SM_RailingPost або /Engine/BasicShapes/Cylinder, стоншений значенням 0.1, 0.1 у Scale інстанса, а не масштабом компонента. Rails: /Engine/BasicShapes/Cube."}, {"en": "Variables, all Instance Editable, in the Category Tool, each with a tooltip and a Slider Range and Value Range: Spacing (Float, centimetres, default 200, 50 to 1000), Post Scale (Float, default 1, 0.5 to 3) and Rail Height (Float, centimetres, default 90, 20 to 300).", "uk": "Змінні, усі Instance Editable, у категорії Tool, кожна з підказкою, Slider Range і Value Range. Spacing: Float у сантиметрах, типово 200, від 50 до 1000. Post Scale: Float, типово 1, від 0.5 до 3. Rail Height: Float у сантиметрах, типово 90, від 20 до 300."}, {"en": "Construction Script: Clear Instances on both components; Gaps = Truncate(Get Spline Length / Spacing); a For Loop from 0 to Gaps adds one post at distance Index x Spacing (posts = gaps + 1); a second For Loop from 0 to Gaps minus 1 adds one rail at distance (Index + 0.5) x Spacing.", "uk": "Construction Script: Clear Instances для обох компонентів, потім Gaps = Truncate(Get Spline Length / Spacing). For Loop від 0 до Gaps ставить стовп на відстані Index × Spacing (стовпів на один більше, ніж проміжків). Другий For Loop від 0 до Gaps мінус 1 ставить рейку на відстані (Index + 0.5) × Spacing."}, {"en": "Posts stand upright on slopes (only the spline's Yaw is used) and grow with Post Scale; rails follow the slope, are exactly Spacing long (Scale X = Spacing / 100) and 5 cm thick (Scale Y and Z = 0.05).", "uk": "Стовпи стоять вертикально на схилах (з повороту сплайна береться лише Yaw) і ростуть разом із Post Scale. Рейки йдуть за схилом, мають довжину рівно Spacing (Scale X = Spacing / 100) і товщину 5 см (Scale Y і Z = 0.05)."}, {"en": "Edge cases work: a spline shorter than Spacing gives 1 post and no rails; a 100 m spline rebuilds at once when you drag a point. No Event Graph code and no Tick.", "uk": "Крайні випадки працюють. Сплайн, коротший за Spacing, дає 1 стовп і жодної рейки. Сплайн завдовжки 100 м одразу перебудовується, коли ти тягнеш точку. Жодного коду в Event Graph і жодного Tick."}, {"en": "L_Day62 saved with an S-shaped fence and a fence with a sharp corner; one fence on your island with every post on the ground and nothing floating.", "uk": "L_Day62 збережено з S-подібним парканом і парканом із різким кутом. На острові стоїть один паркан, кожен стовп на землі, і ніщо не висить у повітрі."}], "piece1": "Posts along the spline (built step by step in the lessons)", "piece2": {"en": "Rails between the posts, and a fence on your island, on your own", "uk": "Рейки між стовпами й паркан на твоєму острові, самостійно"}, "steps": [{"text": {"en": "Check: the results of today's lessons are there (BP_SplineFence with Path, Posts, Spacing and Post Scale in Content/Tools/Blueprints; L_Day62). Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it. Open BP_SplineFence and check it against the spec: the Path and Posts components, Spacing and Post Scale (Instance Editable, Category Tool, ranges, tooltips), and the post chain Clear Instances > For Loop (0 to Gaps) > Add Instance with the upright rotation. Click Compile. Check: a green tick, and the Compiler Results panel shows no warnings.", "uk": "Спершу переконайся, що результати сьогоднішніх уроків на місці: BP_SplineFence з Path, Posts, Spacing і Post Scale у Content/Tools/Blueprints і L_Day62. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Відкрий BP_SplineFence і звір його з вимогами: компоненти Path і Posts, змінні Spacing і Post Scale (Instance Editable, категорія Tool, діапазони, підказки) і ланцюжок стовпів Clear Instances > For Loop (від 0 до Gaps) > Add Instance з вертикальним поворотом. Клацни Compile. Перевірка: зелена позначка, а панель Compiler Results не показує попереджень."}, "lesson": 4}, {"text": {"en": "In L_Day62 place a BP_SplineFence and shape an S-curve of about 20 m with at least four points (Alt+drag a point to add one). Check: posts follow the S at an even spacing, and the last post stands less than one Spacing from the end point.", "uk": "У L_Day62 розмісти BP_SplineFence і сформуй S-подібну криву завдовжки близько 20 м щонайменше з чотирма точками. Нову точку додає перетягування точки з Alt. Перевірка: стовпи йдуть за S з рівними проміжками, а останній стовп стоїть ближче ніж на один Spacing від кінцевої точки."}, "lesson": 1}, {"text": {"en": "Add the Rails component (Instanced Static Mesh, mesh /Engine/BasicShapes/Cube) and a Float variable Rail Height (default 90, ranges 20 to 300, Instance Editable, Category Tool, tooltip Height of the rail above the ground, in centimetres). Add Clear Instances for Rails right after the one for Posts. Check: Rail Height shows under Tool on a placed fence, and the Blueprint compiles.", "uk": "Додай компонент Rails (Instanced Static Mesh, меш /Engine/BasicShapes/Cube) і змінну Float Rail Height: типово 90, діапазони від 20 до 300, Instance Editable, категорія Tool, підказка Height of the rail above the ground, in centimetres. Додай Clear Instances для Rails одразу після Clear Instances для Posts. Перевірка: Rail Height є під Tool на розміщеному паркані, і Blueprint компілюється."}, "lesson": "D61.2"}, {"text": {"en": "From the post loop's Completed pin add a second For Loop: First Index 0, Last Index = Gaps minus 1 (a Subtract node, as on Day 61). Distance = (Index + 0.5) x Spacing, into a new Get Transform at Distance Along Spline (Coordinate Space Local). Print String the Distance for a moment. Check: for Spacing 200 you see 100, 300, 500 and so on in the Output Log; then delete the Print String.", "uk": "Від виходу Completed циклу стовпів додай другий For Loop: First Index 0, Last Index = Gaps мінус 1 (вузол Subtract, як у День 61). Подай Distance = (Index + 0.5) × Spacing у новий Get Transform at Distance Along Spline (Coordinate Space Local). На хвилину виведи Distance вузлом Print String. Перевірка: для Spacing 200 Output Log показує 100, 300, 500 і так далі. Потім видали Print String."}, "lesson": 3}, {"text": {"en": "Break Transform the rail's transform. Add Make Vector (0, 0, Rail Height) to its Location with an Add node. Make Transform from that location, the full Rotation, and Scale = Make Vector (Spacing / 100, 0.05, 0.05). Connect it to Rails: Add Instance. Check: one rail between each pair of posts, at Rail Height, touching both posts.", "uk": "Розклади трансформ рейки вузлом Break Transform. Додай до його Location вектор Make Vector (0, 0, Rail Height) вузлом Add. Зроби Make Transform з цього розташування, повного Rotation і Scale = Make Vector (Spacing / 100, 0.05, 0.05). З'єднай його з Rails: Add Instance. Перевірка: між кожною парою стовпів одна рейка на висоті Rail Height, і вона торкається обох стовпів."}, "lesson": 4}, {"text": {"en": "Edge tests: drag the end point back until the spline is shorter than Spacing; then stretch it to about 100 m; then raise one middle point 3 m. Check: 1 post and no rails, then a long fence that rebuilds smoothly, then upright posts with rails sloping between them.", "uk": "Перевір крайні випадки. Тягни кінцеву точку назад, доки сплайн не стане коротшим за Spacing. Потім розтягни його приблизно до 100 м. Потім підніми одну середню точку на 3 м. Перевірка: спершу 1 стовп і жодної рейки, потім довгий паркан, що плавно перебудовується, а на схилі вертикальні стовпи з нахиленими рейками між ними."}, "lesson": 4}, {"text": {"en": "Right-click one spline point > Spline Point Type > Linear and pull its neighbours into a right angle. Check: a sharp corner where the curve was round, with posts and rails still following the line.", "uk": "Клацни правою кнопкою на одній точці сплайна > Spline Point Type > Linear і зведи її сусідів у прямий кут. Перевірка: різкий кут там, де крива була округлою, а стовпи й рейки далі йдуть за лінією."}, "lesson": 1}, {"text": {"en": "Save L_Day62, open any other level, then open L_Day62 again: both fences must still be in the Outliner. Open your island level (L_Island, or your own level if you followed the fast track) and place one BP_SplineFence along a real edge; snap its points to the ground and add points wherever the ground changes; save the level (Ctrl+S). Check: from about 30 m up the fence follows the edge, every post stands on the ground, and nothing floats.", "uk": "Збережи L_Day62, відкрий будь-який інший рівень, а тоді знову L_Day62: обидва паркани мають бути в Outliner. Відкрий рівень острова (L_Island або свій рівень, якщо йдеш швидким шляхом) і постав один BP_SplineFence уздовж справжнього краю. Опусти точки на землю й додай точки скрізь, де змінюється рельєф. Збережи рівень (Ctrl+S). Перевірка: з висоти близько 30 м паркан іде за краєм, кожен стовп стоїть на землі, і ніщо не висить у повітрі."}, "lesson": 4}, {"text": {"en": "Take island_day62.png (your fence on the island, from about 30 m). Check: the picture is in today's Work folder.", "uk": "Зроби скриншот island_day62.png: твій паркан на острові з висоти близько 30 м. Перевірка: зображення в робочій папці дня."}, "lesson": 1}, {"text": {"en": "Click Copy the day report, paste it into a new tutor chat, answer its questions and save its answer as summary.md in today's Work folder. Drag summary.md and island_day62.png into today's hand-in folder (the button on this page); no need to hand in the Unreal project or level folders (they're very big). Check: the hand-in folder lists 2 files, each over 1 KB.", "uk": "Клацни «Копіювати звіт дня», встав текст у новий чат із тьютором, дай відповіді на його запитання й збережи відповідь як summary.md у робочій папці дня. Здай роботу: перетягни файли в сьогоднішню папку здачі (кнопка на цій сторінці): summary.md і island_day62.png. Папку проєкту чи рівня Unreal здавати не треба: вона дуже велика. Перевірка: у папці здачі 2 файли, кожен більший за 1 КБ."}, "lesson": 4}], "assets": ["techart/code-style.md"], "next": {"en": "BP_SplineFence becomes the railing of BP_Promenade on Friday (Day 65). On Day 85 the same distance-along-a-spline idea places PCG props along your streets.", "uk": "У п'ятницю (День 65) BP_SplineFence стане поручнями BP_Promenade. У День 85 та сама ідея відстані вздовж сплайна розставлятиме пропси PCG уздовж твоїх вулиць."}}, "lessons": [{"title": {"en": "Splines: a line you can draw in the level", "uk": "Сплайни: лінія, яку можна намалювати на рівні"}, "minutes": 40, "goals": [{"en": "Explain a spline: a smooth line through points you place in the level, which a Blueprint can read at any distance along it.", "uk": "Пояснювати, що таке сплайн. Це гладка лінія через точки, які ти ставиш на рівні. Blueprint може зчитати будь-яку точку на цій лінії за відстанню від початку."}, {"en": "Add a Spline component to a new Blueprint and shape it in the level: add, move and delete points.", "uk": "Додавати компонент Spline до нового Blueprint і формувати його на рівні: додавати, пересувати й видаляти точки."}, {"en": "Read the spline's length with Get Spline Length and Print String.", "uk": "Зчитувати довжину сплайна вузлами Get Spline Length і Print String."}], "doalong": [{"en": "In Content/Tools create the folder Day62, then choose File > New Level > Basic and save it as L_Day62 in Content/Tools/Day62. In Content/Tools/Blueprints right-click > Blueprint Class > Actor, name it BP_SplineFence and open it. You see an empty Blueprint with only a DefaultSceneRoot.", "uk": "У Content/Tools створи папку Day62. Вибери File > New Level > Basic і збережи рівень як L_Day62 у Content/Tools/Day62. У Content/Tools/Blueprints клацни правою кнопкою > Blueprint Class > Actor, назви його BP_SplineFence і відкрий. Має вийти порожній Blueprint лише з DefaultSceneRoot."}, {"en": "In the Components panel click + Add, type Spline and choose it; name it Path. Compile, Save, and drag BP_SplineFence into L_Day62. You see a thin white line about 1 m long with a small point at each end.", "uk": "На панелі Components клацни + Add, введи Spline, вибери його й назви Path. Клацни Compile, Save і перетягни BP_SplineFence у L_Day62. На рівні з'являється тонка біла лінія завдовжки близько 1 м з точкою на кожному кінці."}, {"en": "In the level click the end point of the line and drag it with the move arrows to about 10 m away. Then hold Alt and drag that point: a new point appears. Make an S-shape with four points. You see a smooth curve through your points.", "uk": "На рівні клацни кінцеву точку лінії й перетягни її стрілками пересування приблизно на 10 м. Потім утримуй Alt і тягни цю точку: з'являється нова точка. Зроби S-подібну форму з чотирьох точок. Має вийти гладка крива через твої точки."}, {"en": "Right-click the line between two points and choose Add Spline Point Here; then click a point and press Delete. You see a point appear and disappear, and the curve smooth itself each time.", "uk": "Клацни правою кнопкою на лінії між двома точками й вибери Add Spline Point Here. Потім клацни точку й натисни Delete. Точка з'являється й зникає, а крива щоразу вирівнюється."}, {"en": "In BP_SplineFence's Construction Script drag in Path (Get), drag from its pin and add Get Spline Length (if it is not offered, untick Context Sensitive and search again); connect its result to a Print String's In String, and the Construction Script's white pin to Print String.", "uk": "У Construction Script BP_SplineFence перетягни Path (Get), потягни від його виходу й додай Get Spline Length. Якщо його немає в списку, зніми прапорець Context Sensitive і пошукай знову. З'єднай результат із входом In String вузла Print String, а білий вихід Construction Script — з Print String."}, {"en": "Compile, open Window > Output Log and move a point in the level. You see the length in centimetres every time the curve changes (2000 means 20 m). Delete the Print String when you are done.", "uk": "Клацни Compile, відкрий Window > Output Log і пересунь точку на рівні. Щоразу, коли крива змінюється, журнал показує довжину в сантиметрах: 2000 означає 20 м. Коли закінчиш, видали Print String."}], "play": {"en": "Spline or not: the tutor names six level jobs (a fence along a cliff, one statue, a river bank, a row of trees on a curving road, a door, a power line). For each I say whether a spline tool fits and why.", "uk": "Сплайн чи ні: тьютор називає шість завдань рівня. Паркан уздовж скелі, одна статуя, берег річки, ряд дерев уздовж звивистої дороги, двері, лінія електропередач. Для кожного я кажу, чи підходить сплайн-інструмент, і чому."}, "video": {"search": "unreal engine 5 blueprint spline component construction script beginners"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Сплайни: лінія, яку можна намалювати на рівні (Day 62, lesson 1 of 4). Today's build: BP_SplineFence: інструмент-паркан, що ставить стовпи з рівними проміжками вздовж сплайна, який ти формуєш на рівні, і рейки між ними. Плюс один паркан на твоєму острові..\nWhat I already know: День 61: BP_BollardRow (Construction Script, For Loop, Add Instance, змінні Instance Editable з діапазонами); День 8: SM_RailingPost. Підійде будь-яка модель стовпа з твого набору або /Engine/BasicShapes/Cylinder..\n\nBy the end of this lesson I can:\n1. Пояснювати, що таке сплайн. Це гладка лінія через точки, які ти ставиш на рівні. Blueprint може зчитати будь-яку точку на цій лінії за відстанню від початку.\n2. Додавати компонент Spline до нового Blueprint і формувати його на рівні: додавати, пересувати й видаляти точки.\n3. Зчитувати довжину сплайна вузлами Get Spline Length і Print String.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: Ти маєш BP_BollardRow і BP_PlanterRow: два інструменти, що розставляють ряди моделей за числами. Обидва зроблено з Construction Script і циклом. Today: Ти робиш паркан, що йде за будь-якою лінією, яку ти намалюєш. Для цього потрібні сплайн і трохи арифметики. One encouraging line: Крива — це лише багато маленьких прямих кроків. Проходь вузли по одному, і паркан вигинатиметься туди, куди ти його поведеш.); 2 lines on why today matters and where it comes back, in plain words (from this: Справжні краї ніколи не бувають прямими: набережні згинаються, стежки петляють, а краї скель звиваються. Сплайн дає намалювати на рівні будь-яку лінію, а інструмент заповнює її: паркан завдовжки 200 м готовий за хвилину й лишається редагованим. Сплайн-інструменти — одні з найпотрібніших у студіях, бо дизайнери рівнів змінюють їх щодня. It comes back: У п'ятницю (День 65) BP_SplineFence стане поручнями BP_Promenade. У День 85 та сама ідея відстані вздовж сплайна розставлятиме пропси PCG уздовж твоїх вулиць.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-62-spline-fence exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (Стовпи вздовж сплайна (будується крок за кроком на уроках)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. У Content/Tools створи папку Day62. Вибери File > New Level > Basic і збережи рівень як L_Day62 у Content/Tools/Day62. У Content/Tools/Blueprints клацни правою кнопкою > Blueprint Class > Actor, назви його BP_SplineFence і відкрий. Має вийти порожній Blueprint лише з DefaultSceneRoot.\n   2. На панелі Components клацни + Add, введи Spline, вибери його й назви Path. Клацни Compile, Save і перетягни BP_SplineFence у L_Day62. На рівні з'являється тонка біла лінія завдовжки близько 1 м з точкою на кожному кінці.\n   3. На рівні клацни кінцеву точку лінії й перетягни її стрілками пересування приблизно на 10 м. Потім утримуй Alt і тягни цю точку: з'являється нова точка. Зроби S-подібну форму з чотирьох точок. Має вийти гладка крива через твої точки. [screenshot]\n   4. Клацни правою кнопкою на лінії між двома точками й вибери Add Spline Point Here. Потім клацни точку й натисни Delete. Точка з'являється й зникає, а крива щоразу вирівнюється.\n   5. У Construction Script BP_SplineFence перетягни Path (Get), потягни від його виходу й додай Get Spline Length. Якщо його немає в списку, зніми прапорець Context Sensitive і пошукай знову. З'єднай результат із входом In String вузла Print String, а білий вихід Construction Script — з Print String.\n   6. Клацни Compile, відкрий Window > Output Log і пересунь точку на рівні. Щоразу, коли крива змінюється, журнал показує довжину в сантиметрах: 2000 означає 20 м. Коли закінчиш, видали Print String. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Сплайн чи ні: тьютор називає шість завдань рівня. Паркан уздовж скелі, одна статуя, берег річки, ряд дерев уздовж звивистої дороги, двері, лінія електропередач. Для кожного я кажу, чи підходить сплайн-інструмент, і чому. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into у перетягни Get Spline Length з Path, додай вузол Division і з'єднай Spacing з його нижнім входом. Потягни від результату й введи Truncate. Цей вузол перетворює 5.7 на 5: Float стає Integer, коли відкинути десяткову частину."}, {"en": "Connect Truncate's result to the For Loop's Last Index (no Subtract this time). Compile and make the spline just over 10 m long, between 1000 and 1010 (watch the length with a Print String).", "uk": "З'єднай результат Truncate з Last Index вузла For Loop (цього разу без Subtract). Клацни Compile і зроби сплайн трохи довшим за 10 м, від 1000 до 1010. Стеж за довжиною вузлом Print String."}, {"en": "You see 6 posts with Spacing 200: one at each end. At exactly 1000 the length can print as 999.99, because computers store decimals with tiny errors, and Truncate then drops a gap.", "uk": "Зі Spacing 200 має вийти 6 стовпів, по одному на кожному кінці. Рівно 1000 може надрукуватися як 999.99: комп'ютер зберігає десяткові числа з крихітними похибками. Тоді Truncate відкидає один проміжок."}, {"en": "Make the spline about 10.9 m long. You see still 6 posts; the last stands 0.9 m before the end, because 10.9 / 2 = 5.45 is truncated to 5 gaps. Tell the tutor two ways to make a post land exactly at the end (change Spacing, or move the end point).", "uk": "Зроби сплайн завдовжки близько 10,9 м. Стовпів досі 6, а останній стоїть за 0,9 м до кінця: 10.9 / 2 = 5.45, і це відкидається до 5 проміжків. Назви тьюторові два способи поставити стовп точно в кінці: змінити Spacing або пересунути кінцеву точку."}, {"en": "Print String the Truncate result while you stretch the spline slowly, then delete the Print String. You see Gaps grow by one each time the length passes another multiple of Spacing.", "uk": "Виводь результат Truncate вузлом Print String і повільно розтягуй сплайн. Gaps росте на одиницю щоразу, коли довжина проходить ще одне кратне Spacing. Потім видали Print String."}], "play": {"en": "Fencepost quiz: the tutor gives lengths and spacings (30 m and 3 m; 7.5 m and 2 m; 1 m and 2 m). I say the gaps, the posts and where the last post stands.", "uk": "Вікторина про стовп огорожі: тьютор дає довжини й проміжки (30 м і 3 м; 7,5 м і 2 м; 1 м і 2 м). Я називаю кількість проміжків, кількість стовпів і місце останнього стовпа."}, "video": {"search": "fencepost error off by one explained"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Правило стовпа огорожі: рахуй за довжиною (Day 62, lesson 3 of 4). Today's build: BP_SplineFence: інструмент-паркан, що ставить стовпи з рівними проміжками вздовж сплайна, який ти формуєш на рівні, і рейки між ними. Плюс один паркан на твоєму острові..\nWhat I already know: День 61: BP_BollardRow (Construction Script, For Loop, Add Instance, змінні Instance Editable з діапазонами); День 8: SM_RailingPost. Підійде будь-яка модель стовпа з твого набору або /Engine/BasicShapes/Cylinder..\nEarlier today I already did: lesson 1 (Сплайни: лінія, яку можна намалювати на рівні); lesson 2 (Стовпи на відстані вздовж сплайна). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Пояснювати правило стовпа огорожі: у паркані з 5 проміжками 6 стовпів. Тому цикл іде від 0 до Gaps, а не до Gaps мінус 1.\n2. Обчислювати Gaps зі сплайна: поділити Get Spline Length на Spacing і відкинути десяткову частину вузлом Truncate.\n3. Пояснювати, чому останній стовп може не дійти до кінця сплайна, і як поставити його точно в кінці.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: 2 lines on why today matters and where it comes back, in plain words (from this: Справжні краї ніколи не бувають прямими: набережні згинаються, стежки петляють, а краї скель звиваються. Сплайн дає намалювати на рівні будь-яку лінію, а інструмент заповнює її: паркан завдовжки 200 м готовий за хвилину й лишається редагованим. Сплайн-інструменти — одні з найпотрібніших у студіях, бо дизайнери рівнів змінюють їх щодня. It comes back: У п'ятницю (День 65) BP_SplineFence стане поручнями BP_Promenade. У День 85 та сама ідея відстані вздовж сплайна розставлятиме пропси PCG уздовж твоїх вулиць.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-62-spline-fence exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (Стовпи вздовж сплайна (будується крок за кроком на уроках)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Намалюй на папері лінію 10 м зі стовпами через кожні 2 м. Порахуй проміжки й стовпи. Має вийти 5 проміжків і 6 стовпів: на 0, 2, 4, 6, 8 і 10 м.\n   2. У Construction Script знову перетягни Get Spline Length з Path, додай вузол Division і з'єднай Spacing з його нижнім входом. Потягни від результату й введи Truncate. Цей вузол перетворює 5.7 на 5: Float стає Integer, коли відкинути десяткову частину.\n   3. З'єднай результат Truncate з Last Index вузла For Loop (цього разу без Subtract). Клацни Compile і зроби сплайн трохи довшим за 10 м, від 1000 до 1010. Стеж за довжиною вузлом Print String. [screenshot]\n   4. Зі Spacing 200 має вийти 6 стовпів, по одному на кожному кінці. Рівно 1000 може надрукуватися як 999.99: комп'ютер зберігає десяткові числа з крихітними похибками. Тоді Truncate відкидає один проміжок.\n   5. Зроби сплайн завдовжки близько 10,9 м. Стовпів досі 6, а останній стоїть за 0,9 м до кінця: 10.9 / 2 = 5.45, і це відкидається до 5 проміжків. Назви тьюторові два способи поставити стовп точно в кінці: змінити Spacing або пересунути кінцеву точку.\n   6. Виводь результат Truncate вузлом Print String і повільно розтягуй сплайн. Gaps росте на одиницю щоразу, коли довжина проходить ще одне кратне Spacing. Потім видали Print String. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Вікторина про стовп огорожі: тьютор дає довжини й проміжки (30 м і 3 м; 7,5 м і 2 м; 1 м і 2 м). Я називаю кількість проміжків, кількість стовпів і місце останнього стовпа. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; see-why-fix note = нотатка «бачу, чому, як виправити»; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; File Explorer = Провідник; mesh = меш; vertex / edge / face = вершина / ребро / грань; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; loop cut / edge loop = петлевий розріз (Loop Cut) / петля ребер; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; material slot / node / pin = слот матеріалу / вузол / вхід; kit / kit piece / part of one object = набір / деталь / частина; harbour / quay / waterfront / pier = гавань / причал / набережна / пірс; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}, {"title": {"en": "Upright posts, a height setting and edge tests", "uk": "Вертикальні стовпи, налаштування висоти й тести крайніх випадків"}, "minutes": 40, "goals": [{"en": "Use Break Transform and Make Transform to change one part of a transform: keep the location, change the rotation or the scale.", "uk": "Використовувати Break Transform і Make Transform, щоб змінити одну частину трансформу: лишити розташування, а змінити поворот або масштаб."}, {"en": "Keep posts upright on slopes by keeping only the spline's Yaw (the turn around the up axis), and size them with Post Scale.", "uk": "Тримати стовпи вертикально на схилах, лишаючи з повороту сплайна тільки Yaw (поворот навколо вертикальної осі), і задавати їхній розмір параметром Post Scale."}, {"en": "Test the tool at its edges: a very short spline, a slope and a sharp corner.", "uk": "Перевіряти інструмент на краях: дуже короткий сплайн, схил і різкий кут."}], "doalong": [{"en": "Raise one spline point 3 m in the level. You see posts leaning with the slope: Get Transform at Distance Along Spline also gives pitch (tilt), and real posts stand upright.", "uk": "Підніми одну точку сплайна на 3 м. Стовпи нахиляються разом зі схилом: Get Transform at Distance Along Spline дає й Pitch (нахил). А справжні стовпи стоять вертикально."}, {"en": "Between Get Transform at Distance Along Spline and Add Instance add Break Transform. Drag from its Rotation pin and add Break Rotator; add a Make Rotator and connect only Z (Yaw) from Break Rotator to Make Rotator's Z (Yaw). You see a chain that keeps only the turn.", "uk": "Між Get Transform at Distance Along Spline і Add Instance додай Break Transform. Потягни від його виходу Rotation і додай Break Rotator. Додай Make Rotator і з'єднай лише Z (Yaw) з Break Rotator із Z (Yaw) у Make Rotator. Має вийти ланцюжок, що лишає тільки поворот навколо вертикалі."}, {"en": "Add a Float variable Post Scale (default 1, ranges 0.5 to 3, Instance Editable, Category Tool). Add Make Transform: Location from Break Transform, Rotation from Make Rotator, Scale from a Make Vector (1, 1, Post Scale; type 0.1 into X and Y if your post is the cylinder).", "uk": "Додай змінну Float Post Scale: типово 1, діапазони від 0.5 до 3, Instance Editable, категорія Tool. Додай Make Transform: Location з Break Transform, Rotation з Make Rotator, Scale з Make Vector (1, 1, Post Scale). Якщо стовп — циліндр, введи 0.1 у X і Y."}, {"en": "Connect it to Add Instance and Compile. You see upright posts on the slope, and Post Scale 1.5 makes them taller.", "uk": "З'єднай його з Add Instance і клацни Compile. Стовпи на схилі стоять вертикально, а Post Scale 1.5 робить їх вищими."}, {"en": "Right-click a spline point > Snap/Align > Snap to Floor (or select the point and press End). If neither works, move the point down with the blue Z arrow until it touches the ground. You see the curve meet the ground at that point.", "uk": "Клацни правою кнопкою на точці сплайна > Snap/Align > Snap to Floor або вибери точку й натисни End. Якщо жоден спосіб не спрацював, опускай точку синьою стрілкою Z, доки вона не торкнеться землі. Крива в цій точці сходиться із землею."}, {"en": "Shorten the spline to under 2 m. You see one post and nothing else, and no error: the tool handles the smallest case.", "uk": "Скороти сплайн до менш ніж 2 м. Лишається один стовп і жодної помилки: інструмент дає раду й найменшому випадку."}], "play": {"en": "Bug hunt: the tutor describes four broken fences (every post at the spline's start; posts leaning on a hill; the last post missing; posts piled up at the end). For each I name the node or pin I would check first.", "uk": "Полювання на помилки: тьютор описує чотири зламані паркани. Кожен стовп на початку сплайна; стовпи нахилені на пагорбі; бракує останнього стовпа; стовпи нагромаджені в кінці. Для кожного я називаю вузол або вхід, який перевірю першим."}, "video": {"search": "unreal engine 5 break transform make transform rotator yaw blueprint"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Вертикальні стовпи, налаштування висоти й тести крайніх випадків (Day 62, lesson 4 of 4). Today's build: BP_SplineFence: інструмент-паркан, що ставить стовпи з рівними проміжками вздовж сплайна, який ти формуєш на рівні, і рейки між ними. Плюс один паркан на твоєму острові..\nWhat I already know: День 61: BP_BollardRow (Construction Script, For Loop, Add Instance, змінні Instance Editable з діапазонами); День 8: SM_RailingPost. Підійде будь-яка модель стовпа з твого набору або /Engine/BasicShapes/Cylinder..\nEarlier today I already did: lesson 1 (Сплайни: лінія, яку можна намалювати на рівні); lesson 2 (Стовпи на відстані вздовж сплайна); lesson 3 (Правило стовпа огорожі: рахуй за довжиною). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Використовувати Break Transform і Make Transform, щоб змінити одну частину трансформу: лишити розташування, а змінити поворот або масштаб.\n2. Тримати стовпи вертикально на схилах, лишаючи з повороту сплайна тільки Yaw (поворот навколо вертикальної осі), і задавати їхній розмір параметром Post Scale.\n3. Перевіряти інструмент на краях: дуже короткий сплайн, схил і різкий кут.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: 2 lines on why today matters and where it comes back, in plain words (from this: Справжні краї ніколи не бувають прямими: набережні згинаються, стежки петляють, а краї скель звиваються. Сплайн дає намалювати на рівні будь-яку лінію, а інструмент заповнює її: паркан завдовжки 200 м готовий за хвилину й лишається редагованим. Сплайн-інструменти — одні з найпотрібніших у студіях, бо дизайнери рівнів змінюють їх щодня. It comes back: У п'ятницю (День 65) BP_SplineFence стане поручнями BP_Promenade. У День 85 та сама ідея відстані вздовж сплайна розставлятиме пропси PCG уздовж твоїх вулиць.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-62-spline-fence exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (Стовпи вздовж сплайна (будується крок за кроком на уроках)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Підніми одну точку сплайна на 3 м. Стовпи нахиляються разом зі схилом: Get Transform at Distance Along Spline дає й Pitch (нахил). А справжні стовпи стоять вертикально.\n   2. Між Get Transform at Distance Along Spline і Add Instance додай Break Transform. Потягни від його виходу Rotation і додай Break Rotator. Додай Make Rotator і з'єднай лише Z (Yaw) з Break Rotator із Z (Yaw) у Make Rotator. Має вийти ланцюжок, що лишає тільки поворот навколо вертикалі.\n   3. Додай змінну Float Post Scale: типово 1, діапазони від 0.5 до 3, Instance Editable, категорія Tool. Додай Make Transform: Location з Break Transform, Rotation з Make Rotator, Scale з Make Vector (1, 1, Post Scale). Якщо стовп — циліндр, введи 0.1 у X і Y. [screenshot]\n   4. З'єднай його з Add Instance і клацни Compile. Стовпи на схилі стоять вертикально, а Post Scale 1.5 робить їх вищими.\n   5. Клацни правою кнопкою на точці сплайна > Snap/Align > Snap to Floor або вибери точку й натисни End. Якщо жоден спосіб не спрацював, опускай точку синьою стрілкою Z, доки вона не торкнеться землі. Крива в цій точці сходиться із землею.\n   6. Скороти сплайн до менш ніж 2 м. Лишається один стовп і жодної помилки: інструмент дає раду й найменшому випадку. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Полювання на помилки: тьютор описує чотири зламані паркани. Кожен стовп на початку сплайна; стовпи нахилені на пагорбі; бракує останнього стовпа; стовпи нагромаджені в кінці. Для кожного я називаю вузол або вхід, який перевірю першим. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions:

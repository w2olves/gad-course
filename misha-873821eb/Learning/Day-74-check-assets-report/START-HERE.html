<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 74</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

/* the Done switch */

details{margin-top:22px;border-radius:20px;background:var(--well);box-shadow:var(--press);padding:0 18px}

.steps{list-style:none;padding:0;counter-reset:s;margin:4px 0 0}

.vid{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;margin-top:20px;font-size:15px;padding:16px 18px;border-radius:20px}

/* build */
.build.bossday{border-color:rgba(255,95,168,.35)}

.tiers{list-style:none;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:0}

.medal{display:flex;align-items:center;gap:10px;margin:0 0 8px;font:700 11.5px/1 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}

.m0{--mg:rgba(205,127,50,.6)}.m0 i{background:linear-gradient(135deg,#e7a46d,#9a5a2b)}
.m1{--mg:rgba(190,200,215,.7)}.m1 i{background:linear-gradient(135deg,#f3f6fa,#9aa5b3)}
.m2{--mg:rgba(245,195,91,.75)}.m2 i{background:linear-gradient(135deg,#ffe08a,#c99412)}
.ccount{display:flex;align-items:center;gap:16px;margin:28px 0 10px}

.check label{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:start;padding:14px 4px;cursor:pointer;border-bottom:1px solid var(--line)}
.check li:last-child label{border-bottom:0}
.check input{appearance:none;-webkit-appearance:none;width:26px;height:26px;margin:1px 0 0;border-radius:9px;background:var(--well);box-shadow:var(--press);display:grid;place-items:center;cursor:pointer;transition:background .2s,box-shadow .2s}
.check input::after{content:"";width:10px;height:5px;border:solid #fff;border-width:0 0 2.2px 2.2px;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.check input:checked{background:linear-gradient(145deg,#5fe39a,#16a34a);box-shadow:0 0 12px rgba(74,222,128,.55)}
.check input:checked::after{opacity:1}
.check li.on .tx{color:var(--faint)}
.check .ln{font:600 10.5px/1.3 var(--head);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);white-space:nowrap;margin-top:5px;padding:4px 9px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
/* quiz */
.pips{display:flex;gap:8px;margin:0 0 4px;padding:10px 14px;border-radius:999px;width:max-content;max-width:100%;flex-wrap:wrap}

.opt:hover:not([disabled]){transform:translateY(-1px);color:var(--accT)}
.opt.right{box-shadow:var(--press);background:var(--okBg);border-color:rgba(74,222,128,.45)}.opt.right .lt{background:var(--okL);color:#fff;box-shadow:0 0 10px var(--okL)}.opt.right .mk{color:var(--ok)}
.opt.wrong{box-shadow:var(--press);background:var(--badBg);border-color:rgba(255,93,93,.45)}.opt.wrong .lt{background:var(--badL);color:#fff;box-shadow:0 0 10px var(--badL)}.opt.wrong .mk{color:var(--bad)}

.opt[disabled]:not(.right):not(.wrong){opacity:.55;box-shadow:none}
.exp{margin:10px 0 0 50px;font-size:15.5px;color:var(--muted)}

.exp.r b{color:var(--ok)}.exp.w b{color:var(--bad)}
.score{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:32px;padding:18px 20px;border-radius:24px}

.nav a.nx{justify-content:flex-end;text-align:right;grid-column:2}
#toast{position:fixed;left:50%;bottom:28px;z-index:9;transform:translateX(-50%) translateY(16px);background:rgba(30,33,46,.82);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:#f4f5fa;border:1px solid rgba(255,255,255,.14);padding:13px 24px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none;font:600 14px/1.4 var(--head);max-width:min(92vw,560px);text-align:center;box-shadow:0 20px 40px -14px rgba(0,0,0,.5),0 0 24px var(--glow)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:860px){.how{grid-template-columns:repeat(2,minmax(0,1fr))}.tiers{grid-template-columns:1fr}}
@media (max-width:640px){
 body{font-size:16.5px}

}

mes its size (Build Scale 100), a mesh with its collision removed, a mesh with Nanite off and only one LOD, a texture over 2048 px, and an asset with a wrong name.", "uk": "Тестова папка Content/Tools/Day74/Check із п'ятьма навмисними проблемами: модель у 100 разів більша за свій розмір (Build Scale 100), модель із видаленою колізією, модель із вимкненим Nanite й одним LOD, текстура понад 2048 px і асет з неправильною назвою."}, {"en": "check_assets.py: FOLDER, REPORT, PREFIXES, MAX_TEXTURE and ALLOW at the top; three functions, name_problems, mesh_problems and texture_problems, each returning a list of problem texts (an empty list means a pass).", "uk": "check_assets.py: FOLDER, REPORT, PREFIXES, MAX_TEXTURE і ALLOW угорі; три функції, name_problems, mesh_problems і texture_problems, кожна повертає список текстів проблем (порожній список означає успіх)."}, {"en": "The checks: the largest side of a mesh's bounding box over 50 m or under 5 cm; no simple collision shapes; Nanite off with fewer than 2 LODs; a texture side over 2048; a missing prefix. Names in ALLOW are skipped on purpose.", "uk": "Перевірки: найбільша сторона габаритної рамки моделі понад 50 м або менше за 5 см; немає простих форм колізії; Nanite вимкнений із менш ніж 2 LOD; сторона текстури понад 2048; бракує префікса. Назви в ALLOW пропускаються навмисно."}, {"en": "A Markdown report: a title, a table with the columns Asset, Type and Problems, one row per asset with problems, and a count line, written with open(REPORT, 'w', encoding='utf-8') after os.makedirs.", "uk": "Звіт Markdown: заголовок, таблиця з колонками Asset, Type і Problems, один рядок на асет із проблемами та рядок із кількістю, записаний через open(REPORT, 'w', encoding='utf-8') після os.makedirs."}, {"en": "The test folder's report lists exactly the five planted problems, and after the fixes it lists none.", "uk": "Звіт тестової папки перелічує рівно п'ять навмисних проблем, а після виправлень не перелічує жодної."}, {"en": "Your kit's report, with every problem fixed or explained in fix_notes.md; the script's header says it changes nothing in the project, so it needs no dry run.", "uk": "Звіт твого набору, де кожну проблему виправлено або пояснено в fix_notes.md; заголовок скрипта каже, що він нічого не змінює в проєкті, тож пробний запуск йому не потрібен."}], "piece1": "check_assets.py on the test folder (lessons)", "piece2": {"en": "Your kit checked, fixed or explained, on your own", "uk": "Твій набір перевірено, виправлено або пояснено, самостійно"}, "steps": [{"text": {"en": "Check the test folder: five copies in Content/Tools/Day74/Check, each with one planted problem, and a sixth, correct copy. Check: you can name each copy's problem without opening it.", "uk": "Перевір тестову папку: п'ять копій у Content/Tools/Day74/Check, кожна з однією навмисною проблемою, і шоста, правильна копія. Перевірка: ти можеш назвати проблему кожної копії, не відкриваючи її."}, "lesson": 1}, {"text": {"en": "Run check_assets.py on the test folder. Check: the Output Log prints the report path and 5 assets with problems.", "uk": "Запусти check_assets.py на тестовій папці. Перевірка: Output Log друкує шлях до звіту й 5 assets with problems."}, "lesson": 4}, {"text": {"en": "Open IslandCourse/Saved/TechTools/asset_report.md in a Markdown preview (in VS Code: Ctrl+Shift+V). Check: a table with one row for each planted problem, and the correct copy is not in it.", "uk": "Відкрий IslandCourse/Saved/TechTools/asset_report.md у попередньому перегляді Markdown (у VS Code: Ctrl+Shift+V). Перевірка: таблиця з одним рядком на кожну навмисну проблему, а правильної копії в ній немає."}, "lesson": 4}, {"text": {"en": "Fix the planted problems one at a time and run the checker after each: set Build Scale back to 1 (Apply Changes); add collision in the Static Mesh editor (Collision > Add Box Simplified Collision); run set_nanite.py on the folder; lower the texture's Maximum Texture Size to 2048 or import a 2048 version; rename the badly named copy with rename_by_rules.py. Check: the count drops by one each time, down to 0.", "uk": "Виправляй навмисні проблеми по одній і запускай перевіряльник після кожної: встанови Build Scale назад на 1 (Apply Changes); додай колізію в редакторі Static Mesh (Collision > Add Box Simplified Collision); запусти set_nanite.py на папці; зменш Maximum Texture Size текстури до 2048 або імпортуй версію 2048; перейменуй погано названу копію через rename_by_rules.py. Перевірка: кількість щоразу зменшується на одиницю, до 0."}, "lesson": 3}, {"text": {"en": "Point FOLDER at your kit's folder and run. Check: asset_report.md lists every kit asset that has a problem, or says 0.", "uk": "Спрямуй FOLDER на папку свого набору й запусти. Перевірка: asset_report.md перелічує кожен асет набору, що має проблему, або каже 0."}, "lesson": 4}, {"text": {"en": "Write fix_notes.md: one line per problem in the kit report, either fixed (and how) or explained (for example, a roof panel whose box is fine, or a piece that uses complex collision on purpose). Check: every report row has a line.", "uk": "Напиши fix_notes.md: один рядок на кожну проблему у звіті набору, або виправлено (і як), або пояснено (наприклад, панель даху, чия рамка в нормі, або частина, що навмисно використовує складну колізію). Перевірка: кожен рядок звіту має свій рядок."}, "lesson": 2}, {"text": {"en": "Fix the three most important real problems, then run again. Check: the problem count is lower, and asset_report.md matches fix_notes.md.", "uk": "Виправ три найважливіші справжні проблеми, потім запусти знову. Перевірка: кількість проблем менша, а asset_report.md збігається з fix_notes.md."}, "lesson": 3}, {"text": {"en": "Add the names you explained on purpose to ALLOW and run again. Check: those names no longer appear, and nothing else disappeared.", "uk": "Додай назви, які навмисно пояснено, до ALLOW і запусти знову. Перевірка: ці назви більше не з'являються, і більше нічого не зникло."}, "lesson": 2}, {"text": {"en": "Take report_day74.png (the report table rendered in a preview) and check_folder.png (the test folder in the Content Browser). Check: two pictures in today's Work folder.", "uk": "Зроби report_day74.png (таблиця звіту, показана в попередньому перегляді) і check_folder.png (тестова папка в Content Browser). Перевірка: дві картинки в сьогоднішній папці Work."}, "lesson": 4}, {"text": {"en": "Record flythrough_day74.mp4 (60 seconds): run the checker on the test folder, open the report, fix one problem, run again. Check: the clip shows the count going down.", "uk": "Запиши flythrough_day74.mp4 (60 секунд): запусти перевіряльник на тестовій папці, відкрий звіт, виправ одну проблему, запусти знову. Перевірка: кліп показує, як кількість зменшується."}, "lesson": 4}, {"text": {"en": "Add a check_assets.py section to tool_notes.md: each check, its limit, and why it matters for a world flown by drone. Then click Copy the day report, paste it into a new tutor chat, answer its questions and save its answer as summary.md. Check: both files are in today's Work folder.", "uk": "Додай до tool_notes.md розділ про check_assets.py: кожна перевірка, її межа і чому це важливо для світу, у якому літає дрон. Потім натисни Copy the day report, встав його в новий чат із тьютором, дай відповіді на його запитання й збережи його відповідь як summary.md. Перевірка: обидва файли лежать у сьогоднішній папці Work."}, "lesson": 3}], "assets": ["techart/standards-sheet.md", "techart/code-style.md"]}, "lessons": [{"title": {"en": "Rules become functions", "uk": "Правила стають функціями"}, "minutes": 40, "goals": [{"en": "Turn a written rule from standards-sheet.md into a check: a function that returns a list of problems, empty when the asset passes.", "uk": "Перетвори записане правило з standards-sheet.md на перевірку: функцію, що повертає список проблем, порожній, коли асет проходить."}, {"en": "Plant known problems in a test folder, so you can prove the checker finds them.", "uk": "Підготуй відомі проблеми в тестовій папці, щоб довести, що перевіряльник їх знаходить."}, {"en": "Write name_problems(asset) with the PREFIXES rule.", "uk": "Напиши name_problems(asset) із правилом PREFIXES."}], "doalong": [{"en": "Open standards-sheet.md and find the five rules you check today: real scale, collision, Nanite or LODs, texture size and naming. You see each rule with its limit.", "uk": "Відкрий standards-sheet.md і знайди п'ять правил, які ти перевіряєш сьогодні: реальний масштаб, колізія, Nanite або LOD, розмір текстури й іменування. Ти бачиш кожне правило з його межею."}, {"en": "Make Content/Tools/Day74/Check with planted problems: duplicate a kit mesh and set its LOD 0 Build Settings > Build Scale to 100, 100, 100 (Apply Changes); duplicate another and remove its collision in the Static Mesh editor (Collision > Remove Collision); duplicate a third and turn its Nanite off; import any free 4096 px texture (for example a CC0 texture from Poly Haven) and name it T_Test_4k, so only its size is wrong; name one copy badname. Keep one correct copy too. You see six copies, five with a known problem.", "uk": "Створи Content/Tools/Day74/Check з навмисними проблемами: продублюй модель набору й встанови її LOD 0 Build Settings > Build Scale на 100, 100, 100 (Apply Changes); продублюй іншу й видали її колізію в редакторі Static Mesh (Collision > Remove Collision); продублюй третю й вимкни її Nanite; імпортуй будь-яку безкоштовну текстуру 4096 px (наприклад, текстуру CC0 з Poly Haven) і назви її T_Test_4k, щоб неправильним був лише її розмір; назви одну копію badname. Залиш ще одну правильну копію. Ти бачиш шість копій, п'ять із відомою проблемою."}, {"en": "Create check_assets.py in Content/Python with the settings, 9 lines: `import os`; `import unreal`; `FOLDER = '/Game/Tools/Day74/Check'`; `REPORT = unreal.Paths.project_dir() + 'Saved/TechTools/asset_report.md'`; `PREFIXES = {...}` copied from rename_by_rules.py; `MAX_TEXTURE = 2048`; `ALLOW = []` (names that are fine on purpose); `lib = unreal.EditorAssetLibrary`; `sub = unreal.get_editor_subsystem(unreal.StaticMeshEditorSubsystem)`. Add a first comment line: # Reads assets and writes a report; changes nothing. You see ten lines; running the file prints nothing yet.", "uk": "Створи check_assets.py у Content/Python із налаштуваннями, 9 рядків: `import os`; `import unreal`; `FOLDER = '/Game/Tools/Day74/Check'`; `REPORT = unreal.Paths.project_dir() + 'Saved/TechTools/asset_report.md'`; `PREFIXES = {...}`, скопійований із rename_by_rules.py; `MAX_TEXTURE = 2048`; `ALLOW = []` (назви, які навмисно в нормі); `lib = unreal.EditorAssetLibrary`; `sub = unreal.get_editor_subsystem(unreal.StaticMeshEditorSubsystem)`. Додай перший рядок-коментар: # Reads assets and writes a report; changes nothing. Ти бачиш десять рядків; запуск файлу поки нічого не друкує."}, {"en": "Add name_problems, 5 lines: `def name_problems(asset):`; (4 spaces) `prefix = PREFIXES.get(asset.get_class().get_name())`; (4) `if prefix and not asset.get_name().startswith(prefix):`; (8) `return ['name should start with ' + prefix]`; (4) `return []`. PREFIXES.get gives None when the type is not in the dictionary, and if treats None as false, so other types pass. You see the function in the file.", "uk": "Додай name_problems, 5 рядків: `def name_problems(asset):`; (4 пробіли) `prefix = PREFIXES.get(asset.get_class().get_name())`; (4) `if prefix and not asset.get_name().startswith(prefix):`; (8) `return ['name should start with ' + prefix]`; (4) `return []`. PREFIXES.get дає None, коли типу немає у словнику, а if вважає None хибним, тож інші типи проходять. Ти бачиш функцію у файлі."}, {"en": "Test it with one line at the bottom of the file: `print(name_problems(lib.load_asset('/Game/Tools/Day74/Check/badname')))`, and run the file. You see a list with one text, name should start with SM_ (or the prefix for its type). Delete the test line.", "uk": "Перевір її одним рядком унизу файлу: `print(name_problems(lib.load_asset('/Game/Tools/Day74/Check/badname')))` і запусти файл. Ти бачиш список з одним текстом, name should start with SM_ (або префікс для її типу). Видали тестовий рядок."}], "play": {"en": "Rule writer: the tutor reads me four studio rules (no texture over 2048; every prop has collision; lamp posts are 3 to 6 m tall; no asset name has spaces). For each I describe the check in one sentence of Python-like words.", "uk": "Автор правил: тьютор читає мені чотири студійні правила (жодної текстури понад 2048; кожен пропс має колізію; стовпи ліхтарів заввишки від 3 до 6 м; жодна назва асета не має пробілів). Для кожного я описую перевірку одним реченням словами, схожими на Python."}, "video": {"search": "unreal engine python asset validation script"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Rules become functions (Day 74, lesson 1 of 4).\nToday's build: check_assets.py in IslandCourse/Content/Python, tested on a folder of planted problems in Content/Tools/Day74/Check, then run on your real kit with its report and fix notes.\n\nBy the end of this lesson I can:\n1. Turn a written rule from standards-sheet.md into a check: a function that returns a list of problems, empty when the asset passes.\n2. Plant known problems in a test folder, so you can prove the checker finds them.\n3. Write name_problems(asset) with the PREFIXES rule.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (You have rename_by_rules.py, set_nanite.py and place_from_csv.py: Python tools that tidy, set up and place, with a dry run or one undo.), what I will learn today (You build a checker that finds broken assets before they reach your world, and writes a report you can act on.), encourage me (A good checker is a friend who reads every file so you do not have to; today you write that friend.), and share today's quote: \"Beware of bugs in the above code; I have only proved it correct, not tried it.\" (Donald Knuth).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 71: what does range(5) give in a for loop? | Day 69: weights 6, 3 and 1: what share of houses comes from the first row?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Rule writer: the tutor reads me four studio rules (no texture over 2048; every prop has collision; lamp posts are 3 to 6 m tall; no asset name has spaces). For each I describe the check in one sentence of Python-like words.\n6. Do-along on today's build (check_assets.py on the test folder (lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Open standards-sheet.md and find the five rules you check today: real scale, collision, Nanite or LODs, texture size and naming. You see each rule with its limit.\n   - Make Content/Tools/Day74/Check with planted problems: duplicate a kit mesh and set its LOD 0 Build Settings > Build Scale to 100, 100, 100 (Apply Changes); duplicate another and remove its collision in the Static Mesh editor (Collision > Remove Collision); duplicate a third and turn its Nanite off; import any free 4096 px texture (for example a CC0 texture from Poly Haven) and name it T_Test_4k, so only its size is wrong; name one copy badname. Keep one correct copy too. You see six copies, five with a known problem.\n   - Create check_assets.py in Content/Python with the settings, 9 lines: `import os`; `import unreal`; `FOLDER = '/Game/Tools/Day74/Check'`; `REPORT = unreal.Paths.project_dir() + 'Saved/TechTools/asset_report.md'`; `PREFIXES = {...}` copied from rename_by_rules.py; `MAX_TEXTURE = 2048`; `ALLOW = []` (names that are fine on purpose); `lib = unreal.EditorAssetLibrary`; `sub = unreal.get_editor_subsystem(unreal.StaticMeshEditorSubsystem)`. Add a first comment line: # Reads assets and writes a report; changes nothing. You see ten lines; running the file prints nothing yet.\n   - Add name_problems, 5 lines: `def name_problems(asset):`; (4 spaces) `prefix = PREFIXES.get(asset.get_class().get_name())`; (4) `if prefix and not asset.get_name().startswith(prefix):`; (8) `return ['name should start with ' + prefix]`; (4) `return []`. PREFIXES.get gives None when the type is not in the dictionary, and if treats None as false, so other types pass. You see the function in the file.\n   - Test it with one line at the bottom of the file: `print(name_problems(lib.load_asset('/Game/Tools/Day74/Check/badname')))`, and run the file. You see a list with one text, name should start with SM_ (or the prefix for its type). Delete the test line.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Measuring meshes: size and collision", "uk": "Вимірювання моделей: розмір і колізія"}, "minutes": 40, "goals": [{"en": "Read a mesh's size from its bounding box (max minus min, in cm) and flag sizes that suggest a wrong import scale.", "uk": "Прочитай розмір моделі з її габаритної рамки (max мінус min, у см) і познач розміри, що вказують на неправильний масштаб імпорту."}, {"en": "Count simple collision shapes with the StaticMeshEditorSubsystem and flag meshes that have none.", "uk": "Порахуй прості форми колізії через StaticMeshEditorSubsystem і познач моделі, що не мають жодної."}, {"en": "Allow exceptions on purpose with the ALLOW list, and write down why.", "uk": "Дозволяй винятки навмисно через список ALLOW і записуй чому."}], "doalong": [{"en": "In the Output Log load the 100-times copy as `m` with load_asset, then type `box = m.get_bounding_box()` and `print(box.max - box.min)`. You see sizes in the tens of thousands of centimetres: hundreds of metres for a bench.", "uk": "В Output Log завантаж копію у 100 разів більшу як `m` через load_asset, потім введи `box = m.get_bounding_box()` і `print(box.max - box.min)`. Ти бачиш розміри в десятки тисяч сантиметрів: сотні метрів для лавки."}, {"en": "Type `print(sub.get_simple_collision_count(m))` for the copy without collision and for a good mesh. You see 0, then 1 or more. If get_simple_collision_count is missing on the subsystem, try `unreal.EditorStaticMeshLibrary.get_simple_collision_count(m)`, or type `help(sub)` and look for a name with collision in it.", "uk": "Введи `print(sub.get_simple_collision_count(m))` для копії без колізії та для хорошої моделі. Ти бачиш 0, потім 1 або більше. Якщо get_simple_collision_count немає в підсистемі, спробуй `unreal.EditorStaticMeshLibrary.get_simple_collision_count(m)` або введи `help(sub)` і пошукай назву з collision."}, {"en": "Add to check_assets.py, 9 lines: `def mesh_problems(mesh):`; (4) `problems = []`; (4) `box = mesh.get_bounding_box()`; (4) `size = box.max - box.min`; (4) `biggest = max(size.x, size.y, size.z)`; (4) `if biggest > 5000 or biggest < 5:`; (8) `problems.append('size ' + str(round(biggest / 100, 2)) + ' m: check the import scale')`; (4) `if sub.get_simple_collision_count(mesh) == 0:`; (8) `problems.append('no simple collision')`. You see the function's first two checks.", "uk": "Додай до check_assets.py, 9 рядків: `def mesh_problems(mesh):`; (4) `problems = []`; (4) `box = mesh.get_bounding_box()`; (4) `size = box.max - box.min`; (4) `biggest = max(size.x, size.y, size.z)`; (4) `if biggest > 5000 or biggest < 5:`; (8) `problems.append('size ' + str(round(biggest / 100, 2)) + ' m: check the import scale')`; (4) `if sub.get_simple_collision_count(mesh) == 0:`; (8) `problems.append('no simple collision')`. Ти бачиш перші дві перевірки функції."}, {"en": "Talk through ALLOW with the tutor: a cliff mesh 60 m long is fine on purpose; a 3 cm pebble may be fine too. You see why exceptions belong in a list with a reason in fix_notes.md, not in a changed limit.", "uk": "Обговори ALLOW з тьютором: модель скелі завдовжки 60 м — нормально навмисно; камінчик 3 см теж може бути нормальним. Ти бачиш, чому винятки належать до списку з причиною в fix_notes.md, а не до зміненої межі."}], "play": {"en": "Too big or fine: the tutor gives bounding-box sizes (a bench 180 cm; a bench 18,000 cm; a cliff 4,800 cm; a pebble 3 cm; a roof panel 230 cm). I say pass or flag for each, and which flags are real problems.", "uk": "Забагато чи нормально: тьютор дає розміри габаритних рамок (лавка 180 см; лавка 18 000 см; скеля 4 800 см; камінчик 3 см; панель даху 230 см). Я кажу, пройшла чи позначена кожна, і які позначки — справжні проблеми."}, "video": {"search": "unreal engine python static mesh bounding box collision"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Measuring meshes: size and collision (Day 74, lesson 2 of 4).\nToday's build: check_assets.py in IslandCourse/Content/Python, tested on a folder of planted problems in Content/Tools/Day74/Check, then run on your real kit with its report and fix notes.\nEarlier today I already did: lesson 1 (Rules become functions). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Read a mesh's size from its bounding box (max minus min, in cm) and flag sizes that suggest a wrong import scale.\n2. Count simple collision shapes with the StaticMeshEditorSubsystem and flag meshes that have none.\n3. Allow exceptions on purpose with the ALLOW list, and write down why.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this le ries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Nanite, LODs and texture sizes", "uk": "Nanite, LOD і розміри текстур"}, "minutes": 40, "goals": [{"en": "Flag meshes with Nanite off and fewer than 2 LODs: nothing makes them cheaper far away.", "uk": "Познач моделі з вимкненим Nanite і менш ніж 2 LOD: ніщо не робить їх дешевшими здалеку."}, {"en": "Read a texture's size with blueprint_get_size_x and blueprint_get_size_y, and flag sides over 2048.", "uk": "Прочитай розмір текстури через blueprint_get_size_x і blueprint_get_size_y і познач сторони понад 2048."}, {"en": "Explain what each problem costs in a 60 fps world flown by a drone.", "uk": "Поясни, чого коштує кожна проблема у світі на 60 fps, у якому літає дрон."}], "doalong": [{"en": "Add to mesh_problems, 4 lines: (4) `nanite = sub.get_nanite_settings(mesh).get_editor_property('enabled')` (if get_nanite_settings is missing, use mesh.get_editor_property('nanite_settings'), as on Day 72); (4) `if not nanite and sub.get_lod_count(mesh) < 2:`; (8) `problems.append('no Nanite and no LODs')`; (4) `return problems`. You see the function finished.", "uk": "Додай до mesh_problems, 4 рядки: (4) `nanite = sub.get_nanite_settings(mesh).get_editor_property('enabled')` (якщо get_nanite_settings немає, використай mesh.get_editor_property('nanite_settings'), як у День 72); (4) `if not nanite and sub.get_lod_count(mesh) < 2:`; (8) `problems.append('no Nanite and no LODs')`; (4) `return problems`. Ти бачиш завершену функцію."}, {"en": "In the Output Log load your 4096 px texture as `t` and type `print(t.blueprint_get_size_x(), t.blueprint_get_size_y())`. You see st likely cause?", "uk": "check_assets.py позначає лавку на 180 м. Яка найімовірніша причина?"}, "options": [{"en": "The bench was exported or imported at the wrong scale", "uk": "Лавку експортовано або імпортовано в неправильному масштабі"}, {"en": "The bench has no LODs", "uk": "Лавка не має LOD"}, {"en": "Its texture is too big", "uk": "Її текстура завелика"}], "answer": 0, "explain": {"en": "A size 100 times too big usually means centimetres and metres were mixed up on export or import.", "uk": "Розмір, у 100 разів більший, зазвичай означає, що сантиметри й метри переплутали при експорті чи імпорті."}}, {"q": {"en": "A drone flies straight through a quay wall in Play. Which check would have caught it?", "uk": "Дрон пролітає крізь стіну причалу в Play. Яка перевірка це виявила б?"}, "options": [{"en": "Texture size", "uk": "Розмір текстури"}, {"en": "Naming", "uk": "Іменування"}, {"en": "Simple collision count", "uk": "Кількість простих колізій"}, {"en": "Nanite", "uk": "Nanite"}], "answer": 2, "explain": {"en": "A mesh with no simple collision lets things pass through it.", "uk": "Модель без простої колізії дає речам проходити крізь неї."}}, {"q": {"en": "Why does check_assets.py need no dry run?", "uk": "Чому check_assets.py не потребує пробного запуску?"}, "options": [{"en": "It runs too fast to matter", "uk": "Він працює надто швидко, щоб це мало значення"}, {"en": "Reports are never wrong", "uk": "Звіти ніколи не бувають неправильними"}, {"en": "It only reads assets and writes a report; nothing in the project changes", "uk": "Він лише читає асети й записує звіт; у проєкті нічого не змінюється"}], "answer": 2, "explain": {"en": "Dry runs protect against changes; a read-only tool changes nothing.", "uk": "Пробні запуски захищають від змін; інструмент лише для читання нічого не змінює."}}, {"q": {"en": "What does PREFIXES.get('Blueprint') return when 'Blueprint' is not a key?", "uk": "Що повертає PREFIXES.get('Blueprint'), коли 'Blueprint' не є ключем?"}, "options": [{"en": "An error", "uk": "Помилку"}, {"en": "None", "uk": "None"}, {"en": "'BP_'", "uk": "'BP_'"}, {"en": "An empty list", "uk": "Порожній список"}], "answer": 1, "explain": {"en": "get returns None for a missing key, where PREFIXES['Blueprint'] would raise a KeyError.", "uk": "get повертає None для відсутнього ключа, тоді як PREFIXES['Blueprint'] викликав би KeyError."}}, {"q": {"en": "Your roof panel is flagged, but you decided on Day 8 that it is fine. What should you do?", "uk": "Твою панель даху позначено, але ще в День 8 записано, що вона в нормі. Що робити?"}, "options": [{"en": "Keep it flagged forever", "uk": "Лишити її позначеною назавжди"}, {"en": "Delete the panel", "uk": "Видалити панель"}, {"en": "Turn the checker off", "uk": "Вимкнути перевіряльник"}, {"en": "Put its name in ALLOW and write the reason in fix_notes.md", "uk": "Додати її назву в ALLOW і записати причину в fix_notes.md"}], "answer": 3, "explain": {"en": "An ALLOW list with written reasons keeps the checker strict for everything else.", "uk": "Список ALLOW із записаними причинами тримає перевіряльник суворим до всього іншого."}}], "weekInfo": null, "morning": {"sofar": {"en": "You have rename_by_rules.py, set_nanite.py and place_from_csv.py: Python tools that tidy, set up and place, with a dry run or one undo.", "uk": "Ти маєш rename_by_rules.py, set_nanite.py і place_from_csv.py: інструменти Python, що впорядковують, налаштовують і розставляють, із пробним запуском або одним скасуванням."}, "today": {"en": "You build a checker that finds broken assets before they reach your world, and writes a report you can act on.", "uk": "Ти будуєш перевіряльник, що знаходить зламані асети до того, як вони потраплять у твій світ, і записує звіт, за яким можна діяти."}, "cheer": {"en": "A good checker is a friend who reads every file so you do not have to; today you write that friend.", "uk": "Добрий перевіряльник — це друг, що читає кожен файл замість тебе; сьогодні ти пишеш цього друга."}, "quote": {"text": {"en": "Beware of bugs in the above code; I have only proved it correct, not tried it.", "uk": "Остерігайтеся помилок у цьому коді: я лише довів його правильність, але не пробував його запускати."}, "author": {"en": "Donald Knuth", "uk": "Дональд Кнут"}, "source": "Notes on the van Emde Boas construction of priority deques, a memo of 1977"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-74-check-assets-report", "mapHref": "../../COURSE.html", "prevHref": "../Day-73-place-from-csv-undo/START-HERE.html", "nextHref": "../Day-75-boss-euw-techtools/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8 with its Python, and a plain text editor. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me: when my Blueprint or script fails, ask for the error message or a screenshot of the graph, point to the line or node that is wrong and explain why, then let me fix it myself. Never write the whole tool for me. Keep me moving and make it feel like a game.\n\nToday I build on my own: Your kit checked, fixed or explained, on your own.\nIt's part of: check_assets.py in IslandCourse/Content/Python, tested on a folder of planted problems in Content/Tools/Day74/Check, then run on your real kit with its report and fix notes (Content/Tools/Day74/Check (copies with planted problems) and your kit folder; the report goes to IslandCourse/Saved/TechTools/asset_report.md.).\n\nSpec:\n- A test folder Content/Tools/Day74/Check with five planted problems: a mesh at 100 times its size (Build Scale 100), a mesh with its collision removed, a mesh with Nanite off and only one LOD, a texture over 2048 px, and an asset with a wrong name.\n- check_assets.py: FOLDER, REPORT, PREFIXES, MAX_TEXTURE and ALLOW at the top; three functions, name_problems, mesh_problems and texture_problems, each returning a list of problem texts (an empty list means a pass).\n- The checks: the largest side of a mesh's bounding box over 50 m or under 5 cm; no simple collision shapes; Nanite off with fewer than 2 LODs; a texture side over 2048; a missing prefix. Names in ALLOW are skipped on purpose.\n- A Markdown report: a title, a table with the columns Asset, Type and Problems, one row per asset with problems, and a count line, written with open(REPORT, 'w', encoding='utf-8') after os.makedirs.\n- The test folder's report lists exactly the five planted problems, and after the fixes it lists none.\n- Your kit's report, with every problem fixed or explained in fix_notes.md; the script's header says it changes nothing in the project, so it needs no dry run.\n\nMy checklist:\n1. Check the test folder: five copies in Content/Tools/Day74/Check, each with one planted problem, and a sixth, correct copy. Check: you can name each copy's problem without opening it. (from lesson 1)\n2. Run check_assets.py on the test folder. Check: the Output Log prints the report path and 5 assets with problems. (from lesson 4)\n3. Open IslandCourse/Saved/TechTools/asset_report.md in a Markdown preview (in VS Code: Ctrl+Shift+V). Check: a table with one row for each planted problem, and the correct copy is not in it. (from lesson 4)\n4. Fix the planted problems one at a time and run the checker after each: set Build Scale back to 1 (Apply Changes); add collision in the Static Mesh editor (Collision > Add Box Simplified Collision); run set_nanite.py on the folder; lower the texture's Maximum Texture Size to 2048 or import a 2048 version; rename the badly named copy with rename_by_rules.py. Check: the count drops by one each time, down to 0. (from lesson 3)\n5. Point FOLDER at your kit's folder and run. Check: asset_report.md lists every kit asset that has a problem, or says 0. (from lesson 4)\n6. Write fix_notes.md: one line per problem in the kit report, either fixed (and how) or explained (for example, a roof panel whose box is fine, or a piece that uses complex collision on purpose). Check: every report row has a line. (from lesson 2)\n7. Fix the three most important real problems, then run again. Check: the problem count is lower, and asset_report.md matches fix_notes.md. (from lesson 3)\n8. Add the names you explained on purpose to ALLOW and run again. Check: those names no longer appear, and nothing else disappeared. (from lesson 2)\n9. Take report_day74.png (the report table rendered in a preview) and check_folder.png (the test folder in the Content Browser). Check: two pictures in today's Work folder. (from lesson 4)\n10. Record flythrough_day74.mp4 (60 seconds): run the checker on the test folder, open the report, fix one problem, run again. Check: the clip shows the count going down. (from lesson 4)\n11. Add a check_assets.py section to tool_notes.md: each check, its limit, and why it matters for a world flown by drone. Then click Copy the day report, paste it into a new tutor chat, answer its questions and save its answer as summary.md. Check: both files are in today's Work folder. (from lesson 3)\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Misha\nDay 74: check_assets.py: an asset checker with a Markdown report. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p><div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+list(D.handin,'ul','ticks')+'<p class="path">'+ic('folder')+'<span>'+u('shipTo')+' <code>'+esc(D.workPath)+'</code></span></p>'+(D.lessons.length?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<p class="muted">'+u('report')+'</p><div class="row"><button class="btn s" onclick="cp(D.reportPrompt)">'+ic('copy')+u('copyR')+'</button></div></section>';
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();

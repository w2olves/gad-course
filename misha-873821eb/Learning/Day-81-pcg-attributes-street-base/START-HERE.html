<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 81</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

StreetSpline у Content/Tools/Blueprints."}, "spec": [{"en": "L_Day81: the Basic level's Floor replaced by a Cube slab (Location 0, 0, -50, Scale 300, 300, 1, so its top is at Z = 0), and a PCG Volume of 200 x 200 m (Location 10000, 0, 0, Scale 100, 100, 20).", "uk": "L_Day81: Floor базового рівня замінено плитою Cube (Location 0, 0, -50, Scale 300, 300, 1, тож її верх на Z = 0) і PCG Volume 200 × 200 м (Location 10000, 0, 0, Scale 100, 100, 20)."}, {"en": "BP_StreetSpline: an Actor Blueprint with one Spline component named Street and the actor tag Street in Class Defaults; two placed copies, one straight (120 m) and one with two bends, all points on the ground.", "uk": "BP_StreetSpline — Actor Blueprint з одним компонентом Spline на ім'я Street і тегом актора Street у Class Defaults. Поставлено дві копії: пряму (120 м) і з двома вигинами, усі точки на землі."}, {"en": "PCG_Street_Base on the volume: Get Spline Data (All World Actors, By Tag, Street, Select Multiple) > Spline Sampler (Mode Distance, Distance Increment 400) > side A: Transform Points (Offset 0, 450, 0) and side B: Transform Points (Rotation Z 180) then Transform Points (Offset 0, 450, 0) > Attribute Maths Op writing Slot = $Index modulo 5 > Attribute Filters by Slot > Static Mesh Spawners.", "uk": "PCG_Street_Base на об'ємі: Get Spline Data (All World Actors, By Tag, Street, Select Multiple) > Spline Sampler (Mode Distance, Distance Increment 400). Далі бік A: Transform Points (Offset 0, 450, 0), а бік B: Transform Points (Rotation Z 180), потім Transform Points (Offset 0, 450, 0). Потім Attribute Maths Op пише Slot = $Index modulo 5 > Attribute Filters за Slot > Static Mesh Spawners."}, {"en": "Slot 0: SM_LampPost; Slots 1 and 3: SM_Bollard; Slot 2: SM_Bench facing the road, thinned at random with Attribute Noise and a Density Filter; Slot 4: empty walking space. A lamp every 20 m on both sides.", "uk": "Slot 0: SM_LampPost. Slots 1 і 3: SM_Bollard. Slot 2: SM_Bench, повернута до дороги й випадково проріджена вузлами Attribute Noise і Density Filter. Slot 4: порожнє місце для проходу. Ліхтар кожні 20 м з обох боків."}, {"en": "A heading Day 81 in techtools_notes.md: the attributes you saw in Inspect ($Position, $Rotation, $Scale, $Density, $Seed, $BoundsMin, $BoundsMax, $Steepness, $Color and your Slot), one line each on what it means.", "uk": "Заголовок Day 81 у techtools_notes.md: атрибути зі списку Inspect ($Position, $Rotation, $Scale, $Density, $Seed, $BoundsMin, $BoundsMax, $Steepness, $Color і твій Slot), по рядку на кожен — що він означає."}, {"en": "Nothing floating on the flat ground, nothing on the road, benches facing the road; the same Seed always gives the same street.", "uk": "На пласкій землі ніщо не висить, на дорозі нічого не стоїть, лавки повернуті до дороги. Те саме зерно (Seed) завжди дає ту саму вулицю."}], "piece1": "PCG_Street_Base: kerb slots and the lamp rule (built step by step in the lessons)", "piece2": {"en": "On your own: a bin beside every bench, and a quieter rule for the bent street", "uk": "Самостійно: урна біля кожної лавки й тихіше правило для вигнутої вулиці"}, "steps": [{"text": {"en": "Check: the results of today's lessons are there (PCG_Street_Base with the kerb slots and the lamp rule, and two BP_StreetSpline copies, in L_Day81). Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it. Weak PC (16 GB of RAM or less): shrink the PCG volume to 100 x 100 m while you build and grow it for the final pictures (see the weak-PC section of ACCOUNTS-AND-INSTALLS.html). Open L_Day81, select the PCG Volume and click Generate on its PCG component. Check: lamps every 20 m on both sides of both streets, bollards and benches between them, nothing on the road.", "uk": "Спершу перевір, чи є результати сьогоднішніх уроків: PCG_Street_Base зі слотами вздовж бордюрів і правилом ліхтаря та дві копії BP_StreetSpline у L_Day81. Чогось бракує? Зроби вправу того уроку зараз (близько 25 хв), бо вона потрібна для збірки. Слабкий ПК (16 ГБ оперативної пам'яті або менше)? Під час роботи зменш об'єм PCG до 100 × 100 м, а для фінальних зображень збільш (див. розділ про слабкий ПК в ACCOUNTS-AND-INSTALLS.html). Відкрий L_Day81, вибери PCG Volume і клацни Generate на його компоненті PCG. Перевірка: ліхтарі кожні 20 м з обох боків обох вулиць, між ними стовпчики й лавки, на дорозі нічого."}, "lesson": 3}, {"text": {"en": "In PCG_Street_Base click each node in turn and press D, then A. Check: you can say how many points each node outputs, and the numbers make sense (both sides together after the Transform Points, fewer after each filter).", "uk": "У PCG_Street_Base клацай вузли по черзі й натискай D, потім A. Перевірка: ти можеш сказати, скільки точок виводить кожен вузол, і числа логічні: після Transform Points обидва боки разом, після кожного фільтра менше."}, "lesson": 1}, {"text": {"en": "Under a heading Day 81 in techtools_notes.md, write the attributes from the Inspect list of the Attribute Maths Op node. Check: ten lines, your Slot included, each saying what the attribute means in plain words.", "uk": "Під заголовком Day 81 у techtools_notes.md запиши атрибути зі списку Inspect вузла Attribute Maths Op. Перевірка: десять рядків, разом із твоїм Slot, кожен простими словами пояснює, що означає атрибут."}, "lesson": 1}, {"text": {"en": "Move one point of the bent street and Generate. Check: the slots follow the new curve, both rows stay 4.5 m from the centre line, and the benches still face the road.", "uk": "Пересунь одну точку вигнутої вулиці й клацни Generate. Перевірка: слоти йдуть за новою кривою, обидва ряди лишаються на 4,5 м від осьової лінії, а лавки повернуті до дороги."}, "lesson": 2}, {"text": {"en": "Change the Spline Sampler's Distance Increment to 500 and Generate. Check: lamps now stand every 25 m; set it back to 400 and see 20 m again.", "uk": "Зміни Distance Increment у Spline Sampler на 500 і клацни Generate. Перевірка: ліхтарі тепер кожні 25 м. Поверни 400 — знову 20 м."}, "lesson": 3}, {"text": {"en": "Change the volume's Seed on its PCG component from 42 to 7 and Generate, then back to 42. Check: a different set of benches is thinned out with 7, and 42 brings back exactly the first street.", "uk": "Зміни Seed на компоненті PCG об'єму з 42 на 7, клацни Generate, потім поверни 42. Перевірка: із 7 проріджено інший набір лавок, а 42 повертає першу вулицю точно такою самою."}, "lesson": 4}, {"text": {"en": "Click Attribute Noise, press E (disable) and Generate, then press E again and Generate. Check: with it disabled every bench comes back, which proves that node does the thinning.", "uk": "Клацни Attribute Noise, натисни E (вимкнути) і Generate, потім знову E і Generate. Перевірка: з вимкненим вузлом повертаються всі лавки — отже, проріджує саме він."}, "lesson": 4}, {"text": {"en": "On your own: from the bench points (after the Density Filter) add a Transform Points with Offset 130, 0, 0 (1.3 m along the street: half your 1.8 m bench, half a bin and a small gap) and a Static Mesh Spawner with SM_Bin. Check: every bench has a bin beside it, on the pavement, never on the road.", "uk": "Самостійно: від точок лавок (після Density Filter) додай Transform Points з Offset 130, 0, 0 — 1,3 м уздовж вулиці: половина лавки 1,8 м, половина урни й невеликий проміжок. Додай Static Mesh Spawner з SM_Bin. Перевірка: біля кожної лавки урна, на тротуарі, ніколи на дорозі."}, "lesson": 2}, {"text": {"en": "On your own: tag the bent street StreetQuiet instead of Street (on the placed copy: Details > Actor > Tags), and in the graph copy the Get Spline Data branch for StreetQuiet with benches only on side A (no side B branch for benches). Check: the bent street has benches on one side only, the straight street on both.", "uk": "Самостійно: познач вигнуту вулицю тегом StreetQuiet замість Street (на розміщеній копії: Details > Actor > Tags). У графі скопіюй гілку Get Spline Data для StreetQuiet, а лавки лиши лише з боку A, без гілки боку B для лавок. Перевірка: на вигнутій вулиці лавки лише з одного боку, на прямій — з обох."}, "lesson": 3}, {"text": {"en": "Fly both streets at 2 m and at 30 m. Save L_Day81 (Ctrl+S), open any other level and open L_Day81 again, then Generate. Check: nothing floats, nothing stands on the road, and from 30 m the lamps read as two even rows.", "uk": "Пролети обидві вулиці на висоті 2 м і 30 м. Збережи L_Day81 (Ctrl+S), відкрий будь-який інший рівень, а тоді знову L_Day81 і клацни Generate. Перевірка: ніщо не висить, на дорозі нічого не стоїть, а з 30 м ліхтарі стоять двома рівними рядами."}, "lesson": 2}, {"text": {"en": "Take graph_day81.png (the whole graph, node names readable) and street_30m.png (both streets from 30 m up). Check: two pictures in today's Work folder.", "uk": "Зроби два скриншоти: graph_day81.png (увесь граф, назви вузлів читаються) і street_30m.png (обидві вулиці з 30 м). Перевірка: обидва зображення в робочій папці дня."}, "lesson": 1}, {"text": {"en": "Click Copy the day report, paste it into a new tutor chat, answer its questions and save its answer as summary.md in today's Work folder. Drag summary.md, graph_day81.png and street_30m.png into today's hand-in folder (the button on this page); never a project or level folder. Check: the hand-in folder lists 3 files, each over 1 KB.", "uk": "Клацни «Копіювати звіт дня», встав текст у новий чат із тьютором, дай відповіді на його запитання й збережи відповідь як summary.md у робочій папці дня. Перетягни summary.md, graph_day81.png і street_30m.png у папку здачі (кнопка на цій сторінці). Ніколи не здавай папку проєкту чи рівня. Перевірка: у папці здачі 3 файли, кожен більший за 1 КБ."}, "lesson": 1}], "assets": ["techart/street-dimensions.md"], "next": {"en": "PCG_Street_Base reads a landscape and a painted mask tomorrow (Day 82), gets your own node on Day 83 and buildings on Day 84, and on Friday (Day 85) grows into PCG_StreetDresser.", "uk": "Завтра (День 82) PCG_Street_Base читатиме ландшафт і намальовану маску. У День 83 отримає твій власний вузол, у День 84 — будинки, а в п'ятницю (День 85) виросте в PCG_StreetDresser."}}, "lessons": [{"title": {"en": "Points carry data: attributes and the debug view", "uk": "Точки несуть дані: атрибути та режим налагодження"}, "minutes": 40, "goals": [{"en": "Explain point attributes: every PCG point carries properties ($Position, $Rotation, $Scale, $Density, $Seed, $BoundsMin and $BoundsMax, $Steepness, $Color), and can carry named attributes of your own (metadata).", "uk": "Пояснювати атрибути точок. Кожна точка PCG несе властивості ($Position, $Rotation, $Scale, $Density, $Seed, $BoundsMin і $BoundsMax, $Steepness, $Color) і може нести власні іменовані атрибути (метадані)."}, {"en": "Read them with the debug view (D), Inspect (A) and the attribute list, and switch a node off with E to see what it does.", "uk": "Читати їх у режимі налагодження (D), в Inspect (A) і в списку атрибутів, а вузол вимикати клавішею E, щоб побачити, що він робить."}, {"en": "Set up the practice street: a ground slab, BP_StreetSpline with the tag Street, and a PCG Volume.", "uk": "Готувати тренувальну вулицю: плиту землі, BP_StreetSpline з тегом Street і PCG Volume."}], "doalong": [{"en": "Choose File > New Level > Basic and save it as L_Day81 in Content/Tools/Day81. Delete Floor. From Place Actors > Shapes drag a Cube and set Location 0, 0, -50 and Scale 300, 300, 1. You see a 300 m square ground whose top is at Z = 0.", "uk": "Вибери File > New Level > Basic і збережи рівень як L_Day81 у Content/Tools/Day81. Видали Floor. З Place Actors > Shapes перетягни Cube і задай Location 0, 0, -50 і Scale 300, 300, 1. Має вийти земля 300 × 300 м, верх якої на Z = 0."}, {"en": "In Content/Tools/Blueprints make an Actor Blueprint BP_StreetSpline and add a Spline component named Street. Click Class Defaults, find Actor > Tags (open the small arrow for advanced settings if hidden), click + and type Street. Compile and Save. You see the tag in Class Defaults.", "uk": "У Content/Tools/Blueprints створи Actor Blueprint BP_StreetSpline і додай компонент Spline на ім'я Street. Клацни Class Defaults, знайди Actor > Tags (розгорни маленьку стрілку прихованих налаштувань, якщо треба), клацни + і введи Street. Compile і Save. Тег з'являється в Class Defaults."}, {"en": "Drag BP_StreetSpline into the level at 0, -5000, 0, select its end point and Alt+drag it out about 120 m along X. Place a second copy at 0, 4000, 0 and give it two bends with Alt+drag. You see two street lines on the ground.", "uk": "Перетягни BP_StreetSpline на рівень у точку 0, -5000, 0, вибери кінцеву точку й перетягни її з Alt приблизно на 120 м уздовж X. Постав другу копію в 0, 4000, 0 і зроби їй два вигини перетягуванням з Alt. На землі дві лінії вулиць."}, {"en": "In Content/Tools/PCG make a PCG Graph PCG_Street_Base (click Create empty graph if asked). Add Get Spline Data (Actor Filter All World Actors, Actor Selection By Tag, Actor Selection Tag Street, Select Multiple ticked) and a Spline Sampler (Mode Distance, Distance Increment 400) wired into Output.", "uk": "У Content/Tools/PCG створи PCG Graph PCG_Street_Base (якщо питає, клацни Create empty graph). Додай Get Spline Data (Actor Filter All World Actors, Actor Selection By Tag, Actor Selection Tag Street, Select Multiple позначено) і Spline Sampler (Mode Distance, Distance Increment 400), з'єднаний з Output."}, {"en": "Place a PCG Volume at 10000, 0, 0 with Scale 100, 100, 20, set its Graph and click Generate. Select the Spline Sampler and press D. You see a point every 4 m along both streets.", "uk": "Постав PCG Volume у 10000, 0, 0 зі Scale 100, 100, 20, задай йому Graph і клацни Generate. Вибери Spline Sampler і натисни D. Уздовж обох вулиць точка кожні 4 м."}, {"en": "With the Spline Sampler still selected, press A. You see a table with one row per point and columns such as $Position, $Rotation, $Scale, $Density, $Seed, $BoundsMin, $BoundsMax, $Steepness and $Color. Compare $Rotation on two rows from a bend. You see different rotations: each point faces along the street.", "uk": "Не знімаючи виділення зі Spline Sampler, натисни A. Відкривається таблиця: рядок на точку, стовпці $Position, $Rotation, $Scale, $Density, $Seed, $BoundsMin, $BoundsMax, $Steepness і $Color. Порівняй $Rotation у двох рядках із вигину: повороти різні, бо кожна точка дивиться вздовж вулиці."}], "play": {"en": "Attribute bingo: the tutor names eight facts about a point (where it is; which way it faces; how big its box is; how likely it is to survive a filter; its own random number; its colour; how steep the ground was; a number I added myself). For each I name the attribute that holds it.", "uk": "Бінго атрибутів: тьютор називає вісім фактів про точку — де вона; куди дивиться; якого розміру її рамка; наскільки ймовірно, що вона пройде фільтр; її власне випадкове число; її колір; наскільки крутою була земля; число, додане вручну. Для кожного я називаю атрибут, що його тримає."}, "video": {"search": "unreal engine 5 pcg attributes inspect debug points spline sampler"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Точки несуть дані: атрибути та режим налагодження (Day 81, lesson 1 of 4). Today's build: PCG_Street_Base і BP_StreetSpline: один граф на PCG Volume 200 × 200 м. Він знаходить кожен сплайн вулиці за тегом і ставить ліхтарі, стовпчики й лавки в слоти вздовж обох бордюрів за правилами атрибутів..\nWhat I already know: День 38: Get Spline Data за тегом, Spline Sampler, Bounds Modifier і Difference; День 36: режим налагодження (D), Inspect (A), Density Filter, Self Pruning і Transform Points; День 62 і День 63: малювання сплайнів, BP_SplineFence і BP_SplineScatter; Дні 1–5: твої вуличні пропси (SM_LampPost, SM_Bench, SM_Bollard, SM_Bin). Пропущено їх? Візьми меші з /Engine/BasicShapes, масштабовані до розмірів зі street-dimensions.md, і запиши це..\n\nBy the end of this lesson I can:\n1. Пояснювати атрибути точок. Кожна точка PCG несе властивості ($Position, $Rotation, $Scale, $Density, $Seed, $BoundsMin і $BoundsMax, $Steepness, $Color) і може нести власні іменовані атрибути (метадані).\n2. Читати їх у режимі налагодження (D), в Inspect (A) і в списку атрибутів, а вузол вимикати клавішею E, щоб побачити, що він робить.\n3. Готувати тренувальну вулицю: плиту землі, BP_StreetSpline з тегом Street і PCG Volume.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: Ти маєш конвеєр Blender, що перетворює зерна на чисті перевірені меші в Unreal, зокрема десять скель хвилерізу на твоєму острові. Today: Ти дізнаєшся, як точки PCG несуть дані, і пишеш правила, що їх читають: ліхтар кожні 20 м, а між ними стовпчики й лавки. One encouraging line: PCG винагороджує уважний погляд. Частіше натискай D і A, і точки покажуть, що насправді зробив кожен вузол.); 2 lines on why today matters and where it comes back, in plain words (from this: Розставляти вуличне облаштування вручну повільно, і рівно ніколи не виходить, а справжні вулиці підкоряються простим правилам, як-от ліхтар кожні 20 м з обох боків. У PCG кожна точка отримує атрибути, а правила їх читають. Тому кожне рішення можна побачити, перевірити й змінити в режимі налагодження. Дизайнери рівнів довіряють інструментам розстановки, які можна прочитати, і створювати такі інструменти — основна робота технічного художника. It comes back: Завтра (День 82) PCG_Street_Base читатиме ландшафт і намальовану маску. У День 83 отримає твій власний вузол, у День 84 — будинки, а в п'ятницю (День 85) виросте в PCG_StreetDresser.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-81-pcg-attributes-street-base exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (PCG_Street_Base: слоти вздовж бордюрів і правило ліхтаря (крок за кроком на уроках)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Вибери File > New Level > Basic і збережи рівень як L_Day81 у Content/Tools/Day81. Видали Floor. З Place Actors > Shapes перетягни Cube і задай Location 0, 0, -50 і Scale 300, 300, 1. Має вийти земля 300 × 300 м, верх якої на Z = 0.\n   2. У Content/Tools/Blueprints створи Actor Blueprint BP_StreetSpline і додай компонент Spline на ім'я Street. Клацни Class Defaults, знайди Actor > Tags (розгорни маленьку стрілку прихованих налаштувань, якщо треба), клацни + і введи Street. Compile і Save. Тег з'являється в Class Defaults.\n   3. Перетягни BP_StreetSpline на рівень у точку 0, -5000, 0, вибери кінцеву точку й перетягни її з Alt приблизно на 120 м уздовж X. Постав другу копію в 0, 4000, 0 і зроби їй два вигини перетягуванням з Alt. На землі дві лінії вулиць. [screenshot]\n   4. У Content/Tools/PCG створи PCG Graph PCG_Street_Base (якщо питає, клацни Create empty graph). Додай Get Spline Data (Actor Filter All World Actors, Actor Selection By Tag, Actor Selection Tag Street, Select Multiple позначено) і Spline Sampler (Mode Distance, Distance Increment 400), з'єднаний з Output.\n   5. Постав PCG Volume у 10000, 0, 0 зі Scale 100, 100, 20, задай йому Graph і клацни Generate. Вибери Spline Sampler і натисни D. Уздовж обох вулиць точка кожні 4 м.\n   6. Не знімаючи виділення зі Spline Sampler, натисни A. Відкривається таблиця: рядок на точку, стовпці $Position, $Rotation, $Scale, $Density, $Seed, $BoundsMin, $BoundsMax, $Steepness і $Color. Порівняй $Rotation у двох рядках із вигину: повороти різні, бо кожна точка дивиться вздовж вулиці. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Бінго атрибутів: тьютор називає вісім фактів про точку — де вона; куди дивиться; якого розміру її рамка; наскільки ймовірно, що вона пройде фільтр; її власне випадкове число; її колір; наскільки крутою була земля; число, додане вручну. Для кожного я називаю атрибут, що його тримає. Otherwise skip it.\n6. Review: ask me these questions from earlier days, one at a time, and correct me kind роблено до розвороту на 180°, а не після нього"}, {"en": "The Seed changed", "uk": "Змінився Seed"}, {"en": "The mesh is wrong", "uk": "Меш хибний"}, {"en": "Self Pruning is missing", "uk": "Немає Self Pruning"}], "answer": 0, "explain": {"en": "The offset is in the point's own space; turn the point first, and its own right becomes the other kerb.", "uk": "Зсув відбувається у власному просторі точки. Спершу розверни точку, і її «праворуч» стане іншим бордюром."}}, {"q": {"en": "Why does an offset of 0, 450, 0 follow the bends of the street?", "uk": "Чому зсув 0, 450, 0 іде за вигинами вулиці?"}, "options": [{"en": "Because PCG snaps props to splines", "uk": "Бо PCG прив'язує пропси до сплайнів"}, {"en": "Because the volume is rotated", "uk": "Бо об'єм повернуто"}, {"en": "Because Absolute Offset is ticked", "uk": "Бо Absolute Offset позначено"}, {"en": "Because the offset is in each point's own space, which turns with the street", "uk": "Бо зсув відбувається у власному просторі кожної точки, який повертається разом із вулицею"}], "answer": 3, "explain": {"en": "Spline Sampler points face along the street, and a local offset turns with them.", "uk": "Точки Spline Sampler дивляться вздовж вулиці, а локальний зсув повертається разом із ними."}}, {"q": {"en": "You press E on a node and Generate. What do you learn?", "uk": "Ти натискаєш E на вузлі й клацаєш Generate. Що ти дізнаєшся?"}, "options": [{"en": "Nothing: E renames it", "uk": "Нічого: E перейменовує його"}, {"en": "What the graph does without that node, because a disabled node passes its points through", "uk": "Що робить граф без цього вузла: вимкнений вузол пропускає точки без змін"}, {"en": "Whether the node is expensive", "uk": "Чи вузол дорогий"}, {"en": "The node's seed", "uk": "Зерно вузла"}], "answer": 1, "explain": {"en": "Switching one node off and comparing is the quickest proof of what that node does.", "uk": "Вимкнути один вузол і порівняти — найшвидший спосіб довести, що він робить."}}], "weekInfo": null, "morning": {"sofar": {"en": "You have a Blender pipeline that turns seeds into clean, checked meshes in Unreal, including ten rocks on your island's breakwater.", "uk": "Ти маєш конвеєр Blender, що перетворює зерна на чисті перевірені меші в Unreal, зокрема десять скель хвилерізу на твоєму острові."}, "today": {"en": "You learn how PCG points carry data, and write rules that read it: a lamp every 20 m, bollards and benches between.", "uk": "Ти дізнаєшся, як точки PCG несуть дані, і пишеш правила, що їх читають: ліхтар кожні 20 м, а між ними стовпчики й лавки."}, "cheer": {"en": "PCG rewards looking: press D and A often, and let the points show you what each node really did.", "uk": "PCG винагороджує уважний погляд. Частіше натискай D і A, і точки покажуть, що насправді зробив кожен вузол."}, "quote": {"text": {"en": "You can observe a lot by watching.", "uk": "Можна багато побачити, просто спостерігаючи."}, "author": {"en": "Yogi Berra", "uk": "Йогі Берра"}, "source": "The Yogi Book, 1998"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-81-pcg-attributes-street-base", "mapHref": "../../COURSE.html", "prevHref": "../Day-80-boss-rock-pipeline/START-HERE.html", "nextHref": "../Day-82-pcg-data-in-landscape-mask/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8. I am a beginner on Day 81. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me: when my Blueprint or script fails, ask for the error message or a screenshot of the graph, point to the line or node that is wrong and explain why, then let me fix it myself. Never write the whole tool for me.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: Самостійно: урна біля кожної лавки й тихіше правило для вигнутої вулиці.\nIt's part of: PCG_Street_Base і BP_StreetSpline: один граф на PCG Volume 200 × 200 м. Він знаходить кожен сплайн вулиці за тегом і ставить ліхтарі, стовпчики й лавки в слоти вздовж обох бордюрів за правилами атрибутів. (Тренувальний рівень Content/Tools/Day81/L_Day81 із землею 300 × 300 м і двома вулицями; граф у Content/Tools/PCG; BP_StreetSpline у Content/Tools/Blueprints.).\nWhy it matters: Розставляти вуличне облаштування вручну повільно, і рівно ніколи не виходить, а справжні вулиці підкоряються простим правилам, як-от ліхтар кожні 20 м з обох боків. У PCG кожна точка отримує атрибути, а правила їх читають. Тому кожне рішення можна побачити, перевірити й змінити в режимі налагодження. Дизайнери рівнів довіряють інструментам розстановки, які можна прочитати, і створювати такі інструменти — основна робота технічного художника. It comes back: Завтра (День 82) PCG_Street_Base читатиме ландшафт і намальовану маску. У День 83 отримає твій власний вузол, у День 84 — будинки, а в п'ятницю (День 85) виросте в PCG_StreetDresser.\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-81-pcg-attributes-street-base (on the drive I chose on Day 0).\nWhat I already know: День 38: Get Spline Data за тегом, Spline Sampler, Bounds Modifier і Difference; День 36: режим налагодження (D), Inspect (A), Density Filter, Self Pruning і Transform Points; День 62 і День 63: малювання сплайнів, BP_SplineFence і BP_SplineScatter; Дні 1–5: твої вуличні пропси (SM_LampPost, SM_Bench, SM_Bollard, SM_Bin). Пропущено їх? Візьми меші з /Engine/BasicShapes, масштабовані до розмірів зі street-dimensions.md, і запиши це.; today's lessons: Точки несуть дані: атрибути та режим налагодження; Обидва бордюри: точки у власному просторі; Математика атрибутів: ліхтар кожні 20 метрів; Щільність, зерна та звички налагодження. Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- L_Day81: Floor базового рівня замінено плитою Cube (Location 0, 0, -50, Scale 300, 300, 1, тож її верх на Z = 0) і PCG Volume 200 × 200 м (Location 10000, 0, 0, Scale 100, 100, 20).\n- BP_StreetSpline — Actor Blueprint з одним компонентом Spline на ім'я Street і тегом актора Street у Class Defaults. Поставлено дві копії: пряму (120 м) і з двома вигинами, усі точки на землі.\n- PCG_Street_Base на об'ємі: Get Spline Data (All World Actors, By Tag, Street, Select Multiple) > Spline Sampler (Mode Distance, Distance Increment 400). Далі бік A: Transform Points (Offset 0, 450, 0), а бік B: Transform Points (Rotation Z 180), потім Transform Points (Offset 0, 450, 0). Потім Attribute Maths Op пише Slot = $Index modulo 5 > Attribute Filters за Slot > Static Mesh Spawners.\n- Slot 0: SM_LampPost. Slots 1 і 3: SM_Bollard. Slot 2: SM_Bench, повернута до дороги й випадково проріджена вузлами Attribute Noise і Density Filter. Slot 4: порожнє місце для проходу. Ліхтар кожні 20 м з обох боків.\n- Заголовок Day 81 у techtools_notes.md: атрибути зі списку Inspect ($Position, $Rotation, $Scale, $Density, $Seed, $BoundsMin, $BoundsMax, $Steepness, $Color і твій Slot), по рядку на кожен — що він означає.\n- На пласкій землі ніщо не висить, на дорозі нічого не стоїть, лавки повернуті до дороги. Те саме зерно (Seed) завжди дає ту саму вулицю.\n\nMy checklist (the same numbers show on my course page):\n1. Спершу перевір, чи є результати сьогоднішніх уроків: PCG_Street_Base зі слотами вздовж бордюрів і правилом ліхтаря та дві копії BP_StreetSpline у L_Day81. Чогось бракує? Зроби вправу того уроку зараз (близько 25 хв), бо вона потрібна для збірки. Слабкий ПК (16 ГБ оперативної пам'яті або менше)? Під час роботи зменш об'єм PCG до 100 × 100 м, а для фінальних зображень збільш (див. розділ про слабкий ПК в ACCOUNTS-AND-INSTALLS.html). Відкрий L_Day81, вибери PCG Volume і клацни Generate на його компоненті PCG. Перевірка: ліхтарі кожні 20 м з обох боків обох вулиць, між ними стовпчики й лавки, на дорозі нічого. (from lesson 3)\n2. У PCG_Street_Base клацай вузли по черзі й натискай D, потім A. Перевірка: ти можеш сказати, скільки точок виводить кожен вузол, і числа логічні: після Transform Points обидва боки разом, після кожного фільтра менше. (from lesson 1)\n3. Під заголовком Day 81 у techtools_notes.md запиши атрибути зі списку Inspect вузла Attribute Maths Op. Перевірка: десять рядків, разом із твоїм Slot, кожен простими словами пояснює, що означає атрибут. (from lesson 1)\n4. Пересунь одну точку вигнутої вулиці й клацни Generate. Перевірка: слоти йдуть за новою кривою, обидва ряди лишаються на 4,5 м від осьової лінії, а лавки повернуті до дороги. (from lesson 2)\n5. Зміни Distance Increment у Spline Sampler на 500 і клацни Generate. Перевірка: ліхтарі тепер кожні 25 м. Поверни 400 — знову 20 м. (from lesson 3)\n6. Зміни Seed на компоненті PCG об'єму з 42 на 7, клацни Generate, потім поверни 42. Перевірка: із 7 проріджено інший набір лавок, а 42 повертає першу вулицю точно такою самою. (from lesson 4)\n7. Клацни Attribute Noise, натисни E (вимкнути) і Generate, потім знову E і Generate. Перевірка: з вимкненим вузлом повертаються всі лавки — отже, проріджує саме він. (from lesson 4)\n8. Самостійно: від точок лавок (після Density Filter) додай Transform Points з Offset 130, 0, 0 — 1,3 м уздовж вулиці: половина лавки 1,8 м, половина урни й невеликий проміжок. Додай Static Mesh Spawner з SM_Bin. Перевірка: біля кожної лавки урна, на тротуарі, ніколи на дорозі. (from lesson 2)\n9. Самостійно: познач вигнуту вулицю тегом StreetQuiet замість Street (на розміщеній копії: Details > Actor > Tags). У графі скопіюй гілку Get Spline Data для StreetQuiet, а лавки лиши лише з боку A, без гілки боку B для лавок. Перевірка: на вигнутій вулиці лавки лише з одного боку, на прямій — з обох. (from lesson 3)\n10. Пролети обидві вулиці на висоті 2 м і 30 м. Збережи L_Day81 (Ctrl+S), відкрий будь-який інший рівень, а тоді знову L_Day81 і клацни Generate. Перевірка: ніщо не висить, на дорозі нічого не стоїть, а з 30 м ліхтарі стоять двома рівними рядами. (from lesson 2)\n11. Зроби два скриншоти: graph_day81.png (увесь граф, назви вузлів читаються) і street_30m.png (обидві вулиці з 30 м). Перевірка: обидва зображення в робочій папці дня. (from lesson 1)\n12. Клацни «Копіювати звіт дня», встав текст у новий чат із тьютором, дай відповіді на його запитання й збережи відповідь як summary.md у робочій папці дня. Перетягни summary.md, graph_day81.png і street_30m.png у папку здачі (кнопка на цій сторінці). Ніколи не здавай папку проєкту чи рівня. Перевірка: у папці здачі 3 файли, кожен більший за 1 КБ. (from lesson 1)\n\nHow to help: ask which step number I'm on, then give me only the next step: the exact clicks and what I should see. When I send a screenshot, compare it with my reference, my sizes and the spec, and name one thing to fix at a time.\nCheck every save and export by reopening it before we move on:\n- a Blueprint or script: compile or run it once more and see it work, with no errors\n- a .md or .txt: open it with Notepad; the text is there, and the name doesn't end in .md.txt\nWhen I write \"готово\", and in any case before the day ends, check with me one item at a time (yes/no): each spec point, then each file on my hand-in list, ready in my day work folder (skip summary.md: the day report writes it next):\n1. graph_day81.png та street_30m.png (увесь граф, назви вузлів читаються; обидві вулиці з 30 м) (доказ)\nFinish with a short list of anything missing, and one line on where this work comes back and what it will look like there. Then tell me the order for the end of the day: first the day report (the Copy the day report button at the bottom of my course page) into summary.md, and only then hand in all the files on the list, summary.md too.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; checklist = чек-лист; credits line = рядок авторства; reference photo / hero photo = фото-референс / ключове фото; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; mesh = меш; vertex / edge / face = вершина / ребро / грань; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); modifier = модифікатор; texel density / checker pattern = щільність текселів /  return '<section class="card glass morning"><div class="mgrid">'+(m.sofar?'<div>'+lab(u('sofar'),'gold')+shelf+'<p class="mtxt">'+lk(x(m.sofar))+'</p></div>':'')+(m.today?'<div>'+lab(u('todayL'))+'<p class="mtxt">'+lk(x(m.today))+'</p></div>':'')+'</div>'+(m.cheer?'<p class="cheer">'+esc(x(m.cheer))+'</p>':'')+(qt?'<figure class="quote well">'+kn('quote')+'<blockquote>'+esc(qt)+'</blockquote>'+(q.author?'<figcaption>'+esc(x(q.author))+'</figcaption>':'')+'</figure>':'')+'</section>'}
function setLang(l){lang=l;try{localStorage.setItem('devteam:lang',lang)}catch(e){};render()}
function toggleLang(){setLang(lang==='uk'?'en':'uk')}
/* keep open sections and keyboard focus across re-renders */
const openD=new Set();
function tg(e){if(e.open)openD.add(e.id);else openD.delete(e.id)}
const op=id=>openD.has(id)?' open':'';
function render(){const ae=document.activeElement,fid=ae&&(ae.id||(ae.getAttribute('data-th')?'th-'+ae.getAttribute('data-th'):ae.getAttribute('lang')&&ae.closest('.seg')?'lg-'+ae.getAttribute('lang'):''));
 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);
 const b=D.build,P=Math.round(prog()*100);
 document.getElementById('top').innerHTML='<div class="topin glass"><a class="maplink" href="'+esc(D.mapHref)+'">'+kn('map')+u('map')+'</a><div class="crumb"><b>'+esc(x(D.learnerName))+'</b><span>'+u('week')+' '+D.week+'</span><span>'+u('day')+' '+D.day+' '+u('of')+' '+D.total+'</span></div>'+controls(lang,'setLang')+'</div><div class="tline"><i style="width:'+P+'%"></i></div>';
 const state=w=>w<D.week?'b':w===D.week?'n':'p';
 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 let wk='';if(D.weekInfo){const w=D.weekInfo;wk='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}
 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p>'+(b.next?'<div class="back well">'+kn('arrow')+'<div><b>'+u('comes')+'</b><br>'+lk(x(b.next))+'</div></div>':'')+'<div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.assetFiles&&D.assetFiles.length?'<p class="files">'+ic('folder')+'<span>'+u('filesL')+' '+D.assetFiles.map(f=>'<a href="assets/'+encodeURIComponent(f)+'" target="_blank" rel="noopener">'+esc(f)+'</a>').join(', ')+'</span></p>':D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+=handinCard();h+=beforeCard();
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div><label class="rcpt" for="r'+i+'"><span class="eyebrow">'+u('rcpt')+'</span><textarea id="r'+i+'" rows="2" placeholder="'+esc(u('rcptPh'))+'" oninput="st.r'+i+'=this.value;save()">'+esc(st['r'+i]||'')+'</textarea></label>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+hList()+chkList()+(hasClip?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<h3>1 · '+u('copyR')+'</h3><p class="muted">'+u('report')+'</p><div class="row"><button class="btn ghost" onclick="cp(reportText())">'+ic('copy')+u('copyR')+'</button></div><h3>2 · '+u('ship')+'</h3>'+hf()+'<p class="muted" style="margin:12px 0 0">'+u('hNote')+'</p></section>';
 h+=qCard();h+=wk;
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();
</script>

ру свій аркуш за 60 секунд, а він переказує мій острів двома реченнями. Якщо він пропускає район чи маршрут, я переміщую цю частину вище на аркуші."}, "video": {"search": "presentation board layout visual hierarchy"}, "prompt": "You are my tutor for one 20-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Аркуш планування, який читається за хвилину (мікроурок) (Day 25, lesson 3 of 4). Today's build: Пакет планування острова, перевірений так, що всі числа з Днів 21–24 збігаються; аркуш планування planning_board.png на одну сторінку; pitch.md; три головні нотатки тьютора виправлено (r2).\nWhat I already know: День 21: references.md, credits.md і твої фото; День 22: island_map.png і map_notes.md; День 23: обидва плани ділянок і їхні таблиці; День 24: обидва списки потреб, packs_review.md і pack_scale.png.\nEarlier today I already did: lesson 1 (Огляд препродакшну (мікроурок)); lesson 2 (Щоб числа збігалися (мікроурок)). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Компонувати аркуш 1920 × 1080 з одним порядком читання: найбільша мапа, потім плани, потім фото й паки.\n2. Підписувати скупо: заголовок, назва острова, презентація в один рядок і короткі підписи, ніколи не абзаци.\n3. Писати презентацію з п'яти речень, яку будь-хто може переказати, прочитавши раз.\n\nRun the lesson in this order; it should take 20 to 30 minutes:\n1. Your first message, at most 7 short lines: 2 lines on why today matters and where it comes back, in plain words (from this: Студії проводять огляд препродакшну — перевірку планів, перш ніж хтось почне будувати. Якщо мапа, плани й список потреб не збігаються, потім втрачаються тижні. Сьогодні ти доводиш, що острів готовий: числа збігаються, у кожної деталі є джерело й ліцензія, а ідея вміщається на одній сторінці. It comes back: Наступного тижня цей пакет стане рельєфом: у День 26 island_map.png перетвориться на L_Island. Перевірені плани й списки потреб збудують район 1 з Дня 41 і район 2 з Дня 48.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-25-boss-planning-pack exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (перевірка узгодженості (разом з уроками)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. У Krita: File > New, 1920 × 1080 px, залите спокійним сірим. Збережи як planning_board.kra. Перетягни на нього island_map.png (Insert as New Layer) і клавішами Ctrl+T розтягни на ліву половину. Мапа — перше, на що падає погляд.\n   2. Постав обидва плани ділянок праворуч в однаковому розмірі з підписами «Район 1: набережна» і «Район 2: …». Має вийти два однакові плани. [screenshot]\n   3. Почни pitch.md з першого речення, а назву острова й це речення постав угорі аркуша. Збережи (Ctrl+S). З самого верхнього рядка зрозуміло, що це за острів. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Тест однієї хвилини: я описую тьютору свій аркуш за 60 секунд, а він переказує мій острів двома реченнями. Якщо він пропускає район чи маршрут, я переміщую цю частину вище на аркуші. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; tier (Bronze, Silver, Gold) = медаль (Бронза, Срібло, Золото); lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; rubric = таблиця оцінювання; review (by tutor or art director) = огляд; see-why-fix note = нотатка «бачу, чому, як виправити»; checklist = чек-лист; credits line = рядок авторства; reference photo / hero photo = фото-референс / ключове фото; comparison sheet, board (an image) = аркуш (аркуш порівняння, аркуш референсів); click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; File Explorer = Провідник; grid = сітка (тільки grid, ніколи mesh); origin (and kit pivot) = origin — точка, за яку об'єкт ставлять і обертають; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; grey box placeholder = сірий блок (заглушка); keep-out zone / footprint test / grounding = зона-виняток / тест опори / посадка на ґрунт; kit / kit piece / part of one object = набір / деталь / частина; map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; district / plot / plot plan = район / ділянка / план ділянки; harbour / quay / waterfront / pier = гавань / причал / набережна / пірс; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; hero shot = головний кадр (hero shot).\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}, {"title": {"en": "Taking a review like a pro (micro-lesson)", "uk": "Приймати огляд, як професіонал (мікроурок)"}, "minutes": 20, "goals": [{"en": "Ask for a review in see-why-fix notes: what the reviewer sees, why it matters, and one fix, with a place or a file.", "uk": "Просити огляд у нотатках «бачу, чому, як виправити»: що бачить рецензент, чому це важливо, і одне виправлення з місцем або файлом."}, {"en": "Answer notes with decisions, not excuses: do it, do it differently (say how), or not now (say when).", "uk": "Відповідати на нотатки рішеннями, а не виправданнями: зробити, зробити інакше (сказати як) або не зараз (сказати коли)."}, {"en": "Make r2 and log every change: keep an _r1 copy, fix the file under its usual name, and write one log line.", "uk": "Робити r2 і записувати кожну зміну: лишати копію _r1, виправляти файл під звичною назвою й писати один рядок у журнал змін."}], "doalong": [{"en": "Paste pitch.md, consistency_check.md and a short description of your board into a new tutor chat. Ask for a review as a demanding studio art director, in see-why-fix notes, ending with a verdict. You should get notes and a 'yes' or 'no, because ...'.", "uk": "Встав pitch.md, consistency_check.md і короткий опис аркуша в новий чат із тьютором. Попроси огляд від імені вимогливого арт-директора студії в нотатках «бачу, чому, як виправити», з вердиктом у кінці. Має вийти: нотатки і «так» або «ні, тому що …»."}, {"en": "Write a decision under each note in self_review_day25.md. You should see one decision per note.", "uk": "Запиши рішення під кожною нотаткою в self_review_day25.md. Має вийти по одному рішенню на нотатку."}, {"en": "Practise one fix: save a copy of the file with _r1 in its name, fix the original, and add a change-log line (file, what changed, why). You should see the _r1 copy beside the fixed file.", "uk": "Потренуй одне виправлення: збережи копію файлу з _r1 у назві, виправ оригінал і додай рядок у журнал змін (файл, що змінено, чому). Копія _r1 лежить поруч із виправленим файлом."}], "play": {"en": "Reviewer's chair: the tutor gives a one-line verdict on each part of my pack; I predict each verdict before it speaks. Right predictions score.", "uk": "Крісло рецензента: тьютор дає вердикт в один рядок для кожної частини мого пакета. Я вгадую кожен вердикт, перш ніж він його скаже. Правильні здогадки приносять бали."}, "video": {"search": "how to give and receive art feedback"}, "prompt": "You are my tutor for one 20-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Приймати огляд, як професіонал (мікроурок) (Day 25, lesson 4 of 4). Today's build: Пакет планування острова, перевірений так, що всі числа з Днів 21–24 збігаються; аркуш планування planning_board.png на одну сторінку; pitch.md; три головні нотатки тьютора виправлено (r2).\nWhat I already know: День 21: references.md, credits.md і твої фото; День 22: island_map.png і map_notes.md; День 23: обидва плани ділянок і їхні таблиці; День 24: обидва списки потреб, packs_review.md і pack_scale.png.\nEarlier today I already did: lesson 1 (Огляд препродакшну (мікроурок)); lesson 2 (Щоб числа збігалися (мікроурок)); lesson 3 (Аркуш планування, який читається за хвилину (мікроурок)). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Просити огляд у нотатках «бачу, чому, як виправити»: що бачить рецензент, чому це важливо, і одне виправлення з місцем або файлом.\n2. Відповідати на нотатки рішеннями, а не виправданнями: зробити, зробити інакше (сказати як) або не зараз (сказати коли).\n3. Робити r2 і записувати кожну зміну: лишати копію _r1, виправляти файл під звичною назвою й писати один рядок у журнал змін.\n\nRun the lesson in this order; it should take 20 to 30 minutes:\n1. Your first message, at most 7 short lines: 2 lines on why today matters and where it comes back, in plain words (from this: Студії проводять огляд препродакшну — перевірку планів, перш ніж хтось почне будувати. Якщо мапа, плани й список потреб не збігаються, потім втрачаються тижні. Сьогодні ти доводиш, що острів готовий: числа збігаються, у кожної деталі є джерело й ліцензія, а ідея вміщається на одній сторінці. It comes back: Наступного тижня цей пакет стане рельєфом: у День 26 island_map.png перетвориться на L_Island. Перевірені плани й списки потреб збудують район 1 з Дня 41 і район 2 з Дня 48.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-25-boss-planning-pack exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (перевірка узгодженості (разом з уроками)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Встав pitch.md, consistency_check.md і короткий опис аркуша в новий чат із тьютором. Попроси огляд від імені вимогливого арт-директора студії в нотатках «бачу, чому, як виправити», з вердиктом у кінці. Має вийти: нотатки і «так» або «ні, тому що …».\n   2. Запиши рішення під кожною нотаткою в self_review_day25.md. Має вийти по одному рішенню на нотатку. [screenshot]\n   3. Потренуй одне виправлення: збережи копію файлу з _r1 у назві, виправ оригінал і додай рядок у журнал змін (файл, що змінено, чому). Копія _r1 лежить поруч із виправленим файлом. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Крісло рецензента: тьютор дає вердикт в один рядок для кожної частини мого пакета. Я вгадую кожен вердикт, перш ніж він його скаже. Правильні здогадки приносять бали. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; tier (Bronze, Silver, Gold) = медаль (Бронза, Срібло, Золото); lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; rubric = таблиця оцінювання; review (by tutor or art director) = огляд; see-why-fix note = нотатка «бачу, чому, як виправити»; checklist = чек-лист; credits line = рядок авторства; reference photo / hero photo = фото-референс / ключове фото; comparison sheet, board (an image) = аркуш (аркуш порівняння, аркуш референсів); click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; File Explorer = Провідник; grid = сітка (тільки grid, ніколи mesh); origin (and kit pivot) = origin — точка, за яку об'єкт ставлять і обертають; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; kit / kit piece / part of one object = набір / деталь / частина; map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; district / plot / plot plan = район / ділянка / план ділянки; harbour / quay / waterfront / pier = гавань / причал / набережна / пірс; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; hero shot = головний кадр (hero shot).\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}], "handin": [{"en": "summary.md, with the Electric Dreams status", "uk": "summary.md (звіт дня зі станом Electric Dreams)"}, {"en": "planning_board.png, your r2 board, 1920 x 1080 (Boss)", "uk": "planning_board.png (аркуш планування r2, 1920 × 1080) (День боса)"}, {"en": "consistency_check.md and pitch.md (Boss)", "uk": "consistency_check.md і pitch.md (перевірка узгодженості й презентація) (День боса)"}, {"en": "self_review_day25.md: scores, the tutor's notes, decisions, change log, tier and time (Boss)", "uk": "self_review_day25.md (оцінки, нотатки тьютора, рішення, журнал змін, медаль і час) (День боса)"}, {"en": "The files you fixed for r2, under their usual names (→ Day 26)", "uk": "Файли, виправлені для r2, під звичними назвами (→ День 26)"}, {"en": "clip_day25.mp4, 30 to 60 seconds, under 50 MB (keep it: Day 60's progress reel uses it), and map_drape.png for Gold (Boss)", "uk": "clip_day25.mp4 (30–60 секунд, менше 50 МБ; збережи його: з нього складеш ролик прогресу в День 60) і map_drape.png для Золота (День боса)"}], "goal": {"en": "By the end of today your planning pack agrees in every number, fits on one planning board, and has been reviewed with the tutor and fixed (r2).", "uk": "До кінця дня в тебе є повний пакет планування, у якому збігаються всі числа. Він уміщається на одному аркуші планування, а після огляду з тьютором готова виправлена версія r2."}, "uses": [{"en": "Day 21: references.md, credits.md and your photos", "uk": "День 21: references.md, credits.md і твої фото"}, {"en": "Day 22: island_map.png and map_notes.md", "uk": "День 22: island_map.png і map_notes.md"}, {"en": "Day 23: both plot plans and their tables", "uk": "День 23: обидва плани ділянок і їхні таблиці"}, {"en": "Day 24: both needs lists, packs_review.md and pack_scale.png", "uk": "День 24: обидва списки потреб, packs_review.md і pack_scale.png"}], "quiz": [{"q": {"en": "Your needs list says 8 benches but your plan's table says 6. What do you do first?", "uk": "У твоєму списку потреб 8 лавок, а в таблиці плану — 6. Що ти робиш насамперед?"}, "options": [{"en": "Keep both: more is safer.", "uk": "Залишаю обидва: більше — надійніше."}, {"en": "Work out which is right from the length and spacing, then make both files say the same number.", "uk": "Обчислюю за довжиною й кроком, яке число правильне, а потім пишу в обох файлах те саме число."}, {"en": "Delete the needs list.", "uk": "Видаляю список потреб."}, {"en": "Let the tutor pick one.", "uk": "Даю тьютору вибрати одне."}], "answer": 1, "explain": {"en": "Two files that disagree mean nobody knows what to build. Check the source of the number, then fix both.", "uk": "Якщо два файли суперечать одне одному, ніхто не знає, що будувати. Перевір, звідки взялося число, а потім виправ обидва."}}, {"q": {"en": "A Commons photo says 'CC BY-SA 4.0'. What do you write in credits.md?", "uk": "На фото з Commons написано «CC BY-SA 4.0». Що ти пишеш у credits.md?"}, "options": [{"en": "Only the link.", "uk": "Лише посилання."}, {"en": "Nothing: CC BY-SA needs no credit.", "uk": "Нічого: CC BY-SA не вимагає авторства."}, {"en": "The title, the author, 'CC BY-SA 4.0' and the link.", "uk": "Назву, автора, «CC BY-SA 4.0» і посилання."}, {"en": "'From Wikimedia Commons'.", "uk": "«З Wikimedia Commons»."}], "answer": 2, "explain": {"en": "BY means the author must be credited. A full line (title, author, licence, link) is always safe.", "uk": "BY означає, що треба вказати автора. Повний рядок (назва, автор, ліцензія, посилання) завжди безпечний."}}, {"q": {"en": "On your 2000 px map, district 2's box spans pixels 1350 to 1550 across and 600 to 800 down. What are its corners in metres?", "uk": "На твоїй мапі 2000 px квадрат району 2 займає пікселі 1350–1550 по горизонталі й 600–800 по вертикалі. Які його кути в метрах?"}, "options": [{"en": "X 350 to 550, Y -400 to -200", "uk": "X від 350 до 550, Y від −400 до −200"}, {"en": "X 1350 to 1550, Y 600 to 800", "uk": "X від 1350 до 1550, Y від 600 до 800"}, {"en": "X -350 to -550, Y 400 to 200", "uk": "X від −350 до −550, Y від 400 до 200"}, {"en": "X 350 to 550, Y 400 to 200", "uk": "X від 350 до 550, Y від 400 до 200"}], "answer": 0, "explain": {"en": "Subtract 1000 from every pixel number. Pixels above the middle give a negative Y, which is north.", "uk": "Відніми 1000 від кожного числа пікселів. Пікселі вище середини дають від'ємний Y, тобто північ."}}, {"q": {"en": "Why do the beaches on your map sit in bays?", "uk": "Чому пляжі на твоїй мапі лежать у затоках?"}, "options": [{"en": "Bays are easier to draw.", "uk": "Затоки легше малювати."}, {"en": "Beaches need a road.", "uk": "Пляжам потрібна дорога."}, {"en": "Sand only forms near towns.", "uk": "Пісок утворюється лише біля міст."}, {"en": "Waves are calmer in sheltered bays, so sand settles; exposed points get cliffs and rock.", "uk": "У захищених затоках хвилі спокійніші, тож пісок осідає. На відкритих мисах — скелі й камінь."}], "answer": 3, "explain": {"en": "Calm water drops sand; rough water carries it away and wears the land into cliffs.", "uk": "Спокійна вода залишає пісок. Бурхлива вода забирає його й точить сушу, і з'являються скелі."}}, {"q": {"en": "A bed on your plan is 20 x 10 m with shrubs 2 m apart. How many shrubs go in the table?", "uk": "Клумба на твоєму плані має 20 × 10 м, а кущі ростуть через 2 м. Скільки кущів іде в таблицю?"}, "options": [{"en": "10", "uk": "10"}, {"en": "50", "uk": "50"}, {"en": "100", "uk": "100"}, {"en": "200", "uk": "200"}], "answer": 1, "explain": {"en": "Area ÷ (spacing x spacing) = 200 ÷ 4 = 50.", "uk": "Площа ÷ (крок × крок) = 200 ÷ 4 = 50."}}, {"q": {"en": "What is a drone lane on your plot plan?", "uk": "Що таке польотний коридор на твоєму плані ділянки?"}, "options": [{"en": "An open corridor at least 4 x 4 m with a set height, kept clear of tree crowns, lamps and awnings.", "uk": "Вільний прохід щонайменше 4 × 4 м із заданою висотою, без крон дерев, ліхтарів і маркіз."}, {"en": "A road for cars.", "uk": "Дорога для автомобілів."}, {"en": "The red district box.", "uk": "Червоний квадрат району."}, {"en": "A camera arrow.", "uk": "Стрілка камери."}], "answer": 0, "explain": {"en": "Lanes keep the flight path open even when the district fills up with props and trees.", "uk": "Коридори тримають шлях польоту вільним, навіть коли район заповнюється пропсами й деревами."}}, {"q": {"en": "Electric Dreams has finished downloading on your 16 GB PC. What do you do before you open it the first time?", "uk": "Electric Dreams завантажився на твій ПК із 16 ГБ. Що ти робиш, перш ніж відкрити його вперше?"}, "options": [{"en": "Open ElectricDreams_Env to see everything.", "uk": "Відкриваю ElectricDreams_Env, щоб побачити все."}, {"en": "Copy the whole sample into IslandCourse.", "uk": "Копіюю весь зразок в IslandCourse."}, {"en": "Delete its shaders to save space.", "uk": "Видаляю його шейдери, щоб звільнити місце."}, {"en": "Raise the Windows page file to 32 GB or more, close the browser, and open it at Medium with r.ScreenPercentage 50.", "uk": "Збільшую файл підкачки Windows до 32 ГБ або більше, закриваю браузер і відкриваю зразок на Medium з r.ScreenPercentage 50."}], "answer": 3, "explain": {"en": "The sample is built for 32 GB of memory and an 8 GB graphics card. A bigger page file, a closed browser, Medium and r.ScreenPercentage 50 let its small levels open on a 16 GB PC.", "uk": "Зразок розрахований на 32 ГБ пам'яті й відеокарту з 8 ГБ. Більший файл підкачки, закритий браузер, Medium і r.ScreenPercentage 50 дають відкрити його малі рівні на ПК із 16 ГБ."}}, {"q": {"en": "What makes a see-why-fix note useful?", "uk": "Що робить нотатку «бачу, чому, як виправити» корисною?"}, "options": [{"en": "It is short and polite.", "uk": "Вона коротка і ввічлива."}, {"en": "It gives a score out of 10.", "uk": "Вона дає оцінку з 10."}, {"en": "It says what is seen, why it matters and one concrete fix with a place.", "uk": "Вона каже, що видно, чому це важливо, і дає одне конкретне виправлення з місцем."}, {"en": "It lists every fault at once.", "uk": "Вона перелічує всі помилки одразу."}], "answer": 2, "explain": {"en": "A located, concrete fix can be done straight away. 'Feels empty' can't.", "uk": "Конкретне виправлення з точним місцем можна зробити одразу. «Здається порожнім» — не можна."}}], "weekInfo": {"week": 5, "title": {"en": "Your real place and your island on paper", "uk": "Твоє реальне місце і твій острів на папері"}, "goal": {"en": "By Friday you have a complete planning pack: one real coastal place with 15 credited photos, island_map.png to scale with two red 200 x 200 m districts and the scenic route, two counted plot plans, two needs lists, reviewed free packs, and the Electric Dreams download under way.", "uk": "До п'ятниці в тебе є повний пакет планування: одне реальне прибережне місце з 15 фото з рядками авторства; island_map.png у масштабі з двома червоними районами 200 × 200 м і мальовничим маршрутом; два плани ділянок із підрахованими об'єктами; два списки потреб; оглянуті безкоштовні паки. Завантаження Electric Dreams уже триває."}, "skills": [{"en": "Reference research and image licensing (Creative Commons) for production art", "uk": "Пошук референсів і ліцензування зображень (Creative Commons) для продакшн-арту"}, {"en": "Scaled world maps from OpenStreetMap data, with districts, roads and flight routes", "uk": "Мапи світу в масштабі за даними OpenStreetMap: райони, дороги й маршрути польотів"}, {"en": "Plot plans with item counts, camera positions and drone lanes for level layout", "uk": "Плани ділянок із підрахунком об'єктів, позиціями камер і польотними коридорами для планування рівня"}, {"en": "Asset sourcing: needs lists, Fab licence checks and best-pieces reviews", "uk": "Пошук асетів: списки потреб, перевірка ліцензій на Fab і огляд найкращих деталей паків"}, {"en": "Pre-production review: consistency checks and a one-page planning board", "uk": "Перевірка планів перед виробництвом (препродакшн): узгоджені числа й аркуш планування на одну сторінку"}]}, "morning": {"sofar": {"en": "This week you chose a real place and turned it into a map, two plot plans, two needs lists and a set of free packs.", "uk": "Цього тижня справжнє місце перетворилося на мапу, два плани ділянок, два списки потреб і добірку безкоштовних паків."}, "today": {"en": "It is Boss day: you make all your planning numbers agree, put them on one planning board, review it with the tutor, fix it to r2 and record a short clip.", "uk": "Сьогодні День боса: ти узгоджуєш усі числа планування, збираєш їх на одному аркуші планування, проходиш огляд із тьютором, виправляєш до r2 і записуєш короткий кліп."}, "cheer": {"en": "A review is a gift, not a verdict, and Bronze is well within your reach; take each note as one more step forward.", "uk": "Огляд — це подарунок, а не вирок, і Бронза тобі цілком під силу; сприймай кожну нотатку як ще один крок уперед."}, "quote": {"text": {"en": "Preparation, I have often said, is rightly two-thirds of any venture.", "uk": "Підготовка, як я часто кажу, — це по праву дві третини будь-якої справи."}, "author": {"en": "Amelia Earhart", "uk": "Амелія Ергарт"}, "source": "https://en.wikiquote.org/wiki/Amelia_Earhart"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-25-boss-planning-pack", "mapHref": "../../COURSE.html", "prevHref": "../Day-24-needs-lists-and-free-packs/START-HERE.html", "nextHref": "../Day-26-l-island-heightmap/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Krita, a text editor and your tutor chat (Unreal Engine 5.8 for Gold). I am a beginner on Day 25. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me and don't write code.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: Аркуш, огляд і r2 на час (медалі).\nIt's part of: Пакет планування острова, перевірений так, що всі числа з Днів 21–24 збігаються; аркуш планування planning_board.png на одну сторінку; pitch.md; три головні нотатки тьютора виправлено (r2) (Робоча папка дня (Day25) — для consistency_check.md, pitch.md, planning_board.kra і .png та self_review_day25.md. Виправлені файли лишаються у своїх папках днів під звичними назвами. Для Золота додається тренувальний рівень у IslandCourse: Content/Course/Day25/L_MapDrape.).\nWhy it matters: Студії проводять огляд препродакшну — перевірку планів, перш ніж хтось почне будувати. Якщо мапа, плани й список потреб не збігаються, потім втрачаються тижні. Сьогодні ти доводиш, що острів готовий: числа збігаються, у кожної деталі є джерело й ліцензія, а ідея вміщається на одній сторінці. It comes back: Наступного тижня цей пакет стане рельєфом: у День 26 island_map.png перетвориться на L_Island. Перевірені плани й списки потреб збудують район 1 з Дня 41 і район 2 з Дня 48.\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-25-boss-planning-pack (on the drive I chose on Day 0).\nWhat I already know: День 21: references.md, credits.md і твої фото; День 22: island_map.png і map_notes.md; День 23: обидва плани ділянок і їхні таблиці; День 24: обидва списки потреб, packs_review.md і pack_scale.png; today's lessons: Огляд препродакшну (мікроурок); Щоб числа збігалися (мікроурок); Аркуш планування, який читається за хвилину (мікроурок); Приймати огляд, як професіонал (мікроурок). Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- consistency_check.md: десять запитань «так чи ні» з уроку 2. На кожне є відповідь, а кожне «ні» виправлено в самому файлі.\n- pitch.md: п'ять речень про те, що таке твій острів, яке реальне місце за ним стоїть, його два райони й мальовничий маршрут.\n- planning_board.png, 1920 × 1080 px. Найбільша на ньому — мапа острова. Поруч обидва плани ділянок, чотири–шість ключових фото, по одній найкращій деталі з кожного пака, назва острова й презентація в один рядок.\n- self_review_day25.md: твій план із часом, оцінки за таблицею оцінювання, нотатки тьютора «бачу, чому, як виправити» і твої рішення. Додай журнал змін r2, здобуту медаль і свій час.\n- Виправлення r2: перш ніж змінити файл, збережи копію з _r1 у назві (наприклад, island_map_r1.png). Потім виправ оригінал і лиши йому звичну назву: так День 26 і наступні дні відкриють виправлений файл.\n\nMy checklist (the same numbers show on my course page):\n1. Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: self_review_day25.md із планом, consistency_check.md, planning_board.kra і pitch.md. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Потім запусти таймер: 3 години для Бронзи й Срібла, 2 години 30 хвилин для Золота. Перевірка: час у плані в сумі не більший за таймер. (from lesson 1)\n2. consistency_check.md, запитання 1–4 (мапа й плани): інструмент Measure у Krita і map_notes.md. Перевірка: на кожне відповідь «так» або помилка, записана з числом. (from lesson 2)\n3. Запитання 5 і 6: кожна таблиця плану поруч зі своїм списком потреб, рядок за рядком. Перевірка: кожна кількість із плану є в списку потреб із тим самим числом. (from lesson 2)\n4. Запитання 7–10: паки, авторство, камери й текстури ґрунту. Перевірка: кожен пак відкривається в IslandCourse, а в credits.md у папці GAD є рядок для кожного фото, текстури й пака. (from lesson 2)\n5. Виправ кожне «ні» в самому файлі, не змінюючи його назви, і під запитанням запиши, що змінено. Перевірка: десять відповідей «так». (from lesson 2)\n6. Допиши pitch.md — п'ять речень. Перевірка: людина, яка прочитала його раз, може переказати, що це за острів. (from lesson 3)\n7. Заверши аркуш: унизу чотири–шість ключових фото і по одній найкращій деталі з кожного пака (виріж із pack_scale.png). Експортуй planning_board.png. Перевірка: файл знову відкривається з розміром 1920 × 1080 px, мапа на ньому найбільша, а обидва плани, фото й паки на місці. (from lesson 3)\n8. Оціни себе за таблицею оцінювання з п'яти рядків: місце, мапа, плани, джерела, аркуш — кожен від 0 до 2. Потім попроси тьютора про огляд у нотатках «бачу, чому, як виправити» і під кожною нотаткою запиши рішення. Перевірка: у self_review_day25.md є оцінка з 10, а в кожної нотатки є рішення. (from lesson 4)\n9. r2: виправ три головні нотатки. Перш ніж змінити файл, збережи копію з _r1 у назві. Потім виправ оригінал під звичною назвою. Для кожного виправлення додай рядок у журнал змін. Перевірка: три копії _r1 поруч із трьома виправленими файлами, у кожного є рядок у журналі. (from lesson 4)\n10. Знову експортуй planning_board.png із виправленнями. Запиши медаль і час у self_review_day25.md, а стан Electric Dreams — у summary.md («ще завантажується», «завантажено» або «відкрито один раз»). Перевірка: новий аркуш відкривається й показує щонайменше одне виправлення, а в summary.md є рядок про стан. (from lesson 3)\n11. Лише для Золота, мапа в Unreal: створи рівень Basic, збережи як L_MapDrape у Content/Course/Day25 і видали з нього Floor. Постав Place Actors > Shapes > Plane у Location 0, 0, 0 зі Scale 2000, 2000, 1 — це 2 × 2 км. Перевірка: у заголовку вікна L_MapDrape, а Plane тягнеться далеко за манекен. (from day 24, lesson 3)\n12. Лише для Золота: перетягни island_map.png у Content Browser, клацни правою кнопкою > Create Material і перетягни матеріал на Plane. Перемкнися на вид Top і зроби, щоб мапа читалася правильно: Rotation Z 90, 180 чи 270 або Scale X -2000, якщо написи дзеркальні. Запусти Play (Alt+P) і збережи скриншот map_drape.png. Перевірка: північ угорі, а манекен стоїть на твоїй мапі. (from day 24, lesson 3)\n13. Кліп боса: запиши 30–60 секунд, як ти проходиш своїм аркушем (Win+Alt+R). Для Золота додай 10 секунд манекена на мапі. Збережи як clip_day25.mp4. Перевірка: кліп відтворюється, а клацання правою кнопкою > Властивості (Properties) показує менше 50 МБ. Якщо більше, експортуй його в Clipchamp у 720p. (from lesson 3)\n14. Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: кожна назва зі списку є в папці, у кожної є розмір. (from day 0, lesson 1)\n\nToday is a BOSS build. Ask me what time I started; whenever I tell you the time, tell me which tier I'm on track for. At the end, ask my finish time. Tiers:\n- Бронза: за 3 години на всі запитання consistency_check.md є відповіді, planning_board.png і pitch.md готові, а під нотатками тьютора є рішення.\n- Срібло: усі перевірки узгодженості пройдено — кількості в планах і списках потреб збігаються, кожне фото й пак є в credits.md, біля кожної камери названо ключове фото. Три головні нотатки тьютора виправлено, є копії _r1 і журнал змін.\n- Золото: усе зроблено за 2 години 30 хвилин, а ще мапа натягнута на Plane 2 × 2 км у L_MapDrape: на map_drape.png манекен стоїть на твоєму острові.\n\nHow to help: ask which step number I'm on, then give me only the next step: the exact clicks and what I should see. When I send a screenshot, compare it with my reference, my sizes and the spec, and name one thing to fix at a time.\nCheck every save and export by reopening it before we move on:\n- a .md or .txt: open it with Notepad; the text is there, and the name doesn't end in .md.txt\n- the clip: right-click > Properties shows 30 to 60 seconds and under 50 MB\nWhen I write \"готово\", and in any case before the day ends, check with me one item at a time (yes/no): each spec point, then each file on my hand-in list, ready in my day work folder (skip summary.md: the day report writes it next):\n1. planning_board.png (аркуш планування r2, 1920 × 1080) (День боса)\n2. consistency_check.md і pitch.md (перевірка узгодженості й презентація) (День боса)\n3. self_review_day25.md (оцінки, нотатки тьютора, рішення, журнал змін, медаль і час) (День боса)\n4. Файли, виправлені для r2, під звичними назвами (→ День 26)\n5. clip_day25.mp4 (30–60 секунд, менше 50 МБ; збережи його: з нього складеш ролик прогресу в День 60) і map_drape.png для Золота (День боса)\nFinish with a short list of anything missing, the tier I reached, and one line on where this work comes back and what it will look like there. Then tell me the order for the end of the day: first the day report (the Copy the day report button at the bottom of my course page) into summary.md, and only then hand in all the files on the list, summary.md too.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; tier (Bronze, Silver, Gold) = медаль (Бронза, Срібло, Золото); day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; rubric = таблиця оцінювання; review (by tutor or art director) = огляд; see-why-fix note = нотатка «бачу, чому, як виправити»; checklist = чек-лист; credits line = рядок авторства; reference photo / hero photo = фото-референс / ключове фото; comparison sheet, board (an image) = аркуш (аркуш порівняння, аркуш референсів); click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; grid = сітка (тільки grid, ніколи mesh); origin (and kit pivot) = origin — точка, за яку об'єкт ставлять і обертають; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; collision / UCX collision box = колізія / блок UCX; kit / kit piece / part of one object = набір / деталь / частина; map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; district / plot / plot plan = район / ділянка / план ділянки; harbour / quay / waterfront / pier = гавань / причал / набережна / пірс; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; hero shot = головний кадр (hero shot).\n\nStart by asking for my best reference photo. Then, one at a time, my sizes and my step number.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender.", "reportPrompt": "Help me write today's report for summary.md. I write it before I hand in. Talk to me in simple Ukrainian, and never use gendered forms about me. Keep the English labels below exactly; the text after each label may be Ukrainian.\nAsk me one thing at a time, and skip whatever I've already pasted below:\n1. My lesson summaries («Засвоєно» / «Було важко»), or which lessons I skipped.\n2. My first score in the page's \"Check yourself\" quiz.\n3. How far the build got: done, partly or blocked (if blocked, where).\n4. The time I finished the Boss build (hh:mm).\n5. My hand-in list, one item at a time (skip summary.md): is the file ready in my day work folder (GAD\\Day-25-boss-planning-pack)? (yes/no)\n   - planning_board.png (аркуш планування r2, 1920 × 1080) (День боса)\n   - consistency_check.md і pitch.md (перевірка узгодженості й презентація) (День боса)\n   - self_review_day25.md (оцінки, нотатки тьютора, рішення, журнал змін, медаль і час) (День боса)\n   - Файли, виправлені для r2, під звичними назвами (→ День 26)\n   - clip_day25.mp4 (30–60 секунд, менше 50 МБ; збережи його: з нього складеш ролик прогресу в День 60) і map_drape.png для Золота (День боса)\n6. The checks: my clip is under 50 MB.\n7. One question for Thalia (about any day; start with the day number), or \"none\".\n8. About how many hours today took.\nThen give me the finished report in one block I can copy:\n\nTeam summary, <date>, Misha\nDay 25: Boss: your planning pack, reviewed. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; boss tier: <bronze / silver / gold / none>; quiz: <score> of 8\nFinish time: <hh:mm>\nReady to hand in: <tick each item of today's list: ✓ name, or ✗ name and why it isn function setLang(l){lang=l;try{localStorage.setItem('devteam:lang',lang)}catch(e){};render()}
function toggleLang(){setLang(lang==='uk'?'en':'uk')}
/* keep open sections and keyboard focus across re-renders */
const openD=new Set();
function tg(e){if(e.open)openD.add(e.id);else openD.delete(e.id)}
const op=id=>openD.has(id)?' open':'';
function render(){const ae=document.activeElement,fid=ae&&(ae.id||(ae.getAttribute('data-th')?'th-'+ae.getAttribute('data-th'):ae.getAttribute('lang')&&ae.closest('.seg')?'lg-'+ae.getAttribute('lang'):''));
 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);
 const b=D.build,P=Math.round(prog()*100);
 document.getElementById('top').innerHTML='<div class="topin glass"><a class="maplink" href="'+esc(D.mapHref)+'">'+kn('map')+u('map')+'</a><div class="crumb"><b>'+esc(x(D.learnerName))+'</b><span>'+u('week')+' '+D.week+'</span><span>'+u('day')+' '+D.day+' '+u('of')+' '+D.total+'</span></div>'+controls(lang,'setLang')+'</div><div class="tline"><i style="width:'+P+'%"></i></div>';
 const state=w=>w<D.week?'b':w===D.week?'n':'p';
 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 let wk='';if(D.weekInfo){const w=D.weekInfo;wk='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}
 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p>'+(b.next?'<div class="back well">'+kn('arrow')+'<div><b>'+u('comes')+'</b><br>'+lk(x(b.next))+'</div></div>':'')+'<div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.assetFiles&&D.assetFiles.length?'<p class="files">'+ic('folder')+'<span>'+u('filesL')+' '+D.assetFiles.map(f=>'<a href="assets/'+encodeURIComponent(f)+'" target="_blank" rel="noopener">'+esc(f)+'</a>').join(', ')+'</span></p>':D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+=handinCard();h+=beforeCard();
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div><label class="rcpt" for="r'+i+'"><span class="eyebrow">'+u('rcpt')+'</span><textarea id="r'+i+'" rows="2" placeholder="'+esc(u('rcptPh'))+'" oninput="st.r'+i+'=this.value;save()">'+esc(st['r'+i]||'')+'</textarea></label>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+hList()+chkList()+(hasClip?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<h3>1 · '+u('copyR')+'</h3><p class="muted">'+u('report')+'</p><div class="row"><button class="btn ghost" onclick="cp(reportText())">'+ic('copy')+u('copyR')+'</button></div><h3>2 · '+u('ship')+'</h3>'+hf()+'<p class="muted" style="margin:12px 0 0">'+u('hNote')+'</p></section>';
 h+=qCard();h+=wk;
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();
</script>

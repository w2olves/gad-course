<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 25</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

твори planning_pack і скопіюй туди кожен файл із Днів 21-24. Перевірка: кожен файл зі специфікації на місці або записаний у рядку «зробити»."}, "lesson": 1}, {"text": {"en": "Write one line per file saying what it proves. Check: about 14 lines, none empty.", "uk": "Напиши по одному рядку на файл про те, що він доводить. Перевірка: близько 14 рядків, жодного порожнього."}, "lesson": 1}, {"text": {"en": "consistency_check.md, checks 1 to 4 (the map and the plans). Check: each answered 'yes', or a fault written with a number.", "uk": "consistency_check.md, перевірки 1-4 (мапа і плани). Перевірка: на кожну відповідь «так» або записана помилка з числом."}, "lesson": 2}, {"text": {"en": "Checks 5 and 6 (plans against needs lists, row by row). Check: every plan count appears in its needs list with the same number.", "uk": "Перевірки 5 і 6 (плани проти списків потреб, рядок за рядком). Перевірка: кожна кількість із плану є в його списку потреб із тим самим числом."}, "lesson": 2}, {"text": {"en": "Checks 7 to 10 (packs, credits, cameras, ground textures). Check: every pack opens in IslandCourse, and every photo, texture and pack has a credit line.", "uk": "Перевірки 7-10 (паки, авторство, камери, текстури ґрунту). Перевірка: кожен пак відкривається в IslandCourse, а кожне фото, текстура і пак мають рядок авторства."}, "lesson": 2}, {"text": {"en": "Fix every 'no' and write what you changed. Check: ten 'yes' answers.", "uk": "Виправ кожне «ні» і запиши, що змінено. Перевірка: десять відповідей «так»."}, "lesson": 2}, {"text": {"en": "Write pitch.md in five sentences. Check: someone could repeat your island back after reading it once.", "uk": "Напиши pitch.md у п'яти реченнях. Перевірка: прочитавши його один раз, людина може переказати тобі твій острів."}, "lesson": 3}, {"text": {"en": "Make planning_board.png (1920 x 1080). Check: the map is the largest thing on it, and both plans, the photos and the packs are there.", "uk": "Зроби planning_board.png (1920 x 1080). Перевірка: мапа — найбільше, що на ній є, і там є обидва плани, фото і паки."}, "lesson": 3}, {"text": {"en": "Score yourself with the five-line rubric (place, map, plans, sources, board; 0 to 2 each). Check: a score out of 10 in self_review_day25.md.", "uk": "Оціни себе за шкалою з п'яти рядків (місце, мапа, плани, джерела, дошка; від 0 до 2 за кожен). Перевірка: оцінка з 10 у self_review_day25.md."}, "lesson": 4}, {"text": {"en": "Ask the tutor for a review in see-why-fix notes and write a decision under each note. Check: every note has a decision.", "uk": "Попроси тьютора про огляд у форматі нотаток «бачу — чому — виправити» і запиши рішення під кожною нотаткою. Перевірка: під кожною нотаткою є рішення."}, "lesson": 4}, {"text": {"en": "Fix the top three notes as r2 and write the change log, then write the tier you reached. Check: three _r2 files or changed lines, each with a log line.", "uk": "Виправ три головні нотатки як r2 і напиши журнал змін, потім запиши досягнутий рівень. Перевірка: три файли _r2 або змінені рядки, кожен із рядком у журналі."}, "lesson": 4}, {"text": {"en": "Gold only: a pack test in L_PackTest, with one best piece from each pack beside your own kit and the mannequin under the same light; note every scale or colour clash in packs_review.md. Check: pack_test.png and at least one clash noted with its fix, or 'no clashes' after checking all four (size, colour, shine, style).", "uk": "Лише для Золота: тест паків у L_PackTest, де по одній найкращій частині з кожного пака стоять поруч із твоїм власним набором і манекеном під тим самим освітленням; запиши кожну невідповідність масштабу чи кольору в packs_review.md. Перевірка: pack_test.png і щонайменше одна невідповідність, записана з виправленням, або «невідповідностей немає» після перевірки всіх чотирьох (розмір, колір, блиск, стиль)."}, "lesson": "D24.3"}, {"text": {"en": "Electric Dreams: write its status in self_review_day25.md (still downloading, downloaded, or opened once on its Startup level) and save download.png. Check: the screenshot shows the Launcher's Downloads or the sample's Startup level.", "uk": "Electric Dreams: запиши його стан у self_review_day25.md (ще завантажується, завантажено або один раз відкрито на рівні Startup) і збережи download.png. Перевірка: скриншот показує розділ Downloads у Launcher або рівень Startup зразка."}, "lesson": "D24.1"}, {"text": {"en": "Before/after: planning board r1 beside r2, and a 60-second screen clip walking through the board (Win+Alt+R). Save today's clip as clip_day25.mp4. Check: before_after_day25.png shows the three fixes, and the clip is about 60 seconds.", "uk": "До/після: дошка планування r1 поруч із r2 і 60-секундний відеозапис екрана з проходом дошкою (Win+Alt+R). Збережи сьогоднішній запис як clip_day25.mp4. Перевірка: before_after_day25.png показує три виправлення, а запис триває близько 60 секунд."}, "lesson": 4}], "boss": [{"en": "Bronze: inside 3 hours, the planning_pack folder is complete, consistency_check.md is answered, and planning_board.png and pitch.md exist.", "uk": "Бронза: протягом 3 годин тека planning_pack повна, на consistency_check.md дано відповіді, а planning_board.png і pitch.md існують."}, {"en": "Silver: every consistency check passes (counts match between plans and needs lists, every photo and pack is in credits.md, every camera names a hero photo), and the tutor's top three notes are fixed in r2.", "uk": "Срібло: кожна перевірка узгодженості проходить (кількості в планах і списках потреб збігаються, кожне фото і пак є в credits.md, кожна камера називає ключове фото), а три головні нотатки тьютора виправлено в r2."}, {"en": "Gold: done inside 2 hours 30, plus the pack test in L_PackTest with every scale or colour clash noted in packs_review.md.", "uk": "Золото: зроблено протягом 2 годин 30 хвилин, плюс тест паків у L_PackTest із кожною невідповідністю масштабу чи кольору, записаною в packs_review.md."}], "assets": ["island12/art-director-notes.md"]}, "lessons": [{"title": {"en": "The pre-production review", "uk": "Огляд препродакшну"}, "minutes": 40, "goals": [{"en": "Explain pre-production: the planning stage before building, which ends in a review where the plans are checked.", "uk": "Пояснити, що таке препродакшн: етап планування перед будівництвом, який закінчується оглядом, де перевіряють плани."}, {"en": "Name what each part of your planning pack proves: the place (references), the scale (map), the layout (plans) and the pieces (needs lists and packs).", "uk": "Назвати, що доводить кожна частина твого пакета планування: місце (референси), масштаб (мапа), планування (плани) і частини (списки потреб і паки)."}, {"en": "Turn a review into yes-or-no checks, so nothing depends on mood.", "uk": "Перетворити огляд на перевірки «так чи ні», щоб ніщо не залежало від настрою."}], "doalong": [{"en": "Make a folder called planning_pack and copy in every file from Days 21 to 24. You should see about 14 files.", "uk": "Створи теку planning_pack і скопіюй туди кожен файл із Днів 21-24. Ти маєш побачити близько 14 файлів."}, {"en": "Beside each file name write one line on what it proves (for example 'island_map.png: the island is 0.9 to 1.2 km and both districts fit'). You should have one line per file.", "uk": "Біля назви кожного файлу напиши один рядок про те, що він доводить (наприклад, «island_map.png: острів має 0,9-1,2 км, і обидва райони вміщаються»). У тебе має бути по рядку на кожен файл."}, {"en": "List anything missing. You should have an empty list, or a short to-do.", "uk": "Випиши все, чого бракує. У тебе має бути порожній список або короткий список справ."}, {"en": "Open art-director-notes.md from today's assets and read 'The verdict'. You should know that a review ends with 'yes', or 'no, because ...' and three notes.", "uk": "Відкрий art-director-notes.md із сьогоднішніх матеріалів і прочитай розділ 'The verdict'. Тепер ти знаєш, що огляд закінчується словом «так» або «ні, тому що ...» і трьома нотатками."}], "play": {"en": "Gatekeeper: the tutor plays a studio reviewer and asks me for one fact at a time ('show me where district 2's lighthouse is', 'how many benches on the promenade?'); I answer in under 20 seconds with the file and the number.", "uk": "Вартовий: тьютор грає рецензента студії і просить у мене по одному факту за раз («покажи, де маяк у районі 2», «скільки лав на променаді?»); я відповідаю менш ніж за 20 секунд, називаючи файл і число."}, "video": {"search": "what is pre-production in game development"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: The pre-production review (Day 25, lesson 1 of 4).\nToday's build: Your island's planning pack: every file from Days 21 to 24 checked so the numbers agree, a one-page planning_board.png, pitch.md, and an r2 (second round) after the tutor's review.\n\nBy the end of this lesson I can:\n1. Explain pre-production: the planning stage before building, which ends in a review where the plans are checked.\n2. Name what each part of your planning pack proves: the place (references), the scale (map), the layout (plans) and the pieces (needs lists and packs).\n3. Turn a review into yes-or-no checks, so nothing depends on mood.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (This week you chose a real place and turned it into a map, two plot plans, two needs lists and a set of free packs.), what I will learn today (It is Boss day: you make all your planning numbers agree, put them on one planning board, review it with the tutor and fix it to r2.), encourage me (A review is a gift, not a verdict, and the Bronze tier is well within your reach; take each note as one more step forward.), and share today's quote: \"Preparation, I have often said, is rightly two-thirds of any venture.\" (Amelia Earhart).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 22: on your 2000 px map, what are X and Y in metres for the pixel 600 across and 1400 down? | Day 19: what does a clear foreground, middle ground and background do for a shot?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Gatekeeper: the tutor plays a studio reviewer and asks me for one fact at a time ('show me where district 2's lighthouse is', 'how many benches on the promenade?'); I answer in under 20 seconds with the file and the number.\n6. Do-along on today's build (the consistency check (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Make a folder called planning_pack and copy in every file from Days 21 to 24. You should see about 14 files.\n   - Beside each file name write one line on what it proves (for example 'island_map.png: the island is 0.9 to 1.2 km and both districts fit'). You should have one line per file.\n   - List anything missing. You should have an empty list, or a short to-do.\n   - Open art-director-notes.md from today's assets and read 'The verdict'. You should know that a review ends with 'yes', or 'no, because ...' and three notes.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Make the numbers agree", "uk": "Узгоджуємо числа"}, "minutes": 40, "goals": [{"en": "Cross-check the map and the plans: the same district corners, the same scale, the coast and roads in the same places.", "uk": "Звірити мапу і плани: ті самі кути районів, той самий масштаб, узбережжя і дороги на тих самих місцях."}, {"en": "Cross-check the plans and the needs lists: the same items with the same counts.", "uk": "Звірити плани і списки потреб: ті самі об'єкти з тими самими кількостями."}, {"en": "Cross-check the needs lists, the packs and the credits: every source is in IslandCourse, and every photo, texture and pack has a credit line.", "uk": "Звірити списки потреб, паки і авторство: кожне джерело є в IslandCourse, а кожне фото, текстура і пак мають рядок авторства."}], "doalong": [{"en": "Start consistency_check.md with ten questions: 1 the island is 0.9 to 1.2 km; 2 both red boxes are 200 x 200 m; 3 the plans' grid labels match map_notes.md; 4 the route passes through both districts; 5 every plan count is in its needs list; 6 every need has a source or a gap decision; 7 every pack named is in IslandCourse; 8 every photo, texture and pack is in credits.md; 9 every camera names a hero photo; 10 the rock, grass and sand textures are chosen. You should see ten questions.", "uk": "Почни consistency_check.md із десяти запитань: 1 острів має 0,9-1,2 км; 2 обидва червоні квадрати мають 200 x 200 м; 3 підписи сітки на планах збігаються з map_notes.md; 4 маршрут проходить через обидва райони; 5 кожна кількість із плану є в його списку потреб; 6 кожна потреба має джерело або рішення щодо прогалини; 7 кожен названий пак є в IslandCourse; 8 кожне фото, текстура і пак є в credits.md; 9 кожна камера називає ключове фото; 10 текстури каменю, трави і піску вибрано. Ти маєш побачити десять запитань."}, {"en": "Answer 1 to 4 with Krita's Measure tool and map_notes.md. You should see 'yes', or a fault with a number.", "uk": "Дай відповіді на 1-4 за допомогою інструмента Measure у Krita і map_notes.md. Ти маєш побачити «так» або помилку з числом."}, {"en": "Answer 5 and 6 by putting each plan table beside its needs list, row by row. You should see every count match.", "uk": "Дай відповіді на 5 і 6, поклавши кожну таблицю плану поруч із її списком потреб, рядок за рядком. Ти маєш побачити, що кожна кількість збігається."}, {"en": "Answer 7 to 10 from the Content Browser, credits.md and the plans. You should have ten answers.", "uk": "Дай відповіді на 7-10 за Content Browser, credits.md і планами. У тебе має бути десять відповідей."}, {"en": "Fix every 'no' now and write what you changed. You should end with ten 'yes'.", "uk": "Виправ кожне «ні» вже зараз і запиши, що змінено. Наприкінці має бути десять «так»."}], "play": {"en": "Spot the mismatch: the tutor reads me two short made-up tables (a plan and a needs list) with three differences hidden; I find all three within 2 minutes.", "uk": "Знайди розбіжність: тьютор зачитує мені дві короткі вигадані таблиці (план і список потреб) із трьома прихованими відмінностями; я знаходжу всі три за 2 хвилини."}, "video": {"search": "level design document checklist review"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Make the numbers agree (Day 25, lesson 2 of 4).\nToday's build: Your island's planning pack: every file from Days 21 to 24 checked so the numbers agree, a one-page planning_board.png, pitch.md, and an r2 (second round) after the tutor's review.\nEarlier today I already did: lesson 1 (The pre-production review). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Cross-check the map and the plans: the same district corners, the same scale, the coast and roads in the same places.\n2. Cross-check the plans and the needs lists: the same items with the same counts.\n3. Cross-check the needs lists, the packs and the credits: every source is in IslandCourse, and every photo, texture and pack has a credit line.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Spot the mismatch: the tutor reads me two short made-up tables (a plan and a needs list) with three differences hidden; I find all three within 2 minutes.\n4. Do-along on today's build (the consistency check (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Start consistency_check.md with ten questions: 1 the island is 0.9 to 1.2 km; 2 both red boxes are 200 x 200 m; 3 the plans' grid labels match map_notes.md; 4 the route passes through both districts; 5 every plan count is in its needs list; 6 every need has a source or a gap decision; 7 every pack named is in IslandCourse; 8 every photo, texture and pack is in credits.md; 9 every camera names a hero photo; 10 the rock, grass and sand textures are chosen. You should see ten questions.\n   - Answer 1 to 4 with Krita's Measure tool and map_notes.md. You should see 'yes', or a fault with a number.\n   - Answer 5 and 6 by putting each plan table beside its needs list, row by row. You should see every count match.\n   - Answer 7 to 10 from the Content Browser, credits.md and the plans. You should have ten answers.\n   - Fix every 'no' now and write what you changed. You should end with ten 'yes'.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "A planning board that reads in one minute", "uk": "Дошка планування, яку можна прочитати за хвилину"}, "minutes": 40, "goals": [{"en": "Lay out a 1920 x 1080 board with one clear order of reading: the map largest, then the plans, then photos and packs.", "uk": "Скомпонувати дошку 1920 x 1080 з одним чітким порядком читання: найбільша мапа, потім плани, потім фото і паки."}, {"en": "Label lightly: a title, the island's name, a one-line pitch and short captions, never paragraphs.", "uk": "Підписувати скупо: заголовок, назва острова, презентація в один рядок і короткі підписи, ніколи не абзаци."}, {"en": "Write a five-sentence pitch that anyone can repeat after reading it once.", "uk": "Написати презентацію з п'яти речень, яку будь-хто може переказати, прочитавши один раз."}], "doalong": [{"en": "In Krita: File > New, 1920 x 1080 px, filled with a calm grey. You should see a wide empty board.", "uk": "У Krita: File > New, 1920 x 1080 px, залите спокійним сірим. Ти маєш побачити широку порожню дошку."}, {"en": "Drag island_map.png onto the board (choose Insert as New Layer if Krita asks) and scale it (Ctrl+T) to fill the left half. You should see the map as the first thing the eye lands on.", "uk": "Перетягни island_map.png на дошку (вибери Insert as New Layer, якщо Krita запитає) і зміни масштаб (Ctrl+T), щоб мапа заповнила ліву половину. Ти маєш побачити, що мапа — перше, на чому зупиняється погляд."}, {"en": "Put both plot plans on the right at the same size, with the captions 'District 1: waterfront' and 'District 2: ...'. You should see two equal plans.", "uk": "Поклади обидва плани ділянок праворуч в однаковому розмірі з підписами 'District 1: waterfront' і 'District 2: ...'. Ти маєш побачити два однакові плани."}, {"en": "Add four to six hero photos in a row along the bottom, and one small picture of a best piece from each pack (cut from pack_scale.png). You should see real photos beside your plans.", "uk": "Додай чотири-шість ключових фото рядком унизу і по одному маленькому зображенню найкращої частини з кожного пака (вирізаному з pack_scale.png). Ти маєш побачити реальні фото поруч зі своїми планами."}, {"en": "Write pitch.md (five sentences), put the island's name and the pitch's first sentence at the top of the board, and export planning_board.png. You should be able to read the whole board in a minute.", "uk": "Напиши pitch.md (п'ять речень), постав назву острова і перше речення презентації вгорі дошки й експортуй planning_board.png. Ти маєш змогу прочитати всю дошку за хвилину."}], "play": {"en": "One-minute test: I describe my board to the tutor in 60 seconds; it repeats my island back to me in two sentences. If it misses a district or the route, I move that part higher on the board.", "uk": "Тест однієї хвилини: я описую тьютору свою дошку за 60 секунд; він переказує мені мій острів двома реченнями. Якщо він пропускає район або маршрут, я переміщую цю частину вище на дошці."}, "video": {"search": "presentation board layout visual hierarchy"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: A planning board that reads in one minute (Day 25, lesson 3 of 4).\nToday's build: Your island's planning pack: every file from Days 21 to 24 checked so the numbers agree, a one-page planning_board.png, pitch.md, and an r2 (second round) after the tutor's review.\nEarlier today I already did: lesson 1 (The pre-production review); lesson 2 (Make the numbers agree). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Lay out a 1920 x 1080 board with one clear order of reading: the map largest, then the plans, then photos and packs.\n2. Label lightly: a title, the island's name, a one-line pitch and short captions, never paragraphs.\n3. Write a five-sentence pitch that anyone can repeat after reading it once.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: One-minute test: I describe my board to the tutor in 60 seconds; it repeats my island back to me in two sentences. If it misses a district or the route, I move that part higher on the board.\n4. Do-along on today's build (the consistency check (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - In Krita: File > New, 1920 x 1080 px, filled with a calm grey. You should see a wide empty board.\n   - Drag island_map.png onto the board (choose Insert as New Layer if Krita asks) and scale it (Ctrl+T) to fill the left half. You should see the map as the first thing the eye lands on.\n   - Put both plot plans on the right at the same size, with the captions 'District 1: waterfront' and 'District 2: ...'. You should see two equal plans.\n   - Add four to six hero photos in a row along the bottom, and one small picture of a best piece from each pack (cut from pack_scale.png). You should see real photos beside your plans.\n   - Write pitch.md (five sentences), put the island's name and the pitch's first sentence at the top of the board, and export planning_board.png. You should be able to read the whole board in a minute.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Taking a review like a pro", "uk": "Приймаємо огляд, як профі"}, "minutes": 40, "goals": [{"en": "Ask for a review in see-why-fix notes: what the reviewer sees, why it matters, and one fix, with a place or a file.", "uk": "Просити огляд у форматі нотаток «бачу — чому — виправити»: що бачить рецензент, чому це важливо, і одне виправлення з місцем або файлом."}, {"en": "Answer notes with decisions, not excuses: do it, do it differently (say how), or not now (say when).", "uk": "Відповідати на нотатки рішеннями, а не виправданнями: зробити, зробити інакше (сказати як) або не зараз (сказати коли)."}, {"en": "Make r2 and log every change, so anyone can follow what changed and why.", "uk": "Зробити r2 і записати кожну зміну в журнал, щоб будь-хто міг простежити, що змінилося і чому."}], "doalong": [{"en": "Score yourself first: place, map, plans, sources and board, 0 to 2 each. You should have a score out of 10.", "uk": "Спершу оціни себе: місце, мапа, плани, джерела і дошка, від 0 до 2 за кожне. У тебе має бути оцінка з 10."}, {"en": "Paste pitch.md, consistency_check.md and a short description of your board into a new tutor chat. Ask for a review as a demanding studio art director, in see-why-fix notes, ending with a verdict. You should get notes and a 'yes' or 'no, because ...'.", "uk": "Встав pitch.md, consistency_check.md і короткий опис своєї дошки в новий чат із тьютором. Попроси огляд від імені вимогливого арт-директора студії, у форматі нотаток «бачу — чому — виправити», що закінчується вердиктом. Ти маєш отримати нотатки і «так» або «ні, тому що ...»."}, {"en": "Write a decision under each note in self_review_day25.md. You should see one decision per note.", "uk": "Запиши рішення під кожною нотаткою в self_review_day25.md. Ти маєш побачити по одному рішенню на кожну нотатку."}, {"en": "Fix the top three notes and save each changed file with _r2 in its name (for example island_map_r2.png). You should see the r2 files beside the r1 ones.", "uk": "Виправ три головні нотатки і збережи кожен змінений файл із _r2 у назві (наприклад, island_map_r2.png). Ти маєш побачити файли r2 поруч із файлами r1."}, {"en": "Add a change log at the end of self_review_day25.md: the file, what changed and why. You should see one line per change.", "uk": "Додай журнал змін у кінці self_review_day25.md: файл, що змінилося і чому. Ти маєш побачити по рядку на кожну зміну."}], "play": {"en": "Reviewer's chair: the tutor gives a one-line verdict on each part of my pack; I predict each verdict before it speaks. Right predictions score.", "uk": "Крісло рецензента: тьютор дає вердикт в один рядок для кожної частини мого пакета; я передбачаю кожен вердикт, перш ніж він його скаже. Правильні передбачення приносять бали."}, "video": {"search": "how to give and receive art feedback"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Taking a review like a pro (Day 25, lesson 4 of 4).\nToday's build: Your island's planning pack: every file from Days 21 to 24 checked so the numbers agree, a one-page planning_board.png, pitch.md, and an r2 (second round) after the tutor's review.\nEarlier today I already did: lesson 1 (The pre-production review); lesson 2 (Make the numbers agree); lesson 3 (A planning board that reads in one minute). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Ask for a review in see-why-fix notes: what the reviewer sees, why it matters, and one fix, with a place or a file.\n2. Answer notes with decisions, not excuses: do it, do it differently (say how), or not now (say when).\n3. Make r2 and log every change, so anyone can follow what changed and why.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Reviewer's chair: the tutor gives a one-line verdict on each part of my pack; I predict each verdict before it speaks. Right predictions score.\n4. Do-along on today's build (the consistency check (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Score yourself first: place, map, plans, sources and board, 0 to 2 each. You should have a score out of 10.\n   - Paste pitch.md, consistency_check.md and a short description of your board into a new tutor chat. Ask for a review as a demanding studio art director, in see-why-fix notes, ending with a verdict. You should get notes and a 'yes' or 'no, because ...'.\n   - Write a decision under each note in self_review_day25.md. You should see one decision per note.\n   - Fix the top three notes and save each changed file with _r2 in its name (for example island_map_r2.png). You should see the r2 files beside the r1 ones.\n   - Add a change log at the end of self_review_day25.md: the file, what changed and why. You should see one line per change.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "planning_pack/ (every file from Days 21 to 24, with the r2 files)", "uk": "planning_pack/ (кожен файл із Днів 21-24, разом із файлами r2)"}, {"en": "consistency_check.md, pitch.md and planning_board.png", "uk": "consistency_check.md, pitch.md і planning_board.png"}, {"en": "self_review_day25.md (scores, the tutor's notes, your decisions, the change log and your tier)", "uk": "self_review_day25.md (бали, нотатки тьютора, твої рішення, журнал змін і твій рівень)"}, {"en": "before_after_day25.png (the board r1 beside r2)", "uk": "before_after_day25.png (дошка r1 поруч із r2)"}, {"en": "download.png (the Electric Dreams status) and pack_test.png if you went for Gold", "uk": "download.png (стан Electric Dreams) і pack_test.png, якщо ти йдеш на Золото"}, {"en": "clip_day25.mp4 (60 seconds through the board)", "uk": "clip_day25.mp4 (60 секунд по дошці)"}, {"en": "summary.md", "uk": "summary.md"}], "goal": {"en": "By the end of today you have a complete planning pack (references, map, two plot plans, two needs lists and pack picks) whose numbers agree, on one planning board, reviewed with the tutor and fixed to r2.", "uk": "До кінця сьогоднішнього дня в тебе є повний пакет планування (референси, мапа, два плани ділянок, два списки потреб і вибрані паки), числа в якому узгоджуються, на одній дошці планування, переглянутий із тьютором і виправлений до r2."}, "uses": [{"en": "Day 21: references.md, credits.md and your photos", "uk": "День 21: references.md, credits.md і твої фото"}, {"en": "Day 22: island_map.png and map_notes.md", "uk": "День 22: island_map.png і map_notes.md"}, {"en": "Day 23: both plot plans and their tables", "uk": "День 23: обидва плани ділянок і їхні таблиці"}, {"en": "Day 24: both needs lists, packs_review.md and pack_scale.png", "uk": "День 24: обидва списки потреб, packs_review.md і pack_scale.png"}], "quiz": [{"q": {"en": "Your needs list says 8 benches but your plan's table says 6. What do you do first?", "uk": "У твоєму списку потреб 8 лав, а в таблиці плану 6. Що ти робиш насамперед?"}, "options": [{"en": "Keep both: more is safer.", "uk": "Залишаю обидва: більше — надійніше."}, {"en": "Work out which is right from the length and spacing, then make both files say the same number.", "uk": "Обчислюю за довжиною і кроком, яке число правильне, а потім роблю так, щоб в обох файлах було те саме число."}, {"en": "Delete the needs list.", "uk": "Видаляю список потреб."}, {"en": "Let the tutor pick one.", "uk": "Даю тьютору вибрати одне."}], "answer": 1, "explain": {"en": "Two files that disagree mean nobody knows what to build. Check the source of the number, then fix both.", "uk": "Два файли, що суперечать одне одному, означають, що ніхто не знає, що будувати. Перевір, звідки взялося число, а потім виправ обидва."}}, {"q": {"en": "A Commons photo says 'CC BY-SA 4.0'. What do you write in credits.md?", "uk": "На фото з Commons написано 'CC BY-SA 4.0'. Що ти пишеш у credits.md?"}, "options": [{"en": "Only the link.", "uk": "Лише посилання."}, {"en": "Nothing: CC BY-SA needs no credit.", "uk": "Нічого: CC BY-SA не потребує авторства."}, {"en": "The title, the author, 'CC BY-SA 4.0' and the link.", "uk": "Назву, автора, 'CC BY-SA 4.0' і посилання."}, {"en": "'From Wikimedia Commons'.", "uk": "«З Wikimedia Commons»."}], "answer": 2, "explain": {"en": "BY means the author must be credited. A full line (title, author, licence, link) is always safe.", "uk": "BY означає, що треба вказати автора. Повний рядок (назва, автор, ліцензія, посилання) завжди безпечний."}}, {"q": {"en": "On your 2000 px map, district 2's box spans pixels 1350 to 1550 across and 600 to 800 down. What are its corners in metres?", "uk": "На твоїй мапі 2000 px квадрат району 2 займає пікселі від 1350 до 1550 по горизонталі і від 600 до 800 по вертикалі. Які його кути в метрах?"}, "options": [{"en": "X 350 to 550, Y -400 to -200", "uk": "X від 350 до 550, Y від -400 до -200"}, {"en": "X 1350 to 1550, Y 600 to 800", "uk": "X від 1350 до 1550, Y від 600 до 800"}, {"en": "X -350 to -550, Y 400 to 200", "uk": "X від -350 до -550, Y від 400 до 200"}, {"en": "X 350 to 550, Y 400 to 200", "uk": "X від 350 до 550, Y від 400 до 200"}], "answer": 0, "explain": {"en": "Subtract 1000 from every pixel number. Pixels above the middle give a negative Y, which is north.", "uk": "Відніми 1000 від кожного числа пікселів. Пікселі вище середини дають від'ємний Y, тобто північ."}}, {"q": {"en": "Why do the beaches on your map sit in bays?", "uk": "Чому пляжі на твоїй мапі лежать у затоках?"}, "options": [{"en": "Bays are easier to draw.", "uk": "Затоки легше малювати."}, {"en": "Beaches need a road.", "uk": "Пляжам потрібна дорога."}, {"en": "Sand only forms near towns.", "uk": "Пісок утворюється лише біля міст."}, {"en": "Waves are calmer in sheltered bays, so sand settles; exposed points get cliffs and rock.", "uk": "У захищених затоках хвилі спокійніші, тож пісок осідає; на відкритих мисах утворюються скелі і камінь."}], "answer": 3, "explain": {"en": "Calm water drops sand; rough water carries it away and wears the land into cliffs.", "uk": "Спокійна вода залишає пісок; бурхлива вода забирає його і точить сушу, утворюючи скелі."}}, {"q": {"en": "A bed on your plan is 20 x 10 m with shrubs 2 m apart. How many shrubs go in the table?", "uk": "Клумба на твоєму плані має 20 x 10 м, а кущі ростуть через 2 м. Скільки кущів іде в таблицю?"}, "options": [{"en": "10", "uk": "10"}, {"en": "50", "uk": "50"}, {"en": "100", "uk": "100"}, {"en": "200", "uk": "200"}], "answer": 1, "explain": {"en": "Area ÷ (spacing x spacing) = 200 ÷ 4 = 50.", "uk": "Площа ÷ (крок x крок) = 200 ÷ 4 = 50."}}, {"q": {"en": "What is a drone lane on your plot plan?", "uk": "Що таке коридор для дрона на твоєму плані ділянки?"}, "options": [{"en": "An open corridor at least 4 x 4 m with a set height, kept clear of tree crowns, lamps and awnings.", "uk": "Вільний прохід щонайменше 4 x 4 м із заданою висотою, без крон дерев, ліхтарів і маркіз."}, {"en": "A road for cars.", "uk": "Дорога для автомобілів."}, {"en": "The red district box.", "uk": "Червоний квадрат району."}, {"en": "A camera arrow.", "uk": "Стрілка камери."}], "answer": 0, "explain": {"en": "Lanes keep the flight path open even when the district fills up with props and trees.", "uk": "Коридори зберігають шлях польоту вільним, навіть коли район заповнюється пропсами і деревами."}}, {"q": {"en": "Electric Dreams has finished downloading on your 16 GB PC. What do you do before you open it the first time?", "uk": "Electric Dreams завантажився на твій ПК із 16 GB. Що ти робиш, перш ніж відкрити його вперше?"}, "options": [{"en": "Open ElectricDreams_Env to see everything.", "uk": "Відкриваю ElectricDreams_Env, щоб побачити все."}, {"en": "Copy the whole sample into IslandCourse.", "uk": "Копіюю весь зразок в IslandCourse."}, {"en": "Delete its shaders to save space.", "uk": "Видаляю його шейдери, щоб звільнити місце."}, {"en": "Raise the Windows page file to 32 GB or more, close the browser and keep Engine Scalability at High.", "uk": "Збільшую файл підкачки Windows до 32 GB або більше, закриваю браузер і залишаю Engine Scalability на High."}], "answer": 3, "explain": {"en": "The sample is heavy. A bigger page file, a closed browser and High scalability give its small levels the memory they need.", "uk": "Зразок важкий. Більший файл підкачки, закритий браузер і масштабованість High дають його малим рівням потрібну пам'ять."}}, {"q": {"en": "What makes a see-why-fix note useful?", "uk": "Що робить нотатку «бачу — чому — виправити» корисною?"}, "options": [{"en": "It is short and polite.", "uk": "Вона коротка і ввічлива."}, {"en": "It gives a score out of 10.", "uk": "Вона дає оцінку з 10."}, {"en": "It says what is seen, why it matters and one concrete fix with a place.", "uk": "Вона каже, що видно, чому це важливо, і дає одне конкретне виправлення з місцем."}, {"en": "It lists every fault at once.", "uk": "Вона перелічує всі помилки одразу."}], "answer": 2, "explain": {"en": "A located, concrete fix can be done straight away. 'Feels empty' can't.", "uk": "Конкретне виправлення з точним місцем можна зробити одразу. «Здається порожнім» — не можна."}}], "weekInfo": {"week": 5, "title": {"en": "Your real place and your island on paper", "uk": "Твоє реальне місце і твій острів на папері"}, "goal": {"en": "By Friday you have a complete planning pack: one real coastal place with 15 credited photos, island_map.png to scale with two red 200 x 200 m districts and the scenic route, two counted plot plans, two needs lists, reviewed free packs, and the Electric Dreams download under way.", "uk": "До п'ятниці в тебе є повний пакет планування: одне реальне прибережне місце з 15 фото із зазначеним авторством, island_map.png у масштабі з двома червоними районами 200 x 200 м і мальовничим маршрутом, два плани ділянок із підрахованими об'єктами, два списки потреб, переглянуті безкоштовні паки, а завантаження Electric Dreams уже триває."}, "skills": [{"en": "Reference research and image licensing (Creative Commons) for production art", "uk": "Пошук референсів і ліцензування зображень (Creative Commons) для продакшн-арту"}, {"en": "Scaled world maps from OpenStreetMap data, with districts, roads and flight routes", "uk": "Мапи світу в масштабі за даними OpenStreetMap: райони, дороги й маршрути польотів"}, {"en": "Plot plans with item counts, camera positions and drone lanes for level layout", "uk": "Плани ділянок із підрахунком об'єктів, позиціями камер і коридорами для дрона для планування рівня"}, {"en": "Asset sourcing: needs lists, Fab licence checks and best-pieces reviews", "uk": "Пошук асетів: списки потреб, перевірка ліцензій на Fab і огляд найкращих частин"}, {"en": "Pre-production review: consistency checks and a one-page planning board", "uk": "Огляд препродакшну: перевірка узгодженості й дошка планування на одну сторінку"}]}, "morning": {"sofar": {"en": "This week you chose a real place and turned it into a map, two plot plans, two needs lists and a set of free packs.", "uk": "Цього тижня справжнє місце перетворилося на мапу, два плани ділянок, два списки потреб і добірку безкоштовних паків."}, "today": {"en": "It is Boss day: you make all your planning numbers agree, put them on one planning board, review it with the tutor and fix it to r2.", "uk": "Сьогодні День боса: ти узгоджуєш усі свої планувальні числа, зводиш їх на одну дошку планування, переглядаєш її з тьютором і доводиш до версії r2."}, "cheer": {"en": "A review is a gift, not a verdict, and the Bronze tier is well within your reach; take each note as one more step forward.", "uk": "Рецензія — це подарунок, а не вирок, і Бронза цілком тобі під силу; сприймай кожне зауваження як ще один крок уперед."}, "quote": {"text": {"en": "Preparation, I have often said, is rightly two-thirds of any venture.", "uk": "Підготовка, як я часто кажу, — це по праву дві третини будь-якої справи."}, "author": {"en": "Amelia Earhart", "uk": "Амелія Ергарт"}, "source": "https://en.wikiquote.org/wiki/Amelia_Earhart"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-25-boss-planning-pack", "mapHref": "../../COURSE.html", "prevHref": "../Day-24-needs-lists-and-free-packs/START-HERE.html", "nextHref": "../Day-26-l-island-heightmap/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Krita, a text editor and your tutor chat. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me and don't write code. Keep me moving and make it feel like a game.\n\nToday I build on my own: The board, the review and r2, timed (tiers).\nIt's part of: Your island's planning pack: every file from Days 21 to 24 checked so the numbers agree, a one-page planning_board.png, pitch.md, and an r2 (second round) after the tutor's review (Your Work folder: a planning_pack folder holding every file from Days 21 to 24, with planning_board.png on top.).\n\nSpec:\n- planning_pack/: references.md, credits.md, osm_view.png, island_map.png, map_notes.md, plot_plan_d1 and plot_plan_d2 (.png and .md), needs_d1.md, needs_d2.md, packs_review.md and pack_scale.png.\n- consistency_check.md: the ten yes-or-no checks from lesson 2, each answered, with every 'no' fixed.\n- pitch.md: five sentences on what your island is, the real place behind it, its two districts and the scenic route.\n- planning_board.png, 1920 x 1080 px: the island map large, both plot plans, four to six hero photos, one best piece from each pack, and the island's name with a one-line pitch.\n- self_review_day25.md: your rubric scores, the tutor's see-why-fix notes, your decisions, the fixes made in r2, a change log and the tier you reached.\n\nMy checklist:\n1. Start the clock (3 hours for Bronze and Silver, 2 hours 30 for Gold). Make planning_pack and copy in every file from Days 21 to 24. Check: every file in the spec is there, or on a to-do line. (from lesson 1)\n2. Write one line per file saying what it proves. Check: about 14 lines, none empty. (from lesson 1)\n3. consistency_check.md, checks 1 to 4 (the map and the plans). Check: each answered 'yes', or a fault written with a number. (from lesson 2)\n4. Checks 5 and 6 (plans against needs lists, row by row). Check: every plan count appears in its needs list with the same number. (from lesson 2)\n5. Checks 7 to 10 (packs, credits, cameras, ground textures). Check: every pack opens in IslandCourse, and every photo, texture and pack has a credit line. (from lesson 2)\n6. Fix every 'no' and write what you changed. Check: ten 'yes' answers. (from lesson 2)\n7. Write pitch.md in five sentences. Check: someone could repeat your island back after reading it once. (from lesson 3)\n8. Make planning_board.png (1920 x 1080). Check: the map is the largest thing on it, and both plans, the photos and the packs are there. (from lesson 3)\n9. Score yourself with the five-line rubric (place, map, plans, sources, board; 0 to 2 each). Check: a score out of 10 in self_review_day25.md. (from lesson 4)\n10. Ask the tutor for a review in see-why-fix notes and write a decision under each note. Check: every note has a decision. (from lesson 4)\n11. Fix the top three notes as r2 and write the change log, then write the tier you reached. Check: three _r2 files or changed lines, each with a log line. (from lesson 4)\n12. Gold only: a pack test in L_PackTest, with one best piece from each pack beside your own kit and the mannequin under the same light; note every scale or colour clash in packs_review.md. Check: pack_test.png and at least one clash noted with its fix, or 'no clashes' after checking all four (size, colour, shine, style). (from day 24, lesson 3)\n13. Electric Dreams: write its status in self_review_day25.md (still downloading, downloaded, or opened once on its Startup level) and save download.png. Check: the screenshot shows the Launcher's Downloads or the sample's Startup level. (from day 24, lesson 1)\n14. Before/after: planning board r1 beside r2, and a 60-second screen clip walking through the board (Win+Alt+R). Save today's clip as clip_day25.mp4. Check: before_after_day25.png shows the three fixes, and the clip is about 60 seconds. (from lesson 4)\n\nToday is a BOSS build: help me keep time against the tiers below. Tiers:\n- Bronze: inside 3 hours, the planning_pack folder is complete, consistency_check.md is answered, and planning_board.png and pitch.md exist.\n- Silver: every consistency check passes (counts match between plans and needs lists, every photo and pack is in credits.md, every camera names a hero photo), and the tutor's top three notes are fixed in r2.\n- Gold: done inside 2 hours 30, plus the pack test in L_PackTest with every scale or colour clash noted in packs_review.md.\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me and tell me which tier I reached.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Misha\nDay 25: Boss: your planning pack, reviewed. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; boss tier: <bronze / silver / gold / none>; quiz: <score> of 8\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p><div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+list(D.handin,'ul','ticks')+'<p class="path">'+ic('folder')+'<span>'+u('shipTo')+' <code>'+esc(D.workPath)+'</code></span></p>'+(D.lessons.length?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<p class="muted">'+u('report')+'</p><div class="row"><button class="btn s" onclick="cp(D.reportPrompt)">'+ic('copy')+u('copyR')+'</button></div></section>';
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();

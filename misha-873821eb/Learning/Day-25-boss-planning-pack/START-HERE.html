<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 25</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

e, Content/Course/Day25/L_MapDrape.", "uk": "Робоча папка дня (Day25) — для consistency_check.md, pitch.md, planning_board.kra і .png та self_review_day25.md. Виправлені файли лишаються у своїх папках днів під звичними назвами. Для Золота додається тренувальний рівень у IslandCourse: Content/Course/Day25/L_MapDrape."}, "spec": [{"en": "consistency_check.md: the ten yes-or-no checks from lesson 2, each answered, with every 'no' fixed in the file itself.", "uk": "consistency_check.md: десять запитань «так чи ні» з уроку 2. На кожне є відповідь, а кожне «ні» виправлено в самому файлі."}, {"en": "pitch.md: five sentences on what your island is, the real place behind it, its two districts and the scenic route.", "uk": "pitch.md: п'ять речень про те, що таке твій острів, яке реальне місце за ним стоїть, його два райони й мальовничий маршрут."}, {"en": "planning_board.png, 1920 x 1080 px. The island map is largest, with both plot plans, four to six hero photos, one best piece from each pack, the island's name and a one-line pitch.", "uk": "planning_board.png, 1920 × 1080 px. Найбільша на ньому — мапа острова. Поруч обидва плани ділянок, чотири–шість ключових фото, по одній найкращій деталі з кожного пака, назва острова й презентація в один рядок."}, {"en": "self_review_day25.md: your plan with times, your rubric scores, the tutor's see-why-fix notes and your decisions. Add a change log of the r2 fixes, the tier you reached and your time.", "uk": "self_review_day25.md: твій план із часом, оцінки за таблицею оцінювання, нотатки тьютора «бачу, чому, як виправити» і твої рішення. Додай журнал змін r2, здобуту медаль і свій час."}, {"en": "r2 fixes: before you change a file, save a copy with _r1 in its name (for example island_map_r1.png). Then fix the original and keep its usual name, so Day 26 and later days open the fixed one.", "uk": "Виправлення r2: перш ніж змінити файл, збережи копію з _r1 у назві (наприклад, island_map_r1.png). Потім виправ оригінал і лиши йому звичну назву: так День 26 і наступні дні відкриють виправлений файл."}], "piece1": "the consistency check (shared with the lessons)", "piece2": {"en": "The board, the review and r2, timed (tiers)", "uk": "Аркуш, огляд і r2 на час (медалі)"}, "steps": [{"text": {"en": "Check: the files from today's lessons are in the day work folder (self_review_day25.md with your plan, consistency_check.md, planning_board.kra and pitch.md). Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it. Then start the clock: 3 hours for Bronze and Silver, 2 hours 30 for Gold. Check: your plan's times add up to no more than the clock.", "uk": "Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: self_review_day25.md із планом, consistency_check.md, planning_board.kra і pitch.md. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Потім запусти таймер: 3 години для Бронзи й Срібла, 2 години 30 хвилин для Золота. Перевірка: час у плані в сумі не більший за таймер."}, "lesson": 1}, {"text": {"en": "consistency_check.md, checks 1 to 4 (the map and the plans), with Krita's Measure tool and map_notes.md. Check: each is answered 'yes', or a fault written with a number.", "uk": "consistency_check.md, запитання 1–4 (мапа й плани): інструмент Measure у Krita і map_notes.md. Перевірка: на кожне відповідь «так» або помилка, записана з числом."}, "lesson": 2}, {"text": {"en": "Checks 5 and 6: each plan table beside its needs list, row by row. Check: every plan count appears in its needs list with the same number.", "uk": "Запитання 5 і 6: кожна таблиця плану поруч зі своїм списком потреб, рядок за рядком. Перевірка: кожна кількість із плану є в списку потреб із тим самим числом."}, "lesson": 2}, {"text": {"en": "Checks 7 to 10: packs, credits, cameras and ground textures. Check: every pack opens in IslandCourse, and credits.md in GAD has a line for every photo, texture and pack.", "uk": "Запитання 7–10: паки, авторство, камери й текстури ґрунту. Перевірка: кожен пак відкривається в IslandCourse, а в credits.md у папці GAD є рядок для кожного фото, текстури й пака."}, "lesson": 2}, {"text": {"en": "Fix every 'no' in the file itself, keeping its name, and write what you changed under the check. Check: ten 'yes' answers.", "uk": "Виправ кожне «ні» в самому файлі, не змінюючи його назви, і під запитанням запиши, що змінено. Перевірка: десять відповідей «так»."}, "lesson": 2}, {"text": {"en": "Finish pitch.md in five sentences. Check: someone could repeat your island back after reading it once.", "uk": "Допиши pitch.md — п'ять речень. Перевірка: людина, яка прочитала його раз, може переказати, що це за острів."}, "lesson": 3}, {"text": {"en": "Finish the board: four to six hero photos along the bottom and one best piece from each pack (cut from pack_scale.png). Export planning_board.png. Check: it reopens at 1920 x 1080 px, the map is the largest thing on it, and both plans, the photos and the packs are there.", "uk": "Заверши аркуш: унизу чотири–шість ключових фото і по одній найкращій деталі з кожного пака (виріж із pack_scale.png). Експортуй planning_board.png. Перевірка: файл знову відкривається з розміром 1920 × 1080 px, мапа на ньому найбільша, а обидва плани, фото й паки на місці."}, "lesson": 3}, {"text": {"en": "Score yourself with the five-line rubric: place, map, plans, sources, board, 0 to 2 each. Then ask the tutor for a review in see-why-fix notes, and write a decision under each note. Check: a score out of 10 in self_review_day25.md, and every note has a decision.", "uk": "Оціни себе за таблицею оцінювання з п'яти рядків: місце, мапа, плани, джерела, аркуш — кожен від 0 до 2. Потім попроси тьютора про огляд у нотатках «бачу, чому, як виправити» і під кожною нотаткою запиши рішення. Перевірка: у self_review_day25.md є оцінка з 10, а в кожної нотатки є рішення."}, "lesson": 4}, {"text": {"en": "r2: fix the top three notes. Before you change a file, save a copy with _r1 in its name; then fix the original under its usual name. Add a change-log line for each fix. Check: three _r1 copies beside three fixed files, each with a log line.", "uk": "r2: виправ три головні нотатки. Перш ніж змінити файл, збережи копію з _r1 у назві. Потім виправ оригінал під звичною назвою. Для кожного виправлення додай рядок у журнал змін. Перевірка: три копії _r1 поруч із трьома виправленими файлами, у кожного є рядок у журналі."}, "lesson": 4}, {"text": {"en": "Export planning_board.png again with your fixes. Write your tier and time in self_review_day25.md, and the Electric Dreams status in summary.md (still downloading, downloaded, or opened once). Check: the new board reopens and shows at least one fix, and summary.md has the status line.", "uk": "Знову експортуй planning_board.png із виправленнями. Запиши медаль і час у self_review_day25.md, а стан Electric Dreams — у summary.md («ще завантажується», «завантажено» або «відкрито один раз»). Перевірка: новий аркуш відкривається й показує щонайменше одне виправлення, а в summary.md є рядок про стан."}, "lesson": 3}, {"text": {"en": "Gold only, your map in Unreal: make a Basic level, save it as L_MapDrape in Content/Course/Day25 and delete its Floor. Place Actors > Shapes > Plane at Location 0, 0, 0, Scale 2000, 2000, 1: that is 2 x 2 km. Check: the title bar shows L_MapDrape and the Plane stretches far beyond the mannequin.", "uk": "Лише для Золота, мапа в Unreal: створи рівень Basic, збережи як L_MapDrape у Content/Course/Day25 і видали з нього Floor. Постав Place Actors > Shapes > Plane у Location 0, 0, 0 зі Scale 2000, 2000, 1 — це 2 × 2 км. Перевірка: у заголовку вікна L_MapDrape, а Plane тягнеться далеко за манекен."}, "lesson": "D24.3"}, {"text": {"en": "Gold only: drag island_map.png into the Content Browser, right-click it > Create Material and drop the material on the Plane. In the Top view, make it read right: Rotation Z 90, 180 or 270, or Scale X -2000 if the writing is mirrored. Play (Alt+P) and save map_drape.png. Check: north is at the top and the mannequin stands on your map.", "uk": "Лише для Золота: перетягни island_map.png у Content Browser, клацни правою кнопкою > Create Material і перетягни матеріал на Plane. Перемкнися на вид Top і зроби, щоб мапа читалася правильно: Rotation Z 90, 180 чи 270 або Scale X -2000, якщо написи дзеркальні. Запусти Play (Alt+P) і збережи скриншот map_drape.png. Перевірка: північ угорі, а манекен стоїть на твоїй мапі."}, "lesson": "D24.3"}, {"text": {"en": "Boss clip: record 30 to 60 seconds walking through your board (Win+Alt+R); for Gold, add 10 seconds of the mannequin on your map. Save it as clip_day25.mp4. Check: it plays, and right-click > Properties shows under 50 MB; if bigger, export it at 720p in Clipchamp.", "uk": "Кліп боса: запиши 30–60 секунд, як ти проходиш своїм аркушем (Win+Alt+R). Для Золота додай 10 секунд манекена на мапі. Збережи як clip_day25.mp4. Перевірка: кліп відтворюється, а клацання правою кнопкою > Властивості (Properties) показує менше 50 МБ. Якщо більше, експортуй його в Clipchamp у 720p."}, "lesson": 3}, {"text": {"en": "Report and hand-in: click Copy the day report at the bottom of the page, paste it into a new chat and answer. Open summary.md in Notepad, press Ctrl+End, paste the answer and press Ctrl+S. Then drag the files on the Hand in list into your hand-in folder. Check: every name shows in the folder, each with a size.", "uk": "Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: кожна назва зі списку є в папці, у кожної є розмір."}, "lesson": "D0.1"}], "boss": [{"en": "Bronze: inside 3 hours, consistency_check.md is answered, planning_board.png and pitch.md exist, and the tutor's notes have decisions.", "uk": "Бронза: за 3 години на всі запитання consistency_check.md є відповіді, planning_board.png і pitch.md готові, а під нотатками тьютора є рішення."}, {"en": "Silver: every consistency check passes: plan and needs-list counts match, every photo and pack is in credits.md, and every camera names a hero photo. The tutor's top three notes are fixed, with _r1 copies and a change log.", "uk": "Срібло: усі перевірки узгодженості пройдено — кількості в планах і списках потреб збігаються, кожне фото й пак є в credits.md, біля кожної камери названо ключове фото. Три головні нотатки тьютора виправлено, є копії _r1 і журнал змін."}, {"en": "Gold: done inside 2 hours 30, plus your map draped on a 2 x 2 km Plane in L_MapDrape: map_drape.png shows your mannequin standing on your island.", "uk": "Золото: усе зроблено за 2 години 30 хвилин, а ще мапа натягнута на Plane 2 × 2 км у L_MapDrape: на map_drape.png манекен стоїть на твоєму острові."}], "assets": ["island12/art-director-notes.md"]}, "lessons": [{"title": {"en": "The pre-production review (micro-lesson)", "uk": "Огляд препродакшну (мікроурок)"}, "minutes": 20, "goals": [{"en": "Explain pre-production: the planning stage before building, which ends in a review where the plans are checked.", "uk": "Пояснювати, що таке препродакшн: етап планування перед будівництвом, який закінчується оглядом планів."}, {"en": "Name the four parts of your planning pack and what each proves: the place (references), the scale (map), the layout (plans) and the pieces (needs lists and packs).", "uk": "Називати чотири частини пакета планування й те, що кожна доводить: місце доводять референси, масштаб — мапа, розкладку — плани, а деталі — списки потреб і паки."}, {"en": "Plan a timed Boss: the checks first, then the board, then the review.", "uk": "Планувати День боса на час: спершу перевірки, потім аркуш, потім огляд."}], "doalong": [{"en": "Open art-director-notes.md from today's assets and read 'The verdict'. You should know that a review ends with 'yes', or 'no, because ...' and three notes.", "uk": "Відкрий art-director-notes.md із сьогоднішніх assets і прочитай розділ «The verdict» («Вердикт»). Огляд закінчується словом «так» або «ні, тому що …» і трьома нотатками."}, {"en": "In a new file, self_review_day25.md, write the four parts of your pack and the file that proves each. You should have four lines, for example 'scale: island_map.png'.", "uk": "У новому файлі self_review_day25.md запиши чотири частини пакета й файл, що доводить кожну. Має вийти чотири рядки, наприклад «масштаб: island_map.png»."}, {"en": "Under them, write your plan with times: checks, board, review, r2. You should see a plan that fits in 3 hours.", "uk": "Під ними запиши план із часом: перевірки, аркуш, огляд, r2. Має вийти план, що вміщається в 3 години."}], "play": {"en": "Gatekeeper: the tutor plays a studio reviewer and asks me for one fact at a time ('how many benches on the promenade?'). I answer in under 20 seconds with the file and the number.", "uk": "Вартовий: тьютор грає рецензента студії й питає в мене по одному факту («скільки лавок на прогулянковій набережній?»). Я відповідаю за 20 секунд, називаючи файл і число."}, "video": {"search": "what is pre-production in game development"}, "prompt": "You are my tutor for one 20-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Огляд препродакшну (мікроурок) (Day 25, lesson 1 of 4). Today's build: Пакет планування острова, перевірений так, що всі числа з Днів 21–24 збігаються; аркуш планування planning_board.png на одну сторінку; pitch.md; три головні нотатки тьютора виправлено (r2).\nWhat I already know: День 21: references.md, credits.md і твої фото; День 22: island_map.png і map_notes.md; День 23: обидва плани ділянок і їхні таблиці; День 24: обидва списки потреб, packs_review.md і pack_scale.png.\n\nBy the end of this lesson I can:\n1. Пояснювати, що таке препродакшн: етап планування перед будівництвом, який закінчується оглядом планів.\n2. Називати чотири частини пакета планування й те, що кожна доводить: місце доводять референси, масштаб — мапа, розкладку — плани, а деталі — списки потреб і паки.\n3. Планувати День боса на час: спершу перевірки, потім аркуш, потім огляд.\n\nRun the lesson in this order; it should take 20 to 30 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: Цього тижня справжнє місце перетворилося на мапу, два плани ділянок, два списки потреб і добірку безкоштовних паків. Today: Сьогодні День боса: ти узгоджуєш усі числа планування, збираєш їх на одному аркуші планування, проходиш огляд із тьютором, виправляєш до r2 і записуєш короткий кліп. One encouraging line: Огляд — це подарунок, а не вирок, і Бронза тобі цілком під силу; сприймай кожну нотатку як ще один крок уперед.); 2 lines on why today matters and where it comes back, in plain words (from this: Студії проводять огляд препродакшну — перевірку планів, перш ніж хтось почне будувати. Якщо мапа, плани й список потреб не збігаються, потім втрачаються тижні. Сьогодні ти доводиш, що острів готовий: числа збігаються, у кожної деталі є джерело й ліцензія, а ідея вміщається на одній сторінці. It comes back: Наступного тижня цей пакет стане рельєфом: у День 26 island_map.png перетвориться на L_Island. Перевірені плани й списки потреб збудують район 1 з Дня 41 і район 2 з Дня 48.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-25-boss-planning-pack exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (перевірка узгодженості (разом з уроками)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Відкрий art-director-notes.md із сьогоднішніх assets і прочитай розділ «The verdict» («Вердикт»). Огляд закінчується словом «так» або «ні, тому що …» і трьома нотатками.\n   2. У новому файлі self_review_day25.md запиши чотири частини пакета й файл, що доводить кожну. Має вийти чотири рядки, наприклад «масштаб: island_map.png». [screenshot]\n   3. Під ними запиши план із часом: перевірки, аркуш, огляд, r2. Має вийти план, що вміщається в 3 години. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Вартовий: тьютор грає рецензента студії й питає в мене по одному факту («скільки лавок на прогулянковій набережній?»). Я відповідаю за 20 секунд, називаючи файл і число. Otherwise skip it.\n6. Review: ask me these questions from earlier days, one at a time, and correct me kindly: Day 22: on your 2000 px map, what are X and Y in metres for the pixel 600 across and 1400 down? | Day 19: what does a clear foreground, middle ground and background do for a shot?\n7. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n8. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in

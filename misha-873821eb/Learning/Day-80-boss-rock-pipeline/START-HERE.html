<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 80</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

details{margin-top:22px;border-radius:20px;background:var(--well);box-shadow:var(--press);padding:0 18px}

.medal{display:flex;align-items:center;gap:10px;margin:0 0 8px;font:700 11.5px/1 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}

.m1{--mg:rgba(190,200,215,.7)}.m1 i{background:linear-gradient(135deg,#f3f6fa,#9aa5b3)}
.m2{--mg:rgba(245,195,91,.75)}.m2 i{background:linear-gradient(135deg,#ffe08a,#c99412)}

.check input::after{content:"";width:10px;height:5px;border:solid #fff;border-width:0 0 2.2px 2.2px;transform:rotate(-45deg) translate(1px,-1px);opacity:0}

.check .ln{font:600 10.5px/1.3 var(--head);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);white-space:nowrap;margin-top:5px;padding:4px 9px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
/* quiz */

.opt.right{box-shadow:var(--press);background:var(--okBg);border-color:rgba(74,222,128,.45)}.opt.right .lt{background:var(--okL);color:#fff;box-shadow:0 0 10px var(--okL)}.opt.right .mk{color:var(--ok)}

#toast{position:fixed;left:50%;bottom:28px;z-index:9;transform:translateX(-50%) translateY(16px);background:rgba(30,33,46,.82);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:#f4f5fa;border:1px solid rgba(255,255,255,.14);padding:13px 24px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none;font:600 14px/1.4 var(--head);max-width:min(92vw,560px);text-align:center;box-shadow:0 20px 40px -14px rgba(0,0,0,.5),0 0 24px var(--glow)}

<script id="data" type="application/json">{"learner": "ib-misha-873821eb", "learnerName": {"en": "Misha", "uk": "Міша"}, "day": 80, "week": 16, "total": 110, "title": {"en": "Boss: the rock pipeline, from seed to island in one run", "uk": "Бос: пайплайн скель, від зерна до острова за один прогін"}, "theme": {"en": "Week 16: Blender Python and Geometry Nodes", "uk": "Тиждень 16: Blender Python і Geometry Nodes"}, "build": {"item": {"en": "One pipeline run: SM_Rock_01 to SM_Rock_10 from seed to Unreal, checked at both ends, and placed as a breakwater on your island", "uk": "Один прогін пайплайну: SM_Rock_01 - SM_Rock_10 від зерна до Unreal, перевірені з обох кінців і розставлені як хвилеріз на твоєму острові"}, "why": {"en": "A pipeline is only real when it runs from start to end with no hand fixes in the middle. Today you prove yours: seeds in Blender, a clean log, a clean import, Nanite in bulk and a clean checker report in Unreal. Studios trust artists whose assets arrive right the first time, and you now have the tools and the logs to show it.", "uk": "Пайплайн справжній лише тоді, коли він іде від початку до кінця без ручних виправлень посередині. Сьогодні ти доводиш, що твій такий: зерна в Blender, чистий лог, чистий імпорт, Nanite масово й чистий звіт перевірки в Unreal. Студії довіряють художникам, чиї асети з першого разу приходять правильними, і тепер ти маєш інструменти й логи, щоб це показати."}, "where": {"en": "TechArt/Blender/gn_rocks.blend and its exports; in IslandCourse, Content/Tools/Day80/Rocks, the practice level Content/Tools/Day80/L_Day80, then the waterfront of L_Island.", "uk": "TechArt/Blender/gn_rocks.blend і його експорти; в IslandCourse це Content/Tools/Day80/Rocks, тренувальний рівень Content/Tools/Day80/L_Day80, потім набережна L_Island."}, "spec": [{"en": "pipeline_plan.md first: the seven stages in order (generate, dry run, export, import, Nanite, check, place), each with its tool, its input and output, what you look at before going on  зверху й у проміжках, кожна копія повернута по-різному, жодна не висить у повітрі."}, {"en": "Bronze: the run done and the report clean. Silver: the breakwater on the island and pipeline_plan.md with real times. Gold: a second family (your pebbles or three planters) through the same run, timed under 15 minutes.", "uk": "Бронза: прогін виконано, а звіт чистий. Срібло: хвилеріз на острові й pipeline_plan.md зі справжніми хвилинами. Золото: друга родина (твої камінці або три вазони) через той самий прогін за час менш ніж 15 хвилин."}], "piece1": "The rock run, stage by stage (reviewed in the lessons)", "piece2": {"en": "Placing the rocks well on your island, and Gold's second family", "uk": "Як добре розставити скелі на твоєму острові, і друга родина для Золота"}, "steps": [{"text": {"en": "Start a 4-hour timer. Write pipeline_plan.md: the seven stages in order, each with its tool, what you expect to see and your minutes; Bronze by hour 2, Silver by hour 3, Gold in hour 4. Check: the plan names every stage, its tool and its check.", "uk": "Запусти 4-годинний таймер. Напиши pipeline_plan.md: сім етапів по порядку, кожен зі своїм інструментом, тим, що очікуєш побачити, і своїми хвилинами; Бронза до 2-ї години, Срібло до 3-ї, Золото в 4-й. Перевірка: план називає кожен етап, його інструмент і його перевірку."}, "lesson": 1}, {"text": {"en": "In gn_rocks.blend delete every collection in EXPORT (old rocks and pebbles) and purge unused data, put Rock_GN back on its rock settings (Size 1.2, Roughness 0.25, Flatten 1), set COUNT = 10 and NAME = 'SM_Rock' and run make_variants.py. Check: ten new collections in EXPORT, each with one rock and one UCX box.", "uk": "У gn_rocks.blend видали кожну колекцію в EXPORT (старі скелі та камінці) і очисти невикористані дані (purge), поверни Rock_GN до налаштувань скелі (Size 1.2, Roughness 0.25, Flatten 1), постав COUNT = 10 і NAME = 'SM_Rock' та запусти make_variants.py. Перевірка: десять нових колекцій в EXPORT, у кожній одна скеля й одна коробка UCX."}, "lesson": 2}, {"text": {"en": "Dry-run export_kit.py, then run it for real and set DRY_RUN back to True. Check: export_log.md says exported and lists ten OK lines, and exports holds ten SM_Rock_ files with today's time.", "uk": "Зроби пробний запуск export_kit.py, потім запусти його по-справжньому й поверни DRY_RUN = True. Перевірка: export_log.md каже exported і перелічує десять рядків OK, а в exports лежить десять файлів SM_Rock_ із сьогоднішнім часом."}, "lesson": 2}, {"text": {"en": "In IslandCourse make Content/Tools/Day80/Rocks, drag all ten FBX files in, check your import settings once and click Import All. Check: ten static meshes, each showing its box under Show > Simple Collision in the Static Mesh Editor.", "uk": "В IslandCourse створи Content/Tools/Day80/Rocks, перетягни туди всі десять файлів FBX, один раз перевір налаштування імпорту й клацни Import All. Перевірка: десять статичних сіток (static mesh), кожна показує свою коробку під Show > Simple Collision у Static Mesh Editor."}, "lesson": 3}, {"text": {"en": "Make MI_Rock from M_Master with a colour and roughness from your photos, save all, then right-click the imported M_Rock > Delete and choose Replace References with MI_Rock. Check: all ten rocks show MI_Rock in their material slot.", "uk": "Зроби MI_Rock з M_Master із кольором і roughness за твоїми фото, збережи все, потім клацни правою на імпортованому M_Rock > Delete і вибери Replace References з MI_Rock. Перевірка: усі десять скель показують MI_Rock у своєму слоті матеріалу."}, "lesson": 3}, {"text": {"en": "Set FOLDER = '/Game/Tools/Day80/Rocks' in set_nanite.py (Day 72) and run it: the dry run first, then Yes in its dialog (or the Nanite button of EUW_TechTools). Check: the dry run lists ten meshes, and afterwards each mesh's Details shows Nanite enabled.", "uk": "Постав FOLDER = '/Game/Tools/Day80/Rocks' у set_nanite.py (День 72) і запусти його: спершу пробний запуск, потім Yes у його діалозі (або кнопка Nanite в EUW_TechTools). Перевірка: пробний запуск перелічує десять сіток, а потім у Details кожної сітки Nanite увімкнено."}, "lesson": 3}, {"text": {"en": "Bronze check: set FOLDER = '/Game/Tools/Day80/Rocks' in check_assets.py and run it; copy Saved/TechTools/asset_report.md into today's Work folder as check_report_day80.md. If it shows a problem, fix it at the source (node group, script or import setting), run the stages again, and write why in pipeline_notes.md. Check: the report lists ten meshes and no problems.", "uk": "Перевірка Бронзи: постав FOLDER = '/Game/Tools/Day80/Rocks' у check_assets.py і запусти його; скопіюй Saved/TechTools/asset_report.md у папку Work за сьогодні як check_report_day80.md. Якщо він показує проблему, виправ її в джерелі (група вузлів, скрипт або налаштування імпорту), запусти етапи знову й запиши чому в pipeline_notes.md. Перевірка: звіт перелічує десять сіток і жодної проблеми."}, "lesson": 3}, {"text": {"en": "Make L_Day80 in Content/Tools/Day80, place the ten rocks in a row beside the mannequin and press End on each. Check: ten different rocks, all on the floor, believable in size beside the mannequin.", "uk": "Створи L_Day80 у Content/Tools/Day80, розстав десять скель у ряд поруч із манекеном і натисни End на кожній. Перевірка: десять різних скель, усі на підлозі, правдоподібного розміру поруч із манекеном."}, "lesson": 4}, {"text": {"en": "Open L_Island at your waterfront and build a breakwater or rock group from 25 or more copies: the biggest rocks low on the sea side and sunk by about a tenth of their height, medium ones on top, small ones filling the gaps, each copy turned and scaled 0.8 to 1.2. Check: from 30 m up it reads as one built shape with no straight rows, and at 2 m no rock floats.", "uk": "Відкрий L_Island на своїй набережній і збудуй хвилеріз або групу скель із 25 і більше копій: найбільші скелі низько з боку моря й занурені приблизно на десяту частину свого розміру, середні зверху, дрібні заповнюють проміжки, кожну копію повернуто й масштабовано від 0.8 до 1.2. Перевірка: з висоти 30 м це читається як одна збудована форма без прямих рядів, а з 2 м жодна скеля не висить."}, "lesson": 4}, {"text": {"en": "Silver check: write the real minutes beside the planned ones in pipeline_plan.md and take breakwater_30m.png and breakwater_2m.png. Check: both pictures are in today's Work folder and the plan shows planned and real times side by side.", "uk": "Перевірка Срібла: запиши справжні хвилини поруч із запланованими в pipeline_plan.md і зроби breakwater_30m.png та breakwater_2m.png. Перевірка: обидва зображення в папці Work за сьогодні, а план показує заплановані й справжні часи поруч."}, "lesson": 1}, {"text": {"en": "Gold: send a second family (SM_Pebble_01 to _05 made again with your pebble settings, or three planters from gn_props.blend) through the same stages, timing the whole run from the first script to the clean report. Check: a second clean check_assets.py report, and the run under 15 minutes written in pipeline_notes.md.", "uk": "Золото: пропусти другу родину (SM_Pebble_01 - _05, зроблені знову з твоїми налаштуваннями камінців, або три вазони з gn_props.blend) через ті самі етапи, засікаючи весь прогін від першого скрипта до чистого звіту. Перевірка: другий чистий звіт check_assets.py, а прогін менш ніж за 15 хвилин записано в pipeline_notes.md."}, "lesson": 2}, {"text": {"en": "Self-review with tool-review-checklist.md and the tutor for make_variants.py and export_kit.py: names, comments, safe defaults, readable errors. Fix the worst no first. Check: every line has a yes or a no, and the worst one is fixed.", "uk": "Самоперевірка за tool-review-checklist.md разом із тьютором для make_variants.py та export_kit.py: імена, коментарі, безпечні значення за замовчуванням, зрозумілі помилки. Спершу виправ найгірше «ні». Перевірка: біля кожного рядка стоїть «так» або «ні», а найгірше виправлено."}, "lesson": 1}, {"text": {"en": "Record clip_day80.mp4 (60 seconds): the script making the rocks, the export log, the import and the breakwater from the air. Click Copy the day report, paste it into a new tutor chat and save its answer as summary.md. Check: the clip and summary.md are in today's Work folder.", "uk": "Запиши clip_day80.mp4 (60 секунд): скрипт, що робить скелі, лог експорту, імпорт і хвилеріз з повітря. Клацни Copy the day report (скопіювати звіт дня), встав у новий чат із тьютором і збережи його відповідь як summary.md. Перевірка: кліп і summary.md лежать у папці Work за сьогодні."}, "lesson": 4}], "boss": [{"en": "Bronze: ten rocks generated, exported with a clean log, imported, switched to Nanite, and check_assets.py's report clean.", "uk": "Бронза: десять скель згенеровано, експортовано з чистим логом, імпортовано, переведено на Nanite, а звіт check_assets.py чистий."}, {"en": "Silver: Bronze, plus a breakwater of 25 or more copies on your island that reads as one shape from 30 m with nothing floating, and pipeline_plan.md with real times.", "uk": "Срібло: Бронза плюс хвилеріз із 25 і більше копій на твоєму острові, що читається як одна форма з 30 м і де нічого не висить, та pipeline_plan.md зі справжніми часами."}, {"en": "Gold: Silver, plus a second family through the same run with a second clean report, and the whole run timed under 15 minutes.", "uk": "Золото: Срібло плюс друга родина через той самий прогін із другим чистим звітом, а весь прогін засічено менш ніж за 15 хвилин."}], "assets": ["techart/tool-review-checklist.md", "techart/standards-sheet.md"]}, "lessons": [{"title": {"en": "Plan the run: a pipeline you can repeat", "uk": "Плануй прогін: пайплайн, який можна повторити"}, "minutes": 40, "goals": [{"en": "Write a pipeline plan: each stage with its tool, its input and output, and the one thing you check before the next stage.", "uk": "Напиши план пайплайну: кожен етап зі своїм інструментом, входом і виходом та однією річчю, яку перевіряєш перед наступним етапом."}, {"en": "Plan Bronze, Silver and Gold in minutes, as on every Boss day.", "uk": "Сплануй Бронзу, Срібло й Золото в хвилинах, як у кожен День боса."}, {"en": "Explain why a pipeline stops at the first failed check and fixes it at the source, instead of patching by hand in the middle.", "uk": "Поясни, чому пайплайн зупиняється на першій невдалій перевірці й виправляє причину в джерелі, а не латає вручну посередині."}], "doalong": [{"en": "Write pipeline_plan.md with seven headings: Generate (make_variants.py), Dry run (export_kit.py), Export, Import (your checklist), Nanite (set_nanite.py), Check (check_assets.py), Place. Under each write its input and its output file or folder. You see a plan someone else could follow.", "uk": "Напиши pipeline_plan.md із сімома заголовками: Generate (make_variants.py), Dry run (export_kit.py), Export, Import (твій контрольний список), Nanite (set_nanite.py), Check (check_assets.py), Place. Під кожним запиши його вхід і вихідний файл або папку. Ти бачиш план, за яким міг би працювати хтось інший."}, {"en": "Next to each stage write the one thing you look at before going on: ten collections; ten OK lines; ten FBX files; ten meshes with collision; Nanite ticked; a clean report; nothing floating. You see seven checks.", "uk": "Поруч із кожним етапом запиши одну річ, на яку дивишся, перш ніж іти далі: десять колекцій; десять рядків OK; десять файлів FBX; десять сіток із колізією; Nanite ввімкнено; чистий звіт; нічого не висить. Ти бачиш сім перевірок."}, {"en": "Write your minutes per stage and the tiers: Bronze by hour 2, Silver by hour 3, Gold in hour 4. You see a timed plan.", "uk": "Запиши свої хвилини на етап і рівні: Бронза до 2-ї години, Срібло до 3-ї, Золото в 4-й. Ти бачиш план за часом."}, {"en": "Tell the tutor which stage you think is weakest and why, and add one line: if a check fails, I fix the cause in its own stage and run again from there. You see a plan that says what happens when something goes wrong.", "uk": "Скажи тьюторові, який етап вважаєш найслабшим і чому, і додай один рядок: якщо перевірка не проходить, я виправляю причину на її етапі й запускаю знову звідти. Ти бачиш план, що каже, що робити, коли щось іде не так."}], "play": {"en": "Pipeline triage: the tutor names four failures (nine FBX files; a mesh with no collision in Unreal; Nanite off on two rocks; a rock floating 30 cm). For each I say which stage caused it and where I fix it at the source.", "uk": "Сортування збоїв пайплайну: тьютор називає чотири збої (дев'ять файлів FBX; сітка без колізії в Unreal; Nanite вимкнено на двох скелях; скеля, що висить на 30 см). Для кожного скажи, який етап це спричинив і де це виправити в джерелі."}, "video": {"search": "game art pipeline blender to unreal batch export import workflow"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Plan the run: a pipeline you can repeat (Day 80, lesson 1 of 4).\nToday's build: One pipeline run: SM_Rock_01 to SM_Rock_10 from seed to Unreal, checked at both ends, and placed as a breakwater on your island.\n\nBy the end of this lesson I can:\n1. Write a pipeline plan: each stage with its tool, its input and output, and the one thing you check before the next stage.\n2. Plan Bronze, Silver and Gold in minutes, as on every Boss day.\n3. Explain why a pipeline stops at the first failed check and fixes it at the source, instead of patching by hand in the middle.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (You have Blender scripts, export_kit.py, GN_PropVariants, and GN_Rocks with make_variants.py: seeds become real, clean meshes in seconds.), what I will learn today (You run the whole pipeline once, from seed to island, and prove it with a clean log and a clean checker report.), encourage me (Boss days reward calm order: one stage, one check, then the next; when a check fails, fixing it at the source is a win, not a setback.), and share today's quote: \"We choose to go to the Moon in this decade and do the other things, not because they are easy, but because they are hard.\" (John F. Kennedy).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 77: What does the base check in export_kit.py measure, and why does it allow 1 cm? | Day 73: What does place_from_csv.py print in its dry run, and what does it change in the level?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Pipeline triage: the tutor names four failures (nine FBX files; a mesh with no collision in Unreal; Nanite off on two rocks; a rock floating 30 cm). For each I say which stage caused it and where I fix it at the source.\n6. Do-along on today's build (The rock run, stage by stage (reviewed in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Write pipeline_plan.md with seven headings: Generate (make_variants.py), Dry run (export_kit.py), Export, Import (your checklist), Nanite (set_nanite.py), Check (check_assets.py), Place. Under each write its input and its output file or folder. You see a plan someone else could follow.\n   - Next to each stage write the one thing you look at before going on: ten collections; ten OK lines; ten FBX files; ten meshes with collision; Nanite ticked; a clean report; nothing floating. You see seven checks.\n   - Write your minutes per stage and the tiers: Bronze by hour 2, Silver by hour 3, Gold in hour 4. You see a timed plan.\n   - Tell the tutor which stage you think is weakest and why, and add one line: if a check fails, I fix the cause in its own stage and run again from there. You see a plan that says what happens when something goes wrong.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Generate and export, clean", "uk": "Генерація й експорт начисто"}, "minutes": 40, "goals": [{"en": "Run make_variants.py and export_kit.py in order, reading each one's output before the next step.", "uk": "Запускай make_variants.py і export_kit.py по черзі, читаючи вивід кожного перед наступним кроком."}, {"en": "Delete old variants safely before a fresh run.", "uk": "Безпечно видаляй старі варіанти перед новим прогоном."}, {"en": "Leave every script on its safe default (DRY_RUN = True) after the run.", "uk": "Лишай кожен скрипт на безпечному значенні за замовчуванням (DRY_RUN = True) після прогону."}], "doalong": [{"en": "Save gn_rocks.blend. In the Outliner Shift+click every collection under EXPORT (the old rocks and your pebbles; their seeds can make them again), right-click > Delete Hierarchy, then File > Clean Up > Purge Unused Data. You see EXPORT empty and Rock_GN untouched outside it.", "uk": "Збережи gn_rocks.blend. В Outliner клацни з Shift кожну колекцію під EXPORT (старі скелі та твої камінці; їх можна створити знову з їхніх зерен), клацни правою > Delete Hierarchy, потім File > Clean Up > Purge Unused Data. Ти бачиш порожній EXPORT і недоторканий Rock_GN поза ним."}, {"en": "Put Rock_GN back on its rock settings (Size 1.2, Roughness 0.25, Flatten 1), set NAME = 'SM_Rock' and COUNT = 10 in make_variants.py and run it. You see ten collections; Ctrl+click two eyes to compare two rocks, then show all again.", "uk": "Поверни Rock_GN до налаштувань скелі (Size 1.2, Roughness 0.25, Flatten 1), постав NAME = 'SM_Rock' і COUNT = 10 у make_variants.py і запусти його. Ти бачиш десять колекцій; клацни з Ctrl на двох очах, щоб порівняти дві скелі, потім покажи все знову."}, {"en": "Hide Rock_GN, dry-run export_kit.py and read the console. You see ten OK lines; a single SKIPPED line stops the run until its cause is fixed.", "uk": "Сховай Rock_GN, зроби пробний запуск export_kit.py і прочитай консоль. Ти бачиш десять рядків OK; один рядок SKIPPED зупиняє прогін, доки не виправлено його причину."}, {"en": "Set DRY_RUN = False, run, set it back to True and save the script and the .blend. You see ten FBX files with today's time in File Explorer's Date modified column.", "uk": "Постав DRY_RUN = False, запусти, поверни True і збережи скрипт та .blend. Ти бачиш десять файлів FBX із сьогоднішнім часом у колонці Date modified у File Explorer."}], "play": {"en": "Safe defaults: the tutor names five settings at the top of my scripts (DRY_RUN, COUNT, SEED, NAME, ROOT). For each I say what goes wrong if I leave it at a wrong value after today, and which default is safest.", "uk": "Безпечні значення за замовчуванням: тьютор називає п'ять налаштувань угорі твоїх скриптів (DRY_RUN, COUNT, SEED, NAME, ROOT). Для кожного скажи, що піде не так, якщо лишити його хибним після сьогодні, і яке значення за замовчуванням найбезпечніше."}, "video": {"search": "blender python batch export multiple fbx collections"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Generate and export, clean (Day 80, lesson 2 of 4).\nToday's build: One pipeline run: SM_Rock_01 to SM_Rock_10 from seed to Unreal, checked at both ends, and placed as a breakwater on your island.\nEarlier today I already did: lesson 1 (Plan the run: a pipeline you can repeat). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Run make_variants.py and export_kit.py in order, reading each one's output before the next step.\n2. Delete old variants safely before a fresh run.\n3. Leave every script on its safe default (DRY_RUN = True) after the run.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Safe defaults: the tutor names five settings at the top of my scripts (DRY_RUN, COUNT, SEED, NAME, ROOT). For each I say what goes wrong if I leave it at a wrong value after today, and which default is safest.\n4. Do-along on today's build (The rock run, stage by stage (reviewed in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Save gn_rocks.blend. In the Outliner Shift+click every collection under EXPORT (the old rocks and your pebbles; their seeds can make them again), right-click > Delete Hierarchy, then File > Clean Up > Purge Unused Data. You see EXPORT empty and Rock_GN untouched outside it.\n   - Put Rock_GN back on its rock settings (Size 1.2, Roughness 0.25, Flatten 1), set NAME = 'SM_Rock' and COUNT = 10 in make_variants.py and run it. You see ten collections; Ctrl+click two eyes to compare two rocks, then show all again.\n   - Hide Rock_GN, dry-run export_kit.py and read the console. You see ten OK lines; a single SKIPPED line stops the run until its cause is fixed.\n   - Set DRY_RUN = False, run, set it back to True and save the script and the .blend. You see ten FBX files with today's time in File Explorer's Date modified column.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Import, Nanite and the checker in Unreal", "uk": "Імпорт, Nanite і перевірка в Unreal"}, "minutes": 40, "goals": [{"en": "Import many FBX files at once with your checklist.", "uk": "Імпортуй багато файлів FBX одразу за своїм контрольним списком."}, {"en": "Swap an imported material for an M_Master instance in one step, and switch Nanite on in bulk with set_nanite.py.", "uk": "Заміни імпортований матеріал на інстанс M_Master за один крок і масово ввімкни Nanite через set_nanite.py."}, {"en": "Read check_assets.py's report and fix each problem at its source.", "uk": "Прочитай звіт check_assets.py і виправ кожну проблему в її джерелі."}], "doalong": [{"en": "In IslandCourse make Content/Tools/Day80/Rocks and drag the ten FBX files in. In the import window check your Day 6 settings once and click Import All. You see ten SM_Rock_ meshes and one M_Rock material.", "uk": "В IslandCourse створи Content/Tools/Day80/Rocks і перетягни туди десять файлів FBX. У вікні імпорту один раз перевір свої налаштування з Дня 6 і клацни Import All. Ти бачиш десять сіток SM_Rock_ і один матеріал M_Rock."}, {"en": "Make MI_Rock (right-click M_Master > Create Material Instance) with a rock colour from your photos. Save all (Ctrl+Shift+S): an asset delete can't be undone. Right-click M_Rock > Delete; in the window that opens choose Replace References and pick MI_Rock. You see all ten rocks take MI_Rock.", "uk": "Зроби MI_Rock (клацни правою на M_Master > Create Material Instance) із кольором скелі за твоїми фото. Збережи все (Ctrl+Shift+S): видалення асета не можна скасувати. Клацни правою на M_Rock > Delete; у вікні, що відкриється, вибери Replace References і обери MI_Rock. Ти бачиш, що всі десять скель беруть MI_Rock."}, {"en": "Set FOLDER = '/Game/Tools/Day80/Rocks' in set_nanite.py and run it: the dry run, then Yes. You see ten names in the dry run, then Nanite ticked in each mesh's Details.", "uk": "Постав FOLDER = '/Game/Tools/Day80/Rocks' у set_nanite.py і запусти його: пробний запуск, потім Yes. Ти бачиш десять імен у пробному запуску, потім Nanite позначено в Details кожної сітки."}, {"en": "Set the same FOLDER in check_assets.py and run it as on Day 74. You see asset_report.md in IslandCourse/Saved/TechTools; copy it into today's Work folder as check_report_day80.md.", "uk": "Постав той самий FOLDER у check_assets.py і запусти його, як на Дні 74. Ти бачиш asset_report.md в IslandCourse/Saved/TechTools; скопіюй його в папку Work за сьогодні як check_report_day80.md."}], "play": {"en": "Report reading: the tutor shows me a check_assets.py report with five findings (a texture over 2048, a mesh without collision, a name without SM_, Nanite off, a mesh 100 times too big). For each I name the stage and the file I would fix.", "uk": "Читання звіту: тьютор показує мені звіт check_assets.py із п'ятьма знахідками (текстура понад 2048, сітка без колізії, ім'я без SM_, Nanite вимкнено, сітка у 100 разів завелика). Для кожної назви етап і файл, який ти виправиш."}, "video": {"search": "unreal engine 5 import multiple fbx nanite bulk python editor"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Import, Nanite and the checker in Unreal (Day 80, lesson 3 of 4).\nToday's build: One pipeline run: SM_Rock_01 to SM_Rock_10 fr _nanite.py and run it: the dry run, then Yes. You see ten names in the dry run, then Nanite ticked in each mesh's Details.\n   - Set the same FOLDER in check_assets.py and run it as on Day 74. You see asset_report.md in IslandCourse/Saved/TechTools; copy it into today's Work folder as check_report_day80.md.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Rocks that look placed by nature", "uk": "Скелі, що виглядають так, наче їх розставила природа"}, "minutes": 40, "goals": [{"en": "Compose a rock group like a real breakwater: big rocks low and outside, medium ones on top, small ones in the gaps.", "uk": "Склади групу скель, як справжній хвилеріз: великі скелі низько й ззовні, середні зверху, дрібні в проміжках."}, {"en": "Ground every rock: no floating, a little sunk where the ground is uneven.", "uk": "Заземли кожну скелю: жодного висіння, трохи занурена там, де земля нерівна."}, {"en": "Hide repeats: turn and scale each copy, so ten meshes read as many.", "uk": "Ховай повтори: повертай і масштабуй кожну копію, щоб десять сіток читалися як багато."}], "doalong": [{"en": "In L_Day80 place the ten rocks in a row beside the mannequin and press End on each. You see ten different stones at believable sizes.", "uk": "В L_Day80 розстав десять скель у ряд поруч із манекеном і натисни End на кожній. Ти бачиш десять різних каменів правдоподібних розмірів."}, {"en": "Open L_Island at the waterfront and load only that region. Place the three biggest rocks along the water's edge, each sunk by about a tenth of its height with the blue arrow. You see a heavy base row.", "uk": "Відкрий L_Island на набережній і завантаж лише той регіон. Розстав три найбільші скелі вздовж краю води, кожну занури приблизно на десяту частину її висоти синьою стрілкою. Ти бачиш важкий нижній ряд."}, {"en": "Alt+drag copies along the line: medium rocks on top and between, small ones filling the gaps; turn each copy (E) and scale it 0.8 to 1.2. You see a breakwater with no straight rows and no twins side by side.", "uk": "Копіюй Alt+перетягуванням уздовж лінії: середні скелі зверху й між ними, дрібні заповнюють проміжки; повертай кожну копію (E) і масштабуй її від 0.8 до 1.2. Ти бачиш хвилеріз без прямих рядів і без двійнят поруч."}, {"en": "Fly to 30 m, then to 2 m along the base. You see one shape from above and solid contact at the bottom; move any rock that floats.", "uk": "Підлітай до 30 м, потім до 2 м уздовж основи. Ти бачиш одну форму зверху й міцний контакт унизу; пересунь будь-яку скелю, що висить."}], "play": {"en": "Spot the repeat: the tutor describes three rock groups (ten identical rocks in a line; big rocks on top of small ones; two neighbours showing the same face). For each I say what gives it away and the one change that fixes it.", "uk": "Знайди повтор: тьютор описує три групи скель (десять однакових скель в одну лінію; великі скелі поверх малих; двоє сусідів показують ту саму грань). Для кожної скажи, що її видає, і одну зміну, що це виправляє."}, "video": {"search": "unreal engine 5 placing rocks naturally breakwater composition level design"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcu ge by stage (reviewed in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - In L_Day80 place the ten rocks in a row beside the mannequin and press End on each. You see ten different stones at believable sizes.\n   - Open L_Island at the waterfront and load only that region. Place the three biggest rocks along the water's edge, each sunk by about a tenth of its height with the blue arrow. You see a heavy base row.\n   - Alt+drag copies along the line: medium rocks on top and between, small ones filling the gaps; turn each copy (E) and scale it 0.8 to 1.2. You see a breakwater with no straight rows and no twins side by side.\n   - Fly to 30 m, then to 2 m along the base. You see one shape from above and solid contact at the bottom; move any rock that floats.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "pipeline_plan.md (planned and real minutes) and pipeline_notes.md", "uk": "pipeline_plan.md (заплановані й справжні хвилини) та pipeline_notes.md"}, {"en": "export_log.md (ten OK lines) and check_report_day80.md (clean)", "uk": "export_log.md (десять рядків OK) і check_report_day80.md (чистий)"}, {"en": "breakwater_30m.png and breakwater_2m.png", "uk": "breakwater_30m.png і breakwater_2m.png"}, {"en": "Your tool-review notes for make_variants.py and export_kit.py", "uk": "Твої нотатки перевірки інструментів для make_variants.py та export_kit.py"}, {"en": "clip_day80.mp4 (60 seconds: from seeds to the breakwater)", "uk": "clip_day80.mp4 (60 секунд: від зерен до хвилерізу)"}, {"en": "summary.md", "uk": "звіт дня (summary.md)"}], "goal": {"en": "By the end of today you have run your whole pipeline once from start to end: ten rock variants generated by make_variants.py, exported by export_kit.py, imported into Unreal, switched to Nanite in bulk, passed by check_assets.py, and placed as a breakwater on your island.", "uk": "До кінця сьогодні ти один раз проганяєш увесь свій пайплайн від початку до кінця: десять варіантів скель, згенерованих make_variants.py, експортованих export_kit.py, імпортованих в Unreal, масово переведених на Nanite, перевірених check_assets.py і розставлених як хвилеріз на твоєму острові."}, "uses": [{"en": "Day 79: GN_Rocks and make_variants.py", "uk": "День 79: GN_Rocks і make_variants.py"}, {"en": "Day 78: GN_PropVariants, for Gold's second family", "uk": "День 78: GN_PropVariants, для другої родини Золота"}, {"en": "Day 77: export_kit.py and export_log.md", "uk": "День 77: export_kit.py і export_log.md"}, {"en": "Day 72: set_nanite.py, your bulk Nanite tool", "uk": "День 72: set_nanite.py, твій інструмент масового Nanite"}, {"en": "Day 74: check_assets.py and its asset_report.md", "uk": "День 74: check_assets.py і його asset_report.md"}, {"en": "Day 6: your import checklist", "uk": "День 6: твій контрольний список імпорту"}], "quiz": [{"q": {"en": "Where does print write when you run a script in Blender on Windows?", "uk": "Куди пише print, коли ти запускаєш скрипт у Blender на Windows?"}, "options": [{"en": "The Info editor", "uk": "В Info editor"}, {"en": "The 3D viewport", "uk": "У 3D-вікно"}, {"en": "The system console (Window > Toggle System Console)", "uk": "У системну консоль (Window > Toggle System Console)"}, {"en": "Only the Python Console", "uk": "Лише в Python Console"}], "answer": 2, "explain": {"en": "Blender sends print to its system console window, which you open from the Window menu.", "uk": "Blender надсилає print у вікно системної консолі, яке відкривається з меню Window."}}, {"q": {"en": "apply_transforms.py runs with DRY_RUN = True. What happens to the objects?", "uk": "apply_transforms.py запускається з DRY_RUN = True. Що станеться з об'єктами?"}, "options": [{"en": "Nothing: it only prints what it would change", "uk": "Нічого: він лише друкує, що змінив би"}, {"en": "Their scale is applied", "uk": "Їхній масштаб застосовується"}, {"en": "They are selected", "uk": "Їх виділяє"}, {"en": "They are renamed", "uk": "Їх перейменовує"}], "answer": 0, "explain": {"en": "A dry run reports and changes nothing, so you read the list before anything happens.", "uk": "Пробний запуск звітує й нічого не змінює, тож ти читаєш список до того, як щось станеться."}}, {"q": {"en": "export_kit.py logs SM_Rock_07: SKIPPED: no UCX_ box. Where do you fix it?", "uk": "export_kit.py записує SM_Rock_07: SKIPPED: no UCX_ box. Де це виправити?"}, "options": [{"en": "In Unreal, by adding collision by hand", "uk": "В Unreal, додавши колізію вручну"}, {"en": "In add_ucx() or the loop of make_variants.py, then run the stages again", "uk": "В add_ucx() або в циклі make_variants.py, потім запустити етапи знову"}, {"en": "By setting DRY_RUN to False", "uk": "Поставивши DRY_RUN на False"}, {"en": "By renaming the FBX file", "uk": "Перейменувавши файл FBX"}], "answer": 1, "explain": {"en": "The cause is in the stage that makes the boxes; fixing it there fixes every future run too.", "uk": "Причина в етапі, що робить коробки; виправлення там виправляє й кожен майбутній прогін."}}, {"q": {"en": "Why must a prop's origin be at its base when it is exported?", "uk": "Чому початок координат пропса має бути на його основі під час експорту?"}, "options": [{"en": "So Nanite works", "uk": "Щоб працював Nanite"}, {"en": "So the UVs are right", "uk": "Щоб UV були правильні"}, {"en": "So the file is smaller", "uk": "Щоб файл був меншим"}, {"en": "So it stands on the ground when you drop it with End in Unreal", "uk": "Щоб він стояв на землі, коли ти опускаєш його клавішею End в Unreal"}], "answer": 3, "explain": {"en": "End drops the origin onto the surface below, so an origin at the base puts the prop on the ground.", "uk": "End опускає початок координат на поверхню внизу, тож початок координат на основі ставить проп на землю."}}, {"q": {"en": "In GN_PropVariants, how wide is the cutter of a 1.2 m planter with 5 cm walls?", "uk": "У GN_PropVariants, якої ширини різак вазона 1.2 м зі стінками 5 см?"}, "options": [{"en": "1.25 m", "uk": "1.25 м"}, {"en": "1.1 m", "uk": "1.1 м"}, {"en": "1.15 m", "uk": "1.15 м"}, {"en": "1.2 m", "uk": "1.2 м"}], "answer": 1, "explain": {"en": "The cutter is Width minus 2 x Wall: 1.2 - 0.1 = 1.1 m.", "uk": "Різак має Width мінус 2 x Wall: 1.2 - 0.1 = 1.1 м."}}, {"q": {"en": "Ten seeds gave ten identical rocks. What do you check first?", "uk": "Десять зерен дали десять однакових скель. Що перевіряєш першим?"}, "options": [{"en": "The SEED id in make_variants.py against Copy Data Path", "uk": "id SEED у make_variants.py порівняти з Copy Data Path"}, {"en": "The FBX settings", "uk": "Налаштування FBX"}, {"en": "The material", "uk": "Матеріал"}, {"en": "The Nanite tool", "uk": "Інструмент Nanite"}], "answer": 0, "explain": {"en": "If the script sets the wrong input, the seed never changes and every rock is the same.", "uk": "Якщо скрипт задає не той вхід, зерно ніколи не змінюється, і кожна скеля однакова."}}, {"q": {"en": "Your rock group looks fake from 30 m. Which change helps most?", "uk": "Твоя група скель з 30 м виглядає фальшиво. Яка зміна допомагає найбільше?"}, "options": [{"en": "More triangles per rock", "uk": "Більше трикутників на скелю"}, {"en": "All rocks the same size", "uk": "Усі скелі однакового розміру"}, {"en": "Big rocks low and outside, small ones filling, every copy turned differently", "uk": "Великі скелі низько й ззовні, дрібні заповнюють, кожна копія повернута по-різному"}, {"en": "A brighter material", "uk": "Яскравіший матеріал"}], "answer": 2, "explain": {"en": "Real breakwaters have a clear structure and no repeated faces side by side; detail matters less from the air.", "uk": "Справжні хвилерізи мають чітку структуру й не мають повторюваних граней поруч; деталі менш важливі з повітря."}}, {"q": {"en": "Why delete the old SM_Rock_ collections before a fresh run?", "uk": "Чому перед новим прогоном видаляють старі колекції SM_Rock_?"}, "options": [{"en": "make_variants.py skips names that already exist, so old rocks would stay unchanged", "uk": "make_variants.py пропускає імена, що вже існують, тож старі скелі лишилися б без змін"}, {"en": "Blender can hold only ten collections", "uk": "Blender може тримати лише десять колекцій"}, {"en": "export_kit.py exports only new files", "uk": "export_kit.py експортує лише нові файли"}, {"en": "Deleting makes the run faster", "uk": "Видалення робить прогін швидшим"}], "answer": 0, "explain": {"en": "The skip rule keeps reruns safe, but it also means changed settings only reach new names.", "uk": "Правило пропуску робить повторні прогони безпечними, але воно ж означає, що змінені налаштування доходять лише до нових імен."}}], "weekInfo": null, "morning": {"sofar": {"en": "You have Blender scripts, export_kit.py, GN_PropVariants, and GN_Rocks with make_variants.py: seeds become real, clean meshes in seconds.", "uk": "Ти маєш скрипти Blender, export_kit.py, GN_PropVariants і GN_Rocks з make_variants.py: зерна за секунди стають справжніми чистими сітками."}, "today": {"en": "You run the whole pipeline once, from seed to island, and prove it with a clean log and a clean checker report.", "uk": "Ти один раз проганяєш увесь пайплайн, від зерна до острова, і доводиш це чистим логом і чистим звітом перевірки."}, "cheer": {"en": "Boss days reward calm order: one stage, one check, then the next; when a check fails, fixing it at the source is a win, not a setback.", "uk": "Дні боса винагороджують спокійний порядок: один етап, одна перевірка, потім наступний; коли перевірка не проходить, виправлення в джерелі — це перемога, а не невдача."}, "quote": {"text": {"en": "We choose to go to the Moon in this decade and do the other things, not because they are easy, but because they are hard.", "uk": "Ми обираємо полетіти на Місяць у це десятиліття та робити інші речі не тому, що це легко, а тому, що це важко."}, "author": {"en": "John F. Kennedy", "uk": "Джон Ф. Кеннеді"}, "source": "Address at Rice University, Houston, 12 September 1962"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-80-boss-rock-pipeline", "mapHref": "../../COURSE.html", "prevHref": "../Day-79-geometry-nodes-rocks-batch/START-HERE.html", "nextHref": "../Day-81-pcg-attributes-street-base/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Blender 5.x and Unreal Engine 5.8. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me: when my Blueprint or script fails, ask for the error message or a screenshot of the graph, point to the line or node that is wrong and explain why, then let me fix it myself. Never write the whole tool for me. Keep me moving and make it feel like a game.\n\nToday I build on my own: Placing the rocks well on your island, and Gold's second family.\nIt's part of: One pipeline run: SM_Rock_01 to SM_Rock_10 from seed to Unreal, checked at both ends, and placed as a breakwater on your island (TechArt/Blender/gn_rocks.blend and its exports; in IslandCourse, Content/Tools/Day80/Rocks, the practice level Content/Tools/Day80/L_Day80, then the waterfront of L_Island.).\n\nSpec:\n- pipeline_plan.md first: the seven stages in order (generate, dry run, export, import, Nanite, check, place), each with its tool, its input and output, what you look at before going on, and your minutes; tiers and minute plan.\n- SM_Rock_01 to SM_Rock_10 generated fresh (old collections deleted first) and exported; export_log.md from the real run with ten OK lines.\n- The ten FBX files imported into Content/Tools/Day80/Rocks in one drag with your import checklist; the imported M_Rock replaced by MI_Rock, an M_Master instance coloured from your photos.\n- Nanite switched on for all ten with set_nanite.py (FOLDER = '/Game/Tools/Day80/Rocks', dry run first), and check_assets.py's asset_report.md for the same folder clean, or each remaining finding explained in pipeline_notes.md.\n- L_Day80: the ten rocks in a row beside the mannequin, all grounded; then a breakwater or rock group of 25 or more copies on your island's waterfront: big rocks low and on the sea side, smaller ones on top and in the gaps, every copy turned differently, none floating.\n- Bronze: the run done and the report clean. Silver: the breakwater on the island and pipeline_plan.md with real times. Gold: a second family (your pebbles or three planters) through the same run, timed under 15 minutes.\n\nMy checklist:\n1. Start a 4-hour timer. Write pipeline_plan.md: the seven stages in order, each with its tool, what you expect to see and your minutes; Bronze by hour 2, Silver by hour 3, Gold in hour 4. Check: the plan names every stage, its tool and its check. (from lesson 1)\n2. In gn_rocks.blend delete every collection in EXPORT (old rocks and pebbles) and purge unused data, put Rock_GN back on its rock settings (Size 1.2, Roughness 0.25, Flatten 1), set COUNT = 10 and NAME = 'SM_Rock' and run make_variants.py. Check: ten new collections in EXPORT, each with one rock and one UCX box. (from lesson 2)\n3. Dry-run export_kit.py, then run it for real and set DRY_RUN back to True. Check: export_log.md says exported and lists ten OK lines, and exports holds ten SM_Rock_ files with today's time. (from lesson 2)\n4. In IslandCourse make Content/Tools/Day80/Rocks, drag all ten FBX files in, check your import settings once and click Import All. Check: ten static meshes, each showing its box under Show > Simple Collision in the Static Mesh Editor. (from lesson 3)\n5. Make MI_Rock from M_Master with a colour and roughness from your photos, save all, then right-click the imported M_Rock > Delete and choose Replace References with MI_Rock. Check: all ten rocks show MI_Rock in their material slot. (from lesson 3)\n6. Set FOLDER = '/Game/Tools/Day80/Rocks' in set_nanite.py (Day 72) and run it: the dry run first, then Yes in its dialog (or the Nanite button of EUW_TechTools). Check: the dry run lists ten meshes, and afterwards each mesh's Details shows Nanite enabled. (from lesson 3)\n7. Bronze check: set FOLDER = '/Game/Tools/Day80/Rocks' in check_assets.py and run it; copy Saved/TechTools/asset_report.md into today's Work folder as check_report_day80.md. If it shows a problem, fix it at the source (node group, script or import setting), run the stages again, and write why in pipeline_notes.md. Check: the report lists ten meshes and no problems. (from lesson 3)\n8. Make L_Day80 in Content/Tools/Day80, place the ten rocks in a row beside the mannequin and press End on each. Check: ten different rocks, all on the floor, believable in size beside the mannequin. (from lesson 4)\n9. Open L_Island at your waterfront and build a breakwater or rock group from 25 or more copies: the biggest rocks low on the sea side and sunk by about a tenth of their height, medium ones on top, small ones filling the gaps, each copy turned and scaled 0.8 to 1.2. Check: from 30 m up it reads as one built shape with no straight rows, and at 2 m no rock floats. (from lesson 4)\n10. Silver check: write the real minutes beside the planned ones in pipeline_plan.md and take breakwater_30m.png and breakwater_2m.png. Check: both pictures are in today's Work folder and the plan shows planned and real times side by side. (from lesson 1)\n11. Gold: send a second family (SM_Pebble_01 to _05 made again with your pebble settings, or three planters from gn_props.blend) through the same stages, timing the whole run from the first script to the clean report. Check: a second clean check_assets.py report, and the run under 15 minutes written in pipeline_notes.md. (from lesson 2)\n12. Self-review with tool-review-checklist.md and the tutor for make_variants.py and export_kit.py: names, comments, safe defaults, readable errors. Fix the worst no first. Check: every line has a yes or a no, and the worst one is fixed. (from lesson 1)\n13. Record clip_day80.mp4 (60 seconds): the script making the rocks, the export log, the import and the breakwater from the air. Click Copy the day report, paste it into a new tutor chat and save its answer as summary.md. Check: the clip and summary.md are in today's Work folder. (from lesson 4)\n\nToday is a BOSS build: help me keep time against the tiers below. Tiers:\n- Bronze: ten rocks generated, exported with a clean log, imported, switched to Nanite, and check_assets.py's report clean.\n- Silver: Bronze, plus a breakwater of 25 or more copies on your island that reads as one shape from 30 m with nothing floating, and pipeline_plan.md with real times.\n- Gold: Silver, plus a second family through the same run with a second clean report, and the whole run timed under 15 minutes.\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me and tell me which tier I reached.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Misha\nDay 80: Boss: the rock pipeline, from seed to island in one run. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; boss tier: <bronze / silver / gold / none>; quiz: <score> of 8\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p><div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+list(D.handin,'ul','ticks')+'<p class="path">'+ic('folder')+'<span>'+u('shipTo')+' <code>'+esc(D.workPath)+'</code></span></p>'+(D.lessons.length?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<p class="muted">'+u('report')+'</p><div class="row"><button class="btn s" onclick="cp(D.reportPrompt)">'+ic('copy')+u('copyR')+'</button></div></section>';
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();

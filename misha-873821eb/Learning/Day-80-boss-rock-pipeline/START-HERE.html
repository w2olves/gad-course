<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 80</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

 on.", "uk": "pipeline_plan.md: час початку, потім сім етапів по порядку (генерація, пробний запуск, експорт, імпорт, Nanite, перевірка, розстановка). Для кожного — інструмент і одна річ, яку перевіряєш, перш ніж іти далі."}, {"en": "SM_Rock_01 to SM_Rock_10 generated fresh (old collections deleted first) and exported; export_log.md from the real run with ten OK lines.", "uk": "SM_Rock_01–SM_Rock_10 згенеровано заново (старі колекції спершу видалено) й експортовано. export_log.md зі справжнього запуску має десять рядків OK."}, {"en": "The ten FBX files imported into Content/Tools/Day80/Rocks in one drag with your import checklist; the imported M_Rock replaced by MI_Rock, an M_Master instance coloured from your photos.", "uk": "Десять FBX імпортовано в Content/Tools/Day80/Rocks одним перетягуванням за чек-листом імпорту. Імпортований M_Rock замінено на MI_Rock — інстанс M_Master з кольором за твоїми фото."}, {"en": "Nanite switched on for all ten with set_nanite.py (FOLDER = '/Game/Tools/Day80/Rocks', dry run first), and check_assets.py's asset_report.md for the same folder clean, or each remaining finding explained in pipeline_plan.md.", "uk": "Nanite ввімкнено на всіх десяти скриптом set_nanite.py (FOLDER = '/Game/Tools/Day80/Rocks', спершу пробний запуск). asset_report.md від check_assets.py для цієї папки чистий, або кожну знахідку пояснено в pipeline_plan.md."}, {"en": "L_Day80: the ten rocks in a row beside the mannequin, all grounded; then a breakwater or rock group of 25 or more copies on your island's waterfront: big rocks low and on the sea side, smaller ones on top and in the gaps, every copy turned differently, none floating.", "uk": "L_Day80: десять скель у ряд поруч із манекеном, усі на землі. Потім хвилеріз або група з 25 і більше копій на набережній острова: великі скелі внизу й з боку моря, менші зверху й у проміжках, кожна копія повернута по-своєму, жодна не висить."}, {"en": "Bronze: the run done and the report clean. Silver: the breakwater on the island and pipeline_plan.md with real times. Gold: a second family (your pebbles or three planters) through the same run, timed under 15 minutes.", "uk": "Бронза: прохід зроблено, звіт чистий. Срібло: хвилеріз на острові й pipeline_plan.md зі справжніми хвилинами. Золото: друга родина (твої камінці або три вазони) тим самим проходом менш ніж за 15 хв."}], "piece1": "The rock run, stage by stage (reviewed in the lessons)", "piece2": {"en": "Placing the rocks well on your island, and Gold's second family", "uk": "Як добре розставити скелі на острові, і друга родина для Золота"}, "steps": [{"text": {"en": "Check: the results of today's lessons are there (pipeline_plan.md from lesson 2. If lessons 1, 3 and 4 already ran the stages, steps 2 to 8 below are only their checks: tick each one and move on). Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it. Start the clock: Bronze by hour 2, the full build by about 3.5 hours. Write the start time at the top of pipeline_plan.md. Check: the start time is written.", "uk": "Спершу переконайся, що результати сьогоднішніх уроків на місці: pipeline_plan.md з уроку 2. Якщо уроки 1, 3 і 4 уже пройшли етапи, кроки 2–8 нижче — лише їхні перевірки: позначай кожну й іди далі. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Запусти таймер: Бронза за 2 години, уся робота — приблизно за 3 години 30 хвилин. Запиши час початку на початку pipeline_plan.md. Перевірка: час початку записано."}, "lesson": 2}, {"text": {"en": "In gn_rocks.blend delete every collection in EXPORT (old rocks and pebbles) and purge unused data, put Rock_GN back on its rock settings (Size 1.2, Roughness 0.25, Flatten 1), set COUNT = 10 and NAME = 'SM_Rock' and run make_variants.py. Check: ten new collections in EXPORT, each with one rock and one UCX box.", "uk": "У gn_rocks.blend видали кожну колекцію в EXPORT (старі скелі й камінці) і очисть невикористані дані (Purge). Поверни Rock_GN налаштування скелі (Size 1.2, Roughness 0.25, Flatten 1), встанови COUNT = 10 і NAME = 'SM_Rock' і запусти make_variants.py. Перевірка: в EXPORT десять нових колекцій, у кожній одна скеля й один блок UCX."}, "lesson": 1}, {"text": {"en": "Dry-run export_kit.py, then run it for real and set DRY_RUN back to True. Check: export_log.md says exported and lists ten OK lines, and exports holds ten SM_Rock_ files with today's time, each over 10 KB.", "uk": "Зроби пробний запуск export_kit.py, потім справжній, і поверни DRY_RUN = True. Перевірка: export_log.md пише exported і має десять рядків OK, а в exports десять файлів SM_Rock_ із сьогоднішнім часом, кожен більший за 10 КБ."}, "lesson": 1}, {"text": {"en": "In IslandCourse make Content/Tools/Day80/Rocks, drag all ten FBX files in, check your import settings once and click Import All. Check: ten static meshes, each showing its box under Show > Simple Collision in the Static Mesh Editor.", "uk": "В IslandCourse створи Content/Tools/Day80/Rocks, перетягни туди всі десять FBX, один раз перевір налаштування імпорту й клацни Import All. Перевірка: десять static mesh, і кожен показує свій блок у режимі Show > Simple Collision у Static Mesh Editor."}, "lesson": 3}, {"text": {"en": "Make MI_Rock from M_Master with a rock colour and roughness you like, save all, then right-click the imported M_Rock > Delete and choose Replace References with MI_Rock. Check: all ten rocks show MI_Rock in their material slot.", "uk": "Зроби MI_Rock з M_Master з кольором і Roughness скелі на свій смак. Збережи все. Потім клацни правою кнопкою на імпортованому M_Rock > Delete і вибери Replace References з MI_Rock. Перевірка: усі десять скель мають MI_Rock у слоті матеріалу."}, "lesson": 3}, {"text": {"en": "Set FOLDER = '/Game/Tools/Day80/Rocks' in set_nanite.py (Day 72) and run it: the dry run first, then Yes in its dialog (or the Nanite button of EUW_TechTools). Check: the dry run lists ten meshes, and afterwards each mesh's Details shows Nanite enabled.", "uk": "Встанови FOLDER = '/Game/Tools/Day80/Rocks' у set_nanite.py (День 72) і запусти: спершу пробний запуск, потім Yes у діалозі. Або клацни кнопку Nanite в EUW_TechTools. Перевірка: пробний запуск перелічує десять мешів, а потім у Details кожного Nanite ввімкнено."}, "lesson": 3}, {"text": {"en": "Bronze check: set FOLDER = '/Game/Tools/Day80/Rocks' in check_assets.py and run it; copy Saved/TechTools/asset_report.md into today's Work folder as check_report_day80.md. If it shows a problem, fix it at the source (node group, script or import setting), run the stages again, and write why in pipeline_plan.md. Check: the report lists ten meshes and no problems.", "uk": "Перевірка для Бронзи: встанови FOLDER = '/Game/Tools/Day80/Rocks' у check_assets.py і запусти. Скопіюй Saved/TechTools/asset_report.md у робочу папку дня як check_report_day80.md. Якщо є проблема, виправ її в джерелі (група вузлів, скрипт або налаштування імпорту), пройди етапи знову й запиши причину в pipeline_plan.md. Перевірка: звіт перелічує десять мешів і жодної проблеми."}, "lesson": 3}, {"text": {"en": "Make L_Day80 in Content/Tools/Day80, place the ten rocks in a row beside the mannequin and press End on each (or right-click > Snap/Align > Snap to Floor). Save the level (Ctrl+S), open any other level and open L_Day80 again. Check: ten different rocks, all on the floor, believable in size beside the mannequin.", "uk": "Створи L_Day80 у Content/Tools/Day80, постав десять скель у ряд поруч із манекеном і натисни End на кожній (або правою кнопкою > Snap/Align > Snap to Floor). Збережи рівень (Ctrl+S), відкрий будь-який інший рівень, а тоді знову L_Day80. Перевірка: десять різних скель, усі на підлозі, правдоподібного розміру поруч із манекеном."}, "lesson": 4}, {"text": {"en": "Open L_Island at your waterfront and build a breakwater or rock group from 25 or more copies: the biggest rocks low on the sea side and sunk by about a tenth of their height, medium ones on top, small ones filling the gaps, each copy turned and scaled 0.8 to 1.2. Save L_Island. Check: from 30 m up it reads as one built shape with no straight rows, and at 2 m no rock floats. Silver check: write the time you reached Silver in pipeline_plan.md and take breakwater_30m.png and breakwater_2m.png. Check: both pictures are in today's Work folder and the time is written.", "uk": "Відкрий L_Island біля набережної й збудуй хвилеріз або групу скель із 25 і більше копій. Найбільші — внизу з боку моря, занурені приблизно на десяту частину висоти. Середні — зверху, дрібні — у проміжках. Кожну копію поверни й масштабуй від 0.8 до 1.2. Збережи L_Island. Перевірка: з 30 м видно одну зведену форму без прямих рядів, а з 2 м жодна скеля не висить. Перевірка для Срібла: запиши в pipeline_plan.md час, коли здобуто Срібло, і зроби скриншоти breakwater_30m.png і breakwater_2m.png. Перевірка: обидва зображення в робочій папці дня, а час записано."}, "lesson": 4}, {"text": {"en": "Gold: send a second family (SM_Pebble_01 to _05 made again with your pebble settings, or three planters from gn_props.blend) through the same stages, timing the whole run from the first script to the clean report. Check: a second clean check_assets.py report, and the run under 15 minutes written in pipeline_plan.md.", "uk": "Золото: проведи другу родину тими самими етапами — SM_Pebble_01–_05, зроблені знову з налаштуваннями камінців, або три вазони з gn_props.blend. Засічи весь прохід від першого скрипта до чистого звіту. Перевірка: другий чистий звіт check_assets.py, а в pipeline_plan.md записано прохід менш ніж за 15 хв."}, "lesson": 1}, {"text": {"en": "Back up: zip Content/Tools and Content/Python to a folder outside the project. Check: the zip is over 1 MB. (The build coach's end check covers your review; there is no form to fill.) Record clip_day80.mp4 (the script making the rocks, the export log, the import and the breakwater from the air; 60 seconds, under 50 MB) with OBS Studio (Display Capture) or Win+Shift+R (Snipping Tool, select the whole screen). Check: the clip is in today's Work folder and under 50 MB.", "uk": "Зроби копію: запакуй Content/Tools і Content/Python у zip у папку поза проєктом. Перевірка: zip більший за 1 МБ. Огляд робить фінальна перевірка тьютора-помічника, тож жодної форми заповнювати не треба. Запиши clip_day80.mp4: скрипт робить скелі, журнал експорту, імпорт і хвилеріз згори; 60 с, менше 50 МБ. Пиши в OBS Studio (Display Capture) або клавішами Win+Shift+R (Ножиці (Snipping Tool), виділи весь екран). Перевірка: кліп у робочій папці дня і менший за 50 МБ."}, "lesson": 2}, {"text": {"en": "Click Copy the day report, paste it into a new tutor chat, answer its questions and save its answer as summary.md in today's Work folder. Drag the files listed under What you hand in into today's hand-in folder (the button on this page); no need to hand in the Unreal project or level folders (they're very big). Check: the hand-in folder lists all the files, each over 1 KB.", "uk": "Клацни «Копіювати звіт дня», встав текст у новий чат із тьютором, дай відповіді на його запитання й збережи відповідь як summary.md у робочій папці дня. Здай роботу: перетягни файли зі списку «Що здати» в сьогоднішню папку здачі (кнопка на цій сторінці). Папку проєкту чи рівня Unreal здавати не треба: вона дуже велика. Перевірка: у папці здачі всі файли, кожен більший за 1 КБ."}, "lesson": 4}], "boss": [{"en": "Bronze: ten rocks generated, exported with a clean log, imported, switched to Nanite, and check_assets.py's report clean.", "uk": "Бронза: десять скель згенеровано, експортовано з чистим журналом, імпортовано, переведено на Nanite, а звіт check_assets.py чистий."}, {"en": "Silver: Bronze, plus a breakwater of 25 or more copies on your island that reads as one shape from 30 m with nothing floating, and the time you reached Silver in pipeline_plan.md.", "uk": "Срібло: усе для Бронзи, а ще хвилеріз із 25 і більше копій на острові, що з 30 м виглядає як одна форма й де ніщо не висить, і час, коли здобуто Срібло, у pipeline_plan.md."}, {"en": "Gold: Silver, plus a second family through the same run with a second clean report, and the whole run timed under 15 minutes.", "uk": "Золото: Срібло плюс друга родина тим самим проходом із другим чистим звітом, а весь прохід засічено менш ніж за 15 хв."}], "assets": ["techart/tool-review-checklist.md", "techart/standards-sheet.md"], "next": {"en": "Your rocks dress the shore of your district on Day 104, and on Day 107 the same check-at-both-ends habit is your final validation.", "uk": "У День 104 твої скелі оформлять берег твого району, а в День 107 та сама звичка перевіряти з обох кінців стане твоєю фінальною перевіркою."}}, "lessons": [{"title": {"en": "Generate and export, clean", "uk": "Генерація й експорт начисто"}, "minutes": 40, "goals": [{"en": "Run make_variants.py and export_kit.py in order, reading each one's output before the next step.", "uk": "Запускати make_variants.py і export_kit.py по черзі й читати вивід кожного перед наступним кроком."}, {"en": "Delete old variants safely before a fresh run.", "uk": "Безпечно видаляти старі варіанти перед новим проходом."}, {"en": "Leave every script on its safe default (DRY_RUN = True) after the run.", "uk": "Лишати кожен скрипт після проходу з безпечним типовим значенням (DRY_RUN = True)."}], "doalong": [{"en": "Save gn_rocks.blend. In the Outliner Shift+click every collection under EXPORT (the old rocks and your pebbles; their seeds can make them again), right-click > Delete Hierarchy, then File > Clean Up > Purge Unused Data. You see EXPORT empty and Rock_GN untouched outside it.", "uk": "Збережи gn_rocks.blend. В Outliner з Shift клацни кожну колекцію під EXPORT: старі скелі й камінці можна створити знову з їхніх зерен. Клацни правою кнопкою > Delete Hierarchy, потім File > Clean Up > Purge Unused Data. EXPORT порожній, а Rock_GN поза ним не зачеплено."}, {"en": "Put Rock_GN back on its rock settings (Size 1.2, Roughness 0.25, Flatten 1), set NAME = 'SM_Rock' and COUNT = 10 in make_variants.py and run it. You see ten collections; Ctrl+click two eyes to compare two rocks, then show all again.", "uk": "Поверни Rock_GN налаштування скелі (Size 1.2, Roughness 0.25, Flatten 1), встанови NAME = 'SM_Rock' і COUNT = 10 у make_variants.py і запусти. З'являються десять колекцій. Ctrl+клацання на двох очах порівнює дві скелі; потім знову покажи всі."}, {"en": "Hide Rock_GN, dry-run export_kit.py and read the console. You see ten OK lines; a single SKIPPED line stops the run until its cause is fixed.", "uk": "Сховай Rock_GN, зроби пробний запуск export_kit.py і прочитай консоль. Має вийти десять рядків OK. Один рядок SKIPPED зупиняє прохід, доки його причину не виправлено."}, {"en": "Set DRY_RUN = False, run, set it back to True and save the script and the .blend. You see ten FBX files with today's time in File Explorer's Date modified column.", "uk": "Встанови DRY_RUN = False, запусти, поверни True і збережи скрипт і .blend. У Провіднику в стовпці «Дата змінення» (Date modified) у десяти FBX сьогоднішній час."}], "play": {"en": "Safe defaults: the tutor names five settings at the top of my scripts (DRY_RUN, COUNT, SEED, NAME, ROOT). For each I say what goes wrong if I leave it at a wrong value after today, and which default is safest.", "uk": "Безпечні типові значення: тьютор називає п'ять налаштувань на початку твоїх скриптів — DRY_RUN, COUNT, SEED, NAME, ROOT. Для кожного скажи, що піде не так, якщо лишити його хибним після сьогодні, і яке типове значення найбезпечніше."}, "video": {"search": "blender python batch export multiple fbx collections"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Генерація й експорт начисто (Day 80, lesson 1 of 4). Today's build: Один прохід конвеєра: SM_Rock_01–SM_Rock_10 від зерна до Unreal, перевірені з обох кінців і розставлені хвилерізом на твоєму острові.\nWhat I already know: День 79: GN_Rocks і make_variants.py; День 78: GN_PropVariants, для другої родини Золота; День 77: export_kit.py і export_log.md; День 72: set_nanite.py, твій інструмент масового Nanite; День 74: check_assets.py і його asset_report.md; День 6: твій чек-лист імпорту.\n\nBy the end of this lesson I can:\n1. Запускати make_variants.py і export_kit.py по черзі й читати вивід кожного перед наступним кроком.\n2. Безпечно видаляти старі варіанти перед новим проходом.\n3. Лишати кожен скрипт після проходу з безпечним типовим значенням (DRY_RUN = True).\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: Ти маєш скрипти Blender, export_kit.py, GN_PropVariants і GN_Rocks з make_variants.py: зерна за секунди стають справжніми чистими мешами. Today: Ти один раз проводиш увесь конвеєр, від зерна до острова, і доводиш це чистим журналом і чистим звітом перевірки. One encouraging line: Дні боса винагороджують спокійний порядок: один етап, одна перевірка, потім наступний. Коли перевірка не проходить, виправлення в джерелі — це перемога, а не поразка.); 2 lines on why today matters and where it comes back, in plain words (from this: Конвеєр справжній, лише коли він іде від початку до кінця без ручних виправлень посередині. Сьогодні ти доводиш, що твій такий: зерна в Blender, чистий журнал, чистий імпорт, Nanite одним махом і чистий звіт перевірки в Unreal. Студії довіряють художникам, чиї асети приходять правильними з першого разу. Тепер у тебе є інструменти й журнали, щоб це показати. It comes back: У День 104 твої скелі оформлять берег твого району, а в День 107 та сама звичка перевіряти з обох кінців стане твоєю фінальною перевіркою.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-80-boss-rock-pipeline exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (Прохід скель етап за етапом (на уроках)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Збережи gn_rocks.blend. В Outliner з Shift клацни кожну колекцію під EXPORT: старі скелі й камінці можна створити знову з їхніх зерен. Кла UCX_ box. Where do you fix it?", "uk": "export_kit.py пише SM_Rock_07: SKIPPED: no UCX_ box. Де це виправити?"}, "options": [{"en": "In Unreal, by adding collision by hand", "uk": "В Unreal, додавши колізію вручну"}, {"en": "In add_ucx() or the loop of make_variants.py, then run the stages again", "uk": "В add_ucx() або в циклі make_variants.py, потім запустити етапи знову"}, {"en": "By setting DRY_RUN to False", "uk": "Поставивши DRY_RUN на False"}, {"en": "By renaming the FBX file", "uk": "Перейменувати файл FBX"}], "answer": 1, "explain": {"en": "The cause is in the stage that makes the boxes; fixing it there fixes every future run too.", "uk": "Причина в етапі, що робить блоки, тож виправлення там лагодить і всі майбутні проходи."}}, {"q": {"en": "Why must a prop's origin be at its base when it is exported?", "uk": "Чому під час експорту origin пропса має бути на його основі?"}, "options": [{"en": "So Nanite works", "uk": "Щоб працював Nanite"}, {"en": "So the UVs are right", "uk": "Щоб UV були правильні"}, {"en": "So the file is smaller", "uk": "Щоб файл був меншим"}, {"en": "So it stands on the ground when you drop it with End in Unreal", "uk": "Щоб він стояв на землі, коли в Unreal опускаєш його клавішею End"}], "answer": 3, "explain": {"en": "End drops the origin onto the surface below, so an origin at the base puts the prop on the ground.", "uk": "End опускає origin на поверхню під ним, тож origin на основі ставить пропс на землю."}}, {"q": {"en": "In GN_PropVariants, how wide is the cutter of a 1.2 m planter with 5 cm walls?", "uk": "Якої ширини різак у GN_PropVariants для вазона завширшки 1,2 м зі стінками 5 см?"}, "options": [{"en": "1.25 m", "uk": "1,25 м"}, {"en": "1.1 m", "uk": "1,1 м"}, {"en": "1.15 m", "uk": "1,15 м"}, {"en": "1.2 m", "uk": "1,2 м"}], "answer": 1, "explain": {"en": "The cutter is Width minus 2 x Wall: 1.2 - 0.1 = 1.1 m.", "uk": "Ширина різака — Width мінус 2 × Wall: 1,2 - 0,1 = 1,1 м."}}, {"q": {"en": "Ten seeds gave ten identical rocks. What do you check first?", "uk": "Десять зерен дали десять однакових скель. Що перевірити спершу?"}, "options": [{"en": "The SEED id in make_variants.py against Copy Data Path", "uk": "Звірити id SEED у make_variants.py з Copy Data Path"}, {"en": "The FBX settings", "uk": "Налаштування FBX"}, {"en": "The material", "uk": "Матеріал"}, {"en": "The Nanite tool", "uk": "Інструмент Nanite"}], "answer": 0, "explain": {"en": "If the script sets the wrong input, the seed never changes and every rock is the same.", "uk": "Якщо скрипт задає не той вхід, зерно не змінюється, і всі скелі однакові."}}, {"q": {"en": "Your rock group looks fake from 30 m. Which change helps most?", "uk": "З 30 м твоя група скель виглядає фальшиво. Що допоможе найбільше?"}, "options": [{"en": "More triangles per rock", "uk": "Більше трикутників на скелю"}, {"en": "All rocks the same size", "uk": "Усі скелі однакового розміру"}, {"en": "Big rocks low and outside, small ones filling, every copy turned differently", "uk": "Великі скелі внизу й ззовні, дрібні в проміжках, кожна копія повернута по-своєму"}, {"en": "A brighter material", "uk": "Яскравіший матеріал"}], "answer": 2, "explain": {"en": "Real breakwaters have a clear structure and no repeated faces side by side; detail matters less from the air.", "uk": "Справжні хвилерізи мають чітку будову й не мають однакових граней поруч, а дрібниці згори важать менше."}}, {"q": {"en": "Why delete the old SM_Rock_ collections before a fresh run?", "uk": "Чому перед новим проходом видаляють старі колекції SM_Rock_?"}, "options": [{"en": "make_variants.py skips names that already exist, so old rocks would stay unchanged", "uk": "make_variants.py пропускає назви, що вже існують, тож старі скелі лишилися б без змін"}, {"en": "Blender can hold only ten collections", "uk": "Blender може тримати лише десять колекцій"}, {"en": "export_kit.py exports only new files", "uk": "export_kit.py експортує лише нові файли"}, {"en": "Deleting makes the run faster", "uk": "Видалення пришвидшує прохід"}], "answer": 0, "explain": {"en": "The skip rule keeps reruns safe, but it also means changed settings only reach new names.", "uk": "Правило пропуску робить повторні проходи безпечними, але через нього змінені налаштування доходять лише до нових назв."}}], "weekInfo": null, "morning": {"sofar": {"en": "You have Blender scripts, export_kit.py, GN_PropVariants, and GN_Rocks with make_variants.py: seeds become real, clean meshes in seconds.", "uk": "Ти маєш скрипти Blender, export_kit.py, GN_PropVariants і GN_Rocks з make_variants.py: зерна за секунди стають справжніми чистими мешами."}, "today": {"en": "You run the whole pipeline once, from seed to island, and prove it with a clean log and a clean checker report.", "uk": "Ти один раз проводиш увесь конвеєр, від зерна до острова, і доводиш це чистим журналом і чистим звітом перевірки."}, "cheer": {"en": "Boss days reward calm order: one stage, one check, then the next; when a check fails, fixing it at the source is a win, not a setback.", "uk": "Дні боса винагороджують спокійний порядок: один етап, одна перевірка, потім наступний. Коли перевірка не проходить, виправлення в джерелі — це перемога, а не поразка."}, "quote": {"text": {"en": "We choose to go to the Moon in this decade and do the other things, not because they are easy, but because they are hard.", "uk": "Ми обираємо полетіти на Місяць у це десятиліття та робити інші речі не тому, що це легко, а тому, що це важко."}, "author": {"en": "John F. Kennedy", "uk": "Джон Ф. Кеннеді"}, "source": "Address at Rice University, Houston, 12 September 1962"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-80-boss-rock-pipeline", "mapHref": "../../COURSE.html", "prevHref": "../Day-79-geometry-nodes-rocks-batch/START-HERE.html", "nextHref": "../Day-81-pcg-attributes-street-base/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Blender 5.x and Unreal Engine 5.8. I am a beginner on Day 80. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me: when my Blueprint or script fails, ask for the error message or a screenshot of the graph, point to the line or node that is wrong and explain why, then let me fix it myself. Never write the whole tool for me.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: Як добре розставити скелі на острові, і друга родина для Золота.\nIt's part of: Один прохід конвеєра: SM_Rock_01–SM_Rock_10 від зерна до Unreal, перевірені з обох кінців і розставлені хвилерізом на твоєму острові (TechArt/Blender/gn_rocks.blend і його експорти. В IslandCourse — Content/Tools/Day80/Rocks, тренувальний рівень Content/Tools/Day80/L_Day80, потім набережна L_Island.).\nWhy it matters: Конвеєр справжній, лише коли він іде від початку до кінця без ручних виправлень посередині. Сьогодні ти доводиш, що твій такий: зерна в Blender, чистий журнал, чистий імпорт, Nanite одним махом і чистий звіт перевірки в Unreal. Студії довіряють художникам, чиї асети приходять правильними з першого разу. Тепер у тебе є інструменти й журнали, щоб це показати. It comes back: У День 104 твої скелі оформлять берег твого району, а в День 107 та сама звичка перевіряти з обох кінців стане твоєю фінальною перевіркою.\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-80-boss-rock-pipeline (on the drive I chose on Day 0).\nWhat I already know: День 79: GN_Rocks і make_variants.py; День 78: GN_PropVariants, для другої родини Золота; День 77: export_kit.py і export_log.md; День 72: set_nanite.py, твій інструмент масового Nanite; День 74: check_assets.py і його asset_report.md; День 6: твій чек-лист імпорту; today's lessons: Генерація й експорт начисто; План проходу: конвеєр, який можна повторити (короткий урок); Імпорт, Nanite і перевірка в Unreal; Скелі, що виглядають так, наче їх розставила природа. Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- pipeline_plan.md: час початку, потім сім етапів по порядку (генерація, пробний запуск, експорт, імпорт, Nanite, перевірка, розстановка). Для кожного — інструмент і одна річ, яку перевіряєш, перш ніж іти далі.\n- SM_Rock_01–SM_Rock_10 згенеровано заново (старі колекції спершу видалено) й експортовано. export_log.md зі справжнього запуску має десять рядків OK.\n- Десять FBX імпортовано в Content/Tools/Day80/Rocks одним перетягуванням за чек-листом імпорту. Імпортований M_Rock замінено на MI_Rock — інстанс M_Master з кольором за твоїми фото.\n- Nanite ввімкнено на всіх десяти скриптом set_nanite.py (FOLDER = '/Game/Tools/Day80/Rocks', спершу пробний запуск). asset_report.md від check_assets.py для цієї папки чистий, або кожну знахідку пояснено в pipeline_plan.md.\n- L_Day80: десять скель у ряд поруч із манекеном, усі на землі. Потім хвилеріз або група з 25 і більше копій на набережній острова: великі скелі внизу й з боку моря, менші зверху й у проміжках, кожна копія повернута по-своєму, жодна не висить.\n- Бронза: прохід зроблено, звіт чистий. Срібло: хвилеріз на острові й pipeline_plan.md зі справжніми хвилинами. Золото: друга родина (твої камінці або три вазони) тим самим проходом менш ніж за 15 хв.\n\nMy checklist (the same numbers show on my course page):\n1. Спершу переконайся, що результати сьогоднішніх уроків на місці: pipeline_plan.md з уроку 2. Якщо уроки 1, 3 і 4 уже пройшли етапи, кроки 2–8 нижче — лише їхні перевірки: позначай кожну й іди далі. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Запусти таймер: Бронза за 2 години, уся робота — приблизно за 3 години 30 хвилин. Запиши час початку на початку pipeline_plan.md. Перевірка: час початку записано. (from lesson 2)\n2. У gn_rocks.blend видали кожну колекцію в EXPORT (старі скелі й камінці) і очисть невикористані дані (Purge). Поверни Rock_GN налаштування скелі (Size 1.2, Roughness 0.25, Flatten 1), встанови COUNT = 10 і NAME = 'SM_Rock' і запусти make_variants.py. Перевірка: в EXPORT десять нових колекцій, у кожній одна скеля й один блок UCX. (from lesson 1)\n3. Зроби пробний запуск export_kit.py, потім справжній, і поверни DRY_RUN = True. Перевірка: export_log.md пише exported і має десять рядків OK, а в exports десять файлів SM_Rock_ із сьогоднішнім часом, кожен більший за 10 КБ. (from lesson 1)\n4. В IslandCourse створи Content/Tools/Day80/Rocks, перетягни туди всі десять FBX, один раз перевір налаштування імпорту й клацни Import All. Перевірка: десять static mesh, і кожен показує свій блок у режимі Show > Simple Collision у Static Mesh Editor. (from lesson 3)\n5. Зроби MI_Rock з M_Master з кольором і Roughness скелі на свій смак. Збережи все. Потім клацни правою кнопкою на імпортованому M_Rock > Delete і вибери Replace References з MI_Rock. Перевірка: усі десять скель мають MI_Rock у слоті матеріалу. (from lesson 3)\n6. Встанови FOLDER = '/Game/Tools/Day80/Rocks' у set_nanite.py (День 72) і запусти: спершу пробний запуск, потім Yes у діалозі. Або клацни кнопку Nanite в EUW_TechTools. Перевірка: пробний запуск перелічує десять мешів, а потім у Details кожного Nanite ввімкнено. (from lesson 3)\n7. Перевірка для Бронзи: встанови FOLDER = '/Game/Tools/Day80/Rocks' у check_assets.py і запусти. Скопіюй Saved/TechTools/asset_report.md у робочу папку дня як check_report_day80.md. Якщо є проблема, виправ її в джерелі (група вузлів, скрипт або налаштування імпорту), пройди етапи знову й запиши причину в pipeline_plan.md. Перевірка: звіт перелічує десять мешів і жодної проблеми. (from lesson 3)\n8. Створи L_Day80 у Content/Tools/Day80, постав десять скель у ряд поруч із манекеном і натисни End на кожній (або правою кнопкою > Snap/Align > Snap to Floor). Збережи рівень (Ctrl+S), відкрий будь-який інший рівень, а тоді знову L_Day80. Перевірка: десять різних скель, усі на підлозі, правдоподібного розміру поруч із манекеном. (from lesson 4)\n9. Відкрий L_Island біля набережної й збудуй хвилеріз або групу скель із 25 і більше копій. Найбільші — внизу з боку моря, занурені приблизно на десяту частину висоти. Середні — зверху, дрібні — у проміжках. Кожну копію поверни й масштабуй від 0.8 до 1.2. Збережи L_Island. Перевірка: з 30 м видно одну зведену форму без прямих рядів, а з 2 м жодна скеля не висить. Перевірка для Срібла: запиши в pipeline_plan.md час, коли здобуто Срібло, і зроби скриншоти breakwater_30m.png і breakwater_2m.png. Перевірка: обидва зображення в робочій папці дня, а час записано. (from lesson 4)\n10. Золото: проведи другу родину тими самими етапами — SM_Pebble_01–_05, зроблені знову з налаштуваннями камінців, або три вазони з gn_props.blend. Засічи весь прохід від першого скрипта до чистого звіту. Перевірка: другий чистий звіт check_assets.py, а в pipeline_plan.md записано прохід менш ніж за 15 хв. (from lesson 1)\n11. Зроби копію: запакуй Content/Tools і Content/Python у zip у папку поза проєктом. Перевірка: zip більший за 1 МБ. Огляд робить фінальна перевірка тьютора-помічника, тож жодної форми заповнювати не треба. Запиши clip_day80.mp4: скрипт робить скелі, журнал експорту, імпорт і хвилеріз згори; 60 с, менше 50 МБ. Пиши в OBS Studio (Display Capture) або клавішами Win+Shift+R (Ножиці (Snipping Tool), виділи весь екран). Перевірка: кліп у робочій папці дня і менший за 50 МБ. (from lesson 2)\n12. Клацни «Копіювати звіт дня», встав текст у новий чат із тьютором, дай відповіді на його запитання й збережи відповідь як summary.md у робочій папці дня. Здай роботу: перетягни файли зі списку «Що здати» в сьогоднішню папку здачі (кнопка на цій сторінці). Папку проєкту чи рівня Unreal здавати не треба: вона дуже велика. Перевірка: у папці здачі всі файли, кожен більший за 1 КБ. (from lesson 4)\n\nToday is a BOSS build. Ask me what time I started; whenever I tell you the time, tell me which tier I'm on track for. At the end, ask my finish time. Tiers:\n- Бронза: десять скель згенеровано, експортовано з чистим журналом, імпортовано, переведено на Nanite, а звіт check_assets.py чистий.\n- Срібло: усе для Бронзи, а ще хвилеріз із 25 і більше копій на острові, що з 30 м виглядає як одна форма й де ніщо не висить, і час, коли здобуто Срібло, у pipeline_plan.md.\n- Золото: Срібло плюс друга родина тим самим проходом із другим чистим звітом, а весь прохід засічено менш ніж за 15 хв.\n\nHow to help: ask which step number I'm on, then give me only the next step: the exact clicks and what I should see. When I send a screenshot, compare it with my reference, my sizes and the spec, and name one thing to fix at a time.\nCheck every save and export by reopening it before we move on:\n- a Blueprint or script: compile or run it once more and see it work, with no errors\n- a .md or .txt: open it with Notepad; the text is there, and the name doesn't end in .md.txt\n- the clip: right-click > Properties shows 30 to 60 seconds and under 50 MB\nWhen I write \"готово\", and in any case before the day ends, check with me one item at a time (yes/no): each spec point, then each file on my hand-in list, ready in my day work folder (skip summary.md: the day report writes it next):\n1. pipeline_plan.md (сім етапів із перевірками й час, коли здобуто кожну медаль) (День боса)\n2. export_log.md та check_report_day80.md (десять рядків OK; чистий звіт перевірника) (доказ)\n3. breakwater_30m.png та breakwater_2m.png (День боса)\n4. clip_day80.mp4 (від зерен до хвилерізу; 60 с, менше 50 МБ) (День боса)\nFinish with a short list of anything missing, the tier I reached, and one line on where this work comes back and what it will look like there. Then tell me the order for the end of the day: first the day report (the Copy the day report button at the bottom of my course page) into summary.md, and only then hand in all the files on the list, summary.md too.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; tier (Bronze, Silver, Gold) = медаль (Бронза, Срібло, Золото); day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; review (by tutor or art director) = огляд; checklist = чек-лист; credits line = рядок авторства; reference photo / hero photo = фото-референс / ключове фото; click / right-click = клацни / клацни правою кнопкою; screensh function vid(v){if(!v)return '';const link=v.url?'<a href="'+esc(v.url)+'" target="_blank" rel="noopener">'+esc(x(v.title)||v.url)+'</a>'+(v.channel?' <span class="muted">· '+esc(v.channel)+(v.length?' · '+esc(v.length):'')+'</span>':''):'';const s=v.search?'<a href="https://www.youtube.com/results?search_query='+encodeURIComponent(v.search)+'" target="_blank" rel="noopener">'+u('noVid')+': '+esc(v.search)+'</a>':'';const alt=v.alt&&v.alt.url?'<br><span class="eyebrow">UA</span> <a href="'+esc(v.alt.url)+'" target="_blank" rel="noopener">'+esc(v.alt.title||v.alt.url)+'</a>'+(v.alt.channel?' <span class="muted">· '+esc(v.alt.channel)+'</span>':''):'';return '<div class="vid well">'+kn('play')+'<div><b>'+u('more')+'?</b><br>'+(link||s)+alt+(link&&s?'<br><span class="muted" style="font-size:14px">'+s+'</span>':'')+'</div></div>'}
function morning(){const m=D.morning;if(!m)return '';const q=m.quote||{};
 let shelf='';if(D.day>0){shelf='<div class="shelf" aria-hidden="true">';let g='';for(let d=0;d<D.day;d++){let p=0;try{p=(JSON.parse(localStorage.getItem('devteam:'+D.learner+':'+d))||{}).pct||0}catch(e){}g+='<i class="'+(p>=1?'d':'')+(d>0&&d%5===0?' bs':'')+'"></i>';if(d%5===0||d===D.day-1){shelf+='<span class="wkg">'+g+'</span>';g=''}}shelf+='</div>'}
 const qt=lang==='uk'&&q.original?q.original:x(q.text);
 return '<section class="card glass morning"><div class="mgrid">'+(m.sofar?'<div>'+lab(u('sofar'),'gold')+shelf+'<p class="mtxt">'+lk(x(m.sofar))+'</p></div>':'')+(m.today?'<div>'+lab(u('todayL'))+'<p class="mtxt">'+lk(x(m.today))+'</p></div>':'')+'</div>'+(m.cheer?'<p class="cheer">'+esc(x(m.cheer))+'</p>':'')+(qt?'<figure class="quote well">'+kn('quote')+'<blockquote>'+esc(qt)+'</blockquote>'+(q.author?'<figcaption>'+esc(x(q.author))+'</figcaption>':'')+'</figure>':'')+'</section>'}
function setLang(l){lang=l;try{localStorage.setItem('devteam:lang',lang)}catch(e){};render()}
function toggleLang(){setLang(lang==='uk'?'en':'uk')}
/* keep open sections and keyboard focus across re-renders */
const openD=new Set();
function tg(e){if(e.open)openD.add(e.id);else openD.delete(e.id)}
const op=id=>openD.has(id)?' open':'';
function render(){const ae=document.activeElement,fid=ae&&(ae.id||(ae.getAttribute('data-th')?'th-'+ae.getAttribute('data-th'):ae.getAttribute('lang')&&ae.closest('.seg')?'lg-'+ae.getAttribute('lang'):''));
 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);
 const b=D.build,P=Math.round(prog()*100);
 document.getElementById('top').innerHTML='<div class="topin glass"><a class="maplink" href="'+esc(D.mapHref)+'">'+kn('map')+u('map')+'</a><div class="crumb"><b>'+esc(x(D.learnerName))+'</b><span>'+u('week')+' '+D.week+'</span><span>'+u('day')+' '+D.day+' '+u('of')+' '+D.total+'</span></div>'+controls(lang,'setLang')+'</div><div class="tline"><i style="width:'+P+'%"></i></div>';
 const state=w=>w<D.week?'b':w===D.week?'n':'p';
 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 let wk='';if(D.weekInfo){const w=D.weekInfo;wk='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}
 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p>'+(b.next?'<div class="back well">'+kn('arrow')+'<div><b>'+u('comes')+'</b><br>'+lk(x(b.next))+'</div></div>':'')+'<div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.assetFiles&&D.assetFiles.length?'<p class="files">'+ic('folder')+'<span>'+u('filesL')+' '+D.assetFiles.map(f=>'<a href="assets/'+encodeURIComponent(f)+'" target="_blank" rel="noopener">'+esc(f)+'</a>').join(', ')+'</span></p>':D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+=handinCard();h+=beforeCard();
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div><label class="rcpt" for="r'+i+'"><span class="eyebrow">'+u('rcpt')+'</span><textarea id="r'+i+'" rows="2" placeholder="'+esc(u('rcptPh'))+'" oninput="st.r'+i+'=this.value;save()">'+esc(st['r'+i]||'')+'</textarea></label>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+hList()+chkList()+(hasClip?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<h3>1 · '+u('copyR')+'</h3><p class="muted">'+u('report')+'</p><div class="row"><button class="btn ghost" onclick="cp(reportText())">'+ic('copy')+u('copyR')+'</button></div><h3>2 · '+u('ship')+'</h3>'+hf()+'<p class="muted" style="margin:12px 0 0">'+u('hNote')+'</p></section>';
 h+=qCard();h+=wk;
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();
</script>

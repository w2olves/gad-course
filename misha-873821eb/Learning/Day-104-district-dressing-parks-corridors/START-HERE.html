rk_Tower) у /TechTools/District."}, "spec": [{"en": "dressing_plan.md first: what the real streets hold (from your photos), the parks and gardens from the map, the landmark and its three photos, two or three square features (a fountain, a statue, a kiosk), the corridors, and the clash order: corridors first, roads second, houses third, greenery last.", "uk": "Спершу dressing_plan.md: що містять справжні вулиці (з твоїх фото), парки й сади з мапи, орієнтир і три його фото, два-три елементи площі (фонтан, статуя, кіоск), коридори та порядок конфліктів: спершу коридори, другими дороги, третіми будинки, зелень останньою."}, {"en": "PCG_StreetDresser on a PCG Volume over the whole district (Location 10000, 10000, 0; Scale 110, 110, 30) set as the generator's Dresser; Kerb Offset 0, 500, 12.5; props on the pavements of every BP_Road, none on carriageways or lanes, and no lamp, tree, bench, bin or bollard on a junction table or in its mouth (its KeepOutWide and KeepOutJunction tags).", "uk": "PCG_StreetDresser на PCG Volume над усім районом (Location 10000, 10000, 0; Scale 110, 110, 30), заданий як Dresser генератора; Kerb Offset 0, 500, 12.5; пропси на тротуарах кожного BP_Road, жодного на проїзних частинах чи провулках, і жодного ліхтаря, дерева, лавки, смітника чи стовпчика на майданчику перехрестя чи біля його входу (його теги KeepOutWide і KeepOutJunction)."}, {"en": "BP_GreenZone: an Actor with a closed Spline Outline drawn as a circle of 8 points from Radius (m, 5 to 60, default 15) in its Construction Script (Set Closed Loop), the actor tag Green; one zone per park or garden on the map, scaled into an oval where needed; the generator's Green Zones (BP_GreenZone array) drop every plot whose centre lies inside a zone.", "uk": "BP_GreenZone: Actor із замкненим контуром Spline Outline, намальованим як коло з 8 точок за Radius (м, від 5 до 60, типово 15) у його Construction Script (Set Closed Loop), тег актора Green; одна зона на парк чи сад на мапі, за потреби розтягнута в овал; Green Zones генератора (масив BP_GreenZone) відкидають кожну ділянку, чий центр лежить усередині зони."}, {"en": "PCG_DistrictGreen: Get Spline Data (By Tag, Green) > Create Surface From Spline > Surface Sampler > Spatial Noise (Perlin2D) and a Density Filter (clusters with glades, not a carpet) > PCG_RoadClear (PCG_KeepOuts duplicated for the tag Road, which every BP_Road and BP_Lane carries, keeping its 7 m Bounds Modifier) > PCG_KeepOuts > Transform Points (any turn, scale 0.8 to 1.2, sunk 10 to 30 cm) > a Static Mesh Spawner with two tree kinds and one shrub, weighted; seeded; nothing floating.", "uk": "PCG_DistrictGreen: Get Spline Data (By Tag, Green) > Create Surface From Spline > Surface Sampler > Spatial Noise (Perlin2D) і Density Filter (гущавини з галявинами, а не килим) > PCG_RoadClear (PCG_KeepOuts, дубльований для тега Road, який несуть усі BP_Road і BP_Lane, із його Bounds Modifier 7 м) > PCG_KeepOuts > Transform Points (будь-який поворот, масштаб від 0.8 до 1.2, занурення на 10-30 см) > Static Mesh Spawner із двома видами дерев і одним кущем, зважений; із зерном; нічого не висить у повітрі."}, {"en": "The landmark, built after three real photos from your kit and Geometry Nodes pieces, at least twice as tall as its neighbours, with a top in MI_LampGlow that lights with MPC_World's Night, set as Landmark Class in DA_TownRules_District; PDA_TownRules gains Feature Points (Vector array, m) and Feature Class (Actor class), and Spawn Features places them (metres from the generator), traced to the ground, in the square, skipping any in a corridor.", "uk": "Орієнтир, збудований за трьома справжніми фото з твого набору та деталей Geometry Nodes, щонайменше вдвічі вищий за сусідів, із верхівкою в MI_LampGlow, що світиться з Night з MPC_World, заданий як Landmark Class у DA_TownRules_District; PDA_TownRules отримує Feature Points (масив Vector, м) і Feature Class (клас Actor), а Spawn Features розставляє їх (у метрах від генератора), з трасуванням до землі, на площі, пропускаючи ті, що в коридорі."}, {"en": "KO_Corridor01 to 03 in the generator's Keep Outs and read by PCG_KeepOuts on the dresser's lamp and tree branches and in PCG_DistrictGreen; LaneGauge flies each one at 15 m touching nothing; Check Town at 0 problems.", "uk": "KO_Corridor01-03 у Keep Outs генератора, які читає PCG_KeepOuts на гілках ліхтарів і дерев оздоблювача та в PCG_DistrictGreen; LaneGauge пролітає кожен на висоті 15 м, нічого не зачепивши; Check Town на 0 проблем."}, {"en": "district_notes.md: stat unit from 120 m and the instance counts (the summary line and each PCG volume's generated instances), with the biggest suspect named for Day 107 if the frame is over budget.", "uk": "district_notes.md: stat unit зі 120 м і кількості інстансів (підсумковий рядок і згенеровані інстанси кожного об'єму PCG), із найбільшим підозрюваним для Дня 107, названим, якщо кадр перевищує бюджет."}], "piece1": "The street dressing, the green zones and PCG_DistrictGreen (built in the lessons)", "piece2": {"en": "The landmark, the square features and the corridor flights, on your own", "uk": "Орієнтир, елементи площі та польоти коридорами — самостійно"}, "steps": [{"text": {"en": "Write dressing_plan.md: what the real streets hold, the parks and gardens, the landmark with three photos, the square features, the corridors and the clash order. Check: every item has a place marked on map_box.png.", "uk": "Напиши dressing_plan.md: що містять справжні вулиці, парки й сади, орієнтир із трьома фото, елементи площі, коридори й порядок конфліктів. Перевірка: кожен пункт має місце, позначене на map_box.png."}, "lesson": 1}, {"text": {"en": "Place the PCG Volume with PCG_StreetDresser over the district, set Kerb Offset 0, 500, 12.5, set it as Dresser and Regenerate. Check: lamps, benches, bins and street trees on the pavements of the main streets, none on carriageways or lanes, and no lamp, tree, bench, bin or bollard on a junction table or in its mouth.", "uk": "Постав PCG Volume із PCG_StreetDresser над районом, задай Kerb Offset 0, 500, 12.5, постав його як Dresser і зроби Regenerate. Перевірка: ліхтарі, лавки, смітники й вуличні дерева на тротуарах головних вулиць, жодного на проїзних частинах чи провулках, і жодного ліхтаря, дерева, лавки, смітника чи стовпчика на майданчику перехрестя чи біля його входу."}, "lesson": 1}, {"text": {"en": "Place BP_GreenZone outlines over the map's parks and gardens, add them to Green Zones and Regenerate. Check: no house stands inside a zone.", "uk": "Розмісти контури BP_GreenZone над парками й садами мапи, додай їх у Green Zones і зроби Regenerate. Перевірка: жоден будинок не стоїть усередині зони."}, "lesson": 2}, {"text": {"en": "Add a PCG Volume with PCG_DistrictGreen over the district and Generate. Check: clusters of trees and shrubs with glades between them, inside the zones only, none on a road or lane, nothing floating.", "uk": "Додай PCG Volume із PCG_DistrictGreen над районом і Generate. Перевірка: гущавини дерев і кущів із галявинами між ними, лише всередині зон, жодної на дорозі чи провулку, нічого не висить у повітрі."}, "lesson": 2}, {"text": {"en": "Change the green volume's Seed, then set it back. Check: different clusters inside the same zones, and the old seed brings the old clusters back.", "uk": "Зміни Seed зеленого об'єму, потім поверни назад. Перевірка: інші гущавини всередині тих самих зон, а старе зерно повертає старі гущавини."}, "lesson": 2}, {"text": {"en": "On your own: build your landmark Blueprint after the three photos, set it as Landmark Class and Regenerate. Check: it stands in the square, at least twice as tall as its neighbours, and you can see it from the far end of three streets that lead to it.", "uk": "Самостійно: збудуй Blueprint свого орієнтира за трьома фото, постав його як Landmark Class і зроби Regenerate. Перевірка: він стоїть на площі, щонайменше вдвічі вищий за сусідів, і його видно з дальнього кінця трьох вулиць, що до нього ведуть."}, "lesson": 3}, {"text": {"en": "On your own: add Feature Points and Feature Class to the rules and Spawn Features to Regenerate. Check: a fountain, statue or kiosk stands on the ground in the square, not on a road and not in a corridor.", "uk": "Самостійно: додай Feature Points і Feature Class до правил та Spawn Features до Regenerate. Перевірка: фонтан, статуя чи кіоск стоїть на землі на площі, не на дорозі й не в коридорі."}, "lesson": 3}, {"text": {"en": "Check that KO_Corridor01 to 03 are in Keep Outs and in the PCG graphs' keep-out branches; Regenerate and Generate both volumes. Check: LaneGauge flies each corridor at 15 m touching nothing.", "uk": "Перевір, що KO_Corridor01-03 є в Keep Outs і в гілках keep-out графів PCG; зроби Regenerate і Generate для обох об'ємів. Перевірка: LaneGauge пролітає кожен коридор на висоті 15 м, нічого не зачепивши."}, "lesson": 4}, {"text": {"en": "Click Check Town. Check: 0 problems.", "uk": "Клацни Check Town. Перевірка: 0 проблем."}, "lesson": "D90.2"}, {"text": {"en": "Night test: set MPC_World's Night to 1, or drop the sun below the horizon and update a lamp. Check: the landmark's top and the street lanterns glow; take night_120m.png.", "uk": "Нічний тест: постав Night з MPC_World на 1 або опусти сонце за горизонт і онови ліхтар. Перевірка: верхівка орієнтира та вуличні ліхтарі світяться; зроби night_120m.png."}, "lesson": "D64.1"}, {"text": {"en": "Read stat unit from 120 m and the instance counts (the summary line, and each PCG volume's generated instances, as on Day 85). Check: the numbers are in district_notes.md, with the frame under 16.6 ms or the biggest suspect named for Day 107.", "uk": "Прочитай stat unit зі 120 м і кількості інстансів (підсумковий рядок і згенеровані інстанси кожного об'єму PCG, як у Дні 85). Перевірка: числа записано в district_notes.md, кадр менший за 16.6 мс або названо найбільшого підозрюваного для Дня 107."}, "lesson": 4}, {"text": {"en": "Commit and push ('District dressing: streets, parks, landmark, corridors'). Take dressed_120m.png, park_10m.png and landmark_street.png. Record clip_day104.mp4 (60 seconds): a drone flight along a corridor, over a park and round the landmark. Check: three pictures and the clip in today's Work folder.", "uk": "Закоміть і запуш («District dressing: streets, parks, landmark, corridors»). Зроби dressed_120m.png, park_10m.png і landmark_street.png. Запиши clip_day104.mp4 (60 секунд): політ дрона вздовж коридору, над парком і навколо орієнтира. Перевірка: три зображення та кліп у папці Work за сьогодні."}, "lesson": 4}, {"text": {"en": "Click Copy the day report, paste it into a new tutor chat, answer its questions and save its answer as summary.md. Check: summary.md is in today's Work folder with Made, To look at, Hours and To revisit filled in.", "uk": "Клацни Copy the day report (скопіювати звіт дня), встав у новий чат із тьютором, дай відповіді на його запитання й збережи його відповідь як summary.md. Перевірка: summary.md лежить у папці Work за сьогодні, а Made, To look at, Hours і To revisit заповнені."}, "lesson": 1}], "assets": ["techart/street-dimensions.md", "techart/standards-sheet.md"]}, "lessons": [{"title": {"en": "Dressing a real street", "uk": "Оздоблення справжньої вулиці"}, "minutes": 40, "goals": [{"en": "Plan the dressing from the real place: what its streets, gardens and square actually hold.", "uk": "Сплануй оздоблення за справжнім місцем: що насправді містять його вулиці, сади та площа."}, {"en": "Run PCG_StreetDresser over the whole district so every generated street is dressed.", "uk": "Запусти PCG_StreetDresser над усім районом, щоб кожна згенерована вулиця була оздоблена."}, {"en": "Set a clash order: corridors, roads, houses, then greenery.", "uk": "Задай порядок конфліктів: коридори, дороги, будинки, потім зелень."}], "doalong": [{"en": "Open your three photos and map_box.png. In dressing_plan.md list what the real streets hold (lamps every 20 m? trees? café tables?), where the parks and gardens are, what stands in the square, and where a drone would fly. You see a plan grounded in the real place.", "uk": "Відкрий свої три фото й map_box.png. У dressing_plan.md перелічи, що містять справжні вулиці (ліхтарі кожні 20 м? дерева? столики кафе?), де парки й сади, що стоїть на площі та де летів би дрон. Ти бачиш план, що спирається на справжнє місце."}, {"en": "Write the clash order: corridors first (nothing inside them), roads second (nothing on carriageways), houses third, greenery last. You see which rule wins whenever two disagree.", "uk": "Запиши порядок конфліктів: спершу коридори (нічого всередині них), другими дороги (нічого на проїзних частинах), третіми будинки, зелень останньою. Ти бачиш, яке правило перемагає, коли два суперечать."}, {"en": "Place a PCG Volume over the district (Location 10000, 10000, 0; Scale 110, 110, 30), assign PCG_StreetDresser, set its Kerb Offset to 0, 500, 12.5 (the 12 m BP_Road, as on Day 89) and pick the volume as BP_DistrictGenerator's Dresser. Regenerate. You see props along every main street, because every BP_Road carries the tag Street; lanes carry Lane instead (Day 103), so they stay bare, as narrow lanes in most old towns are.", "uk": "Постав PCG Volume над районом (Location 10000, 10000, 0; Scale 110, 110, 30), призначи PCG_StreetDresser, задай його Kerb Offset 0, 500, 12.5 (BP_Road шириною 12 м, як у Дні 89) і вибери об'єм як Dresser для BP_DistrictGenerator. Зроби Regenerate. Ти бачиш пропси вздовж кожної головної вулиці, бо кожен BP_Road несе тег Street; провулки натомість несуть Lane (День 103), тож лишаються голими, як вузькі провулки в більшості старих міст."}, {"en": "Fly the main street at 3 m. Props stand 5 m from the centre line (Kerb Offset 0, 500, 12.5, on the 12.5 cm kerb height): on the pavement of the 12 m road, clear of the house fronts 8 m out. You see whether that looks right; if props crowd a pavement, raise Slot Spacing or lower Tree Chance on the volume, and note it. Lamps and trees keep back from the junction tables (their KeepOutWide tag, Day 103), and so do benches, bins and bollards (their KeepOutJunction tag, read by PCG_JunctionKeepOuts since Day 89); if one still stands in a junction's mouth, check that the table carries KeepOutJunction and that PCG_JunctionKeepOuts sits on that branch.", "uk": "Прольоти головною вулицею на висоті 3 м. Пропси стоять за 5 м від осьової лінії (Kerb Offset 0, 500, 12.5, на висоті бордюру 12.5 см): на тротуарі дороги шириною 12 м, подалі від фасадів будинків за 8 м. Ти бачиш, чи це виглядає правильно; якщо пропси тіснять тротуар, збільш Slot Spacing або зменш Tree Chance на об'ємі й занотуй це. Ліхтарі й дерева тримаються подалі від майданчиків перехресть (їхній тег KeepOutWide, День 103), так само лавки, смітники й стовпчики (їхній тег KeepOutJunction, який PCG_JunctionKeepOuts читає з Дня 89); якщо один усе ж стоїть біля входу на перехрестя, перевір, що майданчик несе KeepOutJunction і що PCG_JunctionKeepOuts стоїть на цій гілці."}], "play": {"en": "Real or invented: the tutor describes six dressing ideas (lamps every 20 m on the main street; palm trees in a cold northern harbour; benches facing the sea; café tables in the shop street; a tree in the middle of every junction; bollards round the square). For each I say whether my photos support it, and why grounding matters.", "uk": "Справжнє чи вигадане: тьютор описує шість ідей оздоблення (ліхтарі кожні 20 м на головній вулиці; пальми в холодній північній гавані; лавки обличчям до моря; столики кафе на торговій вулиці; дерево посеред кожного перехрестя; стовпчики навколо площі). Для кожної я кажу, чи підтримують її мої фото, і чому важлива опора на реальність."}, "video": {"search": "unreal engine pcg street props along spline dressing"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Dressing a real street (Day 104, lesson 1 of 4).\nToday's build: The dressed district: PCG_StreetDresser over L_District, BP_GreenZone outlines grown by PCG_DistrictGreen, a landmark and square features from the rules, and KO_Corridor01 to 03 kept clear by every generator.\n\nBy the end of this lesson I can:\n1. Plan the dressing from the real place: what its streets, gardens and square actually hold.\n2. Run PCG_StreetDresser over the whole district so every generated street is dressed.\n3. Set a clash order: corridors, roads, houses, then greenery.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (BP_DistrictGenerator builds your real street plan: roads, junction tables, plots along curved streets and grounded houses, from one seed.), what I will learn today (You dress it: furnished streets, parks from the map, a landmark built after the real one, and corridors kept clear for flying.), encourage me (This is the day the district starts to feel lived-in; fly it slowly at dusk and enjoy what your code has built.), and share today's quote: \"I think that I shall never see / A poem lovely as a tree.\" (Joyce Kilmer).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 101: What does the 'done means' section of your design document list? | Day 97: What does Fix Up Redirectors (Update Redirector References in newer versions) do after a move?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Real or invented: the tutor describes six dressing ideas (lamps every 20 m on the main street; palm trees in a cold northern harbour; benches facing the sea; café tables in the shop street; a tree in the middle of every junction; bollards round the square). For each I say whether my photos support it, and why grounding matters.\n6. Do-along on today's build (The street dressing, the green zones and PCG_DistrictGreen (built in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Open your three photos and map_box.png. In dressing_plan.md list what the real streets hold (lamps every 20 m? trees? café tables?), where the parks and gardens are, what stands in the square, and where a drone would fly. You see a plan grounded in the real place.\n   - Write the clash order: corridors first (nothing inside them), roads second (nothing on carriageways), houses third, greenery last. You see which rule wins whenever two disagree.\n   - Place a PCG Volume over the district (Location 10000, 10000, 0; Scale 110, 110, 30), assign PCG_StreetDresser, set its Kerb Offset to 0, 500, 12.5 (the 12 m BP_Road, as on Day 89) and pick the volume as BP_DistrictGenerator's Dresser. Regenerate. You see props along every main street, because every BP_Road carries the tag Street; lanes carry Lane instead (Day 103), so they stay bare, as narrow lanes in most old towns are.\n   - Fly the main street at 3 m. Props stand 5 m from the centre line (Kerb Offset 0, 500, 12.5, on the 12.5 cm kerb height): on the pavement of the 12 m road, clear of the house fronts 8 m out. You see whether that looks right; if props crowd a pavement, raise Slot Spacing or lower Tree Chance on the volume, and note it. Lamps and trees keep back from the junction tables (their KeepOutWide tag, Day 103), and so do benches, bins and bollards (their KeepOutJunction tag, read by PCG_JunctionKeepOuts since Day 89); if one still stands in a junction's mouth, check that the table carries KeepOutJunction and that PCG_JunctionKeepOuts sits on that branch.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Parks and gardens: BP_GreenZone and PCG_DistrictGreen", "uk": "Парки й сади: BP_GreenZone і PCG_DistrictGreen"}, "minutes": 40, "goals": [{"en": "Make a closed spline outline from a radius with a loop of eight points.", "uk": "Зроби замкнений контур сплайна з радіуса циклом із восьми точок."}, {"en": "Grow seeded clusters of trees and shrubs inside closed outlines with Create Surface From Spline, Surface Sampler and Spatial Noise.", "uk": "Вирощуй гущавини дерев і кущів із зерном усередині замкнених контурів через Create Surface From Spline, Surface Sampler і Spatial Noise."}, {"en": "Keep greenery off roads and corridors with keep-out subgraphs, and keep houses out of the zones.", "uk": "Тримай зелень подалі від доріг і коридорів через підграфи keep-out і не пускай будинки в зони."}], "doalong": [{"en": "Make BP_GreenZone in /TechTools/District: an Actor with a Spline component Outline, Radius (Float, m, 5 to 60, default 15) and the tag Green in Class Defaults. Construction Script: Clear Spline Points; For Loop i from 0 to 7: Add Spline Point with Location (Cos(i x 45) x Radius x 100, Sin(i x 45) x Radius x 100, 0), Coordinate Space Local (use the degrees versions of Cos and Sin); then Set Closed Loop (true; if that node is not offered, tick Closed Loop on Outline in Details). You see a circle you can scale into an oval.", "uk": "Зроби BP_GreenZone у /TechTools/District: Actor з компонентом Spline Outline, Radius (Float, м, від 5 до 60, типово 15) і тегом Green у Class Defaults. Construction Script: Clear Spline Points; For Loop i від 0 до 7: Add Spline Point із Location (Cos(i x 45) x Radius x 100, Sin(i x 45) x Radius x 100, 0), Coordinate Space Local (використай версії Cos і Sin для градусів); потім Set Closed Loop (true; якщо цей вузол не пропонується, познач Closed Loop на Outline у Details). Ти бачиш коло, яке можна розтягнути в овал."}, {"en": "Place one zone on each park or garden of your map, scaled to fit. In BP_DistrictGenerator add Green Zones (BP_GreenZone array, Instance Editable, Category Links), fill it with your zones (+ then the eyedropper), and in Make Plots, with the other drop tests after Apply Plot Rules, drop a plot when the Distance2D from its centre to a zone's location is less than that zone's Radius x 100 (for an oval, times its larger scale). Regenerate. You see the houses keep out of the parks.", "uk": "Розмісти по одній зоні на кожен парк чи сад твоєї мапи, масштабовану за розміром. У BP_DistrictGenerator додай Green Zones (масив BP_GreenZone, Instance Editable, Category Links), заповни його своїми зонами (+ потім піпетка), а в Make Plots, разом з іншими тестами відкидання після Apply Plot Rules, відкидай ділянку, коли Distance2D від її центру до розташування зони менша за Radius x 100 цієї зони (для овалу, помножений на більший масштаб). Зроби Regenerate. Ти бачиш, що будинки не заходять у парки."}, {"en": "Make PCG_DistrictGreen in /TechTools/PCG: Get Spline Data (All World Actors, By Tag, Green) > Create Surface From Spline > Surface Sampler (Points Per Squared Meter about 0.02). Press D on the sampler. You see points inside the zones only; if the surface is empty, check the spline is a closed loop.", "uk": "Зроби PCG_DistrictGreen у /TechTools/PCG: Get Spline Data (All World Actors, By Tag, Green) > Create Surface From Spline > Surface Sampler (Points Per Squared Meter приблизно 0.02). Натисни D на семплері. Ти бачиш точки лише всередині зон; якщо поверхня порожня, перевір, що сплайн — замкнений цикл."}, {"en": "Continue: Spatial Noise (Mode Perlin2D, as on Day 36; its Transform Scale X and Y about 4, so clumps are 10 to 20 m across) > Density Filter (Lower Bound 0.4) for clusters with glades; PCG_RoadClear (duplicate PCG_KeepOuts as you did for PCG_JunctionKeepOuts on Day 89, set its tag to Road and keep its Bounds Modifier at 7 m: a road's 6 m half width plus 1 m); PCG_KeepOuts; Transform Points (Rotation Z 0 to 360, Scale 0.8 to 1.2, Offset Z -10 to -30); a Static Mesh Spawner with two trees and one shrub, weighted. Place a PCG Volume with it over the district and Generate. You see parks with clusters and glades, and no tree on a road, a lane or in a corridor.", "uk": "Далі: Spatial Noise (Mode Perlin2D, як у Дні 36; його Transform Scale X і Y приблизно 4, щоб купини були 10-20 м упоперек) > Density Filter (Lower Bound 0.4) для гущавин із галявинами; PCG_RoadClear (дублюй PCG_KeepOuts, як для PCG_JunctionKeepOuts у Дні 89, задай його тег Road і лиши його Bounds Modifier 7 м: половина ширини дороги 6 м плюс 1 м); PCG_KeepOuts; Transform Points (Rotation Z від 0 до 360, Scale від 0.8 до 1.2, Offset Z від -10 до -30); Static Mesh Spawner із двома деревами й одним кущем, зважений. Постав над районом PCG Volume з ним і Generate. Ти бачиш парки з гущавинами й галявинами та жодного дерева на дорозі, провулку чи в коридорі."}], "play": {"en": "Carpet or park: the tutor describes four green areas (trees in a perfect grid; one tree every 2 m everywhere; clusters with open glades and a path; one huge tree on its own). I say which reads as a real park from 60 m, and which PCG setting makes each one.", "uk": "Килим чи парк: тьютор описує чотири зелені ділянки (дерева в ідеальній сітці; одне дерево кожні 2 м скрізь; гущавини з відкритими галявинами й доріжкою; одне величезне дерево саме). Я кажу, яка виглядає як справжній парк із 60 м і яке налаштування PCG створює кожну."}, "video": {"search": "unreal engine pcg create surface from spline surface sampler"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Parks and gardens: BP_GreenZone and PCG_DistrictGreen (Day 104, lesson 2 of 4).\nToday's build: The dressed district: PCG_StreetDresser over L_District, BP_GreenZone outlines grown by PCG_DistrictGreen, a landmark and square features from the rules, and KO_Corridor01 to 03 kept clear by every generator.\nEarlier today I already did: lesson 1 (Dressing a real street). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Make a closed spline outline from a radius with a loop of eight points.\n2. Grow seeded clusters of trees and shrubs inside closed outlines with Create Surface From Spline, Surface Sampler and Spatial Noise.\n3. Keep greenery off roads and corridors with keep-out subgraphs, and keep houses out of the zones.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Carpet or park: the tutor describes four green areas (trees in a perfect grid; one tree every 2 m everywhere; clusters with open glades and a path; one huge tree on its own). I say which reads as a real park from 60 m, and which PCG setting makes each one.\n4. Do-along on today's build (The street dressing, the green zones and PCG_DistrictGreen (built in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Make BP_GreenZone in /TechTools/District: an Actor with a Spline component Outline, Radius (Float, m, 5 to 60, default 15) and the tag Green in Class Defaults. Construction Script: Clear Spline Points; For Loop i from 0 to 7: Add Spline Point with Location (Cos(i x 45) x Radius x 100, Sin(i x 45) x Radius x 100, 0), Coordinate Space Local (use the degrees versions of Cos and Sin); then Set Closed Loop (true; if that node is not offered, tick Closed Loop on Outline in Details). You see a circle you can scale into an oval.\n   - Place one zone on each park or garden of your map, scaled to fit. In BP_DistrictGenerator add Green Zones (BP_GreenZone array, Instance Editable, Category Links), fill it with your zones (+ then the eyedropper), and in Make Plots, with the other drop tests after Apply Plot Rules, drop a plot when the Distance2D from its centre to a zone's location is less than that zone's Radius x 100 (for an oval, times its larger scale). Regenerate. You see the houses keep out of the parks.\n   - Make PCG_DistrictGreen in /TechTools/PCG: Get Spline Data (All World Actors, By Tag, Green) > Create Surface From Spline > Surface Sampler (Points Per Squared Meter about 0.02). Press D on the sampler. You see points inside the zones only; if the surface is empty, check the spline is a closed loop.\n   - Continue: Spatial Noise (Mode Perlin2D, as on Day 36; its Transform Scale X and Y about 4, so clumps are 10 to 20 m across) > Density Filter (Lower Bound 0.4) for clusters with glades; PCG_RoadClear (duplicate PCG_KeepOuts as you did for PCG_JunctionKeepOuts on Day 89, set its tag to Road and keep its Bounds Modifier at 7 m: a road's 6 m half width plus 1 m); PCG_KeepOuts; Transform Points (Rotation Z 0 to 360, Scale 0.8 to 1.2, Offset Z -10 to -30); a Static Mesh Spawner with two trees and one shrub, weighted. Place a PCG Volume with it over the district and Generate. You see parks with clusters and glades, and no tree on a road, a lane or in a corridor.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "A landmark you can steer by", "uk": "Орієнтир, за яким можна триматися курсу"}, "minutes": 40, "goals": [{"en": "Build a landmark after real photos that reads from drone height: tall, a unique silhouette, lit at night.", "uk": "Збудуй орієнтир за справжніми фото, що читається з висоти дрона: високий, з унікальним силуетом, освітлений уночі."}, {"en": "Spawn small features in the square from points in the rules.", "uk": "Породжуй на площі дрібні елементи з точок у правилах."}, {"en": "Test it from the streets that lead to it, as on Day 90.", "uk": "Перевір його з вулиць, що до нього ведуть, як у Дні 90."}], "doalong": [{"en": "From your three photos of the real landmark, note its height, its shape and its top (a spire, a dome, a lantern). Build it as an Actor Blueprint in /TechTools/District (for example BP_Landmark_Tower) from your kit pieces and Geometry Nodes props, at least twice as tall as the houses round it. You see a silhouette nothing else in the district has.", "uk": "За трьома фото справжнього орієнтира занотуй його висоту, форму й верхівку (шпиль, купол, ліхтар). Збудуй його як Actor Blueprint у /TechTools/District (наприклад, BP_Landmark_Tower) із деталей твого набору та пропсів Geometry Nodes, щонайменше вдвічі вищий за будинки навколо. Ти бачиш силует, якого більше немає в районі."}, {"en": "Give its top a mesh with MI_LampGlow (Day 64), so MPC_World's Night lights it. Set it as Landmark Class in DA_TownRules_District and Regenerate. You see the landmark in the real square.", "uk": "Дай його верхівці меш із MI_LampGlow (День 64), щоб Night з MPC_World її освітлював. Постав його як Landmark Class у DA_TownRules_District і зроби Regenerate. Ти бачиш орієнтир на справжній площі."}, {"en": "Add to PDA_TownRules Feature Points (Vector array, m) and Feature Class (Actor class); fill two or three points in the square and a fountain or statue Blueprint from your kit. Copy Spawn Landmark as Spawn Features: For Each over Feature Points: world point = Get Actor Location + the point x 100; skip it when Is In Corridor (that point, Radius 200) says true; trace to the ground, Spawn Actor from Class (Feature Class), Add to Spawned. Call it after Spawn Landmark. You see the square furnished.", "uk": "Додай у PDA_TownRules Feature Points (масив Vector, м) і Feature Class (клас Actor); заповни дві-три точки на площі та Blueprint фонтана чи статуї з твого набору. Скопіюй Spawn Landmark як Spawn Features: For Each по Feature Points: світова точка = Get Actor Location + точка x 100; пропусти її, коли Is In Corridor (ця точка, Radius 200) каже true; трасуй до землі, Spawn Actor from Class (Feature Class), Add до Spawned. Виклич його після Spawn Landmark. Ти бачиш умебльовану площу."}, {"en": "Fly to the far end of three streets that lead to the square and look along them. You see the landmark at the end of each; if a house hides it, raise Square Radius by 5 m and Regenerate; if a feature hides it, move that Feature Point.", "uk": "Прольоти до дальнього кінця трьох вулиць, що ведуть на площу, і подивись уздовж них. Ти бачиш орієнтир наприкінці кожної; якщо його ховає будинок, збільш Square Radius на 5 м і зроби Regenerate; якщо його ховає елемент, перемісти цю Feature Point."}], "play": {"en": "Steer by it: the tutor describes four landmarks (a tower the same height as the houses; a bright red dome in a white town; a tall mast hidden in a courtyard; a lit spire at dusk). For each I say whether a drone pilot could steer by it, and what I would change.", "uk": "Орієнтуйся за ним: тьютор описує чотири орієнтири (вежа тієї самої висоти, що й будинки; яскраво-червоний купол у білому місті; висока щогла, схована у дворі; освітлений шпиль у сутінках). Для кожного я кажу, чи міг би пілот дрона за ним орієнтуватися, і що слід змінити."}, "video": {"search": "level design landmarks wayfinding visibility"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: A landmark you can steer by (Day 104, lesson 3 of 4).\nToday's build: The dressed district: PCG_StreetDresser over L_District, BP_GreenZone outlines grown by PCG_DistrictGreen, a landmark and square features from the rules, and KO_Corridor01 to 03 kept clear by every generator.\nEarlier today I already did: lesson 1 (Dressing a real street); lesson 2 (Parks and gardens: BP_GreenZone and PCG_DistrictGreen). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Build a landmark after real photos that reads from drone height: tall, a unique silhouette, lit at night.\n2. Spawn small features in the square from points in the rules.\n3. Test it from the streets that lead to it, as on Day 90.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Steer by it: the tutor describes four landmarks (a tower the same height as the houses; a bright red dome in a white town; a tall mast hidden in a courtyard; a lit spire at dusk). For each I say whether a drone pilot could steer by it, and what I would change.\n4. Do-along on today's build (The street dressing, the green zones and PCG_DistrictGreen (built in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - From your three photos of the real landmark, note its height, its shape and its top (a spire, a dome, a lantern). Build it as an Actor Blueprint in /TechTools/District (for example BP_Landmark_Tower) from your kit pieces and Geometry Nodes props, at least twice as tall as the houses round it. You see a silhouette nothing else in the district has.\n   - Give its top a mesh with MI_LampGlow (Day 64), so MPC_World's Night lights it. Set it as Landmark Class in DA_TownRules_District and Regenerate. You see the landmark in the real square.\n   - Add to PDA_TownRules Feature Points (Vector array, m) and Feature Class (Actor class); fill two or three points in the square and a fountain or statue Blueprint from your kit. Copy Spawn Landmark as Spawn Features: For Each over Feature Points: world point = Get Actor Location + the point x 100; skip it when Is In Corridor (that point, Radius 200) says true; trace to the ground, Spawn Actor from Class (Feature Class), Add to Spawned. Call it after Spawn Landmark. You see the square furnished.\n   - Fly to the far end of three streets that lead to the square and look along them. You see the landmark at the end of each; if a house hides it, raise Square Radius by 5 m and Regenerate; if a feature hides it, move that Feature Point.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Corridors: clear by rule, proved by flight", "uk": "Коридори: вільні за правилом, доведені польотом"}, "minutes": 40, "goals": [{"en": "Feed the same corridors to every generator: the plots, the street dresser and the green graph.", "uk": "Подай однакові коридори кожному генератору: ділянкам, вуличному оздоблювачу та зеленому графу."}, {"en": "Prove them clear by flying LaneGauge along each.", "uk": "Доведи, що вони вільні, пролетівши LaneGauge вздовж кожного."}, {"en": "Measure what the dressing costs, ready for Day 107.", "uk": "Виміряй, чого коштує оздоблення, готуючись до Дня 107."}], "doalong": [{"en": "Check that your corridors (KO_Corridor01, 02 and 03 if you made one) carry the tag KeepOutWide and sit in BP_DistrictGenerator's Keep Outs. Open PCG_StreetDresser and PCG_DistrictGreen and confirm PCG_KeepOuts on the lamp, tree and green branches. You see one rule fed to three generators.", "uk": "Перевір, що твої коридори (KO_Corridor01, 02 і 03, якщо він у тебе є) несуть тег KeepOutWide і лежать у Keep Outs BP_DistrictGenerator. Відкрий PCG_StreetDresser і PCG_DistrictGreen і переконайся, що PCG_KeepOuts стоїть на гілках ліхтарів, дерев і зелені. Ти бачиш одне правило, подане трьом генераторам."}, {"en": "Regenerate the district and Generate both PCG volumes. Fly LaneGauge (4 x 4 x 4 m) along each corridor at 15 m. You see it touch nothing; if a tree or lamp blocks it, check that branch's keep-out.", "uk": "Зроби Regenerate для району й Generate для обох об'ємів PCG. Прольоти LaneGauge (4 x 4 x 4 м) уздовж кожного коридору на висоті 15 м. Ти бачиш, що він нічого не зачіпає; якщо дерево чи ліхтар його блокує, перевір keep-out цієї гілки."}, {"en": "Read stat unit from 120 m, and the instance counts: the summary line, and each PCG volume's generated components and their instance counts (in the Outliner or Details, as on Day 85). You see what the dressing costs; write it in district_notes.md.", "uk": "Прочитай stat unit зі 120 м і кількості інстансів: підсумковий рядок і згенеровані компоненти кожного об'єму PCG та їхні кількості інстансів (в Outliner чи Details, як у Дні 85). Ти бачиш, чого коштує оздоблення; запиши це в district_notes.md."}, {"en": "If the frame is over 16.6 ms, name your biggest suspect (trees? lamp lights? prop shadows?) for Day 107 with your Day 91 cost-by-subtraction method. You see a measured to-do, not a guess.", "uk": "Якщо кадр довший за 16.6 мс, назви свого найбільшого підозрюваного (дерева? світло ліхтарів? тіні пропсів?) для Дня 107 за методом вартості відніманням із Дня 91. Ти бачиш виміряне завдання, а не здогад."}], "play": {"en": "Who guards the corridor? The tutor describes four things found in a corridor (a lamp from the dresser; a house from the generator; a tree from PCG_DistrictGreen; a fountain from Spawn Features). For each I name the rule that should have kept it out, and where I would fix it.", "uk": "Хто охороняє коридор? Тьютор описує чотири речі, знайдені в коридорі (ліхтар з оздоблювача; будинок із генератора; дерево з PCG_DistrictGreen; фонтан із Spawn Features). Для кожної я називаю правило, що мало її не пустити, і де я це виправлю."}, "video": {"search": "unreal engine pcg difference exclusion spline keep out"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Corridors: clear by rule, proved by flight (Day 104, lesson 4 of 4).\nToday's build: The dressed district: PCG_StreetDresser over L_District, BP_GreenZone outlines grown by PCG_DistrictGreen, a landmark and square features from the rules, and KO_Corridor01 to 03 kept clear by every generator.\nEarlier today I already did: lesson 1 (Dressing a real street); lesson 2 (Parks and gardens: BP_GreenZone and PCG_DistrictGreen); lesson 3 (A landmark you can steer by). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Feed the same corridors to every generator: the plots, the street dresser and the green graph.\n2. Prove them clear by flying LaneGauge along each.\n3. Measure what the dressing costs, ready for Day 107.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Who guards the corridor? The tutor describes four things found in a corridor (a lamp from the dresser; a house from the generator; a tree from PCG_DistrictGreen; a fountain from Spawn Features). For each I name the rule that should have kept it out, and where I would fix it.\n4. Do-along on today's build (The street dressing, the green zones and PCG_DistrictGreen (built in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Check that your corridors (KO_Corridor01, 02 and 03 if you made one) carry the tag KeepOutWide and sit in BP_DistrictGenerator's Keep Outs. Open PCG_StreetDresser and PCG_DistrictGreen and confirm PCG_KeepOuts on the lamp, tree and green branches. You see one rule fed to three generators.\n   - Regenerate the district and Generate both PCG volumes. Fly LaneGauge (4 x 4 x 4 m) along each corridor at 15 m. You see it touch nothing; if a tree or lamp blocks it, check that branch's keep-out.\n   - Read stat unit from 120 m, and the instance counts: the summary line, and each PCG volume's generated components and their instance counts (in the Outliner or Details, as on Day 85). You see what the dressing costs; write it in district_notes.md.\n   - If the frame is over 16.6 ms, name your biggest suspect (trees? lamp lights? prop shadows?) for Day 107 with your Day 91 cost-by-subtraction method. You see a measured to-do, not a guess.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "dressing_plan.md and district_notes.md", "uk": "dressing_plan.md і district_notes.md"}, {"en": "dressed_120m.png, park_10m.png, landmark_street.png and night_120m.png", "uk": "dressed_120m.png, park_10m.png, landmark_street.png і night_120m.png"}, {"en": "clip_day104.mp4 (60 seconds: along a corridor, over a park, round the landmark)", "uk": "clip_day104.mp4 (60 секунд: уздовж коридору, над парком, навколо орієнтира)"}, {"en": "summary.md", "uk": "звіт дня (summary.md)"}], "goal": {"en": "By the end of today you have a dressed district: PCG_StreetDresser on every real street, the map's parks and gardens grown by PCG_DistrictGreen inside BP_GreenZone outlines, a landmark built after the real one with small features in its square, and two or three flight corridors kept clear of every prop, tree and house.", "uk": "До кінця сьогодні ти маєш оздоблений район: PCG_StreetDresser на кожній справжній вулиці, парки й сади з мапи, вирощені PCG_DistrictGreen усередині контурів BP_GreenZone, орієнтир, збудований за справжнім, із дрібними елементами на його площі, і два-три польотні коридори, вільні від будь-яких пропсів, дерев і будинків."}, "uses": [{"en": "Day 103: BP_DistrictGenerator's core, Make Plots and Too Close", "uk": "День 103: ядро BP_DistrictGenerator, Make Plots і Too Close"}, {"en": "Day 85: PCG_StreetDresser, Kerb Offset, Slot Spacing and Tree Chance", "uk": "День 85: PCG_StreetDresser, Kerb Offset, Slot Spacing і Tree Chance"}, {"en": "Day 84: PCG_KeepOuts and graph parameters", "uk": "День 84: PCG_KeepOuts і параметри графа"}, {"en": "Day 102: DA_TownRules_District, the corridors and your photos of the real place", "uk": "День 102: DA_TownRules_District, коридори та твої фото справжнього місця"}, {"en": "Day 64: MI_LampGlow and MPC_World's Night", "uk": "День 64: MI_LampGlow і Night з MPC_World"}], "quiz": [{"q": {"en": "PCG_DistrictGreen places no trees at all inside your green zones. What do you check first?", "uk": "PCG_DistrictGreen не ставить жодного дерева всередині твоїх зелених зон. Що ти перевіряєш першим?"}, "options": [{"en": "The seed", "uk": "Зерно"}, {"en": "That each zone's spline is a closed loop, because Create Surface From Spline needs a closed outline", "uk": "Що сплайн кожної зони — замкнений цикл, бо Create Surface From Spline потребує замкненого контуру"}, {"en": "The landmark", "uk": "Орієнтир"}, {"en": "Tree Chance on the dresser", "uk": "Tree Chance на оздоблювачі"}], "answer": 1, "explain": {"en": "An open spline makes no surface, so the sampler has nowhere to put points.", "uk": "Розімкнений сплайн не дає поверхні, тож семплеру ніде ставити точки."}}, {"q": {"en": "Why does the generator drop plots inside green zones?", "uk": "Чому генератор відкидає ділянки всередині зелених зон?"}, "options": [{"en": "So houses don't stand in the parks the map shows", "uk": "Щоб будинки не стояли в парках, які показує мапа"}, {"en": "To save memory", "uk": "Щоб заощадити пам'ять"}, {"en": "Because PCG needs empty plots", "uk": "Бо PCG потребує порожніх ділянок"}, {"en": "To make the streets wider", "uk": "Щоб зробити вулиці ширшими"}], "answer": 0, "explain": {"en": "The zones come from the real map; the generator and the green graph read the same outlines.", "uk": "Зони беруться зі справжньої мапи; генератор і зелений граф читають ті самі контури."}}, {"q": {"en": "Trees grow on a lane that crosses a park. What fixes it by rule?", "uk": "На провулку, що перетинає парк, ростуть дерева. Що виправляє це за правилом?"}, "options": [{"en": "Delete those trees by hand", "uk": "Видалити ці дерева вручну"}, {"en": "Pick a new seed", "uk": "Вибрати нове зерно"}, {"en": "A road keep-out in PCG_DistrictGreen: PCG_RoadClear for the tag Road", "uk": "Keep-out для доріг у PCG_DistrictGreen: PCG_RoadClear для тега Road"}, {"en": "Make the park smaller", "uk": "Зробити парк меншим"}], "answer": 2, "explain": {"en": "Hand fixes vanish at the next Generate; a keep-out rule holds for every seed.", "uk": "Виправлення вручну зникають при наступному Generate; правило keep-out діє для кожного зерна."}}, {"q": {"en": "What makes a landmark readable from drone height?", "uk": "Що робить орієнтир читабельним з висоти дрона?"}, "options": [{"en": "Bright textures on every side", "uk": "Яскраві текстури з усіх боків"}, {"en": "Many small details", "uk": "Багато дрібних деталей"}, {"en": "A sign with its name", "uk": "Табличка з його назвою"}, {"en": "A unique silhouette, clearly taller than its neighbours, visible down the streets that lead to it, and lit at night", "uk": "Унікальний силует, помітно вищий за сусідів, видимий уздовж вулиць, що до нього ведуть, і освітлений уночі"}], "answer": 3, "explain": {"en": "Pilots steer by shape and height; detail disappears at 60 m, a silhouette does not.", "uk": "Пілоти орієнтуються за формою й висотою; деталі зникають на 60 м, а силует — ні."}}, {"q": {"en": "What is the clash order in your dressing plan?", "uk": "Який порядок конфліктів у твоєму плані оздоблення?"}, "options": [{"en": "Greenery first, then everything else", "uk": "Спершу зелень, потім усе інше"}, {"en": "Corridors first, then roads, houses, and greenery last", "uk": "Спершу коридори, потім дороги, будинки, а зелень останньою"}, {"en": "Houses first", "uk": "Спершу будинки"}, {"en": "Whatever the seed picks", "uk": "Те, що вибере зерно"}], "answer": 1, "explain": {"en": "Safety and use come first: a corridor must stay clear even if a tree or a house would look nice there.", "uk": "Безпека й користь на першому місці: коридор має лишатися вільним, навіть якщо дерево чи будинок там виглядали б гарно."}}], "weekInfo": null, "morning": {"sofar": {"en": "BP_DistrictGenerator builds your real street plan: roads, junction tables, plots along curved streets and grounded houses, from one seed.", "uk": "BP_DistrictGenerator будує твій справжній план вулиць: дороги, майданчики перехресть, ділянки вздовж кривих вулиць і закріплені на землі будинки, з одного зерна."}, "today": {"en": "You dress it: furnished streets, parks from the map, a landmark built after the real one, and corridors kept clear for flying.", "uk": "Ти оздоблюєш його: умебльовані вулиці, парки з мапи, орієнтир за справжнім і коридори, вільні для польоту."}, "cheer": {"en": "This is the day the district starts to feel lived-in; fly it slowly at dusk and enjoy what your code has built.", "uk": "Цього дня район починає здаватися обжитим; прольоти ним неквапливо в сутінках і насолодись тим, що збудував твій код."}, "quote": {"text": {"en": "I think that I shall never see / A poem lovely as a tree.", "uk": "Мені здається, я ніколи не побачу вірша, прекраснішого за дерево."}, "author": {"en": "Joyce Kilmer", "uk": "Джойс Кілмер"}, "source": "Trees (poem), Poetry magazine, August 1913"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-104-district-dressing-parks-corridors", "mapHref": "../../COURSE.html", "prevHref": "../Day-103-district-generator-core/START-HERE.html", "nextHref": "../Day-105-boss-district-generator-v1/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8 (PCG and Blueprints). I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me: when my Blueprint or script fails, ask for the error message or a screenshot of the graph, point to the line or node that is wrong and explain why, then let me fix it myself. Never write the whole tool for me. Keep me moving and make it feel like a game.\n\nToday I build on my own: The landmark, the square features and the corridor flights, on your own.\nIt's part of: The dressed district: PCG_StreetDresser over L_District, BP_GreenZone outlines grown by PCG_DistrictGreen, a landmark and square features from the rules, and KO_Corridor01 to 03 kept clear by every generator (L_District; PCG_DistrictGreen and PCG_RoadClear in /TechTools/PCG; BP_GreenZone and your landmark Blueprint (named after the real one, for example BP_Landmark_Tower) in /TechTools/District.).\n\nSpec:\n- dressing_plan.md first: what the real streets hold (from your photos), the parks and gardens from the map, the landmark and its three photos, two or three square features (a fountain, a statue, a kiosk), the corridors, and the clash order: corridors first, roads second, houses third, greenery last.\n- PCG_StreetDresser on a PCG Volume over the whole district (Location 10000, 10000, 0; Scale 110, 110, 30) set as the generator's Dresser; Kerb Offset 0, 500, 12.5; props on the pavements of every BP_Road, none on carriageways or lanes, and no lamp, tree, bench, bin or bollard on a junction table or in its mouth (its KeepOutWide and KeepOutJunction tags).\n- BP_GreenZone: an Actor with a closed Spline Outline drawn as a circle of 8 points from Radius (m, 5 to 60, default 15) in its Construction Script (Set Closed Loop), the actor tag Green; one zone per park or garden on the map, scaled into an oval where needed; the generator's Green Zones (BP_GreenZone array) drop every plot whose centre lies inside a zone.\n- PCG_DistrictGreen: Get Spline Data (By Tag, Green) > Create Surface From Spline > Surface Sampler > Spatial Noise (Perlin2D) and a Density Filter (clusters with glades, not a carpet) > PCG_RoadClear (PCG_KeepOuts duplicated for the tag Road, which every BP_Road and BP_Lane carries, keeping its 7 m Bounds Modifier) > PCG_KeepOuts > Transform Points (any turn, scale 0.8 to 1.2, sunk 10 to 30 cm) > a Static Mesh Spawner with two tree kinds and one shrub, weighted; seeded; nothing floating.\n- The landmark, built after three real photos from your kit and Geometry Nodes pieces, at least twice as tall as its neighbours, with a top in MI_LampGlow that lights with MPC_World's Night, set as Landmark Class in DA_TownRules_District; PDA_TownRules gains Feature Points (Vector array, m) and Feature Class (Actor class), and Spawn Features places them (metres from the generator), traced to the ground, in the square, skipping any in a corridor.\n- KO_Corridor01 to 03 in the generator's Keep Outs and read by PCG_KeepOuts on the dresser's lamp and tree branches and in PCG_DistrictGreen; LaneGauge flies each one at 15 m touching nothing; Check Town at 0 problems.\n- district_notes.md: stat unit from 120 m and the instance counts (the summary line and each PCG volume's generated instances), with the biggest suspect named for Day 107 if the frame is over budget.\n\nMy checklist:\n1. Write dressing_plan.md: what the real streets hold, the parks and gardens, the landmark with three photos, the square features, the corridors and the clash order. Check: every item has a place marked on map_box.png. (from lesson 1)\n2. Place the PCG Volume with PCG_StreetDresser over the district, set Kerb Offset 0, 500, 12.5, set it as Dresser and Regenerate. Check: lamps, benches, bins and street trees on the pavements of the main streets, none on carriageways or lanes, and no lamp, tree, bench, bin or bollard on a junction table or in its mouth. (from lesson 1)\n3. Place BP_GreenZone outlines over the map's parks and gardens, add them to Green Zones and Regenerate. Check: no house stands inside a zone. (from lesson 2)\n4. Add a PCG Volume with PCG_DistrictGreen over the district and Generate. Check: clusters of trees and shrubs with glades between them, inside the zones only, none on a road or lane, nothing floating. (from lesson 2)\n5. Change the green volume's Seed, then set it back. Check: different clusters inside the same zones, and the old seed brings the old clusters back. (from lesson 2)\n6. On your own: build your landmark Blueprint after the three photos, set it as Landmark Class and Regenerate. Check: it stands in the square, at least twice as tall as its neighbours, and you can see it from the far end of three streets that lead to it. (from lesson 3)\n7. On your own: add Feature Points and Feature Class to the rules and Spawn Features to Regenerate. Check: a fountain, statue or kiosk stands on the ground in the square, not on a road and not in a corridor. (from lesson 3)\n8. Check that KO_Corridor01 to 03 are in Keep Outs and in the PCG graphs' keep-out branches; Regenerate and Generate both volumes. Check: LaneGauge flies each corridor at 15 m touching nothing. (from lesson 4)\n9. Click Check Town. Check: 0 problems. (from day 90, lesson 2)\n10. Night test: set MPC_World's Night to 1, or drop the sun below the horizon and update a lamp. Check: the landmark's top and the street lanterns glow; take night_120m.png. (from day 64, lesson 1)\n11. Read stat unit from 120 m and the instance counts (the summary line, and each PCG volume's generated instances, as on Day 85). Check: the numbers are in district_notes.md, with the frame under 16.6 ms or the biggest suspect named for Day 107. (from lesson 4)\n12. Commit and push ('District dressing: streets, parks, landmark, corridors'). Take dressed_120m.png, park_10m.png and landmark_street.png. Record clip_day104.mp4 (60 seconds): a drone flight along a corridor, over a park and round the landmark. Check: three pictures and the clip in today's Work folder. (from lesson 4)\n13. Click Copy the day report, paste it into a new tutor chat, answer its questions and save its answer as summary.md. Check: summary.md is in today's Work folder with Made, To look at, Hours and To revisit filled in. (from lesson 1)\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Misha\nDay 104: Dressing the district: street props, parks, a landmark and clear corridors. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

const lk=s=>esc(s).replace(/https?:\/\/[^\s<']*[^\s<.,;:)']/g,m=>'<a href="'+m+'" target="_blank" rel="noopener">'+m+'</a>');
function list(a,tag,cls){return '<'+tag+(cls?' class="'+cls+'"':'')+'>'+(a||[]).map(i=>'<li>'+lk(x(i))+'</li>').join('')+'</'+tag+'>'}
const lab=(t,k)=>'<div class="lab'+(k?' k-'+k:'')+'"><span class="dotc"></span>'+t+'</div>';
const kn=n=>'<span class="kn">'+ic(n)+'</span>';
const slider=p=>'<div class="slider"><i style="width:calc('+p+'% - 6px)"></i><b style="left:clamp(13px,'+p+'%,calc(100% - 13px))"></b></div>';
function quiz(){if(!D.quiz||!D.quiz.length)return '';const a=st.qa||{};let ok=0;const L=u('letters');
 const pips='<div class="pips well" aria-hidden="true">'+D.quiz.map((q,i)=>'<i class="'+(a[i]==null?'':a[i]===q.answer?'r':'w')+'"></i>').join('')+'</div>';
 const qs=D.quiz.map((q,i)=>{const c=a[i];if(c===q.answer)ok++;return '<div class="qz"><p class="qq"><span class="qn">'+(i+1)+'</span><span>'+lk(x(q.q))+'</span></p>'+q.options.map((o,k)=>{let cls='opt',mk='<span></span>';if(c!=null){if(k===q.answer){cls+=' right';mk=ic('check','mk')}else if(k===c){cls+=' wrong';mk=ic('x','mk')}}return '<button class="'+cls+'" id="o'+i+'_'+k+'"'+(c!=null?' disabled':'')+' onclick="pick('+i+','+k+')"><span class="lt">'+(L[k]||k+1)+'</span><span>'+esc(x(o))+'</span>'+mk+'</button>'}).join('')+(c!=null?'<p class="exp '+(c===q.answer?'r':'w')+'" id="e'+i+'" tabindex="-1"><b>'+(c===q.answer?u('right'):u('wrong'))+'</b>'+lk(x(q.explain))+'</p>':'')+'</div>'}).join('');
 return '<section class="card glass quiz">'+lab(u('quiz'),'gold')+'<p class="muted" style="margin:-6px 0 14px">'+u('quizSub')+'</p>'+pips+qs+(qDone()?'<div class="score well" role="status"><span class="eyebrow">'+u('score')+'</span><span class="lcd" aria-label="'+ok+' / '+D.quiz.length+'">'+seg(ok+'/'+D.quiz.length)+'</span><div class="row"><button class="btn ghost" id="retry" onclick="retry()">'+u('retry')+'</button></div></div>':'')+'</section>'}
function vid(v){if(!v)return '';const link=v.url?'<a href="'+esc(v.url)+'" target="_blank" rel="noopener">'+esc(x(v.title)||v.url)+'</a>'+(v.channel?' <span class="muted">· '+esc(v.channel)+(v.length?' · '+esc(v.length):'')+'</span>':''):'';const s=v.search?'<a href="https://www.youtube.com/results?search_query='+encodeURIComponent(v.search)+'" target="_blank" rel="noopener">'+u('noVid')+': '+esc(v.search)+'</a>':'';const alt=v.alt&&v.alt.url?'<br><span class="eyebrow">UA</span> <a href="'+esc(v.alt.url)+'" target="_blank" rel="noopener">'+esc(v.alt.title||v.alt.url)+'</a>'+(v.alt.channel?' <span class="muted">· '+esc(v.alt.channel)+'</span>':''):'';return '<div class="vid well">'+kn('play')+'<div><b>'+u('more')+'?</b><br>'+(link||s)+alt+(link&&s?'<br><span class="muted" style="font-size:14px">'+s+'</span>':'')+'</div></div>'}
function morning(){const m=D.morning;if(!m)return '';const q=m.quote||{};
 let shelf='';if(D.day>0){shelf='<div class="shelf" aria-hidden="true">';let g='';for(let d=0;d<D.day;d++){let p=0;try{p=(JSON.parse(localStorage.getItem('devteam:'+D.learner+':'+d))||{}).pct||0}catch(e){}g+='<i class="'+(p>=1?'d':'')+(d>0&&d%5===0?' bs':'')+'"></i>';if(d%5===0||d===D.day-1){shelf+='<span class="wkg">'+g+'</span>';g=''}}shelf+='</div>'}
 const qt=lang==='uk'&&q.original?q.original:x(q.text);
 return '<section class="card glass morning"><div class="mgrid">'+(m.sofar?'<div>'+lab(u('sofar'),'gold')+shelf+'<p class="mtxt">'+lk(x(m.sofar))+'</p></div>':'')+(m.today?'<div>'+lab(u('todayL'))+'<p class="mtxt">'+lk(x(m.today))+'</p></div>':'')+'</div>'+(m.cheer?'<p class="cheer">'+esc(x(m.cheer))+'</p>':'')+(qt?'<figure class="quote well">'+kn('quote')+'<blockquote>'+esc(qt)+'</blockquote>'+(q.author?'<figcaption>'+esc(x(q.author))+'</figcaption>':'')+'</figure>':'')+'</section>'}
function setLang(l){lang=l;try{localStorage.setItem('devteam:lang',lang)}catch(e){};render()}
function toggleLang(){setLang(lang==='uk'?'en':'uk')}
/* keep open sections and keyboard focus across re-renders */
const openD=new Set();
function tg(e){if(e.open)openD.add(e.id);else openD.delete(e.id)}
const op=id=>openD.has(id)?' open':'';
function render(){const ae=document.activeElement,fid=ae&&(ae.id||(ae.getAttribute('data-th')?'th-'+ae.getAttribute('data-th'):ae.getAttribute('lang')&&ae.closest('.seg')?'lg-'+ae.getAttribute('lang'):''));
 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);
 const b=D.build,P=Math.round(prog()*100);
 document.getElementById('top').innerHTML='<div class="topin glass"><a class="maplink" href="'+esc(D.mapHref)+'">'+kn('map')+u('map')+'</a><div class="crumb"><b>'+esc(x(D.learnerName))+'</b><span>'+u('week')+' '+D.week+'</span><span>'+u('day')+' '+D.day+' '+u('of')+' '+D.total+'</span></div>'+controls(lang,'setLang')+'</div><div class="tline"><i style="width:'+P+'%"></i></div>';
 const state=w=>w<D.week?'b':w===D.week?'n':'p';
 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 if(D.weekInfo){const w=D.weekInfo;h+='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}
 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p><div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+list(D.handin,'ul','ticks')+'<p class="path">'+ic('folder')+'<span>'+u('shipTo')+' <code>'+esc(D.workPath)+'</code></span></p>'+(D.lessons.length?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<p class="muted">'+u('report')+'</p><div class="row"><button class="btn s" onclick="cp(D.reportPrompt)">'+ic('copy')+u('copyR')+'</button></div></section>';
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();
</script>

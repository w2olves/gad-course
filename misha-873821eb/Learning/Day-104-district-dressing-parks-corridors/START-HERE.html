<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 104</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

}, "spec": [{"en": "dressing_plan.md first: what the real streets hold (from your photos), the parks and gardens from the map, the landmark (Gold: with three photos), two or three square features (a fountain, a statue, a kiosk), the corridors, and the clash order: corridors first, roads second, houses third, greenery last.", "uk": "Спершу dressing_plan.md: що є на справжніх вулицях (з твоїх фото), парки й сади з мапи, орієнтир (Золото: із трьома фото), два-три об'єкти площі (фонтан, статуя, кіоск), коридори і порядок пріоритетів: спершу коридори, потім дороги, потім будинки, зелень — остання."}, {"en": "PCG_StreetDresser on a PCG Volume over the whole district (Location 10000, 10000, 0; Scale 110, 110, 30) set as the generator's Dresser; Kerb Offset 0, 500, 12.5; props on the pavements of every BP_Road, none on carriageways or lanes, and no lamp, tree, bench, bin or bollard on a junction table or in its mouth (its KeepOutWide and KeepOutJunction tags).", "uk": "PCG_StreetDresser на PCG Volume над усім районом (Location 10000, 10000, 0; Scale 110, 110, 30), заданий як Dresser генератора; Kerb Offset 0, 500, 12.5. Пропси стоять на тротуарах кожного BP_Road, жодного на проїзній частині чи в провулках. Жоден ліхтар, дерево, лавка, урна чи стовпчик не стоїть на майданчику перехрестя чи на в'їзді до нього (теги KeepOutWide і KeepOutJunction)."}, {"en": "BP_GreenZone: an Actor with a closed Spline Outline drawn as a circle of 8 points from Radius (m, 5 to 60, default 15) in its Construction Script (Set Closed Loop), the actor tag Green; one zone per park or garden on the map, scaled into an oval where needed; the generator's Green Zones (BP_GreenZone array) drop every plot whose centre lies inside a zone.", "uk": "BP_GreenZone: Actor із замкненим Spline з назвою Outline, який Construction Script малює колом із 8 точок за Radius (м, 5–60, типово 15) (Set Closed Loop), тег актора Green. По одній зоні на кожен парк чи сад із мапи, за потреби розтягнутій в овал. Green Zones генератора (масив BP_GreenZone) відкидають кожну ділянку, чий центр лежить у зоні."}, {"en": "PCG_DistrictGreen: Get Spline Data (By Tag, Green) > Create Surface From Spline > Surface Sampler > Spatial Noise (Perlin2D) and a Density Filter (clusters with glades, not a carpet) > PCG_RoadClear (PCG_KeepOuts duplicated for the tag Road, which every BP_Road and BP_Lane carries, keeping its 7 m Bounds Modifier) > PCG_KeepOuts > Transform Points (any turn, scale 0.8 to 1.2, sunk 10 to 30 cm) > a Static Mesh Spawner with two tree kinds and one shrub, weighted; seeded; nothing floating.", "uk": "PCG_DistrictGreen: Get Spline Data (By Tag, Green) > Create Surface From Spline > Surface Sampler > Spatial Noise (Perlin2D) і Density Filter (купки з галявинами, а не килим) > PCG_RoadClear (копія PCG_KeepOuts для тегу Road, який мають кожен BP_Road і BP_Lane, з Bounds Modifier 7 м) > PCG_KeepOuts > Transform Points (будь-який поворот, масштаб 0,8–1,2, заглиблення на 10–30 см) > Static Mesh Spawner із двома видами дерев і одним кущем, з вагами. Із зерном; ніщо не висить у повітрі."}, {"en": "The landmark: a tall kit tower or a tall child of BP_Building (Gold: built after three real photos from your kit and Geometry Nodes pieces), at least twice as tall as its neighbours, with a top in MI_LampGlow that lights with MPC_World's Night, set as Landmark Class in DA_TownRules_District; PDA_TownRules gains Feature Points (Vector array, m) and Feature Class (Actor class), and Spawn Features places them (metres from the generator), traced to the ground, in the square, skipping any in a corridor.", "uk": "Орієнтир: висока вежа з набору або високий дочірній BP_Building (Золото: збудований за трьома справжніми фото з деталей набору й Geometry Nodes), щонайменше вдвічі вищий за сусідів, з верхівкою в MI_LampGlow, що світиться від Night у MPC_World. Заданий як Landmark Class у DA_TownRules_District. PDA_TownRules отримує Feature Points (масив Vector, м) і Feature Class (клас Actor), а Spawn Features ставить їх (метри від генератора) з трасуванням до ґрунту на площі, пропускаючи ті, що в коридорі."}, {"en": "KO_Corridor01 to 03 in the generator's Keep Outs and read by PCG_KeepOuts on the dresser's lamp and tree branches and in PCG_DistrictGreen; LaneGauge flies each one at 15 m touching nothing; Check Town at 0 problems.", "uk": "KO_Corridor01–03 є в Keep Outs генератора, їх читає PCG_KeepOuts на гілках ліхтарів і дерев розставляння та в PCG_DistrictGreen. LaneGauge пролітає кожен на 15 м, нічого не торкаючись. Check Town показує 0 проблем."}, {"en": "A heading Day 104 in techtools_notes.md: stat unit from 120 m and the instance counts (the summary line and each PCG volume's generated instances), with the biggest suspect named for Day 107 if the frame is over budget.", "uk": "Заголовок Day 104 у techtools_notes.md: stat unit з 120 м і кількість інстансів (підсумковий рядок і згенеровані інстанси кожного об'єму PCG). Якщо кадр за бюджетом, для Дня 107 названо найбільшого підозрюваного."}], "piece1": "The street dressing, the green zones and PCG_DistrictGreen (built in the lessons)", "piece2": {"en": "The landmark (a kit tower; Gold: built after photos), the square features and the corridor flights, on your own", "uk": "Орієнтир (вежа з набору; Золото: за фото), об'єкти площі і прольоти коридорів — самостійно"}, "steps": [{"text": {"en": "Check: the results of today's lessons are there (PCG_StreetDresser over L_District, BP_GreenZone and PCG_DistrictGreen with PCG_RoadClear). Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it. Weak PC (16 GB of RAM or less): shrink the PCG volumes to 100 x 100 m while you build and grow them for the final pictures (see the weak-PC section of ACCOUNTS-AND-INSTALLS.html). Write dressing_plan.md in today's Work folder: what the real streets hold, the parks and gardens, the landmark, the square features, the corridors and the clash order. Check: every item has a place marked on map_box.png.", "uk": "Перевір, чи є результати сьогоднішніх уроків: PCG_StreetDresser над L_District, BP_GreenZone і PCG_DistrictGreen з PCG_RoadClear. Чогось бракує? Пройди зараз кроки «Разом із тьютором» того уроку (близько 25 хвилин): самостійна частина спирається на них. Слабкий ПК (16 ГБ оперативної пам'яті чи менше): під час роботи зменш об'єми PCG до 100 × 100 м, а для фінальних картинок збільш (див. розділ про слабкі ПК в ACCOUNTS-AND-INSTALLS.html). Напиши dressing_plan.md у сьогоднішній папці Work: що є на справжніх вулицях, парки й сади, орієнтир, об'єкти площі, коридори і порядок пріоритетів. Перевірка: для кожного пункту місце позначено на map_box.png."}, "lesson": 1}, {"text": {"en": "Place the PCG Volume with PCG_StreetDresser over the district, set Kerb Offset 0, 500, 12.5, set it as Dresser and Regenerate. Check: lamps, benches, bins and street trees on the pavements of the main streets, none on carriageways or lanes, and no lamp, tree, bench, bin or bollard on a junction table or in its mouth.", "uk": "Постав над районом PCG Volume з PCG_StreetDresser, Kerb Offset 0, 500, 12.5, задай його як Dresser і клацни Regenerate. Перевірка: ліхтарі, лавки, урни й вуличні дерева на тротуарах головних вулиць, жодного на проїзній частині чи в провулках, і жоден ліхтар, дерево, лавка, урна чи стовпчик не стоїть на майданчику перехрестя чи на в'їзді до нього."}, "lesson": 1}, {"text": {"en": "Place BP_GreenZone outlines over the map's parks and gardens, add them to Green Zones and Regenerate. Check: no house stands inside a zone.", "uk": "Постав контури BP_GreenZone на парки й сади з мапи, додай їх у Green Zones і клацни Regenerate. Перевірка: жоден будинок не стоїть у зоні."}, "lesson": 2}, {"text": {"en": "Add a PCG Volume with PCG_DistrictGreen over the district and Generate. Check: clusters of trees and shrubs with glades between them, inside the zones only, none on a road or lane, nothing floating.", "uk": "Додай над районом PCG Volume з PCG_DistrictGreen і клацни Generate. Перевірка: купки дерев і кущів із галявинами між ними, лише всередині зон, жодних на дорозі чи в провулку, ніщо не висить у повітрі."}, "lesson": 2}, {"text": {"en": "Change the green volume's Seed, then set it back. Check: different clusters inside the same zones, and the old seed brings the old clusters back.", "uk": "Зміни Seed зеленого об'єму, потім поверни. Перевірка: в тих самих зонах інші купки, а старе зерно повертає старі."}, "lesson": 2}, {"text": {"en": "On your own: set a tall kit tower, or a tall child of BP_Building, as Landmark Class and Regenerate. Check: it stands in the square, at least twice as tall as its neighbours, and you can see it from the far end of three streets that lead to it.", "uk": "Самостійно: задай високу вежу з набору або високий дочірній BP_Building як Landmark Class і клацни Regenerate. Перевірка: він стоїть на площі, щонайменше вдвічі вищий за сусідів, і його видно з дальнього кінця трьох вулиць, що ведуть до нього."}, "lesson": 3}, {"text": {"en": "On your own: add Feature Points and Feature Class to the rules and Spawn Features to Regenerate. Check: a fountain, statue or kiosk stands on the ground in the square, not on a road and not in a corridor.", "uk": "Самостійно: додай у правила Feature Points і Feature Class, а в Regenerate — Spawn Features. Перевірка: фонтан, статуя чи кіоск стоїть на ґрунті на площі, не на дорозі й не в коридорі."}, "lesson": 3}, {"text": {"en": "Check that KO_Corridor01 to 03 are in Keep Outs and in the PCG graphs' keep-out branches; Regenerate and Generate both volumes. Check: LaneGauge flies each corridor at 15 m touching nothing.", "uk": "Перевір, чи KO_Corridor01–03 є в Keep Outs і в гілках зон-винятків графів PCG. Клацни Regenerate і Generate на обох об'ємах. Перевірка: LaneGauge пролітає кожен коридор на 15 м, нічого не торкаючись."}, "lesson": 4}, {"text": {"en": "Click Check Town. Check: 0 problems.", "uk": "Клацни Check Town. Перевірка: 0 проблем."}, "lesson": "D90.2"}, {"text": {"en": "Night test: set MPC_World's Night to 1, or drop the sun below the horizon and update a lamp. Check: the landmark's top and the street lanterns glow; take night_120m.png.", "uk": "Нічний тест: постав Night у MPC_World на 1 або опусти сонце за горизонт і онови ліхтар. Перевірка: верхівка орієнтира і вуличні ліхтарі світяться. Зроби скриншот night_120m.png."}, "lesson": "D64.1"}, {"text": {"en": "Read stat unit from 120 m and the instance counts (the summary line, and each PCG volume's generated instances, as on Day 85). Save L_District. Check: the numbers are under Day 104 in techtools_notes.md, with the frame under 16.6 ms or the biggest suspect named for Day 107.", "uk": "Прочитай stat unit з 120 м і кількість інстансів (підсумковий рядок і згенеровані інстанси кожного об'єму PCG, як у День 85). Збережи L_District. Перевірка: числа записано під Day 104 у techtools_notes.md, а кадр менший за 16,6 мс, або для Дня 107 названо найбільшого підозрюваного."}, "lesson": 4}, {"text": {"en": "Commit and push ('District dressing: streets, parks, landmark, corridors'). Take dressed_120m.png and park_10m.png. Check: the commit is on GitHub, and the two pictures and night_120m.png are in today's Work folder.", "uk": "Зроби коміт і надішли ('District dressing: streets, parks, landmark, corridors'). Зроби скриншоти dressed_120m.png і park_10m.png. Перевірка: коміт є на GitHub, а дві картинки й night_120m.png — у сьогоднішній папці Work."}, "lesson": 4}, {"text": {"en": "Click Copy the day report, paste it into a new tutor chat, answer its questions and save its answer as summary.md in today's Work folder. Drag summary.md, dressing_plan.md and the three pictures into today's hand-in folder (the button on this page); never a project or level folder. Check: the hand-in folder lists 5 files, each over 1 KB.", "uk": "Клацни «Копіювати звіт дня», встав у новий чат із тьютором, дай відповіді на його питання і збережи його відповідь як summary.md у сьогоднішній папці Work. Перетягни summary.md, dressing_plan.md і три картинки в папку здачі (кнопка на цій сторінці). Ніколи не перетягуй папку проєкту чи рівня. Перевірка: у папці здачі 5 файлів, кожен більший за 1 КБ."}, "lesson": 1}, {"text": {"en": "Gold (optional, after the hand-in): build your landmark Blueprint after three real photos, from your kit and Geometry Nodes pieces, with a top in MI_LampGlow; set it as Landmark Class and Regenerate. Check: it reads as the real landmark from the end of the main street, and its top glows at night.", "uk": "Золото (за бажанням, після здачі): збудуй Blueprint орієнтира за трьома справжніми фото з деталей набору й Geometry Nodes, з верхівкою в MI_LampGlow. Задай його як Landmark Class і клацни Regenerate. Перевірка: з кінця головної вулиці він впізнається як справжній орієнтир, а вночі його верхівка світиться."}, "lesson": 3}], "assets": ["techart/street-dimensions.md", "techart/standards-sheet.md"], "next": {"en": "On Friday (Day 105) generator v1 must rebuild all of this from one click and one seed, and on Day 106 polish rules add small stories to the streets.", "uk": "У п'ятницю (День 105) генератор v1 має відбудувати все це одним клацанням з одного зерна, а в День 106 правила доведення додадуть вулицям маленькі історії."}}, "lessons": [{"title": {"en": "Dressing a real street", "uk": "Обставляємо справжню вулицю"}, "minutes": 40, "goals": [{"en": "Plan the dressing from the real place: what its streets, gardens and square actually hold.", "uk": "Планувати обставляння за справжнім місцем: що насправді є на його вулицях, у садах і на площі."}, {"en": "Run PCG_StreetDresser over the whole district so every generated street is dressed.", "uk": "Запускати PCG_StreetDresser над усім районом, щоб обставити кожну згенеровану вулицю."}, {"en": "Set a clash order: corridors, roads, houses, then greenery.", "uk": "Задавати порядок пріоритетів: коридори, дороги, будинки, потім зелень."}], "doalong": [{"en": "Open your three photos and map_box.png. In dressing_plan.md list what the real streets hold (lamps every 20 m? trees? café tables?), where the parks and gardens are, what stands in the square, and where a drone would fly. You see a plan grounded in the real place.", "uk": "Відкрий свої три фото і map_box.png. У dressing_plan.md перелічи, що є на справжніх вулицях (ліхтарі кожні 20 м? дерева? столики кав'ярень?), де парки й сади, що стоїть на площі і де пролетів би дрон. Має вийти: план, що спирається на справжнє місце."}, {"en": "Write the clash order: corridors first (nothing inside them), roads second (nothing on carriageways), houses third, greenery last. You see which rule wins whenever two disagree.", "uk": "Запиши порядок пріоритетів: спершу коридори (у них нічого), потім дороги (на проїзній частині нічого), потім будинки, зелень — остання. Має вийти: видно, яке правило перемагає, коли два суперечать."}, {"en": "Place a PCG Volume over the district (Location 10000, 10000, 0; Scale 110, 110, 30), assign PCG_StreetDresser, set its Kerb Offset to 0, 500, 12.5 (the 12 m BP_Road, as on Day 89) and pick the volume as BP_DistrictGenerator's Dresser.", "uk": "Постав над районом PCG Volume (Location 10000, 10000, 0; Scale 110, 110, 30), признач PCG_StreetDresser, постав його Kerb Offset на 0, 500, 12.5 (BP_Road на 12 м, як у День 89) і вибери об'єм як Dresser у BP_DistrictGenerator."}, {"en": "Regenerate. You see props along every main street, because every BP_Road carries the tag Street; lanes carry Lane instead (Day 103), so they stay bare, as narrow lanes in most old towns are.", "uk": "Клацни Regenerate. Пропси стоять уздовж кожної головної вулиці, бо кожен BP_Road має тег Street. Провулки мають натомість Lane (День 103), тож лишаються голими, як вузькі провулки в більшості старих міст."}, {"en": "Fly the main street at 3 m. Props stand 5 m from the centre line (Kerb Offset 0, 500, 12.5, on the 12.5 cm kerb height): on the pavement of the 12 m road, clear of the house fronts 8 m out.", "uk": "Пролети головною вулицею на 3 м. Пропси стоять за 5 м від осьової лінії (Kerb Offset 0, 500, 12.5, на висоті бордюру 12,5 см): на тротуарі дороги 12 м, подалі від фасадів будинків, що стоять за 8 м."}, {"en": "You see whether that looks right; if props crowd a pavement, raise Slot Spacing or lower Tree Gap on the volume, and note it.", "uk": "Оціни, чи це виглядає правильно. Якщо пропси тісняться на тротуарі, збільш Slot Spacing або зменш Tree Gap на об'ємі й запиши це."}, {"en": "Lamps and trees keep back from the junction tables (their KeepOutWide tag, Day 103), and so do benches, bins and bollards (their KeepOutJunction tag, read by PCG_JunctionKeepOuts since Day 90); if one still stands in a junction's mouth, check that the table carries KeepOutJunction and that PCG_JunctionKeepOuts sits on that branch.", "uk": "Ліхтарі й дерева тримаються подалі від майданчиків перехресть (їхній тег KeepOutWide, День 103), так само лавки, урни й стовпчики (тег KeepOutJunction, який читає PCG_JunctionKeepOuts з Дня 90). Якщо щось досі стоїть на в'їзді до перехрестя, перевір, чи має майданчик тег KeepOutJunction і чи стоїть PCG_JunctionKeepOuts на цій гілці."}], "play": {"en": "Real or invented: the tutor describes six dressing ideas (lamps every 20 m on the main street; palm trees in a cold northern harbour; benches facing the sea; café tables in the shop street; a tree in the middle of every junction; bollards round the square). For each I say whether my photos support it, and why grounding matters.", "uk": "Справжнє чи вигадане: тьютор описує шість ідей обставляння (ліхтарі кожні 20 м на головній вулиці; пальми в холодній північній гавані; лавки обличчям до моря; столики кав'ярень на торговій вулиці; дерево посеред кожного перехрестя; стовпчики навколо площі). Про кожну я кажу, чи підтверджують її мої фото, і чому опора на справжнє важлива."}, "video": {"search": "unreal engine pcg street props along spline dressing"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Обставляємо справжню вулицю (Day 104, lesson 1 of 4). Today's build: Обставлений район: PCG_StreetDresser над L_District, контури BP_GreenZone, які заростають через PCG_DistrictGreen, орієнтир і об'єкти площі за правилами, а KO_Corridor01–03 вільні в кожному генераторі.\nWhat I already know: День 103: ядро BP_DistrictGenerator, Make Plots і Too Close; День 85: PCG_StreetDresser, Kerb Offset, Slot Spacing і Tree Gap; День 84: PCG_KeepOuts і параметри графа; День 102: DA_TownRules_District, коридори і твої фото справжнього місця; День 64: MI_LampGlow і Night у MPC_World.\n\nBy the end of this lesson I can:\n1. Планувати обставляння за справжнім місцем: що насправді є на його вулицях, у садах і на площі.\n2. Запускати PCG_StreetDresser над усім районом, щоб обставити кожну згенеровану вулицю.\n3. Задавати порядок пріоритетів: коридори, дороги, будинки, потім зелень.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: BP_DistrictGenerator будує справжній план вулиць: дороги, майданчики перехресть, ділянки вздовж кривих вулиць і будинки з посадкою на ґрунт — з одного зерна. Today: Ти обставляєш його: вулиці з дрібницями, парки з мапи, орієнтир за справжнім і вільні коридори для польоту. One encouraging line: Сьогодні район починає здаватися жилим. Пролети ним повільно в сутінках і насолоджуйся тим, що збудував твій код.); 2 lines on why today matters and where it comes back, in plain words (from this: Місто виглядає жилим, коли його вулиці обставлено, сади зелені, а один орієнтир каже, де ти. З висоти дрона район запам'ятовується деревами й орієнтиром, а пролетіти крізь нього дають вільні коридори. Обставляння за правилами означає, що кожне зерно і кожне справжнє місце, яке ти подаєш, отримують ту саму увагу за секунди. It comes back: У п'ятницю (День 105) генератор v1 має відбудувати все це одним клацанням з одного зерна, а в День 106 правила доведення додадуть вулицям маленькі історії.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-104-district-dressing-parks-corridors exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (Дрібниці на вулицях, зелені зони і PCG_DistrictGreen (робиш на уроках)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first G Volume, Post Process Volume) = об'єм; seed = зерно (налаштування Seed); keep-out zone / footprint test / grounding = зона-виняток / тест опори / посадка на ґрунт; kit / kit piece / part of one object = набір / деталь / частина; map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; district / plot / plot plan = район / ділянка / план ділянки; harbour / quay / waterfront / pier = гавань / причал / набережна / пірс; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; wear / worn edges / salt line = зношеність / стерті краї / сольова лінія; vista / blockout / landmark = панорама / блокаут / орієнтир; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}], "handin": [{"en": "summary.md", "uk": "summary.md"}, {"en": "dressing_plan.md (what the streets hold, parks, landmark, features, corridors and the clash order) (proof)", "uk": "dressing_plan.md (що є на вулицях, парки, орієнтир, об'єкти площі, коридори і порядок пріоритетів) (доказ)"}, {"en": "dressed_120m.png, park_10m.png and night_120m.png (the dressed district, a park, the lit landmark) (proof)", "uk": "dressed_120m.png, park_10m.png і night_120m.png (обставлений район, парк, освітлений орієнтир) (доказ)"}], "goal": {"en": "By the end of today you have a dressed district: PCG_StreetDresser on every real street, the map's parks and gardens grown by PCG_DistrictGreen inside BP_GreenZone outlines, a landmark built after the real one with small features in its square, and two or three flight corridors kept clear of every prop, tree and house.", "uk": "До кінця дня в тебе є обставлений район. PCG_StreetDresser працює на кожній справжній вулиці. Парки й сади з мапи вирощує PCG_DistrictGreen усередині контурів BP_GreenZone. Орієнтир збудовано за справжнім, а на його площі стоять дрібні об'єкти. Два-три польотні коридори вільні від кожного пропса, дерева й будинку."}, "uses": [{"en": "Day 103: BP_DistrictGenerator's core, Make Plots and Too Close", "uk": "День 103: ядро BP_DistrictGenerator, Make Plots і Too Close"}, {"en": "Day 85: PCG_StreetDresser, Kerb Offset, Slot Spacing and Tree Gap", "uk": "День 85: PCG_StreetDresser, Kerb Offset, Slot Spacing і Tree Gap"}, {"en": "Day 84: PCG_KeepOuts and graph parameters", "uk": "День 84: PCG_KeepOuts і параметри графа"}, {"en": "Day 102: DA_TownRules_District, the corridors and your photos of the real place", "uk": "День 102: DA_TownRules_District, коридори і твої фото справжнього місця"}, {"en": "Day 64: MI_LampGlow and MPC_World's Night", "uk": "День 64: MI_LampGlow і Night у MPC_World"}], "quiz": [{"q": {"en": "PCG_DistrictGreen places no trees at all inside your green zones. What do you check first?", "uk": "PCG_DistrictGreen не ставить жодного дерева в зелених зонах. Що перевірити першим?"}, "options": [{"en": "The seed", "uk": "Зерно"}, {"en": "That each zone's spline is a closed loop, because Create Surface From Spline needs a closed outline", "uk": "Чи сплайн кожної зони замкнений: Create Surface From Spline потребує замкненого контуру"}, {"en": "The landmark", "uk": "Орієнтир"}, {"en": "Tree Gap on the dresser", "uk": "Tree Gap на розставлянні"}], "answer": 1, "explain": {"en": "An open spline makes no surface, so the sampler has nowhere to put points.", "uk": "Незамкнений сплайн не дає поверхні, тож семплеру нікуди ставити точки."}}, {"q": {"en": "Why does the generator drop plots inside green zones?", "uk": "Навіщо генератор відкидає ділянки в зелених зонах?"}, "options": [{"en": "So houses don't stand in the parks the map shows", "uk": "Щоб будинки не стояли в парках, які показує мапа"}, {"en": "To save memory", "uk": "Щоб заощадити пам'ять"}, {"en": "Because PCG needs empty plots", "uk": "Бо PCG потребує порожніх ділянок"}, {"en": "To make the streets wider", "uk": "Щоб вулиці стали ширшими"}], "answer": 0, "explain": {"en": "The zones come from the real map; the generator and the green graph read the same outlines.", "uk": "Зони взято зі справжньої мапи, а генератор і зелений граф читають ті самі контури."}}, {"q": {"en": "Trees grow on a lane that crosses a park. What fixes it by rule?", "uk": "Дерева ростуть на провулку, що перетинає парк. Що виправить це правилом?"}, "options": [{"en": "Delete those trees by hand", "uk": "Видалити ці дерева вручну"}, {"en": "Pick a new seed", "uk": "Вибрати нове зерно"}, {"en": "A road keep-out in PCG_DistrictGreen: PCG_RoadClear for the tag Road", "uk": "Зона-виняток для доріг у PCG_DistrictGreen: PCG_RoadClear для тегу Road"}, {"en": "Make the park smaller", "uk": "Зменшити парк"}], "answer": 2, "explain": {"en": "Hand fixes vanish at the next Generate; a keep-out rule holds for every seed.", "uk": "Ручні виправлення зникають при наступному Generate, а правило зони-винятку діє для кожного зерна."}}, {"q": {"en": "What makes a landmark readable from drone height?", "uk": "Що робить орієнтир читабельним з висоти дрона?"}, "options": [{"en": "Bright textures on every side", "uk": "Яскраві текстури з усіх боків"}, {"en": "Many small details", "uk": "Багато дрібниць"}, {"en": "A sign with its name", "uk": "Табличка з назвою"}, {"en": "A unique silhouette, clearly taller than its neighbours, visible down the streets that lead to it, and lit at night", "uk": "Унікальний силует, помітно вищий за сусідів, видимий уздовж вулиць, що ведуть до нього, і освітлений уночі"}], "answer": 3, "explain": {"en": "Pilots steer by shape and height; detail disappears at 60 m, a silhouette does not.", "uk": "Пілоти орієнтуються за формою і висотою. Дрібниці зникають на 60 м, а силует — ні."}}, {"q": {"en": "What is the clash order in your dressing plan?", "uk": "Який порядок пріоритетів у твоєму плані обставляння?"}, "options": [{"en": "Greenery first, then everything else", "uk": "Спершу зелень, потім усе інше"}, {"en": "Corridors first, then roads, houses, and greenery last", "uk": "Спершу коридори, потім дороги, будинки, а зелень — остання"}, {"en": "Houses first", "uk": "Спершу будинки"}, {"en": "Whatever the seed picks", "uk": "Що вибере зерно"}], "answer": 1, "explain": {"en": "Safety and use come first: a corridor must stay clear even if a tree or a house would look nice there.", "uk": "Безпека і користь ідуть першими: коридор має лишатися вільним, навіть якщо дерево чи будинок там гарно виглядали б."}}], "weekInfo": null, "morning": {"sofar": {"en": "BP_DistrictGenerator builds your real street plan: roads, junction tables, plots along curved streets and grounded houses, from one seed.", "uk": "BP_DistrictGenerator будує справжній план вулиць: дороги, майданчики перехресть, ділянки вздовж кривих вулиць і будинки з посадкою на ґрунт — з одного зерна."}, "today": {"en": "You dress it: furnished streets, parks from the map, a landmark built after the real one, and corridors kept clear for flying.", "uk": "Ти обставляєш його: вулиці з дрібницями, парки з мапи, орієнтир за справжнім і вільні коридори для польоту."}, "cheer": {"en": "This is the day the district starts to feel lived-in; fly it slowly at dusk and enjoy what your code has built.", "uk": "Сьогодні район починає здаватися жилим. Пролети ним повільно в сутінках і насолоджуйся тим, що збудував твій код."}, "quote": {"text": {"en": "I think that I shall never see / A poem lovely as a tree.", "uk": "Мабуть, ніколи не знайду / Вірша, гарнішого за дерево."}, "author": {"en": "Joyce Kilmer", "uk": "Джойс Кілмер"}, "source": "Trees (poem), Poetry magazine, August 1913"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-104-district-dressing-parks-corridors", "mapHref": "../../COURSE.html", "prevHref": "../Day-103-district-generator-core/START-HERE.html", "nextHref": "../Day-105-boss-district-generator-v1/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8 (PCG and Blueprints). I am a beginner on Day 104. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me: when my Blueprint or script fails, ask for the error message or a screenshot of the graph, point to the line or node that is wrong and explain why, then let me fix it myself. Never write the whole tool for me.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: Орієнтир (вежа з набору; Золото: за фото), об'єкти площі і прольоти коридорів — самостійно.\nIt's part of: Обставлений район: PCG_StreetDresser над L_District, контури BP_GreenZone, які заростають через PCG_DistrictGreen, орієнтир і об'єкти площі за правилами, а KO_Corridor01–03 вільні в кожному генераторі (L_District; PCG_DistrictGreen і PCG_RoadClear — у /TechTools/PCG; BP_GreenZone і Blueprint орієнтира (названий за справжнім, наприклад BP_Landmark_Tower) — у /TechTools/District.).\nWhy it matters: Місто виглядає жилим, коли його вулиці обставлено, сади зелені, а один орієнтир каже, де ти. З висоти дрона район запам'ятовується деревами й орієнтиром, а пролетіти крізь нього дають вільні коридори. Обставляння за правилами означає, що кожне зерно і кожне справжнє місце, яке ти подаєш, отримують ту саму увагу за секунди. It comes back: У п'ятницю (День 105) генератор v1 має відбудувати все це одним клацанням з одного зерна, а в День 106 правила доведення додадуть вулицям маленькі історії.\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-104-district-dressing-parks-corridors (on the drive I chose on Day 0).\nWhat I already know: День 103: ядро BP_DistrictGenerator, Make Plots і Too Close; День 85: PCG_StreetDresser, Kerb Offset, Slot Spacing і Tree Gap; День 84: PCG_KeepOuts і параметри графа; День 102: DA_TownRules_District, коридори і твої фото справжнього місця; День 64: MI_LampGlow і Night у MPC_World; today's lessons: Обставляємо справжню вулицю; Парки й сади: BP_GreenZone і PCG_DistrictGreen; Орієнтир, за яким можна летіти; Коридори: вільні за правилом, доведені прольотом. Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- Спершу dressing_plan.md: що є на справжніх вулицях (з твоїх фото), парки й сади з мапи, орієнтир (Золото: із трьома фото), два-три об'єкти площі (фонтан, статуя, кіоск), коридори і порядок пріоритетів: спершу коридори, потім дороги, потім будинки, зелень — остання.\n- PCG_StreetDresser на PCG Volume над усім районом (Location 10000, 10000, 0; Scale 110, 110, 30), заданий як Dresser генератора; Kerb Offset 0, 500, 12.5. Пропси стоять на тротуарах кожного BP_Road, жодного на проїзній частині чи в провулках. Жоден ліхтар, дерево, лавка, урна чи стовпчик не стоїть на майданчику перехрестя чи на в'їзді до нього (теги KeepOutWide і KeepOutJunction).\n- BP_GreenZone: Actor із замкненим Spline з назвою Outline, який Construction Script малює колом із 8 точок за Radius (м, 5–60, типово 15) (Set Closed Loop), тег актора Green. По одній зоні на кожен парк чи сад із мапи, за потреби розтягнутій в овал. Green Zones генератора (масив BP_GreenZone) відкидають кожну ділянку, чий центр лежить у зоні.\n- PCG_DistrictGreen: Get Spline Data (By Tag, Green) > Create Surface From Spline > Surface Sampler > Spatial Noise (Perlin2D) і Density Filter (купки з галявинами, а не килим) > PCG_RoadClear (копія PCG_KeepOuts для тегу Road, який мають кожен BP_Road і BP_Lane, з Bounds Modifier 7 м) > PCG_KeepOuts > Transform Points (будь-який поворот, масштаб 0,8–1,2, заглиблення на 10–30 см) > Static Mesh Spawner із двома видами дерев і одним кущем, з вагами. Із зерном; ніщо не висить у повітрі.\n- Орієнтир: висока вежа з набору або високий дочірній BP_Building (Золото: збудований за трьома справжніми фото з деталей набору й Geometry Nodes), щонайменше вдвічі вищий за сусідів, з верхівкою в MI_LampGlow, що світиться від Night у MPC_World. Заданий як Landmark Class у DA_TownRules_District. PDA_TownRules отримує Feature Points (масив Vector, м) і Feature Class (клас Actor), а Spawn Features ставить їх (метри від генератора) з трасуванням до ґрунту на площі, пропускаючи ті, що в коридорі.\n- KO_Corridor01–03 є в Keep Outs генератора, їх читає PCG_KeepOuts на гілках ліхтарів і дерев розставляння та в PCG_DistrictGreen. LaneGauge пролітає кожен на 15 м, нічого не торкаючись. Check Town показує 0 проблем.\n- Заголовок Day 104 у techtools_notes.md: stat unit з 120 м і кількість інстансів (підсумковий рядок і згенеровані інстанси кожного об'єму PCG). Якщо кадр за бюджетом, для Дня 107 названо найбільшого підозрюваного.\n\nMy checklist (the same numbers show on my course page):\n1. Перевір, чи є результати сьогоднішніх уроків: PCG_StreetDresser над L_District, BP_GreenZone і PCG_DistrictGreen з PCG_RoadClear. Чогось бракує? Пройди зараз кроки «Разом із тьютором» того уроку (близько 25 хвилин): самостійна частина спирається на них. Слабкий ПК (16 ГБ оперативної пам'яті чи менше): під час роботи зменш об'єми PCG до 100 × 100 м, а для фінальних картинок збільш (див. розділ про слабкі ПК в ACCOUNTS-AND-INSTALLS.html). Напиши dressing_plan.md у сьогоднішній папці  /* the dial around it: a ring with the progress arc and a label running along the rim */

 s+='<circle class="face" cx="200" cy="200" r="168"/><circle class="track" cx="200" cy="200" r="176"/>';
 s+='<circle class="arc" cx="200" cy="200" r="176" stroke="url(#'+id+'g)" stroke-dasharray="'+(C*p).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 200 200)"/>';
 if(p>0){const A=-Math.PI/2+p*TAU;s+='<circle class="knob'+(p<1?' go':'')+'" cx="'+(200+176*Math.cos(A)).toFixed(1)+'" cy="'+(200+176*Math.sin(A)).toFixed(1)+'" r="7"/>'}
 if(label)s+='<text class="rimt"><textPath href="#'+id+'" startOffset="25%" text-anchor="middle">'+label+'</textPath></text>';

 if(f.s==='reviewed'){try{const z=fbSeen();if(z[D.day]!==f.at){z[D.day]=f.at;localStorage.setItem(fbSeenKey,JSON.stringify(z))}}catch(e){}

/* fix phase 1 (2026-10-22): the hand-in folder (a button when the roster has a link, else the folder path), the hand-in card,

const HIN=(D.handin||[]).map(v=>(v&&v.en)||(typeof v==='string'?v:'')).join(' ').toLowerCase(),hasClip=/\.mp4|clip/.test(HIN);

function nFiles(n){if(!n)return '';if(lang==='en')return ' · '+n+(n===1?' file':' files');const a=n%10,b=n%100;return ' · '+n+' '+(a===1&&b!==11?'файл':a>=2&&a<=4&&(b<12||b>14)?'файли':'файлів')}

function reportText(){let t=D.reportPrompt;const r=D.lessons.map((l,i)=>{const v=(st['r'+i]||'').trim();return v?'Lesson '+(i+1)+': '+v:''}).filter(Boolean);
 if(r.length)t+='\n\nMy lesson summaries, pasted from my course page:\n'+r.join('\n');
 if(st.qs1)t+='\nMy first score in the Check yourself quiz: '+st.qs1[0]+' of '+st.qs1[1]+'.';

function quiz(){if(!D.quiz||!D.quiz.length)return '';const a=st.qa||{};let ok=0;const L=u('letters');

 return '<section class="card glass quiz">'+lab(u('quiz'),'gold')+'<p class="muted" style="margin:-6px 0 14px">'+u('quizSub')+'</p>'+pips+qs+(qDone()?'<div class="score well" role="status"><span class="eyebrow">'+u('score')+'</span><span class="lcd" aria-label="'+ok+' / '+D.quiz.length+'">'+seg(ok+'/'+D.quiz.length)+'</span>'+(st.qs1?'<span class="muted">'+u('first')+': '+st.qs1[0]+'/'+st.qs1[1]+'</span>':'')+'<div class="row"><button class="btn ghost" id="retry" onclick="retry()">'+u('retry')+'</button></div></div>':'')+'</section>'}

 let shelf='';if(D.day>0){shelf='<div class="shelf" aria-hidden="true">';let g='';for(let d=0;d<D.day;d++){let p=0;try{p=(JSON.parse(localStorage.getItem('devteam:'+D.learner+':'+d))||{}).pct||0}catch(e){}g+='<i class="'+(p>=1?'d':'')+(d>0&&d%5===0?' bs':'')+'"></i>';if(d%5===0||d===D.day-1){shelf+='<span class="wkg">'+g+'</span>';g=''}}shelf+='</div>'}

 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);

<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 64</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

<script id="data" type="application/json">{"learner": "ib-misha-873821eb", "learnerName": {"en": "Misha", "uk": "Міша"}, "day": 64, "week": 13, "total": 110, "title": {"en": "Light and events: a street lamp that knows when the sun is down", "uk": "Світло й події: ліхтар, що знає, коли сонце сіло"}, "theme": {"en": "Week 13: Blueprints for world builders", "uk": "Тиждень 13: Blueprint для творців світів"}, "build": {"item": {"en": "BP_StreetLamp, M_LampGlow with MI_LampGlow, and MPC_World: a lamp whose glow is set for the whole world by one parameter and whose light follows the sun, placed in a practice street and along your waterfront", "uk": "BP_StreetLamp, M_LampGlow з MI_LampGlow і MPC_World: ліхтар, чиє сяйво на весь світ задає один параметр, а світло йде за сонцем. Ліхтарі стоять на тренувальній вулиці й уздовж твоєї набережної."}, "why": {"en": "A town with 200 lamps cannot be switched on by hand, and checking the sun every frame on 200 actors wastes time in every frame. A Material Parameter Collection sets one value that every material in the world can read, and events run code only when something happens. This is how studios build day and night cycles that stay cheap.", "uk": "Місто з 200 ліхтарями неможливо вмикати вручну, а перевірка сонця щокадру на 200 акторах марнує час кожного кадру. Material Parameter Collection задає одне значення, яке може читати кожен матеріал у світі. Події запускають код лише тоді, коли щось відбувається. Так студії будують дешеві цикли дня й ночі."}, "where": {"en": "Content/Tools/Day64/L_Day64 (a short practice street with a sun), then six lamps along your island's waterfront.", "uk": "Content/Tools/Day64/L_Day64 — коротка тренувальна вулиця із сонцем. Потім шість ліхтарів уздовж набережної твого острова."}, "spec": [{"en": "MPC_World in Content/Tools/Data with a scalar parameter Night (default 0) and a vector parameter LampColour (a warm white, about 1.0, 0.65, 0.35).", "uk": "MPC_World у Content/Tools/Data зі скалярним параметром Night (типово 0) і векторним параметром LampColour (теплий білий, приблизно 1.0, 0.65, 0.35)."}, {"en": "M_LampGlow and MI_LampGlow in Content/Tools/Materials: Emissive Color = LampColour x Night x Glow (a Scalar Parameter, default 20), read with Collection Parameter nodes; MI_LampGlow on the lantern glass slot of SM_LampPost (or on a small sphere component named Glow).", "uk": "M_LampGlow і MI_LampGlow у Content/Tools/Materials. Emissive Color = LampColour × Night × Glow (Scalar Parameter, типово 20); LampColour і Night зчитують вузли Collection Parameter. MI_LampGlow стоїть на слоті скла ліхтаря в SM_LampPost або на малому компоненті-сфері Glow."}, {"en": "BP_StreetLamp in Content/Tools/Blueprints: Pole (Static Mesh), Light (a Point Light at lantern height, Attenuation Radius about 1200, Cast Shadows off), Sun (Directional Light object reference, Instance Editable) and Switch On Below (Float, degrees, default 5).", "uk": "BP_StreetLamp у Content/Tools/Blueprints. Pole (Static Mesh). Light: Point Light на висоті скла, Attenuation Radius близько 1200, Cast Shadows вимкнено. Sun: посилання на об'єкт Directional Light, Instance Editable. Switch On Below: Float у градусах, типово 5."}, {"en": "A function Update Light with Call In Editor ticked: sun elevation = Pitch x -1; below Switch On Below the Light is visible and MPC_World Night is 1, otherwise the Light is hidden and Night is 0.", "uk": "Функція Update Light з позначкою Call In Editor. Висота сонця = Pitch × -1. Нижче Switch On Below Light видиме, а Night у MPC_World дорівнює 1. Інакше Light приховане, а Night дорівнює 0."}, {"en": "Event BeginPlay finds the sun with Get Actor Of Class, runs Update Light, and starts Set Timer by Event (Time 2, Looping) to run it again. No Event Tick anywhere, and Start with Tick Enabled is off.", "uk": "Event BeginPlay знаходить сонце вузлом Get Actor Of Class, запускає Update Light і ставить Set Timer by Event (Time 2, Looping), щоб повторювати перевірку. Ніде немає Event Tick, а Start with Tick Enabled вимкнено."}, {"en": "A proof pair from one camera bookmark: the street with the sun 30 degrees up (lamps off) and 5 degrees below the horizon (lamps on); six lamps on your waterfront.", "uk": "Пара доказів з однієї закладки камери: вулиця із сонцем на 30° над горизонтом (ліхтарі вимкнені) і на 5° (ліхтарі ввімкнені). Шість ліхтарів на твоїй набережній."}], "piece1": "BP_StreetLamp with MPC_World and the Update Light button (lessons)", "piece2": {"en": "The timer test in Simulate, a lamp street in the practice level and six lamps on your waterfront, on your own", "uk": "Самостійно: тест таймера в Simulate, вулиця з ліхтарями на тренувальному рівні й шість ліхтарів на твоїй набережній"}, "steps": [{"text": {"en": "Check: the results of today's lessons are there (MPC_World, M_LampGlow, MI_LampGlow and BP_StreetLamp with its Update Light button). Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it. Check MPC_World, M_LampGlow, MI_LampGlow and BP_StreetLamp against the spec. Compile and save all four. Check: green ticks, and setting Night in MPC_World to 1 makes the lantern glow in the viewport (set it back to 0).", "uk": "Спершу перевір, чи є результати сьогоднішніх уроків: MPC_World, M_LampGlow, MI_LampGlow і BP_StreetLamp із кнопкою Update Light. Чогось бракує? Зроби вправу того уроку зараз (близько 25 хв), бо вона потрібна для збірки. Звір усі чотири асети з вимогами, скомпілюй і збережи їх. Перевірка: зелені позначки, а Night = 1 у MPC_World запалює скло у в'юпорті. Потім поверни 0."}, "lesson": 1}, {"text": {"en": "Open MI_LampGlow and set Glow so the lantern reads as lit from 30 m at night without a white blob. Check: Glow sits between about 5 and 50, and the glass shows a warm colour, not pure white.", "uk": "Відкрий MI_LampGlow і підбери Glow так, щоб уночі з 30 м ліхтар виглядав увімкненим, але без білої плями. Перевірка: Glow приблизно від 5 до 50, а скло тепле, не чисто біле."}, "lesson": 1}, {"text": {"en": "In BP_StreetLamp's Class Defaults make sure Start with Tick Enabled is unticked, and delete any grey Event Tick node. Check: searching the Event Graph for Tick finds nothing.", "uk": "У Class Defaults BP_StreetLamp перевір, чи знято прапорець Start with Tick Enabled. Видали будь-який сірий вузол Event Tick. Перевірка: пошук Tick в Event Graph нічого не знаходить."}, "lesson": 2}, {"text": {"en": "Select the placed lamp; in Details set Sun with the eyedropper (click it, then click your Directional Light). Rotate the sun to Pitch -30 and click Update Light; then to Pitch 5 and click again. Check: light off and no glow by day; light on and the lantern glowing at dusk.", "uk": "Вибери розміщений ліхтар. У Details задай Sun піпеткою: клацни її, потім клацни свій Directional Light. Поверни сонце на Pitch -30 і клацни Update Light. Потім Pitch 5 і клацни знову. Перевірка: удень світло вимкнене й сяйва немає, у присмерку світло ввімкнене, а скло світиться."}, "lesson": 3}, {"text": {"en": "Line a 40 m practice street in L_Day64: six lamps about 8 m apart (Alt+drag copies keep their Sun). Select all six in the Outliner and click Update Light once at each sun angle. Check: all six switch together (if only one does, click the button on each lamp).", "uk": "Збудуй у L_Day64 тренувальну вулицю завдовжки 40 м: шість ліхтарів приблизно через 8 м. Копії, зроблені перетягуванням з Alt, зберігають свій Sun. Вибери всі шість в Outliner і клацни Update Light один раз для кожного кута сонця. Перевірка: усі шість перемикаються разом. Якщо перемикається лише один, клацни кнопку на кожному ліхтарі."}, "lesson": 4}, {"text": {"en": "Simulate test: click the arrow beside Play and choose Simulate; select the sun and rotate it below the horizon, then back up. Check: within about 2 seconds every lamp switches on by itself, and off again when the sun rises.", "uk": "Перевір у Simulate: клацни стрілку біля Play і вибери Simulate. Вибери сонце й опусти його під горизонт, а потім підніми знову. Перевірка: приблизно за 2 с кожен ліхтар вмикається сам, а коли сонце сходить, знову вимикається."}, "lesson": 4}, {"text": {"en": "Night look: with the sun at Pitch 5, look at the street from a bookmark 10 m up (Ctrl+1 saves it, 1 returns). Check: pools of light on the pavement under each lamp, and no lamp dark at night or lit by day.", "uk": "Подивись на вулицю вночі: із сонцем на Pitch 5 стань у закладку на висоті 10 м (Ctrl+1 зберігає її, 1 повертає). Перевірка: під кожним ліхтарем на тротуарі пляма світла, і жоден ліхтар не темний уночі й не світиться вдень."}, "lesson": 3}, {"text": {"en": "Take the proof pair from the same bookmark: lamps_day.png (Pitch -30) and lamps_night.png (Pitch 5). Then take lamp_graph.png (the Update Light function and the Event Graph, node names readable). Check: three pictures in today's Work folder, and the first two have the same framing.", "uk": "Зроби пару доказів з однієї закладки: lamps_day.png (Pitch -30) і lamps_night.png (Pitch 5). Потім зроби скриншот lamp_graph.png: функція Update Light і Event Graph, назви вузлів читаються. Перевірка: три зображення в робочій папці дня, а перші два мають однаковий кадр."}, "lesson": 3}, {"text": {"en": "On your island, place six BP_StreetLamp along the waterfront where your plan has lamps (or every 15 to 25 m): set Sun on the first, Alt+drag the rest, and press End (or right-click > Snap/Align > Snap to Floor) on each to drop it to the ground. Save the level (Ctrl+S). Check: from 30 m the lamps line the waterfront, and at Pitch 5 all six glow.", "uk": "На острові постав шість BP_StreetLamp уздовж набережної там, де на плані ліхтарі, або кожні 15–25 м. Задай Sun на першому, решту скопіюй перетягуванням з Alt. Кожен опусти на землю клавішею End або правою кнопкою > Snap/Align > Snap to Floor. Збережи рівень (Ctrl+S). Перевірка: з 30 м ліхтарі стоять уздовж набережної, а на Pitch 5 світяться всі шість."}, "lesson": 3}, {"text": {"en": "At night on your island, open the console with the backtick key (if it does nothing, use the Cmd box at the bottom of Window > Output Log) and type stat unit. Write Frame and GPU in ms under a heading Day 64 in techtools_notes.md in Work\\Assignment\\ (beside credits.md; one notes file for the whole module). Check: Frame is under 16.6 ms; if not, write which lights you could turn off first.", "uk": "Уночі на острові відкрий консоль клавішею ` (бектик). Якщо вона нічого не робить, введи команду в поле Cmd унизу Window > Output Log. Введи stat unit. Запиши Frame і GPU в мс під заголовком Day 64 у techtools_notes.md (Work\\Assignment\\, поруч із credits.md; один файл нотаток на весь модуль). Перевірка: Frame менше 16,6 мс. Якщо ні, запиши, які світла вимкнеш першими."}, "lesson": 2}, {"text": {"en": "Under Day 64 in techtools_notes.md add each variable of BP_StreetLamp, the function and the timer. Click Copy the day report, paste it into a new tutor chat, answer its questions and save its answer as summary.md in today's Work folder. Drag summary.md, lamps_day.png, lamps_night.png and lamp_graph.png into today's hand-in folder (the button on this page); never a project or level folder. Check: the hand-in folder lists 4 files, each over 1 KB.", "uk": "Під Day 64 у techtools_notes.md допиши кожну змінну BP_StreetLamp, функцію й таймер. Клацни «Копіювати звіт дня», встав текст у новий чат із тьютором, дай відповіді на його запитання й збережи відповідь як summary.md у робочій папці дня. Перетягни summary.md, lamps_day.png, lamps_night.png і lamp_graph.png у папку здачі (кнопка на цій сторінці). Ніколи не здавай папку проєкту чи рівня. Перевірка: у папці здачі 4 файли, кожен більший за 1 КБ."}, "lesson": 4}], "assets": ["techart/code-style.md"], "next": {"en": "MI_LampGlow and MPC_World light every lamp head along your promenade on Friday (Day 65). On Day 94 MPC_World also drives the weathering of your generated town.", "uk": "У п'ятницю (День 65) MI_LampGlow і MPC_World запалять кожен ліхтар уздовж твоєї набережної. У День 94 MPC_World також керуватиме зношеністю твого згенерованого міста."}}, "lessons": [{"title": {"en": "One number for the whole world: Material Parameter Collections", "uk": "Одне число для всього світу: Material Parameter Collection"}, "minutes": 40, "goals": [{"en": "Explain a Material Parameter Collection (MPC): a small asset of named numbers and colours that every material can read and a Blueprint can change at once.", "uk": "Пояснювати, що таке Material Parameter Collection (MPC). Це невеликий асет з іменованими числами й кольорами. Їх може читати кожен матеріал, а Blueprint змінює їх для всіх одразу."}, {"en": "Create MPC_World with Night and LampColour, and read them in M_LampGlow with Collection Parameter nodes.", "uk": "Створювати MPC_World з Night і LampColour і зчитувати їх у M_LampGlow вузлами Collection Parameter."}, {"en": "Explain emissive: a material that shows its own light colour, which Lumen also spreads a little onto nearby surfaces.", "uk": "Пояснювати самосвітіння (emissive): матеріал показує власний колір світла, а Lumen трохи розносить його на сусідні поверхні."}], "doalong": [{"en": "Make the folders Content/Tools/Data and Content/Tools/Materials. In Data right-click > Materials > Material Parameter Collection (if it is not there, type Material Parameter Collection into the Add menu's search box); name it MPC_World and open it. You see empty lists for Scalar Parameters and Vector Parameters.", "uk": "Створи папки Content/Tools/Data і Content/Tools/Materials. У Data клацни правою кнопкою > Materials > Material Parameter Collection. Якщо пункту немає, введи Material Parameter Collection у пошук меню Add. Назви асет MPC_World і відкрий. Має вийти два порожні списки: Scalar Parameters і Vector Parameters."}, {"en": "Click + next to Scalar Parameters; name the new one Night, default 0. Click + next to Vector Parameters; name it LampColour, default R 1.0, G 0.65, B 0.35. Save. You see the two parameters.", "uk": "Клацни + біля Scalar Parameters і назви новий параметр Night, типово 0. Клацни + біля Vector Parameters і назви його LampColour, типово R 1.0, G 0.65, B 0.35. Збережи. Має вийти два параметри."}, {"en": "In Content/Tools/Materials right-click > Material, name it M_LampGlow and open it. Right-click the graph, type Collection Parameter and add it; in Details set Collection to MPC_World and Parameter Name to LampColour. Add a second Collection Parameter for Night. You see two nodes that read the collection.", "uk": "У Content/Tools/Materials клацни правою кнопкою > Material, назви його M_LampGlow і відкрий. Клацни правою кнопкою на графі, введи Collection Parameter і додай вузол. У Details встанови Collection на MPC_World, а Parameter Name — на LampColour. Додай другий Collection Parameter для Night. Має вийти два вузли, що читають колекцію."}, {"en": "Add a Scalar Parameter named Glow (default 20). Multiply LampColour by Night, then by Glow (two Multiply nodes), and connect the result to Emissive Color. For Base Color hold 3, click the graph and set the new colour to 0.05, 0.05, 0.05. Apply and Save. You see a dark preview, because Night is 0.", "uk": "Додай Scalar Parameter Glow (типово 20). Помнож LampColour на Night, потім на Glow двома вузлами Multiply і з'єднай результат з Emissive Color. Для Base Color утримуй 3, клацни граф і задай колір 0.05, 0.05, 0.05. Клацни Apply і Save. Попередній перегляд темний, бо Night дорівнює 0."}, {"en": "In MPC_World set Night to 1 for a moment and look at M_LampGlow's preview: you see the warm glow. Set Night back to 0 and save. Right-click M_LampGlow > Create Material Instance and name it MI_LampGlow. You see the instance next to the material.", "uk": "У MPC_World на хвилину встанови Night на 1: попередній перегляд M_LampGlow тепло світиться. Поверни Night на 0 і збережи. Клацни правою кнопкою на M_LampGlow > Create Material Instance і назви інстанс MI_LampGlow. Він з'являється поруч із матеріалом."}], "play": {"en": "Global or local: the tutor names six changes (all lamps on at night; one broken lamp that flickers; wet streets after rain; the sea colour of the whole island; one shop sign's colour; fog everywhere). I say whether an MPC fits or a setting on one object is better.", "uk": "Глобальне чи локальне: тьютор називає шість змін. Усі ліхтарі вмикаються вночі; один зламаний ліхтар блимає; мокрі вулиці після дощу; колір моря на всьому острові; колір вивіски однієї крамниці; туман скрізь. Я кажу, чи пасує MPC, чи краще налаштування на одному об'єкті."}, "video": {"search": "unreal engine 5 material parameter collection blueprint"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Одне число для всього світу: Material Parameter Collection (Day 64, lesson 1 of 4). Today's build: BP_StreetLamp, M_LampGlow з MI_LampGlow і MPC_World: ліхтар, чиє сяйво на весь світ задає один параметр, а світло йде за сонцем. Ліхтарі стоять на тренувальній вулиці й уздовж твоєї набережної..\nWhat I already know: День 3: SM_LampPost, твій вуличний ліхтар. Пропущено День 3? Візьми циліндр і сферу з /Engine/BasicShapes.; День 19 і День 32: твоє сонце (Directional Light) і рецепт світла острова; День 63: Branch; День 61: змінні Instance Editable.\n\nBy the end of this lesson I can:\n1. Пояснювати, що таке Material Parameter Collection (MPC). Це невеликий асет з іменованими числами й кольорами. Їх може читати кожен матеріал, а Blueprint змінює їх для всіх одразу.\n2. Створювати MPC_World з Night і LampColour і зчитувати їх у M_LampGlow вузлами Collection Parameter.\n3. Пояснювати самосвітіння (emissive): матеріал показує власний колір світла, а Lumen трохи розносить його на сусідні поверхні.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: Ти маєш BP_BollardRow, BP_SplineFence і BP_SplineScatter: інструменти, що розставляють ряди, паркани й розсипи із зерном уздовж будь-якої лінії. Today: Ти робиш вуличний ліхтар, що вмикається в присмерку. Для цього потрібні події, функція з кнопкою й один параметр на весь світ. One encouraging line: Сьогодні твій світ починає реагувати на час. Кілька невеликих охайних подій запалюють у присмерку ціле місто.); 2 lines on why today matters and where it comes back, in plain words (from this: Місто з 200 ліхтарями неможливо вмикати вручну, а перевірка сонця щокадру на 200 акторах марнує час кожного кадру. Material Parameter Collection задає одне значення, яке може читати кожен матеріал у світі. Події запускають код лише тоді, коли щось відбувається. Так студії будують дешеві цикли дня й ночі. It comes back: У п'ятницю (День 65) MI_LampGlow і MPC_World запалять кожен ліхтар уздовж твоєї набережної. У День 94 MPC_World також керуватиме зношеністю твого згенерованого міста.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-64-street-lamp-mpc-events exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (BP_StreetLamp з MPC_World і кнопкою Update Light (уроки)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Створи папки Content/Tools/Data і Content/Tools/Materials. У Data клацни правою кнопкою > Materials > Material Parameter Collection. Якщо пункту немає, введи Material Parameter Collection у пошук меню Add. Назви асет MPC_World і відкрий. Має вийти два порожні списки: Scalar Parameters і Vector Parameters.\n   2. Клацни + біля Scalar Parameters і назви новий параметр Night, типово 0. Клацни + біля Vector Parameters і назви його LampColour, типово R 1.0, G 0.65, B 0.35. Збережи. Має вийти два параметри.\n   3. У Content/Tools/Materials клацни правою кнопкою > Material, назви його M_LampGlow і відкрий. Клацни правою кнопкою на графі, введи Collection Parameter і додай вузол. У Details встанови Collection на MPC_World, а Parameter Name — на LampColour. Додай другий Collection Parameter для Night. Має вийти два вузли, що читають колекцію. [screenshot]\n   4. Додай Scalar Parameter Glow (типово 20). Помнож LampColour на Night, потім на Glow двома вузлами Multiply і з'єднай результат з Emissive Color. Для Base Color утримуй 3, клацни граф і задай колір 0.05, 0.05, 0.05. Клацни Apply і Save. Попередній перегляд темний, бо Night дорівнює 0.\n   5. У MPC_World на хвилину встанови Night на 1: попередній перегляд M_LampGlow тепло світиться. Поверни Night на 0 і збережи. Клацни правою кнопкою на M_LampGlow > Create Material Instance і назви інстанс MI_LampGlow. Він з'являється поруч із матеріалом. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Глобальне чи локальне: тьютор називає шість змін. Усі ліхтарі вмикаються вночі; один зламаний ліхтар блимає; мокрі вулиці після дощу; колір моря на всьому острові; колір вивіски однієї крамниці; туман скрізь. Я кажу, чи пасує MPC, чи краще налаштування на одному об'єкті. Otherwise skip it.\n6. Review: ask me these questions from earlier days, one at a time, and correct me kindly: Day 61: why does BP_BollardRow's Construction Script start with Clear Instances? | Day 56: which two frame-time numbers must your island stay under at 1920 x 1080?\n7. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n8. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where w h, from Event BeginPlay add Get Actor Of Class (Actor Class Directional Light) and Set Sun with its Return Value. If Get Actor Of Class is missing, skip it and set Sun with the eyedropper on every lamp instead. You see BeginPlay > Set Sun.", "uk": "В Event Graph від Event BeginPlay додай Get Actor Of Class (Actor Class: Directional Light) і Set Sun з його Return Value. Якщо Get Actor Of Class немає, пропусти його й задай Sun піпеткою на кожному ліхтарі. Має вийти BeginPlay > Set Sun."}, {"en": "Then drag Update Light from My Blueprint's Functions list into the graph and connect it. You see BeginPlay > Set Sun > Update Light.", "uk": "Перетягни Update Light зі списку Functions у My Blueprint у граф і під'єднай. Має вийти BeginPlay > Set Sun > Update Light."}, {"en": "After it add Set Timer by Event: Time 2, Looping ticked. Drag from its red Event pin and choose Add Custom Event; name it CheckSun, and connect CheckSun to a second Update Light. Compile. You see a small chain that runs every 2 seconds, not every frame.", "uk": "Після нього додай Set Timer by Event: Time 2, Looping позначено. Потягни від його червоного входу Event і вибери Add Custom Event. Назви подію CheckSun і з'єднай її з другим Update Light. Клацни Compile. Має вийти короткий ланцюжок, що виконується кожні 2 с, а не щокадру."}, {"en": "Click the arrow beside Play and choose Simulate. Select the sun and rotate it until it sinks below the horizon, then raise it again. You see the lamps switch on within 2 seconds, and off again. Press Esc to stop.", "uk": "Клацни стрілку біля Play і вибери Simulate. Вибери сонце й повертай його, доки воно не зайде під горизонт, потім підніми знову. Ліхтарі вмикаються за 2 с і знову вимикаються. Натисни Esc, щоб зупинити."}, {"en": "Place two more lamps, select all lamps in the Outliner (Ctrl+click) and click Update Light once in Details. You see every selected lamp switch together: a Call In Editor button runs on each selected actor. (If only one lamp switches, click Update Light on each lamp in turn.)", "uk": "Постав ще два ліхтарі, вибери всі в Outliner (Ctrl+клацання) і клацни Update Light у Details один раз. Кожен вибраний ліхтар перемикається: кнопка Call In Editor виконується на кожному вибраному акторі. Якщо перемикається лише один, клацни Update Light на кожному по черзі."}], "play": {"en": "Timer tuning: the tutor asks how often a lamp check must run (every frame, every 0.5, 2 or 10 seconds) for a sunset that lasts 20 minutes of game time. I choose a value and defend it.", "uk": "Налаштування таймера: захід сонця триває 20 хв ігрового часу. Тьютор питає, як часто перевіряти ліхтар: щокадру, кожні 0,5 с, 2 с чи 10 с. Я вибираю значення й захищаю його."}, "video": {"search": "unreal engine 5 set timer by event custom event looping"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Таймер замість Tick і тест Simulate (Day 64, lesson 4 of 4). Today's build: BP_StreetLamp, M_LampGlow з MI_LampGlow і MPC_World: ліхтар, чиє сяйво на весь світ задає один параметр, а світло йде за сонцем. Ліхтарі стоять на тренувальній вулиці й уздовж твоєї набережної..\nWhat I already know: День 3: SM_LampPost, твій вуличний ліхтар. Пропущено День 3? Візьми циліндр і сферу з /Engine/BasicShapes.; День 19 і День 32: твоє сонце (Directional Light) і рецепт світла острова; День 63: Branch; День 61: змінні Instance Editable.\nEarlier today I already did: lesson 1 (Одне число для всього світу: Material Parameter Collection); lesson 2 (Події: код, що виконується, коли щось відбувається); lesson 3 (Функція з кнопкою: Update Light). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Знаходити сонце на початку Play вузлом Get Actor Of Class, щоб ліхтар працював, навіть якщо Sun ніхто не задав.\n2. Запускати Update Light кожні 2 с вузлами Set Timer by Event (Looping) і Custom Event.\n3. Перевіряти ліхтарі в Simulate, поки світ працює, і натискати одну кнопку для багатьох вибраних ліхтарів.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: 2 lines on why today matters and where it comes back, in plain words (from this: Місто з 200 ліхтарями неможливо вмикати вручну, а перевірка сонця щокадру на 200 акторах марнує час кожного кадру. Material Parameter Collection задає одне значення, яке може читати кожен матеріал у світі. Події запускають код лише тоді, коли щось відбувається. Так студії будують дешеві цикли дня й ночі. It comes back: У п'ятницю (День 65) MI_LampGlow і MPC_World запалять кожен ліхтар уздовж твоєї набережної. У День 94 MPC_World також керуватиме зношеністю твого згенерованого міста.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-64-street-lamp-mpc-events exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (BP_StreetLamp з MPC_World і кнопкою Update Light (уроки)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. В Event Graph від Event BeginPlay додай Get Actor Of Class (Actor Class: Directional Light) і Set Sun з його Return Value. Якщо Get Actor Of Class немає, пропусти його й задай Sun піпеткою на кожному ліхтарі. Має вийти BeginPlay > Set Sun.\n   2. Перетягни Update Light зі списку Functions у My Blueprint у граф і під'єднай. Має вийти BeginPlay > Set Sun > Update Light.\n   3. Після нього додай Set Timer by Event: Time 2, Looping позначено. Потягни від його червоного входу Event і вибери Add Custom Event. Назви подію CheckSun і з'єднай її з другим Update Light. Клацни Compile. Має вийти короткий ланцюжок, що виконується кожні 2 с, а не щокадру. [screenshot]\n   4. Клацни стрілку біля Play і вибери Simulate. Вибери сонце й повертай його, доки воно не зайде під горизонт, потім підніми знову. Ліхтарі вмикаються за 2 с і знову вимикаються. Натисни Esc, щоб зупинити.\n   5. Постав ще два ліхтарі, вибери всі в Outliner (Ctrl+клацання) і клацни Update Light у Details один раз. Кожен вибраний ліхтар перемикається: кнопка Call In Editor виконується на кожному вибраному акторі. Якщо перемикається лише один, клацни Update Light на кожному по черзі. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Налаштування таймера: захід сонця триває 20 хв ігрового часу. Тьютор питає, як часто перевіряти ліхтар: щокадру, кожні 0,5 с, 2 с чи 10 с. Я вибираю значення й захищаю його. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); File Explorer = Провідник; mesh = меш; vertex / edge / face = вершина / ребро / грань; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; material instance / child instance = інстанс / дочірній інстанс; material slot / node / pin = слот матеріалу / вузол / вхід; keep-out zone / footprint test / grounding = зона-виняток / тест опори / посадка на ґрунт; kit / kit piece / part of one object = набір / деталь / частина; harbour / quay / waterfront / pier = гавань / причал / набережна / пірс; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; wear / worn edges / salt line = зношеність / стерті краї / сольова лінія; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.\n\nStart now ing faster", "uk": "Швидше запікати освітлення"}, {"en": "Make material instances automatically", "uk": "Автоматично створювати інстанси матеріалів"}], "answer": 1, "explain": {"en": "Every material that reads MPC_World's Night changes the moment one Blueprint sets it.", "uk": "Кожен матеріал, що читає Night з MPC_World, змінюється в ту мить, коли один Blueprint його задає."}}, {"q": {"en": "Your town has 300 lamps that each check the sun on Event Tick, and frame time went up. What is the better design?", "uk": "У твоєму місті 300 ліхтарів, і кожен перевіряє сонце в Event Tick. Час кадру зріс. Який дизайн кращий?"}, "options": [{"en": "Check on a timer every few seconds, and let one MPC value light every lantern", "uk": "Перевіряти за таймером раз на кілька секунд і дати одному значенню MPC запалювати кожен ліхтар"}, {"en": "Raise each light's Attenuation Radius", "uk": "Збільшити Attenuation Radius кожного світла"}, {"en": "Move the check into the Construction Script so it runs in Play", "uk": "Перенести перевірку в Construction Script, щоб вона виконувалась у Play"}, {"en": "Add more Point Lights", "uk": "Додати більше Point Light"}], "answer": 0, "explain": {"en": "A timer runs far less often than Tick, and the MPC switches every glow with a single call.", "uk": "Таймер виконується набагато рідше за Tick, а MPC перемикає кожне сяйво одним викликом."}}, {"q": {"en": "The sun's Pitch is -20. With Switch On Below 5, is the lamp on?", "uk": "Pitch сонця дорівнює -20. При Switch On Below 5 ліхтар увімкнений?"}, "options": [{"en": "Yes, because -20 is below 5", "uk": "Так, бо -20 нижче за 5"}, {"en": "No: the sun is 20 degrees above the horizon, higher than 5", "uk": "Ні: сонце на 20° над горизонтом, вище за 5"}, {"en": "Only in Play", "uk": "Лише в Play"}], "answer": 1, "explain": {"en": "Elevation = Pitch x -1 = 20 degrees, which is above 5, so the lamp stays off.", "uk": "Висота = Pitch × -1 = 20°, а це вище за 5, тож ліхтар лишається вимкненим."}}, {"q": {"en": "You click Update Light and the Output Log says Accessed None trying to read property Sun. What do you do first?", "uk": "Ти клацаєш Update Light, а Output Log пише Accessed None trying to read property Sun. Що зробити спершу?"}, "options": [{"en": "Delete the Point Light", "uk": "Видалити Point Light"}, {"en": "Untick Call In Editor", "uk": "Зняти прапорець Call In Editor"}, {"en": "Set the Sun variable on that lamp with the eyedropper", "uk": "Встановити змінну Sun на цьому ліхтарі піпеткою"}, {"en": "Raise Switch On Below", "uk": "Збільшити Switch On Below"}], "answer": 2, "explain": {"en": "Accessed None names a variable that holds nothing; give Sun a Directional Light and the function can read it.", "uk": "Accessed None називає змінну, у якій нічого немає. Задай у Sun свій Directional Light, і функція зможе його прочитати."}}, {"q": {"en": "Which node makes Update Light run every 2 seconds without Tick?", "uk": "Який вузол запускає Update Light кожні 2 с без Tick?"}, "options": [{"en": "Event BeginPlay on its own", "uk": "Сам Event BeginPlay"}, {"en": "A Delay inside Event Tick", "uk": "Delay всередині Event Tick"}, {"en": "A For Loop", "uk": "For Loop"}, {"en": "Set Timer by Event with Looping ticked", "uk": "Set Timer by Event з позначеним Looping"}], "answer": 3, "explain": {"en": "A looping timer calls its event at the interval you set, and costs nothing in between.", "uk": "Таймер із Looping викликає свою подію із заданим інтервалом і нічого не коштує між викликами."}}], "weekInfo": null, "morning": {"sofar": {"en": "You have BP_BollardRow, BP_SplineFence and BP_SplineScatter: tools that lay rows, fences and seeded scatters along any line.", "uk": "Ти маєш BP_BollardRow, BP_SplineFence і BP_SplineScatter: інструменти, що розставляють ряди, паркани й розсипи із зерном уздовж будь-якої лінії."}, "today": {"en": "You make a street lamp that switches on at dusk, using events, a function with a button and one world-wide parameter.", "uk": "Ти робиш вуличний ліхтар, що вмикається в присмерку. Для цього потрібні події, функція з кнопкою й один параметр на весь світ."}, "cheer": {"en": "Today your world starts to react to time; a few small events, cleanly placed, make a whole town light up at dusk.", "uk": "Сьогодні твій світ починає реагувати на час. Кілька невеликих охайних подій запалюють у присмерку ціле місто."}, "quote": {"text": {"en": "Genius is one per cent inspiration, ninety-nine per cent perspiration.", "uk": "Геній — це один відсоток натхнення й дев'яносто дев'ять відсотків поту."}, "author": {"en": "Thomas Edison", "uk": "Томас Едісон"}, "source": "Spoken around 1903; printed in Harper's Monthly Magazine, September 1932"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-64-street-lamp-mpc-events", "mapHref": "../../COURSE.html", "prevHref": "../Day-63-spline-scatter-seeded/START-HERE.html", "nextHref": "../Day-65-boss-promenade/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8. I am a beginner on Day 64. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me: when my Blueprint or script fails, ask for the error message or a screenshot of the graph, point to the line or node that is wrong and explain why, then let me fix it myself. Never write the whole tool for me.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: Самостійно: тест таймера в Simulate, вулиця з ліхтарями на тренувальному рівні й шість ліхтарів на твоїй набережній.\nIt's part of: BP_StreetLamp, M_LampGlow з MI_LampGlow і MPC_World: ліхтар, чиє сяйво на весь світ задає один параметр, а світло йде за сонцем. Ліхтарі стоять на тренувальній вулиці й уздовж твоєї набережної. (Content/Tools/Day64/L_Day64 — коротка тренувальна вулиця із сонцем. w і MI_LampGlow у Content/Tools/Materials. Emissive Color = LampColour × Night × Glow (Scalar Parameter, типово 20); LampColour і Night зчитують вузли Collection Parameter. MI_LampGlow стоїть на слоті скла ліхтаря в SM_LampPost або на малому компоненті-сфері Glow.\n- BP_StreetLamp у Content/Tools/Blueprints. Pole (Static Mesh). Light: Point Light на висоті скла, Attenuation Radius близько 1200, Cast Shadows вимкнено. Sun: посилання на об'єкт Directional Light, Instance Editable. Switch On Below: Float у градусах, типово 5.\n- Функція Update Light з позначкою Call In Editor. Висота сонця = Pitch × -1. Нижче Switch On Below Light видиме, а Night у MPC_World дорівнює 1. Інакше Light приховане, а Night дорівнює 0.\n- Event BeginPlay знаходить сонце вузлом Get Actor Of Class, запускає Update Light і ставить Set Timer by Event (Time 2, Looping), щоб повторювати перевірку. Ніде немає Event Tick, а Start with Tick Enabled вимкнено.\n- Пара доказів з однієї закладки камери: вулиця із сонцем на 30° над горизонтом (ліхтарі вимкнені) і на 5° (ліхтарі ввімкнені). Шість ліхтарів на твоїй набережній.\n\nMy checklist (the same numbers show on my course page):\n1. Спершу перевір, чи є результати сьогоднішніх уроків: MPC_World, M_LampGlow, MI_LampGlow і BP_StreetLamp із кнопкою Update Light. Чогось бракує? Зроби вправу того уроку зараз (близько 25 хв), бо вона потрібна для збірки. Звір усі чотири асети з вимогами, скомпілюй і збережи їх. Перевірка: зелені позначки, а Night = 1 у MPC_World запалює скло у в'юпорті. Потім поверни 0. (from lesson 1)\n2. Відкрий MI_LampGlow і підбери Glow так, щоб уночі з 30 м ліхтар виглядав увімкненим, але без білої плями. Перевірка: Glow приблизно від 5 до 50, а скло тепле, не чисто біле. (from lesson 1)\n3. У Class Defaults BP_StreetLamp перевір, чи знято прапорець Start with Tick Enabled. Видали будь-який сірий вузол Event Tick. Перевірка: пошук Tick в Event Graph нічого не знаходить. (from lesson 2)\n4. Вибери розміщений ліхтар. У Details задай Sun \\, поруч із credits.md; один файл нотаток на весь модуль). Перевірка: Frame менше 16,6 мс. Якщо ні, запиши, які світла вимкнеш першими. (from lesson 2)\n11. Під Day 64 у techtools_notes.md допиши кожну змінну BP_StreetLamp, функцію й таймер. Клацни «Копіювати звіт дня», встав текст у новий чат із тьютором, дай відповіді на його запитання й збережи відповідь як summary.md у робочій папці дня. Перетягни summary.md, lamps_day.png, lamps_night.png і lamp_graph.png у папку здачі (кнопка на цій сторінці). Ніколи не здавай папку проєкту чи рівня. Перевірка: у папці здачі 4 файли, кожен більший за 1 КБ. (from lesson 4)\n\nHow to help: ask which step number I'm on, then give me only the next step: the exact clicks and what I should see. When I send a screenshot, compare it with my reference, my sizes and the spec, and name one thing to fix at a time.\nCheck every save and export by reopening it before we move on:\n- a Blueprint or script: compile or run it once more and see it work, with no errors\n- a .md or .txt: open it with Notepad; the text is there, and the name doesn't end in .md.txt\nWhen I write \"готово\", and in any case before the day ends, check with me one item at a time (yes/no): each spec point, then each file on my hand-in list, ready in my day work folder (skip summary.md: the day report writes it next):\n1. lamps_day.png та lamps_night.png (тренувальна вулиця з однієї закладки: удень ліхтарі вимкнені, у присмерку ввімкнені) (доказ)\n2. lamp_graph.png (функція Update Light і Event Graph, назви вузлів читаються) (доказ)\nFinish with a short list of anything missing, and one line on where this work comes back and what it will look like there. Then tell me the order for the end of the day: first the day report (the Copy the day report button at the bottom of my course page) into summary.md, and only then hand in all the files on the list, summary.md too.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) S  /* the dial around it: a ring with the progress arc and a label running along the rim */

 s+='<circle class="arc" cx="200" cy="200" r="176" stroke="url(#'+id+'g)" stroke-dasharray="'+(C*p).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 200 200)"/>';
 if(p>0){const A=-Math.PI/2+p*TAU;s+='<circle class="knob'+(p<1?' go':'')+'" cx="'+(200+176*Math.cos(A)).toFixed(1)+'" cy="'+(200+176*Math.sin(A)).toFixed(1)+'" r="7"/>'}

/* fix phase 1 (2026-10-22): the hand-in folder (a button when the roster has a link, else the folder path), the hand-in card,

const HIN=(D.handin||[]).map(v=>(v&&v.en)||(typeof v==='string'?v:'')).join(' ').toLowerCase(),hasClip=/\.mp4|clip/.test(HIN);

function nFiles(n){if(!n)return '';if(lang==='en')return ' · '+n+(n===1?' file':' files');const a=n%10,b=n%100;return ' · '+n+' '+(a===1&&b!==11?'файл':a>=2&&a<=4&&(b<12||b>14)?'файли':'файлів')}

function reportText(){let t=D.reportPrompt;const r=D.lessons.map((l,i)=>{const v=(st['r'+i]||'').trim();return v?'Lesson '+(i+1)+': '+v:''}).filter(Boolean);
 if(r.length)t+='\n\nMy lesson summaries, pasted from my course page:\n'+r.join('\n');

 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);

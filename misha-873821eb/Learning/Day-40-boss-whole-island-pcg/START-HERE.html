<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 40</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

to CAM_Vista_3 (Day 32) and from CAM_Wide. CAM_Wide is a new camera 200 to 250 m up, about 1 km out to sea, that shows the whole island.", "uk": "L_Island, увесь острів. Кадри з CAM_Vista_1–CAM_Vista_3 (День 32) і з CAM_Wide. CAM_Wide — нова камера на висоті 200–250 м, приблизно за 1 км у морі, що показує весь острів."}, "spec": [{"en": "Forest: forest boxes in every forest valley on your biome map, shaped to each valley and clear of every keep-out. Light route: copies of your PCG_ForestLite volume.", "uk": "Ліс: рамки лісу в кожній лісовій долині з мапи біомів, підігнані під кожну долину й поза всіма зонами-винятками. Полегшений варіант: копії твого об'єму PCG_ForestLite."}, {"en": "Biomes: each biome volume stretched over the whole island, taller than the summit, with Is Partitioned ticked (Cleanup first, then tick it, then Generate). Each biome grows wherever its rules allow, with no straight biome edge from 100 m.", "uk": "Біоми: кожен об'єм біому розтягнуто на весь острів, вище за верхівку, з увімкненим Is Partitioned (спершу Cleanup, потім прапорець, потім Generate). Кожен біом росте там, де дозволяють його правила, і зі 100 м не видно прямого краю біому."}, {"en": "Detail: the rock and ground-cover volumes spread over the whole island the same way, and the shoreline round the whole coast.", "uk": "Дрібниці: об'єми каміння й ґрунтового покриву так само розтягнуто на весь острів, а берегова лінія йде довкола всього узбережжя."}, {"en": "Keep-outs clean: every road, the river, the lake, both district squares and the corridor clear; LaneGauge passes the corridor.", "uk": "Зони-винятки чисті: кожна дорога, річка, озеро, обидва квадрати районів і коридор вільні. LaneGauge проходить коридор."}, {"en": "The footprint test passed on every layer (at most 1 floating in 20), with 20 random positions per layer from across the whole island.", "uk": "Тест опори пройдено для кожного шару (висить не більше 1 з 20): по 20 випадкових місць на шар з усього острова."}, {"en": "HLODs rebuilt, and the whole island reads from 800 m out at sea in Play. The four cameras are shot at 1920 x 1080 into boss_board_day40.png, beside reference photos and your Day 32 vista shots. Write stat unit (Frame and GPU) and memory at CAM_Wide in boss_day40.md, as the start for next week's budget.", "uk": "HLOD перебудовано, і в Play весь острів читається з моря за 800 м. Кадри з чотирьох камер (1920 × 1080) лежать у boss_board_day40.png поруч із фото-референсами й твоїми кадрами панорам з Дня 32. Показники stat unit (Frame і GPU) і пам'ять на CAM_Wide записано в boss_day40.md — це відправна точка для бюджету наступного тижня."}], "piece1": "the forest and the first biome over the whole island", "piece2": {"en": "The other biomes, the detail, the checks, the shots and the flight, timed (tiers)", "uk": "Інші біоми, дрібниці, перевірки, кадри й проліт на час (медалі)"}, "steps": [{"text": {"en": "Check: the files from today's lessons are in the day work folder (boss_day40.md with your plan). Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it. Start the clock, and copy every volume's Seed from biome_rules.md into boss_day40.md. Check: the plan fits in 4 hours.", "uk": "Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: boss_day40.md з планом. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Запусти таймер і скопіюй Seed кожного об'єму з biome_rules.md у boss_day40.md. Перевірка: план вкладається в 4 години."}, "lesson": 1}, {"text": {"en": "Load the whole island. Shape forest boxes to every forest valley on biome_map.png, clear of keep-outs, and Generate them one at a time. If a biome crowds in under a forest, draw a closed loop round that forest tagged KeepOutArea (KO_Forest01), as on Day 38. Check: from 150 m every forest valley is filled, with no square edges.", "uk": "Завантаж увесь острів. Піджени рамки лісу під кожну лісову долину з biome_map.png, поза зонами-винятками, і генеруй їх по одній. Якщо під лісом тісниться біом, обведи ліс замкненим контуром з тегом KeepOutArea (KO_Forest01), як у День 38. Перевірка: зі 150 м кожна лісова долина заповнена, без квадратних країв."}, "lesson": 1}, {"text": {"en": "Stretch your first biome volume over the whole island: click Cleanup, tick Is Partitioned, Generate and save. Weak PC: restart the editor between volumes, and do two halves if memory passes 15 GB (see Weak PC in ACCOUNTS-AND-INSTALLS.html). Check: the biome grows in every zone the map gives it.", "uk": "Розтягни перший об'єм біому на весь острів: клацни Cleanup, увімкни Is Partitioned, клацни Generate і збережи. Слабкий ПК: перезапускай редактор між об'ємами й роби двома половинами, якщо пам'ять перевищує 15 ГБ (див. розділ «Слабкий ПК» на сторінці ACCOUNTS-AND-INSTALLS.html). Перевірка: біом росте в кожній зоні, яку дає йому мапа."}, "lesson": 1}, {"text": {"en": "Do the same for your other two biomes, one at a time, saving after each. Check: every zone of biome_map.png is dressed.", "uk": "Те саме зроби для двох інших біомів, по одному, зберігаючи після кожного. Перевірка: кожна зона biome_map.png наповнена."}, "lesson": 1}, {"text": {"en": "Stretch the rock and ground-cover volumes over the whole island the same way, and look at the shoreline. Check: rocks gather on slopes everywhere and a stone line follows the whole coast.", "uk": "Так само розтягни на весь острів об'єми каміння й ґрунтового покриву й подивися на берегову лінію. Перевірка: каміння всюди збирається на схилах, а лінія каміння йде вздовж усього узбережжя."}, "lesson": 1}, {"text": {"en": "Fly every keep-out in keepouts.md at 30 m: the roads, the river, the lake and both district squares. Then move LaneGauge along the corridor at the route's height. Check: nothing grows where it must not, and the gauge passes with no touch.", "uk": "Пролети на висоті 30 м над кожною зоною-винятком з keepouts.md: дороги, річка, озеро й обидва квадрати районів. Потім проведи LaneGauge уздовж коридору на висоті маршруту. Перевірка: ніщо не росте там, де не можна, а куб-калібр проходить, нічого не зачепивши."}, "lesson": 2}, {"text": {"en": "Footprint test with 20 island-wide random positions per layer; fix at the graph and test again. Check: every layer shows at most 1 floating in 20 in footprint_test.md.", "uk": "Зроби тест опори: по 20 випадкових місць з усього острова на кожен шар. Виправляй у графі й перевіряй знову. Перевірка: у footprint_test.md у кожному шарі висить не більше 1 з 20."}, "lesson": 2}, {"text": {"en": "Read the island from 100 m and 30 m for straight edges and rows; fix the worst with a seed or a band. Check: no straight biome edge or row shows from 100 m.", "uk": "Подивися на острів зі 100 м і 30 м: чи немає прямих країв і рядів. Найгірше виправ значенням Seed або смугою. Перевірка: зі 100 м не видно жодного прямого краю біому чи ряду."}, "lesson": 2}, {"text": {"en": "Rebuild the HLODs, then Play and fly 800 m out to sea. Check: the whole dressed island shows on the horizon.", "uk": "Перебудуй HLOD, потім запусти Play і відлети на 800 м у море. Перевірка: увесь наповнений острів видно на обрії."}, "lesson": "D33.4"}, {"text": {"en": "Shoot CAM_Vista_1 to CAM_Vista_3 again and a new locked CAM_Wide at 200 to 250 m. Check: four 1920 x 1080 files, island_vista1.png to island_vista3.png and island_wide.png.", "uk": "Зніми ще раз CAM_Vista_1–CAM_Vista_3 і нову заблоковану CAM_Wide на висоті 200–250 м. Перевірка: чотири файли 1920 × 1080: island_vista1.png–island_vista3.png і island_wide.png."}, "lesson": 3}, {"text": {"en": "Make boss_board_day40.png: each shot beside its reference photo and its Day 32 shot. Check: four labelled rows.", "uk": "Зроби boss_board_day40.png: кожен кадр поруч зі своїм фото-референсом і своїм кадром з Дня 32. Перевірка: чотири підписані рядки."}, "lesson": 3}, {"text": {"en": "Pilot CAM_Wide and read stat unit and memory; write them in boss_day40.md. Then record clip_day40.mp4 (Win+Alt+R). What to show: a slow fly-around of today's result from the three angles on your sheet, then hold on the best view; 30 to 60 seconds, no music or editing needed. Check: the clip is under 50 MB in File Explorer; if not, record 30 seconds.", "uk": "Перейди в CAM_Wide командою Pilot і зчитай stat unit і пам'ять. Запиши їх у boss_day40.md. Потім запиши clip_day40.mp4 (Win+Alt+R). Що показати: повільно облети сьогоднішній результат із трьох ракурсів твого аркуша й затримайся на найкращому виді. 30–60 секунд, без музики й монтажу. Перевірка: у Провіднику (File Explorer) кліп менший за 50 МБ. Якщо ні, запиши 30 секунд."}, "lesson": 3}, {"text": {"en": "Score yourself with the rubric and ask the tutor for see-why-fix notes. Write both, your decision, your tier and your real time in self_review_day40.md. Check: five scores, three notes and one decision.", "uk": "Оціни себе за таблицею оцінювання й попроси тьютора про нотатки «бачу, чому, як виправити». Запиши в self_review_day40.md оцінки, нотатки, своє рішення, свою медаль і реальний час. Перевірка: п'ять оцінок, три нотатки й одне рішення."}, "lesson": 4}, {"text": {"en": "Choose File > Save All in Unreal. Report and hand-in: click Copy the day report at the bottom of the page, paste it into a new chat and answer. Open summary.md in Notepad, press Ctrl+End, paste the answer and press Ctrl+S. Then drag the files on the Hand in list into your hand-in folder. Check: the level tab shows no * mark, and every name shows in the folder, each with a size.", "uk": "В Unreal вибери File > Save All. Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: на вкладці рівня немає позначки *, а кожна назва зі списку є в папці, у кожної є розмір."}, "lesson": 4}], "boss": [{"en": "Bronze: the forest, all three biomes, the rocks and the shoreline cover the whole island by PCG, and the keep-outs are clear. You have four shots, the board, stat unit and a 30 to 60 second flight, inside 4 hours.", "uk": "Бронза: ліс, усі три біоми, каміння й берегова лінія розставлені PCG по всьому острову, а зони-винятки вільні. Є чотири кадри, аркуш, stat unit і проліт на 30–60 секунд — усе за 4 години."}, {"en": "Silver: the footprint test passes on every layer, and no straight biome edge or row shows from 100 m. The gauge passes the corridor, and the dressed island shows from 800 m out at sea in Play.", "uk": "Срібло: тест опори пройдено для кожного шару, і зі 100 м не видно жодного прямого краю біому чи ряду. Куб-калібр проходить коридор, а в Play наповнений острів видно з моря за 800 м."}, {"en": "Gold: each shot holds up beside its photo in a 3-second look, and you finish inside 3 hours 30. Frame time at CAM_Wide is under 16.6 ms, or on a weak PC at the setting you wrote down. Add one stretch: a shared keep-out subgraph (Collapse Nodes > Graph Asset) or a Blender driftwood log on the shoreline.", "uk": "Золото: поруч зі своїм фото кожен кадр витримує 3-секундний погляд, а все готово за 3 години 30 хвилин. Час кадру на CAM_Wide менший за 16,6 мс (на слабкому ПК — за записаних налаштувань). Додай одне завдання понад план: спільний підграф зон-винятків (Collapse Nodes > Graph Asset) або колоду, викинуту морем, з Blender на березі."}], "assets": ["island12/art-director-notes.md", "island12/picture-brief-standard.md"]}, "lessons": [{"title": {"en": "Boss briefing: from a transect to the whole island (micro-lesson)", "uk": "Брифінг перед Днем боса: від трансекти до всього острова (мікроурок)"}, "minutes": 20, "goals": [{"en": "Scale up safely: stretch one volume at a time, Generate, look, save, then the next.", "uk": "Безпечно масштабувати роботу: розтягувати один об'єм за раз, генерувати, дивитися, зберігати, потім наступний."}, {"en": "Work in order: the biggest shapes first (forest and trees), then shrubs, then rocks and ground cover, then the checks.", "uk": "Працювати по порядку: спершу найбільші форми (ліс і дерева), потім кущі, потім каміння й ґрунтовий покрив, потім перевірки."}, {"en": "Keep regenerating safe: seeds written down, keep-outs tagged and always loaded, nothing placed by hand inside a volume.", "uk": "Тримати перегенерацію безпечною: значення Seed записано, зони-винятки мають теги й завжди завантажені, усередині об'єму нічого не поставлено вручну."}], "doalong": [{"en": "Open biome_map.png beside the level and list the zones in the order you will dress them. You see your order of work.", "uk": "Відкрий biome_map.png поруч із рівнем і випиши зони в тому порядку, у якому їх наповнюватимеш. Має вийти: твій порядок роботи."}, {"en": "Write the order with times in boss_day40.md. You see a plan under 4 hours.", "uk": "Запиши порядок із часом у boss_day40.md. Має вийти: план менш ніж на 4 години."}, {"en": "Paste your plan into the tutor chat and ask it to act as a studio producer and cut what won't fit. You see a plan you can finish.", "uk": "Встав свій план у чат із тьютором і попроси його виступити продюсером студії й викреслити все, що не вміститься. Має вийти: план, який реально завершити."}], "play": {"en": "Time plan: I give the tutor my plan; it plays a studio producer and cuts anything that won't fit in 4 hours.", "uk": "План часу: я даю тьютору свій план. Він грає продюсера студії й викреслює все, що не вміститься в 4 години."}, "video": {"url": "https://www.youtube.com/watch?v=cbeV-p1dO44", "title": "Foliage Optimization in Unreal Engine 5 | Tutorial", "channel": "Fallen Horizon", "length": "29:33", "search": "foliage optimization unreal engine 5"}, "prompt": "You are my tutor for one 20-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Брифінг перед Днем боса: від трансекти до всього острова (мікроурок) (Day 40, lesson 1 of 4). Today's build: Увесь острів наповнено PCG (ліс, біоми, каміння, ґрунтовий покрив і берегова лінія) в об'ємах із розбиттям на комірки. Зони-винятки чисті, ніщо не висить, HLOD перебудовано. Доводять це чотири кадри, аркуш, 60-секундний проліт і показники stat unit..\nWhat I already know: День 35: лісова долина; День 37: biome_map.png і три твої графи біомів; День 38: зони-винятки, посадка на ґрунт і footprint_test.md; День 39: PCG_Rocks, ґрунтовий покрив і берегова лінія з розбиттям на комірки; День 32: камери панорам CAM_Vista_1–CAM_Vista_3 і рецепт світла; День 33: HLOD і налаштування польоту в Play.\n\nBy the end of this lesson I can:\n1. Безпечно масштабувати роботу: розтягувати один об'єм за раз, генерувати, дивитися, зберігати, потім наступний.\n2. Працювати по порядку: спершу найбільші форми (ліс і дерева), потім кущі, потім каміння й ґрунтовий покрив, потім перевірки.\n3. Тримати перегенерацію безпечною: значення Seed записано, зони-винятки мають теги й завжди завантажені, усередині об'єму нічого не поставлено вручну.\n\nRun the lesson in this order; it should take 20 to 30 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: Цього тижня з'явилися графи біомів, природні переходи, зони-винятки, перевірка посадки на ґрунт, а ще каміння, ґрунтовий покрив і берегова лінія від PCG. Today: Сьогодні День боса: PCG наповнює весь острів, і ніщо не висить у повітрі, а чотири кадри, 60-секундний проліт і показники stat unit це доводять. One encouraging line: Бронза тобі цілком під силу, а вперше побачити весь острів у рослинах і камінні — мить, якою варто насолодитися.); 2 lines on why today matters and where it comes back, in plain words (from this: Це доказ 8-го тижня: одна людина за правилами перетворює мапу на живий острів за один день. Студії потрібна земля, що добре читається з повітря, тримає вільними коридори й ділянки під забудову і все одно працює на звичайному ПК. It comes back: Наступного тижня ти збудуєш район 1 на землі, яку сьогодні звільнено. У День 41 почнеш із пробної ділянки й бюджету кадру. У День 44 копія твого графа біому засадить дику місцевість району, а в День 47 рослини острова підійдуть до його садів.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-40-boss-whole-island-pcg exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (ліс і перший біом на весь острів). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Відкрий biome_map.png поруч із рівнем і випиши зони в тому порядку, у якому їх наповнюватимеш. Має вийти: твій порядок роботи.\n   2. Запиши порядок із часом у boss_day40.md. Має вийти: план менш ніж на 4 години. [screenshot]\n   3. Встав свій план у чат із тьютором і попроси його виступити продюсером студії й викреслити все, що не вміститься. Має вийти: план, який реально завершити. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): План часу: я даю тьютору свій план. Він грає продюсера студії й викреслює все, що не вміститься в 4 години. Otherwise skip it.\n6. Review: ask me these questions from earlier days, one at a time, and correct me kindly: Day 37: why do you test biomes on a transect before you dress the whole island? | Day 33: what do HLODs show when cells are not loaded?\n7. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n8. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\nIf I want to go deeper, recommend this free video: \"Foliage Optimization in Unreal Engine 5 | Tutorial\" by Fallen Horizon: https://www.youtube.com/watch?v=cbeV- Запиши таблицю оцінювання в self_review_day40.md і оціни себе. Має вийти: п'ять оцінок, разом до 10.\n   2. Опиши свій аркуш і числа в новому чаті з тьютором (або завантаж зображення, якщо чат їх приймає). Попроси три нотатки «бачу, чому, як виправити» від імені арт-директора студії. Має вийти: три нотатки. [screenshot]\n   3. Постав тьютору одне уточнювальне питання, потім запиши своє рішення, свою медаль і реальний час. Має вийти: записана Бронза, Срібло чи Золото. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Обмін ролями: три раунди нотаток «бачу, чому, як виправити» до острова, який вигадує тьютор. Він оцінює кожну мою нотатку за конкретність і доброзичливість. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; tier (Bronze, Silver, Gold) = медаль (Бронза, Срібло, Золото); lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; rubric = таблиця оцінювання; self-review = самоперевірка; review (by tutor or art director) = огляд; breakdown = розбір; see-why-fix note = нотатка «бачу, чому, як виправити»; credits line = рядок авторства; reference photo / hero photo = фото-референс / ключове фото; comparison sheet, board (an image) = аркуш (аркуш порівняння, аркуш референсів); click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; File Explorer = Провідник; vertex / edge / face = вершина / ребро / грань; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; material slot / node / pin = слот матеріалу / вузол / вхід; volume (PCG Volume, Post Process Volume) = об'єм; World Partition cell = комірка; seed = зерно (налаштування Seed); keep-out zone / footprint test / grounding = зона-виняток / тест опори / посадка на ґрунт; map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; district / plot / plot plan = район / ділянка / план ділянки; summit, hilltop = верхівка; vista / blockout / landmark = панорама / блокаут / орієнтир; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; light route = полегшений варіант (light route); proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}], "handin": [{"en": "summary.md", "uk": "summary.md (звіт дня)"}, {"en": "boss_day40.md: your plan with real times, every seed, and stat unit and memory at CAM_Wide (Boss)", "uk": "boss_day40.md (план із реальним часом, кожне значення Seed, stat unit і пам'ять на CAM_Wide) (День боса)"}, {"en": "boss_board_day40.png: each shot beside its reference photo and its Day 32 shot (Boss)", "uk": "boss_board_day40.png (кожен кадр поруч зі своїм фото-референсом і кадром з Дня 32) (День боса)"}, {"en": "footprint_test.md: island-wide, every layer (Boss)", "uk": "footprint_test.md (увесь острів, кожен шар) (День боса)"}, {"en": "self_review_day40.md: scores, the tutor's notes, your decision and your tier (Boss)", "uk": "self_review_day40.md (оцінки, нотатки тьютора, твоє рішення й медаль) (День боса)"}, {"en": "clip_day40.mp4: 30 to 60 seconds, under 50 MB; keep it: Day 60's progress reel uses it (Boss)", "uk": "clip_day40.mp4 (30–60 секунд, менше 50 МБ; збережи його: з нього складеш ролик прогресу в День 60) (День боса)"}], "goal": {"en": "By the end of today PCG dresses your whole island: forest, biomes, rocks, ground cover and shoreline. The keep-outs are clean and nothing floats, proved in four shots beside reference photos, a 60-second flight and a stat unit reading.", "uk": "До кінця дня PCG наповнює весь твій острів: ліс, біоми, каміння, ґрунтовий покрив і берегова лінія. Зони-винятки чисті, і ніщо не висить у повітрі. Доводять це чотири кадри поруч із фото-референсами, 60-секундний проліт і показники stat unit."}, "uses": [{"en": "Day 35: the forest valley", "uk": "День 35: лісова долина"}, {"en": "Day 37: biome_map.png and your three biome graphs", "uk": "День 37: biome_map.png і три твої графи біомів"}, {"en": "Day 38: the keep-outs, the grounding and footprint_test.md", "uk": "День 38: зони-винятки, посадка на ґрунт і footprint_test.md"}, {"en": "Day 39: PCG_Rocks, the ground cover and the partitioned shoreline", "uk": "День 39: PCG_Rocks, ґрунтовий покрив і берегова лінія з розбиттям на комірки"}, {"en": "Day 32: the vista cameras CAM_Vista_1 to CAM_Vista_3 and the light recipe", "uk": "День 32: камери панорам CAM_Vista_1–CAM_Vista_3 і рецепт світла"}, {"en": "Day 33: the HLODs and the flying Play set-up", "uk": "День 33: HLOD і налаштування польоту в Play"}], "quiz": [{"q": {"en": "Which Density Filter after Normal To Density keeps slopes under 30 degrees?", "uk": "Який Density Filter після Normal To Density залишає схили менше 30 градусів?"}, "options": [{"en": "Lower Bound 0.5", "uk": "Lower Bound 0.5"}, {"en": "Lower Bound 0.87", "uk": "Lower Bound 0.87"}, {"en": "Upper Bound 0.3", "uk": "Upper Bound 0.3"}], "answer": 1, "explain": {"en": "0.87 is the cosine of 30 degrees. Points on steeper ground have a lower density and are removed.", "uk": "0,87 — це косинус 30 градусів. Точки на крутішому ґрунті мають меншу густоту й прибираються."}}, {"q": {"en": "Your biome looks like plants set in a grid, all the same size and facing the same way. Which node adds variety?", "uk": "Твій біом виглядає як рослини, поставлені за сіткою, усі одного розміру й повернуті в один бік. Який вузол додає різноманітності?"}, "options": [{"en": "Transform Points with a random turn and scale", "uk": "Transform Points з випадковим поворотом і масштабом"}, {"en": "Get Landscape Data", "uk": "Get Landscape Data"}, {"en": "Difference", "uk": "Difference"}, {"en": "Bounds Modifier", "uk": "Bounds Modifier"}], "answer": 0, "explain": {"en": "Transform Points gives each point its own rotation and scale, so no two neighbours match.", "uk": "Transform Points дає кожній точці власний поворот і масштаб, тож жодні дві сусідні не однакові."}}, {"q": {"en": "Your dune grass grows on the ridge at 150 m. What is the likely cause?", "uk": "Твоя дюнна трава росте на хребті на висоті 150 м. Яка ймовірна причина?"}, "options": [{"en": "The cull distance is too short", "uk": "Відстань відсікання надто коротка"}, {"en": "The keep-out is too narrow", "uk": "Зона-виняток надто вузька"}, {"en": "Lumen is off", "uk": "Lumen вимкнений"}, {"en": "Its height band is missing or too wide", "uk": "Її смуги висот немає або вона надто широка"}], "answer": 3, "explain": {"en": "Each biome keeps only the points inside its height band. Dune grass belongs a few metres above the sea.", "uk": "Кожен біом залишає лише точки всередині своєї смуги висот. Дюнній траві місце на кілька метрів вище моря."}}, {"q": {"en": "What makes a natural transition between two biomes?", "uk": "Що створює природний перехід між двома біомами?"}, "options": [{"en": "A straight volume edge", "uk": "Прямий край об'єму"}, {"en": "A border of one species", "uk": "Межа з одного виду"}, {"en": "Overlapping height bands broken into patches by each biome's own clumps", "uk": "Смуги висот, що перекриваються й розбиті на плями власними куртинами кожного біому"}], "answer": 2, "explain": {"en": "Real biomes mix over tens of metres in patches. Overlapping bands plus each biome's clumps copy that.", "uk": "Справжні біоми змішуються плямами на десятках метрів. Перекриття смуг плюс куртини кожного біому це відтворюють."}}, {"q": {"en": "Plants still grow inside district 1's square, and your loop is tagged KeepOutArea. What is likely missing?", "uk": "У квадраті району 1 досі ростуть рослини, хоча твій контур має тег KeepOutArea. Чого, ймовірно, бракує?"}, "options": [{"en": "The Spline Sampler's Dimension set to On Interior, or the loop's Closed Loop tick", "uk": "Dimension: On Interior у Spline Sampler або прапорця Closed Loop на контурі"}, {"en": "A bigger Seed", "uk": "Більший Seed"}, {"en": "Absolute Rotation", "uk": "Absolute Rotation"}], "answer": 0, "explain": {"en": "Only a closed loop sampled On Interior fills the whole square with keep-out points. On the spline alone, only its edge is cleared.", "uk": "Лише замкнений контур із вибіркою On Interior заповнює весь квадрат точками зони-винятку. Якщо брати точки лише на сплайні, звільняється тільки край."}}, {"q": {"en": "A tree with a 1 m root flare stands on a 20-degree slope. How much should it sink?", "uk": "Дерево з розширенням біля кореня 1 м стоїть на схилі 20 градусів. Наскільки його треба заглибити?"}, "options": [{"en": "0.05 m", "uk": "0,05 м"}, {"en": "1 m", "uk": "1 м"}, {"en": "2 m", "uk": "2 м"}, {"en": "About 0.36 m", "uk": "Приблизно 0,36 м"}], "answer": 3, "explain": {"en": "Sink = radius x tan(slope) = 1 x 0.36. Less leaves daylight under the downhill side.", "uk": "Заглиблення = радіус × tan(схилу) = 1 × 0,36. Менше заглиблення лишає просвіт з боку спуску."}}, {"q": {"en": "Your whole-island shoreline volume uses all your memory and the editor slows down. What helps?", "uk": "Об'єм берегової лінії на весь острів забирає всю пам'ять, і редактор гальмує. Що допоможе?"}, "options": [{"en": "Turn off the keep-outs", "uk": "Вимкнути зони-винятки"}, {"en": "Tick Is Partitioned and keep the pebbles small, few and culled", "uk": "Увімкнути Is Partitioned і тримати гальку дрібною, нечисленною й з відстанню відсікання"}, {"en": "Raise Points Per Squared Meter", "uk": "Збільшити Points Per Squared Meter"}], "answer": 1, "explain": {"en": "Partitioning splits the work into cells, and small, sparse, culled meshes keep each cell light.", "uk": "Розбиття на комірки ділить роботу на частини, а дрібні, рідкі меші з відстанню відсікання тримають кожну комірку легкою."}}, {"q": {"en": "You stretched every volume over the island at once, and the editor froze. What should you do next time?", "uk": "Усі об'єми розтягнуто на острів одночасно, і редактор завис. Як діяти наступного разу?"}, "options": [{"en": "Use one huge volume for everything", "uk": "Узяти один величезний об'єм на все"}, {"en": "Turn off World Partition", "uk": "Вимкнути World Partition"}, {"en": "Stretch and Generate one volume at a time, save after each, and watch memory", "uk": "Розтягувати й генерувати один об'єм за раз, зберігати після кожного й стежити за пам'яттю"}, {"en": "Paint the plants by hand", "uk": "Намалювати рослини вручну"}], "answer": 2, "explain": {"en": "One layer at a time shows which layer costs what, and saving after each keeps your work safe.", "uk": "Один шар за раз показує, який шар скільки коштує, а збереження після кожного вберігає твою роботу."}}], "weekInfo": {"week": 8, "title": {"en": "PCG nature for the whole island", "uk": "PCG-природа для всього острова"}, "goal": {"en": "By Friday you have your whole island dressed by your own PCG biome rules, layered, with natural transitions, clear keep-outs and nothing floating, reading beautifully from the air.", "uk": "До п'ятниці весь твій острів заповнений природою за твоїми власними правилами біомів PCG: шарами, з природними переходами, чіткими зонами-винятками й без жодного об'єкта в повітрі, і він гарно читається з висоти."}, "skills": [{"en": "PCG biome rules in Unreal Engine 5 (slope, height, noise and spacing)", "uk": "Правила біомів PCG в Unreal Engine 5 (схил, висота, шум і відстань між об'єктами)"}, {"en": "Procedural keep-outs and grounding checks for playable spaces", "uk": "Процедурні зони-винятки й перевірки посадки на ґрунт для ігрових просторів"}, {"en": "Layered foliage and scatter design, read at every distance", "uk": "Шарова рослинність і розкидання об'єктів, що читаються на будь-якій відстані"}, {"en": "Island-scale partitioned PCG generation within a 16 GB memory budget", "uk": "Генерація PCG на весь острів із розбиттям на комірки, у межах бюджету пам'яті 16 ГБ"}]}, "morning": {"sofar": {"en": "This week you built biome graphs, natural transitions, keep-outs, a grounding check, and rocks, ground cover and a shoreline by PCG.", "uk": "Цього тижня з'явилися графи біомів, природні переходи, зони-винятки, перевірка посадки на ґрунт, а ще каміння, ґрунтовий покрив і берегова лінія від PCG."}, "today": {"en": "It is Boss day: you dress your whole island by PCG with nothing floating, and prove it in four shots, a 60-second flight and a stat unit reading.", "uk": "Сьогодні День боса: PCG наповнює весь острів, і ніщо не висить у повітрі, а чотири кадри, 60-секундний проліт і показники stat unit це доводять."}, "cheer": {"en": "Bronze sits well within your reach, and seeing your whole island dressed for the first time is a moment to enjoy.", "uk": "Бронза тобі цілком під силу, а вперше побачити весь острів у рослинах і камінні — мить, якою варто насолодитися."}, "quote": {"text": {"en": "The planting of trees is the least self-centered of all that we do.", "uk": "Садити дерева — найменш егоїстична з усіх наших справ."}, "author": {"en": "Thornton Wilder", "uk": "Торнтон Вайлдер"}, "source": "https://en.wikiquote.org/wiki/Thornton_Wilder"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-40-boss-whole-island-pcg", "mapHref": "../../COURSE.html", "prevHref": "../Day-39-layered-detail-from-the-air/START-HERE.html", "nextHref": "../Day-41-district1-sample-and-budget/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8 and Krita. I am a beginner on Day 40. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me and don't write code.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: Інші біоми, дрібниці, перевірки, кадри й проліт на час (медалі).\nIt's part of: Увесь острів наповнено PCG (ліс, біоми, каміння, ґрунтовий покрив і берегова лінія) в об'ємах із розбиттям на комірки. Зони-винятки чисті, ніщо не висить, HLOD перебудовано. Доводять це чотири кадри, аркуш, 60-секундний проліт і показники stat unit. (L_Island, увесь острів. Кадри з CAM_Vista_1–CAM_Vista_3 (День 32) і з CAM_Wide. CAM_Wide — нова камера на висоті 200–250 м, приблизно за 1 км у морі, що показує весь острів.).\nWhy it matters: Це доказ 8-го тижня: одна людина за правилами перетворює мапу на живий острів за один день. Студії потрібна земля, що добре читається з повітря, тримає вільними коридори й ділянки під забудову і все одно працює на звичайному ПК. It comes back: Наступного тижня ти збудуєш район 1 на землі, яку сьогодні звільнено. У День 41 почнеш із пробної ділянки й бюджету кадру. У День 44 копія твого графа біому засадить дику місцевість району, а в День 47 рослини острова підійдуть до його садів.\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-40-boss-whole-island-pcg (on the drive I chose on Day 0).\nWhat I already know: День 35: лісова долина; День 37: biome_map.png і три твої графи біомів; День 38: зони-винятки, посадка на ґрунт і footprint_test.md; День 39: PCG_Rocks, ґрунтовий покрив і берегова лінія з розбиттям на комірки; День 32: камери панорам CAM_Vista_1–CAM_Vista_3 і рецепт світла; День 33: HLOD і налаштування польоту в Play; today's lessons: Брифінг перед Днем боса: від трансекти до всього острова (мікроурок); Перевірки на весь острів: зони-винятки, ряди й висячі об'єкти (мікроурок); Кадри, що доводять острів (мікроурок); Самоперевірка з тьютором (мікроурок). Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- Ліс: рамки лісу в кожній лісовій долині з мапи біомів, підігнані під кожну долину й поза всіма зонами-винятками. Полегшений варіант: копії твого об'єму PCG_ForestLite.\n- Біоми: кожен об'єм біому розтягнуто на весь острів, вище за верхівку, з увімкненим Is Partitioned (спершу Cleanup, потім прапорець, потім Generate). Кожен біом росте там, де дозволяють його правила, і зі 100 м не видно прямого краю біому.\n- Дрібниці: об'єми каміння й ґрунтового покриву так само розтягнуто на весь острів, а берегова лінія йде довкола всього узбережжя.\n- Зони-винятки чисті: кожна дорога, річка, озеро, обидва квадрати районів і коридор вільні. LaneGauge проходить коридор.\n- Тест опори пройдено для кожного шару (висить не більше 1 з 20): по 20 випадкових місць на шар з усього острова.\n- HLOD перебудовано, і в Play весь острів читається з моря за 800 м. Кадри з чотирьох камер (1920 × 1080) лежать у boss_board_day40.png поруч із фото-референсами й твоїми кадрами панорам з Дня 32. Показники stat unit (Frame і GPU) і пам'ять на CAM_Wide записано в boss_day40.md — це відправна точка для бюджету наступного тижня.\n\nMy checklist (the same numbers show on my course page):\n1. Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: boss_day40.md з планом. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Запусти таймер і скопіюй Seed кожного об'єму з biome_rules.md у boss_day40.md. Перевірка: план вкладається в 4 години. (from lesson 1)\n2. Завантаж увесь острів. Піджени рамки лісу під кожну лісову долину з biome_map.png, поза зонами-винятками, і генеруй їх по одній. Якщо під лісом тісниться біом, обведи ліс замкненим контуром з тегом KeepOutArea (KO_Forest01), як у День 38. Перевірка: зі 150 м кожна лісова долина заповнена, без квадратних країв. (from lesson 1)\n3. Розтягни перший об'єм біому на весь острів: клацни Cleanup, увімкни Is Partitioned, клацни Generate і збережи. Слабкий ПК: перезапускай редактор між об'ємами й роби двома половинами, якщо пам'ять перевищує 15 ГБ (див. розділ «Слабкий ПК» на сторінці ACCOUNTS-AND-INSTALLS.html). Перевірка: біом росте в кожній зоні, яку дає йому мапа. (from lesson 1)\n4. Те саме зроби для двох інших біомів, по одному, зберігаючи після кожного. Перевірка: кожна зона biome_map.png наповнена. (from lesson 1)\n5. Так само розтягни на весь острів об'єми каміння й ґрунтового покриву й подивися на берегову лінію. Перевірка: каміння всюди збирається на схилах, а лінія каміння йде вздовж усього узбережжя. (from lesson 1)\n6. Пролети на висоті 30 м над кожною зоною-винятком з keepouts.md: дороги, річка, озеро й обидва квадрати районів. Потім проведи LaneGauge уздовж коридору на висоті маршруту. Перевірка: ніщо не росте там, де не можна, а куб-калібр проходить, нічого не зачепивши. (from lesson 2)\n7. Зроби тест опори: по 20 випадкових місць з усього острова на кожен шар. Виправляй у графі й перевіряй знову. Перевірка: у footprint_test.md у кожному шарі висить не більше 1 з 20. (from lesson 2)\n8. Подивися на острів зі 100 м і 30 м: чи немає прямих країв і рядів. Найгірше виправ значенням Seed або смугою. Перевірка: зі 100 м не видно жодного прямого краю біому чи ряду. (from lesson 2)\n9. Перебудуй HLOD, потім запусти Play і відлети на 800 м у море. Перевірка: увесь наповнений острів видно на обрії. (from day 33, lesson 4)\n10. Зніми ще раз CAM_Vista_1–CAM_Vista_3 і нову заблоковану CAM_Wide на висоті 200–250 м. Перевірка: чотири файли 1920 × 1080: island_vista1.png–island_vista3.png і island_wide.png. (from lesson 3)\n11. Зроби boss_board_day40.png: кожен кадр поруч зі своїм фото-референсом і своїм кадром з Дня 32. Перевірка: чотири підписані рядки. (from lesson 3)\n12. Перейди в CAM_Wide командою Pilot і зчитай stat unit і пам'ять. Запиши їх у boss_day40.md. Потім запиши clip_day40.mp4 (Win+Alt+R). Що показати: повільно облети сьогоднішній результат із трьох ракурсів твого аркуша й затримайся на найкращому виді. 30–60 секунд, без музики й монтажу. Перевірка: у Провіднику (File Explorer) кліп менший за 50 МБ. Якщо ні, запиши 30 секунд. (from lesson 3)\n13. Оціни себе за таблицею оцінювання й попроси тьютора про нотатки «бачу, чому, як виправити». Запиши в self_review_day40.md оцінки, нотатки, своє рішення, свою медаль і реальний час. Перевірка: п'ять оцінок, три нотатки й одне рішення. (from lesson 4)\n14. В Unreal вибери File > Save All. Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: на вкладці рівня немає позначки *, а кожна назва зі списку є в папці, у кожної є розмір. (from lesson 4)\n\nToday is a BOSS build. Ask me what time I started; whenever I tell you the time, tell me which tier I'm on track for. At the end, ask my finish time. Tiers:\n- Бронза: ліс, усі три біоми, каміння й берегова лінія розставлені PCG по всьому острову, а зони-винятки вільні. Є чотири кадри, аркуш, stat unit і проліт на 30–60 секунд — усе за 4 години.\n- Срібло: тест опори пройдено для кожного шару, і зі 100 м не видно жодного прямого краю біому чи ряду. Куб-калібр проходить коридор, а в Play наповнений острів видно з моря за 800 м.\n- Золото: поруч зі своїм фото кожен кадр витримує 3-секундний погляд, а все готово за 3 години 30 хвилин. Час кадру на CAM_Wide менший за 16,6 мс (на слабкому ПК — за записаних налаштувань). Додай одне завдання понад план: спільний підграф зон-винятків (Collapse Nodes > Graph Asset) або колоду, викинуту морем, з Blender на березі.\n\nHow to help: ask which step number I'm on, then give me only the next step: the exact clicks and what I should see. When I send a screenshot, compare it with my reference, my sizes and the spec, and name one thing to fix at a time.\nCheck every save and export by reopening it before we move on:\n- a .md or .txt: open it with Notepad; the text is there, and the name doesn't end in .md.txt\n- the clip: right-click > Properties shows 30 to 60 seconds and under 50 MB\nWhen I write \"готово\", and in any case before the day ends, check with me one item at a time (yes/no): each spec point, then each file on my hand-in list, ready in my day work folder (skip summary.md: the day report writes it next):\n1. boss_day40.md (план із реальним часом, кожне значення Seed, stat unit і пам'ять на CAM_Wide) (День боса)\n2. boss_board_day40.png (кожен кадр поруч зі своїм фото-референсом і кадром з Дня 32) (День боса)\n3. footprint_test.md (увесь острів, кожен шар) (День боса)\n4. self_review_day40.md (оцінки, нотатки тьютора, твоє рішення й медаль) (День боса)\n5. clip_day40.mp4 (30–60 секунд, менше 50 МБ; збережи його: з нього складеш ролик прогресу в День 60) (День боса)\nFinish with a short list of anything missing, the tier I reached, and one line on where this work comes back and what it will look like there. Then tell me the order for the end of the day: first the day report (the Copy the day report button at the bottom of my course page) into summary.md, and only then hand in all the files on the list, summary.md too.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; tier (Bronze, Silver, Gold) = медаль (Бронза, Срібло, Золото); day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; rubric = таблиця оцінювання; self-review = самоперевірка; review (by tutor or art director) = огляд; breakdown = розбір; see-why-fix note = нотатка «бачу, чому, як виправити»; checklist = чек-лист; credits line = рядок авторства; reference photo / hero photo = фото-референс / ключове фото; comparison sheet, board (an image) = аркуш (аркуш порівняння, аркуш референсів); click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); File Explorer = Провідник; vertex / edge / face = вершина / ребро / грань; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; collision / UCX collision box = колізія / блок UCX; material slot / node / pin = слот матеріалу / вузол / вхід; volume (PCG Volume, Post Process Volume) = об'єм; World Partition cell = комірка; seed = зерно (налаштування Seed); keep-out zone / footprint test / grounding = зона-виняток / тест опори / посадка на ґрунт; map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; district / plot / plot plan = район / ділянка / план ділянки; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; summit, hilltop = верхівка; vista / blockout / landmark = панорама / блокаут / орієнтир; locked camera / locked exposure = заблокована камера / зафіксована експозиція; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; light route = полегшений варіант (light route); proof (picture) = доказ.\n\nStart by asking for my best reference photo. Then, one at a time, my sizes and my step number.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender.", "reportPrompt": "Help me write today's report for summary.md. I write it before I hand in. Talk to me in simple Ukrainian, and never use gendered forms about me. Keep the English labels below exactly; the text after each label may be Ukrainian.\nAsk me one thing at a time, and skip whatever I've already pasted below:\n1. My lesson summaries («Засвоєно» / «Було важко»), or which lessons I skipped.\n2. My first score in the page's \"Check yourself\" quiz.\n3. How far the build got: done, partly or blocked (if blocked, where).\n4. The time I finished the Boss build (  return '<section class="card glass morning"><div class="mgrid">'+(m.sofar?'<div>'+lab(u('sofar'),'gold')+shelf+'<p class="mtxt">'+lk(x(m.sofar))+'</p></div>':'')+(m.today?'<div>'+lab(u('todayL'))+'<p class="mtxt">'+lk(x(m.today))+'</p></div>':'')+'</div>'+(m.cheer?'<p class="cheer">'+esc(x(m.cheer))+'</p>':'')+(qt?'<figure class="quote well">'+kn('quote')+'<blockquote>'+esc(qt)+'</blockquote>'+(q.author?'<figcaption>'+esc(x(q.author))+'</figcaption>':'')+'</figure>':'')+'</section>'}
function setLang(l){lang=l;try{localStorage.setItem('devteam:lang',lang)}catch(e){};render()}
function toggleLang(){setLang(lang==='uk'?'en':'uk')}
/* keep open sections and keyboard focus across re-renders */
const openD=new Set();
function tg(e){if(e.open)openD.add(e.id);else openD.delete(e.id)}
const op=id=>openD.has(id)?' open':'';
function render(){const ae=document.activeElement,fid=ae&&(ae.id||(ae.getAttribute('data-th')?'th-'+ae.getAttribute('data-th'):ae.getAttribute('lang')&&ae.closest('.seg')?'lg-'+ae.getAttribute('lang'):''));
 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);
 const b=D.build,P=Math.round(prog()*100);
 document.getElementById('top').innerHTML='<div class="topin glass"><a class="maplink" href="'+esc(D.mapHref)+'">'+kn('map')+u('map')+'</a><div class="crumb"><b>'+esc(x(D.learnerName))+'</b><span>'+u('week')+' '+D.week+'</span><span>'+u('day')+' '+D.day+' '+u('of')+' '+D.total+'</span></div>'+controls(lang,'setLang')+'</div><div class="tline"><i style="width:'+P+'%"></i></div>';
 const state=w=>w<D.week?'b':w===D.week?'n':'p';
 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 let wk='';if(D.weekInfo){const w=D.weekInfo;wk='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}
 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p>'+(b.next?'<div class="back well">'+kn('arrow')+'<div><b>'+u('comes')+'</b><br>'+lk(x(b.next))+'</div></div>':'')+'<div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.assetFiles&&D.assetFiles.length?'<p class="files">'+ic('folder')+'<span>'+u('filesL')+' '+D.assetFiles.map(f=>'<a href="assets/'+encodeURIComponent(f)+'" target="_blank" rel="noopener">'+esc(f)+'</a>').join(', ')+'</span></p>':D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+=handinCard();h+=beforeCard();
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div><label class="rcpt" for="r'+i+'"><span class="eyebrow">'+u('rcpt')+'</span><textarea id="r'+i+'" rows="2" placeholder="'+esc(u('rcptPh'))+'" oninput="st.r'+i+'=this.value;save()">'+esc(st['r'+i]||'')+'</textarea></label>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+hList()+chkList()+(hasClip?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<h3>1 · '+u('copyR')+'</h3><p class="muted">'+u('report')+'</p><div class="row"><button class="btn ghost" onclick="cp(reportText())">'+ic('copy')+u('copyR')+'</button></div><h3>2 · '+u('ship')+'</h3>'+hf()+'<p class="muted" style="margin:12px 0 0">'+u('hNote')+'</p></section>';
 h+=qCard();h+=wk;
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();
</script>

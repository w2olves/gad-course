<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 86</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

<script id="data" type="application/json">{"learner": "ib-misha-873821eb", "learnerName": {"en": "Misha", "uk": "Міша"}, "day": 86, "week": 18, "total": 110, "title": {"en": "Roads: BP_Road, a spline road with kerbs and pavements", "uk": "Дороги: BP_Road, дорога на сплайні з бордюрами й тротуарами"}, "theme": {"en": "Week 18: Procedural roads and towns", "uk": "Тиждень 18: Процедурні дороги й міста"}, "build": {"item": {"en": "SM_RoadSection_10m (a 10 m road piece: a 7 m carriageway, kerbs and pavements, 12 m wide) and BP_Road, which bends it along a spline; plus BP_Lane, your narrow version", "uk": "SM_RoadSection_10m (10-метровий шматок дороги: проїзна частина 7 м, бордюри й тротуари, разом 12 м завширшки) і BP_Road, що згинає його вздовж сплайна. Плюс BP_Lane — твоя вужча версія."}, "why": {"en": "Roads are the skeleton of a town: every plot, building and prop hangs off them, so a road tool comes before any town generator. Bending one well-made section along a spline gives clean kerbs and pavements on any curve, at real size, with no hand modelling per street. Spline-mesh roads are a standard technique in open-world production, and knowing when to use them instead of landscape splines or PCG is a design decision you can now explain.", "uk": "Дороги — скелет міста: на них тримаються кожна ділянка, будинок і пропс, тож інструмент для доріг іде перед будь-яким генератором міста. Одна добре зроблена секція, зігнута вздовж сплайна, дає чисті бордюри й тротуари на будь-якому вигині, у справжньому розмірі, без ручного моделювання кожної вулиці. Дороги зі сплайнових мешів — стандартна техніка відкритих світів. Коли брати її, а коли ландшафтні сплайни чи PCG, — дизайнерське рішення, яке ти тепер умієш пояснити."}, "where": {"en": "Blender: TechArt/Blender/road_kit.blend. Unreal: SM_RoadSection_10m in Content/Tools/Meshes, BP_Road in Content/Tools/Blueprints, the practice level Content/Tools/Day86/L_Day86.", "uk": "Blender: TechArt/Blender/road_kit.blend. Unreal: SM_RoadSection_10m у Content/Tools/Meshes, BP_Road у Content/Tools/Blueprints, тренувальний рівень Content/Tools/Day86/L_Day86."}, "spec": [{"en": "SM_RoadSection_10m from Blender: 10 m along X from X = 0, 12 m wide centred on Y = 0 (a 7 m carriageway at Z = 0; kerbs 0.15 m wide and 0.125 m high; pavements 2.35 m wide at Z = 0.125), 10 pieces along X so it bends smoothly, three UCX boxes (the carriageway and each pavement with its kerb), UVs, and materials M_Asphalt, M_Kerb and M_Pavement; exported with export_kit.py (its lowest point is Z = 0, so the base check passes).", "uk": "SM_RoadSection_10m з Blender: 10 м уздовж X від X = 0, 12 м завширшки з центром на Y = 0. Проїзна частина 7 м на Z = 0; бордюри 0,15 м завширшки й 0,125 м заввишки; тротуари 2,35 м завширшки на Z = 0.125. 10 шматків уздовж X для плавного згину, три блоки UCX (проїзна частина й кожен тротуар із бордюром), UV і матеріали M_Asphalt, M_Kerb і M_Pavement. Експортовано скриптом export_kit.py: найнижча точка на Z = 0, тож перевірка основи проходить."}, {"en": "BP_Road: an Actor Blueprint with a Spline component Path and the variables Road Mesh (Static Mesh, default SM_RoadSection_10m), Piece Length (Float, cm, default 1000) and Length Override (Float, cm, default 0, Expose on Spawn), all Instance Editable in Category Road with tooltips; the actor tag Street in Class Defaults.", "uk": "BP_Road — Actor Blueprint з компонентом Spline Path і змінними Road Mesh (Static Mesh, типово SM_RoadSection_10m), Piece Length (Float, см, типово 1000) і Length Override (Float, см, типово 0, Expose on Spawn). Усі Instance Editable, Category Road, з підказками. Тег актора Street у Class Defaults."}, {"en": "Construction Script: if Length Override is above 0, Set Location at Spline Point (index 1) to Length Override along X; Count = Round(spline length / Piece Length), at least 1; Piece = spline length / Count; a For Loop from 0 to Count - 1 adds one Spline Mesh Component (Mobility Static) per piece and shapes it with Set Start and End from the spline's location and direction at both ends (Local space, tangents scaled by Piece). No Tick.", "uk": "Construction Script: якщо Length Override більше 0, Set Location at Spline Point (індекс 1) ставить точку на Length Override уздовж X. Count = Round(довжина сплайна / Piece Length), щонайменше 1; Piece = довжина сплайна / Count. For Loop від 0 до Count - 1 додає на секцію один Spline Mesh Component (Mobility Static) і формує його вузлом Set Start and End: розташування й напрямок сплайна на обох кінцях (Local), тангенти помножено на Piece. Без Tick."}, {"en": "L_Day86: a 300 m ground slab (as on Day 81), one straight BP_Road 100 m long and one with two curves; no gaps or steps between pieces; kerbs unbroken on curves down to the pinch radius you measured.", "uk": "L_Day86: плита землі 300 м (як у День 81), одна пряма BP_Road завдовжки 100 м і одна з двома вигинами. Між секціями немає проміжків чи сходинок. Бордюри цілі на вигинах до виміряного радіуса, де вони затискаються."}, {"en": "You can say when you would use landscape splines, spline meshes or PCG for a road, and the radius below which your section pinches.", "uk": "Ти можеш сказати, коли для дороги брати ландшафтні сплайни, сплайнові меші чи PCG, і назвати радіус, нижче якого твоя секція затискається."}, {"en": "A PCG Volume with PCG_StreetDresser dressing the curved BP_Road with Kerb Offset set for the 12 m road (0, 500, 12.5): props standing on the pavements, none on the carriageway.", "uk": "PCG Volume з PCG_StreetDresser оформлює вигнуту BP_Road з Kerb Offset для дороги 12 м (0, 500, 12.5): пропси стоять на тротуарах, на проїзній частині — жодного."}], "piece1": "SM_RoadSection_10m and BP_Road (built step by step in the lessons)", "piece2": {"en": "On your own: SM_LaneSection_10m and BP_Lane, a child of BP_Road", "uk": "Самостійно: SM_LaneSection_10m і BP_Lane, дочірній від BP_Road"}, "steps": [{"text": {"en": "Check: the results of today's lessons are there (SM_RoadSection_10m in TechArt/Blender/road_kit.blend, and BP_Road with its Construction Script). Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it. Weak PC (16 GB of RAM or less): shrink the PCG volume to 100 x 100 m while you build and grow it for the final pictures (see the weak-PC section of ACCOUNTS-AND-INSTALLS.html). Open road_kit.blend and check SM_RoadSection_10m against the spec in the N panel and the Outliner: size, the 10 pieces along X, the three UCX boxes and the materials. Dry-run export_kit.py, then run it for real. Check: export_log.md says SM_RoadSection_10m: OK, and the FBX is over 10 KB.", "uk": "Спершу переконайся, що результати сьогоднішніх уроків на місці: SM_RoadSection_10m у TechArt/Blender/road_kit.blend і BP_Road з Construction Script. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Слабкий ПК (16 ГБ оперативної пам'яті або менше): під час роботи зменш об'єм PCG до 100 × 100 м, а для фінальних зображень збільш (див. розділ «Слабкий ПК» на сторінці ACCOUNTS-AND-INSTALLS.html). Відкрий road_kit.blend і звір SM_RoadSection_10m з вимогами на панелі N і в Outliner: розмір, 10 шматків уздовж X, три блоки UCX і матеріали. Зроби пробний запуск export_kit.py, потім справжній. Перевірка: export_log.md пише SM_RoadSection_10m: OK, а FBX більший за 10 КБ."}, "lesson": 1}, {"text": {"en": "Import it into Content/Tools/Meshes with your checklist and give its three material slots M_Master instances (dark asphalt, light concrete kerb, paving). Check: the Static Mesh Editor shows about 1000 x 1200 cm and three simple collision boxes (Show > Simple Collision).", "uk": "Імпортуй його в Content/Tools/Meshes за чек-листом і дай трьом слотам матеріалів інстанси M_Master: темний асфальт, світлий бетонний бордюр, плитка. Перевірка: Static Mesh Editor показує близько 1000 × 1200 см і три прості блоки колізії (Show > Simple Collision)."}, "lesson": 1}, {"text": {"en": "Open BP_Road and check it against the spec: Path, the three variables (Category Road, tooltips, Expose on Spawn on Length Override), the tag Street, and the Construction Script. Compile. Check: a green tick and no warnings.", "uk": "Відкрий BP_Road і звір з вимогами: Path, три змінні (Category Road, підказки, Expose on Spawn на Length Override), тег Street і Construction Script. Клацни Compile. Перевірка: зелена позначка й жодних попереджень."}, "lesson": 3}, {"text": {"en": "In L_Day86 place a BP_Road and drag its end point 100 m along X. Check: ten pieces, no gaps or steps between them, and a straight kerb line.", "uk": "Постав у L_Day86 BP_Road і перетягни кінцеву точку на 100 м уздовж X. Перевірка: десять секцій без проміжків і сходинок, лінія бордюру пряма."}, "lesson": 3}, {"text": {"en": "Drag the end to 105 m, then to 95 m. Check: still ten whole pieces, each a little stretched or squashed, with no stub at the end.", "uk": "Перетягни кінець до 105 м, потім до 95 м. Перевірка: досі десять цілих секцій, кожна трохи розтягнута чи стиснута, і без обрубка в кінці."}, "lesson": 3}, {"text": {"en": "Place a second BP_Road with two curves (Alt+drag new points, then drag the points' tangent handles). Check: the kerbs follow both curves without pinching; note the radius where the inner kerb starts to pinch.", "uk": "Постав другу BP_Road з двома вигинами: нові точки перетягуванням з Alt, потім тягни ручки тангент точок. Перевірка: бордюри йдуть за обома вигинами без затискання. Запам'ятай радіус, на якому внутрішній бордюр починає затискатися."}, "lesson": 4}, {"text": {"en": "Switch the viewport to Player Collision, then press Play and walk the mannequin from the carriageway onto a pavement. Check: the carriageway and both pavements show as collision, and the mannequin steps up the kerb.", "uk": "Перемкни в'юпорт на Player Collision, потім клацни Play і проведи манекен з проїзної частини на тротуар. Перевірка: проїзна частина й обидва тротуари показані як колізія, а манекен піднімається на бордюр."}, "lesson": 4}, {"text": {"en": "Place a PCG Volume with PCG_StreetDresser over the curved road and override Kerb Offset to 0, 500, 12.5 on its component. Generate, save L_Day86, open any other level and open L_Day86 again. Check: both roads are still there, props stand on the pavements, not sunk into them, none on the carriageway or hanging over the kerb.", "uk": "Постав над вигнутою дорогою PCG Volume з PCG_StreetDresser і перевизнач на його компоненті Kerb Offset на 0, 500, 12.5. Клацни Generate, збережи L_Day86, відкрий будь-який інший рівень, а тоді знову L_Day86. Перевірка: обидві дороги на місці, пропси стоять на тротуарах і не провалюються, на проїзній частині чи над бордюром — жодного."}, "lesson": 4}, {"text": {"en": "On your own: in road_kit.blend make SM_LaneSection_10m (6 m wide, no kerbs: a 4 m strip with 1 m verges, 10 pieces along X, one UCX box) and export it with export_kit.py. Check: export_log.md says SM_LaneSection_10m: OK, and the FBX is over 10 KB.", "uk": "Самостійно: у road_kit.blend зроби SM_LaneSection_10m — 6 м завширшки, без бордюрів: смуга 4 м з узбіччями по 1 м, 10 шматків уздовж X, один блок UCX. Експортуй скриптом export_kit.py. Перевірка: export_log.md пише SM_LaneSection_10m: OK, а FBX більший за 10 КБ."}, "lesson": 1}, {"text": {"en": "On your own: import it, right-click BP_Road > Create Child Blueprint Class, name it BP_Lane and set its Road Mesh to SM_LaneSection_10m in Class Defaults. Check: BP_Lane bends along a spline exactly like BP_Road, with no new nodes.", "uk": "Самостійно: імпортуй її, клацни правою кнопкою на BP_Road > Create Child Blueprint Class, назви його BP_Lane і встанови в Class Defaults Road Mesh на SM_LaneSection_10m. Перевірка: BP_Lane згинається вздовж сплайна точно як BP_Road, без нових вузлів."}, "lesson": 2}, {"text": {"en": "Take roads_day86.png (both roads from 30 m). Check: the picture is in today's Work folder.", "uk": "Зроби скриншот roads_day86.png: обидві дороги з 30 м. Перевірка: зображення в робочій папці дня."}, "lesson": 4}, {"text": {"en": "Copy road_kit.blend into today's Work folder. Click Copy the day report, paste it into a new tutor chat, answer its questions and save its answer as summary.md in today's Work folder. Drag summary.md, road_kit.blend and roads_day86.png into today's hand-in folder (the button on this page); never a project or level folder. Check: the hand-in folder lists 3 files, each over 1 KB.", "uk": "Скопіюй road_kit.blend у робочу папку дня. Клацни «Копіювати звіт дня», встав текст у новий чат із тьютором, дай відповіді на його запитання й збережи відповідь як summary.md у робочій папці дня. Здай роботу: перетягни файли в сьогоднішню папку здачі (кнопка на цій сторінці): summary.md, road_kit.blend і roads_day86.png. Ніколи не здавай папку проєкту чи рівня. Перевірка: у папці здачі 3 файли, кожен більший за 1 КБ."}, "lesson": 1}], "assets": ["techart/street-dimensions.md"], "next": {"en": "road_kit.blend gets the junction piece tomorrow (Day 87), and from Day 89 BP_TownGenerator lays every street of your town with BP_Road.", "uk": "Завтра (День 87) road_kit.blend отримає деталь перехрестя, а з Дня 89 BP_TownGenerator прокладатиме кожну вулицю твого міста за допомогою BP_Road."}}, "lessons": [{"title": {"en": "Three ways to a road, and a real road section", "uk": "Три шляхи до дороги й справжня секція дороги"}, "minutes": 40, "goals": [{"en": "Compare landscape splines (they reshape the terrain), spline meshes in a Blueprint (one section bent along a spline) and PCG (dressing along a road), and choose spline meshes for town streets made by code.", "uk": "Порівнювати ландшафтні сплайни (змінюють рельєф), сплайнові меші в Blueprint (одна секція, зігнута вздовж сплайна) і PCG (оформлення вздовж дороги) та вибирати сплайнові меші для міських вулиць, зроблених кодом."}, {"en": "Read a street's cross-section from real measures: lanes, kerbs, pavements.", "uk": "Читати поперечний переріз вулиці зі справжніх вимірів: смуги, бордюри, тротуари."}, {"en": "Model SM_RoadSection_10m so it bends well: pieces along its length, origin at the start centre, lowest point on Z = 0.", "uk": "Моделювати SM_RoadSection_10m так, щоб він добре згинався: шматки вздовж довжини, origin у центрі початкового краю, найнижча точка на Z = 0."}], "doalong": [{"en": "In Blender save road_kit.blend in TechArt/Blender. Add a Plane, set its Dimensions to 10 x 12 m, apply the scale and move it so it runs from X 0 to 10 (G X 5). In Edit Mode press Ctrl+R over one of the edges that run along X and make 9 cuts (10 pieces 1 m long).", "uk": "У Blender збережи road_kit.blend у TechArt/Blender. Додай Plane, задай Dimensions 10 × 12 м, застосуй масштаб і пересунь так, щоб він ішов від X 0 до 10 (G X 5). В Edit Mode наведи курсор на ребро, що йде вздовж X, натисни Ctrl+R і зроби 9 розрізів — 10 шматків по 1 м."}, {"en": "Then then add four cuts running along X and slide them to Y = 3.5, -3.5, 3.65 and -3.65: the two inner loops to 3.5 and -3.5, the two outer ones to 3.65 and -3.65 (select each loop and type its Y in the N panel). You see a carriageway, two thin kerb strips and two pavements.", "uk": "Додай чотири розрізи вздовж X і пересунь їх на Y = 3.5, -3.5, 3.65 і -3.65: дві внутрішні петлі на 3.5 і -3.5, дві зовнішні — на 3.65 і -3.65. Вибирай кожну петлю й вводь її Y на панелі N. Має вийти проїзна частина, дві тонкі смуги бордюру й два тротуари."}, {"en": "Select the kerb and pavement faces on one side and press E, Z, 0.125 to lift them 12.5 cm, the kerb height in street-dimensions.md; do the same on the other side. You see a road with raised kerbs and pavements.", "uk": "Виділи грані бордюру й тротуару з одного боку й натисни E, Z, 0.125, щоб підняти їх на 12,5 см — висоту бордюру зі street-dimensions.md. Так само з іншого боку. Має вийти дорога з піднятими бордюрами й тротуарами."}, {"en": "Shift+S > Cursor to World Origin, then Object > Set Origin > Origin to 3D Cursor. In the N panel check that the piece runs from X 0 to 10, centred on Y 0, with its lowest point on Z 0.", "uk": "Shift+S > Cursor to World Origin, потім Object > Set Origin > Origin to 3D Cursor. На панелі N перевір, чи шматок іде від X 0 до 10, з центром на Y 0, а найнижча точка на Z 0."}, {"en": "Give the faces three materials (M_Asphalt, M_Kerb, M_Pavement), unwrap with U > Smart UV Project and name the object SM_RoadSection_10m. You see three colours on the road in Material Preview and its name in the Outliner.", "uk": "Признач граням три матеріали (M_Asphalt, M_Kerb, M_Pavement), розгорни U > Smart UV Project і назви об'єкт SM_RoadSection_10m. У Material Preview на дорозі три кольори, а в Outliner — її назва."}, {"en": "Add three UCX boxes: the carriageway (10 x 7 x 0.2 m, top at Z 0) and each pavement with its kerb (10 x 2.5 x 0.325 m, top at Z 0.125, centred on Y 4.75 or -4.75), named UCX_SM_RoadSection_10m_00 to _02, each with Ctrl+A > All Transforms. Put the road and its boxes in EXPORT > SM_RoadSection_10m and run export_kit.py (dry run, then real). You see SM_RoadSection_10m: OK.", "uk": "Додай три блоки UCX: проїзна частина (10 × 7 × 0,2 м, верх на Z 0) і кожен тротуар із бордюром (10 × 2,5 × 0,325 м, верх на Z 0.125, центр на Y 4.75 або -4.75). Назви їх UCX_SM_RoadSection_10m_00–_02 і для кожного зроби Ctrl+A > All Transforms. Поклади дорогу й блоки в EXPORT > SM_RoadSection_10m і запусти export_kit.py: пробний запуск, потім справжній. Має вийти SM_RoadSection_10m: OK."}], "play": {"en": "Which road tool? The tutor names six roads (a mountain pass, a harbour street with kerbs, a dirt track over hills, a market lane, a motorway, a garden path). For each I choose a landscape spline, a spline mesh Blueprint or PCG, and say why.", "uk": "Який інструмент для дороги: тьютор називає шість доріг — гірський перевал, вулиця гавані з бордюрами, ґрунтова дорога через пагорби, ринковий провулок, автомагістраль, садова стежка. Для кожної вибери ландшафтний сплайн, Blueprint зі сплайновим мешем або PCG і поясни чому."}, "video": {"search": "blender model road section kerb pavement for unreal spline mesh"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Три шляхи до дороги й справжня секція дороги (Day 86, lesson 1 of 4). Today's build: SM_RoadSection_10m (10-метровий шматок дороги: проїзна частина 7 м, бордюри й тротуари, разом 12 м завширшки) і BP_Road, що згинає його вздовж сплайна. Плюс BP_Lane — твоя вужча версія..\nWhat I already know: День 85: PCG_StreetDresser і тег Street; День 77: export_kit.py, щоб експортувати секцію дороги; День 62 і День 63: сплайни, Get Location at Distance Along Spline і цикли в Construction Script; День 12: M_Master і його інстанси.\n\nBy the end of this lesson I can:\n1. Порівнювати ландшафтні сплайни (змінюють рельєф), сплайнові меші в Blueprint (одна секція, зігнута вздовж сплайна) і PCG (оформлення вздовж дороги) та вибирати сплайнові меші для міських вулиць, зроблених кодом.\n2. Читати поперечний переріз вулиці зі справжніх вимірів: смуги, бордюри, тротуари.\n3. Моделювати SM_RoadSection_10m так, щоб він добре згинався: шматки вздовж довжини, origin у центрі початкового краю, найнижча точка на Z = 0.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: Ти маєш PCG_StreetDresser — один граф, що оформлює будь-яку вулицю за правилами, читає маску, знає, де море, і тримає польотні коридори вільними. Today: Ти будуєш BP_Road — дорогу на сплайні зі справжніми бордюрами й тротуарами, першу частину генератора міста. One encouraging line: Дороги поєднують моделювання й Blueprint — дві речі, які тобі вже добре вдаються. Спершу виміряй, а потім дай сплайну зробити вигин.); 2 lines on why today matters and where it comes back, in plain words (from this: Дороги — скелет міста: на них тримаються кожна ділянка, будинок і пропс, тож інструмент для доріг іде перед будь-яким генератором міста. Одна добре зроблена секція, зігнута вздовж сплайна, дає чисті бордюри й тротуари на будь-якому вигині, у справжньому розмірі, без ручного моделювання кожної вулиці. Дороги зі сплайнових мешів — стандартна техніка відкритих світів. Коли брати її, а коли ландшафтні сплайни чи PCG, — дизайнерське рішення, яке ти тепер умієш пояснити. It comes back: Завтра (День 87) road_kit.blend отримає деталь перехрестя, а з Дня 89 BP_TownGenerator прокладатиме кожну вулицю твого міста за допомогою BP_Road.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-86-spline-road-kerbs-pavements exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and w hole number of pieces leaves no stub.", "uk": "Якщо поділити довжину порівну на ціле число шматків, обрубка не лишиться."}}, {"q": {"en": "Which tool fits a winding country road that should cut into the hills?", "uk": "Який інструмент підходить для звивистої сільської дороги, що має врізатися в пагорби?"}, "options": [{"en": "A spline mesh Blueprint", "uk": "Blueprint зі сплайновим мешем"}, {"en": "Landscape splines, which reshape the terrain", "uk": "Ландшафтні сплайни, що змінюють рельєф"}, {"en": "PCG_StreetDresser", "uk": "PCG_StreetDresser"}, {"en": "A Static Mesh Spawner", "uk": "Static Mesh Spawner"}], "answer": 1, "explain": {"en": "Landscape splines can lower and raise the terrain under the road; a spline mesh only sits on it.", "uk": "Ландшафтні сплайни можуть опускати й піднімати рельєф під дорогою, а сплайновий меш лише лежить на ньому."}}, {"q": {"en": "Why does SM_RoadSection_10m need 10 pieces along its length?", "uk": "Чому SM_RoadSection_10m потребує 10 шматків уздовж довжини?"}, "options": [{"en": "For the UVs", "uk": "Для UV"}, {"en": "For collision", "uk": "Для колізії"}, {"en": "So the mesh can bend smoothly: a mesh with no cuts along its length can only bend at its ends", "uk": "Щоб меш міг плавно згинатися: меш без розрізів уздовж довжини гнеться лише на кінцях"}, {"en": "Unreal needs at least 10 pieces", "uk": "Unreal потребує щонайменше 10 шматків"}], "answer": 2, "explain": {"en": "A spline mesh bends by moving vertices, so it needs vertices along its length to make a smooth curve.", "uk": "Сплайновий меш згинається, пересуваючи вершини, тож для плавної кривої йому потрібні вершини вздовж довжини."}}, {"q": {"en": "Your kerbs pinch on a tight curve. What do you change first?", "uk": "Бордюри затискаються на крутому вигині. Що змінити спершу?"}, "options": [{"en": "The layout: keep curves above the pinch radius", "uk": "Планування: тримати вигини ширшими за радіус затискання"}, {"en": "The material", "uk": "Матеріал"}, {"en": "Piece Length to 100 m", "uk": "Piece Length на 100 м"}, {"en": "The tag", "uk": "Тег"}], "answer": 0, "explain": {"en": "A 12 m section folds on its inside edge when a curve is too tight for its width (with 10 m pieces, often below 20 to 30 m), so the fix is a gentler curve.", "uk": "Секція 12 м складається по внутрішньому краю, коли вигин надто крутий для її ширини (з шматками 10 м часто нижче 20–30 м). Тож виправлення — пологіший вигин."}}, {"q": {"en": "What is Length Override for?", "uk": "Для чого Length Override?"}, "options": [{"en": "It changes the road's width", "uk": "Змінює ширину дороги"}, {"en": "It turns the road off", "uk": "Вимикає дорогу"}, {"en": "It sets the number of lanes", "uk": "Задає кількість смуг"}, {"en": "It lets a generator set a straight road's length when it spawns BP_Road", "uk": "Дає генератору задати довжину прямої дороги під час створення BP_Road"}], "answer": 3, "explain": {"en": "Expose on Spawn shows it on Spawn Actor from Class, so tomorrow's generator can make roads of any length.", "uk": "Expose on Spawn показує його на Spawn Actor from Class, тож завтрашній генератор зможе робити дороги будь-якої довжини."}}], "weekInfo": null, "morning": {"sofar": {"en": "You have PCG_StreetDresser: one graph that dresses any street by rules, reads a mask, knows where the sea is and keeps flight corridors clear.", "uk": "Ти маєш PCG_StreetDresser — один граф, що оформлює будь-яку вулицю за правилами, читає маску, знає, де море, і тримає польотні коридори вільними."}, "today": {"en": "You build BP_Road, a spline road with real kerbs and pavements: the first piece of your town generator.", "uk": "Ти будуєш BP_Road — дорогу на сплайні зі справжніми бордюрами й тротуарами, першу частину генератора міста."}, "cheer": {"en": "Roads mix modelling and Blueprints, two things you already do well; measure first, then let the spline do the bending.", "uk": "Дороги поєднують моделювання й Blueprint — дві речі, які тобі вже добре вдаються. Спершу виміряй, а потім дай сплайну зробити вигин."}, "quote": {"text": {"en": "Streets and their sidewalks, the main public places of a city, are its most vital organs.", "uk": "Вулиці та їхні тротуари, головні громадські місця міста, — його найживотворніші органи."}, "author": {"en": "Jane Jacobs", "uk": "Джейн Джейкобс"}, "source": "The Death and Life of Great American Cities (book), 1961"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-86-spline-road-kerbs-pavements", "mapHref": "../../COURSE.html", "prevHref": "../Day-85-boss-pcg-street-dresser/START-HERE.html", "nextHref": "../Day-87-road-layout-junctions-plots/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Blender 5.x and Unreal Engine 5.8. I am a beginner on Day 86. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me: when my Blueprint or script fails, ask for the error message or a screenshot of the graph, point to the line or node that is wrong and explain why, then let me fix it myself. Never write the whole tool for me.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: Самостійно: SM_LaneSection_10m і BP_Lane, дочірній від BP_Road.\nIt's part of: SM_RoadSection_10m (10-метровий шматок дороги: проїзна частина 7 м, бордюри й тротуари, разом 12 м завширшки) і BP_Road, що згинає його вздовж сплайна. Плюс BP_Lane — твоя вужча версія. (Blender: TechArt/Blender/road_kit.blend. Unreal: SM_RoadSection_10m у Content/Tools/Meshes, BP_Road у Content/Tools/Blueprints, тренувальний рівень Content/Tools/Day86/L_Day86.).\nWhy it matters: Дороги — скелет міста: на них тримаються кожна ділянка, будинок і пропс, тож інструмент для доріг іде перед будь-яким генератором міста. Одна добре зроблена секція, зігнута вздовж сплайна, дає чисті бордюри й тротуари на будь-якому вигині, у справжньому розмірі, без ручного моделювання кожної вулиці. Дороги зі сплайнових мешів — стандартна техніка відкритих світів. Коли брати її, а коли ландшафтні сплайни чи PCG, — дизайнерське рішення, яке ти тепер умієш пояснити. It comes back: Завтра (День 87) road_kit.blend отримає деталь перехрестя, а з Дня 89 BP_TownGenerator прокладатиме кожну вулицю твого міста за допомогою BP_Road.\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-86-spline-road-kerbs-pavements (on the drive I chose on Day 0).\nWhat I already know: День 85: PCG_StreetDresser і тег Street; День 77: export_kit.py, щоб експортувати секцію дороги; День 62 і День 63: сплайни, Get Location at Distance Along Spline і цикли в Construction Script; День 12: M_Master і його інстанси; today's lessons: Три шляхи до дороги й справжня секція дороги; Один шматок, зігнутий між двома точками: Spline Mesh Component; Уся дорога: шматки, що точно вкладаються; Добрі дороги: вигини, колізія й оформлення. Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- SM_RoadSection_10m з Blender: 10 м уздовж X від X = 0, 12 м завширшки з центром на Y = 0. Проїзна частина 7 м на Z = 0; бордюри 0,15 м завширшки й 0,125 м заввишки; тротуари 2,35 м завширшки на Z = 0.125. 10 шматків уздовж X для плавного згину, три блоки UCX (проїзна частина й кожен тротуар із бордюром), UV і матеріали M_Asphalt, M_Kerb і M_Pavement. Експортовано скриптом export_kit.py: найнижча точка на Z = 0, тож перевірка основи проходить.\n- BP_Road — Actor Blueprint з компонентом Spline Path і змінними Road Mesh (Static Mesh, типово SM_RoadSection_10m), Piece Length (Float, см, типово 1000) і Length Override (Float, см, типово 0, Expose on Spawn). Усі Instance Editable, Category Road, з підказками. Тег актора Street у Class Defaults.\n- Construction Script: якщо Length Override більше 0, Set Location at Spline Point (індекс 1) ставить точку на Length Override уздовж X. Count = Round(довжина сплайна / Piece Length), щонайменше 1; Piece = довжина сплайна / Count. For Loop від 0 до Count - 1 додає на секцію один Spline Mesh Component (Mobility Static) і формує його вузлом Set Start and End: розташування й напрямок сплайна на обох кінцях (Local), тангенти помножено на Piece. Без Tick.\n- L_Day86: плита землі 300 м (як у День 81), одна пряма BP_Road завдовжки 100 м і одна з двома вигинами. Між секціями немає проміжків чи сходинок. Бордюри цілі на вигинах до виміряного радіуса, де вони затискаються.\n- Ти можеш сказати, коли для дороги брати ландшафтні сплайни, сплайнові меші чи PCG, і назвати радіус, нижче якого твоя секція затискається.\n- PCG Volume з PCG_StreetDresser оформлює вигнуту BP_Road з Kerb Offset для дороги 12 м (0, 500, 12.5): пропси стоять на тротуарах, на проїзній частині — жодного.\n\nMy checklist (the same numbers show on my course page):\n1. Спершу переконайся, що результати сьогоднішніх уроків на місці: SM_RoadSection_10m у TechArt/Blender/road_kit.blend і BP_Road з Construction Script. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Слабкий ПК (16 ГБ оперативної пам'яті або менше): під час роботи зменш об'єм PCG до 100 × 100 м, а для фінальних зображень збільш (див. розділ «Слабкий ПК» на сторінці ACCOUNTS-AND-INSTALLS.html). Відкрий road_kit.blend і звір SM_RoadSection_10m з вимогами на панелі N і в Outliner: розмір, 10 шматків уздовж X, три блоки UCX і матеріали. Зроби пробний запуск export_kit.py, потім справжній. Перевірка: export_log.md пише SM_RoadSection_10m: OK, а FBX більший за 10 КБ. (from lesson 1)\n2. Імпортуй його в Content/Tools/Meshes за чек-листом і дай трьом слотам матеріалів інстанси M_Master: темний асфальт, світлий бетонний бордюр, плитка. Перевірка: Static Mesh Editor показує близько 1000 × 1200 см і три прості блоки колізії (Show > Simple Collision). (from lesson 1)\n3. Відкрий BP_Road і звір з вимогами: Path, три змінні (Category Road, підказки, Expose on Spawn на Length Override), тег Street і Construction Script. Клацни Compile. Перевірка: зелена позначка й жодних попереджень. (from lesson 3)\n4. Постав у L_Day86 BP_Road і перетягни кінцеву точку на 100 м уздовж X. Перевірка: десять секцій без проміжків і сходинок, лінія бордюру пряма. (from lesson 3)\n5. Перетягни кінець до 105 м, потім до 95 м. Перевірка: досі десять цілих секцій, кожна трохи розтягнута чи стиснута, і без обрубка в кінці. (from lesson 3)\n6. Постав другу BP_Road з двома вигинами: нові точки перетягуванням з Alt, потім тягни ручки тангент точок. Перевірка: бордюри йдуть за обома вигинами без затискання. Запам'ятай радіус, на якому внутрішній бордюр починає затискатися. (from lesson 4)\n7. Перемкни в'юпорт на Player Collision, потім клацни Play і проведи манекен з проїзної частини на тротуар. Перевірка: проїзна частина й обидва тротуари показані як колізія, а манекен піднімається на бордюр. (from lesson 4)\n8. Постав над вигнутою дорогою PCG Volume з PCG_StreetDresser і перевизнач на його компоненті Kerb Offset на 0, 500, 12.5. Клацни Generate, збережи L_Day86, відкрий будь-який інший рівень, а тоді знову L_Day86. Перевірка: обидві дороги на місці, пропси стоять на тротуарах і не провалюються, на проїзній частині чи над бордюром — жодного. (from lesson 4)\n9. Самостійно: у road_kit.blend зроби SM_LaneSection_10m — 6 м завширшки, без бордюрів: смуга 4 м з узбіччями по 1 м, 10 шматків уздовж X, один блок UCX. Експортуй скриптом export_kit.py. Перевірка: export_log.md пише SM_LaneSection_10m: OK, а FBX більший за 10 КБ. (from lesson 1)\n10. Самостійно: імпортуй її, клацни правою кнопкою на BP_Road > Create Child Blueprint Class, назви його BP_Lane і встанови в Class Defaults Road Mesh на SM_LaneSection_10m. Перевірка: BP_Lane згинається вздовж сплайна точно як BP_Road, без нових вузлів. (from lesson 2)\n11. Зроби скриншот roads_day86.png: обидві дороги з 30 м. Перевірка: зображення в робочій папці дня. (from lesson 4)\n12. Скопіюй road_kit.blend у робочу папку дня. Клацни «Копіювати звіт дня», встав текст у новий чат із тьютором, дай відповіді на його запитання й збережи відповідь як summary.md у робочій папці дня. Здай роботу: перетягни файли в сьогоднішню папку здачі (кнопка на цій сторінці): summary.md, road_kit.blend і roads_day86.png. Ніколи не здавай папку проєкту чи рівня. Перевірка: у папці здачі 3 файли, кожен більший за 1 КБ. (from lesson 1)\n\nHow to help: ask which step number I'm on, then give me only the next step: the exact clicks and what I should see. When I send a screenshot, compare it with my reference, my sizes and the spec, and name one thing to fix at a time.\nCheck every save and export by reopening it before we move on:\n- a .blend: close Blender, double-click the file in today's day work folder (GAD\\Day-86-spline-road-kerbs-pavements), and the model is there (an empty grid means the wrong file was saved)\n- a Blueprint or script: compile or run it once more and see it work, with no errors\n- a .md or .txt: open it with Notepad; the text is there, and the name doesn't end in .md.txt\nWhen I write \"готово\", and in any case before the day ends, check with me one item at a time (yes/no): each spec point, then each file on my hand-in list, ready in my day work folder (skip summary.md: the day report writes it next):\n1. road_kit.blend (SM_RoadSection_10m і SM_LaneSection_10m; завтра до них додасться перехрестя) (→ День 87)\n2. roads_day86.png (пряма й вигнута дороги з бордюрами й тротуарами, з 30 м) (доказ)\nFinish with a short list of anything missing, and one line on where this work comes back and what it will look like there. Then tell me the order for the end of the day: first the day report (the Copy the day report button at the bottom of my course page) into summary.md, and only then hand in all the files on the list, summary.md too.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; checklist = чек-лист; reference photo / hero photo = фото-референс / ключове фото; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; default value = типове значення; mesh = меш; grid = сітка (тільки grid, ніколи mesh); vertex / edge / face = вершина / ребро / грань; origin (and kit pivot) = origin — точка, за яку об' function prog(){const Q=(D.quiz&&D.quiz.length)?1:0,L=D.lessons.length,C=D.build.steps.length;let n=0;D.lessons.forEach((l,i)=>{if(st['q'+i])n++});D.build.steps.forEach((s,i)=>{if(st['c'+i])n++});if(Q&&qDone())n++;return (L+C+Q)?n/(L+C+Q):0}
function qScore(){let n=0;D.quiz.forEach((q,i)=>{if((st.qa||{})[i]===q.answer)n++});return n}
function pick(i,k){st.qa=st.qa||{};if(st.qa[i]!=null)return;st.qa[i]=k;if(qDone()){st.qs=[qScore(),D.quiz.length];if(!st.qs1)st.qs1=st.qs.slice()}save();render();const e=document.getElementById('e'+i);if(e)e.focus({preventScroll:true})}
function retry(){st.qa={};delete st.qs;save();render();const e=document.getElementById('o0_0');if(e)e.focus()}
const isBoss=!!(D.build&&D.build.boss&&D.build.boss.length),isFin=D.day===D.total;
document.body.className=isFin?'fin':isBoss?'boss':'';
const lk=s=>esc(s).replace(/https?:\/\/[^\s<']*[^\s<.,;:)']/g,m=>'<a href="'+m+'" target="_blank" rel="noopener">'+m+'</a>');
function list(a,tag,cls){return '<'+tag+(cls?' class="'+cls+'"':'')+'>'+(a||[]).map(i=>'<li>'+lk(x(i))+'</li>').join('')+'</'+tag+'>'}
const lab=(t,k)=>'<div class="lab'+(k?' k-'+k:'')+'"><span class="dotc"></span>'+t+'</div>';
const kn=n=>'<span class="kn">'+ic(n)+'</span>';
const slider=p=>'<div class="slider"><i style="width:calc('+p+'% - 6px)"></i><b style="left:clamp(13px,'+p+'%,calc(100% - 13px))"></b></div>';
function quiz(){if(!D.quiz||!D.quiz.length)return '';const a=st.qa||{};let ok=0;const L=u('letters');
 const pips='<div class="pips well" aria-hidden="true">'+D.quiz.map((q,i)=>'<i class="'+(a[i]==null?'':a[i]===q.answer?'r':'w')+'"></i>').join('')+'</div>';
 const qs=D.quiz.map((q,i)=>{const c=a[i];if(c===q.answer)ok++;return '<div class="qz"><p class="qq"><span class="qn">'+(i+1)+'</span><span>'+lk(x(q.q))+'</span></p>'+q.options.map((o,k)=>{let cls='opt',mk='<span></span>';if(c!=null){if(k===q.answer){cls+=' right';mk=ic('check','mk')}else if(k===c){cls+=' wrong';mk=ic('x','mk')}}return '<button class="'+cls+'" id="o'+i+'_'+k+'"'+(c!=null?' disabled':'')+' onclick="pick('+i+','+k+')"><span class="lt">'+(L[k]||k+1)+'</span><span>'+esc(x(o))+'</span>'+mk+'</button>'}).join('')+(c!=null?'<p class="exp '+(c===q.answer?'r':'w')+'" id="e'+i+'" tabindex="-1"><b>'+(c===q.answer?u('right'):u('wrong'))+'</b>'+lk(x(q.explain))+'</p>':'')+'</div>'}).join('');
 return '<section class="card glass quiz">'+lab(u('quiz'),'gold')+'<p class="muted" style="margin:-6px 0 14px">'+u('quizSub')+'</p>'+pips+qs+(qDone()?'<div class="score well" role="status"><span class="eyebrow">'+u('score')+'</span><span class="lcd" aria-label="'+ok+' / '+D.quiz.length+'">'+seg(ok+'/'+D.quiz.length)+'</span>'+(st.qs1?'<span class="muted">'+u('first')+': '+st.qs1[0]+'/'+st.qs1[1]+'</span>':'')+'<div class="row"><button class="btn ghost" id="retry" onclick="retry()">'+u('retry')+'</button></div></div>':'')+'</section>'}
function vid(v){if(!v)return '';const link=v.url?'<a href="'+esc(v.url)+'" target="_blank" rel="noopener">'+esc(x(v.title)||v.url)+'</a>'+(v.channel?' <span class="muted">· '+esc(v.channel)+(v.length?' · '+esc(v.length):'')+'</span>':''):'';const s=v.search?'<a href="https://www.youtube.com/results?search_query='+encodeURIComponent(v.search)+'" target="_blank" rel="noopener">'+u('noVid')+': '+esc(v.search)+'</a>':'';const alt=v.alt&&v.alt.url?'<br><span class="eyebrow">UA</span> <a href="'+esc(v.alt.url)+'" target="_blank" rel="noopener">'+esc(v.alt.title||v.alt.url)+'</a>'+(v.alt.channel?' <span class="muted">· '+esc(v.alt.channel)+'</span>':''):'';return '<div class="vid well">'+kn('play')+'<div><b>'+u('more')+'?</b><br>'+(link||s)+alt+(link&&s?'<br><span class="muted" style="font-size:14px">'+s+'</span>':'')+'</div></div>'}
function morning(){const m=D.morning;if(!m)return '';const q=m.quote||{};
 let shelf='';if(D.day>0){shelf='<div class="shelf" aria-hidden="true">';let g='';for(let d=0;d<D.day;d++){let p=0;try{p=(JSON.parse(localStorage.getItem('devteam:'+D.learner+':'+d))||{}).pct||0}catch(e){}g+='<i class="'+(p>=1?'d':'')+(d>0&&d%5===0?' bs':'')+'"></i>';if(d%5===0||d===D.day-1){shelf+='<span class="wkg">'+g+'</span>';g=''}}shelf+='</div>'}
 const qt=lang==='uk'&&q.original?q.original:x(q.text);
 return '<section class="card glass morning"><div class="mgrid">'+(m.sofar?'<div>'+lab(u('sofar'),'gold')+shelf+'<p class="mtxt">'+lk(x(m.sofar))+'</p></div>':'')+(m.today?'<div>'+lab(u('todayL'))+'<p class="mtxt">'+lk(x(m.today))+'</p></div>':'')+'</div>'+(m.cheer?'<p class="cheer">'+esc(x(m.cheer))+'</p>':'')+(qt?'<figure class="quote well">'+kn('quote')+'<blockquote>'+esc(qt)+'</blockquote>'+(q.author?'<figcaption>'+esc(x(q.author))+'</figcaption>':'')+'</figure>':'')+'</section>'}
function setLang(l){lang=l;try{localStorage.setItem('devteam:lang',lang)}catch(e){};render()}
function toggleLang(){setLang(lang==='uk'?'en':'uk')}
/* keep open sections and keyboard focus across re-renders */
const openD=new Set();
function tg(e){if(e.open)openD.add(e.id);else openD.delete(e.id)}
const op=id=>openD.has(id)?' open':'';
function render(){const ae=document.activeElement,fid=ae&&(ae.id||(ae.getAttribute('data-th')?'th-'+ae.getAttribute('data-th'):ae.getAttribute('lang')&&ae.closest('.seg')?'lg-'+ae.getAttribute('lang'):''));
 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);
 const b=D.build,P=Math.round(prog()*100);
 document.getElementById('top').innerHTML='<div class="topin glass"><a class="maplink" href="'+esc(D.mapHref)+'">'+kn('map')+u('map')+'</a><div class="crumb"><b>'+esc(x(D.learnerName))+'</b><span>'+u('week')+' '+D.week+'</span><span>'+u('day')+' '+D.day+' '+u('of')+' '+D.total+'</span></div>'+controls(lang,'setLang')+'</div><div class="tline"><i style="width:'+P+'%"></i></div>';
 const state=w=>w<D.week?'b':w===D.week?'n':'p';
 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 let wk='';if(D.weekInfo){const w=D.weekInfo;wk='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}
 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p>'+(b.next?'<div class="back well">'+kn('arrow')+'<div><b>'+u('comes')+'</b><br>'+lk(x(b.next))+'</div></div>':'')+'<div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.assetFiles&&D.assetFiles.length?'<p class="files">'+ic('folder')+'<span>'+u('filesL')+' '+D.assetFiles.map(f=>'<a href="assets/'+encodeURIComponent(f)+'" target="_blank" rel="noopener">'+esc(f)+'</a>').join(', ')+'</span></p>':D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+=handinCard();h+=beforeCard();
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div><label class="rcpt" for="r'+i+'"><span class="eyebrow">'+u('rcpt')+'</span><textarea id="r'+i+'" rows="2" placeholder="'+esc(u('rcptPh'))+'" oninput="st.r'+i+'=this.value;save()">'+esc(st['r'+i]||'')+'</textarea></label>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+hList()+chkList()+(hasClip?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<h3>1 · '+u('copyR')+'</h3><p class="muted">'+u('report')+'</p><div class="row"><button class="btn ghost" onclick="cp(reportText())">'+ic('copy')+u('copyR')+'</button></div><h3>2 · '+u('ship')+'</h3>'+hf()+'<p class="muted" style="margin:12px 0 0">'+u('hNote')+'</p></section>';
 h+=qCard();h+=wk;
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();
</script>

<script id="data" type="application/json">{"learner": "ib-misha-873821eb", "learnerName": {"en": "Misha", "uk": "Міша"}, "day": 61, "week": 13, "total": 110, "title": {"en": "Blueprint basics: a row of bollards that builds itself", "uk": "Основи Blueprint: ряд стовпчиків, що будує себе сам"}, "theme": {"en": "Week 13: Blueprints for world builders", "uk": "Тиждень 13: Blueprint для творців світів"}, "build": {"item": {"en": "BP_BollardRow and BP_PlanterRow: two small tools that lay rows of meshes from numbers you set in Details, placed in a practice level and on your island", "uk": "BP_BollardRow і BP_PlanterRow: два невеликі інструменти, що розставляють ряди моделей за числами, які ти задаєш у Details, розміщені на тренувальному рівні й на твоєму острові"}, "why": {"en": "Placing 40 bollards by hand takes minutes and they never line up perfectly; a tool does it in one second, exactly, and you can change the whole row later with one number. This is the first step from building a world by hand to building it with code. Studios hire technical artists to make exactly these tools, because one good tool saves the whole team hours every week.", "uk": "Розставляти 40 стовпчиків вручну — це хвилини роботи, і вони ніколи не стають ідеально в лінію; інструмент робить це за одну секунду, точно, а весь ряд можна потім змінити одним числом. Це перший крок від створення світу руками до створення його кодом. Студії наймають технічних художників саме для таких інструментів, бо один добрий інструмент щотижня економить цілій команді години."}, "where": {"en": "A practice level, Content/Tools/Day61/L_Day61, then one row of each along your island's waterfront.", "uk": "Тренувальний рівень Content/Tools/Day61/L_Day61, а потім по одному ряду кожного інструмента вздовж набережної твого острова."}, "spec": [{"en": "BP_BollardRow, an Actor Blueprint in Content/Tools/Blueprints, with one Instanced Static Mesh component named Bollards using SM_Bollard (or /Engine/BasicShapes/Cylinder if you have no bollard, sized 0.3, 0.3, 0.9 through Make Transform's Scale, never through the component's own Scale).", "uk": "BP_BollardRow, Actor Blueprint у Content/Tools/Blueprints, з одним компонентом Instanced Static Mesh на ім'я Bollards, що використовує SM_Bollard (або /Engine/BasicShapes/Cylinder, якщо стовпчика немає, розміром 0.3, 0.3, 0.9 через Scale у Make Transform, ніколи через власний Scale компонента)."}, {"en": "Two variables, both Instance Editable, in the Category Tool, each with a tooltip: Count (Integer, default 5, Slider Range and Value Range 1 to 50) and Spacing (Float, default 150, in centimetres, Slider Range and Value Range 50 to 1000).", "uk": "Дві змінні, обидві Instance Editable, у категорії Tool, кожна з підказкою: Count (Integer, за замовчуванням 5, Slider Range і Value Range від 1 до 50) і Spacing (Float, за замовчуванням 150, у сантиметрах, Slider Range і Value Range від 50 до 1000)."}, {"en": "The Construction Script: Clear Instances, then a For Loop from 0 to Count minus 1, and in the loop body Add Instance with Make Transform whose location is (Index x Spacing, 0, 0). No Event Graph code and no Tick.", "uk": "Construction Script: Clear Instances, потім For Loop від 0 до Count мінус 1, а в тілі циклу Add Instance з Make Transform, де розташування дорівнює (Index x Spacing, 0, 0). Жодного коду в Event Graph і жодного Tick."}, {"en": "Changing Count or Spacing on a placed copy rebuilds the row at once; a rotated copy lays its row in its own direction.", "uk": "Зміна Count або Spacing на розміщеній копії одразу перебудовує ряд; повернена копія розставляє свій ряд у власному напрямку."}, {"en": "BP_PlanterRow, made on your own from a copy: an Instanced Static Mesh named Items, a Mesh variable (Static Mesh object reference) applied with Set Static Mesh, and a Height Offset variable (Float, -100 to 300) that lifts the whole row.", "uk": "BP_PlanterRow, зроблений самостійно з копії: Instanced Static Mesh на ім'я Items, змінна Mesh (посилання на об'єкт Static Mesh), що застосовується через Set Static Mesh, і змінна Height Offset (Float, від -100 до 300), що піднімає весь ряд."}, {"en": "L_Day61 saved with at least five rows; one row of each tool on your island, sitting on the ground.", "uk": "L_Day61 збережено щонайменше з п'ятьма рядами; по одному ряду кожного інструмента на твоєму острові, на землі."}], "piece1": "BP_BollardRow (built step by step in the lessons)", "piece2": {"en": "BP_PlanterRow, on your own: any mesh, plus a height offset", "uk": "BP_PlanterRow, самостійно: будь-яка модель плюс зміщення по висоті"}, "steps": [{"text": {"en": "Open BP_BollardRow and check it against the spec: the Bollards component, Count and Spacing (Instance Editable, Category Tool, ranges, tooltips), and the Construction Script chain Clear Instances > For Loop > Add Instance. Click Compile. Check: the Compile button shows a green tick and the Compiler Results panel shows no warnings.", "uk": "Відкрий BP_BollardRow і звір зі специфікацією: компонент Bollards, Count і Spacing (Instance Editable, категорія Tool, діапазони, підказки) та ланцюжок Construction Script Clear Instances > For Loop > Add Instance. Натисни Compile. Перевірка: кнопка Compile показує зелену позначку, а панель Compiler Results не показує попереджень."}, "lesson": 3}, {"text": {"en": "In L_Day61 place three copies of BP_BollardRow: Count 3, 8 and 20 with Spacing 120, 150 and 300. Check: you see rows of 3, 8 and 20 bollards, and in the Top view the gaps measure 1.2 m, 1.5 m and 3 m (middle-mouse drag shows the distance).", "uk": "У L_Day61 розмісти три копії BP_BollardRow: Count 3, 8 і 20 зі Spacing 120, 150 і 300. Перевірка: ти бачиш ряди з 3, 8 і 20 стовпчиків, а у вигляді Top проміжки дорівнюють 1,2 м, 1,5 м і 3 м (перетягування середньою кнопкою миші показує відстань)."}, "lesson": 2}, {"text": {"en": "Edge tests on one copy: Count 1, then 50; rotate it 90 degrees; press Ctrl+Z three times. Check: you see 1 bollard, then a 73.5 m row, the row turning with the actor, and each undo bringing back the previous row.", "uk": "Тести крайніх випадків на одній копії: Count 1, потім 50; поверни її на 90 градусів; тричі натисни Ctrl+Z. Перевірка: ти бачиш 1 стовпчик, потім ряд завдовжки 73,5 м, ряд, що повертається разом з актором, і кожне скасування повертає попередній ряд."}, "lesson": 4}, {"text": {"en": "In the Content Browser right-click BP_BollardRow > Duplicate and name the copy BP_PlanterRow. Open it and rename the component Bollards to Items. Check: two Blueprints sit in Content/Tools/Blueprints, and BP_PlanterRow compiles with a green tick.", "uk": "У Content Browser клацни правою кнопкою на BP_BollardRow > Duplicate і назви копію BP_PlanterRow. Відкрий її й перейменуй компонент Bollards на Items. Перевірка: у Content/Tools/Blueprints лежать два Blueprint, а BP_PlanterRow компілюється із зеленою позначкою."}, "lesson": 1}, {"text": {"en": "In BP_PlanterRow add a variable Mesh: type Static Mesh (Object Reference), Instance Editable, Category Tool, default your planter or /Engine/BasicShapes/Cube. In the Construction Script, between the white Construction Script pin and Clear Instances, add Items > Set Static Mesh and connect Mesh to its New Mesh pin. Check: changing Mesh on a placed copy swaps every item in that row.", "uk": "У BP_PlanterRow додай змінну Mesh: тип Static Mesh (Object Reference), Instance Editable, категорія Tool, за замовчуванням твоя квітниця або /Engine/BasicShapes/Cube. У Construction Script між білим піном Construction Script і Clear Instances додай Items > Set Static Mesh і з'єднай Mesh з його піном New Mesh. Перевірка: зміна Mesh на розміщеній копії замінює кожен елемент у цьому ряду."}, "lesson": 2}, {"text": {"en": "Add Height Offset (Float, default 0, ranges -100 to 300, Category Tool) and connect it to the Z pin of the Make Vector that feeds the location. Check: Height Offset 50 lifts the whole row by 50 cm, and 0 puts it back on the floor.", "uk": "Додай Height Offset (Float, за замовчуванням 0, діапазони від -100 до 300, категорія Tool) і з'єднай його з піном Z у Make Vector, що живить розташування. Перевірка: Height Offset 50 піднімає весь ряд на 50 см, а 0 повертає його на землю."}, "lesson": 3}, {"text": {"en": "Place two BP_PlanterRow copies in L_Day61 with two different meshes from your kit, and save the level. Check: two different rows come from one Blueprint, and L_Day61 shows no unsaved star in its tab.", "uk": "Розмісти в L_Day61 дві копії BP_PlanterRow з двома різними моделями з твого набору й збережи рівень. Перевірка: з одного Blueprint виходять два різні ряди, а на вкладці L_Day61 немає зірочки незбережених змін."}, "lesson": 2}, {"text": {"en": "Open your island level (L_Island, or your own level if you followed the fast track). Place one BP_BollardRow along the waterfront edge and one BP_PlanterRow on a pavement; set Count and Spacing so they fit, and save. Check: from about 30 m up, both rows read as straight, evenly spaced lines that sit on the ground, with nothing floating.", "uk": "Відкрий рівень свого острова (L_Island або власний рівень, якщо ти проходиш курс швидким шляхом). Розмісти один BP_BollardRow уздовж краю набережної й один BP_PlanterRow на тротуарі; встанови Count і Spacing так, щоб вони пасували, і збережи. Перевірка: приблизно з 30 м угорі обидва ряди читаються як прямі лінії з рівними проміжками, що стоять на землі, і нічого не висить у повітрі."}, "lesson": 4}, {"text": {"en": "Take bp_graph.png (the whole Construction Script graph of BP_BollardRow, node names readable), rows_day61.png (L_Day61 from above with all the rows) and island_day61.png (the two rows on your island). Check: three pictures in today's Work folder, and you can read the node names in the first.", "uk": "Зроби bp_graph.png (весь граф Construction Script у BP_BollardRow, назви вузлів читаються), rows_day61.png (L_Day61 зверху з усіма рядами) і island_day61.png (два ряди на твоєму острові). Перевірка: три картинки в сьогоднішній папці Work, і на першій можна прочитати назви вузлів."}, "lesson": 1}, {"text": {"en": "Record flythrough_day61.mp4 (60 seconds): select placed copies and change Count, Spacing, Mesh and Height Offset while the rows update live. Check: the clip is in today's Work folder and shows at least three live changes.", "uk": "Запиши flythrough_day61.mp4 (60 секунд): виділяй розміщені копії та змінюй Count, Spacing, Mesh і Height Offset, поки ряди оновлюються наживо. Перевірка: кліп лежить у сьогоднішній папці Work і показує щонайменше три зміни наживо."}, "lesson": 4}, {"text": {"en": "Write tool_notes.md: one line for each variable of each tool (what it does and its range), and one line on what you would add next. Check: the file has two short sections, one per tool.", "uk": "Напиши tool_notes.md: по одному рядку на кожну змінну кожного інструмента (що вона робить і який її діапазон) і один рядок про те, що додати далі. Перевірка: у файлі два короткі розділи, по одному на інструмент."}, "lesson": 2}, {"text": {"en": "Click Copy the day report, paste it into a new tutor chat, answer its questions and save its answer as summary.md. Check: summary.md is in today's Work folder with Made, To look at, Hours and To revisit filled in.", "uk": "Натисни Copy the day report, встав його в новий чат із тьютором, дай відповіді на його запитання й збережи його відповідь як summary.md. Перевірка: summary.md лежить у сьогоднішній папці Work із заповненими Made, To look at, Hours і To revisit."}, "lesson": 4}], "assets": ["techart/code-style.md"]}, "lessons": [{"title": {"en": "What a Blueprint is, and your first one", "uk": "Що таке Blueprint і твій перший Blueprint"}, "minutes": 40, "goals": [{"en": "Explain a Blueprint: an asset that holds parts (called components) and a visual script, which you can place in a level as many times as you like.", "uk": "Поясни, що таке Blueprint: асет, який містить частини (їх називають компонентами) і візуальний скрипт, і який можна розмістити на рівні скільки завгодно разів."}, {"en": "Create an Actor Blueprint with a Static Mesh component and place copies of it in a level.", "uk": "Створи Actor Blueprint з компонентом Static Mesh і розмісти його копії на рівні."}, {"en": "Explain Compile (turn the graph into something Unreal can run) and Save, and see that editing the Blueprint updates every placed copy.", "uk": "Поясни Compile (перетворити граф на те, що Unreal може виконати) і Save, і побач, що редагування Blueprint оновлює кожну розміщену копію."}], "doalong": [{"en": "In the Content Browser create the folders Content/Tools/Blueprints and Content/Tools/Day61 (right-click > New Folder). Then choose File > New Level > Basic and save it as L_Day61 in Content/Tools/Day61. You see a small level with a floor, a sky and a sun.", "uk": "У Content Browser створи папки Content/Tools/Blueprints і Content/Tools/Day61 (клацни правою кнопкою > New Folder). Потім вибери File > New Level > Basic і збережи його як L_Day61 у Content/Tools/Day61. Ти бачиш невеликий рівень з підлогою, небом і сонцем."}, {"en": "Open Content/Tools/Blueprints, right-click an empty spot > Blueprint Class, and click Actor in the window that opens. Name it BP_BollardRow and double-click it. You see the Blueprint editor: the Components panel at the top left, the My Blueprint panel below it, and the tabs Viewport, Construction Script and Event Graph in the middle.", "uk": "Відкрий Content/Tools/Blueprints, клацни правою кнопкою на вільному місці > Blueprint Class і натисни Actor у вікні, що відкрилося. Назви його BP_BollardRow і двічі клацни на ньому. Ти бачиш редактор Blueprint: панель Components угорі ліворуч, під нею панель My Blueprint, а посередині вкладки Viewport, Construction Script і Event Graph."}, {"en": "In the Components panel click + Add, type Static Mesh and choose Static Mesh. Name the new component Bollard. In the Details panel on the right set Static Mesh to SM_Bollard (your Day 1 bollard). If you have none, use /Engine/BasicShapes/Cylinder and set its Scale to 0.3, 0.3, 0.9. You see the bollard in the Blueprint's Viewport tab.", "uk": "На панелі Components натисни + Add, введи Static Mesh і вибери Static Mesh. Назви новий компонент Bollard. На панелі Details праворуч встанови Static Mesh на SM_Bollard (твій стовпчик з Дня 1). Якщо його немає, візьми /Engine/BasicShapes/Cylinder і встанови його Scale на 0.3, 0.3, 0.9. Ти бачиш стовпчик на вкладці Viewport Blueprint."}, {"en": "Click Compile at the top left, then Save. Drag BP_BollardRow from the Content Browser into L_Day61, then drag in three more. You see four bollards in the level.", "uk": "Натисни Compile угорі ліворуч, потім Save. Перетягни BP_BollardRow з Content Browser у L_Day61, а потім перетягни ще три. Ти бачиш чотири стовпчики на рівні."}, {"en": "Back in BP_BollardRow select Bollard, set Scale Z to 1.2, then Compile. Look at the level: all four copies grew at once, because a Blueprint is a template. Set Scale Z back to the value you had and Compile again. You see the four copies return to their size.", "uk": "Повернись у BP_BollardRow, вибери Bollard, встанови Scale Z на 1.2, потім натисни Compile. Подивись на рівень: усі чотири копії виросли одночасно, бо Blueprint — це шаблон. Поверни Scale Z на попереднє значення й знову натисни Compile. Ти бачиш, що чотири копії повернулися до свого розміру."}], "play": {"en": "Blueprint or not: the tutor names six things (a street lamp, a texture, a fence that grows along a path, a sound file, a door that opens, a material). For each I say whether it would be an Actor Blueprint and why.", "uk": "Blueprint чи ні: тьютор називає шість речей (вуличний ліхтар, текстуру, паркан, що росте вздовж шляху, звуковий файл, двері, що відчиняються, матеріал). Для кожної я кажу, чи був би це Actor Blueprint, і чому."}, "video": {"search": "unreal engine 5 blueprint basics actor components beginners"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: What a Blueprint is, and your first one (Day 61, lesson 1 of 4).\nToday's build: BP_BollardRow and BP_PlanterRow: two small tools that lay rows of meshes from numbers you set in Details, placed in a practice level and on your island.\n\nBy the end of this lesson I can:\n1. Explain a Blueprint: an asset that holds parts (called components) and a visual script, which you can place in a level as many times as you like.\n2. Create an Actor Blueprint with a Static Mesh component and place copies of it in a level.\n3. Explain Compile (turn the graph into something Unreal can run) and Save, and see that editing the Blueprint updates every placed copy.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (You can model real-size props, build kits, texture them, and build, light and measure a whole world in Unreal Engine.), what I will learn today (You make your first tool: a Blueprint that lays a row of bollards from two numbers, and a second tool on your own.), encourage me (Programming is new, so take each node slowly and lean on your tutor; every tool maker began with a loop just like this one.), and share today's quote: \"Everybody in this country should learn how to program a computer, because it teaches you how to think.\" (Steve Jobs).\n2. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n3. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n4. Game for this lesson: Blueprint or not: the tutor names six things (a street lamp, a texture, a fence that grows along a path, a sound file, a door that opens, a material). For each I say whether it would be an Actor Blueprint and why.\n5. Do-along on today's build (BP_BollardRow (built step by step in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - In the Content Browser create the folders Content/Tools/Blueprints and Content/Tools/Day61 (right-click > New Folder). Then choose File > New Level > Basic and save it as L_Day61 in Content/Tools/Day61. You see a small level with a floor, a sky and a sun.\n   - Open Content/Tools/Blueprints, right-click an empty spot > Blueprint Class, and click Actor in the window that opens. Name it BP_BollardRow and double-click it. You see the Blueprint editor: the Components panel at the top left, the My Blueprint panel below it, and the tabs Viewport, Construction Script and Event Graph in the middle.\n   - In the Components panel click + Add, type Static Mesh and choose Static Mesh. Name the new component Bollard. In the Details panel on the right set Static Mesh to SM_Bollard (your Day 1 bollard). If you have none, use /Engine/BasicShapes/Cylinder and set its Scale to 0.3, 0.3, 0.9. You see the bollard in the Blueprint's Viewport tab.\n   - Click Compile at the top left, then Save. Drag BP_BollardRow from the Content Browser into L_Day61, then drag in three more. You see four bollards in the level.\n   - Back in BP_BollardRow select Bollard, set Scale Z to 1.2, then Compile. Look at the level: all four copies grew at once, because a Blueprint is a template. Set Scale Z back to the value you had and Compile again. You see the four copies return to their size.\n6. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n7. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Variables: numbers you can change in Details", "uk": "Змінні: числа, які можна змінювати в Details"}, "minutes": 40, "goals": [{"en": "Explain a variable: a named box that holds one value; an Integer holds a whole number (5) and a Float holds a number with a decimal point (1.5).", "uk": "Поясни, що таке змінна: іменована скринька, що тримає одне значення; Integer тримає ціле число (5), а Float тримає число з десятковою крапкою (1.5)."}, {"en": "Add the variables Count and Spacing and make them Instance Editable, so each placed copy can have its own values.", "uk": "Додай змінні Count і Spacing і зроби їх Instance Editable, щоб кожна розміщена копія могла мати власні значення."}, {"en": "Give each variable a Category, a tooltip and a safe range.", "uk": "Дай кожній змінній Category, підказку й безпечний діапазон."}], "doalong": [{"en": "In BP_BollardRow find the My Blueprint panel. Next to Variables click +, name the new variable Count, and in the Details panel set Variable Type to Integer. Click Compile, then set Default Value to 5. You see Count in the list with a small coloured icon; the colour shows the type.", "uk": "У BP_BollardRow знайди панель My Blueprint. Поруч із Variables натисни +, назви нову змінну Count, а на панелі Details встанови Variable Type на Integer. Натисни Compile, потім встанови Default Value на 5. Ти бачиш Count у списку з маленькою кольоровою піктограмою; колір показує тип."}, {"en": "With Count selected, tick Instance Editable in Details (or click the closed eye next to Count so it opens). Type Tool into the Category box. Compile and Save. Select a placed copy in L_Day61. You see a Tool section with Count in the level's Details panel.", "uk": "Вибравши Count, познач Instance Editable у Details (або клацни закрите око поруч із Count, щоб воно відкрилося). Введи Tool у поле Category. Натисни Compile і Save. Вибери розміщену копію в L_Day61. Ти бачиш розділ Tool із Count на панелі Details рівня."}, {"en": "Add a second variable named Spacing, type Float, default 150, Instance Editable, Category Tool. Unreal measures in centimetres, so 150 means 1.5 m. You see Count and Spacing together under Tool.", "uk": "Додай другу змінну на ім'я Spacing, тип Float, за замовчуванням 150, Instance Editable, категорія Tool. Unreal вимірює в сантиметрах, тож 150 означає 1,5 м. Ти бачиш Count і Spacing разом під Tool."}, {"en": "Select Count and set Slider Range and Value Range both to 1 and 50. Select Spacing and set both ranges to 50 and 1000. Compile. On a placed copy drag Count's number left and right. You see it stop at 1 and at 50.", "uk": "Вибери Count і встанови Slider Range та Value Range обидва на 1 і 50. Вибери Spacing і встанови обидва діапазони на 50 і 1000. Натисни Compile. На розміщеній копії перетягуй число Count ліворуч і праворуч. Ти бачиш, що воно зупиняється на 1 і на 50."}, {"en": "Select Count and type How many bollards in the row into its Description box; give Spacing the description Distance between bollards, in centimetres. Compile. Hover over Count on a placed copy. You see your text as a tooltip.", "uk": "Вибери Count і введи How many bollards in the row у його поле Description; для Spacing дай опис Distance between bollards, in centimetres. Натисни Compile. Наведи курсор на Count на розміщеній копії. Ти бачиш свій текст як підказку."}], "play": {"en": "Type detective: the tutor names eight values (5 bollards, 1.5 m, a street name, is it night?, a colour, 3.14, a mesh, 120 posts). For each I say Integer, Float, Boolean (true or false), String (text) or something else.", "uk": "Детектив типів: тьютор називає вісім значень (5 стовпчиків, 1,5 м, назву вулиці, чи це ніч?, колір, 3.14, модель, 120 стовпів). Для кожного я кажу Integer, Float, Boolean (true або false), String (текст) чи щось інше."}, "video": {"search": "unreal engine 5 blueprint variables instance editable category tooltip"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Variables: numbers you can change in Details (Day 61, lesson 2 of 4).\nToday's build: BP_BollardRow and BP_PlanterRow: two small tools that lay rows of meshes from numbers you set in Details, placed in a practice level and on your island.\nEarlier today I already did: lesson 1 (What a Blueprint is, and your first one). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Explain a variable: a named box that holds one value; an Integer holds a whole number (5) and a Float holds a number with a decimal point (1.5).\n2. Add the variables Count and Spacing and make them Instance Editable, so each placed copy can have its own values.\n3. Give each variable a Category, a tooltip and a safe range.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Type detective: the tutor names eight values (5 bollards, 1.5 m, a street name, is it night?, a colour, 3.14, a mesh, 120 posts). For each I say Integer, Float, Boolean (true or false), String (text) or something else.\n4. Do-along on today's build (BP_BollardRow (built step by step in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - In BP_BollardRow find the My Blueprint panel. Next to Variables click +, name the new variable Count, and in the Details panel set Variable Type to Integer. Click Compile, then set Default Value to 5. You see Count in the list with a small coloured icon; the colour shows the type.\n   - With Count selected, tick Instance Editable in Details (or click the closed eye next to Count so it opens). Type Tool into the Category box. Compile and Save. Select a placed copy in L_Day61. You see a Tool section with Count in the level's Details panel.\n   - Add a second variable named Spacing, type Float, default 150, Instance Editable, Category Tool. Unreal measures in centimetres, so 150 means 1.5 m. You see Count and Spacing together under Tool.\n   - Select Count and set Slider Range and Value Range both to 1 and 50. Select Spacing and set both ranges to 50 and 1000. Compile. On a placed copy drag Count's number left and right. You see it stop at 1 and at 50.\n   - Select Count and type How many bollards in the row into its Description box; give Spacing the description Distance between bollards, in centimetres. Compile. Hover over Count on a placed copy. You see your text as a tooltip.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "The Construction Script and a loop", "uk": "Construction Script і цикл"}, "minutes": 40, "goals": [{"en": "Explain the Construction Script: a graph that runs in the editor whenever the actor is placed, moved, or one of its variables changes.", "uk": "Поясни Construction Script: граф, що виконується в редакторі щоразу, коли актора розміщують, пересувають або коли змінюється одна з його змінних."}, {"en": "Explain a For Loop: it repeats the same steps once for every number (the Index) from First Index to Last Index.", "uk": "Поясни For Loop: він повторює ті самі кроки по одному разу для кожного числа (Index) від First Index до Last Index."}, {"en": "Use an Instanced Static Mesh (one component that draws many copies of a mesh cheaply) and add one copy, called an instance, per loop step.", "uk": "Використай Instanced Static Mesh (один компонент, що дешево малює багато копій моделі) і додавай по одній копії, яку називають інстансом, на кожному кроці циклу."}], "doalong": [{"en": "In the Components panel select Bollard and press Delete. Click + Add, type Instanced Static Mesh, choose it, name it Bollards, and set its Static Mesh to SM_Bollard (or the cylinder). You see nothing in the Viewport tab yet: an Instanced Static Mesh draws nothing until you add instances.", "uk": "На панелі Components вибери Bollard і натисни Delete. Натисни + Add, введи Instanced Static Mesh, вибери його, назви Bollards і встанови його Static Mesh на SM_Bollard (або циліндр). Ти поки нічого не бачиш на вкладці Viewport: Instanced Static Mesh нічого не малює, доки ти не додаси інстанси."}, {"en": "Open the Construction Script tab. Drag Bollards from the Components panel into the graph and choose Get. Drag from its blue pin, type Clear Instances and choose it. Connect the white arrow pin of the purple Construction Script node to the white input of Clear Instances. White pins set the order in which steps run. You see a chain of two nodes.", "uk": "Відкрий вкладку Construction Script. Перетягни Bollards з панелі Components у граф і вибери Get. Потягни від його синього піна, введи Clear Instances і вибери його. З'єднай пін із білою стрілкою фіолетового вузла Construction Script з білим входом Clear Instances. Білі піни задають порядок виконання кроків. Ти бачиш ланцюжок із двох вузлів."}, {"en": "Right-click the empty graph, type For Loop and choose it. Connect Clear Instances' white output to the For Loop's Exec input. Drag Count from My Blueprint into the graph and choose Get. Drag from Count's pin, type Subtract, choose the integer Subtract, and type 1 in its second box. Connect the result to Last Index; leave First Index at 0. You see a loop that runs from 0 to Count minus 1.", "uk": "Клацни правою кнопкою на порожньому графі, введи For Loop і вибери його. З'єднай білий вихід Clear Instances із входом Exec вузла For Loop. Перетягни Count з My Blueprint у граф і вибери Get. Потягни від піна Count, введи Subtract, вибери цілочисельний Subtract і введи 1 у його друге поле. З'єднай результат із Last Index; First Index залиш на 0. Ти бачиш цикл, що біжить від 0 до Count мінус 1."}, {"en": "Drag Bollards into the graph again (Get). Drag from its pin, type Add Instance and choose it. Connect the For Loop's Loop Body pin to Add Instance's white input. Drag from Add Instance's Instance Transform pin and type Make Transform; then drag from Make Transform's Location pin and type Make Vector (if it is not offered, right-click the Location pin and choose Split Struct Pin to get Location X, Y and Z instead). You see Make Vector (or the three split pins) with X, Y and Z, and Make Transform's Scale already at 1, 1, 1. If you use the cylinder, type 0.3, 0.3, 0.9 into that Scale; never scale the Bollards component itself, because a component's scale also squeezes the gaps between its instances.", "uk": "Знову перетягни Bollards у граф (Get). Потягни від його піна, введи Add Instance і вибери його. З'єднай пін Loop Body вузла For Loop з білим входом Add Instance. Потягни від піна Instance Transform вузла Add Instance і введи Make Transform; потім потягни від піна Location вузла Make Transform і введи Make Vector (якщо його не пропонує, клацни правою кнопкою на піні Location і вибери Split Struct Pin, щоб отримати Location X, Y і Z). Ти бачиш Make Vector (або три розділені піни) з X, Y і Z, а Scale у Make Transform уже дорівнює 1, 1, 1. Якщо ти використовуєш циліндр, введи 0.3, 0.3, 0.9 у цей Scale; ніколи не масштабуй сам компонент Bollards, бо масштаб компонента стискає й проміжки між його інстансами."}, {"en": "Right-click, type Multiply and choose it. Connect the For Loop's Index pin to the first input (Unreal adds a small conversion node by itself) and Spacing to the second. Connect the result to Make Vector's X (or Location X). Compile and Save. You see five bollards 1.5 m apart, and when you change Count on a placed copy, the row rebuilds at once.", "uk": "Клацни правою кнопкою, введи Multiply і вибери його. З'єднай пін Index вузла For Loop з першим входом (Unreal сам додасть маленький вузол перетворення), а Spacing із другим. З'єднай результат з X у Make Vector (або Location X). Натисни Compile і Save. Ти бачиш п'ять стовпчиків на відстані 1,5 м один від одного, а коли ти змінюєш Count на розміщеній копії, ряд одразу перебудовується."}], "play": {"en": "Loop by hand: the tutor gives me First Index, Last Index and Spacing (0, 3, 200; 0, 9, 150; 1, 4, 100). Before I try it in Unreal I list every X position the loop will make and how many bollards I will see.", "uk": "Цикл уручну: тьютор дає мені First Index, Last Index і Spacing (0, 3, 200; 0, 9, 150; 1, 4, 100). Перш ніж спробувати в Unreal, я виписую кожну позицію X, яку створить цикл, і скільки стовпчиків я побачу."}, "video": {"search": "unreal engine 5 construction script for loop add instance instanced static mesh"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: The Construction Script and a loop (Day 61, lesson 3 of 4).\nToday's build: BP_BollardRow and BP_PlanterRow: two small tools that lay rows of meshes from numbers you set in Details, placed in a practice level and on your island.\nEarlier today I already did: lesson 1 (What a Blueprint is, and your first one); lesson 2 (Variables: numbers you can change in Details). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Explain the Construction Script: a graph that runs in the editor whenever the actor is placed, moved, or one of its variables changes.\n2. Explain a For Loop: it repeats the same steps once for every number (the Index) from First Index to Last Index.\n3. Use an Instanced Static Mesh (one component that draws many copies of a mesh cheaply) and add one copy, called an instance, per loop step.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Loop by hand: the tutor gives me First Index, Last Index and Spacing (0, 3, 200; 0, 9, 150; 1, 4, 100). Before I try it in Unreal I list every X position the loop will make and how many bollards I will see.\n4. Do-along on today's build (BP_BollardRow (built step by step in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - In the Components panel select Bollard and press Delete. Click + Add, type Instanced Static Mesh, choose it, name it Bollards, and set its Static Mesh to SM_Bollard (or the cylinder). You see nothing in the Viewport tab yet: an Instanced Static Mesh draws nothing until you add instances.\n   - Open the Construction Script tab. Drag Bollards from the Components panel into the graph and choose Get. Drag from its blue pin, type Clear Instances and choose it. Connect the white arrow pin of the purple Construction Script node to the white input of Clear Instances. White pins set the order in which steps run. You see a chain of two nodes.\n   - Right-click the empty graph, type For Loop and choose it. Connect Clear Instances' white output to the For Loop's Exec input. Drag Count from My Blueprint into the graph and choose Get. Drag from Count's pin, type Subtract, choose the integer Subtract, and type 1 in its second box. Connect the result to Last Index; leave First Index at 0. You see a loop that runs from 0 to Count minus 1.\n   - Drag Bollards into the graph again (Get). Drag from its pin, type Add Instance and choose it. Connect the For Loop's Loop Body pin to Add Instance's white input. Drag from Add Instance's Instance Transform pin and type Make Transform; then drag from Make Transform's Location pin and type Make Vector (if it is not offered, right-click the Location pin and choose Split Struct Pin to get Location X, Y and Z instead). You see Make Vector (or the three split pins) with X, Y and Z, and Make Transform's Scale already at 1, 1, 1. If you use the cylinder, type 0.3, 0.3, 0.9 into that Scale; never scale the Bollards component itself, because a component's scale also squeezes the gaps between its instances.\n   - Right-click, type Multiply and choose it. Connect the For Loop's Index pin to the first input (Unreal adds a small conversion node by itself) and Spacing to the second. Connect the result to Make Vector's X (or Location X). Compile and Save. You see five bollards 1.5 m apart, and when you change Count on a placed copy, the row rebuilds at once.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Test it like a tool maker", "uk": "Перевіряй, як майстер інструментів"}, "minutes": 40, "goals": [{"en": "Find and fix an off-by-one mistake by working out what the loop really does.", "uk": "Знайди й виправ помилку на одиницю, з'ясувавши, що насправді робить цикл."}, {"en": "Use Print String to see values in the Output Log while the Construction Script runs, then remove it.", "uk": "Використай Print String, щоб бачити значення в Output Log, поки працює Construction Script, а потім прибери його."}, {"en": "Test a tool at its edges: the smallest and largest values, a rotated actor, and undo.", "uk": "Перевір інструмент на краях: найменші й найбільші значення, повернутий актор і скасування."}], "doalong": [{"en": "Planned mistake: in BP_BollardRow's Construction Script, connect Count straight to the For Loop's Last Index, leaving the Subtract node out. Compile and count the bollards on a copy with Count 5. You see 6: the loop runs for 0, 1, 2, 3, 4 and 5, which is six steps. Reconnect Count through Subtract 1, Compile, and see 5 again.", "uk": "Навмисна помилка: у Construction Script BP_BollardRow з'єднай Count прямо з Last Index вузла For Loop, пропустивши вузол Subtract. Натисни Compile і порахуй стовпчики на копії з Count 5. Ти бачиш 6: цикл біжить для 0, 1, 2, 3, 4 і 5, а це шість кроків. З'єднай Count знову через Subtract 1, натисни Compile і побач 5 ще раз."}, {"en": "Drag from Add Instance's white output, type Print String and choose it. Connect the For Loop's Index to Print String's In String pin (Unreal converts the number to text). Compile, open Window > Output Log, and change Count on a placed copy. You see one line per bollard, 0 to Count minus 1, every time the row rebuilds.", "uk": "Потягни від білого виходу Add Instance, введи Print String і вибери його. З'єднай Index вузла For Loop з піном In String вузла Print String (Unreal перетворює число на текст). Натисни Compile, відкрий Window > Output Log і зміни Count на розміщеній копії. Ти бачиш по одному рядку на кожен стовпчик, від 0 до Count мінус 1, щоразу, коли ряд перебудовується."}, {"en": "Delete the Print String node, Compile and Save: finished tools stay quiet. You see the Output Log stop printing when you change Count.", "uk": "Видали вузол Print String, натисни Compile і Save: готові інструменти мовчать. Ти бачиш, що Output Log перестає друкувати, коли ти змінюєш Count."}, {"en": "On one placed copy set Count to 1, then 50. Then rotate it 45 degrees with the rotate tool (E), and press Ctrl+Z three times. You see 1 bollard, a 73.5 m row, the row turning with the actor because instances are placed in the actor's own space, and each undo bringing back the previous row.", "uk": "На одній розміщеній копії встанови Count на 1, потім на 50. Потім поверни її на 45 градусів інструментом обертання (E) і тричі натисни Ctrl+Z. Ти бачиш 1 стовпчик, ряд завдовжки 73,5 м, ряд, що повертається разом з актором, бо інстанси розміщуються у власному просторі актора, і кожне скасування повертає попередній ряд."}, {"en": "Set Spacing to 50 on a row of 30 cm bollards and look closely. You see the bollards almost touching; tell the tutor why the Value Range of 50 to 1000 stops you from typing 0 or a negative spacing.", "uk": "Встанови Spacing на 50 для ряду 30-сантиметрових стовпчиків і придивись. Ти бачиш, що стовпчики майже торкаються; скажи тьюторові, чому Value Range від 50 до 1000 не дає ввести 0 чи від'ємний інтервал."}], "play": {"en": "Bug hunt: the tutor describes four broken rows (every bollard in one spot; no bollards at all; one bollard too many; the row runs sideways). For each I name the most likely cause and the node I would check first.", "uk": "Полювання на помилки: тьютор описує чотири зламані ряди (усі стовпчики в одній точці; жодного стовпчика; на один стовпчик забагато; ряд іде вбік). Для кожного я називаю найімовірнішу причину й вузол, який перевірю першим."}, "video": {"search": "unreal engine 5 blueprint debugging print string output log beginners"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Test it like a tool maker (Day 61, lesson 4 of 4).\nToday's build: BP_BollardRow and BP_PlanterRow: two small tools that lay rows of meshes from numbers you set in Details, placed in a practice level and on your island.\nEarlier today I already did: lesson 1 (What a Blueprint is, and your first one); lesson 2 (Variables: numbers you can change in Details); lesson 3 (The Construction Script and a loop). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Find and fix an off-by-one mistake by working out what the loop really does.\n2. Use Print String to see values in the Output Log while the Construction Script runs, then remove it.\n3. Test a tool at its edges: the smallest and largest values, a rotated actor, and undo.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Bug hunt: the tutor describes four broken rows (every bollard in one spot; no bollards at all; one bollard too many; the row runs sideways). For each I name the most likely cause and the node I would check first.\n4. Do-along on today's build (BP_BollardRow (built step by step in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Planned mistake: in BP_BollardRow's Construction Script, connect Count straight to the For Loop's Last Index, leaving the Subtract node out. Compile and count the bollards on a copy with Count 5. You see 6: the loop runs for 0, 1, 2, 3, 4 and 5, which is six steps. Reconnect Count through Subtract 1, Compile, and see 5 again.\n   - Drag from Add Instance's white output, type Print String and choose it. Connect the For Loop's Index to Print String's In String pin (Unreal converts the number to text). Compile, open Window > Output Log, and change Count on a placed copy. You see one line per bollard, 0 to Count minus 1, every time the row rebuilds.\n   - Delete the Print String node, Compile and Save: finished tools stay quiet. You see the Output Log stop printing when you change Count.\n   - On one placed copy set Count to 1, then 50. Then rotate it 45 degrees with the rotate tool (E), and press Ctrl+Z three times. You see 1 bollard, a 73.5 m row, the row turning with the actor because instances are placed in the actor's own space, and each undo bringing back the previous row.\n   - Set Spacing to 50 on a row of 30 cm bollards and look closely. You see the bollards almost touching; tell the tutor why the Value Range of 50 to 1000 stops you from typing 0 or a negative spacing.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "bp_graph.png (the Construction Script of BP_BollardRow, node names readable)", "uk": "bp_graph.png (Construction Script у BP_BollardRow, назви вузлів читаються)"}, {"en": "rows_day61.png (L_Day61 from above with all the rows) and island_day61.png (the two rows on your island)", "uk": "rows_day61.png (L_Day61 зверху з усіма рядами) і island_day61.png (два ряди на твоєму острові)"}, {"en": "tool_notes.md (each variable of both tools, its range, and what you would add next)", "uk": "tool_notes.md (кожна змінна обох інструментів, її діапазон і що додати далі)"}, {"en": "flythrough_day61.mp4 (60 seconds of live changes to Count, Spacing, Mesh and Height Offset)", "uk": "flythrough_day61.mp4 (60 секунд змін Count, Spacing, Mesh і Height Offset наживо)"}, {"en": "summary.md", "uk": "summary.md"}], "goal": {"en": "By the end of today you have BP_BollardRow, your first tool: a Blueprint that lays a row of bollards from two numbers you change in Details, and BP_PlanterRow, a second tool you make on your own that lays a row of any mesh.", "uk": "До кінця сьогодні ти матимеш BP_BollardRow, свій перший інструмент: Blueprint, що розставляє ряд стовпчиків за двома числами, які ти змінюєш у Details, і BP_PlanterRow, другий інструмент, який ти робиш сам: він розставляє ряд будь-якої моделі."}, "uses": [{"en": "Day 1: SM_Bollard, your bollard (or any small mesh from your own kit)", "uk": "День 1: SM_Bollard, твій стовпчик (або будь-яка мала модель з твого набору)"}, {"en": "Day 6: the IslandCourse project, folders and exact placing", "uk": "День 6: проєкт IslandCourse, папки й точне розміщення"}], "quiz": [{"q": {"en": "When does a Blueprint's Construction Script run?", "uk": "Коли виконується Construction Script у Blueprint?"}, "options": [{"en": "Every frame while the game is running", "uk": "Щокадру, поки йде гра"}, {"en": "In the editor, whenever the actor is placed, moved or one of its variables changes", "uk": "У редакторі, щоразу, коли актора розміщують, пересувають або коли змінюється одна з його змінних"}, {"en": "Only when you press Play", "uk": "Лише коли ти натискаєш Play"}], "answer": 1, "explain": {"en": "The Construction Script rebuilds the actor in the editor, which is why your row updates the moment you change Count.", "uk": "Construction Script перебудовує актора в редакторі, тому твій ряд оновлюється в ту ж мить, коли ти змінюєш Count."}}, {"q": {"en": "Count is 5 but you see 6 bollards. What is the most likely cause?", "uk": "Count дорівнює 5, але ти бачиш 6 стовпчиків. Яка найімовірніша причина?"}, "options": [{"en": "Spacing is too small", "uk": "Spacing замалий"}, {"en": "Instance Editable is ticked on Count", "uk": "Для Count позначено Instance Editable"}, {"en": "Last Index is set to Count instead of Count minus 1", "uk": "Last Index встановлено на Count замість Count мінус 1"}, {"en": "The Instanced Static Mesh has no mesh", "uk": "В Instanced Static Mesh немає моделі"}], "answer": 2, "explain": {"en": "A For Loop runs once for every number from First Index to Last Index, so 0 to 5 is six steps; Last Index must be Count minus 1.", "uk": "For Loop виконується один раз для кожного числа від First Index до Last Index, тож від 0 до 5 це шість кроків; Last Index має дорівнювати Count мінус 1."}}, {"q": {"en": "Why does the Construction Script start with Clear Instances?", "uk": "Чому Construction Script починається з Clear Instances?"}, "options": [{"en": "So every rebuild starts from an empty row and never stacks old instances", "uk": "Щоб кожна перебудова починалася з порожнього ряду й ніколи не нашаровувала старі інстанси"}, {"en": "To make the bollards cheaper to draw", "uk": "Щоб стовпчики було дешевше малювати"}, {"en": "To reset Count to its default", "uk": "Щоб скинути Count до значення за замовчуванням"}], "answer": 0, "explain": {"en": "Clearing first means each rebuild draws exactly Count instances, whatever was there before.", "uk": "Очищення спочатку означає, що кожна перебудова малює рівно Count інстансів, що б не було раніше."}}, {"q": {"en": "Which variable type fits a spacing of 150.5 cm?", "uk": "Який тип змінної пасує до інтервалу 150.5 см?"}, "options": [{"en": "Integer", "uk": "Integer"}, {"en": "Boolean", "uk": "Boolean"}, {"en": "String", "uk": "String"}, {"en": "Float", "uk": "Float"}], "answer": 3, "explain": {"en": "A Float holds numbers with a decimal point; an Integer holds whole numbers only.", "uk": "Float тримає числа з десятковою крапкою; Integer тримає лише цілі числа."}}, {"q": {"en": "A placed row shows no bollards at all and Count says 0. What stops this from happening in a finished tool?", "uk": "Розміщений ряд не показує жодного стовпчика, а Count дорівнює 0. Що не дає цьому статися в готовому інструменті?"}, "options": [{"en": "Setting Count's Value Range to 1 to 50", "uk": "Value Range для Count від 1 до 50"}, {"en": "Deleting the For Loop", "uk": "Видалення For Loop"}, {"en": "Using a Static Mesh component instead of an Instanced Static Mesh", "uk": "Використання компонента Static Mesh замість Instanced Static Mesh"}, {"en": "Turning off Instance Editable", "uk": "Вимкнення Instance Editable"}], "answer": 0, "explain": {"en": "A Value Range keeps the number inside safe limits, so nobody can type 0 or a negative count.", "uk": "Value Range тримає число в безпечних межах, тож ніхто не може ввести 0 або від'ємну кількість."}}], "weekInfo": null, "morning": {"sofar": {"en": "You can model real-size props, build kits, texture them, and build, light and measure a whole world in Unreal Engine.", "uk": "Ти вмієш моделювати пропси в реальному розмірі, будувати набори, текстурувати їх, а також будувати, освітлювати й вимірювати цілий світ в Unreal Engine."}, "today": {"en": "You make your first tool: a Blueprint that lays a row of bollards from two numbers, and a second tool on your own.", "uk": "Ти робиш свій перший інструмент: Blueprint, що розставляє ряд стовпчиків за двома числами, і другий інструмент самостійно."}, "cheer": {"en": "Programming is new, so take each node slowly and lean on your tutor; every tool maker began with a loop just like this one.", "uk": "Програмування — це нове, тож проходь кожен вузол неквапливо й спирайся на тьютора; кожен майстер інструментів починав з такого самого циклу."}, "quote": {"text": {"en": "Everybody in this country should learn how to program a computer, because it teaches you how to think.", "uk": "Кожен у цій країні має навчитися програмувати комп'ютер, бо це вчить думати."}, "author": {"en": "Steve Jobs", "uk": "Стів Джобс"}, "source": "Interview with Robert X. Cringely, 1995, released as Steve Jobs: The Lost Interview"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-61-blueprint-basics-bollard-row", "mapHref": "../../COURSE.html", "prevHref": "../Day-59-final-shots-handover-credits/START-HERE.html", "nextHref": "../Day-62-spline-fence/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me: when my Blueprint or script fails, ask for the error message or a screenshot of the graph, point to the line or node that is wrong and explain why, then let me fix it myself. Never write the whole tool for me. Keep me moving and make it feel like a game.\n\nToday I build on my own: BP_PlanterRow, on your own: any mesh, plus a height offset.\nIt's part of: BP_BollardRow and BP_PlanterRow: two small tools that lay rows of meshes from numbers you set in Details, placed in a practice level and on your island (A practice level, Content/Tools/Day61/L_Day61, then one row of each along your island's waterfront.).\n\nSpec:\n- BP_BollardRow, an Actor Blueprint in Content/Tools/Blueprints, with one Instanced Static Mesh component named Bollards using SM_Bollard (or /Engine/BasicShapes/Cylinder if you have no bollard, sized 0.3, 0.3, 0.9 through Make Transform's Scale, never through the component's own Scale).\n- Two variables, both Instance Editable, in the Category Tool, each with a tooltip: Count (Integer, default 5, Slider Range and Value Range 1 to 50) and Spacing (Float, default 150, in centimetres, Slider Range and Value Range 50 to 1000).\n- The Construction Script: Clear Instances, then a For Loop from 0 to Count minus 1, and in the loop body Add Instance with Make Transform whose location is (Index x Spacing, 0, 0). No Event Graph code and no Tick.\n- Changing Count or Spacing on a placed copy rebuilds the row at once; a rotated copy lays its row in its own direction.\n- BP_PlanterRow, made on your own from a copy: an Instanced Static Mesh named Items, a Mesh variable (Static Mesh object reference) applied with Set Static Mesh, and a Height Offset variable (Float, -100 to 300) that lifts the whole row.\n- L_Day61 saved with at least five rows; one row of each tool on your island, sitting on the ground.\n\nMy checklist:\n1. Open BP_BollardRow and check it against the spec: the Bollards component, Count and Spacing (Instance Editable, Category Tool, ranges, tooltips), and the Construction Script chain Clear Instances > For Loop > Add Instance. Click Compile. Check: the Compile button shows a green tick and the Compiler Results panel shows no warnings. (from lesson 3)\n2. In L_Day61 place three copies of BP_BollardRow: Count 3, 8 and 20 with Spacing 120, 150 and 300. Check: you see rows of 3, 8 and 20 bollards, and in the Top view the gaps measure 1.2 m, 1.5 m and 3 m (middle-mouse drag shows the distance). (from lesson 2)\n3. Edge tests on one copy: Count 1, then 50; rotate it 90 degrees; press Ctrl+Z three times. Check: you see 1 bollard, then a 73.5 m row, the row turning with the actor, and each undo bringing back the previous row. (from lesson 4)\n4. In the Content Browser right-click BP_BollardRow > Duplicate and name the copy BP_PlanterRow. Open it and rename the component Bollards to Items. Check: two Blueprints sit in Content/Tools/Blueprints, and BP_PlanterRow compiles with a green tick. (from lesson 1)\n5. In BP_PlanterRow add a variable Mesh: type Static Mesh (Object Reference), Instance Editable, Category Tool, default your planter or /Engine/BasicShapes/Cube. In the Construction Script, between the white Construction Script pin and Clear Instances, add Items > Set Static Mesh and connect Mesh to its New Mesh pin. Check: changing Mesh on a placed copy swaps every item in that row. (from lesson 2)\n6. Add Height Offset (Float, default 0, ranges -100 to 300, Category Tool) and connect it to the Z pin of the Make Vector that feeds the location. Check: Height Offset 50 lifts the whole row by 50 cm, and 0 puts it back on the floor. (from lesson 3)\n7. Place two BP_PlanterRow copies in L_Day61 with two different meshes from your kit, and save the level. Check: two different rows come from one Blueprint, and L_Day61 shows no unsaved star in its tab. (from lesson 2)\n8. Open your island level (L_Island, or your own level if you followed the fast track). Place one BP_BollardRow along the waterfront edge and one BP_PlanterRow on a pavement; set Count and Spacing so they fit, and save. Check: from about 30 m up, both rows read as straight, evenly spaced lines that sit on the ground, with nothing floating. (from lesson 4)\n9. Take bp_graph.png (the whole Construction Script graph of BP_BollardRow, node names readable), rows_day61.png (L_Day61 from above with all the rows) and island_day61.png (the two rows on your island). Check: three pictures in today's Work folder, and you can read the node names in the first. (from lesson 1)\n10. Record flythrough_day61.mp4 (60 seconds): select placed copies and change Count, Spacing, Mesh and Height Offset while the rows update live. Check: the clip is in today's Work folder and shows at least three live changes. (from lesson 4)\n11. Write tool_notes.md: one line for each variable of each tool (what it does and its range), and one line on what you would add next. Check: the file has two short sections, one per tool. (from lesson 2)\n12. Click Copy the day report, paste it into a new tutor chat, answer its questions and save its answer as summary.md. Check: summary.md is in today's Work folder with Made, To look at, Hours and To revisit filled in. (from lesson 4)\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Misha\nDay 61: Blueprint basics: a row of bollards that builds itself. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p><div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+list(D.handin,'ul','ticks')+'<p class="path">'+ic('folder')+'<span>'+u('shipTo')+' <code>'+esc(D.workPath)+'</code></span></p>'+(D.lessons.length?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<p class="muted">'+u('report')+'</p><div class="row"><button class="btn s" onclick="cp(D.reportPrompt)">'+ic('copy')+u('copyR')+'</button></div></section>';
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();

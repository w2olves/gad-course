n-in). For each I say safe or unsafe, and what to do instead.", "uk": "Безпечно чи ні: тьютор називає шість дій (вставити токен у чат із тьютором, щоб спитати, чому не пройшло надсилання; увійти через вікно браузера; закомітити файл із паролем; приватний репозиторій; надіслати сире відео на 5 ГБ; увімкнути двофакторний вхід). Про кожну я кажу «безпечно» чи «небезпечно» і що робити натомість."}, "video": {"search": "github private repository push git credential manager browser sign in"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Приватна копія на GitHub (Day 96, lesson 4 of 4). Today's build: Репозиторій Git у папці IslandCourse, який зберігає лише твої інструменти (Content/Tools, Content/Python, TechData), з .gitignore, Git LFS, чистою історією, злитою тестовою гілкою і приватною копією на GitHub.\nWhat I already know: Дні 61–95: усе в Content/Tools, Content/Python і TechData; День 92: perf_report.py — текстовий файл, зміни в якому Git показує рядок за рядком; День 88: DA_TownRules_Harbour — асет, який ти змінюєш на тестовій гілці; День 59: звичка пакета передачі — записувати, що де лежить.\nEarlier today I already did: lesson 1 (Контроль версій і встановлення Git); lesson 2 (Перший репозиторій: .gitignore і Git LFS); lesson 3 (Коміти, історія і гілки). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Створювати безкоштовний приватний репозиторій на GitHub і під'єднувати його як origin.\n2. Надсилати коміти та їхні файли LFS, входячи лише через вікно браузера, яке відкриває Git.\n3. Читати свій репозиторій на GitHub і вкладатися в безкоштовне сховище LFS.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: 2 lines on why today matters and where it comes back, in plain words (from this: Кожна студія тримає роботу в системі контролю версій. Це історія кожної зміни, шлях назад після будь-якої помилки і безпечна копія поза твоїм ПК. Асети Unreal — великі двійкові файли, тож Git потрібен Git LFS (сховище великих файлів), щоб розумно їх зберігати. Відтепер кожен твій інструмент має історію, і на ній стоїть решта курсу: плагін, випускний проєкт і пакет передачі. It comes back: Від завтра кожна зміна йде в цей репозиторій: плагін (День 97), перевірка якості (День 98), огляд і тег (День 99) і кожен день випускного проєкту аж до пакета передачі в День 110.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-96-git-from-zero exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (Встановлення Git, перший репозиторій, LFS і перші коміти (робиш на уроках)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. На github.com клацни + > New repository, назви його techtools, вибери Private і не став прапорці Add a README, .gitignore і licence (порожній репозиторій). Клацни Create repository. Має вийти: сторінка з HTTPS-адресою, що закінчується на techtools.git.\n   2. У Git Bash введи git remote add origin і встав цю адресу, потім git remote -v. Має вийти: origin двічі — для fetch і для push.\n   3. Введи git push -u origin main. Відкриється вікно браузера від Git Credential Manager: увійди там у GitHub і клацни Authorize. Ніколи не вводь пароль чи токен у Git Bash, файл або чат із тьютором. Має вийти: вивантаження об'єктів LFS, потім комітів, і рядок, що закінчується на main -> main. [screenshot]\n   4. Онови сторінку GitHub і відкрий Content/Tools/Blueprints і один .uasset. Має вийти: твої папки і 'Stored with Git LFS' на асеті. Сторінка оплати чи сховища акаунта показує зайняте місце LFS, набагато менше за безкоштовні 10 ГіБ.\n   5. Зроби коміт однієї малої зміни (зрозуміліший рядок коментаря в perf_report.py), потім введи git push. За кілька секунд новий коміт з'являється на GitHub. Відтепер кожне надсилання — твоя резервна копія поза ПК. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Безпечно чи ні: тьютор називає шість дій (вставити токен у чат із тьютором, щоб спитати, чому не пройшло надсилання; увійти через вікно браузера; закомітити файл із паролем; приватний репозиторій; надіслати сире відео на 5 ГБ; увімкнути двофакторний вхід). Про кожну я кажу «безпечно» чи «небезпечно» і що робити натомість. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; review (by tutor or art director) = огляд; see-why-fix note = нотатка «бачу, чому, як виправити»; credits line = рядок авторства; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; File Explorer = Провідник; origin (and kit pivot) = origin — точка, за яку об'єкт ставлять і обертають; look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; material slot / node / pin = слот матеріалу / вузол / вхід; volume (PCG Volume, Post Process Volume) = об'єм; keep-out zone / footprint test / grounding = зона-виняток / тест опори / посадка на ґрунт; kit / kit piece / part of one object = набір / деталь / частина; district / plot / plot plan = район / ділянка / план ділянки; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}], "handin": [{"en": "summary.md", "uk": "summary.md (звіт дня)"}, {"en": "github_day96.png (your tools safe in a private repository, assets stored with Git LFS) (proof)", "uk": "github_day96.png (твої інструменти в безпеці в приватному репозиторії, асети в Git LFS) (доказ)"}], "goal": {"en": "By the end of today you have your tools in Git: a repository in your IslandCourse folder that keeps only Content/Tools, your scripts and TechData, with the Unreal .gitignore and Git LFS, at least four clear commits, one branch tried and merged, and everything pushed to a free private repository on GitHub.", "uk": "До кінця дня твої інструменти в Git. Репозиторій у папці IslandCourse зберігає лише Content/Tools, скрипти й TechData, має .gitignore для Unreal і Git LFS. У ньому щонайменше чотири зрозумілі коміти, одна випробувана і злита гілка, і все надіслано в безкоштовний приватний репозиторій на GitHub."}, "uses": [{"en": "Days 61 to 95: everything in Content/Tools, Content/Python and TechData", "uk": "Дні 61–95: усе в Content/Tools, Content/Python і TechData"}, {"en": "Day 92: perf_report.py, a text file whose changes Git shows line by line", "uk": "День 92: perf_report.py — текстовий файл, зміни в якому Git показує рядок за рядком"}, {"en": "Day 88: DA_TownRules_Harbour, the asset you change on a test branch", "uk": "День 88: DA_TownRules_Harbour — асет, який ти змінюєш на тестовій гілці"}, {"en": "Day 59: the hand-over habit of writing down what is where", "uk": "День 59: звичка пакета передачі — записувати, що де лежить"}], "quiz": [{"q": {"en": "What does Git LFS do for an Unreal project?", "uk": "Що Git LFS робить для проєкту Unreal?"}, "options": [{"en": "Keeps big binary files such as .uasset in separate storage and puts small pointers in the commits", "uk": "Тримає великі двійкові файли, як-от .uasset, в окремому сховищі, а в коміти кладе маленькі вказівники"}, {"en": "Compresses textures", "uk": "Стискає текстури"}, {"en": "Merges Blueprints line by line", "uk": "Зливає Blueprint рядок за рядком"}, {"en": "Builds the project", "uk": "Збирає проєкт"}], "answer": 0, "explain": {"en": "LFS keeps the repository's history small and fast, while the big files are still versioned.", "uk": "LFS тримає історію репозиторію малою і швидкою, а великі файли все одно мають версії."}}, {"q": {"en": "git status still lists Intermediate and Saved after you made .gitignore. What is the likely cause?", "uk": "Після створення .gitignore git status усе ще показує Intermediate і Saved. Яка причина найімовірніша?"}, "options": [{"en": "Git LFS is not installed", "uk": "Git LFS не встановлено"}, {"en": "The file is still called gitignore-unreal.txt or .gitignore.txt, so Git doesn't read it", "uk": "Файл досі зветься gitignore-unreal.txt або .gitignore.txt, тож Git його не читає"}, {"en": "You must commit first", "uk": "Спершу треба зробити коміт"}, {"en": "Unreal is open", "uk": "Unreal відкритий"}], "answer": 1, "explain": {"en": "Git only reads a file named exactly .gitignore in the repository's top folder.", "uk": "Git читає лише файл із назвою точно .gitignore у верхній папці репозиторію."}}, {"q": {"en": "You committed 300 .uasset files before .gitattributes, and git lfs ls-files lists nothing. What is true?", "uk": "300 файлів .uasset потрапили в коміт раніше за .gitattributes, і git lfs ls-files нічого не показує. Що правда?"}, "options": [{"en": "Nothing: LFS adds them by itself later", "uk": "Нічого страшного: LFS сам додасть їх пізніше"}, {"en": "GitHub refuses every file", "uk": "GitHub відхиляє кожен файл"}, {"en": "The assets went into the normal history; fix it before you push (git lfs migrate import), so the repository does not swell", "uk": "Асети потрапили у звичайну історію; виправ це до надсилання (git lfs migrate import), щоб репозиторій не роздувся"}, {"en": "You must start the project again", "uk": "Проєкт доведеться починати знову"}], "answer": 2, "explain": {"en": "LFS only takes files that match its rules when they are committed, which is why .gitattributes comes first.", "uk": "LFS бере лише файли, що відповідають його правилам у момент коміту. Тому .gitattributes іде першим."}}, {"q": {"en": "Why do you close Unreal before git switch?", "uk": "Навіщо закривати Unreal перед git switch?"}, "options": [{"en": "Git cannot run while Unreal runs", "uk": "Git не працює, поки працює Unreal"}, {"en": "It is faster", "uk": "Так швидше"}, {"en": "Branches need a fresh shader compile", "uk": "Гілки потребують нової компіляції шейдерів"}, {"en": "Switching changes files under the editor, which may keep old copies in memory and save them back", "uk": "Перемикання змінює файли під редактором, а він може тримати старі копії в пам'яті й зберегти їх назад"}], "answer": 3, "explain": {"en": "Unreal holds assets in memory; with it closed, the files on disk are the only copy.", "uk": "Unreal тримає асети в пам'яті. Коли він закритий, файли на диску — єдина копія."}}, {"q": {"en": "A push fails and asks you to sign in. What do you do?", "uk": "Надсилання не проходить і просить увійти. Що ти робиш?"}, "options": [{"en": "Type your password into Git Bash", "uk": "Ввожу пароль у Git Bash"}, {"en": "Sign in through the browser window Git Credential Manager opens", "uk": "Входжу через вікно браузера, яке відкриває Git Credential Manager"}, {"en": "Save a token in a text file in the repository", "uk": "Зберігаю токен у текстовому файлі в репозиторії"}, {"en": "Paste the error and your token into the tutor chat", "uk": "Вставляю помилку і свій токен у чат із тьютором"}], "answer": 1, "explain": {"en": "The browser sign-in keeps your password and tokens out of files, terminals and chats.", "uk": "Вхід через браузер тримає пароль і токени поза файлами, терміналами й чатами."}}], "weekInfo": null, "morning": {"sofar": {"en": "You have a whole toolkit: Blueprint generators, Python tools, a Blender pipeline, PCG graphs, a town generator and a performance report.", "uk": "У тебе цілий набір інструментів: генератори на Blueprint, інструменти на Python, конвеєр для Blender, графи PCG, генератор міста і звіт про продуктивність."}, "today": {"en": "You put your tools under version control with Git and Git LFS, and keep a private copy on GitHub.", "uk": "Ти ставиш свої інструменти під контроль версій із Git і Git LFS і тримаєш приватну копію на GitHub."}, "cheer": {"en": "Git's words look strange at first; type them slowly, read what each one prints, and within a week they will feel like saving a file.", "uk": "Слова Git спершу виглядають дивно. Вводь їх повільно, читай, що друкує кожна команда, і за тиждень вони стануть звичні, як збереження файлу."}, "quote": {"text": {"en": "Forever – is composed of Nows –", "uk": "Навіки — складається з «Тепер» —"}, "author": {"en": "Emily Dickinson", "uk": "Емілі Дікінсон"}, "source": "Poem 690 in The Poems of Emily Dickinson, edited by R. W. Franklin (Harvard University Press, 1999)"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-96-git-from-zero", "mapHref": "../../COURSE.html", "prevHref": "../Day-95-boss-performance-report/START-HERE.html", "nextHref": "../Day-97-content-plugin-techtools/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Git for Windows (Git Bash and Git LFS) and a free GitHub account. I am a beginner on Day 96. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me: when my Blueprint or script fails, ask for the error message or a screenshot of the graph, point to the line or node that is wrong and explain why, then let me fix it myself. Never write the whole tool for me.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: Тест гілки і надсилання на GitHub — самостійно.\nIt's part of: Репозиторій Git у папці IslandCourse, який зберігає лише твої інструменти (Content/Tools, Content/Python, TechData), з .gitignore, Git LFS, чистою історією, злитою тестовою гілкою і приватною копією на GitHub (Папка проєкту IslandCourse (репозиторій) і приватний репозиторій techtools у твоєму безкоштовному акаунті GitHub.).\nWhy it matters: Кожна студія тримає роботу в системі контролю версій. Це історія кожної зміни, шлях назад після будь-якої помилки і безпечна копія поза твоїм ПК. Асети Unreal — великі двійкові файли, тож Git потрібен Git LFS (сховище великих файлів), щоб розумно їх зберігати. Відтепер кожен твій інструмент має історію, і на ній стоїть решта курсу: плагін, випускний проєкт і пакет передачі. It comes back: Від завтра кожна зміна йде в цей репозиторій: плагін (День 97), перевірка якості (День 98), огляд і тег (День 99) і кожен день випускного проєкту аж до пакета передачі в День 110.\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-96-git-from-zero (on the drive I chose on Day 0).\nWhat I already know: Дні 61–95: усе в Content/Tools, Content/Python і TechData; День 92: perf_report.py — текстовий файл, зміни в якому Git показує рядок за рядком; День 88: DA_TownRules_Harbour — асет, який ти змінюєш на тестовій гілці; День 59: звичка пакета передачі — записувати, що де лежить; today's lessons: Контроль версій і встановлення Git; Перший репозиторій: .gitignore і Git LFS; Коміти, історія і гілки; Приватна копія на GitHub. Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- Git for Windows встановлено з git-scm.com з прапорцем Git LFS, перша гілка зветься main, є Git Credential Manager. git --version і git lfs version обидва відповідають.\n- Твоє ім'я і приватна no-reply адреса GitHub задані через git config --global, тож твоя справжня пошта ніколи не з'явиться в історії.\n- .gitignore зроблено з gitignore-unreal.txt, а в кінці три рядки, які лишають тільки твої інструменти: Content/*, !Content/Tools/ і !Content/Python/.\n- Git LFS відстежує *.uasset, *.umap, *.fbx, *.blend, *.png, *.tga, *.psd, *.wav і *.mp4. .gitattributes і .gitignore — у першому коміті, раніше за будь-який асет.\n- Щонайменше чотири коміти зі зрозумілими повідомленнями (налаштування; інструменти; зміна скрипту; злита гілка), читабельний git log --oneline, а git lfs ls-files показує твої файли .uasset і .umap.\n- Одна гілка, try-more-gaps, з однією зміною асету: коміт зроблено, з гілки перемкнулися й повернулися із закритим Unreal, гілку злито в main.\n- Приватний репозиторій GitHub з назвою techtools, усе надіслано. Вхід — лише через вікно браузера, яке відкриває Git (ніколи пароль чи токен у файлі, Git Bash або чаті). Файли .uasset на GitHub позначено Stored with Git LFS.\n\nMy checklist (the same numbers show on my course page):\n1. Перевір, чи є результати сьогоднішніх уроків: Git і Git LFS встановлено, а репозиторій в IslandCourse має .gitignore, .gitattributes і перші коміти. Чогось бракує? Пройди зараз кроки «Разом із тьютором» того уроку (близько 25 хвилин): самостійна робота спирається на них. Відкрий Git Bash і введи git --version, потім git lfs version. Перевірка: обидві команди друкують номер версії. (from lesson 1)\n2. Введи git config --global user.name, потім git config --global user.email. Перевірка: з'являються твоє ім'я і no-reply адреса GitHub (закінчується на users.noreply.github.com). (from lesson 1)\n3. У Git Bash у папці IslandCourse введи git status. Перевірка: у списку немає папок Saved, Intermediate, Binaries чи DerivedDataCache, а з Content — лише Tools і Python. (from lesson 2)\n4. Введи git log --oneline. Перевірка: щонайменше два коміти, найстаріший зветься 'Ignore rules and Git LFS'. (from lesson 2)\n5. Введи git lfs ls-files | head (| head показує лише перші 10 рядків). Перевірка: у списку є файли .uasset і .umap. Якщо список порожній, запусти git lfs migrate import --include='*.uasset,*.umap' --everything і перевір знову. Ця команда переписує локальну історію, і до першого надсилання це безпечно. (from lesson 2)\n6. Зміни коментар-заголовок perf_report.py, потім введи git diff, git add perf_report.py і git commit -m 'perf_report: clearer header'. Перевірка: git log --oneline показує новий коміт угорі. (from lesson 3)\n7. Тест скасування: додай у perf_report.py безглуздий рядок, збережи, потім введи git restore perf_report.py. Перевірка: безглуздого рядка немає, а git status каже, що комітити нічого. (from lesson 3)\n8. Самостійно: закрий Unreal; git switch -c try-more-gaps; відкрий Unreal, постав Gap Chance на 0.25 у DA_TownRules_Harbour, збережи й закрий Unreal; git add -A; git commit -m 'Try more gaps'. Перевірка: git log --oneline на цій гілці показує 'Try more gaps' угорі. (from lesson 3)\n9. Самостійно: git switch main і подивись на Gap Chance в Unreal. Закрий Unreal, git merge try-more-gaps і подивись знову. Потім git branch -d try-more-gaps. Перевірка: на main до злиття — 0.12, після — 0.25, а git branch показує тільки main. (from lesson 3)\n10. Створи на GitHub приватний репозиторій techtools (без README, .gitignore і ліцензії). Потім git remote add origin з його HTTPS-адресою і git push -u origin main; увійди у вікні браузера, яке відкриється. Перевірка: надсилання закінчується на main -> main, а GitHub показує Config, Content, TechData і .gitignore. (from lesson 4)\n11. На GitHub відкрий один файл .uasset і зроби скриншот github_day96.png (сторінка репозиторію, на файлі видно Stored with Git LFS). Потім подивись сторінку сховища свого акаунта. Перевірка: картинка в робочій папці дня, а зайняте місце LFS набагато менше за безкоштовні 10 ГіБ. (from lesson 4)\n12. Клацни «Копіювати звіт дня», встав у новий чат із тьютором, дай відповіді на його питання і збережи його відповідь як summary.md у робочій папці дня. Перетягни summary.md і github_day96.png у папку здачі (кнопка на цій сторінці). Папку проєкту чи рівня Unreal здавати не треба: вона дуже велика. Перевірка: у папці здачі 2 файли, кожен більший за 1 КБ. (from lesson 1)\n\nHow to help: ask which step number I'm on, then give me only the next step: the exact clicks and what I should see. When I send a screenshot, compare it with my reference, my sizes and the spec, and name one thing to fix at a time.\nCheck every save and export by reopening it before we move on:\n- a Blueprint or script: compile or run it once more and see it work, with no errors\n- a .md or .txt: open it with Notepad; the text is there, and the name doesn't end in .md.txt\nWhen I write \"готово\", and in any case before the day ends, check with me one item at a time (yes/no): each spec point, then each file on my hand-in list, ready in my day work folder (skip summary.md: the day report writes it next):\n1. github_day96.png (твої інструменти в безпеці в приватному репозиторії, асети в Git LFS) (доказ)\nFinish with a short list of anything missing, and one line on where this work comes back and what it will look like there. Then tell me the order for the end of the day: first the day report (the Copy the day report button at the bottom of my course page) into summary.md, and only then hand in all the files on the list, summary.md too.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; review (by tutor or art director) = огляд; checklist = чек-лист; credits line = рядок авторства; reference photo / hero photo = фото-референс / ключове фото; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; File Explorer = Провідник; origin (and kit pivot) = origin — точка, за яку об'єкт ставлять і обертають; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; material slot / node / pin = слот матеріалу / вузол / вхід; keep-out zone / footprint test / grounding = зона-виняток / тест опори / посадка на ґрунт; kit / kit piece / part of one object = набір / деталь / частина; map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; district / plot / plot plan = район / ділянка / план ділянки; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.\n\nStart by asking for my best reference photo. Then, one at a time, my sizes and my step number.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender.", "reportPrompt": "Help me write today's report for summary.md. I write it before I hand in. Talk to me in simple Ukrainian, and never use gendered forms about me. Keep the English labels below exactly; the text after each label may be Ukrainian.\nAsk me one thing at a time, and skip whatever I've already pasted below:\n1. My lesson summaries («Засвоєно» / «Було важко»), or which lessons I skipped.\n2. My first score in the page's \"Check yourself\" quiz.\n3. How far the build got: done, partly or blocked (if blocked, where).\n4. My hand-in list, one item at a time (skip summary.md): is the file ready in my day work folder (GAD\\Day-96-git-from-zero)? (yes/no)\n   - github_day96.png (твої інструменти в безпеці в приватному репозиторії, асети в Git LFS) (доказ)\n5. One question for Thalia (about any day; start with the day number), or \"none\".\n6. Whether I fixed an earlier day today (which day and what), or \"no\".\n7. About how many hours today took.\nThen give me the finished report in one block I can copy:\n\nTeam summary, <date>, Misha\nDay 96: Git from zero: your tools under version control. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nReady to hand in: <tick each item of today's list: ✓ name, or ✗ name and why it isn't ready>\nMissing: <files not ready, or \"none\">\nFixed: <Day N: what I fixed (the fixed files are in that day's hand-in folder), or \"none\">\nQuestion for Thalia: <Day N: one line, or \"none\">\nHours: <about N>\nTo revisit: <the «Було важко» lines>\n\nThen tell me: open summary.md in today's day work folder (GAD\\Day-96-git-from-zero) with Notepad (right-click > Open with > Not   return '<section class="card glass fbcard">'+lab(u('fbTitle'),'ok')+'<div class="row" style="align-items:baseline;gap:12px"><span class="eyebrow">'+u('fbScore')+'</span><span class="big">'+esc(f.score)+'/'+esc(f.max||10)+'</span></div>'+(fbNote(f)?'<p class="note">'+esc(fbNote(f))+'</p>':'')+'<p class="muted">'+u('fbFull')+(D.handinUrl?': <a href="'+esc(D.handinUrl)+'" target="_blank" rel="noopener">'+u('hOpen')+'</a>':': <code>'+esc(D.workPath)+'</code>')+'</p></section>'}
 return '<section class="card glass fbcard">'+lab(u('fbTitle'),f.s==='missing'?'':'ok')+'<p class="note">'+u(f.s==='missing'?'fbMiss':'fbWait')+'</p>'+(f.s==='missing'?hf():'')+'</section>'}
/* fix phase 1 (2026-10-22): the hand-in folder (a button when the roster has a link, else the folder path), the hand-in card,
   Day 0's "Before lesson 1", the checks before handing in, the Questions card, and the day report with the pasted lesson summaries */
const HIN=(D.handin||[]).map(v=>(v&&v.en)||(typeof v==='string'?v:'')).join(' ').toLowerCase(),hasClip=/\.mp4|clip/.test(HIN);
function hItem(v){return x(v)}
function hList(){return '<ul class="ticks">'+(D.handin||[]).map(v=>'<li>'+lk(hItem(v))+'</li>').join('')+'</ul>'}
const NFILES=new Set((HIN.match(/[\w-]+\.(?:blend|glb|fbx|png|jpe?g|md|txt|mp4|csv|zip|pdf|webp|kra|psd|tga|exr|json|py|uasset|umap)\b/g)||[])).size;
function nFiles(n){if(!n)return '';if(lang==='en')return ' · '+n+(n===1?' file':' files');const a=n%10,b=n%100;return ' · '+n+' '+(a===1&&b!==11?'файл':a>=2&&a<=4&&(b<12||b>14)?'файли':'файлів')}
function hf(){return D.handinUrl?'<div class="row"><a class="btn s" href="'+esc(D.handinUrl)+'" target="_blank" rel="noopener">'+ic('folder')+u('hOpen')+'</a></div>':'<p class="path">'+ic('folder')+'<span>'+u('hPath')+' <code>'+esc(D.workPath)+'</code></span></p>'}
function handinCard(){if(!D.handin||!D.handin.length)return '';return '<section class="card glass handin">'+lab(u('hTitle')+nFiles(NFILES),'ok')+hList()+hf()+'<p class="muted" style="margin:12px 0 0">'+u('hNote')+'</p></section>'}
function beforeCard(){if(!D.before||!D.before.length)return '';return '<section class="card glass before">'+lab(u('before'),'gold')+list(D.before,'ol','steps')+'</section>'}
function chkList(){const a=[];if(HIN.indexOf('.blend')>=0)a.push('chk1');if(/\.(glb|fbx)\b/.test(HIN))a.push('chk2');a.push('chk3');if(hasClip)a.push('chk4');return '<h3>'+u('chk')+'</h3><ol class="steps">'+a.map(k=>'<li>'+u(k)+'</li>').join('')+'</ol>'}
function qCard(){return '<section class="card glass qcard">'+lab(u('qTitle'))+'<ul class="ticks"><li>'+u('q1')+'</li><li>'+u('q2')+'</li><li>'+u('q3')+'</li><li>'+u('q4')+'</li><li>'+u('q5')+'</li></ul></section>'}
function reportText(){let t=D.reportPrompt;const r=D.lessons.map((l,i)=>{const v=(st['r'+i]||'').trim();return v?'Lesson '+(i+1)+': '+v:''}).filter(Boolean);
 if(r.length)t+='\n\nMy lesson summaries, pasted from my course page:\n'+r.join('\n');
 if(st.qs1)t+='\nMy first score in the Check yourself quiz: '+st.qs1[0]+' of '+st.qs1[1]+'.';
 return t}
function qDone(){return D.quiz&&D.quiz.length&&st.qa&&D.quiz.every((q,i)=>st.qa[i]!=null)}
function prog(){const Q=(D.quiz&&D.quiz.length)?1:0,L=D.lessons.length,C=D.build.steps.length;let n=0;D.lessons.forEach((l,i)=>{if(st['q'+i])n++});D.build.steps.forEach((s,i)=>{if(st['c'+i])n++});if(Q&&qDone())n++;return (L+C+Q)?n/(L+C+Q):0}
function qScore(){let n=0;D.quiz.forEach((q,i)=>{if((st.qa||{})[i]===q.answer)n++});return n}
function pick(i,k){st.qa=st.qa||{};if(st.qa[i]!=null)return;st.qa[i]=k;if(qDone()){st.qs=[qScore(),D.quiz.length];if(!st.qs1)st.qs1=st.qs.slice()}save();render();const e=document.getElementById('e'+i);if(e)e.focus({preventScroll:true})}
function retry(){st.qa={};delete st.qs;save();render();const e=document.getElementById('o0_0');if(e)e.focus()}
const isBoss=!!(D.build&&D.build.boss&&D.build.boss.length),isFin=D.day===D.total;
document.body.className=isFin?'fin':isBoss?'boss':'';
const lk=s=>esc(s).replace(/https?:\/\/[^\s<']*[^\s<.,;:)']/g,m=>'<a href="'+m+'" target="_blank" rel="noopener">'+m+'</a>');
function list(a,tag,cls){return '<'+tag+(cls?' class="'+cls+'"':'')+'>'+(a||[]).map(i=>'<li>'+lk(x(i))+'</li>').join('')+'</'+tag+'>'}
const lab=(t,k)=>'<div class="lab'+(k?' k-'+k:'')+'"><span class="dotc"></span>'+t+'</div>';
const kn=n=>'<span class="kn">'+ic(n)+'</span>';
const slider=p=>'<div class="slider"><i style="width:calc('+p+'% - 6px)"></i><b style="left:clamp(13px,'+p+'%,calc(100% - 13px))"></b></div>';
function quiz(){if(!D.quiz||!D.quiz.length)return '';const a=st.qa||{};let ok=0;const L=u('letters');
 const pips='<div class="pips well" aria-hidden="true">'+D.quiz.map((q,i)=>'<i class="'+(a[i]==null?'':a[i]===q.answer?'r':'w')+'"></i>').join('')+'</div>';
 const qs=D.quiz.map((q,i)=>{const c=a[i];if(c===q.answer)ok++;return '<div class="qz"><p class="qq"><span class="qn">'+(i+1)+'</span><span>'+lk(x(q.q))+'</span></p>'+q.options.map((o,k)=>{let cls='opt',mk='<span></span>';if(c!=null){if(k===q.answer){cls+=' right';mk=ic('check','mk')}else if(k===c){cls+=' wrong';mk=ic('x','mk')}}return '<button class="'+cls+'" id="o'+i+'_'+k+'"'+(c!=null?' disabled':'')+' onclick="pick('+i+','+k+')"><span class="lt">'+(L[k]||k+1)+'</span><span>'+esc(x(o))+'</span>'+mk+'</button>'}).join('')+(c!=null?'<p class="exp '+(c===q.answer?'r':'w')+'" id="e'+i+'" tabindex="-1"><b>'+(c===q.answer?u('right'):u('wrong'))+'</b>'+lk(x(q.explain))+'</p>':'')+'</div>'}).join('');
 return '<section class="card glass quiz">'+lab(u('quiz'),'gold')+'<p class="muted" style="margin:-6px 0 14px">'+u('quizSub')+'</p>'+pips+qs+(qDone()?'<div class="score well" role="status"><span class="eyebrow">'+u('score')+'</span><span class="lcd" aria-label="'+ok+' / '+D.quiz.length+'">'+seg(ok+'/'+D.quiz.length)+'</span>'+(st.qs1?'<span class="muted">'+u('first')+': '+st.qs1[0]+'/'+st.qs1[1]+'</span>':'')+'<div class="row"><button class="btn ghost" id="retry" onclick="retry()">'+u('retry')+'</button></div></div>':'')+'</section>'}
function vid(v){if(!v)return '';const link=v.url?'<a href="'+esc(v.url)+'" target="_blank" rel="noopener">'+esc(x(v.title)||v.url)+'</a>'+(v.channel?' <span class="muted">· '+esc(v.channel)+(v.length?' · '+esc(v.length):'')+'</span>':''):'';const s=v.search?'<a href="https://www.youtube.com/results?search_query='+encodeURIComponent(v.search)+'" target="_blank" rel="noopener">'+u('noVid')+': '+esc(v.search)+'</a>':'';const alt=v.alt&&v.alt.url?'<br><span class="eyebrow">UA</span> <a href="'+esc(v.alt.url)+'" target="_blank" rel="noopener">'+esc(v.alt.title||v.alt.url)+'</a>'+(v.alt.channel?' <span class="muted">· '+esc(v.alt.channel)+'</span>':''):'';return '<div class="vid well">'+kn('play')+'<div><b>'+u('more')+'?</b><br>'+(link||s)+alt+(link&&s?'<br><span class="muted" style="font-size:14px">'+s+'</span>':'')+'</div></div>'}
function morning(){const m=D.morning;if(!m)return '';const q=m.quote||{};
 let shelf='';if(D.day>0){shelf='<div class="shelf" aria-hidden="true">';let g='';for(let d=0;d<D.day;d++){let p=0;try{p=(JSON.parse(localStorage.getItem('devteam:'+D.learner+':'+d))||{}).pct||0}catch(e){}g+='<i class="'+(p>=1?'d':'')+(d>0&&d%5===0?' bs':'')+'"></i>';if(d%5===0||d===D.day-1){shelf+='<span class="wkg">'+g+'</span>';g=''}}shelf+='</div>'}
 const qt=lang==='uk'&&q.original?q.original:x(q.text);
 return '<section class="card glass morning"><div class="mgrid">'+(m.sofar?'<div>'+lab(u('sofar'),'gold')+shelf+'<p class="mtxt">'+lk(x(m.sofar))+'</p></div>':'')+(m.today?'<div>'+lab(u('todayL'))+'<p class="mtxt">'+lk(x(m.today))+'</p></div>':'')+'</div>'+(m.cheer?'<p class="cheer">'+esc(x(m.cheer))+'</p>':'')+(qt?'<figure class="quote well">'+kn('quote')+'<blockquote>'+esc(qt)+'</blockquote>'+(q.author?'<figcaption>'+esc(x(q.author))+'</figcaption>':'')+'</figure>':'')+'</section>'}
function setLang(l){lang=l;try{localStorage.setItem('devteam:lang',lang)}catch(e){};render()}
function toggleLang(){setLang(lang==='uk'?'en':'uk')}
/* keep open sections and keyboard focus across re-renders */
const openD=new Set();
function tg(e){if(e.open)openD.add(e.id);else openD.delete(e.id)}
const op=id=>openD.has(id)?' open':'';
function render(){const ae=document.activeElement,fid=ae&&(ae.id||(ae.getAttribute('data-th')?'th-'+ae.getAttribute('data-th'):ae.getAttribute('lang')&&ae.closest('.seg')?'lg-'+ae.getAttribute('lang'):''));
 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);
 const b=D.build,P=Math.round(prog()*100);
 document.getElementById('top').innerHTML='<div class="topin glass"><a class="maplink" href="'+esc(D.mapHref)+'">'+kn('map')+u('map')+'</a><div class="crumb"><b>'+esc(x(D.learnerName))+'</b><span>'+u('week')+' '+D.week+'</span><span>'+u('day')+' '+D.day+' '+u('of')+' '+D.total+'</span></div>'+controls(lang,'setLang')+'</div><div class="tline"><i style="width:'+P+'%"></i></div>';
 const state=w=>w<D.week?'b':w===D.week?'n':'p';
 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 let wk='';if(D.weekInfo){const w=D.weekInfo;wk='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}
 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p>'+(b.next?'<div class="back well">'+kn('arrow')+'<div><b>'+u('comes')+'</b><br>'+lk(x(b.next))+'</div></div>':'')+'<div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.assetFiles&&D.assetFiles.length?'<p class="files">'+ic('folder')+'<span>'+u('filesL')+' '+D.assetFiles.map(f=>'<a href="assets/'+encodeURIComponent(f)+'" target="_blank" rel="noopener">'+esc(f)+'</a>').join(', ')+'</span></p>':D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+=handinCard();h+=beforeCard();
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div><label class="rcpt" for="r'+i+'"><span class="eyebrow">'+u('rcpt')+'</span><textarea id="r'+i+'" rows="2" placeholder="'+esc(u('rcptPh'))+'" oninput="st.r'+i+'=this.value;save()">'+esc(st['r'+i]||'')+'</textarea></label>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+hList()+chkList()+(hasClip?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<h3>1 · '+u('copyR')+'</h3><p class="muted">'+u('report')+'</p><div class="row"><button class="btn ghost" onclick="cp(reportText())">'+ic('copy')+u('copyR')+'</button></div><h3>2 · '+u('ship')+'</h3>'+hf()+'<p class="muted" style="margin:12px 0 0">'+u('hNote')+'</p></section>';
 h+=qCard();h+=wk;
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();
</script>

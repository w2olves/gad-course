<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 96</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

.btn.s{background:linear-gradient(145deg,#5fe39a,#16a34a);box-shadow:0 10px 24px -8px rgba(74,222,128,.55),inset 0 1px 0 rgba(255,255,255,.35)}

/* the Done switch */
.sw{display:inline-flex;align-items:center;gap:12px;border:0;background:transparent;cursor:pointer;font:600 14px/1 var(--head);color:var(--muted);min-height:50px;padding:0 6px}

details{margin-top:22px;border-radius:20px;background:var(--well);box-shadow:var(--press);padding:0 18px}

.steps{list-style:none;padding:0;counter-reset:s;margin:4px 0 0}

/* build */

.medal{display:flex;align-items:center;gap:10px;margin:0 0 8px;font:700 11.5px/1 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}

.m2{--mg:rgba(245,195,91,.75)}.m2 i{background:linear-gradient(135deg,#ffe08a,#c99412)}
.ccount{display:flex;align-items:center;gap:16px;margin:28px 0 10px}

.check li:last-child label{border-bottom:0}

.check input{appearance:none;-webkit-appearance:none;width:26px;height:26px;margin:1px 0 0;border-radius:9px;background:var(--well);box-shadow:var(--press);display:grid;place-items:center;cursor:pointer;transition:background .2s,box-shadow .2s}
.check input::after{content:"";width:10px;height:5px;border:solid #fff;border-width:0 0 2.2px 2.2px;transform:rotate(-45deg) translate(1px,-1px);opacity:0}

.check input:checked::after{opacity:1}
.check li.on .tx{color:var(--faint)}
.check .ln{font:600 10.5px/1.3 var(--head);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);white-space:nowrap;margin-top:5px;padding:4px 9px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
/* quiz */

.pips i.r{background:var(--okL);box-shadow:0 0 8px var(--okL)}.pips i.w{background:var(--badL);box-shadow:0 0 8px var(--badL)}

.opt{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;width:calc(100% - 50px);margin:12px 0 12px 50px;text-align:left;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid transparent;border-radius:18px;padding:11px 16px;cursor:pointer;box-shadow:var(--raiseS);transition:box-shadow .2s,transform .15s}
.opt .lt{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 12.5px/1 var(--head);color:var(--faint);background:var(--well);box-shadow:var(--press)}

.opt.right{box-shadow:var(--press);background:var(--okBg);border-color:rgba(74,222,128,.45)}.opt.right .lt{background:var(--okL);color:#fff;box-shadow:0 0 10px var(--okL)}.opt.right .mk{color:var(--ok)}
.opt.wrong{box-shadow:var(--press);background:var(--badBg);border-color:rgba(255,93,93,.45)}.opt.wrong .lt{background:var(--badL);color:#fff;box-shadow:0 0 10px var(--badL)}.opt.wrong .mk{color:var(--bad)}

.nav a:hover{color:var(--accT)}
.nav a.nx{justify-content:flex-end;text-align:right;grid-column:2}
#toast{position:fixed;left:50%;bottom:28px;z-index:9;transform:translateX(-50%) translateY(16px);background:rgba(30,33,46,.82);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:#f4f5fa;border:1px solid rgba(255,255,255,.14);padding:13px 24px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none;font:600 14px/1.4 var(--head);max-width:min(92vw,560px);text-align:center;box-shadow:0 20px 40px -14px rgba(0,0,0,.5),0 0 24px var(--glow)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:860px){.how{grid-template-columns:repeat(2,minmax(0,1fr))}.tiers{grid-template-columns:1fr}}

 body{font-size:16.5px}

<script id="data" type="application/json">{"learner": "ib-misha-873821eb", "learnerName": {"en": "Misha", "uk": "Міша"}, "day": 96, "week": 20, "total": 110, "title": {"en": "Git from zero: your tools under version control", "uk": "Git з нуля: твої інструменти під контролем версій"}, "theme": {"en": "Week 20: Git, packaging and tool quality", "uk": "Тиждень 20: Git, пакування та якість інструментів"}, "build": {"item": {"en": "A Git repository in your IslandCourse folder that keeps only your tools (Content/Tools, Content/Python, TechData), with .gitignore, Git LFS, a clean history, a merged test branch and a private copy on GitHub", "uk": "Репозиторій Git у папці IslandCourse, який зберігає лише твої інструменти (Content/Tools, Content/Python, TechData), з .gitignore, Git LFS, чистою історією, злитою тестовою гілкою і приватною копією на GitHub"}, "why": {"en": "Every studio keeps its work in version control: a history of every change, a way back from any mistake, and a safe copy off your PC. Unreal assets are big binary files, so Git needs Git LFS (large file storage) to keep them sensibly. From today every tool you make has a history, and the rest of the course (the plugin, the capstone and the hand-over) is built on it.", "uk": "Кожна студія тримає роботу в системі контролю версій. Це історія кожної зміни, шлях назад після будь-якої помилки і безпечна копія поза твоїм ПК. Асети Unreal — великі двійкові файли, тож Git потрібен Git LFS (сховище великих файлів), щоб розумно їх зберігати. Відтепер кожен твій інструмент має історію, і на ній стоїть решта курсу: плагін, випускний проєкт і пакет передачі."}, "where": {"en": "Your IslandCourse project folder (the repository) and a private repository named techtools on your free GitHub account.", "uk": "Папка проєкту IslandCourse (репозиторій) і приватний репозиторій techtools у твоєму безкоштовному акаунті GitHub."}, "spec": [{"en": "Git for Windows installed from git-scm.com with Git LFS ticked, the first branch named main, and Git Credential Manager; git --version and git lfs version both answer.", "uk": "Git for Windows встановлено з git-scm.com з прапорцем Git LFS, перша гілка зветься main, є Git Credential Manager. git --version і git lfs version обидва відповідають."}, {"en": "Your name and GitHub's private no-reply email set with git config --global, so your own email never appears in the history.", "uk": "Твоє ім'я і приватна no-reply адреса GitHub задані через git config --global, тож твоя справжня пошта ніколи не з'явиться в історії."}, {"en": ".gitignore made from gitignore-unreal.txt, with three lines at the end that keep only your tools: Content/*, !Content/Tools/ and !Content/Python/.", "uk": ".gitignore зроблено з gitignore-unreal.txt, а в кінці три рядки, які лишають тільки твої інструменти: Content/*, !Content/Tools/ і !Content/Python/."}, {"en": "Git LFS tracking *.uasset, *.umap, *.fbx, *.blend, *.png, *.tga, *.psd, *.wav and *.mp4; .gitattributes and .gitignore in the first commit, before any asset.", "uk": "Git LFS відстежує *.uasset, *.umap, *.fbx, *.blend, *.png, *.tga, *.psd, *.wav і *.mp4. .gitattributes і .gitignore — у першому коміті, раніше за будь-який асет."}, {"en": "At least four commits with clear messages (the set-up; the tools; a script change; the merged branch), a readable git log --oneline, and git lfs ls-files listing your .uasset and .umap files.", "uk": "Щонайменше чотири коміти зі зрозумілими повідомленнями (налаштування; інструменти; зміна скрипту; злита гілка), читабельний git log --oneline, а git lfs ls-files показує твої файли .uasset і .umap."}, {"en": "One branch, try-more-gaps, with one asset change, committed, switched away from and back to with Unreal closed, and merged into main.", "uk": "Одна гілка, try-more-gaps, з однією зміною асету: коміт зроблено, з гілки перемкнулися й повернулися із закритим Unreal, гілку злито в main."}, {"en": "A private GitHub repository named techtools with everything pushed; sign-in only through the browser window Git opens (never a password or token typed into a file, Git Bash or a chat); the .uasset files marked Stored with Git LFS on GitHub.", "uk": "Приватний репозиторій GitHub з назвою techtools, усе надіслано. Вхід — лише через вікно браузера, яке відкриває Git (ніколи пароль чи токен у файлі, Git Bash або чаті). Файли .uasset на GitHub позначено Stored with Git LFS."}], "piece1": "Installing Git, the first repository, LFS and the first commits (built in the lessons)", "piece2": {"en": "The branch test and the push to GitHub, on your own", "uk": "Тест гілки і надсилання на GitHub — самостійно"}, "steps": [{"text": {"en": "Check: the results of today's lessons are there (Git and Git LFS installed, and the repository in IslandCourse with .gitignore, .gitattributes and its first commits). Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it. Open Git Bash and type git --version, then git lfs version. Check: both print a version number.", "uk": "Перевір, чи є результати сьогоднішніх уроків: Git і Git LFS встановлено, а репозиторій в IslandCourse має .gitignore, .gitattributes і перші коміти. Чогось бракує? Пройди зараз кроки «Разом із тьютором» того уроку (близько 25 хвилин): самостійна робота спирається на них. Відкрий Git Bash і введи git --version, потім git lfs version. Перевірка: обидві команди друкують номер версії."}, "lesson": 1}, {"text": {"en": "Type git config --global user.name, then git config --global user.email. Check: your name and your GitHub no-reply address (ending in users.noreply.github.com) appear.", "uk": "Введи git config --global user.name, потім git config --global user.email. Перевірка: з'являються твоє ім'я і no-reply адреса GitHub (закінчується на users.noreply.github.com)."}, "lesson": 1}, {"text": {"en": "In Git Bash in your IslandCourse folder type git status. Check: no Saved, Intermediate, Binaries or DerivedDataCache folders are listed, and nothing from Content except Tools and Python.", "uk": "У Git Bash у папці IslandCourse введи git status. Перевірка: у списку немає папок Saved, Intermediate, Binaries чи DerivedDataCache, а з Content — лише Tools і Python."}, "lesson": 2}, {"text": {"en": "Type git log --oneline. Check: at least two commits, the oldest called 'Ignore rules and Git LFS'.", "uk": "Введи git log --oneline. Перевірка: щонайменше два коміти, найстаріший зветься 'Ignore rules and Git LFS'."}, "lesson": 2}, {"text": {"en": "Type git lfs ls-files | head (| head shows only the first 10 lines). Check: .uasset and .umap files are listed; if the list is empty, run git lfs migrate import --include='*.uasset,*.umap' --everything (it rewrites your local history, which is safe before your first push) and check again.", "uk": "Введи git lfs ls-files | head (| head показує лише перші 10 рядків). Перевірка: у списку є файли .uasset і .umap. Якщо список порожній, запусти git lfs migrate import --include='*.uasset,*.umap' --everything і перевір знову. Ця команда переписує локальну історію, і до першого надсилання це безпечно."}, "lesson": 2}, {"text": {"en": "Change perf_report.py's header comment, then type git diff, git add perf_report.py and git commit -m 'perf_report: clearer header'. Check: git log --oneline shows the new commit at the top.", "uk": "Зміни коментар-заголовок perf_report.py, потім введи git diff, git add perf_report.py і git commit -m 'perf_report: clearer header'. Перевірка: git log --oneline показує новий коміт угорі."}, "lesson": 3}, {"text": {"en": "Undo test: add a nonsense line to perf_report.py, save, then type git restore perf_report.py. Check: the nonsense line is gone and git status says there is nothing to commit.", "uk": "Тест скасування: додай у perf_report.py безглуздий рядок, збережи, потім введи git restore perf_report.py. Перевірка: безглуздого рядка немає, а git status каже, що комітити нічого."}, "lesson": 3}, {"text": {"en": "On your own: close Unreal; git switch -c try-more-gaps; open Unreal, set Gap Chance to 0.25 in DA_TownRules_Harbour, save and close Unreal; git add -A; git commit -m 'Try more gaps'. Check: git log --oneline on this branch shows 'Try more gaps' on top.", "uk": "Самостійно: закрий Unreal; git switch -c try-more-gaps; відкрий Unreal, постав Gap Chance на 0.25 у DA_TownRules_Harbour, збережи й закрий Unreal; git add -A; git commit -m 'Try more gaps'. Перевірка: git log --oneline на цій гілці показує 'Try more gaps' угорі."}, "lesson": 3}, {"text": {"en": "On your own: git switch main and look at Gap Chance in Unreal; close Unreal, git merge try-more-gaps, and look again; then git branch -d try-more-gaps. Check: 0.12 on main before the merge, 0.25 after it, and git branch lists only main.", "uk": "Самостійно: git switch main і подивись на Gap Chance в Unreal. Закрий Unreal, git merge try-more-gaps і подивись знову. Потім git branch -d try-more-gaps. Перевірка: на main до злиття — 0.12, після — 0.25, а git branch показує тільки main."}, "lesson": 3}, {"text": {"en": "Create the private repository techtools on GitHub (no README, .gitignore or licence), then git remote add origin with its HTTPS address and git push -u origin main, signing in in the browser window that opens. Check: the push ends with main -> main and GitHub lists Config, Content, TechData and .gitignore.", "uk": "Створи на GitHub приватний репозиторій techtools (без README, .gitignore і ліцензії). Потім git remote add origin з його HTTPS-адресою і git push -u origin main; увійди у вікні браузера, яке відкриється. Перевірка: надсилання закінчується на main -> main, а GitHub показує Config, Content, TechData і .gitignore."}, "lesson": 4}, {"text": {"en": "On GitHub open one .uasset file and take github_day96.png (your repository page, the file showing Stored with Git LFS); then look at your account's storage page. Check: the picture is in today's Work folder, and the LFS storage used is well under the free 10 GiB.", "uk": "На GitHub відкрий один файл .uasset і зроби скриншот github_day96.png (сторінка репозиторію, на файлі видно Stored with Git LFS). Потім подивись сторінку сховища свого акаунта. Перевірка: картинка в робочій папці дня, а зайняте місце LFS набагато менше за безкоштовні 10 ГіБ."}, "lesson": 4}, {"text": {"en": "Click Copy the day report, paste it into a new tutor chat, answer its questions and save its answer as summary.md in today's Work folder. Drag summary.md and github_day96.png into today's hand-in folder (the button on this page); no need to hand in the Unreal project or level folders (they're very big). Check: the hand-in folder lists 2 files, each over 1 KB.", "uk": "Клацни «Копіювати звіт дня», встав у новий чат із тьютором, дай відповіді на його питання і збережи його відповідь як summary.md у робочій папці дня. Перетягни summary.md і github_day96.png у папку здачі (кнопка на цій сторінці). Папку проєкту чи рівня Unreal здавати не треба: вона дуже велика. Перевірка: у папці здачі 2 файли, кожен більший за 1 КБ."}, "lesson": 1}], "assets": ["techart/gitignore-unreal.txt"], "next": {"en": "From tomorrow every change goes into this repository: the plugin (Day 97), the quality pass (Day 98), the review and tag (Day 99), and every capstone day up to the hand-over on Day 110.", "uk": "Від завтра кожна зміна йде в цей репозиторій: плагін (День 97), перевірка якості (День 98), огляд і тег (День 99) і кожен день випускного проєкту аж до пакета передачі в День 110."}}, "lessons": [{"title": {"en": "Version control, and installing Git", "uk": "Контроль версій і встановлення Git"}, "minutes": 40, "goals": [{"en": "Explain version control: a history of saved changes (each one a commit), so you can see what changed, go back, and keep a copy off your PC.", "uk": "Пояснювати, що таке контроль версій: історія збережених змін (кожна з них — коміт), щоб бачити, що змінилося, повертатися назад і тримати копію поза ПК."}, {"en": "Install Git for Windows with Git LFS, the branch name main and Git Credential Manager.", "uk": "Встановлювати Git for Windows з Git LFS, назвою гілки main і Git Credential Manager."}, {"en": "Set your name and a private email for your commits.", "uk": "Задавати своє ім'я і приватну адресу пошти для комітів."}], "doalong": [{"en": "Open git-scm.com, click Download for Windows and run the installer. Keep the defaults, but check three screens: Select Components has Git LFS (Large File Support) ticked; Adjusting the name of the initial branch is set to Override, with main; the credential helper is Git Credential Manager. You see Git installed.", "uk": "Відкрий git-scm.com, клацни Download for Windows і запусти інсталятор. Лиши типові значення, але перевір три екрани: у Select Components позначено Git LFS (Large File Support); Adjusting the name of the initial branch стоїть на Override з main; помічник облікових даних — Git Credential Manager. Має вийти: Git встановлено."}, {"en": "Open Git Bash from the Start menu: a black window with a $ prompt. Type git --version and press Enter, then git lfs version. You see two version numbers.", "uk": "Відкрий Git Bash з меню «Пуск» (Start): чорне вікно із запрошенням $. Введи git --version і натисни Enter, потім git lfs version. Має вийти: два номери версій."}, {"en": "Type git config --global user.name 'Your Name', then git config --global user.email 'your no-reply address', then git config --global --list. You see both lines; every commit you make will carry this name and the private address.", "uk": "Введи git config --global user.name 'Your Name', потім git config --global user.email 'your no-reply address', потім git config --global --list. Має вийти: обидва рядки. Кожен твій коміт нестиме це ім'я і приватну адресу."}, {"en": "In your browser open github.com and create a free account if you don't have one (you sign up yourself; choose a strong password and turn on two-factor sign-in when GitHub offers it). Open Settings > Emails, tick Keep my email addresses private, and copy the address ending in users.noreply.github.com. You see your private commit email.", "uk": "У браузері відкрий github.com і створи безкоштовний акаунт, якщо його ще немає. Реєструєшся самостійно: вибери надійний пароль і ввімкни двофакторний вхід, коли GitHub запропонує. Відкрий Settings > Emails, познач Keep my email addresses private і скопіюй адресу, що закінчується на users.noreply.github.com. Має вийти: твоя приватна адреса для комітів."}], "play": {"en": "Why history: the tutor tells four short stories (a Blueprint broke yesterday and nobody knows what changed; a PC died the night before a deadline; two copies of a script called final and final2; a change that must be tried without risking the working tool). For each I say which part of Git helps: the history, the copy on GitHub, commits instead of file copies, or a branch.", "uk": "Навіщо історія: тьютор розповідає чотири короткі історії (учора зламався Blueprint, і ніхто не знає, що змінилося; ПК помер у ніч перед дедлайном; дві копії скрипту з назвами final і final2; зміну треба спробувати, не ризикуючи робочим інструментом). Для кожної я кажу, яка частина Git допомагає: історія, копія на GitHub, коміти замість копій файлів чи гілка."}, "video": {"search": "git for windows install git lfs beginner"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Контроль версій і встановлення Git (Day 96, lesson 1 of 4). Today's build: Репозиторій Git у папці IslandCourse, який зберігає лише твої інструменти (Content/Tools, Content/Python, TechData), з .gitignore, Git LFS, чистою історією, злитою тестовою гілкою і приватною копією на GitHub.\nWhat I already know: Дні 61–95: усе в Content/Tools, Content/Python і TechData; День 92: perf_report.py — текстовий файл, зміни в якому Git показує рядок за рядком; День 88: DA_TownRules_Harbour — асет, який ти змінюєш на тестовій гілці; День 59: звичка пакета передачі — записувати, що де лежить.\n\nBy the end of this lesson I can:\n1. Пояснювати, що таке контроль версій: історія збережених змін (кожна з них — коміт), щоб бачити, що змінилося, повертатися назад і тримати копію поза ПК.\n2. Встановлювати Git for Windows з Git LFS, назвою гілки main і Git Credential Manager.\n3. Задавати своє ім'я і приватну адресу пошти для комітів.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: У тебе цілий набір інструментів: генератори на Blueprint, інструменти на Python, конвеєр для Blender, графи PCG, генератор міста і звіт про продуктивність. Today: Ти ставиш свої інструменти під контроль версій із Git і Git LFS і тримаєш приватну копію на GitHub. One encouraging line: Слова Git спершу виглядають дивно. Вводь їх повільно, читай, що друкує кожна команда, і за тиждень вони стануть звичні, як збереження файлу.); 2 lines on why today matters and where it comes back, in plain words (from this: Кожна студія тримає роботу в системі контролю версій. Це історія кожної зміни, шлях назад після будь-якої помилки і безпечна копія поза твоїм ПК. Асети Unreal — великі двійкові файли, тож Git потрібен Git LFS (сховище великих файлів), щоб розумно їх зберігати. Відтепер кожен твій інструмент має історію, і на ній стоїть решта курсу: плагін, випускний проєкт і пакет передачі. It comes back: Від завтра кожна зміна йде в цей репозиторій: плагін (День 97), перевірка якості (День 98), огляд і тег (День 99) і кожен день випускного проєкту аж до пакета передачі в День 110.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-96-git-from-zero exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (Встановлення Git, перший репозиторій, LFS і перші коміти (робиш на уроках)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Відкрий git-scm.com, клацни Download for Windows і запусти інсталятор. Лиши типові значення, але перевір три екрани: у Select Components позначено Git LFS (Large File Support); Adjusting the name of the initial branch стоїть на Override з main; помічник облікових даних — Git Credential Manager. Має вийти: Git встановлено.\n   2. Відкрий Git Bash з меню «Пуск» (Start): чорне вікно із запрошенням $. Введи git --version і натисни Enter, потім git lfs version. Має вийти: два номери версій. [screenshot]\n   3. Введи git config --global user.name 'Your Name', потім git config --global user.email 'your no-reply address', потім git config --global --list. Має вийти: обидва рядки. Кожен твій коміт нестиме це ім'я і приватну адресу.\n   4. У браузері відкрий github.com і створи безкоштовний акаунт, якщо його ще немає. Реєструєшся самостійно: вибери надійний пароль і ввімкни двофакторний вхід, коли GitHub запропонує. Відкрий Settings > Emails, познач Keep my email addresses private і скопіюй адресу, що закінчується на users.noreply.github.com. Має вийти: твоя приватна адреса для комітів. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Навіщо історія: тьютор розповідає чотири короткі історії (учора зламався Blueprint, і ніхто не знає, що змінилося; ПК помер у ніч перед дедлайном; дві копії скрипту з назвами final і final2; зміну треба спробувати, не ризикуючи робочим інструментом). Для кожної я кажу, яка частина Git допомагає: історія, копія на GitHub, коміти замість копій файлів чи гілка. Otherwise skip it.\n6. Review: ask me these questions from earlier days, one at a time, and correct me kindly: Day 93: Why does the HLOD layer go into BP_Building's Class Defaults rather than onto the placed buildings? | Day 89: What does Clear Town remove, and what does it never touch?\n7. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n8. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; review (by tutor or art director) = огляд; credits line = рядок авторства; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); default value = типове значення; File Explorer = Провідник; vertex / edge / face = вершина / ребро / грань; origin (and kit pivot) = origin — точка, за яку об'єкт ставлять і обертають; look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; material instance / child instance = інстанс / дочірній інстанс; material slot / node / pin = слот матеріалу / вузол / вхід; keep-out zone / footprint test / grounding = зона-виняток / тест опори / посадка на ґрунт; kit / kit piece / part of one object = набір / деталь / частина; district / plot / plot plan = район / ділянка / план ділянки; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}, {"title": {"en": "Your first repository: .gitignore and Git LFS", "uk": "Перший репозиторій: .gitignore і Git LFS"}, "minutes": 40, "goals": [{"en": "Make a repository in your IslandCourse folder with git init.", "uk": "Створювати репозиторій у папці IslandCourse через git init."}, {"en": "Keep out what Unreal can rebuild with .gitignore, and keep only your tools with three extra lines.", "uk": "Не пускати в репозиторій те, що Unreal може відбудувати, через .gitignore і лишати тільки інструменти трьома додатковими рядками."}, {"en": "Store big binary files with Git LFS, set up and committed before any asset.", "uk": "Зберігати великі двійкові файли через Git LFS, налаштований і закомічений раніше за будь-який асет."}], "doalong": [{"en": "In File Explorer open your IslandCourse folder (the one holding IslandCourse.uproject), right-click an empty spot > Show more options > Open Git Bash here. Type git init. You see 'Initialized empty Git repository' and (main) at the end of the prompt.", "uk": "У Провіднику відкрий папку IslandCourse (ту, де лежить IslandCourse.uproject), клацни правою кнопкою на порожньому місці > Show more options > Open Git Bash here. Введи git init. Має вийти: 'Initialized empty Git repository' і (main) у кінці запрошення."}, {"en": "Copy gitignore-unreal.txt from today's assets into this folder, then type mv gitignore-unreal.txt .gitignore (mv renames a file). Open .gitignore in Notepad and add at the end: # Keep only my tools, then Content/*, then !Content/Tools/ and !Content/Python/ (the ! means 'but keep this'). Save. You see the hand-out's rules and your three lines.", "uk": "Скопіюй gitignore-unreal.txt із сьогоднішніх assets у цю папку, потім введи mv gitignore-unreal.txt .gitignore (mv перейменовує файл). Відкрий .gitignore у Notepad і додай у кінець: # Keep only my tools, потім Content/*, потім !Content/Tools/ і !Content/Python/ (! означає «але це залиш»). Збережи. Має вийти: правила з роздаткового файлу і твої три рядки."}, {"en": "Type git status. You see untracked items: .gitignore, Config/, Content/ (with only Tools and Python inside), IslandCourse.uproject and TechData/; no Saved, Intermediate, Binaries or DerivedDataCache. If Content/Island or another big folder shows up, check your three lines.", "uk": "Введи git status. Має вийти: невідстежені елементи .gitignore, Config/, Content/ (усередині лише Tools і Python), IslandCourse.uproject і TechData/; жодних Saved, Intermediate, Binaries чи DerivedDataCache. Якщо з'являється Content/Island чи інша велика папка, перевір свої три рядки."}, {"en": "Until Day 97 this repository is a backup only: your tools still point at kit assets outside Tools. (World Partition levels such as L_Day93_WP keep their actors in Content/__ExternalActors__, which these lines leave out; that test level is not needed again.)", "uk": "До Дня 97 цей репозиторій — лише резервна копія: твої інструменти досі посилаються на асети набору поза Tools. Рівні World Partition, як-от L_Day93_WP, тримають акторів у Content/__ExternalActors__, а ці рядки його не пускають. Цей тестовий рівень більше не знадобиться."}, {"en": "Type git lfs install, then git lfs track '*.uasset' '*.umap' '*.fbx' '*.blend' '*.png' '*.tga' '*.psd' '*.wav' '*.mp4', then cat .gitattributes (cat prints a file). You see one line per file type, each with filter=lfs.", "uk": "Введи git lfs install, потім git lfs track '*.uasset' '*.umap' '*.fbx' '*.blend' '*.png' '*.tga' '*.psd' '*.wav' '*.mp4', потім cat .gitattributes (cat друкує файл). Має вийти: по рядку на кожен тип файлу, кожен із filter=lfs."}, {"en": "Type git add .gitignore .gitattributes and git commit -m 'Ignore rules and Git LFS'. Then git add . (the dot means everything not ignored), git status (green lines are ready to commit) and git commit -m 'My tools: Blueprints, data, PCG graphs and scripts'. You see two commits, and git lfs ls-files lists your .uasset and .umap files.", "uk": "Введи git add .gitignore .gitattributes і git commit -m 'Ignore rules and Git LFS'. Потім git add . (крапка означає все, що не ігнорується), git status (зелені рядки готові до коміту) і git commit -m 'My tools: Blueprints, data, PCG graphs and scripts'. Має вийти: два коміти, а git lfs ls-files показує твої файли .uasset і .umap."}], "play": {"en": "Keep or ignore: the tutor names ten items (Saved/Profiling/CSV; Content/Tools/Blueprints/BP_Road.uasset; Intermediate; perf_report.py; DerivedDataCache; TechData/lamps.csv; a 3 GB raw texture source; Config/DefaultEngine.ini; Binaries; IslandCourse.uproject). For each I say commit, ignore, or keep outside the repository, and why.", "uk": "Зберегти чи ігнорувати: тьютор називає десять елементів (Saved/Profiling/CSV; Content/Tools/Blueprints/BP_Road.uasset; Intermediate; perf_report.py; DerivedDataCache; TechData/lamps.csv; сире джерело текстури на 3 ГБ; Config/DefaultEngine.ini; Binaries; IslandCourse.uproject). Для кожного я кажу: коміт, ігнорувати чи тримати поза репозиторієм, і чому."}, "video": {"search": "unreal engine git lfs gitignore setup beginner"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Перший репозиторій: .gitignore і Git LFS (Day 96, lesson 2 of 4). Today's build: Репозиторій Git у папці IslandCourse, який зберігає лише твої інструменти (Content/Tools, Content/Python, TechData), з .gitignore, Git LFS, чистою історією, злитою тестовою гілкою і приватною копією на GitHub.\nWhat I already know: Дні 61–95: усе в Content/Tools, Content/Python і TechData; День 92: perf_report.py — текстовий файл, зміни в якому Git показує рядок за рядком; День 88: DA_TownRules_Harbour — асет, який ти змінюєш на тестовій гілці; День 59: звичка пакета передачі — записувати, що де лежить.\nEarlier today I already did: lesson 1 (Контроль версій і встановлення Git). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Створювати репозиторій у папці IslandCourse через git init.\n2. Не пускати в репозиторій те, що Unreal може відбудувати, через .gitignore і лишати тільки інструменти трьома додатковими рядками.\n3. Зберігати великі двійкові файли через Git LFS, налаштований і закомічений раніше за будь-який асет.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: 2 lines on why today matters and where it comes back, in plain words (from this: Кожна студія тримає роботу в системі контролю версій. Це історія кожної зміни, шлях назад після будь-якої помилки і безпечна копія поза твоїм ПК. Асети Unreal — великі двійкові файли, тож Git потрібен Git LFS (сховище великих файлів), щоб розумно їх зберігати. Відтепер кожен твій інструмент має історію, і на ній стоїть решта курсу: плагін, випускний проєкт і пакет передачі. It comes back: Від завтра кожна зміна йде в цей репозиторій: плагін (День 97), перевірка якості (День 98), огляд і тег (День 99) і кожен день випускного проєкту аж до пакета передачі в День 110.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-96-git-from-zero exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (Встановлення Git, перший репозиторій, LFS і перші коміти (робиш на уроках)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. У Провіднику відкрий папку IslandCourse (ту, де лежить IslandCourse.uproject), клацни правою кнопкою на порожньому місці > Show more options > Open Git Bash here. Введи git init. Має вийти: 'Initialized empty Git repository' і (main) у кінці запрошення.\n   2. Скопіюй gitignore-unreal.txt із сьогоднішніх assets у цю папку, потім введи mv gitignore-unreal.txt .gitignore (mv перейменовує файл). Відкрий .gitignore у Notepad і додай у кінець: # Keep only my tools, потім Content/*, потім !Content/Tools/ і !Content/Python/ (! означає «але це залиш»). Збережи. Має вийти: правила з роздаткового файлу і твої три рядки.\n   3. Введи git status. Має вийти: невідстежені елементи .gitignore, Config/, Content/ (усередині лише Tools і Python), IslandCourse.uproject і TechData/; жодних Saved, Intermediate, Binaries чи DerivedDataCache. Якщо з'являється Content/Island чи інша велика папка, перевір свої три рядки. [screenshot]\n   4. До Дня 97 цей репозиторій — лише резервна копія: твої інструменти досі посилаються на асети набору поза Tools. Рівні World Partition, як-от L_Day93_WP, тримають акторів у Content/__ExternalActors__, а ці рядки його не пускають. Цей тестовий рівень більше не знадобиться.\n   5. Введи git lfs install, потім git lfs track '*.uasset' '*.umap' '*.fbx' '*.blend' '*.png' '*.tga' '*.psd' '*.wav' '*.mp4', потім cat .gitattributes (cat друкує файл). Має вийти: по рядку на кожен тип файлу, кожен із filter=lfs.\n   6. Введи git add .gitignore .gitattributes і git commit -m 'Ignore rules and Git LFS'. Потім git add . (крапка означає все, що не ігнорується), git status (зелені рядки готові до коміту) і git commit -m 'My tools: Blueprints, data, PCG graphs and scripts'. Має вийти: два коміти, а git lfs ls-files показує твої файли .uasset і .umap. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Зберегти чи ігнорувати: тьютор називає десять елементів (Saved/Profiling/CSV; Content/Tools/Blueprints/BP_Road.uasset; Intermediate; perf_report.py; DerivedDataCache; TechData/lamps.csv; сире джерело текстури на 3 ГБ; Config/DefaultEngine.ini; Binaries; IslandCourse.uproject). Для кожного я кажу: коміт, ігнорувати чи тримати поза репозиторієм, і чому. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; review (by tutor or art director) = огляд; see-why-fix note = нотатка «бачу, чому, як виправити»; credits line = рядок авторства; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; File Explorer = Провідник; origin (and kit pivot) = origin — точка, за яку об'єкт ставлять і обертають; look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; material slot / node / pin = слот матеріалу / вузол / вхід; keep-out zone / footprint test / grounding = зона-виняток / тест опори / посадка на ґрунт; kit / kit piece / part of one object = набір / деталь / частина; district / plot / plot plan = район / ділянка / план ділянки; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}, {"title": {"en": "Commits, history and branches", "uk": "Коміти, історія і гілки"}, "minutes": 40, "goals": [{"en": "Commit small, clear changes, and read the history with git log and git diff.", "uk": "Робити коміти з малими, зрозумілими змінами й читати історію через git log і git diff."}, {"en": "Undo an uncommitted mistake in a file with git restore.", "uk": "Скасовувати незакомічену помилку у файлі через git restore."}, {"en": "Try a change on a branch and merge it, with Unreal closed while you switch.", "uk": "Пробувати зміну на гілці й зливати її, перемикаючись із закритим Unreal."}], "doalong": [{"en": "Open perf_report.py and add one word to its header comment, then save. In Git Bash type git status, then git diff. You see the file listed as modified, and the old line in red with a - and the new line in green with a +.", "uk": "Відкрий perf_report.py, додай одне слово в коментар-заголовок і збережи. У Git Bash введи git status, потім git diff. Має вийти: файл позначено як змінений, старий рядок червоний із -, новий зелений із +."}, {"en": "Type git add perf_report.py, then git commit -m 'perf_report: clearer header', then git log --oneline. You see your commits, newest first, each with a short id and its message.", "uk": "Введи git add perf_report.py, потім git commit -m 'perf_report: clearer header', потім git log --oneline. Має вийти: твої коміти, найновіший перший, кожен із коротким id і повідомленням."}, {"en": "Add a nonsense line to perf_report.py and save it. Type git restore perf_report.py and reopen the file. You see the line gone: restore brings back the last committed version of a file.", "uk": "Додай у perf_report.py безглуздий рядок і збережи. Введи git restore perf_report.py і знову відкрий файл. Рядка немає: restore повертає останню закомічену версію файлу."}, {"en": "Close Unreal (switching branches changes files under it). Type git switch -c try-more-gaps; open Unreal, set Gap Chance to 0.25 in DA_TownRules_Harbour, save and close Unreal; type git add -A and git commit -m 'Try more gaps'. You see the commit made on the new branch.", "uk": "Закрий Unreal: перемикання гілок змінює файли під ним. Введи git switch -c try-more-gaps; відкрий Unreal, постав Gap Chance на 0.25 у DA_TownRules_Harbour, збережи й закрий Unreal; введи git add -A і git commit -m 'Try more gaps'. Має вийти: коміт на новій гілці."}, {"en": "Type git switch main and open Unreal: Gap Chance is 0.12 again. Close Unreal, type git merge try-more-gaps and open Unreal: it is 0.25. Type git branch -d try-more-gaps. You see the change now part of main. Binary assets cannot be merged line by line, so change any one asset on one branch only.", "uk": "Введи git switch main і відкрий Unreal: Gap Chance знову 0.12. Закрий Unreal, введи git merge try-more-gaps і відкрий Unreal: тепер 0.25. Введи git branch -d try-more-gaps. Зміна тепер частина main. Двійкові асети не зливаються рядок за рядком, тож кожен асет змінюй лише на одній гілці."}], "play": {"en": "Message judge: the tutor shows me six commit messages (stuff; fix; Fix floating buildings: trace ignores preview boxes; WIP; Add Check Town button with floating test; changes 2). I score each from 0 to 2 and rewrite the weak ones.", "uk": "Суддя повідомлень: тьютор показує шість повідомлень комітів (stuff; fix; Fix floating buildings: trace ignores preview boxes; WIP; Add Check Town button with floating test; changes 2). Я оцінюю кожне від 0 до 2 і переписую слабкі."}, "video": {"search": "git branch switch merge tutorial beginner"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Коміти, історія і гілки (Day 96, lesson 3 of 4). Today's build: Репозиторій Git у папці IslandCourse, який зберігає лише твої інструменти (Content/Tools, Content/Python, TechData), з .gitignore, Git LFS, чистою історією, злитою тестовою гілкою і приватною копією на GitHub.\nWhat I already know: Дні 61–95: усе в Content/Tools, Content/Python і TechData; День 92: perf_report.py — текстовий файл, зміни в якому Git показує рядок за рядком; День 88: DA_TownRules_Harbour — асет, який ти змінюєш на тестовій гілці; День 59: звичка пакета передачі — записувати, що де лежить.\nEarlier today I already did: lesson 1 (Контроль версій і встановлення Git); lesson 2 (Перший репозиторій: .gitignore і Git LFS). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Робити коміти з малими, зрозумілими змінами й читати історію через git log і git diff.\n2. Скасовувати незакомічену помилку у файлі через git restore.\n3. Пробувати зміну на гілці й зливати її, перемикаючись із закритим Unreal.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: 2 lines on why today matters and where it comes back, in plain words (from this: Кожна студія тримає роботу в системі контролю версій. Це історія кожної зміни, шлях назад після будь-якої помилки і безпечна копія поза твоїм ПК. Асети Unreal — великі двійкові файли, тож Git потрібен Git LFS (сховище великих файлів), щоб розумно їх зберігати. Відтепер кожен твій інструмент має історію, і на ній стоїть решта курсу: плагін, випускний проєкт і пакет передачі. It comes back: Від завтра кожна зміна йде в цей репозиторій: плагін (День 97), перевірка якості (День 98), огляд і тег (День 99) і кожен день випускного проєкту аж до пакета передачі в День 110.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-96-git-from-zero exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (Встановлення Git, перший репозиторій, LFS і перші коміти (робиш на уроках)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Відкрий perf_report.py, додай одне слово в коментар-заголовок і збережи. У Git Bash введи git status, потім git diff. Має вийти: файл позначено як змінений, старий рядок червоний із -, новий зелений із +.\n   2. Введи git add perf_report.py, потім git commit -m 'perf_report: clearer header', потім git log --oneline. Має вийти: твої коміти, найновіший перший, кожен із коротким id і повідомленням.\n   3. Додай у perf_report.py безглуздий рядок і збережи. Введи git restore perf_report.py і знову відкрий файл. Рядка немає: restore повертає останню закомічену версію файлу. [screenshot]\n   4. Закрий Unreal: перемикання гілок змінює файли під ним. Введи git switch -c try-more-gaps; відкрий Unreal, постав Gap Chance на 0.25 у DA_TownRules_Harbour, збережи й закрий Unreal; введи git add -A і git commit -m 'Try more gaps'. Має вийти: коміт на новій гілці.\n   5. Введи git switch main і відкрий Unreal: Gap Chance знову 0.12. Закрий Unreal, введи git merge try-more-gaps і відкрий Unreal: тепер 0.25. Введи git branch -d try-more-gaps. Зміна тепер частина main. Двійкові асети не зливаються рядок за рядком, тож кожен асет змінюй лише на одній гілці. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Суддя повідомлень: тьютор показує шість повідомлень комітів (stuff; fix; Fix floating buildings: trace ignores preview boxes; WIP; Add Check Town button with floating test; changes 2). Я оцінюю кожне від 0 до 2 і переписую слабкі. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; review (by tutor or art director) = огляд; credits line = рядок авторства; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; File Explorer = Провідник; origin (and kit pivot) = origin — точка, за яку об'єкт ставлять і обертають; look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; material slot / node / pin = слот матеріалу / вузол / вхід; keep-out zone / footprint test / grounding = зона-виняток / тест опори / посадка на ґрунт; kit / kit piece / part of one object = набір / деталь / частина; district / plot / plot plan = район / ділянка / план ділянки; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}, {"title": {"en": "A private copy on GitHub", "uk": "Приватна копія на GitHub"}, "minutes": 40, "goals": [{"en": "Create a free private repository on GitHub and connect it as origin.", "uk": "Створювати безкоштовний приватний репозиторій на GitHub і під'єднувати його як origin."}, {"en": "Push your commits and their LFS files, signing in only through the browser window Git opens.", "uk": "Надсилати коміти та їхні файли LFS, входячи лише через вікно браузера, яке відкриває Git."}, {"en": "Read your repository on GitHub and stay inside the free LFS storage.", "uk": "Читати свій репозиторій на GitHub і вкладатися в безкоштовне сховище LFS."}], "doalong": [{"en": "On github.com click + > New repository, name it techtools, choose Private, and leave Add a README, .gitignore and licence unticked (an empty repository). Click Create repository. You see a page with an HTTPS address ending in techtools.git.", "uk": "На github.com клацни + > New repository, назви його techtools, вибери Private і не став прапорці Add a README, .gitignore і licence (порожній репозиторій). Клацни Create repository. Має вийти: сторінка з HTTPS-адресою, що закінчується на techtools.git."}, {"en": "In Git Bash type git remote add origin and paste that address, then git remote -v. You see origin listed twice, for fetch and for push.", "uk": "У Git Bash введи git remote add origin і встав цю адресу, потім git remote -v. Має вийти: origin двічі — для fetch і для push."}, {"en": "Type git push -u origin main. A browser window from Git Credential Manager opens: sign in to GitHub there and click Authorize. Never type a password or token into Git Bash, a file or a tutor chat. You see LFS objects upload, then the commits, and a line ending in main -> main.", "uk": "Введи git push -u origin main. Відкриється вікно браузера від Git Credential Manager: увійди там у GitHub і клацни Authorize. Ніколи не вводь пароль чи токен у Git Bash, файл або чат із тьютором. Має вийти: вивантаження об'єктів LFS, потім комітів, і рядок, що закінчується на main -> main."}, {"en": "Refresh the GitHub page and open Content/Tools/Blueprints and one .uasset. You see your folders and 'Stored with Git LFS' on the asset; your account's billing or storage page shows the LFS space used, well under the free 10 GiB.", "uk": "Онови сторінку GitHub і відкрий Content/Tools/Blueprints і один .uasset. Має вийти: твої папки і 'Stored with Git LFS' на асеті. Сторінка оплати чи сховища акаунта показує зайняте місце LFS, набагато менше за безкоштовні 10 ГіБ."}, {"en": "Commit one small change (a clearer comment line in perf_report.py), then type git push. You see the new commit on GitHub within seconds: from now on, a push is your off-PC backup.", "uk": "Зроби коміт однієї малої зміни (зрозуміліший рядок коментаря в perf_report.py), потім введи git push. За кілька секунд новий коміт з'являється на GitHub. Відтепер кожне надсилання — твоя резервна копія поза ПК."}], "play": {"en": "Safe or not: the tutor names six actions (pasting a token into a tutor chat to ask why a push failed; signing in through the browser window; committing a file with a password in it; a private repository; pushing a 5 GB raw video; turning on two-factor sig

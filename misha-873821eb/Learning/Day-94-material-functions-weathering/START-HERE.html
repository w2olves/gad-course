<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 94</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

<script id="data" type="application/json">{"learner": "ib-misha-873821eb", "learnerName": {"en": "Misha", "uk": "Міша"}, "day": 94, "week": 19, "total": 110, "title": {"en": "Material functions for generated worlds: world-aligned textures and weathering by rule", "uk": "Material functions для згенерованих світів: текстури, вирівняні за світом, і зношеність за правилом"}, "theme": {"en": "Week 19: Performance tooling and materials", "uk": "Тиждень 19: Інструменти продуктивності та матеріали"}, "build": {"item": {"en": "MF_WorldAligned, MF_GroundGrime and MF_TopDust in Content/Tools/Materials, MPC_World's new weather parameters, and M_Master's UseWeathering and UseWorldAligned switches, turned on for your building styles and tested on your quarter", "uk": "MF_WorldAligned, MF_GroundGrime і MF_TopDust у Content/Tools/Materials, нові погодні параметри MPC_World і перемикачі UseWeathering та UseWorldAligned у M_Master. Перемикачі увімкнено для стилів твоїх будинків і перевірено на мікрорайоні"}, "why": {"en": "Generated worlds repeat pieces thousands of times, so wear painted on one piece repeats too, and the world looks stamped. Rules inside the material (height above the ground, which way a surface faces, the world position) weather every copy differently and for free, wherever the generator puts it. This is how big worlds stay believable: the material does the ageing, not the artist piece by piece.", "uk": "Згенеровані світи повторюють деталі тисячі разів. Зношеність, намальована на одній деталі, теж повторюється, і світ виглядає штампованим. Правила всередині матеріалу — висота над землею, куди дивиться поверхня, позиція у світі — зношують кожну копію по-різному і без витрат, де б генератор її не поставив. Так великі світи лишаються правдоподібними: зістарює матеріал, а не художник деталь за деталлю."}, "where": {"en": "Content/Tools/Materials for the functions, Content/Tools/Data/MPC_World, your M_Master (Day 12) and its instances; tested in Content/Tools/Day94/L_Day94, a copy of L_Day93.", "uk": "Функції — у Content/Tools/Materials; Content/Tools/Data/MPC_World; твій M_Master (День 12) і його інстанси. Перевірка — у Content/Tools/Day94/L_Day94, копії L_Day93."}, "spec": [{"en": "MPC_World gains three scalar parameters: GroundZ (cm, default 0), DampHeight (cm, default 60) and Wetness (0 to 1, default 0).", "uk": "MPC_World отримує три скалярні параметри: GroundZ (см, типово 0), DampHeight (см, типово 60) і Wetness (від 0 до 1, типово 0)."}, {"en": "MF_WorldAligned: inputs Texture (Texture Object) and Size (Scalar, cm, default 400); inside, the engine's WorldAlignedTexture function with Size on all three axes; output Colour; Expose to Library ticked and a one-line description.", "uk": "MF_WorldAligned: входи Texture (Texture Object) і Size (Scalar, см, типово 400). Усередині — функція рушія WorldAlignedTexture із Size на всіх трьох осях. Вихід Colour. Прапорець Expose to Library увімкнено, є однорядковий опис."}, {"en": "MF_GroundGrime: inputs Colour, Grime Colour (Vector3) and Strength (Scalar); mask = One Minus(Saturate((Absolute World Position Z - GroundZ) / DampHeight)), broken up by a world-aligned grunge texture; outputs Colour (a Lerp) and Mask.", "uk": "MF_GroundGrime: входи Colour, Grime Colour (Vector3) і Strength (Scalar). Маска = One Minus(Saturate((Absolute World Position Z - GroundZ) / DampHeight)), розбита текстурою плям (grunge), вирівняною за світом. Виходи Colour (Lerp) і Mask."}, {"en": "MF_TopDust: inputs Colour, Dust Colour and Amount; mask = Power(Saturate(VertexNormalWS Z), 4) x Amount; output Colour.", "uk": "MF_TopDust: входи Colour, Dust Colour і Amount. Маска = Power(Saturate(VertexNormalWS Z), 4) × Amount. Вихід Colour."}, {"en": "M_Master: Static Switch Parameters UseWeathering and UseWorldAligned (both default off) and parameters GrimeColour, GrimeStrength, DustColour, DustAmount and WorldSize; with UseWeathering on, Base Color passes through MF_GroundGrime then MF_TopDust, and Wetness darkens Base Color (x Lerp(1, 0.6, Wetness)) and lowers Roughness (Lerp to 0.15); with both off every old instance looks exactly as before.", "uk": "M_Master: Static Switch Parameters UseWeathering і UseWorldAligned (обидва типово вимкнені) та параметри GrimeColour, GrimeStrength, DustColour, DustAmount і WorldSize. З увімкненим UseWeathering Base Color проходить через MF_GroundGrime, потім MF_TopDust, а Wetness затемнює Base Color (× Lerp(1, 0.6, Wetness)) і знижує Roughness (Lerp до 0.15). Коли обидва вимкнені, кожен старий інстанс виглядає точно як раніше."}, {"en": "MI_Plaster (the parent of your styles' wall colours) with both switches on and its grime and dust values set from two real photos of old walls; the quarter regenerated with damp bases and dusty ledges on every house, for every seed.", "uk": "MI_Plaster (батьківський інстанс кольорів стін твоїх стилів) з обома увімкненими перемикачами. Значення бруду й пилу взято з двох справжніх фото старих стін. Мікрорайон перегенеровано: вологий низ і пил на виступах є на кожному будинку, з будь-яким зерном."}, {"en": "Shader Complexity and stat unit's GPU time from V2 with the switches off and on differ by less than 1 ms; the rule's known limit is houses on slopes.", "uk": "Shader Complexity і час GPU зі stat unit з V2 з вимкненими й увімкненими перемикачами відрізняються менше ніж на 1 мс. Відома межа правила — будинки на схилах."}], "piece1": "The three functions, MPC_World's parameters and M_Master's switches (built in the lessons)", "piece2": {"en": "On your own: moss on the roofs, grime on the quay stone, and a capture to prove the cost", "uk": "Самостійно: мох на дахах, бруд на камені причалу і захоплення, що доводить вартість"}, "steps": [{"text": {"en": "Check: the results of today's lessons are there (MF_WorldAligned, MF_GroundGrime and MF_TopDust, MPC_World's new parameters, and M_Master's two switches). Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it. Open MPC_World and check the new parameters. Check: GroundZ 0, DampHeight 60 and Wetness 0 sit next to Night and LampColour.", "uk": "Перевір, чи є результати сьогоднішніх уроків: MF_WorldAligned, MF_GroundGrime і MF_TopDust, нові параметри MPC_World і два перемикачі M_Master. Чогось бракує? Пройди зараз кроки «Разом із тьютором» того уроку (близько 25 хвилин): самостійна робота спирається на них. Відкрий MPC_World і перевір нові параметри. Перевірка: GroundZ 0, DampHeight 60 і Wetness 0 стоять поруч із Night і LampColour."}, "lesson": 2}, {"text": {"en": "Open the three functions and check them against the spec: inputs, outputs, descriptions and Expose to Library. Check: all three are in the material Palette's Functions list and their previews show the effect.", "uk": "Відкрий три функції і звір їх із вимогами: входи, виходи, описи й Expose to Library. Перевірка: усі три є в списку Functions палітри матеріалів, а їхні прев'ю показують ефект."}, "lesson": 1}, {"text": {"en": "Long wall test in L_Day94: six wall pieces in a row, first with MI_Plaster as it was, then with UseWorldAligned on; take wall_after.png from a bookmark. Check: wall_after.png shows one continuous texture with no repeat at the joints.", "uk": "Тест довгої стіни в L_Day94: шість деталей стіни в ряд, спершу з MI_Plaster як було, потім з увімкненим UseWorldAligned. Зроби wall_after.png із закладки. Перевірка: на wall_after.png суцільна текстура без повтору на стиках."}, "lesson": 1}, {"text": {"en": "With both switches off, open three old instances (a plaster, the quay stone, a painted metal) and compare them with a screenshot of your island. Check: they look exactly as before.", "uk": "З обома вимкненими перемикачами відкрий три старі інстанси (тиньк, камінь причалу, фарбований метал) і порівняй зі скриншотом острова. Перевірка: вони виглядають точно як раніше."}, "lesson": 4}, {"text": {"en": "Set GrimeColour, GrimeStrength, DustColour and DustAmount on MI_Plaster from one photo of an old wall you like, then Regenerate the quarter. Check: from V3 (2 m) every house has a ragged damp base about 60 cm high and dust on its ledges, and nothing looks striped or stamped.", "uk": "Постав GrimeColour, GrimeStrength, DustColour і DustAmount на MI_Plaster за одним фото старої стіни, яке тобі подобається, потім перегенеруй мікрорайон. Перевірка: з V3 (2 м) у кожного будинку нерівний вологий низ заввишки близько 60 см і пил на виступах, і ніщо не виглядає смугастим чи штампованим."}, "lesson": 4}, {"text": {"en": "Change DampHeight to 120 in MPC_World, then back to 60. Check: every house's damp band rises and falls at once, without touching any building.", "uk": "Зміни DampHeight у MPC_World на 120, потім поверни 60. Перевірка: волога смуга на всіх будинках одночасно піднімається й опускається, а самі будинки ти не чіпаєш."}, "lesson": 2}, {"text": {"en": "Wetness test: set Wetness to 1 and look from V2; set it back to 0. Check: wet is darker and shinier everywhere, and dry matches yesterday's view.", "uk": "Тест вологи: постав Wetness на 1 і подивись з V2, потім поверни 0. Перевірка: мокре всюди темніше й блискучіше, а сухе збігається з учорашнім видом."}, "lesson": 3}, {"text": {"en": "Regenerate with two other seeds, then click Check Town. Save L_Day94, open any other level and open L_Day94 again. Check: the weathering follows every new house with no extra work, and Check Town still reports 0 problems.", "uk": "Перегенеруй із двома іншими зернами, потім клацни Check Town. Збережи L_Day94, відкрий будь-який інший рівень і знову відкрий L_Day94. Перевірка: зношеність без додаткової роботи з'являється на кожному новому будинку, а Check Town і далі показує 0 проблем."}, "lesson": "D90.1"}, {"text": {"en": "Cost: from V2 read Shader Complexity and stat unit's GPU time with the switches off (untick them on MI_Plaster) and on. Check: the GPU difference is under 1 ms; if it is more, make sure the grunge texture is one 1024 px texture, not several.", "uk": "Вартість: з V2 прочитай Shader Complexity і час GPU зі stat unit з вимкненими перемикачами (зніми прапорці на MI_Plaster) і з увімкненими. Перевірка: різниця GPU менша за 1 мс. Якщо більша, перевір, чи текстура плям одна, 1024 px, а не кілька."}, "lesson": 4}, {"text": {"en": "On your own: use MF_TopDust in your roof material (moss on the flat parts of the tiles, a green-grey Dust Colour) and MF_GroundGrime on the quay stone (darker near the waterline: set GroundZ to the water height for a moment to see it). Check: roofs show moss on their upper faces only, the quay's base darkens near the water, and GroundZ is back at 0.", "uk": "Самостійно: застосуй MF_TopDust у матеріалі даху (мох на пласких частинах черепиці, зелено-сірий Dust Colour) і MF_GroundGrime на камені причалу (темніше біля лінії води: щоб побачити, на хвилину постав GroundZ на висоту води). Перевірка: мох лише на верхніх гранях дахів, низ причалу темнішає біля води, а GroundZ повернуто на 0."}, "lesson": 3}, {"text": {"en": "On your own: tick perf_checklist.md and run BP_PerfFlight, then compare the report with perf_run1.md. Check: the Whole route average is within 1 ms of Day 93's.", "uk": "Самостійно: відміть perf_checklist.md, запусти BP_PerfFlight і порівняй звіт із perf_run1.md. Перевірка: середнє Whole route відрізняється від Дня 93 не більше ніж на 1 мс."}, "lesson": "D93.2"}, {"text": {"en": "Click Copy the day report, paste it into a new tutor chat, answer its questions and save its answer as summary.md in today's Work folder. Drag summary.md and wall_after.png into today's hand-in folder (the button on this page); no need to hand in the Unreal project or level folders (they're very big). Check: the hand-in folder lists 2 files, each over 1 KB.", "uk": "Клацни «Копіювати звіт дня», встав у новий чат із тьютором, дай відповіді на його питання і збережи його відповідь як summary.md у робочій папці дня. Перетягни summary.md і wall_after.png у папку здачі (кнопка на цій сторінці). Папку проєкту чи рівня Unreal здавати не треба: вона дуже велика. Перевірка: у папці здачі 2 файли, кожен більший за 1 КБ."}, "lesson": 1}], "assets": ["techart/code-style.md"], "next": {"en": "The weathered M_Master is part of Friday's performance test (Day 95), and the same material rules age every building of your district on Day 106.", "uk": "M_Master зі зношеністю входить у п'ятничний тест продуктивності (День 95). Ті самі правила матеріалу зістарюють кожен будинок твого району в День 106."}}, "lessons": [{"title": {"en": "Material functions: a node graph you reuse", "uk": "Material functions: граф вузлів, який використовуєш знову"}, "minutes": 40, "goals": [{"en": "Explain a material function: a small material graph with inputs and outputs, used inside many materials, like a function in a Blueprint.", "uk": "Пояснювати, що таке material function: маленький граф матеріалу з входами й виходами, який працює всередині багатьох матеріалів, як функція в Blueprint."}, {"en": "Make MF_WorldAligned with Function Input and Output nodes, and expose it to the library.", "uk": "Створювати MF_WorldAligned з вузлами Function Input і Output і відкривати її для бібліотеки."}, {"en": "Use the engine's WorldAlignedTexture to place a texture by world position, so it never repeats per piece.", "uk": "Ставити текстуру за позицією у світі через WorldAlignedTexture рушія, щоб вона не повторювалася на кожній деталі."}], "doalong": [{"en": "Save L_Day93 as L_Day94 in Content/Tools/Day94. In Content/Tools/Materials right-click > Materials > Material Function, name it MF_WorldAligned and open it. You see a graph with one Output Result node.", "uk": "Збережи L_Day93 як L_Day94 у Content/Tools/Day94. У Content/Tools/Materials клацни правою кнопкою > Materials > Material Function, назви її MF_WorldAligned і відкрий. Має вийти: граф з одним вузлом Output Result."}, {"en": "Right-click > Function Input; set Input Name to Texture and Input Type to Function Input Texture 2D. Add a second Function Input named Size, type Scalar, Preview Value 400, with Use Preview Value As Default ticked. You see two input nodes.", "uk": "Клацни правою кнопкою > Function Input. Постав Input Name на Texture, а Input Type — на Function Input Texture 2D. Додай другий Function Input з назвою Size, тип Scalar, Preview Value 400, з прапорцем Use Preview Value As Default. Має вийти: два вузли входів."}, {"en": "Right-click, search WorldAlignedTexture and add it. Connect Texture to its TextureObject pin; connect Size to a Make Float3 (or two Append nodes) so all three values are Size, and that to TextureSize. Connect its XYZ Texture output to Output Result and rename that output Colour.", "uk": "Клацни правою кнопкою, знайди WorldAlignedTexture і додай. З'єднай Texture з його входом TextureObject. Size з'єднай з Make Float3 (або двома вузлами Append), щоб усі три значення були Size, а його — з TextureSize. Вихід XYZ Texture з'єднай з Output Result і перейменуй цей вихід на Colour."}, {"en": "If WorldAlignedTexture is not found, tick Show Engine Content in the Content Browser settings, or project from above instead: Absolute World Position > Component Mask (R, G) > Divide by Size > the UVs of a Texture Sample. You see the preview fill with a texture.", "uk": "Якщо WorldAlignedTexture не знаходиться, увімкни прапорець Show Engine Content у налаштуваннях Content Browser. Або проєктуй згори: Absolute World Position > Component Mask (R, G) > Divide на Size > UVs вузла Texture Sample. Має вийти: прев'ю заповнюється текстурою."}, {"en": "Click an empty part of the graph, tick Expose to Library in Details and write the Description 'Places a texture by world position; Size is the tile size in cm'. Save. You see MF_WorldAligned listed under Functions in the material Palette.", "uk": "Клацни порожнє місце графа, увімкни Expose to Library у Details і напиши Description 'Places a texture by world position; Size is the tile size in cm'. Збережи. Має вийти: MF_WorldAligned є під Functions у палітрі матеріалів."}, {"en": "Test it: make M_Test_WorldAligned, drag MF_WorldAligned into its graph, give it a Texture Object with your plaster texture and Size 300, and connect Colour to Base Color. Put it on a wall of six kit pieces in L_Day94. You see one continuous plaster pattern across every joint.", "uk": "Перевір: створи M_Test_WorldAligned, перетягни в його граф MF_WorldAligned, дай йому Texture Object зі своєю текстурою тиньку і Size 300, а Colour з'єднай з Base Color. Признач матеріал стіні з шести деталей набору в L_Day94. Має вийти: суцільний візерунок тиньку через усі стики."}], "play": {"en": "Function or not: the tutor names six graph parts (a world-aligned texture; one mesh's unique colour; a grime-by-height mask; a slope mask; a single texture sample; a wetness darkening). For each I say whether it deserves a material function, and why.", "uk": "Функція чи ні: тьютор називає шість частин графа (текстура, вирівняна за світом; унікальний колір одного мешу; маска бруду за висотою; маска нахилу; один Texture Sample; затемнення від вологи). Про кожну я кажу, чи варта вона material function, і чому."}, "video": {"search": "unreal engine 5 material function inputs outputs world aligned texture"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Material functions: граф вузлів, який використовуєш знову (Day 94, lesson 1 of 4). Today's build: MF_WorldAligned, MF_GroundGrime і MF_TopDust у Content/Tools/Materials, нові погодні параметри MPC_World і перемикачі UseWeathering та UseWorldAligned у M_Master. Перемикачі увімкнено для стилів твоїх будинків і перевірено на мікрорайоні.\nWhat I already know: День 64: MPC_World, вузли Collection Parameter і M_LampGlow; День 12: M_Master та його інстанси (MI_Plaster і його дочірні інстанси); День 14: повзунок Wear у M_Master і намальовані маски зношеності; Дні 66 і 68: матеріали стін DA_Style_* і палітри; День 93: L_Day93, LS_PerfRoute, BP_PerfFlight і perf_checklist.md.\n\nBy the end of this lesson I can:\n1. Пояснювати, що таке material function: маленький граф матеріалу з входами й виходами, який працює всередині багатьох матеріалів, як функція в Blueprint.\n2. Створювати MF_WorldAligned з вузлами Function Input і Output і відкривати її для бібліотеки.\n3. Ставити текстуру за позицією у світі через WorldAlignedTexture рушія, щоб вона не повторювалася на кожній деталі.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: У тебе є повторюваний маршрут камери, що сам записує захоплення, perf_report.py, щоб його читати, і HLOD для згенерованих будинків. Today: Ти вчиш матеріали зношувати кожен згенерований будинок за правилом: волога внизу, пил згори і мокрий вигляд після дощу. One encouraging line: Сьогодні від чисел назад до вигляду — насолоджуйся. Добре правило зношує тисячу будинків так само легко, як один.); 2 lines on why today matters and where it comes back, in plain words (from this: Згенеровані світи повторюють деталі тисячі разів. Зношеність, намальована на одній деталі, теж повторюється, і світ виглядає штампованим. Правила всередині матеріалу — висота над землею, куди дивиться поверхня, позиція у світі — зношують кожну копію по-різному і без витрат, де б генератор її не поставив. Так великі світи лишаються правдоподібними: зістарює матеріал, а не художник деталь за деталлю. It comes back: M_Master зі зношеністю входить у п'ятничний тест продуктивності (День 95). Ті самі правила матеріалу зістарюють кожен будинок твого району в День 106.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-94-material-functions-weathering exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (Три функції, параметри MPC_World і перемикачі M_Master (робиш на уроках)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Збережи L_Day93 як L_Day94 у Content/Tools/Day94. У Content/Tools/Materials клацни правою кнопкою > Materials > Material Function, назви її MF_WorldAligned і відкрий. Має вийти: граф з одним вузлом Output Result.\n   2. Клацни правою кнопкою > Function Input. Постав Input Name на Texture, а Input Type — на Function Input Texture 2D. Додай другий Function Input з назвою Size, тип Scalar, Preview Value 400, з прапорцем Use Preview Value As Default. Має вийти: два вузли входів.\n   3. Клацни правою кнопкою, знайди WorldAlignedTexture і додай. З'єднай Texture з його входом TextureObject. Size з'єднай з Make Float3 (або двома вузлами Append), щоб усі три значення були Size, а його — з TextureSize. Вихід XYZ Texture з'єднай з Output Result і перейменуй цей вихід на Colour. [screenshot]\n   4. Якщо WorldAlignedTexture не знаходиться, увімкни прапорець Show Engine Content у налаштуваннях Content Browser. Або проєктуй згори: Absolute World Position > Component Mask (R, G) > Divide на Size > UVs вузла Texture Sample. Має вийти: прев'ю заповнюється текстурою.\n   5. Клацни порожнє місце графа, увімкни Expose to Library у Details і напиши Description 'Places a texture by world position; Size is the tile size in cm'. Збережи. Має вийти: MF_WorldAligned є під Functions у палітрі матеріалів.\n   6. Перевір: створи M_Test_WorldAligned, перетягни в його граф MF_WorldAligned, дай йому Texture Object зі своєю текстурою тиньку і Size 300, а Colour з'єднай з Base Color. Признач матеріал стіні з шести деталей набору в L_Day94. Має вийти: суцільний візерунок тиньку через усі стики. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Функція чи ні: тьютор називає шість частин графа (текстура, вирівняна за світом; унікальний колір одного мешу; маска бруду за висотою; маска нахилу; один Texture Sample; затемнення від вологи). Про кожну я кажу, чи варта вона material function, і чому. Otherwise skip it.\n6. Review: ask me these questions from earlier days, one at a time, and correct me kindly: Day 91: What does a bright white area in Quad Overdraw tell you? | Day 87: What does Fill Row put into each  Collection Parameter (DampHeight). Далі Saturate (тримає від 0 до 1) і One Minus. Має вийти: значення 1 біля землі й 0 вище за 60 см."}, {"en": "Break the straight edge: add MF_WorldAligned with a Texture Object node holding a grey grunge texture (your own, or a CC0 one such as the roughness map of a Poly Haven plaster or concrete set) and Size 200.", "uk": "Розбий рівний край: додай MF_WorldAligned з вузлом Texture Object, де сіра текстура плям — твоя власна або CC0, наприклад карта шорсткості з набору тиньку чи бетону Poly Haven. Size 200."}, {"en": "Then take its Colour through a Component Mask (R), so the mask stays one number, and Multiply the height value by it; then Multiply by Strength and Saturate again.", "uk": "Далі пропусти його Colour через Component Mask (R), щоб маска лишалася одним числом, і Multiply значення висоти на нього. Потім Multiply на Strength і знову Saturate."}, {"en": "Then Lerp from Colour (A) to Colour x Grime Colour (B) with it as Alpha. Outputs: Colour (the Lerp) and Mask. You see a ragged band in the preview where the height is low.", "uk": "Далі Lerp від Colour (A) до Colour × Grime Colour (B), з цим значенням як Alpha. Виходи: Colour (Lerp) і Mask. Має вийти: у прев'ю там, де висота мала, — нерівна смуга."}, {"en": "Talk it through with the tutor: the height above GroundZ suits a generator because every house gets the band, whatever its size or seed; it fails on sloping ground, where one side of a house sits lower. You see the trade-off.", "uk": "Обговори з тьютором: висота над GroundZ підходить генератору, бо смугу отримує кожен будинок, хоч який у нього розмір чи зерно. Але правило не працює на схилі, де один бік будинку нижчий. Має вийти: зрозумілий компроміс."}], "play": {"en": "Rule or paint: the tutor names six kinds of wear (damp at the base of walls; a name scratched on one door; dust on window sills; rust under one particular pipe; salt on everything within 20 m of the sea; moss on north faces). For each I say whether a m  Parameters, щоб кожен старий інстанс лишився точно таким, як був."}, {"en": "Turn weathering on for the parent of the styles' wall colours and regenerate the quarter.", "uk": "Вмикати зношеність для батьківського інстансу кольорів стін і перегенеровувати мікрорайон."}, {"en": "Measure the cost, and blend the bases into the ground by using the ground's own colour.", "uk": "Вимірювати вартість і зливати низ стін із ґрунтом через власний колір ґрунту."}], "doalong": [{"en": "Open M_Master (Day 12). Add Vector Parameters GrimeColour and DustColour and Scalar Parameters GrimeStrength and DustAmount. Run the wire that went into Base Color through MF_GroundGrime and then MF_TopDust, with the wetness darkening after them, and add a Static Switch Parameter UseWeathering (default off): True takes the weathered colour, False the old one.", "uk": "Відкрий M_Master (День 12). Додай Vector Parameters GrimeColour і DustColour та Scalar Parameters GrimeStrength і DustAmount. Пропусти дріт, що йшов у Base Color, через MF_GroundGrime, потім MF_TopDust, а після них — затемнення від вологи. Додай Static Switch Parameter UseWeathering (типово вимкнений): True бере колір зі зношеністю, False — старий."}, {"en": "Do the same for Roughness with the wetness Lerp. Apply and save, and wait while shaders compile (the counter at the bottom right; on a weaker PC this compile can take half an hour, so start it before a break). You see every existing instance unchanged.", "uk": "Те саме зроби для Roughness з Lerp вологи. Клацни Apply, збережи й зачекай, поки компілюються шейдери (лічильник унизу праворуч). На слабшому ПК це може тривати пів години, тож запускай перед перервою. Має вийти: кожен наявний інстанс не змінився."}, {"en": "Add a Scalar Parameter WorldSize (cm, default 300) and a Texture Object Parameter named exactly BaseColor, the same name as your Day 12 texture sample, so both always hold the same texture; feed it to MF_WorldAligned's Texture and WorldSize to its Size.", "uk": "Додай Scalar Parameter WorldSize (см, типово 300) і Texture Object Parameter з назвою точно BaseColor — так само, як твій Texture Sample з Дня 12, щоб обидва завжди мали ту саму текстуру. Подай його в Texture функції MF_WorldAligned, а WorldSize — в її Size."}, {"en": "Add a Static Switch Parameter UseWorldAligned (default off): True takes MF_WorldAligned's Colour, False the old BaseColor sample's RGB, and its output goes on into the Tint Multiply. If Unreal will not accept the shared name, name the new parameter WorldTexture and set the same texture on MI_Plaster. Apply. You see two new tick boxes in every M_Master instance, both off.", "uk": "Додай Static Switch Parameter UseWorldAligned (типово вимкнений): True бере Colour з MF_WorldAligned, False — RGB старого семплера BaseColor. Його вихід іде далі в Tint Multiply. Якщо Unreal не приймає спільну назву, назви новий параметр WorldTexture і задай ту саму текстуру на MI_Plaster. Клацни Apply. Має вийти: у кожному інстансі M_Master два нові прапорці, обидва зняті."}, {"en": "Open MI_Plaster (the parent of your styles' wall colours), tick UseWeathering and UseWorldAligned, and set the grime and dust values from two real photos of old plastered walls (Wikimedia Commons). Select BP_TownGenerator and click Regenerate. You see damp bases and dusty ledges on every house, in every colour of every style.", "uk": "Відкрий MI_Plaster (батьківський інстанс кольорів стін), увімкни UseWeathering і UseWorldAligned і постав значення бруду й пилу за двома справжніми фото старих тинькованих стін (Wikimedia Commons). Вибери BP_TownGenerator і клацни Regenerate. Має вийти: вологий низ і пил на виступах у кожного будинку, у кожному кольорі кожного стилю."}, {"en": "Blend the bases into the ground: set GrimeColour close to your ground's main colour, then fly 2 m along a street. You see the wall bases take on the ground's tint instead of ending in a hard line. Studios go further with Runtime Virtual Textures, which read the landscape itself; this rule already hides the seam from drone height. From V2 read Shader Complexity and stat unit's GPU time with the switches off on MI_Plaster, then on. You see the cost, usually a fraction of a millisecond.", "uk": "Злий низ стін із ґрунтом: постав GrimeColour близько до основного кольору ґрунту, потім пролети на 2 м уздовж вулиці. Низ стін набирає відтінок ґрунту замість різкої лінії. Студії йдуть далі з Runtime Virtual Textures, які читають сам ландшафт, але й це правило ховає шов з висоти дрона. З V2 прочитай Shader Complexity і час GPU зі stat unit з вимкненими перемикачами на MI_Plaster, потім з увімкненими. Має вийти: вартість, зазвичай частка мілісекунди."}], "play": {"en": "Switch, parameter or collection: the tutor names five settings (weathering on or off; grime strength on one style; world-aligned on or off; dust colour; wetness after rain). For each I say Static Switch, instance parameter or MPC_World value, and why (cost, per instance, or the whole world at once).", "uk": "Перемикач, параметр чи колекція: тьютор називає п'ять налаштувань (зношеність увімк. чи вимк.; сила бруду на одному стилі; вирівнювання за світом увімк. чи вимк.; колір пилу; волога після дощу). Про кожне я кажу: Static Switch, параметр інстансу чи значення MPC_World, і чому (вартість, окремо на інстанс чи весь світ одразу)."}, "video": {"search": "unreal engine static switch parameter master material instances"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Зношеність у M_Master через перемикач (Day 94, lesson 4 of 4). Today's build: MF_WorldAligned, MF_GroundGrime і MF_TopDust у Content/Tools/Materials, нові погодні параметри MPC_World і перемикачі UseWeathering та UseWorldAligned у M_Master. Перемикачі увімкнено для стилів твоїх будинків і перевірено на мікрорайоні.\nWhat I already know: День 64: MPC_World, вузли Collection Parameter і M_LampGlow; День 12: M_Master та його інстанси (MI_Plaster і його дочірні інстанси); День 14: повзунок Wear у M_Master і намальовані маски зношеності; Дні 66 і 68: матеріали стін DA_Style_* і палітри; День 93: L_Day93, LS_PerfRoute, BP_PerfFlight і perf_checklist.md.\nEarlier today I already did: lesson 1 (Material functions: граф вузлів, який використовуєш знову); lesson 2 (Бруд за висотою: MPC_World і земля); lesson 3 (Пил за нахилом і мокрі вулиці). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Додавати UseWeathering і UseWorldAligned у M_Master як Static Switch Parameters, щоб кожен старий інстанс лишився точно таким, як був.\n2. Вмикати зношеність для батьківського інстансу кольорів стін і перегенеровувати мікрорайон.\n3. Вимірювати вартість і зливати низ стін із ґрунтом через власний колір ґрунту.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: 2 lines on why today matters and where it comes back, in plain words (from this: Згенеровані світи повторюють деталі тисячі разів. Зношеність, намальована на одній деталі, теж повторюється, і світ виглядає штампованим. Правила всередині матеріалу — висота над землею, куди дивиться поверхня, позиція у світі — зношують кожну копію по-різному і без витрат, де б генератор її не поставив. Так великі світи лишаються правдоподібними: зістарює матеріал, а не художник деталь за деталлю. It comes back: M_Master зі зношеністю входить у п'ятничний тест продуктивності (День 95). Ті самі правила матеріалу зістарюють кожен будинок твого району в День 106.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-94-material-functions-weathering exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (Три функції, параметри MPC_World і перемикачі M_Master (робиш на уроках)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Відкрий M_Master (День 12). Додай Vector Parameters GrimeColour і DustColour та Scalar Parameters GrimeStrength і DustAmount. Пропусти дріт, що йшов у Base Color, через MF_GroundGrime, потім MF_TopDust, а після них — затемнення від вологи. Додай Static Switch Parameter UseWeathering (типово в  the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; see-why-fix note = нотатка «бачу, чому, як виправити»; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); default value = типове значення; File Explorer = Провідник; mesh = меш; vertex / edge / face = вершина / ребро / грань; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); UV unwrap / UV layout / seam / UV island = розгортка / розкладка / шов / UV-острівець; level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; material instance / child instance = інстанс / дочірній інстанс; material slot / node / pin = слот матеріалу / вузол / вхід; seed = зерно (налаштування Seed); keep-out zone / footprint test / grounding = зона-виняток / тест опори / посадка на ґрунт; kit / kit piece / part of one object = набір / деталь / частина; map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; district / plot / plot plan = район / ділянка / план ділянки; harbour / quay / waterfront / pier = гавань / причал / набережна / пірс; wear / worn edges / salt line = зношеність / стерті краї / сольова лінія; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}], "handin": [{"en": "summary.md", "uk": "summary.md (звіт дня)"}, {"en": "wall_after.png (six wall pieces with one continuous, world-aligned texture) (proof)", "uk": "wall_after.png (шість деталей стіни із суцільною текстурою, вирівняною за світом) (доказ)"}], "goal": {"en": "By the end of today you have three material functions (MF_WorldAligned, MF_GroundGrime and MF_TopDust), MPC_World with GroundZ, DampHeight and Wetness, and M_Master with weathering switches, so every generated house gets a damp base, dusty ledges and a wet look after rain by rule, with no painting per piece.", "uk": "До кінця дня в тебе є три material functions (MF_WorldAligned, MF_GroundGrime і MF_TopDust), MPC_World з GroundZ, DampHeight і Wetness та M_Master з перемикачами зношеності. Тож кожен згенерований будинок за правилом отримує вологий низ, пил на виступах і мокрий вигляд після дощу — без розфарбовування кожної деталі."}, "uses": [{"en": "Day 64: MPC_World, Collection Parameter nodes and M_LampGlow", "uk": "День 64: MPC_World, вузли Collection Parameter і M_LampGlow"}, {"en": "Day 12: M_Master and its instances (MI_Plaster and its children)", "uk": "День 12: M_Master та його інстанси (MI_Plaster і його дочірні інстанси)"}, {"en": "Day 14: M_Master's Wear slider and painted wear masks", "uk": "День 14: повзунок Wear у M_Master і намальовані маски зношеності"}, {"en": "Days 66 and 68: the DA_Style_* wall materials and palettes", "uk": "Дні 66 і 68: матеріали стін DA_Style_* і палітри"}, {"en": "Day 93: L_Day93, LS_PerfRoute, BP_PerfFlight and perf_checklist.md", "uk": "День 93: L_Day93, LS_PerfRoute, BP_PerfFlight і perf_checklist.md"}], "quiz": [{"q": {"en": "What is a material function?", "uk": "Що таке material function?"}, "options": [{"en": "A small reusable material graph with inputs and outputs, used inside many materials", "uk": "Маленький граф матеріалу з входами й виходами, який повторно використовують у багатьох матеріалах"}, {"en": "A material that runs Python", "uk": "Матеріал, що запускає Python"}, {"en": "A texture with a seed", "uk": "Текстура із зерном"}, {"en": "A Blueprint that changes materials every frame", "uk": "Blueprint, що змінює матеріали щокадру"}], "answer": 0, "explain": {"en": "Like a Blueprint function, it lets you build a piece of logic once and use it everywhere.", "uk": "Як і функція Blueprint, вона дає побудувати шматок логіки один раз і використовувати всюди."}}, {"q": {"en": "You raise DampHeight in MPC_World and every house's damp band rises at once. Why does one change reach them all?", "uk": "Ти піднімаєш DampHeight у MPC_World, і волога смуга на всіх будинках піднімається одразу. Чому одна зміна доходить до всіх?"}, "options": [{"en": "The generator ran again", "uk": "Генератор запустився знову"}, {"en": "Unreal re-imported the textures", "uk": "Unreal повторно імпортував текстури"}, {"en": "Every material reads the same MPC_World value, so one change updates the whole world", "uk": "Кожен матеріал читає те саме значення MPC_World, тож одна зміна оновлює весь світ"}, {"en": "The HLODs were rebuilt", "uk": "HLOD перебудувалися"}], "answer": 2, "explain": {"en": "A Material Parameter Collection is one set of values shared by every material that reads it.", "uk": "Material Parameter Collection — це один набір значень, спільний для всіх матеріалів, що його читають."}}, {"q": {"en": "After adding weathering to M_Master, your quay stones look different, though you never ticked anything on them. What went wrong?", "uk": "Після додавання зношеності в M_Master камінь причалу виглядає інакше, хоча на ньому ти нічого не вмикаєш. Що пішло не так?"}, "options": [{"en": "MPC_World is missing", "uk": "Немає MPC_World"}, {"en": "The quay needs Nanite", "uk": "Причалу потрібен Nanite"}, {"en": "The seed changed", "uk": "Змінилося зерно"}, {"en": "The weathering is wired in without a Static Switch, or the switch's default is on", "uk": "Зношеність під'єднано без Static Switch, або перемикач типово увімкнений"}], "answer": 3, "explain": {"en": "A Static Switch Parameter that defaults to off keeps every old instance exactly as it was.", "uk": "Static Switch Parameter, типово вимкнений, лишає кожен старий інстанс точно таким, як був."}}, {"q": {"en": "On which surface is VertexNormalWS Z about 1?", "uk": "На якій поверхні VertexNormalWS Z близько 1?"}, "options": [{"en": "A wall facing south", "uk": "Стіна, що дивиться на південь"}, {"en": "A flat top surface such as a window sill", "uk": "Плаский верх, як-от підвіконня"}, {"en": "The underside of a balcony", "uk": "Низ балкона"}], "answer": 1, "explain": {"en": "Z is how much a surface faces up: 1 on flat tops, 0 on walls and -1 underneath.", "uk": "Z показує, наскільки поверхня дивиться вгору: 1 на пласких верхах, 0 на стінах і -1 знизу."}}, {"q": {"en": "Your wall texture repeats visibly every 2 m along a street of generated houses. Which fix suits a generator?", "uk": "Текстура стіни помітно повторюється кожні 2 м уздовж вулиці згенерованих будинків. Яке виправлення підходить генератору?"}, "options": [{"en": "Use MF_WorldAligned, so the texture is placed by world position, not per piece", "uk": "MF_WorldAligned, щоб текстура ставилася за позицією у світі, а не на кожну деталь"}, {"en": "Paint every wall by hand", "uk": "Розфарбувати кожну стіну вручну"}, {"en": "Make each wall piece twice as big", "uk": "Зробити кожну деталь стіни вдвічі більшою"}, {"en": "Turn off Nanite", "uk": "Вимкнути Nanite"}], "answer": 0, "explain": {"en": "A world-aligned texture continues across joints and differs on every house, whatever the generator builds.", "uk": "Текстура, вирівняна за світом, тягнеться через стики і різна на кожному будинку, хоч що будує генератор."}}], "weekInfo": null, "morning": {"sofar": {"en": "You have a repeatable camera route that records its own capture, perf_report.py to read it, and HLODs for your generated buildings.", "uk": "У тебе є повторюваний маршрут камери, що сам записує захоплення, perf_report.py, щоб його читати, і HLOD для згенерованих будинків."}, "today": {"en": "You teach your materials to weather every generated house by rule: damp at the base, dust on top, and a wet look after rain.", "uk": "Ти вчиш матеріали зношувати кожен згенерований будинок за правилом: волога внизу, пил згори і мокрий вигляд після дощу."}, "cheer": {"en": "Today moves from numbers back to looks; enjoy it, and remember that a good rule weathers a thousand houses as easily as one.", "uk": "Сьогодні від чисел назад до вигляду — насолоджуйся. Добре правило зношує тисячу будинків так само легко, як один."}, "quote": {"text": {"en": "The edge of the sea is a strange and beautiful place.", "uk": "Край моря — дивне й прекрасне місце."}, "author": {"en": "Rachel Carson", "uk": "Рейчел Карсон"}, "source": "The Edge of the Sea (book), 1955"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-94-material-functions-weathering", "mapHref": "../../COURSE.html", "prevHref": "../Day-93-repeatable-flight-hlod/START-HERE.html", "nextHref": "../Day-95-boss-performance-report/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8 (Material Editor). I am a beginner on Day 94. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me: when my Blueprint or script fails, ask for the error message or a screenshot of the graph, point to the line or node that is wrong and explain why, then let me fix it myself. Never write the whole tool for me.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: Самостійно: мох на дахах, бруд на камені причалу і захоплення, що доводить вартість.\nIt's part of: MF_WorldAligned, MF_GroundGrime і MF_TopDust у Content/Tools/Materials, нові погодні параметри MPC_World і перемикачі UseWeathering та UseWorldAligned у M_Master. Перемикачі увімкнено для стилів твоїх будинків і перевірено на мікрорайоні (Функції — у Content/Tools/Materials; Content/Tools/Data/MPC_World; твій M_Master (День 12) і його інстанси. Перевірка — у Content/Tools/Day94/L_Day94, копії L_Day93.).\nWhy it matters: Згенеровані світи повторюють деталі тисячі разів. Зношеність, намальована на одній деталі, теж повторюється, і світ виглядає штампованим. Правила всередині матеріалу — висота над землею, куди дивиться поверхня, позиція у світі — зношують кожну копію по-різному і без витрат, де б генератор її не поставив. Так великі світи лишаються правдоподібними: зістарює матеріал, а не художник деталь за деталлю. It comes back: M_Master зі зношеністю входить у п'ятничний тест продуктивності (День 95). Ті самі правила матеріалу зістарюють кожен будинок твого району в День 106.\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-94-material-functions-weathering (on the drive I chose on Day 0).\nWhat I already know: День 64: MPC_World, вузли Collection Parameter і M_LampGlow; День 12: M_Master та його інстанси (MI_Plaster і його дочірні інстанси); День 14: повзунок Wear у M_Master і намальовані маски зношеності; Дні 66 і 68: матеріали стін DA_Style_* і палітри; День 93: L_Day93, LS_PerfRoute, BP_PerfFlight і perf_checklist.md; today's lessons: Material functions: граф вузлів, який використовуєш знову; Бруд за висотою: MPC_World і земля; Пил за нахилом і мокрі вулиці; Зношеність у M_Master через перемикач. Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- MPC_World отримує три скалярні параметри: GroundZ (см, типово 0), DampHeight (см, типово 60) і Wetness (від 0 до 1, типово 0).\n- MF_WorldAligned: входи Texture (Texture Object) і Size (Scalar, см, типово 400). Усередині — функція рушія WorldAlignedTexture із Size на всіх трьох осях. Вихід Colour. Прапорець Expose to Library увімкнено, є однорядковий опис.\n- MF_GroundGrime: входи Colour, Grime Colour (Vector3) і Strength (Scalar). Маска = One Minus(Saturate((Absolute World Position Z - GroundZ) / DampHeight)), розбита текстурою плям (grunge), вирівняною за світом. Виходи Colour (Lerp) і Mask.\n- MF_TopDust: входи Colour, Dust Colour і Amount. Маска = Power(Saturate(VertexNormalWS Z), 4) × Amount. Вихід Colour.\n- M_Master: Static Switch Parameters UseWeathering і UseWorldAligned (обидва типово вимкнені) та параметри GrimeColour, GrimeStrength, DustColour, DustAmount і WorldSize. З увімкненим UseWeathering Base Color проходить через MF_GroundGrime, потім MF_TopDust, а Wetness затемнює Base Color (× Lerp(1, 0.6, Wetness)) і знижує Roughness (Lerp до 0.15). Коли обидва вимкнені, кожен старий інстанс виглядає точно як раніше.\n- MI_Plaster (батьківський інстанс кольорів стін твоїх стилів) з обома увімкненими перемикачами. Значення бруду й пилу взято з двох справжніх фото старих стін. Мікрорайон перегенеровано: вологий низ і пил на виступах є на кожному будинку, з будь-яким зерном.\n- Shader Complexity і час GPU зі stat unit з V2 з вимкненими й увімкненими перемикачами відрізняються менше ніж на 1 мс. Відома межа правила — будинки на схилах.\n\nMy checklist (the same numbers show on my course page):\n1. Перевір, чи є результати сьогоднішніх уроків: MF_WorldAligned, MF_GroundGrime і MF_TopDust, нові параметри MPC_World і два перемикачі M_Master. Чогось бракує? Пройди зараз кроки «Разом із тьютором» того уроку (близько 25 хвилин): самостійна робота спирається на них. Відкрий MPC_World і перевір нові параметри. Перевірка: GroundZ 0, DampHeight 60 і Wetness 0 стоять поруч із Night і LampColour. (from lesson 2)\n2. Відкрий три функції і звір їх із вимогами: входи, виходи, описи й Expose to Library. Перевірка: усі три є в списку Functions палітри матеріалів, а їхні прев'ю показують ефект. (from lesson 1)\n3. Тест довгої стіни в L_Day94: шість деталей стіни в ряд, спершу з MI_Plaster як було, потім з увімкненим UseWorldAligned. Зроби wall_after.png із закладки. Перевірка: на wall_after.png суцільна текстура без повтору на стиках. (from lesson 1)\n4. З обома вимкненими перемикачами відкрий три старі інстанси (тиньк, камінь причалу, фарбований метал) і порівняй зі скриншотом острова. Перевірка: вони виглядають точно як раніше. (from lesson 4)\n5. Постав GrimeColour, GrimeStrength, DustColour і DustAmount на MI_Plaster за одним фото старої стіни, яке тобі подобається, потім перегенеруй мікрорайон. Перевірка: з V3 (2 м) у кожного будинку нерівний вологий низ заввишки близько 60 см і пил на виступах, і ніщо не виглядає смугастим чи штампованим. (from lesson 4)\n6. Зміни DampHeight у MPC_World на 120, потім поверни 60. Перевірка: волога смуга на всіх будинках одночасно піднімається й опускається, а самі будинки ти не чіпаєш. (from lesson 2)\n7. Тест вологи: постав Wetness на 1 і подивись з V2, потім поверни 0. Перевірка: мокре всюди темніше й блискучіше, а сухе збігається з учорашнім видом. (from lesson 3)\n8. Перегенеруй із двома іншими зернами, потім клацни Check Town. Збережи L_Day94, відкрий будь-який інший рівень і знову відкрий L_Day94. Перевірка: зношеність без додаткової роботи з'являється на кожному новому будинку, а Check Town і далі показує 0 проблем. (from day 90, lesson 1)\n9. Вартість: з V2 прочитай Shader Complexity і час GPU зі stat unit з вимкненими перемикачами (зніми прапорці на MI_Plaster) і з увімкненими. Перевірка: різниця GPU менша за 1 мс. Якщо більша, перевір, чи текстура плям одна, 1024 px, а не кілька. (from lesson 4)\n10. Самостійно: застосуй MF_TopDust у матеріалі даху (мох на пласких частинах черепиці, зелено-сірий Dust Colour) і MF_GroundGrime на камені причалу (темніше біля лінії води: щоб побачити, на хвилину постав GroundZ на висоту води). Перевірка: мох лише на верхніх гранях дахів, низ причалу темнішає біля води, а GroundZ повернуто на 0. (from lesson 3)\n11. Самостійно: відміть perf_checklist.md, запусти BP_PerfFlight і порівняй звіт із perf_run1.md. Перевірка: середнє Whole route відрізняється від Дня 93 не більше ніж на 1 мс. (from day 93, lesson 2)\n12. Клацни «Копіювати звіт дня», встав у новий чат із тьютором, дай відповіді на його питання і збережи його відповідь як summary.md у робочій папці дня. Перетягни summary.md і wall_after.png у папку здачі (кнопка на цій сторінці). Папку проєкту чи рівня Unreal здавати не треба: вона дуже велика. Перевірка: у папці здачі 2 файли, кожен більший за 1 КБ. (from lesson 1)\n\nHow to help: ask which step number I'm on, then give me only the next step: the exact clicks and what I should see. When I send a screenshot, compare it with my reference, my sizes and the spec, and name one thing to fix at a time.\nCheck every save and export by reopening it before we move on:\n- a Blueprint or script: compile or run it once more and see it work, with no errors\n- a .md or .txt: open it with Notepad; the text is there, and the name doesn't end in .md.txt\nWhen I write \"готово\", and in any case before the day ends, check with me one item at a time (yes/no): each spec point, then each file on my hand-in list, ready in my day work folder (skip summary.md: the day report writes it next):\n1. wall_after.png (шість деталей стіни із суцільною текстурою, вирівняною за світом) (доказ)\nFinish with a short list of anything missing, and one line on where this work comes back and what it will look like there. Then tell me the order for the end of the day: first the day report (the Copy the day report button at the bottom of my course page) into summary.md, and only then hand in all the files on the list, summary.md too.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; breakdown = розбір; checklist = чек-лист; credits line = рядок авторства; reference photo / hero photo = фото-референс / ключове фото; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («

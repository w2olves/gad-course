ng floats or sinks on uneven ground.\n2. Spawn BP_Building with the plot's Yaw, Floors and Bays, a seeded style and a seed of its own.\n3. Find and fix a repeatability bug with the habit: compare two runs, print one value, change one thing, run again.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Repeatable or not: the tutor names five random choices in a generator (a row from the Bag with Random Integer in Range; a gap from the Construction Script's Stream; a prop from the PCG seed; a building seed of Seed x 1000 + index; a tree size from Random Float). For each I say whether the same seed gives the same result, and how to fix the ones that don't.\n4. Do-along on today's build (Regenerate: roads, junctions, buildings, landmark and dressing (built step by step in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Make a function Spawn Buildings: For Each Loop over Plots (keep the Array Index); Branch: skip plots where Is Gap or Is Landmark is ticked. World front = Get Actor Location + the plot's Front. Add Line Trace By Channel from World front + (0, 0, 10000) to World front - (0, 0, 10000), Trace Channel Visibility; Break Hit Result. On no hit, Print String 'no ground under plot' with the index and skip. You see each plot's ground height in Hit Location's Z.\n   - Open PDA_TownRules and add Sea Style (PDA_BuildingStyle), Sea Style Distance (Float, m, 40), Street Mix (Data Table) and Landmark Class (Actor Class Reference), each with a tooltip. Fill them in DA_TownRules_Harbour and DA_TownRules_Inland: Sea Style DA_Style_Harbour, Street Mix DT_StreetMix, Landmark Class a tall child of BP_Building (made like BP_Building_Sea, with more Floors) or a tower from your kit. You see four new rows in both rule sets.\n   - Make a function Pick Street Mix (output: an S_StreetMixRow) that draws like BP_StreetBlock on Day 69: if the Bag (Name array) is empty, fill it with each row name of Rules > Street Mix Weight times (Get Data Table Row Names, a For Each, and a For Loop from 1 to the row's Weight adding the name); then Get from the Bag with an index from Random Integer in Range (0, the Bag's Last Index), Get Data Table Row and return it. Clear the Bag at the start of Regenerate. You see a pick that favours the heavy rows.\n   - Spawn Actor from Class: Class BP_Building; Location = World front plus Rotate Vector((-Bays x Bay Width x 50, 0, 0), (0, 0, Yaw)), which is BP_Building's origin, the smaller-X end of its front (on your right as you face the house from the street), with Z from Hit Location; Rotation (0, 0, Yaw); Bays and Floors from the plot; Has Shop = the plot's Is Shop; Seed = Seed x 1000 + Array Index; Style from a Select that picks Rules > Sea Style when Sea Distance is below Sea Style Distance, otherwise the Style of Pick Street Mix's row. Add to Spawned, call it from Regenerate and click Regenerate. You see a house on every plot, standing on the ground, fronts on the setback lines.\n   - Planned mistake: take a screenshot from a 120 m bookmark, click Regenerate again with the same seed and take another. You see different styles in the two pictures, though the seed is the same. In Pick Street Mix add a Print String showing each row name it draws from the Bag, and Regenerate twice. You see the first names differ between the two runs: Random Integer in Range ignores your seed.\n   - Change one thing: in Regenerate, right after Build Plan, Make Random Stream from Seed and set a variable Build Stream; in Pick Street Mix replace Random Integer in Range with Random Integer in Range from Stream fed by Build Stream. Regenerate twice and compare. You see two identical pictures. Delete the Print String.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Landmark, dressing and a tool that reports", "uk": "Орієнтир, оформлення й інструмент, що звітує"}, "minutes": 40, "goals": [{"en": "Place the landmark from the rules in its open square.", "uk": "Розмісти орієнтир за правилами на його відкритій площі."}, {"en": "Run PCG_StreetDresser from the button, so the props match the new streets, with junction mouths kept clear.", "uk": "Запусти PCG_StreetDresser із кнопки, щоб пропси збігалися з новими вулицями, а гирла перехресть лишалися чистими."}, {"en": "Make the tool report what it built in one readable line.", "uk": "Зроби так, щоб інструмент звітував про те, що збудував, одним читабельним рядком."}], "doalong": [{"en": "Make a function Spawn Landmark: For Each over Plots, Branch on Is Landmark; trace to the ground at the plot's Center (a landmark plot has no Front) and Spawn Actor from Class with Class = Rules > Landmark Class; Add to Spawned. Call it after Spawn Buildings and Regenerate. You see the landmark standing in the middle of its open square.", "uk": "Зроби функцію Spawn Landmark: For Each по Plots, Branch на Is Landmark; траса до землі в Center ділянки (у ділянки-орієнтира немає Front) і Spawn Actor from Class з Class = Rules > Landmark Class; Add до Spawned. Виклич її після Spawn Buildings і Regenerate. Ти бачиш орієнтир, що стоїть посеред своєї відкритої площі."}, {"en": "Add Dresser (Actor, Instance Editable) and pick the PCG Volume that holds PCG_StreetDresser over the quarter (its Kerb Offset overridden to 0, 500, 12.5 for your 12 m roads, as on Day 86). At the end of Regenerate: Dresser > Get Component by Class (PCG Component) > Is Valid > Generate Local with Force ticked (if your version offers only Generate, use that). Regenerate. You see lamps, benches, trees and cafés on the new streets, and no lamp or tree right at a junction corner; if not, click Generate on the volume yourself and note it in town_notes.md.", "uk": "Додай Dresser (Actor, Instance Editable) і вибери PCG Volume, що тримає PCG_StreetDresser над кварталом (його Kerb Offset перевизначено на 0, 500, 12.5 для твоїх доріг 12 м, як на Дні 86). Наприкінці Regenerate: Dresser > Get Component by Class (PCG Component) > Is Valid > Generate Local з позначеним Force (якщо твоя версія пропонує лише Generate, використай його). Regenerate. Ти бачиш ліхтарі, лавки, дерева й кафе на нових вулицях і жодного ліхтаря чи дерева просто в куті перехрестя; якщо ні, клацни Generate на об'ємі власноруч й зазнач це в town_notes.md."}, {"en": "Junction mouths: PCG_KeepOuts sits only on the lamp and tree branches, so benches and bollards may still stand where a side street opens (they are low, so corridors may keep them, but at a junction they block the crossing and the corner view). In the Content Browser right-click PCG_KeepOuts > Duplicate, name the copy PCG_JunctionKeepOuts, open it and set Get Spline Data's Actor Selection Tag to KeepOutJunction (keep the 7 m Bounds Modifier). In PCG_StreetDresser drag it onto the bench branch right after the Slot 2 Attribute Filter (so the bins, made from the bench points, go too) and onto the bollard branch just before its spawner. Regenerate. You see no bench, bin or bollard in the first 11 m or so of each street beyond a junction, while benches and bollards still stand under KO_Corridor01.", "uk": "Гирла перехресть: PCG_KeepOuts стоїть лише на гілках ліхтарів і дерев, тож лавки й стовпчики можуть усе ще стояти там, де відкривається бічна вулиця (вони низькі, тож коридори можуть їх лишати, але на перехресті вони блокують перетин і огляд кута). У Content Browser клацни правою на PCG_KeepOuts > Duplicate, назви копію PCG_JunctionKeepOuts, відкрий її й постав Actor Selection Tag вузла Get Spline Data на KeepOutJunction (лиши Bounds Modifier 7 м). У PCG_StreetDresser перетягни її на гілку лавок одразу після Attribute Filter Slot 2 (щоб смітники, зроблені з точок лавок, теж пішли) і на гілку стовпчиків безпосередньо перед її спавнером. Regenerate. Ти бачиш, що жодної лавки, смітника чи стовпчика немає в перших приблизно 11 м кожної вулиці за перехрестям, а лавки й стовпчики все ще стоять під KO_Corridor01."}, {"en": "At the very end of Regenerate add a Print String: Append 'Town seed ', Seed, ': ', the Length of Spawned, ' actors'. Regenerate. You see one line in the Output Log telling you what the button built.", "uk": "Найкінцем Regenerate додай Print String: Append 'Town seed ', Seed, ': ', Length Spawned, ' actors'. Regenerate. Ти бачиш один рядок в Output Log, що каже, що збудувала кнопка."}, {"en": "Click Clear, then Regenerate twice, watching the Outliner's actor count. You see the count drop to your own actors after Clear and return to the same number after each Regenerate: nothing is left behind or doubled.", "uk": "Клацни Clear, потім двічі Regenerate, стежачи за кількістю акторів в Outliner. Ти бачиш, що кількість падає до твоїх власних акторів після Clear і повертається до того самого числа після кожного Regenerate: нічого не лишилося й нічого не подвоїлося."}], "play": {"en": "Tool or toy: the tutor describes three generators (one that leaves the old town behind when you press Regenerate; one that builds a different town each time from the same seed; one that prints nothing and hides its settings). For each I name the fault and the fix I made today.", "uk": "Інструмент чи іграшка: тьютор описує три генератори (один лишає старе місто, коли натискаєш Regenerate; другий будує різне місто щоразу з того самого зерна; третій нічого не друкує й ховає свої налаштування). Для кожного назви ваду й виправлення, яке зроблено сьогодні."}, "video": {"search": "unreal engine 5 pcg component generate from blueprint editor utility"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Landmark, dressing and a tool that reports (Day 89, lesson 4 of 4).\nToday's build: BP_TownGenerator v1: Regenerate and Clear buttons that build and remove a complete 200 x 200 m quarter from the plan, with buildings traced onto the ground, seeded styles and the street dresser run at the end.\nEarlier today I already did: lesson 1 (Editor buttons: Call In Editor, Spawn Actor and a clean slate); lesson 2 (Roads and junctions from the layout); lesson 3 (Buildings on the ground, and a planned mistake). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Place the landmark from the rules in its open square.\n2. Run PCG_StreetDresser from the button, so the props match the new streets, with junction mouths kept clear.\n3. Make the tool report what it built in one readable line.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Tool or toy: the tutor describes three generators (one that leaves the old town behind when you press Regenerate; one that builds a different town each time from the same seed; one that prints nothing and hides its settings). For each I name the fault and the fix I made today.\n4. Do-along on today's build (Regenerate: roads, junctions, buildings, landmark and dressing (built step by step in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Make a function Spawn Landmark: For Each over Plots, Branch on Is Landmark; trace to the ground at the plot's Center (a landmark plot has no Front) and Spawn Actor from Class with Class = Rules > Landmark Class; Add to Spawned. Call it after Spawn Buildings and Regenerate. You see the landmark standing in the middle of its open square.\n   - Add Dresser (Actor, Instance Editable) and pick the PCG Volume that holds PCG_StreetDresser over the quarter (its Kerb Offset overridden to 0, 500, 12.5 for your 12 m roads, as on Day 86). At the end of Regenerate: Dresser > Get Component by Class (PCG Component) > Is Valid > Generate Local with Force ticked (if your version offers only Generate, use that). Regenerate. You see lamps, benches, trees and cafés on the new streets, and no lamp or tree right at a junction corner; if not, click Generate on the volume yourself and note it in town_notes.md.\n   - Junction mouths: PCG_KeepOuts sits only on the lamp and tree branches, so benches and bollards may still stand where a side street opens (they are low, so corridors may keep them, but at a junction they block the crossing and the corner view). In the Content Browser right-click PCG_KeepOuts > Duplicate, name the copy PCG_JunctionKeepOuts, open it and set Get Spline Data's Actor Selection Tag to KeepOutJunction (keep the 7 m Bounds Modifier). In PCG_StreetDresser drag it onto the bench branch right after the Slot 2 Attribute Filter (so the bins, made from the bench points, go too) and onto the bollard branch just before its spawner. Regenerate. You see no bench, bin or bollard in the first 11 m or so of each street beyond a junction, while benches and bollards still stand under KO_Corridor01.\n   - At the very end of Regenerate add a Print String: Append 'Town seed ', Seed, ': ', the Length of Spawned, ' actors'. Regenerate. You see one line in the Output Log telling you what the button built.\n   - Click Clear, then Regenerate twice, watching the Outliner's actor count. You see the count drop to your own actors after Clear and return to the same number after each Regenerate: nothing is left behind or doubled.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "town_120m_day89.png, town_street_day89.png and regenerate_graph_day89.png", "uk": "town_120m_day89.png, town_street_day89.png і regenerate_graph_day89.png"}, {"en": "seed1_a.png and seed1_b.png (two Regenerates with one seed, identical)", "uk": "seed1_a.png і seed1_b.png (два Regenerate з одним зерном, ідентичні)"}, {"en": "town_notes.md (the planned mistake and its fix, and anything you clicked by hand)", "uk": "town_notes.md (запланована помилка та її виправлення й усе, що зроблено вручну)"}, {"en": "clip_day89.mp4 (60 seconds: Clear, Regenerate, a new seed, a street fly-through)", "uk": "clip_day89.mp4 (60 секунд: Clear, Regenerate, нове зерно, проліт вулицею)"}, {"en": "summary.md", "uk": "звіт дня (summary.md)"}], "goal": {"en": "By the end of today you have BP_TownGenerator v1: one click on Regenerate turns the plan into a real town quarter (BP_Road segments, BP_Junction pieces, BP_Building on every plot standing on the ground, a landmark in its square, and PCG_StreetDresser's props), Clear removes it all, and the same seed always builds the same quarter.", "uk": "До кінця сьогодні ти маєш BP_TownGenerator v1: одне клацання Regenerate перетворює план на справжній міський квартал (сегменти BP_Road, деталі BP_Junction, BP_Building на кожній ділянці, що стоїть на землі, орієнтир на своїй площі та пропси PCG_StreetDresser), Clear прибирає все це, а те саме зерно завжди будує той самий квартал."}, "uses": [{"en": "Day 88: DA_TownRules and the rule-following plan", "uk": "День 88: DA_TownRules і план, що слідує правилам"}, {"en": "Day 87: DA_RoadLayout, S_Plot and BP_Junction", "uk": "День 87: DA_RoadLayout, S_Plot і BP_Junction"}, {"en": "Day 86: BP_Road and its Length Override", "uk": "День 86: BP_Road і його Length Override"}, {"en": "Days 67, 68 and 84: BP_Building, its styles, floors, bays, seed and child Blueprints", "uk": "Дні 67, 68 і 84: BP_Building, його стилі, поверхи, прольоти, зерно й дочірні Blueprint"}, {"en": "Days 69 and 70: DT_StreetMix and your street block's instance and draw-call counts", "uk": "Дні 69 і 70: DT_StreetMix і кількості інстансів та draw call твого вуличного кварталу"}, {"en": "Day 85: PCG_StreetDresser", "uk": "День 85: PCG_StreetDresser"}, {"en": "Day 65: BP_Promenade", "uk": "День 65: BP_Promenade"}], "quiz": [{"q": {"en": "You press Regenerate twice with Seed 1 and get different building styles. What is the most likely cause?", "uk": "Ти двічі натискаєш Regenerate із Seed 1 і отримуєш різні стилі будівель. Яка причина найімовірніша?"}, "options": [{"en": "The plots changed", "uk": "Ділянки змінилися"}, {"en": "A style is picked with Random Integer in Range instead of Random Integer in Range from Stream", "uk": "Стиль вибирається через Random Integer in Range замість Random Integer in Range from Stream"}, {"en": "Clear Town failed", "uk": "Clear Town зазнав збою"}, {"en": "Floors are wrong", "uk": "Поверхи хибні"}], "answer": 1, "explain": {"en": "A plain random node ignores your seed; a stream made from the seed gives the same numbers in the same order.", "uk": "Простий випадковий вузол ігнорує твоє зерно; потік, зроблений із зерна, дає ті самі числа в тому самому порядку."}}, {"q": {"en": "Why does the tool keep every spawned actor in the Spawned array?", "uk": "Чому інструмент тримає кожного створеного актора в масиві Spawned?"}, "options": [{"en": "So Clear removes exactly what the tool made and never your own actors", "uk": "Щоб Clear прибирав рівно те, що зробив інструмент, і ніколи твоїх власних акторів"}, {"en": "Arrays make spawning faster", "uk": "Масиви роблять створення швидшим"}, {"en": "Unreal requires it for Call In Editor", "uk": "Unreal вимагає цього для Call In Editor"}, {"en": "So the actors get collision", "uk": "Щоб актори отримали колізію"}], "answer": 0, "explain": {"en": "Tracking what you made is what makes Regenerate safe to press again and again.", "uk": "Відстеження створеного і робить Regenerate безпечним для натискання знову й знову."}}, {"q": {"en": "Buildings stand 3 m in the air on flat ground. What do you check first?", "uk": "Будівлі стоять на 3 м у повітрі на пласкій землі. Що перевіряєш першим?"}, "options": [{"en": "The building's Floors", "uk": "Floors будівлі"}, {"en": "The Seed", "uk": "Seed"}, {"en": "Whether the preview boxes still have collision, so the line trace hits them instead of the ground", "uk": "Чи мають коробки попереднього перегляду ще колізію, тож трасування влучає в них, а не в землю"}, {"en": "The road width", "uk": "Ширину дороги"}], "answer": 2, "explain": {"en": "The trace stops at the first thing it hits; preview boxes must be NoCollision.", "uk": "Трасування зупиняється на першому, у що влучає; коробки попереднього перегляду мають бути NoCollision."}}, {"q": {"en": "With Roads X 0, 90, 200 and Roads Y 0, 110, 200, how many BP_Road actors does Regenerate spawn?", "uk": "З Roads X 0, 90, 200 і Roads Y 0, 110, 200 скільки акторів BP_Road створює Regenerate?"}, "options": [{"en": "6", "uk": "6"}, {"en": "9", "uk": "9"}, {"en": "18", "uk": "18"}, {"en": "12", "uk": "12"}], "answer": 3, "explain": {"en": "Each of the 3 roads along X has 2 segments, and each of the 3 roads along Y has 2: 6 + 6 = 12.", "uk": "Кожна з 3 доріг уздовж X має 2 сегменти, і кожна з 3 доріг уздовж Y має 2: 6 + 6 = 12."}}, {"q": {"en": "Why does Spawn Buildings give each building Seed x 1000 + its plot index?", "uk": "Чому Spawn Buildings дає кожній будівлі Seed x 1000 + її індекс ділянки?"}, "options": [{"en": "So each building varies, and the same town seed always gives each plot the same building", "uk": "Щоб кожна будівля відрізнялась, а те саме зерно міста завжди давало кожній ділянці ту саму будівлю"}, {"en": "To make buildings taller", "uk": "Щоб будівлі були вищими"}, {"en": "Because BP_Building can't take a seed", "uk": "Бо BP_Building не може прийняти зерно"}, {"en": "So the trace works", "uk": "Щоб працювало трасування"}], "answer": 0, "explain": {"en": "The index makes neighbours different; the town seed makes the whole quarter repeatable.", "uk": "Індекс робить сусідів різними; зерно міста робить увесь квартал повторюваним."}}], "weekInfo": null, "morning": {"sofar": {"en": "You have BP_Road, BP_Junction, the PCG street dresser, and BP_TownGenerator's live plan following DA_TownRules.", "uk": "Ти маєш BP_Road, BP_Junction, оформлювач вулиць на PCG і живий план BP_TownGenerator, що слідує DA_TownRules."}, "today": {"en": "You give the generator its Regenerate button: a whole town quarter built from the plan, grounded, dressed and repeatable from one seed.", "uk": "Ти даєш генератору кнопку Regenerate: цілий міський квартал, збудований із плану, опущений на землю, оформлений і повторюваний з одного зерна."}, "cheer": {"en": "Today the parts of three weeks click together; when the first full quarter appears, take a moment to fly it before you fix anything.", "uk": "Сьогодні частини трьох тижнів стикуються між собою; коли з'явиться перший повний квартал, знайди хвилину, щоб пролетіти ним, перш ніж щось виправляти."}, "quote": {"text": {"en": "Plan to throw one away; you will, anyhow.", "uk": "Плануй викинути один; ти все одно це зробиш."}, "author": {"en": "Fred Brooks", "uk": "Фред Брукс"}, "source": "The Mythical Man-Month (book), 1975"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-89-town-generator-v1-regenerate", "mapHref": "../../COURSE.html", "prevHref": "../Day-88-town-placement-rules/START-HERE.html", "nextHref": "../Day-90-boss-three-town-quarters/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me: when my Blueprint or script fails, ask for the error message or a screenshot of the graph, point to the line or node that is wrong and explain why, then let me fix it myself. Never write the whole tool for me. Keep me moving and make it feel like a game.\n\nToday I build on my own: On your own: a summary report line and tool polish (categories, tooltips, safe defaults).\nIt's part of: BP_TownGenerator v1: Regenerate and Clear buttons that build and remove a complete 200 x 200 m quarter from the plan, with buildings traced onto the ground, seeded styles and the street dresser run at the end (BP_TownGenerator in Content/Tools/Blueprints; the practice level Content/Tools/Day89/L_Day89 (a copy of L_Day88) with its 300 m ground slab, the dresser volume over the quarter and KO_Corridor01.).\n\nSpec:\n- PDA_TownRules gains Sea Style (PDA_BuildingStyle; the style you gave BP_Building_Sea on Day 84), Sea Style Distance (m, 40), Street Mix (a Data Table reference, DT_StreetMix from Day 69) and Landmark Class (Actor class, for example a tall child of BP_Building made like BP_Building_Sea, or a tower from your kit); DA_TownRules_Harbour filled in.\n- BP_Building's Style, Bays, Floors, Seed and Has Shop still ticked Expose on Spawn (Day 69); its Seed From Location (Day 84) left off.\n- BP_TownGenerator: custom events Regenerate and Clear with Call In Editor ticked (they appear as buttons in Details); Spawned (Actor array) tracking everything it makes; Show Preview (Boolean) hiding the preview boxes; Dresser (Actor, Instance Editable) pointing at the PCG Volume with PCG_StreetDresser; every preview component set to NoCollision.\n- The plan (Days 87 and 88) collapsed into one function, Build Plan, called by the Construction Script and again at the start of Regenerate, so the button always uses the latest layout and rules. Regenerate in order: Build Plan; make a Build Stream from Seed; Clear Town (destroy everything in Spawned, then empty it); Spawn Roads (one BP_Road per segment between junctions, Length Override set); Spawn Junctions (a BP_Junction at every crossing); Spawn Buildings (a line trace finds the ground at each plot's Front; BP_Building spawned by its origin corner (the smaller-X end of its front) there, with its Yaw, Floors, Bays, a style (Sea Style near the shore, otherwise a DT_StreetMix row drawn from a Bag by weight, as in BP_StreetBlock on Day 69; Has Shop from the plot) and Seed = Seed x 1000 + plot index); Spawn Landmark; then Generate on the Dresser's PCG component; finally one Print String summary line.\n- BP_Junction carries two Spline components (about 20 m, one along X and one along Y) and the actor tags KeepOutWide and KeepOutJunction: PCG_KeepOuts (lamp and tree branches) keeps lamps and trees about 11 m back from every junction corner (street-dimensions.md), and PCG_JunctionKeepOuts (a duplicate of PCG_KeepOuts reading KeepOutJunction, on the bench and bollard branches) keeps benches, bins and bollards out of the junction mouths; the dresser volume's Kerb Offset is 0, 500, 12.5.\n- The planned mistake found and fixed: drawing from the Bag with Random Integer in Range (no stream) builds different styles on every Regenerate with the same seed; Random Integer in Range from Stream with the Build Stream makes it repeatable.\n- No Tick anywhere; Regenerate twice with one seed gives the same quarter (compare two screenshots); Clear removes every road, junction, building and landmark the tool made, and nothing else.\n\nMy checklist:\n1. Open L_Day89, select BP_TownGenerator and click Regenerate in its Details. Check: roads, junctions, buildings, the landmark and street props appear; the Output Log shows one summary line with the counts. (from lesson 4)\n2. Untick Show Preview. Check: the preview boxes vanish and every building stands where its box stood, facing its street. (from lesson 1)\n3. Fly the quarter at 2 m along two streets and round the square. Check: no building floats or sinks, kerbs meet every junction with no gap, no building stands on a pavement, and no bench, bin or bollard stands in a junction's mouth. (from lesson 3)\n4. Take seed1_a.png from a 120 m bookmark, click Regenerate again with the same seed and take seed1_b.png. Check: the two pictures are the same, building for building. (from lesson 3)\n5. Change Seed to 2 and click Regenerate. Check: the same roads with different gaps, heights, styles and props; Seed 1 brings back the first quarter. (from lesson 3)\n6. Click Clear. Check: searching the Outliner for BP_Road, BP_Junction and BP_Building finds nothing, while your own actors (the generator, the dresser volume, KO_Corridor01, LaneGauge) are untouched; the props stay until you Generate or Cleanup the dresser. (from lesson 1)\n7. Swap Rules to DA_TownRules_Inland and Regenerate. Check: a lower, quieter quarter on the same roads, with no shop fronts. (from lesson 3)\n8. Slide LaneGauge along KO_Corridor01 at 15 m. Check: it touches no building, lamp or tree. (from lesson 4)\n9. On your own: make the summary line count each kind (roads, junctions, buildings, landmark) with an Integer variable per kind, and print it as one sentence, for example 'Town seed 1: 12 roads, 9 junctions, 54 buildings, 1 landmark'. Write these counts and stat unit from a 120 m bookmark in town_notes.md beside the instance and draw-call counts of your Day 70 street block. Check: the numbers match what you count in the Outliner's search, and you can say how many Day 70 blocks the quarter costs. (from lesson 4)\n10. On your own: lay your BP_Promenade (Day 65) along the shore south of the quarter, from one end of the southern road to the other, and Regenerate. Check: from 60 m the promenade, the road and the first row of buildings read as one waterfront, with nothing overlapping. (from lesson 2)\n11. On your own: tidy the tool: every variable in Category Town, Layout or Rules with a tooltip and a unit; Seed with a Slider Range of 1 to 9999; the Regenerate and Clear events described in a comment box. Check: someone new can use the Details panel without opening the Blueprint. (from lesson 4)\n12. Take town_120m_day89.png, town_street_day89.png (2 m up a street) and regenerate_graph_day89.png (the Regenerate event and its functions, node names readable). Check: three pictures in today's Work folder. (from lesson 1)\n13. Record clip_day89.mp4 (60 seconds): click Clear, then Regenerate, then change the seed and Regenerate, then fly down a street. Check: the clip is in today's Work folder. (from lesson 4)\n14. Click Copy the day report, paste it into a new tutor chat, answer its questions and save its answer as summary.md. Check: summary.md is in today's Work folder with Made, To look at, Hours and To revisit filled in. (from lesson 1)\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Misha\nDay 89: BP_TownGenerator v1: a whole quarter from one seed, on a Regenerate button. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through cli function seg(str,cls){str=String(str);const W=15,H=26,t=2.8,g=.9,P={a:[[g+t/2,0],[W-g-t/2,0],[W-g-t,t],[g+t,t]],d:[[g+t,H-t],[W-g-t,H-t],[W-g-t/2,H],[g+t/2,H]],g:[[g+t,H/2-t/2],[W-g-t,H/2-t/2],[W-g-t/2,H/2],[W-g-t,H/2+t/2],[g+t,H/2+t/2],[g+t/2,H/2]],f:[[0,g+t/2],[t,g+t],[t,H/2-g-t/2],[t/2,H/2-g],[0,H/2-g-t/2]],b:[[W,g+t/2],[W,H/2-g-t/2],[W-t/2,H/2-g],[W-t,H/2-g-t/2],[W-t,g+t]],e:[[0,H/2+g+t/2],[t/2,H/2+g],[t,H/2+g+t/2],[t,H-g-t],[0,H-g-t/2]],c:[[W,H/2+g+t/2],[W,H-g-t/2],[W-t,H-g-t],[W-t,H/2+g+t/2],[W-t/2,H/2+g]]};
 let x=0,o='';for(const ch of str){if(ch===' '){x+=8;continue}if(ch==='/'){o+='<path class="on" d="M'+(x+9)+' 2L'+(x+2)+' '+(H-2)+'L'+(x+4.5)+' '+(H-2)+'L'+(x+11.5)+' 2Z"/>';x+=15;continue}const on=SEG[ch]||'';
  for(const k of 'abcdefg')o+='<polygon class="'+(on.includes(k)?'on':'gh')+'" points="'+P[k].map(p=>(p[0]+x).toFixed(1)+','+p[1].toFixed(1)).join(' ')+'"/>';x+=W+5}
 return '<svg class="seg7'+(cls?' '+cls:'')+'" viewBox="-1 -1 '+(x-3)+' '+(H+2)+'" aria-hidden="true" focusable="false"><g transform="skewX(-6) translate(2 0)">'+o+'</g></svg>'}
/* the chart: a topographic island inside a dial; week w is a waypoint, built (b), being built now (n) or still ahead (p) */
function enc(p,done){const k=p>=1?done:p<=0?'enc0':p<.25?'enc1':p<.5?'enc2':p<.75?'enc3':p<.9?'enc4':'enc5';return u(k)}
function island(state,pct,label){
 const cx=300,cy=205,R=172,TAU=Math.PI*2;
 const rad=(t,s,k)=>R*s*(1+.11*Math.sin(2*t+.6+k*.05)+.07*Math.sin(3*t+1.9-k*.08)+.045*Math.sin(5*t+.3+k*.11)+.02*Math.sin(7*t+2.2));
 const pt=(t,s,k)=>{const r=rad(t,s,k||0);return [cx+r*Math.cos(t),cy+r*Math.sin(t)*.78]};
 const f=n=>n.toFixed(1);
 const smooth=(P,closed)=>{let d='M'+f(P[0][0])+' '+f(P[0][1]);const n=P.length,g=i=>P[closed?(i+n)%n:Math.max(0,Math.min(n-1,i))];
  for(let i=0;i<(closed?n:n-1);i++){const p0=g(i-1),p1=g(i),p2=g(i+1),p3=g(i+2);d+='C'+f(p1[0]+(p2[0]-p0[0])/6)+' '+f(p1[1]+(p2[1]-p0[1])/6)+' '+f(p2[0]-(p3[0]-p1[0])/6)+' '+f(p2[1]-(p3[1]-p1[1])/6)+' '+f(p2[0])+' '+f(p2[1])}return d+(closed?'Z':'')};
 const ring=(s,k)=>{const P=[];for(let i=0;i<64;i++)P.push(pt(i/64*TAU,s,k));return smooth(P,true)};
 let o='<path class="c0" d="'+ring(1,0)+'"/>';
 [.84,.69,.55,.42,.3,.19,.1].forEach((s,k)=>o+='<path class="c" d="'+ring(s,k+1)+'"/>');
 const t0=-2.2,turns=1.55,wp=w=>{const t=(w-1)/11;return {a:t0+t*turns*TAU,s:1.1-t*.98}};
 const P=[],D=[];let last=0;for(let w=1;w<=12;w++)if(state(w)!=='p')last=w;
 for(let i=0;i<=110;i++){const t=i/110,a=t0+t*turns*TAU,s=1.1-t*.98,q=pt(a,s,0);P.push(q);if(last&&t<=(last-1)/11+1e-9)D.push(q)}
 o+='<path class="rt" d="'+smooth(P,false)+'"/>';
 if(D.length>1)o+='<path class="rtd" d="'+smooth(D,false)+'"/>';
 for(let w=1;w<=12;w++){const c=state(w),{a,s}=wp(w),q=pt(a,s,0),lx=q[0]+(Math.cos(a)>=0?15:-15),an=Math.cos(a)>=0?'start':'end';
  o+='<g class="w '+c+'">'+(c==='n'?'<circle class="halo" cx="'+f(q[0])+'" cy="'+f(q[1])+'" r="12"/>':'')+'<circle class="dot" cx="'+f(q[0])+'" cy="'+f(q[1])+'" r="'+(c==='p'?4.5:c==='n'?8:6)+'"/><text x="'+f(lx)+'" y="'+f(q[1]+5.5)+'" text-anchor="'+an+'">'+String(w).padStart(2,'0')+'</text></g>'}
 /* the dial around it: a ring with the progress arc and a label running along the rim */
 const C=2*Math.PI*176,p=Math.max(0,Math.min(1,pct||0)),id='rim'+Math.random().toString(36).slice(2,7);
 let s='<svg class="dial" viewBox="0 0 400 400" aria-hidden="true" focusable="false"><defs><linearGradient id="'+id+'g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--acc2)"/><stop offset="1" style="stop-color:var(--acc)"/></linearGradient><path id="'+id+'" d="M200 200m-191 0a191 191 0 1 1 382 0a191 191 0 1 1-382 0"/></defs>';
 s+='<circle class="face" cx="200" cy="200" r="168"/><circle class="track" cx="200" cy="200" r="176"/>';
 s+='<circle class="arc" cx="200" cy="200" r="176" stroke="url(#'+id+'g)" stroke-dasharray="'+(C*p).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 200 200)"/>';
 if(p>0){const A=-Math.PI/2+p*TAU;s+='<circle class="knob'+(p<1?' go':'')+'" cx="'+(200+176*Math.cos(A)).toFixed(1)+'" cy="'+(200+176*Math.sin(A)).toFixed(1)+'" r="7"/>'}
 if(label)s+='<text class="rimt"><textPath href="#'+id+'" startOffset="25%" text-anchor="middle">'+label+'</textPath></text>';
 s+='<svg class="topo" x="40" y="62" width="320" height="276" viewBox="40 20 520 370">'+o+'</svg>';
 return s+'</svg>'}

function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2600)}
async function cp(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e2){}a.remove()}toast(u('copied'))}
function tagTxt(v){v=String(v);const m=v.match(/^D(\d+)\.(\d+)$/i);return m?u('day')+' '+m[1]+', '+u('lesson')+' '+m[2]:u('lesson')+' '+v}
function fbCard(){const f=FB[D.day];if(!f)return '';
 if(f.s==='reviewed'){try{const z=fbSeen();if(z[D.day]!==f.at){z[D.day]=f.at;localStorage.setItem(fbSeenKey,JSON.stringify(z))}}catch(e){}
  return '<section class="card glass fbcard">'+lab(u('fbTitle'),'ok')+'<div class="row" style="align-items:baseline;gap:12px"><span class="eyebrow">'+u('fbScore')+'</span><span class="big">'+esc(f.score)+'/'+esc(f.max||10)+'</span></div>'+(fbNote(f)?'<p class="note">'+esc(fbNote(f))+'</p>':'')+'<p class="muted">'+u('fbFull')+': <code>'+esc(D.workPath)+'</code></p></section>'}
 return '<section class="card glass fbcard">'+lab(u('fbTitle'),f.s==='missing'?'':'ok')+'<p class="note">'+u(f.s==='missing'?'fbMiss':'fbWait')+'</p>'+(f.s==='missing'?'<p class="muted">'+u('shipTo')+' <code>'+esc(D.workPath)+'</code></p>':'')+'</section>'}
function qDone(){return D.quiz&&D.quiz.length&&st.qa&&D.quiz.every((q,i)=>st.qa[i]!=null)}
function prog(){const Q=(D.quiz&&D.quiz.length)?1:0,L=D.lessons.length,C=D.build.steps.length;let n=0;D.lessons.forEach((l,i)=>{if(st['q'+i])n++});D.build.steps.forEach((s,i)=>{if(st['c'+i])n++});if(Q&&qDone())n++;return (L+C+Q)?n/(L+C+Q):0}
function qScore(){let n=0;D.quiz.forEach((q,i)=>{if((st.qa||{})[i]===q.answer)n++});return n}
function pick(i,k){st.qa=st.qa||{};if(st.qa[i]!=null)return;st.qa[i]=k;if(qDone())st.qs=[qScore(),D.quiz.length];save();render();const e=document.getElementById('e'+i);if(e)e.focus({preventScroll:true})}
function retry(){st.qa={};delete st.qs;save();render();const e=document.getElementById('o0_0');if(e)e.focus()}
const isBoss=!!(D.build&&D.build.boss&&D.build.boss.length),isFin=D.day===D.total;
document.body.className=isFin?'fin':isBoss?'boss':'';
const lk=s=>esc(s).replace(/https?:\/\/[^\s<']*[^\s<.,;:)']/g,m=>'<a href="'+m+'" target="_blank" rel="noopener">'+m+'</a>');
function list(a,tag,cls){return '<'+tag+(cls?' class="'+cls+'"':'')+'>'+(a||[]).map(i=>'<li>'+lk(x(i))+'</li>').join('')+'</'+tag+'>'}
const lab=(t,k)=>'<div class="lab'+(k?' k-'+k:'')+'"><span class="dotc"></span>'+t+'</div>';
const kn=n=>'<span class="kn">'+ic(n)+'</span>';
const slider=p=>'<div class="slider"><i style="width:calc('+p+'% - 6px)"></i><b style="left:clamp(13px,'+p+'%,calc(100% - 13px))"></b></div>';
function quiz(){if(!D.quiz||!D.quiz.length)return '';const a=st.qa||{};let ok=0;const L=u('letters');
 const pips='<div class="pips well" aria-hidden="true">'+D.quiz.map((q,i)=>'<i class="'+(a[i]==null?'':a[i]===q.answer?'r':'w')+'"></i>').join('')+'</div>';
 const qs=D.quiz.map((q,i)=>{const c=a[i];if(c===q.answer)ok++;return '<div class="qz"><p class="qq"><span class="qn">'+(i+1)+'</span><span>'+lk(x(q.q))+'</span></p>'+q.options.map((o,k)=>{let cls='opt',mk='<span></span>';if(c!=null){if(k===q.answer){cls+=' right';mk=ic('check','mk')}else if(k===c){cls+=' wrong';mk=ic('x','mk')}}return '<button class="'+cls+'" id="o'+i+'_'+k+'"'+(c!=null?' disabled':'')+' onclick="pick('+i+','+k+')"><span class="lt">'+(L[k]||k+1)+'</span><span>'+esc(x(o))+'</span>'+mk+'</button>'}).join('')+(c!=null?'<p class="exp '+(c===q.answer?'r':'w')+'" id="e'+i+'" tabindex="-1"><b>'+(c===q.answer?u('right'):u('wrong'))+'</b>'+lk(x(q.explain))+'</p>':'')+'</div>'}).join('');
 return '<section class="card glass quiz">'+lab(u('quiz'),'gold')+'<p class="muted" style="margin:-6px 0 14px">'+u('quizSub')+'</p>'+pips+qs+(qDone()?'<div class="score well" role="status"><span class="eyebrow">'+u('score')+'</span><span class="lcd" aria-label="'+ok+' / '+D.quiz.length+'">'+seg(ok+'/'+D.quiz.length)+'</span><div class="row"><button class="btn ghost" id="retry" onclick="retry()">'+u('retry')+'</button></div></div>':'')+'</section>'}
function vid(v){if(!v)return '';const link=v.url?'<a href="'+esc(v.url)+'" target="_blank" rel="noopener">'+esc(x(v.title)||v.url)+'</a>'+(v.channel?' <span class="muted">· '+esc(v.channel)+(v.length?' · '+esc(v.length):'')+'</span>':''):'';const s=v.search?'<a href="https://www.youtube.com/results?search_query='+encodeURIComponent(v.search)+'" target="_blank" rel="noopener">'+u('noVid')+': '+esc(v.search)+'</a>':'';const alt=v.alt&&v.alt.url?'<br><span class="eyebrow">UA</span> <a href="'+esc(v.alt.url)+'" target="_blank" rel="noopener">'+esc(v.alt.title||v.alt.url)+'</a>'+(v.alt.channel?' <span class="muted">· '+esc(v.alt.channel)+'</span>':''):'';return '<div class="vid well">'+kn('play')+'<div><b>'+u('more')+'?</b><br>'+(link||s)+alt+(link&&s?'<br><span class="muted" style="font-size:14px">'+s+'</span>':'')+'</div></div>'}
function morning(){const m=D.morning;if(!m)return '';const q=m.quote||{};
 let shelf='';if(D.day>0){shelf='<div class="shelf" aria-hidden="true">';let g='';for(let d=0;d<D.day;d++){let p=0;try{p=(JSON.parse(localStorage.getItem('devteam:'+D.learner+':'+d))||{}).pct||0}catch(e){}g+='<i class="'+(p>=1?'d':'')+(d>0&&d%5===0?' bs':'')+'"></i>';if(d%5===0||d===D.day-1){shelf+='<span class="wkg">'+g+'</span>';g=''}}shelf+='</div>'}
 const qt=lang==='uk'&&q.original?q.original:x(q.text);
 return '<section class="card glass morning"><div class="mgrid">'+(m.sofar?'<div>'+lab(u('sofar'),'gold')+shelf+'<p class="mtxt">'+lk(x(m.sofar))+'</p></div>':'')+(m.today?'<div>'+lab(u('todayL'))+'<p class="mtxt">'+lk(x(m.today))+'</p></div>':'')+'</div>'+(m.cheer?'<p class="cheer">'+esc(x(m.cheer))+'</p>':'')+(qt?'<figure class="quote well">'+kn('quote')+'<blockquote>'+esc(qt)+'</blockquote>'+(q.author?'<figcaption>'+esc(x(q.author))+'</figcaption>':'')+'</figure>':'')+'</section>'}
function setLang(l){lang=l;try{localStorage.setItem('devteam:lang',lang)}catch(e){};render()}
function toggleLang(){setLang(lang==='uk'?'en':'uk')}
/* keep open sections and keyboard focus across re-renders */
const openD=new Set();
function tg(e){if(e.open)openD.add(e.id);else openD.delete(e.id)}
const op=id=>openD.has(id)?' open':'';
function render(){const ae=document.activeElement,fid=ae&&(ae.id||(ae.getAttribute('data-th')?'th-'+ae.getAttribute('data-th'):ae.getAttribute('lang')&&ae.closest('.seg')?'lg-'+ae.getAttribute('lang'):''));
 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);
 const b=D.build,P=Math.round(prog()*100);
 document.getElementById('top').innerHTML='<div class="topin glass"><a class="maplink" href="'+esc(D.mapHref)+'">'+kn('map')+u('map')+'</a><div class="crumb"><b>'+esc(x(D.learnerName))+'</b><span>'+u('week')+' '+D.week+'</span><span>'+u('day')+' '+D.day+' '+u('of')+' '+D.total+'</span></div>'+controls(lang,'setLang')+'</div><div class="tline"><i style="width:'+P+'%"></i></div>';
 const state=w=>w<D.week?'b':w===D.week?'n':'p';
 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 if(D.weekInfo){const w=D.weekInfo;h+='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}
 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p><div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+list(D.handin,'ul','ticks')+'<p class="path">'+ic('folder')+'<span>'+u('shipTo')+' <code>'+esc(D.workPath)+'</code></span></p>'+(D.lessons.length?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<p class="muted">'+u('report')+'</p><div class="row"><button class="btn s" onclick="cp(D.reportPrompt)">'+ic('copy')+u('copyR')+'</button></div></section>';
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();
</script>

<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 89</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

<script id="data" type="application/json">{"learner": "ib-misha-873821eb", "learnerName": {"en": "Misha", "uk": "Міша"}, "day": 89, "week": 18, "total": 110, "title": {"en": "BP_TownGenerator v1: a whole quarter from one seed, on a Regenerate button", "uk": "BP_TownGenerator v1: цілий квартал з одного зерна, на кнопці Regenerate"}, "theme": {"en": "Week 18: Procedural roads and towns", "uk": "Тиждень 18: Процедурні дороги й міста"}, "build": {"item": {"en": "BP_TownGenerator v1: Regenerate and Clear buttons that build and remove a complete 200 x 200 m quarter from the plan, with buildings traced onto the ground, seeded styles and the street dresser run at the end", "uk": "BP_TownGenerator v1: кнопки Regenerate і Clear, що будують і прибирають повний квартал 200 x 200 м із плану, з будівлями, опущеними на землю трасуванням, стилями із зерна й оформлювачем вулиць, запущеним наприкінці"}, "why": {"en": "A plan is only half a tool; the other half is a button a designer trusts. Regenerate must build everything, remove everything it built before, put nothing in the air, and give the same quarter for the same seed, so a team can say 'seed 7 with the harbour rules' and all see the same town. Editor buttons that spawn, track and clean up actors are the core of every in-house level generator.", "uk": "План — лише половина інструмента; друга половина — кнопка, якій дизайнер довіряє. Regenerate має збудувати все, прибрати все, що збудовано раніше, нічого не лишити в повітрі й дати той самий квартал для того самого зерна, щоб команда могла сказати «зерно 7 з правилами гавані» і всі бачили те саме місто. Кнопки редактора, що створюють, відстежують і прибирають акторів, — основа кожного внутрішнього генератора рівнів."}, "where": {"en": "BP_TownGenerator in Content/Tools/Blueprints; the practice level Content/Tools/Day89/L_Day89 (a copy of L_Day88) with its 300 m ground slab, the dresser volume over the quarter and KO_Corridor01.", "uk": "BP_TownGenerator у Content/Tools/Blueprints; тренувальний рівень Content/Tools/Day89/L_Day89 (копія L_Day88) з його плитою землі 300 м, об'ємом оформлювача над кварталом і KO_Corridor01."}, "spec": [{"en": "PDA_TownRules gains Sea Style (PDA_BuildingStyle; the style you gave BP_Building_Sea on Day 84), Sea Style Distance (m, 40), Street Mix (a Data Table reference, DT_StreetMix from Day 69) and Landmark Class (Actor class, for example a tall child of BP_Building made like BP_Building_Sea, or a tower from your kit); DA_TownRules_Harbour filled in.", "uk": "PDA_TownRules отримує Sea Style (PDA_BuildingStyle; стиль, який ти дав BP_Building_Sea на Дні 84), Sea Style Distance (м, 40), Street Mix (посилання на Data Table, DT_StreetMix з Дня 69) і Landmark Class (клас Actor, наприклад високий дочірній BP_Building, зроблений як BP_Building_Sea, або вежа з твого набору); DA_TownRules_Harbour заповнено."}, {"en": "BP_Building's Style, Bays, Floors, Seed and Has Shop still ticked Expose on Spawn (Day 69); its Seed From Location (Day 84) left off.", "uk": "Style, Bays, Floors, Seed і Has Shop у BP_Building і далі з позначеним Expose on Spawn (День 69); його Seed From Location (День 84) лишається вимкненим."}, {"en": "BP_TownGenerator: custom events Regenerate and Clear with Call In Editor ticked (they appear as buttons in Details); Spawned (Actor array) tracking everything it makes; Show Preview (Boolean) hiding the preview boxes; Dresser (Actor, Instance Editable) pointing at the PCG Volume with PCG_StreetDresser; every preview component set to NoCollision.", "uk": "BP_TownGenerator: власні події Regenerate і Clear з позначеним Call In Editor (вони з'являються як кнопки в Details); Spawned (масив Actor), що відстежує все, що він робить; Show Preview (Boolean), що ховає коробки попереднього перегляду; Dresser (Actor, Instance Editable), що вказує на PCG Volume з PCG_StreetDresser; кожен компонент попереднього перегляду виставлено на NoCollision."}, {"en": "The plan (Days 87 and 88) collapsed into one function, Build Plan, called by the Construction Script and again at the start of Regenerate, so the button always uses the latest layout and rules. Regenerate in order: Build Plan; make a Build Stream from Seed; Clear Town (destroy everything in Spawned, then empty it); Spawn Roads (one BP_Road per segment between junctions, Length Override set); Spawn Junctions (a BP_Junction at every crossing); Spawn Buildings (a line trace finds the ground at each plot's Front; BP_Building spawned by its origin corner (the smaller-X end of its front) there, with its Yaw, Floors, Bays, a style (Sea Style near the shore, otherwise a DT_StreetMix row drawn from a Bag by weight, as in BP_StreetBlock on Day 69; Has Shop from the plot) and Seed = Seed x 1000 + plot index); Spawn Landmark; then Generate on the Dresser's PCG component; finally one Print String summary line.", "uk": "План (Дні 87 і 88), згорнутий в одну функцію Build Plan, яку викликають Construction Script і ще раз початок Regenerate, тож кнопка завжди використовує найновіше планування й правила. Regenerate по порядку: Build Plan; зроби Build Stream із Seed; Clear Town (знищ усе в Spawned, потім спорожни його); Spawn Roads (один BP_Road на сегмент між перехрестями, Length Override задано); Spawn Junctions (BP_Junction у кожному перетині); Spawn Buildings (трасування знаходить землю на Front кожної ділянки; BP_Building створюється за його кутовим початком координат (кінець фасаду з меншим X) там, з її Yaw, Floors, Bays, стилем (Sea Style біля берега, інакше рядок DT_StreetMix, взятий з Bag за вагою, як у BP_StreetBlock на Дні 69; Has Shop із ділянки) і Seed = Seed x 1000 + індекс ділянки); Spawn Landmark; потім Generate на компоненті PCG оформлювача; нарешті один підсумковий рядок Print String."}, {"en": "BP_Junction carries two Spline components (about 20 m, one along X and one along Y) and the actor tags KeepOutWide and KeepOutJunction: PCG_KeepOuts (lamp and tree branches) keeps lamps and trees about 11 m back from every junction corner (street-dimensions.md), and PCG_JunctionKeepOuts (a duplicate of PCG_KeepOuts reading KeepOutJunction, on the bench and bollard branches) keeps benches, bins and bollards out of the junction mouths; the dresser volume's Kerb Offset is 0, 500, 12.5.", "uk": "BP_Junction несе два компоненти Spline (близько 20 м, один уздовж X і один уздовж Y) і теги актора KeepOutWide та KeepOutJunction: PCG_KeepOuts (гілки ліхтарів і дерев) тримає ліхтарі й дерева приблизно за 11 м від кожного кута перехрестя (street-dimensions.md), а PCG_JunctionKeepOuts (дублікат PCG_KeepOuts, що читає KeepOutJunction, на гілках лавок і стовпчиків) тримає лавки, смітники й стовпчики поза гирлами перехресть; Kerb Offset об'єму оформлювача — 0, 500, 12.5."}, {"en": "The planned mistake found and fixed: drawing from the Bag with Random Integer in Range (no stream) builds different styles on every Regenerate with the same seed; Random Integer in Range from Stream with the Build Stream makes it repeatable.", "uk": "Запланована помилка знайдена й виправлена: вибір із Bag через Random Integer in Range (без потоку) будує різні стилі при кожному Regenerate з тим самим зерном; Random Integer in Range from Stream із Build Stream робить його повторюваним."}, {"en": "No Tick anywhere; Regenerate twice with one seed gives the same quarter (compare two screenshots); Clear removes every road, junction, building and landmark the tool made, and nothing else.", "uk": "Ніде немає Tick; двічі Regenerate з одним зерном дає той самий квартал (порівняй два скриншоти); Clear прибирає кожну дорогу, перехрестя, будівлю й орієнтир, які зробив інструмент, і більше нічого."}], "piece1": "Regenerate: roads, junctions, buildings, landmark and dressing (built step by step in the lessons)", "piece2": {"en": "On your own: a summary report line and tool polish (categories, tooltips, safe defaults)", "uk": "Самостійно: підсумковий рядок звіту та вдосконалення інструмента (категорії, підказки, безпечні значення за замовчуванням)"}, "steps": [{"text": {"en": "Open L_Day89, select BP_TownGenerator and click Regenerate in its Details. Check: roads, junctions, buildings, the landmark and street props appear; the Output Log shows one summary line with the counts.", "uk": "Відкрий L_Day89, виділи BP_TownGenerator і клацни Regenerate у його Details. Перевірка: з'являються дороги, перехрестя, будівлі, орієнтир і вуличні пропси; Output Log показує один підсумковий рядок із кількостями."}, "lesson": 4}, {"text": {"en": "Untick Show Preview. Check: the preview boxes vanish and every building stands where its box stood, facing its street.", "uk": "Зніми позначку Show Preview. Перевірка: коробки попереднього перегляду зникають, а кожна будівля стоїть там, де стояла її коробка, фасадом до своєї вулиці."}, "lesson": 1}, {"text": {"en": "Fly the quarter at 2 m along two streets and round the square. Check: no building floats or sinks, kerbs meet every junction with no gap, no building stands on a pavement, and no bench, bin or bollard stands in a junction's mouth.", "uk": "Прольоти кварталом на висоті 2 м уздовж двох вулиць і навколо площі. Перевірка: жодна будівля не висить і не тоне, бордюри сходяться з кожним перехрестям без проміжку, жодна будівля не стоїть на тротуарі, а жодна лавка, смітник чи стовпчик не стоїть у гирлі перехрестя."}, "lesson": 3}, {"text": {"en": "Take seed1_a.png from a 120 m bookmark, click Regenerate again with the same seed and take seed1_b.png. Check: the two pictures are the same, building for building.", "uk": "Зроби seed1_a.png із закладки 120 м, клацни Regenerate ще раз із тим самим зерном і зроби seed1_b.png. Перевірка: дві картинки однакові, будівля за будівлею."}, "lesson": 3}, {"text": {"en": "Change Seed to 2 and click Regenerate. Check: the same roads with different gaps, heights, styles and props; Seed 1 brings back the first quarter.", "uk": "Зміни Seed на 2 і клацни Regenerate. Перевірка: ті самі дороги з іншими проміжками, висотами, стилями й пропсами; Seed 1 повертає перший квартал."}, "lesson": 3}, {"text": {"en": "Click Clear. Check: searching the Outliner for BP_Road, BP_Junction and BP_Building finds nothing, while your own actors (the generator, the dresser volume, KO_Corridor01, LaneGauge) are untouched; the props stay until you Generate or Cleanup the dresser.", "uk": "Клацни Clear. Перевірка: пошук в Outliner за BP_Road, BP_Junction і BP_Building нічого не знаходить, а твої власні актори (генератор, об'єм оформлювача, KO_Corridor01, LaneGauge) недоторкані; пропси лишаються, доки ти не зробиш Generate або Cleanup оформлювача."}, "lesson": 1}, {"text": {"en": "Swap Rules to DA_TownRules_Inland and Regenerate. Check: a lower, quieter quarter on the same roads, with no shop fronts.", "uk": "Заміни Rules на DA_TownRules_Inland і Regenerate. Перевірка: нижчий, тихіший квартал на тих самих дорогах, без вітрин магазинів."}, "lesson": 3}, {"text": {"en": "Slide LaneGauge along KO_Corridor01 at 15 m. Check: it touches no building, lamp or tree.", "uk": "Проведи LaneGauge вздовж KO_Corridor01 на висоті 15 м. Перевірка: він не торкається жодної будівлі, ліхтаря чи дерева."}, "lesson": 4}, {"text": {"en": "On your own: make the summary line count each kind (roads, junctions, buildings, landmark) with an Integer variable per kind, and print it as one sentence, for example 'Town seed 1: 12 roads, 9 junctions, 54 buildings, 1 landmark'. Write these counts and stat unit from a 120 m bookmark in town_notes.md beside the instance and draw-call counts of your Day 70 street block. Check: the numbers match what you count in the Outliner's search, and you can say how many Day 70 blocks the quarter costs.", "uk": "Самостійно: зроби так, щоб підсумковий рядок рахував кожен вид (дороги, перехрестя, будівлі, орієнтир) цілочисельною змінною на кожен вид, і друкуй його одним реченням, наприклад 'Town seed 1: 12 roads, 9 junctions, 54 buildings, 1 landmark'. Запиши ці кількості та stat unit із закладки 120 м у town_notes.md поруч із кількостями інстансів і draw call твого вуличного кварталу з Дня 70. Перевірка: числа збігаються з тим, що ти рахуєш у пошуку Outliner, і ти можеш сказати, скільком кварталам із Дня 70 дорівнює вартість цього кварталу."}, "lesson": 4}, {"text": {"en": "On your own: lay your BP_Promenade (Day 65) along the shore south of the quarter, from one end of the southern road to the other, and Regenerate. Check: from 60 m the promenade, the road and the first row of buildings read as one waterfront, with nothing overlapping.", "uk": "Самостійно: поклади свій BP_Promenade (День 65) уздовж берега на південь від кварталу, від одного кінця південної дороги до іншого, і Regenerate. Перевірка: із 60 м променад, дорога й перший ряд будівель читаються як одна набережна, нічого не перекривається."}, "lesson": 2}, {"text": {"en": "On your own: tidy the tool: every variable in Category Town, Layout or Rules with a tooltip and a unit; Seed with a Slider Range of 1 to 9999; the Regenerate and Clear events described in a comment box. Check: someone new can use the Details panel without opening the Blueprint.", "uk": "Самостійно: упорядкуй інструмент: кожна змінна в Category Town, Layout або Rules з підказкою й одиницею; Seed зі Slider Range від 1 до 9999; події Regenerate і Clear описано в рамці коментаря. Перевірка: новачок може користуватися панеллю Details, не відкриваючи Blueprint."}, "lesson": 4}, {"text": {"en": "Take town_120m_day89.png, town_street_day89.png (2 m up a street) and regenerate_graph_day89.png (the Regenerate event and its functions, node names readable). Check: three pictures in today's Work folder.", "uk": "Зроби town_120m_day89.png, town_street_day89.png (2 м угору вулицею) і regenerate_graph_day89.png (подія Regenerate та її функції, назви вузлів читаються). Перевірка: три зображення в папці Work за сьогодні."}, "lesson": 1}, {"text": {"en": "Record clip_day89.mp4 (60 seconds): click Clear, then Regenerate, then change the seed and Regenerate, then fly down a street. Check: the clip is in today's Work folder.", "uk": "Запиши clip_day89.mp4 (60 секунд): клацни Clear, потім Regenerate, потім зміни зерно й Regenerate, потім прольоти вулицею. Перевірка: кліп лежить у папці Work за сьогодні."}, "lesson": 4}, {"text": {"en": "Click Copy the day report, paste it into a new tutor chat, answer its questions and save its answer as summary.md. Check: summary.md is in today's Work folder with Made, To look at, Hours and To revisit filled in.", "uk": "Клацни Copy the day report (скопіювати звіт дня), встав у новий чат із тьютором, дай відповіді на його запитання й збережи його відповідь як summary.md. Перевірка: summary.md лежить у папці Work за сьогодні, а Made, To look at, Hours і To revisit заповнені."}, "lesson": 1}], "assets": ["techart/code-style.md", "techart/tool-review-checklist.md"]}, "lessons": [{"title": {"en": "Editor buttons: Call In Editor, Spawn Actor and a clean slate", "uk": "Кнопки редактора: Call In Editor, Spawn Actor і чистий аркуш"}, "minutes": 40, "goals": [{"en": "Make editor buttons as on Day 64: custom events with Call In Editor ticked, which appear in the Details panel.", "uk": "Зроби кнопки редактора, як на Дні 64: власні події з позначеним Call In Editor, які з'являються на панелі Details."}, {"en": "Spawn actors with Spawn Actor from Class, passing values through Expose on Spawn, and keep every spawned actor in an array so the tool can remove exactly what it made.", "uk": "Створюй акторів через Spawn Actor from Class, передаючи значення через Expose on Spawn, і тримай кожного створеного актора в масиві, щоб інструмент міг прибрати рівно те, що зробив."}, {"en": "Keep the preview out of the way: no collision on preview boxes, and a Show Preview switch.", "uk": "Тримай попередній перегляд осторонь: без колізії на коробках попереднього перегляду та з перемикачем Show Preview."}], "doalong": [{"en": "Save L_Day88 as L_Day89 in Content/Tools/Day89. Open BP_TownGenerator, select each Preview component and set Collision Presets to NoCollision. Add Show Preview (Boolean, default true, Instance Editable) and at the start of the Construction Script set each Preview component's visibility from it (Set Visibility). Compile. You see the preview hide and show with the tick box.", "uk": "Збережи L_Day88 як L_Day89 у Content/Tools/Day89. Відкрий BP_TownGenerator, виділи кожен компонент Preview і постав Collision Presets на NoCollision. Додай Show Preview (Boolean, за замовчуванням true, Instance Editable) і на початку Construction Script задай видимість кожного компонента Preview з нього (Set Visibility). Compile. Ти бачиш, як попередній перегляд ховається й показується з позначкою."}, {"en": "In the Construction Script select every node after the Show Preview visibility nodes (the stream, the checks, the loops), right-click > Collapse to Function and name it Build Plan. Compile. You see the Construction Script reduced to one Build Plan call and the same preview as before. Now any event can rebuild the plan too.", "uk": "У Construction Script виділи кожен вузол після вузлів видимості Show Preview (потік, перевірки, цикли), клацни правою > Collapse to Function і назви її Build Plan. Compile. Ти бачиш Construction Script, зведений до одного виклику Build Plan, і той самий попередній перегляд, що й раніше. Тепер будь-яка подія теж може перебудувати план."}, {"en": "In the Event Graph right-click and add Custom Event; name it Regenerate and tick Call In Editor in its Details, and call Build Plan from it first. Add a second event, Clear, the same way. Compile and select the placed generator. You see two buttons, Regenerate and Clear, in its Details panel.", "uk": "В Event Graph клацни правою й додай Custom Event; назви його Regenerate і познач Call In Editor у його Details, і першим виклич із нього Build Plan. Так само додай другу подію, Clear. Compile і виділи розміщений генератор. Ти бачиш дві кнопки, Regenerate і Clear, на його панелі Details."}, {"en": "Add Spawned (Actor, Array). Make a function Clear Town: For Each Loop over Spawned > Is Valid > Destroy Actor; when the loop completes, Clear the array. Connect the Clear event to Clear Town. You see a function that removes only what the tool made, never your own actors.", "uk": "Додай Spawned (Actor, Array). Зроби функцію Clear Town: For Each Loop по Spawned > Is Valid > Destroy Actor; коли цикл завершено, Clear масиву. З'єднай подію Clear з Clear Town. Ти бачиш функцію, що прибирає лише те, що зробив інструмент, ніколи твоїх власних акторів."}, {"en": "Open BP_Building and check that Style, Bays, Floors, Seed and Has Shop are still ticked Expose on Spawn (Day 69). In BP_TownGenerator add a Spawn Actor from Class with Class BP_Building. You see the five pins on the node; delete this test node.", "uk": "Відкрий BP_Building і перевір, що Style, Bays, Floors, Seed і Has Shop і далі з позначеним Expose on Spawn (День 69). У BP_TownGenerator додай Spawn Actor from Class із Class BP_Building. Ти бачиш п'ять пінів на вузлі; видали цей тестовий вузол."}], "play": {"en": "Button or script? The tutor names five jobs (rebuild the preview when I move the generator; build 60 buildings; remove the last town; count the plots; dress the streets). For each I say whether it belongs in the Construction Script, on the Regenerate button or on Clear, and why.", "uk": "Кнопка чи скрипт? Тьютор називає п'ять робіт (перебудувати попередній перегляд, коли я рухаю генератор; побудувати 60 будівель; прибрати останнє місто; порахувати ділянки; оформити вулиці). Для кожної скажи, чи належить вона до Construction Script, до кнопки Regenerate чи до Clear, і чому."}, "video": {"search": "unreal engine 5 call in editor button spawn actor from class expose on spawn"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Editor buttons: Call In Editor, Spawn Actor and a clean slate (Day 89, lesson 1 of 4).\nToday's build: BP_TownGenerator v1: Regenerate and Clear buttons that build and remove a complete 200 x 200 m quarter from the plan, with buildings traced onto the ground, seeded styles and the street dresser run at the end.\n\nBy the end of this lesson I can:\n1. Make editor buttons as on Day 64: custom events with Call In Editor ticked, which appear in the Details panel.\n2. Spawn actors with Spawn Actor from Class, passing values through Expose on Spawn, and keep every spawned actor in an array so the tool can remove exactly what it made.\n3. Keep the preview out of the way: no collision on preview boxes, and a Show Preview switch.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (You have BP_Road, BP_Junction, the PCG street dresser, and BP_TownGenerator's live plan following DA_TownRules.), what I will learn today (You give the generator its Regenerate button: a whole town quarter built from the plan, grounded, dressed and repeatable from one seed.), encourage me (Today the parts of three weeks click together; when the first full quarter appears, take a moment to fly it before you fix anything.), and share today's quote: \"Plan to throw one away; you will, anyhow.\" (Fred Brooks).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 86: Why does BP_Road use Round(length / Piece Length) and then share the length equally? | Day 82: Which import settings let PCG read T_Mask_Shops?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Button or script? The tutor names five jobs (rebuild the preview when I move the generator; build 60 buildings; remove the last town; count the plots; dress the streets). For each I say whether it belongs in the Construction Script, on the Regenerate button or on Clear, and why.\n6. Do-along on today's build (Regenerate: roads, junctions, buildings, landmark and dressing (built step by step in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Save L_Day88 as L_Day89 in Content/Tools/Day89. Open BP_TownGenerator, select each Preview component and set Collision Presets to NoCollision. Add Show Preview (Boolean, default true, Instance Editable) and at the start of the Construction Script set each Preview component's visibility from it (Set Visibility). Compile. You see the preview hide and show with the tick box.\n   - In the Construction Script select every node after the Show Preview visibility nodes (the stream, the checks, the loops), right-click > Collapse to Function and name it Build Plan. Compile. You see the Construction Script reduced to one Build Plan call and the same preview as before. Now any event can rebuild the plan too.\n   - In the Event Graph right-click and add Custom Event; name it Regenerate and tick Call In Editor in its Details, and call Build Plan from it first. Add a second event, Clear, the same way. Compile and select the placed generator. You see two buttons, Regenerate and Clear, in its Details panel.\n   - Add Spawned (Actor, Array). Make a function Clear Town: For Each Loop over Spawned > Is Valid > Destroy Actor; when the loop completes, Clear the array. Connect the Clear event to Clear Town. You see a function that removes only what the tool made, never your own actors.\n   - Open BP_Building and check that Style, Bays, Floors, Seed and Has Shop are still ticked Expose on Spawn (Day 69). In BP_TownGenerator add a Spawn Actor from Class with Class BP_Building. You see the five pins on the node; delete this test node.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Roads and junctions from the layout", "uk": "Дороги й перехрестя з планування"}, "minutes": 40, "goals": [{"en": "Turn the layout into road segments between junctions: one BP_Road from one junction's edge to the next, its length passed in Length Override.", "uk": "Перетвори планування на сегменти доріг між перехрестями: один BP_Road від краю одного перехрестя до наступного, його довжину передано в Length Override."}, {"en": "Turn each segment's direction into a rotation: 0 degrees along X, 90 along Y.", "uk": "Перетвори напрямок кожного сегмента на обертання: 0 градусів уздовж X, 90 уздовж Y."}, {"en": "Spawn a BP_Junction at every crossing, track everything in Spawned, and keep street props back from junctio oving them all.\n   - Junction corners: open BP_Junction, add two Spline components and drag their end points so one runs along X and one along Y, each from about -10 m to 10 m through the centre; in Class Defaults add two actor tags, KeepOutWide and KeepOutJunction. PCG_KeepOuts reads the first and now clears lamps and trees about 11 m back from every corner, the junction rule in street-dimensions.md; in lesson 4 the second clears benches, bins and bollards from the junction mouths. You see two crossed spline lines on the junction; the dresser uses them in lesson 4.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Buildings on the ground, and a planned mistake", "uk": "Будівлі на землі та запланована помилка"}, "minutes": 40, "goals": [{"en": "Find the ground under each plot with Line Trace By Channel, so nothing floats or sinks on uneven ground.", "uk": "Знайди землю під кожною ділянкою через Line Trace By Channel, щоб нічого не висіло й не тонуло на нерівній землі."}, {"en": "Spawn BP_Building with the plot's Yaw, Floors and Bays, a seeded style and a seed of its own.", "uk": "Створи BP_Building з Yaw, Floors і Bays ділянки, стилем із зерна й власним зерном."}, {"en": "Find and fix a repeatability bug with the ha ding, кінець фасаду з меншим X (праворуч від тебе, коли стоїш обличчям до будинку з вулиці), із Z із Hit Location; Rotation (0, 0, Yaw); Bays і Floors з ділянки; Has Shop = Is Shop ділянки; Seed = Seed x 1000 + Array Index; Style із Select, що вибирає Rules > Sea Style, коли Sea Distance менша за Sea Style Distance, інакше Style рядка з Pick Street Mix. Add до Spawned, виклич це з Regenerate і клацни Regenerate. Ти бачиш будинок на кожній ділянці, що стоїть на землі, фасадами на лініях відступу."}, {"en": "Planned mistake: take a screenshot from a 120 m bookmark, click Regenerate again with the same seed and take another. You see different styles in the two pictures, though the seed is the same. In Pick Street Mix add a Print String showing each row name it draws from the Bag, and Regenerate twice. You see the first names differ between the two runs: Random Integer in Range ignores your seed.", "uk": "Запланована помилка: зроби скриншот із закладки 120 м, клацни Regenerate ще раз із тим самим зерном і зроби ще один. Ти бачиш різні стилі на двох картинках, хоча зерно те саме. У Pick Street Mix додай Print String, що показує кожну назву рядка, яку він бере з Bag, і двічі Regenerate. Ти бачиш, що перші назви відрізняються між двома запусками: Random Integer in Range ігнорує твоє зерно."}, {"en": "Change one thing: in Regenerate, right after Build Plan, Make Random Stream from Seed and set a variable Build Stream; in Pick Street Mix replace Random Integer in Range with Random Integer in Range from Stream fed by Build Stream. Regenerate twice and compare. You see two identical pictures. Delete the Print String.", "uk": "Змін одну річ: у Regenerate, одразу після Build Plan, зроби Make Random Stream із Seed і задай змінну Build Stream; у Pick Street Mix заміни Random Integer in Range на Random Integer in Range from Stream, якому подано Build Stream. Двічі Regenerate і порівняй. Ти бачиш дві однакові картинки. Видали Print String."}], "play": {"en": "Repeatable or not: the

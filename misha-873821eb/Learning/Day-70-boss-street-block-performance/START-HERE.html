<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 70</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

.sw{display:inline-flex;align-items:center;gap:12px;border:0;background:transparent;cursor:pointer;font:600 14px/1 var(--head);color:var(--muted);min-height:50px;padding:0 6px}

.check input::after{content:"";width:10px;height:5px;border:solid #fff;border-width:0 0 2.2px 2.2px;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.check input:checked{background:linear-gradient(145deg,#5fe39a,#16a34a);box-shadow:0 0 12px rgba(74,222,128,.55)}

воїй ділянці, доказ і розбір, самостійно"}, "steps": [{"text": {"en": "Start the clock. Write your plan with times in boss_day70.md, and take before_day70.png of your plot from a bookmark 60 m up. Check: the plan fits in 4 hours and the picture is saved.", "uk": "Запусти годинник. Напиши свій план із часом у boss_day70.md і зроби before_day70.png своєї ділянки із закладки на висоті 60 м. Перевірка: план вкладається в 4 години, а картинку збережено."}, "lesson": 1}, {"text": {"en": "Choose the plot: measure it with the Top view (middle-mouse drag), set Plot Width and Plot Depth, and place BP_StreetBlock so its front edge runs along the street line. Check: the plot outline sits clear of the road and the promenade.", "uk": "Обери ділянку: виміряй її у вигляді Top (перетягування середньою кнопкою миші), задай Plot Width і Plot Depth і розмісти BP_StreetBlock так, щоб його передній край ішов уздовж лінії вулиці. Перевірка: контур ділянки лежить осторонь дороги й набережної."}, "lesson": 1}, {"text": {"en": "Grounding: if the ground under the plot slopes, flatten a level shelf (Landscape > Flatten), or move the block to flatter ground. Check: from 5 m no house floats or sinks more than a few centimetres.", "uk": "Заземлення: якщо земля під ділянкою має схил, вирівняй рівний майданчик (Landscape > Flatten) або пересунь квартал на рівнішу землю. Перевірка: з 5 м жоден будинок не висить і не занурюється більш ніж на кілька сантиметрів."}, "lesson": 1}, {"text": {"en": "Save, then Generate with three Seeds; take a 60 m picture of each and put them side by side as block_seeds_day70.png. Keep the best Seed and write why in boss_day70.md. Check: three pictures and one reason.", "uk": "Збережи, потім зроби Generate з трьома Seed; зніми кожен з 60 м і склади їх поруч як block_seeds_day70.png. Залиш найкращий Seed і напиши в boss_day70.md, чому. Перевірка: три картинки й одна причина."}, "lesson": 1}, {"text": {"en": "Add the Count button to BP_StreetBlock and click it. Check: the Output Log shows the number of houses and the total instances.", "uk": "Додай кнопку Count до BP_StreetBlock і натисни її. Перевірка: Output Log показує кількість будинків і загальну кількість інстансів."}, "lesson": 2}, {"text": {"en": "Before numbers: pilot your locked camera C1 (60 m), type stat unit and stat RHI in the console, and fill the Before row of perf_day70.md (Houses, Instances, Draw calls, Frame ms, GPU ms). Check: five numbers in the Before row.", "uk": "Числа до: увійди в свою зафіксовану камеру C1 (60 м), введи в консоль stat unit і stat RHI та заповни рядок Before у perf_day70.md (Houses, Instances, Draw calls, Frame ms, GPU ms). Перевірка: п'ять чисел у рядку Before."}, "lesson": 2}, {"text": {"en": "Pack: save the level, select all the block's houses in the Outliner, right-click > Level > Create Packed Level Actor, keep the default Pivot Type and save the new assets in Content/Tools/Day70. Check: one packed actor stands where the houses were, and from C1 the block looks the same.", "uk": "Пакування: збережи рівень, вибери в Outliner усі будинки кварталу, клацни правою кнопкою > Level > Create Packed Level Actor, залиш Pivot Type за замовчуванням і збережи нові асети в Content/Tools/Day70. Перевірка: один упакований актор стоїть там, де були будинки, а з C1 квартал виглядає так само."}, "lesson": 3}, {"text": {"en": "After numbers from the same camera: fill the After row (Houses = 1 actor; Instances unchanged; read Draw calls, Frame and GPU again) and write one line on what changed and why. Check: both rows full and one line of explanation.", "uk": "Числа після з тієї самої камери: заповни рядок After (Houses = 1 актор; Instances без змін; знову прочитай Draw calls, Frame і GPU) і напиши один рядок про те, що змінилося й чому. Перевірка: обидва рядки заповнені й один рядок пояснення."}, "lesson": 3}, {"text": {"en": "Do not click Generate on this block again: it would build a second set on top of the packed one. Keep an unpacked BP_StreetBlock for later work in a practice level L_Day70 (Content/Tools/Day70, File > New Level > Basic). Check: the island's Outliner shows the packed block and no loose houses.", "uk": "Не натискай Generate на цьому кварталі знову: він збудував би другий набір поверх упакованого. Лиши неупакований BP_StreetBlock для подальшої роботи на тренувальному рівні L_Day70 (Content/Tools/Day70, File > New Level > Basic). Перевірка: Outliner острова показує упакований квартал і жодного вільного будинку."}, "lesson": 3}, {"text": {"en": "Shots: three locked Cine Cameras S1 (2 m, street level), S2 (30 m) and S3 (60 m), HighResShot 1920x1080 from each, and stat unit at S3 into boss_day70.md. Check: block_S1.png to block_S3.png are saved and Frame at S3 is written down.", "uk": "Кадри: три зафіксовані Cine Camera S1 (2 м, рівень вулиці), S2 (30 м) і S3 (60 м), HighResShot 1920x1080 з кожної, і stat unit у S3 у boss_day70.md. Перевірка: block_S1.png — block_S3.png збережено, а Frame у S3 записано."}, "lesson": 1}, {"text": {"en": "Record flythrough_day70.mp4: 60 seconds along the street and the promenade in Play or in the editor. Check: the clip is saved and shows both.", "uk": "Запиши flythrough_day70.mp4: 60 секунд уздовж вулиці й набережної в Play або в редакторі. Перевірка: кліп збережено, і він показує обидві."}, "lesson": 1}, {"text": {"en": "Self-review: score the five-line rubric (fits the plot, reads as one street from 60 m, grounding, numbers and explanation, graph tidiness), go through tool-review-checklist.md, ask the tutor for three see-why-fix notes, and choose your tier. Check: self_review_day70.md has five scores, three notes and your tier.", "uk": "Самоперевірка: оціни п'ять рядків рубрики (вписується в ділянку, читається як одна вулиця з 60 м, заземлення, числа й пояснення, охайність графа), пройди tool-review-checklist.md, попроси в тьютора три нотатки «бачу, чому, як виправити» й обери свій рівень. Перевірка: self_review_day70.md має п'ять оцінок, три нотатки й твій рівень."}, "lesson": 4}, {"text": {"en": "Click Copy the day report, paste it into a new tutor chat, answer its questions and save its answer as summary.md. Check: summary.md is in today's Work folder with Made, To look at, Hours and To revisit filled in.", "uk": "Натисни Copy the day report, встав його в новий чат із тьютором, дай відповіді на його запитання й збережи його відповідь як summary.md. Перевірка: summary.md лежить у сьогоднішній папці Work із заповненими Made, To look at, Hours і To revisit."}, "lesson": 4}], "boss": [{"en": "Bronze: a street block from DT_StreetMix fills both long sides of a plot by your waterfront with nothing floating, it is packed into a Packed Level Actor, perf_day70.md holds the before and after counts, and you have three shots and a 60-second flight, inside 4 hours.", "uk": "Бронза: квартал вулиці з DT_StreetMix заповнює обидва довгі боки ділянки біля твоєї набережної, ніщо не висить, він упакований у Packed Level Actor, perf_day70.md містить кількості до й після, і ти маєш три кадри та 60-секундний проліт, у межах 4 годин."}, {"en": "Silver: three seeds compared from 60 m and the best kept with a written reason; the block lines its street and meets your promenade without overlap; Frame stays under 16.6 ms at the widest shot; and every number in perf_day70.md is explained in one line.", "uk": "Срібло: три зерна порівняно з 60 м, а найкраще збережене із записаною причиною; квартал вишикувано вздовж його вулиці, і він сходиться з твоєю набережною без перекриття; Frame лишається менше за 16.6 мс на найширшому кадрі; і кожне число в perf_day70.md пояснено одним рядком."}, {"en": "Gold: add a fourth row to DT_StreetMix.csv with a new DA_Style_* (from your kit or a free, credited Fab pack), Reimport, and generate a second block that uses it without changing any Blueprint; finish inside 3 hours.", "uk": "Золото: додай четвертий рядок до DT_StreetMix.csv із новим DA_Style_* (з твого набору або безкоштовного пака з Fab із зазначенням авторства), зроби Reimport і згенеруй другий квартал, що його використовує, не змінюючи жодного Blueprint; закінчи в межах 3 годин."}], "assets": ["techart/tool-review-checklist.md"]}, "lessons": [{"title": {"en": "Boss briefing: plot, seeds and proof (micro-lesson)", "uk": "Брифінг боса: ділянка, зерна й доказ (мікроурок)"}, "minutes": 40, "goals": [{"en": "Plan a timed build: the plot and grounding first, then generation and numbers, the proof last.", "uk": "Сплануй виконання на час: спершу ділянка й заземлення, потім генерація й числа, доказ останнім."}, {"en": "Choose a plot that a street block can fill: two long sides on streets, flat ground, clear of roads, water and the promenade.", "uk": "Обери ділянку, яку може заповнити квартал вулиці: два довгі боки на вулицях, рівна земля, осторонь доріг, води й набережної."}, {"en": "Plan the proof: three locked shots (2 m, 30 m, 60 m), stat unit at the widest shot and a 60-second flight.", "uk": "Сплануй доказ: три зафіксовані кадри (2 м, 30 м, 60 м), stat unit на найширшому кадрі й 60-секундний проліт."}], "doalong": [{"en": "Open boss_day70.md and copy in the build steps as a checklist. You see 13 lines.", "uk": "Відкрий boss_day70.md і скопіюй туди кроки побудови як контрольний список. Ти бачиш 13 рядків."}, {"en": "Give each line a time; the total must be under 4 hours. You see your plan with times.", "uk": "Дай кожному рядку час; загальна сума має бути менше 4 годин. Ти бачиш свій план із часом."}, {"en": "On your island map (or in the Top view) mark the plot's corners and the two streets it faces; write its width and depth in metres. You see a plot that fits whole houses (a multiple of 2 m is ideal).", "uk": "На мапі свого острова (або у вигляді Top) познач кути ділянки й дві вулиці, до яких вона виходить; запиши її ширину й глибину в метрах. Ти бачиш ділянку, що вміщує цілі будинки (ідеально кратна 2 м)."}, {"en": "Place four locked Cine Cameras: C1 at 60 m for the numbers, and S1 (2 m), S2 (30 m) and S3 (60 m) for the shots (right-click > Transform > Lock Actor Movement). You see four locked cameras.", "uk": "Розмісти чотири зафіксовані Cine Camera: C1 на 60 м для чисел і S1 (2 м), S2 (30 м) та S3 (60 м) для кадрів (клацни правою кнопкою > Transform > Lock Actor Movement). Ти бачиш чотири зафіксовані камери."}], "play": {"en": "Producer: the tutor plays a studio producer; I defend my plan line by line, and it cuts the weakest line each round.", "uk": "Продюсер: тьютор грає студійного продюсера; я захищаю свій план рядок за рядком, а він щоразу викреслює найслабший рядок."}, "video": {"search": "procedural city block generator unreal engine"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Boss briefing: plot, seeds and proof (micro-lesson) (Day 70, lesson 1 of 4).\nToday's build: A street block on your island (or a 40 x 24 m practice plot beside your promenade), generated from DT_StreetMix with a chosen seed, packed into a Packed Level Actor, and perf_day70.md with counts before and after.\n\nBy the end of this lesson I can:\n1. Plan a timed build: the plot and grounding first, then generation and numbers, the proof last.\n2. Choose a plot that a street block can fill: two long sides on streets, flat ground, clear of roads, water and the promenade.\n3. Plan the proof: three locked shots (2 m, 30 m, 60 m), stat unit at the widest shot and a 60-second flight.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (This week you made PDA_BuildingStyle and three DA_Style_* styles, BP_Building with seeded variation, DT_StreetMix and BP_StreetBlock.), what I will learn today (It is Boss day: a generated street block on your island, packed, counted and proved.), encourage me (Numbers are your friends today: write them down before and after, and let them tell the story of your tool.), and share today's quote: \"The first principle is that you must not fool yourself—and you are the easiest person to fool.\" (Richard Feynman).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 67: Floors 3 and Bays 5: how many times does Add Facade's inner loop body run on the front? | Day 65: what does Transform Location do in BP_Promenade?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Producer: the tutor plays a studio producer; I defend my plan line by line, and it cuts the weakest line each round.\n6. Do-along on today's build (Counting, measuring and packing (micro-lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Open boss_day70.md and copy in the build steps as a checklist. You see 13 lines.\n   - Give each line a time; the total must be under 4 hours. You see your plan with times.\n   - On your island map (or in the Top view) mark the plot's corners and the two streets it faces; write its width and depth in metres. You see a plot that fits whole houses (a multiple of 2 m is ideal).\n   - Place four locked Cine Cameras: C1 at 60 m for the numbers, and S1 (2 m), S2 (30 m) and S3 (60 m) for the shots (right-click > Transform > Lock Actor Movement). You see four locked cameras.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Counting what a generator makes (micro-lesson)", "uk": "Підрахунок того, що робить генератор (мікроурок)"}, "minutes": 40, "goals": [{"en": "Count houses and instances with a Count button: Get Components by Class and Get Instance Count.", "uk": "Порахуй будинки та інстанси кнопкою Count: Get Components by Class і Get Instance Count."}, {"en": "Read draw calls with stat RHI and frame cost with stat unit, always from the same locked camera.", "uk": "Читай draw calls через stat RHI, а вартість кадру через stat unit, завжди з тієї самої зафіксованої камери."}, {"en": "Explain why Nanite pieces add few draw calls while every other mesh in every instanced component adds some.", "uk": "Поясни, чому частини Nanite додають мало draw call, а кожна інша модель у кожному компоненті з інстансами додає якусь кількість."}], "doalong": [{"en": "In BP_StreetBlock add a Custom Event Count with Call In Editor ticked. Set an Integer Total to 0; For Each Loop over Spawned > Get Components by Class (Component Class Instanced Static Mesh Component) > For Each Loop > Get Instance Count, added to Total. From the outer loop's Completed, Print String the Length of Spawned and Total. You see a Count button.", "uk": "У BP_StreetBlock додай Custom Event Count із позначкою Call In Editor. Встанови Integer Total на 0; For Each Loop по Spawned > Get Components by Class (Component Class Instanced Static Mesh Component) > For Each Loop > Get Instance Count, додано до Total. Від Completed зовнішнього циклу виведи Length від Spawned і Total через Print String. Ти бачиш кнопку Count."}, {"en": "Click Count. You see two numbers, for example 14 houses and 820 instances.", "uk": "Натисни Count. Ти бачиш два числа, наприклад 14 будинків і 820 інстансів."}, {"en": "Pilot C1 (select it, then right-click > Pilot). Open the console with the backtick key and type stat unit, then stat RHI. You see Frame, Game, Draw and GPU in ms, and a list that includes DrawPrimitive calls. If stat RHI shows nothing, try stat SceneRendering and read Mesh draw calls.", "uk": "Увійди в C1 (вибери її, потім клацни правою кнопкою > Pilot). Відкрий консоль клавішею зворотного апострофа й введи stat unit, потім stat RHI. Ти бачиш Frame, Game, Draw і GPU в мс та список, що містить виклики DrawPrimitive. Якщо stat RHI нічого не показує, спробуй stat SceneRendering і прочитай Mesh draw calls."}, {"en": "Write the Before row in perf_day70.md: Houses, Instances, Draw calls, Frame ms and GPU ms. You see five numbers you can compare later.", "uk": "Запиши рядок Before у perf_day70.md: Houses, Instances, Draw calls, Frame ms і GPU ms. Ти бачиш п'ять чисел, які зможеш порівняти пізніше."}], "play": {"en": "Cost guess: before I count, I guess the instances (houses x bays x floors x about 3) and the draw calls; the tutor compares my guesses with my real numbers.", "uk": "Здогад вартості: перш ніж рахувати, я вгадую інстанси (будинки x секції x поверхи x приблизно 3) і draw calls; тьютор порівнює мої здогади з моїми справжніми числами."}, "video": {"search": "unreal engine 5 stat rhi draw calls stat unit explained"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Counting what a generator makes (micro-lesson) (Day 70, lesson 2 of 4).\nToday's build: A street block on your island (or a 40 x 24 m practice plot beside your promenade), generated from DT_StreetMix with a chosen seed, packed into a Packed Level Actor, and perf_day70.md with counts before and after.\nEarlier today I already did: lesson 1 (Boss briefing: plot, seeds and proof (micro-lesson)). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Count houses and instances with a Count button: Get Components by Class and Get Instance Count.\n2. Read draw calls with stat RHI and frame cost with stat unit, always from the same locked camera.\n3. Explain why Nanite pieces add few draw calls while every other mesh in every instanced component adds some.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Cost guess: before I count, I guess the instances (houses x bays x floors x about 3) and the draw calls; the tutor compares my guesses with my real numbers.\n4. Do-along on today's build (Counting, measuring and packing (micro-lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - In BP_StreetBlock add a Custom Event Count with Call In Editor ticked. Set an Integer Total to 0; For Each Loop over Spawned > Get Components by Class (Component Class Instanced Static Mesh Component) > For Each Loop > Get Instance Count, added to Total. From the outer loop's Completed, Print String the Length of Spawned and Total. You see a Count button.\n   - Click Count. You see two numbers, for example 14 houses and 820 instances.\n   - Pilot C1 (select it, then right-click > Pilot). Open the console with the backtick key and type stat unit, then stat RHI. You see Frame, Game, Draw and GPU in ms, and a list that includes DrawPrimitive calls. If stat RHI shows nothing, try stat SceneRendering and read Mesh draw calls.\n   - Write the Before row in perf_day70.md: Houses, Instances, Draw calls, Frame ms and GPU ms. You see five numbers you can compare later.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {" є."}}, {"q": {"en": "What does Create Packed Level Actor do to your generated houses?", "uk": "Що робить Create Packed Level Actor із твоїми згенерованими будинками?"}, "options": [{"en": "Deletes their instances", "uk": "Видаляє їхні інстанси"}, {"en": "Turns them into PCG points", "uk": "Перетворює їх на точки PCG"}, {"en": "Gathers them into one actor with one instanced component per mesh", "uk": "Збирає їх в одного актора з одним компонентом інстансів на кожну модель"}, {"en": "Bakes their lighting", "uk": "Запікає їхнє освітлення"}], "answer": 2, "explain": {"en": "Packing merges many actors and components into one, which cuts per-actor and per-component cost.", "uk": "Пакування зливає багатьох акторів і компонентів в одного, що зменшує вартість на актора й на компонент."}}, {"q": {"en": "You want to prove that packing cut the draw calls. Which console command do you read from the same camera before and after?", "uk": "Ти хочеш довести, що пакування зменшило draw calls. Яку консольну команду ти читаєш з тієї самої камери до й після?"}, "options": [{"en": "stat unit", "uk": "stat unit"}, {"en": "stat RHI", "uk": "stat RHI"}, {"en": "stat fps", "uk": "stat fps"}], "answer": 1, "explain": {"en": "stat RHI lists draw calls and triangles; stat unit shows the frame time split into Game, Draw and GPU.", "uk": "stat RHI перелічує draw calls і трикутники; stat unit показує час кадру, розділений на Game, Draw і GPU."}}, {"q": {"en": "After packing, you click Generate on the same block and a second set of houses appears on top of the packed one. Why?", "uk": "Після пакування ти натискаєш Generate на тому самому кварталі, і другий набір будинків з'являється поверх упакованого. Чому?"}, "options": [{"en": "The packed actor broke the Data Table", "uk": "Упакований актор зламав Data Table"}, {"en": "The Seed changed", "uk": "Seed змінився"}, {"en": "Packing replaced the houses in Spawned, so Generate builds a new set; pack only finished blocks", "uk": "Пакування замінило будинки у Spawned, тож Generate будує новий набір; пакуй лише готові квартали"}, {"en": "Instances cannot be packed twice", "uk": "Інстанси не можна пакувати двічі"}], "answer": 2, "explain": {"en": "The packed actor is no longer in Spawned; Generate always builds a fresh set. Keep generating in an unpacked copy.", "uk": "Упакованого актора більше немає у Spawned; Generate завжди будує свіжий набір. Продовжуй генерувати в неупакованій копії."}}], "weekInfo": null, "morning": {"sofar": {"en": "This week you made PDA_BuildingStyle and three DA_Style_* styles, BP_Building with seeded variation, DT_StreetMix and BP_StreetBlock.", "uk": "Цього тижня зроблено PDA_BuildingStyle і три стилі DA_Style_*, BP_Building із варіаціями із зерном, DT_StreetMix і BP_StreetBlock."}, "today": {"en": "It is Boss day: a generated street block on your island, packed, counted and proved.", "uk": "Це День боса: згенерований квартал вулиці на твоєму острові, упакований, підрахований і підтверджений."}, "cheer": {"en": "Numbers are your friends today: write them down before and after, and let them tell the story of your tool.", "uk": "Числа сьогодні — твої друзі: записуй їх до й після й дозволь їм розказати історію твого інструмента."}, "quote": {"text": {"en": "The first principle is that you must not fool yourself—and you are the easiest person to fool.", "uk": "Перший принцип: ти не повинен обманювати себе, а себе обдурити найлегше."}, "author": {"en": "Richard Feynman", "uk": "Річард Фейнман"}, "source": "Cargo Cult Science, Caltech commencement address, 1974"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-70-boss-street-block-performance", "mapHref": "../../COURSE.html", "prevHref": "../Day-69-data-table-street-block/START-HERE.html", "nextHref": "../Day-71-python-from-zero-unreal/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me: when my Blueprint or script fails, ask for the error message or a screenshot of the graph, point to the line or node that is wrong and explain why, then let me fix it myself. Never write the whole tool for me. Keep me moving and make it feel like a game.\n\nToday I build on my own: The block on your plot, the proof and the review, on your own.\nIt's part of: A street block on your island (or a 40 x 24 m practice plot beside your promenade), generated from DT_StreetMix with a chosen seed, packed into a Packed Level Actor, and perf_day70.md with counts before and after (A plot in your island's district, beside your promenade if you can, or Content/Tools/Day70/L_Day70 with a 40 x 24 m plot.).\n\nSpec:\n- One BP_StreetBlock on a real plot, both rows filled, three seeds compared from 60 m and the best one kept, with the reason in boss_day70.md.\n- A Count button (a Custom Event with Call In Editor) in BP_StreetBlock that prints the number of houses and the total instances (Get Components by Class (Instanced Static Mesh Component) > Get Instance Count, summed).\n- perf_day70.md: a before and after table of Houses (actors), Instances, Draw calls (stat RHI) and Frame and GPU ms (stat unit), all read from one locked camera.\n- The houses packed with right-click > Level > Create Packed Level Actor, its assets saved in Content/Tools/Day70; the packed block looks the same as before.\n- Three locked shots (2 m street level, 30 m and 60 m), HighResShot 1920x1080 from each, and a 60-second flight along the street and the promenade.\n- Frame under 16.6 ms at the widest shot; nothing floating and no house on the road or the promenade.\n\nMy checklist:\n1. Start the clock. Write your plan with times in boss_day70.md, and take before_day70.png of your plot from a bookmark 60 m up. Check: the plan fits in 4 hours and the picture is saved. (from lesson 1)\n2. Choose the plot: measure it with the Top view (middle-mouse drag), set Plot Width and Plot Depth, and place BP_StreetBlock so its front edge runs along the street line. Check: the plot outline sits clear of the road and the promenade. (from lesson 1)\n3. Grounding: if the ground under the plot slopes, flatten a level shelf (Landscape > Flatten), or move the block to flatter ground. Check: from 5 m no house floats or sinks more than a few centimetres. (from lesson 1)\n4. Save, then Generate with three Seeds; take a 60 m picture of each and put them side by side as block_seeds_day70.png. Keep the best Seed and write why in boss_day70.md. Check: three pictures and one reason. (from lesson 1)\n5. Add the Count button to BP_StreetBlock and click it. Check: the Output Log shows the number of houses and the total instances. (from lesson 2)\n6. Before numbers: pilot your locked camera C1 (60 m), type stat unit and stat RHI in the console, and fill the Before row of perf_day70.md (Houses, Instances, Draw calls, Frame ms, GPU ms). Check: five numbers in the Before row. (from lesson 2)\n7. Pack: save the level, select all the block's houses in the Outliner, right-click > Level > Create Packed Level Actor, keep the default Pivot Type and save the new assets in Content/Tools/Day70. Check: one packed actor stands where the houses were, and from C1 the block looks the same. (from lesson 3)\n8. After numbers from the same camera: fill the After row (Houses = 1 actor; Instances unchanged; read Draw calls, Frame and GPU again) and write one line on what changed and why. Check: both rows full and one line of explanation. (from lesson 3)\n9. Do not click Generate on this block again: it would build a second set on top of the packed one. Keep an unpacked BP_StreetBlock for later work in a practice level L_Day70 (Content/Tools/Day70, File > New Level > Basic). Check: the island's Outliner shows the packed block and no loose houses. (from lesson 3)\n10. Shots: three locked Cine Cameras S1 (2 m, street level), S2 (30 m) and S3 (60 m), HighResShot 1920x1080 from each, and stat unit at S3 into boss_day70.md. Check: block_S1.png to block_S3.png are saved and Frame at S3 is written down. (from lesson 1)\n11. Record flythrough_day70.mp4: 60 seconds along the street and the promenade in Play or in the editor. Check: the clip is saved and shows both. (from lesson 1)\n12. Self-review: score the five-line rubric (fits the plot, reads as one street from 60 m, grounding, numbers and explanation, graph tidiness), go through tool-review-checklist.md, ask the tutor for three see-why-fix notes, and choose your tier. Check: self_review_day70.md has five scores, three notes and your tier. (from lesson 4)\n13. Click Copy the day report, paste it into a new tutor chat, answer its questions and save its answer as summary.md. Check: summary.md is in today's Work folder with Made, To look at, Hours and To revisit filled in. (from lesson 4)\n\nToday is a BOSS build: help me keep time against the tiers below. Tiers:\n- Bronze: a street block from DT_StreetMix fills both long sides of a plot by your waterfront with nothing floating, it is packed into a Packed Level Actor, perf_day70.md holds the before and after counts, and you have three shots and a 60-second flight, inside 4 hours.\n- Silver: three seeds compared from 60 m and the best kept with a written reason; the block lines its street and meets your promenade without overlap; Frame stays under 16.6 ms at the widest shot; and every number in perf_day70.md is explained in one line.\n- Gold: add a fourth row to DT_StreetMix.csv with a new DA_Style_* (from your kit or a free, credited Fab pack), Reimport, and generate a second block that uses it without changing any Blueprint; finish inside 3 hours.\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me and tell me which tier I reached.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Misha\nDay 70: Boss: a generated street block, packed and counted. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; boss tier: <bronze / silver / gold / none>; quiz: <score> of 8\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

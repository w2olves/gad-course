<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 5</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

applied and triangles within budget.", "uk": "Усі чотири пропси у FBX з колізією UCX: SM_Bollard, SM_Bench, SM_LampPost і SM_Bin. Кожен у реальному розмірі, з origin у центрі основи, застосованими трансформаціями й трикутниками в межах бюджету."}, {"en": "Simple materials from the photos on each prop (Base Color, Roughness and Metallic), named with M_, for example M_Bench_Iron and M_Bench_Timber.", "uk": "На кожному пропсі прості матеріали за фото (Base Color, Roughness і Metallic) з назвами на M_, наприклад M_Bench_Iron і M_Bench_Timber."}, {"en": "In Unreal (Course/Day05): all four on the floor beside the mannequin, nothing floating or sunk, placed like a real street corner: three bollards about 1.5 m apart in a line, the bench behind them facing out, the bin beside the bench and the lamp post behind.", "uk": "В Unreal (Course/Day05) усі чотири стоять на підлозі поруч із манекеном, нічого не висить і не провалюється. Вони розставлені як справжній вуличний ріг: три стовпчики в ряд приблизно через 1,5 м, лавка позаду них обличчям назовні, урна поруч із лавкою, а ліхтарний стовп позаду."}, {"en": "corner_eye.png and corner_5m.png: the corner from eye height and from about 5 m up.", "uk": "corner_eye.png і corner_5m.png: ріг із висоти очей і приблизно з 5 м угорі."}, {"en": "compare_day5.png: a Krita sheet with each prop's Unreal screenshot beside its real photo (Gold).", "uk": "compare_day5.png: аркуш у Krita, де скриншот кожного пропса з Unreal стоїть поруч із його справжнім фото (Золото)."}, {"en": "rubric_day5.md: your plan and real times at the top, then ten yes or no lines, checked with the tutor.", "uk": "rubric_day5.md: угорі твій план і реальний час, далі десять рядків «так» чи «ні», перевірені з тьютором."}], "piece1": "the bench: materials, collision and a clean FBX (in the micro-lessons)", "piece2": {"en": "The whole street-prop set, finished and placed, on your own and timed (start a 4-hour timer)", "uk": "Увесь комплект вуличних пропсів, завершений і розставлений, самостійно й на час (запусти таймер на 4 години)"}, "steps": [{"text": {"en": "Check: the files from today's lessons are in the day work folder (rubric_day5.md with your plan at the top, bench_day5_v01.blend and SM_Bench.fbx), and Unreal has the level L_Day05. Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it. Start a 4-hour timer. Check: your plan gives Bronze by hour 2, Silver by hour 3 and Gold in hour 4.", "uk": "Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: rubric_day5.md із планом угорі, bench_day5_v01.blend і SM_Bench.fbx, а в Unreal є рівень L_Day05. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Запусти таймер на 4 години. Перевірка: за планом Бронза готова до кінця 2-ї години, Срібло — до кінця 3-ї, Золото — на 4-й."}, "lesson": 1}, {"text": {"en": "Lamp post: open lamp_day3.blend, Save As lamp_day5_v01.blend, and add UCX boxes (pole, base, and one for the arm and lantern) named UCX_SM_LampPost_00 and up. Export SM_LampPost.fbx. Check: three or four boxes with the lamp's origin, and the .fbx is 10 KB or more (4 KB means empty).", "uk": "Ліхтарний стовп: відкрий lamp_day3.blend і збережи як lamp_day5_v01.blend (Save As). Додай блоки UCX (стовп, основа, один на кронштейн із плафоном) з назвами від UCX_SM_LampPost_00. Експортуй SM_LampPost.fbx. Перевірка: три-чотири блоки з origin ліхтаря, а .fbx має 10 КБ або більше (4 КБ означає порожній файл)."}, "lesson": "D4.3"}, {"text": {"en": "Bollard: open bollard_day1.blend, Save As bollard_day5_v01.blend, add one box UCX_SM_Bollard_00 around the body with the bollard's origin, and export SM_Bollard.fbx the same way. Check: the export window showed Selected Objects and only Mesh, and the file is 10 KB or more.", "uk": "Стовпчик: відкрий bollard_day1.blend і збережи як bollard_day5_v01.blend. Додай навколо корпусу один блок UCX_SM_Bollard_00 з origin стовпчика і так само експортуй SM_Bollard.fbx. Перевірка: у вікні експорту були Selected Objects і лише Mesh, а файл має 10 КБ або більше."}, "lesson": "D4.4"}, {"text": {"en": "Bench: if you didn't finish it in Lesson 2, add UCX boxes (one for the seat and back, one per side frame) and export SM_Bench.fbx. Check: the boxes leave the space under the seat open, and the file is 10 KB or more.", "uk": "Лавка: якщо її не завершено на уроці 2, додай блоки UCX (один на сидіння зі спинкою, по одному на кожну боковину) і експортуй SM_Bench.fbx. Перевірка: під сидінням блоки лишають вільне місце, а файл має 10 КБ або більше."}, "lesson": "D4.4"}, {"text": {"en": "Import SM_LampPost.fbx, SM_Bollard.fbx and SM_Bin.fbx (from Day 4) into Course/Day05 with Fallback Collision Type None. Open each in the Static Mesh Editor and compare Approx Size with your sizes files. Check: four assets with pictures in Course/Day05, every size within 10 % of your notes.", "uk": "Імпортуй SM_LampPost.fbx, SM_Bollard.fbx і SM_Bin.fbx (з Дня 4) у Course/Day05 з Fallback Collision Type None. Відкрий кожен у Static Mesh Editor і порівняй Approx Size зі своїми файлами розмірів. Перевірка: у Course/Day05 чотири асети з картинками, кожен розмір у межах 10 % від твоїх нотаток."}, "lesson": "D4.4"}, {"text": {"en": "In L_Day05, delete the GLB props from Days 1 to 4 (click each in the Outliner, press Delete) and place the four FBX props beside the mannequin with End. Walk past them in Play. Check: nothing floats or sinks, and each prop looks the right size beside the mannequin. Bronze reached: save L_Day05 (Ctrl+S) and take bronze.png.", "uk": "У L_Day05 видали GLB-пропси з Днів 1–4: клацни кожен в Outliner і натисни Delete. Постав чотири FBX-пропси поруч із манекеном клавішею End і пройди повз них у Play. Перевірка: нічого не висить і не провалюється, кожен пропс поруч із манекеном має правильний розмір. Бронзу здобуто: збережи L_Day05 (Ctrl+S) і зроби скриншот bronze.png."}, "lesson": 3}, {"text": {"en": "Materials: give the bollard, the lamp post and the bin simple materials from their photos (for example painted iron: Roughness 0.5, Metallic 0; galvanised steel: Roughness 0.4, Metallic 1). Save each file as _v02 and export each prop again with the same file name (10 KB or more). In Unreal's Content Browser right-click each mesh > Reimport. Check: in the level each prop looks like its photo in colour and shine.", "uk": "Матеріали: дай стовпчику, ліхтарному стовпу й урні прості матеріали за фото. Наприклад, фарбоване залізо: Roughness 0.5, Metallic 0; оцинкована сталь: Roughness 0.4, Metallic 1. Збережи кожен файл як _v02 і ще раз експортуй кожен пропс із тією самою назвою файлу (10 КБ або більше). У Content Browser в Unreal клацни правою кнопкою кожен меш > Reimport. Перевірка: у рівні кожен пропс за кольором і блиском схожий на своє фото."}, "lesson": 2}, {"text": {"en": "Arrange the street corner: three bollards 1.5 m apart (Location X 0, 150, 300), the bench behind them facing out, the bin 0.5 m beside the bench and the lamp post about 1 m behind. Check: from above it reads as a tidy pavement corner.", "uk": "Розстав вуличний ріг: три стовпчики через 1,5 м (Location X 0, 150, 300), лавка позаду них обличчям назовні, урна за 0,5 м від лавки, а ліхтарний стовп приблизно на 1 м позаду. Перевірка: згори видно охайний ріг тротуару."}, "lesson": 3}, {"text": {"en": "Silver: take corner_eye.png from about 1.7 m high and corner_5m.png from about 5 m up. Check: both screenshots show all four props clearly.", "uk": "Срібло: зроби скриншот corner_eye.png з висоти близько 1,7 м і corner_5m.png приблизно з 5 м угорі. Перевірка: на обох скриншотах чітко видно всі чотири пропси."}, "lesson": 3}, {"text": {"en": "Gold: compare_day5.png in Krita (File > New, 2400 x 1200 px). For each prop, drag in your best photo and your Unreal screenshot (Insert as New Layer) and use Ctrl+T to make them the same height. Write one line under each pair. Check: four pairs, each with matching proportions.", "uk": "Золото: compare_day5.png у Krita (File > New, 2400 × 1200 px). Для кожного пропса перетягни найкраще фото й свій скриншот з Unreal (Insert as New Layer) і клавішами Ctrl+T зроби їх однакової висоти. Під кожною парою напиши один рядок. Перевірка: чотири пари, у кожній пропорції збігаються."}, "lesson": 3}, {"text": {"en": "Gold: make the railing section clean too: rename it SM_RailingSection, add UCX boxes (one per post, one for the rails and bars) and a material, export SM_RailingSection.fbx (10 KB or more), import it and place it along the back of the corner. Check: it stands on the floor and reaches about the mannequin's waist.", "uk": "Золото: зроби чистою й секцію поруччя. Перейменуй її на SM_RailingSection, додай блоки UCX (по одному на кожну стійку, один на поручні з балясинами) і матеріал. Експортуй SM_RailingSection.fbx (10 КБ або більше), імпортуй і постав уздовж задньої сторони рогу. Перевірка: секція стоїть на підлозі й сягає манекенові приблизно до пояса."}, "lesson": "D4.4"}, {"text": {"en": "Self-review: fill in rubric_day5.md line by line with the tutor, write your real times under the plan, and fix the worst 'no' first. Check credits.md (one level above the day work folder) too. Check: every line has a yes or a no, and the worst fault is fixed.", "uk": "Самоперевірка: з тьютором заповни rubric_day5.md рядок за рядком, під планом запиши свій реальний час і спершу виправ найгірше «ні». Перевір і credits.md у GAD, на рівень вище за робочу папку дня. Перевірка: у кожному рядку стоїть «так» чи «ні», а найгіршу помилку виправлено."}, "lesson": 4}, {"text": {"en": "Clip: in Unreal press Play, then Win+Alt+R; walk the mannequin round the corner for 30 to 60 seconds and press Win+Alt+R again. Find the clip in Videos > Captures, move it into the day work folder and rename it clip_day5.mp4. Check: the clip is under 50 MB (right-click > Properties); bigger? Record 30 seconds instead.", "uk": "Кліп: в Unreal натисни Play, потім Win+Alt+R. Проведи манекена довкола рогу за 30–60 секунд і знову натисни Win+Alt+R. Знайди кліп у папці «Відео» (Videos) > Captures, перенеси в робочу папку дня й перейменуй на clip_day5.mp4. Перевірка: кліп менший за 50 МБ (правою кнопкою > Властивості). Більший? Запиши 30 секунд."}, "lesson": "D0.1"}, {"text": {"en": "Report and hand-in: click Copy the day report at the bottom of the page, paste it into a new chat and answer. Open summary.md in Notepad, press Ctrl+End, paste the answer and press Ctrl+S. Then drag the files on the Hand in list into your hand-in folder. Check: every name shows in the folder, each with a size.", "uk": "Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: кожна назва зі списку є в папці, у кожної є розмір."}, "lesson": "D0.1"}], "boss": [{"en": "Bronze: all four props exported as FBX with UCX boxes, imported into Course/Day05, each within 10 % of its real size and standing on the floor beside the mannequin.", "uk": "Бронза: усі чотири пропси експортовано у FBX із блоками UCX та імпортовано в Course/Day05. Кожен у межах 10 % від свого реального розміру й стоїть на підлозі поруч із манекеном."}, {"en": "Silver: Bronze, plus simple materials from photos on every prop, the props placed as a believable street corner, and the two corner screenshots.", "uk": "Срібло: усе для Бронзи, а ще прості матеріали за фото на кожному пропсі, пропси розставлено як правдоподібний вуличний ріг, і є два скриншоти рогу."}, {"en": "Gold: Silver, plus compare_day5.png (each prop beside its real photo), the railing section clean and placed, and every rubric line a yes, all within 4 hours.", "uk": "Золото: усе для Срібла, а ще compare_day5.png (кожен пропс поруч зі своїм справжнім фото), чиста й розставлена секція поруччя, і в таблиці оцінювання кожен рядок — «так». Усе за 4 години."}], "assets": ["island12/art-director-notes.md"]}, "lessons": [{"title": {"en": "Micro-lesson: planning a timed build", "uk": "Мікроурок: як спланувати роботу на час"}, "minutes": 20, "goals": [{"en": "Plan a timed build so you have something to hand in after every tier: Bronze first, then Silver, then Gold.", "uk": "Планувати роботу на час так, щоб після кожної медалі було що здати: спершу Бронза, потім Срібло, потім Золото."}, {"en": "Give each job a minute budget and check the clock every 30 minutes.", "uk": "Давати кожній задачі бюджет у хвилинах і звірятися з годинником кожні 30 хвилин."}, {"en": "Save numbered versions (File > Save As: name_v01, name_v02 ...) so one bad step never costs the afternoon.", "uk": "Зберігати нумеровані версії (File > Save As: name_v01, name_v02 …), щоб один невдалий крок не забрав усе пообіддя."}], "doalong": [{"en": "Make rubric_day5.md in the day work folder. At the top, write today's three tiers in your own words and a minute budget for each job: Bronze by hour 2, Silver by hour 3, Gold in hour 4, with 30 minutes spare.", "uk": "Створи rubric_day5.md у робочій папці дня. Угорі своїми словами запиши три сьогоднішні медалі й бюджет у хвилинах для кожної задачі. Бронза — до кінця 2-ї години, Срібло — до кінця 3-ї, Золото — на 4-й, і ще 30 хвилин у запасі."}, {"en": "Open bench_day2.blend and use File > Save As to save bench_day5_v01.blend in the day work folder. The title bar shows the new name: your old file stays safe.", "uk": "Відкрий bench_day2.blend і через File > Save As збережи bench_day5_v01.blend у робочій папці дня. У рядку заголовка нова назва, а старий файл лишається цілим."}, {"en": "Set a timer to ring every 30 minutes (the Windows Clock app > Timer, or your phone). Under your plan, write one rule for when you are stuck for 10 minutes: send the tutor a screenshot, or move to the next job.", "uk": "Постав таймер, що дзвенить кожні 30 хвилин: застосунок Windows «Годинник» (Clock) > Таймер або телефон. Під планом запиши одне правило на випадок, коли ти застрягаєш на 10 хвилин: надішли тьютору скриншот або переходь до наступної задачі."}], "play": {"en": "What first? The tutor fires eight pairs of jobs at me ('materials or collision?', 'the Gold railing or the Bronze import?'); I pick the one that comes first in a timed Boss, in 5 seconds each.", "uk": "Що спершу? Тьютор кидає мені вісім пар задач («матеріали чи колізія?», «поруччя на Золото чи імпорт на Бронзу?»). За 5 секунд на пару я вибираю ту, що в День боса на час іде першою."}, "video": {"search": "how to plan a timed 3d art test"}, "prompt": "You are my tutor for one 20-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Мікроурок: як спланувати роботу на час (Day 5, lesson 1 of 4). Today's build: Твій комплект вуличних пропсів: стовпчик, лавка, ліхтарний стовп і урна, чисті й у реальному масштабі в Unreal.\nWhat I already know: День 1: SM_Bollard; День 2: SM_Bench; День 3: SM_LampPost і секція поруччя; День 4: SM_Bin, Krita, блоки UCX і чистий експорт FBX.\n\nBy the end of this lesson I can:\n1. Планувати роботу на час так, щоб після кожної медалі було що здати: спершу Бронза, потім Срібло, потім Золото.\n2. Давати кожній задачі бюджет у хвилинах і звірятися з годинником кожні 30 хвилин.\n3. Зберігати нумеровані версії (File > Save As: name_v01, name_v02 …), щоб один невдалий крок не забрав усе пообіддя.\n\nRun the lesson in this order; it should take 20 to 30 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: За чотири дні з'явилися чотири вуличні пропси в реальних розмірах, і ти вже вмієш робити чистий ігровий експорт із колізією. Today: Сьогодні День боса: чотири твої пропси стають маленьким вуличним рогом в Unreal, з аркушем порівняння зі справжніми фото й коротким кліпом. Нове вміння сьогодні — прості матеріали — потрібне для Срібла; для Бронзи вистачить того, що ти вже вмієш. One encouraging line: Бронза тобі під силу, тож здобудь її першою, а тоді йди до Срібла чи Золота, скільки дозволить час.); 2 lines on why today matters and where it comes back, in plain words (from this: Арт-директори оцінюють комплект пропсів, ставлячи його поруч зі справжніми фото. Якщо лавка поруч з урною здається великою, уся вулиця виглядає іграшковою. Сьогодні ти доводиш усі чотири пропси до одного стандарту на час — так студії проводять тестові завдання. It comes back: Це твій перший аркуш поруч зі справжніми фото. Такий самий аркуш ти зробиш для свого набору (День 15), рогу гавані (День 20) і обох районів (День 45 і День 55). Чотири пропси облаштують твій острів у День 43.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-05-boss-street-props exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (лавка: матеріали, колізія і чистий FBX (на мікроуроках)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Створи rubric_day5.md у робочій папці дня. Угорі своїми словами запиши три сьогоднішні медалі й бюджет у хвилинах для кожної задачі. Бронза — до кінця 2-ї години, Срібло — до кінця 3-ї, Золото — на 4-й, і ще 30 хвилин у запасі.\n   2. Відкрий bench_day2.blend і через File > Save As збережи bench_day5_v01.blend у робочій папці дня. У рядку заголовка нова назва, а старий файл лишається цілим. [screenshot]\n   3. Постав таймер, що дзвенить кожні 30 хвилин: застосунок Windows «Годинник» (Clock) > Таймер або телефон. Під планом запиши одне правило на випадок, коли ти застрягаєш на 10 хвилин: надішли тьютору скриншот або переходь до наступної задачі. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Що спершу? Тьютор кидає мені вісім пар задач («матеріали чи колізія?», «поруччя на Золото чи імпорт на Бронзу?»). За 5 секунд на пару я вибираю ту, що в День боса на час іде першою. Otherwise skip it.\n6. Review: ask me these questions from earlier days, one at a time, and correct me kindly: Day 2: Your bench seat is 0.6 m high. What will players feel, and what is a usual seat height? | Day 0: What is the difference between Object Mode and Edit Mode?\n7. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n8. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; tier (Bronze, Silver, Gold) = медаль (Бронза, Срібло, Золото); ": "Micro-lesson: self-review against a rubric", "uk": "Мікроурок: самоперевірка за таблицею оцінювання"}, "minutes": 20, "goals": [{"en": "Explain a rubric: a list of yes or no checks that says what 'done' means.", "uk": "Пояснювати, що таке таблиця оцінювання (rubric): список перевірок «так» чи «ні», який показує, коли робота готова."}, {"en": "Check your own props line by line, honestly, before anyone else does.", "uk": "Чесно перевіряти свої пропси рядок за рядком, раніше за будь-кого іншого."}, {"en": "Fix the worst fault first, and stop when the work is good enough to hand in.", "uk": "Спершу виправляти найгіршу помилку й зупинятися, коли роботу вже можна здати."}], "doalong": [{"en": "Under your plan in rubric_day5.md, write ten yes or no lines: real size, origin at the base, transforms applied, triangles in budget, no gaps, UCX boxes named right, FBX names right, materials from photos, standing on the floor, placed like a real street.", "uk": "Під планом у rubric_day5.md запиши десять рядків «так» чи «ні»: реальний розмір, origin в основі, трансформації застосовано, трикутники в межах бюджету, немає щілин, блоки UCX названо правильно, назви FBX правильні, матеріали за фото, стоїть на підлозі, розставлено як на справжній вулиці."}, {"en": "Check the bench line by line and mark each yes or no. Fix the 'no' a player would notice first, export again and Reimport. Check that line again.", "uk": "Перевір лавку рядок за рядком і познач кожен «так» чи «ні». Спершу виправ те «ні», яке гравець помітить першим, експортуй знову й зроби Reimport. Перевір цей рядок ще раз."}, {"en": "Read your lines to the tutor. For each 'yes' it asks one question; a 'yes' you can't back up becomes a 'no'.", "uk": "Прочитай свої рядки тьютору. На кожне «так» він ставить одне запитання. «Так», яке не вдається підтвердити, стає «ні»."}], "play": {"en": "Cross-check: the tutor reads my rubric scores and asks one hard question per 'yes'; if I can't back a yes up with a screenshot or a number, it becomes a no.", "uk": "Перехресна перевірка: тьютор читає мої оцінки за таблицею й ставить одне складне запитання на кожне «так». Якщо я не можу підтвердити «так» скриншотом чи числом, воно стає «ні»."}, "video": {"url": "https://www.youtube.com/watch?v=gf5yQQF-d0I", "title": "What Does Game-Ready Really Mean? / Game Asset Tips for 3D Artists", "channel": "Ali Cgi", "length": "5:24", "search": "what does game ready mean 3d asset checklist", "alt": {"url": "https://www.youtube.com/watch?v=li0AMSd8_C4", "title": "НАВІГАЦІЯ в Blender Українською", "channel": "Stanisslayer"}}, "prompt": "You are my tutor for one 20-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Мікроурок: самоперевірка за таблицею оцінювання (Day 5, lesson 4 of 4). Today's build: Твій комплект вуличних пропсів: стовпчик, лавка, ліхтарний стовп і урна, чисті й у реальному масштабі в Unreal.\nWhat I already know: День 1: SM_Bollard; День 2: SM_Bench; День 3: SM_LampPost і секція поруччя; День 4: SM_Bin, Krita, блоки UCX і чистий експорт FBX.\nEarlier today I already did: lesson 1 (Мікроурок: як спланувати роботу на час); lesson 2 (Мікроурок: прості матеріали за фото (нова навичка для Срібла)); lesson 3 (Мікроурок: вуличний ріг у реальному масштабі). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Пояснювати, що таке таблиця оцінювання (rubric): список перевірок «так» чи «ні», який показує, коли робота готова.\n2. Чесно перевіряти свої пропси рядок за рядком, раніше за будь-кого іншого.\n3. Спершу виправляти найгіршу помилку й зупинятися, коли роботу вже можна здати.\n\nRun the lesson in this order; it should take 20 to 30 minutes:\n1. Your first message, at most 7 short lines: 2 lines on why today matters and where it comes back, in plain words (from this: Арт-директори оцінюють комплект пропсів, ставлячи його поруч зі справжніми фото. Якщо лавка поруч з урною здається великою, уся вулиця виглядає іграшковою. Сьогодні ти доводиш усі чотири пропси до одного стандарту на час — так студії проводять тестові завдання. It comes back: Це твій перший аркуш поруч зі справжніми фото. Такий самий аркуш ти зробиш для свого набору (День 15), рогу гавані (День 20) і обох районів (День 45 і День 55). Чотири пропси облаштують твій острів у День 43.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-05-boss-street-props exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (лавка: матеріали, колізія і чистий FBX (на мікроуроках)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Під планом у rubric_day5.md запиши десять рядків «так» чи «ні»: реальний розмір, origin в основі, трансформації застосовано, трикутники в межах бюджету, немає щілин, блоки UCX названо правильно, назви FBX правильні, матеріали за фото, стоїть на підлозі, розставлено як на справжній вулиці.\n   2. Перевір лавку рядок за рядком і познач кожен «так» чи «ні». Спершу виправ те «ні», яке гравець помітить першим, експортуй знову й зроби Reimport. Перевір цей рядок ще раз. [screenshot]\n   3. Прочитай свої рядки тьютору. На кожне «так» він ставить одне запитання. «Так», яке не вдається підтвердити, стає «ні». [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Перехресна перевірка: тьютор читає мої оцінки за таблицею й ставить одне складне запитання на кожне «так». Якщо я не можу підтвердити «так» скриншотом чи числом, воно стає «ні». Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\nIf I want to go deeper, recommend this free video: \"What Does Game-Ready Really Mean? / Game Asset Tips for 3D Artists\" by Ali Cgi: https://www.youtube.com/watch?v=gf5yQQF-d0I\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; tier (Bronze, Silver, Gold) = медаль (Бронза, Срібло, Золото); lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; rubric = таблиця оцінювання; self-review = самоперевірка; review (by tutor or art director) = огляд; checklist = чек-лист; credits line = рядок авторства; comparison sheet, board (an image) = аркуш (аркуш порівняння, аркуш референсів); click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); File Explorer = Провідник; mesh = меш; vertex / edge / face = вершина / ребро / грань; origin (and kit pivot) = origin — точка, за яку об'єкт ставлять і обертають; look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); UV unwrap / UV layout / seam / UV island = розгортка / розкладка / шов / UV-острівець; level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; collision / UCX collision box = колізія / блок UCX; material slot / node / pin = слот матеріалу / вузол / вхід; keep-out zone / footprint test / grounding = зона-виняток / тест опори / посадка на ґрунт; kit / kit piece / part of one object = набір / деталь / частина; district / plot / plot plan = район / ділянка / план ділянки; harbour / quay / waterfront / pier = гавань / причал / набережна / пірс; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}], "handin": [{"en": "summary.md", "uk": "summary.md (звіт дня)"}, {"en": "SM_Bollard.fbx, SM_Bench.fbx, SM_LampPost.fbx and SM_Bin.fbx, with their UCX boxes (Boss)", "uk": "SM_Bollard.fbx, SM_Bench.fbx, SM_LampPost.fbx і SM_Bin.fbx з блоками UCX (День боса)"}, {"en": "corner_eye.png and corner_5m.png, plus compare_day5.png for Gold (Boss)", "uk": "corner_eye.png і corner_5m.png, а для Золота — compare_day5.png (День боса)"}, {"en": "rubric_day5.md: your plan, real times and ten lines, checked (Boss)", "uk": "rubric_day5.md (твій план, реальний час і десять перевірених рядків) (День боса)"}, {"en": "credits.md, the course-long file, checked today (Boss)", "uk": "credits.md (файл на весь курс, перевірений сьогодні) (День боса)"}, {"en": "clip_day5.mp4: 30 to 60 seconds, under 50 MB; keep it: Day 60's progress reel uses it (Boss)", "uk": "clip_day5.mp4 (30–60 секунд, менше 50 МБ; збережи його: з нього складеш ролик прогресу в День 60) (День боса)"}], "goal": {"en": "By the end of today you have your bollard, bench, lamp post and bin as clean FBX files with collision and simple materials, standing as a small street corner beside the mannequin in Unreal, with a sheet that shows each one beside its real photo.", "uk": "До кінця дня твої стовпчик, лавка, ліхтарний стовп і урна — чисті файли FBX із колізією та простими матеріалами. Вони стоять маленьким вуличним рогом поруч із манекеном в Unreal, а аркуш порівняння показує кожен пропс поруч із його справжнім фото."}, "uses": [{"en": "Day 1: SM_Bollard", "uk": "День 1: SM_Bollard"}, {"en": "Day 2: SM_Bench", "uk": "День 2: SM_Bench"}, {"en": "Day 3: SM_LampPost and the railing section", "uk": "День 3: SM_LampPost і секція поруччя"}, {"en": "Day 4: SM_Bin, Krita, UCX boxes and the clean FBX export", "uk": "День 4: SM_Bin, Krita, блоки UCX і чистий експорт FBX"}], "quiz": [{"q": {"en": "You place your bench at Location Z = 0 on a flat floor at Z = 0, and it floats 3 cm up. What is the likely cause?", "uk": "Ти ставиш лавку на Location Z = 0 на пласку підлогу на Z = 0, а вона висить на 3 см вище. Яка ймовірна причина?"}, "options": [{"en": "The origin sits 3 cm below the bottom of the legs, not at the base", "uk": "Origin на 3 см нижче низу ніжок, а не в основі"}, {"en": "The bench has too many triangles", "uk": "У лавки забагато трикутників"}, {"en": "The material is too rough", "uk": "Матеріал надто шорсткий"}, {"en": "The bench has no UCX boxes", "uk": "У лавки немає блоків UCX"}], "answer": 0, "explain": {"en": "Unreal puts the origin at the Location you type. If the origin is below the legs, the bench floats by that much.", "uk": "Unreal ставить origin у ту Location, яку ти вводиш. Якщо origin нижче ніжок, лавка висить рівно на цю відстань."}}, {"q": {"en": "Which Edit Mode tool pulls a new leg out of a selected face?", "uk": "Який інструмент Edit Mode видавлює нову ніжку з виділеної грані?"}, "options": [{"en": "Inset (I)", "uk": "Inset (I)"}, {"en": "Extrude (E)", "uk": "Extrude (E)"}, {"en": "Loop Cut (Ctrl+R)", "uk": "Loop Cut (Ctrl+R)"}], "answer": 1, "explain": {"en": "Extrude pulls new geometry out of the selected faces. Loop cuts make the faces; inset makes borders.", "uk": "Extrude видавлює нову геометрію з виділених граней. Петлеві розрізи створюють грані, а Inset робить рамки."}}, {"q": {"en": "You need 20 identical bars in a railing, and the number may change later. What do you use?", "uk": "Тобі потрібно 20 однакових прутів у поруччі, і їхня кількість згодом може змінитися. Що використати?"}, "options": [{"en": "Shift+D twenty times", "uk": "Двадцять разів Shift+D"}, {"en": "The Solidify modifier", "uk": "Модифікатор Solidify"}, {"en": "The Bevel modifier", "uk": "Модифікатор Bevel"}, {"en": "Array (Legacy)", "uk": "Array (Legacy)"}], "answer": 3, "explain": {"en": "Array (Legacy) repeats a part at a spacing you set, and you can change the Count until you apply it.", "uk": "Array (Legacy) повторює частину на заданій відстані, а Count можна міняти, доки ти не застосуєш модифікатор."}}, {"q": {"en": "What does the name UCX_SM_Bin_00 tell Unreal?", "uk": "Що назва UCX_SM_Bin_00 каже Unreal?"}, "options": [{"en": "It is the bin's lighter version", "uk": "Це легша версія урни"}, {"en": "It is collision for SM_Bin, not a visible part", "uk": "Це колізія для SM_Bin, а не видима частина"}, {"en": "It is a material for the bin", "uk": "Це матеріал для урни"}], "answer": 1, "explain": {"en": "UCX_ marks collision. The rest of the name must match the visible mesh exactly.", "uk": "UCX_ позначає колізію. Решта назви має точно збігатися з назвою видимого меша."}}, {"q": {"en": "Your lamp's second arm appears 2 m to the side when you add Mirror. Why?", "uk": "Коли ти додаєш Mirror, другий кронштейн твого ліхтаря з'являється за 2 м збоку. Чому?"}, "options": [{"en": "Bevel is above Mirror", "uk": "Bevel стоїть над Mirror"}, {"en": "Mirror always copies 2 m away", "uk": "Mirror завжди копіює на 2 м убік"}, {"en": "The arm's origin is not on the pole's centre line", "uk": "Origin кронштейна не на центральній лінії стовпа"}], "answer": 2, "explain": {"en": "Mirror reflects across the object's origin. With the origin on the pole's centre line, the copy lands on the other side of the pole.", "uk": "Mirror віддзеркалює відносно origin об'єкта. Коли origin на центральній лінії стовпа, копія опиняється з іншого боку стовпа."}}, {"q": {"en": "Which Metallic value fits a painted iron bench frame?", "uk": "Яке значення Metallic пасує фарбованій залізній боковині лавки?"}, "options": [{"en": "1, because iron is a metal", "uk": "1, бо залізо — метал"}, {"en": "0, because you see the paint, not the metal", "uk": "0, бо видно фарбу, а не метал"}, {"en": "0.5, because it is half metal", "uk": "0,5, бо це наполовину метал"}], "answer": 1, "explain": {"en": "Metallic describes the surface you see. Paint is not metal, so Metallic stays 0.", "uk": "Metallic описує поверхню, яку видно. Фарба — не метал, тож Metallic лишається 0."}}, {"q": {"en": "Halfway through the Boss an extrude breaks your lamp post, and Ctrl+Z won't go back far enough. What saves you?", "uk": "Посеред Дня боса видавлювання ламає твій ліхтарний стовп, а Ctrl+Z не повертає досить далеко. Що тебе врятує?"}, "options": [{"en": "Your numbered save, lamp_day5_v01.blend", "uk": "Нумероване збереження lamp_day5_v01.blend"}, {"en": "Exporting to FBX", "uk": "Експорт у FBX"}, {"en": "Turning off Material Preview", "uk": "Вимкнення Material Preview"}], "answer": 0, "explain": {"en": "Numbered saves keep every earlier state. Open the last good version and redo only the last step.", "uk": "Нумеровані збереження тримають кожен попередній стан. Відкрий останню вдалу версію й повтори лише останній крок."}}, {"q": {"en": "What do you do first in a 4-hour timed Boss?", "uk": "Що робити спершу, коли День боса триває 4 години?"}, "options": [{"en": "Start on the Gold details", "uk": "Братися за дрібниці для Золота"}, {"en": "Make the materials perfect", "uk": "Доводити матеріали до ідеалу"}, {"en": "Write a plan with the tiers and a minute budget for each job", "uk": "Написати план із медалями та бюджетом у хвилинах для кожної задачі"}, {"en": "Take the screenshots", "uk": "Робити скриншоти"}], "answer": 2, "explain": {"en": "A plan makes sure Bronze is safe before you spend time on Silver and Gold.", "uk": "План гарантує, що Бронза в безпеці, перш ніж ти витрачаєш час на Срібло й Золото."}}], "weekInfo": {"week": 1, "title": {"en": "Blender from zero: props at real size", "uk": "Blender з нуля: пропси в реальному розмірі"}, "goal": {"en": "By Friday you have a street-prop set (bollard, bench, lamp post and bin) that you modelled yourself from real photos, exported clean with collision and simple materials, standing at real scale in Unreal.", "uk": "До п'ятниці в тебе є комплект вуличних пропсів: стовпчик, лавка, ліхтарний стовп і урна. Ти моделюєш їх власноруч за справжніми фото, чисто експортуєш із колізією та простими матеріалами, і вони стоять в Unreal у реальному масштабі."}, "skills": [{"en": "3D modelling in Blender from measured photos and drawings", "uk": "3D-моделювання в Blender за обмірними фото й кресленнями"}, {"en": "Hard-surface modelling with Edit Mode tools and modifiers (extrude, inset, loop cut, Array, Mirror, Bevel, Solidify)", "uk": "Моделювання твердих поверхонь (hard-surface) інструментами Edit Mode і модифікаторами: видавлювання (Extrude), Inset, петлеві розрізи, Array, Mirror, Bevel, Solidify"}, {"en": "Game-ready export: real-world scale, pivots, applied transforms, UCX collision and FBX", "uk": "Експорт, готовий до гри: реальний масштаб, origin, застосовані трансформації, колізія UCX і FBX"}, {"en": "Measured elevation drawings in Krita", "uk": "Обмірні креслення в Krita"}, {"en": "Props to a triangle budget with industry naming (SM_, M_, UCX_)", "uk": "Пропси в межах бюджету трикутників і з галузевими назвами (SM_, M_, UCX_)"}]}, "morning": {"sofar": {"en": "In four days you have modelled four street props to real measurements and learned the clean game export with collision.", "uk": "За чотири дні з'явилися чотири вуличні пропси в реальних розмірах, і ти вже вмієш робити чистий ігровий експорт із колізією."}, "today": {"en": "It is Boss day: your four props become a small street corner in Unreal, with a sheet beside real photos and a short clip. The new skill, simple materials, is for Silver; Bronze uses only what you already know.", "uk": "Сьогодні День боса: чотири твої пропси стають маленьким вуличним рогом в Unreal, з аркушем порівняння зі справжніми фото й коротким кліпом. Нове вміння сьогодні — прості матеріали — потрібне для Срібла; для Бронзи вистачить того, що ти вже вмієш."}, "cheer": {"en": "Bronze is built to be within your reach, so lock it in first and climb towards Silver or Gold with the time that is left.", "uk": "Бронза тобі під силу, тож здобудь її першою, а тоді йди до Срібла чи Золота, скільки дозволить час."}, "quote": {"text": {"en": "Genius is one percent inspiration, ninety-nine percent perspiration.", "uk": "Геній — це один відсоток натхнення і дев'яносто дев'ять відсотків поту."}, "author": {"en": "Thomas Edison", "uk": "Томас Едісон"}, "source": "https://en.wikiquote.org/wiki/Thomas_Edison"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-05-boss-street-props", "mapHref": "../../COURSE.html", "prevHref": "../Day-04-drawings-and-bin/START-HERE.html", "nextHref": "../Day-06-unreal-first-steps/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Blender, Krita and Unreal Engine 5.8. I am a beginner on Day 5. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me and don't write code.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: Увесь комплект вуличних пропсів, завершений і розставлений, самостійно й на час (запусти таймер на 4 години).\nIt's part of: Твій комплект вуличних пропсів: стовпчик, лавка, ліхтарний стовп і урна, чисті й у реальному масштабі в Unreal (Тренувальний вуличний ріг у Course/Day05; згодом — прогулянкова набережна твого острова (район 1).).\nWhy it matters: Арт-директори оцінюють комплект пропсів, ставлячи його поруч зі справжніми фото. Якщо лавка поруч з урною здається великою, уся вулиця виглядає іграшковою. Сьогодні ти доводиш усі чотири пропси до одного стандарту на час — так студії проводять тестові завдання. It comes back: Це твій перший аркуш поруч зі справжніми фото. Такий самий аркуш ти зробиш для свого набору (День 15), рогу гавані (День 20) і обох районів (День 45 і День 55). Чотири пропси облаштують твій острів у День 43.\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-05-boss-street-props (on the drive I chose on Day 0).\nWhat I already know: День 1: SM_Bollard; День 2: SM_Bench; День 3: SM_LampPost і секція поруччя; День 4: SM_Bin, Krita, блоки UCX і чистий експорт FBX; today's lessons: Мікроурок: як спланувати роботу на час; Мікроурок: прості матеріали за фото (нова навичка для Срібла); Мікроурок: вуличний ріг у реальному масштабі; Мікроурок: самоперевірка за таблицею оцінювання. Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- Усі чотири пропси у FBX з колізією UCX: SM_Bollard, SM_Bench, SM_LampPost і SM_Bin. Кожен у реальному розмірі, з origin у центрі основи, застосованими трансформаціями й трикутниками в межах бюджету.\n- На кожному пропсі прості матеріали за фото (Base Color, Roughness і Metallic) з назвами на M_, наприклад M_Bench_Iron і M_Bench_Timber.\n- В Unreal (Course/Day05) усі чотири стоять на підлозі поруч із манекеном, нічого не висить і не провалюється. Вони розставлені як справжній вуличний ріг: три стовпчики в ряд приблизно через 1,5 м, лавка позаду них обличчям назовні, урна поруч із лавкою, а ліхтарний стовп позаду.\n- corner_eye.png і corner_5m.png: ріг із висоти очей і приблизно з 5 м угорі.\n- compare_day5.png: аркуш у Krita, де скриншот кожного пропса з Unreal стоїть поруч із його справжнім фото (Золото).\n- rubric_day5.md: угорі твій план і реальний час, далі десять рядків «так» чи «ні», перевірені з тьютором.\n\nMy checklist (the same numbers show on my course page):\n1. Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: rubric_day5.md із планом угорі, bench_day5_v01.blend і SM_Bench.fbx, а в Unreal є рівень L_Day05. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Запусти таймер на 4 години. Перевірка: за планом Бронза готова до кінця 2-ї години, Срібло — до кінця 3-ї, Золото — на 4-й. (from lesson 1)\n2. Ліхтарний стовп: відкрий lamp_day3.blend і збережи як lamp_day5_v01.blend (Save As). Додай блоки UCX (стовп, основа, один на кронштейн із плафоном) з назвами від UCX_SM_LampPost_00. Експортуй SM_LampPost.fbx. Перевірка: три-чотири блоки з origin ліхтаря, а .fbx має 10 КБ або більше (4 КБ означає порожній файл). (from day 4, lesson 3)\n3. Стовпчик: відкрий bollard_day1.blend і збережи як bollard_day5_v01.blend. Додай навколо корпусу один блок UCX_SM_Bollard_00 з origin стовпчика і так само експортуй SM_Bollard.fbx. Перевірка: у вікні експорту були Selected Objects і лише Mesh, а файл має 10 КБ або більше. (from day 4, lesson 4)\n4. Лавка: якщо її не завершено на уроці 2, додай блоки UCX (один на сидіння зі спинкою, по одному на кожну боковину) і експортуй SM_Bench.fbx. Перевірка: під сидінням блоки лишають вільне місце, а файл має 10 КБ або більше. (from day 4, lesson 4)\n5. Імпортуй SM_LampPost.fbx, SM_Bollard.fbx і SM_Bin.fbx (з Дня 4) у Course/Day05 з Fallback Collision Type None. Відкрий кожен у Static Mesh Editor і порівняй Approx Size зі своїми файлами розмірів. Перевірка: у Course/Day05 чотири асети з картинками, кожен розмір у межах 10 % від твоїх нотаток. (from day 4, lesson 4)\n6. У L_Day05 видали GLB-пропси з Днів 1–4: клацни кожен в Outliner і натисни Delete. Постав чотири FBX-пропси поруч із манекеном клавішею End і пройди повз них у Play. Перевірка: нічого не висить і не провалюється, кожен пропс поруч із манекеном має правильний розмір. Бронзу здобуто: збережи L_Day05 (Ctrl+S) і зроби скриншот bronze.png. (from lesson 3)\n7. Матеріали: дай стовпчику, ліхтарному стовпу й урні прості матеріали за фото. Наприклад, фарбоване залізо: Roughness 0.5, Metallic 0; оцинкована сталь: Roughness 0.4, Metallic 1. Збережи кожен файл як _v02 і ще раз експортуй кожен пропс із тією самою назвою файлу (10 КБ або більше). У Content Browser в Unreal клацни правою кнопкою кожен меш > Reimport. Перевірка: у рівні кожен пропс за кольором і блиском схожий на своє фото. (from lesson 2)\n8. Розстав вуличний ріг: три стовпчики через 1,5 м (Location X 0, 150, 300), лавка позаду них обличчям назовні, урна за 0,5 м від лавки, а ліхтарний стовп приблизно на 1 м позаду. Перевірка: згори видно охайний ріг тротуару. (from lesson 3)\n9. Срібло: зроби скриншот corner_eye.png з висоти близько 1,7 м і corner_5m.png приблизно з 5 м угорі. Перевірка: на обох скриншотах чітко видно всі чотири пропси. (from lesson 3)\n10. Золото: compare_day5.png у Krita (File > New, 2400 × 1200 px). Для кожного пропса перетягни найкраще фото й свій скриншот з Unreal (Insert as New Layer) і клавішами Ctrl+T зроби їх однакової висоти. Під кожною парою напиши один рядок. Перевірка: чотири пари, у кожній пропорції збігаються. (from lesson 3)\n11. Золото: зроби чистою й секцію поруччя. Перейменуй її на SM_RailingSection, додай блоки UCX (по одному на кожну стійку, один на поручні з балясинами) і матеріал. Експортуй SM_RailingSection.fbx (10 КБ або більше), імпортуй і постав уздовж задньої сторони рогу. Перевірка: секція стоїть на підлозі й сягає манекенові приблизно до пояса. (from day 4, lesson 4)\n12. Самоперевірка: з тьютором заповни rubric_day5.md рядок за рядком, під планом запиши свій реальний час і спершу виправ найгірше «ні». Перевір і credits.md у GAD, на рівень вище за робочу папку дня. Перевірка: у кожному рядку стоїть «так» чи «ні», а найгіршу помилку виправлено. (from lesson 4)\n13. Кліп: в Unreal натисни Play, потім Win+Alt+R. Проведи манекена довкола рогу за 30–60 секунд і знову натисни Win+Alt+R. Знайди кліп у папці «Відео» (Videos) > Captures, перенеси в робочу папку дня й перейменуй на clip_day5.mp4. Перевірка: кліп менший за 50 МБ (правою кнопкою > Властивості). Більший? Запиши 30 секунд. (from day 0, lesson 1)\n14. Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: кожна назва зі списку є в папці, у кожної є розмір. (from day 0, lesson 1)\n\nToday is a BOSS build. Ask me what time I started; whenever I tell you the time, tell me which tier I'm on track for. At the end, ask my finish time. Tiers:\n- Бронза: усі чотири пропси експортовано у FBX із блоками UCX та імпортовано в Course/Day05. Кожен у межах 10 % від свого реального розміру й стоїть на підлозі поруч із манекеном.\n- Срібло: усе для Бронзи, а ще прості матеріали за фото на кожному пропсі, пропси розставлено як правдоподібний вуличний ріг, і є два скриншоти рогу.\n- Золото: усе для Срібла, а ще compare_day5.png (кожен пропс поруч зі своїм справжнім фото), чиста й розставлена секція поруччя, і в таблиці оцінювання кожен рядок — «так». Усе за 4 години.\n\nHow to help: ask which step number I'm on, then give me only the next step: the exact clicks and what I should see. When I send a screenshot, compare it with my reference, my sizes and the spec, and name one thing to fix at a time.\nCheck every save and export by reopening it before we move on:\n- a .glb or .fbx: import that exact file into Unreal (or back into Blender), and the mesh appears\n- a .md or .txt: open it with Notepad; the text is there, and the name doesn't end in .md.txt\n- the clip: right-click > Properties shows 30 to 60 seconds and under 50 MB\nWhen I write \"готово\", and in any case before the day ends, check with me one item at a time (yes/no): each spec point, then each file on my hand-in list, ready in my day work folder (skip summary.md: the day report writes it next):\n1. SM_Bollard.fbx, SM_Bench.fbx, SM_LampPost.fbx і SM_Bin.fbx з блоками UCX (День боса)\n2. corner_eye.png і corner_5m.png, а для Золота — compare_day5.png (День боса)\n3. rubric_day5.md (твій план, реальний час і десять перевірених рядків) (День боса)\n4. credits.md (файл на весь курс, перевірений сьогодні) (День боса)\n5. clip_day5.mp4 (30–60 секунд, менше 50 МБ; збережи його: з нього складеш ролик прогресу в День 60) (День боса)\nFinish with a short list of anything missing, the tier I reached, and one line on where this work comes back and what it will look like there. Then

<script id="data" type="application/json">{"learner": "ib-misha-873821eb", "learnerName": {"en": "Misha", "uk": "Міша"}, "day": 101, "week": 21, "total": 110, "title": {"en": "Capstone: the design document and a real place", "uk": "Випускний проєкт: проєктний документ і реальне місце"}, "theme": {"en": "Week 21: Capstone 1: the District Generator", "uk": "Тиждень 21: Випускний проєкт 1: Генератор району"}, "build": {"item": {"en": "design_doc.md for the District Generator, a real place chosen on OpenStreetMap (about 200 x 200 m), place_board.png, and L_District, the empty capstone level in /TechTools/District", "uk": "design_doc.md для Генератора району, реальне місце, обране на OpenStreetMap (приблизно 200 x 200 м), place_board.png і L_District, порожній рівень випускного проєкту в /TechTools/District"}, "why": {"en": "A design document is the cheapest place to make decisions: on one page you settle what goes in, what comes out, how you will know it works and what you will not do, before a single node is placed. Studios ask tool makers for one before building, because it turns 'a generator' into a plan anyone can check. Grounding it in a real place gives your district the logic of a town that people actually built.", "uk": "Проєктний документ — найдешевше місце для рішень: на одній сторінці ти визначаєш, що входить, що виходить, як ти дізнаєшся, що це працює, і чого ти не робитимеш, ще до того, як поставлено хоч один вузол. Студії просять у творців інструментів такий документ перед початком роботи, бо він перетворює «якийсь генератор» на план, який може перевірити будь-хто. А опора на реальне місце дає твоєму району логіку міста, яке люди справді збудували."}, "where": {"en": "design_doc.md and place_board.png in IslandCourse/Plugins/TechTools/Docs (they ship with the plugin); L_District in /TechTools/District; photos and notes in today's Work folder.", "uk": "design_doc.md і place_board.png в IslandCourse/Plugins/TechTools/Docs (вони поставляються разом із плагіном); L_District у /TechTools/District; фото й нотатки в папці Work за сьогодні."}, "spec": [{"en": "A real place: a quarter of a real small coastal or riverside town you can see on openstreetmap.org, about 200 x 200 m, with a main street, two or more side streets, a waterfront, one landmark (a church, a tower or a lighthouse) and an open square or park; no private or sensitive site.", "uk": "Реальне місце: квартал справжнього невеликого прибережного містечка або містечка на річці, який ти бачиш на openstreetmap.org, приблизно 200 x 200 м, із головною вулицею, двома чи більше бічними вулицями, набережною, одним орієнтиром (церквою, вежею або маяком) і відкритою площею чи парком; жодного приватного чи чутливого об'єкта."}, {"en": "The licence noted: OpenStreetMap data is open under the Open Database License (ODbL) and needs the credit '© OpenStreetMap contributors' with a link to openstreetmap.org/copyright; the credit written today into the plugin's new CREDITS.md (made from credits-template.md, beside README.md).", "uk": "Записана ліцензія: дані OpenStreetMap відкриті за Open Database License (ODbL) і вимагають зазначення «© OpenStreetMap contributors» із посиланням на openstreetmap.org/copyright; це зазначення записано сьогодні в новий файл CREDITS.md плагіна (створений із credits-template.md, поруч із README.md)."}, {"en": "place_board.png (Krita): the map with your 200 m box drawn on it and the credit on the image, three reference photos of the real place (or a very similar one) from Wikimedia Commons with author, licence and link in CREDITS.md, and five labels: street pattern, landmark, waterfront, square, building heights.", "uk": "place_board.png (Krita): мапа з намальованою рамкою 200 м і зазначенням авторства на зображенні, три референсні фото реального місця (або дуже схожого) з Wikimedia Commons, з автором, ліцензією та посиланням у CREDITS.md, і п'ять підписів: план вулиць, орієнтир, набережна, площа, висота будівель."}, {"en": "design_doc.md with every section of design-doc-template.md: what it does (two sentences); inputs (district_roads.csv from the map, DA_TownRules_District with the zones, a Seed); outputs with rough counts; how it works in steps; settings with ranges and defaults; limits and risks with a fallback each; one milestone per day from 102 to 110 with how you check it; the standards (standards-sheet.md and the budget); and 'done means'.", "uk": "design_doc.md з усіма розділами design-doc-template.md: що він робить (два речення); вхідні дані (district_roads.csv з мапи, DA_TownRules_District із зонами, Seed); вихідні дані з приблизною кількістю; як він працює кроками; налаштування з діапазонами й типовими значеннями; обмеження та ризики із запасним варіантом для кожного; одна віха на день зі 102 по 110 з тим, як ти її перевіряєш; стандарти (standards-sheet.md і бюджет); і «готово означає»."}, {"en": "Real measures from street-dimensions.md in the doc: carriageway and pavement widths for main streets and lanes, plot widths and floor heights, in metres.", "uk": "Реальні розміри зі street-dimensions.md у документі: ширина проїзної частини й тротуарів для головних вулиць і провулків, ширина ділянок і висота поверхів, у метрах."}, {"en": "L_District in /TechTools/District (File > New Level > Basic): a 300 m ground slab (Location 10000, 10000, -50; Scale 300, 300, 1), the flying Play set-up, and a 200 x 200 m outline of four thin cubes from 0, 0 to 20000, 20000, so the district's north-west corner sits at the world origin.", "uk": "L_District у /TechTools/District (File > New Level > Basic): плита землі 300 м (Location 10000, 10000, -50; Scale 300, 300, 1), налаштування польоту в Play та контур 200 x 200 м із чотирьох тонких кубів від 0, 0 до 20000, 20000, щоб північно-західний кут району лежав на початку координат світу."}, {"en": "The doc self-reviewed with the tutor, one thing cut or moved to 'later', and everything committed and pushed.", "uk": "Документ переглянуто разом із тьютором, одну річ вилучено або перенесено в «пізніше», а все закомічено й запушено."}], "piece1": "The real place, the licence and the design document's first sections (built in the lessons)", "piece2": {"en": "The rest of the document, the self-review and L_District, on your own", "uk": "Решта документа, самоперевірка та L_District — самостійно"}, "steps": [{"text": {"en": "Choose the place on openstreetmap.org: a quarter with a main street, side streets, a waterfront, a landmark and a square or park in about 200 x 200 m. Check: you can name all five inside your box, and the town and the box's corner coordinates are in design_doc.md.", "uk": "Обери місце на openstreetmap.org: квартал із головною вулицею, бічними вулицями, набережною, орієнтиром і площею чи парком приблизно на 200 x 200 м. Перевірка: ти можеш назвати всі п'ять речей у своїй рамці, а місто та координати кутів рамки записано в design_doc.md."}, "lesson": 2}, {"text": {"en": "Hold your box against the map's scale bar. Check: it spans about 200 m, give or take 20 m, both ways.", "uk": "Прикладай свою рамку до масштабної лінійки мапи. Перевірка: вона займає приблизно 200 м, з похибкою 20 м, в обидва боки."}, "lesson": 2}, {"text": {"en": "Take map_box.png (the map with your box drawn in Krita) and write '© OpenStreetMap contributors' on it. Check: the credit is readable on the image.", "uk": "Зроби map_box.png (мапа з рамкою, намальованою в Krita) і напиши на ній «© OpenStreetMap contributors». Перевірка: зазначення авторства читається на зображенні."}, "lesson": 2}, {"text": {"en": "Pick three photos of the real place, or a very similar town, on Wikimedia Commons (a street, the waterfront, the landmark). Check: three photos in today's Work folder, each with author, licence and link in CREDITS.md.", "uk": "Вибери три фото реального місця або дуже схожого містечка на Wikimedia Commons (вулиця, набережна, орієнтир). Перевірка: три фото лежать у папці Work за сьогодні, кожне з автором, ліцензією та посиланням у CREDITS.md."}, "lesson": 2}, {"text": {"en": "Make place_board.png in Krita: the map box, the three photos and five labels (street pattern, landmark, waterfront, square, heights). Check: someone could tell what kind of place your district is from the board alone.", "uk": "Зроби place_board.png у Krita: рамка мапи, три фото й п'ять підписів (план вулиць, орієнтир, набережна, площа, висоти). Перевірка: за самою дошкою можна зрозуміти, що це за місце, твій район."}, "lesson": 2}, {"text": {"en": "Fill design_doc.md sections 1 to 3 (what it does, inputs, outputs). Check: each input has a type, an example and where it comes from, and each output has a rough count.", "uk": "Заповни розділи 1-3 в design_doc.md (що він робить, вхідні дані, вихідні дані). Перевірка: кожне вхідне значення має тип, приклад і джерело, а кожен вихід має приблизну кількість."}, "lesson": 3}, {"text": {"en": "Fill sections 4 and 5 (how it works, settings) using street-dimensions.md for the measures. Check: every step is one line, and every setting has a unit, a range and a default.", "uk": "Заповни розділи 4 і 5 (як він працює, налаштування), беручи розміри зі street-dimensions.md. Перевірка: кожен крок займає один рядок, а кожне налаштування має одиницю, діапазон і типове значення."}, "lesson": 3}, {"text": {"en": "On your own: fill sections 6 to 9 (limits and risks, milestones, standards, done means). Check: one milestone per day from 102 to 110 with how you will check it, and 'done means' lists the proofs (pictures, video, performance report, checker, fresh-project install).", "uk": "Самостійно: заповни розділи 6-9 (обмеження та ризики, віхи, стандарти, «готово означає»). Перевірка: одна віха на день зі 102 по 110 із тим, як ти її перевіриш, а «готово означає» перелічує докази (зображення, відео, звіт про продуктивність, перевірник, встановлення в новий проєкт)."}, "lesson": 4}, {"text": {"en": "On your own: self-review the doc with the tutor. Are the inputs enough to build it? Is any line vague? Is it too big for five days? Cut or move one thing to 'later'. Check: the change and its reason are written in the doc.", "uk": "Самостійно: переглянь документ разом із тьютором. Чи вистачає вхідних даних, щоб це збудувати? Чи є нечіткий рядок? Чи завеликий він для п'яти днів? Вилучи або перенеси одну річ у «пізніше». Перевірка: зміна та її причина записані в документі."}, "lesson": 4}, {"text": {"en": "On your own: make L_District in /TechTools/District with the ground slab, the flying Play set-up and the 200 x 200 m outline from 0, 0. Check: from 120 m in Play you see the outline lying on the slab.", "uk": "Самостійно: зроби L_District у /TechTools/District із плитою землі, налаштуванням польоту в Play і контуром 200 x 200 м від 0, 0. Перевірка: зі 120 м у Play ти бачиш контур, що лежить на плиті."}, "lesson": 4}, {"text": {"en": "Save design_doc.md and place_board.png into Plugins/TechTools/Docs, then commit and push ('Capstone: design document and L_District'). Check: GitHub shows both files in Docs and the OpenStreetMap credit in CREDITS.md.", "uk": "Збережи design_doc.md і place_board.png у Plugins/TechTools/Docs, потім закоміть і запуш («Capstone: design document and L_District»). Перевірка: GitHub показує обидва файли в Docs, а зазначення OpenStreetMap — у CREDITS.md."}, "lesson": "D96.4"}, {"text": {"en": "Record clip_day101.mp4 (60 seconds): the map with your box, the place board, a scroll through design_doc.md, and L_District from the air. Check: the clip is in today's Work folder.", "uk": "Запиши clip_day101.mp4 (60 секунд): мапа з твоєю рамкою, дошка місця, прокручування design_doc.md і L_District з повітря. Перевірка: кліп лежить у папці Work за сьогодні."}, "lesson": 1}, {"text": {"en": "Click Copy the day report, paste it into a new tutor chat, answer its questions and save its answer as summary.md. Check: summary.md is in today's Work folder with Made, To look at, Hours and To revisit filled in.", "uk": "Клацни Copy the day report (скопіювати звіт дня), встав у новий чат із тьютором, дай відповіді на його запитання й збережи його відповідь як summary.md. Перевірка: summary.md лежить у папці Work за сьогодні, а Made, To look at, Hours і To revisit заповнені."}, "lesson": 1}], "assets": ["techart/design-doc-template.md", "techart/street-dimensions.md", "techart/standards-sheet.md", "world/credits-template.md"]}, "lessons": [{"title": {"en": "Why a design document", "uk": "Навіщо проєктний документ"}, "minutes": 40, "goals": [{"en": "Explain a design document: one page that says what a tool does, what goes in and out, how it works, its limits, its milestones and what 'done' means, written before building.", "uk": "Поясни, що таке проєктний документ: одна сторінка, що каже, що робить інструмент, що в нього входить і виходить, як він працює, які в нього обмеження, віхи й що означає «готово»; пишеться до початку роботи."}, {"en": "Read design-doc-template.md section by section and say what each one prevents.", "uk": "Прочитай design-doc-template.md розділ за розділом і скажи, від чого застерігає кожен із них."}, {"en": "Write the first two sentences of yours.", "uk": "Напиши перші два речення свого документа."}], "doalong": [{"en": "Open design-doc-template.md from today's assets and read its nine sections. You see a one-page plan, from 'what it does' to 'done means'.", "uk": "Відкрий design-doc-template.md із сьогоднішніх асетів і прочитай його дев'ять розділів. Ти бачиш план на одну сторінку, від «що він робить» до «готово означає»."}, {"en": "Copy it as design_doc.md into today's Work folder and write section 1 in two sentences, for example: 'Builds a 200 x 200 m district from a road layout taken from a real place, a rule set and a seed. It keeps flight corridors clear and holds 60 fps.' You see your goal in plain words.", "uk": "Скопіюй його як design_doc.md у папку Work за сьогодні й напиши розділ 1 у двох реченнях, наприклад: «Будує район 200 x 200 м за планом вулиць реального місця, набором правил і зерном. Тримає польотні коридори вільними й видає 60 fps». Ти бачиш свою мету простими словами."}, {"en": "Open your Day 90 quarter_plan.md: which of its rules belong in the doc (a landmark seen from every street end, heights rising from the shore, flyable gaps)? Copy them under 'done means' as lines you can check. You see your earlier rules become tests.", "uk": "Відкрий свій quarter_plan.md із Дня 90: які з його правил належать до документа (орієнтир, видимий із кожного кінця вулиці, висоти, що зростають від берега, прохідні проміжки для польоту)? Скопіюй їх під «готово означає» як рядки, які можна перевірити. Ти бачиш, як твої попередні правила стають тестами."}, {"en": "With the tutor, list three things the District Generator will not do (for example hills, bridges, interiors) and write them under Limits. You see the doc protect your five days.", "uk": "Разом із тьютором перелічи три речі, яких Генератор району не робитиме (наприклад, пагорби, мости, інтер'єри), і запиши їх під Limits. Ти бачиш, як документ береже твої п'ять днів."}], "play": {"en": "Spot the vague line: the tutor shows me six design-doc lines ('it should look nice'; 'Seed: Integer, 1 to 9999, default 1'; 'roads from somewhere'; 'average frame under 16.6 ms on the route'; 'lots of buildings'; 'done when it feels finished'). I mark each checkable or vague, and rewrite the vague ones.", "uk": "Знайди нечіткий рядок: тьютор показує мені шість рядків проєктного документа («має гарно виглядати»; «Seed: Integer, від 1 до 9999, типово 1»; «дороги звідкись»; «середній кадр менше 16.6 мс на маршруті»; «багато будівель»; «готово, коли здається завершеним»). Я позначаю кожен як перевірюваний або нечіткий і переписую нечіткі."}, "video": {"search": "technical design document for game tools how to write"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Why a design document (Day 101, lesson 1 of 4).\nToday's build: design_doc.md for the District Generator, a real place chosen on OpenStreetMap (about 200 x 200 m), place_board.png, and L_District, the empty capstone level in /TechTools/District.\n\nBy the end of this lesson I can:\n1. Explain a design document: one page that says what a tool does, what goes in and out, how it works, its limits, its milestones and what 'done' means, written before building.\n2. Read design-doc-template.md section by section and say what each one prevents.\n3. Write the first two sentences of yours.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (You have a performance toolkit and TechTools, a tested plugin in Git that rebuilds a district in a fresh project.), what I will learn today (You start the capstone with a design document and a real place, so the next nine days have a clear target.), encourage me (A first draft is meant to be rough; write it quickly, then let the tutor help you make it sharp.), and share today's quote: \"Almost all good writing begins with terrible first efforts.\" (Anne Lamott).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 98: Which three things must a readable error message name? | Day 94: What does MF_TopDust use to find surfaces that face up?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Spot the vague line: the tutor shows me six design-doc lines ('it should look nice'; 'Seed: Integer, 1 to 9999, default 1'; 'roads from somewhere'; 'average frame under 16.6 ms on the route'; 'lots of buildings'; 'done when it feels finished'). I mark each checkable or vague, and rewrite the vague ones.\n6. Do-along on today's build (The real place, the licence and the design document's first sections (built in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Open design-doc-template.md from today's assets and read its nine sections. You see a one-page plan, from 'what it does' to 'done means'.\n   - Copy it as design_doc.md into today's Work folder and write section 1 in two sentences, for example: 'Builds a 200 x 200 m district from a road layout taken from a real place, a rule set and a seed. It keeps flight corridors clear and holds 60 fps.' You see your goal in plain words.\n   - Open your Day 90 quarter_plan.md: which of its rules belong in the doc (a landmark seen from every street end, heights rising from the shore, flyable gaps)? Copy them under 'done means' as lines you can check. You see your earlier rules become tests.\n   - With the tutor, list three things the District Generator will not do (for example hills, bridges, interiors) and write them under Limits. You see the doc protect your five days.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Choosing a real place on OpenStreetMap", "uk": "Вибір реального місця на OpenStreetMap"}, "minutes": 40, "goals": [{"en": "Use openstreetmap.org to find a real quarter of about 200 x 200 m with the parts a good district needs.", "uk": "Скористайся openstreetmap.org, щоб знайти справжній квартал приблизно 200 x 200 м із частинами, які потрібні гарному району."}, {"en": "Know the licence: OpenStreetMap data is open (ODbL) and every use needs the credit '© OpenStreetMap contributors'.", "uk": "Знай ліцензію: дані OpenStreetMap відкриті (ODbL), і кожне використання потребує зазначення «© OpenStreetMap contributors»."}, {"en": "Collect reference photos from Wikimedia Commons with their authors and licences.", "uk": "Збери референсні фото з Wikimedia Commons разом з їхніми авторами та ліцензіями."}], "doalong": [{"en": "Open openstreetmap.org and search for a small coastal or riverside town you like. Zoom in until single buildings show. You see streets, buildings, a coastline and named places.", "uk": "Відкрий openstreetmap.org і знайди невелике прибережне містечко або містечко на річці, яке тобі подобається. Збільшуй, доки не з'являться окремі будівлі. Ти бачиш вулиці, будівлі, берегову лінію та названі місця."}, {"en": "Find a box of about 200 x 200 m with a main street, two or more side streets, a waterfront, a landmark and a square or park; measure it against the scale bar at the bottom left. You see your district's real footprint.", "uk": "Знайди рамку приблизно 200 x 200 м із головною вулицею, двома чи більше бічними вулицями, набережною, орієнтиром і площею чи парком; виміряй її за масштабною лінійкою внизу ліворуч. Ти бачиш реальну площу свого району."}, {"en": "Right-click the box's top-left corner and choose Show address: the search box at the top left fills with that point's latitude and longitude (or choose Centre map here and read the two numbers after #map=NN/ in the address bar). Write them down; do the same for the bottom-right corner. You see the four numbers you will use tomorrow.", "uk": "Клацни правою кнопкою на лівий верхній кут рамки й вибери Show address: поле пошуку вгорі ліворуч заповниться широтою й довготою цієї точки (або вибери Centre map here і прочитай два числа після #map=NN/ в адресному рядку). Запиши їх; зроби те саме для правого нижнього кута. Ти бачиш чотири числа, які використаєш завтра."}, {"en": "Open openstreetmap.org/copyright and read its first paragraph. Copy credits-template.md from today's assets into IslandCourse/Plugins/TechTools as CREDITS.md (the plugin's own credits file, beside README.md), move in any credits from README's Credits section, and add: 'Map data © OpenStreetMap contributors, Open Database License (ODbL), openstreetmap.org/copyright'. You see the capstone's first credit.", "uk": "Відкрий openstreetmap.org/copyright і прочитай його перший абзац. Скопіюй credits-template.md із сьогоднішніх асетів в IslandCourse/Plugins/TechTools як CREDITS.md (власний файл подяк плагіна, поруч із README.md), перенеси туди подяки з розділу Credits у README і додай: «Map data © OpenStreetMap contributors, Open Database License (ODbL), openstreetmap.org/copyright». Ти бачиш першу подяку випускного проєкту."}, {"en": "On commons.wikimedia.org search the town's name and pick three photos (a street, the waterfront, the landmark) whose licence is CC0, CC BY or CC BY-SA (never 'all rights reserved' or non-commercial); note each one's author, licence and link in CREDITS.md. You see your reference set.", "uk": "На commons.wikimedia.org знайди назву міста й обери три фото (вулиця, набережна, орієнтир), ліцензія яких CC0, CC BY або CC BY-SA (ніколи «всі права захищено» чи некомерційна); запиши автора, ліцензію та посилання кожного в CREDITS.md. Ти бачиш свій референсний набір."}], "play": {"en": "Good box or not: the tutor describes four 200 m boxes (only a motorway junction; a grid of identical blocks with no landmark; an old harbour quarter with a church, a square and a promenade; half sea and half car park). I say which makes the best district and what each other one lacks.", "uk": "Вдала рамка чи ні: тьютор описує чотири рамки 200 м (лише розв'язка автомагістралі; сітка однакових кварталів без орієнтира; старий квартал порту з церквою, площею та набережною; половина моря, половина парковки). Я кажу, яка з них дасть найкращий район і чого бракує кожній з решти."}, "video": {"search": "openstreetmap beginner guide browse map"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Choosing a real place on OpenStreetMap (Day 101, lesson 2 of 4).\nToday's build: design_doc.md for the District Generator, a real place chosen on OpenStreetMap (about 200 x 200 m), place_board.png, and L_District, the empty capstone level in /TechTools/District.\nEarlier today I already did: lesson 1 (Why a design document). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Use openstreetmap.org to find a real quarter of about 200 x 200 m with the parts a good district needs.\n2. Know the licence: OpenStreetMap data is open (ODbL) and every use needs the credit '© OpenStreetMap contributors'.\n3. Collect reference photos from Wikimedia Commons with their authors and licences.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Good box or not: the tutor describes four 200 m boxes (only a motorway junction; a grid of identical blocks with no landmark; an old harbour quarter with a church, a square and a promenade; half sea and half car park). I say which makes the best district and what each other one lacks.\n4. Do-along on today's build (The real place, the licence and the design document's first sections (built in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Open openstreetmap.org and search for a small coastal or riverside town you like. Zoom in until single buildings show. You see streets, buildings, a coastline and named places.\n   - Find a box of about 200 x 200 m with a main street, two or more side streets, a waterfront, a landmark and a square or park; measure it against the scale bar at the bottom left. You see your district's real footprint.\n   - Right-click the box's top-left corner and choose Show address: the search box at the top left fills with that point's latitude and longitude (or choose Centre map here and read the two numbers after #map=NN/ in the address bar). Write them down; do the same for the bottom-right corner. You see the four numbers you will use tomorrow.\n   - Open openstreetmap.org/copyright and read its first paragraph. Copy credits-template.md from today's assets into IslandCourse/Plugins/TechTools as CREDITS.md (the plugin's own credits file, beside README.md), move in any credits from README's Credits section, and add: 'Map data © OpenStreetMap contributors, Open Database License (ODbL), openstreetmap.org/copyright'. You see the capstone's first credit.\n   - On commons.wikimedia.org search the town's name and pick three photos (a street, the waterfront, the landmark) whose licence is CC0, CC BY or CC BY-SA (never 'all rights reserved' or non-commercial); note each one's author, licence and link in CREDITS.md. You see your reference set.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Inputs, outputs and data formats", "uk": "Вхідні дані, вихідні дані та формати даних"}, "minutes": 40, "goals": [{"en": "Decide each input's form: the street plan as a CSV with one row per road point, the zones in a rules data asset, and a seed.", "uk": "Визнач форму кожного входу: план вулиць як CSV з одним рядком на точку дороги, зони в асеті даних правил і зерно."}, {"en": "Estimate the outputs with real measures from street-dimensions.md.", "uk": "Оціни виходи за реальними розмірами зі street-dimensions.md."}, {"en": "Write the steps the generator will follow, reusing your town generator's parts.", "uk": "Напиши кроки, яких триматиметься генератор, повторно використовуючи частини твого генератора міста."}], "doalong": [{"en": "Under Inputs fill the table: Road layout, a CSV (district_roads.csv) imported as a Data Table (DT_DistrictRoads), columns Name, Road, Point, X, Y, Width, Kind (the columns of the hand-out road-layout-real-example.csv, plus the Name column a Data Table needs), with Width in metres and X and Y in metres from the district's north-west corner, X towards the east and Y towards the south (the way Unreal's Y runs when X points east), traced from the map extract; Rules, a data asset (DA_TownRules_District) with the zones from the map; Seed, an Integer. You see the three inputs pinned down.", "uk": "У розділі Inputs заповни таблицю: Road layout, CSV (district_roads.csv), імпортований як Data Table (DT_DistrictRoads), зі стовпцями Name, Road, Point, X, Y, Width, Kind (стовпці роздатки road-layout-real-example.csv плюс стовпець Name, потрібний Data Table), де Width у метрах, а X і Y у метрах від північно-західного кута району, X на схід, а Y на південь (так, як іде Y в Unreal, коли X дивиться на схід), змальовані з вибірки мапи; Rules, асет даних (DA_TownRules_District) із зонами з мапи; Seed, Integer. Ти бачиш три входи, визначені остаточно."}, {"en": "Open street-dimensions.md and write the measures you will use: main street and lane widths, pavement widths, plot widths and floor heights. With them estimate the outputs: the roads and junctions you count in your box, and the houses that fit (the length of street fronts on both sides divided by the plot width). You see rough counts under Outputs.", "uk": "Відкрий street-dimensions.md і запиши розміри, які використаєш: ширина головних вулиць і провулків, ширина тротуарів, ширина ділянок і висота поверхів. З ними оціни виходи: дороги й перехрестя, які є у твоїй рамці, і будинки, що поміщаються (довжина вуличних фронтів з обох боків, поділена на ширину ділянки). Ти бачиш приблизні кількості в розділі Outputs."}, {"en": "Under How it works write the steps: read the table; spawn the roads; place a junction where roads meet; make plots along every road; apply the plot rules (Apply Plot Rules, Day 99); spawn the houses and the landmark; dress with PCG; check. You see a plan that reuses most of BP_TownGenerator.", "uk": "У розділі How it works напиши кроки: прочитати таблицю; створити дороги; поставити перехрестя там, де дороги сходяться; зробити ділянки вздовж кожної дороги; застосувати правила ділянок (Apply Plot Rules, День 99); створити будинки та орієнтир; оздобити через PCG; перевірити. Ти бачиш план, що повторно використовує більшу частину BP_TownGenerator."}, {"en": "Under Settings list Seed, Roads Table, Rules, Dresser, Keep Outs and Green Zones, each with a unit, a range and a default. You see what a user will find in Details.", "uk": "У розділі Settings перелічи Seed, Roads Table, Rules, Dresser, Keep Outs і Green Zones, кожне з одиницею, діапазоном і типовим значенням. Ти бачиш, що користувач знайде в Details."}], "play": {"en": "Map, rules or seed: the tutor names eight things (the curve of the main street; the plot width; where the church stands; the share of empty plots; which side the sea is on; the road width; the corridor along the waterfront; which house gets which colour). For each I say whether it comes from the map extract, the rules asset or the seed.", "uk": "Мапа, правила чи зерно: тьютор називає вісім речей (вигин головної вулиці; ширина ділянки; де стоїть церква; частка порожніх ділянок; з якого боку море; ширина дороги; коридор уздовж набережної; який будинок якого кольору). Для кожної я кажу, чи вона береться з вибірки мапи, з асета правил чи із зерна."}, "video": {"search": "procedural city generation road network data driven inputs"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Inputs, outputs and data formats (Day 101, lesson 3 of 4).\nToday's build: design_doc.md for the District Generator, a real place chosen on OpenStreetMap (about 200 x 200 m), place_board.png, and L_District, the empty capstone level in /TechTools/District.\nEarlier today I already did: lesson 1 (Why a design document); lesson 2 (Choosing a real place on OpenStreetMap). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Decide each input's form: the street plan as a CSV with one row per road point, the zones in a rules data asset, and a seed.\n2. Estimate the outputs with real measures from street-dimensions.md.\n3. Write the steps the generator will follow, reusing your town generator's parts.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Map, rules or seed: the tutor names eight things (the curve of the main street; the plot width; where the church stands; the share of empty plots; which side the sea is on; the road width; the corridor along the waterfront; which house gets which colour). For each I say whether it comes from the map extract, the rules asset or the seed.\n4. Do-along on today's build (The real place, the licence and the design document's first sections (built in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Under Inputs fill the table: Road layout, a CSV (district_roads.csv) imported as a Data Table (DT_DistrictRoads), columns Name, Road, Point, X, Y, Width, Kind (the columns of the hand-out road-layout-real-example.csv, plus the Name column a Data Table needs), with Width in metres and X and Y in metres from the district's north-west corner, X towards the east and Y towards the south (the way Unreal's Y runs when X points east), traced from the map extract; Rules, a data asset (DA_TownRules_District) with the zones from the map; Seed, an Integer. You see the three inputs pinned down.\n   - Open street-dimensions.md and write the measures you will use: main street and lane widths, pavement widths, plot widths and floor heights. With them estimate the outputs: the roads and junctions you count in your box, and the houses that fit (the length of street fronts on both sides divided by the plot width). You see rough counts under Outputs.\n   - Under How it works write the steps: read the table; spawn the roads; place a junction where roads meet; make plots along every road; apply the plot rules (Apply Plot Rules, Day 99); spawn the houses and the landmark; dress with PCG; check. You see a plan that reuses most of BP_TownGenerator.\n   - Under Settings list Seed, Roads Table, Rules, Dresser, Keep Outs and Green Zones, each with a unit, a range and a default. You see what a user will find in Details.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Milestones, risks and done means", "uk": "Віхи, ризики та «готово означає»"}, "minutes": 40, "goals": [{"en": "Plan one checkable milestone per day from 102 to 110.", "uk": "Сплануй одну перевірювану віху на кожен день зі 102 по 110."}, {"en": "Name the risks with a fallback for each.", "uk": "Назви ризики із запасним варіантом для кожного."}, {"en": "Set up L_District inside the plugin, ready for tomorrow's inputs.", "uk": "Налаштуй L_District усередині плагіна, готовий до завтрашніх вхідних даних."}], "doalong": [{"en": "Under Milestones write one row per day: 102 inputs from the map (the preview matches the map); 103 roads, plots and houses; 104 dressing, parks and corridors; 105 the whole district from one seed; 106 polish; 107 validation; 108 importable; 109 demo; 110 hand-over. Add how you will check each. You see your next nine days.", "uk": "У розділі Milestones напиши по рядку на день: 102 вхідні дані з мапи (попередній перегляд збігається з мапою); 103 дороги, ділянки та будинки; 104 оздоблення, парки й коридори; 105 увесь район з одного зерна; 106 доведення; 107 перевірка; 108 можна імпортувати; 109 демо; 110 передача. Додай, як ти перевірятимеш кожну. Ти бачиш свої наступні дев'ять днів."}, {"en": "Under Limits and risks write three risks, each with a fallback: curved roads (plots placed along each road's own spline); junctions where streets meet at odd angles (raised paved junction tables, as many old towns have); performance (the Day 95 method on a district route). You see problems answered before they arrive.", "uk": "У розділі Limits and risks запиши три ризики, кожен із запасним варіантом: криві дороги (ділянки розміщуються вздовж власного сплайна кожної дороги); перехрестя, де вулиці сходяться під дивними кутами (піднесені вимощені майданчики перехресть, як у багатьох старих містах); продуктивність (метод Дня 95 на маршруті районом). Ти бачиш проблеми, на які є відповідь, ще до того, як вони з'являться."}, {"en": "In the Content Browser make /TechTools/District, then File > New Level > Basic and save it there as L_District. Replace the floor with a Cube slab (Location 10000, 10000, -50; Scale 300, 300, 1), set GameMode Override to GameModeBase and put a Player Start 30 m up. You see the empty capstone stage.", "uk": "У Content Browser створи /TechTools/District, потім File > New Level > Basic і збережи його там як L_District. Заміни підлогу плитою з куба (Location 10000, 10000, -50; Scale 300, 300, 1), постав GameMode Override на GameModeBase і розмісти Player Start на висоті 30 м. Ти бачиш порожню сцену випускного проєкту."}, {"en": "Mark the district with four thin cubes along the edges of the square from 0, 0 to 20000, 20000: north edge Location 10000, 0, 10 and south edge 10000, 20000, 10, both Scale 200, 0.2, 0.2; west edge 0, 10000, 10 and east edge 20000, 10000, 10, both Scale 0.2, 200, 0.2 (the basic cube is 1 m, so 200 makes 200 m). You see the 200 m box you will fill, with its north-west corner at the world origin.", "uk": "Познач район чотирма тонкими кубами вздовж країв квадрата від 0, 0 до 20000, 20000: північний край Location 10000, 0, 10 і південний край 10000, 20000, 10, обидва Scale 200, 0.2, 0.2; західний край 0, 10000, 10 і східний край 20000, 10000, 10, обидва Scale 0.2, 200, 0.2 (базовий куб має 1 м, тож 200 дає 200 м). Ти бачиш рамку 200 м, яку заповниш, із північно-західним кутом на початку координат світу."}], "play": {"en": "Too big for five days? The tutor names six wishes (bridges over a river; a landmark built after the real one; interiors for every shop; parks from the map; traffic that moves; a second real place). For each I say in, later or not for this capstone, and why.", "uk": "Завелике для п'яти днів? Тьютор називає шість побажань (мости через річку; орієнтир, збудований після справжнього; інтер'єри для кожної крамниці; парки з мапи; рухомий транспорт; друге реальне місце). Для кожного я кажу: входить, пізніше чи не для цього випускного проєкту, і чому."}, "video": {"search": "game development milestones scope planning"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Milestones, risks and done means (Day 101, lesson 4 of 4).\nToday's build: design_doc.md for the District Generator, a real place chosen on OpenStreetMap (about 200 x 200 m), place_board.png, and L_District, the empty capstone level in /TechTools/District.\nEarlier today I already did: lesson 1 (Why a design document); lesson 2 (Choosing a real place on OpenStreetMap); lesson 3 (Inputs, outputs and data formats). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Plan one checkable milestone per day from 102 to 110.\n2. Name the risks with a fallback for each.\n3. Set up L_District inside the plugin, ready for tomorrow's inputs.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Too big for five days? The tutor names six wishes (bridges over a river; a landmark built after the real one; interiors for every shop; parks from the map; traffic that moves; a second real place). For each I say in, later or not for this capstone, and why.\n4. Do-along on today's build (The real place, the licence and the design document's first sections (built in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Under Milestones write one row per day: 102 inputs from the map (the preview matches the map); 103 roads, plots and houses; 104 dressing, parks and corridors; 105 the whole district from one seed; 106 polish; 107 validation; 108 importable; 109 demo; 110 hand-over. Add how you will check each. You see your next nine days.\n   - Under Limits and risks write three risks, each with a fallback: curved roads (plots placed along each road's own spline); junctions where streets meet at odd angles (raised paved junction tables, as many old towns have); performance (the Day 95 method on a district route). You see problems answered before they arrive.\n   - In the Content Browser make /TechTools/District, then File > New Level > Basic and save it there as L_District. Replace the floor with a Cube slab (Location 10000, 10000, -50; Scale 300, 300, 1), set GameMode Override to GameModeBase and put a Player Start 30 m up. You see the empty capstone stage.\n   - Mark the district with four thin cubes along the edges of the square from 0, 0 to 20000, 20000: north edge Location 10000, 0, 10 and south edge 10000, 20000, 10, both Scale 200, 0.2, 0.2; west edge 0, 10000, 10 and east edge 20000, 10000, 10, both Scale 0.2, 200, 0.2 (the basic cube is 1 m, so 200 makes 200 m). You see the 200 m box you will fill, with its north-west corner at the world origin.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "design_doc.md (every section filled, the cut item and its reason)", "uk": "design_doc.md (усі розділи заповнені, вилучена річ і її причина)"}, {"en": "map_box.png and place_board.png (with the OpenStreetMap credit), and the three photos credited in CREDITS.md", "uk": "map_box.png і place_board.png (із зазначенням OpenStreetMap) та три фото із зазначенням у CREDITS.md"}, {"en": "clip_day101.mp4 (60 seconds: map, board, document, L_District)", "uk": "clip_day101.mp4 (60 секунд: мапа, дошка, документ, L_District)"}, {"en": "summary.md", "uk": "звіт дня (summary.md)"}], "goal": {"en": "By the end of today you have design_doc.md for your District Generator, filled in from design-doc-template.md, a real 200 x 200 m place chosen on OpenStreetMap with its licence noted, place_board.png with the map box and three reference photos, and L_District, the empty capstone level inside your plugin.", "uk": "До кінця сьогодні ти маєш design_doc.md для свого Генератора району, заповнений за design-doc-template.md; реальне місце 200 x 200 м, обране на OpenStreetMap, із записаною ліцензією; place_board.png із рамкою мапи та трьома референсними фото; і L_District, порожній рівень випускного проєкту всередині твого плагіна."}, "uses": [{"en": "Days 87 to 90: BP_TownGenerator, DA_RoadLayout, DA_TownRules, Check Town and quarter_plan.md", "uk": "Дні 87-90: BP_TownGenerator, DA_RoadLayout, DA_TownRules, Check Town і quarter_plan.md"}, {"en": "Day 99: Apply Plot Rules", "uk": "День 99: Apply Plot Rules"}, {"en": "Days 97 and 98: the TechTools plugin and its README (with its Credits section)", "uk": "Дні 97 і 98: плагін TechTools і його README (із розділом Credits)"}, {"en": "Day 95: the performance report and the budget", "uk": "День 95: звіт про продуктивність і бюджет"}, {"en": "Day 81: street-dimensions.md", "uk": "День 81: street-dimensions.md"}], "quiz": [{"q": {"en": "What is a design document for a tool?", "uk": "Що таке проєктний документ для інструмента?"}, "options": [{"en": "One page that says what the tool does, its inputs and outputs, how it works, its limits, milestones and what 'done' means, written before building", "uk": "Одна сторінка, що каже, що робить інструмент, які в нього входи й виходи, як він працює, які в нього обмеження, віхи й що означає «готово»; пишеться до початку роботи"}, {"en": "The README written after release", "uk": "README, написаний після релізу"}, {"en": "A list of bugs", "uk": "Список багів"}, {"en": "A demo video", "uk": "Демовідео"}], "answer": 0, "explain": {"en": "Deciding on paper is cheap; the doc also becomes the checklist you review against on Friday.", "uk": "Вирішувати на папері дешево; документ також стає контрольним списком, за яким ти перевіряєш у п'ятницю."}}, {"q": {"en": "Your doc says 'it should look nice'. What do you do with that line?", "uk": "У твоєму документі написано «має гарно виглядати». Що ти робиш із цим рядком?"}, "options": [{"en": "Keep it, because everyone agrees", "uk": "Залишаю, бо всі погоджуються"}, {"en": "Rewrite it as checks you can see or measure, such as 'the landmark is visible from every street end'", "uk": "Переписую як перевірки, які можна побачити чи виміряти, наприклад «орієнтир видно з кожного кінця вулиці»"}, {"en": "Delete the whole section", "uk": "Видаляю весь розділ"}, {"en": "Move it to the credits", "uk": "Переношу в подяки"}], "answer": 1, "explain": {"en": "A line nobody can check can never be met; turn it into proofs.", "uk": "Рядок, який ніхто не може перевірити, ніколи не буде виконано; перетвори його на докази."}}, {"q": {"en": "What does OpenStreetMap's licence ask of you?", "uk": "Чого вимагає ліцензія OpenStreetMap?"}, "options": [{"en": "Nothing at all, because the map is free", "uk": "Нічого, бо мапа безкоштовна"}, {"en": "A payment for any game use", "uk": "Оплати за будь-яке використання в іграх"}, {"en": "The credit '© OpenStreetMap contributors' with a link to its copyright page, and the same open licence on map data you derive and share", "uk": "Зазначення «© OpenStreetMap contributors» із посиланням на сторінку авторських прав і тієї ж відкритої ліцензії для похідних даних мапи, якими ти ділишся"}, {"en": "Written permission from every mapper", "uk": "Письмового дозволу від кожного картографа"}], "answer": 2, "explain": {"en": "The data is open under the ODbL: you may use it, with the credit, and derived data you share stays open.", "uk": "Дані відкриті за ODbL: ти можеш їх використовувати, зазначивши авторство, а похідні дані, якими ти ділишся, лишаються відкритими."}}, {"q": {"en": "Your chosen box holds 30 streets and 600 buildings. What does your design doc tell you to do?", "uk": "У твоїй рамці 30 вулиць і 600 будівель. Що каже зробити твій проєктний документ?"}, "options": [{"en": "Build it anyway and work at night", "uk": "Усе одно збудувати й працювати вночі"}, {"en": "Skip the design document", "uk": "Пропустити проєктний документ"}, {"en": "Double the plot width", "uk": "Подвоїти ширину ділянки"}, {"en": "Choose a smaller or simpler box that fits the five days, and write the reason under Limits", "uk": "Обрати меншу або простішу рамку, що вкладається в п'ять днів, і записати причину під Limits"}], "answer": 3, "explain": {"en": "Scope is a design decision; the doc is where you make it, before it costs you days.", "uk": "Обсяг — це проєктне рішення; документ — місце, де ти його ухвалюєш, поки воно не коштувало тобі днів."}}, {"q": {"en": "Why does L_District put the district's north-west corner at 0, 0?", "uk": "Чому L_District ставить північно-західний кут району в 0, 0?"}, "options": [{"en": "So map positions in metres from that corner become Unreal positions by multiplying by 100", "uk": "Щоб позиції на мапі в метрах від цього кута ставали позиціями в Unreal множенням на 100"}, {"en": "Unreal requires every level to start there", "uk": "Unreal вимагає, щоб кожен рівень починався там"}, {"en": "The sun needs it", "uk": "Цього потребує сонце"}, {"en": "HLODs need it", "uk": "Цього потребують HLOD"}], "answer": 0, "explain": {"en": "One shared origin keeps the map, the CSV and the level in the same place without any offsets.", "uk": "Одне спільне начало координат тримає мапу, CSV і рівень в одному місці без жодних зсувів."}}], "weekInfo": null, "morning": {"sofar": {"en": "You have a performance toolkit and TechTools, a tested plugin in Git that rebuilds a district in a fresh project.", "uk": "Ти маєш набір для продуктивності та TechTools, перевірений плагін у Git, що відбудовує район у новому проєкті."}, "today": {"en": "You start the capstone with a design document and a real place, so the next nine days have a clear target.", "uk": "Ти починаєш випускний проєкт із проєктним документом і реальним місцем, тож наступні дев'ять днів мають чітку мету."}, "cheer": {"en": "A first draft is meant to be rough; write it quickly, then let the tutor help you make it sharp.", "uk": "Перша чернетка й має бути грубою; напиши його швидко, а потім дай тьютору допомогти зробити його чітким."}, "quote": {"text": {"en": "Almost all good writing begins with terrible first efforts.", "uk": "Майже все добре письмо починається з жахливих перших спроб."}, "author": {"en": "Anne Lamott", "uk": "Енн Ламотт"}, "source": "Bird by Bird (book), 1994"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-101-capstone-design-document", "mapHref": "../../COURSE.html", "prevHref": "../Day-100-boss-fresh-project-district/START-HERE.html", "nextHref": "../Day-102-osm-inputs-road-layout/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in A web browser (OpenStreetMap, Wikimedia Commons), Krita and Unreal Engine 5.8. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me: when my Blueprint or script fails, ask for the error message or a screenshot of the graph, point to the line or node that is wrong and explain why, then let me fix it myself. Never write the whole tool for me. Keep me moving and make it feel like a game.\n\nToday I build on my own: The rest of the document, the self-review and L_District, on your own.\nIt's part of: design_doc.md for the District Generator, a real place chosen on OpenStreetMap (about 200 x 200 m), place_board.png, and L_District, the empty capstone level in /TechTools/District (design_doc.md and place_board.png in IslandCourse/Plugins/TechTools/Docs (they ship with the plugin); L_District in /TechTools/District; photos and notes in today's Work folder.).\n\nSpec:\n- A real place: a quarter of a real small coastal or riverside town you can see on openstreetmap.org, about 200 x 200 m, with a main street, two or more side streets, a waterfront, one landmark (a church, a tower or a lighthouse) and an open square or park; no private or sensitive site.\n- The licence noted: OpenStreetMap data is open under the Open Database License (ODbL) and needs the credit '© OpenStreetMap contributors' with a link to openstreetmap.org/copyright; the credit written today into the plugin's new CREDITS.md (made from credits-template.md, beside README.md).\n- place_board.png (Krita): the map with your 200 m box drawn on it and the credit on the image, three reference photos of the real place (or a very similar one) from Wikimedia Commons with author, licence and link in CREDITS.md, and five labels: street pattern, landmark, waterfront, square, building heights.\n- design_doc.md with every section of design-doc-template.md: what it does (two sentences); inputs (district_roads.csv from the map, DA_TownRules_District with the zones, a Seed); outputs with rough counts; how it works in steps; settings with ranges and defaults; limits and risks with a fallback each; one milestone per day from 102 to 110 with how you check it; the standards (standards-sheet.md and the budget); and 'done means'.\n- Real measures from street-dimensions.md in the doc: carriageway and pavement widths for main streets and lanes, plot widths and floor heights, in metres.\n- L_District in /TechTools/District (File > New Level > Basic): a 300 m ground slab (Location 10000, 10000, -50; Scale 300, 300, 1), the flying Play set-up, and a 200 x 200 m outline of four thin cubes from 0, 0 to 20000, 20000, so the district's north-west corner sits at the world origin.\n- The doc self-reviewed with the tutor, one thing cut or moved to 'later', and everything committed and pushed.\n\nMy checklist:\n1. Choose the place on openstreetmap.org: a quarter with a main street, side streets, a waterfront, a landmark and a square or park in about 200 x 200 m. Check: you can name all five inside your box, and the town and the box's corner coordinates are in design_doc.md. (from lesson 2)\n2. Hold your box against the map's scale bar. Check: it spans about 200 m, give or take 20 m, both ways. (from lesson 2)\n3. Take map_box.png (the map with your box drawn in Krita) and write '© OpenStreetMap contributors' on it. Check: the credit is readable on the image. (from lesson 2)\n4. Pick three photos of the real place, or a very similar town, on Wikimedia Commons (a street, the waterfront, the landmark). Check: three photos in today's Work folder, each with author, licence and link in CREDITS.md. (from lesson 2)\n5. Make place_board.png in Krita: the map box, the three photos and five labels (street pattern, landmark, waterfront, square, heights). Check: someone could tell what kind of place your district is from the board alone. (from lesson 2)\n6. Fill design_doc.md sections 1 to 3 (what it does, inputs, outputs). Check: each input has a type, an example and where it comes from, and each output has a rough count. (from lesson 3)\n7. Fill sections 4 and 5 (how it works, settings) using street-dimensions.md for the measures. Check: every step is one line, and every setting has a unit, a range and a default. (from lesson 3)\n8. On your own: fill sections 6 to 9 (limits and risks, milestones, standards, done means). Check: one milestone per day from 102 to 110 with how you will check it, and 'done means' lists the proofs (pictures, video, performance report, checker, fresh-project install). (from lesson 4)\n9. On your own: self-review the doc with the tutor. Are the inputs enough to build it? Is any line vague? Is it too big for five days? Cut or move one thing to 'later'. Check: the change and its reason are written in the doc. (from lesson 4)\n10. On your own: make L_District in /TechTools/District with the ground slab, the flying Play set-up and the 200 x 200 m outline from 0, 0. Check: from 120 m in Play you see the outline lying on the slab. (from lesson 4)\n11. Save design_doc.md and place_board.png into Plugins/TechTools/Docs, then commit and push ('Capstone: design document and L_District'). Check: GitHub shows both files in Docs and the OpenStreetMap credit in CREDITS.md. (from day 96, lesson 4)\n12. Record clip_day101.mp4 (60 seconds): the map with your box, the place board, a scroll through design_doc.md, and L_District from the air. Check: the clip is in today's Work folder. (from lesson 1)\n13. Click Copy the day report, paste it into a new tutor chat, answer its questions and save its answer as summary.md. Check: summary.md is in today's Work folder with Made, To look at, Hours and To revisit filled in. (from lesson 1)\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Misha\nDay 101: Capstone: the design document and a real place. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

function quiz(){if(!D.quiz||!D.quiz.length)return '';const a=st.qa||{};let ok=0;const L=u('letters');
 const pips='<div class="pips well" aria-hidden="true">'+D.quiz.map((q,i)=>'<i class="'+(a[i]==null?'':a[i]===q.answer?'r':'w')+'"></i>').join('')+'</div>';
 const qs=D.quiz.map((q,i)=>{const c=a[i];if(c===q.answer)ok++;return '<div class="qz"><p class="qq"><span class="qn">'+(i+1)+'</span><span>'+lk(x(q.q))+'</span></p>'+q.options.map((o,k)=>{let cls='opt',mk='<span></span>';if(c!=null){if(k===q.answer){cls+=' right';mk=ic('check','mk')}else if(k===c){cls+=' wrong';mk=ic('x','mk')}}return '<button class="'+cls+'" id="o'+i+'_'+k+'"'+(c!=null?' disabled':'')+' onclick="pick('+i+','+k+')"><span class="lt">'+(L[k]||k+1)+'</span><span>'+esc(x(o))+'</span>'+mk+'</button>'}).join('')+(c!=null?'<p class="exp '+(c===q.answer?'r':'w')+'" id="e'+i+'" tabindex="-1"><b>'+(c===q.answer?u('right'):u('wrong'))+'</b>'+lk(x(q.explain))+'</p>':'')+'</div>'}).join('');
 return '<section class="card glass quiz">'+lab(u('quiz'),'gold')+'<p class="muted" style="margin:-6px 0 14px">'+u('quizSub')+'</p>'+pips+qs+(qDone()?'<div class="score well" role="status"><span class="eyebrow">'+u('score')+'</span><span class="lcd" aria-label="'+ok+' / '+D.quiz.length+'">'+seg(ok+'/'+D.quiz.length)+'</span><div class="row"><button class="btn ghost" id="retry" onclick="retry()">'+u('retry')+'</button></div></div>':'')+'</section>'}
function vid(v){if(!v)return '';const link=v.url?'<a href="'+esc(v.url)+'" target="_blank" rel="noopener">'+esc(x(v.title)||v.url)+'</a>'+(v.channel?' <span class="muted">· '+esc(v.channel)+(v.length?' · '+esc(v.length):'')+'</span>':''):'';const s=v.search?'<a href="https://www.youtube.com/results?search_query='+encodeURIComponent(v.search)+'" target="_blank" rel="noopener">'+u('noVid')+': '+esc(v.search)+'</a>':'';const alt=v.alt&&v.alt.url?'<br><span class="eyebrow">UA</span> <a href="'+esc(v.alt.url)+'" target="_blank" rel="noopener">'+esc(v.alt.title||v.alt.url)+'</a>'+(v.alt.channel?' <span class="muted">· '+esc(v.alt.channel)+'</span>':''):'';return '<div class="vid well">'+kn('play')+'<div><b>'+u('more')+'?</b><br>'+(link||s)+alt+(link&&s?'<br><span class="muted" style="font-size:14px">'+s+'</span>':'')+'</div></div>'}
function morning(){const m=D.morning;if(!m)return '';const q=m.quote||{};
 let shelf='';if(D.day>0){shelf='<div class="shelf" aria-hidden="true">';let g='';for(let d=0;d<D.day;d++){let p=0;try{p=(JSON.parse(localStorage.getItem('devteam:'+D.learner+':'+d))||{}).pct||0}catch(e){}g+='<i class="'+(p>=1?'d':'')+(d>0&&d%5===0?' bs':'')+'"></i>';if(d%5===0||d===D.day-1){shelf+='<span class="wkg">'+g+'</span>';g=''}}shelf+='</div>'}
 const qt=lang==='uk'&&q.original?q.original:x(q.text);
 return '<section class="card glass morning"><div class="mgrid">'+(m.sofar?'<div>'+lab(u('sofar'),'gold')+shelf+'<p class="mtxt">'+lk(x(m.sofar))+'</p></div>':'')+(m.today?'<div>'+lab(u('todayL'))+'<p class="mtxt">'+lk(x(m.today))+'</p></div>':'')+'</div>'+(m.cheer?'<p class="cheer">'+esc(x(m.cheer))+'</p>':'')+(qt?'<figure class="quote well">'+kn('quote')+'<blockquote>'+esc(qt)+'</blockquote>'+(q.author?'<figcaption>'+esc(x(q.author))+'</figcaption>':'')+'</figure>':'')+'</section>'}
function setLang(l){lang=l;try{localStorage.setItem('devteam:lang',lang)}catch(e){};render()}
function toggleLang(){setLang(lang==='uk'?'en':'uk')}
/* keep open sections and keyboard focus across re-renders */
const openD=new Set();
function tg(e){if(e.open)openD.add(e.id);else openD.delete(e.id)}
const op=id=>openD.has(id)?' open':'';
function render(){const ae=document.activeElement,fid=ae&&(ae.id||(ae.getAttribute('data-th')?'th-'+ae.getAttribute('data-th'):ae.getAttribute('lang')&&ae.closest('.seg')?'lg-'+ae.getAttribute('lang'):''));
 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);
 const b=D.build,P=Math.round(prog()*100);
 document.getElementById('top').innerHTML='<div class="topin glass"><a class="maplink" href="'+esc(D.mapHref)+'">'+kn('map')+u('map')+'</a><div class="crumb"><b>'+esc(x(D.learnerName))+'</b><span>'+u('week')+' '+D.week+'</span><span>'+u('day')+' '+D.day+' '+u('of')+' '+D.total+'</span></div>'+controls(lang,'setLang')+'</div><div class="tline"><i style="width:'+P+'%"></i></div>';
 const state=w=>w<D.week?'b':w===D.week?'n':'p';
 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 if(D.weekInfo){const w=D.weekInfo;h+='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}
 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p><div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+list(D.handin,'ul','ticks')+'<p class="path">'+ic('folder')+'<span>'+u('shipTo')+' <code>'+esc(D.workPath)+'</code></span></p>'+(D.lessons.length?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<p class="muted">'+u('report')+'</p><div class="row"><button class="btn s" onclick="cp(D.reportPrompt)">'+ic('copy')+u('copyR')+'</button></div></section>';
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();
</script>
</body>
</html>

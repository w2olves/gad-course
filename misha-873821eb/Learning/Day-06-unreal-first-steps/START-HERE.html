<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 6</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

details{margin-top:22px;border-radius:20px;background:var(--well);box-shadow:var(--press);padding:0 18px}

.build.bossday{border-color:rgba(255,95,168,.35)}

.medal{display:flex;align-items:center;gap:10px;margin:0 0 8px;font:700 11.5px/1 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}

.check li:last-child label{border-bottom:0}

.check input{appearance:none;-webkit-appearance:none;width:26px;height:26px;margin:1px 0 0;border-radius:9px;background:var(--well);box-shadow:var(--press);display:grid;place-items:center;cursor:pointer;transition:background .2s,box-shadow .2s}

.check li.on .tx{color:var(--faint)}
.check .ln{font:600 10.5px/1.3 var(--head);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);white-space:nowrap;margin-top:5px;padding:4px 9px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
/* quiz */

.qz{margin:28px 0 0;padding:28px 0 0;border-top:1px solid var(--line)}

.qq .qn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 13px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.opt{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;width:calc(100% - 50px);margin:12px 0 12px 50px;text-align:left;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid transparent;border-radius:18px;padding:11px 16px;cursor:pointer;box-shadow:var(--raiseS);transition:box-shadow .2s,transform .15s}

l > Basic; в Unreal 4.27 — Default), збережений у Course/Day06."}, {"en": "Folders Course/Day06/Meshes and Course/Day06/Materials; nothing of yours loose in the Content folder.", "uk": "Папки Course/Day06/Meshes і Course/Day06/Materials. Жодного твого асета просто в папці Content."}, {"en": "Names with the industry prefixes: SM_ for static meshes, M_ for materials, MI_ for material instances, T_ for textures, L_ for levels.", "uk": "Назви з галузевими префіксами: SM_ для статичних мешів, M_ для матеріалів, MI_ для інстансів матеріалів, T_ для текстур, L_ для рівнів."}, {"en": "A practice street from basic-shape cubes: a pavement 20 m long, 3 m wide and 0.15 m high, and a road beside it, typed to exact Location and Scale.", "uk": "Тренувальна вулиця з кубів базових форм: тротуар 20 м завдовжки, 3 м завширшки й 0,15 м заввишки та дорога поруч. Location і Scale введено точно."}, {"en": "Props at the placement list's points (metres x 100 = Unreal centimetres): five bollards 1.5 m apart along the kerb, two lamp posts 8 m apart, two benches, two bins and the railing section, each dropped onto the pavement with End.", "uk": "Пропси стоять у точках зі списку розміщення (метри × 100 = сантиметри Unreal): п'ять стовпчиків через 1,5 м уздовж бордюру, два ліхтарні стовпи на відстані 8 м, дві лавки, дві урни й секція поруччя. Кожен пропс опущено на тротуар клавішею End."}, {"en": "SM_RailingSection imported from a clean FBX with UCX boxes into Course/Day06/Meshes, and import_checklist.md written (with the Build Nanite line).", "uk": "SM_RailingSection імпортовано з чистого FBX із блоками UCX у Course/Day06/Meshes, а import_checklist.md написано (з рядком про Build Nanite)."}, {"en": "An Outliner folder named Street, and five camera bookmarks (Ctrl+1 to Ctrl+5).", "uk": "Папка Outliner з назвою Street і п'ять закладок камери (Ctrl+1 – Ctrl+5)."}], "piece1": "the pavement and the first bollards (in the lessons)", "piece2": {"en": "The rest of the street, placed from the list, on your own", "uk": "Решта вулиці, розставлена за списком, самостійно"}, "steps": [{"text": {"en": "Check: the files from today's lessons are in the day work folder (SM_RailingSection.fbx and import_checklist.md), and Unreal has L_Day06 with the pavement and five bollards and the folders Course/Day06/Meshes and /Materials. Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it. Older Unreal (4.27) or weak PC: every step works on 4.27; see Weak PC on ACCOUNTS-AND-INSTALLS.html.", "uk": "Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: SM_RailingSection.fbx і import_checklist.md, а в Unreal є L_Day06 із тротуаром і п'ятьма стовпчиками й папки Course/Day06/Meshes і /Materials. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Старіший Unreal (4.27) або слабкий ПК: кожен крок працює в 4.27; див. розділ «Слабкий ПК» на сторінці ACCOUNTS-AND-INSTALLS.html."}, "lesson": 4}, {"text": {"en": "Road: drag another Cube from Place Actors > Shapes, name it Road, and type Location X 1000, Y -300, Z 1 and Scale 20, 6, 0.02. It is 2 cm thick, so it doesn't flicker against the floor. Check: from a low view the pavement stands about 13 cm above the road, like a kerb.", "uk": "Дорога: перетягни ще один Cube з Place Actors > Shapes, назви його Road і введи Location X 1000, Y -300, Z 1 і Scale 20, 6, 0.02. Дорога має 2 см завтовшки, тож не мерехтить на тлі підлоги. Перевірка: з низького ракурсу тротуар стоїть приблизно на 13 см вище за дорогу, як бордюр."}, "lesson": 4}, {"text": {"en": "Bollards: make sure all five bollards (X 100, 250, 400, 550 and 700, Y 30) are on the pavement; select each and press End. Check: from a low view, every bollard base touches the pavement top.", "uk": "Стовпчики: переконайся, що всі п'ять стовпчиків (X 100, 250, 400, 550 і 700, Y 30) стоять на тротуарі. Виділи кожен і натисни End. Перевірка: з низького ракурсу основа кожного стовпчика торкається верху тротуару."}, "lesson": 4}, {"text": {"en": "Lamp posts: place SM_LampPost at X 600, Y 50 and at X 1400, Y 50, then press End on each. Check: the lamps stand on the pavement, 8 m apart.", "uk": "Ліхтарні стовпи: постав SM_LampPost на X 600, Y 50 і на X 1400, Y 50, потім натисни End на кожному. Перевірка: ліхтарі стоять на тротуарі на відстані 8 м."}, "lesson": 4}, {"text": {"en": "Benches: place SM_Bench at X 1000, Y 220 and X 1700, Y 220, and turn each with Rotation Z (in steps of 90) until it faces the road. Press End. Check: both benches face the road, backs to the far side of the pavement.", "uk": "Лавки: постав SM_Bench на X 1000, Y 220 і X 1700, Y 220. Повертай кожну полем Rotation Z (кроками по 90), доки вона не стане обличчям до дороги. Натисни End. Перевірка: обидві лавки дивляться на дорогу, спинками до дальнього краю тротуару."}, "lesson": 4}, {"text": {"en": "Bins: place SM_Bin at X 1150, Y 250 and X 1850, Y 250, then press End. Check: each bin stands just beside a bench.", "uk": "Урни: постав SM_Bin на X 1150, Y 250 і на X 1850, Y 250, потім натисни End. Перевірка: кожна урна стоїть просто біля лавки."}, "lesson": 4}, {"text": {"en": "Railing: place SM_RailingSection at X 300, Y 290 along the back edge of the pavement, turn it with Rotation Z until it runs along the street, and press End. Check: the railing stands on the pavement's back edge, parallel to the kerb.", "uk": "Поруччя: постав SM_RailingSection на X 300, Y 290 уздовж заднього краю тротуару. Повертай його полем Rotation Z, доки воно не піде вздовж вулиці, і натисни End. Перевірка: поруччя стоїть на задньому краї тротуару, паралельно бордюру."}, "lesson": 4}, {"text": {"en": "Surfaces: from LevelPrototyping > Materials, drag MI_PrototypeGrid_Gray onto the pavement and a different material from the same folder onto the road. Check: you can tell the pavement from the road at a glance. Older Unreal (4.27) or weak PC: no LevelPrototyping folder; use BasicShapeMaterial from Engine content and one other material.", "uk": "Поверхні: з LevelPrototyping > Materials перетягни MI_PrototypeGrid_Gray на тротуар, а інший матеріал із тієї самої папки — на дорогу. Перевірка: тротуар від дороги видно відрізнити з першого погляду. Старіший Unreal (4.27) або слабкий ПК: папки LevelPrototyping немає; візьми BasicShapeMaterial із вмісту рушія (Engine) і ще один матеріал."}, "lesson": 2}, {"text": {"en": "Outliner: select all props (Ctrl+click), right-click > Move To > Create New Folder and name it Street. In the Content Browser, right-click Course > Fix Up Redirectors. Press Ctrl+S. Check: the Street folder holds every prop, and nothing of yours is loose in the Content folder.", "uk": "Outliner: виділи всі пропси (клацання з Ctrl), клацни правою кнопкою > Move To > Create New Folder і назви папку Street. У Content Browser клацни правою кнопкою Course > Fix Up Redirectors. Натисни Ctrl+S. Перевірка: у папці Street кожен пропс, а жоден твій асет не лежить просто в папці Content."}, "lesson": 1}, {"text": {"en": "Bookmarks: Ctrl+1 to Ctrl+5 for a low view along the kerb, each bench, a lamp post close-up and a view from about 10 m up. Press 5 and take bookmark5.png. Check: pressing 1 to 5 jumps to each view, and bookmark5.png shows the whole street.", "uk": "Закладки: Ctrl+1 – Ctrl+5 для низького виду вздовж бордюру, кожної лавки, ліхтарного стовпа зблизька й виду приблизно з 10 м угорі. Натисни 5 і збережи скриншот bookmark5.png. Перевірка: клавіші 1–5 перемикають види, а на bookmark5.png видно всю вулицю."}, "lesson": 1}, {"text": {"en": "Press Play and walk the mannequin along the pavement past every prop. Press Ctrl+S. Check: the mannequin bumps into the bollards and the bin instead of walking through them.", "uk": "Натисни Play і проведи манекена тротуаром повз кожен пропс. Натисни Ctrl+S. Перевірка: манекен натикається на стовпчики й урну, а не проходить крізь них."}, "lesson": "D4.4"}, {"text": {"en": "Report and hand-in: click Copy the day report at the bottom of the page, paste it into a new chat and answer. Open summary.md in Notepad, press Ctrl+End, paste the answer and press Ctrl+S. Then drag the files on the Hand in list into your hand-in folder. Check: every name shows in the folder, each with a size.", "uk": "Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: кожна назва зі списку є в папці, у кожної є розмір."}, "lesson": "D0.1"}]}, "lessons": [{"title": {"en": "The Unreal editor: viewport, Outliner, Details and bookmarks", "uk": "Редактор Unreal: в'юпорт, Outliner, Details і закладки"}, "minutes": 40, "goals": [{"en": "Name the main parts of the Unreal editor: the viewport, the Outliner, the Details panel, the Content Drawer and the toolbar.", "uk": "Називати головні частини редактора Unreal: в'юпорт, Outliner, панель Details, Content Drawer і панель інструментів."}, {"en": "Fly the viewport (hold the right mouse button with W, A, S, D, Q and E), focus with F, and switch move, rotate and scale with W, E and R.", "uk": "Літати у в'юпорті (права кнопка миші з W, A, S, D, Q і E), наводити вид на об'єкт клавішею F і перемикати переміщення, обертання й масштаб клавішами W, E і R."}, {"en": "Make your own level (File > New Level > Basic), save it, put actors in an Outliner folder, and save camera bookmarks (Ctrl+1 to 9).", "uk": "Створювати власний рівень (File > New Level > Basic), зберігати його, складати актори в папку Outliner і зберігати закладки камери (Ctrl+1 – Ctrl+9)."}], "doalong": [{"en": "Open IslandCourse. File > New Level > Basic > Create (Default on Unreal 4.27), then drag a Cube from Window > Place Actors > Shapes into the level: your first actor. File > Save Current Level As: open Course, make a folder Day06 and save L_Day06.", "uk": "Відкрий IslandCourse. File > New Level > Basic > Create (в Unreal 4.27 — Default). Потім перетягни Cube з Window > Place Actors > Shapes у рівень: це твій перший актор. File > Save Current Level As: відкрий Course, створи папку Day06 і збережи L_Day06."}, {"en": "Find the parts: the viewport (the big 3D view), the Outliner (top right: every actor in the level, your Cube too), the Details panel (bottom right: the selected actor's settings) and the toolbar (along the top).", "uk": "Знайди частини редактора. В'юпорт — великий 3D-вид. Outliner — угорі праворуч, тут усі актори рівня, і твій Cube теж. Панель Details — унизу праворуч, налаштування виділеного актора. Панель інструментів (toolbar) — уздовж верху."}, {"en": "Hold the right mouse button and fly with W, A, S and D; Q goes down and E goes up. Roll the mouse wheel while flying to change speed. Click the floor in the Outliner and press F: the view jumps to it.", "uk": "Тримай праву кнопку миші й літай клавішами W, A, S і D; Q опускає, E піднімає. Під час польоту крути коліщатко, щоб змінити швидкість. Клацни підлогу в Outliner і натисни F: вид перескакує до неї."}, {"en": "With the floor selected, press W, E and R: the move, rotate and scale tools. The arrows, rings and boxes you see are called a gizmo. Press W again, and Ctrl+Z if you moved anything.", "uk": "Коли підлогу виділено, натискай W, E і R: це інструменти переміщення, обертання й масштабу. Стрілки, кільця й кубики на об'єкті називаються гізмо (gizmo). Знову натисни W, а якщо щось зрушилося — Ctrl+Z."}, {"en": "Ctrl+click two actors in the Outliner (for example the floor and the light), right-click > Move To > Create New Folder and name it Practice: the Outliner now groups them. Drag them back out and delete the folder.", "uk": "Клацанням із Ctrl виділи два актори в Outliner, наприклад підлогу і світло. Клацни правою кнопкою > Move To > Create New Folder і назви папку Practice: тепер Outliner групує їх. Перетягни їх назад і видали папку."}, {"en": "Frame a view you like and press Ctrl+1 to save it as bookmark 1. Fly away and press 1: you jump straight back.", "uk": "Знайди вид, який тобі подобається, і натисни Ctrl+1, щоб зберегти його як закладку 1. Відлети подалі й натисни 1: вид одразу повертається."}], "play": {"en": "Treasure hunt: the tutor names five things to find in 3 minutes (the Location row in Details, the Outliner search box, the camera speed setting, the View Mode menu, the Save button); I send one screenshot of each.", "uk": "Пошук скарбів: тьютор називає п'ять речей, які треба знайти за 3 хвилини (рядок Location у Details, поле пошуку Outliner, налаштування швидкості камери, меню View Mode, кнопку Save). Я надсилаю по скриншоту кожної."}, "video": {"url": "https://www.youtube.com/watch?v=Lzl4rdJn0zM", "title": "UE5.5 Editor Interface Fundamentals – From Zero to Hero!", "channel": "Savage Games", "length": "6:36", "search": "unreal engine 5 interface navigation beginner", "alt": {"url": "https://www.youtube.com/watch?v=1rMkLZ_fxvY", "title": "Unreal Engine 5 для початківців: встановлення та огляд інтерфейсу", "channel": "3DV Unreal Engine Archviz Academy"}}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Редактор Unreal: в'юпорт, Outliner, Details і закладки (Day 6, lesson 1 of 4). Today's build: L_Day06: тренувальна вулиця завдовжки 20 м із пропсами, розставленими з точністю до сантиметра.\nWhat I already know: День 5: твої чотири вуличні пропси в Course/Day05 (SM_Bollard, SM_Bench, SM_LampPost, SM_Bin); День 4: чистий експорт FBX і блоки UCX; День 3: секція поруччя.\n\nBy the end of this lesson I can:\n1. Називати головні частини редактора Unreal: в'юпорт, Outliner, панель Details, Content Drawer і панель інструментів.\n2. Літати у в'юпорті (права кнопка миші з W, A, S, D, Q і E), наводити вид на об'єкт клавішею F і перемикати переміщення, обертання й масштаб клавішами W, E і R.\n3. Створювати власний рівень (File > New Level > Basic), зберігати його, складати актори в папку Outliner і зберігати закладки камери (Ctrl+1 – Ctrl+9).\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: Перший тиждень позаду: чотири охайні пропси стоять у реальному масштабі на твоєму власному вуличному розі в Unreal. Today: Сьогодні ти як слід знайомишся з редактором Unreal і будуєш L_Day06 — тренувальну вулицю 20 м, де пропси й поруччя стоять із точністю до сантиметра, а папки впорядковано. One encouraging line: Велика нова програма спершу здається великою кожному, а тьютор пояснить кожну панель стільки разів, скільки треба.); 2 lines on why today matters and where it comes back, in plain words (from this: Сьогодні ти будуєш свою першу вулицю в Unreal і розставляєш на ній власні пропси з точністю до сантиметра. Дизайнери рівнів ставлять пропси за планом із точними числами, а охайне дерево папок дає змогу будь-кому знайти асет за секунди. Твоєму острову обидві навички потрібні з Дня 26. It comes back: Відтепер import_checklist.md потрібен тобі під час кожного імпорту. Розміщення введеними числами (метри × 100) — це спосіб, яким ти ставитимеш кожен будинок зі своїх планів у День 42 і День 49.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-06-unreal-first-steps exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (тротуар і перші стовпчики (на уроках)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Відкрий IslandCourse. File > New Level > Basic > Create (в Unreal 4.27 — Default). Потім перетягни Cube з Window > Place Actors > Shapes у рівень: це твій перший актор. File > Save Current Level As: відкрий Course, створи папку Day06 і збережи L_Day06.\n   2. Знайди частини редактора. В'юпорт — великий 3D-вид. Outliner — угорі праворуч, тут усі актори рівня, і твій Cube теж. Панель Details — унизу праворуч, налаштування виділеного актора. Панель інструментів (toolbar) — уздовж верху.\n   3. Тримай праву кнопку миші й літай клавішами W, A, S і D; Q опускає, E піднімає. Під час польоту крути коліщатко, щоб змінити швидкість. Клацни підлогу в Outliner і натисни F: вид перескакує до неї. [screenshot]\n   4. Коли підлогу виділено, натискай W, E і R: це інструменти переміщення, обертання й масштабу. Стрілки, кільця й кубики на об'єкті називаються гізмо (gizmo). Знову натисни W, а якщо щось зрушилося — Ctrl+Z.\n   5. Клацанням із Ctrl виділи два актори в Outliner, наприклад підлогу і світло. Клацни правою кнопкою > Move To > Create New Folder і назви папку Practice: тепер Outliner групує їх. Перетягни їх назад і видали папку.\n   6. Знайди вид, який тобі подобається, і натисни Ctrl+1, щоб зберегти його як закладку 1. Відлети подалі й натисни 1: вид одразу повертається. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Пошук скарбів: тьютор називає п'ять речей, які треба знайти за 3 хвилини (рядок Location у Details, поле пошуку Outliner, налаштування швидкості камери, меню View Mode, кнопку Save). Я надсилаю по скриншоту кожної. Otherwise skip it.\n6. Review: ask me these questions from earlier days, one at a time, and correct me kindly: Day 3: Why must the origin sit in the middle before you add a Mirror modifier? | Day 1: Where does the origin go on a prop, and why?\n7. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n8. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\nIf I want to go deeper, recommend this free video: \"UE5.5 Editor Interface Fundamentals – From Zero to Hero!\" by Savage Games: https://www.youtube.com/watch?v=Lzl4rdJn0zM\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; review (by tutor or art director) = огляд; checklist = чек-лист; credits line = рядок авторства; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); File Explorer = Провідник; mesh = меш; grid = сітка (тільки grid, ніколи mesh); vertex / edge / face = вершина / ребро / грань; origin (and kit pivot) = origin — точка, за яку об'єкт ставля p after moving them (Fix Up Redirectors).", "uk": "Називати асети з галузевими префіксами (SM_, M_, MI_, T_, L_) і прибирати після переміщення (Fix Up Redirectors)."}], "doalong": [{"en": "Press Ctrl+Space to open the Content Drawer and click Dock in Layout, so it stays open at the bottom of the editor.", "uk": "Натисни Ctrl+Space, щоб відкрити Content Drawer, і клацни Dock in Layout. Тепер він лишається відкритим унизу редактора."}, {"en": "Open the LevelPrototyping folder. In Meshes you see SM_Cube, SM_ChamferCube, SM_Ramp and more; in Materials, MI_PrototypeGrid_Gray and others. These grey blocks are free for blockouts (quick, rough versions of a place). Older Unreal (4.27) or weak PC: no LevelPrototyping; use Engine > BasicShapes instead.", "uk": "Відкрий папку LevelPrototyping. У Meshes лежать SM_Cube, SM_ChamferCube, SM_Ramp та інші, у Materials — MI_PrototypeGrid_Gray та інші. Ці сірі блоки можна вільно брати для блокаутів. Блокаут — швидка чорнова версія місця. Старіший Unreal (4.27) або слабкий ПК: LevelPrototyping немає; візьми натомість Engine > BasicShapes."}, {"en": "Click Settings (top right of the Content Browser) and tick Show Engine Content. Open Engine > BasicShapes: Cube, Sphere, Cylinder, Cone and Plane. The Cube is exactly 1 m on every side.", "uk": "Клацни Settings (угорі праворуч у Content Browser) і познач Show Engine Content. Відкрий Engine > BasicShapes: Cube, Sphere, Cylinder, Cone і Plane. Cube має рівно 1 м з кожного боку."}, {"en": "Under Course/Day06, make the folders Meshes and Materials (right-click > New Folder).", "uk": "У Course/Day06 створи папки Meshes і Materials: клацни правою кнопкою > New Folder."}, {"en": "Type bench in the search box: your SM_Bench in Course/Day05 appears. Clear the search. Click Filters > Static Mesh to see only meshes, then clear the filter.", "uk": "Введи bench у поле пошуку: з'являється твій SM_Bench з Course/Day05. Очисти пошук. Клацни Filters > Static Mesh, щоб бачити лише меші, а потім зніми фільтр. : у Провіднику .fbx має 10 КБ або більше (4 КБ означає, що нічого не було виділено)."}, {"en": "In Unreal, drag the FBX into Course/Day06/Meshes and read each section of the import window. Type collision in its search box: Import Collisions and Import Collisions According To Mesh Name ticked, Fallback Collision Type None. Type lightmap: check that Generate Lightmap UVs is off (UV channel 1 is for Day 14's wear mask).", "uk": "В Unreal перетягни FBX у Course/Day06/Meshes і прочитай кожен розділ вікна імпорту. Введи в пошук collision: Import Collisions і Import Collisions According To Mesh Name ввімкнено, Fallback Collision Type — None. Введи lightmap і перевір, чи Generate Lightmap UVs вимкнено. UV-канал 1 знадобиться для маски зношеності в День 14."}, {"en": "Type nanite: Build Nanite is ticked by default in 5.8; untick it for railings, posts and glass, so untick it now. Click Import and move the material into Course/Day06/Materials. Check: SM_RailingSection shows in Meshes. Older Unreal (4.27) or weak PC: no Build Nanite or Fallback Collision Type; untick Auto Generate Collision.", "uk": "Введи в пошук nanite: у 5.8 Build Nanite типово ввімкнено. Для поруччя, стійок і скла його вимикають, тож зараз зніми прапорець. Клацни Import і перенеси матеріал у Course/Day06/Materials. Перевірка: SM_RailingSection з'являється в Meshes. Старіший Unreal (4.27) або слабкий ПК: Build Nanite і Fallback Collision Type немає; зніми прапорець Auto Generate Collision."}, {"en": "Write import_checklist.md: the right day folder; Import Collisions and Import Collisions According To Mesh Name ticked, Fallback Collision Type None; Generate Lightmap UVs off; Build Nanite on for solid pieces, off for railings, posts and glass; the SM_ name; materials moved; Approx Size checked.", "uk": "Напиши import_checklist.md: правильна папка дня; Import Collisions і Import Collisions According To Mesh Name ввімкнено, Fallback Collision Type — None; Generate Lightmap UVs вимкнено; Build Nanite увімкнено д ити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-06-unreal-first-steps exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (тротуар і перші стовпчики (на уроках)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. У Blender відкрий railing_day3.blend. Пропусти те, що вже зроблено для Золота в День 5. Перейменуй об'єкт на SM_RailingSection і додай три блоки UCX: по одному на кожну стійку й один на поручні з балясинами. Назви їх від UCX_SM_RailingSection_00 до _02 і дай їм origin поруччя, як у День 4.\n   2. Експортуй SM_RailingSection.fbx із налаштуваннями FBX з Дня 4 у робочу папку дня і натисни Ctrl+S, щоб зберегти й .blend. Перевірка: у Провіднику .fbx має 10 КБ або більше (4 КБ означає, що нічого не було виділено).\n   3. В Unreal перетягни FBX у Course/Day06/Meshes і прочитай кожен розділ вікна імпорту. Введи в пошук collision: Import Collisions і Import Collisions According To Mesh Name ввімкнено, Fallback Collision Type — None. Введи lightmap і перевір, чи Generate Lightmap UVs вимкнено. UV-канал 1 знадобиться для маски зношеності в День 14. [screenshot]\n   4. Введи в пошук nanite: у 5.8 Build Nanite типово ввімкнено. Для поруччя, стійок і скла його вимикають, тож зараз зніми прапорець. Клацни Import і перенеси матеріал у Course/Day06/Materials. Перевірка: SM_RailingSection з'являється в Meshes. Старіший Unreal (4.27) або слабкий ПК: Build Nanite і Fallback Collision Type немає; зніми прапорець Auto Generate Collision.\n   5. Напиши import_checklist.md: правильна папка дня; Import Collisions і Import Collisions According To Mesh Name ввімкнено, Fallback Collision Type — None; Generate Lightmap UVs вимкнено; Build Nanite увімкнено для суцільних деталей і вимкнено для поруччя, стійок і скла; назва SM_; матеріали перенесено; Approx Size перевірено.\n   6. У Blender зроби верхній поручень на 1 см вищим і експортуй знову з тією самою назвою. В Unreal клацни правою кнопкою меш > Reimport. Кожне розставлене поруччя оновлюється саме. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Зламай і полагодь: тьютор просить мене двічі імпортувати cube_day0.glb з Дня 0 у тимчасову папку — раз із Fallback Collision Type Box, раз із None. Я порівнюю їх у Static Mesh Editor (Show > Simple Collision) і кажу, крізь який манекен пройшов би і чому. Потім видаляю обидві копії. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\nIf I want to go deeper, recommend this free video: \"Importing a Bookshelf to Unreal Engine with Interchange\" by Timeless Tower: https://www.youtube.com/watch?v=TZkHmLMm0NM\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; review (by tutor or art director) = огляд; see-why-fix note = нотатка «бачу, чому, як виправити»; checklist = чек-лист; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); default value = типове значення; File Explorer = Провідник; mesh = меш; grid = сітка (тільки grid, ніколи mesh); vertex / edge / face = вершина / ребро / грань; origin (and kit pivot) = origin — точка, за яку об'єкт ставлять і обертають; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); modifier = модифікатор; level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; collision / UCX collision box = колізія / блок UCX; material instance / child instance = інстанс / дочірній інстанс; volume (PCG Volume, Post Process Volume) = об'єм; kit / kit piece / part of one object = набір / деталь / частина; district / plot / plot plan = район / ділянка / план ділянки; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; wear / worn edges / salt line = зношеність / стерті краї / сольова лінія; vista / blockout / landmark = панорама / блокаут / орієнтир; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}, {"title": {"en": "Placing exactly: centimetres, snapping and End", "uk": "Точне розміщення: сантиметри, прив'язка і End"}, "minutes": 40, "goals": [{"en": "Turn plan metres into Unreal centimetres (multiply by 100) and type Location, Rotation and Scale in the Details panel.", "uk": "Переводити метри плану в сантиметри Unreal (множити на 100) і вводити Location, Rotation і Scale на панелі Details."}, {"en": "Set the grid snap in the viewport toolbar, drop actors onto the surface below with End, and copy

30 і знову натисни End."}, {"en": "Hold Alt and drag the bollard's red arrow: a copy follows. Type the copy's X as 250. Make three more copies at X 400, 550 and 700.", "uk": "Тримай Alt і тягни червону стрілку стовпчика: за нею йде копія. Введи для копії X 250. Зроби ще три копії на X 400, 550 і 700."}, {"en": "Press Ctrl+S to save the level, and save bookmark 2 looking along the bollards.", "uk": "Натисни Ctrl+S, щоб зберегти рівень, і збережи закладку 2 з видом уздовж стовпчиків."}], "play": {"en": "Coordinates bingo: the tutor reads five plan points in metres; I type each into Details and send a screenshot; a point typed in the wrong unit (metres instead of centimetres) costs double.", "uk": "Бінго координат: тьютор читає п'ять точок плану в метрах. Я вводжу кожну в Details і надсилаю скриншот. Точка, введена не в тих одиницях (метри замість сантиметрів), коштує подвійно."}, "video": {"url": "https://www.youtube.com/watch?v=syBNq0wumkQ", "title": "The Ultimate Guide to SNAPPING in Unreal Engine! (Place Objects Quickly and Accurately)", "channel": "The RealTime Essentials", "length": "11:41", "search": "unreal engine 5 grid snapping"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Точне розміщення: сантиметри, прив'язка і End (Day 6, lesson 4 of 4). Today's build: L_Day06: тренувальна вулиця завдовжки 20 м із пропсами, розставленими з точністю до сантиметра.\nWhat I already know: День 5: твої чотири вуличні пропси в Course/Day05 (SM_Bollard, SM_Bench, SM_LampPost, SM_Bin); День 4: чистий експорт FBX і блоки UCX; День 3: секція поруччя.\nEarlier today I already did: lesson 1 (Редактор Unreal: в'юпорт, Outliner, Details і закладки); lesson 2 (Content Browser: папки, назви та вміст рушія); lesson 3 (Налаштування імпорту: твій чек-лист імпорту і Reimport). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Переводити метри плану в сантиметри Unreal (множити на 100) і вводити Location, Rotation і Scale на панелі Details.\n2. Налаштовувати прив'язку до сітки на панелі інструментів в'юпорта, опускати актори на поверхню клавішею End і копіювати їх перетягуванням з Alt.\n3. Робити поверхню точного розміру з куба базових форм 1 м і його Scale.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: 2 lines on why today matters and where it comes back, in plain words (from this: Сьогодні ти будуєш свою першу вулицю в Unreal і розставляєш на ній власні пропси з точністю до сантиметра. Дизайнери рівнів ставлять пропси за планом із точними числами, а охайне дерево папок дає змогу будь-кому знайти асет за секунди. Твоєму острову обидві навички потрібні з Дня 26. It comes back: Відтепер import_checklist.md потрібен тобі під час кожного імпорту. Розміщення введеними числами (метри × 100) — це спосіб, яким ти ставитимеш кожен будинок зі своїх планів у День 42 і День 49.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-06-unreal-first-steps exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (тротуар і перші стовпчики (на уроках)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Відкрий Window > Place Actors, клацни Shapes і перетягни Cube у рівень. Він має рівно 1 м з кожного боку, а його origin — у центрі.\n   2. У Details > Transform введи Location X 1000, Y 150, Z 7.5 і Scale 20, 3, 0.15. Має вийти тротуар 20 м завдовжки, 3 м завширшки й 15 см заввишки, що лежить на підлозі. Перейменуй його в Outliner на Pavement.\n   3. На панелі інструментів угорі в'юпорта знайди кнопки прив'язки біля інструментів переміщення, обертання й масштабу. Клацни кнопку прив'язки до сітки (значок сітки), щоб вона підсвітилася. Потім клацни число поруч і вибери 10: тепер об'єкти рухаються кроками по 10 см. Панель виглядає інакше? Надішли тьютору скриншот. [screenshot]\n   4. Перетягни SM_Bollard з Course/Day05 на тротуар і натисни End: стовпчик опускається на верх тротуару. Введи Location X 100, Y 30 і знову натисни End.\n   5. Тримай Alt і тягни червону стрілку стовпчика: за нею йде копія. Введи для копії X 250. Зроби ще три копії на X 400, 550 і 700.\n   6. Натисни Ctrl+S, щоб зберегти рівень, і збережи закладку 2 з видом уздовж стовпчиків. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Бінго координат: тьютор читає п'ять точок плану в метрах. Я вводжу кожну в Details і надсилаю скриншот. Точка, введена не в тих одиницях (метри замість сантиметрів), коштує подвійно. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\nIf I want to go deeper, recommend this free video: \"The Ultimate Guide to SNAPPING in Unreal Engine! (Place Objects Quickly and Accurately)\" by The RealTime Essentials: https://www.youtube.com/watch?v=syBNq0wumkQ\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; review (by tutor or art director) = огляд; checklist = чек-лист; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); File Explorer = Провідник; mesh = меш; grid = сітка (тільки grid, ніколи mesh); vertex / edge / face = вершина / ребро / грань; origin (and kit pivot) = origin — точка, за яку об'єкт ставлять і обертають; world origin / 3D cursor = центр світу / 3D-курсор; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); modifier = модифікатор; level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; collision / UCX collision box = колізія / блок UCX; material instance / child instance = інстанс / дочірній інстанс; volume (PCG Volume, Post Process Volume) = об'єм; kit / kit piece / part of one object = набір / деталь / частина; district / plot / plot plan = район / ділянка / план ділянки; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; wear / worn edges / salt line = зношеність / стерті краї / сольова лінія; vista / blockout / landmark = панорама / блокаут / орієнтир; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}], "handin": [{"en": "summary.md", "uk": "summary.md (звіт дня)"}, {"en": "import_checklist.md: you use it at every import from now on (→ Day 7)", "uk": "import_checklist.md (відтепер він потрібен під час кожного імпорту) (→ День 7)"}, {"en": "bookmark5.png: the street from 10 m up (proof)", "uk": "bookmark5.png (вулиця з 10 м угорі) (доказ)"}], "goal": {"en": "By the end of today you have your own level L_Day06 with a 20 m practice street made from basic shapes, your street props and railing placed at exact coordinates, and a tidy folder tree.", "uk": "До кінця дня в тебе є власний рівень L_Day06: тренувальна вулиця завдовжки 20 м з базових форм, твої вуличні пропси й поруччя, розставлені за точними координатами, і охайне дерево папок."}, "uses": [{"en": "Day 5: your four street props in Course/Day05 (SM_Bollard, SM_Bench, SM_LampPost, SM_Bin)", "uk": "День 5: твої чотири вуличні пропси в Course/Day05 (SM_Bollard, SM_Bench, SM_LampPost, SM_Bin)"}, {"en": "Day 4: the clean FBX export and UCX boxes", "uk": "День 4: чистий експорт FBX і блоки UCX"}, {"en": "Day 3: the railing section", "uk": "День 3: секція поруччя"}], "quiz": [{"q": {"en": "Your plan puts a lamp post at 12.5 m along X. What do you type into Location X?", "uk": "За твоїм планом ліхтарний стовп стоїть на 12,5 м уздовж X. Що ввести в Location X?"}, "options": [{"en": "12.5", "uk": "12.5"}, {"en": "125", "uk": "125"}, {"en": "1250", "uk": "1250"}, {"en": "12500", "uk": "12500"}], "answer": 2, "explain": {"en": "Unreal counts in centimetres, so metres times 100: 12.5 m is 1250.", "uk": "Unreal рахує в сантиметрах, тож метри множимо на 100: 12,5 м — це 1250."}}, {"q": {"en": "You moved assets to a new folder, and the old folder still shows small arrow icons. What do you do?", "uk": "Ти переносиш асети в нову папку, а в старій досі видно маленькі значки-стрілки. Що зробити?"}, "options": [{"en": "Delete the old folder at once", "uk": "Одразу видалити стару папку"}, {"en": "Right-click the parent folder > Fix Up Redirectors", "uk": "Клацнути правою кнопкою батьківську папку > Fix Up Redirectors"}, {"en": "Reimport every asset", "uk": "Зробити Reimport кожного асета"}], "answer": 1, "explain": {"en": "Redirectors are notes left behind after a move. Fix Up Redirectors updates every link and removes them safely.", "uk": "Редиректи — примітки, що лишаються після переміщення. Fix Up Redirectors оновлює кожне посилання й безпечно їх прибирає."}}, {"q": {"en": "You need a pavement 20 m long, 3 m wide and 15 cm high from the 1 m basic-shape cube. Which Scale do you type?", "uk": "Тобі потрібен тротуар 20 м завдовжки, 3 м завширшки й 15 см заввишки з куба базових форм 1 м. Який Scale ввести?"}, "options": [{"en": "20, 3, 0.15", "uk": "20, 3, 0.15"}, {"en": "2000, 300, 15", "uk": "2000, 300, 15"}, {"en": "2, 0.3, 0.015", "uk": "2, 0.3, 0.015"}], "answer": 0, "explain": {"en": "The cube is 1 m, so the Scale is the size in metres. Location is in centimetres; Scale is a multiplier.", "uk": "Куб має 1 м, тож Scale дорівнює розміру в метрах. Location вимірюється в сантиметрах, а Scale — це множник."}}, {"q": {"en": "You change a railing in Blender and export it again with the same name. How do you update it in Unreal?", "uk": "Ти змінюєш поруччя в Blender і знову експортуєш його з тією самою назвою. Як оновити його в Unreal?"}, "options": [{"en": "Import it again into a new folder", "uk": "Імпортувати ще раз у нову папку"}, {"en": "Delete the placed railings and place them again", "uk": "Видалити розставлені поруччя й поставити їх знову"}, {"en": "Right-click the mesh in the Content Browser > Reimport", "uk": "Клацнути правою кнопкою меш у Content Browser > Reimport"}], "answer": 2, "explain": {"en": "Reimport replaces the mesh in place, and every placed copy updates by itself.", "uk": "Reimport замінює меш на місці, і кожна розставлена копія оновлюється сама."}}, {"q": {"en": "Months from now, you can't find your bench in the project. Which habit would have helped most?", "uk": "Через кілька місяців ти не можеш знайти свою лавку в проєкті. Яка звичка допомогла б найбільше?"}, "options": [{"en": "Keeping everything in the Content folder", "uk": "Тримати все в папці Content"}, {"en": "Prefixes like SM_ and M_ and one folder per day", "uk": "Префікси на кшталт SM_ і M_ та окрема папка на кожен день"}, {"en": "Very long file names", "uk": "Дуже довгі назви файлів"}], "answer": 1, "explain": {"en": "Prefixes and a clear folder tree let anyone search and filter their way to an asset in seconds.", "uk": "Із префіксами й зрозумілим деревом папок будь-хто знаходить асет пошуком і фільтрами за секунди."}}], "weekInfo": {"week": 2, "title": {"en": "Modular kits", "uk": "Модульні набори"}, "goal": {"en": "By Friday you have your own harbour and building kit on a metric grid, and L_KitTest: a quay, a pier and a harbour house built from it in Unreal, with the house saved as a Level Instance.", "uk": "До п'ятниці в тебе є власний набір для гавані й будівель на метричній сітці. Із нього в Unreal зібрано рівень L_KitTest: причал, пірс і будинок біля гавані, а будинок збережено як Level Instance."}, "skills": [{"en": "Modular kit design on a metric grid with consistent pivots", "uk": "Дизайн модульного набору на метричній сітці з однаковими origin"}, {"en": "Unreal Engine 5 level assembly: import pipeline, exact placement and snapping", "uk": "Збирання рівня в Unreal Engine 5: імпорт, точне розміщення та прив'язка (snapping)"}, {"en": "Nanite versus LOD decisions for real-time performance", "uk": "Вибір між Nanite і LOD заради продуктивності в реальному часі"}, {"en": "Level Instances for reusable building sets", "uk": "Level Instance для будівель, які ставлять багато разів"}, {"en": "Content Browser organisation and industry naming conventions (SM_, M_, MI_, T_, L_)", "uk": "Порядок у Content Browser і галузеві правила назв (SM_, M_, MI_, T_, L_)"}]}, "morning": {"sofar": {"en": "Your first week is done: four clean street props stand at real scale on your own street corner in Unreal.", "uk": "Перший тиждень позаду: чотири охайні пропси стоять у реальному масштабі на твоєму власному вуличному розі в Unreal."}, "today": {"en": "You learn the Unreal editor properly and build L_Day06, a 20 m practice street with your props and railing placed to the centimetre, in a tidy folder tree.", "uk": "Сьогодні ти як слід знайомишся з редактором Unreal і будуєш L_Day06 — тренувальну вулицю 20 м, де пропси й поруччя стоять із точністю до сантиметра, а папки впорядковано."}, "cheer": {"en": "A big new program feels big for everyone at first, and your tutor will walk you through each panel as often as you need.", "uk": "Велика нова програма спершу здається великою кожному, а тьютор пояснить кожну панель стільки разів, скільки треба."}, "quote": {"text": {"en": "We are all apprentices in a craft where no one ever becomes a master.", "uk": "Усі ми — учні в ремеслі, де ніхто ніколи не стає майстром."}, "author": {"en": "Ernest Hemingway", "uk": "Ернест Гемінгвей"}, "source": "https://en.wikiquote.org/wiki/Ernest_Hemingway"}}, "hasAssets": false, "workPath": "Work\\Assignment\\Day-06-unreal-first-steps", "mapHref": "../../COURSE.html", "prevHref": "../Day-00-setup/START-HERE.html", "nextHref": "../Day-07-harbour-kit-quay-and-pier/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8 (and Blender for one export). I am a beginner on Day 6. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me and don't write code.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: Решта вулиці, розставлена за списком, самостійно.\nIt's part of: L_Day06: тренувальна вулиця завдовжки 20 м із пропсами, розставленими з точністю до сантиметра (Твій тренувальний рівень L_Day06 у Course/Day06. Ті самі навички знадобляться, щоб розставляти все на твоєму острові з Дня 26.).\nWhy it matters: Сьогодні ти будуєш свою першу вулицю в Unreal і розставляєш на ній власні пропси з точністю до сантиметра. Дизайнери рівнів ставлять пропси за планом із точними числами, а охайне дерево папок дає змогу будь-кому знайти асет за секунди. Твоєму острову обидві навички потрібні з Дня 26. It comes back: Відтепер import_checklist.md потрібен тобі під час кожного імпорту. Розміщення введеними числами (метри × 100) — це спосіб, яким ти ставитимеш кожен будинок зі своїх планів у День 42 і День 49.\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-06-unreal-first-steps (on the drive I chose on Day 0).\nWhat I already know: День 5: твої чотири вуличні пропси в Course/Day05 (SM_Bollard, SM_Bench, SM_LampPost, SM_Bin); День 4: чистий експорт FBX і блоки UCX; День 3: секція поруччя; today's lessons: Редактор Unreal: в'юпорт, Outliner, Details і закладки; Content Browser: папки, назви та вміст рушія; Налаштування імпорту: твій чек-лист імпорту і Reimport; Точне розміщення: сантиметри, прив'язка і End. Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- Новий рівень L_Day06 (File > New Level > Basic; в Unreal 4.27 — Default), збережений у Course/Day06.\n- Папки Course/Day06/Meshes і Course/Day06/Materials. Жодного твого асета просто в папці Content.\n- Назви з галузевими префіксами: SM_ для статичних мешів, M_ для матеріалів, MI_ для інстансів матеріалів, T_ для текстур, L_ для рівнів.\n- Тренувальна вулиця з кубів базових форм: тротуар 20 м завдовжки, 3 м завширшки й 0,15 м заввишки та дорога поруч. Location і Scale введено точно.\n- Пропси стоять у точках зі списку розміщення (метри × 100 = сантиметри Unreal): п'ять стовпчиків через 1,5 м уздовж бордюру, два ліхтарні стовпи на відстані 8 м, дві лавки, дві урни й секція поруччя. Кожен пропс опущено на тротуар клавішею End.\n- SM_RailingSection імпортовано з чистого FBX із блоками UCX у Course/Day06/Meshes, а import_checklist.md написано (з рядком про Build Nanite).\n- Папка Outliner з назвою Street і п'ять закладок камери (Ctrl+1 – Ctrl+5).\n\nMy checklist (the same numbers show on my course page):\n1. Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: SM_RailingSection.fbx і import_checklist.md, а в Unreal є L_Day06 із тротуаром і п'ятьма стовпчиками й папки Course/Day06/Meshes і /Materials. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Старіший Unreal (4.27) або слабкий ПК: кожен крок працює в 4.27; див. розділ «Слабкий ПК» на сторінці ACCOUNTS-AND-INSTALLS.html. (from lesson 4)\n2. Дорога: перетягни ще один Cube з Place Actors > Shapes, назви його Road і введи Location X 1000, Y -300, Z 1 і Scale 20, 6, 0.02. Дорога має 2 см завтовшки, тож не мерехтить на тлі підлоги. Перевірка: з низького ракурсу тротуар стоїть приблизно на 13 см вище за дорогу, як бордюр. (from lesson 4)\n3. Стовпчики: переконайся, що всі п'ять стовпчиків (X 100, 250, 400, 550 і 700, Y 30) стоять на тротуарі. Виділи кожен і натисни End. Перевірка: з низького ракурсу основа кожного стовпчика торкається верху тротуару. (from lesson 4)\n4. Ліхтарні стовпи: постав SM_LampPost на X 600, Y 50 і на X 1400, Y 50, потім натисни End на кожному. Перевірка: ліхтарі стоять на тротуарі на відстані 8 м. (from lesson 4)\n5. Лавки: постав SM_Bench на X 1000, Y 220 і X 1700, Y 220. Повертай кожну полем Rotation Z (кроками по 90), доки вона не стане обличчям до дороги. Натисни End. Перевірка: обидві лавки дивляться на дорогу, спинками до дальнього краю тротуару. (from lesson 4)\n6. Урни: постав SM_Bin на X 1150, Y 250 і на X 1850, Y 250, потім натисни End. Перевірка: кожна урна стоїть просто біля лавки. (from lesson 4)\n7. Поруччя: постав SM_RailingSection на X 300, Y 290 уздовж заднього краю тротуару. Повертай його полем Rotation Z, доки воно не піде вздовж вулиці, і натисни End. Перевірка: поруччя стоїть на задньому краї тротуару, паралельно бордюру. (from lesson 4)\n8. Поверхні: з LevelPrototyping > Materials перетягни MI_PrototypeGrid_Gray на тротуар, а інший матеріал із тієї самої папки — на дорогу. Перевірка: тротуар від дороги видно відрізнити з першого погляду. Старіший Unreal (4.27) або слабкий ПК: папки LevelPrototyping немає; візьми BasicShapeMaterial із вмісту рушія (Engine) і ще один матеріал. (from lesson 2)\n9. Outliner: виділи всі пропси (клацання з Ctrl), клацни правою кнопкою > Move To > Create New Folder і назви папку Street. У Content Browser клацни правою кнопкою Course > Fix Up Redirectors. Натисни Ctrl+S. Перевірка: у папці Street кожен пропс, а жоден твій асет не лежить просто в папці Content. (from lesson 1)\n10. Закладки: Ctrl+1 – Ctrl+5 для низького виду вздовж бордюру, кожної лавки, ліхтарного стовпа зблизька й виду приблизно з 10 м угорі. Натисни 5 і збережи скриншот bookmark5.png. Перевірка: клавіші 1–5 перемикають види, а на bookmark5.png видно всю вулицю. (from lesson 1)\n11. Натисни Play і проведи манекена тротуаром повз кожен пропс. Натисни Ctrl+S. Перевірка: манекен натикається на стовпчики й урну, а не проходить крізь них. (from day 4, lesson 4)\n12. Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: кожна назва зі списку є в папці, у кожної є розмір. (from day 0, lesson 1)\n\nHow to help: ask which step number I'm on, then give me only the next step: the exact clicks and what I should see. When I send a screenshot, compare it with my reference, my sizes and the spec, and name one thing to fix at a time.\nCheck every save and export by reopening it before we move on:\n- a .md or .txt: open it with Notepad; the text is there, and the name doesn't end in .md.txt\nWhen I write \"готово\", and in any case before the day ends, check with me one item at a time (yes/no): each spec point, then each file on my hand-in list, ready in my day work folder (skip summary.md: the day report writes it next):\n1. import_checklist.md (відтепер він потрібен під час кожного імпорту) (→ День 7)\n2. bookmark5.png (вулиця з 10 м угорі) (доказ)\nFinish with a short list of anything missing, and one line on where this work comes back and what it will look like there. Then tell me the order for the end of the day: first the day report (the Copy the day report button at the bottom of my course page) into summary.md, and only then hand in all the files on the list, summary.md too.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; review (by tutor or art director) = огляд; checklist = чек-лист; credits line = рядок авторства; reference photo / hero photo = фото-референс / ключове фото; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); File Explorer = Провідник; mesh = меш; grid = сітка (тільки grid, ніколи mesh); vertex / edge / face = вершина / ребро / грань; origin (and kit pivot) = origin — точка, за яку об'єкт ставлять і обертають; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); modifier = модифікатор; level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; collision / UCX collision box = колізія / блок UCX; material instance / child instance = інстанс / дочірній інстанс; kit / kit piece / part of one object = набір / деталь / частина; district / plot / plot plan = район / ділянка / план ділянки; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; wear / worn edges / salt line = зношеність / стерті краї / сольова лінія; vista / blockout / landmark = панорама / блокаут / орієнтир; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.\n\nStart by asking for my best reference photo. Then, one at a time, my sizes and my step number.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender.", "reportPrompt": "Help me write today's report for summary.md. I write it before I hand in. Talk to me in simple Ukrainian, and never use gendered forms about me. Keep the English labels below exactly; the text after each label may be Ukrainian.\nAsk me one thing at a time, and skip whatever I've already pasted below:\n1. My lesson summaries («Засвоєно» / «Було важко»), or which lessons I skipped.\n2. My first score in the page's \"Check yourself\" quiz.\n3. How far the build got: done, partly or blocked (if blocked, where).\n4. My hand-in list, one item at a time (skip summary.md): is the file ready in my day work folder (GAD\\Day-06-unreal-first-steps)? (yes/no)\n   - import_checklist.md (відтепер він потрібен під час кожного імпорту) (→ День 7)\n   - bookmark5.png (вулиця з 10 м угорі) (доказ)\n5. One question for Thalia (about any day; start with the day number), or \"none\".\n6. Whether I fixed an earlier day today (which day and what), or \"no\".\n7. About how many hours today took.\nThen give me the finished report in one block I can copy:\n\nTeam summary, <date>, Misha\nDay 6: Unreal first steps: the editor, folders, import settings and exact placing. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nReady to hand in: <tick each item of today's list: ✓ name, or ✗ name and why it isn't ready>\nMissing: <files not ready, or \"none\">\nFixed: <Day N: what I fixed (the fixed files are in that day's hand-in folder), or \"none\">\nQuestion for Thalia: <Day N: one line, or \"none\">\nHours: <about N>\nTo revisit: <the «Було важко» lines>\n\nThen tell me: open summary.md in today's day work folder (GAD\\Day-06-unreal-first-steps) with Notepad (right-click > Open with > Notepad; if there is no summary.md yet, make it: right-click > New > Text Document, named summary.md). Press Ctrl+End, paste the report below anything already there, and save with Ctrl+S. Never delete or paste over what is already in the file. Only then hand in all the files on the list, summary.md too, with the Open my hand-in folder button on the page.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку  let x=0,o='';for(const ch of str){if(ch===' '){x+=8;continue}if(ch==='/'){o+='<path class="on" d="M'+(x+9)+' 2L'+(x+2)+' '+(H-2)+'L'+(x+4.5)+' '+(H-2)+'L'+(x+11.5)+' 2Z"/>';x+=15;continue}const on=SEG[ch]||'';
  for(const k of 'abcdefg')o+='<polygon class="'+(on.includes(k)?'on':'gh')+'" points="'+P[k].map(p=>(p[0]+x).toFixed(1)+','+p[1].toFixed(1)).join(' ')+'"/>';x+=W+5}

 const smooth=(P,closed)=>{let d='M'+f(P[0][0])+' '+f(P[0][1]);const n=P.length,g=i=>P[closed?(i+n)%n:Math.max(0,Math.min(n-1,i))];
  for(let i=0;i<(closed?n:n-1);i++){const p0=g(i-1),p1=g(i),p2=g(i+1),p3=g(i+2);d+='C'+f(p1[0]+(p2[0]-p0[0])/6)+' '+f(p1[1]+(p2[1]-p0[1])/6)+' '+f(p2[0]-(p3[0]-p1[0])/6)+' '+f(p2[1]-(p3[1]-p1[1])/6)+' '+f(p2[0])+' '+f(p2[1])}return d+(closed?'Z':'')};
 const ring=(s,k)=>{const P=[];for(let i=0;i<64;i++)P.push(pt(i/64*TAU,s,k));return smooth(P,true)};
 let o='<path class="c0" d="'+ring(1,0)+'"/>';
 [.84,.69,.55,.42,.3,.19,.1].forEach((s,k)=>o+='<path class="c" d="'+ring(s,k+1)+'"/>');
 const t0=-2.2,turns=1.55,wp=w=>{const t=(w-1)/11;return {a:t0+t*turns*TAU,s:1.1-t*.98}};
 const P=[],D=[];let last=0;for(let w=1;w<=12;w++)if(state(w)!=='p')last=w;

 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div><label class="rcpt" for="r'+i+'"><span class="eyebrow">'+u('rcpt')+'</span><textarea id="r'+i+'" rows="2" placeholder="'+esc(u('rcptPh'))+'" oninput="st.r'+i+'=this.value;save()">'+esc(st['r'+i]||'')+'</textarea></label>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+hList()+chkList()+(hasClip?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<h3>1 · '+u('copyR')+'</h3><p class="muted">'+u('report')+'</p><div class="row"><button class="btn ghost" onclick="cp(reportText())">'+ic('copy')+u('copyR')+'</button></div><h3>2 · '+u('ship')+'</h3>'+hf()+'<p class="muted" style="margin:12px 0 0">'+u('hNote')+'</p></section>';
 h+=qCard();h+=wk;
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();

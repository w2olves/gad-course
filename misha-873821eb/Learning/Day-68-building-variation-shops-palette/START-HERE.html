<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 68</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

colours each.", "uk": "PDA_BuildingStyle отримує Palette (масив Material Instance), Plaster Slot (Name, типово M_Plaster), Shop Front і Awning (Static Mesh) та Awning Height (Float, см). Кожен DA_Style_* їх заповнює, з 3–5 кольорами палітри."}, {"en": "BP_Building gains Seed (Integer, 0 to 9999), Window Chance (Float, 0 to 1, default 0.7) and Has Shop (Boolean); Make Random Stream (Seed) > Set Stream runs first.", "uk": "BP_Building отримує Seed (Integer, від 0 до 9999), Window Chance (Float, від 0 до 1, типово 0.7) і Has Shop (Boolean). Першим виконується Make Random Stream (Seed) > Set Stream."}, {"en": "Window Columns: a Boolean array refilled at each rebuild with one Random Bool with Weight from Stream per bay; bay b reads column Min(b, Count - 1 - b), so each facade mirrors about its middle and windows line up from floor to floor.", "uk": "Window Columns — масив Boolean. Після кожної перебудови його заново заповнює Random Bool with Weight from Stream, по одному на секцію. Секція b читає колонку Min(b, Count - 1 - b), тож кожен фасад віддзеркалено відносно середини, а вікна стоять одне над одним на всіх поверхах."}, {"en": "Pick Piece: a function that returns 0 (wall), 1 (window) or 2 (door) for a floor and bay; Add Facade sends it to Switch on Int.", "uk": "Pick Piece — функція, що повертає 0 (стіна), 1 (вікно) або 2 (двері) для поверху й секції. Add Facade подає це число в Switch on Int."}, {"en": "Colour: one palette entry per house, picked by the Stream (only when the palette is not empty) and set with Set Material by Name (slot = Plaster Slot) on Walls, Windows and Doors.", "uk": "Колір: один запис палітри на будинок. Його вибирає Stream, лише коли палітра не порожня. Колір задає Set Material by Name (слот = Plaster Slot) на Walls, Windows і Doors."}, {"en": "Has Shop: the front's ground floor turns to plain walls; one SM_ShopFront_A every 2 bays, 1 cm in front of the wall, with SM_Awning_A above it at Awning Height; an odd last bay stays plain. Eight houses with Seeds 1 to 8 in L_Day68, varied but calm from 30 m.", "uk": "Has Shop: перший поверх фасаду стає глухим. Через кожні 2 секції стоїть SM_ShopFront_A, на 1 см попереду стіни, а над нею SM_Awning_A на висоті Awning Height. Непарна остання секція лишається глухою. У L_Day68 вісім будинків із Seed від 1 до 8: різні, але спокійні з 30 м."}], "piece1": "Seed, mirrored window columns, the palette and shop fronts (lessons)", "piece2": {"en": "Tuning, and an eight-house street that reads as designed, on your own", "uk": "Самостійно: налаштування й вулиця з восьми будинків, що виглядає задуманою"}, "steps": [{"text": {"en": "Check: the results of today's lessons are there (Seed, Window Chance, Has Shop, Fill Window Columns, Pick Piece and Add Shops in BP_Building, and the new fields in PDA_BuildingStyle). Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it. Check PDA_BuildingStyle's new fields and fill them in all three DA_Style_* (3 to 5 palette colours each, the shop front, the awning and its height). Check: no new field reads None and every Palette has at least 3 entries.", "uk": "Спершу переконайся, що результати сьогоднішніх уроків на місці: Seed, Window Chance, Has Shop, Fill Window Columns, Pick Piece і Add Shops у BP_Building та нові поля в PDA_BuildingStyle. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Заповни нові поля PDA_BuildingStyle у всіх трьох DA_Style_*: 3–5 кольорів палітри, фасад крамниці, навіс і його висоту. Перевірка: жодне нове поле не показує None, а в кожній Palette щонайменше 3 записи."}, "lesson": 3}, {"text": {"en": "Check BP_Building against the spec: Seed, Window Chance, Has Shop, Set Stream at the top, Fill Window Columns, Pick Piece and Add Shops. Compile. Check: a green tick and no warnings.", "uk": "Звір BP_Building з вимогами: Seed, Window Chance, Has Shop, Set Stream на початку, Fill Window Columns, Pick Piece і Add Shops. Клацни Compile. Перевірка: зелена позначка й жодних попереджень."}, "lesson": 2}, {"text": {"en": "Seed test: make L_Day68 in Content/Tools/Day68 (File > New Level > Basic); on a 6-bay, 3-floor house write down the window pattern and colour at Seed 3, try two other Seeds, then type 3 again. Check: Seed 3 gives exactly the house you wrote down.", "uk": "Перевір зерно. Створи L_Day68 у Content/Tools/Day68 (File > New Level > Basic). На будинку з 6 секцій і 3 поверхів запиши візерунок вікон і колір при Seed 3. Спробуй ще два Seed і знову введи 3. Перевірка: Seed 3 дає точно записаний будинок."}, "lesson": 1}, {"text": {"en": "Symmetry test: Bays 5, 6 and 7 with three Seeds each. Check: every front mirrors about its middle and every window column runs straight from the first floor to the top.", "uk": "Перевір симетрію: Bays 5, 6 і 7, для кожного три Seed. Перевірка: кожен фасад віддзеркалено відносно середини, а кожна колонка вікон іде прямо від першого поверху до верху."}, "lesson": 2}, {"text": {"en": "Palette test: five Seeds on one house. Check: every colour comes from the style's Palette, and the window and door walls always match the plain walls.", "uk": "Перевір палітру: п'ять Seed на одному будинку. Перевірка: кожен колір береться з Palette стилю, а стіни з вікнами й дверима завжди того ж кольору, що й глухі."}, "lesson": 3}, {"text": {"en": "Shop test: Has Shop on with Bays 4, 5 and 6. Check: 2 shop fronts; 2 fronts and a plain fifth bay; 3 fronts; an awning above each, and no flicker where the fronts meet the wall.", "uk": "Перевір крамницю: Has Shop увімкнено, Bays 4, 5 і 6. Перевірка: 2 фасади крамниць; 2 фасади й глуха п'ята секція; 3 фасади. Над кожним навіс, і жодного мерехтіння там, де фасад крамниці сходиться зі стіною."}, "lesson": 4}, {"text": {"en": "Back and sides: walk round a shop house. Check: the back has mirrored windows and no door, the sides stay plain, and the roof still closes.", "uk": "Перевір тил і боки: обійди будинок із крамницею. Перевірка: ззаду віддзеркалені вікна й немає дверей, боки глухі, а дах закривається."}, "lesson": 2}, {"text": {"en": "Tune Window Chance: try 0.3, 0.7 and 1.0 on the same Seed and keep the value that reads as a real street. Check: you can say in one sentence why your choice looks right.", "uk": "Налаштуй Window Chance: спробуй 0.3, 0.7 і 1.0 з тим самим Seed і лиши значення, що виглядає як справжня вулиця. Перевірка: ти можеш одним реченням пояснити, чому твій вибір виглядає правильно."}, "lesson": 2}, {"text": {"en": "On your own, build an eight-house street in L_Day68: Seeds 1 to 8, all three styles, Has Shop on three houses, Bays 3 to 6, Floors 2 to 4. If two neighbours share a colour, change one Seed. Save L_Day68 (Ctrl+S), open any other level and open L_Day68 again. Check: the reopened level holds all eight houses, and from 30 m the street varies but stays calm, with no two neighbours alike.", "uk": "Самостійно збудуй у L_Day68 вулицю з восьми будинків: Seed від 1 до 8, усі три стилі, Has Shop на трьох будинках, Bays від 3 до 6, Floors від 2 до 4. Якщо два сусіди одного кольору, зміни одне Seed. Збережи L_Day68 (Ctrl+S), відкрий будь-який інший рівень, а тоді знову L_Day68. Перевірка: у відкритому знову рівні всі вісім будинків, а з 30 м вулиця різноманітна, але спокійна, і жодні два сусіди не однакові."}, "lesson": 4}, {"text": {"en": "Take street_day68.png (the eight houses from 30 m). Check: the picture is in today's Work folder.", "uk": "Зроби скриншот street_day68.png: вісім будинків з 30 м. Перевірка: зображення в робочій папці дня."}, "lesson": 1}, {"text": {"en": "Click Copy the day report, paste it into a new tutor chat, answer its questions and save its answer as summary.md in today's Work folder. Drag summary.md and street_day68.png into today's hand-in folder (the button on this page); never a project or level folder. Check: the hand-in folder lists 2 files, each over 1 KB.", "uk": "Клацни «Копіювати звіт дня», встав текст у новий чат із тьютором, дай відповіді на його запитання й збережи відповідь як summary.md у робочій папці дня. Здай роботу: перетягни файли в сьогоднішню папку здачі (кнопка на цій сторінці): summary.md і street_day68.png. Ніколи не здавай папку проєкту чи рівня. Перевірка: у папці здачі 2 файли, кожен більший за 1 КБ."}, "lesson": 4}], "assets": ["techart/code-style.md"], "next": {"en": "These seeded rules make the houses of your street block on Day 69 and of every quarter BP_TownGenerator builds from Day 89.", "uk": "Ці правила із зерном будуватимуть будинки твого вуличного кварталу в День 69 і кожного мікрорайону, який з Дня 89 будує BP_TownGenerator."}}, "lessons": [{"title": {"en": "Arrays and a seed per building", "uk": "Масиви й зерно на будівлю"}, "minutes": 40, "goals": [{"en": "Explain an array: a list of values of one type, in order, read by its index from 0.", "uk": "Пояснювати, що таке масив: упорядкований список значень одного типу. Елементи читають за індексом, починаючи з 0."}, {"en": "Give BP_Building a Seed and a Stream, as on Day 63, and fill a Boolean array Window Columns with one random choice per bay.", "uk": "Давати BP_Building Seed і Stream, як у День 63, і заповнювати масив Boolean Window Columns одним випадковим вибором на секцію."}, {"en": "Read an array with Get (a copy) and its size with Length.", "uk": "Читати елемент масиву вузлом Get (копія), а його розмір — вузлом Length."}], "doalong": [{"en": "Add Seed (Integer, default 1, ranges 0 to 9999) and Window Chance (Float, default 0.7, ranges 0 to 1) to BP_Building, Instance Editable, Category Tool, with tooltips. At the very top of the Construction Script add Make Random Stream (Seed) > Promote to Variable, named Stream. You see Set Stream before Is Valid.", "uk": "Додай до BP_Building Seed (Integer, типово 1, від 0 до 9999) і Window Chance (Float, типово 0.7, від 0 до 1): Instance Editable, Category Tool, з підказками. На самому початку Construction Script додай Make Random Stream (Seed) > Promote to Variable з назвою Stream. Має вийти Set Stream перед Is Valid."}, {"en": "Add a variable Window Columns of type Boolean, then click the small type icon beside its type and choose Array (the grid icon). You see Window Columns with a grid icon: a list of true or false values.", "uk": "Додай змінну Window Columns типу Boolean. Клацни маленький значок біля її типу й вибери Array (значок сітки). Біля Window Columns з'являється значок сітки: це список значень true або false."}, {"en": "Make a function Fill Window Columns: Window Columns > Clear; a For Loop from 0 to Bays minus 1; in the body Window Columns > Add with the value Random Bool with Weight from Stream (Random Stream = Stream, Weight = Window Chance). Call it right after Apply Style. You see the list refilled at every rebuild.", "uk": "Створи функцію Fill Window Columns: Window Columns > Clear, потім For Loop від 0 до Bays мінус 1. У тілі циклу Window Columns > Add зі значенням Random Bool with Weight from Stream (Random Stream = Stream, Weight = Window Chance). Виклич функцію одразу після Apply Style. Тепер список заповнюється заново після кожної перебудови."}, {"en": "After the loop's Completed, Print String the Length of Window Columns. Compile and set Bays to 6. You see 6. Delete the Print String.", "uk": "Після Completed циклу виведи Length від Window Columns вузлом Print String. Клацни Compile і встанови Bays 6. Має вийти 6. Видали Print String."}, {"en": "In Add Facade replace the Windows test with Window Columns > Get (index = inner Index), combined with the Windows input by an AND. Compile. You see each column either all windows or all plain wall from bottom to top, and a new pattern for each new Seed.", "uk": "В Add Facade заміни перевірку Windows на Window Columns > Get (індекс = внутрішній Index), поєднану з входом Windows вузлом AND. Клацни Compile. Кожна колонка від низу до верху або вся з вікон, або вся глуха. Кожне нове Seed дає новий візерунок."}], "play": {"en": "Array drill: the tutor gives me the array [true, false, true, true] and asks for indexes 0 to 4. I say each value, and what is wrong with index 4 (there is nothing there; the last index is Length minus 1).", "uk": "Тренування з масивом: тьютор дає масив [true, false, true, true] і просить значення за індексами від 0 до 4. Я називаю кожне значення й пояснюю, що не так з індексом 4: там нічого немає, бо останній індекс — Length мінус 1."}, "video": {"search": "unreal engine 5 blueprint arrays beginners add get length"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Масиви й зерно на будівлю (Day 68, lesson 1 of 4). Today's build: BP_Building із різноманіттям, що досі виглядає задуманим: Seed, колонки вікон, віддзеркалені відносно середини, фасади крамниць і навіси на першому поверсі та колір стіни з палітри стилю.\nWhat I already know: День 67: BP_Building (Add Facade, Apply Style, Clear All, Add Corners, Add Roof); День 63: Make Random Stream, Random Bool with Weight from Stream, Switch on Int; День 13, День 16 і День 17: SM_ShopFront_A, твоя палітра і SM_Awning_A або твої власні. Пропущено День 16? Візьми 3–5 кольорів стін з одного фото-референсу..\n\nBy the end of this lesson I can:\n1. Пояснювати, що таке масив: упорядкований список значень одного типу. Елементи читають за індексом, починаючи з 0.\n2. Давати BP_Building Seed і Stream, як у День 63, і заповнювати масив Boolean Window Columns одним випадковим вибором на секцію.\n3. Читати елемент масиву вузлом Get (копія), а його розмір — вузлом Length.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: Ти маєш BP_Building, що будує будинок на чотири боки з дахом із будь-якого DA_Style_*. Today: Ти додаєш різноманіття, що досі виглядає задуманим: колонки вікон із зерном, віддзеркалені фасади, палітру й фасади крамниць. One encouraging line: Завдяки правилам випадковість виглядає навмисною. Сьогодні ти пишеш кілька добрих правил.); 2 lines on why today matters and where it comes back, in plain words (from this: Вулиця з однакових будинків виглядає як помилка копіювання, а вулиця з випадкового шуму — як збій. Справжні вулиці різняться за правилами: вікна стоять колонками, фасади часто симетричні, крамниці на першому поверсі, а кольори з місцевої палітри. Якщо записати ці правила в генератор, результат виглядає задуманим. Саме за цю різницю студії й платять. It comes back: Ці правила із зерном будуватимуть будинки твого вуличного кварталу в День 69 і кожного мікрорайону, який з Дня 89 будує BP_TownGenerator.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-68-building-variation-shops-palette exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (Seed, віддзеркалені колонки вікон, палітра й фасади крамниць (уроки)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Додай до BP_Building Seed (Integer, типово 1, від 0 до 9999) і Window Chance (Float, типово 0.7, від 0 до 1): Instance Editable, Category Tool, з підказками. На самому початку Construction Script додай Make Random Stream (Seed) > Promote to Variable з назвою Stream. Має вийти Set Stream перед Is Valid.\n   2. Додай змінну Window Columns типу Boolean. Клацни маленький значок біля її типу й вибери Array (значок сітки). Біля Window Columns з'являється значок сітки: це список значень true або false.\n   3. Створи функцію Fill Window Columns: Window Columns > Clear, потім For Loop від 0 до Bays мінус 1. У тілі циклу Window Columns > Add зі значенням Random Bool with Weight from Stream (Random Stream = Stream, Weight = Window Chance). Виклич функцію одразу після Apply Style. Тепер список заповнюється заново після кожної перебудови. [screenshot]\n   4. Після Completed циклу виведи Length від Window Columns вузлом Print String. Клацни Compile і встанови Bays 6. Має вийти 6. Видали Print String.\n   5. В Add Facade заміни перевірку Windows на Window Columns > Get (індекс = внутрішній Index), поєднану з входом Windows вузлом AND. Клацни Compile. Кожна колонка від низу до верху або вся з вікон, або вся глуха. Кожне нове Seed дає новий візерунок. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Тренування з масивом: тьютор дає масив [true, false, true, true] і просить значення за індексами від 0 до 4. Я називаю кожне значення й пояснюю, що не так з індексом 4: там нічого немає, бо останній індекс — Length мінус 1. Otherwise skip it.\n6. Review: ask me these questions from earlier days, one at a time, and correct me kindly: Day 65: what does Inland Side do in BP_Promenade? | Day 63: Gap Chance is 0.25; about how many of 40 slots stay empty?\n7. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n8. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; review (by tutor or art director) = огляд; reference photo / hero photo = фото-референс / ключове фото; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); default value = типове значення; File Explorer = Провідник; mesh = меш; grid = сітка (тільки grid, ніколи mesh); vertex / edge / face = вершина / ребро / грань; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; material instance / child instance = інстанс / дочірній інстанс; material slot / node / pin = слот матеріалу / вузол / вхід; seed = зерно (налаштування Seed); district / plot / plot plan = район / ділянка / план ділянки; harbour / quay / wat use with Random Integer in Range from Stream (0 to Last Index), only when the palette is not empty.", "uk": "Вибирати один запис палітри на будинок вузлом Random Integer in Range from Stream (від 0 до Last Index), лише коли палітра не порожня."}, {"en": "Set the colour on every wall type with Set Material by Name, using the plaster slot's name, so plain walls, window walls and door walls match.", "uk": "Фарбувати кожен тип стіни вузлом Set Material by Name за назвою слота штукатурки, щоб глухі стіни, стіни з вікнами й стіни з дверима були одного кольору."}], "doalong": [{"en": "Open SM_Wall_Window and read Details > Material Slots: note the plaster slot's name (for example M_Plaster) and do the same for SM_Wall_Door. In PDA_BuildingStyle add Palette (Material Instance, made an Array) and Plaster Slot (Name, default the slot name you read), both Instance Editable, Category Look. Compile. You see two new fields.", "uk": "Відкрий SM_Wall_Window і прочитай Details > Material Slots. Запиши назву слота штукатурки, наприклад M_Plaster, і так само для SM_Wall_Door. У PDA_BuildingStyle додай Palette (масив Material Instance) і Plaster Slot (Name, типово назва слота з Material Slots), обидва Instance Editable, Category Look. Клацни Compile. Має вийти два нові поля."}, {"en": "Make 3 to 5 children of MI_Plaster with Tints from your Day 16 palette (MI_Plaster_<Colour>) and add them to DA_Style_Harbour's Palette (click + for each entry). Fill the other two styles the same way. You see a Palette list in every style.", "uk": "Зроби 3–5 дочірніх інстансів MI_Plaster з Tint із палітри Дня 16 (MI_Plaster_<Колір>). Додай їх до Palette в DA_Style_Harbour: клацай + для кожного запису. Так само заповни два інші стилі. У кожному стилі має бути список Palette."}, {"en": "In Apply Style add a Branch: Length of Style's Palette > 0. On True: Style > Palette > Get with index Random Integer in Range from Stream (Stream, 0, Last Index of Palette); promote the result to a local variable Wall Colour. You see one colour chosen per rebuild, and nothing tried on an empty palette.", "uk": "В Apply Style додай Branch: Length від Palette стилю > 0. При True візьми Style > Palette > Get з індексом Random Integer in Range from Stream (Stream, 0, Last Index від Palette). Зроби з результату локальну змінну Wall Colour (Promote to Local Variable). Тепер на кожну перебудову вибирається один колір, а з порожньою палітрою нічого не відбувається."}, {"en": "Then Set Material by Name on Walls, Windows and Doors: Material Slot Name = Style's Plaster Slot, Material = Wall Colour. If Set Material by Name is not offered, use Set Material with the slot's index from Material Slots. Compile. You see the whole house in one palette colour, and another colour for another Seed.", "uk": "Потім додай Set Material by Name на Walls, Windows і Doors: Material Slot Name = Plaster Slot зі Style, Material = Wall Colour. Якщо Set Material by Name немає в списку, візьми Set Material з індексом слота з Material Slots. Клацни Compile. Увесь будинок одного кольору з палітри, а інше Seed дає інший колір."}, {"en": "Remove the Branch for a moment and give a style an empty Palette. You see a warning about index 0 in an array of length 0 in the Output Log; put the Branch back and the warning stops.", "uk": "На хвилину прибери Branch і дай стилю порожню Palette. Output Log попереджає про індекс 0 у масиві довжиною 0. Поверни Branch — попередження зникає."}], "play": {"en": "Palette critic: the tutor lists six colours for a harbour street (white, ochre, sea blue, bright magenta, pale pink, dark grey). I choose the 3 to 5 that make a believable palette and say why I dropped the rest.", "uk": "Критик палітри: тьютор перелічує шість кольорів для портової вулиці — білий, охристий, морський синій, яскравий пурпуровий, блідо-рожевий, темно-сірий. Я вибираю 3–5, що складають правдоподібну палітру, і пояснюю, чому решта не підходить."}, "video": {"search": "unreal engine 5 set material by name blueprint material slots"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Колір з палітри (Day 68, lesson 3 of 4). Today's build: BP_Building із різноманіттям, що досі виглядає задуманим: Seed, колонки вікон, віддзеркалені відносно середини, фасади крамниць і навіси на першому поверсі та колір стіни з палітри стилю.\nWhat I already know: День 67: BP_Building (Add Facade, Apply Style, Clear All, Add Corners, Add Roof); День 63: Make Random Stream, Random Bool with Weight from Stream, Switch on Int; День 13, День 16 і День 17: SM_ShopFront_A, твоя палітра і SM_Awning_A або твої власні. Пропущено День 16? Візьми 3–5 кольорів стін з одного фото-референсу..\nEarlier today I already did: lesson 1 (Масиви й зерно на будівлю); lesson 2 (Спокій за правилом: симетрія і функція вибору). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Додавати масив Palette до PDA_BuildingStyle і заповнювати кожен стиль 3–5 кольорами стін.\n2. Вибирати один запис палітри на будинок вузлом Random Integer in Range from Stream (від 0 до Last Index), лише коли палітра не порожня.\n3. Фарбувати кожен тип стіни вузлом Set Material by Name за назвою слота штукатурки, щоб глухі стіни, стіни з вікнами й стіни з дверима були одного кольору.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: 2 lines on why today matters and where it comes back, in plain words (from this: Вулиця з однакових будинків виглядає як помилка копіювання, а вулиця з випадкового шуму — як збій. Справжні вулиці різняться за правилами: вікна стоять колонками, фасади часто симетричні, крамниці на першому поверсі, а кольори з місцевої палітри. Якщо записати ці правила в генератор, результат виглядає задуманим. Саме за цю різницю студії й платять. It comes back: Ці правила із зерном будуватимуть будинки твого вуличного кварталу в День 69 і кожного мікрорайону, який з Дня 89 будує BP_TownGenerator.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-68-building-variation-shops-palette exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (Seed, віддзеркалені колонки вікон, палітра й фасади крамниць (уроки)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Відкрий SM_Wall_Window і прочитай Details > Material Slots. Запиши назву слота штукатурки, наприклад M_Plaster, і так само для SM_Wall_Door. У PDA_BuildingStyle додай Palette (масив Material Instance) і Plaster Slot (Name, типово назва слота з Material Slots), обидва Instance Editable, Category Look. Клацни Compile. Має вийти два нові поля.\n   2. Зроби 3–5 дочірніх інстансів MI_Plaster з Tint із палітри Дня 16 (MI_Plaster_<Колір>). Додай їх до Palette в DA_Style_Harbour: клацай + для кожного запису. Так само заповни два інші стилі. У кожному стилі має бути список Palette.\n   3. В Apply Style додай Branch: Length від Palette стилю > 0. При True візьми Style > Palette > Get з індексом Random Integer in Range from Stream (Stream, 0, Last Index від Palette). Зроби з результату локальну змінну Wall Colour (Promote to Local Variable). Тепер на кожну перебудову вибирається один колір, а з порожньою палітрою нічого не відбувається. [screenshot]\n   4. Потім додай Set Material by Name на Walls, Windows і Doors: Material Slot Name = Plaster Slot зі Style, Material = Wall Colour. Якщо Set Material by Name немає в списку, візьми Set Material з індексом слота з Material Slots. Клацни Compile. Увесь будинок одного кольору з палітри, а інше Seed дає інший колір.\n   5. На хвилину прибери Branch і дай стилю порожню Palette. Output Log попереджає про індекс 0 у масиві довжиною 0. Поверни Branch — попередження зникає. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Критик палітри: тьютор перелічує шість кольорів для портової вулиці — білий, охристий, морський синій, яскравий пурпуровий, блідо-рожевий, темно-сірий. Я вибираю 3–5, що складають правдоподібну палітру, і пояснюю, чому решта не підходить. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; see-why-fix note = нотатка «бачу, чому, як виправити»; reference photo / hero photo = фото-референс / ключове фото; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); default value = типове значення; File Explorer = Провідник; mesh = меш; grid = сітка (тільки grid, ніколи mesh); vertex / edge / face = вершина / ребро / грань; look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; grey box placeholder = сірий блок (заглушка); material instance / child instance = інстанс / дочірній інстанс; material slot / node / pin = слот матеріалу / вузол / вхід; seed = зерно (налаштування Seed); district / plot / plot plan = район / ділянка / план ділянки; harbour / quay / waterfront / pier = гавань / причал / набережна / пірс; shop front / shop window = фасад крамниці / вітрина; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ; shot set = серія кадрів.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}, {"title": {"en": "Shop fronts and awnings", "uk": "Фасади крамниць і навіси"}, "minutes": 40, "goals": [{"en": "Add Has Shop: the front's ground floor becomes plain walls with SM_ShopFront_A every 2 bays, 1 cm in front of the wall.", "uk": "Додавати Has Shop: перший поверх фасаду стає глухим, а через кожні 2 секції стоїть SM_ShopFront_A, на 1 см попереду стіни."}, {"en": "Add an awning above each shop front at the style's Awning Height.", "uk": "Додавати навіс над кожним фасадом крамниці на висоті Awning Height зі стилю."}, {"en": "Handle the odd bay: a 5-bay shop house gets two fronts and one plain bay.", "uk": "Давати раду непарній секції: будинок із крамницею на 5 секцій отримує два фасади крамниць і одну глуху секцію."}], "doalong": [{"en": "In PDA_BuildingStyle add Shop Front and Awning (Static Mesh) and Awning Height (Float, cm), Instance Editable; fill them in each style with SM_ShopFront_A, SM_Awning_A and the height where your awning hangs (about 250: on Day 17 its back edge hangs 2.5 m up, just under the shop front's fascia).", "uk": "У PDA_BuildingStyle додай Shop Front і Awning (Static Mesh) та Awning Height (Float, см), усі Instance Editable. У кожному стилі заповни їх: SM_ShopFront_A, SM_Awning_A і висота навісу, близько 250. У День 17 задній край навісу висить на 2,5 м, трохи нижче вивісної дошки фасаду крамниці."}, {"en": "In BP_Building add components ShopFronts and Awnings, set their meshes in Apply Style and clear them in Clear All. You see two new components. Add Has Shop (Boolean, Instance Editable, Category Tool). In Pick Piece add a first rule: if Door AND Has Shop AND Floor == 0, return 0 (a plain wall). You see the front's ground floor turn plain when Has Shop is ticked.", "uk": "У BP_Building додай компоненти ShopFronts і Awnings, задай їм меші в Apply Style й очищай у Clear All. Додай Has Shop (Boolean, Instance Editable, Category Tool). У Pick Piece додай перше правило: якщо Door AND Has Shop AND Floor == 0, поверни 0 (глуха стіна). Коли Has Shop позначено, перший поверх фасаду стає глухим."}, {"en": "Make a function Add Shops: a Branch on Has Shop; on True a For Loop from 0 to (Bays / 2) minus 1. ShopFronts: Add Instance at (Index x 2 x Bay Width, -11, 0): your walls are 20 cm thick and centred on their line, so their outside face is at Y -10, and -11 leaves a 1 cm gap.", "uk": "Створи функцію Add Shops: Branch на Has Shop, а при True — For Loop від 0 до (Bays / 2) мінус 1. ShopFronts: Add Instance у (Index × 2 × Bay Width, -11, 0). Твої стіни завтовшки 20 см і стоять по центру своєї лінії, тож зовнішня грань на Y -10, а -11 лишає проміжок 1 см."}, {"en": "Awnings: Add Instance at (Index x 2 x Bay Width + 80, -41, Awning Height): 80 cm in centres the 2.4 m awning on the 4 m front, and -41 hangs it on the face of the 30 cm deep shop front (if it hangs off to one side, its pivot is on the other corner: use + 320).", "uk": "Awnings: Add Instance у (Index × 2 × Bay Width + 80, -41, Awning Height). Зсув 80 см ставить навіс завширшки 2,4 м по центру фасаду крамниці завширшки 4 м. -41 вішає його на лицьову грань фасаду крамниці глибиною 30 см. Якщо навіс з'їхав убік, його origin на іншому куті: візьми + 320."}, {"en": "Call it after Add Corners. You see shop fronts across the ground floor with awnings above. Set Bays to 5, then 1. You see two shop fronts and a plain fifth bay (5 / 2 = 2 fronts), then no front at all: a shop needs at least 2 bays.", "uk": "Виклич функцію після Add Corners: на першому поверсі фасади крамниць, над ними навіси. Встанови Bays на 5, потім на 1. Спершу два фасади крамниць і глуха п'ята секція (5 / 2 = 2), потім жодного: крамниці потрібно щонайменше 2 секції."}, {"en": "Look at a shop front from 2 m. You see no flicker: the 1 cm gap keeps the front's back from fighting with the wall surface.", "uk": "Подивись на фасад крамниці з 2 м. Мерехтіння немає: проміжок 1 см не дає задній стінці фасаду крамниці змагатися з поверхнею стіни."}], "play": {"en": "Street reader: the tutor describes a ground floor (two shops and a door; one wide shop; a garage). I say which rules and settings of BP_Building would build it, and what is still missing.", "uk": "Читач вулиці: тьютор описує перший поверх — дві крамниці й двері, одна широка крамниця або гараж. Я кажу, які правила й налаштування BP_Building його збудували б і чого ще бракує."}, "video": {"search": "procedural building facade shop fronts unreal blueprint"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. This lesson teaches Blueprints or Python, so you may show code or node chains, but only in small pieces of about 15 lines or fewer at a time. Explain every line or node in plain words, let me type, run and check it myself, and never hand me a finished tool. Don't make web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Фасади крамниць і навіси (Day 68, lesson 4 of 4). Today's build: BP_Building із різноманіттям, що досі виглядає задуманим: Seed, колонки вікон, віддзеркалені відносно середини, фасади крамниць і навіси на першому поверсі та колір стіни з палітри стилю.\nWhat I already know: День 67: BP_Building (Add Facade, Apply Style, Clear All, Add Corners, Add Roof); День 63: Make Random Stream, Random Bool with Weight from Stream, Switch on Int; День 13, День 16 і День 17: SM_ShopFront_A, твоя палітра і SM_Awning_A або твої власні. Пропущено День 16? Візьми 3–5 кольорів стін з одного фото-референсу..\nEarlier today I already did: lesson 1 (Масиви й зерно на будівлю); lesson 2 (Спокій за правилом: симетрія і функція вибору); lesson 3 (Колір з палітри). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Додавати Has Shop: перший поверх фасаду стає глухим, а через кожні 2 секції стоїть SM_ShopFront_A, на 1 см попереду стіни.\n2. Додавати навіс над кожним фасадом крамниці на висоті Awning Height зі стилю.\n3. Давати раду непарній секції: будинок із крамницею на 5 секцій отримує два фасади крамниць і одну глуху секцію.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: 2 lines on why today matters and where it comes back, in plain words (from this: Вулиця з однакових будинків виглядає як помилка копіювання, а вулиця з випадкового шуму — як збій. Справжні вулиці різняться за правилами: вікна стоять колонками, фасади часто симетричні, крамниці на першому поверсі, а кольори з місцевої палітри. Якщо записати ці правила в генератор, результат виглядає задуманим. Саме за цю різницю студії й платять. It comes back: Ці правила із зерном будуватимуть будинки твого вуличного кварталу в День 69 і кожного мікрорайону, який з Дня 89 будує BP_TownGenerator.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-68-building-variation-shops-palette exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (Seed, віддзеркалені колонки вікон, палітра й фасади крамниць (уроки)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. У PDA_BuildingStyle додай Shop Front і Awning (Static Mesh) та Awning Height (Float, см), усі Instance Editable. У кожному стилі заповни їх: SM_ShopFront_A, SM_Awning_A і висота навісу, близько 250. У День 17 задній край навісу висить на 2,5 м, трохи нижче вивісної дошки фасаду крамниці.\n   2. У BP_Building додай компоненти ShopFronts і Awnings, задай їм меші в Apply Style й очищай у Clear All. Додай Has Shop (Boolean, Instance Editable, Category Tool). У Pick Piece додай перше правило: якщо Door AND Has Shop AND Floor == 0, поверни 0 (глуха стіна). Коли Has Shop позначено, перший поверх фасаду стає глухим.\n   3. Створи функцію Add Shops: Branch на Has Shop, а при True — For Loop від 0 до (Bays / 2) мінус 1. ShopFronts: Add Instance у (Index × 2 × Bay Width, -11, 0). Твої стіни завтовшки 20 см і стоять по центру своєї лінії, тож зовнішня грань на Y -10, а -11 лишає проміжок 1 см. [screenshot]\n   4. Awnings: Add Instance у (Index × 2 × Bay Width + 80, -41, Awning Height). Зсув 80 см ставить навіс завширшки 2,4 м по центру фасаду крамниці завширшки 4 м. -41 вішає його на лицьову грань фасаду крамниці глибиною 30 см. Якщо навіс з'їхав убік, його origin на іншому куті: візьми + 320.\n   5. Виклич функцію після Add Corners: на першому поверсі фасади крамниць, над ними навіси. Встанови Bays на 5, потім на 1. Спершу два фасади крамниць і глуха п'ята секція (5 / 2 = 2), потім жодного: крамниці потрібно щонайменше 2 секції.\n   6. Подивись на фасад крамниці з 2 м. Мерехтіння немає: проміжок 1 см не дає задній стінці фасаду крамниці змагатися з поверхнею стіни. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Читач вулиці: тьютор описує перший поверх — дві крамниці й двері, одна широка крамниця або гараж. Я кажу, які правила й налаштування BP_Building його збудували б і чого ще бракує. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; reference photo / hero photo = фото-референс / ключове фото; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); File Explorer = Провідник; mesh = меш; grid = сітка (тільки grid, ніколи mesh); vertex / edge / face = вершина / ребро / грань; origin (and kit pivot) = origin — точка, за яку об'єкт ставлять і обертають; world origin / 3D cursor = центр світу / 3D-курсор; look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; material instance / child instance = інстанс / дочірній інстанс; material slot / node / pin = слот матеріалу / вузол / вхід; seed = зерно (налаштування Seed); district / plot / plot plan = район / ділянка / план ділянки; harbour / quay / waterfront / pier = гавань / причал / набережна / пірс; shop front / shop window = фасад крамниці / вітрина; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ; shot set = серія кадрів.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}], "handin": [{"en": "summary.md", "uk": "summary.md (звіт дня)"}, {"en": "street_day68.png (eight seeded houses from 30 m, varied but calm) (proof)", "uk": "street_day68.png (вісім будинків із зерном з 30 м, різні, але спокійні) (доказ)"}], "goal": {"en": "By the end of today you have BP_Building with a Seed: windows chosen per column and mirrored for a calm facade, shop fronts with awnings on the ground floor when Has Shop is on, and a wall colour picked from the style's palette.", "uk": "До кінця дня ти матимеш BP_Building із Seed. Вікна вибираються на колонку й віддзеркалюються, тож фасад спокійний. Коли ввімкнено Has Shop, на першому поверсі з'являються фасади крамниць із навісами. Колір стіни береться з палітри стилю."}, "uses": [{"en": "Day 67: BP_Building (Add Facade, Apply Style, Clear All, Add Corners, Add Roof)", "uk": "День 67: BP_Building (Add Facade, Apply Style, Clear All, Add Corners, Add Roof)"}, {"en": "Day 63: Make Random Stream, Random Bool with Weight from Stream, Switch on Int", "uk": "День 63: Make Random Stream, Random Bool with Weight from Stream, Switch on Int"}, {"en": "Day 13, Day 16 and Day 17: SM_ShopFront_A, your palette and SM_Awning_A (or your own; skipped Day 16? pick 3 to 5 wall colours from one reference photo)", "uk": "День 13, День 16 і День 17: SM_ShopFront_A, твоя палітра і SM_Awning_A або твої власні. Пропущено День 16? Візьми 3–5 кольорів стін з одного фото-референсу."}], "quiz": [{"q": {"en": "Why do the windows of your generated house line up from floor to floor?", "uk": "Чому вікна згенерованого будинку стоять одне над одним на всіх поверхах?"}, "options": [{"en": "Each bay column gets one random choice, used on every floor", "uk": "Кожна колонка секцій отримує один випадковий вибір, і він діє на всіх поверхах"}, {"en": "The Seed is 0", "uk": "Seed дорівнює 0"}, {"en": "Window Chance is 1", "uk": "Window Chance дорівнює 1"}], "answer": 0, "explain": {"en": "Window Columns

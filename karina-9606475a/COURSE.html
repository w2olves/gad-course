<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: course map</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

.wrap{max-width:1100px;margin:0 auto;padding:16px 22px 96px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;padding:8px 10px 8px 8px;position:sticky;top:12px;z-index:5}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;font:700 17px/1 var(--head);color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 0 16px var(--glow)}
.who b{font:600 15.5px/1.2 var(--head)}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:24px 48px;align-items:center;padding:52px 0 44px}
h1{font:700 clamp(36px,5.6vw,60px)/1.05 var(--head);letter-spacing:-.025em;margin:14px 0 14px}
.sub{font:500 18px/1.55 var(--sans);color:var(--muted);margin:0 0 28px;max-width:44ch}
.panel{display:grid;grid-template-columns:auto auto 1fr;gap:16px 18px;align-items:center;padding:16px 18px;border-radius:24px;margin:0 0 26px;max-width:540px}
.panel .lcd .seg7{height:30px}
.go{display:inline-flex;align-items:center;gap:16px;text-decoration:none;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));border-radius:999px;padding:8px 26px 8px 8px;min-height:64px;max-width:100%;box-shadow:0 14px 30px -10px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:filter .2s}
.go:hover{filter:brightness(1.06);color:#fff}
.go .kn{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.go small{display:block;font:600 10.5px/1.4 var(--head);letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.go span{font:600 14.5px/1.35 var(--head)}
.chart{max-width:420px;width:100%;justify-self:center}
.wk{display:grid;grid-template-columns:150px 1fr;gap:18px 34px;padding:34px 0}
.wl .rn{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font:700 26px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raise);position:relative}
.wl .rn::before{content:"";position:absolute;inset:9px;border-radius:50%;box-shadow:var(--press)}
.wl .rn .ic{width:30px;height:30px;stroke-width:2.2}
.wk.done .wl .rn{color:#fff;background:linear-gradient(145deg,#5fe39a,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.5)}
.wk.done .wl .rn::before{display:none}
.wl .eyebrow{display:block;margin-top:14px}
h2{font:700 24px/1.25 var(--head);letter-spacing:-.015em;margin:4px 0 8px;text-wrap:balance}
.wg{color:var(--muted);margin:0 0 20px;font-size:15.5px;max-width:70ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:18px}
a.tile{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;border-radius:24px;padding:14px 16px 16px;min-height:156px;transition:transform .2s}
a.tile:hover{transform:translateY(-3px)}
a.tile:hover .t{color:var(--accT)}
.tile .hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tile .n{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:700 15px/1 var(--head);color:var(--accT);background:var(--well);box-shadow:var(--press)}
.tile .k{font:600 10px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);text-align:right}
.tile .t{font-size:14.5px;line-height:1.45;color:var(--muted);flex:1;transition:color .2s}
.tile .slider{height:10px}.tile .slider>b{width:18px;height:18px;margin:-9px 0 0 -9px}.tile .slider>b::after{width:5px;height:5px;margin:-2.5px}.tile .slider>i{top:2px;bottom:2px;left:2px}
.tile.ok .n{color:#fff;background:linear-gradient(145deg,#5fe39a,#16a34a);box-shadow:0 0 14px rgba(74,222,128,.5)}
.tile.boss .k{color:var(--boss)}.tile.boss{border-color:rgba(255,95,168,.35)}
.tile.fin .k{color:var(--gold)}.tile.fin{border-color:rgba(245,195,91,.5)}
.tile.next{box-shadow:var(--raise),0 0 0 2px var(--acc),0 0 26px var(--glow)}
@media (max-width:860px){.hero{grid-template-columns:1fr;padding:30px 0 34px}.chart{order:-1;max-width:340px}.wk{grid-template-columns:1fr;padding:24px 0}.wl{display:flex;align-items:center;gap:16px}.wl .rn{width:64px;height:64px;font-size:20px}.wl .eyebrow{margin:0}}
@media (max-width:640px){.wrap{padding:12px 14px 72px}.top{border-radius:26px}a.tile{min-height:0}.panel{grid-template-columns:auto 1fr}.panel .slider{grid-column:1/-1}}
@media print{.sea,.ctrls,.go{display:none}.glass{background:#fff;box-shadow:none}}

.fbt{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;font:600 11px/1.2 var(--head);letter-spacing:.06em;padding:5px 10px;border-radius:999px;background:var(--well);box-shadow:var(--press);color:var(--muted)}
.fbt.ok{color:var(--accT)}.fbt.miss{color:var(--faint)}
.fbt svg{width:14px;height:14px}
.fbnew{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:14px 18px;border-radius:22px;margin:0 0 18px}
.fbnew b{font:700 15px/1.3 var(--head)}
.fbnew .lk{display:flex;flex-wrap:wrap;gap:8px}
.fbnew a{color:var(--accT);font-weight:600;text-decoration:none;padding:6px 12px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.fbsc{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;padding:16px 18px;border-radius:24px;margin:0 0 22px}
.fbsc .v{font:700 26px/1.1 var(--head);color:var(--accT)}
.fbsc p{margin:4px 0 0}
.fbcard .big{font:700 30px/1 var(--head);color:var(--accT)}
.fbcard .note{font-size:16px;line-height:1.55;margin:10px 0}
</style>
</head>

ланом і виміряна бюджетом кадру, з п'ятьма скриншотами поруч із фото-референсами."}}, "10": {"title": {"en": "District 1 finished, district 2 built", "uk": "Район 1 завершено, район 2 збудовано"}, "goal": {"en": "By Friday district 1 is finished with before and after proof, and district 2 stands with its buildings, landmark and roads, inside your budget.", "uk": "До п'ятниці район 1 завершено, з доказами «до і після», а район 2 стоїть із будівлями, орієнтиром і дорогами — і все в межах бюджету."}}, "11": {"title": {"en": "District 2 finished", "uk": "Район 2 завершено"}, "goal": {"en": "By Friday you have district 2 finished: furnished, planted, weathered and joined to the island, with five final shots per district beside real photos.", "uk": "До п'ятниці район 2 завершено: облаштовано, засаджено, зістарено й з'єднано з островом, а по п'ять фінальних кадрів кожного району стоять поруч зі справжніми фото."}}, "12": {"title": {"en": "The whole island, polished, flown and presented", "uk": "Увесь острів: шліфування, проліт і презентація"}, "goal": {"en": "By Friday you have the finished island: a budget proof, a 2-minute flight video, hand-over notes with correct credits, and a portfolio ready for ArtStation.", "uk": "До п'ятниці острів завершено: є доказ бюджету, 2-хвилинне відео прольоту, нотатки до пакета передачі з правильно вказаним авторством (credits.md) і портфоліо, готове для ArtStation."}}}}</script>

function applyTheme(){if(theme==='light'||theme==='dark')document.documentElement.setAttribute('data-theme',theme);else document.documentElement.removeAttribute('data-theme')}
applyTheme();
function setTheme(t){theme=t;try{localStorage.setItem('devteam:theme',t)}catch(e){}applyTheme();document.querySelectorAll('[data-th]').forEach(b=>b.setAttribute('aria-pressed',String(b.getAttribute('data-th')===theme)))}
function controls(L,langFn){const T=TH[L]||TH.uk;
 return '<div class="ctrls"><div class="seg" role="group" aria-label="'+T.theme+'">'+['light','auto','dark'].map(t=>'<button type="button" data-th="'+t+'" aria-pressed="'+(theme===t)+'" aria-label="'+T[t]+'" title="'+T[t]+'" onclick="setTheme(\''+t+'\')">'+ic(t==='light'?'sun':t==='dark'?'moon':'auto')+'</button>').join('')+'</div>'+
 '<div class="seg" role="group" aria-label="'+T.lang+'">'+['uk','en'].map(l=>'<button type="button" lang="'+l+'" aria-pressed="'+(L===l)+'" onclick="'+langFn+'(\''+l+'\')">'+(l==='uk'?'UA':'EN')+'</button>').join('')+'</div></div>'}
/* seven-segment display, like an LCD panel: ghost 8s behind the lit segments */
const SEG={0:'abcdef',1:'bc',2:'abged',3:'abgcd',4:'fgbc',5:'afgcd',6:'afgedc',7:'abc',8:'abcdefg',9:'abcdfg'};
function seg(str,cls){str=String(str);const W=15,H=26,t=2.8,g=.9,P={a:[[g+t/2,0],[W-g-t/2,0],[W-g-t,t],[g+t,t]],d:[[g+t,H-t],[W-g-t,H-t],[W-g-t/2,H],[g+t/2,H]],g:[[g+t,H/2-t/2],[W-g-t,H/2-t/2],[W-g-t/2,H/2],[W-g-t,H/2+t/2],[g+t,H/2+t/2],[g+t/2,H/2]],f:[[0,g+t/2],[t,g+t],[t,H/2-g-t/2],[t/2,H/2-g],[0,H/2-g-t/2]],b:[[W,g+t/2],[W,H/2-g-t/2],[W-t/2,H/2-g],[W-t,H/2-g-t/2],[W-t,g+t]],e:[[0,H/2+g+t/2],[t/2,H/2+g],[t,H/2+g+t/2],[t,H-g-t],[0,H-g-t/2]],c:[[W,H/2+g+t/2],[W,H-g-t/2],[W-t,H-g-t],[W-t,H/2+g+t/2],[W-t/2,H/2+g]]};
 let x=0,o='';for(const ch of str){if(ch===' '){x+=8;continue}if(ch==='/'){o+='<path class="on" d="M'+(x+9)+' 2L'+(x+2)+' '+(H-2)+'L'+(x+4.5)+' '+(H-2)+'L'+(x+11.5)+' 2Z"/>';x+=15;continue}const on=SEG[ch]||'';
  for(const k of 'abcdefg')o+='<polygon class="'+(on.includes(k)?'on':'gh')+'" points="'+P[k].map(p=>(p[0]+x).toFixed(1)+','+p[1].toFixed(1)).join(' ')+'"/>';x+=W+5}
 return '<svg class="seg7'+(cls?' '+cls:'')+'" viewBox="-1 -1 '+(x-3)+' '+(H+2)+'" aria-hidden="true" focusable="false"><g transform="skewX(-6) translate(2 0)">'+o+'</g></svg>'}
/* the chart: a topographic island inside a dial; week w is a waypoint, built (b), being built now (n) or still ahead (p) */
function enc(p,done){const k=p>=1?done:p<=0?'enc0':p<.25?'enc1':p<.5?'enc2':p<.75?'enc3':p<.9?'enc4':'enc5';return u(k)}
function island(state,pct,label){
 const cx=300,cy=205,R=172,TAU=Math.PI*2;
 const rad=(t,s,k)=>R*s*(1+.11*Math.sin(2*t+.6+k*.05)+.07*Math.sin(3*t+1.9-k*.08)+.045*Math.sin(5*t+.3+k*.11)+.02*Math.sin(7*t+2.2));
 const pt=(t,s,k)=>{const r=rad(t,s,k||0);return [cx+r*Math.cos(t),cy+r*Math.sin(t)*.78]};
 const f=n=>n.toFixed(1);
 const smooth=(P,closed)=>{let d='M'+f(P[0][0])+' '+f(P[0][1]);const n=P.length,g=i=>P[closed?(i+n)%n:Math.max(0,Math.min(n-1,i))];
  for(let i=0;i<(closed?n:n-1);i++){const p0=g(i-1),p1=g(i),p2=g(i+1),p3=g(i+2);d+='C'+f(p1[0]+(p2[0]-p0[0])/6)+' '+f(p1[1]+(p2[1]-p0[1])/6)+' '+f(p2[0]-(p3[0]-p1[0])/6)+' '+f(p2[1]-(p3[1]-p1[1])/6)+' '+f(p2[0])+' '+f(p2[1])}return d+(closed?'Z':'')};
 const ring=(s,k)=>{const P=[];for(let i=0;i<64;i++)P.push(pt(i/64*TAU,s,k));return smooth(P,true)};
 let o='<path class="c0" d="'+ring(1,0)+'"/>';
 [.84,.69,.55,.42,.3,.19,.1].forEach((s,k)=>o+='<path class="c" d="'+ring(s,k+1)+'"/>');
 const t0=-2.2,turns=1.55,wp=w=>{const t=(w-1)/11;return {a:t0+t*turns*TAU,s:1.1-t*.98}};
 const P=[],D=[];let last=0;for(let w=1;w<=12;w++)if(state(w)!=='p')last=w;
 for(let i=0;i<=110;i++){const t=i/110,a=t0+t*turns*TAU,s=1.1-t*.98,q=pt(a,s,0);P.push(q);if(last&&t<=(last-1)/11+1e-9)D.push(q)}
 o+='<path class="rt" d="'+smooth(P,false)+'"/>';
 if(D.length>1)o+='<path class="rtd" d="'+smooth(D,false)+'"/>';
 for(let w=1;w<=12;w++){const c=state(w),{a,s}=wp(w),q=pt(a,s,0),lx=q[0]+(Math.cos(a)>=0?15:-15),an=Math.cos(a)>=0?'start':'end';
  o+='<g class="w '+c+'">'+(c==='n'?'<circle class="halo" cx="'+f(q[0])+'" cy="'+f(q[1])+'" r="12"/>':'')+'<circle class="dot" cx="'+f(q[0])+'" cy="'+f(q[1])+'" r="'+(c==='p'?4.5:c==='n'?8:6)+'"/><text x="'+f(lx)+'" y="'+f(q[1]+5.5)+'" text-anchor="'+an+'">'+String(w).padStart(2,'0')+'</text></g>'}
 /* the dial around it: a ring with the progress arc and a label running along the rim */
 const C=2*Math.PI*176,p=Math.max(0,Math.min(1,pct||0)),id='rim'+Math.random().toString(36).slice(2,7);
 let s='<svg class="dial" viewBox="0 0 400 400" aria-hidden="true" focusable="false"><defs><linearGradient id="'+id+'g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--acc2)"/><stop offset="1" style="stop-color:var(--acc)"/></linearGradient><path id="'+id+'" d="M200 200m-191 0a191 191 0 1 1 382 0a191 191 0 1 1-382 0"/></defs>';
 s+='<circle class="face" cx="200" cy="200" r="168"/><circle class="track" cx="200" cy="200" r="176"/>';
 s+='<circle class="arc" cx="200" cy="200" r="176" stroke="url(#'+id+'g)" stroke-dasharray="'+(C*p).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 200 200)"/>';
 if(p>0){const A=-Math.PI/2+p*TAU;s+='<circle class="knob'+(p<1?' go':'')+'" cx="'+(200+176*Math.cos(A)).toFixed(1)+'" cy="'+(200+176*Math.sin(A)).toFixed(1)+'" r="7"/>'}
 if(label)s+='<text class="rimt"><textPath href="#'+id+'" startOffset="25%" text-anchor="middle">'+label+'</textPath></text>';
 s+='<svg class="topo" x="40" y="62" width="320" height="276" viewBox="40 20 520 370">'+o+'</svg>';
 return s+'</svg>'}

const slider=p=>'<div class="slider"><i style="width:calc('+p+'% - 4px)"></i><b style="left:clamp(9px,'+p+'%,calc(100% - 9px))"></b></div>';
function pct(day){try{const s=JSON.parse(localStorage.getItem('devteam:'+D.learner+':'+day))||{};return s.pct||0}catch(e){return 0}}
function setLang(l){lang=l;try{localStorage.setItem('devteam:lang',lang)}catch(e){};render()}
function toggleLang(){setLang(lang==='uk'?'en':'uk')}
const FB=(window.FB&&window.FB.days)||{};
const fbSeenKey='devteam:'+D.learner+':fbseen';
const fbSeen=()=>{try{return JSON.parse(localStorage.getItem(fbSeenKey))||{}}catch(e){return {}}};
const fbNote=f=>f&&f.note?(f.note[lang]||f.note.en||''):'';
function qsOf(day){try{return (JSON.parse(localStorage.getItem('devteam:'+D.learner+':'+day))||{}).qs||null}catch(e){return null}}
function fbTag(day){const f=FB[day];if(!f)return '';if(f.s==='reviewed')return '<span class="fbt ok">'+ic('check')+esc(f.score)+'/'+esc(f.max||10)+'</span>';return '<span class="fbt'+(f.s==='missing'?' miss':'')+'">'+u(f.s==='missing'?'fbMiss':'fbWait')+'</span>'}
function dn(n){if(lang!=='uk')return n===1?'day reviewed':'days reviewed';const a=n%10,b=n%100;return (a===1&&b!==11)?'день перевірено':(a>=2&&a<=4&&(b<10||b>=20))?'дні перевірено':'днів перевірено'}
function fbBlock(){const z=fbSeen();let h='';
 const fresh=D.rows.filter(r=>FB[r.day]&&FB[r.day].s==='reviewed'&&z[r.day]!==FB[r.day].at);
 if(fresh.length)h+='<div class="fbnew glass" role="status"><b>'+u('fbNew')+'</b><span class="lk">'+fresh.slice(0,4).map(r=>'<a href="'+esc(r.href)+'">'+u('day')+' '+r.day+' · '+u('fbOpen')+'</a>').join('')+'</span></div>';
 const rev=D.rows.map(r=>FB[r.day]).filter(f=>f&&f.s==='reviewed'&&f.max);
 let qo=0,qn=0;D.rows.forEach(r=>{const q=qsOf(r.day);if(q){qo+=q[0];qn+=q[1]}});
 const ra=rev.length?(rev.reduce((a,f)=>a+f.score/f.max,0)/rev.length*10):null;
 h+='<div class="fbsc glass"><div><span class="eyebrow">'+u('fbYour')+'</span><p class="muted">'+(rev.length?rev.length+' '+dn(rev.length):u('fbNone'))+'</p></div>'+'<div><span class="eyebrow">'+u('fbRev')+'</span><div class="v">'+(ra==null?'—':ra.toFixed(1)+'/10')+'</div></div>'+'<div><span class="eyebrow">'+u('fbQuiz')+'</span><div class="v">'+(qn?Math.round(qo/qn*100)+'%':'—')+'</div></div></div>';
 return h}
function render(){const ae=document.activeElement,fk=ae&&ae.closest&&ae.closest('.seg')?(ae.getAttribute('data-th')?'[data-th="'+ae.getAttribute('data-th')+'"]':'.seg [lang="'+ae.getAttribute('lang')+'"]'):'';
 document.documentElement.lang=lang==='uk'?'uk':'en';
 const P={};D.rows.forEach(r=>P[r.day]=pct(r.day));
 const total=D.rows.length,avg=D.rows.reduce((a,r)=>a+P[r.day],0)/total,doneN=D.rows.filter(r=>P[r.day]>=1).length,A=Math.round(avg*100);
 const last=D.rows[D.rows.length-1],next=D.rows.find(r=>P[r.day]<1);
 const weeks=[...new Set(D.rows.map(r=>r.week))];
 const wstate=w=>{const rs=D.rows.filter(r=>r.week===w);if(!rs.length)return 'p';if(rs.every(r=>P[r.day]>=1))return 'b';return rs.some(r=>P[r.day]>0)||(next&&next.week===w)?'n':'p'};
 const nm=D.name[lang]||D.name.en||'',role=(D.role||{})[lang]||(D.role||{}).en||'';
 let h='<div class="top glass"><div class="who"><span class="av" aria-hidden="true">'+esc(nm.charAt(0))+'</span><b>'+esc(nm)+'</b></div>'+controls(lang,'setLang')+'</div>';
 h+='<section class="hero"><div><span class="eyebrow">'+esc(role)+'</span><h1>'+u('map')+'</h1><p class="sub">'+esc(u('sub'))+'</p><div class="panel well"><span class="lcd" aria-label="'+doneN+' / '+total+' '+u('done')+'">'+seg(doneN+'/'+total)+'</span><span class="eyebrow">'+u('done')+'</span><span class="lcd sm" style="justify-self:end">'+seg(A)+'%</span><div style="grid-column:1/-1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+A+'" aria-label="'+A+'%">'+slider(A)+'</div></div>'+(next?'<a class="go" href="'+esc(next.href)+'"><span class="kn">'+ic('arrow')+'</span><span><small>'+u('cont')+' · '+u('day')+' '+next.day+'</small>'+esc(lang==='uk'?next.uk:next.en)+'</span></a>':'')+'</div><div class="chart">'+island(wstate,avg,enc(avg,'encAll'))+'</div></section>';h+=fbBlock();
 weeks.forEach(w=>{const rs=D.rows.filter(r=>r.week===w);const wi=(D.weeks||{})[w];const wd=rs.every(r=>P[r.day]>=1);
  const full=w===0?u('setup'):(lang==='uk'?rs[0].tuk:rs[0].ten)||'';const m=String(full).match(/^[^:]{2,20}:\s*(.+)$/);
  h+='<section class="wk'+(wd?' done':'')+'"><div class="wl"><div class="rn" aria-hidden="true">'+(wd?ic('check'):String(w).padStart(2,'0'))+'</div><span class="eyebrow">'+(w===0?u('day')+' 0':u('week')+' '+w)+'</span></div><div><h2>'+esc(m?m[1]:full)+'</h2>'+(wi&&wi.goal?'<p class="wg">'+esc(wi.goal[lang]||wi.goal.en||'')+'</p>':'')+'<div class="grid">'+rs.map(r=>{const p=P[r.day],fin=r===last,boss=r.boss&&!fin;const cls='tile glass'+(fin?' fin':boss?' boss':'')+(p>=1?' ok':'')+(next&&r===next?' next':'');
   return '<a class="'+cls+'" href="'+esc(r.href)+'"><span class="hd"><span class="n">'+(p>=1?ic('check'):String(r.day).padStart(2,'0'))+'</span><span class="k">'+(fin?u('finale'):boss?u('bossDay'):u('day')+' '+r.day)+'</span></span><span class="t">'+esc(lang==='uk'?r.uk:r.en)+'</span>'+fbTag(r.day)+slider(Math.round(p*100))+'</a>'}).join('')+'</div></div></section>'});
 h+='<p class="note" style="font-size:12px;opacity:.75;text-align:center;margin:18px auto;max-width:640px">'+esc(u('ckNote'))+'</p>';
 document.getElementById('app').innerHTML=h;
 if(fk){const e=document.querySelector(fk);if(e)e.focus({preventScroll:true})}}
render();
const CK='https://script.google.com/macros/s/AKfycbyxLWYT8cF60vCdTzOFup61dNLydlV87wvWu70h7TZR9w_9rz5OH6TNnx44qay-tDJPvQ/exec';function ck(o){try{if(CK.indexOf('https://')!==0)return;const b=JSON.stringify(Object.assign({c:D.learner,l:lang},o));if(navigator.sendBeacon&&navigator.sendBeacon(CK,new Blob([b],{type:'text/plain;charset=utf-8'})))return;fetch(CK,{method:'POST',mode:'no-cors',keepalive:true,body:b})}catch(e){}}ck({p:'map',e:'open'});
</script>

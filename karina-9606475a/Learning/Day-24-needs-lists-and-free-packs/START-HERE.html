<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 24</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

Rocks чи Quarry Cliff, якщо вони досі позначені Free) і ще два, яких потребують твої списки потреб; кожен досі позначений Free, його ліцензію і версії рушія прочитано, а в credits.md є рядок про нього."}, {"en": "packs_review.md: one section per pack with its link, licence, mesh count, its 5 to 10 best pieces from the maker's showcase, and for each piece: district 1, district 2, the coast, or not suitable and why.", "uk": "packs_review.md: по одному розділу на пак із посиланням, ліцензією, кількістю мешів, 5-10 найкращими частинами з вітрини автора і для кожної частини: район 1, район 2, узбережжя або не підходить і чому."}, {"en": "pack_scale.png: one best piece from each pack beside the mannequin and one piece of your own kit, in L_PackTest.", "uk": "pack_scale.png: по одній найкращій частині з кожного пака поруч із манекеном і однією частиною твого власного набору в L_PackTest."}, {"en": "A 'Ground for Day 28' section at the end of packs_review.md: a rock texture (from your rock pack or Poly Haven) and a grass and a sand texture from Poly Haven, downloaded into Day24/ground and listed in credits.md.", "uk": "Розділ 'Ground for Day 28' (ґрунт для Дня 28) у кінці packs_review.md: текстура каменю (з твого пака каміння або з Poly Haven), а також текстури трави й піску з Poly Haven, завантажені в Day24/ground і внесені в credits.md."}, {"en": "Electric Dreams Env added to your library and its download started as a separate project named ElectricDreamsSample: about 60 GB, so read the exact download size in the Launcher and keep at least three times that free on the drive, because shaders and derived data grow large.", "uk": "Electric Dreams Env додано до твоєї бібліотеки, і його завантаження запущено як окремий проєкт ElectricDreamsSample: це близько 60 GB, тож прочитай точний розмір завантаження в Launcher і тримай на диску вільними щонайменше втричі більше, бо шейдери і похідні дані сильно розростаються."}], "piece1": "the Electric Dreams download and district 1's needs list (shared with the lessons)", "piece2": {"en": "District 2's needs list, the pack picks and the best-pieces review, on your own", "uk": "Список потреб району 2, вибір паків і огляд найкращих частин, самостійно"}, "steps": [{"text": {"en": "First thing: check the Electric Dreams download in the Launcher's Downloads; if it stopped, resume it. Take download.png of the Downloads page (Win+Shift+S). Check: the bar moves, and the project sits on a drive with at least three times the download size free.", "uk": "Насамперед: перевір завантаження Electric Dreams у розділі Downloads у Launcher; якщо воно зупинилося, віднови його. Зроби download.png сторінки Downloads (Win+Shift+S). Перевірка: смужка рухається, а проєкт лежить на диску, де вільно щонайменше втричі більше за розмір завантаження."}, "lesson": 1}, {"text": {"en": "needs_d1.md: every item from plot_plan_d1.md as a row, with its photo and count. Check: the counts match your plan row for row.", "uk": "needs_d1.md: кожен об'єкт із plot_plan_d1.md окремим рядком, із фото і кількістю. Перевірка: кількості збігаються з твоїм планом рядок у рядок."}, "lesson": 2}, {"text": {"en": "needs_d1.md: sources in order (own kit, built in, free pack, Blender), 'reads from 30 m?', and the Gaps table. Check: every row has a source, or a gap decision with a time limit.", "uk": "needs_d1.md: джерела за порядком (власний набір, вбудоване, безкоштовний пак, Blender), стовпець 'reads from 30 m?' і таблиця Gaps. Перевірка: у кожному рядку є джерело або рішення щодо прогалини з обмеженням часу."}, "lesson": 2}, {"text": {"en": "needs_d2.md the same way for district 2. Check: every row has a source or a gap decision, and the two route lines are written.", "uk": "Так само needs_d2.md для району 2. Перевірка: у кожному рядку є джерело або рішення щодо прогалини, і два рядки про маршрут записано."}, "lesson": 2}, {"text": {"en": "Choose three or more packs from free-packs-list.md (one rock pack plus what your lists need) and check each on Fab. Check: each one still says Free, and you've read its licence and engine versions.", "uk": "Вибери три або більше паки з free-packs-list.md (один пак каміння плюс те, чого потребують твої списки) і перевір кожен на Fab. Перевірка: кожен досі позначений Free, а його ліцензію і версії рушія прочитано."}, "lesson": 3}, {"text": {"en": "Add the packs to IslandCourse (Add to Project, or import FBX files by hand). Check: each pack's folder is in the Content Browser and its meshes open.", "uk": "Додай паки в IslandCourse (Add to Project або імпорт файлів FBX вручну). Перевірка: тека кожного пака є в Content Browser, і його меші відкриваються."}, "lesson": 3}, {"text": {"en": "One credits.md line per pack, with CC-BY packs marked. Check: every pack has its author, licence and link.", "uk": "По одному рядку в credits.md на кожен пак, паки з CC-BY позначено. Перевірка: для кожного пака вказано автора, ліцензію і посилання."}, "lesson": 3}, {"text": {"en": "Best-pieces review for each pack in packs_review.md. Check: 5 to 10 best pieces per pack, each planned for a district or the coast, or 'not suitable' with a reason.", "uk": "Огляд найкращих частин кожного пака в packs_review.md. Перевірка: 5-10 найкращих частин на пак, кожна запланована для району чи узбережжя, або «не підходить» із причиною."}, "lesson": 4}, {"text": {"en": "Scale check in L_PackTest: one best piece per pack beside the mannequin and your own bench; take pack_scale.png (Win+Shift+S). Check: nothing is twice or half its real size, or the fix is noted.", "uk": "Перевірка масштабу в L_PackTest: по одній найкращій частині з кожного пака поруч із манекеном і твоєю власною лавою; зроби pack_scale.png (Win+Shift+S). Перевірка: ніщо не вдвічі більше чи менше за свій реальний розмір, або виправлення записано."}, "lesson": 3}, {"text": {"en": "Ground for Day 28: download a grass and a sand texture from Poly Haven (and a rock one if your rock pack has no texture you like) into Day24/ground; list them in packs_review.md and credits.md. Check: three colour textures in Day24/ground, each with a credit line.", "uk": "Ґрунт для Дня 28: завантаж текстури трави й піску з Poly Haven (і каменю, якщо в твоєму паку каміння немає текстури до вподоби) у Day24/ground; внеси їх у packs_review.md і credits.md. Перевірка: три кольорові текстури в Day24/ground, у кожної є рядок авторства."}, "lesson": 3}, {"text": {"en": "Update the source guesses in both plot plan tables from your needs lists. Check: the plans and the needs lists name the same sources.", "uk": "Онови припущення щодо джерел в обох таблицях планів ділянок за своїми списками потреб. Перевірка: плани і списки потреб називають ті самі джерела."}, "lesson": 2}, {"text": {"en": "When the download finishes (tonight or tomorrow): on a 16 GB PC raise the Windows page file to 32 GB or more first (System > About > Advanced system settings > Performance: Settings > Advanced > Virtual memory: Change), close the browser, and keep Engine Scalability at High. Then open ElectricDreamsSample once and let the shaders compile (it can take an hour; don't close the editor). Don't open its big ElectricDreams_Env map: on a 16 GB PC it won't fit, and the same goes for ElectricDreams_PCG. Check: the sample opens on its Startup level and 'Compiling Shaders' at the bottom right has gone.", "uk": "Коли завантаження завершиться (сьогодні ввечері або завтра): на ПК із 16 GB спершу збільш файл підкачки Windows до 32 GB або більше (System > About > Advanced system settings > Performance: Settings > Advanced > Virtual memory: Change), закрий браузер і залиш Engine Scalability на High. Потім один раз відкрий ElectricDreamsSample і дай шейдерам скомпілюватися (це може тривати годину; не закривай редактор). Не відкривай його велику мапу ElectricDreams_Env: на ПК із 16 GB вона не вміститься, і те саме стосується ElectricDreams_PCG. Перевірка: зразок відкривається на рівні Startup, а напис 'Compiling Shaders' унизу праворуч зник."}, "lesson": 1}, {"text": {"en": "Record a 60-second clip flying slowly past the best pieces in L_PackTest at eye level (Win+Alt+R). Save today's clip as clip_day24.mp4. Check: every pack shows in the clip, beside the mannequin.", "uk": "Запиши 60-секундний відеозапис, повільно пролітаючи повз найкращі частини в L_PackTest на рівні очей (Win+Alt+R). Збережи сьогоднішній запис як clip_day24.mp4. Перевірка: у записі видно кожен пак поруч із манекеном."}, "lesson": 4}], "assets": ["island12/needs-list-template.md", "island12/free-packs-list.md", "island12/credits-template.md"]}, "lessons": [{"title": {"en": "Fab, licences and the Electric Dreams download", "uk": "Fab, ліцензії і завантаження Electric Dreams"}, "minutes": 40, "goals": [{"en": "Read a Fab listing (Fab is Epic's online store for 3D content, where many items are free): the price, the licence, the engine versions and the format.", "uk": "Читати сторінку товару на Fab (Fab — онлайн-магазин 3D-контенту від Epic, де багато чого безкоштовне): ціна, ліцензія, версії рушія і формат."}, {"en": "Explain the two licences you will meet: Standard (free for personal and commercial use; credit isn't required, but you still list it) and CC-BY (free, but you must credit the author wherever you show your work).", "uk": "Пояснити дві ліцензії, які тобі трапляться: Standard (безкоштовно для особистого і комерційного використання; вказувати авторство не обов'язково, але ти все одно вносиш пак у список) і CC-BY (безкоштовно, але треба вказувати автора скрізь, де ти показуєш свою роботу)."}, {"en": "Start a big download safely: check the drive space, create the Electric Dreams project from the Launcher, and pause and resume it.", "uk": "Безпечно запустити велике завантаження: перевірити місце на диску, створити проєкт Electric Dreams із Launcher, поставити його на паузу і відновити."}, {"en": "Explain what Electric Dreams is: Epic's free sample world built with PCG (Procedural Content Generation: rules that place plants and rocks for you), kept as a separate project until Day 34.", "uk": "Пояснити, що таке Electric Dreams: безкоштовний зразковий світ від Epic, зроблений із PCG (Procedural Content Generation: правила, які розміщують рослини й каміння за тебе), що лишається окремим проєктом до Дня 34."}], "doalong": [{"en": "Open fab.com and click Sign in at the top right, with your Epic Games account from Day 0. You should see your name at the top right.", "uk": "Відкрий fab.com і натисни Sign in угорі праворуч, використовуючи свій обліковий запис Epic Games із Дня 0. Угорі праворуч ти маєш побачити своє ім'я."}, {"en": "Open the listing by Epic Games: https://www.fab.com/listings/d79688f5-29be-4fb2-a650-2d4a813f5306 (or search Fab for 'Electric Dreams Env'). Read the price, the supported versions and the licence line. You should see Free, Unreal Engine versions 5.2 – 5.8 and the Standard License.", "uk": "Відкрий сторінку від Epic Games: https://www.fab.com/listings/d79688f5-29be-4fb2-a650-2d4a813f5306 (або пошукай на Fab 'Electric Dreams Env'). Прочитай ціну, підтримувані версії і рядок ліцензії. Ти маєш побачити Free, версії Unreal Engine 5.2 – 5.8 і Standard License."}, {"en": "Check space: File Explorer > This PC. Find an SSD with about 180 GB free (three times the 60 GB download). You should know which drive the project goes on.", "uk": "Перевір місце: File Explorer > This PC. Знайди SSD, де вільно близько 180 GB (утричі більше за завантаження на 60 GB). Тепер ти знаєш, на який диск піде проєкт."}, {"en": "On the listing click Add to My Library. In the Epic Games Launcher: Unreal Engine > Library > Fab Library, search Electric Dreams, click Create Project, name it ElectricDreamsSample, choose a folder on that SSD and version 5.8, then Create. You should see the download start in the Launcher's Downloads.", "uk": "На сторінці товару натисни Add to My Library. В Epic Games Launcher: Unreal Engine > Library > Fab Library, знайди Electric Dreams, натисни Create Project, назви проєкт ElectricDreamsSample, вибери теку на тому SSD і версію 5.8, потім Create. Ти маєш побачити, як завантаження починається в розділі Downloads у Launcher."}, {"en": "In Downloads click pause, then resume. You should see the bar stop and start again, so you know a break won't lose the download.", "uk": "У Downloads натисни паузу, потім відновлення. Ти маєш побачити, як смужка зупиняється і знову рушає, тож знаєш, що перерва не зіпсує завантаження."}, {"en": "Find your PC's memory: Windows Settings > System > About > Installed RAM. If it says 16 GB, you will raise the page file (disk space Windows borrows as extra memory) before the first open, as today's build says. You should know your number.", "uk": "Дізнайся обсяг пам'яті свого ПК: Windows Settings > System > About > Installed RAM. Якщо там 16 GB, ти збільшиш файл підкачки (місце на диску, яке Windows позичає як додаткову пам'ять) перед першим відкриттям, як сказано в сьогоднішньому завданні. Тепер ти знаєш своє число."}], "play": {"en": "Licence check: the tutor describes four Fab listings (one paid, one for another engine only, one CC-BY, one Standard and free). I pick the ones I may use and say what each one needs in credits.md.", "uk": "Перевірка ліцензій: тьютор описує чотири сторінки на Fab (одна платна, одна лише для іншого рушія, одна CC-BY, одна Standard і безкоштовна). Я вибираю ті, які можна використовувати, і кажу, що для кожної потрібно в credits.md."}, "video": {"url": "https://www.youtube.com/watch?v=fFLHiGiF3ZM", "title": "Exploring The Electric Dreams Sample | Unreal Engine 5.2 Procedural Content Generation Tech Demo", "channel": "Matt Aspland", "length": "12:47", "search": "electric dreams sample unreal engine explore"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Fab, licences and the Electric Dreams download (Day 24, lesson 1 of 4).\nToday's build: Two needs lists (needs_d1.md and needs_d2.md), three or more free packs added to IslandCourse, packs_review.md with each pack's best pieces and the ground textures for Day 28, and the Electric Dreams sample downloading as its own project.\n\nBy the end of this lesson I can:\n1. Read a Fab listing (Fab is Epic's online store for 3D content, where many items are free): the price, the licence, the engine versions and the format.\n2. Explain the two licences you will meet: Standard (free for personal and commercial use; credit isn't required, but you still list it) and CC-BY (free, but you must credit the author wherever you show your work).\n3. Start a big download safely: check the drive space, create the Electric Dreams project from the Launcher, and pause and resume it.\n4. Explain what Electric Dreams is: Epic's free sample world built with PCG (Procedural Content Generation: rules that place plants and rocks for you), kept as a separate project until Day 34.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (You have a reference set, a map of your island to scale, and two plot plans with every item counted.), what I will learn today (You write a needs list for each district, choose free packs with a best-pieces review, and start the big Electric Dreams download.), encourage me (The big download takes hours and that is normal; let it run while you plan, and anything unfinished carries on tomorrow.), and share today's quote: \"Still achieving, still pursuing, learn to labor and to wait.\" (Henry Wadsworth Longfellow).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 21: who goes in credits.md for a Commons photo, the uploader or the author, and why? | Day 17: why do you decide how many metres one texture covers before you paint it?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Licence check: the tutor describes four Fab listings (one paid, one for another engine only, one CC-BY, one Standard and free). I pick the ones I may use and say what each one needs in credits.md.\n6. Do-along on today's build (the Electric Dreams download and district 1's needs list (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Open fab.com and click Sign in at the top right, with your Epic Games account from Day 0. You should see your name at the top right.\n   - Open the listing by Epic Games: https://www.fab.com/listings/d79688f5-29be-4fb2-a650-2d4a813f5306 (or search Fab for 'Electric Dreams Env'). Read the price, the supported versions and the licence line. You should see Free, Unreal Engine versions 5.2 – 5.8 and the Standard License.\n   - Check space: File Explorer > This PC. Find an SSD with about 180 GB free (three times the 60 GB download). You should know which drive the project goes on.\n   - On the listing click Add to My Library. In the Epic Games Launcher: Unreal Engine > Library > Fab Library, search Electric Dreams, click Create Project, name it ElectricDreamsSample, choose a folder on that SSD and version 5.8, then Create. You should see the download start in the Launcher's Downloads.\n   - In Downloads click pause, then resume. You should see the bar stop and start again, so you know a break won't lose the download.\n   - Find your PC's memory: Windows Settings > System > About > Installed RAM. If it says 16 GB, you will raise the page file (disk space Windows borrows as extra memory) before the first open, as today's build says. You should know your number.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Exploring The Electric Dreams Sample | Unreal Engine 5.2 Procedural Content Generation Tech Demo\" by Matt Aspland: https://www.youtube.com/watch?v=fFLHiGiF3ZM\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Needs lists: a source for every item", "uk": "Списки потреб: джерело для кожного об'єкта"}, "minutes": 40, "goals": [{"en": "Explain a needs list: every kind of thing a district needs, with how many, where, and where each piece will come from.", "uk": "Пояснити, що таке список потреб: кожен вид речей, потрібних району, з кількістю, місцем і тим, звідки візьметься кожна частина."}, {"en": "Choose sources in order: your own kit, Unreal's built-in pieces, a free pack, then a Blender model with a time limit.", "uk": "Вибирати джерела за порядком: твій власний набір, вбудовані частини Unreal, безкоштовний пак, потім модель у Blender з обмеженням часу."}, {"en": "Write gaps honestly: what nothing covers, and your decision (make it, use a grey-box stand-in, which is a plain block shape that stands in for the piece, or leave it out).", "uk": "Чесно записувати прогалини: що ніщо не покриває, і твоє рішення (зробити, поставити сіру заглушку grey-box, тобто простий блок, що замінює частину, або не включати)."}], "doalong": [{"en": "Copy needs-list-template.md from today's assets twice and name the copies needs_d1.md and needs_d2.md. Delete the example rows. Where the template says a 100 x 120 m plot, read it as your 200 x 200 m district. You should see two empty tables.", "uk": "Двічі скопіюй needs-list-template.md із сьогоднішніх матеріалів і назви копії needs_d1.md і needs_d2.md. Видали рядки-приклади. Де в шаблоні сказано про ділянку 100 x 120 м, читай це як свій район 200 x 200 м. Ти маєш побачити дві порожні таблиці."}, {"en": "Copy every item from plot_plan_d1.md into needs_d1.md as a row, with the photo where it shows best. You should see the same counts as your plan.", "uk": "Скопіюй кожен об'єкт із plot_plan_d1.md у needs_d1.md окремим рядком, разом із фото, де його найкраще видно. Ти маєш побачити ті самі кількості, що й у плані."}, {"en": "Fill the Source column with your own kit first, using exact names, for example 'own kit: SM_Bench (Day 2)'. You should see many furniture rows already covered.", "uk": "Заповни стовпець Source спершу своїм власним набором, точними назвами, наприклад 'own kit: SM_Bench (Day 2)'. Ти маєш побачити, що багато рядків із вуличними меблями вже покрито."}, {"en": "Mark 'reads from 30 m?' yes or no on each row. You should see small things (a cup, the text on a sign) marked no: cheap to leave out unless a hero photo shows them up close.", "uk": "Познач у кожному рядку 'reads from 30 m?' так чи ні. Ти маєш побачити, що дрібниці (чашка, текст на табличці) позначено «ні»: їх дешево не включати, якщо тільки ключове фото не показує їх зблизька."}, {"en": "Gaps: for each row with no source, decide: make it in Blender (write the minutes), a grey-box stand-in, or leave it out. You should see no row left without a decision.", "uk": "Прогалини: для кожного рядка без джерела виріши: зробити в Blender (запиши хвилини), сіра заглушка grey-box або не включати. Не має лишитися жодного рядка без рішення."}], "play": {"en": "Missing item: the tutor reads my needs list and names three things a real place like mine would have (bins, mooring bollards, a slipway, a lighthouse fence). Each one I'd already listed earns me a point.", "uk": "Чого бракує: тьютор читає мій список потреб і називає три речі, які були б у справжньому місці на кшталт мого (смітники, швартовні стовпчики, сліп для човнів, огорожа маяка). Кожна, яка вже є в моєму списку, приносить мені бал."}, "video": {"search": "environment art asset list planning level"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Needs lists: a source for every item (Day 24, lesson 2 of 4).\nToday's build: Two needs lists (needs_d1.md and needs_d2.md), three or more free packs added to IslandCourse, packs_review.md with each pack's best pieces and the ground textures for Day 28, and the Electric Dreams sample downloading as its own project.\nEarlier today I already did: lesson 1 (Fab, licences and the Electric Dreams download). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Explain a needs list: every kind of thing a district needs, with how many, where, and where each piece will come from.\n2. Choose sources in order: your own kit, Unreal's built-in pieces, a free pack, then a Blender model with a time limit.\n3. Write gaps honestly: what nothing covers, and your decision (make it, use a grey-box stand-in, which is a plain block shape that stands in for the piece, or leave it out).\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Missing item: the tutor reads my needs list and names three things a real place like mine would have (bins, mooring bollards, a slipway, a lighthouse fence). Each one I'd already listed earns me a point.\n4. Do-along on today's build (the Electric Dreams download and district 1's needs list (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Copy needs-list-template.md from today's assets twice and name the copies needs_d1.md and needs_d2.md. Delete the example rows. Where the template says a 100 x 120 m plot, read it as your 200 x 200 m district. You should see two empty tables.\n   - Copy every item from plot_plan_d1.md into needs_d1.md as a row, with the photo where it shows best. You should see the same counts as your plan.\n   - Fill the Source column with your own kit first, using exact names, for example 'own kit: SM_Bench (Day 2)'. You should see many furniture rows already covered.\n   - Mark 'reads from 30 m?' yes or no on each row. You should see small things (a cup, the text on a sign) marked no: cheap to leave out unless a hero photo shows them up close.\n   - Gaps: for each row with no source, decide: make it in Blender (write the minutes), a grey-box stand-in, or leave it out. You should see no row left without a decision.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Free picks: price, licence and fit", "uk": "Безкоштовний вибір: ціна, ліцензія і чи підходить"}, "minutes": 40, "goals": [{"en": "Pick packs from free-packs-list.md and check each one on Fab: still Free, its licence, its engine versions and its format (an Unreal pack, or FBX files you import by hand).", "uk": "Вибирати паки з free-packs-list.md і перевіряти кожен на Fab: досі Free, ліцензія, версії рушія і формат (пак для Unreal або файли FBX, які ти імпортуєш вручну)."}, {"en": "Add a pack to IslandCourse from the Launcher (Add to Project), even when it was made for an older engine, and take free textures from Poly Haven (polyhaven.com, where everything is CC0: free for any use, no credit needed, but you still list it).", "uk": "Додавати пак в IslandCourse з Launcher (Add to Project), навіть коли його зроблено для старішого рушія, і брати безкоштовні текстури з Poly Haven (polyhaven.com, де все під CC0: безкоштовно для будь-якого використання, авторство вказувати не обов'язково, але ти все одно вносиш їх у список)."}, {"en": "Judge fit in a practice level: the right size beside the mannequin, a present-day look, and colours that sit with your photos.", "uk": "Оцінювати, чи підходить пак, у тренувальному рівні: правильний розмір поруч із манекеном, сучасний вигляд і кольори, що пасують до твоїх фото."}], "doalong": [{"en": "Open free-packs-list.md and choose a rock pack and two packs your needs lists call for. Open each Fab page. You should have three tabs open, each still saying Free.", "uk": "Відкрий free-packs-list.md і вибери пак каміння та два паки, яких потребують твої списки потреб. Відкрий сторінку кожного на Fab. У тебе мають бути відкриті три вкладки, і на кожній досі написано Free."}, {"en": "On each page click Add to My Library. In the Launcher: Unreal Engine > Library > Fab Library, find the pack and click Add to Project, then IslandCourse. If IslandCourse isn't listed, tick Show all projects and pick the newest engine version the pack offers. You should see the pack's folder appear in IslandCourse's Content Browser.", "uk": "На кожній сторінці натисни Add to My Library. У Launcher: Unreal Engine > Library > Fab Library, знайди пак і натисни Add to Project, потім IslandCourse. Якщо IslandCourse немає в списку, постав позначку Show all projects і вибери найновішу версію рушія, яку пропонує пак. Ти маєш побачити, як тека пака з'являється в Content Browser проєкту IslandCourse."}, {"en": "For an FBX-only item (no Add to Project button): click Download on Fab and unzip it; in Unreal, drag the files into your Content Browser folder and click Import All. You should see new Static Meshes appear.", "uk": "Для товару лише з FBX (без кнопки Add to Project): натисни Download на Fab і розпакуй архів; в Unreal перетягни файли у свою теку в Content Browser і натисни Import All. Ти маєш побачити нові Static Mesh."}, {"en": "In IslandCourse: File > New Level > Basic, and save it as L_PackTest in Content/Course/Day24. Drag in one piece of each pack beside the mannequin and your own SM_Bench. You should see at a glance if anything is twice or half the right size.", "uk": "В IslandCourse: File > New Level > Basic, і збережи його як L_PackTest у Content/Course/Day24. Перетягни по одній частині з кожного пака поруч із манекеном і своїм власним SM_Bench. Ти маєш одразу побачити, чи щось удвічі більше або менше за правильний розмір."}, {"en": "Open polyhaven.com > Textures and search 'grass', then 'sand'. On a texture's page choose 2K and JPG and download; keep the colour map (its name ends in diff). You should have two colour textures in Day24/ground.", "uk": "Відкрий polyhaven.com > Textures і пошукай 'grass', потім 'sand'. На сторінці текстури вибери 2K і JPG і завантаж; залиш колірну карту (її назва закінчується на diff). У тебе мають бути дві колірні текстури в Day24/ground."}], "play": {"en": "Odd one out: the tutor describes a scene with one clashing piece (a shiny rock among matte ones, a cartoon bench beside a scanned wall, a lamp twice human height). I name the clash and the fix.", "uk": "Зайвий предмет: тьютор описує сцену з однією частиною, що випадає (блискучий камінь серед матових, мультяшна лава поруч зі сканованою стіною, ліхтар удвічі вищий за людину). Я називаю, що випадає, і як це виправити."}, "video": {"url": "https://www.youtube.com/watch?v=9YgSxtEiuUM", "title": "FAB To UE5: How to Add Assets to Your Project", "channel": "Unreal Dev Hub", "length": "3:32", "search": "fab to unreal engine 5 add assets to project"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Free picks: price, licence and fit (Day 24, lesson 3 of 4).\nToday's build: Two needs lists (needs_d1.md and needs_d2.md), three or more free packs added to IslandCourse, packs_review.md with each pack's best pieces and the ground textures for Day 28, and the Electric Dreams sample downloading as its own project.\nEarlier today I already did: lesson 1 (Fab, licences and the Electric Dreams download); lesson 2 (Needs lists: a source for every item). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Pick packs from free-packs-list.md and check each one on Fab: still Free, its licence, its engine versions and its format (an Unreal pack, or FBX files you import by hand).\n2. Add a pack to IslandCourse from the Launcher (Add to Project), even when it was made for an older engine, and take free textures from Poly Haven (polyhaven.com, where everything is CC0: free for any use, no credit needed, but you still list it).\n3. Judge fit in a practice level: the right size beside the mannequin, a present-day look, and colours that sit with your photos.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Odd one out: the tutor describes a scene with one clashing piece (a shiny rock among matte ones, a cartoon bench beside a scanned wall, a lamp twice human height). I name the clash and the fix.\n4. Do-along on today's build (the Electric Dreams download and district 1's needs list (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Open free-packs-list.md and choose a rock pack and two packs your needs lists call for. Open each Fab page. You should have three tabs open, each still saying Free.\n   - On each page click Add to My Library. In the Launcher: Unreal Engine > Library > Fab Library, find the pack and click Add to Project, then IslandCourse. If IslandCourse isn't listed, tick Show all projects and pick the newest engine version the pack offers. You should see the pack's folder appear in IslandCourse's Content Browser.\n   - For an FBX-only item (no Add to Project button): click Download on Fab and unzip it; in Unreal, drag the files into your Content Browser folder and click Import All. You should see new Static Meshes appear.\n   - In IslandCourse: File > New Level > Basic, and save it as L_PackTest in Content/Course/Day24. Drag in one piece of each pack beside the mannequin and your own SM_Bench. You should see at a glance if anything is twice or half the right size.\n   - Open polyhaven.com > Textures and search 'grass', then 'sand'. On a texture's page choose 2K and JPG and download; keep the colour map (its name ends in diff). You should have two colour textures in Day24/ground.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"FAB To UE5: How to Add Assets to Your Project\" by Unreal Dev Hub: https://www.youtube.com/watch?v=9YgSxtEiuUM\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "The best-pieces review", "uk": "Огляд найкращих частин"}, "minutes": 40, "goals": [{"en": "Take stock of a pack: its folders and how many meshes it holds (the Content Browser's filters and the item count at the bottom).", "uk": "Оглянути вміст пака: його теки і скільки мешів він містить (фільтри Content Browser і кількість елементів унизу)."}, {"en": "Find the maker's best pieces from the showcase images (and any video) on the pack's Fab page.", "uk": "Знаходити найкращі частини автора за зображеннями на вітрині (і відео, якщо є) на сторінці пака на Fab."}, {"en": "Plan the best pieces into your districts first, and write why any piece doesn't fit.", "uk": "Спершу планувати найкращі частини у свої райони і записувати, чому якась частина не підходить."}], "doalong": [{"en": "In the Content Browser open one pack's folder. Click Filters (top left of the browser) and choose Static Mesh. You should see the item count at the bottom of the browser (for example '42 items'): the pack's mesh count.", "uk": "У Content Browser відкрий теку одного пака. Натисни Filters (угорі ліворуч у браузері) і вибери Static Mesh. Унизу браузера ти маєш побачити кількість елементів (наприклад, '42 items'): це кількість мешів пака."}, {"en": "Open the pack's Fab page and look through all its showcase images. List 5 to 10 pieces the maker shows off. You should have a short list of names or descriptions.", "uk": "Відкрий сторінку пака на Fab і переглянь усі зображення на вітрині. Випиши 5-10 частин, якими хизується автор. У тебе має бути короткий список назв або описів."}, {"en": "Find each piece in the folder with the search box and drag it into L_PackTest. You should see the pack's best pieces lined up beside the mannequin.", "uk": "Знайди кожну частину в теці через поле пошуку і перетягни її в L_PackTest. Ти маєш побачити найкращі частини пака, вишикувані поруч із манекеном."}, {"en": "In packs_review.md write a section for this pack: link, licence, mesh count, and for each best piece: district 1, district 2, the coast, or not suitable and why. You should see a plan for every best piece.", "uk": "У packs_review.md напиши розділ для цього пака: посилання, ліцензія, кількість мешів і для кожної найкращої частини: район 1, район 2, узбережжя або не підходить і чому. Ти маєш побачити план для кожної найкращої частини."}, {"en": "Press Win+Shift+S and save a screenshot of the line-up as pack_scale.png. You should see every pack beside the mannequin in one picture.", "uk": "Натисни Win+Shift+S і збережи скриншот цього ряду як pack_scale.png. Ти маєш побачити кожен пак поруч із манекеном на одному зображенні."}], "play": {"en": "Pack quiz: the tutor names a piece from my review; I say what it's best for and where on my island it goes, within 10 seconds.", "uk": "Вікторина паків: тьютор називає частину з мого огляду; я кажу, для чого вона найкраща і куди на моєму острові піде, за 10 секунд."}, "video": {"search": "how to review an asset pack before using it in unreal engine"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: The best-pieces review (Day 24, lesson 4 of 4).\nToday's build: Two needs lists (needs_d1.md and needs_d2.md), three or more free packs added to IslandCourse, packs_review.md with each pack's best pieces and the ground textures for Day 28, and the Electric Dreams sample downloading as its own project.\nEarlier today I already did: lesson 1 (Fab, licences and the Electric Dreams download); lesson 2 (Needs lists: a source for every item); lesson 3 (Free picks: price, licence and fit). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Take stock of a pack: its folders and how many meshes it holds (the Content Browser's filters and the item count at the bottom).\n2. Find the maker's best pieces from the showcase images (and any video) on the pack's Fab page.\n3. Plan the best pieces into your districts first, and write why any piece doesn't fit.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Pack quiz: the tutor names a piece from my review; I say what it's best for and where on my island it goes, within 10 seconds.\n4. Do-along on today's build (the Electric Dreams download and district 1's needs list (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - In the Content Browser open one pack's folder. Click Filters (top left of the browser) and choose Static Mesh. You should see the item count at the bottom of the browser (for example '42 items'): the pack's mesh count.\n   - Open the pack's Fab page and look through all its showcase images. List 5 to 10 pieces the maker shows off. You should have a short list of names or descriptions.\n   - Find each piece in the folder with the search box and drag it into L_PackTest. You should see the pack's best pieces lined up beside the mannequin.\n   - In packs_review.md write a section for this pack: link, licence, mesh count, and for each best piece: district 1, district 2, the coast, or not suitable and why. You should see a plan for every best piece.\n   - Press Win+Shift+S and save a screenshot of the line-up as pack_scale.png. You should see every pack beside the mannequin in one picture.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "needs_d1.md and needs_d2.md", "uk": "needs_d1.md і needs_d2.md"}, {"en": "packs_review.md (the best pieces and 'Ground for Day 28')", "uk": "packs_review.md (найкращі частини і 'Ground for Day 28')"}, {"en": "pack_scale.png", "uk": "pack_scale.png"}, {"en": "credits.md (with the packs, the textures and the sample)", "uk": "credits.md (із паками, текстурами і зразком)"}, {"en": "download.png (a screenshot of the Launcher's Downloads, or of the sample open on its Startup level)", "uk": "download.png (скриншот розділу Downloads у Launcher або зразка, відкритого на рівні Startup)"}, {"en": "clip_day24.mp4 (60 seconds past the best pieces in L_PackTest)", "uk": "clip_day24.mp4 (60 секунд повз найкращі частини в L_PackTest)"}, {"en": "summary.md", "uk": "summary.md"}], "goal": {"en": "By the end of today you have needs_d1.md and needs_d2.md with a source on every row, three or more free packs in IslandCourse with a best-pieces review, ground textures chosen for Day 28, and the Electric Dreams sample downloading.", "uk": "До кінця сьогоднішнього дня в тебе є needs_d1.md і needs_d2.md із джерелом у кожному рядку, три або більше безкоштовних паки в IslandCourse з оглядом найкращих частин, текстури ґрунту, вибрані для Дня 28, а зразок Electric Dreams завантажується."}, "uses": [{"en": "Day 23: plot_plan_d1.md and plot_plan_d2.md (every item and its count)", "uk": "День 23: plot_plan_d1.md і plot_plan_d2.md (кожен об'єкт і його кількість)"}, {"en": "Day 21: your photos and credits.md", "uk": "День 21: твої фото і credits.md"}, {"en": "Day 0: your Epic Games account, the Launcher and the IslandCourse project", "uk": "День 0: твій обліковий запис Epic Games, Launcher і проєкт IslandCourse"}, {"en": "Day 5: the mannequin as your scale check", "uk": "День 5: манекен для перевірки масштабу"}], "quiz": [{"q": {"en": "Your plan needs 6 benches. You made SM_Bench on Day 2, and a free pack also has benches. Which do you list first?", "uk": "Твоєму плану потрібно 6 лав. SM_Bench у тебе є з Дня 2, а ще лави є в безкоштовному паку. Що ти вносиш у список першим?"}, "options": [{"en": "The pack's bench: packs always look better.", "uk": "Лаву з пака: паки завжди виглядають краще."}, {"en": "Your own bench: your kit comes first, it's already the right size and style, and it shows your own work.", "uk": "Свою власну лаву: власний набір іде першим, він уже правильного розміру і стилю, і він показує твою роботу."}, {"en": "Neither: model a new one.", "uk": "Жодну: змоделювати нову."}], "answer": 1, "explain": {"en": "Own kit first, built-in pieces second, free packs third, new Blender models last. You already own it and know it fits.", "uk": "Спершу власний набір, далі вбудовані частини, потім безкоштовні паки, а нові моделі в Blender насамкінець. Лава вже твоя, і ти знаєш, що вона підходить."}}, {"q": {"en": "What does a CC-BY pack ask of you that a Standard-licence pack doesn't?", "uk": "Чого вимагає від тебе пак із CC-BY, чого не вимагає пак зі Standard License?"}, "options": [{"en": "Credit the author wherever you show your work.", "uk": "Вказувати автора скрізь, де ти показуєш свою роботу."}, {"en": "Pay after you publish.", "uk": "Заплатити після публікації."}, {"en": "Use it only in Unreal 5.8.", "uk": "Використовувати його лише в Unreal 5.8."}, {"en": "Nothing: they are the same.", "uk": "Нічого: вони однакові."}], "answer": 0, "explain": {"en": "CC-BY means attribution required. You still list Standard packs in credits.md, but CC-BY credits must appear wherever the work is shown.", "uk": "CC-BY означає, що вказувати авторство обов'язково. Паки зі Standard ти теж вносиш у credits.md, але авторство CC-BY має з'являтися скрізь, де показано роботу."}}, {"q": {"en": "A free building pack lists only Unreal 5.0 to 5.4, and IslandCourse isn't offered in Add to Project. What do you do?", "uk": "Безкоштовний пак будівель указує лише Unreal 5.0-5.4, а IslandCourse не пропонується в Add to Project. Що ти робиш?"}, "options": [{"en": "Give up on the pack.", "uk": "Відмовляюся від пака."}, {"en": "Install Unreal 5.4 as well.", "uk": "Встановлюю ще й Unreal 5.4."}, {"en": "Download it from another website.", "uk": "Завантажую його з іншого сайту."}, {"en": "Tick Show all projects, choose IslandCourse and the newest version the pack offers, then test that it opens cleanly.", "uk": "Ставлю позначку Show all projects, вибираю IslandCourse і найновішу версію, яку пропонує пак, а потім перевіряю, що він відкривається без помилок."}], "answer": 3, "explain": {"en": "Older packs usually open in 5.8, but test each one before you plan around it. Other websites that re-host Fab packs are never a safe source.", "uk": "Старіші паки зазвичай відкриваються в 5.8, але перевір кожен, перш ніж планувати з ним. Інші сайти, які перевикладають паки з Fab, ніколи не бувають безпечним джерелом."}}, {"q": {"en": "Your PC has 16 GB of memory and the Electric Dreams download has finished. Which levels must you never open?", "uk": "У твоєму ПК 16 GB пам'яті, і завантаження Electric Dreams завершилося. Які рівні не можна відкривати ніколи?"}, "options": [{"en": "The Startup level.", "uk": "Рівень Startup."}, {"en": "Any level at all.", "uk": "Будь-який рівень узагалі."}, {"en": "ElectricDreams_Env and ElectricDreams_PCG: they are the full 4 km maps, built for 32 to 64 GB of memory.", "uk": "ElectricDreams_Env і ElectricDreams_PCG: це повні мапи на 4 км, розраховані на 32-64 GB пам'яті."}], "answer": 2, "explain": {"en": "On a 16 GB PC you open only the sample's small levels. The full maps won't fit in memory.", "uk": "На ПК із 16 GB відкривай лише малі рівні зразка. Повні мапи не вмістяться в пам'ять."}}, {"q": {"en": "Why do you list a pack's best pieces before you place anything from it?", "uk": "Навіщо вносити в список найкращі частини пака, перш ніж щось із нього розміщувати?"}, "options": [{"en": "The maker's showcase shows what the pack does best; worlds that use only the filler look cheaper than the pack.", "uk": "Вітрина автора показує, що пак уміє найкраще; світи, які використовують лише заповнювачі, виглядають дешевше за сам пак."}, {"en": "Fab asks for a review.", "uk": "Fab вимагає відгук."}, {"en": "The best pieces are always the smallest files.", "uk": "Найкращі частини — завжди найменші файли."}, {"en": "To count the meshes for the licence.", "uk": "Щоб порахувати меші для ліцензії."}], "answer": 0, "explain": {"en": "Using the hero pieces first makes your world look as good as the pack's own pictures.", "uk": "Коли спершу використовуєш ключові частини, твій світ виглядає так само добре, як власні зображення пака."}}], "weekInfo": {"week": 5, "title": {"en": "Your real place and your island on paper", "uk": "Твоє реальне місце і твій острів на папері"}, "goal": {"en": "By Friday you have a complete planning pack: one real coastal place with 15 credited photos, island_map.png to scale with two red 200 x 200 m districts and the scenic route, two counted plot plans, two needs lists, reviewed free packs, and the Electric Dreams download under way.", "uk": "До п'ятниці в тебе є повний пакет планування: одне реальне прибережне місце з 15 фото із зазначеним авторством, island_map.png у масштабі з двома червоними районами 200 x 200 м і мальовничим маршрутом, два плани ділянок із підрахованими об'єктами, два списки потреб, переглянуті безкоштовні паки, а завантаження Electric Dreams уже триває."}, "skills": [{"en": "Reference research and image licensing (Creative Commons) for production art", "uk": "Пошук референсів і ліцензування зображень (Creative Commons) для продакшн-арту"}, {"en": "Scaled world maps from OpenStreetMap data, with districts, roads and flight routes", "uk": "Мапи світу в масштабі за даними OpenStreetMap: райони, дороги й маршрути польотів"}, {"en": "Plot plans with item counts, camera positions and drone lanes for level layout", "uk": "Плани ділянок із підрахунком об'єктів, позиціями камер і коридорами для дрона для планування рівня"}, {"en": "Asset sourcing: needs lists, Fab licence checks and best-pieces reviews", "uk": "Пошук асетів: списки потреб, перевірка ліцензій на Fab і огляд найкращих частин"}, {"en": "Pre-production review: consistency checks and a one-page planning board", "uk": "Огляд препродакшну: перевірка узгодженості й дошка планування на одну сторінку"}]}, "morning": {"sofar": {"en": "You have a reference set, a map of your island to scale, and two plot plans with every item counted.", "uk": "У тебе є добірка референсів, мапа острова в масштабі й два плани ділянок, де пораховано кожен об'єкт."}, "today": {"en": "You write a needs list for each district, choose free packs with a best-pieces review, and start the big Electric Dreams download.", "uk": "Сьогодні ти складаєш список потреб для кожного району, обираєш безкоштовні паки з оглядом їхніх найкращих елементів і запускаєш велике завантаження Electric Dreams."}, "cheer": {"en": "The big download takes hours and that is normal; let it run while you plan, and anything unfinished carries on tomorrow.", "uk": "Велике завантаження триває годинами, і це нормально; хай воно йде, поки ти плануєш, а все незавершене продовжиться завтра."}, "quote": {"text": {"en": "Still achieving, still pursuing, learn to labor and to wait.", "uk": "Досягай і далі прагни, вчися праці й умій чекати."}, "author": {"en": "Henry Wadsworth Longfellow", "uk": "Генрі Водсворт Лонгфелло"}, "source": "https://en.wikiquote.org/wiki/Henry_Wadsworth_Longfellow"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-24-needs-lists-and-free-packs", "mapHref": "../../COURSE.html", "prevHref": "../Day-23-two-plot-plans/START-HERE.html", "nextHref": "../Day-25-boss-planning-pack/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in A web browser (Fab and Poly Haven), the Epic Games Launcher and Unreal Engine 5.8. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me and don't write code. Keep me moving and make it feel like a game.\n\nToday I build on my own: District 2's needs list, the pack picks and the best-pieces review, on your own.\nIt's part of: Two needs lists (needs_d1.md and needs_d2.md), three or more free packs added to IslandCourse, packs_review.md with each pack's best pieces and the ground textures for Day 28, and the Electric Dreams sample downloading as its own project (Your Work folder (Day24) for the lists and the review; IslandCourse for the packs, each in its own folder; a practice level, Content/Course/Day24/L_PackTest, for the scale checks; and the Electric Dreams sample as a separate project, ElectricDreamsSample, on a drive with room.).\n\nSpec:\n- needs_d1.md and needs_d2.md, made from needs-list-template.md: one row per item in your plans, with its photo, count, where, source and 'reads from 30 m?'; a Gaps table with a decision and a time limit for every need nothing covers; and the two route lines.\n- Sources in this order: your own kit first (Days 1 to 13), Unreal's built-in pieces second (Basic Shapes, LevelPrototyping, the Water plugin), a free pack from free-packs-list.md third, a time-boxed Blender model last.\n- Three or more free packs added to IslandCourse: one rock pack for Day 28's cliffs (Free Sample Realistic Rock Set, or Limestone Rocks or Quarry Cliff if they still show Free) and two more that your needs lists call for; each still showing Free, its licence and engine versions read, and a line in credits.md.\n- packs_review.md: one section per pack with its link, licence, mesh count, its 5 to 10 best pieces from the maker's showcase, and for each piece: district 1, district 2, the coast, or not suitable and why.\n- pack_scale.png: one best piece from each pack beside the mannequin and one piece of your own kit, in L_PackTest.\n- A 'Ground for Day 28' section at the end of packs_review.md: a rock texture (from your rock pack or Poly Haven) and a grass and a sand texture from Poly Haven, downloaded into Day24/ground and listed in credits.md.\n- Electric Dreams Env added to your library and its download started as a separate project named ElectricDreamsSample: about 60 GB, so read the exact download size in the Launcher and keep at least three times that free on the drive, because shaders and derived data grow large.\n\nMy checklist:\n1. First thing: check the Electric Dreams download in the Launcher's Downloads; if it stopped, resume it. Take download.png of the Downloads page (Win+Shift+S). Check: the bar moves, and the project sits on a drive with at least three times the download size free. (from lesson 1)\n2. needs_d1.md: every item from plot_plan_d1.md as a row, with its photo and count. Check: the counts match your plan row for row. (from lesson 2)\n3. needs_d1.md: sources in order (own kit, built in, free pack, Blender), 'reads from 30 m?', and the Gaps table. Check: every row has a source, or a gap decision with a time limit. (from lesson 2)\n4. needs_d2.md the same way for district 2. Check: every row has a source or a gap decision, and the two route lines are written. (from lesson 2)\n5. Choose three or more packs from free-packs-list.md (one rock pack plus what your lists need) and check each on Fab. Check: each one still says Free, and you've read its licence and engine versions. (from lesson 3)\n6. Add the packs to IslandCourse (Add to Project, or import FBX files by hand). Check: each pack's folder is in the Content Browser and its meshes open. (from lesson 3)\n7. One credits.md line per pack, with CC-BY packs marked. Check: every pack has its author, licence and link. (from lesson 3)\n8. Best-pieces review for each pack in packs_review.md. Check: 5 to 10 best pieces per pack, each planned for a district or the coast, or 'not suitable' with a reason. (from lesson 4)\n9. Scale check in L_PackTest: one best piece per pack beside the mannequin and your own bench; take pack_scale.png (Win+Shift+S). Check: nothing is twice or half its real size, or the fix is noted. (from lesson 3)\n10. Ground for Day 28: download a grass and a sand texture from Poly Haven (and a rock one if your rock pack has no texture you like) into Day24/ground; list them in packs_review.md and credits.md. Check: three colour textures in Day24/ground, each with a credit line. (from lesson 3)\n11. Update the source guesses in both plot plan tables from your needs lists. Check: the plans and the needs lists name the same sources. (from lesson 2)\n12. When the download finishes (tonight or tomorrow): on a 16 GB PC raise the Windows page file to 32 GB or more first (System > About > Advanced system settings > Performance: Settings > Advanced > Virtual memory: Change), close the browser, and keep Engine Scalability at High. Then open ElectricDreamsSample once and let the shaders compile (it can take an hour; don't close the editor). Don't open its big ElectricDreams_Env map: on a 16 GB PC it won't fit, and the same goes for ElectricDreams_PCG. Check: the sample opens on its Startup level and 'Compiling Shaders' at the bottom right has gone. (from lesson 1)\n13. Record a 60-second clip flying slowly past the best pieces in L_PackTest at eye level (Win+Alt+R). Save today's clip as clip_day24.mp4. Check: every pack shows in the clip, beside the mannequin. (from lesson 4)\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Karina L.\nDay 24: Needs lists, free packs and the big download. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

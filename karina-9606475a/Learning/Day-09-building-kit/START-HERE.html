<script id="data" type="application/json">{"learner": "ib-karina-9606475a", "learnerName": {"en": "Karina L.", "uk": "Карина Л."}, "day": 9, "week": 2, "total": 60, "title": {"en": "A small building kit: walls, a window, a door and a roof", "uk": "Невеликий набір для будівель: стіни, вікно, двері й дах"}, "theme": {"en": "Week 2: Modular kits", "uk": "Тиждень 2: Модульні набори"}, "build": {"item": {"en": "Your building kit: walls, openings, a corner post and roof pieces for small harbour houses", "uk": "Твій набір для будівель: стіни, прорізи, кутова стійка й деталі даху для невеликих будиночків біля гавані"}, "why": {"en": "Most buildings in a harbour town are simple boxes with doors, windows and a pitched roof. A wall kit on a 2 m grid with a 3 m storey (the height of one floor) builds any of them, from a fisherman's hut to a row of shops. Studios build towns exactly this way, and it is how you will fill two districts of your island without modelling every house by hand.", "uk": "Більшість будівель у портовому містечку — прості коробки з дверима, вікнами і двосхилим дахом. Набір стін на сітці 2 м із поверхом 3 м (висота одного поверху) будує будь-яку з них — від рибальської хатинки до ряду крамниць. Студії будують містечка саме так, і саме так ти заповниш два райони свого острова, не моделюючи кожен будинок вручну."}, "where": {"en": "Your island's waterfront (district 1) and later district 2: harbour offices, shops and houses. Today a test house in Course/Day09.", "uk": "Набережна твого острова (район 1), а згодом і район 2: портові контори, крамниці й будинки. Сьогодні — тестовий будинок у Course/Day09."}, "spec": [{"en": "Wall rule (in kit_rules.md): walls 2 m long, 3 m tall and 0.2 m thick, standing on a grid line through their middle; the outside faces -Y; pivot at the bottom of the wall's centre line at its start (X = 0, Y = 0, Z = 0).", "uk": "Правило стін (у kit_rules.md): стіни 2 м завдовжки, 3 м заввишки і 0.2 м завтовшки стоять на лінії сітки, яка проходить через їхню середину; зовнішній бік дивиться в -Y; півот унизу центральної лінії стіни на її початку (X = 0, Y = 0, Z = 0)."}, {"en": "SM_Wall_2m (plain); SM_Wall_Window (a 1.0 x 1.2 m window with its sill at 0.9 m, a timber frame and a glass panel); SM_Wall_Door (a 1.0 x 2.1 m door with a frame and a door leaf standing open).", "uk": "SM_Wall_2m (проста); SM_Wall_Window (вікно 1.0 x 1.2 м із підвіконням на висоті 0.9 м, дерев'яною рамою і скляною панеллю); SM_Wall_Door (двері 1.0 x 2.1 м із коробкою та відчиненим дверним полотном)."}, {"en": "SM_Wall_Corner: a 0.24 x 0.24 x 3 m corner post (a pilaster) centred on the grid point, covering the join where two walls meet.", "uk": "SM_Wall_Corner: кутова стійка 0.24 x 0.24 x 3 м (пілястра), відцентрована на точці сітки, яка закриває стик, де сходяться дві стіни."}, {"en": "Roof for a 4 m wide house with a 30-degree pitch (slope): SM_Roof_2m (a panel 2 m along the ridge, its pivot on the ridge line), SM_Roof_Ridge_2m (the ridge cap) and SM_Roof_Gable_4m (the triangle of wall under each end of the roof).", "uk": "Дах для будинку завширшки 4 м з ухилом 30 градусів (pitch — кут схилу): SM_Roof_2m (панель 2 м уздовж гребеня, півот на лінії гребеня), SM_Roof_Ridge_2m (коник — накладка на гребінь) і SM_Roof_Gable_4m (фронтон — трикутник стіни під кожним кінцем даху)."}, {"en": "Openings cut with the Boolean modifier; UCX boxes leave the window and door open; plain materials M_Plaster, M_Timber, M_Glass (dark, Roughness 0.05) and M_RoofTile.", "uk": "Прорізи вирізано модифікатором Boolean; блоки UCX лишають вікно й двері відкритими; прості матеріали M_Plaster, M_Timber, M_Glass (темний, Roughness 0.05) і M_RoofTile."}, {"en": "Every piece exported from the world origin, under 2,000 triangles; Nanite on for every piece in Unreal.", "uk": "Кожну деталь експортовано з центру світу, менше 2 000 трикутників; в Unreal Nanite увімкнено для кожної деталі."}, {"en": "In Unreal (Course/Day09, level L_Day09): a 4 x 6 m house shell with a door, at least three windows, corner posts, two gables, the roof and the ridge, with no gaps.", "uk": "В Unreal (Course/Day09, рівень L_Day09): коробка будинку 4 x 6 м із дверима, щонайменше трьома вікнами, кутовими стійками, двома фронтонами, дахом і коником, без щілин."}], "piece1": "SM_Wall_2m, SM_Wall_Window and SM_Roof_2m (in the lessons)", "piece2": {"en": "SM_Wall_Door, SM_Wall_Corner, SM_Roof_Ridge_2m and SM_Roof_Gable_4m, then the test house, on your own", "uk": "SM_Wall_Door, SM_Wall_Corner, SM_Roof_Ridge_2m і SM_Roof_Gable_4m, а потім тестовий будинок, самостійно"}, "steps": [{"text": {"en": "SM_Wall_Door: copy SM_Wall_2m in place (Shift+D, right-click), rename it, and cut the door with a Boolean (Difference) using a cutter 1.0 x 0.5 x 2.2 m at X 1, Z 1.0, so the opening runs from the floor to 2.1 m. Apply it and delete the cutter. Check: a clean doorway, open at the bottom, 1 m wide and 2.1 m tall.", "uk": "SM_Wall_Door: скопіюй SM_Wall_2m на місці (Shift+D, клацання правою кнопкою), перейменуй копію й виріж двері через Boolean (Difference) різаком 1.0 x 0.5 x 2.2 м на X 1, Z 1.0, щоб проріз ішов від підлоги до 2.1 м. Застосуй модифікатор і видали різак. Перевірка: чистий дверний проріз, відкритий знизу, 1 м завширшки і 2.1 м заввишки."}, "lesson": 2}, {"text": {"en": "Door frame and leaf: two jambs (the side pieces of the frame: 0.06 x 0.12 x 2.1 m at X 0.53 and X 1.47, Z 1.05), a head (the top piece: 0.88 x 0.12 x 0.06 m at X 1, Z 2.07) and a door leaf standing open at a right angle on the inside (+Y) side, so the mannequin can walk through (0.05 x 0.88 x 2.04 m at X 0.585, Y 0.54, Z 1.02). Give them M_Timber and join them into the wall. Check: from the front, the frame fills the opening's edges, and from above the open door stands at a right angle to the wall beside the left jamb.", "uk": "Дверна коробка й полотно: два одвірки (бічні частини коробки: 0.06 x 0.12 x 2.1 м на X 0.53 і X 1.47, Z 1.05), перемичка (верхня частина: 0.88 x 0.12 x 0.06 м на X 1, Z 2.07) і дверне полотно, відчинене під прямим кутом усередину (бік +Y), щоб манекен міг пройти (0.05 x 0.88 x 2.04 м на X 0.585, Y 0.54, Z 1.02). Дай їм M_Timber і приєднай до стіни. Перевірка: спереду коробка заповнює краї прорізу, а згори відчинені двері стоять під прямим кутом до стіни біля лівого одвірка."}, "lesson": "D1.3"}, {"text": {"en": "Collision for the openings: three UCX boxes on SM_Wall_Door (left, right, above the door) and four on SM_Wall_Window (left, right, below the sill, above the window). Check: in X-ray, the window and door openings have no box in them.", "uk": "Колізія для прорізів: три блоки UCX на SM_Wall_Door (ліворуч, праворуч, над дверима) і чотири на SM_Wall_Window (ліворуч, праворуч, під підвіконням, над вікном). Перевірка: у X-ray у прорізах вікна й дверей немає жодного блока."}, "lesson": "D4.3"}, {"text": {"en": "SM_Wall_Corner: a cube 0.24 x 0.24 x 3 m with the scale applied, moved up 1.5 m; origin at its bottom centre on the world origin; M_Plaster (or a stone colour); one UCX box. Check: from above, the post is centred on the world origin and is 2 cm wider than the wall on each side.", "uk": "SM_Wall_Corner: куб 0.24 x 0.24 x 3 м із застосованим масштабом, піднятий на 1.5 м; origin унизу по центру, у центрі світу; M_Plaster (або колір каменю); один блок UCX. Перевірка: згори стійка відцентрована на центрі світу й ширша за стіну на 2 см з кожного боку."}, "lesson": 1}, {"text": {"en": "SM_Roof_Gable_4m: finish the lesson's triangle; put its origin on the world origin (the bottom of its centre line at the start), give it M_Plaster and one UCX box (a copy of the gable itself is a fine convex shape). Check: Location 0, 0, 0, and the apex is 1.15 m above the bottom at X 2.", "uk": "SM_Roof_Gable_4m: заверши трикутник з уроку; постав його origin у центр світу (низ його центральної лінії на початку), дай йому M_Plaster і один блок UCX (копія самого фронтона — цілком придатна опукла форма). Перевірка: Location 0, 0, 0, а вершина на 1.15 м вище низу на X 2."}, "lesson": 3}, {"text": {"en": "SM_Roof_Ridge_2m: a cylinder (Vertices 12, Radius 0.12 m, Depth 2 m), turned with R Y 90 so it lies along X, then G X 1 and G Z 0.2; apply the rotation, set the origin to the world origin, give it M_RoofTile and one UCX box. Check: the ridge cap's pivot is at its left end, 0.2 m below its centre.", "uk": "SM_Roof_Ridge_2m: циліндр (Vertices 12, Radius 0.12 м, Depth 2 м), повернутий через R Y 90, щоб лежав уздовж X, потім G X 1 і G Z 0.2; застосуй обертання, постав origin у центр світу, дай йому M_RoofTile і один блок UCX. Перевірка: півот коника на його лівому кінці, на 0.2 м нижче його центру."}, "lesson": 3}, {"text": {"en": "Check every building piece: Location 0, 0, 0, the origin on its pivot, under 2,000 triangles, the name following the pattern. Check: seven pieces, all yes, written in kit_rules.md.", "uk": "Перевір кожну деталь будівлі: Location 0, 0, 0, origin на півоті, менше 2 000 трикутників, назва за шаблоном. Перевірка: сім деталей, усі «так», записано в kit_rules.md."}, "lesson": "D8.1"}, {"text": {"en": "Export SM_Wall_Door, SM_Wall_Corner, SM_Roof_Gable_4m and SM_Roof_Ridge_2m as FBX (one at a time, each with its UCX boxes). Check: seven building-kit FBX files in your Work folders (three from lesson 4, four now).", "uk": "Експортуй SM_Wall_Door, SM_Wall_Corner, SM_Roof_Gable_4m і SM_Roof_Ridge_2m у FBX (по одній, кожну з її блоками UCX). Перевірка: сім файлів FBX набору будівель у твоїх папках Work (три з уроку 4 і чотири зараз)."}, "lesson": "D4.4"}, {"text": {"en": "Import the four into Course/Day09 and switch on Nanite for each. Check: all seven building pieces show in colour in Nanite Visualization > Overview.", "uk": "Імпортуй ці чотири в Course/Day09 і ввімкни Nanite для кожної. Перевірка: усі сім деталей будівлі кольорові в Nanite Visualization > Overview."}, "lesson": "D8.3"}, {"text": {"en": "Walls of the 4 x 6 m house: front (Y 0) SM_Wall_Door at X 0 and SM_Wall_Window at X 200; two sides along Y at X 0 and X 400, three pieces each (SM_Wall_2m, SM_Wall_Window, SM_Wall_2m), turned with Rotation Z 90 or -90 so they close the box; the back (Y 600) two SM_Wall_2m turned 180, at X 200 and X 400 (a turned wall runs the other way from its pivot). Put SM_Wall_Corner at the four corner grid points. Check: a closed box of walls with a post at each corner.", "uk": "Стіни будинку 4 x 6 м: спереду (Y 0) SM_Wall_Door на X 0 і SM_Wall_Window на X 200; дві бічні стіни вздовж Y на X 0 і X 400, по три деталі (SM_Wall_2m, SM_Wall_Window, SM_Wall_2m), повернуті через Rotation Z 90 або -90 так, щоб замкнути коробку; ззаду (Y 600) дві SM_Wall_2m, повернуті на 180, на X 200 і X 400 (повернута стіна йде від свого півота в інший бік). Постав SM_Wall_Corner у чотири кутові точки сітки. Перевірка: замкнена коробка стін зі стійкою в кожному куті."}, "lesson": 4}, {"text": {"en": "Roof: SM_Roof_Gable_4m on the front and back walls at Z 300 (turn the back one 180 and place it at X 400, because it now runs the other way); three SM_Roof_2m on each side at X 200, Z 415, turned with Rotation Z 90 or -90 so each slopes down outwards, at Y 0, 200 and 400 (if a panel runs the wrong way along Y, use 200, 400 and 600); three SM_Roof_Ridge_2m along the top at X 200, Z 415, turned with Rotation Z 90 so they run along the ridge. Check: from the side, the roof slopes meet at the ridge and rest on the wall tops.", "uk": "Дах: SM_Roof_Gable_4m на передню й задню стіни на Z 300 (задній поверни на 180 і постав на X 400, бо тепер він іде в інший бік); по три SM_Roof_2m з кожного боку на X 200, Z 415, повернуті через Rotation Z 90 або -90 так, щоб кожна панель спускалася назовні, на Y 0, 200 і 400 (якщо панель іде вздовж Y не в той бік, використай 200, 400 і 600); три SM_Roof_Ridge_2m уздовж верху на X 200, Z 415, повернуті через Rotation Z 90, щоб ішли вздовж гребеня. Перевірка: збоку схили даху сходяться на гребені й лежать на верху стін."}, "lesson": 4}, {"text": {"en": "Fly round the house at 2 m from every join, then take house_front.png and house_side.png. Check: no gaps, no light through corners, no flickering surfaces.", "uk": "Облети будинок на відстані 2 м від кожного стику, а тоді зроби house_front.png і house_side.png. Перевірка: жодних щілин, жодного світла крізь кути, жодних мерехтливих поверхонь."}, "lesson": "D7.4"}, {"text": {"en": "Captures: before_after_day9.png (the pieces in a row in Blender, and the finished house in Unreal) and a 60-second clip: press Play and walk the mannequin through the door. Save today's clip as clip_day9.mp4. Check: the mannequin fits through the doorway, and both files are in today's Work folder.", "uk": "Знімки й запис: before_after_day9.png (деталі в ряд у Blender і готовий будинок в Unreal) і 60-секундний кліп: натисни Play і проведи манекен крізь двері. Збережи сьогоднішній кліп як clip_day9.mp4. Перевірка: манекен проходить у дверний проріз, а обидва файли лежать у сьогоднішній папці Work."}, "lesson": "D0.1"}]}, "lessons": [{"title": {"en": "A wall kit: storey height, thickness and the wall rule", "uk": "Набір стін: висота поверху, товщина і правило стін"}, "minutes": 40, "goals": [{"en": "Explain a storey (one floor of a building, here 3 m) and why every wall shares one height and thickness.", "uk": "Пояснювати, що таке поверх (один рівень будівлі, тут 3 м) і чому всі стіни мають однакову висоту й товщину."}, {"en": "Model SM_Wall_2m to the wall rule, with its pivot on the grid line at its start.", "uk": "Моделювати SM_Wall_2m за правилом стін, з півотом на лінії сітки на її початку."}, {"en": "Plan how walls meet at corners: a corner post slightly wider than the wall hides the join.", "uk": "Планувати, як стіни сходяться в кутах: кутова стійка, трохи ширша за стіну, ховає стик."}], "doalong": [{"en": "Find two photos of present-day small harbour houses on Commons (plaster walls, timber windows, tiled roofs); save them in refs and credit them in credits.md.", "uk": "Знайди на Commons два фото сучасних невеликих будиночків біля гавані (тиньковані стіни, дерев'яні вікна, черепичні дахи); збережи їх у refs і вкажи в credits.md."}, {"en": "New file buildkit_day9.blend, snapping on. Add a cube, set Dimensions 2 x 0.2 x 3 m and apply the scale, then type G X 1 and G Z 1.5. The wall runs from X 0 to 2, stands on Z 0, and sits across the Y = 0 line (from -0.1 to 0.1).", "uk": "Новий файл buildkit_day9.blend, прив'язку ввімкнено. Додай куб, задай Dimensions 2 x 0.2 x 3 м і застосуй масштаб, тоді введи G X 1 і G Z 1.5. Стіна йде від X 0 до 2, стоїть на Z 0 і перетинає лінію Y = 0 (від -0.1 до 0.1)."}, {"en": "Shift+S > Cursor to World Origin, then Object > Set Origin > Origin to 3D Cursor: the pivot is at the bottom of the wall's centre line at its start. Name it SM_Wall_2m.", "uk": "Shift+S > Cursor to World Origin, потім Object > Set Origin > Origin to 3D Cursor: півот унизу центральної лінії стіни на її початку. Назви її SM_Wall_2m."}, {"en": "Plan the corner: when a wall along X meets a wall along Y on the same grid point, their ends overlap and leave a small notch on the outside. Write in kit_rules.md: SM_Wall_Corner is a 0.24 x 0.24 m post centred on the grid point, 2 cm wider than the wall on each side, so it covers the join.", "uk": "Сплануй кут: коли стіна вздовж X зустрічається зі стіною вздовж Y в одній точці сітки, їхні кінці накладаються й лишають ззовні маленьку виїмку. Запиши в kit_rules.md: SM_Wall_Corner — стійка 0.24 x 0.24 м, відцентрована на точці сітки, на 2 см ширша за стіну з кожного боку, тож вона закриває стик."}, {"en": "Material: M_Plaster, a warm off-white or a colour from your photos, Roughness 0.9, Metallic 0. Add one UCX box the size of the wall, named UCX_SM_Wall_2m_00, with the wall's origin.", "uk": "Матеріал: M_Plaster, теплий молочно-білий або колір із твоїх фото, Roughness 0.9, Metallic 0. Додай один блок UCX розміром зі стіну з назвою UCX_SM_Wall_2m_00, з origin стіни."}], "play": {"en": "House count: the tutor describes three houses (4 x 6 m with one door and three windows; 4 x 4 m with two doors; 4 x 8 m with five windows); I count the wall pieces, corner posts and roof pieces each one needs.", "uk": "Порахуй будинки: тьютор описує три будинки (4 x 6 м з одними дверима і трьома вікнами; 4 x 4 м із двома дверима; 4 x 8 м із п'ятьма вікнами); я рахую, скільки деталей стін, кутових стійок і деталей даху потрібно кожному."}, "video": {"search": "modular building kit walls on a grid blender beginner"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: A wall kit: storey height, thickness and the wall rule (Day 9, lesson 1 of 4).\nToday's build: Your building kit: walls, openings, a corner post and roof pieces for small harbour houses.\n\nBy the end of this lesson I can:\n1. Explain a storey (one floor of a building, here 3 m) and why every wall shares one height and thickness.\n2. Model SM_Wall_2m to the wall rule, with its pivot on the grid line at its start.\n3. Plan how walls meet at corners: a corner post slightly wider than the wall hides the join.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (Your harbour kit has six pieces, from quay edge to steps, each with a written Nanite or LOD decision.), what I will learn today (You make a small building kit (walls, a window, a door, a corner post and roof pieces) and snap a 4 x 6 m house shell together in Unreal.), encourage me (A house is walls and a roof on a grid, and you already know how to make both; give the roof angle the time it needs.), and share today's quote: \"Form ever follows function, and this is the law.\" (Louis Sullivan).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 6: How do you turn a plan point of 12.5 m into Unreal's Location value? | Day 4: Why should collision be a few simple boxes instead of the full model?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: House count: the tutor describes three houses (4 x 6 m with one door and three windows; 4 x 4 m with two doors; 4 x 8 m with five windows); I count the wall pieces, corner posts and roof pieces each one needs.\n6. Do-along on today's build (SM_Wall_2m, SM_Wall_Window and SM_Roof_2m (in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Find two photos of present-day small harbour houses on Commons (plaster walls, timber windows, tiled roofs); save them in refs and credit them in credits.md.\n   - New file buildkit_day9.blend, snapping on. Add a cube, set Dimensions 2 x 0.2 x 3 m and apply the scale, then type G X 1 and G Z 1.5. The wall runs from X 0 to 2, stands on Z 0, and sits across the Y = 0 line (from -0.1 to 0.1).\n   - Shift+S > Cursor to World Origin, then Object > Set Origin > Origin to 3D Cursor: the pivot is at the bottom of the wall's centre line at its start. Name it SM_Wall_2m.\n   - Plan the corner: when a wall along X meets a wall along Y on the same grid point, their ends overlap and leave a small notch on the outside. Write in kit_rules.md: SM_Wall_Corner is a 0.24 x 0.24 m post centred on the grid point, 2 cm wider than the wall on each side, so it covers the join.\n   - Material: M_Plaster, a warm off-white or a colour from your photos, Roughness 0.9, Metallic 0. Add one UCX box the size of the wall, named UCX_SM_Wall_2m_00, with the wall's origin.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Openings: the Boolean modifier for windows and doors", "uk": "Прорізи: модифікатор Boolean для вікон і дверей"}, "minutes": 40, "goals": [{"en": "Explain the Boolean modifier: it cuts the shape of one object (the cutter) out of another (Difference).", "uk": "Пояснювати, що таке модифікатор Boolean: він вирізає форму одного об'єкта (різака) з іншого (Difference)."}, {"en": "Cut a window opening with a cutter box and apply it cleanly.", "uk": "Вирізати віконний проріз різаком-бруском і чисто застосовувати модифікатор."}, {"en": "Make a window frame from a plane with inset, Separate (P) for the glass, and Solidify for depth.", "uk": "Робити віконну раму з площини через inset, Separate (P) для скла і Solidify для глибини."}], "doalong": [{"en": "Select SM_Wall_2m, press Shift+D and right-click: the copy stays in place. Name the copy SM_Wall_Window and hide SM_Wall_2m with its eye icon.", "uk": "Виділи SM_Wall_2m, натисни Shift+D і клацни правою кнопкою: копія лишається на місці. Назви копію SM_Wall_Window і сховай SM_Wall_2m значком ока."}, {"en": "Add the cutter: a cube with Dimensions 1.0 x 0.5 x 1.2 m, scale applied, then G X 1 and G Z 1.5. It pokes through the wall where the window goes (sill at 0.9 m, top at 2.1 m). Name it Cutter.", "uk": "Додай різак: куб із Dimensions 1.0 x 0.5 x 1.2 м, масштаб застосовано, потім G X 1 і G Z 1.5. Він протинає стіну там, де буде вікно (підвіконня на 0.9 м, верх на 2.1 м). Назви його Cutter."}, {"en": "Select SM_Wall_Window. Add Modifier > Generate > Boolean: choose Difference, click the Object box and pick Cutter, and set Solver to Exact. Hide the Cutter (eye icon): the wall has a clean hole. Apply the Boolean, then delete the Cutter.", "uk": "Виділи SM_Wall_Window. Add Modifier > Generate > Boolean: вибери Difference, клацни поле Object і вибери Cutter, а Solver встанови на Exact. Сховай Cutter (значок ока): у стіні чистий отвір. Застосуй Boolean, а тоді видали Cutter."}, {"en": "Frame: add a plane (Shift+A > Mesh > Plane), type R X 90 Enter and press Ctrl+A > Rotation. Set its Dimensions X 1.0 and Z 1.2, apply the scale, then G X 1 and G Z 1.5: the plane fills the opening.", "uk": "Рама: додай площину (Shift+A > Mesh > Plane), введи R X 90 Enter і натисни Ctrl+A > Rotation. Задай її Dimensions X 1.0 і Z 1.2, застосуй масштаб, потім G X 1 і G Z 1.5: площина заповнює проріз."}, {"en": "Tab, select the face, press I, type 0.06 and press Enter: a 6 cm border. With the inner face still selected, press P > Selection: the glass becomes its own object. Tab out. On the frame, add Solidify (Thickness 0.08 m) and apply it; on the glass, Solidify 0.01 m, applied.", "uk": "Tab, виділи грань, натисни I, введи 0.06 і натисни Enter: рамка 6 см. Поки внутрішня грань ще виділена, натисни P > Selection: скло стає окремим об'єктом. Вийди з Edit Mode (Tab). На рамі додай Solidify (Thickness 0.08 м) і застосуй його; на склі — Solidify 0.01 м, теж застосований."}, {"en": "Give the frame M_Timber and the glass M_Glass (a dark blue-grey, Roughness 0.05, Metallic 0). Select the frame, the glass and then the wall, and press Ctrl+J: one object, three materials. This glass is opaque (you can't see through it), so the window piece can still use Nanite.", "uk": "Дай рамі M_Timber, а склу — M_Glass (темний синьо-сірий, Roughness 0.05, Metallic 0). Виділи раму, скло, а тоді стіну й натисни Ctrl+J: один об'єкт, три матеріали. Це скло непрозоре (крізь нього не видно), тож деталь із вікном і далі може використовувати Nanite."}], "play": {"en": "Cutter challenge: the tutor gives me three openings (a shop window 2.4 x 2 m, an arched-top door I may simplify to a box, a small square vent 0.4 m); I say each cutter's Dimensions and Location on a 2 m or 4 m wall.", "uk": "Виклик різака: тьютор дає мені три прорізи (вітрина крамниці 2.4 x 2 м, двері з арковим верхом, які можна спростити до прямокутника, маленька квадратна віддушина 0.4 м); я називаю Dimensions і Location кожного різака на стіні 2 м або 4 м."}, "video": {"search": "blender boolean modifier difference beginner"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Openings: the Boolean modifier for windows and doors (Day 9, lesson 2 of 4).\nToday's build: Your building kit: walls, openings, a corner post and roof pieces for small harbour houses.\nEarlier today I already did: lesson 1 (A wall kit: storey height, thickness and the wall rule). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Explain the Boolean modifier: it cuts the shape of one object (the cutter) out of another (Difference).\n2. Cut a window opening with a cutter box and apply it cleanly.\n3. Make a window frame from a plane with inset, Separate (P) for the glass, and Solidify for depth.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Cutter challenge: the tutor gives me three openings (a shop window 2.4 x 2 m, an arched-top door I may simplify to a box, a small square vent 0.4 m); I say each cutter's Dimensions and Location on a 2 m or 4 m wall.\n4. Do-along on today's build (SM_Wall_2m, SM_Wall_Window and SM_Roof_2m (in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Select SM_Wall_2m, press Shift+D and right-click: the copy stays in place. Name the copy SM_Wall_Window and hide SM_Wall_2m with its eye icon.\n   - Add the cutter: a cube with Dimensions 1.0 x 0.5 x 1.2 m, scale applied, then G X 1 and G Z 1.5. It pokes through the wall where the window goes (sill at 0.9 m, top at 2.1 m). Name it Cutter.\n   - Select SM_Wall_Window. Add Modifier > Generate > Boolean: choose Difference, click the Object box and pick Cutter, and set Solver to Exact. Hide the Cutter (eye icon): the wall has a clean hole. Apply the Boolean, then delete the Cutter.\n   - Frame: add a plane (Shift+A > Mesh > Plane), type R X 90 Enter and press Ctrl+A > Rotation. Set its Dimensions X 1.0 and Z 1.2, apply the scale, then G X 1 and G Z 1.5: the plane fills the opening.\n   - Tab, select the face, press I, type 0.06 and press Enter: a 6 cm border. With the inner face still selected, press P > Selection: the glass becomes its own object. Tab out. On the frame, add Solidify (Thickness 0.08 m) and apply it; on the glass, Solidify 0.01 m, applied.\n   - Give the frame M_Timber and the glass M_Glass (a dark blue-grey, Roughness 0.05, Metallic 0). Select the frame, the glass and then the wall, and press Ctrl+J: one object, three materials. This glass is opaque (you can't see through it), so the window piece can still use Nanite.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Roof pieces: pitch, panel, ridge and gable", "uk": "Деталі даху: ухил, панель, гребінь і фронтон"}, "minutes": 40, "goals": [{"en": "Explain roof pitch (the angle of the slope) and work out the roof height for a 4 m wide house at 30 degrees: about 1.15 m.", "uk": "Пояснювати, що таке ухил даху (pitch — кут схилу), і обчислювати висоту даху для будинку завширшки 4 м при 30 градусах: близько 1.15 м."}, {"en": "Model a roof panel and turn it around its top edge to the pitch angle.", "uk": "Моделювати панель даху й повертати її навколо верхнього краю на кут ухилу."}, {"en": "Make a triangular gable from a box by scaling its top face to zero width (S X 0).", "uk": "Робити трикутний фронтон із бруска, стискаючи його верхню грань до нульової ширини (S X 0)."}], "doalong": [{"en": "Write the roof numbers in kit_rules.md: house 4 m wide between wall centre lines; pitch 30 degrees; so the ridge (the top line of the roof) is 1.15 m above the wall tops, at Z = 4.15 m.", "uk": "Запиши числа даху в kit_rules.md: будинок завширшки 4 м між центральними лініями стін; ухил 30 градусів; отже, гребінь (верхня лінія даху) на 1.15 м вище верху стін, на Z = 4.15 м."}, {"en": "Add a cube, set Dimensions 2 x 2.65 x 0.15 m and apply the scale. Type G X 1, G Y -1.325 and G Z 0.075: the panel lies flat, its back edge on the X axis at the world origin.", "uk": "Додай куб, задай Dimensions 2 x 2.65 x 0.15 м і застосуй масштаб. Введи G X 1, G Y -1.325 і G Z 0.075: панель лежить пласко, а її задній край — на осі X у центрі світу."}, {"en": "Shift+S > Cursor to World Origin, then Object > Set Origin > Origin to 3D Cursor: the origin sits on the edge that will be the ridge.", "uk": "Shift+S > Cursor to World Origin, потім Object > Set Origin > Origin to 3D Cursor: origin стоїть на краю, який стане гребенем."}, {"en": "Type R X 30 Enter: the panel tips down towards you. Look from the side (Numpad 3): it slopes at 30 degrees. If it tipped up, press Ctrl+Z and type R X -30. Press Ctrl+A > Rotation.", "uk": "Введи R X 30 Enter: панель нахиляється донизу до тебе. Подивися збоку (Numpad 3): схил під 30 градусів. Якщо панель нахилилася вгору, натисни Ctrl+Z і введи R X -30. Натисни Ctrl+A > Rotation."}, {"en": "Name it SM_Roof_2m and give it M_RoofTile (a terracotta red, Roughness 0.8, Metallic 0). Shift+D and right-click for a copy in place, and name the copy UCX_SM_Roof_2m_00: a box is a fine convex collision shape.", "uk": "Назви її SM_Roof_2m і дай їй M_RoofTile (теракотовий червоний, Roughness 0.8, Metallic 0). Shift+D і клацання правою кнопкою — копія на місці; назви копію UCX_SM_Roof_2m_00: брусок — цілком придатна опукла форма колізії."}, {"en": "Gable practice: add a cube, Dimensions 4 x 0.2 x 1.15 m, scale applied, then G X 2 and G Z 0.575. Tab, select the top face, type S X 0 Enter: the top shrinks to a line and the box becomes a triangle. Tab out: this becomes SM_Roof_Gable_4m.", "uk": "Тренування фронтона: додай куб, Dimensions 4 x 0.2 x 1.15 м, масштаб застосовано, потім G X 2 і G Z 0.575. Tab, виділи верхню грань, введи S X 0 Enter: верх стискається в лінію, і брусок стає трикутником. Вийди з Edit Mode (Tab): це буде SM_Roof_Gable_4m."}], "play": {"en": "Roof maths: the tutor gives me three house widths (4 m, 6 m, 8 m) at 30 degrees; I estimate each roof height as half the width times 0.58, and the tutor checks my numbers.", "uk": "Математика даху: тьютор дає мені три ширини будинку (4 м, 6 м, 8 м) при 30 градусах; я оцінюю висоту кожного даху як половину ширини, помножену на 0.58, а тьютор перевіряє мої числа."}, "video": {"search": "blender model simple pitched roof gable beginner"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Roof pieces: pitch, panel, ridge and gable (Day 9, lesson 3 of 4).\nToday's build: Your building kit: walls, openings, a corner post and roof pieces for small harbour houses.\nEarlier today I already did: lesson 1 (A wall kit: storey height, thickness and the wall rule); lesson 2 (Openings: the Boolean modifier for windows and doors). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Explain roof pitch (the angle of the slope) and work out the roof height for a 4 m wide house at 30 degrees: about 1.15 m.\n2. Model a roof panel and turn it around its top edge to the pitch angle.\n3. Make a triangular gable from a box by scaling its top face to zero width (S X 0).\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Roof maths: the tutor gives me three house widths (4 m, 6 m, 8 m) at 30 degrees; I estimate each roof height as half the width times 0.58, and the tutor checks my numbers.\n4. Do-along on today's build (SM_Wall_2m, SM_Wall_Window and SM_Roof_2m (in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Write the roof numbers in kit_rules.md: house 4 m wide between wall centre lines; pitch 30 degrees; so the ridge (the top line of the roof) is 1.15 m above the wall tops, at Z = 4.15 m.\n   - Add a cube, set Dimensions 2 x 2.65 x 0.15 m and apply the scale. Type G X 1, G Y -1.325 and G Z 0.075: the panel lies flat, its back edge on the X axis at the world origin.\n   - Shift+S > Cursor to World Origin, then Object > Set Origin > Origin to 3D Cursor: the origin sits on the edge that will be the ridge.\n   - Type R X 30 Enter: the panel tips down towards you. Look from the side (Numpad 3): it slopes at 30 degrees. If it tipped up, press Ctrl+Z and type R X -30. Press Ctrl+A > Rotation.\n   - Name it SM_Roof_2m and give it M_RoofTile (a terracotta red, Roughness 0.8, Metallic 0). Shift+D and right-click for a copy in place, and name the copy UCX_SM_Roof_2m_00: a box is a fine convex collision shape.\n   - Gable practice: add a cube, Dimensions 4 x 0.2 x 1.15 m, scale applied, then G X 2 and G Z 0.575. Tab, select the top face, type S X 0 Enter: the top shrinks to a line and the box becomes a triangle. Tab out: this becomes SM_Roof_Gable_4m.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Testing the building kit in Unreal", "uk": "Тестуємо набір для будівель в Unreal"}, "minutes": 40, "goals": [{"en": "Import several kit pieces together into a day folder and switch on Nanite for each.", "uk": "Імпортувати кілька деталей набору разом у папку дня й вмикати Nanite для кожної."}, {"en": "Snap walls with a 100 cm grid and 90-degree turns, and fix a piece that lands on the wrong side after turning.", "uk": "З'єднувати стіни із сіткою 100 см і поворотами на 90 градусів та виправляти деталь, яка після повороту опиняється не з того боку."}, {"en": "Type exact heights for parts above the ground (gables at Z 300, roof at Z 415).", "uk": "Вводити точну висоту для частин над землею (фронтони на Z 300, дах на Z 415)."}], "doalong": [{"en": "In Blender, export SM_Wall_2m, SM_Wall_Window and SM_Roof_2m as FBX, one at a time, each with its UCX boxes and each at the world origin.", "uk": "У Blender експортуй SM_Wall_2m, SM_Wall_Window і SM_Roof_2m у FBX по одній, кожну з її блоками UCX і кожну в центрі світу."}, {"en": "In IslandCourse, make a new level L_Day09 in a new folder Course/Day09. Select the three FBX files in File Explorer and drag them into Course/Day09 together. Switch on Nanite for each (Static Mesh Editor > Enable Nanite Support > Apply Changes).", "uk": "В IslandCourse створи новий рівень L_Day09 у новій папці Course/Day09. Виділи три файли FBX у File Explorer і перетягни їх у Course/Day09 разом. Увімкни Nanite для кожного (Static Mesh Editor > Enable Nanite Support > Apply Changes)."}, {"en": "Place SM_Wall_2m at Location 0, 0, 0 and SM_Wall_Window at X 200: a 4 m front wall.", "uk": "Постав SM_Wall_2m на Location 0, 0, 0, а SM_Wall_Window — на X 200: передня стіна завдовжки 4 м."}, {"en": "Place another wall at X 400 and set Rotation Z to 90: it now runs along Y. If it runs away from the house, use -90. Its start must touch the end of the front wall.", "uk": "Постав ще одну стіну на X 400 і встанови Rotation Z на 90: тепер вона йде вздовж Y. Якщо вона йде геть від будинку, використай -90. Її початок має торкатися кінця передньої стіни."}, {"en": "Place SM_Roof_2m at X 200, Y 0, Z 415 with Rotation Z 90 (or -90). Look from the front: its lower edge should rest on top of the side wall line.", "uk": "Постав SM_Roof_2m на X 200, Y 0, Z 415 з Rotation Z 90 (або -90). Подивися спереду: її нижній край має лежати на верху лінії бічної стіни."}, {"en": "Fly round at 2 m from every join, and write in kit_rules.md one thing that worked and one thing to fix this afternoon.", "uk": "Облети все на відстані 2 м від кожного стику й запиши в kit_rules.md одну річ, що вдалася, і одну, яку треба виправити після обіду."}], "play": {"en": "Snap race: the tutor times me building a 4 x 4 m ring of plain walls on the grid; under 5 minutes with no gaps wins.", "uk": "Перегони з прив'язкою: тьютор засікає час, поки я будую на сітці кільце простих стін 4 x 4 м; менше 5 хвилин без щілин — перемога."}, "video": {"url": "https://www.youtube.com/watch?v=syBNq0wumkQ", "title": "The Ultimate Guide to SNAPPING in Unreal Engine! (Place Objects Quickly and Accurately)", "channel": "The RealTime Essentials", "length": "11:41", "search": "unreal engine 5 grid snapping"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Testing the building kit in Unreal (Day 9, lesson 4 of 4).\nToday's build: Your building kit: walls, openings, a corner post and roof pieces for small harbour houses.\nEarlier today I already did: lesson 1 (A wall kit: storey height, thickness and the wall rule); lesson 2 (Openings: the Boolean modifier for windows and doors); lesson 3 (Roof pieces: pitch, panel, ridge and gable). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Import several kit pieces together into a day folder and switch on Nanite for each.\n2. Snap walls with a 100 cm grid and 90-degree turns, and fix a piece that lands on the wrong side after turning.\n3. Type exact heights for parts above the ground (gables at Z 300, roof at Z 415).\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Snap race: the tutor times me building a 4 x 4 m ring of plain walls on the grid; under 5 minutes with no gaps wins.\n4. Do-along on today's build (SM_Wall_2m, SM_Wall_Window and SM_Roof_2m (in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - In Blender, export SM_Wall_2m, SM_Wall_Window and SM_Roof_2m as FBX, one at a time, each with its UCX boxes and each at the world origin.\n   - In IslandCourse, make a new level L_Day09 in a new folder Course/Day09. Select the three FBX files in File Explorer and drag them into Course/Day09 together. Switch on Nanite for each (Static Mesh Editor > Enable Nanite Support > Apply Changes).\n   - Place SM_Wall_2m at Location 0, 0, 0 and SM_Wall_Window at X 200: a 4 m front wall.\n   - Place another wall at X 400 and set Rotation Z to 90: it now runs along Y. If it runs away from the house, use -90. Its start must touch the end of the front wall.\n   - Place SM_Roof_2m at X 200, Y 0, Z 415 with Rotation Z 90 (or -90). Look from the front: its lower edge should rest on top of the side wall line.\n   - Fly round at 2 m from every join, and write in kit_rules.md one thing that worked and one thing to fix this afternoon.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"The Ultimate Guide to SNAPPING in Unreal Engine! (Place Objects Quickly and Accurately)\" by The RealTime Essentials: https://www.youtube.com/watch?v=syBNq0wumkQ\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "kit_rules.md (updated with the wall and roof rules and the piece check)", "uk": "kit_rules.md (оновлений: правила стін і даху та перевірка деталей)"}, {"en": "buildkit_day9.blend (your working file)", "uk": "buildkit_day9.blend (твій робочий файл)"}, {"en": "SM_Wall_2m, SM_Wall_Window, SM_Wall_Door, SM_Wall_Corner, SM_Roof_2m, SM_Roof_Ridge_2m and SM_Roof_Gable_4m as FBX (with their UCX boxes)", "uk": "SM_Wall_2m, SM_Wall_Window, SM_Wall_Door, SM_Wall_Corner, SM_Roof_2m, SM_Roof_Ridge_2m і SM_Roof_Gable_4m у FBX (з їхніми блоками UCX)"}, {"en": "house_front.png and house_side.png (the test house in Unreal)", "uk": "house_front.png і house_side.png (тестовий будинок в Unreal)"}, {"en": "before_after_day9.png", "uk": "before_after_day9.png"}, {"en": "clip_day9.mp4 (60 seconds, walking through the door)", "uk": "clip_day9.mp4 (60 секунд: прохід крізь двері)"}, {"en": "summary.md", "uk": "summary.md"}], "goal": {"en": "By the end of today you have a building kit on your grid (SM_Wall_2m, SM_Wall_Window, SM_Wall_Door, SM_Wall_Corner and three roof pieces) and a 4 x 6 m house shell snapped together from it in Unreal.", "uk": "До кінця дня в тебе є набір для будівель на твоїй сітці (SM_Wall_2m, SM_Wall_Window, SM_Wall_Door, SM_Wall_Corner і три деталі даху) і коробка будинку 4 x 6 м, з'єднана з цих деталей в Unreal."}, "uses": [{"en": "Day 8: the naming pattern, Nanite decisions and vertex snapping to a kit", "uk": "День 8: шаблон назв, рішення щодо Nanite і прив'язка до вершин у наборі"}, {"en": "Day 7: the grid, the pivot rule, exporting from the world origin and snapping in Unreal", "uk": "День 7: сітка, правило півота, експорт із центру світу і з'єднання в Unreal"}, {"en": "Day 4: UCX boxes and the FBX export", "uk": "День 4: блоки UCX і експорт FBX"}, {"en": "Day 3: Solidify and Bevel", "uk": "День 3: Solidify і Bevel"}, {"en": "Day 2: inset", "uk": "День 2: inset"}], "quiz": [{"q": {"en": "For a 4 m wide house with a 30-degree roof, about how high is the ridge above the wall tops?", "uk": "Наскільки приблизно гребінь вищий за верх стін у будинку завширшки 4 м із дахом під 30 градусів?"}, "options": [{"en": "0.5 m", "uk": "0.5 м"}, {"en": "1.15 m", "uk": "1.15 м"}, {"en": "2 m", "uk": "2 м"}, {"en": "4 m", "uk": "4 м"}], "answer": 1, "explain": {"en": "Half the width (2 m) times about 0.58 (the slope of 30 degrees) is about 1.15 m.", "uk": "Половина ширини (2 м), помножена приблизно на 0.58 (схил під 30 градусів), — це близько 1.15 м."}}, {"q": {"en": "Your door wall's collision blocks the doorway when you walk the mannequin into it. What do you fix?", "uk": "Коли ти ведеш манекен у двері, колізія стіни з дверима перекриває проріз. Що виправити?"}, "options": [{"en": "Use three UCX boxes around the opening instead of one box over the whole wall", "uk": "Використати три блоки UCX навколо прорізу замість одного блока на всю стіну"}, {"en": "Set Fallback Collision Type to Box when you import", "uk": "Під час імпорту встановити Fallback Collision Type на Box"}, {"en": "Remove the door frame", "uk": "Прибрати дверну коробку"}], "answer": 0, "explain": {"en": "Collision follows your UCX boxes. Boxes left, right and above the opening keep the doorway walkable.", "uk": "Колізія йде за твоїми блоками UCX. Блоки ліворуч, праворуч і над прорізом лишають дверний проріз прохідним."}}, {"q": {"en": "What does the Boolean modifier with Difference do?", "uk": "Що робить модифікатор Boolean у режимі Difference?"}, "options": [{"en": "It joins two objects into one", "uk": "Об'єднує два об'єкти в один"}, {"en": "It mirrors an object", "uk": "Віддзеркалює об'єкт"}, {"en": "It cuts the cutter's shape out of the object", "uk": "Вирізає форму різака з об'єкта"}], "answer": 2, "explain": {"en": "Difference subtracts the cutter. Apply it, then delete the cutter.", "uk": "Difference віднімає різак. Застосуй модифікатор, а тоді видали різак."}}, {"q": {"en": "Two walls meet at a corner and leave a small notch on the outside. What does your kit use to hide it?", "uk": "Дві стіни сходяться в куті й лишають ззовні маленьку виїмку. Чим твій набір її ховає?"}, "options": [{"en": "A thicker wall", "uk": "Товстішою стіною"}, {"en": "A corner post 2 cm wider than the wall on each side", "uk": "Кутовою стійкою, на 2 см ширшою за стіну з кожного боку"}, {"en": "A decal", "uk": "Декаллю"}], "answer": 1, "explain": {"en": "SM_Wall_Corner covers the join and its faces stand slightly proud, so nothing flickers.", "uk": "SM_Wall_Corner закриває стик, а її грані трохи виступають, тож нічого не мерехтить."}}, {"q": {"en": "You turn a wall 180 degrees in Unreal and it now sits outside the house. Why?", "uk": "Ти повертаєш стіну на 180 градусів в Unreal, і тепер вона стоїть поза будинком. Чому?"}, "options": [{"en": "Its pivot is at its start, so after the turn it runs the other way from the same point", "uk": "Її півот на її початку, тож після повороту вона йде від тієї самої точки в інший бік"}, {"en": "Nanite moved it", "uk": "Її перемістив Nanite"}, {"en": "The wall is too thick", "uk": "Стіна надто товста"}], "answer": 0, "explain": {"en": "A piece turns around its pivot. After 180 degrees it runs in the opposite direction, so move it 200 cm or snap it to the right corner.", "uk": "Деталь обертається навколо свого півота. Після повороту на 180 градусів вона йде в протилежному напрямку, тож посунь її на 200 см або прив'яжи до правильного кута."}}], "weekInfo": {"week": 2, "title": {"en": "Modular kits", "uk": "Модульні набори"}, "goal": {"en": "By Friday you have your own harbour and building kit on a metric grid, and L_KitTest: a quay, a pier and a harbour house built from it in Unreal, with the house saved as a Level Instance.", "uk": "До п'ятниці в тебе є власний набір для гавані й будівель на метричній сітці та L_KitTest: причал, пірс і портовий будинок, зібрані з цього набору в Unreal, а будинок збережено як Level Instance."}, "skills": [{"en": "Modular kit design on a metric grid with consistent pivots", "uk": "Дизайн модульного набору на метричній сітці з узгодженими півотами"}, {"en": "Unreal Engine 5 level assembly: import pipeline, exact placement and snapping", "uk": "Збирання рівня в Unreal Engine 5: пайплайн імпорту, точне розміщення та прив'язка (snapping)"}, {"en": "Nanite versus LOD decisions for real-time performance", "uk": "Вибір між Nanite і LOD заради продуктивності в реальному часі"}, {"en": "Level Instances for reusable building sets", "uk": "Level Instances для наборів будівель, які можна використовувати багато разів"}, {"en": "Content Browser organisation and industry naming conventions (SM_, M_, MI_, T_, L_)", "uk": "Організація Content Browser і галузеві правила назв (SM_, M_, MI_, T_, L_)"}]}, "morning": {"sofar": {"en": "Your harbour kit has six pieces, from quay edge to steps, each with a written Nanite or LOD decision.", "uk": "У твоєму портовому наборі вже шість частин, від краю причалу до сходів, і для кожної записано рішення: Nanite чи LOD."}, "today": {"en": "You make a small building kit (walls, a window, a door, a corner post and roof pieces) and snap a 4 x 6 m house shell together in Unreal.", "uk": "Сьогодні ти робиш невеликий будівельний набір (стіни, вікно, двері, кутова стійка й частини даху) і складаєш в Unreal коробку будинку 4 x 6 м."}, "cheer": {"en": "A house is walls and a roof on a grid, and you already know how to make both; give the roof angle the time it needs.", "uk": "Будинок — це стіни й дах на сітці, і ти вже вмієш робити і те, й інше; дай куту даху стільки часу, скільки він потребує."}, "quote": {"text": {"en": "Form ever follows function, and this is the law.", "uk": "Форма завжди слідує за функцією, і це закон."}, "author": {"en": "Louis Sullivan", "uk": "Луїс Салліван"}, "source": "https://en.wikiquote.org/wiki/Louis_Sullivan"}}, "hasAssets": false, "workPath": "Work\\Assignment\\Day-09-building-kit", "mapHref": "../../COURSE.html", "prevHref": "../Day-08-kit-railing-steps-corner/START-HERE.html", "nextHref": "../Day-10-boss-kit-test/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Blender and Unreal Engine 5.8. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me and don't write code. Keep me moving and make it feel like a game.\n\nToday I build on my own: SM_Wall_Door, SM_Wall_Corner, SM_Roof_Ridge_2m and SM_Roof_Gable_4m, then the test house, on your own.\nIt's part of: Your building kit: walls, openings, a corner post and roof pieces for small harbour houses (Your island's waterfront (district 1) and later district 2: harbour offices, shops and houses. Today a test house in Course/Day09.).\n\nSpec:\n- Wall rule (in kit_rules.md): walls 2 m long, 3 m tall and 0.2 m thick, standing on a grid line through their middle; the outside faces -Y; pivot at the bottom of the wall's centre line at its start (X = 0, Y = 0, Z = 0).\n- SM_Wall_2m (plain); SM_Wall_Window (a 1.0 x 1.2 m window with its sill at 0.9 m, a timber frame and a glass panel); SM_Wall_Door (a 1.0 x 2.1 m door with a frame and a door leaf standing open).\n- SM_Wall_Corner: a 0.24 x 0.24 x 3 m corner post (a pilaster) centred on the grid point, covering the join where two walls meet.\n- Roof for a 4 m wide house with a 30-degree pitch (slope): SM_Roof_2m (a panel 2 m along the ridge, its pivot on the ridge line), SM_Roof_Ridge_2m (the ridge cap) and SM_Roof_Gable_4m (the triangle of wall under each end of the roof).\n- Openings cut with the Boolean modifier; UCX boxes leave the window and door open; plain materials M_Plaster, M_Timber, M_Glass (dark, Roughness 0.05) and M_RoofTile.\n- Every piece exported from the world origin, under 2,000 triangles; Nanite on for every piece in Unreal.\n- In Unreal (Course/Day09, level L_Day09): a 4 x 6 m house shell with a door, at least three windows, corner posts, two gables, the roof and the ridge, with no gaps.\n\nMy checklist:\n1. SM_Wall_Door: copy SM_Wall_2m in place (Shift+D, right-click), rename it, and cut the door with a Boolean (Difference) using a cutter 1.0 x 0.5 x 2.2 m at X 1, Z 1.0, so the opening runs from the floor to 2.1 m. Apply it and delete the cutter. Check: a clean doorway, open at the bottom, 1 m wide and 2.1 m tall. (from lesson 2)\n2. Door frame and leaf: two jambs (the side pieces of the frame: 0.06 x 0.12 x 2.1 m at X 0.53 and X 1.47, Z 1.05), a head (the top piece: 0.88 x 0.12 x 0.06 m at X 1, Z 2.07) and a door leaf standing open at a right angle on the inside (+Y) side, so the mannequin can walk through (0.05 x 0.88 x 2.04 m at X 0.585, Y 0.54, Z 1.02). Give them M_Timber and join them into the wall. Check: from the front, the frame fills the opening's edges, and from above the open door stands at a right angle to the wall beside the left jamb. (from day 1, lesson 3)\n3. Collision for the openings: three UCX boxes on SM_Wall_Door (left, right, above the door) and four on SM_Wall_Window (left, right, below the sill, above the window). Check: in X-ray, the window and door openings have no box in them. (from day 4, lesson 3)\n4. SM_Wall_Corner: a cube 0.24 x 0.24 x 3 m with the scale applied, moved up 1.5 m; origin at its bottom centre on the world origin; M_Plaster (or a stone colour); one UCX box. Check: from above, the post is centred on the world origin and is 2 cm wider than the wall on each side. (from lesson 1)\n5. SM_Roof_Gable_4m: finish the lesson's triangle; put its origin on the world origin (the bottom of its centre line at the start), give it M_Plaster and one UCX box (a copy of the gable itself is a fine convex shape). Check: Location 0, 0, 0, and the apex is 1.15 m above the bottom at X 2. (from lesson 3)\n6. SM_Roof_Ridge_2m: a cylinder (Vertices 12, Radius 0.12 m, Depth 2 m), turned with R Y 90 so it lies along X, then G X 1 and G Z 0.2; apply the rotation, set the origin to the world origin, give it M_RoofTile and one UCX box. Check: the ridge cap's pivot is at its left end, 0.2 m below its centre. (from lesson 3)\n7. Check every building piece: Location 0, 0, 0, the origin on its pivot, under 2,000 triangles, the name following the pattern. Check: seven pieces, all yes, written in kit_rules.md. (from day 8, lesson 1)\n8. Export SM_Wall_Door, SM_Wall_Corner, SM_Roof_Gable_4m and SM_Roof_Ridge_2m as FBX (one at a time, each with its UCX boxes). Check: seven building-kit FBX files in your Work folders (three from lesson 4, four now). (from day 4, lesson 4)\n9. Import the four into Course/Day09 and switch on Nanite for each. Check: all seven building pieces show in colour in Nanite Visualization > Overview. (from day 8, lesson 3)\n10. Walls of the 4 x 6 m house: front (Y 0) SM_Wall_Door at X 0 and SM_Wall_Window at X 200; two sides along Y at X 0 and X 400, three pieces each (SM_Wall_2m, SM_Wall_Window, SM_Wall_2m), turned with Rotation Z 90 or -90 so they close the box; the back (Y 600) two SM_Wall_2m turned 180, at X 200 and X 400 (a turned wall runs the other way from its pivot). Put SM_Wall_Corner at the four corner grid points. Check: a closed box of walls with a post at each corner. (from lesson 4)\n11. Roof: SM_Roof_Gable_4m on the front and back walls at Z 300 (turn the back one 180 and place it at X 400, because it now runs the other way); three SM_Roof_2m on each side at X 200, Z 415, turned with Rotation Z 90 or -90 so each slopes down outwards, at Y 0, 200 and 400 (if a panel runs the wrong way along Y, use 200, 400 and 600); three SM_Roof_Ridge_2m along the top at X 200, Z 415, turned with Rotation Z 90 so they run along the ridge. Check: from the side, the roof slopes meet at the ridge and rest on the wall tops. (from lesson 4)\n12. Fly round the house at 2 m from every join, then take house_front.png and house_side.png. Check: no gaps, no light through corners, no flickering surfaces. (from day 7, lesson 4)\n13. Captures: before_after_day9.png (the pieces in a row in Blender, and the finished house in Unreal) and a 60-second clip: press Play and walk the mannequin through the door. Save today's clip as clip_day9.mp4. Check: the mannequin fits through the doorway, and both files are in today's Work folder. (from day 0, lesson 1)\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Karina L.\nDay 9: A small building kit: walls, a window, a door and a roof. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

const lk=s=>esc(s).replace(/https?:\/\/[^\s<']*[^\s<.,;:)']/g,m=>'<a href="'+m+'" target="_blank" rel="noopener">'+m+'</a>');
function list(a,tag,cls){return '<'+tag+(cls?' class="'+cls+'"':'')+'>'+(a||[]).map(i=>'<li>'+lk(x(i))+'</li>').join('')+'</'+tag+'>'}
const lab=(t,k)=>'<div class="lab'+(k?' k-'+k:'')+'"><span class="dotc"></span>'+t+'</div>';
const kn=n=>'<span class="kn">'+ic(n)+'</span>';
const slider=p=>'<div class="slider"><i style="width:calc('+p+'% - 6px)"></i><b style="left:clamp(13px,'+p+'%,calc(100% - 13px))"></b></div>';
function quiz(){if(!D.quiz||!D.quiz.length)return '';const a=st.qa||{};let ok=0;const L=u('letters');
 const pips='<div class="pips well" aria-hidden="true">'+D.quiz.map((q,i)=>'<i class="'+(a[i]==null?'':a[i]===q.answer?'r':'w')+'"></i>').join('')+'</div>';
 const qs=D.quiz.map((q,i)=>{const c=a[i];if(c===q.answer)ok++;return '<div class="qz"><p class="qq"><span class="qn">'+(i+1)+'</span><span>'+lk(x(q.q))+'</span></p>'+q.options.map((o,k)=>{let cls='opt',mk='<span></span>';if(c!=null){if(k===q.answer){cls+=' right';mk=ic('check','mk')}else if(k===c){cls+=' wrong';mk=ic('x','mk')}}return '<button class="'+cls+'" id="o'+i+'_'+k+'"'+(c!=null?' disabled':'')+' onclick="pick('+i+','+k+')"><span class="lt">'+(L[k]||k+1)+'</span><span>'+esc(x(o))+'</span>'+mk+'</button>'}).join('')+(c!=null?'<p class="exp '+(c===q.answer?'r':'w')+'" id="e'+i+'" tabindex="-1"><b>'+(c===q.answer?u('right'):u('wrong'))+'</b>'+lk(x(q.explain))+'</p>':'')+'</div>'}).join('');
 return '<section class="card glass quiz">'+lab(u('quiz'),'gold')+'<p class="muted" style="margin:-6px 0 14px">'+u('quizSub')+'</p>'+pips+qs+(qDone()?'<div class="score well" role="status"><span class="eyebrow">'+u('score')+'</span><span class="lcd" aria-label="'+ok+' / '+D.quiz.length+'">'+seg(ok+'/'+D.quiz.length)+'</span><div class="row"><button class="btn ghost" id="retry" onclick="retry()">'+u('retry')+'</button></div></div>':'')+'</section>'}
function vid(v){if(!v)return '';const link=v.url?'<a href="'+esc(v.url)+'" target="_blank" rel="noopener">'+esc(x(v.title)||v.url)+'</a>'+(v.channel?' <span class="muted">· '+esc(v.channel)+(v.length?' · '+esc(v.length):'')+'</span>':''):'';const s=v.search?'<a href="https://www.youtube.com/results?search_query='+encodeURIComponent(v.search)+'" target="_blank" rel="noopener">'+u('noVid')+': '+esc(v.search)+'</a>':'';const alt=v.alt&&v.alt.url?'<br><span class="eyebrow">UA</span> <a href="'+esc(v.alt.url)+'" target="_blank" rel="noopener">'+esc(v.alt.title||v.alt.url)+'</a>'+(v.alt.channel?' <span class="muted">· '+esc(v.alt.channel)+'</span>':''):'';return '<div class="vid well">'+kn('play')+'<div><b>'+u('more')+'?</b><br>'+(link||s)+alt+(link&&s?'<br><span class="muted" style="font-size:14px">'+s+'</span>':'')+'</div></div>'}
function morning(){const m=D.morning;if(!m)return '';const q=m.quote||{};
 let shelf='';if(D.day>0){shelf='<div class="shelf" aria-hidden="true">';let g='';for(let d=0;d<D.day;d++){let p=0;try{p=(JSON.parse(localStorage.getItem('devteam:'+D.learner+':'+d))||{}).pct||0}catch(e){}g+='<i class="'+(p>=1?'d':'')+(d>0&&d%5===0?' bs':'')+'"></i>';if(d%5===0||d===D.day-1){shelf+='<span class="wkg">'+g+'</span>';g=''}}shelf+='</div>'}
 const qt=lang==='uk'&&q.original?q.original:x(q.text);
 return '<section class="card glass morning"><div class="mgrid">'+(m.sofar?'<div>'+lab(u('sofar'),'gold')+shelf+'<p class="mtxt">'+lk(x(m.sofar))+'</p></div>':'')+(m.today?'<div>'+lab(u('todayL'))+'<p class="mtxt">'+lk(x(m.today))+'</p></div>':'')+'</div>'+(m.cheer?'<p class="cheer">'+esc(x(m.cheer))+'</p>':'')+(qt?'<figure class="quote well">'+kn('quote')+'<blockquote>'+esc(qt)+'</blockquote>'+(q.author?'<figcaption>'+esc(x(q.author))+'</figcaption>':'')+'</figure>':'')+'</section>'}
function setLang(l){lang=l;try{localStorage.setItem('devteam:lang',lang)}catch(e){};render()}
function toggleLang(){setLang(lang==='uk'?'en':'uk')}
/* keep open sections and keyboard focus across re-renders */
const openD=new Set();
function tg(e){if(e.open)openD.add(e.id);else openD.delete(e.id)}
const op=id=>openD.has(id)?' open':'';
function render(){const ae=document.activeElement,fid=ae&&(ae.id||(ae.getAttribute('data-th')?'th-'+ae.getAttribute('data-th'):ae.getAttribute('lang')&&ae.closest('.seg')?'lg-'+ae.getAttribute('lang'):''));
 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);
 const b=D.build,P=Math.round(prog()*100);
 document.getElementById('top').innerHTML='<div class="topin glass"><a class="maplink" href="'+esc(D.mapHref)+'">'+kn('map')+u('map')+'</a><div class="crumb"><b>'+esc(x(D.learnerName))+'</b><span>'+u('week')+' '+D.week+'</span><span>'+u('day')+' '+D.day+' '+u('of')+' '+D.total+'</span></div>'+controls(lang,'setLang')+'</div><div class="tline"><i style="width:'+P+'%"></i></div>';
 const state=w=>w<D.week?'b':w===D.week?'n':'p';
 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 if(D.weekInfo){const w=D.weekInfo;h+='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}
 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p><div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+list(D.handin,'ul','ticks')+'<p class="path">'+ic('folder')+'<span>'+u('shipTo')+' <code>'+esc(D.workPath)+'</code></span></p>'+(D.lessons.length?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<p class="muted">'+u('report')+'</p><div class="row"><button class="btn s" onclick="cp(D.reportPrompt)">'+ic('copy')+u('copyR')+'</button></div></section>';
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();
</script>

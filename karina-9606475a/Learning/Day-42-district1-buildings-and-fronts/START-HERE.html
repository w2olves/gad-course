<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 42</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

plot_plan_d1.png placed within 0.5 m of its footprint (checked with a top-view overlay), turned to the plan's angle, on DL_District1.", "uk": "Кожна будівля з plot_plan_d1.png стоїть на DL_District1 не далі ніж за 0,5 м від свого обрису і повернута під кутом із плану. Це перевірено накладанням виду Top на план."}, {"en": "Shelves: the ground under each footprint flattened, plus about 2 m round it. The uphill side gets a soft slope or steps, never a vertical wall of landscape. A shelf is a flat step cut into a slope.", "uk": "Уступи: земля під кожним обрисом вирівняна, плюс приблизно 2 м навколо. Уступ — це рівна сходинка, вирізана в схилі. З боку підйому — м'який схил або сходи, ніколи не вертикальна стіна ландшафту."}, {"en": "Buildings from two or three sources: copies of LI_HarbourHouse_A, pack buildings from your Day 24 picks, and kit walls for any one-of-a-kind building. Every pack goes in credits.md (in GAD on your PC).", "uk": "Будівлі з двох-трьох джерел: копії LI_HarbourHouse_A, будівлі з паків, вибраних у День 24, і стіни з набору для кожної особливої будівлі. Кожен пак записано в credits.md (у папці GAD на ПК)."}, {"en": "One house type saved as a Level Instance, LI_HarbourHouse_A, placed several times. A Level Instance is a group of actors saved as one piece: edit it once and every copy changes. Variety comes from pack buildings, turns and the shop fronts outside it. Gold (optional): a second type, LI_HarbourHouse_B, with its own wall colour.", "uk": "Один тип будинку збережено як Level Instance — LI_HarbourHouse_A, і він стоїть у районі кілька разів. Level Instance — це група акторів, збережена як одна деталь: зміни її раз, і зміниться кожна копія. Різноманіття дають будівлі з паків, повороти й фасади крамниць поза Level Instance. Золото (за бажанням): другий тип, LI_HarbourHouse_B, зі своїм кольором стін."}, {"en": "SM_ShopFront_A on the ground floor of every shop the plan names, facing the street, its back 1 cm out from the wall: no gaps, no flicker. Each front gets its own colour on its Plaster slot (a child of MI_Plaster, such as MI_ShopFront_Blue). Fronts stay outside the Level Instances, so each can differ.", "uk": "SM_ShopFront_A — на першому поверсі кожної крамниці з плану, лицем до вулиці. Його спинка відступає від стіни на 1 см: ні щілин, ні мерехтіння. Кожен фасад має свій колір у слоті Plaster (дочірній інстанс MI_Plaster, наприклад MI_ShopFront_Blue). Фасади лишаються поза Level Instance, тож кожен може бути іншим."}, {"en": "Paving: 2 x 2 m squares (a Plane at Scale 2, 2, 1 with MI_Paving_2m, Tiling 1), laid edge to edge, so every door meets a path. Your Day 8 SM_Steps where a door stands high.", "uk": "Мощення: квадрати 2 × 2 м (Plane зі Scale 2, 2, 1 і MI_Paving_2m, Tiling 1), покладені край до краю, щоб кожні двері виходили на доріжку. Де двері стоять високо — твої SM_Steps з Дня 8."}, {"en": "A check from C1 to C5 and along the fronts at 30 m: the street reads as one place, and the shops stand out.", "uk": "Перевірка з C1–C5 і вздовж фасадів із 30 м: вулиця читається як одне місце, а крамниці вирізняються."}], "piece1": "the house type LI_HarbourHouse_A, made with the tutor", "piece2": {"en": "Every other building and front, on your own", "uk": "Усі інші будівлі й фасади крамниць — самостійно"}, "steps": [{"text": {"en": "Check: the files from today's lessons are in the day work folder (placement_d1.md; in Unreal, LI_HarbourHouse_A, MI_Paving_2m and MI_ShopFront_Blue). Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it. Then finish placement_d1.md, using the change lines in sample.md (Day 41): each building's x, y, angle and type. Check: one line per building on the plan.", "uk": "Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: placement_d1.md, а в Unreal — LI_HarbourHouse_A, MI_Paving_2m і MI_ShopFront_Blue. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Потім доповни placement_d1.md з урахуванням рядків «змінити» в sample.md (День 41): для кожної будівлі x, y, кут і тип. Перевірка: по рядку на кожну будівлю з плану."}, "lesson": 1}, {"text": {"en": "Screenshot the empty district from C4 as c4_before_day42.png. Cut a shelf for each footprint: Flatten the footprint plus 2 m, then Smooth the edges. Check: from 10 m no shelf leaves a vertical wall of landscape.", "uk": "Зроби скриншот порожнього району з C4 і збережи як c4_before_day42.png. Виріж уступ під кожен обрис: Flatten по обрису плюс 2 м, потім Smooth по краях. Перевірка: з 10 м жоден уступ не лишає вертикальної стіни ландшафту."}, "lesson": 2}, {"text": {"en": "Place every LI_HarbourHouse_A copy at its plan coordinates (island metres x 100), turned to the plan and dropped with End. Check: all four corners touch the shelf.", "uk": "Постав кожну копію LI_HarbourHouse_A на її координати з плану (острівні метри × 100), поверни як на плані й опусти клавішею End. Перевірка: усі чотири кути торкаються уступу."}, "lesson": 1}, {"text": {"en": "Pack buildings at their footprints where your plan names one, and kit walls for any one-of-a-kind building. Add each pack to credits.md in GAD on your PC. Check: credits.md has a line for every pack you used.", "uk": "Будівлі з паків постав на їхні обриси там, де їх називає план, а для кожної особливої будівлі збери стіни з набору. Кожен пак допиши в credits.md у папці GAD на ПК. Перевірка: у credits.md є рядок для кожного використаного пака."}, "lesson": 3}, {"text": {"en": "Paving: 2 x 2 m squares with MI_Paving_2m from every door to the street, edge to edge on grid snap 200, 2 cm above the ground. Check: every door meets paving, and the pattern is not stretched.", "uk": "Мощення: квадрати 2 × 2 м з MI_Paving_2m від кожних дверей до вулиці, край до краю, з прив'язкою до сітки 200 і на 2 см над землею. Перевірка: кожні двері виходять на мощення, а візерунок не розтягнутий."}, "lesson": 2}, {"text": {"en": "Where a door stands above the paving, add your Day 8 SM_Steps. Check: each step meets the ground and the door, and no step is taller than 20 cm.", "uk": "Де двері стоять вище за мощення, додай свої SM_Steps з Дня 8. Перевірка: кожні сходи сходяться і з землею, і з дверима, а жодна сходинка не вища за 20 см."}, "lesson": 2}, {"text": {"en": "Shop fronts: SM_ShopFront_A on the ground floor of every shop, facing the street, its back touching the wall and then 1 cm out. Give each its own Plaster colour instance. Check: from 2 m there is no gap and no flicker at any edge.", "uk": "Фасади крамниць: SM_ShopFront_A на першому поверсі кожної крамниці, лицем до вулиці. Спинка торкається стіни, потім відсунь її на 1 см. Дай кожному фасаду свій інстанс кольору Plaster. Перевірка: з 2 м на жодному краї немає ні щілини, ні мерехтіння."}, "lesson": 4}, {"text": {"en": "Read the fronts at 2, 10 and 30 m, and strengthen one thing that doesn't read, such as a front's colour against its wall. Check: at 30 m you can still tell which ground floors are shops.", "uk": "Оглянь фасади з 2, 10 і 30 м і підсиль одну річ, яка не читається, наприклад колір фасаду на тлі стіни. Перевірка: з 30 м ще видно, які перші поверхи — крамниці."}, "lesson": 4}, {"text": {"en": "Overlay: lay a Top view HighResShot over plot_plan_d1.png in Krita and fix anything more than 0.5 m off. Check: every footprint sits on its box.", "uk": "Накладання: у Krita поклади знімок HighResShot з виду Top на plot_plan_d1.png і виправ усе, що зміщене більш ніж на 0,5 м. Перевірка: кожен обрис лежить на своєму прямокутнику."}, "lesson": 1}, {"text": {"en": "Hide DL_District1 in the Data Layer Outliner to find today's work on the wrong layer, then show it again. Check: with the layer hidden, none of today's placed actors show. Shelves belong to the landscape and stay.", "uk": "Сховай DL_District1 у Data Layer Outliner, щоб знайти сьогоднішню роботу на неправильному шарі, потім покажи шар знову. Перевірка: коли шар сховано, жодного актора, поставленого сьогодні, не видно. Уступи — частина ландшафту, вони лишаються."}, "lesson": 1}, {"text": {"en": "Gold (optional): build LI_HarbourHouse_B from the same kit, 4 x 8 m or two storeys. Its walls get a child of MI_Plaster with another Tint (a child of MI_Plaster_WallDoor on door walls). Check: A and B side by side look like neighbours, not twins.", "uk": "Золото (за бажанням): збери LI_HarbourHouse_B з того самого набору — 4 × 8 м або на два поверхи. Його стіни отримують дочірній інстанс MI_Plaster з іншим Tint (на стінах із дверима — дочірній від MI_Plaster_WallDoor). Перевірка: A і B поруч схожі на сусідів, а не на близнюків."}, "lesson": 3}, {"text": {"en": "Proof: press Ctrl+S (the star on the L_Island tab disappears). Shoot C4 again and put it beside c4_before_day42.png as before_after_day42.png. Check: before_after_day42.png opens and shows C4 before and after, side by side.", "uk": "Доказ: натисни Ctrl+S (зірочка на вкладці L_Island зникає). Зніми C4 знову і склади з c4_before_day42.png пару «до і після» before_after_day42.png. Перевірка: before_after_day42.png відкривається, на ньому C4 до і після поруч."}, "lesson": 4}, {"text": {"en": "Report and hand-in: click Copy the day report at the bottom of the page, paste it into a new chat and answer. Open summary.md in Notepad, press Ctrl+End, paste the answer and press Ctrl+S. Then drag the files on the Hand in list into your hand-in folder. Check: every name shows in the folder, each with a size.", "uk": "Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: кожна назва зі списку є в папці, у кожної є розмір."}, "lesson": "D0.1"}], "assets": ["island12/free-packs-list.md", "island12/credits-template.md"]}, "lessons": [{"title": {"en": "Placing a street by numbers", "uk": "Розміщуємо вулицю за числами"}, "minutes": 40, "goals": [{"en": "Make a placement list from the plan: position, angle and type for every building.", "uk": "Складати за планом список розміщення: місце, кут і тип для кожної будівлі."}, {"en": "Place each building with typed numbers (island metres x 100). Check it three ways: the Details numbers, a 2 m look at each corner, and a top-view overlay.", "uk": "Ставити кожну будівлю за введеними числами (острівні метри × 100). Перевіряти трьома способами: числа в Details, огляд кожного кута з 2 м і накладання виду Top на план."}, {"en": "Keep every new actor on DL_District1.", "uk": "Тримати кожного нового актора на DL_District1."}], "doalong": [{"en": "Copy every building on plot_plan_d1.png into placement_d1.md: name, x, y, angle, type. You should see one line per building.", "uk": "Перепиши кожну будівлю з plot_plan_d1.png у placement_d1.md: назва, x, y, кут, тип. Має вийти по одному рядку на будівлю."}, {"en": "Check DL_District1 is still the current layer in the Data Layer Outliner (Window > World Partition > Data Layer Outliner). You should see it marked as current.", "uk": "Перевір, чи DL_District1 досі поточний шар у Data Layer Outliner (Window > World Partition > Data Layer Outliner). Шар позначено як поточний."}, {"en": "Select a building and type its island X and Y x 100 and its Rotation Z in Details > Transform. You should see it move onto its footprint.", "uk": "Виділи будівлю і введи в Details > Transform її острівні X і Y × 100 та Rotation Z. Будівля стає на свій обрис."}, {"en": "Press End, then fly to each corner and look from 2 m. You should see every corner touching the ground.", "uk": "Натисни End, потім підлети до кожного кута й подивись із 2 м. Кожен кут торкається землі."}, {"en": "Switch the viewport to Top (viewport menu Perspective > Top) and Unlit (the Lit menu > Unlit: flat colours, no shadows). Run HighResShot 1920x1080 in the console. You should see a flat, map-like picture in IslandCourse/Saved/Screenshots/WindowsEditor.", "uk": "Перемкни в'юпорт на вид Top (меню в'юпорта Perspective > Top) і на Unlit (меню Lit > Unlit: пласкі кольори без тіней). Запусти в консолі HighResShot 1920x1080. У IslandCourse/Saved/Screenshots/WindowsEditor з'являється пласка картинка, схожа на мапу."}, {"en": "In Krita, put the shot on a layer over plot_plan_d1.png at 50 % opacity. Scale it until the four Day 41 corner markers sit on the sample corners. You should see each footprint sitting on its box.", "uk": "У Krita поклади знімок окремим шаром над plot_plan_d1.png з непрозорістю 50 %. Масштабуй його, поки чотири кутові маркери з Дня 41 не стануть на кути пробної ділянки. Має вийти: кожен обрис лежить на своєму прямокутнику."}], "play": {"en": "Overlay duel: I send the tutor my overlay picture. It checks every footprint, and each one more than 0.5 m off is a point to it.", "uk": "Дуель накладань: я надсилаю тьютору свою картинку накладання. Він перевіряє кожен обрис, і кожен, зміщений більш ніж на 0,5 м, — бал йому."}, "video": {"url": "https://www.youtube.com/watch?v=tnaXNCaBQ4M", "title": "06 - Snapping, Pivot Points, and Duplication - Unreal Engine Stage Design Course", "channel": "SuperStage", "length": "7:21", "search": "unreal engine snapping pivot duplicate"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Розміщуємо вулицю за числами (Day 42, lesson 1 of 4). Today's build: Кожна будівля і кожен фасад крамниці району 1, розставлені за plot_plan_d1.png на уступах у землі, з мощенням до кожних дверей.\nWhat I already know: День 41: пробна ділянка, її кутові маркери, DL_District1, п'ять камер і рядки «змінити» в sample.md; День 23: plot_plan_d1.png — обриси будівель в острівних метрах; Дні 9 і 10: SM_Wall_2m, SM_Wall_Window, SM_Wall_Door, SM_Wall_Corner і LI_HarbourHouse, а також деталі даху (SM_Roof_2m, SM_Roof_Gable_4m, SM_Roof_Ridge_2m), якщо дах у тебе є; День 13: SM_ShopFront_A на T_Trim_Harbour. День 15: його інстанс із маскою зношеності MI_Trim_ShopFront_A; День 17: твоя безшовна текстура мощення і MI_Paving; День 24: вибрані тобою паки будівель.\n\nBy the end of this lesson I can:\n1. Складати за планом список розміщення: місце, кут і тип для кожної будівлі.\n2. Ставити кожну будівлю за введеними числами (острівні метри × 100). Перевіряти трьома способами: числа в Details, огляд кожного кута з 2 м і накладання виду Top на план.\n3. Тримати кожного нового актора на DL_District1.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: На твоїй набережній є перевірена пробна ділянка й budget.md, що показує її вартість у мілісекундах. Today: Сьогодні ти ставиш кожну будівлю району 1 на її місце з плану, на уступ, вирізаний у рельєфі, з фасадами крамниць і мощенням до кожних дверей. One encouraging line: Розміщення за числами — рівна, спокійна робота, тож бери по одній будівлі й дивись, як виростає твоя вулиця.); 2 lines on why today matters and where it comes back, in plain words (from this: Будівлі — найбільші форми, які бачить дрон, тож вони задають масштаб району і його силует. Якщо ставити їх за числами з плану, вулиці, провулки й види лишаються там, де вони стоять на плані. Студії будують вулицю з кількох типів будівель і багатьох дрібних відмінностей: тоді одна зміна в типі виправляє кожну копію. It comes back: Завтра (День 43) ці вулиці заповнять твої лавки, урни й човни. У День 46 placement_d1.md тримає план і рівень узгодженими, а в День 48 твій тип будинку допоможе збудувати район 2.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-42-district1-buildings-and-fronts exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (Тип будинку LI_HarbourHouse_A — разом із тьютором). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Перепиши кожну будівлю з plot_plan_d1.png у placement_d1.md: назва, x, y, кут, тип. Має вийти по одному рядку на будівлю.\n   2. Перевір, чи DL_District1 досі поточний шар у Data Layer Outliner (Window > World Partition > Data Layer Outliner). Шар позначено як поточний.\n   3. Виділи будівлю і введи в Details > Transform її острівні X і Y × 100 та Rotation Z. Будівля стає на свій обрис. [screenshot]\n   4. Натисни End, потім підлети до кожного кута й подивись із 2 м. Кожен кут торкається землі.\n   5. Перемкни в'юпорт на вид Top (меню в'юпорта Perspective > Top) і на Unlit (меню Lit > Unlit: пласкі кольори без тіней). Запусти в консолі HighResShot 1920x1080. У IslandCourse/Saved/Screenshots/WindowsEditor з'являється пласка картинка, схожа на мапу.\n   6. У Krita поклади знімок окремим шаром над plot_plan_d1.png з непрозорістю 50 %. Масштабуй його, поки чотири кутові маркери з Дня 41 не стануть на кути пробної ділянки. Має вийти: кожен обрис лежить на своєму прямокутнику. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Дуель накладань: я надсилаю тьютору свою картинку накладання. Він перевіряє кожен обрис, і кожен, зміщений більш ніж на 0,5 м, — бал йому. Otherwise skip it.\n6. Review: ask me these questions from earlier days, one at a time, and correct me kindly: Day 39: why do rocks and ground cover along the shore make an island read as real from the air? | Day 32: what is a landmark for, when a pilot flies over the island?\n7. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n8. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\nIf I want to go deeper, recommend ощенням до кожних дверей.\nWhat I already know: День 41: пробна ділянка, її кутові маркери, DL_District1, п'ять камер і рядки «змінити» в sample.md; День 23: plot_plan_d1.png — обриси будівель в острівних метрах; Дні 9 і 10: SM_Wall_2m, SM_Wall_Window, SM_Wall_Door, SM_Wall_Corner і LI_HarbourHouse, а також деталі даху (SM_Roof_2m, SM_Roof_Gable_4m, SM_Roof_Ridge_2m), якщо дах у тебе є; День 13: SM_ShopFront_A на T_Trim_Harbour. День 15: його інстанс із маскою зношеності MI_Trim_ShopFront_A; День 17: твоя безшовна текстура мощення і MI_Paving; День 24: вибрані тобою паки будівель.\nEarlier today I already did: lesson 1 (Розміщуємо вулицю за числами); lesson 2 (Уступи й мощення: будівлі, що стоять на землі). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Збирати з набору будинок 4 × 6 м на сітці, як у День 10: стіни, вікна, двері, кутові стовпчики й дах.\n2. Зберігати його як Level Instance і повторювати. Змінюєш його один раз — змінюється кожна копія.\n3. Поєднувати джерела: твій набір, будівлі з паків, що пасують, і рядок авторства в credits.md для кожного пака.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: 2 lines on why today matters and where it comes back, in plain words (from this: Будівлі — найбільші форми, які бачить дрон, тож вони задають масштаб району і його силует. Якщо ставити їх за числами з плану, вулиці, провулки й види лишаються там, де вони стоять на плані. Студії будують вулицю з кількох типів будівель і багатьох дрібних відмінностей: тоді одна зміна в типі виправляє кожну копію. It comes back: Завтра (День 43) ці вулиці заповнять твої лавки, урни й човни. У День 46 placement_d1.md тримає план і рівень узгодженими, а в День 48 твій тип будинку допоможе збудувати район 2.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am 0 m (Ctrl+1, Ctrl+2, Ctrl+3). Press 1, 2 or 3 to jump back, and screenshot each. You should see the same front at three distances.", "uk": "Підлети до однієї крамниці й збережи закладки на 2, 10 і 30 м (Ctrl+1, Ctrl+2, Ctrl+3). Натискай 1, 2 або 3, щоб повернутися, і зроби скриншот із кожної. Має вийти той самий фасад із трьох відстаней."}, {"en": "Squint at the 30 m shot and strengthen one thing, such as the front's colour against its wall. You should see the shop stand out from its neighbours.", "uk": "Примруж очі на знімку з 30 м і підсиль одну річ, наприклад колір фасаду на тлі стіни. Крамниця вирізняється серед сусідів."}], "play": {"en": "Three-second test: I describe my 30 m shot in one sentence and the tutor guesses which buildings are shops. If it's right, I score.", "uk": "Тест трьох секунд: я описую свій знімок із 30 м одним реченням, а тьютор вгадує, які будівлі — крамниці. Якщо вгадує, бал мені."}, "video": {"url": "https://www.youtube.com/watch?v=syBNq0wumkQ", "title": "The Ultimate Guide to SNAPPING in Unreal Engine! (Place Objects Quickly and Accurately)", "channel": "The RealTime Essentials", "length": "11:41", "search": "unreal engine 5 snapping local gizmo"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Фасади крамниць, які читаються з дрона (Day 42, lesson 4 of 4). Today's build: Кожна будівля і кожен фасад крамниці району 1, розставлені за plot_plan_d1.png на уступах у землі, з мощенням до кожних дверей.\nWhat I already know: День 41: пробна ділянка, її кутові маркери, DL_District1, п'ять камер і рядки «змінити» в sample.md; День 23: plot_plan_d1.png — обриси будівель в острівних метрах; Дні 9 і 10: SM_Wall_2m, SM_Wall_Window, SM_Wall_Door, SM_Wall_Corner і LI_HarbourHouse, а також деталі даху (SM_Roof_2m, SM_Roof_Gable_4m, SM_Roof_Ridge_2m), якщо дах у тебе є; День 13: SM_ShopFront_A на T_Trim_Harbour. День 15: його інстанс із маскою зношеності MI_Trim_ShopFront_A; День 17: твоя безшовна текстура мощення і MI_Paving; День 24: вибрані тобою паки будівель.\nEarlier today I already did: lesson 1 (Розміщуємо вулицю за числами); lesson 2 (Уступи й мощення: будівлі, що стоять на землі); lesson 3 (Типи будинків із твого набору і Level Instance). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Ставити SM_ShopFront_A до стіни: повертати кроками по 90 градусів, поки фасад не стане лицем до вулиці. Потім пересувати, поки спинка, де його origin (День 13), не торкнеться стіни.\n2. Давати кожній крамниці свій колір: дочірній інстанс MI_Plaster зі своїм Tint у слоті Plaster фасаду. Фасади лишаються поза Level Instance, тож кожна копія може бути іншою.\n3. Перевіряти фасад крамниці з 2, 10 і 30 м: з 30 м він має й далі читатися як крамниця.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: 2 lines on why today matters and where it comes back, in plain words (from this: Будівлі — найбільші форми, які бачить дрон, тож вони задають масштаб району і його силует. Якщо ставити їх за числами з плану, вулиці, провулки й види лишаються там, де вони стоять на плані. Студії будують вулицю з кількох типів будівель і багатьох дрібних відмінностей: тоді одна зміна в типі виправляє кожну копію. It comes back: Завтра (День 43) ці вулиці заповнять твої лавки, урни й човни. У День 46 placement_d1.md тримає план і рівень узгодженими, а в День 48 твій тип будинку допоможе збудувати район 2.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-42-district1-buildings-and-fronts exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (Тип будинку LI_HarbourHouse_A — разом із тьютором). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Перетягни SM_ShopFront_A з Content Browser до стіни першого поверху. Задай йому Rotation Z таке, як у будинку, потім додавай по 90, поки фасад не стане лицем до вулиці. Має вийти: фасад стоїть паралельно стіні й дивиться назовні.\n   2. На виді Top наблизься впритул. Перемкни гізмо переміщення на Local (значок глобуса на панелі в'юпорта) і постав прив'язку до сітки 1. Стрілки переміщення стають рівно з фасадом.\n   3. Тягни стрілку, що дивиться на стіну, поки спинка фасаду не торкнеться стіни. Потім відступи на один крок і натисни End. Surface Snapping тут не вмикай: він може перекинути фасад. Має вийти: щілини немає, і жодна частина фасаду не заходить у стіну. [screenshot]\n   4. У Content Browser клацни правою кнопкою MI_Plaster > Create Material Instance і назви його MI_ShopFront_Blue. Відкрий його, увімкни прапорець Tint і вибери синій зі своєї палітри з Дня 16. У Details > Materials признач його слоту Plaster фасаду. Має вийти один синій фасад, а його обрамлення й кам'яний цоколь не змінилися.\n   5. Підлети до однієї крамниці й збережи закладки на 2, 10 і 30 м (Ctrl+1, Ctrl+2, Ctrl+3). Натискай 1, 2 або 3, щоб повернутися, і зроби скриншот із кожної. Має вийти той самий фасад із трьох відстаней.\n   6. Примруж очі на знімку з 30 м і підсиль одну річ, наприклад колір фасаду на тлі стіни. Крамниця вирізняється серед сусідів. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Тест трьох секунд: я описую свій знімок із 30 м одним реченням, а тьютор вгадує, які будівлі — крамниці. Якщо вгадує, бал мені. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\nIf I want to go deeper, recommend this free video: \"The Ultimate Guide to SNAPPING in Unreal Engine! (Place Objects Quickly and Accurately)\" by The RealTime Essentials: https://www.youtube.com/watch?v=syBNq0wumkQ\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; credits line = рядок авторства; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); File Explorer = Провідник; mesh = меш; grid = сітка (тільки grid, ніколи mesh); vertex / edge / face = вершина / ребро / грань; origin (and kit pivot) = origin — точка, за яку об'єкт ставлять і обертають; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); UV unwrap / UV layout / seam / UV island = розгортка / розкладка / шов / UV-острівець; level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; material instance / child instance = інстанс / дочірній інстанс; material slot / node / pin = слот матеріалу / вузол / вхід; keep-out zone / footprint test / grounding = зона-виняток / тест опори / посадка на ґрунт; kit / kit piece / part of one object = набір / деталь / частина; map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; district / plot / plot plan = район / ділянка / план ділянки; harbour / quay / waterfront / pier = гавань / причал / набережна / пірс; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; shop front / shop window = фасад крамниці / вітрина; wear / worn edges / salt line = зношеність / стерті краї / сольова лінія; vista / blockout / landmark = панорама / блокаут / орієнтир; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ; shot set = серія кадрів.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}], "handin": [{"en": "summary.md", "uk": "summary.md (звіт дня)"}, {"en": "placement_d1.md (→ Day 46)", "uk": "placement_d1.md (→ День 46)"}, {"en": "before_after_day42.png: C4 before and after today's buildings (proof)", "uk": "before_after_day42.png (C4 до і після сьогоднішніх будівель) (доказ)"}], "goal": {"en": "By the end of today every building of district 1 stands on its plan place and shelf, with shop fronts and paving to each door.", "uk": "Наприкінці дня кожна будівля району 1 стоїть на своєму місці з плану і на своєму уступі, з фасадами крамниць і мощенням до кожних дверей."}, "uses": [{"en": "Day 41: the sample, its corner markers, DL_District1, the five cameras, and the change lines in sample.md", "uk": "День 41: пробна ділянка, її кутові маркери, DL_District1, п'ять камер і рядки «змінити» в sample.md"}, {"en": "Day 23: plot_plan_d1.png (the building footprints, in island metres)", "uk": "День 23: plot_plan_d1.png — обриси будівель в острівних метрах"}, {"en": "Days 9 and 10: SM_Wall_2m, SM_Wall_Window, SM_Wall_Door, SM_Wall_Corner and LI_HarbourHouse, plus your roof pieces (SM_Roof_2m, SM_Roof_Gable_4m, SM_Roof_Ridge_2m) if you made the roof", "uk": "Дні 9 і 10: SM_Wall_2m, SM_Wall_Window, SM_Wall_Door, SM_Wall_Corner і LI_HarbourHouse, а також деталі даху (SM_Roof_2m, SM_Roof_Gable_4m, SM_Roof_Ridge_2m), якщо дах у тебе є"}, {"en": "Day 13: SM_ShopFront_A on T_Trim_Harbour; Day 15: its wear-masked instance MI_Trim_ShopFront_A", "uk": "День 13: SM_ShopFront_A на T_Trim_Harbour. День 15: його інстанс із маскою зношеності MI_Trim_ShopFront_A"}, {"en": "Day 17: your seamless paving texture and MI_Paving", "uk": "День 17: твоя безшовна текстура мощення і MI_Paving"}, {"en": "Day 24: the building packs you picked", "uk": "День 24: вибрані тобою паки будівель"}], "quiz": [{"q": {"en": "Your shop front flickers where it meets the wall when the camera moves. What is the likely cause and fix?", "uk": "Коли рухається камера, фасад крамниці мерехтить там, де сходиться зі стіною. Яка ймовірна причина і як це виправити?"}, "options": [{"en": "The texture is too small; import a bigger one", "uk": "Текстура замала: імпортуй більшу"}, {"en": "Two surfaces sit in the same place; move the front 1 cm out", "uk": "Дві поверхні в одному місці: відсунь фасад на 1 см"}, {"en": "Lumen is off; turn it on", "uk": "Lumen вимкнено: увімкни його"}, {"en": "The front has no collision; add a UCX box", "uk": "Фасад не має колізії: додай блок UCX"}], "answer": 1, "explain": {"en": "Flicker (z-fighting) comes from two surfaces in the same place. A 1 cm gap is invisible from the drone and stops it.", "uk": "Мерехтіння (z-fighting) з'являється, коли дві поверхні стоять в одному місці. Відступ 1 см з дрона не видно, а мерехтіння він прибирає."}}, {"q": {"en": "Why save a house type as a Level Instance?", "uk": "Навіщо зберігати тип будинку як Level Instance?"}, "options": [{"en": "You edit it once and every copy changes", "uk": "Змінюєш його один раз — і змінюється кожна копія"}, {"en": "It makes the house cast no shadows", "uk": "Тоді будинок не відкидає тіней"}, {"en": "It stops the house from loading", "uk": "Тоді будинок не завантажується"}, {"en": "It turns the house into landscape", "uk": "Тоді будинок стає ландшафтом"}], "answer": 0, "explain": {"en": "A Level Instance is one reusable group. Fix a window inside it once and all copies on the street update.", "uk": "Level Instance — одна група для повторного використання. Виправ у ній вікно один раз, і оновляться всі копії на вулиці."}}, {"q": {"en": "A building on a slope stands on its high corner, and its low side hangs 40 cm in the air. What do you do?", "uk": "Будівля на схилі стоїть на високому куті, а її нижчий бік висить на 40 см у повітрі. Що ти робиш?"}, "options": [{"en": "Scale it up until it touches", "uk": "Збільшую її масштаб, поки не торкнеться"}, {"en": "Raise the landscape under the whole district", "uk": "Піднімаю ландшафт під усім районом"}, {"en": "Sink it until the low side touches, then add steps where a door stands too high", "uk": "Занурюю її, поки нижчий бік не торкнеться землі, а потім додаю сходи там, де двері стоять зависоко"}, {"en": "Leave it, because nobody sees the base from a drone", "uk": "Лишаю так, бо з дрона основу ніхто не бачить"}], "answer": 2, "explain": {"en": "Sinking hides the gap; steps or a plinth give the door a way in. Floating bases show from low drone passes.", "uk": "Занурення ховає щілину, а сходи чи цоколь дають вхід до дверей. Основи, що висять у повітрі, видно під час низьких прольотів дрона."}}, {"q": {"en": "What does a top-view overlay on the plan check?", "uk": "Що перевіряє накладання виду Top на план?"}, "options": [{"en": "That the colours match the photos", "uk": "Що кольори збігаються з фото"}, {"en": "That the frame time is under budget", "uk": "Що час кадру вкладається в бюджет"}, {"en": "That every building has collision", "uk": "Що кожна будівля має колізію"}, {"en": "That every footprint is within about 0.5 m of its plan place", "uk": "Що кожен обрис лежить не далі ніж приблизно за 0,5 м від свого місця на плані"}], "answer": 3, "explain": {"en": "Laying a Top view over the plan shows at once any building that drifted from its footprint.", "uk": "Вид Top, покладений на план, одразу показує кожну будівлю, що з'їхала зі свого обрису."}}, {"q": {"en": "You hide DL_District1, and one bench and two walls you placed today still stand in the district. What does that mean?", "uk": "Ти ховаєш DL_District1, а одна лавка й дві стіни, поставлені сьогодні, досі стоять у районі. Що це означає?"}, "options": [{"en": "They are on no layer or the wrong layer; assign them to DL_District1", "uk": "Вони не на жодному шарі або на неправильному: признач їх до DL_District1"}, {"en": "They are Nanite meshes", "uk": "Це меші Nanite"}, {"en": "The layer is broken; delete it", "uk": "Шар зламаний: видали його"}, {"en": "They are HLODs", "uk": "Це HLOD"}], "answer": 0, "explain": {"en": "Anything that stays visible when its district's layer is hidden is on the wrong layer. Assign it so the district hides and loads as one.", "uk": "Усе, що лишається видимим, коли шар його району приховано, стоїть на неправильному шарі. Признач його, щоб район ховався й завантажувався як одне ціле."}}], "weekInfo": {"week": 9, "title": {"en": "District 1: the waterfront", "uk": "Район 1: набережна"}, "goal": {"en": "By Friday you have district 1, your waterfront, built from your plan and measured against a frame budget, with five screenshots beside your reference photos.", "uk": "До п'ятниці в тебе є район 1 — твоя набережна, збудована за планом і виміряна бюджетом кадру, з п'ятьма скриншотами поруч із фото-референсами."}, "skills": [{"en": "Set dressing a 200 x 200 m district from a counted plot plan in Unreal Engine 5", "uk": "Наповнення сцени (set dressing) району 200 × 200 м за планом ділянки з підрахунками в Unreal Engine 5"}, {"en": "Performance budgeting with stat unit, stat gpu and CSV profiling", "uk": "Бюджет продуктивності: stat unit, stat gpu і CSV-профілювання"}, {"en": "Modular building assembly with Level Instances and Packed Level Actors", "uk": "Збирання модульних будівель із Level Instance і Packed Level Actor"}, {"en": "Decal and material-wear storytelling for realistic environments", "uk": "Розповідь через декалі та зношеність матеріалів для реалістичного оточення"}, {"en": "Art review against reference photographs with located see-why-fix notes", "uk": "Огляд роботи за фото-референсами: нотатки «бачу, чому, як виправити» з точним місцем"}]}, "morning": {"sofar": {"en": "Your waterfront has a tested sample plot and budget.md, which shows in milliseconds what it costs.", "uk": "На твоїй набережній є перевірена пробна ділянка й budget.md, що показує її вартість у мілісекундах."}, "today": {"en": "You place every building of district 1 at its plan place, on a shelf cut into the land, with shop fronts and paving to every door.", "uk": "Сьогодні ти ставиш кожну будівлю району 1 на її місце з плану, на уступ, вирізаний у рельєфі, з фасадами крамниць і мощенням до кожних дверей."}, "cheer": {"en": "Placing by numbers is steady work, so take one building at a time and watch your street rise.", "uk": "Розміщення за числами — рівна, спокійна робота, тож бери по одній будівлі й дивись, як виростає твоя вулиця."}, "quote": {"text": {"en": "No house should ever be on a hill or on anything. It should be of the hill.", "uk": "Жоден будинок не повинен стояти на пагорбі чи на будь-чому. Він має бути частиною пагорба."}, "author": {"en": "Frank Lloyd Wright", "uk": "Френк Ллойд Райт"}, "source": "https://en.wikiquote.org/wiki/Frank_Lloyd_Wright"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-42-district1-buildings-and-fronts", "mapHref": "../../COURSE.html", "prevHref": "../Day-41-district1-sample-and-budget/START-HERE.html", "nextHref": "../Day-43-district1-street-furniture-and-boats/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8 and Krita. I am a beginner on Day 42. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me and don't write code.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: Усі інші будівлі й фасади крамниць — самостійно.\nIt's part of: Кожна будівля і кожен фасад крамниці району 1, розставлені за plot_plan_d1.png на уступах у землі, з мощенням до кожних дверей (Район 1: кожен обрис будівлі на plot_plan_d1.png навколо пробної ділянки з Дня 41.).\nWhy it matters: Будівлі — найбільші форми, які бачить дрон, тож вони задають масштаб району і його силует. Якщо ставити їх за числами з плану, вулиці, провулки й види лишаються там, де вони стоять на плані. Студії будують вулицю з кількох типів будівель і багатьох дрібних відмінностей: тоді одна зміна в типі виправляє кожну копію. It comes back: Завтра (День 43) ці вулиці заповнять твої лавки, урни й човни. У День 46 placement_d1.md тримає план і рівень узгодженими, а в День 48 твій тип будинку допоможе збудувати район 2.\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-42-district1-buildings-and-fronts (on the drive I chose on Day 0).\nWhat I already know: День 41: пробна ділянка, її кутові маркери, DL_District1, п'ять камер і рядки «змінити» в sample.md; День 23: plot_plan_d1.png — обриси будівель в острівних метрах; Дні 9 і 10: SM_Wall_2m, SM_Wall_Window, SM_Wall_Door, SM_Wall_Corner і LI_HarbourHouse, а також деталі даху (SM_Roof_2m, SM_Roof_Gable_4m, SM_Roof_Ridge_2m), якщо дах у тебе є; День 13: SM_ShopFront_A на T_Trim_Harbour. День 15: його інстанс із маскою зношеності MI_Trim_ShopFront_A; День 17: твоя безшовна текстура мощення і MI_Paving; День 24: вибрані тобою паки будівель; today's lessons: Розміщуємо вулицю за числами; Уступи й мощення: будівлі, що стоять на землі; Типи будинків із твого набору і Level Instance; Фасади крамниць, які читаються з дрона. Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- Кожна будівля з plot_plan_d1.png стоїть на DL_District1 не далі ніж за 0,5 м від свого обрису і повернута під кутом із плану. Це перевірено накладанням виду Top на план.\n- Уступи: земля під кожним обрисом вирівняна, плюс приблизно 2 м навколо. Уступ — це рівна сходинка, вирізана в схилі. З боку підйому — м'який схил або сходи, ніколи не вертикальна стіна ландшафту.\n- Будівлі з двох-трьох джерел: копії LI_HarbourHouse_A, будівлі з паків, вибраних у День 24, і стіни з набору для кожної особливої будівлі. Кожен пак записано в credits.md (у папці GAD на ПК).\n- Один тип будинку збережено як Level Instance — LI_HarbourHouse_A, і він стоїть у районі кілька разів. Level Instance — це група акторів, збережена як одна деталь: зміни її раз, і зміниться кожна копія. Різноманіття дають будівлі з паків, повороти й фасади крамниць поза Level Instance. Золото (за бажанням): другий тип, LI_HarbourHouse_B, зі своїм кольором стін.\n- SM_ShopFront_A — на першому поверсі кожної крамниці з плану, лицем до вулиці. Його спинка відступає від стіни на 1 см: ні щілин, ні мерехтіння. Кожен фасад має свій колір у слоті Plaster (дочірній інстанс MI_Plaster, наприклад MI_ShopFront_Blue). Фасади лишаються поза Level Instance, тож кожен може бути іншим.\n- Мощення: квадрати 2 × 2 м (Plane зі Scale 2, 2, 1 і MI_Paving_2m, Tiling 1), покладені край до краю, щоб кожні двері виходили на доріжку. Де двері стоять високо — твої SM_Steps з Дня 8.\n- Перевірка з C1–C5 і вздовж фасадів із 30 м: вулиця читається як одне місце, а крамниці вирізняються.\n\nMy checklist (the same numbers show on my course page):\n1. Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: placement_d1.md, а в Unreal — LI_HarbourHouse_A, MI_Paving_2m і MI_ShopFront_Blue. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Потім доповни placement_d1.md з урахуванням рядків «змінити» в sample.md (День 41): для кожної будівлі x, y, кут і тип. Перевірка: по рядку на кожну будівлю з плану. (from lesson 1)\n2. Зроби скриншот порожнього району з C4 і збережи як c4_before_day42.png. Виріж уступ під кожен обрис: Flatten по обрису плюс 2 м, потім Smooth по краях. Перевірка: з 10 м жоден уступ не лишає вертикальної стіни ландшафту. (from lesson 2)\n3. Постав кожну копію LI_HarbourHouse_A на її координати з плану (острівні метри × 100), поверни як на плані й опусти клавішею End. Перевірка: усі чотири кути торкаються уступу. (from lesson 1)\n4. Будівлі з паків постав на їхні обриси там, де їх називає план, а для кожної особливої будівлі збери стіни з набору. Кожен пак допиши в credits.md у папці GAD на ПК. Перевірка: у credits.md є рядок для кожного використаного пака. (from lesson 3)\n5. Мощення: квадрати 2 × 2 м з MI_Paving_2m від кожних дверей до вулиці, край до краю, з прив'язкою до сітки 200 і на 2 см над землею. Перевірка: кожні двері виходять на мощення, а візерунок не розтягнутий. (from lesson 2)\n6. Де двері стоять вище за мощення, додай свої SM_Steps з Дня 8. Перевірка: кожні сходи сходяться і з землею, і з дверима, а жодна сходинка не вища за 20 см. (from lesson 2)\n7. Фасади крамниць: SM_ShopFront_A на першому поверсі кожної крамниці, лицем до вулиці. Спинка торкається стіни, потім відсунь її на 1 см. Дай кожному фасаду свій інстанс кольору Plaster. Перевірка: з 2 м на жодному краї немає ні щілини, ні мерехтіння. (from lesson 4)\n8. Оглянь фасади з 2, 10 і 30 м і підсиль одну річ, яка не читається, наприклад колір фасаду на тлі стіни. Перевірка: з 30 м ще видно, які перші поверхи — крамниці. (from lesson 4)\n9. Накладання: у Krita поклади знімок HighResShot з виду Top на plot_plan_d1.png і виправ усе, що зміщене більш ніж на 0,5 м. Перевірка: кожен обрис лежить на своєму прямокутнику. (from lesson 1)\n10. Сховай DL_District1 у Data Layer Outliner, щоб знайти сьогоднішню роботу на неправильному шарі, потім покажи шар знову. Перевірка: коли шар сховано, жодного актора, поставленого сьогодні, не видно. Уступи — частина ландшафту, вони лишаються. (from lesson 1)\n11. Золото (за бажанням): збери LI_HarbourHouse_B з того самого набору — 4 × 8 м або на два поверхи. Його стіни отримують дочірній інстанс MI_Plaster з іншим Tint (на стінах із дверима — дочірній від MI_Plaster_WallDoor). Перевірка: A і B поруч схожі на сусідів, а не на близнюків. (from lesson 3)\n12. Доказ: натисни Ctrl+S (зірочка на вкладці L_Island зникає). Зніми C4 знову і склади з c4_before_day42.png пару «до і після» before_after_day42.png. Перевірка: before_after_day42.png відкривається, на ньому C4 до і після поруч. (from lesson 4)\n

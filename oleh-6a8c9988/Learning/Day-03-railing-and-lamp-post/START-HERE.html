<script id="data" type="application/json">{"learner": "ib-oleh-6a8c9988", "learnerName": {"en": "Oleh", "uk": "Олег"}, "day": 3, "week": 1, "total": 60, "title": {"en": "Modifiers: a railing section and the lamp post", "uk": "Модифікатори: секція поруччя і ліхтарний стовп"}, "theme": {"en": "Week 1: Blender from zero", "uk": "Тиждень 1: Blender з нуля"}, "build": {"item": {"en": "A 2 m harbour railing section and SM_LampPost, a street lamp for the waterfront", "uk": "Секція поруччя гавані завдовжки 2 м і SM_LampPost — вуличний ліхтар для набережної"}, "why": {"en": "Railings and lamps repeat hundreds of times along a waterfront. A modifier is an automatic step that Blender applies to a model and that you can change at any time: build one bar and get fifteen, build half a lamp and get both sides. Studios love modifier stacks because changing one number updates the whole piece. Your railing section becomes the kit piece SM_Railing_2m on Day 8.", "uk": "Поруччя й ліхтарі повторюються сотні разів уздовж набережної. Модифікатор — це автоматичний крок, який Blender застосовує до моделі і який можна змінити будь-коли: збудуй одну балясину — і отримай п'ятнадцять, збудуй половину ліхтаря — і отримай обидва боки. Студії люблять стеки модифікаторів, бо зміна одного числа оновлює всю деталь. Твоя секція поруччя стане деталлю набору SM_Railing_2m у День 8."}, "where": {"en": "Railings: along your island's quay edges and pier (a walkway built out over the water), in district 1. Lamp posts: along the waterfront promenade, every 15 to 25 m. Today both stand in Course/Day03.", "uk": "Поруччя: уздовж країв причалів і пірса (настилу, збудованого над водою) твого острова, у районі 1. Ліхтарні стовпи: уздовж прогулянкової набережної, кожні 15–25 м. Сьогодні обидва стоять у Course/Day03."}, "spec": [{"en": "Railing section: exactly 2.0 m long and 1.0 m tall: two posts, a top rail, a bottom rail and 15 vertical bars (balusters) made with Array, 12 cm apart.", "uk": "Секція поруччя: рівно 2.0 м завдовжки і 1.0 м заввишки: дві стійки, верхній поручень, нижній поручень і 15 вертикальних прутів (балясин), зроблених через Array, на відстані 12 см один від одного."}, {"en": "Lamp post: real size from your photos (a promenade lamp is often 3.5 to 5 m tall): a pole, a base, an arm or top fitting, and a lantern head.", "uk": "Ліхтарний стовп: реальний розмір за твоїми фото (ліхтар на набережній часто має від 3.5 до 5 м заввишки): стовп, основа, кронштейн або верхнє кріплення і плафон."}, {"en": "Mirror used at least once (the railing's posts, and two arms or a symmetric lantern on the lamp), Bevel on the hard edges you see up close, and Solidify on the lantern roof.", "uk": "Mirror використано щонайменше раз (стійки поруччя, а на ліхтарі — два кронштейни або симетричний плафон), Bevel — на твердих краях, які видно зблизька, а Solidify — на даху плафона."}, {"en": "Modifiers applied before joining; each piece is one object: RailingSection and SM_LampPost.", "uk": "Модифікатори застосовано перед об'єднанням; кожна деталь — один об'єкт: RailingSection і SM_LampPost."}, {"en": "Origin at the base centre on Z = 0 for both; all transforms applied.", "uk": "Origin у центрі основи на Z = 0 для обох; усі трансформації застосовано."}, {"en": "Triangles: railing section 3,000 or fewer; lamp post 5,000 or fewer.", "uk": "Трикутники: секція поруччя — 3 000 або менше; ліхтарний стовп — 5 000 або менше."}, {"en": "Both stand on the floor beside the mannequin in Unreal (Course/Day03).", "uk": "Обидва стоять на підлозі поруч із манекеном в Unreal (Course/Day03)."}], "piece1": "the railing section, plus a practice lantern head (in the lessons)", "piece2": {"en": "SM_LampPost: the full lamp post from your photos, on your own", "uk": "SM_LampPost: повний ліхтарний стовп за твоїми фото, самостійно"}, "steps": [{"text": {"en": "Find three Commons photos of a present-day promenade or harbour street lamp; save them in refs, credit them in credits.md, and write the height, pole width, arm length and lantern size in lamp_sizes.md. Check: four sizes written, each with its photo.", "uk": "Знайди на Commons три фото сучасного ліхтаря на набережній або на вулиці біля гавані; збережи їх у refs, вкажи в credits.md і запиши висоту, ширину стовпа, довжину кронштейна й розмір плафона в lamp_sizes.md. Перевірка: записано чотири розміри, кожен зі своїм фото."}, "lesson": "D1.2"}, {"text": {"en": "Open lamp_day3.blend (your lantern head from lesson 4). Pole: add a cylinder (Vertices 16) with your pole's radius and height, and sit it on Z = 0. Check: from the side, the pole stands on the grid line and matches your height.", "uk": "Відкрий lamp_day3.blend (твій плафон з уроку 4). Стовп: додай циліндр (Vertices 16) з радіусом і висотою твого стовпа і постав його на Z = 0. Перевірка: збоку стовп стоїть на лінії сітки й відповідає твоїй висоті."}, "lesson": "D1.3"}, {"text": {"en": "Base: add a wider, short cylinder around the pole bottom; Tab, select its top face, inset it (I) and extrude the inner face up (E) to make a stepped base. Check: from the front, the base has two steps and touches the grid.", "uk": "Основа: додай ширший низький циліндр навколо низу стовпа; Tab, виділи його верхню грань, зроби inset (I) і видави внутрішню грань угору (E), щоб вийшла ступінчаста основа. Перевірка: спереду в основи дві сходинки, і вона торкається сітки."}, "lesson": "D2.3"}, {"text": {"en": "Add a Bevel modifier to the base (Amount 0.005 to 0.01 m, Segments 2). Check: a thin highlight runs along the base's edges.", "uk": "Додай до основи модифікатор Bevel (Amount від 0.005 до 0.01 м, Segments 2). Перевірка: уздовж країв основи біжить тонкий відблиск."}, "lesson": 3}, {"text": {"en": "Arm: add a thin cylinder or box from the pole top out to the side (turn it with R Y 90 if needed). Put its origin on the pole's centre line (3D cursor at the world origin, then Origin to 3D Cursor) and add a Mirror modifier on X for a second arm, if your lamp has two. Check: the arm or arms touch the pole with no gap.", "uk": "Кронштейн: додай тонкий циліндр або брусок від верху стовпа вбік (за потреби поверни його через R Y 90). Постав його origin на центральну лінію стовпа (3D-курсор у центр світу, потім Origin to 3D Cursor) і додай модифікатор Mirror по X для другого кронштейна, якщо в твого ліхтаря їх два. Перевірка: кронштейн або кронштейни торкаються стовпа без щілини."}, "lesson": 2}, {"text": {"en": "Move the lantern head from the lesson under the arm end (or on top of the pole) and scale it to your photo size. If the lamp has two arms, put the lantern's origin on the pole's centre line too (3D cursor at the world origin, then Origin to 3D Cursor) and give it the same Mirror. Check: the lantern hangs straight under the arm end in the front view.", "uk": "Перемісти плафон з уроку під кінець кронштейна (або на верх стовпа) і масштабуй до розміру з фото. Якщо в ліхтаря два кронштейни, постав origin плафона теж на центральну лінію стовпа (3D-курсор у центр світу, потім Origin to 3D Cursor) і дай йому такий самий Mirror. Перевірка: на виді спереду плафон висить рівно під кінцем кронштейна."}, "lesson": "D1.3"}, {"text": {"en": "Apply every modifier from the top of each stack down (each drop-down > Apply). Check: no modifier is left in any wrench tab, and the lamp still looks the same.", "uk": "Застосуй кожен модифікатор, починаючи з верху кожного стеку донизу (спадне меню кожного > Apply). Перевірка: на жодній вкладці з гайковим ключем не лишилося модифікаторів, а ліхтар виглядає так само."}, "lesson": 3}, {"text": {"en": "Join all lamp parts (Ctrl+J), name the object SM_LampPost, use Object > Shade Auto Smooth so the round pole looks smooth, put the origin at the base centre on Z = 0 and apply all transforms. Check: Location 0, 0, 0, Rotation 0, Scale 1, and the height matches lamp_sizes.md.", "uk": "Об'єднай усі частини ліхтаря (Ctrl+J), назви об'єкт SM_LampPost, застосуй Object > Shade Auto Smooth, щоб круглий стовп виглядав гладким, постав origin у центр основи на Z = 0 і застосуй усі трансформації. Перевірка: Location 0, 0, 0, Rotation 0, Scale 1, а висота збігається з lamp_sizes.md."}, "lesson": "D1.4"}, {"text": {"en": "Read Triangles in Statistics and write it in lamp_sizes.md. Check: 5,000 triangles or fewer.", "uk": "Прочитай Triangles у Statistics і запиши число в lamp_sizes.md. Перевірка: 5 000 трикутників або менше."}, "lesson": "D1.4"}, {"text": {"en": "Check the railing section: the Measure tool reads 2.0 m end to end, it stands on Z = 0, and Triangles are 3,000 or fewer. Check: all three numbers written in lamp_sizes.md.", "uk": "Перевір секцію поруччя: інструмент Measure показує 2.0 м від краю до краю, вона стоїть на Z = 0, а Triangles — 3 000 або менше. Перевірка: усі три числа записано в lamp_sizes.md."}, "lesson": 1}, {"text": {"en": "Export SM_LampPost.glb and RailingSection.glb (each with Selected Objects and Apply Modifiers, as on Day 1), import both into Course/Day03 in IslandCourse, and place them with End beside the mannequin, the bench and the bollard. Take unreal_day3.png. Check: the lamp is about two to three mannequins tall, and the railing reaches about the mannequin's waist.", "uk": "Експортуй SM_LampPost.glb і RailingSection.glb (кожен із Selected Objects і Apply Modifiers, як у День 1), імпортуй обидва в Course/Day03 в IslandCourse і постав їх через End поруч із манекеном, лавкою і стовпчиком. Зроби unreal_day3.png. Перевірка: ліхтар заввишки приблизно у два-три манекени, а поруччя сягає приблизно пояса манекена."}, "lesson": "D0.3"}, {"text": {"en": "Captures. First before_after_day3.png: open your photo (double-click it), press Win+Left so it fills the left half of the screen, click Blender and press Win+Right, turn Blender to your photo's angle, then press Win+Shift+S and capture the whole screen. Then clip_day3.mp4, about 60 seconds: orbit both pieces in Blender, then walk past them in Unreal. Win+Alt+R records only one program window, so for a clip that moves between Blender and Unreal open Snipping Tool, click Record and drag a box over the whole screen. Rename the clip clip_day3.mp4. Check: both files are in today's Work folder.", "uk": "Знімки й запис. Спершу before_after_day3.png: відкрий своє фото (двічі клацни на ньому), натисни Win+Left, щоб воно зайняло ліву половину екрана, клацни на Blender і натисни Win+Right, поверни вид у Blender під кутом твого фото, тоді натисни Win+Shift+S і зніми весь екран. Потім clip_day3.mp4, близько 60 секунд: обертай вид навколо обох деталей у Blender, а тоді пройди повз них в Unreal. Win+Alt+R записує лише одне вікно програми, тож для кліпу, який переходить між Blender і Unreal, відкрий Snipping Tool, натисни Record і обведи рамкою весь екран. Перейменуй кліп на clip_day3.mp4. Перевірка: обидва файли лежать у сьогоднішній папці Work."}, "lesson": "D0.1"}]}, "lessons": [{"title": {"en": "Modifiers and Array: one bar becomes fifteen", "uk": "Модифікатори й Array: одна балясина стає п'ятнадцятьма"}, "minutes": 40, "goals": [{"en": "Explain a modifier: an automatic step that changes a model's look without changing its mesh until you apply it.", "uk": "Пояснювати, що таке модифікатор: автоматичний крок, який змінює вигляд моделі, не змінюючи її сітки, доки ти його не застосуєш."}, {"en": "Add a modifier in the Properties editor > Modifier Properties (the blue wrench icon) and change its settings.", "uk": "Додавати модифікатор у Properties editor > Modifier Properties (синій значок гайкового ключа) і змінювати його налаштування."}, {"en": "Use Array with Count and Constant Offset to repeat a part at an exact spacing.", "uk": "Використовувати Array з Count і Constant Offset, щоб повторювати частину з точним кроком."}], "doalong": [{"en": "New file railing_day3.blend. Add a cube for one baluster (a thin vertical bar of a railing): Dimensions 0.02 x 0.02 x 0.85 m, Ctrl+A > Scale, then G Z 0.535 Enter and G X -0.84 Enter. A thin bar stands near the left.", "uk": "Новий файл railing_day3.blend. Додай куб для однієї балясини (тонкого вертикального прута поруччя): Dimensions 0.02 x 0.02 x 0.85 м, Ctrl+A > Scale, потім G Z 0.535 Enter і G X -0.84 Enter. Ліворуч стоїть тонкий прут."}, {"en": "In the Properties editor, click the blue wrench (Modifier Properties) > Add Modifier > Generate > Array. A second bar appears beside the first: the Array modifier made it.", "uk": "У Properties editor клацни синій гайковий ключ (Modifier Properties) > Add Modifier > Generate > Array. Поруч із першою з'являється друга балясина: її створив модифікатор Array."}, {"en": "Set Count to 15. Untick Relative Offset, tick Constant Offset and set its Distance X to 0.12 m. Now 15 bars stand 12 cm apart, from X -0.84 to 0.84.", "uk": "Встанови Count на 15. Зніми позначку Relative Offset, познач Constant Offset і встанови його Distance X на 0.12 м. Тепер 15 балясин стоять на відстані 12 см одна від одної, від X -0.84 до 0.84."}, {"en": "Change Count to 5, then back to 15: the model updates at once. Press Tab: in Edit Mode only one bar is real; the modifier makes the rest. Tab out.", "uk": "Зміни Count на 5, а потім знову на 15: модель одразу оновлюється. Натисни Tab: в Edit Mode справжня лише одна балясина, решту робить модифікатор. Вийди з Edit Mode (Tab)."}, {"en": "Add the bottom rail: a cube 2.0 x 0.04 x 0.04 m, scale applied, G Z 0.1. Add the top rail: 2.0 x 0.06 x 0.05 m, scale applied, G Z 0.975. Save.", "uk": "Додай нижній поручень: куб 2.0 x 0.04 x 0.04 м, масштаб застосовано, G Z 0.1. Додай верхній поручень: 2.0 x 0.06 x 0.05 м, масштаб застосовано, G Z 0.975. Збережи."}], "play": {"en": "Count it: the tutor gives me a railing length and a spacing (3 m at 0.15 m, 1.5 m at 0.1 m); I work out the Count and the Offset before I try it, then set them on my bar and send a screenshot.", "uk": "Порахуй: тьютор дає мені довжину поруччя і крок (3 м із кроком 0.15 м, 1.5 м із кроком 0.1 м); я обчислюю Count і Offset, перш ніж пробувати, а тоді виставляю їх на своїй балясині й надсилаю скриншот."}, "video": {"url": "https://www.youtube.com/watch?v=DDpedZobA5Q", "title": "Demystifying Blender's Array & Curve Modifiers", "channel": "Grant Abbitt (Gabbitt)", "length": "9:35", "search": "blender array modifier fit curve"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Modifiers and Array: one bar becomes fifteen (Day 3, lesson 1 of 4).\nToday's build: A 2 m harbour railing section and SM_LampPost, a street lamp for the waterfront.\n\nBy the end of this lesson I can:\n1. Explain a modifier: an automatic step that changes a model's look without changing its mesh until you apply it.\n2. Add a modifier in the Properties editor > Modifier Properties (the blue wrench icon) and change its settings.\n3. Use Array with Count and Constant Offset to repeat a part at an exact spacing.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (You have modelled two street props to real measurements: a cast-iron bollard and a park bench.), what I will learn today (You let modifiers do the repeat work, building a 2 m railing with Array and Mirror and SM_LampPost with bevelled edges.), encourage me (A modifier changes nothing for good until you apply it, so experiment boldly and keep the settings you like.), and share today's quote: \"Don't fight forces, use them.\" (Buckminster Fuller).\n2. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n3. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n4. Game for this lesson: Count it: the tutor gives me a railing length and a spacing (3 m at 0.15 m, 1.5 m at 0.1 m); I work out the Count and the Offset before I try it, then set them on my bar and send a screenshot.\n5. Do-along on today's build (the railing section, plus a practice lantern head (in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - New file railing_day3.blend. Add a cube for one baluster (a thin vertical bar of a railing): Dimensions 0.02 x 0.02 x 0.85 m, Ctrl+A > Scale, then G Z 0.535 Enter and G X -0.84 Enter. A thin bar stands near the left.\n   - In the Properties editor, click the blue wrench (Modifier Properties) > Add Modifier > Generate > Array. A second bar appears beside the first: the Array modifier made it.\n   - Set Count to 15. Untick Relative Offset, tick Constant Offset and set its Distance X to 0.12 m. Now 15 bars stand 12 cm apart, from X -0.84 to 0.84.\n   - Change Count to 5, then back to 15: the model updates at once. Press Tab: in Edit Mode only one bar is real; the modifier makes the rest. Tab out.\n   - Add the bottom rail: a cube 2.0 x 0.04 x 0.04 m, scale applied, G Z 0.1. Add the top rail: 2.0 x 0.06 x 0.05 m, scale applied, G Z 0.975. Save.\n6. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n7. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Demystifying Blender's Array & Curve Modifiers\" by Grant Abbitt (Gabbitt): https://www.youtube.com/watch?v=DDpedZobA5Q\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Mirror: build one side, get both", "uk": "Mirror: будуєш один бік — отримуєш обидва"}, "minutes": 40, "goals": [{"en": "Use Mirror to copy a part to the other side, across the object's origin.", "uk": "Використовувати Mirror, щоб копіювати частину на інший бік, дзеркально відносно origin об'єкта."}, {"en": "Choose the mirror axis, and know that Clipping keeps two halves joined in the middle.", "uk": "Вибирати вісь дзеркалення і знати, що Clipping тримає дві половини з'єднаними посередині."}, {"en": "Explain why the origin must sit on the mirror line.", "uk": "Пояснювати, чому origin має лежати на лінії дзеркала."}], "doalong": [{"en": "Add a cube for one post: Dimensions 0.08 x 0.08 x 1.0 m, Ctrl+A > Scale, then G Z 0.5 and G X -0.96. The left post stands at the left end of the rails.", "uk": "Додай куб для однієї стійки: Dimensions 0.08 x 0.08 x 1.0 м, Ctrl+A > Scale, потім G Z 0.5 і G X -0.96. Ліва стійка стоїть на лівому кінці поручнів."}, {"en": "Its origin is now at X -0.96, so a Mirror would copy it onto itself. Move the origin: Shift+S > Cursor to World Origin, then Object > Set Origin > Origin to 3D Cursor. The orange dot jumps to the middle of the railing.", "uk": "Її origin тепер на X -0.96, тож Mirror скопіював би стійку саму на себе. Перемісти origin: Shift+S > Cursor to World Origin, потім Object > Set Origin > Origin to 3D Cursor. Помаранчева точка стрибає в середину поруччя."}, {"en": "Add Modifier > Generate > Mirror, Axis X: a second post appears at X 0.96. Press Tab, then A, and type G X 0.1 Enter: the left post moves right and the mirrored post moves left, like a reflection. Press Ctrl+Z and Tab out. (In Object Mode, G moves the post and its mirror line together, so both would move the same way.)", "uk": "Add Modifier > Generate > Mirror, Axis X: на X 0.96 з'являється друга стійка. Натисни Tab, потім A і введи G X 0.1 Enter: ліва стійка рухається праворуч, а віддзеркалена — ліворуч, як відображення. Натисни Ctrl+Z і вийди з Edit Mode (Tab). (В Object Mode G рухає стійку разом із її лінією дзеркала, тож обидві рухалися б в один бік.)"}, {"en": "Look at the whole section from the front (Numpad 1): two posts, two rails and 15 bars. Measure it with the Measure tool: 2.0 m from end to end.", "uk": "Подивися на всю секцію спереду (Numpad 1): дві стійки, два поручні й 15 балясин. Виміряй її інструментом Measure: 2.0 м від краю до краю."}, {"en": "Clipping (a tick box in the Mirror modifier) stops a mirrored half from crossing the middle line; you'll need it when a part touches the centre. Save railing_day3.blend.", "uk": "Clipping (прапорець у модифікаторі Mirror) не дає віддзеркаленій половині перейти через середню лінію; він знадобиться, коли частина торкається центру. Збережи railing_day3.blend."}], "play": {"en": "Mirror or not: the tutor names eight things (a bench, a lamp with one arm, a car, a tree, a door, a railing, a boat, a rock); I say whether Mirror helps and on which axis, in under 2 minutes.", "uk": "Дзеркалити чи ні: тьютор називає вісім речей (лавка, ліхтар з одним кронштейном, машина, дерево, двері, поруччя, човен, камінь); я кажу, чи допоможе Mirror і по якій осі, менш ніж за 2 хвилини."}, "video": {"url": "https://www.youtube.com/watch?v=sLmsf6P_YsM", "title": "Mirror, Array, Solidify, Subdivision Surface, Bevel / Blender - Modyfikatory #1", "channel": "Polish Coder", "length": "11:53", "search": "blender mirror array solidify bevel modifiers", "alt": {"url": "https://www.youtube.com/watch?v=nHsDqemtwaI", "title": "Базові модифікатори - Курс Blender Основи", "channel": "Алея Діаґон"}}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Mirror: build one side, get both (Day 3, lesson 2 of 4).\nToday's build: A 2 m harbour railing section and SM_LampPost, a street lamp for the waterfront.\nEarlier today I already did: lesson 1 (Modifiers and Array: one bar becomes fifteen). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Use Mirror to copy a part to the other side, across the object's origin.\n2. Choose the mirror axis, and know that Clipping keeps two halves joined in the middle.\n3. Explain why the origin must sit on the mirror line.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Mirror or not: the tutor names eight things (a bench, a lamp with one arm, a car, a tree, a door, a railing, a boat, a rock); I say whether Mirror helps and on which axis, in under 2 minutes.\n4. Do-along on today's build (the railing section, plus a practice lantern head (in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Add a cube for one post: Dimensions 0.08 x 0.08 x 1.0 m, Ctrl+A > Scale, then G Z 0.5 and G X -0.96. The left post stands at the left end of the rails.\n   - Its origin is now at X -0.96, so a Mirror would copy it onto itself. Move the origin: Shift+S > Cursor to World Origin, then Object > Set Origin > Origin to 3D Cursor. The orange dot jumps to the middle of the railing.\n   - Add Modifier > Generate > Mirror, Axis X: a second post appears at X 0.96. Press Tab, then A, and type G X 0.1 Enter: the left post moves right and the mirrored post moves left, like a reflection. Press Ctrl+Z and Tab out. (In Object Mode, G moves the post and its mirror line together, so both would move the same way.)\n   - Look at the whole section from the front (Numpad 1): two posts, two rails and 15 bars. Measure it with the Measure tool: 2.0 m from end to end.\n   - Clipping (a tick box in the Mirror modifier) stops a mirrored half from crossing the middle line; you'll need it when a part touches the centre. Save railing_day3.blend.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Mirror, Array, Solidify, Subdivision Surface, Bevel / Blender - Modyfikatory #1\" by Polish Coder: https://www.youtube.com/watch?v=sLmsf6P_YsM\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Bevel: edges that catch the light", "uk": "Bevel: краї, що ловлять світло"}, "minutes": 40, "goals": [{"en": "Explain why real edges are never perfectly sharp, and why a small bevel (a rounded or cut edge) makes a model read better in light.", "uk": "Пояснювати, чому справжні краї ніколи не бувають ідеально гострими і чому невелика фаска (bevel — заокруглений або зрізаний край) робить модель виразнішою у світлі."}, {"en": "Add the Bevel modifier and set Amount, Segments and Limit Method (Angle).", "uk": "Додавати модифікатор Bevel і задавати Amount, Segments і Limit Method (Angle)."}, {"en": "Read and change the modifier stack: it works from top to bottom, and you apply it in that order.", "uk": "Читати й змінювати стек модифікаторів: він працює згори донизу, і застосовують його в тому самому порядку."}], "doalong": [{"en": "Select the top rail. Add Modifier > Generate > Bevel. Set Amount to 0.005 m (5 mm) and Segments to 2. Zoom in: a thin highlight now runs along the rail's edges.", "uk": "Виділи верхній поручень. Add Modifier > Generate > Bevel. Встанови Amount на 0.005 м (5 мм), а Segments на 2. Наблизь: уздовж країв поручня тепер біжить тонкий відблиск."}, {"en": "Check that Limit Method is set to Angle: only sharp corners get bevelled, not flat areas.", "uk": "Перевір, що Limit Method встановлено на Angle: фаску отримують лише гострі кути, а не пласкі ділянки."}, {"en": "Select the posts (the object with the Mirror) and add a Bevel too. In the wrench tab the stack shows Mirror on top and Bevel below: Blender does Mirror first, then Bevel.", "uk": "Виділи стійки (об'єкт із Mirror) і теж додай Bevel. На вкладці з гайковим ключем стек показує Mirror угорі й Bevel під ним: Blender спершу робить Mirror, потім Bevel."}, {"en": "Watch Triangles in the Statistics overlay as you change Segments from 2 to 6 and back: every segment adds triangles. Keep the railing under 3,000.", "uk": "Стеж за Triangles в оверлеї Statistics, змінюючи Segments із 2 на 6 і назад: кожен сегмент додає трикутники. Тримай поруччя в межах 3 000."}, {"en": "Apply the modifiers on each part, from the top of each stack down (each drop-down > Apply). Then select all railing parts, press Ctrl+J and name the object RailingSection.", "uk": "Застосуй модифікатори на кожній частині, починаючи з верху кожного стеку донизу (спадне меню кожного > Apply). Потім виділи всі частини поруччя, натисни Ctrl+J і назви об'єкт RailingSection."}, {"en": "Set the origin to the base centre (Shift+S > Cursor to World Origin, then Origin to 3D Cursor; the posts' bottoms are on Z = 0) and press Ctrl+A > All Transforms. Save.", "uk": "Постав origin у центр основи (Shift+S > Cursor to World Origin, потім Origin to 3D Cursor; низ стійок на Z = 0) і натисни Ctrl+A > All Transforms. Збережи."}], "play": {"en": "Bevel sizes: the tutor names five objects (a stone step, a steel rail, a phone, a brick, a wooden crate); I say how big each bevel should be in millimetres, and the tutor scores how close I am.", "uk": "Розміри фасок: тьютор називає п'ять об'єктів (кам'яна сходинка, сталевий поручень, телефон, цеглина, дерев'яний ящик); я кажу, якою має бути кожна фаска в міліметрах, а тьютор оцінює, наскільки я близько."}, "video": {"search": "blender bevel modifier limit method angle game asset"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Bevel: edges that catch the light (Day 3, lesson 3 of 4).\nToday's build: A 2 m harbour railing section and SM_LampPost, a street lamp for the waterfront.\nEarlier today I already did: lesson 1 (Modifiers and Array: one bar becomes fifteen); lesson 2 (Mirror: build one side, get both). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Explain why real edges are never perfectly sharp, and why a small bevel (a rounded or cut edge) makes a model read better in light.\n2. Add the Bevel modifier and set Amount, Segments and Limit Method (Angle).\n3. Read and change the modifier stack: it works from top to bottom, and you apply it in that order.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Bevel sizes: the tutor names five objects (a stone step, a steel rail, a phone, a brick, a wooden crate); I say how big each bevel should be in millimetres, and the tutor scores how close I am.\n4. Do-along on today's build (the railing section, plus a practice lantern head (in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Select the top rail. Add Modifier > Generate > Bevel. Set Amount to 0.005 m (5 mm) and Segments to 2. Zoom in: a thin highlight now runs along the rail's edges.\n   - Check that Limit Method is set to Angle: only sharp corners get bevelled, not flat areas.\n   - Select the posts (the object with the Mirror) and add a Bevel too. In the wrench tab the stack shows Mirror on top and Bevel below: Blender does Mirror first, then Bevel.\n   - Watch Triangles in the Statistics overlay as you change Segments from 2 to 6 and back: every segment adds triangles. Keep the railing under 3,000.\n   - Apply the modifiers on each part, from the top of each stack down (each drop-down > Apply). Then select all railing parts, press Ctrl+J and name the object RailingSection.\n   - Set the origin to the base centre (Shift+S > Cursor to World Origin, then Origin to 3D Cursor; the posts' bottoms are on Z = 0) and press Ctrl+A > All Transforms. Save.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Solidify, and a lantern head", "uk": "Solidify і плафон ліхтаря"}, "minutes": 40, "goals": [{"en": "Use Solidify to give a thin surface a real thickness.", "uk": "Використовувати Solidify, щоб надати тонкій поверхні справжньої товщини."}, {"en": "Build a lantern head from a cylinder with individual inset and extrude, and a roof from a cone.", "uk": "Будувати плафон із циліндра через окремий inset і extrude для кожної грані, а дах — із конуса."}, {"en": "Apply a stack and check the triangles after each step.", "uk": "Застосовувати стек і перевіряти трикутники після кожного кроку."}], "doalong": [{"en": "Start lamp_day3.blend. Add a Cone (Shift+A > Mesh > Cone) and set Vertices 8, Radius 1 0.25 m, Radius 2 0 and Depth 0.15 m: a lantern roof.", "uk": "Почни lamp_day3.blend. Додай Cone (Shift+A > Mesh > Cone) і встанови Vertices 8, Radius 1 0.25 м, Radius 2 0 і Depth 0.15 м: це дах плафона."}, {"en": "Tab, press 3, click the bottom face and delete it (X > Faces): the roof is now an open shell, as thin as paper.", "uk": "Tab, натисни 3, клацни нижню грань і видали її (X > Faces): дах тепер відкрита оболонка, тонка, як папір."}, {"en": "Tab out. Add Modifier > Generate > Solidify and set Thickness to 0.01 m: the shell gets 1 cm of thickness. Look from below: it now has a real edge.", "uk": "Вийди з Edit Mode (Tab). Add Modifier > Generate > Solidify і встанови Thickness на 0.01 м: оболонка отримує 1 см товщини. Подивися знизу: тепер у неї є справжній край."}, {"en": "Add a cylinder: Vertices 8, Radius 0.18 m, Depth 0.35 m, then type G Z -0.25 Enter so it hangs right under the roof. Tab, press 3 and select the 8 side faces (Alt+click a ring of side faces, or Shift+click them).", "uk": "Додай циліндр: Vertices 8, Radius 0.18 м, Depth 0.35 м, потім введи G Z -0.25 Enter, щоб він висів прямо під дахом. Tab, натисни 3 і виділи 8 бічних граней (Alt+клацни кільце бічних граней або виділи їх через Shift+клацання)."}, {"en": "Press I, then I again (so each face gets its own inset), type 0.02 and press Enter; then press E, type -0.01 and press Enter (if the panels slide sideways instead of sinking, press Ctrl+Z and use Alt+E > Extrude Faces Along Normals, then type -0.01). Each side now has a frame and a sunken glass panel. Tab out.", "uk": "Натисни I, а потім ще раз I (щоб кожна грань отримала свій окремий inset), введи 0.02 і натисни Enter; потім натисни E, введи -0.01 і натисни Enter (якщо панелі ковзають убік замість того, щоб просідати, натисни Ctrl+Z і скористайся Alt+E > Extrude Faces Along Normals, тоді введи -0.01). Тепер кожна сторона має рамку і втоплену скляну панель. Вийди з Edit Mode (Tab)."}, {"en": "Apply the Solidify (drop-down > Apply), join the roof and the body (Ctrl+J), and read the triangles: the lantern should stay under 1,000. Save: this afternoon you add the pole, the base and the arm.", "uk": "Застосуй Solidify (спадне меню > Apply), об'єднай дах і корпус (Ctrl+J) і прочитай кількість трикутників: плафон має вкладатися в 1 000. Збережи: після обіду ти додаси стовп, основу й кронштейн."}], "play": {"en": "Thin or thick: the tutor names six thin things (a sign plate, an awning, a lamp shade, a leaf, a fence panel, a roof tile); I say whether each needs Solidify in a game seen from 5 m, and how thick.", "uk": "Тонке чи товсте: тьютор називає шість тонких речей (табличка, маркіза, абажур, листок, панель паркану, черепиця); я кажу, чи потрібен кожній Solidify у грі, якщо дивитися з 5 м, і якої товщини."}, "video": {"search": "blender solidify modifier tutorial", "alt": {"url": "https://www.youtube.com/watch?v=nHsDqemtwaI", "title": "Базові модифікатори - Курс Blender Основи", "channel": "Алея Діаґон"}}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Solidify, and a lantern head (Day 3, lesson 4 of 4).\nToday's build: A 2 m harbour railing section and SM_LampPost, a street lamp for the waterfront.\nEarlier today I already did: lesson 1 (Modifiers and Array: one bar becomes fifteen); lesson 2 (Mirror: build one side, get both); lesson 3 (Bevel: edges that catch the light). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Use Solidify to give a thin surface a real thickness.\n2. Build a lantern head from a cylinder with individual inset and extrude, and a roof from a cone.\n3. Apply a stack and check the triangles after each step.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Thin or thick: the tutor names six thin things (a sign plate, an awning, a lamp shade, a leaf, a fence panel, a roof tile); I say whether each needs Solidify in a game seen from 5 m, and how thick.\n4. Do-along on today's build (the railing section, plus a practice lantern head (in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Start lamp_day3.blend. Add a Cone (Shift+A > Mesh > Cone) and set Vertices 8, Radius 1 0.25 m, Radius 2 0 and Depth 0.15 m: a lantern roof.\n   - Tab, press 3, click the bottom face and delete it (X > Faces): the roof is now an open shell, as thin as paper.\n   - Tab out. Add Modifier > Generate > Solidify and set Thickness to 0.01 m: the shell gets 1 cm of thickness. Look from below: it now has a real edge.\n   - Add a cylinder: Vertices 8, Radius 0.18 m, Depth 0.35 m, then type G Z -0.25 Enter so it hangs right under the roof. Tab, press 3 and select the 8 side faces (Alt+click a ring of side faces, or Shift+click them).\n   - Press I, then I again (so each face gets its own inset), type 0.02 and press Enter; then press E, type -0.01 and press Enter (if the panels slide sideways instead of sinking, press Ctrl+Z and use Alt+E > Extrude Faces Along Normals, then type -0.01). Each side now has a frame and a sunken glass panel. Tab out.\n   - Apply the Solidify (drop-down > Apply), join the roof and the body (Ctrl+J), and read the triangles: the lantern should stay under 1,000. Save: this afternoon you add the pole, the base and the arm.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "railing_day3.blend and lamp_day3.blend (your working files)", "uk": "railing_day3.blend і lamp_day3.blend (твої робочі файли)"}, {"en": "lamp_sizes.md (lamp and railing sizes, triangle counts and sources)", "uk": "lamp_sizes.md (розміри ліхтаря й поруччя, кількість трикутників і джерела)"}, {"en": "RailingSection.glb and SM_LampPost.glb", "uk": "RailingSection.glb і SM_LampPost.glb"}, {"en": "before_after_day3.png (your lamp photo beside the same view of your model)", "uk": "before_after_day3.png (твоє фото ліхтаря поруч із тим самим видом твоєї моделі)"}, {"en": "unreal_day3.png (the lamp and the railing beside the mannequin, the bench and the bollard)", "uk": "unreal_day3.png (ліхтар і поруччя поруч із манекеном, лавкою і стовпчиком)"}, {"en": "clip_day3.mp4 (60 seconds)", "uk": "clip_day3.mp4 (60 секунд)"}, {"en": "summary.md", "uk": "summary.md"}], "goal": {"en": "By the end of today you have a 2 m railing section made with Array and Mirror, and SM_LampPost, a street lamp at real size with bevelled edges and a solid lantern, both standing in Unreal.", "uk": "До кінця дня в тебе є секція поруччя завдовжки 2 м, зроблена через Array і Mirror, і SM_LampPost — вуличний ліхтар у реальному розмірі з фасками на краях і об'ємним плафоном, і обидва стоять в Unreal."}, "uses": [{"en": "Day 2: Edit Mode, loop cuts, extrude and inset", "uk": "День 2: Edit Mode, петлеві розрізи, extrude та inset"}, {"en": "Day 1: simple shapes, Dimensions, typed moves, the origin at the base and joining", "uk": "День 1: прості форми, Dimensions, введені рухи, origin в основі та об'єднання"}], "quiz": [{"q": {"en": "You need 15 identical bars 12 cm apart, and you may change the number later. What do you use?", "uk": "Тобі потрібно 15 однакових прутів на відстані 12 см, і згодом ти, можливо, захочеш змінити їхню кількість. Що використати?"}, "options": [{"en": "Shift+D fifteen times", "uk": "П'ятнадцять разів Shift+D"}, {"en": "The Bevel modifier", "uk": "Модифікатор Bevel"}, {"en": "The Array modifier with Count 15 and a Constant Offset of 0.12 m", "uk": "Модифікатор Array з Count 15 і Constant Offset 0.12 м"}, {"en": "The Solidify modifier", "uk": "Модифікатор Solidify"}], "answer": 2, "explain": {"en": "Array repeats a part at an exact spacing, and the Count stays changeable until you apply it.", "uk": "Array повторює частину з точним кроком, а Count можна змінювати, доки ти не застосуєш модифікатор."}}, {"q": {"en": "You add a Mirror to your lamp arm, but the copy lands 2 m away instead of on the other side of the pole. Why?", "uk": "Ти додаєш Mirror до кронштейна ліхтаря, але копія опиняється за 2 м, а не з іншого боку стовпа. Чому?"}, "options": [{"en": "The arm's origin is not on the pole's centre line", "uk": "Origin кронштейна не на центральній лінії стовпа"}, {"en": "Mirror always copies 2 m away", "uk": "Mirror завжди копіює на 2 м убік"}, {"en": "Bevel is above Mirror in the stack", "uk": "Bevel стоїть у стеку над Mirror"}], "answer": 0, "explain": {"en": "Mirror reflects across the object's origin. Put the origin on the pole's centre line and the copy lands on the other side.", "uk": "Mirror віддзеркалює відносно origin об'єкта. Постав origin на центральну лінію стовпа, і копія опиниться з іншого боку."}}, {"q": {"en": "Your lantern roof is a cone with no bottom, and from below it looks like paper. What fixes it?", "uk": "Дах твого плафона — конус без дна, і знизу він виглядає паперовим. Що це виправить?"}, "options": [{"en": "Array", "uk": "Array"}, {"en": "A higher triangle count", "uk": "Більша кількість трикутників"}, {"en": "Mirror on Z", "uk": "Mirror по Z"}, {"en": "Solidify with a small Thickness", "uk": "Solidify з невеликим Thickness"}], "answer": 3, "explain": {"en": "Solidify gives a thin surface a real thickness, so it has an edge from every side.", "uk": "Solidify надає тонкій поверхні справжньої товщини, тож край видно з будь-якого боку."}}, {"q": {"en": "Why does a game artist add a small bevel to a steel rail?", "uk": "Навіщо ігровий художник додає невелику фаску сталевому поручню?"}, "options": [{"en": "To make it heavier", "uk": "Щоб зробити його важчим"}, {"en": "Real edges are slightly rounded, and the bevel catches light so the shape reads better", "uk": "Справжні краї трохи заокруглені, а фаска ловить світло, тож форма читається краще"}, {"en": "Unreal needs bevels to import", "uk": "Unreal потребує фасок для імпорту"}], "answer": 1, "explain": {"en": "Perfectly sharp edges look fake in light. A few millimetres of bevel give a highlight along the edge.", "uk": "Ідеально гострі краї у світлі виглядають несправжніми. Кілька міліметрів фаски дають відблиск уздовж краю."}}, {"q": {"en": "Your railing has Mirror on top of the stack and Bevel below it. In what order does Blender work?", "uk": "У твого поруччя Mirror угорі стеку, а Bevel під ним. У якому порядку працює Blender?"}, "options": [{"en": "Mirror first, then Bevel", "uk": "Спершу Mirror, потім Bevel"}, {"en": "Bevel first, then Mirror", "uk": "Спершу Bevel, потім Mirror"}, {"en": "Both at the same time", "uk": "Обидва одночасно"}], "answer": 0, "explain": {"en": "The modifier stack runs from top to bottom, and you apply it in the same order.", "uk": "Стек модифікаторів працює згори донизу, і застосовують його в тому самому порядку."}}], "weekInfo": {"week": 1, "title": {"en": "Blender from zero: props at real size", "uk": "Blender з нуля: пропси в реальному розмірі"}, "goal": {"en": "By Friday you have a street-prop set (bollard, bench, lamp post and bin) that you modelled yourself from real photos, exported clean with collision and simple materials, standing at real scale in Unreal.", "uk": "До п'ятниці в тебе є набір вуличних пропсів (стовпчик, лавка, ліхтарний стовп і урна), змодельований власноруч за справжніми фото, чисто експортований із колізією та простими матеріалами, і він стоїть в Unreal у реальному масштабі."}, "skills": [{"en": "3D modelling in Blender from measured photos and drawings", "uk": "3D-моделювання в Blender за обмірними фото й кресленнями"}, {"en": "Hard-surface modelling with Edit Mode tools and modifiers (extrude, inset, loop cut, Array, Mirror, Bevel, Solidify)", "uk": "Hard-surface моделювання (тверді поверхні) інструментами Edit Mode і модифікаторами (extrude, inset, loop cut, Array, Mirror, Bevel, Solidify)"}, {"en": "Game-ready export: real-world scale, pivots, applied transforms, UCX collision and FBX", "uk": "Експорт, готовий до гри: реальний масштаб, півоти, застосовані трансформації, колізія UCX і FBX"}, {"en": "Measured elevation drawings in Krita", "uk": "Обмірні креслення (вид спереду й збоку) у Krita"}, {"en": "Props to a triangle budget with industry naming (SM_, M_, UCX_)", "uk": "Пропси в межах бюджету трикутників і з галузевими назвами (SM_, M_, UCX_)"}]}, "morning": {"sofar": {"en": "You have modelled two street props to real measurements: a cast-iron bollard and a park bench.", "uk": "Ти вже маєш дві вуличні моделі за справжніми вимірами: чавунний стовпчик і паркову лаву."}, "today": {"en": "You let modifiers do the repeat work, building a 2 m railing with Array and Mirror and SM_LampPost with bevelled edges.", "uk": "Сьогодні повторювану роботу беруть на себе модифікатори: ти будуєш 2-метрове поруччя з Array і Mirror та SM_LampPost зі скошеними краями."}, "cheer": {"en": "A modifier changes nothing for good until you apply it, so experiment boldly and keep the settings you like.", "uk": "Модифікатор нічого не змінює остаточно, доки ти його не застосуєш, тож експериментуй сміливо й залишай налаштування, які тобі подобаються."}, "quote": {"text": {"en": "Don't fight forces, use them.", "uk": "Не борися з силами — використовуй їх."}, "author": {"en": "Buckminster Fuller", "uk": "Бакмінстер Фуллер"}, "source": "https://en.wikiquote.org/wiki/Buckminster_Fuller"}}, "hasAssets": false, "workPath": "Work\\Assignment\\Day-03-railing-and-lamp-post", "mapHref": "../../COURSE.html", "prevHref": "../Day-02-bench/START-HERE.html", "nextHref": "../Day-04-drawings-and-bin/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Blender (and a quick look in Unreal Engine 5.8). I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me and don't write code. Keep me moving and make it feel like a game.\n\nToday I build on my own: SM_LampPost: the full lamp post from your photos, on your own.\nIt's part of: A 2 m harbour railing section and SM_LampPost, a street lamp for the waterfront (Railings: along your island's quay edges and pier (a walkway built out over the water), in district 1. Lamp posts: along the waterfront promenade, every 15 to 25 m. Today both stand in Course/Day03.).\n\nSpec:\n- Railing section: exactly 2.0 m long and 1.0 m tall: two posts, a top rail, a bottom rail and 15 vertical bars (balusters) made with Array, 12 cm apart.\n- Lamp post: real size from your photos (a promenade lamp is often 3.5 to 5 m tall): a pole, a base, an arm or top fitting, and a lantern head.\n- Mirror used at least once (the railing's posts, and two arms or a symmetric lantern on the lamp), Bevel on the hard edges you see up close, and Solidify on the lantern roof.\n- Modifiers applied before joining; each piece is one object: RailingSection and SM_LampPost.\n- Origin at the base centre on Z = 0 for both; all transforms applied.\n- Triangles: railing section 3,000 or fewer; lamp post 5,000 or fewer.\n- Both stand on the floor beside the mannequin in Unreal (Course/Day03).\n\nMy checklist:\n1. Find three Commons photos of a present-day promenade or harbour street lamp; save them in refs, credit them in credits.md, and write the height, pole width, arm length and lantern size in lamp_sizes.md. Check: four sizes written, each with its photo. (from day 1, lesson 2)\n2. Open lamp_day3.blend (your lantern head from lesson 4). Pole: add a cylinder (Vertices 16) with your pole's radius and height, and sit it on Z = 0. Check: from the side, the pole stands on the grid line and matches your height. (from day 1, lesson 3)\n3. Base: add a wider, short cylinder around the pole bottom; Tab, select its top face, inset it (I) and extrude the inner face up (E) to make a stepped base. Check: from the front, the base has two steps and touches the grid. (from day 2, lesson 3)\n4. Add a Bevel modifier to the base (Amount 0.005 to 0.01 m, Segments 2). Check: a thin highlight runs along the base's edges. (from lesson 3)\n5. Arm: add a thin cylinder or box from the pole top out to the side (turn it with R Y 90 if needed). Put its origin on the pole's centre line (3D cursor at the world origin, then Origin to 3D Cursor) and add a Mirror modifier on X for a second arm, if your lamp has two. Check: the arm or arms touch the pole with no gap. (from lesson 2)\n6. Move the lantern head from the lesson under the arm end (or on top of the pole) and scale it to your photo size. If the lamp has two arms, put the lantern's origin on the pole's centre line too (3D cursor at the world origin, then Origin to 3D Cursor) and give it the same Mirror. Check: the lantern hangs straight under the arm end in the front view. (from day 1, lesson 3)\n7. Apply every modifier from the top of each stack down (each drop-down > Apply). Check: no modifier is left in any wrench tab, and the lamp still looks the same. (from lesson 3)\n8. Join all lamp parts (Ctrl+J), name the object SM_LampPost, use Object > Shade Auto Smooth so the round pole looks smooth, put the origin at the base centre on Z = 0 and apply all transforms. Check: Location 0, 0, 0, Rotation 0, Scale 1, and the height matches lamp_sizes.md. (from day 1, lesson 4)\n9. Read Triangles in Statistics and write it in lamp_sizes.md. Check: 5,000 triangles or fewer. (from day 1, lesson 4)\n10. Check the railing section: the Measure tool reads 2.0 m end to end, it stands on Z = 0, and Triangles are 3,000 or fewer. Check: all three numbers written in lamp_sizes.md. (from lesson 1)\n11. Export SM_LampPost.glb and RailingSection.glb (each with Selected Objects and Apply Modifiers, as on Day 1), import both into Course/Day03 in IslandCourse, and place them with End beside the mannequin, the bench and the bollard. Take unreal_day3.png. Check: the lamp is about two to three mannequins tall, and the railing reaches about the mannequin's waist. (from day 0, lesson 3)\n12. Captures. First before_after_day3.png: open your photo (double-click it), press Win+Left so it fills the left half of the screen, click Blender and press Win+Right, turn Blender to your photo's angle, then press Win+Shift+S and capture the whole screen. Then clip_day3.mp4, about 60 seconds: orbit both pieces in Blender, then walk past them in Unreal. Win+Alt+R records only one program window, so for a clip that moves between Blender and Unreal open Snipping Tool, click Record and drag a box over the whole screen. Rename the clip clip_day3.mp4. Check: both files are in today's Work folder. (from day 0, lesson 1)\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Oleh\nDay 3: Modifiers: a railing section and the lamp post. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p><div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+list(D.handin,'ul','ticks')+'<p class="path">'+ic('folder')+'<span>'+u('shipTo')+' <code>'+esc(D.workPath)+'</code></span></p>'+(D.lessons.length?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<p class="muted">'+u('report')+'</p><div class="row"><button class="btn s" onclick="cp(D.reportPrompt)">'+ic('copy')+u('copyR')+'</button></div></section>';
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();

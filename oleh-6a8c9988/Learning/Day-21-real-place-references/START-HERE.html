<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 21</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

or a farm valley. Save everything in the day work folder (Day21), with the photos in its subfolder references. credits.md stays in GAD on your PC, one level above the day work folder.", "uk": "Сучасний невеликий острів чи прибережне містечко завширшки 0,5–3 км або 1-кілометрова ділянка довшого узбережжя. Там є гавань і другий тип місцевості: село на схилі, мис із маяком або долина з полями. Усе зберігай у робочій папці дня (Day21), а фото — в її підпапці references. Файл credits.md лежить у папці GAD на ПК, на рівень вище за робочу папку дня."}, "spec": [{"en": "references.md, part 1, 'The place': its name and country, its longest axis in metres and its highest point in metres. Add why it fits (the waterfront and the second kind of place) and three things you'll borrow, for example white houses climbing a hill.", "uk": "references.md, частина 1 «Місце» (The place): назва й країна, найдовша вісь у метрах і висота найвищої точки в метрах. Додай, чому місце підходить (набережна і другий тип місцевості), і три речі, які ти запозичиш. Наприклад, білі будинки, що піднімаються на пагорб."}, {"en": "osm_view.png: an OpenStreetMap image of the whole place with some sea round it. Write four lengths in metres in references.md: the longest axis, the harbour mouth, the waterfront row and the shore to the summit.", "uk": "osm_view.png — зображення всього місця з OpenStreetMap, навколо трохи моря. Запиши в references.md чотири довжини в метрах: найдовша вісь, вхід у гавань, ряд будинків на набережній і відстань від берега до верхівки."}, {"en": "15 or more photos in Day21/references, named by number and subject (01_aerial_harbour.jpg, 02_quay.jpg ...). The mix: 2 high views, 5 of the waterfront, 4 of the second place, 2 of coast, 1 of plants and 1 of the water's colour.", "uk": "15 або більше фото в Day21/references, названих за номером і сюжетом (01_aerial_harbour.jpg, 02_quay.jpg …). Склад: 2 види згори, 5 набережної, 4 другого типу місцевості, 2 узбережжя, 1 рослин і 1 кольору води."}, {"en": "references.md, part 2, 'The photos': one row per photo with its file name, what it shows, a tag and one scale clue. Tags: district 1, district 2, coast, plants, water or colour. Scale clues: a door, a person, a car or a storey.", "uk": "references.md, частина 2 «Фото» (The photos): по рядку на кожне фото — назва файлу, що на ньому, тег і одна підказка масштабу. Теги: район 1, район 2, узбережжя, рослини, вода або колір. Підказки масштабу: двері, людина, автомобіль або поверх."}, {"en": "credits.md, your course-long file in GAD on your PC: one line per photo (title, author, licence, link) and one line for the map. Only public domain, CC0, CC BY or CC BY-SA photos.", "uk": "credits.md — твій файл на весь курс у папці GAD на ПК. У ньому по рядку на кожне фото (назва, автор, ліцензія, посилання) і один рядок для мапи. Беремо лише фото з ліцензіями public domain (суспільне надбання), CC0, CC BY або CC BY-SA."}, {"en": "Hero photos starred in references.md: 5 of the waterfront and 3 or 4 of the second kind of place. Each has the camera height you think it was taken from. Your final screenshots will stand beside these.", "uk": "Ключові фото, позначені зірочкою в references.md: 5 набережної і 3–4 другого типу місцевості. Біля кожного запиши, з якої висоти, на твою думку, його знято. Поруч із цими фото стоятимуть твої фінальні скриншоти."}], "piece1": "the place check and the OpenStreetMap measurements (shared with the lessons)", "piece2": {"en": "The 15 photos, credited, tagged and with hero photos starred, on your own", "uk": "15 фото з рядками авторства, тегами й зірочками на ключових фото — самостійно"}, "steps": [{"text": {"en": "Check: the files from today's lessons are in the day work folder (references.md, osm_measure.kra, osm_view.png and your first photo). Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it. Then check your Day 16 candidates against the four rules and choose one place. Check: one place is chosen, and you can say its longest axis in metres.", "uk": "Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: references.md, osm_measure.kra, osm_view.png і твоє перше фото. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Потім перевір своїх кандидатів із Дня 16 за чотирма правилами й вибери одне місце. Перевірка: місце вибрано, і ти можеш назвати його найдовшу вісь у метрах."}, "lesson": 1}, {"text": {"en": "Write part 1 of references.md, 'The place': name and country, longest axis, why it fits, and three things you'll borrow. Check: every size is a number in metres, never 'big' or 'small'.", "uk": "Напиши частину 1 файлу references.md, «Місце»: назва й країна, найдовша вісь, чому місце підходить, і три речі, які ти запозичиш. Перевірка: кожен розмір — число в метрах, ніде не «велике» чи «мале»."}, "lesson": 1}, {"text": {"en": "In osm_measure.kra, measure the scale bar first. Then measure the harbour mouth, the waterfront row and the shore to the highest point, and find the highest point's height. Write them all in references.md. Check: metres per pixel, four lengths and one height, each in metres.", "uk": "В osm_measure.kra спершу виміряй шкалу масштабу. Потім виміряй вхід у гавань, ряд будинків на набережній і відстань від берега до найвищої точки. Знайди висоту найвищої точки. Запиши все в references.md. Перевірка: є метри на піксель, чотири довжини й одна висота, усе в метрах."}, "lesson": 2}, {"text": {"en": "Export osm_view.png with Share > Image and add its line to credits.md. Check: osm_view.png opens and shows the whole place with some sea, and credits.md has the OpenStreetMap line.", "uk": "Експортуй osm_view.png через Share > Image і додай його рядок у credits.md. Перевірка: osm_view.png відкривається і показує все місце з частиною моря, а в credits.md є рядок OpenStreetMap."}, "lesson": 2}, {"text": {"en": "Collect your first 7 photos: 2 aerial or high views and 5 of the waterfront (quay, building fronts, boats, paving). Write each credit line the moment you save the photo. Check: 7 files named by number and subject, and 7 lines in credits.md.", "uk": "Збери перші 7 фото: 2 види з повітря або згори і 5 набережної (причал, фасади будівель, човни, бруківка). Рядок авторства записуй одразу, щойно зберігаєш фото. Перевірка: 7 файлів, названих за номером і сюжетом, і 7 рядків у credits.md."}, "lesson": 3}, {"text": {"en": "Collect 8 more: 4 of your second kind of place, 2 of coast or cliffs, 1 of plants and 1 that shows the water's colour. Check: 15 files or more, and every group in the mix has its number.", "uk": "Збери ще 8: 4 фото другого типу місцевості, 2 узбережжя чи скель, 1 рослин і 1, де видно колір води. Перевірка: 15 файлів або більше, і кожна група має свою кількість."}, "lesson": 3}, {"text": {"en": "Licence check: read down credits.md. Replace any photo marked NC, ND or 'all rights reserved', or with no licence. Check: every line has an author, one of the four allowed licences and a link.", "uk": "Перевір ліцензії: прочитай credits.md згори донизу. Заміни кожне фото з позначкою NC, ND чи «all rights reserved» або без ліцензії. Перевірка: у кожному рядку є автор, одна з чотирьох дозволених ліцензій і посилання."}, "lesson": 3}, {"text": {"en": "Write part 2 of references.md, the photo table: file, what it shows, tag and one scale clue per photo. Check: 15 rows or more, each with a tag.", "uk": "Напиши частину 2 файлу references.md, таблицю фото: файл, що на ньому видно, тег і одна підказка масштабу для кожного фото. Перевірка: 15 рядків або більше, у кожному є тег."}, "lesson": 4}, {"text": {"en": "Star your hero photos: 5 of the waterfront and 3 or 4 of the second kind of place. Write a guessed camera height for each. Check: at least 8 stars, and at least one hero photo taken from high up.", "uk": "Познач зірочкою ключові фото: 5 набережної і 3–4 другого типу місцевості. Біля кожного запиши приблизну висоту камери. Перевірка: щонайменше 8 зірочок, і хоча б одне ключове фото знято згори."}, "lesson": 4}, {"text": {"en": "Compare your Day 16 palette with two hero photos. Write 'palette kept' or the swatches you will change at the end of references.md. Check: references.md reopens with both parts and the palette line in it.", "uk": "Порівняй свою палітру з Дня 16 із двома ключовими фото. У кінці references.md напиши «палітра без змін» або які зразки ти зміниш. Перевірка: references.md знову відкривається, у ньому обидві частини й рядок про палітру."}, "lesson": 4}, {"text": {"en": "Report and hand-in: click Copy the day report at the bottom of the page, paste it into a new chat and answer. Open summary.md in Notepad, press Ctrl+End, paste the answer and press Ctrl+S. Then drag the files on the Hand in list into your hand-in folder. Check: every name shows in the folder, each with a size.", "uk": "Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: кожна назва зі списку є в папці, у кожної є розмір."}, "lesson": "D0.1"}], "assets": ["island12/credits-template.md"]}, "lessons": [{"title": {"en": "Choosing your real place", "uk": "Вибір твого реального місця"}, "minutes": 40, "goals": [{"en": "Explain why a world built on a real place looks believable: real places give true sizes, shapes and reasons.", "uk": "Пояснити, чому світ, побудований на реальному місці, виглядає правдоподібно: реальні місця дають справжні розміри, форми і причини."}, {"en": "Check each Day 16 candidate against four rules: its size, a present-day waterfront, a second kind of place, and enough free photos.", "uk": "Перевіряти кожного кандидата з Дня 16 за чотирма правилами: розмір, сучасна набережна, другий тип місцевості й достатньо вільних фото."}, {"en": "Estimate a length on OpenStreetMap with its scale bar. The scale bar is the ruler at the bottom left of the map.", "uk": "Оцінювати довжину на OpenStreetMap за шкалою масштабу. Шкала масштабу — це відрізок із підписаною довжиною в лівому нижньому куті мапи."}], "doalong": [{"en": "Open openstreetmap.org. It is a free world map made by volunteers, and anyone may use it with a credit. Type your first Day 16 candidate in the Search box at the top left and press Enter. You should see the map move to the place.", "uk": "Відкрий openstreetmap.org. Це безкоштовна мапа світу, яку роблять волонтери. Користуватися нею може кожен, хто вказує авторство. Введи свого першого кандидата з Дня 16 у поле Search угорі ліворуч і натисни Enter. Мапа переходить до цього місця."}, {"en": "Zoom with the mouse wheel until the whole place fills the screen. Find the scale bar at the bottom left: its top line shows a length, for example 300 m. Count how many bar lengths fit along the longest stretch of land. You should have a rough longest axis, for example 4 bars of 300 m, about 1.2 km.", "uk": "Коліщатком миші наближай мапу, поки все місце не заповнить екран. Знайди шкалу масштабу внизу ліворуч: над нею написано довжину, наприклад 300 m. Порахуй, скільки таких відрізків уміщається вздовж найдовшої смуги суші. Має вийти приблизна найдовша вісь, наприклад 4 відрізки по 300 м — близько 1,2 км."}, {"en": "Rule 1, size: keep places 0.5 to 3 km across. If the land is bigger, choose a 1 km stretch of it that has a harbour. You should have one size in metres per candidate in your notes.", "uk": "Правило 1, розмір: місце має бути 0,5–3 км завширшки. Якщо суша більша, вибери з неї 1-кілометрову ділянку з гаванню. Має вийти: у нотатках для кожного кандидата є один розмір у метрах."}, {"en": "Rules 2 and 3: find a harbour or quay, a straight stone edge on the water, often with boats. Then find a second kind of place: a village on a slope, a lighthouse on a point or a valley of fields. You should be able to point at both on the map.", "uk": "Правила 2 і 3: знайди гавань або причал — пряму кам'яну кромку над водою, часто з човнами. Потім знайди другий тип місцевості: село на схилі, маяк на мисі чи долину з полями. Покажи обидва місця на мапі."}, {"en": "Rule 4, photos: open commons.wikimedia.org, a free library of photos with a licence on each. Search the place's name. You should see photo tiles; a link starting 'Category:' with 30 or more photos is a pass.", "uk": "Правило 4, фото: відкрий commons.wikimedia.org — безкоштовну бібліотеку фото, де в кожного є ліцензія. Знайди назву місця. З'являються плитки фото. Якщо є посилання, що починається з «Category:», і в ньому 30 або більше фото, правило виконано."}, {"en": "Choose the candidate that passes all four rules; if two pass, keep the one with more photos. Write its name and country at the top of a new file, references.md, in the day work folder. You should see your island's real place named.", "uk": "Вибери кандидата, який проходить усі чотири правила. Якщо таких двоє, лиши того, де більше фото. Створи у робочій папці дня новий файл references.md і впиши вгорі назву місця й країну. Має вийти: реальне місце твого острова названо."}], "play": {"en": "Place pitch: I pitch my chosen place to the tutor in 60 seconds. The tutor asks three hard questions: too big? enough photos? where is the second district? I answer each with a number or a fact from the map.", "uk": "Презентація місця: я за 60 секунд презентую тьютору вибране місце. Тьютор ставить три складні запитання: чи не завелике? чи вистачає фото? де другий район? На кожне я відповідаю числом або фактом із мапи."}, "video": {"search": "openstreetmap beginner guide how to use the map"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Вибір твого реального місця (Day 21, lesson 1 of 4). Today's build: Набір референсів для твого острова: одне реальне прибережне місце, osm_view.png із чотирма довжинами, 15 або більше фото з рядками авторства і references.md.\nWhat I already know: День 16: твій короткий список із двох-трьох прибережних місць-кандидатів і аркуш палітри з того, що подобається найбільше; День 20: твій куточок гавані — з нього видно, що потрібно справжній набережній.\n\nBy the end of this lesson I can:\n1. Пояснити, чому світ, побудований на реальному місці, виглядає правдоподібно: реальні місця дають справжні розміри, форми і причини.\n2. Перевіряти кожного кандидата з Дня 16 за чотирма правилами: розмір, сучасна набережна, другий тип місцевості й достатньо вільних фото.\n3. Оцінювати довжину на OpenStreetMap за шкалою масштабу. Шкала масштабу — це відрізок із підписаною довжиною в лівому нижньому куті мапи.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: Чотири тижні — і в тебе є набір для гавані з текстурами й зношеністю та освітлений куточок гавані 30 × 30 м, повністю твоєї роботи. Today: Сьогодні ти вибираєш одне справжнє місце на узбережжі для свого острова, вимірюєш його на OpenStreetMap і збираєш 15 чи більше фото з рядками авторства. One encouraging line: Кожен великий світ починається з дослідження, і сьогодні ти працюєш саме так, як професійні будівники світів перед початком роботи.); 2 lines on why today matters and where it comes back, in plain words (from this: Реальне місце дає розміри, яких не вигадаєш: яка ширина входу в гавань і як круто пагорб здіймається за містечком. Студії збирають фото-референси й мапи та вказують їхнє авторство ще до того, як хтось почне малювати. Потім кожен вибір звіряють із ними. Портфоліо з фото без авторства не можна показувати, тому рядки авторства починаються сьогодні. It comes back: Завтра твоя мапа візьме форму й довжини цього місця. У День 23 ключові фото визначать твої камери, а в День 45 і День 55 поруч із ними стануть скриншоти твоїх районів.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-21-real-place-references exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (перевірка місця і виміри на OpenStreetMap (разом з уроками)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Відкрий openstreetmap.org. Це безкоштовна мапа світу, яку роблять волонтери. Користуватися нею може кожен, хто вказує авторство. Введи свого першого кандидата з Дня 16 у поле Search угорі ліворуч і натисни . Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-21-real-place-references exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (перевірка місця і виміри на OpenStreetMap (разом з уроками)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Наблизь мапу так, щоб було видно все місце, трохи моря і шкалу масштабу. Натисни Win+Shift+S і обведи рамкою мапу. У Krita вибери Edit > Paste into New Image і збережи файл у Day21 як osm_measure.kra. Має вийти: мапа зі шкалою масштабу відкрита в Krita.\n   2. Вибери в Krita інструмент Measure (наведи мишу на значки панелі інструментів, щоб прочитати назви). У Tool Options постав одиниці Pixels. Протягни вздовж шкали масштабу й прочитай її довжину. Поділи метри шкали на її пікселі. Має вийти одне число, наприклад 300 м ÷ 150 px = 2 м на піксель.\n   3. Виміряй найдовшу вісь, вхід у гавань (де заходять човни), ряд будинків на набережній і відстань від берега до верхівки. Помнож кожну довжину на свої метри на піксель і запиши всі чотири в references.md. Для невеликого входу в гавань виходять десятки метрів.\n   4. Прочитай кольори на мапі Standard. Темно-зелений — ліс, блідо-зелений — трава, жовтий — пісок, сірий чи бежевий — забудова. Напиши по рядку про кожен, який є у твоєму місці. Тепер видно, де закінчується містечко й починається природа. [screenshot]\n   5. Наблизь найвищу точку: верхівку позначає маленький коричневий трикутник, часто з висотою. Трикутника немає? Відкрий opentopomap.org — ту саму мапу з горизонталями. Горизонталь — лінія, що з'єднує точки однакової висоти. Прочитай найвищу. Має вийти одна висота, яку ти записуєш.\n   6. Повернися в OpenStreetMap і перевір, чи кнопка Layers праворуч показує Standard. Клацни Share, під Image увімкни прапорець Set custom dimensions і обведи рамкою місце з частиною моря. Вибери PNG і клацни Download. Перейменуй файл на osm_view.png і перенеси в Day21. Має вийти: файл відкривається, на ньому все місце.\n   7. Відкрий credits.md у папці GAD на ПК. Якщо його ще немає, скопіюй туди credits-template.md із сьогоднішніх assets і перейменуй. Додай рядок: «osm_view.png: map data and image © OpenStreetMap contributors, https://www.openstreetmap.org/copyright». Має вийти: перший рядок авторства записано. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Вгадай масштаб: тьютор називає п'ять об'єктів мого місця (вхід у гавань, головну вулицю, пляж, відстань до верхівки, пірс). Я вгадую довжину кожного в метрах, а потім вимірюю в Krita. Похибка до 20 % — це бал. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; credits line = рядок авторства; reference photo / hero photo = фото-референс / ключове фото; comparison sheet, board (an image) = аркуш (аркуш порівняння, аркуш референсів); click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); File Explorer = Провідник; vertex / edge / face = вершина / ребро / грань; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; grey box placeholder = сірий блок (заглушка); material slot / node / pin = слот матеріалу / вузол / вхід; volume (PCG Volume, Post Process Volume) = об'єм; kit / kit piece / part of one object = набір / деталь / частина; map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; district / plot / plot plan = район / ділянка / план ділянки; harbour / quay / waterfront / pier = гавань / причал / набережна / пірс; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; summit, hilltop = верхівка; trim sheet / decal = трим-шит / декаль; wear / worn edges / salt line = зношеність / стерті краї / сольова лінія; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; hero shot = головний кадр (hero shot).\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}, {"title": {"en": "Reference photos you may use, and how to credit them", "uk": "Референсні фото, які можна використовувати, і як вказувати їхнє авторство"}, "minutes": 40, "goals": [{"en": "Explain a licence: the rules an author sets for their photo. Use public domain, CC0, CC BY and CC BY-SA. Skip NC (non-commercial only), ND (no changes allowed) and 'all rights reserved'.", "uk": "Пояснювати, що таке ліцензія: правила, які автор встановлює для свого фото. Брати public domain, CC0, CC BY і CC BY-SA. Пропускати NC (лише некомерційне використання), ND (змінювати не можна) і «all rights reserved»."}, {"en": "Find photos on Wikimedia Commons through a place's Category page and its subcategories.", "uk": "Знаходити фото на Wikimedia Commons через сторінку Category місця та її підкатегорії."}, {"en": "Credit every photo once in credits.md: its title, its author (the person who made it, not the uploader), its licence and its link.", "uk": "Вказувати авторство кожного фото один раз у credits.md: назва, автор (людина, яка зробила фото, а не та, що його завантажила), ліцензія і посилання."}], "doalong": [{"en": "On commons.wikimedia.org search your place's name and open its Category page. You should see subcategories at the top, such as 'Harbours of ...', and photo tiles below.", "uk": "На commons.wikimedia.org знайди назву свого місця й відкрий його сторінку Category. Угорі — підкатегорії, наприклад «Harbours of …», а нижче — плитки фото."}, {"en": "Click one photo. On its file page scroll down to the Summary and Licensing boxes. You should see the Author and a licence name such as 'CC BY-SA 4.0' or 'public domain'.", "uk": "Клацни одне фото. На сторінці файлу прокрути вниз до блоків Summary і Licensing. Там указано Author і назву ліцензії, наприклад «CC BY-SA 4.0» або «public domain»."}, {"en": "If the licence is one of the four allowed, copy the title, author, licence and the page's link into credits.md, in the template's format. You should see one full credit line.", "uk": "Якщо ліцензія — одна з чотирьох дозволених, скопіюй назву, автора, ліцензію і посилання на сторінку в credits.md, у форматі шаблону. Має вийти один повний рядок авторства."}, {"en": "Click Download above the photo and choose a large size, about 1920 px wide or more. Save it into Day21/references as 01_aerial_harbour.jpg. You should see the file with a clear name.", "uk": "Клацни Download над фото й вибери великий розмір, близько 1920 px завширшки або більше. Збережи його в Day21/references як 01_aerial_harbour.jpg. Має вийти: файл із зрозумілою назвою."}, {"en": "Read 'Checks before you hand in' at the end of credits-template.md. You should know that 'from Google' is never a source.", "uk": "Прочитай розділ «Checks before you hand in» («Перевірки перед здачею») у кінці credits-template.md. Головне правило: «з Google» ніколи не буває джерелом."}], "play": {"en": "Licence referee: the tutor reads me six made-up photo licences (CC BY, CC BY-NC, 'all rights reserved', public domain, CC BY-SA, none given). I say 'use' or 'skip' for each within 5 seconds, with the reason.", "uk": "Суддя ліцензій: тьютор зачитує мені шість вигаданих ліцензій на фото (CC BY, CC BY-NC, «all rights reserved», суспільне надбання, CC BY-SA, ліцензію не вказано). Я кажу «беру» або «пропускаю» для кожної за 5 секунд і пояснюю чому."}, "video": {"search": "how to credit wikimedia commons images attribution"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Референсні фото, які можна використовувати, і як вказувати їхнє авторство (Day 21, lesson 3 of 4). Today's build: Набір референсів для твого острова: одне реальне прибережне місце, osm_view.png із чотирма довжинами, 15 або більше фото з рядками авторства і references.md.\nWhat в/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; rubric = таблиця оцінювання; credits line = рядок авторства; reference photo / hero photo = фото-референс / ключове фото; comparison sheet, board (an image) = аркуш (аркуш порівняння, аркуш референсів); click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; icon / checkbox = значок / прапорець («познач», «зніми прапорець»); File Explorer = Провідник; vertex / edge / face = вершина / ребро / грань; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; kit / kit piece / part of one object = набір / деталь / частина; map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; district / plot / plot plan = район / ділянка / план ділянки; harbour / quay / waterfront / pier = гавань / причал / набережна / пірс; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; summit, hilltop = верхівка; trim sheet / decal = трим-шит / декаль; wear / worn edges / salt line = зношеність / стерті краї / сольова лінія; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}], "handin": [{"en": "summary.md", "uk": "summary.md (звіт дня)"}, {"en": "references.md: the place, four lengths, the photo table and the stars (→ Day 22)", "uk": "references.md (місце, чотири довжини, таблиця фото й зірочки) (→ День 22)"}, {"en": "osm_view.png (→ Day 22)", "uk": "osm_view.png (мапа місця) (→ День 22)"}, {"en": "Your 8 or more starred hero photos, as files from Day21\\references (→ Day 23)", "uk": "Твої 8 або більше ключових фото із зірочками, файлами з Day21\\references (→ День 23)"}], "goal": {"en": "By the end of today you have one real coastal place, measured on OpenStreetMap, with 15 or more credited photos listed in references.md.", "uk": "До кінця дня в тебе є одне реальне прибережне місце, виміряне на OpenStreetMap, і 15 або більше фото з рядками авторства, перелічені в references.md."}, "uses": [{"en": "Day 16: your shortlist of two or three candidate coastal places, and the palette sheet from your favourite", "uk": "День 16: твій короткий список із двох-трьох прибережних місць-кандидатів і аркуш палітри з того, що подобається найбільше"}, {"en": "Day 20: your harbour corner, which shows you what a real waterfront needs", "uk": "День 20: твій куточок гавані — з нього видно, що потрібно справжній набережній"}], "quiz": [{"q": {"en": "Your favourite place from Day 16 is a coastal city 12 km long. What do you do?", "uk": "Твоє улюблене місце з Дня 16 — прибережне місто завдовжки 12 км. Що ти робиш?"}, "options": [{"en": "Drop it at once.", "uk": "Одразу відкидаю його."}, {"en": "Shrink the whole city to 1 km on your map.", "uk": "Зменшую все місто до 1 км на мапі."}, {"en": "Pick a 1 km stretch of its coast that has a harbour and a second character.", "uk": "Вибираю 1-кілометрову ділянку узбережжя, де є гавань і другий тип місцевості."}, {"en": "Use the whole city: bigger is better.", "uk": "Беру все місто: що більше, то краще."}], "answer": 2, "explain": {"en": "The island is 0.9 to 1.2 km across, so a 1 km stretch keeps real sizes. Shrinking a whole city makes its streets and houses far too small.", "uk": "Острів має від 0,9 до 1,2 км завширшки, тож 1-кілометрова ділянка зберігає реальні розміри. Якщо зменшити все місто, його вулиці й будинки стануть надто малими."}}, {"q": {"en": "Which of these photo licences can you NOT use in this course?", "uk": "Яку з цих ліцензій на фото НЕ можна використовувати в цьому курсі?"}, "options": [{"en": "CC BY-SA 4.0", "uk": "CC BY-SA 4.0"}, {"en": "Public domain", "uk": "Суспільне надбання"}, {"en": "CC BY-NC 2.0", "uk": "CC BY-NC 2.0"}, {"en": "CC BY 3.0", "uk": "CC BY 3.0"}], "answer": 2, "explain": {"en": "NC means non-commercial only. Your portfolio is professional work, so the course skips NC photos.", "uk": "NC означає лише некомерційне використання. Твоє портфоліо — це професійна робота, тому курс пропускає фото з NC."}}, {"q": {"en": "A photo's page says 'Uploaded by MapFan22' and 'Author: Ana Kovač'. Whose name goes in credits.md?", "uk": "На сторінці фото написано «Uploaded by MapFan22» і «Author: Ana Kovač». Чиє ім'я йде в credits.md?"}, "options": [{"en": "Ana Kovač, the author.", "uk": "Ana Kovač, авторка."}, {"en": "MapFan22, the uploader.", "uk": "MapFan22, той, хто завантажив."}, {"en": "Nobody: Commons photos are free.", "uk": "Нічиє: фото з Commons безкоштовні."}, {"en": "Wikimedia Commons.", "uk": "Wikimedia Commons."}], "answer": 0, "explain": {"en": "You credit the person who made the photo. The uploader only put it online.", "uk": "Ти вказуєш людину, яка зробила фото. Той, хто завантажив, лише виклав його в мережу."}}, {"q": {"en": "In one of your photos a harbour building has 4 storeys. About how tall is it?", "uk": "На одному з твоїх фото будівля в гавані має 4 поверхи. Яка її приблизна висота?"}, "options": [{"en": "About 6 m", "uk": "Близько 6 м"}, {"en": "About 12 m", "uk": "Близько 12 м"}, {"en": "About 25 m", "uk": "Близько 25 м"}, {"en": "About 40 m", "uk": "Близько 40 м"}], "answer": 1, "explain": {"en": "A storey is about 3 m, so 4 storeys are about 12 m. Storeys, doors and people are your scale clues.", "uk": "Поверх — це близько 3 м, тож 4 поверхи — близько 12 м. Поверхи, двері й люди — твої підказки масштабу."}}, {"q": {"en": "Why do you mark hero photos today, weeks before you build the districts?", "uk": "Навіщо позначати ключові фото сьогодні, за кілька тижнів до того, як ти будуєш райони?"}, "options": [{"en": "They are the only photos you may use.", "uk": "Тільки їх і можна використовувати."}, {"en": "They decide the island's size.", "uk": "Вони визначають розмір острова."}, {"en": "The tutor grades only hero photos.", "uk": "Тьютор оцінює лише ключові фото."}, {"en": "Your final screenshots will stand beside them, so you plan those views from the start.", "uk": "Поруч із ними стоятимуть твої фінальні скриншоти, тож ці види плануєш від самого початку."}], "answer": 3, "explain": {"en": "The finish line puts five screenshots per district beside matching real photos. When you know those photos now, you plan your map and cameras for them.", "uk": "На фініші курсу по п'ять скриншотів кожного району стоятимуть поруч із відповідними реальними фото. Коли знаєш ці фото вже зараз, плануєш під них мапу й камери."}}], "weekInfo": {"week": 5, "title": {"en": "Your real place and your island on paper", "uk": "Твоє реальне місце і твій острів на папері"}, "goal": {"en": "By Friday you have a complete planning pack: one real coastal place with 15 credited photos, island_map.png to scale with two red 200 x 200 m districts and the scenic route, two counted plot plans, two needs lists, reviewed free packs, and the Electric Dreams download under way.", "uk": "До п'ятниці в тебе є повний пакет планування: одне реальне прибережне місце з 15 фото з рядками авторства; island_map.png у масштабі з двома червоними районами 200 × 200 м і мальовничим маршрутом; два плани ділянок із підрахованими об'єктами; два списки потреб; оглянуті безкоштовні паки. Завантаження Electric Dreams уже триває."}, "skills": [{"en": "Reference research and image licensing (Creative Commons) for production art", "uk": "Пошук референсів і ліцензування зображень (Creative Commons) для продакшн-арту"}, {"en": "Scaled world maps from OpenStreetMap data, with districts, roads and flight routes", "uk": "Мапи світу в масштабі за даними OpenStreetMap: райони, дороги й маршрути польотів"}, {"en": "Plot plans with item counts, camera positions and drone lanes for level layout", "uk": "Плани ділянок із підрахунком об'єктів, позиціями камер і польотними коридорами для планування рівня"}, {"en": "Asset sourcing: needs lists, Fab licence checks and best-pieces reviews", "uk": "Пошук асетів: списки потреб, перевірка ліцензій на Fab і огляд найкращих деталей паків"}, {"en": "Pre-production review: consistency checks and a one-page planning board", "uk": "Перевірка планів перед виробництвом (препродакшн): узгоджені числа й аркуш планування на одну сторінку"}]}, "morning": {"sofar": {"en": "In four weeks you have built a harbour kit, given it textures and wear, and lit a 30 x 30 m harbour corner made entirely from your own work.", "uk": "Чотири тижні — і в тебе є набір для гавані з текстурами й зношеністю та освітлений куточок гавані 30 × 30 м, повністю твоєї роботи."}, "today": {"en": "You choose one real coastal place for your island, measure it on OpenStreetMap, and collect 15 or more credited photos.", "uk": "Сьогодні ти вибираєш одне справжнє місце на узбережжі для свого острова, вимірюєш його на OpenStreetMap і збираєш 15 чи більше фото з рядками авторства."}, "cheer": {"en": "Every great world begins with research, and today you work exactly the way professional world builders do before they build.", "uk": "Кожен великий світ починається з дослідження, і сьогодні ти працюєш саме так, як професійні будівники світів перед початком роботи."}, "quote": {"text": {"en": "Research is formalized curiosity. It is poking and prying with a purpose.", "uk": "Дослідження — це впорядкована цікавість. Це допитливе нишпорення з певною метою."}, "author": {"en": "Zora Neale Hurston", "uk": "Зора Ніл Герстон"}, "source": "https://en.wikiquote.org/wiki/Zora_Neale_Hurston"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-21-real-place-references", "mapHref": "../../COURSE.html", "prevHref": "../Day-20-boss-harbour-corner/START-HERE.html", "nextHref": "../Day-22-island-map-to-scale/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in A web browser (OpenStreetMap and Wikimedia Commons) and Krita. I am a beginner on Day 21. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me and don't write code.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: 15 фото з рядками авторства, тегами й зірочками на ключових фото — самостійно.\nIt's part of: Набір референсів для твого острова: одне реальне прибережне місце, osm_view.png із чотирма довжинами, 15 або більше фото з рядками авторства і references.md (Сучасний невеликий острів чи прибережне містечко завширшки 0,5–3 км або 1-кілометрова ділянка довшого узбережжя. Там є гавань і другий тип місцевості: село на схилі, мис із маяком або долина з полями. Усе зберігай у робочій папці дня (Day21), а фото — в її підпапці references. Файл credits.md лежить у папці GAD на ПК, на рівень вище за робочу папку дня.).\nWhy it matters: Реальне місце дає розміри, яких не вигадаєш: яка ширина входу в гавань і як круто пагорб здіймається за містечком. Студії збирають фото-референси й мапи та вказують їхнє авторство ще до того, як хтось почне малювати. Потім кожен вибір звіряють із ними. Портфоліо з фото без авторства не можна показувати, тому рядки авторства починаються сьогодні. It comes back: Завтра твоя мапа візьме форму й довжини цього місця. У День 23 ключові фото визначать твої камери, а в День 45 і День 55 поруч із ними стануть скриншоти твоїх районів.\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-21-real-place-references (on the drive I chose on Day 0).\nWhat I already know: День 16: твій короткий список із двох-трьох прибережних місць-кандидатів і аркуш палітри з того, що подобається найбільше; День 20: твій куточок гавані — з нього видно, що потрібно справжній набережній; today's lessons: Вибір твого реального місця; Читаємо твоє місце на OpenStreetMap; Референсні фото, які можна використовувати, і як вказувати їхнє авторство; Читаємо фото, як будівник світу. Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- references.md, частина 1 «Місце» (The place): назва й країна, найдовша вісь у метрах і висота найвищої точки в метрах. Додай, чому місце підходить (набережна і другий тип місцевості), і три речі, які ти запозичиш. Наприклад, білі будинки, що піднімаються на пагорб.\n- osm_view.png — зображення всього місця з OpenStreetMap, навколо трохи моря. Запиши в references.md чотири довжини в метрах: найдовша вісь, вхід у гавань, ряд будинків на набережній і відстань від берега до верхівки.\n- 15 або більше фото в Day21/references, названих за номером і сюжетом (01_aerial_harbour.jpg, 02_quay.jpg …). Склад: 2 види згори, 5 набережної, 4 другого типу місцевості, 2 узбережжя, 1 рослин і 1 кольору води.\n- references.md, частина 2 «Фото» (The photos): по рядку на кожне фото — назва файлу, що на ньому, тег і одна підказка масштабу. Теги: район 1, район 2, узбережжя, рослини, вода або колір. Підказки масштабу: двері, людина, автомобіль або поверх.\n- credits.md — твій файл на весь курс у папці GAD на ПК. У ньому по рядку на кожне фото (назва, автор, ліцензія, посилання) і один рядок для мапи. Беремо лише фото з ліцензіями public domain (суспільне надбання), CC0, CC BY або CC BY-SA.\n- Ключові фото, позначені зірочкою в references.md: 5 набережної і 3–4 другого типу місцевості. Біля кожного запиши, з якої висоти, на твою думку, його знято. Поруч із цими фото стоятимуть твої фінальні скриншоти.\n\nMy checklist (the same numbers show on my course page):\n1. Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: references.md, osm_measure.kra, osm_view.png і твоє перше фото. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Потім перевір своїх кандидатів із Дня 16 за чотирма правилами й вибери одне місце. Перевірка: місце вибрано, і ти можеш назвати його найдовшу вісь у метрах. (from lesson 1)\n2. Напиши частину 1 файлу references.md, «Місце»: назва й країна, найдовша вісь, чому місце підходить, і три речі, які ти запозичиш. Перевірка: кожен розмір — число в метрах, ніде не «велике» чи «мале». (from lesson 1)\n3. В osm_measure.kra спершу виміряй шкалу масштабу. Потім виміряй вхід у гавань, ряд будинків на набережній і відс /* fix phase 1 (2026-10-22): the hand-in folder (a button when the roster has a link, else the folder path), the hand-in card,
   Day 0's "Before lesson 1", the checks before handing in, the Questions card, and the day report with the pasted lesson summaries */
const HIN=(D.handin||[]).map(v=>(v&&v.en)||(typeof v==='string'?v:'')).join(' ').toLowerCase(),hasClip=/\.mp4|clip/.test(HIN);
function hItem(v){return x(v)}
function hList(){return '<ul class="ticks">'+(D.handin||[]).map(v=>'<li>'+lk(hItem(v))+'</li>').join('')+'</ul>'}
const NFILES=new Set((HIN.match(/[\w-]+\.(?:blend|glb|fbx|png|jpe?g|md|txt|mp4|csv|zip|pdf|webp|kra|psd|tga|exr|json|py|uasset|umap)\b/g)||[])).size;
function nFiles(n){if(!n)return '';if(lang==='en')return ' · '+n+(n===1?' file':' files');const a=n%10,b=n%100;return ' · '+n+' '+(a===1&&b!==11?'файл':a>=2&&a<=4&&(b<12||b>14)?'файли':'файлів')}
function hf(){return D.handinUrl?'<div class="row"><a class="btn s" href="'+esc(D.handinUrl)+'" target="_blank" rel="noopener">'+ic('folder')+u('hOpen')+'</a></div>':'<p class="path">'+ic('folder')+'<span>'+u('hPath')+' <code>'+esc(D.workPath)+'</code></span></p>'}
function handinCard(){if(!D.handin||!D.handin.length)return '';return '<section class="card glass handin">'+lab(u('hTitle')+nFiles(NFILES),'ok')+hList()+hf()+'<p class="muted" style="margin:12px 0 0">'+u('hNote')+'</p></section>'}
function beforeCard(){if(!D.before||!D.before.length)return '';return '<section class="card glass before">'+lab(u('before'),'gold')+list(D.before,'ol','steps')+'</section>'}
function chkList(){const a=[];if(HIN.indexOf('.blend')>=0)a.push('chk1');if(/\.(glb|fbx)\b/.test(HIN))a.push('chk2');a.push('chk3');if(hasClip)a.push('chk4');return '<h3>'+u('chk')+'</h3><ol class="steps">'+a.map(k=>'<li>'+u(k)+'</li>').join('')+'</ol>'}
function qCard(){return '<section class="card glass qcard">'+lab(u('qTitle'))+'<ul class="ticks"><li>'+u('q1')+'</li><li>'+u('q2')+'</li><li>'+u('q3')+'</li></ul></section>'}
function reportText(){let t=D.reportPrompt;const r=D.lessons.map((l,i)=>{const v=(st['r'+i]||'').trim();return v?'Lesson '+(i+1)+': '+v:''}).filter(Boolean);
 if(r.length)t+='\n\nMy lesson summaries, pasted from my course page:\n'+r.join('\n');
 if(st.qs1)t+='\nMy first score in the Check yourself quiz: '+st.qs1[0]+' of '+st.qs1[1]+'.';
 return t}
function qDone(){return D.quiz&&D.quiz.length&&st.qa&&D.quiz.every((q,i)=>st.qa[i]!=null)}
function prog(){const Q=(D.quiz&&D.quiz.length)?1:0,L=D.lessons.length,C=D.build.steps.length;let n=0;D.lessons.forEach((l,i)=>{if(st['q'+i])n++});D.build.steps.forEach((s,i)=>{if(st['c'+i])n++});if(Q&&qDone())n++;return (L+C+Q)?n/(L+C+Q):0}
function qScore(){let n=0;D.quiz.forEach((q,i)=>{if((st.qa||{})[i]===q.answer)n++});return n}
function pick(i,k){st.qa=st.qa||{};if(st.qa[i]!=null)return;st.qa[i]=k;if(qDone()){st.qs=[qScore(),D.quiz.length];if(!st.qs1)st.qs1=st.qs.slice()}save();render();const e=document.getElementById('e'+i);if(e)e.focus({preventScroll:true})}
function retry(){st.qa={};delete st.qs;save();render();const e=document.getElementById('o0_0');if(e)e.focus()}
const isBoss=!!(D.build&&D.build.boss&&D.build.boss.length),isFin=D.day===D.total;
document.body.className=isFin?'fin':isBoss?'boss':'';
const lk=s=>esc(s).replace(/https?:\/\/[^\s<']*[^\s<.,;:)']/g,m=>'<a href="'+m+'" target="_blank" rel="noopener">'+m+'</a>');
function list(a,tag,cls){return '<'+tag+(cls?' class="'+cls+'"':'')+'>'+(a||[]).map(i=>'<li>'+lk(x(i))+'</li>').join('')+'</'+tag+'>'}
const lab=(t,k)=>'<div class="lab'+(k?' k-'+k:'')+'"><span class="dotc"></span>'+t+'</div>';
const kn=n=>'<span class="kn">'+ic(n)+'</span>';
const slider=p=>'<div class="slider"><i style="width:calc('+p+'% - 6px)"></i><b style="left:clamp(13px,'+p+'%,calc(100% - 13px))"></b></div>';
function quiz(){if(!D.quiz||!D.quiz.length)return '';const a=st.qa||{};let ok=0;const L=u('letters');
 const pips='<div class="pips well" aria-hidden="true">'+D.quiz.map((q,i)=>'<i class="'+(a[i]==null?'':a[i]===q.answer?'r':'w')+'"></i>').join('')+'</div>';
 const qs=D.quiz.map((q,i)=>{const c=a[i];if(c===q.answer)ok++;return '<div class="qz"><p class="qq"><span class="qn">'+(i+1)+'</span><span>'+lk(x(q.q))+'</span></p>'+q.options.map((o,k)=>{let cls='opt',mk='<span></span>';if(c!=null){if(k===q.answer){cls+=' right';mk=ic('check','mk')}else if(k===c){cls+=' wrong';mk=ic('x','mk')}}return '<button class="'+cls+'" id="o'+i+'_'+k+'"'+(c!=null?' disabled':'')+' onclick="pick('+i+','+k+')"><span class="lt">'+(L[k]||k+1)+'</span><span>'+esc(x(o))+'</span>'+mk+'</button>'}).join('')+(c!=null?'<p class="exp '+(c===q.answer?'r':'w')+'" id="e'+i+'" tabindex="-1"><b>'+(c===q.answer?u('right'):u('wrong'))+'</b>'+lk(x(q.explain))+'</p>':'')+'</div>'}).join('');
 return '<section class="card glass quiz">'+lab(u('quiz'),'gold')+'<p class="muted" style="margin:-6px 0 14px">'+u('quizSub')+'</p>'+pips+qs+(qDone()?'<div class="score well" role="status"><span class="eyebrow">'+u('score')+'</span><span class="lcd" aria-label="'+ok+' / '+D.quiz.length+'">'+seg(ok+'/'+D.quiz.length)+'</span>'+(st.qs1?'<span class="muted">'+u('first')+': '+st.qs1[0]+'/'+st.qs1[1]+'</span>':'')+'<div class="row"><button class="btn ghost" id="retry" onclick="retry()">'+u('retry')+'</button></div></div>':'')+'</section>'}
function vid(v){if(!v)return '';const link=v.url?'<a href="'+esc(v.url)+'" target="_blank" rel="noopener">'+esc(x(v.title)||v.url)+'</a>'+(v.channel?' <span class="muted">· '+esc(v.channel)+(v.length?' · '+esc(v.length):'')+'</span>':''):'';const s=v.search?'<a href="https://www.youtube.com/results?search_query='+encodeURIComponent(v.search)+'" target="_blank" rel="noopener">'+u('noVid')+': '+esc(v.search)+'</a>':'';const alt=v.alt&&v.alt.url?'<br><span class="eyebrow">UA</span> <a href="'+esc(v.alt.url)+'" target="_blank" rel="noopener">'+esc(v.alt.title||v.alt.url)+'</a>'+(v.alt.channel?' <span class="muted">· '+esc(v.alt.channel)+'</span>':''):'';return '<div class="vid well">'+kn('play')+'<div><b>'+u('more')+'?</b><br>'+(link||s)+alt+(link&&s?'<br><span class="muted" style="font-size:14px">'+s+'</span>':'')+'</div></div>'}
function morning(){const m=D.morning;if(!m)return '';const q=m.quote||{};
 let shelf='';if(D.day>0){shelf='<div class="shelf" aria-hidden="true">';let g='';for(let d=0;d<D.day;d++){let p=0;try{p=(JSON.parse(localStorage.getItem('devteam:'+D.learner+':'+d))||{}).pct||0}catch(e){}g+='<i class="'+(p>=1?'d':'')+(d>0&&d%5===0?' bs':'')+'"></i>';if(d%5===0||d===D.day-1){shelf+='<span class="wkg">'+g+'</span>';g=''}}shelf+='</div>'}
 const qt=lang==='uk'&&q.original?q.original:x(q.text);
 return '<section class="card glass morning"><div class="mgrid">'+(m.sofar?'<div>'+lab(u('sofar'),'gold')+shelf+'<p class="mtxt">'+lk(x(m.sofar))+'</p></div>':'')+(m.today?'<div>'+lab(u('todayL'))+'<p class="mtxt">'+lk(x(m.today))+'</p></div>':'')+'</div>'+(m.cheer?'<p class="cheer">'+esc(x(m.cheer))+'</p>':'')+(qt?'<figure class="quote well">'+kn('quote')+'<blockquote>'+esc(qt)+'</blockquote>'+(q.author?'<figcaption>'+esc(x(q.author))+'</figcaption>':'')+'</figure>':'')+'</section>'}
function setLang(l){lang=l;try{localStorage.setItem('devteam:lang',lang)}catch(e){};render()}
function toggleLang(){setLang(lang==='uk'?'en':'uk')}
/* keep open sections and keyboard focus across re-renders */
const openD=new Set();
function tg(e){if(e.open)openD.add(e.id);else openD.delete(e.id)}
const op=id=>openD.has(id)?' open':'';
function render(){const ae=document.activeElement,fid=ae&&(ae.id||(ae.getAttribute('data-th')?'th-'+ae.getAttribute('data-th'):ae.getAttribute('lang')&&ae.closest('.seg')?'lg-'+ae.getAttribute('lang'):''));
 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);
 const b=D.build,P=Math.round(prog()*100);
 document.getElementById('top').innerHTML='<div class="topin glass"><a class="maplink" href="'+esc(D.mapHref)+'">'+kn('map')+u('map')+'</a><div class="crumb"><b>'+esc(x(D.learnerName))+'</b><span>'+u('week')+' '+D.week+'</span><span>'+u('day')+' '+D.day+' '+u('of')+' '+D.total+'</span></div>'+controls(lang,'setLang')+'</div><div class="tline"><i style="width:'+P+'%"></i></div>';
 const state=w=>w<D.week?'b':w===D.week?'n':'p';
 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 let wk='';if(D.weekInfo){const w=D.weekInfo;wk='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}
 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p>'+(b.next?'<div class="back well">'+kn('arrow')+'<div><b>'+u('comes')+'</b><br>'+lk(x(b.next))+'</div></div>':'')+'<div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.assetFiles&&D.assetFiles.length?'<p class="files">'+ic('folder')+'<span>'+u('filesL')+' '+D.assetFiles.map(f=>'<a href="assets/'+encodeURIComponent(f)+'" target="_blank" rel="noopener">'+esc(f)+'</a>').join(', ')+'</span></p>':D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+=handinCard();h+=beforeCard();
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div><label class="rcpt" for="r'+i+'"><span class="eyebrow">'+u('rcpt')+'</span><textarea id="r'+i+'" rows="2" placeholder="'+esc(u('rcptPh'))+'" oninput="st.r'+i+'=this.value;save()">'+esc(st['r'+i]||'')+'</textarea></label>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+hList()+chkList()+(hasClip?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<h3>1 · '+u('copyR')+'</h3><p class="muted">'+u('report')+'</p><div class="row"><button class="btn ghost" onclick="cp(reportText())">'+ic('copy')+u('copyR')+'</button></div><h3>2 · '+u('ship')+'</h3>'+hf()+'<p class="muted" style="margin:12px 0 0">'+u('hNote')+'</p></section>';
 h+=qCard();h+=wk;
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();
</script>

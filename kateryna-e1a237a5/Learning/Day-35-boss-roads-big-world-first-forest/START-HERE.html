<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 35</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

nd: one whole valley your map shows as forest (about 300 x 200 m or more), outside both districts. Shots: CAM_Week7_1 on the switchback at 30 m, CAM_Week7_2 on the valley at 60 m with a landmark, and CAM_Week7_3 on the island at 200 m.", "uk": "L_Island: одна ціла долина, позначена на мапі як ліс (приблизно 300 × 200 м або більше), поза обома районами. Кадри: CAM_Week7_1 — серпантин з 30 м, CAM_Week7_2 — долина з 60 м з орієнтиром, CAM_Week7_3 — острів з 200 м."}, "spec": [{"en": "The valley forest: two or three forest boxes turned and scaled to the valley's shape, together covering it (light route: copies of your PCG_ForestLite volume). No trees on a road, in the river or inside a district square. The changed settings and seeds are in boss_day35.md, and the forest is on DL_Forest.", "uk": "Ліс у долині: дві-три рамки лісу, повернуті й масштабовані під форму долини, разом її вкривають (у полегшеному варіанті — копії твого об'єму PCG_ForestLite). Жодного дерева на дорозі, у річці чи в квадраті району. Змінені налаштування й значення Seed записано в boss_day35.md, а ліс лежить на DL_Forest."}, {"en": "Roads checked: every leg under 10 %, no lumps or floating edges at 10 m.", "uk": "Дороги перевірено: кожен відрізок має ухил менше 10 %, а з 10 м не видно ні горбів, ні країв, що висять."}, {"en": "The island light recipe applied and the exposure locked.", "uk": "Рецепт острівного світла застосований, експозиція зафіксована."}, {"en": "HLODs rebuilt after the forest; the valley still shows from 800 m out at sea in Play.", "uk": "HLOD перебудовано після лісу. У Play долину видно з моря за 800 м."}, {"en": "Three locked Cine Cameras, CAM_Week7_1 to CAM_Week7_3, with a HighResShot 1920x1080 from each, in boss_board_day35.png beside matching reference photos.", "uk": "Три заблоковані Cine Camera, CAM_Week7_1–CAM_Week7_3, з кожної — HighResShot 1920x1080. Кадри лежать в boss_board_day35.png поруч із відповідними фото-референсами."}, {"en": "stat unit at CAM_Week7_3 written down (Frame and GPU). A 30 to 60 second flight over the road and the valley in Play, under 50 MB.", "uk": "Показники stat unit на CAM_Week7_3 записано (Frame і GPU). Проліт над дорогою й долиною в Play на 30–60 секунд, менше 50 МБ."}], "piece1": "the valley forest (shared with the lessons)", "piece2": {"en": "The checks, the shots and the flight, timed (tiers)", "uk": "Перевірки, кадри й проліт на час (медалі)"}, "steps": [{"text": {"en": "Check: the files from today's lessons are in the day work folder (boss_day35.md with your plan, and before_day35.png). Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it. Then start the clock. Check: the plan fits in 4 hours.", "uk": "Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: boss_day35.md з планом і before_day35.png. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Потім запусти таймер. Перевірка: план вкладається в 4 години."}, "lesson": 1}, {"text": {"en": "Fly every road at 10 m; fix any leg over 10 % and any lump or floating edge. Check: road_grades.md is up to date and no road edge floats.", "uk": "Пролети кожною дорогою на висоті 10 м. Виправ кожен відрізок з ухилом понад 10 % і кожен горб чи край, що висить. Перевірка: road_grades.md оновлено, і жоден край дороги не висить."}, "lesson": "D31.4"}, {"text": {"en": "Choose the forest valley on island_map.png and mark the roads, river and district squares that cross or touch it. Check: the valley is outlined and its no-tree areas are marked.", "uk": "Вибери лісову долину на island_map.png. Познач дороги, річку й квадрати районів, які її перетинають або торкаються. Перевірка: долину обведено, а місця без дерев позначено."}, "lesson": 2}, {"text": {"en": "Move your test forest into the valley and add boxes (Alt+drag) until it is covered, each turned and scaled to fit. On the light route, copy your PCG_ForestLite volume instead. Check: from 150 m the forest follows the valley's shape, not a square.", "uk": "Перенеси тестовий ліс у долину й додавай рамки (Alt+перетягування), доки не вкриєш її. Кожну поверни й масштабуй під форму долини. У полегшеному варіанті натомість копіюй свій об'єм PCG_ForestLite. Перевірка: з 150 м ліс іде за формою долини, а не квадратом."}, "lesson": 2}, {"text": {"en": "Keep the road, river and districts clear: split boxes on either side of the road and shrink any box that touches a district; Generate. Check: no trunk stands on a road, in the river or inside a district square.", "uk": "Звільни дорогу, річку й райони: розділи рамки по обидва боки дороги й зменш кожну, що торкається району. Клацни Generate. Перевірка: жоден стовбур не стоїть на дорозі, у річці чи в квадраті району."}, "lesson": 2}, {"text": {"en": "Retune for the valley: density, clearings and a seed, one change at a time, and write the values. Weak PC: use fewer boxes and Trees Density at half (see Weak PC in ACCOUNTS-AND-INSTALLS.html). Check: clumps and clearings show from 60 m, with no rows.", "uk": "Переналаштуй ліс під долину: густоту, галявини й Seed, по одній зміні за раз. Запиши значення. Слабкий ПК: менше рамок і Trees Density удвічі менша (див. розділ «Слабкий ПК» на сторінці ACCOUNTS-AND-INSTALLS.html). Перевірка: з 60 м видно куртини й галявини, а рядів немає."}, "lesson": "D34.4"}, {"text": {"en": "Apply the light recipe and confirm the exposure lock. Rebuild the HLODs (Build > Build HLODs) with the ranges in world_notes.md. Check: in Play the valley still shows from 800 m out at sea.", "uk": "Застосуй рецепт світла й переконайся, що експозицію зафіксовано. Перебудуй HLOD (Build > Build HLODs) з дальностями з world_notes.md. Перевірка: у Play долину видно з моря за 800 м."}, "lesson": "D33.4"}, {"text": {"en": "Place, set and lock CAM_Week7_1, CAM_Week7_2 and CAM_Week7_3, and take a HighResShot from each. Check: three 1920 x 1080 files named island_week7_1.png to island_week7_3.png.", "uk": "Постав, налаштуй і заблокуй CAM_Week7_1, CAM_Week7_2 і CAM_Week7_3. Зроби HighResShot з кожної. Перевірка: три файли 1920 × 1080 з назвами island_week7_1.png–island_week7_3.png."}, "lesson": 3}, {"text": {"en": "Make boss_board_day35.png: each shot beside a reference photo of a similar view. Check: three labelled pairs.", "uk": "Зроби boss_board_day35.png: кожен кадр поруч із фото-референсом схожого виду. Перевірка: три підписані пари."}, "lesson": 3}, {"text": {"en": "Pilot CAM_Week7_3 and read stat unit; write Frame and GPU in boss_day35.md. Then fly the road and the valley in Play and record 30 to 60 seconds (Win+Alt+R) as clip_day35.mp4. Check: the clip is under 50 MB in File Explorer; if not, record 30 seconds.", "uk": "Перейди в CAM_Week7_3 командою Pilot і зчитай stat unit. Запиши Frame і GPU в boss_day35.md. Потім пролети над дорогою й долиною в Play і запиши 30–60 секунд (Win+Alt+R) як clip_day35.mp4. Перевірка: у Провіднику (File Explorer) кліп менший за 50 МБ. Якщо ні, запиши 30 секунд."}, "lesson": 3}, {"text": {"en": "Score yourself with the rubric, then ask the tutor for see-why-fix notes. Write both, your decision, your tier and your real time in self_review_day35.md. Check: five scores, three notes and one decision.", "uk": "Оціни себе за таблицею оцінювання, потім попроси тьютора про нотатки «бачу, чому, як виправити». Запиши в self_review_day35.md оцінки, нотатки, своє рішення, свою медаль і реальний час. Перевірка: п'ять оцінок, три нотатки й одне рішення."}, "lesson": 4}, {"text": {"en": "Choose File > Save All in Unreal. Report and hand-in: click Copy the day report at the bottom of the page, paste it into a new chat and answer. Open summary.md in Notepad, press Ctrl+End, paste the answer and press Ctrl+S. Then drag the files on the Hand in list into your hand-in folder. Check: the level tab shows no * mark, and every name shows in the folder, each with a size.", "uk": "В Unreal вибери File > Save All. Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: на вкладці рівня немає позначки *, а кожна назва зі списку є в папці, у кожної є розмір."}, "lesson": 4}], "boss": [{"en": "Bronze: the valley forest is generated and clear of roads, river and districts, and the roads are checked. You have three locked shots, the board and a 30 to 60 second flight, inside 4 hours.", "uk": "Бронза: ліс у долині згенеровано, він не заходить на дороги, річку й райони, а дороги перевірено. Є три кадри із заблокованих камер, аркуш і проліт на 30–60 секунд — усе за 4 години."}, {"en": "Silver: the forest follows the valley with clumps and clearings and no rows from 60 m. Every road leg is under 10 % with no floating edge, and the valley shows from 800 m out at sea in Play.", "uk": "Срібло: з 60 м ліс іде за формою долини, з куртинами й галявинами, без рядів. Кожен відрізок дороги має ухил менше 10 % і жодного краю, що висить. У Play долину видно з моря за 800 м."}, {"en": "Gold: each shot reads as a real island in a 3-second look beside its photo, and you finish inside 3 hours. Add one stretch: a second lane to your other district (every leg under 10 %), or one more breakdown level. Read ElectricDreams_PCGLargeAssembly or ElectricDreams_PCGSplineExample with IslandCourse closed, and add two lines to pcg_study.md.", "uk": "Золото: поруч зі своїм фото кожен кадр за 3 секунди читається як справжній острів, а все готово за 3 години. Додай одне завдання понад план: другу вузьку дорогу до іншого району (кожен відрізок менше 10 %) або ще один рівень-розбір. Відкривай ElectricDreams_PCGLargeAssembly чи ElectricDreams_PCGSplineExample лише із закритим IslandCourse і допиши два рядки в pcg_study.md."}], "assets": ["island12/art-director-notes.md", "island12/picture-brief-standard.md"]}, "lessons": [{"title": {"en": "Boss briefing: the plan and the checklist (micro-lesson)", "uk": "Брифінг перед Днем боса: план і чек-лист (мікроурок)"}, "minutes": 20, "goals": [{"en": "Plan a timed build: the biggest risk first (the forest), the checks next, the shots and the flight last.", "uk": "Планувати роботу на час: найбільший ризик першим (ліс), далі перевірки, а кадри й проліт наостанок."}, {"en": "Use a checklist so nothing is forgotten: roads, light, Data Layers, HLODs, forest, shots, flight, review.", "uk": "Користуватися чек-листом, щоб нічого не забути: дороги, світло, шари даних, HLOD, ліс, кадри, проліт, огляд."}, {"en": "Explain the tiers: Bronze is complete, Silver is right, Gold is fast and beautiful.", "uk": "Пояснювати медалі: Бронза — усе зроблено, Срібло — зроблено правильно, Золото — швидко й гарно."}], "doalong": [{"en": "Open boss_day35.md and copy in the build steps as a checklist, each with a time. You see a plan that adds up to under 4 hours.", "uk": "Відкрий boss_day35.md і скопіюй туди кроки самостійної роботи як чек-лист, біля кожного — час. Має вийти: план, що разом займає менше 4 годин."}, {"en": "Pilot the Day 32 vista camera that sees your forest valley and take a HighResShot; rename it before_day35.png. You see today's 'before' saved.", "uk": "Перейди командою Pilot у камеру панорами з Дня 32, яка бачить твою лісову долину, і зроби HighResShot. Перейменуй файл на before_day35.png. Має вийти: сьогоднішній кадр «до» збережено."}, {"en": "Paste your plan into the tutor chat and ask it to act as a studio producer and cut anything that won't fit. You see a plan you can finish.", "uk": "Встав свій план у чат із тьютором і попроси його виступити продюсером студії й викреслити все, що не вміститься. Має вийти: план, який реально завершити."}], "play": {"en": "Producer: the tutor plays a studio producer; I defend my plan line by line, and it cuts the weakest line each round.", "uk": "Продюсер: тьютор грає продюсера студії. Я захищаю свій план рядок за рядком, а він щораунду викреслює найслабший рядок."}, "video": {"url": "https://www.youtube.com/watch?v=EEf07ggFWRw", "title": "Building Open Worlds in Unreal Engine 5 | Unreal Fest 2022", "channel": "Unreal Engine", "length": "49:41", "search": "building open worlds unreal engine 5 unreal fest"}, "prompt": "You are my tutor for one 20-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Брифінг перед Днем боса: план і чек-лист (мікроурок) (Day 35, lesson 1 of 4). Today's build: Одна долина, заповнена твоїм PCG-лісом: ліс іде за формою долини й не заходить на дороги, річку й райони. Дороги, світло й налаштування великого світу перевірено. Доводять це три кадри із заблокованих камер, аркуш із фото-референсами й 60-секундний проліт..\nWhat I already know: День 31: головна дорога, вузька дорога й серпантин; День 32: рецепт острівного світла, орієнтири й камери панорам; День 33: сітка, шари даних (Data Layers), HLOD і налаштування польоту в Play; День 34: перенесений ліс на тестовій ділянці.\n\nBy the end of this lesson I can:\n1. Планувати роботу на час: найбільший ризик першим (ліс), далі перевірки, а кадри й проліт наостанок.\n2. Користуватися чек-листом, щоб нічого не забути: дороги, світло, шари даних, HLOD, ліс, кадри, проліт, огляд.\n3. Пояснювати медалі: Бронза — усе зроблено, Срібло — зроблено правильно, Золото — швидко й гарно.\n\nRun the lesson in this order; it should take 20 to 30 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: Цього тижня з'явилися дороги, світло острова, орієнтири, налаштування великого світу й перший ліс PCG. Today: Сьогодні День боса: твій ліс PCG заповнює цілу долину, оминаючи дороги, річку й райони, а три кадри й 60-секундний проліт це доводять. One encouraging line: Спершу здобудь Бронзу, а тоді рости далі; ліс у долині, виліпленій твоїми руками, — чудове завершення тижня.); 2 lines on why today matters and where it comes back, in plain words (from this: Це доказ 7-го тижня: на землі є дороги, світ упорядкований під свій розмір, а справжня природа росте на ньому за правилами. Студія оцінює цей етап за кількома кадрами згори. Якщо дороги, світло й перший ліс добре читаються з 60 м, решта острова може йти за тим самим рецептом. It comes back: Ця долина — перша з усіх лісових долин, які ти наповниш у День 40. Наступного тижня довкола неї виростуть твої власні графи біомів (День 36), а в День 38 зони-винятки замінять сьогоднішні розділені рамки.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-35-boss-roads-big-world-first-forest exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (ліс у долині (спільний з уроками)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Відкрий boss_day35.md і скопіюй туди кроки самостійної роботи як чек-лист, біля кожного — час. Має вийти: план, що разом займає менше 4 годин.\n   2. Перейди командою Pilot у камеру панорами з Дня 32, яка бачить твою лісову долину, і зроби HighResShot. Перейменуй файл на before_day35.png. Має вийти: сьогоднішній кадр «до» збережено. [screenshot]\n   3. Встав свій план у чат із тьютором і попроси його виступити продюсером студії й викреслити все, що не вміститься. Має вийти: план, який реально завершити. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Продюсер: тьютор грає продюсера студії. Я захищаю свій план рядок за рядком, а він щораунду викреслює найслабший рядок. Otherwise skip it.\n6. Review: ask me these questions from earlier days, one at a time, and correct me kindly: Day 32: how do you lock exposure so every shot repeats? | Day 28: which part of your auto-landscape material decides where rock shows?\n7. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n8. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\nIf I want to go deeper, recommend this free video: \"Building Open Worlds in Unreal Engine 5 | Unreal Fest 2022\" by Unreal Engine: https://www.youtube.com/watch?v=EEf07ggFWRw\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; tier (Bronze, Silver, Gold) = медаль (Бронза, Срібло, Золото); lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; rubric = таблиця оціню reenshot]; at the others, ask me to answer in a few words.\n   1. Постав CAM_Week7_1, CAM_Week7_2 і CAM_Week7_3 так само, як CAM_Vista_1 у День 32, і заблокуй кожну. Має вийти: три заблоковані камери.\n   2. Перейди в кожну камеру командою Pilot, натисни G і введи в консолі (або в полі Cmd унизу ліворуч) HighResShot 1920x1080. У Saved/Screenshots/WindowsEditor з'являються три файли. Перейменуй їх на island_week7_1.png–island_week7_3.png. [screenshot]\n   3. У Krita постав кожен кадр поруч із фото-референсом схожого виду. Має вийти: boss_board_day35.png з трьома парами. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Тест 3 секунд: я дивлюся на кожну пару на своєму аркуші 3 секунди й кажу тьютору, що впало в око першим. Тьютор питає, чи саме це мав побачити глядач. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\nIf I want to go deeper, recommend this free video: \"Unreal Engine 5 Cinematic Camera Tutorial for Beginners STEP BY STEP\" by EZ Unreal: https://www.youtube.com/watch?v=CW8hDvJOwGM\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; tier (Bronze, Silver, Gold) = медаль (Бронза, Срібло, Золото); lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; rubric = таблиця оцінювання; self-review = самоперевірка; review (by tutor or art director) = огляд; breakdown = розбір; see-why-fix note = нотатка «бачу, чому, як виправити»; checklist = чек-лист; reference photo / hero photo = фото-референс / ключове фото; comparison sheet, board (an image) = аркуш (аркуш порівняння, аркуш референсів); click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; File Explorer = атки. [screenshot]\n   3. Постав тьютору одне уточнювальне питання, потім запиши своє рішення, свою медаль і реальний час. Має вийти: записана Бронза, Срібло чи Золото. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Обмін ролями: тьютор описує аркуш іншого острова. Я пишу до нього три нотатки «бачу, чому, як виправити», а тьютор оцінює кожну за конкретність і доброзичливість. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\nIf I want to go deeper, recommend this free video: \"How to Give a Professional Design Critique (Step by Step)\" by Lindsay Marsh: https://www.youtube.com/watch?v=JcqG3dILKZY\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; tier (Bronze, Silver, Gold) = медаль (Бронза, Срібло, Золото); lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; rubric = таблиця оцінювання; self-review = самоперевірка; review (by tutor or art director) = огляд; breakdown = розбір; see-why-fix note = нотатка «бачу, чому, як виправити»; checklist = чек-лист; credits line = рядок авторства; reference photo / hero photo = фото-референс / ключове фото; comparison sheet, board (an image) = аркуш (аркуш порівняння, аркуш референсів); click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; File Explorer = Провідник; grid = сітка (тільки grid, ніколи mesh); vertex / edge / face = вершина / ребро / грань; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; material slot / node / pin = слот матеріалу / вузол / вхід; volume (PCG Volume, Post Process Volume) = об'єм; seed = зерно (налаштування Seed); keep-out zone / footprint test / grounding = зона-виняток / тест опори / посадка на ґрунт; map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; district / plot / plot plan = район / ділянка / план ділянки; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; vista / blockout / landmark = панорама / блокаут / орієнтир; locked camera / locked exposure = заблокована камера / зафіксована експозиція; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; hero shot = головний кадр (hero shot); light route = полегшений варіант (light route); proof (picture) = доказ; shot set = серія кадрів.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}], "handin": [{"en": "summary.md", "uk": "summary.md (звіт дня)"}, {"en": "boss_day35.md: your plan with real times, the forest settings and seeds, and stat unit at CAM_Week7_3 (Boss)", "uk": "boss_day35.md (план із реальним часом, налаштування лісу й значення Seed, stat unit на CAM_Week7_3) (День боса)"}, {"en": "boss_board_day35.png: your three shots, each beside a reference photo (Boss)", "uk": "boss_board_day35.png (три кадри, кожен поруч із фото-референсом) (День боса)"}, {"en": "self_review_day35.md: scores, the tutor's notes, your decision and your tier (Boss)", "uk": "self_review_day35.md (оцінки, нотатки тьютора, твоє рішення й медаль) (День боса)"}, {"en": "clip_day35.mp4: 30 to 60 seconds over the road and the valley, under 50 MB; keep it: Day 60's progress reel uses it (Boss)", "uk": "clip_day35.mp4 (30–60 секунд над дорогою й долиною, менше 50 МБ; збережи його: з нього складеш ролик прогресу в День 60) (День боса)"}], "goal": {"en": "By the end of today your roads are checked, your big-world set-up works, and a first PCG forest fills one whole valley. Three locked shots, a board beside reference photos and a 60-second flight prove it.", "uk": "До кінця дня дороги перевірено, налаштування великого світу працює, а перший PCG-ліс заповнює цілу долину. Доводять це три кадри із заблокованих камер, аркуш із фото-референсами й 60-секундний проліт."}, "uses": [{"en": "Day 31: the main road, the lane and the switchback", "uk": "День 31: головна дорога, вузька дорога й серпантин"}, {"en": "Day 32: the island light recipe, the landmarks and the vista cameras", "uk": "День 32: рецепт острівного світла, орієнтири й камери панорам"}, {"en": "Day 33: the grid, the Data Layers, the HLODs and the flying Play set-up", "uk": "День 33: сітка, шари даних (Data Layers), HLOD і налаштування польоту в Play"}, {"en": "Day 34: the migrated forest on its test patch", "uk": "День 34: перенесений ліс на тестовій ділянці"}], "quiz": [{"q": {"en": "A road leg rises 9 m over 60 m. Is it fine for a car road on your island?", "uk": "Відрізок дороги піднімається на 9 м на відстані 60 м. Чи годиться він для автомобільної дороги на твоєму острові?"}, "options": [{"en": "Yes, it is 6 %", "uk": "Так, це 6 %"}, {"en": "No, it is 15 %, too steep: it needs a longer line or a switchback", "uk": "Ні, це 15 %, надто круто: потрібна довша лінія або серпантин"}, {"en": "Yes, any grade is fine with Raise Terrain ticked", "uk": "Так, з увімкненим Raise Terrain годиться будь-який ухил"}], "answer": 1, "explain": {"en": "9 / 60 x 100 = 15 %. Car roads stay under 10 %, with only short pieces steeper.", "uk": "9 / 60 × 100 = 15 %. Автомобільні дороги тримаються нижче 10 %, і лише короткі відрізки крутіші."}}, {"q": {"en": "From 2 m you see daylight under your road strip's edge on a bend. What is the fix?", "uk": "З 2 м видно просвіт під краєм дорожньої смуги на вигині. Як це виправити?"}, "options": [{"en": "Lower that control point a little or raise its Side Falloff", "uk": "Трохи опустити цю контрольну точку або збільшити її Side Falloff"}, {"en": "Turn off Lumen", "uk": "Вимкнути Lumen"}, {"en": "Make the road narrower", "uk": "Зробити дорогу вужчою"}, {"en": "Rebuild the HLODs", "uk": "Перебудувати HLOD"}], "answer": 0, "explain": {"en": "The surface follows the spline. Lowering the point or blending the ground better seats the edge in the terrain.", "uk": "Покриття йде за сплайном. Якщо опустити точку або плавніше звести ґрунт, край сяде в рельєф."}}, {"q": {"en": "Why is a low sun (25 to 35 degrees) better than a noon sun for island shots?", "uk": "Чому низьке сонце (25–35 градусів) краще за полуденне для кадрів острова?"}, "options": [{"en": "It costs less GPU time", "uk": "Воно забирає менше часу GPU"}, {"en": "It removes the haze", "uk": "Воно прибирає серпанок"}, {"en": "It gives each hill a lit side and a shaded side, so the shapes read", "uk": "Воно дає кожному пагорбу освітлений і затінений бік, тож форми читаються"}, {"en": "It locks the exposure", "uk": "Воно фіксує експозицію"}], "answer": 2, "explain": {"en": "A low sun throws shadows across the land. At noon the light is flat and hills lose their shape.", "uk": "Низьке сонце кидає тіні через усю землю. Опівдні світло пласке, і пагорби втрачають форму."}}, {"q": {"en": "A viewer flying over your island keeps getting lost. What helps most?", "uk": "Глядач, що літає над твоїм островом, постійно губиться. Що допоможе найбільше?"}, "options": [{"en": "Thicker fog", "uk": "Густіший туман"}, {"en": "More grass", "uk": "Більше трави"}, {"en": "A higher Loading Range", "uk": "Більша дальність завантаження (Loading Range)"}, {"en": "A tall landmark with a clear outline on high ground", "uk": "Високий орієнтир із чітким силуетом на височині"}], "answer": 3, "explain": {"en": "Landmarks seen from far away tell people where they are. Fog and grass hide them instead.", "uk": "Орієнтири, видні здалеку, кажуть людям, де вони. Туман і трава, навпаки, їх ховають."}}, {"q": {"en": "What is a Data Layer for?", "uk": "Для чого потрібен шар даних (Data Layer)?"}, "options": [{"en": "Grouping actors across the world so you can show, hide or load them together", "uk": "Щоб групувати акторів у всьому світі й разом показувати, ховати чи завантажувати їх"}, {"en": "Storing textures", "uk": "Щоб зберігати текстури"}, {"en": "Building HLODs", "uk": "Щоб будувати HLOD"}], "answer": 0, "explain": {"en": "Data Layers sort a big world by kind, such as all water or all forest, so you can work on one kind at a time.", "uk": "Шари даних сортують великий світ за видами, як-от уся вода чи весь ліс, тож можна працювати з одним видом за раз."}}, {"q": {"en": "You hide DL_Water and the ocean disappears too. What happened?", "uk": "Ти ховаєш DL_Water, і океан теж зникає. Що сталося?"}, "options": [{"en": "The HLODs are not built", "uk": "HLOD не побудовані"}, {"en": "The ocean was added to DL_Water; it should be on no layer and always loaded", "uk": "Океан додано в DL_Water; він має бути поза шарами й завжди завантаженим"}, {"en": "The fog is too thick", "uk": "Туман надто густий"}], "answer": 1, "explain": {"en": "The ocean and its Water Zone must always be there. Keep them off Data Layers, with Is Spatially Loaded unticked.", "uk": "Океан і його Water Zone мають бути на місці завжди. Тримай їх поза шарами даних, зі знятим прапорцем Is Spatially Loaded."}}, {"q": {"en": "Which Electric Dreams levels may you open on a 16 GB PC?", "uk": "Які рівні Electric Dreams можна відкривати на ПК з 16 ГБ?"}, "options": [{"en": "ElectricDreams_Env", "uk": "ElectricDreams_Env"}, {"en": "ElectricDreams_PCG", "uk": "ElectricDreams_PCG"}, {"en": "Only the small breakdown levels, such as ElectricDreams_PCGForest", "uk": "Лише маленькі рівні-розбори, як-от ElectricDreams_PCGForest"}, {"en": "Any level, if the browser is closed", "uk": "Будь-який рівень, якщо браузер закритий"}], "answer": 2, "explain": {"en": "ElectricDreams_Env and ElectricDreams_PCG are the full 4 km maps, built for 32 to 64 GB of memory.", "uk": "ElectricDreams_Env і ElectricDreams_PCG — це повні мапи 4 км, розраховані на 32–64 ГБ пам'яті."}}, {"q": {"en": "Your forest box sits square across the valley and trees stand on the road. What is the best fix today?", "uk": "Рамка лісу стоїть квадратом поперек долини, а дерева стоять на дорозі. Яке виправлення найкраще сьогодні?"}, "options": [{"en": "Use two or three boxes turned to the valley's shape, split on either side of the road", "uk": "Узяти дві-три рамки, повернуті під форму долини й розділені по обидва боки дороги"}, {"en": "Set Trees Density to zero", "uk": "Задати Trees Density 0"}, {"en": "Hide DL_Forest in the shots", "uk": "Сховати DL_Forest у кадрах"}, {"en": "Move the road", "uk": "Пересунути дорогу"}], "answer": 0, "explain": {"en": "Several fitted boxes follow the land and leave the road clear. Week 8 adds proper keep-out rules.", "uk": "Кілька підігнаних рамок ідуть за рельєфом і лишають дорогу вільною. На 8-му тижні з'являться справжні правила зон-винятків."}}], "weekInfo": {"week": 7, "title": {"en": "Roads, the big world and a first forest", "uk": "Дороги, великий світ і перший ліс"}, "goal": {"en": "By Friday you have roads that follow the land, island-scale light with landmarks and vistas, L_Island organised with World Partition, Data Layers and HLODs, and a first PCG forest filling one valley.", "uk": "До п'ятниці в тебе є дороги, що йдуть за рельєфом, світло в масштабі острова з орієнтирами й панорамами, L_Island, упорядкований інструментами World Partition, Data Layers і HLOD, і перший PCG-ліс, що заповнює одну долину."}, "skills": [{"en": "Landscape spline roads built to real grades in Unreal Engine 5", "uk": "Дороги зі сплайнів ландшафту зі справжніми ухилами в Unreal Engine 5"}, {"en": "World Partition, Data Layer and HLOD set-up for large open worlds", "uk": "Налаштування World Partition, Data Layers і HLOD для великих відкритих світів"}, {"en": "Atmosphere, light, landmarks and vistas for open-world composition", "uk": "Атмосфера, світло, орієнтири й панорами в композиції відкритого світу"}, {"en": "Reading production PCG graphs and migrating assets between Unreal projects", "uk": "Читання робочих PCG-графів зі справжніх проєктів і перенесення асетів між проєктами Unreal"}]}, "morning": {"sofar": {"en": "This week you added roads, island light, landmarks, a big-world set-up and your first PCG forest.", "uk": "Цього тижня з'явилися дороги, світло острова, орієнтири, налаштування великого світу й перший ліс PCG."}, "today": {"en": "It is Boss day: you fill one whole valley with your PCG forest, clear of roads, river and districts, and prove it in three shots and a 60-second flight.", "uk": "Сьогодні День боса: твій ліс PCG заповнює цілу долину, оминаючи дороги, річку й райони, а три кадри й 60-секундний проліт це доводять."}, "cheer": {"en": "Lock in Bronze first and grow from there; a forest filling a valley you sculpted yourself is a fine way to end the week.", "uk": "Спершу здобудь Бронзу, а тоді рости далі; ліс у долині, виліпленій твоїми руками, — чудове завершення тижня."}, "quote": {"text": {"en": "The woods are lovely, dark and deep, but I have promises to keep, and miles to go before I sleep.", "uk": "Ліс чарівний, темний і глибокий, та маю я обіцянки дотримати, і ще йти й іти мені до сну."}, "author": {"en": "Robert Frost", "uk": "Роберт Фрост"}, "source": "https://en.wikiquote.org/wiki/Robert_Frost"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-35-boss-roads-big-world-first-forest", "mapHref": "../../COURSE.html", "prevHref": "../Day-34-electric-dreams-pcg-forest/START-HERE.html", "nextHref": "../Day-36-own-biome-graph/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8 and Krita. I am a beginner on Day 35. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me and don't write code.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: Перевірки, кадри й проліт на час (медалі).\nIt's part of: Одна долина, заповнена твоїм PCG-лісом: ліс іде за формою долини й не заходить на дороги, річку й райони. Дороги, світло й налаштування великого світу перевірено. Доводять це три кадри із заблокованих камер, аркуш із фото-референсами й 60-секундний проліт. (L_Island: одна ціла долина, позначена на мапі як ліс (приблизно 300 × 200 м або більше), поза обома районами. Кадри: CAM_Week7_1 — серпантин з 30 м, CAM_Week7_2 — долина з 60 м з орієнтиром, CAM_Week7_3 — острів з 200 м.).\nWhy it matters: Це доказ 7-го тижня: на землі є дороги, світ упорядкований під свій розмір, а справжня природа росте на ньому за правилами. Студія оцінює цей етап за кількома кадрами згори. Якщо дороги, світло й перший ліс добре читаються з 60 м, решта острова може йти за тим самим рецептом. It comes back: Ця долина — перша з усіх лісових долин, які ти наповниш у День 40. Наступного тижня довкола неї виростуть твої власні графи біомів (День 36), а в День 38 зони-винятки замінять сьогоднішні розділені рамки.\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-35-boss-roads-big-world-first-forest (on the drive I chose on Day 0).\nWhat I already know: День 31: головна дорога, вузька дорога й серпантин; День 32: рецепт острівного світла, орієнтири й камери панорам; День 33: сітка, шари даних (Data Layers), HLOD і налаштування польоту в Play; День 34: перенесений ліс на тестовій ділянці; today's lessons: Брифінг перед Днем боса: план і чек-лист (мікроурок); Ліс, що пасує долині (мікроурок); Три кадри й проліт (мікроурок); Самоперевірка з тьютором (мікроурок). Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- Ліс у долині: дві-три рамки лісу, повернуті й масштабовані під форму долини, разом її вкривають (у полегшеному варіанті — копії твого об'єму PCG_ForestLite). Жодного дерева на дорозі, у річці чи в квадраті району. Змінені налаштування й значення Seed записано в boss_day35.md, а ліс лежить на DL_Forest.\n- Дороги перевірено: кожен відрізок має ухил менше 10 %, а з 10 м не видно ні горбів, ні країв, що висять.\n- Рецепт острівного світла застосований, експозиція зафіксована.\n- HLOD перебудовано після лісу. У Play долину видно з моря за 800 м.\n- Три заблоковані Cine Camera, CAM_Week7_1–CAM_Week7_3, з кожної — HighResShot 1920x1080. Кадри лежать в boss_board_day35.png поруч із відповідними фото-референсами.\n- Показники stat unit на CAM_Week7_3 записано (Frame і GPU). Проліт над дорогою й долиною в Play на 30–60 секунд, менше 50 МБ.\n\nMy checklist (the same numbers show on my course page):\n1. Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: boss_day35.md з планом і before_day35.png. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Потім запусти таймер. Перевірка: план вкладається в 4 години. (from lesson 1)\n2. Пролети кожною дорогою на висоті 10 м. Виправ кожен відрізок з ухилом понад 10 % і кожен горб чи край, що висить. Перевірка: road_grades.md оновлено, і жоден край дороги не висить. (from day 31, lesson 4)\n3. Вибери лісову долину на island_map.png. Познач дороги, річку й квадрати районів, які її перетинають або торкаються. Перевірка: долину обведено, а місця без дерев позначено. (from lesson 2)\n4. Перенеси тестовий ліс у долину й додавай рамки (Alt+перетягування), доки не вкриєш її. Кожну поверни й масштабуй під форму долини. У полегшеному варіанті натомість копіюй свій об'єм PCG_ForestLite. Перевірка: з 150 м ліс іде за формою долини, а не квадратом. (from lesson 2)\n5. Звільни дорогу, річку й райони: розділи рамки по обидва боки дороги й зменш кожну, що торкається району. Клацни Generate. Перевірка: жоден стовбур не стоїть на дорозі, у річці чи в квадраті району. (from lesson 2)\n6. Переналаштуй ліс під долину: густоту, галявини й Seed, по одній зміні за раз. Запиши значення. Слабкий ПК: менше рамок і Trees Density удвічі менша (див. розділ «Слабкий ПК» на сторінці ACCOUNTS-AND-INSTALLS.html). Перевірка: з 60 м видно куртини й галявини, а рядів немає. (from day 34, lesson 4)\n7. Застосуй рецепт світла й переконайся, що експозицію зафіксовано. Перебудуй HLOD (Build > Build HLODs) з дальностями з world_notes.md. Перевірка: у Play долину видно з моря за 800 м. (from day 33, lesson 4)\n8. Постав, налаштуй і заблокуй CAM_Week7_1, CAM_Week7_2 і CAM_Week7_3. Зроби HighResShot з кожної. Перевірка: три файли 1920 × 1080 з назвами island_week7_1.png–island_week7_3.png. (from lesson 3)\n9. Зроби boss_board_day35.png: кожен кадр поруч із фото-референсом схожого виду. Перевірка: три підписані пари. (from lesson 3)\n10. Перейди в CAM_Week7_3 командою Pilot і зчитай stat unit. Запиши Frame і GPU в boss_day35.md. Потім пролети над дорогою й долиною в Play і запиши 30–60 секунд (Win+Alt+R) як clip_day35.mp4. Перевірка: у Провіднику (File Explorer) кліп менший за 50 МБ. Якщо ні, запиши 30 секунд. (from lesson 3)\n11. Оціни себе за таблицею оцінювання, потім попроси тьютора про нотатки «бачу, чому, як виправити». Запиши в self_review_day35.md оцінки, нотатки, своє рішення, свою медаль і реальний час. Перевірка: п'ять оцінок, три нотатки й одне рішення. (from lesson 4)\n12. В Unreal вибери File > Save All. Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: на вкладці рівня немає позначки *, а кожна назва зі списку є в папці, у кожної є розмір. (from lesson 4)\n\nToday is a BOSS build. Ask me what time I started; whenever I tell you the time, tell me which tier I'm on track for. At the end, ask my finish time. Tiers:\n- Бронза: ліс у долині згенеровано, він не заходить на дороги, річку й райони, а дороги перевірено. Є три кадри із заблокованих камер, аркуш і проліт на 30–60 секунд — усе за 4 години.\n- Срібло: з 60 м ліс іде за формою долини, з куртинами й галявинами, без рядів. Кожен відрізок дороги має ухил менше 10 % і жодного краю, що висить. У Play долину видно з моря за 800 м.\n- Золото: поруч зі своїм фото кожен кадр за 3 секунди читається як справжній острів, а все готово за 3 години. Додай одне завдання понад план: другу вузьку дорогу до іншого району (кожен відрізок менше 10 %) або ще один рівень-розбір. Відкривай ElectricDreams_PCGLargeAssembly чи ElectricDreams_PCGSplineExample лише із закритим IslandCourse і допиши два рядки в pcg_study.md.\n\nHow to help: ask which step number I'm on, then give me only the next step: the exact clicks and what I should see. When I send a screenshot, compare it with my reference, my sizes and the spec, and name one thing to fix at a time.\nCheck every save and export by reopening it before we move on:\n- a .md or .txt: open it with Notepad; the text is there, and the name doesn't end in .md.txt\n- the clip: right-click > Properties shows 30 to 60 seconds and under 50 MB\nWhen I write \"готово\", and in any case before the day ends, check with me one item at a time (yes/no): each spec point, then each file on my hand-in list, ready in my day work folder (skip summary.md: the day report writes it next):\n1. boss_day35.md (план із реальним часом, налаштування лісу й значення Seed, stat unit на CAM_Week7_3) (День боса)\n2. boss_board_day35.png (три кадри, кожен поруч із фото-референсом) (День боса)\n3. self_review_day35.md (оцінки, нотатки тьютора, твоє рішення й медаль) (День боса)\n4. clip_day35.mp4 (30–60 секунд над дорогою й долиною, менше 50 МБ; збережи його: з нього складеш ролик прогресу в День 60) (День боса)\nFinish with a short list of anything missing, the tier I reached, and one line on where this work comes back and what it will look like there. Then tell me the order for the end of the day: first the day report (the Copy the day report button at the bottom of my course page) into summary.md, and only then hand in all the files on the list, summary.md too.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; tier (Bronze, Silver, Gold) = медаль (Бронза, Срібло, Золото); day report (summary.md) = звіт дня (summary.md); hand-in function setLang(l){lang=l;try{localStorage.setItem('devteam:lang',lang)}catch(e){};render()}
function toggleLang(){setLang(lang==='uk'?'en':'uk')}
/* keep open sections and keyboard focus across re-renders */
const openD=new Set();
function tg(e){if(e.open)openD.add(e.id);else openD.delete(e.id)}
const op=id=>openD.has(id)?' open':'';
function render(){const ae=document.activeElement,fid=ae&&(ae.id||(ae.getAttribute('data-th')?'th-'+ae.getAttribute('data-th'):ae.getAttribute('lang')&&ae.closest('.seg')?'lg-'+ae.getAttribute('lang'):''));
 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);
 const b=D.build,P=Math.round(prog()*100);
 document.getElementById('top').innerHTML='<div class="topin glass"><a class="maplink" href="'+esc(D.mapHref)+'">'+kn('map')+u('map')+'</a><div class="crumb"><b>'+esc(x(D.learnerName))+'</b><span>'+u('week')+' '+D.week+'</span><span>'+u('day')+' '+D.day+' '+u('of')+' '+D.total+'</span></div>'+controls(lang,'setLang')+'</div><div class="tline"><i style="width:'+P+'%"></i></div>';
 const state=w=>w<D.week?'b':w===D.week?'n':'p';
 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 let wk='';if(D.weekInfo){const w=D.weekInfo;wk='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}
 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p>'+(b.next?'<div class="back well">'+kn('arrow')+'<div><b>'+u('comes')+'</b><br>'+lk(x(b.next))+'</div></div>':'')+'<div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.assetFiles&&D.assetFiles.length?'<p class="files">'+ic('folder')+'<span>'+u('filesL')+' '+D.assetFiles.map(f=>'<a href="assets/'+encodeURIComponent(f)+'" target="_blank" rel="noopener">'+esc(f)+'</a>').join(', ')+'</span></p>':D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+=handinCard();h+=beforeCard();
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div><label class="rcpt" for="r'+i+'"><span class="eyebrow">'+u('rcpt')+'</span><textarea id="r'+i+'" rows="2" placeholder="'+esc(u('rcptPh'))+'" oninput="st.r'+i+'=this.value;save()">'+esc(st['r'+i]||'')+'</textarea></label>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+hList()+chkList()+(hasClip?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<h3>1 · '+u('copyR')+'</h3><p class="muted">'+u('report')+'</p><div class="row"><button class="btn ghost" onclick="cp(reportText())">'+ic('copy')+u('copyR')+'</button></div><h3>2 · '+u('ship')+'</h3>'+hf()+'<p class="muted" style="margin:12px 0 0">'+u('hNote')+'</p></section>';
 h+=qCard();h+=wk;
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();
</script>

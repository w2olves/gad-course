<script id="data" type="application/json">{"learner": "ib-kateryna-e1a237a5", "learnerName": {"en": "Kateryna B.", "uk": "Катерина Б."}, "day": 19, "week": 4, "total": 60, "title": {"en": "Light and atmosphere: Lumen, sky, fog, exposure and two composed cameras", "uk": "Світло й атмосфера: Lumen, небо, туман, експозиція і дві скомпоновані камери"}, "theme": {"en": "Week 4: The Unreal look", "uk": "Тиждень 4: Вигляд в Unreal"}, "build": {"item": {"en": "L_HarbourCorner: your kit lit by a written light recipe, with two composed cameras", "uk": "L_HarbourCorner: твій набір, освітлений за записаним рецептом світла, з двома скомпонованими камерами"}, "why": {"en": "Light decides whether a scene looks beautiful or flat. A low sun rakes across walls and shows every texture, fog gives depth, and a locked exposure lets shots repeat. Studios write the light down as a recipe of numbers so any artist can rebuild it, and they set the cameras early, because the camera decides what matters. Tomorrow you dress this level into a full harbour corner.", "uk": "Світло вирішує, чи сцена виглядає гарною, чи пласкою. Низьке сонце ковзає по стінах і показує кожну текстуру, туман дає глибину, а зафіксована експозиція дозволяє повторювати кадри. Студії записують світло як рецепт із чисел, щоб будь-який художник міг його відтворити, і налаштовують камери рано, бо камера вирішує, що важливо. Завтра ти наповниш цей рівень і перетвориш його на повноцінний куток гавані."}, "where": {"en": "A new level, L_HarbourCorner, in Course/Day19. Your island's light is written the same way: sky_recipe.md on Day 30, grown for the whole island on Day 32.", "uk": "Новий рівень L_HarbourCorner у Course/Day19. Світло твого острова записується так само: sky_recipe.md на Дні 30, розширений на весь острів на Дні 32."}, "spec": [{"en": "L_HarbourCorner (File > New Level > Basic) with your dressed kit and the Land block copied in from L_KitTest, the new Floor lowered to Z -400 as the sea bed, and water 1 m below the quay top (Z -100, where L_KitTest's stand-in water was) on every open side.", "uk": "L_HarbourCorner (File > New Level > Basic) з твоїм оздобленим набором і блоком Land, скопійованими з L_KitTest; новий Floor опущено до Z -400 як морське дно, а вода на 1 м нижче верху набережної (Z -100, де була тимчасова вода в L_KitTest) з кожного відкритого боку."}, {"en": "The outdoor set: Directional Light (the sun), Sky Light, Sky Atmosphere and Exponential Height Fog, with Lumen for bounced light and reflections.", "uk": "Набір для зовнішнього освітлення: Directional Light (сонце), Sky Light, Sky Atmosphere і Exponential Height Fog, з Lumen для відбитого світла й відбиттів."}, {"en": "Golden light: the sun about 10 to 20 degrees above the horizon, coming from the side of your main view.", "uk": "Золоте світло: сонце приблизно на 10–20 градусів над горизонтом, світить збоку від твого головного ракурсу."}, {"en": "Exposure locked: a Post Process Volume with Infinite Extent (Unbound) on and Min EV100 = Max EV100.", "uk": "Експозицію зафіксовано: Post Process Volume з увімкненим Infinite Extent (Unbound) і Min EV100 = Max EV100."}, {"en": "light_recipe.md with every number: sun rotation and intensity, Sky Light intensity, fog density and height falloff, EV100 and white balance Temp (a higher Temp warms the picture).", "uk": "light_recipe.md з усіма числами: поворот і інтенсивність сонця, інтенсивність Sky Light, щільність туману й height falloff, EV100 і Temp балансу білого (вищий Temp робить картинку теплішою)."}, {"en": "Two Cine Camera Actors with a 16:9 filmback: C1 low along the quay (2 to 6 m up, 24 mm) and C2 high and wide (25 to 30 m up, 18 to 24 mm), each composed on thirds and locked.", "uk": "Два Cine Camera Actor з filmback 16:9: C1 низько вздовж набережної (2–6 м угору, 24 мм) і C2 високо й широко (25–30 м угору, 18–24 мм), кожна скомпонована за третинами й зафіксована."}, {"en": "A repeat check: the light rebuilt from light_recipe.md alone, in a copy of the level, matches the original from C1.", "uk": "Перевірка повторюваності: світло, відтворене лише за light_recipe.md у копії рівня, збігається з оригіналом з C1."}], "piece1": "the sun, sky and fog, and camera C1 (shared with the lessons)", "piece2": {"en": "Exposure, the recipe, camera C2 and the repeat check, on your own", "uk": "Експозиція, рецепт, камера C2 і перевірка повторюваності, самостійно"}, "steps": [{"text": {"en": "Finish the level from lesson 1: the Land block sits behind the quay with its top level with the deck (Z 0); scale it if needed so the land reaches the back of the area you will dress tomorrow. The new Floor is at Z -400, below the foot of the quay wall. Check: from 2 m, the land meets the quay with no step and no gap, and the quay wall shows down into the water.", "uk": "Заверши рівень з уроку 1: блок Land лежить за набережною, а його верх на одному рівні з настилом (Z 0); за потреби масштабуй його, щоб суша сягала задньої межі ділянки, яку ти завтра наповнюватимеш. Новий Floor — на Z -400, нижче підніжжя стінки набережної. Перевірка: з 2 м суша сходиться з набережною без сходинки й без зазору, а стінку набережної видно аж до води."}, "lesson": 1}, {"text": {"en": "Water: the Water Body Lake from lesson 1 (or the smooth dark plane) is at least 80 x 80 m, so it runs under the Land block and fills every open side, at Z -100 (1 m below the quay top). Check: from the quay at 2 m, the water meets the wall with no gap.", "uk": "Вода: Water Body Lake з уроку 1 (або гладка темна площина) має щонайменше 80 x 80 м, тож вона заходить під блок Land і заповнює кожен відкритий бік, на Z -100 (на 1 м нижче верху набережної). Перевірка: з набережної на висоті 2 м видно, що вода сходиться зі стінкою без зазору."}, "lesson": 1}, {"text": {"en": "Sun for golden light: hold Ctrl+L and move the mouse until the sun is 10 to 20 degrees high and rakes across the shop front; write its Rotation from Details. Check: long shadows, and the trim and wear catch the light.", "uk": "Сонце для золотого світла: затисни Ctrl+L і поводь мишею, доки сонце не підніметься на 10–20 градусів і не ковзатиме по фасаду крамниці; запиши його Rotation з Details. Перевірка: довгі тіні, а трим і зношеність ловлять світло."}, "lesson": 1}, {"text": {"en": "Fog: set Fog Density and Fog Height Falloff so the far side of the water softens but keeps its shape. Check: from C2's height, near things are darker and sharper than far things.", "uk": "Туман: задай Fog Density і Fog Height Falloff так, щоб дальній берег води пом'якшився, але зберіг форму. Перевірка: з висоти C2 близькі об'єкти темніші й чіткіші за далекі."}, "lesson": 2}, {"text": {"en": "Post Process Volume: Infinite Extent (Unbound) on, Min EV100 = Max EV100 at a value where white walls are bright but keep their texture. Check: flying from sun into shade, the brightness no longer changes by itself.", "uk": "Post Process Volume: Infinite Extent (Unbound) увімкнено, Min EV100 = Max EV100 зі значенням, за якого білі стіни яскраві, але зберігають текстуру. Перевірка: коли летиш із сонця в тінь, яскравість більше не змінюється сама."}, "lesson": 3}, {"text": {"en": "White balance: in the same volume, change Temp in small steps (about 250) from its default of 6500. With Temperature Type left at White Balance, a higher Temp warms the picture and a lower one cools it. Check: whites look a little warm or cool, never orange or blue.", "uk": "Баланс білого: у тому самому volume змінюй Temp малими кроками (приблизно по 250) від значення за замовчуванням 6500. Якщо Temperature Type лишається на White Balance, вищий Temp робить картинку теплішою, а нижчий — холоднішою. Перевірка: біле виглядає трохи теплим чи холодним, але ніколи не помаранчевим чи синім."}, "lesson": 3}, {"text": {"en": "Write light_recipe.md with every number from today, plus the sun's Intensity and the Sky Light's Intensity. Check: nothing in the recipe says 'about' or 'some'.", "uk": "Напиши light_recipe.md з усіма сьогоднішніми числами, а також Intensity сонця й Intensity Sky Light. Перевірка: у рецепті немає слів «приблизно» чи «трохи»."}, "lesson": 3}, {"text": {"en": "C1: finish its composition: the quay edge as a leading line into the frame, the shop front on a third, the horizon level (Roll 0). Lock it. Check: on a copy of the screenshot with thirds lines drawn in Krita, the shop front sits on a line.", "uk": "C1: заверши композицію: край набережної як провідна лінія в кадр, фасад крамниці на третині, горизонт рівний (Roll 0). Зафіксуй камеру. Перевірка: на копії скриншота з намальованими в Krita лініями третин фасад крамниці стоїть на лінії."}, "lesson": 4}, {"text": {"en": "C2: a second Cine Camera Actor 25 to 30 m up, 18 to 24 mm, with the whole kit and water in frame and the sky in the top third. Lock it. Check: the pier, building and water all read in a 3-second look.", "uk": "C2: другий Cine Camera Actor на висоті 25–30 м, 18–24 мм, увесь набір і вода в кадрі, а небо у верхній третині. Зафіксуй камеру. Перевірка: пірс, будівлю й воду можна прочитати за 3 секунди погляду."}, "lesson": 4}, {"text": {"en": "Repeat check: in the Content Browser right-click L_HarbourCorner > Duplicate, name it L_HarbourCorner_LightTest and open it. Reset the sun, Sky Light, fog and post-process values (the yellow reset arrows in Details), rebuild them from light_recipe.md alone and shoot C1. Check: the two C1 shots look like the same photo.", "uk": "Перевірка повторюваності: у Content Browser клацни правою кнопкою L_HarbourCorner > Duplicate, назви копію L_HarbourCorner_LightTest і відкрий її. Скинь значення сонця, Sky Light, туману й post-process (жовті стрілки скидання в Details), відтвори їх лише за light_recipe.md і зніми C1. Перевірка: два кадри з C1 виглядають як та сама фотографія."}, "lesson": 3}, {"text": {"en": "Before/after capture: your first screenshot from lesson 1 (the Basic level's default light) beside the same view in your recipe. Then a 60-second clip flying from C1 to C2. Save today's clip as flythrough_day19.mp4 and check that you also have harbour_C1.png, harbour_C2.png, noon_vs_golden.png, c1_match.png and before_after_day19.png (each is described in today's hand-in list; take any you are missing now). Check: the brightness stays steady in the clip.", "uk": "Знімок «до/після»: твій перший скриншот з уроку 1 (стандартне світло рівня Basic) поруч із тим самим ракурсом за твоїм рецептом. Потім 60-секундний кліп прольоту від C1 до C2. Збережи сьогоднішній кліп як flythrough_day19.mp4 і перевір, що в тебе також є harbour_C1.png, harbour_C2.png, noon_vs_golden.png, c1_match.png і before_after_day19.png (кожен описано в сьогоднішньому списку «Здати роботу»; зроби зараз ті, яких бракує). Перевірка: у кліпі яскравість лишається стабільною."}, "lesson": 3}]}, "lessons": [{"title": {"en": "The outdoor light set and the time of day", "uk": "Набір зовнішнього освітлення й час доби"}, "minutes": 40, "goals": [{"en": "Name the outdoor light set and its jobs: Directional Light (the sun), Sky Light (soft light from the whole sky), Sky Atmosphere (the sky's colour) and Exponential Height Fog (haze). Lumen is Unreal's live system for light that bounces and for reflections.", "uk": "Назви набір зовнішнього освітлення та завдання кожного елемента: Directional Light (сонце), Sky Light (м'яке світло від усього неба), Sky Atmosphere (колір неба) і Exponential Height Fog (серпанок). Lumen — це жива система Unreal для відбитого світла й відбиттів."}, {"en": "Move the sun and see how the time of day changes the mood and the textures.", "uk": "Пересувай сонце й дивися, як час доби змінює настрій і текстури."}, {"en": "Explain why a low sun looks good: long shadows, warm light, and texture lit from the side.", "uk": "Поясни, чому низьке сонце виглядає гарно: довгі тіні, тепле світло й текстура, освітлена збоку."}], "doalong": [{"en": "Open L_KitTest. In the Outliner, Ctrl+click your quay, pier, steps, railings, LI_HarbourHouse, the Land block, shop fronts, awnings, paving plane, decals and props, but not the Floor, the lights, the sky or the fog. Press Ctrl+C. Then File > New Level > Basic, File > Save Current Level As: L_HarbourCorner in Course/Day19, and press Ctrl+V. Click the new level's Floor and type -400 into Location Z: it becomes the sea bed, below the foot of your quay wall. You see your kit, in the same places, under a new sky. Take a screenshot now: it is your before picture.", "uk": "Відкрий L_KitTest. В Outliner Ctrl+клацни набережну, пірс, сходи, поручні, LI_HarbourHouse, блок Land, фасади крамниць, маркізи, площину бруківки, декалі й пропси, але не Floor, не світло, не небо й не туман. Натисни Ctrl+C. Потім File > New Level > Basic, File > Save Current Level As: L_HarbourCorner у Course/Day19, і натисни Ctrl+V. Клацни Floor нового рівня й введи -400 у Location Z: він стає морським дном, нижче підніжжя стінки набережної. Ти бачиш свій набір на тих самих місцях під новим небом. Зроби скриншот зараз: це твоє фото «до»."}, {"en": "Water: Window > Place Actors, search Water Body Lake, and drag it in beside the quay. Make it wide by scaling it, or by dragging its spline points (the small dots on its edge) outwards, and set its Location Z to -100: 1 m below the quay top, where L_KitTest's stand-in water was. If it gives trouble, use a big Plane from /Engine/BasicShapes at Z -100 with a dark blue-green M_Master instance (Roughness 0.05) for now; real water comes on Day 29. You see water against your quay.", "uk": "Вода: Window > Place Actors, пошукай Water Body Lake і перетягни його поруч із набережною. Зроби його широким масштабуванням або перетягуванням точок сплайна (маленьких крапок на краю) назовні й постав його Location Z на -100: на 1 м нижче верху набережної, де була тимчасова вода в L_KitTest. Якщо з ним виникнуть труднощі, поки що використай велику Plane з /Engine/BasicShapes на Z -100 з темним синьо-зеленим інстансом M_Master (Roughness 0.05); справжня вода буде на Дні 29. Ти бачиш воду біля своєї набережної."}, {"en": "Window > Env. Light Mixer. You see the sun (Directional Light), Sky Light, Sky Atmosphere and Exponential Height Fog together in one panel.", "uk": "Window > Env. Light Mixer. Ти бачиш сонце (Directional Light), Sky Light, Sky Atmosphere і Exponential Height Fog разом на одній панелі."}, {"en": "Hold Ctrl+L and move the mouse to move the sun: set it high (noon), take a screenshot, then low (about 15 degrees: in Details, the sun's Rotation Y reads about -15) and take another from the same view. You see flat light at noon and long shadows when the sun is low.", "uk": "Затисни Ctrl+L і поводь мишею, щоб пересунути сонце: постав його високо (полудень), зроби скриншот, потім низько (приблизно 15 градусів: у Details Rotation Y сонця показує приблизно -15) і зроби ще один з того самого ракурсу. Ти бачиш пласке світло опівдні й довгі тіні, коли сонце низько."}, {"en": "Turn the sun so it comes from the side of your shop front. You see the trim, frames and wear stand out: this side light is called raking light.", "uk": "Поверни сонце так, щоб воно світило збоку від фасаду крамниці. Ти бачиш, як трим, рами й зношеність стають виразними: таке бічне світло називають ковзним."}], "play": {"en": "Time detective: I send three screenshots at different sun heights. The tutor guesses the time of day from the shadows. Then we swap roles.", "uk": "Детектив часу: я надсилаю три скриншоти з різною висотою сонця. Тьютор вгадує час доби за тінями. Потім ми міняємося ролями."}, "video": {"search": "unreal engine 5 lumen basics outdoor lighting", "alt": {"url": "https://www.youtube.com/watch?v=985erJx5e1o", "title": "Освітлення в Unreal Engine 5 для новачків!", "channel": "3DV Unreal Engine Archviz Academy"}}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: The outdoor light set and the time of day (Day 19, lesson 1 of 4).\nToday's build: L_HarbourCorner: your kit lit by a written light recipe, with two composed cameras.\n\nBy the end of this lesson I can:\n1. Name the outdoor light set and its jobs: Directional Light (the sun), Sky Light (soft light from the whole sky), Sky Atmosphere (the sky's colour) and Exponential Height Fog (haze). Lumen is Unreal's live system for light that bounces and for reflections.\n2. Move the sun and see how the time of day changes the mood and the textures.\n3. Explain why a low sun looks good: long shadows, warm light, and texture lit from the side.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (Your kit has materials, wear, a real palette, seamless textures and decals that show where water and wheels have been.), what I will learn today (You light L_HarbourCorner with Lumen, sky, fog and exposure, write your own light recipe, and compose two cameras.), encourage me (Light can change a scene in a minute, so play freely; your written recipe always brings you back to a look you like.), and share today's quote: \"An artist should be open on all sides to every kind of light and darkness.\" (John Steinbeck).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 16: why do you sample a colour from a blurred photo, and from the lit side? | Day 13: why are the shop front's openings recessed 10 to 15 cm?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Time detective: I send three screenshots at different sun heights. The tutor guesses the time of day from the shadows. Then we swap roles.\n6. Do-along on today's build (the sun, sky and fog, and camera C1 (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Open L_KitTest. In the Outliner, Ctrl+click your quay, pier, steps, railings, LI_HarbourHouse, the Land block, shop fronts, awnings, paving plane, decals and props, but not the Floor, the lights, the sky or the fog. Press Ctrl+C. Then File > New Level > Basic, File > Save Current Level As: L_HarbourCorner in Course/Day19, and press Ctrl+V. Click the new level's Floor and type -400 into Location Z: it becomes the sea bed, below the foot of your quay wall. You see your kit, in the same places, under a new sky. Take a screenshot now: it is your before picture.\n   - Water: Window > Place Actors, search Water Body Lake, and drag it in beside the quay. Make it wide by scaling it, or by dragging its spline points (the small dots on its edge) outwards, and set its Location Z to -100: 1 m below the quay top, where L_KitTest's stand-in water was. If it gives trouble, use a big Plane from /Engine/BasicShapes at Z -100 with a dark blue-green M_Master instance (Roughness 0.05) for now; real water comes on Day 29. You see water against your quay.\n   - Window > Env. Light Mixer. You see the sun (Directional Light), Sky Light, Sky Atmosphere and Exponential Height Fog together in one panel.\n   - Hold Ctrl+L and move the mouse to move the sun: set it high (noon), take a screenshot, then low (about 15 degrees: in Details, the sun's Rotation Y reads about -15) and take another from the same view. You see flat light at noon and long shadows when the sun is low.\n   - Turn the sun so it comes from the side of your shop front. You see the trim, frames and wear stand out: this side light is called raking light.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Atmosphere: fog, haze and depth", "uk": "Атмосфера: туман, серпанок і глибина"}, "minutes": 40, "goals": [{"en": "Use Exponential Height Fog for depth: far things lighter and softer, near things darker and sharper, as in real air.", "uk": "Використовуй Exponential Height Fog для глибини: далекі об'єкти світліші й м'якші, близькі — темніші й чіткіші, як у справжньому повітрі."}, {"en": "Tune Fog Density (how thick) and Fog Height Falloff (how fast it thins with height) so the distance softens without turning to milk.", "uk": "Налаштуй Fog Density (наскільки густий) і Fog Height Falloff (як швидко рідшає з висотою), щоб далечінь пом'якшилася, але не стала молоком."}, {"en": "Read a scene as foreground (near), middle ground and background (far).", "uk": "Читай сцену як передній план (близько), середній план і задній план (далеко)."}], "doalong": [{"en": "Select Exponential Height Fog in the Outliner. In Details, set Fog Density to 0.01, then 0.1, then back to 0.02. You see the distance go from clear to milky to clear.", "uk": "Виділи Exponential Height Fog в Outliner. У Details постав Fog Density на 0.01, потім 0.1, потім знову 0.02. Ти бачиш, як далечінь стає то чистою, то молочною, то знову чистою."}, {"en": "Change Fog Height Falloff to 0.2, then 1.0. You see the fog either rise high into the sky or hug the water.", "uk": "Зміни Fog Height Falloff на 0.2, потім на 1.0. Ти бачиш, що туман або піднімається високо в небо, або стелиться над водою."}, {"en": "Fly low on the quay, looking along it. Choose fog values where the far end is softer than the near end. You see three layers: near, middle and far.", "uk": "Пролети низько над набережною, дивлячись уздовж неї. Вибери значення туману, за яких дальній кінець м'якший за ближній. Ти бачиш три шари: близький, середній і дальній."}, {"en": "Screenshot it and, in Krita, add a mid-grey layer set to Color (as on Day 15). You see whether the far parts are lighter than the near parts.", "uk": "Зроби скриншот і в Krita додай середньо-сірий шар у режимі Color (як на Дні 15). Ти бачиш, чи далекі частини світліші за близькі."}, {"en": "Write the two fog numbers in a new file, light_recipe.md. You see the start of your light recipe.", "uk": "Запиши два числа туману в новий файл light_recipe.md. Ти бачиш початок свого рецепта світла."}], "play": {"en": "Match the mood: the tutor describes a morning (soft haze, low sun from behind the camera). I tune the fog and sun until it rates my screenshot 4 of 5.", "uk": "Підбери настрій: тьютор описує ранок (м'який серпанок, низьке сонце позаду камери). Я налаштовую туман і сонце, доки тьютор не оцінить мій скриншот на 4 з 5."}, "video": {"url": "https://www.youtube.com/watch?v=SbxO-Z5rzwk", "title": "Tips for Sky Atmosphere & Fog - Unreal Engine 5 (& UE4)", "channel": "William Faucher", "length": "5:26", "search": "unreal engine 5 sky atmosphere fog lighting"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Atmosphere: fog, haze and depth (Day 19, lesson 2 of 4).\nToday's build: L_HarbourCorner: your kit lit by a written light recipe, with two composed cameras.\n\nBy the end of this lesson I can:\n1. Use Exponential Height Fog for depth: far things lighter and softer, near things darker and sharper, as in real air.\n2. Tune Fog Density (how thick) and Fog Height Falloff (how fast it thins with height) so the distance softens without turning to milk.\n3. Read a scene as foreground (near), middle ground and background (far).\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Match the mood: the tutor describes a morning (soft haze, low sun from behind the camera). I tune the fog and sun until it rates my screenshot 4 of 5.\n4. Do-along on today's build (the sun, sky and fog, and camera C1 (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Select Exponential Height Fog in the Outliner. In Details, set Fog Density to 0.01, then 0.1, then back to 0.02. You see the distance go from clear to milky to clear.\n   - Change Fog Height Falloff to 0.2, then 1.0. You see the fog either rise high into the sky or hug the water.\n   - Fly low on the quay, looking along it. Choose fog values where the far end is softer than the near end. You see three layers: near, middle and far.\n   - Screenshot it and, in Krita, add a mid-grey layer set to Color (as on Day 15). You see whether the far parts are lighter than the near parts.\n   - Write the two fog numbers in a new file, light_recipe.md. You see the start of your light recipe.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Tips for Sky Atmosphere & Fog - Unreal Engine 5 (& UE4)\" by William Faucher: https://www.youtube.com/watch?v=SbxO-Z5rzwk\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Post-process: exposure lock and a gentle grade", "uk": "Post-process: фіксація експозиції й м'яка кольорокорекція"}, "minutes": 40, "goals": [{"en": "Explain exposure (how bright the camera makes the picture) and post-process (effects on the finished picture, like a photo filter); lock exposure with a Post Process Volume so shots repeat.", "uk": "Поясни, що таке експозиція (наскільки яскравою камера робить картинку) і post-process (ефекти на готовій картинці, як фотофільтр); зафіксуй експозицію через Post Process Volume, щоб кадри повторювалися."}, {"en": "Warm or cool the picture gently with White Balance Temp (higher is warmer), and keep bloom (glow round bright spots) and vignette (dark corners) subtle.", "uk": "М'яко зігрій чи охолодь картинку через White Balance Temp (більше — тепліше), а bloom (сяйво навколо яскравих місць) і vignette (темні кути) тримай ледь помітними."}, {"en": "Write a light recipe as numbers only, so anyone can rebuild the light.", "uk": "Запиши рецепт світла лише числами, щоб будь-хто міг відтворити світло."}], "doalong": [{"en": "Window > Place Actors, search Post Process Volume and drag it in. In Details, tick Infinite Extent (Unbound). You see no change yet: the volume now covers the whole level.", "uk": "Window > Place Actors, пошукай Post Process Volume і перетягни його в рівень. У Details постав галочку Infinite Extent (Unbound). Поки що змін не видно: тепер volume покриває весь рівень."}, {"en": "Type EV100 in the search box at the top of Details. Tick Min EV100 and Max EV100 and type the same number in both. EV100 is Unreal's exposure number: a higher number makes the picture darker. If the picture is too white, go up; if it is too dark, go down, in steps of 1, until white walls are bright but keep their texture. You see the brightness stop changing as you fly from sun into shade.", "uk": "Введи EV100 у пошук угорі Details. Постав галочки Min EV100 і Max EV100 і введи в обидва однакове число. EV100 — це число експозиції в Unreal: більше число робить картинку темнішою. Якщо картинка надто біла, збільшуй; якщо надто темна, зменшуй, кроками по 1, доки білі стіни не стануть яскравими, але з видимою текстурою. Ти бачиш, що яскравість перестає змінюватися, коли летиш із сонця в тінь."}, {"en": "Type Temp in the Details search box and tick Temp. Leave Temperature Type at White Balance. Raise Temp about 250 above its default (6500): you see the picture warm a little. Lower it 250 below: you see it cool. Keep a gentle value.", "uk": "Введи Temp у пошук Details і постав галочку Temp. Temperature Type залиш на White Balance. Підніми Temp приблизно на 250 вище стандартного значення (6500): ти бачиш, що картинка трохи потеплішала. Опусти на 250 нижче: ти бачиш, що вона похолоднішала. Залиш м'яке значення."}, {"en": "Look at Bloom Intensity and Vignette Intensity and keep them low or at their defaults. You see sun glints glow softly, not smear.", "uk": "Подивися на Bloom Intensity і Vignette Intensity і тримай їх низькими або за замовчуванням. Ти бачиш, що сонячні відблиски м'яко світяться, а не розмазуються."}, {"en": "Add to light_recipe.md: the sun's Rotation and Intensity, the Sky Light's Intensity, the fog numbers, EV100 and Temp. You see every number in one place.", "uk": "Додай у light_recipe.md: Rotation і Intensity сонця, Intensity Sky Light, числа туману, EV100 і Temp. Ти бачиш усі числа в одному місці."}], "play": {"en": "One photo or two: I describe two screenshots of the same view. The tutor says whether they could be the same photograph. I change one number at a time until it says yes.", "uk": "Одне фото чи два: я описую два скриншоти того самого ракурсу. Тьютор каже, чи це може бути та сама фотографія. Я змінюю по одному числу, доки тьютор не скаже «так»."}, "video": {"search": "unreal engine 5 post process volume exposure min max ev100"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Post-process: exposure lock and a gentle grade (Day 19, lesson 3 of 4).\nToday's build: L_HarbourCorner: your kit lit by a written light recipe, with two composed cameras.\n\nBy the end of this lesson I can:\n1. Explain exposure (how bright the camera makes the picture) and post-process (effects on the finished picture, like a photo filter); lock exposure with a Post Process Volume so shots repeat.\n2. Warm or cool the picture gently with White Balance Temp (higher is warmer), and keep bloom (glow round bright spots) and vignette (dark corners) subtle.\n3. Write a light recipe as numbers only, so anyone can rebuild the light.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: One photo or two: I describe two screenshots of the same view. The tutor says whether they could be the same photograph. I change one number at a time until it says yes.\n4. Do-along on today's build (the sun, sky and fog, and camera C1 (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Window > Place Actors, search Post Process Volume and drag it in. In Details, tick Infinite Extent (Unbound). You see no change yet: the volume now covers the whole level.\n   - Type EV100 in the search box at the top of Details. Tick Min EV100 and Max EV100 and type the same number in both. EV100 is Unreal's exposure number: a higher number makes the picture darker. If the picture is too white, go up; if it is too dark, go down, in steps of 1, until white walls are bright but keep their texture. You see the brightness stop changing as you fly from sun into shade.\n   - Type Temp in the Details search box and tick Temp. Leave Temperature Type at White Balance. Raise Temp about 250 above its default (6500): you see the picture warm a little. Lower it 250 below: you see it cool. Keep a gentle value.\n   - Look at Bloom Intensity and Vignette Intensity and keep them low or at their defaults. You see sun glints glow softly, not smear.\n   - Add to light_recipe.md: the sun's Rotation and Intensity, the Sky Light's Intensity, the fog numbers, EV100 and Temp. You see every number in one place.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Cameras and composition", "uk": "Камери й композиція"}, "minutes": 40, "goals": [{"en": "Place a Cine Camera Actor (a camera with real lens settings) and pilot it (look through it and fly it). Set a 16:9 filmback (the picture's shape) and a focal length (18 to 24 mm is wide, 35 mm is normal), then lock it.", "uk": "Постав Cine Camera Actor (камеру зі справжніми налаштуваннями об'єктива) і керуй нею (дивись крізь неї й літай нею). Задай filmback 16:9 (форма кадру) і фокусну відстань (18–24 мм — ширококутний, 35 мм — нормальний), потім зафіксуй камеру."}, {"en": "Compose with the rule of thirds: put the subject on lines that split the frame into thirds. Add a leading line (a line in the scene that guides the eye) and a clear foreground, middle ground and background, and keep the horizon level.", "uk": "Компонуй за правилом третин: став об'єкт зйомки на лінії, що ділять кадр на третини. Додай провідну лінію (лінію в сцені, що веде погляд) і чіткі передній, середній і задній плани, а горизонт тримай рівним."}, {"en": "Put the strongest contrast where you want the eye to go: on your subject.", "uk": "Став найсильніший контраст туди, куди має піти погляд: на свій об'єкт зйомки."}], "doalong": [{"en": "Window > Place Actors > Cinematic > Cine Camera Actor: drag it in and rename it C1 in the Outliner. You see a camera icon in the level.", "uk": "Window > Place Actors > Cinematic > Cine Camera Actor: перетягни його в рівень і перейменуй на C1 в Outliner. Ти бачиш іконку камери в рівні."}, {"en": "Right-click C1 > Pilot 'C1'. Fly low (2 to 6 m up) looking along the quay edge. Click the eject button at the top left of the viewport to stop piloting. You see the camera stay where you left it.", "uk": "Клацни правою кнопкою C1 > Pilot 'C1'. Пролети низько (2–6 м угору), дивлячись уздовж краю набережної. Клацни кнопку виходу (eject) угорі ліворуч у в'юпорті, щоб припинити керування. Ти бачиш, що камера лишається там, де її залишено."}, {"en": "In Details, under Filmback, choose a 16:9 preset; set Current Focal Length to 24. You see the frame shape in the small camera preview.", "uk": "У Details, у розділі Filmback, вибери пресет 16:9; постав Current Focal Length на 24. Ти бачиш форму кадру в маленькому попередньому перегляді камери."}, {"en": "Pilot again and move until the shop front sits on a thirds line, the quay edge runs into the frame and the horizon is level (Rotation Roll 0). You see a picture with one clear subject.", "uk": "Знову керуй камерою й пересувайся, доки фасад крамниці не стане на лінію третин, край набережної не йтиме в кадр, а горизонт не буде рівним (Rotation Roll 0). Ти бачиш картинку з одним чітким об'єктом зйомки."}, {"en": "Right-click C1 > Transform > Lock Actor Movement, then take a screenshot through it (Win+Shift+S). You see that C1 can no longer be moved by accident.", "uk": "Клацни правою кнопкою C1 > Transform > Lock Actor Movement, потім зроби скриншот крізь неї (Win+Shift+S). Ти бачиш, що C1 більше не можна випадково зрушити."}], "play": {"en": "Critique duel: I send my C1 shot. The tutor names one composition fault. I fix it and send it again for a score out of 10. Best of three.", "uk": "Дуель критиків: я надсилаю свій кадр з C1. Тьютор називає одну ваду композиції. Я виправляю її й надсилаю знову для оцінки з 10. Гра до двох перемог із трьох."}, "video": {"url": "https://www.youtube.com/watch?v=CW8hDvJOwGM", "title": "Unreal Engine 5 Cinematic Camera Tutorial for Beginners STEP BY STEP", "channel": "EZ Unreal", "length": "7:46", "search": "unreal engine 5 cine camera actor"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Cameras and composition (Day 19, lesson 4 of 4).\nToday's build: L_HarbourCorner: your kit lit by a written light recipe, with two composed cameras.\n\nBy the end of this lesson I can:\n1. Place a Cine Camera Actor (a camera with real lens settings) and pilot it (look through it and fly it). Set a 16:9 filmback (the picture's shape) and a focal length (18 to 24 mm is wide, 35 mm is normal), then lock it.\n2. Compose with the rule of thirds: put the subject on lines that split the frame into thirds. Add a leading line (a line in the scene that guides the eye) and a clear foreground, middle ground and background, and keep the horizon level.\n3. Put the strongest contrast where you want the eye to go: on your subject.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Critique duel: I send my C1 shot. The tutor names one composition fault. I fix it and send it again for a score out of 10. Best of three.\n4. Do-along on today's build (the sun, sky and fog, and camera C1 (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Window > Place Actors > Cinematic > Cine Camera Actor: drag it in and rename it C1 in the Outliner. You see a camera icon in the level.\n   - Right-click C1 > Pilot 'C1'. Fly low (2 to 6 m up) looking along the quay edge. Click the eject button at the top left of the viewport to stop piloting. You see the camera stay where you left it.\n   - In Details, under Filmback, choose a 16:9 preset; set Current Focal Length to 24. You see the frame shape in the small camera preview.\n   - Pilot again and move until the shop front sits on a thirds line, the quay edge runs into the frame and the horizon is level (Rotation Roll 0). You see a picture with one clear subject.\n   - Right-click C1 > Transform > Lock Actor Movement, then take a screenshot through it (Win+Shift+S). You see that C1 can no longer be moved by accident.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Unreal Engine 5 Cinematic Camera Tutorial for Beginners STEP BY STEP\" by EZ Unreal: https://www.youtube.com/watch?v=CW8hDvJOwGM\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "light_recipe.md (every number)", "uk": "light_recipe.md (усі числа)"}, {"en": "harbour_C1.png and harbour_C2.png from the locked cameras, plus copies with thirds lines drawn on", "uk": "harbour_C1.png і harbour_C2.png із зафіксованих камер, а також копії з намальованими лініями третин"}, {"en": "noon_vs_golden.png (the same view at noon and in your golden light)", "uk": "noon_vs_golden.png (той самий ракурс опівдні й у твоєму золотому світлі)"}, {"en": "c1_match.png (C1 from your level beside C1 from the light-test copy)", "uk": "c1_match.png (C1 з твого рівня поруч із C1 з копії для перевірки світла)"}, {"en": "before_after_day19.png (your lesson 1 view with the default light, beside the same view with your recipe)", "uk": "before_after_day19.png (твій ракурс з уроку 1 зі стандартним світлом поруч із тим самим ракурсом за твоїм рецептом)"}, {"en": "flythrough_day19.mp4 (60 seconds)", "uk": "flythrough_day19.mp4 (60 секунд)"}, {"en": "summary.md", "uk": "звіт дня (summary.md)"}], "goal": {"en": "By the end of today you have L_HarbourCorner with your kit and water, a written light recipe for low golden light, and two Cine Cameras whose shots are composed and repeatable.", "uk": "Наприкінці сьогоднішнього дня в тебе є L_HarbourCorner з твоїм набором і водою, записаний рецепт світла для низького золотого сонця й дві Cine Camera, чиї кадри скомпоновані й повторювані."}, "uses": [{"en": "Days 10 to 18: L_KitTest with your dressed kit (quay, pier, steps, railings, LI_HarbourHouse, SM_ShopFront_A, awnings, paving, decals and props)", "uk": "Дні 10–18: L_KitTest з твоїм оздобленим набором (набережна, пірс, сходи, поручні, LI_HarbourHouse, SM_ShopFront_A, маркізи, бруківка, декалі й пропси)"}, {"en": "Days 12 to 18: your materials, palette, seamless textures, awnings and decals, which light now shows off", "uk": "Дні 12–18: твої матеріали, палітра, безшовні текстури, маркізи й декалі, які тепер покаже світло"}, {"en": "Day 15: matching a view, the sun (Ctrl+L) and bookmarks", "uk": "День 15: підбір ракурсу, сонце (Ctrl+L) і закладки"}], "quiz": [{"q": {"en": "Which actor gives the scene haze and depth?", "uk": "Який актор дає сцені серпанок і глибину?"}, "options": [{"en": "Directional Light", "uk": "Directional Light"}, {"en": "Sky Light", "uk": "Sky Light"}, {"en": "Exponential Height Fog", "uk": "Exponential Height Fog"}, {"en": "Post Process Volume", "uk": "Post Process Volume"}], "answer": 2, "explain": {"en": "Exponential Height Fog makes far things lighter and softer, as real air does.", "uk": "Exponential Height Fog робить далекі об'єкти світлішими й м'якшими, як справжнє повітря."}}, {"q": {"en": "At noon your harbour looks flat and the textures don't show. What helps most?", "uk": "Опівдні твоя гавань виглядає пласкою, і текстур не видно. Що допоможе найбільше?"}, "options": [{"en": "Lower the sun to 10 to 20 degrees and bring it from the side", "uk": "Опустити сонце до 10–20 градусів і направити його збоку"}, {"en": "Raise Metallic on every material", "uk": "Підняти Metallic на кожному матеріалі"}, {"en": "Add fog until the scene is white", "uk": "Додавати туман, доки сцена не стане білою"}, {"en": "Make every texture brighter", "uk": "Зробити кожну текстуру яскравішою"}], "answer": 0, "explain": {"en": "Low side light makes long shadows and rakes across surfaces, so texture and shape show.", "uk": "Низьке бічне світло дає довгі тіні й ковзає по поверхнях, тож видно текстуру й форму."}}, {"q": {"en": "Flying from shade into sun, the picture keeps getting brighter and darker, so your shots never match. What is the fix?", "uk": "Коли летиш із тіні на сонце, картинка постійно стає то яскравішою, то темнішою, тож кадри ніколи не збігаються. Як це виправити?"}, "options": [{"en": "Delete the Sky Light", "uk": "Видалити Sky Light"}, {"en": "A Post Process Volume with Infinite Extent and Min EV100 = Max EV100", "uk": "Post Process Volume з Infinite Extent і Min EV100 = Max EV100"}, {"en": "Turn off Lumen", "uk": "Вимкнути Lumen"}], "answer": 1, "explain": {"en": "Unreal changes exposure by itself, like an eye. Locking Min and Max to one value stops it.", "uk": "Unreal сам змінює експозицію, як око. Фіксація Min і Max на одному значенні це зупиняє."}}, {"q": {"en": "What is a leading line in a shot?", "uk": "Що таке провідна лінія в кадрі?"}, "options": [{"en": "The horizon at the very top", "uk": "Горизонт у самому верху"}, {"en": "A line drawn on the screen in the editor", "uk": "Лінія, намальована на екрані в редакторі"}, {"en": "A red line marking a drone lane", "uk": "Червона лінія, що позначає коридор для дрона"}, {"en": "A line in the scene, like a quay edge, that guides the eye to the subject", "uk": "Лінія в сцені, як-от край набережної, що веде погляд до об'єкта зйомки"}], "answer": 3, "explain": {"en": "Lines in the scene pull the eye along them. Aim them at your subject.", "uk": "Лінії в сцені ведуть погляд уздовж себе. Спрямовуй їх на свій об'єкт зйомки."}}, {"q": {"en": "In C2 the far shore is as dark and sharp as the pier in front. What adds depth?", "uk": "У C2 дальній берег такий самий темний і чіткий, як пірс попереду. Що додасть глибини?"}, "options": [{"en": "More triangles on the far shore", "uk": "Більше трикутників на дальньому березі"}, {"en": "A little more fog density, so far things get lighter and softer", "uk": "Трохи більша щільність туману, щоб далекі об'єкти стали світлішими й м'якшими"}, {"en": "A longer focal length", "uk": "Довша фокусна відстань"}], "answer": 1, "explain": {"en": "Real air softens distant things. A little more fog gives the eye near, middle and far.", "uk": "Справжнє повітря пом'якшує далекі об'єкти. Трохи більше туману дає оку близький, середній і дальній плани."}}], "weekInfo": {"week": 4, "title": {"en": "The Unreal look", "uk": "Вигляд в Unreal"}, "goal": {"en": "By Friday you have a lit, dressed 30 x 30 m harbour corner built from your own kit, with colours from real photos, seamless textures, decals, a written light recipe and two composed camera shots.", "uk": "До п'ятниці в тебе є освітлений і наповнений куток гавані 30 x 30 м, зібраний з твого власного набору: кольори зі справжніх фото, безшовні текстури, декалі, записаний рецепт світла й два скомпоновані кадри з камери."}, "skills": [{"en": "Colour palettes sampled from real photographs for consistent art direction", "uk": "Кольорові палітри, взяті зі справжніх фотографій, для цілісного художнього стилю"}, {"en": "Seamless tiling texture creation at real-world scale", "uk": "Створення безшовних тайлових текстур у реальному масштабі"}, {"en": "Decal-based weathering and environmental storytelling in Unreal Engine 5", "uk": "Зношеність за допомогою декалей і розповідь через оточення (environmental storytelling) в Unreal Engine 5"}, {"en": "Lumen lighting, atmosphere and post-process exposure for outdoor scenes", "uk": "Освітлення Lumen, атмосфера й експозиція post-process для сцен просто неба"}, {"en": "Shot composition with Cine Camera Actors", "uk": "Композиція кадру з Cine Camera Actor"}]}, "morning": {"sofar": {"en": "Your kit has materials, wear, a real palette, seamless textures and decals that show where water and wheels have been.", "uk": "У твого набору є матеріали, зношеність, справжня палітра, безшовні текстури й декалі, що показують, де пройшли вода й колеса."}, "today": {"en": "You light L_HarbourCorner with Lumen, sky, fog and exposure, write your own light recipe, and compose two cameras.", "uk": "Сьогодні ти освітлюєш L_HarbourCorner за допомогою Lumen, неба, туману й експозиції, записуєш власний рецепт світла й компонуєш дві камери."}, "cheer": {"en": "Light can change a scene in a minute, so play freely; your written recipe always brings you back to a look you like.", "uk": "Світло може змінити сцену за хвилину, тож грайся вільно: записаний рецепт завжди поверне тебе до вигляду, який тобі до вподоби."}, "quote": {"text": {"en": "An artist should be open on all sides to every kind of light and darkness.", "uk": "Митець має відкриватися з усіх боків назустріч будь-якому світлу й будь-якій темряві."}, "author": {"en": "John Steinbeck", "uk": "Джон Стейнбек"}, "source": "https://en.wikiquote.org/wiki/John_Steinbeck"}}, "hasAssets": false, "workPath": "Work\\Assignment\\Day-19-light-atmosphere-cameras", "mapHref": "../../COURSE.html", "prevHref": "../Day-18-decals-salt-algae-puddles-tracks/START-HERE.html", "nextHref": "../Day-20-boss-harbour-corner/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8 and Krita. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me and don't write code. Keep me moving and make it feel like a game.\n\nToday I build on my own: Exposure, the recipe, camera C2 and the repeat check, on your own.\nIt's part of: L_HarbourCorner: your kit lit by a written light recipe, with two composed cameras (A new level, L_HarbourCorner, in Course/Day19. Your island's light is written the same way: sky_recipe.md on Day 30, grown for the whole island on Day 32.).\n\nSpec:\n- L_HarbourCorner (File > New Level > Basic) with your dressed kit and the Land block copied in from L_KitTest, the new Floor lowered to Z -400 as the sea bed, and water 1 m below the quay top (Z -100, where L_KitTest's stand-in water was) on every open side.\n- The outdoor set: Directional Light (the sun), Sky Light, Sky Atmosphere and Exponential Height Fog, with Lumen for bounced light and reflections.\n- Golden light: the sun about 10 to 20 degrees above the horizon, coming from the side of your main view.\n- Exposure locked: a Post Process Volume with Infinite Extent (Unbound) on and Min EV100 = Max EV100.\n- light_recipe.md with every number: sun rotation and intensity, Sky Light intensity, fog density and height falloff, EV100 and white balance Temp (a higher Temp warms the picture).\n- Two Cine Camera Actors with a 16:9 filmback: C1 low along the quay (2 to 6 m up, 24 mm) and C2 high and wide (25 to 30 m up, 18 to 24 mm), each composed on thirds and locked.\n- A repeat check: the light rebuilt from light_recipe.md alone, in a copy of the level, matches the original from C1.\n\nMy checklist:\n1. Finish the level from lesson 1: the Land block sits behind the quay with its top level with the deck (Z 0); scale it if needed so the land reaches the back of the area you will dress tomorrow. The new Floor is at Z -400, below the foot of the quay wall. Check: from 2 m, the land meets the quay with no step and no gap, and the quay wall shows down into the water. (from lesson 1)\n2. Water: the Water Body Lake from lesson 1 (or the smooth dark plane) is at least 80 x 80 m, so it runs under the Land block and fills every open side, at Z -100 (1 m below the quay top). Check: from the quay at 2 m, the water meets the wall with no gap. (from lesson 1)\n3. Sun for golden light: hold Ctrl+L and move the mouse until the sun is 10 to 20 degrees high and rakes across the shop front; write its Rotation from Details. Check: long shadows, and the trim and wear catch the light. (from lesson 1)\n4. Fog: set Fog Density and Fog Height Falloff so the far side of the water softens but keeps its shape. Check: from C2's height, near things are darker and sharper than far things. (from lesson 2)\n5. Post Process Volume: Infinite Extent (Unbound) on, Min EV100 = Max EV100 at a value where white walls are bright but keep their texture. Check: flying from sun into shade, the brightness no longer changes by itself. (from lesson 3)\n6. White balance: in the same volume, change Temp in small steps (about 250) from its default of 6500. With Temperature Type left at White Balance, a higher Temp warms the picture and a lower one cools it. Check: whites look a little warm or cool, never orange or blue. (from lesson 3)\n7. Write light_recipe.md with every number from today, plus the sun's Intensity and the Sky Light's Intensity. Check: nothing in the recipe says 'about' or 'some'. (from lesson 3)\n8. C1: finish its composition: the quay edge as a leading line into the frame, the shop front on a third, the horizon level (Roll 0). Lock it. Check: on a copy of the screenshot with thirds lines drawn in Krita, the shop front sits on a line. (from lesson 4)\n9. C2: a second Cine Camera Actor 25 to 30 m up, 18 to 24 mm, with the whole kit and water in frame and the sky in the top third. Lock it. Check: the pier, building and water all read in a 3-second look. (from lesson 4)\n10. Repeat check: in the Content Browser right-click L_HarbourCorner > Duplicate, name it L_HarbourCorner_LightTest and open it. Reset the sun, Sky Light, fog and post-process values (the yellow reset arrows in Details), rebuild them from light_recipe.md alone and shoot C1. Check: the two C1 shots look like the same photo. (from lesson 3)\n11. Before/after capture: your first screenshot from lesson 1 (the Basic level's default light) beside the same view in your recipe. Then a 60-second clip flying from C1 to C2. Save today's clip as flythrough_day19.mp4 and check that you also have harbour_C1.png, harbour_C2.png, noon_vs_golden.png, c1_match.png and before_after_day19.png (each is described in today's hand-in list; take any you are missing now). Check: the brightness stays steady in the clip. (from lesson 3)\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Kateryna B.\nDay 19: Light and atmosphere: Lumen, sky, fog, exposure and two composed cameras. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p><div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+list(D.handin,'ul','ticks')+'<p class="path">'+ic('folder')+'<span>'+u('shipTo')+' <code>'+esc(D.workPath)+'</code></span></p>'+(D.lessons.length?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<p class="muted">'+u('report')+'</p><div class="row"><button class="btn s" onclick="cp(D.reportPrompt)">'+ic('copy')+u('copyR')+'</button></div></section>';
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();

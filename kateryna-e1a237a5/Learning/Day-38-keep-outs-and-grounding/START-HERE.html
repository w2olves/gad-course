<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 38</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

details{margin-top:22px;border-radius:20px;background:var(--well);box-shadow:var(--press);padding:0 18px}

r, the lake, both district squares, and the scenic route where it crosses plants); the grounding pass and footprint test on your transect and in the forest valley.", "uk": "L_Island: зони-винятки по всьому острову (кожна дорога, річка, озеро, обидва квадрати районів і мальовничий маршрут там, де він перетинає рослини); прохід посадки на ґрунт і тест опори — на твоїй трансекті й у лісовій долині."}, "spec": [{"en": "keepouts.md: every keep-out, its tag, its half-width and why. Roads and the river: 500 cm (a 6 m road plus 2 m verges). The flight corridor: 700 cm (a 2 m half-lane, a 2 m margin and 3 m for tree crowns). Districts and the lake: the whole area plus about 10 m.", "uk": "keepouts.md: кожна зона-виняток, її тег, її половинна ширина й чому. Дороги й річка: 500 см (дорога 6 м плюс узбіччя по 2 м). Льотний коридор: 700 см (половина проходу 2 м, запас 2 м і 3 м на крони дерев). Райони й озеро: уся площа плюс приблизно 10 м."}, {"en": "Line keep-outs: Empty Actors with a Spline component drawn along each road and the river (KO_Road01, KO_Lane01, KO_River01...), each with the actor tag KeepOut (Details > Actor > Tags); the corridor (KO_Corridor01...) tagged KeepOutWide. A river wider than about 6 m gets a closed loop tagged KeepOutArea instead.", "uk": "Лінійні зони-винятки: Empty Actors з компонентом Spline, проведені вздовж кожної дороги й річки (KO_Road01, KO_Lane01, KO_River01...), кожен із тегом актора KeepOut (Details > Actor > Tags); коридор (KO_Corridor01...) з тегом KeepOutWide. Річка, ширша приблизно за 6 м, натомість отримує замкнений контур із тегом KeepOutArea."}, {"en": "Area keep-outs: closed-loop splines (Closed Loop ticked) round each district square and the lake (KO_District1, KO_District2, KO_Lake), tagged KeepOutArea.", "uk": "Площинні зони-винятки: сплайни із замкненим контуром (Closed Loop увімкнено) довкола кожного квадрата району й озера (KO_District1, KO_District2, KO_Lake) з тегом KeepOutArea."}, {"en": "Every biome graph subtracts them with three branches, one per tag: Get Spline Data (Actor Filter All World Actors, Actor Selection By Tag, the tag, Select Multiple ticked) > Spline Sampler > Bounds Modifier (Mode Set) > the Differences pin of one Difference node (Density Function Binary), just before Transform Points. A tree chain gets its own Difference fed by the same three branches.", "uk": "Кожен граф біому віднімає їх трьома гілками, по одній на тег: Get Spline Data (Actor Filter All World Actors, Actor Selection By Tag, тег, Select Multiple увімкнено) > Spline Sampler > Bounds Modifier (Mode Set) > пін Differences одного вузла Difference (Density Function Binary), одразу перед Transform Points. Ланцюжок дерев отримує власний Difference, який живлять ті самі три гілки."}, {"en": "Every KO_ actor on DL_KeepOuts with Is Spatially Loaded unticked, so every graph always finds it (keep DL_KeepOuts loaded; hide it with its eye if it is in the way); the forest boxes moved or shrunk so no trunk stands in a keep-out; LaneGauge, a 4 x 4 x 4 m gauge cube, passes along the corridor.", "uk": "Кожен актор KO_ на DL_KeepOuts з вимкненим Is Spatially Loaded, тож кожен граф завжди його знаходить (тримай DL_KeepOuts завантаженим; якщо він заважає, сховай його оком); коробки лісу пересунуті чи зменшені так, щоб жоден стовбур не стояв у зоні-винятку; LaneGauge, калібровий куб 4 x 4 x 4 м, проходить уздовж коридору."}, {"en": "Grounding in every graph: trees upright (Absolute Rotation) and sunk by their footprint (sink = root radius x the slope's tangent: 0.36 m for 1 m on 20 degrees); shrubs sunk a little; footprint_test.md shows fewer than 1 in 20 floating per layer.", "uk": "Посадка на ґрунт у кожному графі: дерева стоять прямо (Absolute Rotation) і заглиблені на розмір своєї опори (заглиблення = радіус кореня x тангенс схилу: 0,36 м для 1 м на 20 градусах); кущі трохи заглиблені; footprint_test.md показує менше 1 з 20 висячих на шар."}], "piece1": "the road and river keep-outs in your first graph", "piece2": {"en": "Areas, the corridor, the grounding and the footprint test, on your own", "uk": "Площі, коридор, посадка на ґрунт і тест опори, самостійно"}, "steps": [{"text": {"en": "Write keepouts.md with every keep-out, its tag (KeepOut, KeepOutArea or KeepOutWide) and its half-width. Check: roads, river, lake, both districts and the corridor are listed.", "uk": "Напиши keepouts.md з кожною зоною-винятком, її тегом (KeepOut, KeepOutArea чи KeepOutWide) і половинною шириною. Перевірка: дороги, річка, озеро, обидва райони й коридор є в списку."}, "lesson": 1}, {"text": {"en": "Draw KO_Road01 along the main road, KO_Lane01 along the lane and KO_River01 along the river; give each the actor tag KeepOut. Check: Details > Tags shows KeepOut on each.", "uk": "Проведи KO_Road01 уздовж головної дороги, KO_Lane01 уздовж вузької дороги й KO_River01 уздовж річки; дай кожному тег актора KeepOut. Перевірка: Details > Tags показує KeepOut на кожному."}, "lesson": 1}, {"text": {"en": "In your first biome graph add the KeepOut branch: Get Spline Data (All World Actors, By Tag, KeepOut, Select Multiple ticked), Spline Sampler and Bounds Modifier (Mode Set). Check: with D on the Bounds Modifier you see tall boxes along the road, the lane and the river.", "uk": "У своєму першому графі біому додай гілку KeepOut: Get Spline Data (All World Actors, By Tag, KeepOut, Select Multiple увімкнено), Spline Sampler і Bounds Modifier (Mode Set). Перевірка: з D на Bounds Modifier видно високі коробки вздовж дороги, вузької дороги й річки."}, "lesson": 1}, {"text": {"en": "Add the Difference node before Transform Points, with your plants in Source and the keep-out points in Differences. If the graph has a tree chain, add a second Difference before its Transform Points too, fed by the same Bounds Modifier (one output can feed several nodes). Generate. Check: both verges of the road are clear from 10 m, and nothing grows in the river.", "uk": "Додай вузол Difference перед Transform Points, з рослинами в Source і точками зон-винятків у Differences. Якщо в графі є ланцюжок дерев, додай другий Difference і перед його Transform Points, який живить той самий Bounds Modifier (один вихід може живити кілька вузлів). Запусти Generate. Перевірка: з 10 м обидва узбіччя дороги чисті, і в річці нічого не росте."}, "lesson": 1}, {"text": {"en": "Draw closed loops KO_District1, KO_District2 and KO_Lake, tagged KeepOutArea, and add the KeepOutArea branch (Dimension On Interior, Treat Spline As Polyline) to the same Difference. Check: both district squares and the lake are empty of plants.", "uk": "Проведи замкнені контури KO_District1, KO_District2 і KO_Lake з тегом KeepOutArea і додай гілку KeepOutArea (Dimension On Interior, Treat Spline As Polyline) до того самого Difference. Перевірка: обидва квадрати районів і озеро вільні від рослин."}, "lesson": 2}, {"text": {"en": "Draw KO_Corridor01 on the ground under the scenic route where it crosses plants, tagged KeepOutWide, and add its 700 cm branch. Check: an open lane runs through the plants along the route.", "uk": "Проведи KO_Corridor01 по землі під мальовничим маршрутом там, де він перетинає рослини, з тегом KeepOutWide, і додай його гілку на 700 см. Перевірка: крізь рослини вздовж маршруту йде відкритий прохід."}, "lesson": 2}, {"text": {"en": "Copy the three keep-out branches into your other two biome graphs (Ctrl+C, Ctrl+V), add a Difference before each Transform Points as in your first graph, and Generate each. Check: no plant of any biome stands in any keep-out.", "uk": "Скопіюй три гілки зон-винятків у два інші графи біомів (Ctrl+C, Ctrl+V), додай Difference перед кожним Transform Points, як у першому графі, і запусти Generate для кожного. Перевірка: жодна рослина жодного біому не стоїть у жодній зоні-винятку."}, "lesson": 2}, {"text": {"en": "Put every KO_ actor on DL_KeepOuts and untick Is Spatially Loaded on each; move or shrink the forest boxes out of the keep-outs. Check: from 30 m no forest tree stands on a road, in a district or in the corridor.", "uk": "Постав кожен актор KO_ на DL_KeepOuts і вимкни на кожному Is Spatially Loaded; пересунь чи зменш коробки лісу так, щоб вони вийшли із зон-винятків. Перевірка: з 30 м жодне лісове дерево не стоїть на дорозі, у районі чи в коридорі."}, "lesson": 2}, {"text": {"en": "Make LaneGauge (a Cube at Scale 4, 4, 4) and move it along the corridor at the route's height; widen any stretch where crowns touch it. Check: the gauge passes the whole corridor with no overlap.", "uk": "Зроби LaneGauge (Cube зі Scale 4, 4, 4) і проведи його вздовж коридору на висоті маршруту; розшир кожну ділянку, де його торкаються крони. Перевірка: калібр проходить увесь коридор без жодного перетину."}, "lesson": 2}, {"text": {"en": "Bookmark a low camera on your steepest slope and take a 'before' screenshot; then ground the trees: Absolute Rotation and a negative Z offset in each tree chain. Check: from 2 m on a slope, trunks stand straight and the downhill root flare touches the ground.", "uk": "Збережи закладку низької камери на найкрутішому схилі й зроби скріншот «до»; потім посади дерева на ґрунт: Absolute Rotation і від'ємний зсув за Z у кожному ланцюжку дерев. Перевірка: з 2 м на схилі стовбури стоять прямо, а розширення кореня з боку спуску торкається ґрунту."}, "lesson": 3}, {"text": {"en": "Ground the shrubs: a small negative Z offset, and a stricter slope limit for the biggest ones. Check: no daylight under shrubs on the steepest part of each band.", "uk": "Посади на ґрунт кущі: невеликий від'ємний зсув за Z і суворіша межа схилу для найбільших. Перевірка: на найкрутішій частині кожної смуги під кущами немає просвіту."}, "lesson": 3}, {"text": {"en": "Footprint test: 20 random instances per layer from a low side view, written in footprint_test.md. Check: each layer has 20 rows marked grounded or floating.", "uk": "Тест опори: 20 випадкових екземплярів на шар з низького виду збоку, записані у footprint_test.md. Перевірка: у кожному шарі 20 рядків з позначкою «стоїть» або «висить»."}, "lesson": 4}, {"text": {"en": "Fix and re-test every layer with 2 or more floating in 20. Check: every layer is under 1 in 20.", "uk": "Виправ і перевір знову кожен шар, де 2 або більше висять із 20. Перевірка: кожен шар має менше 1 з 20."}, "lesson": 4}, {"text": {"en": "Before/after capture: the worst slope's bases before and after the grounding pass, from the same low camera; then a 60-second clip along the cleared corridor in Play. Check that you also have lane_gauge.png, verge_10m.png and districts_empty.png (each is described in today's hand-in list; take any you are missing now). Check: before_after_day38.png and flythrough_day38.mp4 are saved.", "uk": "Знімок до/після: основи на найгіршому схилі до й після проходу посадки на ґрунт, з тієї самої низької камери; потім 60-секундне відео вздовж звільненого коридору в Play. Перевір, що в тебе також є lane_gauge.png, verge_10m.png і districts_empty.png (кожен описаний у сьогоднішньому списку «Здати роботу»; зроби зараз ті, яких бракує). Перевірка: before_after_day38.png і flythrough_day38.mp4 збережені."}, "lesson": "D33.2"}], "assets": []}, "lessons": [{"title": {"en": "Keep-outs along lines: roads and rivers", "uk": "Зони-винятки вздовж ліній: дороги й річки"}, "minutes": 40, "goals": [{"en": "Explain a keep-out: an area PCG must leave empty, drawn once and subtracted every time a graph runs.", "uk": "Пояснити зону-виняток: ділянка, яку PCG має лишити порожньою; її малюють один раз і віднімають щоразу, коли запускається граф."}, {"en": "Explain a tag: a word you add to an actor (Details > Actor > Tags) so a graph can find it; the graph looks for the exact word, so spell it the same everywhere.", "uk": "Пояснити тег: слово, яке ти додаєш акторові (Details > Actor > Tags), щоб граф міг його знайти; граф шукає саме це слово, тож пиши його всюди однаково."}, {"en": "Build the chain: Get Spline Data finds every spline with the tag, Spline Sampler puts points along them, Bounds Modifier gives each point the keep-out's size, and Difference removes your plant points that touch them.", "uk": "Збудувати ланцюжок: Get Spline Data знаходить кожен сплайн із тегом, Spline Sampler ставить точки вздовж них, Bounds Modifier дає кожній точці розмір зони-винятку, а Difference прибирає точки рослин, що їх торкаються."}], "doalong": [{"en": "In Place Actors open Basic and drag in an Empty Actor; name it KO_Road01. In Details click + Add and choose Spline. You see a short spline with two points.", "uk": "У Place Actors відкрий Basic і перетягни Empty Actor; назви його KO_Road01. У Details клікни + Add і вибери Spline. Ти бачиш короткий сплайн із двома точками."}, {"en": "Select the spline's end point and Alt+drag to add points along your main road, every 30 to 50 m. You see the spline follow the road.", "uk": "Виділи кінцеву точку сплайна й Alt+перетягуй, щоб додавати точки вздовж головної дороги кожні 30–50 м. Ти бачиш, як сплайн іде за дорогою."}, {"en": "In Details open Actor > Tags (click the small arrow for advanced settings if you can't see it), click + and type KeepOut. Make KO_Lane01 along the lane and KO_River01 along the river the same way, each tagged KeepOut. You see the tag on all three.", "uk": "У Details розгорни Actor > Tags (клікни маленьку стрілку для додаткових налаштувань, якщо його не видно), клікни + і введи KeepOut. Так само зроби KO_Lane01 уздовж вузької дороги й KO_River01 уздовж річки, кожен із тегом KeepOut. Ти бачиш тег на всіх трьох."}, {"en": "Open your first biome graph. Add Get Spline Data and set Actor Filter to All World Actors, Actor Selection to By Tag and Actor Selection Tag to KeepOut, and tick Select Multiple (without it the node finds only the first matching spline). Add a Spline Sampler after it: Mode Distance, Distance Increment 100 (cm). Press D on the sampler. You see points along the road, the lane and the river.", "uk": "Відкрий свій перший граф біому. Додай Get Spline Data і встанови Actor Filter на All World Actors, Actor Selection на By Tag, а Actor Selection Tag на KeepOut, і увімкни Select Multiple (без нього вузол знаходить лише перший відповідний сплайн). Додай після нього Spline Sampler: Mode Distance, Distance Increment 100 (см). Натисни D на семплері. Ти бачиш точки вздовж дороги, вузької дороги й річки."}, {"en": "Add a Bounds Modifier after the sampler: Mode Set, Bounds Min -500, -500, -5000 and Bounds Max 500, 500, 5000 (a box 10 m wide and 100 m tall round each point, so slopes cannot escape it). Press D on it. You see tall boxes along the road.", "uk": "Додай Bounds Modifier після семплера: Mode Set, Bounds Min -500, -500, -5000 і Bounds Max 500, 500, 5000 (коробка 10 м завширшки й 100 м заввишки довкола кожної точки, тож схили з неї не вислизнуть). Натисни на ньому D. Ти бачиш високі коробки вздовж дороги."}, {"en": "Add a Difference just before Transform Points: the wire that went into Transform Points now goes into Difference's Source pin, the Bounds Modifier into its Differences pin, and Difference's output into Transform Points. Set Density Function to Binary (overlapping points are removed outright). Generate. You see clear verges on both sides of the road.", "uk": "Додай Difference одразу перед Transform Points: дріт, що йшов у Transform Points, тепер іде в пін Source вузла Difference, Bounds Modifier — у його пін Differences, а вихід Difference — у Transform Points. Встанови Density Function на Binary (точки, що перетинаються, прибираються повністю). Запусти Generate. Ти бачиш чисті узбіччя по обидва боки дороги."}], "play": {"en": "Width call: the tutor names five things to keep clear (a 6 m road, a 10 m river, a footpath, a 4 m flight lane through tall pines, a district square); I give each half-width, and why.", "uk": "Виклик ширини: тьютор називає п'ять речей, які треба тримати вільними (дорога 6 м, річка 10 м, пішохідна стежка, льотний прохід 4 м крізь високі сосни, квадрат району); я даю половинну ширину для кожної й пояснюю чому."}, "video": {"url": "https://www.youtube.com/watch?v=Pa6Gt0fV8Oc", "title": "How to Create Paths in Your Forest Biome Using Splines & PCG | Unreal Engine 5", "channel": "All things GAME!", "length": "18:04", "search": "unreal engine pcg spline exclusion paths forest"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Keep-outs along lines: roads and rivers (Day 38, lesson 1 of 4).\nToday's build: Keep-outs that clear the roads, the river, the lake, both districts and the flight corridor in every biome graph, read by three tags (KeepOut, KeepOutArea and KeepOutWide), and a grounding pass proved by the footprint test, so trees stand upright and nothing floats.\n\nBy the end of this lesson I can:\n1. Explain a keep-out: an area PCG must leave empty, drawn once and subtracted every time a graph runs.\n2. Explain a tag: a word you add to an actor (Details > Actor > Tags) so a graph can find it; the graph looks for the exact word, so spell it the same everywhere.\n3. Build the chain: Get Spline Data finds every spline with the tag, Spline Sampler puts points along them, Bounds Modifier gives each point the keep-out's size, and Difference removes your plant points that touch them.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (Your island has a biome map and three biome graphs, tested together on a strip from the sea to the summit.), what I will learn today (You add keep-outs that clear the roads, the water, both districts and the flight corridor, and prove with a footprint test that nothing floats.), encourage me (Checking that nothing floats is the quiet craft behind every believable world, and you already have the tools to do it well.), and share today's quote: \"Heaven is under our feet as well as over our heads.\" (Henry David Thoreau).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 35: why did you split the forest into boxes on either side of the road? | Day 31: what Half-Width did you give the main road, and how wide is it really?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Width call: the tutor names five things to keep clear (a 6 m road, a 10 m river, a footpath, a 4 m flight lane through tall pines, a district square); I give each half-width, and why.\n6. Do-along on today's build (the road and river keep-outs in your first graph): guide me through these steps one at a time, checking a screenshot after each:\n   - In Place Actors open Basic and drag in an Empty Actor; name it KO_Road01. In Details click + Add and choose Spline. You see a short spline with two points.\n   - Select the spline's end point and Alt+drag to add points along your main road, every 30 to 50 m. You see the spline follow the road.\n   - In Details open Actor > Tags (click the small arrow for advanced settings if you can't see it), click + and type KeepOut. Make KO_Lane01 along the lane and KO_River01 along the river the same way, each tagged KeepOut. You see the tag on all three.\n   - Open your first biome graph. Add Get Spline Data and set Actor Filter to All World Actors, Actor Selection to By Tag and Actor Selection Tag to KeepOut, and tick Select Multiple (without it the node finds only the first matching spline). Add a Spline Sampler after it: Mode Distance, Distance Increment 100 (cm). Press D on the sampler. You see points along the road, the lane and the river.\n   - Add a Bounds Modifier after the sampler: Mode Set, Bounds Min -500, -500, -5000 and Bounds Max 500, 500, 5000 (a box 10 m wide and 100 m tall round each point, so slopes cannot escape it). Press D on it. You see tall boxes along the road.\n   - Add a Difference just before Transform Points: the wire that went into Transform Points now goes into Difference's Source pin, the Bounds Modifier into its Differences pin, and Difference's output into Transform Points. Set Density Function to Binary (overlapping points are removed outright). Generate. You see clear verges on both sides of the road.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"How to Create Paths in Your Forest Biome Using Splines & PCG | Unreal Engine 5\" by All things GAME!: https://www.youtube.com/watch?v=Pa6Gt0fV8Oc\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Keep-outs for areas and flight corridors", "uk": "Зони-винятки для площ і льотних коридорів"}, "minutes": 40, "goals": [{"en": "Clear whole areas with closed-loop splines: the Spline Sampler's Dimension On Interior fills the inside with points to subtract, and Treat Spline As Polyline keeps the sides straight between your corner points.", "uk": "Звільняти цілі площі сплайнами із замкненим контуром: Dimension On Interior у Spline Sampler заповнює середину точками для віднімання, а Treat Spline As Polyline тримає сторони прямими між кутовими точками."}, {"en": "Explain a flight corridor: the 3D lane a pilot flies (a 4 x 4 m opening plus margins); its keep-out must clear tree crowns, not only trunks.", "uk": "Пояснити льотний коридор: тривимірний прохід, яким летить пілот (отвір 4 x 4 м плюс запас); його зона-виняток має звільняти крони дерев, а не лише стовбури."}, {"en": "Prove a corridor with a gauge: a 4 x 4 x 4 m cube moved along the lane at its height.", "uk": "Доводити коридор калібром: кубом 4 x 4 x 4 м, який ведуть уздовж проходу на його висоті."}], "doalong": [{"en": "Make KO_District1: an Empty Actor with a Spline; give it four points at the corners of district 1's square, about 10 m outside it; tick Closed Loop in the spline's Details; tag it KeepOutArea. Do the same for KO_District2 and KO_Lake (more points for the lake's shape). You see three closed loops.", "uk": "Зроби KO_District1: Empty Actor зі Spline; дай йому чотири точки в кутах квадрата району 1, приблизно на 10 м за його межами; увімкни Closed Loop у Details сплайна; дай йому тег KeepOutArea. Те саме зроби для KO_District2 і KO_Lake (для форми озера — більше точок). Ти бачиш три замкнені контури."}, {"en": "In your graph copy the KeepOut branch and set the copy's tag to KeepOutArea. In its Spline Sampler set Dimension to On Interior, Interior Sample Spacing 300 and tick Treat Spline As Polyline; set its Bounds Modifier to -200, -200, -5000 and 200, 200, 5000. Wire it into the same Difference's Differences pin and Generate. You see the district squares and the lake empty.", "uk": "У своєму графі скопіюй гілку KeepOut і встанови копії тег KeepOutArea. У її Spline Sampler встанови Dimension на On Interior, Interior Sample Spacing 300 і увімкни Treat Spline As Polyline; встанови її Bounds Modifier на -200, -200, -5000 і 200, 200, 5000. З'єднай її з піном Differences того самого Difference і запусти Generate. Ти бачиш, що квадрати районів і озеро порожні."}, {"en": "Draw KO_Corridor01 on the ground under the scenic route where it crosses plants; tag it KeepOutWide. Copy the KeepOut branch once more with the tag KeepOutWide and Bounds -700, -700, -5000 and 700, 700, 5000. Generate. You see an open lane under the route.", "uk": "Проведи KO_Corridor01 по землі під мальовничим маршрутом там, де він перетинає рослини; дай йому тег KeepOutWide. Ще раз скопіюй гілку KeepOut з тегом KeepOutWide і Bounds -700, -700, -5000 і 700, 700, 5000. Запусти Generate. Ти бачиш відкритий прохід під маршрутом."}, {"en": "In Place Actors open Shapes and drag in a Cube; set Scale to 4, 4, 4 and name it LaneGauge. Move it along the corridor at the route's height. You see where it touches a crown; widen that stretch.", "uk": "У Place Actors відкрий Shapes і перетягни Cube; встанови Scale 4, 4, 4 і назви його LaneGauge. Проведи його вздовж коридору на висоті маршруту. Ти бачиш, де він торкається крони; розшир цю ділянку."}], "play": {"en": "Gauge run: I describe moving the gauge along my corridor in one go; every touch the tutor finds in my screenshots costs one of three lives.", "uk": "Прохід калібром: я описую, як веду калібр уздовж свого коридору за один раз; кожен дотик, який тьютор знаходить на моїх скріншотах, коштує одне з трьох життів."}, "video": {"url": "https://www.youtube.com/watch?v=08kunzHcPV8", "title": "How to design an FPV racetrack that FLOWS - Happy Flying #26", "channel": "UAVfutures", "length": "8:17", "search": "fpv racetrack design flow"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Keep-outs for areas and flight corridors (Day 38, lesson 2 of 4).\nToday's build: Keep-outs that clear the roads, the river, the lake, both districts and the flight corridor in every biome graph, read by three tags (KeepOut, KeepOutArea and KeepOutWide), and a grounding pass proved by the footprint test, so trees stand upright and nothing floats.\nEarlier today I already did: lesson 1 (Keep-outs along lines: roads and rivers). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Clear whole areas with closed-loop splines: the Spline Sampler's Dimension On Interior fills the inside with points to subtract, and Treat Spline As Polyline keeps the sides straight between your corner points.\n2. Explain a flight corridor: the 3D lane a pilot flies (a 4 x 4 m opening plus margins); its keep-out must clear tree crowns, not only trunks.\n3. Prove a corridor with a gauge: a 4 x 4 x 4 m cube moved along the lane at its height.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Gauge run: I describe moving the gauge along my corridor in one go; every touch the tutor finds in my screenshots costs one of three lives.\n4. Do-along on today's build (the road and river keep-outs in your first graph): guide me through these steps one at a time, checking a screenshot after each:\n   - Make KO_District1: an Empty Actor with a Spline; give it four points at the corners of district 1's square, about 10 m outside it; tick Closed Loop in the spline's Details; tag it KeepOutArea. Do the same for KO_District2 and KO_Lake (more points for the lake's shape). You see three closed loops.\n   - In your graph copy the KeepOut branch and set the copy's tag to KeepOutArea. In its Spline Sampler set Dimension to On Interior, Interior Sample Spacing 300 and tick Treat Spline As Polyline; set its Bounds Modifier to -200, -200, -5000 and 200, 200, 5000. Wire it into the same Difference's Differences pin and Generate. You see the district squares and the lake empty.\n   - Draw KO_Corridor01 on the ground under the scenic route where it crosses plants; tag it KeepOutWide. Copy the KeepOut branch once more with the tag KeepOutWide and Bounds -700, -700, -5000 and 700, 700, 5000. Generate. You see an open lane under the route.\n   - In Place Actors open Shapes and drag in a Cube; set Scale to 4, 4, 4 and name it LaneGauge. Move it along the corridor at the route's height. You see where it touches a crown; widen that stretch.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"How to design an FPV racetrack that FLOWS - Happy Flying #26\" by UAVfutures: https://www.youtube.com/watch?v=08kunzHcPV8\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Grounding on slopes: upright, sunk and settled", "uk": "Посадка на ґрунт на схилах: прямо, заглиблено й стійко"}, "minutes": 40, "goals": [{"en": "Explain why things float on slopes: an instance stands on one point, so its downhill edge lifts by its footprint radius times the slope's tangent.", "uk": "Пояснити, чому речі висять на схилах: екземпляр стоїть на одній точці, тож його край з боку спуску піднімається на радіус опори, помножений на тангенс схилу."}, {"en": "Ground trees in the graph: Transform Points with Absolute Rotation ticked (they stand upright instead of leaning with the hill) and a negative Z offset to sink them.", "uk": "Посадити дерева на ґрунт у графі: Transform Points з увімкненим Absolute Rotation (вони стоять прямо, а не нахиляються разом із пагорбом) і від'ємним зсувом за Z, щоб їх заглибити."}, {"en": "Ground shrubs: a smaller sink, and a stricter slope limit for the biggest ones.", "uk": "Посадити на ґрунт кущі: менше заглиблення й суворіша межа схилу для найбільших."}], "doalong": [{"en": "Work out the sink: tan 20 degrees is 0.36, so a tree with a 1 m root flare on a 20-degree slope needs 0.36 m; on 30 degrees, 0.58 m. Write the numbers for your steepest band in keepouts.md. You see your sink values.", "uk": "Порахуй заглиблення: tan 20 градусів — це 0.36, тож дереву з розширенням кореня 1 м на 20-градусному схилі потрібно 0,36 м; на 30 градусах — 0,58 м. Запиши числа для своєї найкрутішої смуги в keepouts.md. Ти бачиш свої значення заглиблення."}, {"en": "In the tree chain's Transform Points tick Absolute Rotation, keep Rotation Max Z 360, and set Offset Min Z -60 and Offset Max Z -30 (cm). Generate. You see trunks stand straight and sink into the slope.", "uk": "У Transform Points ланцюжка дерев увімкни Absolute Rotation, залиш Rotation Max Z 360 і встанови Offset Min Z -60 і Offset Max Z -30 (см). Запусти Generate. Ти бачиш, як стовбури стоять прямо й заглиблюються в схил."}, {"en": "In the shrub chain's Transform Points set Offset Min Z -20 and Offset Max Z -5. Generate. You see shrub bases meet the ground.", "uk": "У Transform Points ланцюжка кущів встанови Offset Min Z -20 і Offset Max Z -5. Запусти Generate. Ти бачиш, як основи кущів сходяться з ґрунтом."}, {"en": "Put the camera 2 m above the ground, looking along the slope at ten plant bases. You see which still float; note them.", "uk": "Постав камеру на 2 м над ґрунтом, дивлячись уздовж схилу на десять основ рослин. Ти бачиш, які досі висять; запиши їх."}], "play": {"en": "Float spotter: the tutor describes ten bases on a slope ('daylight under the roots on the downhill side', 'a trunk leaning 20 degrees with the hill'); I call grounded or floating, and give the fix.", "uk": "Шукач висячих: тьютор описує десять основ на схилі («просвіт під корінням з боку спуску», «стовбур, нахилений на 20 градусів разом із пагорбом»); я кажу «стоїть» чи «висить» і даю виправлення."}, "video": {"search": "unreal engine pcg trees on slopes floating fix offset"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Grounding on slopes: upright, sunk and settled (Day 38, lesson 3 of 4).\nToday's build: Keep-outs that clear the roads, the river, the lake, both districts and the flight corridor in every biome graph, read by three tags (KeepOut, KeepOutArea and KeepOutWide), and a grounding pass proved by the footprint test, so trees stand upright and nothing floats.\nEarlier today I already did: lesson 1 (Keep-outs along lines: roads and rivers); lesson 2 (Keep-outs for areas and flight corridors). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. E questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "The footprint test", "uk": "Тест опори"}, "minutes": 40, "goals": [{"en": "Run a test anyone can repeat: 20 random instances per layer, each seen from a low side view and marked grounded or floating.", "uk": "Проводити тест, який може повторити будь-хто: 20 випадкових екземплярів на шар, кожен оглянутий з низького виду збоку й позначений «стоїть» або «висить»."}, {"en": "Set a pass line: fewer than 1 in 20 floating per layer, and none along the scenic route.", "uk": "Задати межу проходження: менше 1 з 20 висячих на шар і жодного вздовж мальовничого маршруту."}, {"en": "Keep the evidence: a table, and a before/after pair of the worst base.", "uk": "Зберігати докази: таблиця й пара до/після найгіршої основи."}], "doalong": [{"en": "Write footprint_test.md: a table with layer, number, place (x, y) and grounded or floating. You see an empty table with 20 rows per layer.", "uk": "Напиши footprint_test.md: таблиця з шаром, номером, місцем (x, y) і позначкою «стоїть» чи «висить». Ти бачиш порожню таблицю з 20 рядками на шар."}, {"en": "Ask the tutor for 20 random x, y positions inside your transect; fly to the nearest plant of each layer at each one. You see the first base.", "uk": "Попроси в тьютора 20 випа tled). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Run a test anyone can repeat: 20 random instances per layer, each seen from a low side view and marked grounded or floating.\n2. Set a pass line: fewer than 1 in 20 floating per layer, and none along the scenic route.\n3. Keep the evidence: a table, and a before/after pair of the worst base.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Inspector: the tutor plays a strict art director and checks five of my bases from my screenshots; each one it fails costs me a point.\n4. Do-along on today's build (the road and river keep-outs in your first graph): guide me through these steps one at a time, checking a screenshot after each:\n   - Write footprint_test.md: a table with layer, number, place (x, y) and grounded or floating. You see an empty table with 20 rows per layer.\n   - Ask the tutor for 20 random x, y positions inside your transect; fly to the nearest plant of each layer at each one. You see the first base.\n   - At each, put the camera 1 to 2 m above the ground looking along the slope, and mark the row. You see the table fill.\n   - Count each layer; any layer with 2 or more floating gets a fix (more sink, a stricter slope limit) and a re-test. You see every layer under 1 in 20.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "keepouts.md (every keep-out, its tag, its half-width and why)", "uk": "keepouts.md (кожна зона-виняток, її тег, її половинна ширина й чому)"}, {"en": "footprint_test.md (20 instances per layer, before and after the fixes)", "uk": "footprint_test.md (20 екземплярів на шар, до й після виправлень)"}, {"en": "lane_gauge.png and verge_10m.png", "uk": "lane_gauge.png і verge_10m.png"}, {"en": "districts_empty.png (both district squares clear, from 100 m)", "uk": "districts_empty.png (обидва квадрати районів вільні, зі 100 м)"}, {"en": "before_after_day38.png and flythrough_day38.mp4 (60 seconds along the cleared corridor)", "uk": "before_after_day38.png і flythrough_day38.mp4 (60 секунд уздовж звільненого коридору)"}, {"en": "summary.md", "uk": "звіт дня (summary.md)"}], "goal": {"en": "By the end of today you have keep-outs that clear every road, the river, the lake, both districts and the scenic flight corridor in all your biome graphs, and a footprint test that proves nothing on your transect floats.", "uk": "До кінця дня в тебе є зони-винятки, які в усіх твоїх графах біомів звільняють кожну дорогу, річку, озеро, обидва райони й мальовничий льотний коридор, і тест опори, який доводить, що на твоїй трансекті нічого не висить."}, "uses": [{"en": "Day 31: your roads", "uk": "День 31: твої дороги"}, {"en": "Day 29: the river and the lake", "uk": "День 29: річка й озеро"}, {"en": "Day 22: the two red district squares and the scenic route", "uk": "День 22: два червоні квадрати районів і мальовничий маршрут"}, {"en": "Day 36 and Day 37: your three biome graphs on the transect", "uk": "День 36 і День 37: три твої графи біомів на трансекті"}, {"en": "Day 35: the forest valley", "uk": "День 35: лісова долина"}], "quiz": [{"q": {"en": "What does the Difference node do in a keep-out chain?", "uk": "Що робить вузол Difference у ланцюжку зони-винятку?"}, "options": [{"en": "Removes the plant points (Source) that touch the keep-out points (Differences)", "uk": "Прибирає точки рослин (Source), що торкаються точок зон-винятків (Differences)"}, {"en": "Adds plants along the road", "uk": "Додає рослини вздовж дороги"}, {"en": "Joins two graphs", "uk": "З'єднує два графи"}], "answer": 0, "explain": {"en": "Plants go into Source and keep-outs into Differences. Wherever they overlap, the plant points are removed.", "uk": "Рослини йдуть у Source, а зони-винятки — у Differences. Там, де вони перетинаються, точки рослин прибираються."}}, {"q": {"en": "Your keep-out clears the road on flat ground, but plants still grow on the road where it climbs a hill. What is the likely cause?", "uk": "Зона-виняток звільняє дорогу на рівному ґрунті, але там, де дорога піднімається пагорбом, на ній досі ростуть рослини. Яка ймовірна причина?"}, "options": [{"en": "The road is too wide", "uk": "Дорога заширока"}, {"en": "The Bounds Modifier's box is too short in Z, so it misses plant points above or below the spline", "uk": "Коробка Bounds Modifier занизька за Z, тож пропускає точки рослин вище чи нижче сплайна"}, {"en": "Lumen is off", "uk": "Lumen вимкнений"}, {"en": "The Seed is wrong", "uk": "Неправильний Seed"}], "answer": 1, "explain": {"en": "Keep-out boxes must reach well above and below the spline. A tall box (Z from -5000 to 5000) catches points on any slope.", "uk": "Коробки зон-винятків мають сягати далеко вище й нижче сплайна. Висока коробка (Z від -5000 до 5000) ловить точки на будь-якому схилі."}}, {"q": {"en": "Your main road is cleared, but plants still grow on the lane and in the river, though KO_Lane01 and KO_River01 both carry the KeepOut tag. What is the likely cause?", "uk": "Головна дорога звільнена, але рослини досі ростуть на вузькій дорозі й у річці, хоча і KO_Lane01, і KO_River01 мають тег KeepOut. Яка ймовірна причина?"}, "options": [{"en": "The Seed is wrong", "uk": "Неправильний Seed"}, {"en": "The Bounds Modifier is too tall", "uk": "Bounds Modifier зависокий"}, {"en": "Select Multiple is unticked on Get Spline Data, so it reads only the first spline it finds", "uk": "На Get Spline Data вимкнено Select Multiple, тож вузол читає лише перший знайдений сплайн"}, {"en": "Lumen is off", "uk": "Вимкнено Lumen"}], "answer": 2, "explain": {"en": "Without Select Multiple, Get Spline Data uses only the first matching actor. Tick it so every spline with the tag is read.", "uk": "Без Select Multiple Get Spline Data використовує лише першого відповідного актора. Увімкни його, щоб читався кожен сплайн із тегом."}}, {"q": {"en": "Your pines lean 25 degrees with the hill. Which setting fixes it?", "uk": "Твої сосни нахилені на 25 градусів разом із пагорбом. Яке налаштування це виправить?"}, "options": [{"en": "Self Pruning", "uk": "Self Pruning"}, {"en": "A different Seed", "uk": "Інший Seed"}, {"en": "Bigger Point Extents", "uk": "Більші Point Extents"}, {"en": "Absolute Rotation in Transform Points", "uk": "Absolute Rotation у Transform Points"}], "answer": 3, "explain": {"en": "Points sampled on a slope tilt with the ground. Absolute Rotation sets their rotation outright, so trees stand upright as real ones do.", "uk": "Точки, взяті на схилі, нахиляються разом із ґрунтом. Absolute Rotation задає їхній поворот напряму, тож дерева стоять прямо, як справжні."}}, {"q": {"en": "Why is a flight corridor's keep-out wider than the 4 m lane?", "uk": "Чому зона-виняток льотного коридору ширша за прохід 4 м?"}, "options": [{"en": "Tree crowns spread beyond their trunks, so the lane needs a margin plus the crowns' radius", "uk": "Крони дерев розходяться далі за стовбури, тож проходу потрібен запас плюс радіус крон"}, {"en": "Wider keep-outs generate faster", "uk": "Ширші зони-винятки генеруються швидше"}, {"en": "Pilots need to see the ground", "uk": "Пілотам треба бачити землю"}], "answer": 0, "explain": {"en": "A keep-out removes trees by their trunk point. A crown 3 m wide can still reach into the lane unless the keep-out is wider.", "uk": "Зона-виняток прибирає дерева за точкою стовбура. Крона завширшки 3 м усе одно може залазити в прохід, якщо зона-виняток не ширша."}}], "weekInfo": {"week": 8, "title": {"en": "PCG nature for the whole island", "uk": "PCG-природа для всього острова"}, "goal": {"en": "By Friday you have your whole island dressed by your own PCG biome rules, layered, with natural transitions, clear keep-outs and nothing floating, reading beautifully from the air.", "uk": "До п'ятниці весь твій острів заповнений природою за твоїми власними правилами біомів PCG: шарами, з природними переходами, чіткими зонами-винятками й без жодного об'єкта в повітрі, і він гарно читається з висоти."}, "skills": [{"en": "PCG biome rules in Unreal Engine 5 (slope, height, noise and spacing)", "uk": "Правила біомів PCG в Unreal Engine 5 (схил, висота, шум і відстань між об'єктами)"}, {"en": "Procedural keep-outs and grounding checks for playable spaces", "uk": "Процедурні зони-винятки й перевірки посадки на ґрунт для ігрових просторів"}, {"en": "Layered foliage and scatter design, read at every distance", "uk": "Шарова рослинність і розкидання об'єктів, що читаються на будь-якій відстані"}, {"en": "Island-scale partitioned PCG generation within a 16 GB memory budget", "uk": "Генерація PCG на весь острів із розбиттям на комірки, у межах бюджету пам'яті 16 ГБ"}]}, "morning": {"sofar": {"en": "Your island has a biome map and three biome graphs, tested together on a strip from the sea to the summit.", "uk": "На твоєму острові є мапа біомів і три графи біомів, протестовані разом на смузі від моря до вершини."}, "today": {"en": "You add keep-outs that clear the roads, the water, both districts and the flight corridor, and prove with a footprint test that nothing floats.", "uk": "Сьогодні ти додаєш зони-винятки, що звільняють дороги, воду, обидва райони й коридор польоту, і тестом опори доводиш, що ніщо не висить у повітрі."}, "cheer": {"en": "Checking that nothing floats is the quiet craft behind every believable world, and you already have the tools to do it well.", "uk": "Перевірка, що ніщо не висить у повітрі, — тиха майстерність за кожним переконливим світом, і в тебе вже є інструменти, щоб зробити це добре."}, "quote": {"text": {"en": "Heaven is under our feet as well as over our heads.", "uk": "Небеса — у нас під ногами так само, як і над головою."}, "author": {"en": "Henry David Thoreau", "uk": "Генрі Девід Торо"}, "source": "https://en.wikiquote.org/wiki/Walden"}}, "hasAssets": false, "workPath": "Work\\Assignment\\Day-38-keep-outs-and-grounding", "mapHref": "../../COURSE.html", "prevHref": "../Day-37-more-biomes-and-transitions/START-HERE.html", "nextHref": "../Day-39-layered-detail-from-the-air/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me and don't write code. Keep me moving and make it feel like a game.\n\nToday I build on my own: Areas, the corridor, the grounding and the footprint test, on your own.\nIt's part of: Keep-outs that clear the roads, the river, the lake, both districts and the flight corridor in every biome graph, read by three tags (KeepOut, KeepOutArea and KeepOutWide), and a grounding pass proved by the footprint test, so trees stand upright and nothing floats (L_Island: keep-outs over the whole island (every road, the river, the lake, both district squares, and the scenic route where it crosses plants); the grounding pass and footprint test on your transect and in the forest valley.).\n\nSpec:\n- keepouts.md: every keep-out, its tag, its half-width and why. Roads and the river: 500 cm (a 6 m road plus 2 m verges). The flight corridor: 700 cm (a 2 m half-lane, a 2 m margin and 3 m for tree crowns). Districts and the lake: the whole area plus about 10 m.\n- Line keep-outs: Empty Actors with a Spline component drawn along each road and the river (KO_Road01, KO_Lane01, KO_River01...), each with the actor tag KeepOut (Details > Actor > Tags); the corridor (KO_Corridor01...) tagged KeepOutWide. A river wider than about 6 m gets a closed loop tagged KeepOutArea instead.\n- Area keep-outs: closed-loop splines (Closed Loop ticked) round each district square and the lake (KO_District1, KO_District2, KO_Lake), tagged KeepOutArea.\n- Every biome graph subtracts them with three branches, one per tag: Get Spline Data (Actor Filter All World Actors, Actor Selection By Tag, the tag, Select Multiple ticked) > Spline Sampler > Bounds Modifier (Mode Set) > the Differences pin of one Difference node (Density Function Binary), just before Transform Points. A tree chain gets its own Difference fed by the same three branches.\n- Every KO_ actor on DL_KeepOuts with Is Spatially Loaded unticked, so every graph always finds it (keep DL_KeepOuts loaded; hide it with its eye if it is in the way); the forest boxes moved or shrunk so no trunk stands in a keep-out; LaneGauge, a 4 x 4 x 4 m gauge cube, passes along the corridor.\n- Grounding in every graph: trees upright (Absolute Rotation) and sunk by their footprint (sink = root radius x the slope's tangent: 0.36 m for 1 m on 20 degrees); shrubs sunk a little; footprint_test.md shows fewer than 1 in 20 floating per layer.\n\nMy checklist:\n1. Write keepouts.md with every keep-out, its tag (KeepOut, KeepOutArea or KeepOutWide) and its half-width. Check: roads, river, lake, both districts and the corridor are listed. (from lesson 1)\n2. Draw KO_Road01 along the main road, KO_Lane01 along the lane and KO_River01 along the river; give each the actor tag KeepOut. Check: Details > Tags shows KeepOut on each. (from lesson 1)\n3. In your first biome graph add the KeepOut branch: Get Spline Data (All World Actors, By Tag, KeepOut, Select Multiple ticked), Spline Sampler and Bounds Modifier (Mode Set). Check: with D on the Bounds Modifier you see tall boxes along the road, the lane and the river. (from lesson 1)\n4. Add the Difference node before Transform Points, with your plants in Source and the keep-out points in Differences. If the graph has a tree chain, add a second Difference before its Transform Points too, fed by the same Bounds Modifier (one output can feed several nodes). Generate. Check: both verges of the road are clear from 10 m, and nothing grows in the river. (from lesson 1)\n5. Draw closed loops KO_District1, KO_District2 and KO_Lake, tagged KeepOutArea, and add the KeepOutArea branch (Dimension On Interior, Treat Spline As Polyline) to the same Difference. Check: both district squares and the lake are empty of plants. (from lesson 2)\n6. Draw KO_Corridor01 on the ground under the scenic route where it crosses plants, tagged KeepOutWide, and add its 700 cm branch. Check: an open lane runs through the plants along the route. (from lesson 2)\n7. Copy the three keep-out branches into your other two biome graphs (Ctrl+C, Ctrl+V), add a Difference before each Transform Points as in your first graph, and Generate each. Check: no plant of any biome stands in any keep-out. (from lesson 2)\n8. Put every KO_ actor on DL_KeepOuts and untick Is Spatially Loaded on each; move or shrink the forest boxes out of the keep-outs. Check: from 30 m no forest tree stands on a road, in a district or in the corridor. (from lesson 2)\n9. Make LaneGauge (a Cube at Scale 4, 4, 4) and move it along the corridor at the route's height; widen any stretch where crowns touch it. Check: the gauge passes the whole corridor with no overlap. (from lesson 2)\n10. Bookmark a low camera on your steepest slope and take a 'before' screenshot; then ground the trees: Absolute Rotation and a negative Z offset in each tree chain. Check: from 2 m on a slope, trunks stand straight and the downhill root flare touches the ground. (from lesson 3)\n11. Ground the shrubs: a small negative Z offset, and a stricter slope limit for the biggest ones. Check: no daylight under shrubs on the steepest part of each band. (from lesson 3)\n12. Footprint test: 20 random instances per layer from a low side view, written in footprint_test.md. Check: each layer has 20 rows marked grounded or floating. (from lesson 4)\n13. Fix and re-test every layer with 2 or more floating in 20. Check: every layer is under 1 in 20. (from lesson 4)\n14. Before/after capture: the worst slope's bases before and after the grounding pass, from the same low camera; then a 60-second clip along the cleared corridor in Play. Check that you also have lane_gauge.png, verge_10m.png and districts_empty.png (each is described in today's hand-in list; take any you are missing now). Check: before_after_day38.png and flythrough_day38.mp4 are saved. (from day 33, lesson 2)\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Kateryna B.\nDay 38: Keep-outs and the grounding check: roads, water, districts and flight corridors clear, nothing floating. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

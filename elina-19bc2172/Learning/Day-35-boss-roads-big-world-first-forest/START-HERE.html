<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 35</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

_day35.md, and take your 'before' shot from the Day 32 vista camera that sees the valley. Check: the plan fits in 4 hours, and before_day35.png is saved.", "uk": "Запусти годинник. Запиши свій план із часом у boss_day35.md і зроби знімок «до» з камери панорами з Дня 32, яка бачить долину. Перевірка: план вміщається в 4 години, а before_day35.png збережено."}, "lesson": 1}, {"text": {"en": "Fly every road at 10 m; fix any leg over 10 % and any lump or floating edge. Check: road_grades.md is up to date and no road edge floats.", "uk": "Пролети кожною дорогою на висоті 10 м; виправ кожен відрізок з ухилом понад 10 % і кожен горб чи край, що висить. Перевірка: road_grades.md оновлений, і жоден край дороги не висить."}, "lesson": "D31.4"}, {"text": {"en": "Choose the forest valley on island_map.png and mark the roads, river and district squares that cross or touch it. Check: the valley is outlined and its no-tree areas are marked.", "uk": "Вибери лісову долину на island_map.png і познач дороги, річку й квадрати районів, які її перетинають або торкаються. Перевірка: долина обведена, а місця без дерев позначені."}, "lesson": 2}, {"text": {"en": "Move your test forest into the valley and add boxes (Alt+drag) until it is covered, each turned and scaled to fit. Check: from 150 m the forest follows the valley's shape, not a square.", "uk": "Перенеси свій тестовий ліс у долину й додавай коробки (Alt+перетягування), поки вона не вкриється, кожну повертаючи й масштабуючи під місце. Перевірка: з 150 м ліс іде за формою долини, а не квадратом."}, "lesson": 2}, {"text": {"en": "Keep the road, river and districts clear: split boxes on either side of the road and shrink any box that touches a district; Generate. Check: no trunk stands on a road, in the river or inside a district square.", "uk": "Тримай дорогу, річку й райони чистими: розділи коробки по обидва боки дороги й зменш кожну, що торкається району; запусти Generate. Перевірка: жоден стовбур не стоїть на дорозі, у річці чи всередині квадрата району."}, "lesson": 2}, {"text": {"en": "Retune for the valley: density, clearings and a seed, one change at a time; write the values. Check: clumps and clearings show from 60 m, with no rows.", "uk": "Переналаштуй під долину: густина, галявини й seed, по одній зміні за раз; запиши значення. Перевірка: з 60 м видно куртини й галявини, без рядів."}, "lesson": "D34.4"}, {"text": {"en": "Apply the light recipe, confirm the exposure lock and rebuild the HLODs (Build > Build HLODs). Check: in Play the valley still shows from 800 m out at sea.", "uk": "Застосуй рецепт світла, перевір фіксацію експозиції й перебудуй HLOD (Build > Build HLODs). Перевірка: у Play долину досі видно з моря за 800 м."}, "lesson": "D33.4"}, {"text": {"en": "Place, set and lock S1, S2 and S3; take a HighResShot from each. Check: three 1920 x 1080 files named island_S1.png to island_S3.png.", "uk": "Постав, налаштуй і заблокуй S1, S2 і S3; зроби HighResShot з кожної. Перевірка: три файли 1920 x 1080 з назвами island_S1.png–island_S3.png."}, "lesson": 3}, {"text": {"en": "Make boss_board_day35.png: each shot beside a reference photo of a similar view. Check: three labelled pairs.", "uk": "Зроби boss_board_day35.png: кожен кадр поруч із референсним фото схожого виду. Перевірка: три підписані пари."}, "lesson": 3}, {"text": {"en": "Pilot S3 and read stat unit; then fly the road and the valley in Play and record 60 seconds. Check: Frame and GPU are in boss_day35.md and the clip is saved.", "uk": "Візьми керування (Pilot) камерою S3 і зчитай stat unit; потім пролети над дорогою й долиною в Play і запиши 60 секунд. Перевірка: Frame і GPU є в boss_day35.md, а відео збережено."}, "lesson": 3}, {"text": {"en": "Score yourself with the rubric, then ask the tutor for see-why-fix notes; write both, your decision and your tier in self_review_day35.md. Check: five scores, three notes and one decision.", "uk": "Оціни себе за рубрикою, потім попроси в тьютора нотатки «побач, чому, виправ»; запиши обидва, своє рішення й свій рівень у self_review_day35.md. Перевірка: п'ять оцінок, три нотатки й одне рішення."}, "lesson": 4}, {"text": {"en": "Before/after capture: your 'before' from the vista camera beside the same camera now. Check: before_after_day35.png and flythrough_day35.mp4 are saved.", "uk": "Знімок до/після: твій «до» з камери панорами поруч із видом із тієї самої камери зараз. Перевірка: before_after_day35.png і flythrough_day35.mp4 збережені."}, "lesson": 3}], "boss": [{"en": "Bronze: the valley forest generated and clear of roads, river and districts, the roads checked, three locked 1920 x 1080 shots, the board and a 60-second flight, inside 4 hours.", "uk": "Бронза: ліс у долині згенерований і не заходить на дороги, у річку й райони, дороги перевірені, три заблоковані кадри 1920 x 1080, борд і 60-секундний політ — за 4 години."}, {"en": "Silver: the forest follows the valley's shape with clumps and clearings and no rows from 60 m, every road leg is under 10 % with no floating edge, and the valley shows from 800 m out at sea in Play.", "uk": "Срібло: ліс іде за формою долини, з куртинами й галявинами і без рядів з 60 м, кожен відрізок дороги має ухил менше 10 % і жодного краю, що висить, а в Play долину видно з моря за 800 м."}, {"en": "Gold: each shot reads as a real island in a 3-second look beside its photo, and you finish inside 3 hours. You also add one stretch: a second lane to your other district (its own junction, every leg under 10 %), or one more Electric Dreams breakdown level read in ElectricDreamsSample with IslandCourse closed (ElectricDreams_PCGLargeAssembly or ElectricDreams_PCGSplineExample), with two lines in pcg_study.md.", "uk": "Золото: кожен кадр читається як справжній острів за 3 секунди погляду поруч зі своїм фото, і ти встигаєш за 3 години. Також додай одне завдання понад план: другу вузьку дорогу до іншого району (з власною розвилкою, кожен відрізок з ухилом менше 10 %) або ще один рівень-розбір Electric Dreams, прочитаний в ElectricDreamsSample із закритим IslandCourse (ElectricDreams_PCGLargeAssembly або ElectricDreams_PCGSplineExample), з двома рядками в pcg_study.md."}], "assets": ["island12/art-director-notes.md", "island12/picture-brief-standard.md"]}, "lessons": [{"title": {"en": "Boss briefing: the plan and the checklist (micro-lesson)", "uk": "Брифінг перед Днем боса: план і чекліст (мікроурок)"}, "minutes": 40, "goals": [{"en": "Plan a timed build: the biggest risk first (the forest), the checks next, the shots and the flight last.", "uk": "Спланувати збірку на час: найбільший ризик першим (ліс), далі перевірки, кадри й політ наостанок."}, {"en": "Use a checklist so nothing is forgotten: roads, light, Data Layers, HLODs, forest, shots, flight, review.", "uk": "Користуватися чеклістом, щоб нічого не забути: дороги, світло, Data Layers, HLOD, ліс, кадри, політ, огляд."}, {"en": "Explain the tiers: Bronze is complete, Silver is right, Gold is fast and beautiful.", "uk": "Пояснити рівні: Бронза — повно, Срібло — правильно, Золото — швидко й гарно."}], "doalong": [{"en": "Open boss_day35.md and copy in the build steps as a checklist. You see 12 lines.", "uk": "Відкрий boss_day35.md і скопіюй туди кроки збірки як чекліст. Ти бачиш 12 рядків."}, {"en": "Give each line a time; the total must be under 4 hours. You see your plan with times.", "uk": "Признач кожному рядку час; разом має вийти менше 4 годин. Ти бачиш свій план із часом."}, {"en": "Pilot the Day 32 vista camera that sees your forest valley and take a HighResShot; rename it before_day35.png. You see today's 'before' saved.", "uk": "Візьми керування (Pilot) камерою панорами з Дня 32, яка бачить твою лісову долину, і зроби HighResShot; перейменуй його на before_day35.png. Ти бачиш, що сьогоднішній знімок «до» збережено."}, {"en": "Paste your plan into the tutor chat and ask it to act as a studio producer and cut anything that won't fit. You see a plan you can finish.", "uk": "Встав свій план у чат із тьютором і попроси його виступити продюсером студії й викреслити все, що не вміститься. Ти бачиш план, який можна завершити."}], "play": {"en": "Producer: the tutor plays a studio producer; I defend my plan line by line, and it cuts the weakest line each round.", "uk": "Продюсер: тьютор грає продюсера студії; я захищаю свій план рядок за рядком, а він щораунду викреслює найслабший рядок."}, "video": {"url": "https://www.youtube.com/watch?v=EEf07ggFWRw", "title": "Building Open Worlds in Unreal Engine 5 | Unreal Fest 2022", "channel": "Unreal Engine", "length": "49:41", "search": "building open worlds unreal engine 5 unreal fest"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Boss briefing: the plan and the checklist (micro-lesson) (Day 35, lesson 1 of 4).\nToday's build: One valley of your island filled with the migrated PCG forest, shaped to the valley and clear of roads, river and districts, with your roads, light and big-world set-up checked; proved in three locked shots, a board beside reference photos and a 60-second flight.\n\nBy the end of this lesson I can:\n1. Plan a timed build: the biggest risk first (the forest), the checks next, the shots and the flight last.\n2. Use a checklist so nothing is forgotten: roads, light, Data Layers, HLODs, forest, shots, flight, review.\n3. Explain the tiers: Bronze is complete, Silver is right, Gold is fast and beautiful.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (This week you added roads, island light, landmarks, a big-world set-up and your first PCG forest.), what I will learn today (It is Boss day: you fill one whole valley with the PCG forest, clear of roads, river and districts, and prove it in three shots and a flight.), encourage me (Lock in Bronze first and grow from there; a forest filling a valley you sculpted yourself is a fine way to end the week.), and share today's quote: \"The woods are lovely, dark and deep, but I have promises to keep, and miles to go before I sleep.\" (Robert Frost).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 32: how do you lock exposure so every shot repeats? | Day 28: which part of your auto-landscape material decides where rock shows?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Producer: the tutor plays a studio producer; I defend my plan line by line, and it cuts the weakest line each round.\n6. Do-along on today's build (the valley forest (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Open boss_day35.md and copy in the build steps as a checklist. You see 12 lines.\n   - Give each line a time; the total must be under 4 hours. You see your plan with times.\n   - Pilot the Day 32 vista camera that sees your forest valley and take a HighResShot; rename it before_day35.png. You see today's 'before' saved.\n   - Paste your plan into the tutor chat and ask it to act as a studio producer and cut anything that won't fit. You see a plan you can finish.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Building Open Worlds in Unreal Engine 5 | Unreal Fest 2022\" by Unreal Engine: https://www.youtube.com/watch?v=EEf07ggFWRw\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "A forest that fits a valley (micro-lesson)", "uk": "Ліс, що пасує долині (мікроурок)"}, "minutes": 40, "goals": [{"en": "Shape a forest to the land: two or three boxes turned and scaled along a valley read better than one big square.", "uk": "Підганяти ліс під землю: дві-три коробки, повернуті й масштабовані вздовж долини, читаються краще за один великий квадрат."}, {"en": "Keep the forest off the road, the river and the districts by splitting, moving or shrinking its boxes (your own keep-out rules come in week 8).", "uk": "Тримати ліс подалі від дороги, річки й районів, розділяючи, пересуваючи чи зменшуючи його коробки (власні правила зон-винятків з'являться на 8-му тижні)."}, {"en": "Read a forest from 60 m and 150 m: clumps, clearings and a broken edge, never a square block.", "uk": "Читати ліс з 60 м і 150 м: куртини, галявини й рваний край, ніколи не квадратний блок."}], "doalong": [{"en": "On island_map.png draw the valley's outline and split it into two or three rough rectangles. You see rectangles that follow the valley's bend.", "uk": "На island_map.png намалюй контур долини й поділи його на два-три грубі прямокутники. Ти бачиш прямокутники, що йдуть за вигином долини."}, {"en": "Alt+drag the forest actor to copy it (each copy keeps its own settings and Seed); turn each copy (E) and scale it (R) to one rectangle. You see the boxes follow the valley.", "uk": "Alt+перетягни актора лісу, щоб скопіювати його (кожна копія зберігає власні налаштування й Seed); поверни кожну копію (E) і масштабуй (R) під один прямокутник. Ти бачиш, як коробки йдуть за долиною."}, {"en": "Generate each box and fly to 150 m. You see where an edge looks square; move or shrink that box.", "uk": "Запусти Generate для кожної коробки й підлети на 150 м. Ти бачиш, де край виглядає квадратним; пересунь або зменш цю коробку."}, {"en": "Where the road crosses, split the box into two, one on each side; shrink any box that touches a district square. Generate. You see a clear road through the trees; if the trees don't follow a moved box, click Generate again.", "uk": "Там, де дорога перетинає ліс, розділи коробку на дві, по одній з кожного боку; зменш кожну коробку, що торкається квадрата району. Запусти Generate. Ти бачиш чисту дорогу крізь дерева; якщо дерева не йдуть за пересунутою коробкою, знову клікни Generate."}], "play": {"en": "Edge judge: I describe my forest's edge from 150 m; the tutor says 'square' or 'natural' and asks one question each round until I fix it.", "uk": "Суддя країв: я описую край свого лісу з 150 м; тьютор каже «квадратний» чи «природний» і ставить одне питання щораунду, поки я його не виправлю."}, "video": {"url": "https://www.youtube.com/watch?v=9FHkjcowP-g", "title": "Scatter Trees & Grass with PCG in Unreal Engine 5 / Part 1", "channel": "TUF", "length": "18:20", "search": "unreal engine 5 pcg scatter trees grass"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: A forest that fits a valley (micro-lesson) (Day 35, lesson 2 of 4).\nToday's build: One valley of your island filled with the migrated PCG forest, shaped to the valley and clear of roads, river and districts, with your roads, light and big-world set-up checked; proved in three locked shots, a board beside reference photos and a 60-second flight.\nEarlier today I already did: lesson 1 (Boss briefing: the plan and the checklist (micro-lesson)). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Shape a forest to the land: two or three boxes turned and scaled along a valley read better than one big square.\n2. Keep the forest off the road, the river and the districts by splitting, moving or shrinking its boxes (your own keep-out rules come in week 8).\n3. Read a forest from 60 m and 150 m: clumps, clearings and a broken edge, never a square block.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Edge judge: I describe my forest's edge from 150 m; the tutor says 'square' or 'natural' and asks one question each round until I fix it.\n4. Do-along on today's build (the valley forest (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - On island_map.png draw the valley's outline and split it into two or three rough rectangles. You see rectangles that follow the valley's bend.\n   - Alt+drag the forest actor to copy it (each copy keeps its own settings and Seed); turn each copy (E) and scale it (R) to one rectangle. You see the boxes follow the valley.\n   - Generate each box and fly to 150 m. You see where an edge looks square; move or shrink that box.\n   - Where the road crosses, split the box into two, one on each side; shrink any box that touches a district square. Generate. You see a clear road through the trees; if the trees don't follow a moved box, click Generate again.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Scatter Trees & Grass with PCG in Unreal Engine 5 / Part 1\" by TUF: https://www.youtube.com/watch?v=9FHkjcowP-g\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Three shots and a flight (micro-lesson)", "uk": "Три кадри й політ (мікроурок)"}, "minutes": 40, "goals": [{"en": "Choose three shots that prove the week: the road climb at 30 m, the forest valley at 60 m with a landmark, the whole island at 200 m.", "uk": "Вибрати три кадри, що доводять тиждень: підйом дороги з 30 м, лісова долина з 60 м з орієнтиром, увесь острів з 200 м."}, {"en": "Shoot them locked and clean: a 16:9 filmback, Roll 0, HighResShot 1920x1080.", "uk": "Знімати їх заблокованими й чистими: filmback 16:9, Roll 0, HighResShot 1920x1080."}, {"en": "Fly the road and the valley in Play, and read stat unit at the widest shot.", "uk": "Пролетіти над дорогою й долиною в Play і зчитати stat unit на найширшому кадрі."}], "doalong": [{"en": "Place S1, S2 and S3 as you placed V1 to V3 on Day 32; lock each. You see three locked cameras.", "uk": "Постав S1, S2 і S3 так само, як V1–V3 у День 32; заблокуй кожну. Ти бачиш три заблоковані камери."}, {"en": "Pilot each, press G and type HighResShot 1920x1080 in the console. You see three files in Saved/Screenshots/WindowsEditor; rename them island_S1.png to island_S3.png.", "uk": "Візьми керування (Pilot) кожною, натисни G і введи в консолі HighResShot 1920x1080. Ти бачиш три файли в Saved/Screenshots/WindowsEditor; перейменуй їх на island_S1.png–island_S3.png."}, {"en": "In Krita put each shot beside a reference photo of a similar view. You see boss_board_day35.png with three pairs.", "uk": "У Krita постав кожен кадр поруч із референсним фото схожого виду. Ти бачиш boss_board_day35.png з трьома парами."}, {"en": "Pilot S3, type stat unit and write down Frame and GPU. Then press Play and record 60 seconds over the road and the valley. You see the numbers and the clip saved.", "uk": "Візьми керування (Pilot) камерою S3, введи stat unit і запиши Frame і GPU. Потім натисни Play і запиши 60 секунд над дорогою й долиною. Ти бачиш, що числа й відео збережені."}], "play": {"en": "3-second test: I look at each pair on my board for 3 seconds and tell the tutor what I saw first; it asks whether that is what I wanted a viewer to see.", "uk": "Тест 3 секунд: я дивлюся на кожну пару на своєму борді 3 секунди й кажу тьюторові, що впадає в око першим; тьютор питає, чи саме це глядач мав побачити за моїм задумом."}, "video": {"url": "https://www.youtube.com/watch?v=CW8hDvJOwGM", "title": "Unreal Engine 5 Cinematic Camera Tutorial for Beginners STEP BY STEP", "channel": "EZ Unreal", "length": "7:46", "search": "unreal engine 5 cine camera actor"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Three shots and a flight (micro-lesson) (Day 35, lesson 3 of 4).\nToday's build: One valley of your island filled with the migrated PCG forest, shaped to the valley and clear of roads, river and districts, with your roads, light and big-world set-up checked; proved in three locked shots, a board beside reference photos and a 60-second flight.\nEarlier today I already did: lesson 1 (Boss briefing: the plan and the checklist (micro-lesson)); lesson 2 (A forest that fits a valley (micro-lesson)). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Choose three shots that prove the week: the road climb at 30 m, the forest valley at 60 m with a landmark, the whole island at 200 m.\n2. Shoot them locked and clean: a 16:9 filmback, Roll 0, HighResShot 1920x1080.\n3. Fly the road and the valley in Play, and read stat unit at the widest shot.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: 3-second test: I look at each pair on my board for 3 seconds and tell the tutor what I saw first; it asks whether that is what I wanted a viewer to see.\n4. Do-along on today's build (the valley forest (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Place S1, S2 and S3 as you placed V1 to V3 on Day 32; lock each. You see three locked cameras.\n   - Pilot each, press G and type HighResShot 1920x1080 in the console. You see three files in Saved/Screenshots/WindowsEditor; rename them island_S1.png to island_S3.png.\n   - In Krita put each shot beside a reference photo of a similar view. You see boss_board_day35.png with three pairs.\n   - Pilot S3, type stat unit and write down Frame and GPU. Then press Play and record 60 seconds over the road and the valley. You see the numbers and the clip saved.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Unreal Engine 5 Cinematic Camera Tutorial for Beginners STEP BY STEP\" by EZ Unreal: https://www.youtube.com/watch?v=CW8hDvJOwGM\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Self-review with the tutor (micro-lesson)", "uk": "Самооцінка з тьютором (мікроурок)"}, "minutes": 40, "goals": [{"en": "Score your result with a five-line rubric: roads, forest, light, big-world set-up, readability from 60 m; 0 to 2 each.", "uk": "Оцінити результат за рубрикою з п'яти рядків: дороги, ліс, світло, налаштування великого світу, читабельність з 60 м; від 0 до 2 за кожен."}, {"en": "Ask the tutor for see-why-fix notes: what it sees, why it matters, how to fix it, with a place on your map.", "uk": "Попросити в тьютора нотатки «побач, чому, виправ»: що він бачить, чому це важливо, як це виправити, із місцем на твоїй мапі."}, {"en": "Decide what to fix now and what to carry into week 8, and name your tier.", "uk": "Вирішити, що виправити зараз, а що перенести на 8-й тиждень, і назвати свій рівень."}], "doalong": [{"en": "Write the rubric in self_review_day35.md and score yourself. You see five scores out of 10.", "uk": "Запиши рубрику в self_review_day35.md і оціни себе. Ти бачиш п'ять оцінок, разом до 10."}, {"en": "Describe your board and plan in a new tutor chat (or upload the images if your chat accepts them) and ask for three see-why-fix notes as a studio art director. You see three notes.", "uk": "Опиши свій борд і план у новому чаті з тьютором (або завантаж зображення, якщо твій чат їх приймає) і попроси три нотатки «побач, чому, виправ» як від арт-директора студії. Ти бачиш три нотатки."}, {"en": "Reply with one question and one decision. You see your decision written down.", "uk": "Відповідай одним питанням і одним рішенням. Ти бачиш записане рішення."}, {"en": "Write the tier you reached and your time. You see Bronze, Silver or Gold.", "uk": "Запиши досягнутий рівень і свій час. Ти бачиш Бронзу, Срібло чи Золото."}], "play": {"en": "Role swap: the tutor describes another island's board; I write three see-why-fix notes on it, and it scores each note for being specific and kind.", "uk": "Обмін ролями: тьютор описує борд іншого острова; я пишу до нього три нотатки «побач, чому, виправ», а тьютор оцінює кожну за конкретність і доброзичливість."}, "video": {"url": "https://www.youtube.com/watch?v=JcqG3dILKZY", "title": "How to Give a Professional Design Critique (Step by Step)", "channel": "Lindsay Marsh", "length": "11:43", "search": "how to give a professional design critique"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Self-review with the tutor (micro-lesson) (Day 35, lesson 4 of 4).\nToday's build: One valley of your island filled with the migrated PCG forest, shaped to the valley and clear of roads, river and districts, with your roads, light and big-world set-up checked; proved in three locked shots, a board beside reference photos and a 60-second flight.\nEarlier today I already did: lesson 1 (Boss briefing: the plan and the checklist (micro-lesson)); lesson 2 (A forest that fits a valley (micro-lesson)); lesson 3 (Three shots and a flight (micro-lesson)). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Score your result with a five-line rubric: roads, forest, light, big-world set-up, readability from 60 m; 0 to 2 each.\n2. Ask the tutor for see-why-fix notes: what it sees, why it matters, how to fix it, with a place on your map.\n3. Decide what to fix now and what to carry into week 8, and name your tier.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Role swap: the tutor describes another island's board; I write three see-why-fix notes on it, and it scores each note for being specific and kind.\n4. Do-along on today's build (the valley forest (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Write the rubric in self_review_day35.md and score yourself. You see five scores out of 10.\n   - Describe your board and plan in a new tutor chat (or upload the images if your chat accepts them) and ask for three see-why-fix notes as a studio art director. You see three notes.\n   - Reply with one question and one decision. You see your decision written down.\n   - Write the tier you reached and your time. You see Bronze, Silver or Gold.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"How to Give a Professional Design Critique (Step by Step)\" by Lindsay Marsh: https://www.youtube.com/watch?v=JcqG3dILKZY\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "boss_day35.md (the plan with times, forest settings and seeds, stat unit at S3)", "uk": "boss_day35.md (план із часом, налаштування й seed лісу, stat unit на S3)"}, {"en": "island_S1.png, island_S2.png and island_S3.png (1920 x 1080)", "uk": "island_S1.png, island_S2.png і island_S3.png (1920 x 1080)"}, {"en": "boss_board_day35.png (each shot beside its reference photo)", "uk": "boss_board_day35.png (кожен кадр поруч зі своїм референсним фото)"}, {"en": "self_review_day35.md (scores, the tutor's notes, your decision and your tier)", "uk": "self_review_day35.md (оцінки, нотатки тьютора, твоє рішення й твій рівень)"}, {"en": "before_after_day35.png and flythrough_day35.mp4 (60 seconds over the road and the valley)", "uk": "before_after_day35.png і flythrough_day35.mp4 (60 секунд над дорогою й долиною)"}, {"en": "summary.md", "uk": "звіт дня (summary.md)"}], "goal": {"en": "By the end of today you have your roads checked, your big-world set-up working and a first PCG forest filling one whole valley, proved in three locked shots, a board beside reference photos and a 60-second flight.", "uk": "До кінця дня твої дороги перевірені, налаштування великого світу працює, а перший PCG-ліс заповнює цілу долину, і все це доведено трьома заблокованими кадрами, бордом поруч із референсними фото й 60-секундним польотом."}, "uses": [{"en": "Day 31: the main road, the lane and the switchback", "uk": "День 31: головна дорога, вузька дорога й серпантин"}, {"en": "Day 32: the island light recipe, the landmarks and the vista cameras", "uk": "День 32: рецепт острівного світла, орієнтири й камери панорам"}, {"en": "Day 33: the grid, the Data Layers, the HLODs and the flying Play set-up", "uk": "День 33: сітка, Data Layers, HLOD і налаштування польоту в Play"}, {"en": "Day 34: the migrated forest on its test patch", "uk": "День 34: перенесений ліс на тестовій ділянці"}], "quiz": [{"q": {"en": "A road leg rises 9 m over 60 m. Is it fine for a car road on your island?", "uk": "Відрізок дороги піднімається на 9 м на відстані 60 м. Чи годиться він для автомобільної дороги на твоєму острові?"}, "options": [{"en": "Yes, it is 6 %", "uk": "Так, це 6 %"}, {"en": "No, it is 15 %, too steep: it needs a longer line or a switchback", "uk": "Ні, це 15 %, задуже круто: потрібна довша лінія або серпантин"}, {"en": "Yes, any grade is fine with Raise Terrain ticked", "uk": "Так, з увімкненим Raise Terrain годиться будь-який ухил"}], "answer": 1, "explain": {"en": "9 / 60 x 100 = 15 %. Car roads stay under 10 %, with only short pieces steeper.", "uk": "9 / 60 x 100 = 15 %. Автомобільні дороги тримаються нижче 10 %, і лише короткі ділянки крутіші."}}, {"q": {"en": "From 2 m you see daylight under your road strip's edge on a bend. What is the fix?", "uk": "З 2 м ти бачиш просвіт під краєм дорожньої смуги на вигині. Як це виправити?"}, "options": [{"en": "Lower that control point a little or raise its Side Falloff", "uk": "Трохи опустити цю контрольну точку або збільшити її Side Falloff"}, {"en": "Turn off Lumen", "uk": "Вимкнути Lumen"}, {"en": "Make the road narrower", "uk": "Зробити дорогу вужчою"}, {"en": "Rebuild the HLODs", "uk": "Перебудувати HLOD"}], "answer": 0, "explain": {"en": "The surface follows the spline. Lowering the point or blending the ground better seats the edge in the terrain.", "uk": "Покриття йде за сплайном. Якщо опустити точку або краще злити ґрунт, край сяде в рельєф."}}, {"q": {"en": "Why is a low sun (25 to 35 degrees) better than a noon sun for island shots?", "uk": "Чому низьке сонце (25–35 градусів) краще за полуденне для кадрів острова?"}, "options": [{"en": "It costs less GPU time", "uk": "Воно забирає менше часу GPU"}, {"en": "It removes the haze", "uk": "Воно прибирає серпанок"}, {"en": "It gives each hill a lit side and a shaded side, so the shapes read", "uk": "Воно дає кожному пагорбу освітлений і затінений бік, тож форми читаються"}, {"en": "It locks the exposure", "uk": "Воно фіксує експозицію"}], "answer": 2, "explain": {"en": "A low sun throws shadows across the land. At noon the light is flat and hills lose their shape.", "uk": "Низьке сонце кидає тіні через усю землю. Опівдні світло пласке, і пагорби втрачають форму."}}, {"q": {"en": "A viewer flying over your island keeps getting lost. What helps most?", "uk": "Глядач, що літає над твоїм островом, постійно губиться. Що допоможе найбільше?"}, "options": [{"en": "Thicker fog", "uk": "Густіший туман"}, {"en": "More grass", "uk": "Більше трави"}, {"en": "A higher Loading Range", "uk": "Більша Loading Range"}, {"en": "A tall landmark with a clear outline on high ground", "uk": "Високий орієнтир із чітким силуетом на височині"}], "answer": 3, "explain": {"en": "Landmarks seen from far away tell people where they are. Fog and grass hide them instead.", "uk": "Орієнтири, видні здалеку, кажуть людям, де вони. Туман і трава, навпаки, їх ховають."}}, {"q": {"en": "What is a Data Layer for?", "uk": "Для чого потрібен Data Layer?"}, "options": [{"en": "Grouping actors across the world so you can show, hide or load them together", "uk": "Щоб групувати акторів у всьому світі й разом показувати, ховати чи завантажувати їх"}, {"en": "Storing textures", "uk": "Щоб зберігати текстури"}, {"en": "Building HLODs", "uk": "Щоб будувати HLOD"}], "answer": 0, "explain": {"en": "Data Layers sort a big world by kind, such as all water or all forest, so you can work on one kind at a time.", "uk": "Data Layers сортують великий світ за видами, як-от уся вода чи весь ліс, тож можна працювати з одним видом за раз."}}, {"q": {"en": "You hide DL_Water and the ocean disappears too. What happened?", "uk": "Ти ховаєш DL_Water, і океан теж зникає. Що сталося?"}, "options": [{"en": "The HLODs are not built", "uk": "HLOD не побудовані"}, {"en": "The ocean was added to DL_Water; it should be on no layer and always loaded", "uk": "Океан додано в DL_Water; він має бути поза шарами й завжди завантаженим"}, {"en": "The fog is too thick", "uk": "Туман загустий"}], "answer": 1, "explain": {"en": "The ocean and its Water Zone must always be there. Keep them off Data Layers, with Is Spatially Loaded unticked.", "uk": "Океан і його Water Zone мають бути на місці завжди. Тримай їх поза Data Layers, з вимкненим Is Spatially Loaded."}}, {"q": {"en": "Which Electric Dreams levels may you open on a 16 GB PC?", "uk": "Які рівні Electric Dreams можна відкривати на ПК з 16 ГБ?"}, "options": [{"en": "ElectricDreams_Env", "uk": "ElectricDreams_Env"}, {"en": "ElectricDreams_PCG", "uk": "ElectricDreams_PCG"}, {"en": "Only the small breakdown levels, such as ElectricDreams_PCGForest", "uk": "Лише маленькі рівні-розбори, як-от ElectricDreams_PCGForest"}, {"en": "Any level, if the browser is closed", "uk": "Будь-який рівень, якщо браузер закритий"}], "answer": 2, "explain": {"en": "ElectricDreams_Env and ElectricDreams_PCG are the full 4 km maps, built for 32 to 64 GB of memory.", "uk": "ElectricDreams_Env і ElectricDreams_PCG — це повні мапи 4 км, розраховані на 32–64 ГБ пам'яті."}}, {"q": {"en": "Your forest box sits square across the valley and trees stand on the road. What is the best fix today?", "uk": "Коробка лісу стоїть квадратом поперек долини, а дерева стоять на дорозі. Яке виправлення найкраще сьогодні?"}, "options": [{"en": "Use two or three boxes turned to the valley's shape, split on either side of the road", "uk": "Узяти дві-три коробки, повернуті під форму долини й розділені по обидва боки дороги"}, {"en": "Set Trees Density to zero", "uk": "Встановити Trees Density на нуль"}, {"en": "Hide DL_Forest in the shots", "uk": "Сховати DL_Forest у кадрах"}, {"en": "Move the road", "uk": "Пересунути дорогу"}], "answer": 0, "explain": {"en": "Several fitted boxes follow the land and leave the road clear. Week 8 adds proper keep-out rules.", "uk": "Кілька підігнаних коробок ідуть за рельєфом і лишають дорогу чистою. На 8-му тижні з'являться справжні правила зон-винятків."}}], "weekInfo": {"week": 7, "title": {"en": "Roads, the big world and a first forest", "uk": "Дороги, великий світ і перший ліс"}, "goal": {"en": "By Friday you have roads that follow the land, island-scale light with landmarks and vistas, L_Island organised with World Partition, Data Layers and HLODs, and a first PCG forest filling one valley.", "uk": "До п'ятниці в тебе є дороги, що йдуть за рельєфом, світло в масштабі острова з орієнтирами й панорамами, L_Island, упорядкований за допомогою World Partition, Data Layers і HLOD, і перший PCG-ліс, що заповнює одну долину."}, "skills": [{"en": "Landscape spline roads built to real grades in Unreal Engine 5", "uk": "Дороги зі сплайнів ландшафту зі справжніми ухилами в Unreal Engine 5"}, {"en": "World Partition, Data Layer and HLOD set-up for large open worlds", "uk": "Налаштування World Partition, Data Layers і HLOD для великих відкритих світів"}, {"en": "Atmosphere, light, landmarks and vistas for open-world composition", "uk": "Атмосфера, світло, орієнтири й панорами в композиції відкритого світу"}, {"en": "Reading production PCG graphs and migrating assets between Unreal projects", "uk": "Читання продакшн-графів PCG і перенесення асетів між проєктами Unreal"}]}, "morning": {"sofar": {"en": "This week you added roads, island light, landmarks, a big-world set-up and your first PCG forest.", "uk": "Цього тижня в тебе з'явилися дороги, світло для острова, орієнтири, налаштування великого світу й перший PCG-ліс."}, "today": {"en": "It is Boss day: you fill one whole valley with the PCG forest, clear of roads, river and districts, and prove it in three shots and a flight.", "uk": "Сьогодні День боса: ти заповнюєш PCG-лісом цілу долину, оминаючи дороги, річку й райони, і доводиш це трьома кадрами та прольотом."}, "cheer": {"en": "Lock in Bronze first and grow from there; a forest filling a valley you sculpted yourself is a fine way to end the week.", "uk": "Спершу здобудь Бронзу, а далі рости; ліс, що заповнює долину, виліплену твоїми руками, — чудове завершення тижня."}, "quote": {"text": {"en": "The woods are lovely, dark and deep, but I have promises to keep, and miles to go before I sleep.", "uk": "Ліс чарівний, темний і глибокий, та маю я обіцянки дотримати, і ще йти й іти мені до сну."}, "author": {"en": "Robert Frost", "uk": "Роберт Фрост"}, "source": "https://en.wikiquote.org/wiki/Robert_Frost"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-35-boss-roads-big-world-first-forest", "mapHref": "../../COURSE.html", "prevHref": "../Day-34-electric-dreams-pcg-forest/START-HERE.html", "nextHref": "../Day-36-own-biome-graph/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8 and Krita. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me and don't write code. Keep me moving and make it feel like a game.\n\nToday I build on my own: The checks, the shots and the flight, timed (tiers).\nIt's part of: One valley of your island filled with the migrated PCG forest, shaped to the valley and clear of roads, river and districts, with your roads, light and big-world set-up checked; proved in three locked shots, a board beside reference photos and a 60-second flight (L_Island: one whole valley your map shows as forest (about 300 x 200 m or more), outside both districts. Shots: S1 the switchback at 30 m, S2 the forest valley at 60 m with a landmark in view, S3 the whole island at 200 m.).\n\nSpec:\n- The valley forest: two or three PCGDemo_ForestBP boxes turned and scaled to the valley's shape, together covering it; no trees on a road, in the river or inside a district square; the changed settings and seeds in boss_day35.md; all on DL_Forest.\n- Roads checked: every leg under 10 %, no lumps or floating edges at 10 m.\n- The island light recipe applied and the exposure locked.\n- HLODs rebuilt after the forest; the valley still shows from 800 m out at sea in Play.\n- Three locked Cine Cameras S1 to S3, a HighResShot 1920x1080 from each, in boss_board_day35.png beside matching reference photos.\n- stat unit at S3 written down (Frame and GPU) and a 60-second flight over the road and the valley in Play.\n\nMy checklist:\n1. Start the clock. Write your plan with times in boss_day35.md, and take your 'before' shot from the Day 32 vista camera that sees the valley. Check: the plan fits in 4 hours, and before_day35.png is saved. (from lesson 1)\n2. Fly every road at 10 m; fix any leg over 10 % and any lump or floating edge. Check: road_grades.md is up to date and no road edge floats. (from day 31, lesson 4)\n3. Choose the forest valley on island_map.png and mark the roads, river and district squares that cross or touch it. Check: the valley is outlined and its no-tree areas are marked. (from lesson 2)\n4. Move your test forest into the valley and add boxes (Alt+drag) until it is covered, each turned and scaled to fit. Check: from 150 m the forest follows the valley's shape, not a square. (from lesson 2)\n5. Keep the road, river and districts clear: split boxes on either side of the road and shrink any box that touches a district; Generate. Check: no trunk stands on a road, in the river or inside a district square. (from lesson 2)\n6. Retune for the valley: density, clearings and a seed, one change at a time; write the values. Check: clumps and clearings show from 60 m, with no rows. (from day 34, lesson 4)\n7. Apply the light recipe, confirm the exposure lock and rebuild the HLODs (Build > Build HLODs). Check: in Play the valley still shows from 800 m out at sea. (from day 33, lesson 4)\n8. Place, set and lock S1, S2 and S3; take a HighResShot from each. Check: three 1920 x 1080 files named island_S1.png to island_S3.png. (from lesson 3)\n9. Make boss_board_day35.png: each shot beside a reference photo of a similar view. Check: three labelled pairs. (from lesson 3)\n10. Pilot S3 and read stat unit; then fly the road and the valley in Play and record 60 seconds. Check: Frame and GPU are in boss_day35.md and the clip is saved. (from lesson 3)\n11. Score yourself with the rubric, then ask the tutor for see-why-fix notes; write both, your decision and your tier in self_review_day35.md. Check: five scores, three notes and one decision. (from lesson 4)\n12. Before/after capture: your 'before' from the vista camera beside the same camera now. Check: before_after_day35.png and flythrough_day35.mp4 are saved. (from lesson 3)\n\nToday is a BOSS build: help me keep time against the tiers below. Tiers:\n- Bronze: the valley forest generated and clear of roads, river and districts, the roads checked, three locked 1920 x 1080 shots, the board and a 60-second flight, inside 4 hours.\n- Silver: the forest follows the valley's shape with clumps and clearings and no rows from 60 m, every road leg is under 10 % with no floating edge, and the valley shows from 800 m out at sea in Play.\n- Gold: each shot reads as a real island in a 3-second look beside its photo, and you finish inside 3 hours. You also add one stretch: a second lane to your other district (its own junction, every leg under 10 %), or one more Electric Dreams breakdown level read in ElectricDreamsSample with IslandCourse closed (ElectricDreams_PCGLargeAssembly or ElectricDreams_PCGSplineExample), with two lines in pcg_study.md.\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me and tell me which tier I reached.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Elina\nDay 35: Boss: roads, the big world and a first PCG forest on one valley. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; boss tier: <bronze / silver / gold / none>; quiz: <score> of 8\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

/* seven-segment display, like an LCD panel: ghost 8s behind the lit segments */
const SEG={0:'abcdef',1:'bc',2:'abged',3:'abgcd',4:'fgbc',5:'afgcd',6:'afgedc',7:'abc',8:'abcdefg',9:'abcdfg'};
function seg(str,cls){str=String(str);const W=15,H=26,t=2.8,g=.9,P={a:[[g+t/2,0],[W-g-t/2,0],[W-g-t,t],[g+t,t]],d:[[g+t,H-t],[W-g-t,H-t],[W-g-t/2,H],[g+t/2,H]],g:[[g+t,H/2-t/2],[W-g-t,H/2-t/2],[W-g-t/2,H/2],[W-g-t,H/2+t/2],[g+t,H/2+t/2],[g+t/2,H/2]],f:[[0,g+t/2],[t,g+t],[t,H/2-g-t/2],[t/2,H/2-g],[0,H/2-g-t/2]],b:[[W,g+t/2],[W,H/2-g-t/2],[W-t/2,H/2-g],[W-t,H/2-g-t/2],[W-t,g+t]],e:[[0,H/2+g+t/2],[t/2,H/2+g],[t,H/2+g+t/2],[t,H-g-t],[0,H-g-t/2]],c:[[W,H/2+g+t/2],[W,H-g-t/2],[W-t,H-g-t],[W-t,H/2+g+t/2],[W-t/2,H/2+g]]};
 let x=0,o='';for(const ch of str){if(ch===' '){x+=8;continue}if(ch==='/'){o+='<path class="on" d="M'+(x+9)+' 2L'+(x+2)+' '+(H-2)+'L'+(x+4.5)+' '+(H-2)+'L'+(x+11.5)+' 2Z"/>';x+=15;continue}const on=SEG[ch]||'';
  for(const k of 'abcdefg')o+='<polygon class="'+(on.includes(k)?'on':'gh')+'" points="'+P[k].map(p=>(p[0]+x).toFixed(1)+','+p[1].toFixed(1)).join(' ')+'"/>';x+=W+5}
 return '<svg class="seg7'+(cls?' '+cls:'')+'" viewBox="-1 -1 '+(x-3)+' '+(H+2)+'" aria-hidden="true" focusable="false"><g transform="skewX(-6) translate(2 0)">'+o+'</g></svg>'}
/* the chart: a topographic island inside a dial; week w is a waypoint, built (b), being built now (n) or still ahead (p) */
function enc(p,done){const k=p>=1?done:p<=0?'enc0':p<.25?'enc1':p<.5?'enc2':p<.75?'enc3':p<.9?'enc4':'enc5';return u(k)}
function island(state,pct,label){
 const cx=300,cy=205,R=172,TAU=Math.PI*2;

 const pt=(t,s,k)=>{const r=rad(t,s,k||0);return [cx+r*Math.cos(t),cy+r*Math.sin(t)*.78]};
 const f=n=>n.toFixed(1);
 const smooth=(P,closed)=>{let d='M'+f(P[0][0])+' '+f(P[0][1]);const n=P.length,g=i=>P[closed?(i+n)%n:Math.max(0,Math.min(n-1,i))];
  for(let i=0;i<(closed?n:n-1);i++){const p0=g(i-1),p1=g(i),p2=g(i+1),p3=g(i+2);d+='C'+f(p1[0]+(p2[0]-p0[0])/6)+' '+f(p1[1]+(p2[1]-p0[1])/6)+' '+f(p2[0]-(p3[0]-p1[0])/6)+' '+f(p2[1]-(p3[1]-p1[1])/6)+' '+f(p2[0])+' '+f(p2[1])}return d+(closed?'Z':'')};
 const ring=(s,k)=>{const P=[];for(let i=0;i<64;i++)P.push(pt(i/64*TAU,s,k));return smooth(P,true)};
 let o='<path class="c0" d="'+ring(1,0)+'"/>';
 [.84,.69,.55,.42,.3,.19,.1].forEach((s,k)=>o+='<path class="c" d="'+ring(s,k+1)+'"/>');
 const t0=-2.2,turns=1.55,wp=w=>{const t=(w-1)/11;return {a:t0+t*turns*TAU,s:1.1-t*.98}};
 const P=[],D=[];let last=0;for(let w=1;w<=12;w++)if(state(w)!=='p')last=w;
 for(let i=0;i<=110;i++){const t=i/110,a=t0+t*turns*TAU,s=1.1-t*.98,q=pt(a,s,0);P.push(q);if(last&&t<=(last-1)/11+1e-9)D.push(q)}
 o+='<path class="rt" d="'+smooth(P,false)+'"/>';
 if(D.length>1)o+='<path class="rtd" d="'+smooth(D,false)+'"/>';
 for(let w=1;w<=12;w++){const c=state(w),{a,s}=wp(w),q=pt(a,s,0),lx=q[0]+(Math.cos(a)>=0?15:-15),an=Math.cos(a)>=0?'start':'end';
  o+='<g class="w '+c+'">'+(c==='n'?'<circle class="halo" cx="'+f(q[0])+'" cy="'+f(q[1])+'" r="12"/>':'')+'<circle class="dot" cx="'+f(q[0])+'" cy="'+f(q[1])+'" r="'+(c==='p'?4.5:c==='n'?8:6)+'"/><text x="'+f(lx)+'" y="'+f(q[1]+5.5)+'" text-anchor="'+an+'">'+String(w).padStart(2,'0')+'</text></g>'}
 /* the dial around it: a ring with the progress arc and a label running along the rim */

 let s='<svg class="dial" viewBox="0 0 400 400" aria-hidden="true" focusable="false"><defs><linearGradient id="'+id+'g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--acc2)"/><stop offset="1" style="stop-color:var(--acc)"/></linearGradient><path id="'+id+'" d="M200 200m-191 0a191 191 0 1 1 382 0a191 191 0 1 1-382 0"/></defs>';
 s+='<circle class="face" cx="200" cy="200" r="168"/><circle class="track" cx="200" cy="200" r="176"/>';
 s+='<circle class="arc" cx="200" cy="200" r="176" stroke="url(#'+id+'g)" stroke-dasharray="'+(C*p).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 200 200)"/>';
 if(p>0){const A=-Math.PI/2+p*TAU;s+='<circle class="knob'+(p<1?' go':'')+'" cx="'+(200+176*Math.cos(A)).toFixed(1)+'" cy="'+(200+176*Math.sin(A)).toFixed(1)+'" r="7"/>'}
 if(label)s+='<text class="rimt"><textPath href="#'+id+'" startOffset="25%" text-anchor="middle">'+label+'</textPath></text>';
 s+='<svg class="topo" x="40" y="62" width="320" height="276" viewBox="40 20 520 370">'+o+'</svg>';
 return s+'</svg>'}

<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 58</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

изно за 15 секунд, склейки на русі. 3-секундний титр (стрічка Text) показує назву твого острова й справжнє місце, на якому він базується; 4-секундна фінальна заставка показує твоє ім'я та 'Credits: see credits.md'."}, {"en": "Music only if its licence allows use in a video (your Day 57 choice), as a Sound strip, with the track, its author and its licence in credits.md; no music is fine.", "uk": "Музика лише тоді, коли її ліцензія дозволяє використання у відео (твій вибір з Дня 57), як стрічка Sound, а трек, його автор і ліцензія вказані в credits.md; без музики — теж нормально."}, {"en": "island_flight.mp4 rendered from Blender (Media Type Video, Container MPEG-4, Video Codec H.264, Audio Codec AAC if there is music), 1920 x 1080, 1:50 to 2:10 long, and watched full screen once with every fault noted.", "uk": "island_flight.mp4, відрендерений з Blender (Media Type Video, Container MPEG-4, Video Codec H.264, Audio Codec AAC, якщо є музика), 1920 x 1080, тривалістю від 1:50 до 2:10, один раз переглянутий на весь екран із записом кожної вади."}], "piece1": "the recording set-up and the first takes", "piece2": {"en": "All the takes, the cinematic shot and the cut, on your own", "uk": "Усі дублі, кінематографічний кадр і монтаж — самостійно"}, "steps": [{"text": {"en": "Set up recording: Windows captures at 30 fps and High quality, the flight exposure on, the regions along the route loaded, the editor maximised. Check: a 5-second test recording plays back sharp and smooth.", "uk": "Налаштуй запис: Windows записує 30 fps з якістю High, експозиція для прольоту увімкнена, регіони вздовж маршруту завантажені, редактор розгорнуто на весь екран. Перевірка: 5-секундний тестовий запис відтворюється чітко й плавно."}, "lesson": 1}, {"text": {"en": "Record 2 or 3 takes of beats 1 to 3 and log each one in takes.md. Check: every take has a line with its faults and keep or not.", "uk": "Запиши 2–3 дублі бітів 1–3 і внеси кожен у takes.md. Перевірка: у кожного дубля є рядок із вадами й позначкою «залишити» чи ні."}, "lesson": 1}, {"text": {"en": "Record takes of beats 4 to 6. Check: each beat has at least one take with no clipping, no pop and a level horizon.", "uk": "Запиши дублі бітів 4–6. Перевірка: у кожного біту є щонайменше один дубль без проходження крізь об'єкти, без раптових появ і з рівним горизонтом."}, "lesson": 1}, {"text": {"en": "Record takes of the remaining beats and move all the takes into today's Work folder. Check: every beat in flight_plan.md has a 'keep' take.", "uk": "Запиши дублі решти бітів і перенеси всі дублі в сьогоднішню папку Work. Перевірка: кожен біт із flight_plan.md має дубль «залишити»."}, "lesson": 1}, {"text": {"en": "Make LS_Reveal (or LS_Finale): a Level Sequence with a Cine Camera and a start key and an end key, 8 to 12 seconds apart. Check: pressing Play in Sequencer shows the move through the camera.", "uk": "Зроби LS_Reveal (або LS_Finale): Level Sequence з Cine Camera, початковим і кінцевим ключами з відстанню 8–12 секунд. Перевірка: натискання Play у Sequencer показує рух крізь камеру."}, "lesson": 2}, {"text": {"en": "Smooth the move: a level horizon, a gentle start and stop, nothing the camera passes through. Check: played back, the move has no jerk.", "uk": "Згладь рух: рівний горизонт, м'який початок і зупинка, камера ні крізь що не пролітає. Перевірка: під час відтворення рух іде без ривків."}, "lesson": 2}, {"text": {"en": "Render the shot with Movie Render Queue at 1920 x 1080 as a .jpg sequence, with warm-up frames, and move the frames into a new folder reveal_frames in today's Work folder. Check: reveal_frames holds 240 to 360 numbered JPG files.", "uk": "Відрендер кадр через Movie Render Queue при 1920 x 1080 як послідовність .jpg з кадрами прогріву (warm-up) і перенеси кадри в нову папку reveal_frames у сьогоднішній папці Work. Перевірка: у reveal_frames лежить від 240 до 360 пронумерованих файлів JPG."}, "lesson": 3}, {"text": {"en": "In Blender choose File > New > Video Editing, save island_flight.blend in today's Work folder, and set the Output tab's Format to 1920 x 1080, 100 % and Frame Rate 30. Check: the Output tab shows 1920 x 1080 and 30 fps.", "uk": "У Blender обери File > New > Video Editing, збережи island_flight.blend у сьогоднішній папці Work і на вкладці Output постав Format 1920 x 1080, 100 % і Frame Rate 30. Перевірка: вкладка Output показує 1920 x 1080 і 30 fps."}, "lesson": 4}, {"text": {"en": "Rough cut: add the 'keep' takes (Shift+A > Movie) and reveal_frames (Shift+A > Image/Sequence), and drag the strips into beat order. Check: Frame Rate still says 30, the render is one strip, and the timeline runs every beat (about 2:30 to 3:00).", "uk": "Чорновий монтаж: додай дублі «залишити» (Shift+A > Movie) і reveal_frames (Shift+A > Image/Sequence) й перетягни стрічки в порядку бітів. Перевірка: Frame Rate досі показує 30, рендер — одна стрічка, а таймлайн проходить кожен біт (приблизно 2:30–3:00)."}, "lesson": 4}, {"text": {"en": "Fine cut: split with K, delete with X, close each gap with Backspace; trim to 1:50 to 2:10, cut on movement, no shot over about 15 seconds. Check: your strongest shots are in the first 5 seconds and at the very end.", "uk": "Чистовий монтаж: розрізай через K, видаляй через X, закривай кожен проміжок через Backspace; скороти до 1:50–2:10, клей на русі, жоден кадр не довший приблизно за 15 секунд. Перевірка: твої найсильніші кадри стоять у перших 5 секундах і в самому кінці."}, "lesson": 4}, {"text": {"en": "Add the 3-second title (Shift+A > Text) and the 4-second end card (Shift+A > Color, set to black in the Strip tab, with a Text strip in the channel above it); add your music only if its licence allows it (Shift+A > Sound) and credit it. Check: both cards read in 3 seconds, and credits.md has a line for any music.", "uk": "Додай 3-секундний титр (Shift+A > Text) і 4-секундну фінальну заставку (Shift+A > Color, на вкладці Strip постав чорний колір, а в каналі над нею — стрічка Text); додай музику, лише якщо її ліцензія це дозволяє (Shift+A > Sound), і вкажи її. Перевірка: обидві заставки читаються за 3 секунди, а в credits.md є рядок для музики, якщо вона є."}, "lesson": 4}, {"text": {"en": "Set the Frame Range End to the end card's last frame, set Media Type Video, Container MPEG-4 and Video Codec H.264 (Audio Codec AAC if you have music), choose Render > Render Animation, and rename the file island_flight.mp4. Check: it plays in the Windows player at 1920 x 1080 and is 1:50 to 2:10 long.", "uk": "Постав Frame Range End на останній кадр фінальної заставки, постав Media Type Video, Container MPEG-4 і Video Codec H.264 (Audio Codec AAC, якщо є музика), обери Render > Render Animation і перейменуй файл на island_flight.mp4. Перевірка: він відтворюється у програвачі Windows при 1920 x 1080 і триває від 1:50 до 2:10."}, "lesson": 4}, {"text": {"en": "Watch it full screen once, note every fault with its time in takes.md, and fix the worst one. Save today's clip as flythrough_day58.mp4 and check that you also have ls_reveal_timeline.png and before_after_day58.png (each is described in today's hand-in list; take any you are missing now). Check: no clipping, pop or stutter you can see; the first 60 seconds is today's clip.", "uk": "Переглянь його один раз на весь екран, запиши кожну ваду з її часом у takes.md і виправ найгіршу. Збережи сьогоднішній кліп як flythrough_day58.mp4 і перевір, що в тебе є також ls_reveal_timeline.png і before_after_day58.png (кожен описано в сьогоднішньому списку «Що здати»; зроби зараз ті, яких бракує). Перевірка: немає помітного проходження крізь об'єкти, раптових появ чи підвисань; перші 60 секунд — це сьогоднішній кліп."}, "lesson": 1}]}, "lessons": [{"title": {"en": "Takes: flying each beat cleanly", "uk": "Дублі: чисто пролітаємо кожен біт"}, "minutes": 40, "goals": [{"en": "Explain a take: one recording of one beat. You fly each beat 2 or 3 times and keep the best one.", "uk": "Пояснити, що таке дубль: один запис одного біту. Ти пролітаєш кожен біт 2–3 рази й залишаєш найкращий."}, {"en": "Fly smoothly: a steady speed, gentle turns, a level horizon, nothing touched.", "uk": "Літати плавно: рівна швидкість, м'які повороти, рівний горизонт, нічого не зачеплено."}, {"en": "Record with the Windows recorder (Win+Alt+R) at 30 frames a second, and log every take.", "uk": "Записувати вбудованим записувачем Windows (Win+Alt+R) при 30 кадрах за секунду й вносити кожен дубль у журнал."}], "doalong": [{"en": "Open Windows Settings > Gaming > Captures; set Video frame rate to 30 fps and Video quality to High. You should see both settings saved.", "uk": "Відкрий Windows Settings > Gaming > Captures; постав Video frame rate на 30 fps, а Video quality на High. Ти бачиш, що обидва налаштування збережено."}, {"en": "In your Post Process Volume, set Min EV100 and Max EV100 to the flight values from island_light_recipe.md. You should see the flight values in Details.", "uk": "У своєму Post Process Volume постав Min EV100 і Max EV100 на значення для прольоту з island_light_recipe.md. Ти бачиш значення для прольоту в Details."}, {"en": "Load the regions your route passes through (World Partition Editor > drag a box > Load Region from Selection; on a 16 GB PC, load the first half of the route now and the second half later). Maximise the editor, press G for game view and F11 for a full-window viewport, and slow the camera down (hold the right mouse button and roll the mouse wheel). You should see only the island, with no panels.", "uk": "Завантаж регіони, крізь які проходить маршрут (World Partition Editor > виділи рамкою > Load Region from Selection; на ПК з 16 ГБ завантаж зараз першу половину маршруту, а другу — пізніше). Розгорни редактор, натисни G для ігрового вигляду й F11 для в'юпорту на все вікно та сповільни камеру (утримуй праву кнопку миші й крути коліщатко). Ти бачиш лише острів, без панелей."}, {"en": "Fly to the start of beat 1, press Win+Alt+R, fly the beat holding the right mouse button with W, A, S, D, E and Q, then press Win+Alt+R again. You should see a small recording box appear and then stop.", "uk": "Підлети до початку біту 1, натисни Win+Alt+R, пролети біт, утримуючи праву кнопку миші, клавішами W, A, S, D, E і Q, потім знову натисни Win+Alt+R. Ти бачиш, як з'являється й зупиняється маленьке віконце запису."}, {"en": "Open Videos > Captures in File Explorer, move the clip into today's Work folder, watch it, and write a line in takes.md: beat 1, take 1, faults, keep or not. You should see your first log line.", "uk": "Відкрий Videos > Captures у File Explorer (Провідник), перенеси кліп у сьогоднішню папку Work, переглянь його й запиши рядок у takes.md: біт 1, дубль 1, вади, залишити чи ні. Ти бачиш свій перший рядок журналу."}], "play": {"en": "Clean run: three takes of beat 1; the tutor checks my fault notes for each and scores the cleanest.", "uk": "Чистий прохід: три дублі біту 1; тьютор перевіряє мої нотатки про вади кожного й оцінює найчистіший."}, "video": {"search": "how to fly smooth cinematic drone shots"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Takes: flying each beat cleanly (Day 58, lesson 1 of 4).\nToday's build: island_flight.mp4: a 1:50 to 2:10 scenic flight through both districts, cut in Blender's Video Editing workspace from 2 or 3 takes of every beat and one Sequencer shot rendered with Movie Render Queue, with title and end cards.\n\nBy the end of this lesson I can:\n1. Explain a take: one recording of one beat. You fly each beat 2 or 3 times and keep the best one.\n2. Fly smoothly: a steady speed, gentle turns, a level horizon, nothing touched.\n3. Record with the Windows recorder (Win+Alt+R) at 30 frames a second, and log every take.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (Your island has a planned scenic flight, with gates and a locked camera at every beat.), what I will learn today (You fly clean takes of each beat, render one cinematic shot, and cut a 2-minute video in Blender with a title and an end card.), encourage me (A first cut is never the last one, so put it together, watch it with fresh eyes, and trim; tomorrow is there for a final polish.), and share today's quote: \"If you want a happy ending, that depends, of course, on where you stop your story.\" (Orson Welles).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 55: which three groups do you sort issues into in a triage, and what goes into each? | Day 53: what does a landmark do for a pilot?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Clean run: three takes of beat 1; the tutor checks my fault notes for each and scores the cleanest.\n6. Do-along on today's build (the recording set-up and the first takes): guide me through these steps one at a time, checking a screenshot after each:\n   - Open Windows Settings > Gaming > Captures; set Video frame rate to 30 fps and Video quality to High. You should see both settings saved.\n   - In your Post Process Volume, set Min EV100 and Max EV100 to the flight values from island_light_recipe.md. You should see the flight values in Details.\n   - Load the regions your route passes through (World Partition Editor > drag a box > Load Region from Selection; on a 16 GB PC, load the first half of the route now and the second half later). Maximise the editor, press G for game view and F11 for a full-window viewport, and slow the camera down (hold the right mouse button and roll the mouse wheel). You should see only the island, with no panels.\n   - Fly to the start of beat 1, press Win+Alt+R, fly the beat holding the right mouse button with W, A, S, D, E and Q, then press Win+Alt+R again. You should see a small recording box appear and then stop.\n   - Open Videos > Captures in File Explorer, move the clip into today's Work folder, watch it, and write a line in takes.md: beat 1, take 1, faults, keep or not. You should see your first log line.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "One cinematic shot with Sequencer", "uk": "Один кінематографічний кадр у Sequencer"}, "minutes": 40, "goals": [{"en": "Explain Sequencer: Unreal's timeline editor for camera moves and animation, like a video editor inside the engine. A Level Sequence is one such timeline, saved as an asset.", "uk": "Пояснити, що таке Sequencer: редактор таймлайну в Unreal для рухів камери й анімації, як відеоредактор усередині рушія. Level Sequence — це один такий таймлайн, збережений як асет."}, {"en": "Explain a keyframe: a saved position at one moment in time; Sequencer moves the camera smoothly from one keyframe to the next.", "uk": "Пояснити, що таке ключовий кадр: збережене положення в певну мить; Sequencer плавно рухає камеру від одного ключового кадру до наступного."}, {"en": "Make an 8 to 12 second camera move with a Cine Camera and two or three keyframes.", "uk": "Зробити рух камери на 8–12 секунд за допомогою Cine Camera і двох-трьох ключових кадрів."}], "doalong": [{"en": "In the main toolbar click the Cinematics button (the clapperboard icon) > Add Level Sequence, and save it as LS_Reveal in Content/Island/Cinematics. You should see the Sequencer window open with an empty timeline.", "uk": "На головній панелі інструментів натисни кнопку Cinematics (іконка з кінохлопавкою) > Add Level Sequence і збережи її як LS_Reveal у Content/Island/Cinematics. Ти бачиш, як відкривається вікно Sequencer з порожнім таймлайном."}, {"en": "In Sequencer's toolbar, click the camera icon (Create Camera). You should see a new Cine Camera, a Camera Cuts track, and the viewport looking through the camera.", "uk": "На панелі інструментів Sequencer натисни іконку камери (Create Camera). Ти бачиш нову Cine Camera, доріжку Camera Cuts і в'юпорт, що дивиться крізь камеру."}, {"en": "Drag the red end line of the timeline to 10 seconds (frame 300, at 30 frames a second). You should see a longer timeline.", "uk": "Перетягни червону кінцеву лінію таймлайну на 10 секунд (кадр 300 при 30 кадрах за секунду). Ти бачиш довший таймлайн."}, {"en": "Move the time marker to 0. Fly the view (right mouse button with W, A, S, D) to the reveal's start, then click the small key button on the camera's Transform row. You should see a keyframe dot at 0.", "uk": "Постав маркер часу на 0. Пролети видом (права кнопка миші з W, A, S, D) до початку розкриття, потім натисни маленьку кнопку ключа в рядку Transform камери. Ти бачиш крапку ключового кадру на 0."}, {"en": "Move the time marker to the end, fly to the end position and click the key button again; then press Space to play. You should see the camera glide from the first position to the second.", "uk": "Постав маркер часу в кінець, підлети до кінцевого положення й знову натисни кнопку ключа; потім натисни Space, щоб відтворити. Ти бачиш, як камера плавно пливе з першого положення в друге."}], "play": {"en": "Smooth or not: I describe my move's start, middle and end; the tutor asks about the horizon, the speed and anything the camera passes through; each 'no' becomes a fix.", "uk": "Плавно чи ні: я описую початок, середину й кінець свого руху; тьютор питає про горизонт, швидкість і все, крізь що пролітає камера; кожне «ні» стає виправленням."}, "video": {"url": "https://www.youtube.com/watch?v=CW8hDvJOwGM", "title": "Unreal Engine 5 Cinematic Camera Tutorial for Beginners STEP BY STEP", "channel": "EZ Unreal", "length": "7:46", "search": "unreal engine 5 cine camera actor"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: One cinematic shot with Sequencer (Day 58, lesson 2 of 4).\nToday's build: island_flight.mp4: a 1:50 to 2:10 scenic flight through both districts, cut in Blender's Video Editing workspace from 2 or 3 takes of every beat and one Sequencer shot rendered with Movie Render Queue, with title and end cards.\nEarlier today I already did: lesson 1 (Takes: flying each beat cleanly). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Explain Sequencer: Unreal's timeline editor for camera moves and animation, like a video editor inside the engine. A Level Sequence is one such timeline, saved as an asset.\n2. Explain a keyframe: a saved position at one moment in time; Sequencer moves the camera smoothly from one keyframe to the next.\n3. Make an 8 to 12 second camera move with a Cine Camera and two or three keyframes.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Smooth or not: I describe my move's start, middle and end; the tutor asks about the horizon, the speed and anything the camera passes through; each 'no' becomes a fix.\n4. Do-along on today's build (the recording set-up and the first takes): guide me through these steps one at a time, checking a screenshot after each:\n   - In the main toolbar click the Cinematics button (the clapperboard icon) > Add Level Sequence, and save it as LS_Reveal in Content/Island/Cinematics. You should see the Sequencer window open with an empty timeline.\n   - In Sequencer's toolbar, click the camera icon (Create Camera). You should see a new Cine Camera, a Camera Cuts track, and the viewport looking through the camera.\n   - Drag the red end line of the timeline to 10 seconds (frame 300, at 30 frames a second). You should see a longer timeline.\n   - Move the time marker to 0. Fly the view (right mouse button with W, A, S, D) to the reveal's start, then click the small key button on the camera's Transform row. You should see a keyframe dot at 0.\n   - Move the time marker to the end, fly to the end position and click the key button again; then press Space to play. You should see the camera glide from the first position to the second.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Unreal Engine 5 Cinematic Camera Tutorial for Beginners STEP BY STEP\" by EZ Unreal: https://www.youtube.com/watch?v=CW8hDvJOwGM\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Rendering with Movie Render Queue (micro-lesson)", "uk": "Рендер через Movie Render Queue (мікроурок)"}, "minutes": 40, "goals": [{"en": "Explain Movie Render Queue: Unreal's tool that renders a Level Sequence frame by frame at full quality, with no dropped frames, however slow your PC is. The queue is the list of shots waiting to render.", "uk": "Пояснити, що таке Movie Render Queue: інструмент Unreal, який рендерить Level Sequence кадр за кадром у повній якості, без пропущених кадрів, хоч яким повільним був би твій ПК. Черга (queue) — це список кадрів, що чекають на рендер."}, {"en": "Explain an image sequence: the shot saved as numbered pictures, one per frame, which a video editor reads as one clip.", "uk": "Пояснити, що таке послідовність зображень: кадр, збережений як пронумеровані картинки, по одній на кадр, які відеоредактор читає як один кліп."}, {"en": "Render at 1920 x 1080 with warm-up frames (frames rendered and thrown away first, so the world has loaded before the first saved frame).", "uk": "Рендерити при 1920 x 1080 з кадрами прогріву (warm-up — кадри, які спершу рендеряться й викидаються, щоб світ устиг завантажитися до першого збереженого кадру)."}], "doalong": [{"en": "Open Edit > Plugins, search for Movie Render Queue and make sure it is ticked; if you had to tick it, click Restart Now. You should see it enabled (after a restart if you needed one).", "uk": "Відкрий Edit > Plugins, знайди Movie Render Queue й переконайся, що галочку поставлено; якщо її довелося ставити, натисни Restart Now. Ти бачиш, що плагін увімкнено (після перезапуску, якщо він був потрібен)."}, {"en": "Open Window > Cinematics > Movie Render Queue, click + Render and choose LS_Reveal. You should see one job in the list.", "uk": "Відкрий Window > Cinematics > Movie Render Queue, натисни + Render й обери LS_Reveal. Ти бачиш одне завдання в списку."}, {"en": "Click the job's settings (the text that says Unsaved Config). In Output, check Output Resolution is 1920 x 1080; check that a .jpg Sequence [8bit] setting is in the list on the left (add it with + Setting if not). You should see your output settings.", "uk": "Натисни налаштування завдання (текст Unsaved Config). В Output перевір, що Output Resolution — 1920 x 1080; перевір, що в списку ліворуч є налаштування .jpg Sequence [8bit] (якщо немає, додай його через + Setting). Ти бачиш свої налаштування виводу."}, {"en": "Click + Setting > Anti-aliasing and set Engine Warm Up Count to 64; click Accept. You should see the job ready.", "uk": "Натисни + Setting > Anti-aliasing і постав Engine Warm Up Count на 64; натисни Accept. Ти бачиш, що завдання готове."}, {"en": "Click Render (Local) and wait. When it finishes, open the folder named in Output > Output Directory (normally IslandCourse/Saved/MovieRenders), make a new folder reveal_frames in today's Work folder and move the numbered JPG files into it. You should see one JPG per frame in reveal_frames.", "uk": "Натисни Render (Local) і зачекай. Коли рендер завершиться, відкрий папку, вказану в Output > Output Directory (зазвичай IslandCourse/Saved/MovieRenders), створи нову папку reveal_frames у сьогоднішній папці Work і перенеси туди пронумеровані файли JPG. Ти бачиш у reveal_frames по одному JPG на кадр."}], "play": {"en": "Render planner: the tutor asks how many frames my 10-second shot has at 30 frames a second and how long it will take at 2 seconds a frame; I work it out before I press Render.", "uk": "Планувальник рендеру: тьютор питає, скільки кадрів має мій 10-секундний кадр при 30 кадрах за секунду і скільки часу займе рендер при 2 секундах на кадр; я рахую це, перш ніж натиснути Render."}, "video": {"url": "https://www.youtube.com/watch?v=fVg5ihB8Wdc", "title": "The 2025 Guide to Rendering in Unreal Engine 5", "channel": "William Faucher", "length": "13:05", "search": "unreal engine 5 rendering guide movie render queue"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Rendering with Movie Render Queue (micro-lesson) (Day 58, lesson 3 of 4).\nToday's build: island_flight.mp4: a 1:50 to 2:10 scenic flight through both districts, cut in Blender's Video Editing workspace from 2 or 3 takes of every beat and one Sequencer shot rendered with Movie Render Queue, with title and end cards.\nEarlier today I already did: lesson 1 (Takes: flying each beat cleanly); lesson 2 (One cinematic shot with Sequencer). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Explain Movie Render Queue: Unreal's tool that renders a Level Sequence frame by frame at full quality, with no dropped frames, however slow your PC is. The queue is the list of shots waiting to render.\n2. Explain an image sequence: the shot saved as numbered pictures, one per frame, which a video editor reads as one clip.\n3. Render at 1920 x 1080 with warm-up frames (frames rendered and thrown away first, so the world has loaded before the first saved frame).\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Render planner: the tutor asks how many frames my 10-second shot has at 30 frames a second and how long it will take at 2 seconds a frame; I work it out before I press Render.\n4. Do-along on today's build (the recording set-up and the first takes): guide me through these steps one at a time, checking a screenshot after each:\n   - Open Edit > Plugins, search for Movie Render Queue and make sure it is ticked; if you had to tick it, click Restart Now. You should see it enabled (after a restart if you needed one).\n   - Open Window > Cinematics > Movie Render Queue, click + Render and choose LS_Reveal. You should see one job in the list.\n   - Click the job's settings (the text that says Unsaved Config). In Output, check Output Resolution is 1920 x 1080; check that a .jpg Sequence [8bit] setting is in the list on the left (add it with + Setting if not). You should see your output settings.\n   - Click + Setting > Anti-aliasing and set Engine Warm Up Count to 64; click Accept. You should see the job ready.\n   - Click Render (Local) and wait. When it finishes, open the folder named in Output > Output Directory (normally IslandCourse/Saved/MovieRenders), make a new folder reveal_frames in today's Work folder and move the numbered JPG files into it. You should see one JPG per frame in reveal_frames.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"The 2025 Guide to Rendering in Unreal Engine 5\" by William Faucher: https://www.youtube.com/watch?v=fVg5ihB8Wdc\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Cutting the 2-minute video in Blender's Video Editing workspace", "uk": "Монтуємо 2-хвилинне відео в робочому просторі Video Editing у Blender"}, "minutes": 40, "goals": [{"en": "Set up a video project in Blender: File > New > Video Editing, at 1920 x 1080 and 30 frames a second (fps), the same as your takes and your render.", "uk": "Налаштувати відеопроєкт у Blender: File > New > Video Editing, 1920 x 1080 і 30 кадрів за секунду (fps), так само, як твої дублі й рендер."}, {"en": "Explain strips and cuts: every clip on the timeline (the Sequencer) is a strip, and a cut is the join between two strips. Cut on movement, keep shots under about 15 seconds, and put your strongest shots first and last.", "uk": "Пояснити, що таке стрічки й склейки: кожен кліп на таймлайні (у Sequencer) — це стрічка (strip), а склейка — це стик між двома стрічками. Клей на русі, тримай кадри коротшими приблизно за 15 секунд, а найсильніші кадри став першими й останніми."}, {"en": "Add the takes as Movie strips, the render as one Image Sequence strip and a title as a Text strip.", "uk": "Додати дублі як стрічки Movie, рендер — як одну стрічку Image Sequence, а титр — як стрічку Text."}, {"en": "Render a video file: Media Type Video, Container MPEG-4 (the file type, .mp4) and Video Codec H.264 (how the pictures are packed inside it), the common format every player opens.", "uk": "Відрендерити відеофайл: Media Type Video, Container MPEG-4 (тип файлу, .mp4) і Video Codec H.264 (як картинки запаковано всередині) — поширений формат, який відкриває будь-який програвач."}], "doalong": [{"en": "Open Blender and choose File > New > Video Editing; save at once as island_flight.blend in today's Work folder. You should see a preview at the top and an empty timeline at the bottom.", "uk": "Відкрий Blender і обери File > New > Video Editing; одразу збережи як island_flight.blend у сьогоднішній папці Work. Ти бачиш попередній перегляд угорі й порожній таймлайн унизу."}, {"en": "In the Properties editor click the Output tab (the printer icon). Under Format set Resolution X 1920, Y 1080, 100 %, and Frame Rate 30. You should see 1920 x 1080 and 30 fps.", "uk": "У редакторі Properties натисни вкладку Output (іконка принтера). У розділі Format постав Resolution X 1920, Y 1080, 100 % і Frame Rate 30. Ти бачиш 1920 x 1080 і 30 fps."}, {"en": "Hover over the timeline, press Shift+A > Movie, open today's Work folder, Ctrl+click two 'keep' takes and click the blue Add button. You should see them as strips one after the other (each brings a sound strip too: select those and press X if you want silence). Check that Frame Rate in the Output tab still says 30; set it back if it changed.", "uk": "Наведи курсор на таймлайн, натисни Shift+A > Movie, відкрий сьогоднішню папку Work, Ctrl+клацни два дублі «залишити» й натисни синю кнопку Add. Ти бачиш їх як стрічки одну за одною (кожна приносить і стрічку звуку: виділи їх і натисни X, якщо хочеш тиші). Перевір, що Frame Rate на вкладці Output досі показує 30; якщо змінилося, поверни."}, {"en": "Move the playhead after the takes, press Shift+A > Image/Sequence, open reveal_frames, press A to select every frame and click Add. You should see one strip for the whole render, 8 to 12 seconds long.", "uk": "Постав курсор відтворення після дублів, натисни Shift+A > Image/Sequence, відкрий reveal_frames, натисни A, щоб виділити всі кадри, і натисни Add. Ти бачиш одну стрічку на весь рендер, завдовжки 8–12 секунд."}, {"en": "Play with Space. Put the playhead on a weak moment, select the strip and press K to split it; select the piece you don't want and press X; put the playhead in the gap and press Backspace to close it. You should see the timeline get shorter.", "uk": "Відтвори через Space. Постав курсор відтворення на слабкий момент, виділи стрічку й натисни K, щоб розрізати її; виділи непотрібний шматок і натисни X; постав курсор у проміжок і натисни Backspace, щоб закрити його. Ти бачиш, як таймлайн стає коротшим."}, {"en": "Put the playhead at the start and press Shift+A > Text. In the Properties editor's Strip tab, type your island's name and the real place in the Text box and set Size; drag the strip's right end to 3 seconds (frame 90). You should see the title over the opening shot.", "uk": "Постав курсор відтворення на початок і натисни Shift+A > Text. На вкладці Strip у редакторі Properties введи в поле Text назву свого острова й справжнє місце та задай Size; перетягни правий кінець стрічки на 3 секунди (кадр 90). Ти бачиш титр поверх початкового кадру."}, {"en": "In the Output tab set the Frame Range End to your last frame. Under Output click the folder icon, choose today's Work folder and type island_flight; set Media Type to Video, Container MPEG-4 and Video Codec H.264. You should see the video settings. If your screen looks different, send the tutor a screenshot.", "uk": "На вкладці Output постав Frame Range End на свій останній кадр. У розділі Output натисни іконку папки, обери сьогоднішню папку Work і введи island_flight; постав Media Type на Video, Container на MPEG-4 і Video Codec на H.264. Ти бачиш налаштування відео. Якщо твій екран виглядає інакше, надішли тьюторові скриншот."}, {"en": "Choose Render > Render Animation (Ctrl+F12) and wait. Blender adds frame numbers to the name (for example island_flight0001-0450.mp4), so rename it island_flight.mp4. You should see a video that plays in the Windows player.", "uk": "Обери Render > Render Animation (Ctrl+F12) і зачекай. Blender додає до назви номери кадрів (наприклад, island_flight0001-0450.mp4), тож перейменуй файл на island_flight.mp4. Ти бачиш відео, яке відтворюється у програвачі Windows."}], "play": {"en": "Trailer test: I describe my first 5 seconds and my last shot; the tutor says whether it would keep watching and remember the place; I rework them until it says yes to both.", "uk": "Тест трейлера: я описую свої перші 5 секунд і останній кадр; тьютор каже, чи дивився б він далі й чи запам'ятав би місце; я переробляю їх, доки він не скаже «так» на обидва запитання."}, "video": {"search": "blender video editing beginner tutorial cut export mp4"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Cutting the 2-minute video in Blender's Video Editing workspace (Day 58, lesson 4 of 4).\nToday's build: island_flight.mp4: a 1:50 to 2:10 scenic flight through both districts, cut in Blender's Video Editing workspace from 2 or 3 takes of every beat and one Sequencer shot rendered with Movie Render Queue, with title and end cards.\nEarlier today I already did: lesson 1 (Takes: flying each beat cleanly); lesson 2 (One cinematic shot with Sequencer); lesson 3 (Rendering with Movie Render Queue (micro-lesson)). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Set up a video project in Blender: File > New > Video Editing, at 1920 x 1080 and 30 frames a second (fps), the same as your takes and your render.\n2. Explain strips and cuts: every clip on the timeline (the Sequencer) is a strip, and a cut is the join between two strips. Cut on movement, keep shots under about 15 seconds, and put your strongest shots first and last.\n3. Add the takes as Movie strips, the render as one Image Sequence strip and a title as a Text strip.\n4. Render a video file: Media Type Video, Container MPEG-4 (the file type, .mp4) and Video Codec H.264 (how the pictures are packed inside it), the common format every player opens.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Trailer test: I describe my first 5 seconds and my last shot; the tutor says whether it would keep watching and remember the place; I rework them until it says yes to both.\n4. Do-along on today's build (the recording set-up and the first takes): guide me through these steps one at a time, checking a screenshot after each:\n   - Open Blender and choose File > New > Video Editing; save at once as island_flight.blend in today's Work folder. You should see a preview at the top and an empty timeline at the bottom.\n   - In the Properties editor click the Output tab (the printer icon). Under Format set Resolution X 1920, Y 1080, 100 %, and Frame Rate 30. You should see 1920 x 1080 and 30 fps.\n   - Hover over the timeline, press Shift+A > Movie, open today's Work folder, Ctrl+click two 'keep' takes and click the blue Add button. You should see them as strips one after the other (each brings a sound strip too: select those and press X if you want silence). Check that Frame Rate in the Output tab still says 30; set it back if it changed.\n   - Move the playhead after the takes, press Shift+A > Image/Sequence, open reveal_frames, press A to select every frame and click Add. You should see one strip for the whole render, 8 to 12 seconds long.\n   - Play with Space. Put the playhead on a weak moment, select the strip and press K to split it; select the piece you don't want and press X; put the playhead in the gap and press Backspace to close it. You should see the timeline get shorter.\n   - Put the playhead at the start and press Shift+A > Text. In the Properties editor's Strip tab, type your island's name and the real place in the Text box and set Size; drag the strip's right end to 3 seconds (frame 90). You should see the title over the opening shot.\n   - In the Output tab set the Frame Range End to your last frame. Under Output click the folder icon, choose today's Work folder and type island_flight; set Media Type to Video, Container MPEG-4 and Video Codec H.264. You should see the video settings. If your screen looks different, send the tutor a screenshot.\n   - Choose Render > Render Animation (Ctrl+F12) and wait. Blender adds frame numbers to the name (for example island_flight0001-0450.mp4), so rename it island_flight.mp4. You should see a video that plays in the Windows player.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "takes.md (every take with its beat, faults and keep or not; the final faults with their times)", "uk": "takes.md (кожен дубль з його бітом, вадами й позначкою «залишити» чи ні; фінальні вади з їхнім часом)"}, {"en": "ls_reveal_timeline.png (a screenshot of the Sequencer timeline in Unreal) and the first and last JPG frames of the render", "uk": "ls_reveal_timeline.png (скриншот таймлайну Sequencer в Unreal) і перший та останній кадри JPG рендеру"}, {"en": "island_flight.mp4 (1:50 to 2:10, 1920 x 1080, H.264)", "uk": "island_flight.mp4 (від 1:50 до 2:10, 1920 x 1080, H.264)"}, {"en": "island_flight.blend (your Blender cut)", "uk": "island_flight.blend (твій монтаж у Blender)"}, {"en": "credits.md (with a line for any music)", "uk": "credits.md (з рядком для музики, якщо вона є)"}, {"en": "before_after_day58.png (a frame from your Day 57 practice run beside the same moment in the cut)", "uk": "before_after_day58.png (кадр із твого тренувального прольоту Дня 57 поруч із тим самим моментом у монтажі)"}, {"en": "flythrough_day58.mp4 (the first 60 seconds of island_flight.mp4)", "uk": "flythrough_day58.mp4 (перші 60 секунд island_flight.mp4)"}, {"en": "summary.md", "uk": "summary.md"}], "goal": {"en": "By the end of today you have island_flight.mp4: about 2 minutes at 1920 x 1080 through both districts, cut in Blender from your best flight takes and one rendered cinematic shot, with a title and an end card.", "uk": "До кінця дня ти маєш island_flight.mp4: приблизно 2 хвилини при 1920 x 1080 крізь обидва райони, змонтовані в Blender з найкращих дублів прольоту й одного відрендереного кінематографічного кадру, з титром і фінальною заставкою."}, "uses": [{"en": "Day 57: flight_plan.md, RT_Scenic with its gates, CAM_Beat_1 to CAM_Beat_N, and your music choice (or 'no music')", "uk": "День 57: flight_plan.md, RT_Scenic з воротами, від CAM_Beat_1 до CAM_Beat_N і твій вибір музики (або «без музики»)"}, {"en": "Day 52: the flight exposure in island_light_recipe.md", "uk": "День 52: експозиція для прольоту в island_light_recipe.md"}, {"en": "Day 56: the budget proof (the flight runs smoothly)", "uk": "День 56: доказ бюджету (проліт іде плавно)"}, {"en": "Day 21: credits.md", "uk": "День 21: credits.md"}, {"en": "Day 0: Blender, which you already have (no new install today)", "uk": "День 0: Blender, який у тебе вже є (сьогодні нічого нового не встановлюємо)"}], "quiz": [{"q": {"en": "What is a keyframe in Sequencer?", "uk": "Що таке ключовий кадр у Sequencer?"}, "options": [{"en": "A saved position at one moment; the camera moves smoothly between keyframes", "uk": "Збережене положення в певну мить; камера плавно рухається між ключовими кадрами"}, {"en": "The first frame of every video", "uk": "Перший кадр кожного відео"}, {"en": "A frame the graphics card renders twice", "uk": "Кадр, який відеокарта рендерить двічі"}], "answer": 0, "explain": {"en": "You set keyframes at the start and the end; Sequencer fills in the movement between them.", "uk": "Ти ставиш ключові кадри на початку й у кінці; Sequencer заповнює рух між ними."}}, {"q": {"en": "Your recorded take stutters in two places, but the Movie Render Queue shot of the same move is smooth. Why?", "uk": "Твій записаний дубль підвисає у двох місцях, а кадр того самого руху з Movie Render Queue плавний. Чому?"}, "options": [{"en": "The Windows recorder adds stutter on purpose", "uk": "Записувач Windows навмисно додає підвисання"}, {"en": "JPG files are always smoother", "uk": "Файли JPG завжди плавніші"}, {"en": "Movie Render Queue renders each frame however long it takes; a live recording drops frames when the PC is busy", "uk": "Movie Render Queue рендерить кожен кадр стільки, скільки треба; живий запис пропускає кадри, коли ПК зайнятий"}], "answer": 2, "explain": {"en": "A render doesn't run in real time, so no frame is ever dropped.", "uk": "Рендер не йде в реальному часі, тож жоден кадр не пропадає."}}, {"q": {"en": "Why do you add Engine Warm Up frames before rendering?", "uk": "Навіщо додавати кадри Engine Warm Up перед рендером?"}, "options": [{"en": "To make the render shorter", "uk": "Щоб рендер був коротшим"}, {"en": "So World Partition loads the world round the camera before the first saved frame", "uk": "Щоб World Partition завантажив світ навколо камери до першого збереженого кадру"}, {"en": "To add motion blur", "uk": "Щоб додати розмиття в русі"}], "answer": 1, "explain": {"en": "Without warm-up frames, the first frames can show missing or blurry land that is still loading.", "uk": "Без кадрів прогріву перші кадри можуть показувати відсутню чи розмиту землю, яка ще завантажується."}}, {"q": {"en": "Your cut is 3:40 long, and the island first appears after 50 seconds. What do you change?", "uk": "Твій монтаж триває 3:40, а острів уперше з'являється через 50 секунд. Що ти змінюєш?"}, "options": [{"en": "Speed the whole video up to double speed", "uk": "Прискорюю все відео вдвічі"}, {"en": "Add a longer title", "uk": "Додаю довший титр"}, {"en": "Add more music", "uk": "Додаю більше музики"}, {"en": "Open with the reveal, keep shots under about 15 seconds, and cut weak beats until it's about 2 minutes", "uk": "Починаю з розкриття, тримаю кадри коротшими приблизно за 15 секунд і вирізаю слабкі біти, доки не вийде приблизно 2 хвилини"}], "answer": 3, "explain": {"en": "Viewers decide in the first seconds. Lead with your strongest shot and keep the rhythm tight.", "uk": "Глядачі вирішують у перші секунди. Починай із найсильнішого кадру й тримай щільний ритм."}}, {"q": {"en": "In Blender, your 10-second render strip (300 JPG frames) plays in only 5 seconds. What is wrong?", "uk": "У Blender твоя 10-секундна стрічка рендеру (300 кадрів JPG) відтворюється лише 5 секунд. Що не так?"}, "options": [{"en": "The JPG files are too small", "uk": "Файли JPG замалі"}, {"en": "The scene's Frame Rate is 60, not 30: each picture is one frame, so set Frame Rate back to 30 in the Output tab", "uk": "Frame Rate сцени — 60, а не 30: кожна картинка — це один кадр, тож поверни Frame Rate на 30 на вкладці Output"}, {"en": "Blender can't read image sequences", "uk": "Blender не вміє читати послідовності зображень"}, {"en": "The render needs more warm-up frames", "uk": "Рендеру потрібно більше кадрів прогріву"}], "answer": 1, "explain": {"en": "An image sequence has no speed of its own: Blender shows one picture per frame at the scene's frame rate. 300 frames at 30 fps last 10 seconds.", "uk": "Послідовність зображень не має власної швидкості: Blender показує одну картинку на кадр із частотою кадрів сцени. 300 кадрів при 30 fps тривають 10 секунд."}}], "weekInfo": {"week": 12, "title": {"en": "The whole island, polished, flown and presented", "uk": "Увесь острів: шліфування, проліт і презентація"}, "goal": {"en": "By Friday you have the finished island: a budget proof at 1920 x 1080, a 2-minute scenic flight video through both districts, a hand-over pack with correct credits, and a portfolio ready for ArtStation with a CV skills list.", "uk": "До п'ятниці ти маєш готовий острів: доказ, що він вкладається в бюджет при 1920 x 1080, 2-хвилинне відео мальовничого прольоту крізь обидва райони, пакет для передачі з правильними кредитами (credits) і портфоліо, готове для ArtStation, зі списком навичок для резюме."}, "skills": [{"en": "Performance profiling with stat gpu and CSV captures to a 60 fps budget", "uk": "Профілювання продуктивності за допомогою stat gpu і CSV-записів під бюджет 60 fps"}, {"en": "Cull distances and HLODs for large World Partition worlds", "uk": "Відстані відсікання (cull distances) і HLOD для великих світів World Partition"}, {"en": "Cinematic flythroughs with Sequencer and Movie Render Queue, cut and encoded (H.264) in Blender's Video Sequencer", "uk": "Кінематографічні прольоти в Sequencer і Movie Render Queue, змонтовані й закодовані (H.264) у Video Sequencer у Blender"}, {"en": "Portfolio presentation: hero shots, breakdowns and before/after pairs", "uk": "Презентація портфоліо: головні кадри (hero shots), розбори (breakdowns) і пари «до/після»"}, {"en": "Production hand-over: documentation, dependency checks and licence-correct credits", "uk": "Передача проєкту: документація, перевірка залежностей і кредити з дотриманням ліцензій"}]}, "morning": {"sofar": {"en": "Your island has a planned scenic flight, with gates and a locked camera at every beat.", "uk": "Твій острів має спланований мальовничий політ із воротами й зафіксованою камерою в кожному епізоді."}, "today": {"en": "You fly clean takes of each beat, render one cinematic shot, and cut a 2-minute video in Blender with a title and an end card.", "uk": "Сьогодні ти пролітаєш чисті дублі кожного епізоду, рендериш один кінематографічний кадр і монтуєш у Blender 2-хвилинне відео з титулом і фінальною карткою."}, "cheer": {"en": "A first cut is never the last one, so put it together, watch it with fresh eyes, and trim; tomorrow is there for a final polish.", "uk": "Перший монтаж ніколи не буває останнім, тож збери його, подивись свіжим поглядом і підріж; завтра ще буде час на фінальний глянець."}, "quote": {"text": {"en": "If you want a happy ending, that depends, of course, on where you stop your story.", "uk": "Якщо хочеш щасливого кінця, усе, звісно, залежить від того, де ти зупиниш свою історію."}, "author": {"en": "Orson Welles", "uk": "Орсон Веллс"}, "source": "https://en.wikiquote.org/wiki/Orson_Welles"}}, "hasAssets": false, "workPath": "Work\\Assignment\\Day-58-flight-takes-and-video-cut", "mapHref": "../../COURSE.html", "prevHref": "../Day-57-scenic-flight-route-gates/START-HERE.html", "nextHref": "../Day-59-final-shots-handover-credits/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8 and Blender (Video Editing workspace). I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me and don't write code. Keep me moving and make it feel like a game.\n\nToday I build on my own: All the takes, the cinematic shot and the cut, on your own.\nIt's part of: island_flight.mp4: a 1:50 to 2:10 scenic flight through both districts, cut in Blender's Video Editing workspace from 2 or 3 takes of every beat and one Sequencer shot rendered with Movie Render Queue, with title and end cards (L_Island along RT_Scenic, flown beat by beat; the cut made in Blender's Video Editing workspace and saved in today's Work folder.).\n\nSpec:\n- Recording set up: Windows captures at 30 frames a second and High quality (Settings > Gaming > Captures), the flight exposure from island_light_recipe.md, DL_Routes shown or hidden (your choice, the same for every take).\n- 2 or 3 takes of every beat, logged in takes.md (beat, take, faults, keep or not).\n- One cinematic shot (the opening reveal or the finale) made in Sequencer: a Level Sequence with a Cine Camera and two or three keyframes, 8 to 12 seconds long, rendered at 1920 x 1080 with Movie Render Queue as a .jpg image sequence, and the frames moved into reveal_frames in today's Work folder.\n- The cut in Blender (File > New > Video Editing) at 30 frames a second and 1920 x 1080: the 'keep' takes as Movie strips and the render as one Image Sequence strip, the best take of each beat in order, no shot longer than about 15 seconds, cuts on movement. A 3-second title (a Text strip) shows your island's name and the real place it's based on; a 4-second end card shows your name and 'Credits: see credits.md'.\n- Music only if its licence allows use in a video (your Day 57 choice), as a Sound strip, with the track, its author and its licence in credits.md; no music is fine.\n- island_flight.mp4 rendered from Blender (Media Type Video, Container MPEG-4, Video Codec H.264, Audio Codec AAC if there is music), 1920 x 1080, 1:50 to 2:10 long, and watched full screen once with every fault noted.\n\nMy checklist:\n1. Set up recording: Windows captures at 30 fps and High quality, the flight exposure on, the regions along the route loaded, the editor maximised. Check: a 5-second test recording plays back sharp and smooth. (from lesson 1)\n2. Record 2 or 3 takes of beats 1 to 3 and log each one in takes.md. Check: every take has a line with its faults and keep or not. (from lesson 1)\n3. Record takes of beats 4 to 6. Check: each beat has at least one take with no clipping, no pop and a level horizon. (from lesson 1)\n4. Record takes of the remaining beats and move all the takes into today's Work folder. Check: every beat in flight_plan.md has a 'keep' take. (from lesson 1)\n5. Make LS_Reveal (or LS_Finale): a Level Sequence with a Cine Camera and a start key and an end key, 8 to 12 seconds apart. Check: pressing Play in Sequencer shows the move through the camera. (from lesson 2)\n6. Smooth the move: a level horizon, a gentle start and stop, nothing the camera passes through. Check: played back, the move has no jerk. (from lesson 2)\n7. Render the shot with Movie Render Queue at 1920 x 1080 as a .jpg sequence, with warm-up frames, and move the frames into a new folder reveal_frames in today's Work folder. Check: reveal_frames holds 240 to 360 numbered JPG files. (from lesson 3)\n8. In Blender choose File > New > Video Editing, save island_flight.blend in today's Work folder, and set the Output tab's Format to 1920 x 1080, 100 % and Frame Rate 30. Check: the Output tab shows 1920 x 1080 and 30 fps. (from lesson 4)\n9. Rough cut: add the 'keep' takes (Shift+A > Movie) and reveal_frames (Shift+A > Image/Sequence), and drag the strips into beat order. Check: Frame Rate still says 30, the render is one strip, and the timeline runs every beat (about 2:30 to 3:00). (from lesson 4)\n10. Fine cut: split with K, delete with X, close each gap with Backspace; trim to 1:50 to 2:10, cut on movement, no shot over about 15 seconds. Check: your strongest shots are in the first 5 seconds and at the very end. (from lesson 4)\n11. Add the 3-second title (Shift+A > Text) and the 4-second end card (Shift+A > Color, set to black in the Strip tab, with a Text strip in the channel above it); add your music only if its licence allows it (Shift+A > Sound) and credit it. Check: both cards read in 3 seconds, and credits.md has a line for any music. (from lesson 4)\n12. Set the Frame Range End to the end card's last frame, set Media Type Video, Container MPEG-4 and Video Codec H.264 (Audio Codec AAC if you have music), choose Render > Render Animation, and rename the file island_flight.mp4. Check: it plays in the Windows player at 1920 x 1080 and is 1:50 to 2:10 long. (from lesson 4)\n13. Watch it full screen once, note every fault with its time in takes.md, and fix the worst one. Save today's clip as flythrough_day58.mp4 and check that you also have ls_reveal_timeline.png and before_after_day58.png (each is described in today's hand-in list; take any you are missing now). Check: no clipping, pop or stutter you can see; the first 60 seconds is today's clip. (from lesson 1)\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Elina\nDay 58: Flight takes, one cinematic shot, and the 2-minute video cut. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

<script id="data" type="application/json">{"learner": "ib-elina-19bc2172", "learnerName": {"en": "Elina", "uk": "Еліна"}, "day": 26, "week": 6, "total": 60, "title": {"en": "L_Island: your terrain from a real heightmap", "uk": "L_Island: твій рельєф із реальної карти висот"}, "theme": {"en": "Week 6: Terrain and water", "uk": "Тиждень 6: Рельєф і вода"}, "build": {"item": {"en": "L_Island with your island's landscape: island_height_r1.png (16-bit, 2017 x 2017 px) imported at 1 m per vertex and calibrated to your map's summit and coast", "uk": "L_Island із ландшафтом твого острова: island_height_r1.png (16-бітний, 2017 x 2017 px), імпортований із кроком 1 м на вершину сітки і відкалібрований за вершиною і узбережжям на твоїй мапі"}, "why": {"en": "Real terrain carries the logic of water and rock: valleys drain to the sea and ridges branch. Starting from a real heightmap and moving it to your map gives believable hills in an afternoon, where sculpting from flat takes days and still looks like dough. Getting the scale right today means every road, house and flight later sits on the right ground, which is why studios check the numbers before anyone sculpts.", "uk": "Справжній рельєф несе логіку води і каменю: долини стікають до моря, а хребти розгалужуються. Якщо почати з реальної карти висот і підігнати її під свою мапу, правдоподібні пагорби з'являються за один день, тоді як ліплення з пласкої поверхні забирає дні і все одно виглядає як тісто. Правильний масштаб сьогодні означає, що кожна дорога, будинок і політ згодом стоятимуть на правильній землі, тому студії перевіряють числа, перш ніж хтось почне ліпити."}, "where": {"en": "IslandCourse: a new Empty Open World level saved as Content/Island/Maps/L_Island, holding one landscape of 2017 x 2017 vertices at 1 m spacing (2,016 m square) centred on (0, 0), with sea level at Z = 0 and the sea floor near -40 m at the edges.", "uk": "IslandCourse: новий рівень Empty Open World, збережений як Content/Island/Maps/L_Island, з одним ландшафтом 2017 x 2017 вершин сітки з кроком 1 м (квадрат 2 016 м) із центром у (0, 0), рівнем моря на Z = 0 і дном моря близько -40 м по краях."}, "spec": [{"en": "island_height_r1.png: a 16-bit greyscale PNG, 2017 x 2017 px, made from real terrain (your place, or a real coast like it) and reshaped over island_map.png so the coast and the summit sit where the map says; island_height_r1.kra kept.", "uk": "island_height_r1.png: 16-бітний PNG у відтінках сірого, 2017 x 2017 px, зроблений із реального рельєфу (твого місця або схожого реального узбережжя) і перероблений поверх island_map.png так, щоб узбережжя і вершина були там, де каже мапа; island_height_r1.kra збережено."}, {"en": "Pure black is -40 m (the sea floor at the edges) and pure white is your summit; the Z scale and the landscape's Location Z worked out from those two numbers and written in terrain_notes.md.", "uk": "Чистий чорний — це -40 м (дно моря по краях), а чистий білий — твоя вершина; масштаб Z і Location Z ландшафту обчислено з цих двох чисел і записано в terrain_notes.md."}, {"en": "L_Island made with File > New Level > Empty Open World and saved as Content/Island/Maps/L_Island.", "uk": "L_Island створено через File > New Level > Empty Open World і збережено як Content/Island/Maps/L_Island."}, {"en": "The landscape imported with Landscape mode > Manage > New > Import from File (edit layers are always on in 5.8, so there is no box to tick): Location X 0 and Y 0, Z from your notes, Scale X 100, Y 100 and Z from your notes.", "uk": "Ландшафт імпортовано через Landscape mode > Manage > New > Import from File (у 5.8 шари редагування увімкнені завжди, тож позначки ставити не треба): Location X 0 і Y 0, Z із твоїх нотаток, Scale X 100, Y 100 і Z із твоїх нотаток."}, {"en": "Light from Window > Env. Light Mixer, and Engine Scalability at High (not Epic) to spare your memory.", "uk": "Освітлення з Window > Env. Light Mixer, а Engine Scalability на High (не Epic), щоб зберегти пам'ять."}, {"en": "Checked: the summit within 5 m of your map's height (a 1 m cube on top, its Z read in Details), and the coast within about 20 m of the map in a Top view, with a large flat plane at Z = 0 standing in for the sea.", "uk": "Перевірено: вершина в межах 5 м від висоти на твоїй мапі (куб 1 м нагорі, його Z прочитано в Details), а узбережжя в межах приблизно 20 м від мапи у вигляді Top, де велика пласка площина на Z = 0 замінює море."}], "piece1": "the heightmap, reshaped in Krita (shared with the lessons)", "piece2": {"en": "L_Island, the import and the calibration, on your own", "uk": "L_Island, імпорт і калібрування, самостійно"}, "steps": [{"text": {"en": "Export real_height.png (2017 x 2017, PNG - 16 Bit, Norm. Mode Smart) of your real place, add its credits.md line, and check it in Krita. Check: the status bar (or Image > Properties) shows Grayscale and 16-bit, and the land is lighter than the sea.", "uk": "Експортуй real_height.png (2017 x 2017, PNG - 16 Bit, Norm. Mode Smart) свого реального місця, додай його рядок у credits.md і перевір його в Krita. Перевірка: рядок стану (або Image > Properties) показує Grayscale і 16-bit, а суша світліша за море."}, "lesson": 1}, {"text": {"en": "Work out your Z scale and Location Z and write them in terrain_notes.md. Check: for a 260 m summit you'd get 58.6 and 11000 cm; your own numbers follow the same sum.", "uk": "Обчисли свій масштаб Z і Location Z і запиши їх у terrain_notes.md. Перевірка: для вершини 260 м виходить 58,6 і 11000 cm; твої власні числа рахуються так само."}, "lesson": 1}, {"text": {"en": "Resize a copy of your map's canvas to 2017 x 2017 (anchored in the centre) and paste it at 40 % over the terrain in island_height_r1.kra. Check: 1 px is still 1 m, and you can see both the map and the terrain.", "uk": "Зміни розмір полотна копії своєї мапи до 2017 x 2017 (з прив'язкою по центру) і встав її з непрозорістю 40 % поверх рельєфу в island_height_r1.kra. Перевірка: 1 px — це досі 1 м, і ти бачиш і мапу, і рельєф."}, "lesson": 2}, {"text": {"en": "Move, turn and scale the terrain (Ctrl+T) so its land sits under your map's land; fill any empty edge with black on a bottom layer. Check: the real hills sit inside your coast.", "uk": "Пересунь, поверни і масштабуй рельєф (Ctrl+T) так, щоб його суша лежала під сушею твоєї мапи; заповни порожні краї чорним на нижньому шарі. Перевірка: реальні пагорби лежать усередині твого узбережжя."}, "lesson": 2}, {"text": {"en": "Paint the land to the map: sea out with dark grey, missing land in with lighter greys, the summit where the map puts it. Check: with the map layer shown, the grey coast follows the map's coast all round.", "uk": "Підмалюй сушу під мапу: море — темно-сірим, суша, якої бракує, — світлішими сірими, вершина там, де її ставить мапа. Перевірка: коли шар мапи видно, сіре узбережжя всюди йде за узбережжям мапи."}, "lesson": 2}, {"text": {"en": "Blur 3 px, stretch with Levels, and export island_height_r1.png (16-bit, no alpha, map layer hidden). Check: the deepest sea is pure black, the summit pure white, and the file reopens in Krita as 2017 x 2017, Grayscale, 16-bit.", "uk": "Розмий на 3 px, розтягни через Levels і експортуй island_height_r1.png (16-бітний, без альфа-каналу, шар мапи приховано). Перевірка: найглибше море чисто чорне, вершина чисто біла, а файл знову відкривається в Krita як 2017 x 2017, Grayscale, 16-bit."}, "lesson": 2}, {"text": {"en": "Create L_Island (Empty Open World) and save it in Content/Island/Maps. Check: L_Island shows in the Content Browser and in the editor's title bar.", "uk": "Створи L_Island (Empty Open World) і збережи його в Content/Island/Maps. Перевірка: L_Island видно в Content Browser і в заголовку вікна редактора."}, "lesson": 3}, {"text": {"en": "Import the landscape with your numbers (edit layers are always on in 5.8). Check: the island appears; its Details show Location Z your number and Scale 100, 100, your Z scale, saved as landscape_details.png (Location X and Y may read about -100800 instead of 0: Unreal stores the landscape's corner, and its centre sits on the 0, 0 you typed).", "uk": "Імпортуй ландшафт зі своїми числами (у 5.8 шари редагування увімкнені завжди). Перевірка: острів з'являється; його Details показують Location Z твоє число і Scale 100, 100, твій масштаб Z, збережено як landscape_details.png (Location X і Y можуть показувати близько -100800 замість 0: Unreal зберігає кут ландшафту, а його центр стоїть на введених тобою 0, 0)."}, "lesson": 3}, {"text": {"en": "Light it with Env. Light Mixer and set Engine Scalability to High. Check: sky, sun and haze are in, and the editor runs smoothly.", "uk": "Освітли сцену через Env. Light Mixer і встанови Engine Scalability на High. Перевірка: є небо, сонце й серпанок, а редактор працює плавно."}, "lesson": 3}, {"text": {"en": "Summit check with a 1 m cube; fix Scale Z if it's more than 5 m out, and note the final number. Check: terrain_notes.md has the summit check with both heights.", "uk": "Перевірка вершини кубом 1 м; виправ Scale Z, якщо розбіжність понад 5 м, і запиши остаточне число. Перевірка: у terrain_notes.md є перевірка вершини з обома висотами."}, "lesson": 4}, {"text": {"en": "Coast check with the Z = 0 plane in a Top view against your map; fix Location Z in 1 m steps. Check: coast_check.png shows the two coasts within about 20 m.", "uk": "Перевірка узбережжя площиною на Z = 0 у вигляді Top порівняно з твоєю мапою; виправ Location Z кроками по 1 м. Перевірка: coast_check.png показує, що два узбережжя розходяться не більше ніж на 20 м."}, "lesson": 4}, {"text": {"en": "Fly CAM_Survey round the island at about 150 m and record 60 seconds (Win+Alt+R); make before_after_day26.png from real_height.png beside island_height_r1.png. Save today's clip as flythrough_day26.mp4. Check: the clip shows the whole coast and both district areas.", "uk": "Пролети CAM_Survey навколо острова на висоті близько 150 м і запиши 60 секунд (Win+Alt+R); зроби before_after_day26.png із real_height.png поруч з island_height_r1.png. Збережи сьогоднішній запис як flythrough_day26.mp4. Перевірка: запис показує все узбережжя і ділянки обох районів."}, "lesson": 4}], "assets": []}, "lessons": [{"title": {"en": "Heightmaps: 16 bits, landscape sizes and Z scale", "uk": "Карти висот: 16 біт, розміри ландшафту і масштаб Z"}, "minutes": 40, "goals": [{"en": "Explain a heightmap: a greyscale picture where each pixel's brightness is a height, black lowest and white highest. Unreal turns it into a landscape, its big ground surface, made of a grid of points called vertices.", "uk": "Пояснити, що таке карта висот: зображення у відтінках сірого, де яскравість кожного пікселя — це висота, чорне найнижче, біле найвище. Unreal перетворює її на ландшафт, свою велику поверхню землі, зроблену із сітки точок, які називаються вершинами."}, {"en": "Explain why 16 bits: a 16-bit picture has 65,536 grey steps, an 8-bit one only 256, which shows as terraces (steps like stairs; on a 300 m range, one every 1.2 m).", "uk": "Пояснити, чому 16 біт: 16-бітне зображення має 65 536 ступенів сірого, а 8-бітне лише 256, і це видно як тераси (сходинки, як на сходах; на перепаді 300 м — одна кожні 1,2 м)."}, {"en": "Pick a landscape size: 2017 x 2017 vertices, 1 m apart, make 2,016 m, enough for a 1 km island in its own sea.", "uk": "Вибрати розмір ландшафту: 2017 x 2017 вершин із кроком 1 м дають 2 016 м, достатньо для острова 1 км у власному морі."}, {"en": "Work out the two import numbers. Z scale is how much Unreal stretches the greys into heights: at 100, pure black to pure white is 512 m, so Z scale = height range in metres x 0.1953125. Location Z is the height where Unreal puts the middle grey, so it is the middle of your range.", "uk": "Обчислити два числа для імпорту. Масштаб Z — це наскільки Unreal розтягує сірі тони у висоти: при 100 від чистого чорного до чистого білого 512 м, тож масштаб Z = перепад висот у метрах x 0,1953125. Location Z — це висота, на яку Unreal ставить середній сірий, тобто середина твого перепаду."}], "doalong": [{"en": "Open https://manticorp.github.io/unrealheightmap/ (Manticorp's free heightmap generator: it turns real terrain data into a 16-bit picture, with no account). In OpenStreetMap, find your place; the address bar ends in #map= and three numbers split by slashes: the zoom, then the latitude, then the longitude. Type them into the generator's Latitude and Longitude boxes. You should see an orange box on the map round your place.", "uk": "Відкрий https://manticorp.github.io/unrealheightmap/ (безкоштовний генератор карт висот від Manticorp: він перетворює реальні дані рельєфу на 16-бітне зображення, без облікового запису). В OpenStreetMap знайди своє місце; адресний рядок закінчується на #map= і три числа через скісні риски: масштаб, потім широта, потім довгота. Введи їх у поля Latitude і Longitude генератора. Ти маєш побачити помаранчеву рамку на мапі навколо твого місця."}, {"en": "Set Default Sizes to 2017 x 2017, Output Format to PNG - 16 Bit and Norm. Mode to Smart. Set Output Zoom to 16, or 17 if your place is under 1 km across: the line under Generate Heightmap shows the box's size (about 3.5 km at 16, about 1.7 km at 17), and the land should fill about half of it. Click Generate Heightmap and save the file as real_height.png in Day26. You should get a grey picture with dark sea and lighter land.", "uk": "Встанови Default Sizes на 2017 x 2017, Output Format на PNG - 16 Bit і Norm. Mode на Smart. Встанови Output Zoom на 16 або на 17, якщо твоє місце менше 1 км завширшки: рядок під Generate Heightmap показує розмір рамки (близько 3,5 км при 16, близько 1,7 км при 17), і суша має заповнювати приблизно половину її. Натисни Generate Heightmap і збережи файл як real_height.png у Day26. Ти маєш отримати сіре зображення з темним морем і світлішою сушею."}, {"en": "Add a line to credits.md: 'real_height.png: heightmap data © Mapzen, OpenStreetMap and others, https://www.mapzen.com/rights, made with manticorp.github.io/unrealheightmap'. You should see the credit beside your photos. If the site fails, try again later or ask the tutor; in the worst case you paint the whole height yourself in lesson 2, on a 2017 x 2017 Grayscale/Alpha 16-bit canvas.", "uk": "Додай рядок у credits.md: 'real_height.png: heightmap data © Mapzen, OpenStreetMap and others, https://www.mapzen.com/rights, made with manticorp.github.io/unrealheightmap'. Ти маєш побачити це авторство поруч зі своїми фото. Якщо сайт не працює, спробуй пізніше або запитай тьютора; у найгіршому разі ти власноруч намалюєш усю висоту в уроці 2, на полотні 2017 x 2017 Grayscale/Alpha 16-bit."}, {"en": "Open it in Krita and look at the colour space in the status bar at the bottom: it should mention Grayscale (or GRAYA) and 16-bit integer. If you can't find it, Image > Properties shows the same. If it says 8-bit, use Image > Convert Image Color Space: Grayscale/Alpha, 16-bit integer/channel. You should see 16-bit for your file.", "uk": "Відкрий його в Krita і подивися на колірний простір у рядку стану внизу: там має бути Grayscale (або GRAYA) і 16-bit integer. Якщо не знаходиш, Image > Properties показує те саме. Якщо там 8-bit, скористайся Image > Convert Image Color Space: Grayscale/Alpha, 16-bit integer/channel. Ти маєш побачити 16-bit для свого файлу."}, {"en": "Follow the worked example: at Z scale 100 a landscape holds 512 m of height, so Z scale = range ÷ 512 x 100 = range x 0.1953125. A sea floor of -40 m and a summit of 260 m give a range of 300 m, a Z scale of 300 x 0.1953125 = 58.6, and a Location Z of (260 + (-40)) ÷ 2 = 110 m, typed as 11000 cm. You should be able to repeat each step.", "uk": "Пройди розібраний приклад: при масштабі Z 100 ландшафт вміщає 512 м висоти, тож масштаб Z = перепад ÷ 512 x 100 = перепад x 0,1953125. Дно моря -40 м і вершина 260 м дають перепад 300 м, масштаб Z 300 x 0,1953125 = 58,6 і Location Z (260 + (-40)) ÷ 2 = 110 м, що вводиться як 11000 cm. Ти маєш змогу повторити кожен крок."}, {"en": "Do the same with your own summit from map_notes.md and write both numbers in a new file, terrain_notes.md. You should have two numbers ready for the import.", "uk": "Зроби те саме для своєї вершини з map_notes.md і запиши обидва числа в новий файл terrain_notes.md. У тебе мають бути два числа, готові для імпорту."}], "play": {"en": "Number duel: the tutor gives me three islands (summits of 140 m, 380 m and 50 m, each with a sea floor at -40 m); I give the Z scale and Location Z for each before it does.", "uk": "Дуель чисел: тьютор дає мені три острови (вершини 140 м, 380 м і 50 м, у кожного дно моря на -40 м); я називаю масштаб Z і Location Z для кожного раніше за нього."}, "video": {"url": "https://www.youtube.com/watch?v=u7u6Lam-p5k", "title": "How to Create & Import 16-bit Heightmaps for Unreal Engine 5.7 (Step-by-Step)", "channel": "Unreal Fusion", "length": "5:52", "search": "unreal engine 5 16-bit heightmap import"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Heightmaps: 16 bits, landscape sizes and Z scale (Day 26, lesson 1 of 4).\nToday's build: L_Island with your island's landscape: island_height_r1.png (16-bit, 2017 x 2017 px) imported at 1 m per vertex and calibrated to your map's summit and coast.\n\nBy the end of this lesson I can:\n1. Explain a heightmap: a greyscale picture where each pixel's brightness is a height, black lowest and white highest. Unreal turns it into a landscape, its big ground surface, made of a grid of points called vertices.\n2. Explain why 16 bits: a 16-bit picture has 65,536 grey steps, an 8-bit one only 256, which shows as terraces (steps like stairs; on a 300 m range, one every 1.2 m).\n3. Pick a landscape size: 2017 x 2017 vertices, 1 m apart, make 2,016 m, enough for a 1 km island in its own sea.\n4. Work out the two import numbers. Z scale is how much Unreal stretches the greys into heights: at 100, pure black to pure white is 512 m, so Z scale = height range in metres x 0.1953125. Location Z is the height where Unreal puts the middle grey, so it is the middle of your range.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (In five weeks you have built and lit your own harbour kit and planned a whole island from a real place.), what I will learn today (You create L_Island, an Open World level, and import a 2 km landscape from a real heightmap, reshaped to your map.), encourage me (Today your island becomes real ground, so enjoy that first flight across it before you start checking heights.), and share today's quote: \"If you wish to make an apple pie from scratch, you must first invent the universe.\" (Carl Sagan).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 23: a bed is 12 x 6 m and the shrubs sit 1.5 m apart; about how many shrubs, and how did you work it out? | Day 21: what is your real place's highest point, and where did you find it?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Number duel: the tutor gives me three islands (summits of 140 m, 380 m and 50 m, each with a sea floor at -40 m); I give the Z scale and Location Z for each before it does.\n6. Do-along on today's build (the heightmap, reshaped in Krita (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Open https://manticorp.github.io/unrealheightmap/ (Manticorp's free heightmap generator: it turns real terrain data into a 16-bit picture, with no account). In OpenStreetMap, find your place; the address bar ends in #map= and three numbers split by slashes: the zoom, then the latitude, then the longitude. Type them into the generator's Latitude and Longitude boxes. You should see an orange box on the map round your place.\n   - Set Default Sizes to 2017 x 2017, Output Format to PNG - 16 Bit and Norm. Mode to Smart. Set Output Zoom to 16, or 17 if your place is under 1 km across: the line under Generate Heightmap shows the box's size (about 3.5 km at 16, about 1.7 km at 17), and the land should fill about half of it. Click Generate Heightmap and save the file as real_height.png in Day26. You should get a grey picture with dark sea and lighter land.\n   - Add a line to credits.md: 'real_height.png: heightmap data © Mapzen, OpenStreetMap and others, https://www.mapzen.com/rights, made with manticorp.github.io/unrealheightmap'. You should see the credit beside your photos. If the site fails, try again later or ask the tutor; in the worst case you paint the whole height yourself in lesson 2, on a 2017 x 2017 Grayscale/Alpha 16-bit canvas.\n   - Open it in Krita and look at the colour space in the status bar at the bottom: it should mention Grayscale (or GRAYA) and 16-bit integer. If you can't find it, Image > Properties shows the same. If it says 8-bit, use Image > Convert Image Color Space: Grayscale/Alpha, 16-bit integer/channel. You should see 16-bit for your file.\n   - Follow the worked example: at Z scale 100 a landscape holds 512 m of height, so Z scale = range ÷ 512 x 100 = range x 0.1953125. A sea floor of -40 m and a summit of 260 m give a range of 300 m, a Z scale of 300 x 0.1953125 = 58.6, and a Location Z of (260 + (-40)) ÷ 2 = 110 m, typed as 11000 cm. You should be able to repeat each step.\n   - Do the same with your own summit from map_notes.md and write both numbers in a new file, terrain_notes.md. You should have two numbers ready for the import.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"How to Create & Import 16-bit Heightmaps for Unreal Engine 5.7 (Step-by-Step)\" by Unreal Fusion: https://www.youtube.com/watch?v=u7u6Lam-p5k\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Reshaping a heightmap to your map in Krita", "uk": "Переробляємо карту висот під твою мапу в Krita"}, "minutes": 40, "goals": [{"en": "Lay your map over the heightmap at the same scale and push the land to fit: the coast, the summit, the valleys.", "uk": "Накласти свою мапу на карту висот у тому самому масштабі і підігнати сушу: узбережжя, вершину, долини."}, {"en": "Paint height with big soft brushes in greys (darker is lower), never hard edges, with the sea floor falling to pure black at the edges.", "uk": "Малювати висоту великими м'якими пензлями сірими тонами (темніше — нижче), ніколи жорсткими краями, а дно моря спадає до чистого чорного по краях."}, {"en": "Clean it: a Gaussian blur removes steps and lumps; Levels stretches the greys so pure black and pure white are both used.", "uk": "Почистити її: Gaussian blur прибирає сходинки і грудки; Levels розтягує сірі тони так, щоб використовувалися і чистий чорний, і чистий білий."}], "doalong": [{"en": "Open a copy of island_map.png in Krita. Image > Resize Canvas: 2017 x 2017 px, with the anchor in the centre. You should see a thin extra border; 1 px is still 1 m.", "uk": "Відкрий копію island_map.png у Krita. Image > Resize Canvas: 2017 x 2017 px, прив'язка по центру. Ти маєш побачити тонку додаткову рамку; 1 px — це досі 1 м."}, {"en": "Ctrl+A, Ctrl+C to copy the map; open real_height.png, Ctrl+V to paste it as a new layer on top, and set that layer's opacity to 40 %. Save as island_height_r1.kra. You should see your map's coast over the real terrain.", "uk": "Ctrl+A, Ctrl+C, щоб скопіювати мапу; відкрий real_height.png, Ctrl+V, щоб вставити її новим шаром згори, і встанови непрозорість цього шару на 40 %. Збережи як island_height_r1.kra. Ти маєш побачити узбережжя своєї мапи поверх реального рельєфу."}, {"en": "Select the terrain layer, press Ctrl+T, then move, turn and scale it until its land sits under your map's land. If an edge goes empty, add a layer at the bottom filled with pure black. You should see the real hills inside your coast.", "uk": "Вибери шар рельєфу, натисни Ctrl+T, потім пересувай, повертай і масштабуй його, доки його суша не ляже під сушу твоєї мапи. Якщо край стає порожнім, додай унизу шар, залитий чистим чорним. Ти маєш побачити реальні пагорби всередині свого узбережжя."}, {"en": "With a large soft brush in dark grey, paint out land that should be sea; with lighter greys, add land your map has and the terrain lacks; keep the brightest part where the map's summit is. This is a first rough pass; you finish it in the build. You should see the grey land follow the map's coast.", "uk": "Великим м'яким пензлем темно-сірого кольору зафарбуй сушу, яка має бути морем; світлішими сірими додай сушу, яка є на мапі, але якої бракує рельєфу; залиш найсвітлішу частину там, де вершина на мапі. Це перший грубий прохід; завершиш його в завданні. Ти маєш побачити, що сіра суша йде за узбережжям мапи."}, {"en": "Hide the map layer. Filter > Blur > Gaussian Blur, 3 px. Then Filter > Adjust > Levels: drag the black and white input markers to the ends of the histogram (the graph of greys). You should see the deepest sea pure black and the summit pure white.", "uk": "Сховай шар мапи. Filter > Blur > Gaussian Blur, 3 px. Потім Filter > Adjust > Levels: перетягни чорний і білий вхідні маркери до країв гістограми (графіка сірих тонів). Ти маєш побачити, що найглибше море чисто чорне, а вершина чисто біла."}, {"en": "File > Export as island_height_r1.png, with the map layer still hidden. In the PNG options untick Store alpha channel, and leave any option that converts to 8 bits unticked. You should get a 2017 x 2017 greyscale file.", "uk": "File > Export як island_height_r1.png, шар мапи досі прихований. У параметрах PNG зніми позначку Store alpha channel і не вмикай жодних параметрів, що перетворюють у 8 біт. Ти маєш отримати файл 2017 x 2017 у відтінках сірого."}], "play": {"en": "Fix the island: the tutor describes four faults in a heightmap (a hard painted cliff edge, a white spot in the sea, a valley that climbs towards the sea, terraces); I give the Krita fix for each.", "uk": "Виправ острів: тьютор описує чотири помилки в карті висот (жорсткий намальований край скелі, біла пляма в морі, долина, що піднімається до моря, тераси); я називаю, як виправити кожну в Krita."}, "video": {"url": "https://www.youtube.com/watch?v=F6K8GQED6ls", "title": "Real to Unreal: From Real World Height Maps to Unreal Engine 5", "channel": "NateDotFbx", "length": "1:03:59", "search": "real world heightmap to unreal engine 5"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Reshaping a heightmap to your map in Krita (Day 26, lesson 2 of 4).\nToday's build: L_Island with your island's landscape: island_height_r1.png (16-bit, 2017 x 2017 px) imported at 1 m per vertex and calibrated to your map's summit and coast.\nEarlier today I already did: lesson 1 (Heightmaps: 16 bits, landscape sizes and Z scale). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Lay your map over the heightmap at the same scale and push the land to fit: the coast, the summit, the valleys.\n2. Paint height with big soft brushes in greys (darker is lower), never hard edges, with the sea floor falling to pure black at the edges.\n3. Clean it: a Gaussian blur removes steps and lumps; Levels stretches the greys so pure black and pure white are both used.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Fix the island: the tutor describes four faults in a heightmap (a hard painted cliff edge, a white spot in the sea, a valley that climbs towards the sea, terraces); I give the Krita fix for each.\n4. Do-along on today's build (the heightmap, reshaped in Krita (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Open a copy of island_map.png in Krita. Image > Resize Canvas: 2017 x 2017 px, with the anchor in the centre. You should see a thin extra border; 1 px is still 1 m.\n   - Ctrl+A, Ctrl+C to copy the map; open real_height.png, Ctrl+V to paste it as a new layer on top, and set that layer's opacity to 40 %. Save as island_height_r1.kra. You should see your map's coast over the real terrain.\n   - Select the terrain layer, press Ctrl+T, then move, turn and scale it until its land sits under your map's land. If an edge goes empty, add a layer at the bottom filled with pure black. You should see the real hills inside your coast.\n   - With a large soft brush in dark grey, paint out land that should be sea; with lighter greys, add land your map has and the terrain lacks; keep the brightest part where the map's summit is. This is a first rough pass; you finish it in the build. You should see the grey land follow the map's coast.\n   - Hide the map layer. Filter > Blur > Gaussian Blur, 3 px. Then Filter > Adjust > Levels: drag the black and white input markers to the ends of the histogram (the graph of greys). You should see the deepest sea pure black and the summit pure white.\n   - File > Export as island_height_r1.png, with the map layer still hidden. In the PNG options untick Store alpha channel, and leave any option that converts to 8 bits unticked. You should get a 2017 x 2017 greyscale file.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Real to Unreal: From Real World Height Maps to Unreal Engine 5\" by NateDotFbx: https://www.youtube.com/watch?v=F6K8GQED6ls\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "L_Island: an Open World level and the landscape import", "uk": "L_Island: рівень Open World та імпорт ландшафту"}, "minutes": 40, "goals": [{"en": "Explain World Partition: Unreal's system for big worlds, which splits a level into cells (squares of ground) and loads only those near the camera. An Open World level uses it from the start; Day 33 goes deeper.", "uk": "Пояснити, що таке World Partition: система Unreal для великих світів, яка ділить рівень на клітинки (квадрати землі) і завантажує лише ті, що поруч із камерою. Рівень Open World використовує її від самого початку; у День 33 ми розберемо її глибше."}, {"en": "Create L_Island with File > New Level > Empty Open World and save it in Content/Island/Maps.", "uk": "Створити L_Island через File > New Level > Empty Open World і зберегти його в Content/Island/Maps."}, {"en": "Import a heightmap in Landscape mode with your numbers, knowing that Unreal 5.8 always gives it Edit Layers (layers that let tools such as the Water plugin change the ground without wrecking your sculpting), and light the empty level with Env. Light Mixer.", "uk": "Імпортувати карту висот у Landscape mode зі своїми числами, знаючи, що Unreal 5.8 завжди дає їй Edit Layers (шари, які дозволяють інструментам на кшталт плагіна Water змінювати землю, не руйнуючи твого ліплення), і освітлити порожній рівень через Env. Light Mixer."}], "doalong": [{"en": "In IslandCourse's Content Browser, right-click > New Folder and make Island, and inside it Maps. You should see Content/Island/Maps.", "uk": "У Content Browser проєкту IslandCourse клацни правою кнопкою > New Folder і створи Island, а в ній Maps. Ти маєш побачити Content/Island/Maps."}, {"en": "File > New Level > Empty Open World > Create. Then File > Save Current Level As, choose Island/Maps and name it L_Island. You should see an empty dark world and L_Island in the folder.", "uk": "File > New Level > Empty Open World > Create. Потім File > Save Current Level As, вибери Island/Maps і назви рівень L_Island. Ти маєш побачити порожній темний світ і L_Island у теці."}, {"en": "Open Landscape mode: the mode drop-down at the top left of the editor (it says Selection) > Landscape, or press Shift+2. Click Manage, then New, then Import from File, and pick island_height_r1.png. You should see the resolution read 2017 x 2017.", "uk": "Відкрий Landscape mode: випадний список режимів угорі ліворуч у редакторі (на ньому написано Selection) > Landscape, або натисни Shift+2. Натисни Manage, потім New, потім Import from File і вибери island_height_r1.png. Ти маєш побачити роздільність 2017 x 2017."}, {"en": "Set Location X 0, Y 0 and Z your Location Z in cm; Scale X 100, Y 100 and Z your Z scale. There is no Edit Layers box to tick: 5.8 turns them on for every new landscape. Click Import. You should see your island appear in grey after a short wait.", "uk": "Встанови Location X 0, Y 0 і Z — свій Location Z у сантиметрах; Scale X 100, Y 100 і Z — свій масштаб Z. Позначки Edit Layers немає: 5.8 вмикає їх для кожного нового ландшафту. Натисни Import. Після короткого очікування ти маєш побачити, як з'являється твій сірий острів."}, {"en": "Window > Env. Light Mixer: click each button it offers (Sky Light, Atmospheric Light, Sky Atmosphere, Volumetric Cloud, Height Fog). You should see sky, sun and haze appear.", "uk": "Window > Env. Light Mixer: натисни кожну кнопку, яку він пропонує (Sky Light, Atmospheric Light, Sky Atmosphere, Volumetric Cloud, Height Fog). Ти маєш побачити, як з'являються небо, сонце і серпанок."}, {"en": "Settings > Engine Scalability Settings > High. You should see the editor run more smoothly.", "uk": "Settings > Engine Scalability Settings > High. Ти маєш побачити, що редактор працює плавніше."}], "play": {"en": "Import quiz: the tutor reads me five import settings (a size of 4033, Scale Z 100, Location Z 0, Scale X 50, an 8-bit file); I say which ones are wrong for my island and why.", "uk": "Вікторина імпорту: тьютор зачитує мені п'ять параметрів імпорту (розмір 4033, Scale Z 100, Location Z 0, Scale X 50, 8-бітний файл); я кажу, які з них не підходять для мого острова і чому."}, "video": {"url": "https://www.youtube.com/watch?v=HwMgVavXXvY", "title": "How to Import Landscape Heightmaps in Unreal Engine 5", "channel": "Gorka Games", "length": "3:37", "search": "unreal engine 5 import landscape heightmap"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: L_Island: an Open World level and the landscape import (Day 26, lesson 3 of 4).\nToday's build: L_Island with your island's landscape: island_height_r1.png (16-bit, 2017 x 2017 px) imported at 1 m per vertex and calibrated to your map's summit and coast.\nEarlier today I already did: lesson 1 (Heightmaps: 16 bits, landscape sizes and Z scale); lesson 2 (Reshaping a heightmap to your map in Krita). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Explain World Partition: Unreal's system for big worlds, which splits a level into cells (squares of ground) and loads only those near the camera. An Open World level uses it from the start; Day 33 goes deeper.\n2. Create L_Island with File > New Level > Empty Open World and save it in Content/Island/Maps.\n3. Import a heightmap in Landscape mode with your numbers, knowing that Unreal 5.8 always gives it Edit Layers (layers that let tools such as the Water plugin change the ground without wrecking your sculpting), and light the empty level with Env. Light Mixer.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Import quiz: the tutor reads me five import settings (a size of 4033, Scale Z 100, Location Z 0, Scale X 50, an 8-bit file); I say which ones are wrong for my island and why.\n4. Do-along on today's build (the heightmap, reshaped in Krita (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - In IslandCourse's Content Browser, right-click > New Folder and make Island, and inside it Maps. You should see Content/Island/Maps.\n   - File > New Level > Empty Open World > Create. Then File > Save Current Level As, choose Island/Maps and name it L_Island. You should see an empty dark world and L_Island in the folder.\n   - Open Landscape mode: the mode drop-down at the top left of the editor (it says Selection) > Landscape, or press Shift+2. Click Manage, then New, then Import from File, and pick island_height_r1.png. You should see the resolution read 2017 x 2017.\n   - Set Location X 0, Y 0 and Z your Location Z in cm; Scale X 100, Y 100 and Z your Z scale. There is no Edit Layers box to tick: 5.8 turns them on for every new landscape. Click Import. You should see your island appear in grey after a short wait.\n   - Window > Env. Light Mixer: click each button it offers (Sky Light, Atmospheric Light, Sky Atmosphere, Volumetric Cloud, Height Fog). You should see sky, sun and haze appear.\n   - Settings > Engine Scalability Settings > High. You should see the editor run more smoothly.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"How to Import Landscape Heightmaps in Unreal Engine 5\" by Gorka Games: https://www.youtube.com/watch?v=HwMgVavXXvY\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Checking the import: summit, coast and a first flight", "uk": "Перевіряємо імпорт: вершина, узбережжя і перший політ"}, "minutes": 40, "goals": [{"en": "Check the height: a 1 m cube dropped on the summit shows the real height in its Z.", "uk": "Перевірити висоту: куб 1 м, опущений на вершину, показує справжню висоту у своєму Z."}, {"en": "Check the coast: a flat plane at Z = 0 stands in for the sea, and from a Top view the shoreline should match your map within about 20 m.", "uk": "Перевірити узбережжя: пласка площина на Z = 0 замінює море, і у вигляді Top берегова лінія має збігатися з твоєю мапою з точністю приблизно до 20 м."}, {"en": "Fly at a known height with a piloted Cine Camera, and bring back land that World Partition has unloaded.", "uk": "Літати на відомій висоті з керованою Cine Camera і повертати сушу, яку World Partition вивантажила."}], "doalong": [{"en": "Place Actors (the + button on the toolbar) > Shapes > Cube. Move it over your summit and press End to drop it onto the ground. Its Z in Details minus 50 is the summit's height in cm. You should be within 5 m of your map; if not, change the landscape's Scale Z and note the new number.", "uk": "Place Actors (кнопка + на панелі інструментів) > Shapes > Cube. Пересунь його над вершину і натисни End, щоб опустити його на землю. Його Z у Details мінус 50 — це висота вершини в сантиметрах. Розбіжність із мапою має бути в межах 5 м; якщо ні, зміни Scale Z ландшафту і запиши нове число."}, {"en": "Place a Plane at Location 0, 0, 0 with Scale 2000, 2000, 1 (2 km across). You should see a flat sheet cutting the land at sea level.", "uk": "Постав Plane у Location 0, 0, 0 зі Scale 2000, 2000, 1 (2 км завширшки). Ти маєш побачити плаский аркуш, що розтинає сушу на рівні моря."}, {"en": "Switch the viewport to Top (the Perspective menu at the top left of the viewport > Top) and Unlit (the Lit menu > Unlit). Take a screenshot (Win+Shift+S) and lay it over island_map.png in Krita. You should see the two coasts within about 20 m; if your island is too big or too small, move the landscape's Location Z down or up in steps of 100 (1 m).", "uk": "Перемкни в'юпорт на Top (меню Perspective угорі ліворуч у в'юпорті > Top) і Unlit (меню Lit > Unlit). Зроби скриншот (Win+Shift+S) і наклади його на island_map.png у Krita. Ти маєш побачити, що два узбережжя розходяться не більше ніж на 20 м; якщо твій острів завеликий або замалий, опусти чи підніми Location Z ландшафту кроками по 100 (1 м)."}, {"en": "Back to Perspective and Lit. Place Actors > Cinematic > Cine Camera Actor; name it CAM_Survey and set its Location Z to 15000 (150 m). Right-click it > Pilot. Hold the right mouse button: W, A, S, D move, E rises, Q sinks; its Z in Details shows your height. You should see the island from about 150 m.", "uk": "Повернись до Perspective і Lit. Place Actors > Cinematic > Cine Camera Actor; назви її CAM_Survey і встанови Location Z на 15000 (150 м). Клацни її правою кнопкою > Pilot. Утримуй праву кнопку миші: W, A, S, D рухають, E піднімає, Q опускає; її Z у Details показує твою висоту. Ти маєш побачити острів із висоти близько 150 м."}, {"en": "If you reopen L_Island and the land is missing: Window > World Partition > World Partition Editor, drag a box over the whole grid, right-click > Load Region from Selection. You should see the landscape come back.", "uk": "Якщо ти знову відкриваєш L_Island, а суші немає: Window > World Partition > World Partition Editor, обведи рамкою всю сітку, клацни правою кнопкою > Load Region from Selection. Ти маєш побачити, як ландшафт повертається."}], "play": {"en": "Calibration race: the tutor sets a target ('the plane must meet the coast at the harbour'); I change Location Z in 1 m steps and describe each Top-view result until it matches.", "uk": "Перегони калібрування: тьютор ставить ціль («площина має торкатися узбережжя біля гавані»); я змінюю Location Z кроками по 1 м і описую кожен результат у вигляді Top, доки не збігається."}, "video": {"search": "unreal engine 5 landscape heightmap scale and location z"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Checking the import: summit, coast and a first flight (Day 26, lesson 4 of 4).\nToday's build: L_Island with your island's landscape: island_height_r1.png (16-bit, 2017 x 2017 px) imported at 1 m per vertex and calibrated to your map's summit and coast.\nEarlier today I already did: lesson 1 (Heightmaps: 16 bits, landscape sizes and Z scale); lesson 2 (Reshaping a heightmap to your map in Krita); lesson 3 (L_Island: an Open World level and the landscape import). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Check the height: a 1 m cube dropped on the summit shows the real height in its Z.\n2. Check the coast: a flat plane at Z = 0 stands in for the sea, and from a Top view the shoreline should match your map within about 20 m.\n3. Fly at a known height with a piloted Cine Camera, and bring back land that World Partition has unloaded.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Calibration race: the tutor sets a target ('the plane must meet the coast at the harbour'); I change Location Z in 1 m steps and describe each Top-view result until it matches.\n4. Do-along on today's build (the heightmap, reshaped in Krita (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Place Actors (the + button on the toolbar) > Shapes > Cube. Move it over your summit and press End to drop it onto the ground. Its Z in Details minus 50 is the summit's height in cm. You should be within 5 m of your map; if not, change the landscape's Scale Z and note the new number.\n   - Place a Plane at Location 0, 0, 0 with Scale 2000, 2000, 1 (2 km across). You should see a flat sheet cutting the land at sea level.\n   - Switch the viewport to Top (the Perspective menu at the top left of the viewport > Top) and Unlit (the Lit menu > Unlit). Take a screenshot (Win+Shift+S) and lay it over island_map.png in Krita. You should see the two coasts within about 20 m; if your island is too big or too small, move the landscape's Location Z down or up in steps of 100 (1 m).\n   - Back to Perspective and Lit. Place Actors > Cinematic > Cine Camera Actor; name it CAM_Survey and set its Location Z to 15000 (150 m). Right-click it > Pilot. Hold the right mouse button: W, A, S, D move, E rises, Q sinks; its Z in Details shows your height. You should see the island from about 150 m.\n   - If you reopen L_Island and the land is missing: Window > World Partition > World Partition Editor, drag a box over the whole grid, right-click > Load Region from Selection. You should see the landscape come back.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "island_height_r1.png and island_height_r1.kra", "uk": "island_height_r1.png і island_height_r1.kra"}, {"en": "terrain_notes.md (range, Z scale, Location Z, the summit check and the coast check)", "uk": "terrain_notes.md (перепад, масштаб Z, Location Z, перевірка вершини і перевірка узбережжя)"}, {"en": "landscape_details.png (the landscape's Details showing location and scale) and coast_check.png (the Top view beside your map)", "uk": "landscape_details.png (Details ландшафту з позицією і масштабом) і coast_check.png (вигляд Top поруч із твоєю мапою)"}, {"en": "before_after_day26.png (real_height.png beside island_height_r1.png)", "uk": "before_after_day26.png (real_height.png поруч з island_height_r1.png)"}, {"en": "flythrough_day26.mp4 (60 seconds at about 150 m)", "uk": "flythrough_day26.mp4 (60 секунд на висоті близько 150 м)"}, {"en": "summary.md", "uk": "summary.md"}], "goal": {"en": "By the end of today you have L_Island, an Open World level in IslandCourse, with a 2 km landscape made from a real 16-bit heightmap, reshaped to your map, and checked against your summit and coast.", "uk": "До кінця сьогоднішнього дня в тебе є L_Island, рівень Open World в IslandCourse, з ландшафтом 2 км, зробленим із реальної 16-бітної карти висот, переробленим за твоєю мапою і перевіреним за твоєю вершиною і узбережжям."}, "uses": [{"en": "Day 22: island_map.png and map_notes.md (the coast, the summit height and the districts)", "uk": "День 22: island_map.png і map_notes.md (узбережжя, висота вершини і райони)"}, {"en": "Day 21: your real place and its highest point", "uk": "День 21: твоє реальне місце і його найвища точка"}, {"en": "Day 0: the IslandCourse project with the Water plugin", "uk": "День 0: проєкт IslandCourse із плагіном Water"}, {"en": "Day 6: placing actors by typed numbers in the Details panel", "uk": "День 6: розміщення акторів введенням чисел на панелі Details"}], "quiz": [{"q": {"en": "Your summit is 180 m and your sea floor is -40 m. What Z scale do you type?", "uk": "Твоя вершина — 180 м, а дно моря — -40 м. Який масштаб Z ти вводиш?"}, "options": [{"en": "100", "uk": "100"}, {"en": "About 43", "uk": "Близько 43"}, {"en": "About 35", "uk": "Близько 35"}, {"en": "220", "uk": "220"}], "answer": 1, "explain": {"en": "The range is 220 m, and 220 x 0.1953125 = 43. The Location Z is the middle of the range: 70 m, typed as 7000 cm.", "uk": "Перепад становить 220 м, а 220 x 0,1953125 = 43. Location Z — це середина перепаду: 70 м, що вводиться як 7000 cm."}}, {"q": {"en": "After import, your hills look like stairs, with a step every metre or so. What is the likely cause?", "uk": "Після імпорту твої пагорби виглядають як сходи, зі сходинкою приблизно щометра. Яка ймовірна причина?"}, "options": [{"en": "The heightmap was 8-bit, so it only had 256 grey steps.", "uk": "Карта висот була 8-бітною, тож мала лише 256 ступенів сірого."}, {"en": "Scale Z is too small.", "uk": "Scale Z замалий."}, {"en": "The landscape has Edit Layers.", "uk": "Ландшафт має Edit Layers."}, {"en": "The sun is too low.", "uk": "Сонце надто низько."}], "answer": 0, "explain": {"en": "8 bits give only 256 heights across the whole range. Use a 16-bit file, with 65,536 steps.", "uk": "8 біт дають лише 256 висот на весь перепад. Використовуй 16-бітний файл із 65 536 ступенями."}}, {"q": {"en": "What does Location Z do at import?", "uk": "Що робить Location Z під час імпорту?"}, "options": [{"en": "It sets the landscape's resolution.", "uk": "Встановлює роздільність ландшафту."}, {"en": "It moves the whole landscape up or down, so sea level lands at Z = 0.", "uk": "Піднімає або опускає весь ландшафт, щоб рівень моря опинився на Z = 0."}, {"en": "It sets the sea colour.", "uk": "Встановлює колір моря."}, {"en": "It turns World Partition on.", "uk": "Вмикає World Partition."}], "answer": 1, "explain": {"en": "Location Z places the middle of your height range. With the right value, the -40 m sea floor and your summit land at their true heights.", "uk": "Location Z розміщує середину твого перепаду висот. З правильним значенням дно моря на -40 м і твоя вершина опиняються на своїх справжніх висотах."}}, {"q": {"en": "You reopen L_Island and the landscape is gone, though the Outliner still lists landscape pieces. What do you try first?", "uk": "Ти знову відкриваєш L_Island, а ландшафту немає, хоча Outliner досі показує частини ландшафту. Що ти пробуєш насамперед?"}, "options": [{"en": "Import the heightmap again.", "uk": "Імпортую карту висот ще раз."}, {"en": "Delete the level.", "uk": "Видаляю рівень."}, {"en": "Raise Engine Scalability to Epic.", "uk": "Піднімаю Engine Scalability до Epic."}, {"en": "Open the World Partition Editor, select the whole grid and Load Region from Selection.", "uk": "Відкриваю World Partition Editor, виділяю всю сітку і роблю Load Region from Selection."}], "answer": 3, "explain": {"en": "World Partition loads cells only when asked. The land is still there; it just isn't loaded.", "uk": "World Partition завантажує клітинки лише на запит. Суша нікуди не зникла; вона просто не завантажена."}}, {"q": {"en": "The Z = 0 plane shows your island 60 m wider than the map all round. What do you change?", "uk": "Площина на Z = 0 показує, що твій острів на 60 м ширший за мапу з усіх боків. Що ти змінюєш?"}, "options": [{"en": "Lower the landscape's Location Z in 1 m steps, checking the coast each time, then recheck the summit.", "uk": "Опускаю Location Z ландшафту кроками по 1 м, щоразу перевіряючи узбережжя, а потім знову перевіряю вершину."}, {"en": "Raise Scale X and Y.", "uk": "Збільшую Scale X і Y."}, {"en": "Paint more sea and forget the map.", "uk": "Домальовую море і забуваю про мапу."}, {"en": "Nothing: 60 m is close enough.", "uk": "Нічого: 60 м — достатньо близько."}], "answer": 0, "explain": {"en": "Moving the landscape down puts its gentle edges under water, which pulls the coast in. The summit moves too, so check it again.", "uk": "Якщо опустити ландшафт, його пологі краї йдуть під воду, і узбережжя відступає всередину. Вершина теж зсувається, тож перевір її ще раз."}}], "weekInfo": {"week": 6, "title": {"en": "Terrain and water", "uk": "Рельєф і вода"}, "goal": {"en": "By Friday you have L_Island, a World Partition level with your island's terrain from a real heightmap, sculpted to your map, with rock-covered cliffs, beaches, an auto-material, the ocean, a lake and a river, seen from three locked drone cameras.", "uk": "До п'ятниці в тебе є L_Island, рівень World Partition із рельєфом твого острова з реальної карти висот, виліпленим за твоєю мапою, зі скелями, вкритими каменем, пляжами, автоматичним матеріалом, океаном, озером і річкою, і все це видно з трьох зафіксованих камер дрона."}, "skills": [{"en": "Heightmap-based landscapes in Unreal Engine 5 (16-bit import, Z scale and calibration)", "uk": "Ландшафти з карти висот в Unreal Engine 5 (16-бітний імпорт, масштаб Z і калібрування)"}, {"en": "Landscape sculpting for gameplay and realism: flats, road ramps and erosion", "uk": "Ліплення ландшафту для геймплею і реалізму: рівні майданчики, пандуси для доріг і ерозія"}, {"en": "Auto-landscape materials blended by slope and height", "uk": "Автоматичні матеріали ландшафту, що змішуються за схилом і висотою"}, {"en": "Unreal Water system: ocean, rivers and lakes that follow the terrain", "uk": "Система Water в Unreal: океан, річки й озера, що йдуть за рельєфом"}, {"en": "Cinematic camera set-up and shot review against reference photos", "uk": "Налаштування кінематографічних камер і перевірка кадрів за референсними фото"}]}, "morning": {"sofar": {"en": "In five weeks you have built and lit your own harbour kit and planned a whole island from a real place.", "uk": "П'ять тижнів — і в тебе є власний портовий набір, збудований і освітлений, та план цілого острова на основі справжнього місця."}, "today": {"en": "You create L_Island, an Open World level, and import a 2 km landscape from a real heightmap, reshaped to your map.", "uk": "Сьогодні ти створюєш L_Island — рівень Open World — та імпортуєш 2-кілометровий ландшафт зі справжньої карти висот, переформований під твою мапу."}, "cheer": {"en": "Today your island becomes real ground, so enjoy that first flight across it before you start checking heights.", "uk": "Сьогодні твій острів стає справжньою землею, тож насолодися першим польотом над ним, перш ніж перевіряти висоти."}, "quote": {"text": {"en": "If you wish to make an apple pie from scratch, you must first invent the universe.", "uk": "Якщо хочеш спекти яблучний пиріг з нуля, спершу доведеться винайти всесвіт."}, "author": {"en": "Carl Sagan", "uk": "Карл Саган"}, "source": "https://en.wikiquote.org/wiki/Carl_Sagan"}}, "hasAssets": false, "workPath": "Work\\Assignment\\Day-26-l-island-heightmap", "mapHref": "../../COURSE.html", "prevHref": "../Day-25-boss-planning-pack/START-HERE.html", "nextHref": "../Day-27-sculpting-to-the-map/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in A web browser, Krita and Unreal Engine 5.8. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me and don't write code. Keep me moving and make it feel like a game.\n\nToday I build on my own: L_Island, the import and the calibration, on your own.\nIt's part of: L_Island with your island's landscape: island_height_r1.png (16-bit, 2017 x 2017 px) imported at 1 m per vertex and calibrated to your map's summit and coast (IslandCourse: a new Empty Open World level saved as Content/Island/Maps/L_Island, holding one landscape of 2017 x 2017 vertices at 1 m spacing (2,016 m square) centred on (0, 0), with sea level at Z = 0 and the sea floor near -40 m at the edges.).\n\nSpec:\n- island_height_r1.png: a 16-bit greyscale PNG, 2017 x 2017 px, made from real terrain (your place, or a real coast like it) and reshaped over island_map.png so the coast and the summit sit where the map says; island_height_r1.kra kept.\n- Pure black is -40 m (the sea floor at the edges) and pure white is your summit; the Z scale and the landscape's Location Z worked out from those two numbers and written in terrain_notes.md.\n- L_Island made with File > New Level > Empty Open World and saved as Content/Island/Maps/L_Island.\n- The landscape imported with Landscape mode > Manage > New > Import from File (edit layers are always on in 5.8, so there is no box to tick): Location X 0 and Y 0, Z from your notes, Scale X 100, Y 100 and Z from your notes.\n- Light from Window > Env. Light Mixer, and Engine Scalability at High (not Epic) to spare your memory.\n- Checked: the summit within 5 m of your map's height (a 1 m cube on top, its Z read in Details), and the coast within about 20 m of the map in a Top view, with a large flat plane at Z = 0 standing in for the sea.\n\nMy checklist:\n1. Export real_height.png (2017 x 2017, PNG - 16 Bit, Norm. Mode Smart) of your real place, add its credits.md line, and check it in Krita. Check: the status bar (or Image > Properties) shows Grayscale and 16-bit, and the land is lighter than the sea. (from lesson 1)\n2. Work out your Z scale and Location Z and write them in terrain_notes.md. Check: for a 260 m summit you'd get 58.6 and 11000 cm; your own numbers follow the same sum. (from lesson 1)\n3. Resize a copy of your map's canvas to 2017 x 2017 (anchored in the centre) and paste it at 40 % over the terrain in island_height_r1.kra. Check: 1 px is still 1 m, and you can see both the map and the terrain. (from lesson 2)\n4. Move, turn and scale the terrain (Ctrl+T) so its land sits under your map's land; fill any empty edge with black on a bottom layer. Check: the real hills sit inside your coast. (from lesson 2)\n5. Paint the land to the map: sea out with dark grey, missing land in with lighter greys, the summit where the map puts it. Check: with the map layer shown, the grey coast follows the map's coast all round. (from lesson 2)\n6. Blur 3 px, stretch with Levels, and export island_height_r1.png (16-bit, no alpha, map layer hidden). Check: the deepest sea is pure black, the summit pure white, and the file reopens in Krita as 2017 x 2017, Grayscale, 16-bit. (from lesson 2)\n7. Create L_Island (Empty Open World) and save it in Content/Island/Maps. Check: L_Island shows in the Content Browser and in the editor's title bar. (from lesson 3)\n8. Import the landscape with your numbers (edit layers are always on in 5.8). Check: the island appears; its Details show Location Z your number and Scale 100, 100, your Z scale, saved as landscape_details.png (Location X and Y may read about -100800 instead of 0: Unreal stores the landscape's corner, and its centre sits on the 0, 0 you typed). (from lesson 3)\n9. Light it with Env. Light Mixer and set Engine Scalability to High. Check: sky, sun and haze are in, and the editor runs smoothly. (from lesson 3)\n10. Summit check with a 1 m cube; fix Scale Z if it's more than 5 m out, and note the final number. Check: terrain_notes.md has the summit check with both heights. (from lesson 4)\n11. Coast check with the Z = 0 plane in a Top view against your map; fix Location Z in 1 m steps. Check: coast_check.png shows the two coasts within about 20 m. (from lesson 4)\n12. Fly CAM_Survey round the island at about 150 m and record 60 seconds (Win+Alt+R); make before_after_day26.png from real_height.png beside island_height_r1.png. Save today's clip as flythrough_day26.mp4. Check: the clip shows the whole coast and both district areas. (from lesson 4)\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Elina\nDay 26: L_Island: your terrain from a real heightmap. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

const slider=p=>'<div class="slider"><i style="width:calc('+p+'% - 6px)"></i><b style="left:clamp(13px,'+p+'%,calc(100% - 13px))"></b></div>';
function quiz(){if(!D.quiz||!D.quiz.length)return '';const a=st.qa||{};let ok=0;const L=u('letters');
 const pips='<div class="pips well" aria-hidden="true">'+D.quiz.map((q,i)=>'<i class="'+(a[i]==null?'':a[i]===q.answer?'r':'w')+'"></i>').join('')+'</div>';
 const qs=D.quiz.map((q,i)=>{const c=a[i];if(c===q.answer)ok++;return '<div class="qz"><p class="qq"><span class="qn">'+(i+1)+'</span><span>'+lk(x(q.q))+'</span></p>'+q.options.map((o,k)=>{let cls='opt',mk='<span></span>';if(c!=null){if(k===q.answer){cls+=' right';mk=ic('check','mk')}else if(k===c){cls+=' wrong';mk=ic('x','mk')}}return '<button class="'+cls+'" id="o'+i+'_'+k+'"'+(c!=null?' disabled':'')+' onclick="pick('+i+','+k+')"><span class="lt">'+(L[k]||k+1)+'</span><span>'+esc(x(o))+'</span>'+mk+'</button>'}).join('')+(c!=null?'<p class="exp '+(c===q.answer?'r':'w')+'" id="e'+i+'" tabindex="-1"><b>'+(c===q.answer?u('right'):u('wrong'))+'</b>'+lk(x(q.explain))+'</p>':'')+'</div>'}).join('');
 return '<section class="card glass quiz">'+lab(u('quiz'),'gold')+'<p class="muted" style="margin:-6px 0 14px">'+u('quizSub')+'</p>'+pips+qs+(qDone()?'<div class="score well" role="status"><span class="eyebrow">'+u('score')+'</span><span class="lcd" aria-label="'+ok+' / '+D.quiz.length+'">'+seg(ok+'/'+D.quiz.length)+'</span><div class="row"><button class="btn ghost" id="retry" onclick="retry()">'+u('retry')+'</button></div></div>':'')+'</section>'}
function vid(v){if(!v)return '';const link=v.url?'<a href="'+esc(v.url)+'" target="_blank" rel="noopener">'+esc(x(v.title)||v.url)+'</a>'+(v.channel?' <span class="muted">· '+esc(v.channel)+(v.length?' · '+esc(v.length):'')+'</span>':''):'';const s=v.search?'<a href="https://www.youtube.com/results?search_query='+encodeURIComponent(v.search)+'" target="_blank" rel="noopener">'+u('noVid')+': '+esc(v.search)+'</a>':'';const alt=v.alt&&v.alt.url?'<br><span class="eyebrow">UA</span> <a href="'+esc(v.alt.url)+'" target="_blank" rel="noopener">'+esc(v.alt.title||v.alt.url)+'</a>'+(v.alt.channel?' <span class="muted">· '+esc(v.alt.channel)+'</span>':''):'';return '<div class="vid well">'+kn('play')+'<div><b>'+u('more')+'?</b><br>'+(link||s)+alt+(link&&s?'<br><span class="muted" style="font-size:14px">'+s+'</span>':'')+'</div></div>'}
function morning(){const m=D.morning;if(!m)return '';const q=m.quote||{};
 let shelf='';if(D.day>0){shelf='<div class="shelf" aria-hidden="true">';let g='';for(let d=0;d<D.day;d++){let p=0;try{p=(JSON.parse(localStorage.getItem('devteam:'+D.learner+':'+d))||{}).pct||0}catch(e){}g+='<i class="'+(p>=1?'d':'')+(d>0&&d%5===0?' bs':'')+'"></i>';if(d%5===0||d===D.day-1){shelf+='<span class="wkg">'+g+'</span>';g=''}}shelf+='</div>'}
 const qt=lang==='uk'&&q.original?q.original:x(q.text);
 return '<section class="card glass morning"><div class="mgrid">'+(m.sofar?'<div>'+lab(u('sofar'),'gold')+shelf+'<p class="mtxt">'+lk(x(m.sofar))+'</p></div>':'')+(m.today?'<div>'+lab(u('todayL'))+'<p class="mtxt">'+lk(x(m.today))+'</p></div>':'')+'</div>'+(m.cheer?'<p class="cheer">'+esc(x(m.cheer))+'</p>':'')+(qt?'<figure class="quote well">'+kn('quote')+'<blockquote>'+esc(qt)+'</blockquote>'+(q.author?'<figcaption>'+esc(x(q.author))+'</figcaption>':'')+'</figure>':'')+'</section>'}
function setLang(l){lang=l;try{localStorage.setItem('devteam:lang',lang)}catch(e){};render()}
function toggleLang(){setLang(lang==='uk'?'en':'uk')}
/* keep open sections and keyboard focus across re-renders */
const openD=new Set();
function tg(e){if(e.open)openD.add(e.id);else openD.delete(e.id)}
const op=id=>openD.has(id)?' open':'';
function render(){const ae=document.activeElement,fid=ae&&(ae.id||(ae.getAttribute('data-th')?'th-'+ae.getAttribute('data-th'):ae.getAttribute('lang')&&ae.closest('.seg')?'lg-'+ae.getAttribute('lang'):''));
 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);
 const b=D.build,P=Math.round(prog()*100);
 document.getElementById('top').innerHTML='<div class="topin glass"><a class="maplink" href="'+esc(D.mapHref)+'">'+kn('map')+u('map')+'</a><div class="crumb"><b>'+esc(x(D.learnerName))+'</b><span>'+u('week')+' '+D.week+'</span><span>'+u('day')+' '+D.day+' '+u('of')+' '+D.total+'</span></div>'+controls(lang,'setLang')+'</div><div class="tline"><i style="width:'+P+'%"></i></div>';
 const state=w=>w<D.week?'b':w===D.week?'n':'p';
 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 if(D.weekInfo){const w=D.weekInfo;h+='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}
 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p><div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+list(D.handin,'ul','ticks')+'<p class="path">'+ic('folder')+'<span>'+u('shipTo')+' <code>'+esc(D.workPath)+'</code></span></p>'+(D.lessons.length?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<p class="muted">'+u('report')+'</p><div class="row"><button class="btn s" onclick="cp(D.reportPrompt)">'+ic('copy')+u('copyR')+'</button></div></section>';
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();
</script>
</body>
</html>

<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 31</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

oining both districts). One lane leaves it towards a district. One climb runs from low ground to higher ground, with at least two hairpins.", "uk": "L_Island. Головна дорога — з твоєї island_map.png (зазвичай уздовж берега, між обома районами). Від неї до одного з районів відходить вузька дорога. Підйом веде з низини вгору й має щонайменше дві шпильки."}, "spec": [{"en": "The main road as a landscape spline: Half-Width 300, Side Falloff 400 to 600, Raise Terrain and Lower Terrain ticked. Half-Width runs from the centre line to one edge, so this is a 6 m road.", "uk": "Головна дорога як сплайн ландшафту: Half-Width 300, Side Falloff 400–600, прапорці Raise Terrain і Lower Terrain увімкнені. Half-Width — це відстань від осьової лінії до одного краю, тож дорога має ширину 6 м."}, {"en": "Every leg under a 10 % grade (12 % at the very steepest), measured with two cubes and the Top-view ruler, and written in road_grades.md.", "uk": "Кожен відрізок має ухил менше 10 % (у найкрутішому місці — до 12 %). Ухил виміряно двома кубами й лінійкою на виді Top і записано в road_grades.md."}, {"en": "One switchback climb with at least two hairpins. Each hairpin is flatter than the legs, with an inside radius of 8 m or more.", "uk": "Один підйом серпантином щонайменше з двома шпильками. Кожна шпилька положистіша за відрізки, а її внутрішній радіус — 8 м або більше."}, {"en": "One junction, where a lane (Half-Width 175, a 3.5 m single-lane road) leaves the main road towards a district.", "uk": "Одна розвилка: від головної дороги до району відходить вузька дорога (Half-Width 175, тобто односмугова дорога шириною 3,5 м)."}, {"en": "SM_RoadStrip_8m from lesson 3: 8 x 6 x 0.2 m, with 8 loop cuts along its length and the origin at the bottom centre. It wears MI_Road and sits on every segment as a spline mesh, with Scale to Width ticked.", "uk": "SM_RoadStrip_8m з уроку 3: 8 × 6 × 0,2 м, 8 петлевих розрізів уздовж довжини, origin у центрі нижньої грані. На ній MI_Road. Вона лежить на кожному сегменті як spline mesh з увімкненим прапорцем Scale to Width."}, {"en": "The road follows your map within about 20 m. There are no lumps at the control points, no cliff at the verges, and the surface sits in the ground with no gap.", "uk": "Дорога відхиляється від мапи не більше ніж на 20 м. Біля контрольних точок немає горбів, на узбіччях немає урвищ, а покриття лежить у ґрунті без щілини."}], "piece1": "the main road (shared with the lessons)", "piece2": {"en": "The switchback climb and the lane, on your own", "uk": "Підйом серпантином і вузька дорога, самостійно"}, "steps": [{"text": {"en": "Check: the files from today's lessons are in the day work folder (road_grades.md, switchback_plan.png, before_day31.png and SM_RoadStrip_8m.blend). Also check that the .blend reopens with the strip in the Outliner, and L_Island has the main road with MI_Road on it. Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it.", "uk": "Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: road_grades.md, switchback_plan.png, before_day31.png і SM_RoadStrip_8m.blend. Файл .blend відкривається зі смугою в Outliner, а в L_Island є головна дорога з MI_Road. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде."}, "lesson": 1}, {"text": {"en": "Load the whole island in the World Partition editor (as on Day 26). Measure every climb of your roads with two cubes (the Day 27 method): the rise from their Location Z, the length with the Top-view ruler. Check: road_grades.md has the rise, the length and the grade of each climb.", "uk": "Завантаж увесь острів у редакторі World Partition (як у День 26). Виміряй кожен підйом своїх доріг двома кубами (спосіб із Дня 27): висоту підйому — за їхнім Location Z, довжину — лінійкою на виді Top. Перевірка: у road_grades.md для кожного підйому є висота, довжина й ухил."}, "lesson": 1}, {"text": {"en": "Move control points up or down until every leg of the main road is under 10 %. Measure each leg again with the two cubes. Check: road_grades.md lists every leg under 10 %.", "uk": "Піднімай або опускай контрольні точки, доки кожен відрізок головної дороги не матиме ухил менше 10 %. Знову виміряй кожен відрізок двома кубами. Перевірка: у road_grades.md усі відрізки мають ухил менше 10 %."}, "lesson": 2}, {"text": {"en": "Draw the switchback climb: legs across the slope, two or more hairpins on flatter shoulders, and two control points close together at each turn. Check: from 60 m the climb reads as a clean zigzag, and each hairpin is flatter than its legs.", "uk": "Намалюй підйом серпантином. Відрізки йдуть упоперек схилу, дві чи більше шпильки лежать на положистіших місцях, а на кожному повороті стоять дві контрольні точки близько одна до одної. Перевірка: з 60 м підйом читається як чистий зигзаг, і кожна шпилька положистіша за свої відрізки."}, "lesson": 2}, {"text": {"en": "Make the junction: select a control point on the main road and Ctrl+click towards the district to branch a lane. Set its Half-Width to 175. Check: the lane leaves the road with no step or lump.", "uk": "Зроби розвилку: виділи контрольну точку на головній дорозі й зроби Ctrl+click у бік району. Так відгалузиться вузька дорога. Задай їй Half-Width 175. Перевірка: вузька дорога відходить від головної без сходинки й горба."}, "lesson": 2}, {"text": {"en": "Put SM_RoadStrip_8m on the switchback and the lane, as you did on the main road (click one segment, Ctrl+A, Spline Meshes +). Check: one continuous road surface runs along all your roads, with no gaps at the control points.", "uk": "Поклади SM_RoadStrip_8m на серпантин і вузьку дорогу так само, як на головну (клацни один сегмент, Ctrl+A, Spline Meshes +). Перевірка: уздовж усіх доріг іде суцільне покриття без щілин біля контрольних точок."}, "lesson": 3}, {"text": {"en": "Fly the roads at 10 m and at 2 m. Fix every lump, gap or floating edge by lowering a control point a little or raising Side Falloff. Check: no daylight shows under any road edge from 2 m.", "uk": "Пролети над дорогами на висоті 10 м і 2 м. Виправ кожен горб, щілину чи край, що висить: трохи опусти контрольну точку або збільш Side Falloff. Перевірка: з 2 м під жодним краєм дороги не видно просвіту."}, "lesson": 4}, {"text": {"en": "Read the roads from 60 m and 150 m beside your reference photos and fix the worst bend. Check: from 150 m the curves are smooth and hug the contours.", "uk": "Подивися на дороги з 60 м і 150 м поруч із фото-референсами й виправ найгірший вигин. Перевірка: з 150 м вигини плавні й тримаються горизонталей."}, "lesson": 4}, {"text": {"en": "Press 1 to return to your switchback bookmark and take the same view again (Win+Shift+S). In Krita, put before_day31.png and the new view side by side as before_after_day31.png. Check: the bare slope and the finished switchback show from the same spot.", "uk": "Натисни 1, щоб повернутися до закладки камери над серпантином, і зніми той самий вид ще раз (Win+Shift+S). У Krita постав before_day31.png і новий кадр поруч і збережи як before_after_day31.png. Перевірка: голий схил і готовий серпантин показано з одного місця."}, "lesson": 4}, {"text": {"en": "Choose File > Save All in Unreal. Report and hand-in: click Copy the day report at the bottom of the page, paste it into a new chat and answer. Open summary.md in Notepad, press Ctrl+End, paste the answer and press Ctrl+S. Then drag the files on the Hand in list into your hand-in folder. Check: the level tab shows no * mark, and every name shows in the folder, each with a size.", "uk": "В Unreal вибери File > Save All. Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: на вкладці рівня немає позначки *, а кожна назва зі списку є в папці, у кожної є розмір."}, "lesson": 4}], "assets": []}, "lessons": [{"title": {"en": "How island roads climb: grade, switchbacks and hairpins", "uk": "Як піднімаються острівні дороги: ухил, серпантини й шпильки"}, "minutes": 40, "goals": [{"en": "Explain grade as rise over length: a 10 % grade climbs 10 m every 100 m. Most island roads stay under 10 %, and only short pieces reach 12 to 15 %.", "uk": "Пояснювати ухил як висоту підйому, поділену на довжину: ухил 10 % — це 10 м підйому на кожні 100 м. Більшість острівних доріг тримається нижче 10 %, і лише короткі відрізки сягають 12–15 %."}, {"en": "Explain why switchbacks exist: where a slope is too steep for a road, the road zigzags across it. Each turn (a hairpin) is flatter and wider than the legs.", "uk": "Пояснювати, навіщо потрібні серпантини: там, де схил надто крутий для дороги, вона йде зигзагом упоперек нього. Кожен поворот (шпилька) положистіший і ширший за відрізки."}, {"en": "Measure a climb in Unreal: two cubes give the rise, and the ruler in a Top view gives the length along the ground.", "uk": "Вимірювати підйом в Unreal: два куби дають висоту, а лінійка на виді Top — довжину вздовж землі."}, {"en": "Plan a climb on your map: work out the road length a rise needs, and draw the zigzag.", "uk": "Планувати підйом на мапі: рахувати, яка довжина дороги потрібна для підйому, і малювати зигзаг."}], "doalong": [{"en": "Open island_map.png in Krita beside Unreal. Find the place where your road must climb. You see the bottom and the top of the climb marked on the map.", "uk": "Відкрий island_map.png у Krita поруч з Unreal. Знайди місце, де твоя дорога має піднятися. Має вийти: на мапі позначено низ і верх підйому."}, {"en": "In Unreal, use the two-cube method from Day 27: drop a small cube at the bottom of the climb and one at the top: Place Actors > Shapes > Cube, then press End (Fn+End on some laptops) to drop it to the ground. You see two cubes on the slope.", "uk": "В Unreal візьми спосіб двох кубів із Дня 27: постав маленький куб унизу підйому й ще один угорі. Place Actors > Shapes > Cube, потім натисни End (на деяких ноутбуках Fn+End), щоб куб опустився на землю. Має вийти: два куби на схилі."}, {"en": "Click each cube and read its Location Z in Details. The difference divided by 100 is the rise in metres. You see the rise written in road_grades.md.", "uk": "Клацни кожен куб і прочитай його Location Z у Details. Різниця, поділена на 100, — це висота підйому в метрах. Має вийти: висота підйому записана в road_grades.md."}, {"en": "Switch the viewport to Top (the Perspective menu at the top left > Top). Hold the middle mouse button and drag from one cube to the other. You see the length along the ground in metres; write it beside the rise.", "uk": "Перемкни в'юпорт на вид Top (меню Perspective угорі ліворуч > Top). Затисни середню кнопку миші й протягни від одного куба до іншого. На екрані з'явиться довжина вздовж землі в метрах. Запиши її поруч із висотою."}, {"en": "Work out the grade: rise divided by length, times 100. For example, 40 m of rise over 250 m is 16 %, too steep for a straight road. You see your climb's grade in road_grades.md.", "uk": "Порахуй ухил: висоту підйому поділи на довжину й помнож на 100. Наприклад, 40 м підйому на 250 м — це 16 %, надто круто для прямої дороги. Має вийти: ухил твого підйому записаний у road_grades.md."}, {"en": "If the grade is over 10 %, work out the road length you need: rise divided by 0.08. 40 m of rise needs about 500 m of road. You see the length that has to fit on the slope.", "uk": "Якщо ухил більший за 10 %, порахуй потрібну довжину дороги: висоту підйому поділи на 0,08. Для 40 м підйому треба близько 500 м дороги. Тепер відомо, яку довжину треба вмістити на схилі."}, {"en": "On a copy of the map, draw the zigzag: long legs across the slope, hairpins on flatter shoulders. Save it as switchback_plan.png. You see a zigzag about as long as you worked out.", "uk": "На копії мапи намалюй зигзаг: довгі відрізки впоперек схилу, шпильки на положистіших місцях. Збережи його як switchback_plan.png. Має вийти: зигзаг приблизно тієї довжини, яку дав розрахунок."}], "play": {"en": "Engineer's call: the tutor gives me four slopes with their rise and length; for each I say 'straight', 'along the contour' or 'switchback', and how many hairpins it needs.", "uk": "Рішення інженера: тьютор дає мені чотири схили з їхнім підйомом і довжиною; для кожного я кажу «прямо», «уздовж горизонталі» чи «серпантин» і скільки шпильок він потребує."}, "video": {"url": "https://www.youtube.com/watch?v=tteLG5GL-6g", "title": "Switchback - Planning, Layout and Construction", "channel": "BC Forest Safety Council", "length": "13:48", "search": "switchback road planning layout"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Як піднімаються острівні дороги: ухил, серпантини й шпильки (Day 31, lesson 1 of 4). Today's build: Головна дорога острова, одна вузька дорога й один підйом серпантином. Усі вони намальовані сплайнами ландшафту, що формують рельєф. Покриття дороги — твоя власна дорожня смуга з Blender..\nWhat I already know: День 22: island_map.png із твоїми дорогами й мальовничим маршрутом; День 27: пласкі майданчики для обох районів і дві твої полиці під дорогу; День 30: рельєф, берег і вода L_Island; День 12: майстер-матеріал M_Master для дорожнього матеріалу MI_Road.\n\nBy the end of this lesson I can:\n1. Пояснювати ухил як висоту підйому, поділену на довжину: ухил 10 % — це 10 м підйому на кожні 100 м. Більшість острівних доріг тримається нижче 10 %, і лише короткі відрізки сягають 12–15 %.\n2. Пояснювати, навіщо потрібні серпантини: там, де схил надто крутий для дороги, вона йде зигзагом упоперек нього. Кожен поворот (шпилька) положистіший і ширший за відрізки.\n3. Вимірювати підйом в Unreal: два куби дають висоту, а лінійка на виді Top — довжину вздовж землі.\n4. Планувати підйом на мапі: рахувати, яка довжина дороги потрібна для підйому, і малювати зигзаг.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: Шість тижнів позаду: у тебе є власний набір для гавані й справжній острів із землею, обривами, пляжами, океаном, озером і річкою. Today: Сьогодні ти прокладаєш головну дорогу, вузьку дорогу й серпантин як landscape splines, що формують землю, і кожен відрізок має ухил менше 10 %. One encouraging line: Дороги — це головоломка зі схилів і простору: спробуй лінію, перевір з повітря й підправ; кожна спроба чогось навчає.); 2 lines on why today matters and where it comes back, in plain words (from this: З повітря дорога — найсильніша лінія в кадрі. Якщо дорога йде прямо вгору схилом або висить над землею, одразу видно, що світ несправжній. Студії будують дороги сплайнами: один сплайн формує ґрунт, кладе покриття, і його можна змінити за кілька хвилин. It comes back: Твої дороги повернуться в п'ятницю, у День боса (День 35), і в День 38, коли зони-винятки звільнять їхні узбіччя від рослин. У День 50 від них відгалузиться дорога району 2, а в День 53 ти виміряєш дорогу між районами так само, як сьогодні.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-31-roads-that-follow-the-land exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (головна дорога (спільна з уроками)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Відкрий island_map.png у Krita поруч з Unreal. Знайди місце, де твоя дорога має піднятися. Має вийти: на мапі позначено низ і верх підйому.\n   2. В Unreal візьми спосіб двох кубів із Дня 27: постав маленький куб унизу підйому й ще один угорі. Place Actors > Shapes > Cube, потім натисни End (на деяких ноутбуках Fn+End), щоб куб опустився на землю. Має вийти: два куби на схилі.\n   3. Клацни кожен куб і прочитай його Location Z у Details. Різниця, поділена на 100, — це висота підйому в метрах. Має вийти: висота підйому записана в road_grades.md.\n   4. Перемкни в'юпорт на вид Top (меню Perspective угорі ліворуч > Top). Затисни середню кнопку миші й протягни від одного куба до іншого. На екрані з'явиться довжина вздовж землі в метрах. Запиши її поруч із висотою. [screenshot]\n   5. Порахуй ухил: висоту підйому поділи на довжину й помнож на 100. Наприклад, 40 м підйому на 250 м — це 16 %, надто круто для прямої дороги. Має вийти: ухил твого підйому запис d Lower Terrain.", "uk": "Малювати дорогу інструментом Splines: Ctrl+click додає контрольні точки, далі задаєш Half-Width, Side Falloff, Raise Terrain і Lower Terrain."}, {"en": "Let the terrain follow the road through the landscape's splines edit layer, and branch a junction.", "uk": "Підлаштовувати рельєф під дорогу шаром редагування сплайнів і робити розвилку."}], "doalong": [{"en": "Select the landscape and press Shift+2 for Landscape mode. In the Edit Layers list click + (create a layer). You see a window called Pick Landscape Edit Layer Class.", "uk": "Виділи ландшафт і натисни Shift+2, щоб увімкнути режим Landscape. У списку Edit Layers клацни + (створити шар). Відкриється вікно Pick Landscape Edit Layer Class."}, {"en": "Choose the splines layer type: Spline Edit Layer (some versions call it Landscape Edit Layer Splines). It is the one layer where splines change the ground, like a separate layer in Krita. You see a new layer called Splines; if the names differ, send the tutor a screenshot.", "uk": "Вибери тип шару для сплайнів: Spline Edit Layer (у деяких версіях — Landscape Edit Layer Splines). Лише на цьому шарі сплайни змінюють ґрунт, як окремий шар у Krita. З'явиться новий шар Splines. Якщо назви інші, надішли тьютору скриншот."}, {"en": "Click Manage at the top of the Landscape panel, then the Splines tool. Ctrl+click on the landscape where the road starts, then every 30 to 50 m along it. You see control points joined by a curved line.", "uk": "Клацни Manage угорі панелі Landscape, потім інструмент Splines. Зроби Ctrl+click на ландшафті там, де починається дорога, а далі кожні 30–50 м уздовж неї. Має вийти: контрольні точки, з'єднані вигнутою лінією."}, {"en": "Click one control point and press Ctrl+A to select every connected point. Set Half-Width 300: Unreal's name for half the road's width, so the road is 6 m wide. You see every point selected.", "uk": "Клацни одну контрольну точку й натисни Ctrl+A, щоб виділити всі з'єднані точки. Задай Half-Width 300. Так Unreal називає половину ширини дороги, тож дорога матиме 6 м. Має вийти: усі точки виділені."}, {"en": "Set Side Falloff 500: the band where the road's flat shelf blends back into the slope. Tick Raise Terrain and Lower Terrain, so the road may lift or cut the ground. You see the ground under the line flatten into a shelf.", "uk": "Задай Side Falloff 500. Це смуга, де рівна полиця дороги плавно переходить назад у схил. Увімкни прапорці Raise Terrain і Lower Terrain, щоб дорога могла піднімати й зрізати ґрунт. Ґрунт під лінією вирівнюється в полицю."}, {"en": "Select one control point and drag the gizmo's blue arrow up or down; measure that leg again with your two cubes. You see the road rise or fall, and the grade change.", "uk": "Виділи одну контрольну точку й потягни синю стрілку маніпулятора (gizmo) вгору або вниз. Знову виміряй цей відрізок двома кубами. Дорога піднімається чи опускається, і ухил змінюється."}, {"en": "Select a control point on the road and Ctrl+click off to one side. You see a new segment branch from that point: a junction.", "uk": "Виділи контрольну точку на дорозі й зроби Ctrl+click трохи збоку. Від цієї точки відгалужується новий сегмент — це розвилка."}], "play": {"en": "Road inspector: I describe my road leg by leg from a 10 m flight; the tutor flags any leg over 10 %, any lump at a control point and any verge that drops away like a cliff.", "uk": "Дорожній інспектор: я описую свою дорогу відрізок за відрізком після прольоту на 10 м; тьютор позначає кожен відрізок з ухилом понад 10 %, кожен горб біля контрольної точки й кожне узбіччя, що обривається, як урвище."}, "video": {"url": "https://www.youtube.com/watch?v=eO2HUsC7dHY", "title": "How to Make Roads with Splines in Unreal Engine 5", "channel": "Gorka Games", "length": "11:25", "search": "unreal engine 5 roads with landscape splines"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation) твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («введи 0.45»); Unreal units are centimetres (100 = 1 м). 5) Say the expected result plainly («Куб опускається на підлогу.» or «Має вийти: …»), not «Ти бачиш…».\nUse exactly these Ukrainian words (English = Ukrainian): tutor / build coach = тьютор / тьютор-помічник; Boss day = День боса; lesson receipt: Learned / Hard = підсумок уроку: «Засвоєно: …» / «Було важко: …»; day report (summary.md) = звіт дня (summary.md); hand-in folder / hand-in list = папка здачі / Що здати; folder = папка; see-why-fix note = нотатка «бачу, чому, як виправити»; reference photo / hero photo = фото-референс / ключове фото; click / right-click = клацни / клацни правою кнопкою; screenshot / clip / flythrough = скриншот / кліп / проліт; File Explorer = Провідник; mesh = меш; vertex / edge / face = вершина / ребро / грань; origin (and kit pivot) = origin — точка, за яку об'єкт ставлять і обертають; viewport / view (Front, Top) = в'юпорт / вид (вид спереду, вид згори); look, appearance = вигляд; loop cut / edge loop = петлевий розріз (Loop Cut) / петля ребер; extrude / inset / bevel = видавити (Extrude) / Inset / фаска (Bevel); level (Unreal) = рівень (тільки рівень Unreal); asset / prop / actor = асет / пропс / актор; material instance / child instance = інстанс / дочірній інстанс; material slot / node / pin = слот матеріалу / вузол / вхід; map (island, OpenStreetMap) / heightmap / normal map = мапа / карта висот / карта нормалей; district / plot / plot plan = район / ділянка / план ділянки; wear / worn edges / salt line = зношеність / стерті краї / сольова лінія; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; hero shot = головний кадр (hero shot); proof (picture) = доказ; shot set = серія кадрів.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}], "handin": [{"en": "summary.md", "uk": "summary.md (звіт дня)"}, {"en": "road_grades.md: every leg's rise, length and grade (→ Day 35)", "uk": "road_grades.md (висота підйому, довжина й ухил кожного відрізка) (→ День 35)"}, {"en": "before_after_day31.png: the bare slope and your finished switchback from the same bookmark (proof)", "uk": "before_after_day31.png (голий схил і готовий серпантин з однієї закладки камери) (доказ)"}], "goal": {"en": "By the end of today you have your main road, a lane and a switchback climb in L_Island as landscape splines that shape the ground. Every leg is under a 10 % grade, and your own road strip covers them all.", "uk": "До кінця дня в L_Island є головна дорога, вузька дорога й підйом серпантином. Усі вони — сплайни ландшафту, що формують ґрунт. Кожен відрізок має ухил менше 10 %, а всі дороги вкриває твоя власна дорожня смуга."}, "uses": [{"en": "Day 22: island_map.png, with your roads and the scenic route", "uk": "День 22: island_map.png із твоїми дорогами й мальовничим маршрутом"}, {"en": "Day 27: the flats for both districts and your two road shelves", "uk": "День 27: пласкі майданчики для обох районів і дві твої полиці під дорогу"}, {"en": "Day 30: L_Island's terrain, coast and water", "uk": "День 30: рельєф, берег і вода L_Island"}, {"en": "Day 12: M_Master, for the road material MI_Road", "uk": "День 12: майстер-матеріал M_Master для дорожнього матеріалу MI_Road"}], "quiz": [{"q": {"en": "A road rises 12 m over 150 m. What is its grade?", "uk": "Дорога піднімається на 12 м на відстані 150 м. Який у неї ухил?"}, "options": [{"en": "8 %", "uk": "8 %"}, {"en": "12 %", "uk": "12 %"}, {"en": "18 %", "uk": "18 %"}, {"en": "1.2 %", "uk": "1,2 %"}], "answer": 0, "explain": {"en": "Grade is rise divided by length, times 100: 12 / 150 x 100 = 8 %. That is under the 10 % limit.", "uk": "Ухил — це підйом, поділений на довжину й помножений на 100: 12 / 150 × 100 = 8 %. Це менше за межу 10 %."}}, {"q": {"en": "Your new road leaves a 3 m drop like a small cliff at its downhill verge. What is the likely fix?", "uk": "Нова дорога лишає на узбіччі з боку спуску перепад 3 м, наче маленьке урвище. Яке виправлення найімовірніше?"}, "options": [{"en": "Make the road's Half-Width smaller", "uk": "Зменшити Half-Width дороги"}, {"en": "Raise the Side Falloff so the cut blends into the slope", "uk": "Збільшити Side Falloff, щоб виїмка плавно переходила в схил"}, {"en": "Untick Raise Terrain", "uk": "Вимкнути Raise Terrain"}, {"en": "Delete the Splines edit layer", "uk": "Видалити шар редагування Splines"}], "answer": 1, "explain": {"en": "Side Falloff is the band where the road's shelf blends back into the natural slope. Too little falloff leaves a sharp step.", "uk": "Side Falloff — це смуга, де полиця дороги плавно переходить назад у природний схил. Якщо Side Falloff замалий, лишається різка сходинка."}}, {"q": {"en": "You must climb 60 m on a steep hill and stay under 8 %. About how long must the road be?", "uk": "Треба піднятися на 60 м крутим пагорбом і втриматися в межах 8 %. Приблизно якої довжини має бути дорога?"}, "options": [{"en": "75 m", "uk": "75 м"}, {"en": "480 m", "uk": "480 м"}, {"en": "750 m", "uk": "750 м"}, {"en": "6 km", "uk": "6 км"}], "answer": 2, "explain": {"en": "Length = rise / 0.08 = 60 / 0.08 = 750 m. A switchback folds that length onto the slope.", "uk": "Довжина = підйом / 0,08 = 60 / 0,08 = 750 м. Серпантин укладає цю довжину на схилі зигзагом."}}, {"q": {"en": "Your road surface bends round a curve in sharp, straight pieces. What is the likely cause?", "uk": "Дорожнє покриття на вигині гнеться різкими прямими шматками. Яка ймовірна причина?"}, "options": [{"en": "The material is too rough", "uk": "Матеріал надто шорсткий"}, {"en": "Lumen is off", "uk": "Lumen вимкнений"}, {"en": "The grade is under 10 %", "uk": "Ухил менший за 10 %"}, {"en": "The road strip has no loop cuts along its length, so it cannot bend", "uk": "Дорожня смуга не має петлевих розрізів уздовж довжини, тож не може гнутися"}], "answer": 3, "explain": {"en": "A spline mesh bends by moving its vertices. A strip with no cuts along its length has nothing to bend, so curves look broken.", "uk": "Spline mesh гнеться, коли зсуваються його вершини. Смузі без розрізів уздовж довжини нема чим гнутися, тому вигини виглядають зламаними."}}, {"q": {"en": "What does Half-Width 300 on a landscape spline control point give you?", "uk": "Що дає Half-Width 300 на контрольній точці сплайна ландшафту?"}, "options": [{"en": "A 3 m road", "uk": "Дорогу шириною 3 м"}, {"en": "A 6 m road, because Half-Width is measured from the centre line to one edge", "uk": "Дорогу шириною 6 м, бо Half-Width вимірюють від осьової лінії до одного краю"}, {"en": "A 30 m road", "uk": "Дорогу шириною 30 м"}], "answer": 1, "explain": {"en": "Half-Width is measured from the centre line to one edge. 300 cm on each side makes a 6 m road.", "uk": "Half-Width вимірюють від осьової лінії до одного краю. 300 см з кожного боку дають дорогу шириною 6 м."}}], "weekInfo": {"week": 7, "title": {"en": "Roads, the big world and a first forest", "uk": "Дороги, великий світ і перший ліс"}, "goal": {"en": "By Friday you have roads that follow the land, island-scale light with landmarks and vistas, L_Island organised with World Partition, Data Layers and HLODs, and a first PCG forest filling one valley.", "uk": "До п'ятниці в тебе є дороги, що йдуть за рельєфом, світло в масштабі острова з орієнтирами й панорамами, L_Island, упорядкований інструментами World Partition, Data Layers і HLOD, і перший PCG-ліс, що заповнює одну долину."}, "skills": [{"en": "Landscape spline roads built to real grades in Unreal Engine 5", "uk": "Дороги зі сплайнів ландшафту зі справжніми ухилами в Unreal Engine 5"}, {"en": "World Partition, Data Layer and HLOD set-up for large open worlds", "uk": "Налаштування World Partition, Data Layers і HLOD для великих відкритих світів"}, {"en": "Atmosphere, light, landmarks and vistas for open-world composition", "uk": "Атмосфера, світло, орієнтири й панорами в композиції відкритого світу"}, {"en": "Reading production PCG graphs and migrating assets between Unreal projects", "uk": "Читання робочих PCG-графів зі справжніх проєктів і перенесення асетів між проєктами Unreal"}]}, "morning": {"sofar": {"en": "Six weeks in, you have your own harbour kit and a real island with land, cliffs, beaches, an ocean, a lake and a river.", "uk": "Шість тижнів позаду: у тебе є власний набір для гавані й справжній острів із землею, обривами, пляжами, океаном, озером і річкою."}, "today": {"en": "You draw your main road, a lane and a switchback climb as landscape splines that shape the ground, with every leg under a 10 % grade.", "uk": "Сьогодні ти прокладаєш головну дорогу, вузьку дорогу й серпантин як landscape splines, що формують землю, і кожен відрізок має ухил менше 10 %."}, "cheer": {"en": "Roads are a puzzle of slope and space, so try a line, check it from the air and adjust; every try teaches you something.", "uk": "Дороги — це головоломка зі схилів і простору: спробуй лінію, перевір з повітря й підправ; кожна спроба чогось навчає."}, "quote": {"text": {"en": "Two roads diverged in a wood, and I — I took the one less traveled by.", "uk": "Дві дороги розійшлися в лісі, і я — я обрав ту, якою ходили рідше."}, "author": {"en": "Robert Frost", "uk": "Роберт Фрост"}, "source": "https://en.wikiquote.org/wiki/Robert_Frost"}}, "hasAssets": false, "workPath": "Work\\Assignment\\Day-31-roads-that-follow-the-land", "mapHref": "../../COURSE.html", "prevHref": "../Day-30-boss-island-three-drone-cameras/START-HERE.html", "nextHref": "../Day-32-island-light-landmarks-vistas/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Blender and Unreal Engine 5.8. I am a beginner on Day 31. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me and don't write code.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: Підйом серпантином і вузька дорога, самостійно.\nIt's part of: Головна дорога острова, одна вузька дорога й один підйом серпантином. Усі вони намальовані сплайнами ландшафту, що формують рельєф. Покриття дороги — твоя власна дорожня смуга з Blender. (L_Island. Головна дорога — з твоєї island_map.png (зазвичай уздовж берега, між обома районами). Від неї до одного з районів відходить вузька дорога. Підйом веде з низини вгору й має щонайменше дві шпильки.).\nWhy it matters: З повітря дорога — найсильніша лінія в кадрі. Якщо дорога йде прямо вгору схилом або висить над землею, одразу видно, що світ несправжній. Студії будують дороги сплайнами: один сплайн формує ґрунт, кладе покриття, і його можна змінити за кілька хвилин. It comes back: Твої дороги повернуться в п'ятницю, у День боса (День 35), і в День 38, коли зони-винятки звільнять їхні узбіччя від рослин. У День 50 від них відгалузиться дорога району 2, а в День 53 ти виміряєш дорогу між районами так само, як сьогодні.\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-31-roads-that-follow-the-land (on the drive I chose on Day 0).\nWhat I already know: День 22: island_map.png із твоїми дорогами й мальовничим маршрутом; День 27: пласкі майданчики для обох районів і дві твої полиці під дорогу; День 30: рельєф, берег і вода L_Island; День 12: майстер-матеріал M_Master для дорожнього матеріалу MI_Road; today's lessons: Як піднімаються острівні дороги: ухил, серпантини й шпильки; Сплайни ландшафту: дорога, що формує ґрунт; Дорожнє покриття: дорожня смуга з Blender як spline mesh; Як читати дорогу з повітря. Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- Головна дорога як сплайн ландшафту: Half-Width 300, Side Falloff 400–600, прапорці Raise Terrain і Lower Terrain увімкнені. Half-Width — це відстань від осьової лінії до одного краю, тож дорога має ширину 6 м.\n- Кожен відрізок має ухил менше 10 % (у найкрутішому місці — до 12 %). Ухил виміряно двома кубами й лінійкою на виді Top і записано в road_grades.md.\n- Один підйом серпантином щонайменше з двома шпильками. Кожна шпилька положистіша за відрізки, а її внутрішній радіус — 8 м або більше.\n- Одна розвилка: від головної дороги до району відходить вузька дорога (Half-Width 175, тобто односмугова дорога шириною 3,5 м).\n- SM_RoadStrip_8m з уроку 3: 8 × 6 × 0,2 м, 8 петлевих розрізів уздовж довжини, origin у центрі нижньої грані. На ній MI_Road. Вона лежить на кожному сегменті як spline mesh з увімкненим прапорцем Scale to Width.\n- Дорога відхиляється від мапи не більше ніж на 20 м. Біля контрольних точок немає горбів, на узбіччях немає урвищ, а покриття лежить у ґрунті без щілини.\n\nMy checklist (the same numbers show on my course page):\n1. Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: road_grades.md, switchback_plan.png, before_day31.png і SM_RoadStrip_8m.blend. Файл .blend відкривається зі смугою в Outliner, а в L_Island є головна дорога з MI_Road. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. (from lesson 1)\n2. Завантаж увесь острів у редакторі World Partition (як у День 26). Виміряй кожен підйом своїх доріг двома кубами (спосіб із Дня 27): висоту підйому — за їхнім Location Z, довжину — лінійкою на виді Top. Перевірка: у road_grades.md для кожного підйому є висота, довжина й ухил. (from lesson 1)\n3. Піднімай або опускай контрольні точки, доки кожен відрізок головної дороги не матиме ухил менше 10 %. Знову виміряй кожен відрізок двома кубами. Перевірка: у road_grades.md усі відрізки мають ухил менше 10 %. (from lesson 2)\n4. Намалюй підйом серпантином. Відрізки йдуть упоперек схилу, дві чи більше шпильки лежать на положистіших місцях, а на кожному повороті стоять дві контрольні точки близько одна до одної. Перевірка: з 60 м підйом читається як чистий зигзаг, і кожна шпилька положистіша за свої відрізки. (from lesson 2)\n5. Зроби розвилку: виділи контрольну точку на головній дорозі й зроби Ctrl+click у бік району. Так відгалузиться вузька дорога. Задай їй Half-Width 175. Перевірка: вузька дорога відходить від головної без сходинки й горба. (from lesson 2)\n6. Поклади SM_RoadStrip_8m на серпантин і вузьку дорогу так само, як на головну (клацни один сегмент, Ctrl+A, Spline Meshes +). Перевірка: уздовж усіх доріг іде суцільне покриття без щілин біля контрольних точок. (from lesson 3)\n7. Пролети над дорогами на висоті 10 м і 2 м. Виправ кожен горб, щілину чи край, що висить: трохи опусти контрольну точку або збільш Side Falloff. Перевірка: з 2 м під жодним краєм дороги не видно просвіту. (from lesson 4)\n8. Подивися на дороги з 60 м і 150 м поруч із фото-референсами й виправ найгірший вигин. Перевірка: з 150 м вигини плавні й тримаються горизонталей. (from lesson 4)\n9. Натисни 1, щоб повернутися до закладки камери над серпантином, і зніми той самий вид ще раз (Win+Shift+S). У Krita постав before_day31.png і новий кадр поруч і збережи як before_after_day31.png. Перевірка: голий схил і готовий серпантин показано з одного місця. (from lesson 4)\n10. В Unreal вибери File > Save All. Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: на вкладці рівня немає позначки *, а кожна назва зі списку є в папці, у кожної є розмір. (from lesson 4)\n\nHow to help: ask which step number I'm on, then give me only the next step: the exact clicks and what I should see. When I send a screenshot, compare it with my reference, my sizes and the spec, and name one thing to fix at a time.\nCheck every save and export by reopening it before we move on:\n- a .md or .txt: open it with Notepad; the text is there, and the name doesn't end in .md.txt\nWhen I write \"готово\", and in any case before the day ends, check with me one item at a time (yes/no): each spec point, then each file on my hand-in list, ready in my day work folder (skip summary.md: the day report writes it next):\n1. road_grades.md (висота підйому, довжина й ухил кожного відрізка) (→ День 35)\n2. before_after_day31.png (голий схил і готовий серпантин з однієї закладки камери) (доказ)\nFinish with a short list of anything missing, and one line on where this work comes back and what it will look like there. Then tell me the order for the end of the day: first the day report (the Copy the day report button at the bottom of my course page) into summary.md, and only then hand in all the files on the list, summary.md too.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as /* fix phase 1 (2026-10-22): the hand-in folder (a button when the roster has a link, else the folder path), the hand-in card,
   Day 0's "Before lesson 1", the checks before handing in, the Questions card, and the day report with the pasted lesson summaries */
const HIN=(D.handin||[]).map(v=>(v&&v.en)||(typeof v==='string'?v:'')).join(' ').toLowerCase(),hasClip=/\.mp4|clip/.test(HIN);
function hItem(v){return x(v)}
function hList(){return '<ul class="ticks">'+(D.handin||[]).map(v=>'<li>'+lk(hItem(v))+'</li>').join('')+'</ul>'}
const NFILES=new Set((HIN.match(/[\w-]+\.(?:blend|glb|fbx|png|jpe?g|md|txt|mp4|csv|zip|pdf|webp|kra|psd|tga|exr|json|py|uasset|umap)\b/g)||[])).size;
function nFiles(n){if(!n)return '';if(lang==='en')return ' · '+n+(n===1?' file':' files');const a=n%10,b=n%100;return ' · '+n+' '+(a===1&&b!==11?'файл':a>=2&&a<=4&&(b<12||b>14)?'файли':'файлів')}
function hf(){return D.handinUrl?'<div class="row"><a class="btn s" href="'+esc(D.handinUrl)+'" target="_blank" rel="noopener">'+ic('folder')+u('hOpen')+'</a></div>':'<p class="path">'+ic('folder')+'<span>'+u('hPath')+' <code>'+esc(D.workPath)+'</code></span></p>'}
function handinCard(){if(!D.handin||!D.handin.length)return '';return '<section class="card glass handin">'+lab(u('hTitle')+nFiles(NFILES),'ok')+hList()+hf()+'<p class="muted" style="margin:12px 0 0">'+u('hNote')+'</p></section>'}
function beforeCard(){if(!D.before||!D.before.length)return '';return '<section class="card glass before">'+lab(u('before'),'gold')+list(D.before,'ol','steps')+'</section>'}
function chkList(){const a=[];if(HIN.indexOf('.blend')>=0)a.push('chk1');if(/\.(glb|fbx)\b/.test(HIN))a.push('chk2');a.push('chk3');if(hasClip)a.push('chk4');return '<h3>'+u('chk')+'</h3><ol class="steps">'+a.map(k=>'<li>'+u(k)+'</li>').join('')+'</ol>'}
function qCard(){return '<section class="card glass qcard">'+lab(u('qTitle'))+'<ul class="ticks"><li>'+u('q1')+'</li><li>'+u('q2')+'</li><li>'+u('q3')+'</li></ul></section>'}
function reportText(){let t=D.reportPrompt;const r=D.lessons.map((l,i)=>{const v=(st['r'+i]||'').trim();return v?'Lesson '+(i+1)+': '+v:''}).filter(Boolean);
 if(r.length)t+='\n\nMy lesson summaries, pasted from my course page:\n'+r.join('\n');
 if(st.qs1)t+='\nMy first score in the Check yourself quiz: '+st.qs1[0]+' of '+st.qs1[1]+'.';
 return t}
function qDone(){return D.quiz&&D.quiz.length&&st.qa&&D.quiz.every((q,i)=>st.qa[i]!=null)}
function prog(){const Q=(D.quiz&&D.quiz.length)?1:0,L=D.lessons.length,C=D.build.steps.length;let n=0;D.lessons.forEach((l,i)=>{if(st['q'+i])n++});D.build.steps.forEach((s,i)=>{if(st['c'+i])n++});if(Q&&qDone())n++;return (L+C+Q)?n/(L+C+Q):0}
function qScore(){let n=0;D.quiz.forEach((q,i)=>{if((st.qa||{})[i]===q.answer)n++});return n}
function pick(i,k){st.qa=st.qa||{};if(st.qa[i]!=null)return;st.qa[i]=k;if(qDone()){st.qs=[qScore(),D.quiz.length];if(!st.qs1)st.qs1=st.qs.slice()}save();render();const e=document.getElementById('e'+i);if(e)e.focus({preventScroll:true})}
function retry(){st.qa={};delete st.qs;save();render();const e=document.getElementById('o0_0');if(e)e.focus()}
const isBoss=!!(D.build&&D.build.boss&&D.build.boss.length),isFin=D.day===D.total;
document.body.className=isFin?'fin':isBoss?'boss':'';
const lk=s=>esc(s).replace(/https?:\/\/[^\s<']*[^\s<.,;:)']/g,m=>'<a href="'+m+'" target="_blank" rel="noopener">'+m+'</a>');
function list(a,tag,cls){return '<'+tag+(cls?' class="'+cls+'"':'')+'>'+(a||[]).map(i=>'<li>'+lk(x(i))+'</li>').join('')+'</'+tag+'>'}
const lab=(t,k)=>'<div class="lab'+(k?' k-'+k:'')+'"><span class="dotc"></span>'+t+'</div>';
const kn=n=>'<span class="kn">'+ic(n)+'</span>';
const slider=p=>'<div class="slider"><i style="width:calc('+p+'% - 6px)"></i><b style="left:clamp(13px,'+p+'%,calc(100% - 13px))"></b></div>';
function quiz(){if(!D.quiz||!D.quiz.length)return '';const a=st.qa||{};let ok=0;const L=u('letters');
 const pips='<div class="pips well" aria-hidden="true">'+D.quiz.map((q,i)=>'<i class="'+(a[i]==null?'':a[i]===q.answer?'r':'w')+'"></i>').join('')+'</div>';
 const qs=D.quiz.map((q,i)=>{const c=a[i];if(c===q.answer)ok++;return '<div class="qz"><p class="qq"><span class="qn">'+(i+1)+'</span><span>'+lk(x(q.q))+'</span></p>'+q.options.map((o,k)=>{let cls='opt',mk='<span></span>';if(c!=null){if(k===q.answer){cls+=' right';mk=ic('check','mk')}else if(k===c){cls+=' wrong';mk=ic('x','mk')}}return '<button class="'+cls+'" id="o'+i+'_'+k+'"'+(c!=null?' disabled':'')+' onclick="pick('+i+','+k+')"><span class="lt">'+(L[k]||k+1)+'</span><span>'+esc(x(o))+'</span>'+mk+'</button>'}).join('')+(c!=null?'<p class="exp '+(c===q.answer?'r':'w')+'" id="e'+i+'" tabindex="-1"><b>'+(c===q.answer?u('right'):u('wrong'))+'</b>'+lk(x(q.explain))+'</p>':'')+'</div>'}).join('');
 return '<section class="card glass quiz">'+lab(u('quiz'),'gold')+'<p class="muted" style="margin:-6px 0 14px">'+u('quizSub')+'</p>'+pips+qs+(qDone()?'<div class="score well" role="status"><span class="eyebrow">'+u('score')+'</span><span class="lcd" aria-label="'+ok+' / '+D.quiz.length+'">'+seg(ok+'/'+D.quiz.length)+'</span>'+(st.qs1?'<span class="muted">'+u('first')+': '+st.qs1[0]+'/'+st.qs1[1]+'</span>':'')+'<div class="row"><button class="btn ghost" id="retry" onclick="retry()">'+u('retry')+'</button></div></div>':'')+'</section>'}
function vid(v){if(!v)return '';const link=v.url?'<a href="'+esc(v.url)+'" target="_blank" rel="noopener">'+esc(x(v.title)||v.url)+'</a>'+(v.channel?' <span class="muted">· '+esc(v.channel)+(v.length?' · '+esc(v.length):'')+'</span>':''):'';const s=v.search?'<a href="https://www.youtube.com/results?search_query='+encodeURIComponent(v.search)+'" target="_blank" rel="noopener">'+u('noVid')+': '+esc(v.search)+'</a>':'';const alt=v.alt&&v.alt.url?'<br><span class="eyebrow">UA</span> <a href="'+esc(v.alt.url)+'" target="_blank" rel="noopener">'+esc(v.alt.title||v.alt.url)+'</a>'+(v.alt.channel?' <span class="muted">· '+esc(v.alt.channel)+'</span>':''):'';return '<div class="vid well">'+kn('play')+'<div><b>'+u('more')+'?</b><br>'+(link||s)+alt+(link&&s?'<br><span class="muted" style="font-size:14px">'+s+'</span>':'')+'</div></div>'}
function morning(){const m=D.morning;if(!m)return '';const q=m.quote||{};
 let shelf='';if(D.day>0){shelf='<div class="shelf" aria-hidden="true">';let g='';for(let d=0;d<D.day;d++){let p=0;try{p=(JSON.parse(localStorage.getItem('devteam:'+D.learner+':'+d))||{}).pct||0}catch(e){}g+='<i class="'+(p>=1?'d':'')+(d>0&&d%5===0?' bs':'')+'"></i>';if(d%5===0||d===D.day-1){shelf+='<span class="wkg">'+g+'</span>';g=''}}shelf+='</div>'}
 const qt=lang==='uk'&&q.original?q.original:x(q.text);
 return '<section class="card glass morning"><div class="mgrid">'+(m.sofar?'<div>'+lab(u('sofar'),'gold')+shelf+'<p class="mtxt">'+lk(x(m.sofar))+'</p></div>':'')+(m.today?'<div>'+lab(u('todayL'))+'<p class="mtxt">'+lk(x(m.today))+'</p></div>':'')+'</div>'+(m.cheer?'<p class="cheer">'+esc(x(m.cheer))+'</p>':'')+(qt?'<figure class="quote well">'+kn('quote')+'<blockquote>'+esc(qt)+'</blockquote>'+(q.author?'<figcaption>'+esc(x(q.author))+'</figcaption>':'')+'</figure>':'')+'</section>'}
function setLang(l){lang=l;try{localStorage.setItem('devteam:lang',lang)}catch(e){};render()}
function toggleLang(){setLang(lang==='uk'?'en':'uk')}
/* keep open sections and keyboard focus across re-renders */
const openD=new Set();
function tg(e){if(e.open)openD.add(e.id);else openD.delete(e.id)}
const op=id=>openD.has(id)?' open':'';
function render(){const ae=document.activeElement,fid=ae&&(ae.id||(ae.getAttribute('data-th')?'th-'+ae.getAttribute('data-th'):ae.getAttribute('lang')&&ae.closest('.seg')?'lg-'+ae.getAttribute('lang'):''));
 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);
 const b=D.build,P=Math.round(prog()*100);
 document.getElementById('top').innerHTML='<div class="topin glass"><a class="maplink" href="'+esc(D.mapHref)+'">'+kn('map')+u('map')+'</a><div class="crumb"><b>'+esc(x(D.learnerName))+'</b><span>'+u('week')+' '+D.week+'</span><span>'+u('day')+' '+D.day+' '+u('of')+' '+D.total+'</span></div>'+controls(lang,'setLang')+'</div><div class="tline"><i style="width:'+P+'%"></i></div>';
 const state=w=>w<D.week?'b':w===D.week?'n':'p';
 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 let wk='';if(D.weekInfo){const w=D.weekInfo;wk='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}
 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p>'+(b.next?'<div class="back well">'+kn('arrow')+'<div><b>'+u('comes')+'</b><br>'+lk(x(b.next))+'</div></div>':'')+'<div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.assetFiles&&D.assetFiles.length?'<p class="files">'+ic('folder')+'<span>'+u('filesL')+' '+D.assetFiles.map(f=>'<a href="assets/'+encodeURIComponent(f)+'" target="_blank" rel="noopener">'+esc(f)+'</a>').join(', ')+'</span></p>':D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+=handinCard();h+=beforeCard();
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div><label class="rcpt" for="r'+i+'"><span class="eyebrow">'+u('rcpt')+'</span><textarea id="r'+i+'" rows="2" placeholder="'+esc(u('rcptPh'))+'" oninput="st.r'+i+'=this.value;save()">'+esc(st['r'+i]||'')+'</textarea></label>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+hList()+chkList()+(hasClip?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<h3>1 · '+u('copyR')+'</h3><p class="muted">'+u('report')+'</p><div class="row"><button class="btn ghost" onclick="cp(reportText())">'+ic('copy')+u('copyR')+'</button></div><h3>2 · '+u('ship')+'</h3>'+hf()+'<p class="muted" style="margin:12px 0 0">'+u('hNote')+'</p></section>';
 h+=qCard();h+=wk;
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();
</script>

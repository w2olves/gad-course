<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 22</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

details{margin-top:22px;border-radius:20px;background:var(--well);box-shadow:var(--press);padding:0 18px}

<script id="data" type="application/json">{"learner": "ib-vitaliy-6b628c48", "learnerName": {"en": "Vitaliy", "uk": "Віталій"}, "day": 22, "week": 5, "total": 60, "title": {"en": "Your island on paper: a map to scale", "uk": "Твій острів на папері: мапа в масштабі"}, "theme": {"en": "Week 5: Your real place and your island on paper", "uk": "Тиждень 5: Твоє реальне місце і твій острів на папері"}, "build": {"item": {"en": "island_map.kra and island_map.png: your island drawn north up at 1 px = 1 m on a 2 x 2 km square of sea, with map_notes.md", "uk": "island_map.kra і island_map.png: твій острів, намальований північчю догори в масштабі 1 px = 1 м на квадраті моря 2 x 2 км, разом із map_notes.md"}, "why": {"en": "Studios draw the map before anyone touches the terrain. The map fixes the scale, the coast, the districts, the roads and the flight route, so the terrain, the planting and the flying agree for the rest of the course. Yours borrows its proportions from your real place, so the harbour, the slopes and the roads make sense. On Day 26 this picture becomes your terrain: whatever you draw today is where it will be built.", "uk": "Студії малюють мапу, перш ніж хтось торкнеться рельєфу. Мапа фіксує масштаб, узбережжя, райони, дороги й маршрут польоту, тож рельєф, рослини і польоти узгоджуються до кінця курсу. Твоя мапа бере пропорції з реального місця, тому гавань, схили й дороги мають сенс. У День 26 цей малюнок стане твоїм рельєфом: що намалюєш сьогодні, там його і буде збудовано."}, "where": {"en": "A 2 x 2 km square of sea, north up, with your island 0.9 to 1.2 km across near the middle. The map's centre is (0, 0); X grows east (to the right) and Y grows south (downwards), exactly as Unreal will read it on Day 26.", "uk": "Квадрат моря 2 x 2 км, північ угорі, а твій острів завширшки від 0,9 до 1,2 км лежить ближче до середини. Центр мапи — (0, 0); X зростає на схід (праворуч), а Y — на південь (донизу), саме так, як Unreal прочитає її в День 26."}, "spec": [{"en": "island_map.kra, 2000 x 2000 px at 1 px = 1 m, with layers named sea, guide, land, height, water, districts, roads, route, labels and scale_north; island_map.png exported from it.", "uk": "island_map.kra, 2000 x 2000 px у масштабі 1 px = 1 м, із шарами sea, guide, land, height, water, districts, roads, route, labels і scale_north; із нього експортовано island_map.png."}, {"en": "The coast: an island 0.9 to 1.2 km on its longest axis, shaped from your real place and changed into your own; headlands (high points of land that stick out into the sea) and bays (curves of sea that cut into the land), never a straight or smooth line; beaches only in sheltered bays, cliffs on headlands that face the open sea.", "uk": "Узбережжя: острів завдовжки від 0,9 до 1,2 км за найдовшою віссю, сформований за твоїм реальним місцем і перероблений на твій власний; миси (високі ділянки суші, що виступають у море) і затоки (вигини моря, що врізаються в сушу), ніколи не пряма чи гладка лінія; пляжі лише в захищених затоках, скелі на мисах, звернених до відкритого моря."}, {"en": "Height shading or contour lines every 25 m up to the summit (the highest point), with its height written; the summit off-centre; streams that run down valleys to bays.", "uk": "Затінення висот або горизонталі через кожні 25 м аж до вершини (найвищої точки) із записаною висотою; вершина не в центрі; струмки течуть долинами до заток."}, {"en": "Two red 200 x 200 px boxes (200 x 200 m), called districts (areas you will later build in full detail): district 1, the waterfront, round the harbour; district 2 with a different character (a hillside village, a lighthouse headland or a farm valley), at least 300 m away. Two or three more named areas, such as a pine ridge or a summit lookout.", "uk": "Два червоні квадрати 200 x 200 px (200 x 200 м), які називаються районами (ділянки, які ти згодом збудуєш у повній деталізації): район 1, набережна, навколо гавані; район 2 з іншим характером (село на схилі пагорба, мис із маяком або долина з фермами), щонайменше за 300 м від першого. Ще дві-три іменовані ділянки, наприклад сосновий хребет або оглядовий майданчик на вершині."}, {"en": "Roads that follow the contours and zigzag where the slope is steep, joining both districts; a 10 x 10 m launch pad near district 1 (the spot where every drone flight starts).", "uk": "Дороги, що йдуть за горизонталями і петляють серпантином там, де схил крутий, і з'єднують обидва райони; стартовий майданчик 10 x 10 м біля району 1 (місце, звідки починається кожен політ дрона)."}, {"en": "The scenic route: a loop of about 2 km from the launch pad through both districts, drawn with arrows and passing at least three named landmarks (tall, easy-to-spot features that tell a pilot where they are).", "uk": "Мальовничий маршрут: петля близько 2 км від стартового майданчика через обидва райони, намальована стрілками, що проходить повз щонайменше три іменовані орієнтири (високі, помітні об'єкти, які підказують пілоту, де він)."}, {"en": "map_notes.md: the longest axis, the summit height, each district's use and why it sits there, both districts' corners as X and Y in metres, the launch pad's position and the route's length.", "uk": "map_notes.md: найдовша вісь, висота вершини, призначення кожного району і чому він розташований саме там, кути обох районів як X і Y у метрах, позиція стартового майданчика і довжина маршруту."}], "piece1": "the canvas, the coast and the height (shared with the lessons)", "piece2": {"en": "Districts, roads and the scenic route, on your own", "uk": "Райони, дороги й мальовничий маршрут, самостійно"}, "steps": [{"text": {"en": "Set up island_map.kra: 2000 x 2000 px, the ten layers, the sea filled, a 100 px scale bar and a north arrow. Check: the rulers (View > Show Rulers) read 2000 along both edges and the scale bar is exactly 100 px.", "uk": "Налаштуй island_map.kra: 2000 x 2000 px, десять шарів, залите море, масштабна лінійка 100 px і стрілка півночі. Перевірка: лінійки (View > Show Rulers) показують 2000 уздовж обох країв, а масштабна лінійка має рівно 100 px."}, "lesson": 1}, {"text": {"en": "Put osm_view.png on the guide layer at true scale (Measure tool, then Ctrl+T), at 30 % opacity, locked. Check: the longest axis you measured on Day 21 is the same number of pixels as metres.", "uk": "Поклади osm_view.png на шар guide у справжньому масштабі (інструмент Measure, потім Ctrl+T) з непрозорістю 30 % і заблокуй його. Перевірка: найдовша вісь із твоїх вимірів Дня 21 має стільки пікселів, скільки в ній метрів."}, "lesson": 1}, {"text": {"en": "Paint the land: your island 0.9 to 1.2 km across, shaped from the guide and changed into your own. Check: the Measure tool reads 900 to 1200 px along the longest axis.", "uk": "Намалюй сушу: твій острів завширшки від 0,9 до 1,2 км, сформований за шаром guide і перероблений на твій власний. Перевірка: інструмент Measure показує від 900 до 1200 px уздовж найдовшої осі."}, "lesson": 2}, {"text": {"en": "Shape the coast: two or three bays and two headlands; mark beaches in sheltered bays and cliffs on headlands that face the open sea. Check: no straight stretch longer than about 50 px, and every beach sits inside a bay.", "uk": "Сформуй узбережжя: дві-три затоки і два миси; познач пляжі в захищених затоках і скелі на мисах, звернених до відкритого моря. Перевірка: немає прямих ділянок довших за приблизно 50 px, і кожен пляж лежить у затоці."}, "lesson": 2}, {"text": {"en": "Height: contours or shading every 25 m up to an off-centre summit, with its height written. Check: the lines bunch where you want steep ground and spread out where the districts need flat ground.", "uk": "Висоти: горизонталі або затінення через кожні 25 м аж до вершини не в центрі, із записаною висотою. Перевірка: лінії згущуються там, де тобі потрібен крутий схил, і розходяться там, де районам потрібна рівна земля."}, "lesson": 2}, {"text": {"en": "Streams (and a small lake if you want one) from the hills down into your bays. Check: no stream climbs across a contour.", "uk": "Струмки (і невелике озеро, якщо хочеш) від пагорбів донизу до твоїх заток. Перевірка: жоден струмок не піднімається через горизонталь."}, "lesson": 2}, {"text": {"en": "District 1: a red 200 x 200 px box round the harbour. Check: it holds the quay, some water, the row of buildings and a road.", "uk": "Район 1: червоний квадрат 200 x 200 px навколо гавані. Перевірка: у ньому є причал, трохи води, ряд будівель і дорога."}, "lesson": 3}, {"text": {"en": "District 2: choose its character, write why, and draw its red box where that character really grows. Check: it is at least 300 m from district 1, and your Day 21 photos show the same character.", "uk": "Район 2: вибери його характер, напиши чому і намалюй червоний квадрат там, де такий характер справді виникає. Перевірка: він щонайменше за 300 м від району 1, а твої фото з Дня 21 показують той самий характер."}, "lesson": 3}, {"text": {"en": "Roads: the main road between the districts and one smaller track, following the contours. Check: where contours bunch, your road zigzags.", "uk": "Дороги: головна дорога між районами і одна менша стежка, що йдуть за горизонталями. Перевірка: там, де горизонталі згущуються, твоя дорога петляє серпантином."}, "lesson": 4}, {"text": {"en": "The launch pad and the scenic route: a loop of about 2 km with arrows and three named landmarks. Check: the measured total is 1800 to 2500 m and the loop passes through both red boxes.", "uk": "Стартовий майданчик і мальовничий маршрут: петля близько 2 км зі стрілками і трьома іменованими орієнтирами. Перевірка: виміряна загальна довжина від 1800 до 2500 м, і петля проходить через обидва червоні квадрати."}, "lesson": 4}, {"text": {"en": "Write map_notes.md: the longest axis, the summit height, each district's use and why it sits there, the corners of both boxes, the launch pad position and the route length. Check: every position is written as X and Y in metres from the centre.", "uk": "Напиши map_notes.md: найдовша вісь, висота вершини, призначення кожного району і чому він саме там, кути обох квадратів, позиція стартового майданчика і довжина маршруту. Перевірка: кожну позицію записано як X і Y у метрах від центру."}, "lesson": 3}, {"text": {"en": "Hide the guide layer, export island_map.png (File > Export) and record a 60-second screen clip panning slowly across the map at 100 % zoom (Win+Alt+R). Save today's clip as clip_day22.mp4. Check: island_map.png opens at 2000 x 2000 px, and the clip shows both red boxes and the route.", "uk": "Сховай шар guide, експортуй island_map.png (File > Export) і запиши 60-секундний відеозапис екрана, повільно ведучи по мапі при масштабі 100 % (Win+Alt+R). Збережи сьогоднішній запис як clip_day22.mp4. Перевірка: island_map.png відкривається з розміром 2000 x 2000 px, а запис показує обидва червоні квадрати і маршрут."}, "lesson": 1}], "assets": []}, "lessons": [{"title": {"en": "A map canvas at real scale", "uk": "Полотно для мапи в реальному масштабі"}, "minutes": 40, "goals": [{"en": "Set up a Krita canvas where 1 pixel is 1 metre: 2000 x 2000 px for a 2 x 2 km square, north up.", "uk": "Налаштувати полотно Krita, де 1 піксель — це 1 метр: 2000 x 2000 px для квадрата 2 x 2 км, північ угорі."}, {"en": "Use the map's coordinates (numbers that say where a point is): the centre is (0, 0), X grows east and Y grows south, so X = pixel across - 1000 and Y = pixel down - 1000.", "uk": "Користуватися координатами мапи (числами, що кажуть, де розташована точка): центр — (0, 0), X зростає на схід, а Y — на південь, тож X = піксель по горизонталі - 1000, а Y = піксель по вертикалі - 1000."}, {"en": "Scale a guide picture to your map's scale from one length you measured.", "uk": "Масштабувати допоміжне зображення до масштабу твоєї мапи за однією виміряною довжиною."}], "doalong": [{"en": "In Krita: File > New, Width 2000 and Height 2000 pixels, then Create. You should see a large white square that stands for 2 x 2 km.", "uk": "У Krita: File > New, Width 2000 і Height 2000 пікселів, потім Create. Ти маєш побачити великий білий квадрат, що позначає 2 x 2 км."}, {"en": "In the Layers docker (bottom right; Settings > Dockers > Layers if you can't see it) click + to add layers, and double-click each name to rename it: sea, guide, land, height, water, districts, roads, route, labels, scale_north. You should see ten named layers.", "uk": "На панелі Layers (внизу праворуч; Settings > Dockers > Layers, якщо її не видно) натискай +, щоб додати шари, і двічі клацай кожну назву, щоб перейменувати: sea, guide, land, height, water, districts, roads, route, labels, scale_north. Ти маєш побачити десять названих шарів."}, {"en": "Fill the sea layer pale blue (the Fill tool, the paint bucket). On scale_north draw a 100 px line (hold Shift for a straight line), write '100 m' under it, and draw an N arrow at the top right. You should see a scale bar and a north arrow.", "uk": "Залий шар sea блідо-блакитним (інструмент Fill, відро з фарбою). На шарі scale_north намалюй лінію 100 px (утримуй Shift для прямої лінії), напиши під нею «100 м» і намалюй стрілку N угорі праворуч. Ти маєш побачити масштабну лінійку і стрілку півночі."}, {"en": "View > Show Rulers (not Ctrl+R: in Krita that picks the Rectangular Selection tool). Rulers in pixels appear along the top and left. Find 1000 on both: that point is (0, 0). A point at 1300 across and 700 down is X 300, Y -300 (east and north of the centre). You should be able to read any point in metres.", "uk": "View > Show Rulers (не Ctrl+R: у Krita це вибирає інструмент Rectangular Selection). Угорі й ліворуч з'являються лінійки в пікселях. Знайди 1000 на обох: ця точка — (0, 0). Точка на 1300 по горизонталі і 700 по вертикалі — це X 300, Y -300 (на схід і на північ від центру). Тепер ти можеш прочитати будь-яку точку в метрах."}, {"en": "Click the guide layer, then drag osm_view.png from File Explorer onto the canvas and choose Insert as New Layer if Krita asks. Delete the empty guide layer and rename the new one guide. With the Measure tool (as on Day 21) drag along your place's longest axis and read its length in pixels. Press Ctrl+T (the Transform tool) and type the scale in Tool Options: (metres ÷ pixels x 100) %. You should see the longest axis as many pixels long as it is metres.", "uk": "Клацни шар guide, потім перетягни osm_view.png із File Explorer на полотно і вибери Insert as New Layer, якщо Krita запитає. Видали порожній шар guide і перейменуй новий на guide. Інструментом Measure (як у День 21) проведи вздовж найдовшої осі свого місця і прочитай її довжину в пікселях. Натисни Ctrl+T (інструмент Transform) і введи масштаб у Tool Options: (метри ÷ пікселі x 100) %. Ти маєш побачити, що найдовша вісь має стільки пікселів, скільки в ній метрів."}, {"en": "Set the guide layer's opacity to 30 % and click its padlock to lock it. You should see your real place faintly, at true size, under everything else.", "uk": "Встанови непрозорість шару guide на 30 % і натисни на його замок, щоб заблокувати. Ти маєш ледь бачити своє реальне місце у справжньому розмірі під усім іншим."}], "play": {"en": "Coordinate quick-fire: the tutor reads me ten pixel positions; I give each as X and Y in metres within 10 seconds. A wrong sign on Y costs double.", "uk": "Бліц координат: тьютор зачитує мені десять позицій у пікселях; я називаю кожну як X і Y у метрах за 10 секунд. Неправильний знак у Y коштує подвійно."}, "video": {"url": "https://www.youtube.com/watch?v=W0d6635Rits", "title": "Unreal Engine Co-ordinates Explained", "channel": "HyperDev", "length": "3:24", "search": "unreal engine coordinates explained units"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: A map canvas at real scale (Day 22, lesson 1 of 4).\nToday's build: island_map.kra and island_map.png: your island drawn north up at 1 px = 1 m on a 2 x 2 km square of sea, with map_notes.md.\n\nBy the end of this lesson I can:\n1. Set up a Krita canvas where 1 pixel is 1 metre: 2000 x 2000 px for a 2 x 2 km square, north up.\n2. Use the map's coordinates (numbers that say where a point is): the centre is (0, 0), X grows east and Y grows south, so X = pixel across - 1000 and Y = pixel down - 1000.\n3. Scale a guide picture to your map's scale from one length you measured.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (You have one real coastal place, measured on OpenStreetMap, with 15 or more credited reference photos.), what I will learn today (You draw island_map.png to scale, with your coast, hills, streams, roads, the scenic route and two 200 x 200 m districts.), encourage me (A map grows from small decisions, so draw the coast first and let the rest follow; any line can be improved tomorrow.), and share today's quote: \"It is not down on any map; true places never are.\" (Herman Melville).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 19: why do you lock exposure (Min EV100 = Max EV100) before you compare two screenshots? | Day 17: how do you check in Krita that a texture tiles without a seam?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Coordinate quick-fire: the tutor reads me ten pixel positions; I give each as X and Y in metres within 10 seconds. A wrong sign on Y costs double.\n6. Do-along on today's build (the canvas, the coast and the height (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - In Krita: File > New, Width 2000 and Height 2000 pixels, then Create. You should see a large white square that stands for 2 x 2 km.\n   - In the Layers docker (bottom right; Settings > Dockers > Layers if you can't see it) click + to add layers, and double-click each name to rename it: sea, guide, land, height, water, districts, roads, route, labels, scale_north. You should see ten named layers.\n   - Fill the sea layer pale blue (the Fill tool, the paint bucket). On scale_north draw a 100 px line (hold Shift for a straight line), write '100 m' under it, and draw an N arrow at the top right. You should see a scale bar and a north arrow.\n   - View > Show Rulers (not Ctrl+R: in Krita that picks the Rectangular Selection tool). Rulers in pixels appear along the top and left. Find 1000 on both: that point is (0, 0). A point at 1300 across and 700 down is X 300, Y -300 (east and north of the centre). You should be able to read any point in metres.\n   - Click the guide layer, then drag osm_view.png from File Explorer onto the canvas and choose Insert as New Layer if Krita asks. Delete the empty guide layer and rename the new one guide. With the Measure tool (as on Day 21) drag along your place's longest axis and read its length in pixels. Press Ctrl+T (the Transform tool) and type the scale in Tool Options: (metres ÷ pixels x 100) %. You should see the longest axis as many pixels long as it is metres.\n   - Set the guide layer's opacity to 30 % and click its padlock to lock it. You should see your real place faintly, at true size, under everything else.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Unreal Engine Co-ordinates Explained\" by HyperDev: https://www.youtube.com/watch?v=W0d6635Rits\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "A believable coastline and height", "uk": "Правдоподібне узбережжя і висоти"}, "minutes": 40, "goals": [{"en": "Draw a coast like a real one: headlands and bays, beaches only in sheltered bays, cliffs where high ground faces the open sea.", "uk": "Малювати узбережжя, як справжнє: миси і затоки, пляжі лише в захищених затоках, скелі там, де висока земля стоїть проти відкритого моря."}, {"en": "Show height with contour lines (each line joins points of the same height) or with shading that gets darker as the land climbs, one step every 25 m.", "uk": "Показувати висоту горизонталями (кожна лінія з'єднує точки однакової висоти) або затіненням, яке темнішає, коли земля піднімається, по одному кроку на кожні 25 м."}, {"en": "Place the summit off-centre, as on real islands, and let streams run down valleys into bays.", "uk": "Розміщувати вершину не в центрі, як на справжніх островах, і пускати струмки долинами до заток."}], "doalong": [{"en": "On the land layer, paint your island with a hard round brush in a sand or green colour, following the guide where you like it and changing it where you don't. You should see an island near the middle of the sea.", "uk": "На шарі land намалюй острів жорстким круглим пензлем піщаного або зеленого кольору, ідучи за шаром guide там, де тобі подобається, і змінюючи там, де ні. Ти маєш побачити острів ближче до середини моря."}, {"en": "Check the size with the Measure tool along the longest axis. You should read 900 to 1200 px; if not, select the land layer, Ctrl+T, and scale it.", "uk": "Перевір розмір інструментом Measure вздовж найдовшої осі. Має бути від 900 до 1200 px; якщо ні, вибери шар land, натисни Ctrl+T і зміни масштаб."}, {"en": "Break every smooth or straight stretch: push in two or three bays and pull out two headlands. You should see no straight piece of coast longer than about 50 px.", "uk": "Розбий кожну гладку чи пряму ділянку: втисни дві-три затоки і витягни два миси. Ти не маєш бачити прямих ділянок узбережжя довших за приблизно 50 px."}, {"en": "On the height layer, draw the 25 m contour about 30 to 100 px inside the coast, then 50 m, 75 m and so on up to the summit. Put the summit nearer one end, not dead centre, and write its height beside it (your real place's height, or less if your island is smaller). You should see rings that sit closer together where the land is steep.", "uk": "На шарі height намалюй горизонталь 25 м приблизно за 30-100 px усередині від берега, потім 50 м, 75 м і так далі до вершини. Розмісти вершину ближче до одного краю, не точно в центрі, і напиши поруч її висоту (висоту твого реального місця або меншу, якщо твій острів менший). Ти маєш побачити кільця, які ближче одне до одного там, де земля крута."}, {"en": "On the water layer, draw two or three streams from the high ground down the valleys into your bays. You should see each stream cross the contours only going downhill.", "uk": "На шарі water намалюй два-три струмки від високої землі долинами донизу до твоїх заток. Ти маєш побачити, що кожен струмок перетинає горизонталі лише вниз за схилом."}], "play": {"en": "Map critic: the tutor describes a bad island map (a round coast, the summit dead centre, a stream crossing a ridge, no scale bar). I find each fault and give the real-world reason.", "uk": "Критик мап: тьютор описує погану мапу острова (кругле узбережжя, вершина точно в центрі, струмок перетинає хребет, немає масштабної лінійки). Я знаходжу кожну помилку і пояснюю, чому в реальному світі так не буває."}, "video": {"url": "https://www.youtube.com/watch?v=ztemzsxso0U", "title": "Coastal Landforms for Fantasy Mapping", "channel": "Artifexian", "length": "14:13", "search": "coastal landforms for map making"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: A believable coastline and height (Day 22, lesson 2 of 4).\nToday's build: island_map.kra and island_map.png: your island drawn north up at 1 px = 1 m on a 2 x 2 km square of sea, with map_notes.md.\nEarlier today I already did: lesson 1 (A map canvas at real scale). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Draw a coast like a real one: headlands and bays, beaches only in sheltered bays, cliffs where high ground faces the open sea.\n2. Show height with contour lines (each line joins points of the same height) or with shading that gets darker as the land climbs, one step every 25 m.\n3. Place the summit off-centre, as on real islands, and let streams run down valleys into bays.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Map critic: the tutor describes a bad island map (a round coast, the summit dead centre, a stream crossing a ridge, no scale bar). I find each fault and give the real-world reason.\n4. Do-along on today's build (the canvas, the coast and the height (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - On the land layer, paint your island with a hard round brush in a sand or green colour, following the guide where you like it and changing it where you don't. You should see an island near the middle of the sea.\n   - Check the size with the Measure tool along the longest axis. You should read 900 to 1200 px; if not, select the land layer, Ctrl+T, and scale it.\n   - Break every smooth or straight stretch: push in two or three bays and pull out two headlands. You should see no straight piece of coast longer than about 50 px.\n   - On the height layer, draw the 25 m contour about 30 to 100 px inside the coast, then 50 m, 75 m and so on up to the summit. Put the summit nearer one end, not dead centre, and write its height beside it (your real place's height, or less if your island is smaller). You should see rings that sit closer together where the land is steep.\n   - On the water layer, draw two or three streams from the high ground down the valleys into your bays. You should see each stream cross the contours only going downhill.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Coastal Landforms for Fantasy Mapping\" by Artifexian: https://www.youtube.com/watch?v=ztemzsxso0U\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Districts where real ones grow", "uk": "Райони там, де виникають справжні"}, "minutes": 40, "goals": [{"en": "Explain a district: an area of about 200 x 200 m with one character, which you will build in full detail later in the course.", "uk": "Пояснити, що таке район: ділянка приблизно 200 x 200 м з одним характером, яку ти згодом у курсі збудуєш у повній деталізації."}, {"en": "Place districts where real ones grow: a waterfront at a sheltered harbour, a hillside village on a gentle sunny slope, a lighthouse on an exposed headland, a farm valley on flat ground by a stream.", "uk": "Розміщувати райони там, де виникають справжні: набережна біля захищеної гавані, село на пологому сонячному схилі, маяк на відкритому мисі, долина з фермами на рівній землі біля струмка."}, {"en": "Choose district 2's character from what your real place and your photos show.", "uk": "Вибирати характер району 2 з того, що показують твоє реальне місце і твої фото."}], "doalong": [{"en": "On the districts layer, pick the Rectangular Selection tool. In Tool Options type Width 200 and Height 200 and click the lock icon beside each, then click on your harbour to place the square, dragging it to fit. Edit > Stroke Selection, red, 4 px. You should see a red square holding the quay, some water and the row of buildings.", "uk": "На шарі districts візьми інструмент Rectangular Selection. У Tool Options введи Width 200 і Height 200 і натисни значок замка біля кожного, потім клацни на гавані, щоб поставити квадрат, і перетягни його на місце. Edit > Stroke Selection, червоний, 4 px. Ти маєш побачити червоний квадрат, у якому є причал, трохи води і ряд будівель."}, {"en": "Look at your second-character photos from Day 21 and pick one character: hillside village, lighthouse headland or farm valley. Write the choice and one reason in map_notes.md. You should have one word and one sentence.", "uk": "Переглянь свої фото другого характеру з Дня 21 і вибери один характер: село на схилі, мис із маяком або долина з фермами. Запиши вибір і одну причину в map_notes.md. У тебе має бути одне слово й одне речення."}, {"en": "Draw its red 200 x 200 px box the same way, where that character would really grow (a village on a gentle slope facing the sun, a lighthouse on the most exposed point, a farm valley on the flattest ground by a stream). Measure the gap with the Measure tool. You should see it at least 300 px from district 1.", "uk": "Так само намалюй його червоний квадрат 200 x 200 px там, де такий характер справді виник би (село на пологому схилі, зверненому до сонця, маяк на найвідкритішому мисі, долина з фермами на найрівнішій землі біля струмка). Виміряй відстань інструментом Measure. Ти маєш побачити, що він щонайменше за 300 px від району 1."}, {"en": "With a thin brush, outline two or three more named areas, for example Pine Ridge or Summit Lookout, and label them on the labels layer. You should see your island divided into places with names.", "uk": "Тонким пензлем обведи ще дві-три іменовані ділянки, наприклад Pine Ridge або Summit Lookout, і підпиши їх на шарі labels. Ти маєш побачити свій острів, поділений на місця з назвами."}, {"en": "Read each box's four corners on the rulers, subtract 1000 from both numbers, and write them in map_notes.md as X and Y in metres. You should see numbers like (-420, 150).", "uk": "Прочитай чотири кути кожного квадрата на лінійках, відніми 1000 від обох чисел і запиши їх у map_notes.md як X і Y у метрах. Ти маєш побачити числа на кшталт (-420, 150)."}], "play": {"en": "Town planner: the tutor names a spot on my island (the windy north point, the sunny south slope, the flat valley floor) and I say what would really grow there and why, in one sentence each.", "uk": "Містобудівник: тьютор називає місце на моєму острові (вітряний північний мис, сонячний південний схил, рівне дно долини), і я кажу, що там справді виникло б і чому, по одному реченню на кожне."}, "video": {"search": "why towns are built where they are geography site and situation"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Districts where real ones grow (Day 22, lesson 3 of 4).\nToday's build: island_map.kra and island_map.png: your island drawn north up at 1 px = 1 m on a 2 x 2 km square of sea, with map_notes.md.\nEarlier today I already did: lesson 1 (A map canvas at real scale); lesson 2 (A believable coastline and height). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Explain a district: an area of about 200 x 200 m with one character, which you will build in full detail later in the course.\n2. Place districts where real ones grow: a waterfront at a sheltered harbour, a hillside village on a gentle sunny slope, a lighthouse on an exposed headland, a farm valley on flat ground by a stream.\n3. Choose district 2's character from what your real place and your photos show.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Town planner: the tutor names a spot on my island (the windy north point, the sunny south slope, the flat valley floor) and I say what would really grow there and why, in one sentence each.\n4. Do-along on today's build (the canvas, the coast and the height (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - On the districts layer, pick the Rectangular Selection tool. In Tool Options type Width 200 and Height 200 and click the lock icon beside each, then click on your harbour to place the square, dragging it to fit. Edit > Stroke Selection, red, 4 px. You should see a red square holding the quay, some water and the row of buildings.\n   - Look at your second-character photos from Day 21 and pick one character: hillside village, lighthouse headland or farm valley. Write the choice and one reason in map_notes.md. You should have one word and one sentence.\n   - Draw its red 200 x 200 px box the same way, where that character would really grow (a village on a gentle slope facing the sun, a lighthouse on the most exposed point, a farm valley on the flattest ground by a stream). Measure the gap with the Measure tool. You should see it at least 300 px from district 1.\n   - With a thin brush, outline two or three more named areas, for example Pine Ridge or Summit Lookout, and label them on the labels layer. You should see your island divided into places with names.\n   - Read each box's four corners on the rulers, subtract 1000 from both numbers, and write them in map_notes.md as X and Y in metres. You should see numbers like (-420, 150).\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Roads and the scenic route", "uk": "Дороги і мальовничий маршрут"}, "minutes": 40, "goals": [{"en": "Draw roads the way they're built: along contours and up valleys, with switchbacks (tight zigzag turns) where the slope is steep, never straight up a hill.", "uk": "Малювати дороги так, як їх будують: уздовж горизонталей і вгору долинами, із серпантинами (крутими поворотами зигзагом) там, де схил крутий, і ніколи не прямо вгору пагорбом."}, {"en": "Explain the scenic route: the drone flight that shows the island at its best, from the launch pad through both districts and past landmarks, about 2 km long (about 2 minutes at 60 km/h, the length of your final flight video).", "uk": "Пояснити, що таке мальовничий маршрут: політ дрона, що показує острів із найкращого боку, від стартового майданчика через обидва райони і повз орієнтири, завдовжки близько 2 км (близько 2 хвилин при 60 км/год, тривалість твого фінального відео польоту)."}, {"en": "Mark a launch pad and measure the route's length.", "uk": "Позначити стартовий майданчик і виміряти довжину маршруту."}], "doalong": [{"en": "On the roads layer, draw the main road from district 1 to district 2 with a brush about 6 px wide (6 m). Where contour lines bunch together, zigzag it. You should see a road that never crosses many contours in a short distance.", "uk": "На шарі roads намалюй головну дорогу від району 1 до району 2 пензлем завширшки близько 6 px (6 м). Там, де горизонталі згущуються, веди її зигзагом. Ти маєш побачити дорогу, яка ніколи не перетинає багато горизонталей на короткій відстані."}, {"en": "Add a smaller track, 3 px wide, to one more named area. You should see every district reachable by road.", "uk": "Додай меншу стежку завширшки 3 px до ще однієї іменованої ділянки. Ти маєш побачити, що до кожного району можна дістатися дорогою."}, {"en": "Mark the launch pad: a 10 x 10 px square on open, flat ground near district 1, labelled 'Launch'. You should see a small square beside the harbour.", "uk": "Познач стартовий майданчик: квадрат 10 x 10 px на відкритій рівній землі біля району 1 з підписом 'Launch'. Ти маєш побачити маленький квадрат поруч із гаванню."}, {"en": "On the route layer, draw a loop from the launch pad through both red boxes and back, with arrows. Measure it in parts with the Measure tool and add the parts up. You should get 1800 to 2500 m.", "uk": "На шарі route намалюй петлю від стартового майданчика через обидва червоні квадрати і назад, зі стрілками. Виміряй її частинами інструментом Measure і додай частини. У тебе має вийти від 1800 до 2500 м."}, {"en": "Label three landmarks the route passes (for example the lighthouse, the church tower, the summit rock). You should see every turn of the route aimed at something worth looking at.", "uk": "Підпиши три орієнтири, повз які проходить маршрут (наприклад, маяк, церковну вежу, скелю на вершині). Ти маєш побачити, що кожен поворот маршруту спрямований на щось, на що варто подивитися."}], "play": {"en": "Pilot's briefing: I describe my scenic route turn by turn. The tutor 'flies' it and asks what it should look at in each turn; every 'I don't know' becomes a landmark on my map.", "uk": "Інструктаж пілота: я описую свій мальовничий маршрут поворот за поворотом. Тьютор «пролітає» його і запитує, на що дивитися в кожному повороті; кожне «не знаю» стає орієнтиром на моїй мапі."}, "video": {"url": "https://www.youtube.com/watch?v=OBl6n6ECVUA", "title": "Every Major Street Pattern Explained in 9 Minutes", "channel": "Urban Planner Explained", "length": "9:08", "search": "street patterns explained urban planning"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Roads and the scenic route (Day 22, lesson 4 of 4).\nToday's build: island_map.kra and island_map.png: your island drawn north up at 1 px = 1 m on a 2 x 2 km square of sea, with map_notes.md.\nEarlier today I already did: lesson 1 (A map canvas at real scale); lesson 2 (A believable coastline and height); lesson 3 (Districts where real ones grow). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Draw roads the way they're built: along contours and up valleys, with switchbacks (tight zigzag turns) where the slope is steep, never straight up a hill.\n2. Explain the scenic route: the drone flight that shows the island at its best, from the launch pad through both districts and past landmarks, about 2 km long (about 2 minutes at 60 km/h, the length of your final flight video).\n3. Mark a launch pad and measure the route's length.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Pilot's briefing: I describe my scenic route turn by turn. The tutor 'flies' it and asks what it should look at in each turn; every 'I don't know' becomes a landmark on my map.\n4. Do-along on today's build (the canvas, the coast and the height (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - On the roads layer, draw the main road from district 1 to district 2 with a brush about 6 px wide (6 m). Where contour lines bunch together, zigzag it. You should see a road that never crosses many contours in a short distance.\n   - Add a smaller track, 3 px wide, to one more named area. You should see every district reachable by road.\n   - Mark the launch pad: a 10 x 10 px square on open, flat ground near district 1, labelled 'Launch'. You should see a small square beside the harbour.\n   - On the route layer, draw a loop from the launch pad through both red boxes and back, with arrows. Measure it in parts with the Measure tool and add the parts up. You should get 1800 to 2500 m.\n   - Label three landmarks the route passes (for example the lighthouse, the church tower, the summit rock). You should see every turn of the route aimed at something worth looking at.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Every Major Street Pattern Explained in 9 Minutes\" by Urban Planner Explained: https://www.youtube.com/watch?v=OBl6n6ECVUA\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "island_map.kra and island_map.png (2000 x 2000 px)", "uk": "island_map.kra і island_map.png (2000 x 2000 px)"}, {"en": "map_notes.md", "uk": "map_notes.md"}, {"en": "clip_day22.mp4 (60 seconds across your map at 100 % zoom)", "uk": "clip_day22.mp4 (60 секунд по твоїй мапі при масштабі 100 %)"}, {"en": "summary.md", "uk": "summary.md"}], "goal": {"en": "By the end of today you have island_map.png, a 2 x 2 km map at 1 pixel = 1 metre with your island's coast, height, streams, roads, the scenic route and two red 200 x 200 m districts.", "uk": "До кінця сьогоднішнього дня в тебе є island_map.png — мапа 2 x 2 км, де 1 піксель = 1 метр, з узбережжям твого острова, висотами, струмками, дорогами, мальовничим маршрутом і двома червоними районами 200 x 200 м."}, "uses": [{"en": "Day 21: osm_view.png with its measurements, references.md and your hero photos", "uk": "День 21: osm_view.png із вимірами, references.md і твої ключові фото"}, {"en": "Day 4: drawing to scale on Krita layers", "uk": "День 4: малювання в масштабі на шарах Krita"}], "quiz": [{"q": {"en": "On your 2000 x 2000 px map, a lighthouse sits at pixel 1300 across and 700 down. Where is it in map metres?", "uk": "На твоїй мапі 2000 x 2000 px маяк стоїть на пікселі 1300 по горизонталі і 700 по вертикалі. Де він у метрах мапи?"}, "options": [{"en": "X 300, Y -300 (east and north of the centre)", "uk": "X 300, Y -300 (на схід і на північ від центру)"}, {"en": "X -300, Y 300 (west and south of the centre)", "uk": "X -300, Y 300 (на захід і на південь від центру)"}, {"en": "X 1300, Y 700", "uk": "X 1300, Y 700"}, {"en": "X 300, Y 300", "uk": "X 300, Y 300"}], "answer": 0, "explain": {"en": "Subtract 1000 from each pixel number. Y grows south, so a negative Y means north of the centre.", "uk": "Відніми 1000 від кожного числа пікселів. Y зростає на південь, тож від'ємний Y означає північ від центру."}}, {"q": {"en": "You drew a wide sandy beach on a headland that faces the open sea. What would a reviewer say?", "uk": "На твоїй мапі широкий піщаний пляж лежить на мисі, зверненому до відкритого моря. Що скаже рецензент?"}, "options": [{"en": "It's fine: beaches can go anywhere.", "uk": "Усе гаразд: пляжі можуть бути будь-де."}, {"en": "Beaches always need a river nearby.", "uk": "Пляжам завжди потрібна річка поруч."}, {"en": "Waves drop sand in sheltered bays; an exposed headland would have cliffs or rock.", "uk": "Хвилі залишають пісок у захищених затоках; на відкритому мисі були б скелі або камінь."}, {"en": "Make the beach whiter so it reads better.", "uk": "Зроби пляж білішим, щоб він краще читався."}], "answer": 2, "explain": {"en": "Sand settles where the water is calm. Open-sea headlands take the full force of the waves, so they are rock.", "uk": "Пісок осідає там, де вода спокійна. Миси, звернені до відкритого моря, приймають повну силу хвиль, тож там камінь."}}, {"q": {"en": "Why does your main road zigzag up the steep hill?", "uk": "Чому твоя головна дорога петляє зигзагом угору крутим пагорбом?"}, "options": [{"en": "Zigzags look more interesting from the drone.", "uk": "Зигзаги цікавіше виглядають із дрона."}, {"en": "Unreal can't build straight roads.", "uk": "Unreal не вміє будувати прямі дороги."}, {"en": "To make the scenic route longer.", "uk": "Щоб мальовничий маршрут став довшим."}, {"en": "A road straight up a steep slope would be too steep to drive, so real roads follow the contours and switch back.", "uk": "Дорога прямо вгору крутим схилом була б надто крутою для їзди, тож справжні дороги йдуть за горизонталями і повертають серпантином."}], "answer": 3, "explain": {"en": "Roads keep a gentle climb. Where contours bunch, the slope is steep, so the road turns back and forth.", "uk": "Дороги зберігають пологий підйом. Де горизонталі згущуються, схил крутий, тому дорога повертає туди й назад."}}, {"q": {"en": "What does a contour line on your map show?", "uk": "Що показує горизонталь на твоїй мапі?"}, "options": [{"en": "The edge of a district.", "uk": "Межу району."}, {"en": "A line joining points at the same height.", "uk": "Лінію, що з'єднує точки однакової висоти."}, {"en": "A road for the drone.", "uk": "Дорогу для дрона."}, {"en": "Where the sea is 25 m deep.", "uk": "Де глибина моря 25 м."}], "answer": 1, "explain": {"en": "Each contour joins points of equal height. Lines close together mean steep ground; lines far apart mean gentle ground.", "uk": "Кожна горизонталь з'єднує точки однакової висоти. Близькі лінії означають крутий схил; далекі одна від одної — пологий."}}, {"q": {"en": "Your scenic route measures 600 m. Why is that a problem?", "uk": "Твій мальовничий маршрут має 600 м. Чому це проблема?"}, "options": [{"en": "Routes must be exactly 1 km.", "uk": "Маршрути мають бути рівно 1 км."}, {"en": "It is too short for a 2-minute flight through both districts; aim for about 2 km.", "uk": "Він закороткий для 2-хвилинного польоту через обидва райони; ціль — близько 2 км."}, {"en": "It isn't: shorter routes are always better.", "uk": "Це не проблема: коротші маршрути завжди кращі."}], "answer": 1, "explain": {"en": "The final video is about 2 minutes at drone speed, which needs about 2 km. A 600 m route is over in 35 seconds.", "uk": "Фінальне відео триває близько 2 хвилин на швидкості дрона, а для цього потрібно близько 2 км. Маршрут на 600 м закінчується за 35 секунд."}}], "weekInfo": {"week": 5, "title": {"en": "Your real place and your island on paper", "uk": "Твоє реальне місце і твій острів на папері"}, "goal": {"en": "By Friday you have a complete planning pack: one real coastal place with 15 credited photos, island_map.png to scale with two red 200 x 200 m districts and the scenic route, two counted plot plans, two needs lists, reviewed free packs, and the Electric Dreams download under way.", "uk": "До п'ятниці в тебе є повний пакет планування: одне реальне прибережне місце з 15 фото із зазначеним авторством, island_map.png у масштабі з двома червоними районами 200 x 200 м і мальовничим маршрутом, два плани ділянок із підрахованими об'єктами, два списки потреб, переглянуті безкоштовні паки, а завантаження Electric Dreams уже триває."}, "skills": [{"en": "Reference research and image licensing (Creative Commons) for production art", "uk": "Пошук референсів і ліцензування зображень (Creative Commons) для продакшн-арту"}, {"en": "Scaled world maps from OpenStreetMap data, with districts, roads and flight routes", "uk": "Мапи світу в масштабі за даними OpenStreetMap: райони, дороги й маршрути польотів"}, {"en": "Plot plans with item counts, camera positions and drone lanes for level layout", "uk": "Плани ділянок із підрахунком об'єктів, позиціями камер і коридорами для дрона для планування рівня"}, {"en": "Asset sourcing: needs lists, Fab licence checks and best-pieces reviews", "uk": "Пошук асетів: списки потреб, перевірка ліцензій на Fab і огляд найкращих частин"}, {"en": "Pre-production review: consistency checks and a one-page planning board", "uk": "Огляд препродакшну: перевірка узгодженості й дошка планування на одну сторінку"}]}, "morning": {"sofar": {"en": "You have one real coastal place, measured on OpenStreetMap, with 15 or more credited reference photos.", "uk": "У тебе є одне справжнє приморське місце, виміряне в OpenStreetMap, і 15 або більше референсних фото із зазначеними авторами."}, "today": {"en": "You draw island_map.png to scale, with your coast, hills, streams, roads, the scenic route and two 200 x 200 m districts.", "uk": "Сьогодні ти малюєш island_map.png у масштабі: з узбережжям, пагорбами, струмками, дорогами, мальовничим маршрутом і двома районами 200 x 200 м."}, "cheer": {"en": "A map grows from small decisions, so draw the coast first and let the rest follow; any line can be improved tomorrow.", "uk": "Мапа виростає з маленьких рішень, тож спершу намалюй узбережжя, а решта підтягнеться; будь-яку лінію можна покращити завтра."}, "quote": {"text": {"en": "It is not down on any map; true places never are.", "uk": "Його немає на жодній мапі; справжніх місць там не буває ніколи."}, "author": {"en": "Herman Melville", "uk": "Герман Мелвілл"}, "source": "https://en.wikiquote.org/wiki/Moby-Dick"}}, "hasAssets": false, "workPath": "Work\\Assignment\\Day-22-island-map-to-scale", "mapHref": "../../COURSE.html", "prevHref": "../Day-21-real-place-references/START-HERE.html", "nextHref": "../Day-23-two-plot-plans/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Krita and a web browser. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me and don't write code. Keep me moving and make it feel like a game.\n\nToday I build on my own: Districts, roads and the scenic route, on your own.\nIt's part of: island_map.kra and island_map.png: your island drawn north up at 1 px = 1 m on a 2 x 2 km square of sea, with map_notes.md (A 2 x 2 km square of sea, north up, with your island 0.9 to 1.2 km across near the middle. The map's centre is (0, 0); X grows east (to the right) and Y grows south (downwards), exactly as Unreal will read it on Day 26.).\n\nSpec:\n- island_map.kra, 2000 x 2000 px at 1 px = 1 m, with layers named sea, guide, land, height, water, districts, roads, route, labels and scale_north; island_map.png exported from it.\n- The coast: an island 0.9 to 1.2 km on its longest axis, shaped from your real place and changed into your own; headlands (high points of land that stick out into the sea) and bays (curves of sea that cut into the land), never a straight or smooth line; beaches only in sheltered bays, cliffs on headlands that face the open sea.\n- Height shading or contour lines every 25 m up to the summit (the highest point), with its height written; the summit off-centre; streams that run down valleys to bays.\n- Two red 200 x 200 px boxes (200 x 200 m), called districts (areas you will later build in full detail): district 1, the waterfront, round the harbour; district 2 with a different character (a hillside village, a lighthouse headland or a farm valley), at least 300 m away. Two or three more named areas, such as a pine ridge or a summit lookout.\n- Roads that follow the contours and zigzag where the slope is steep, joining both districts; a 10 x 10 m launch pad near district 1 (the spot where every drone flight starts).\n- The scenic route: a loop of about 2 km from the launch pad through both districts, drawn with arrows and passing at least three named landmarks (tall, easy-to-spot features that tell a pilot where they are).\n- map_notes.md: the longest axis, the summit height, each district's use and why it sits there, both districts' corners as X and Y in metres, the launch pad's position and the route's length.\n\nMy checklist:\n1. Set up island_map.kra: 2000 x 2000 px, the ten layers, the sea filled, a 100 px scale bar and a north arrow. Check: the rulers (View > Show Rulers) read 2000 along both edges and the scale bar is exactly 100 px. (from lesson 1)\n2. Put osm_view.png on the guide layer at true scale (Measure tool, then Ctrl+T), at 30 % opacity, locked. Check: the longest axis you measured on Day 21 is the same number of pixels as metres. (from lesson 1)\n3. Paint the land: your island 0.9 to 1.2 km across, shaped from the guide and changed into your own. Check: the Measure tool reads 900 to 1200 px along the longest axis. (from lesson 2)\n4. Shape the coast: two or three bays and two headlands; mark beaches in sheltered bays and cliffs on headlands that face the open sea. Check: no straight stretch longer than about 50 px, and every beach sits inside a bay. (from lesson 2)\n5. Height: contours or shading every 25 m up to an off-centre summit, with its height written. Check: the lines bunch where you want steep ground and spread out where the districts need flat ground. (from lesson 2)\n6. Streams (and a small lake if you want one) from the hills down into your bays. Check: no stream climbs across a contour. (from lesson 2)\n7. District 1: a red 200 x 200 px box round the harbour. Check: it holds the quay, some water, the row of buildings and a road. (from lesson 3)\n8. District 2: choose its character, write why, and draw its red box where that character really grows. Check: it is at least 300 m from district 1, and your Day 21 photos show the same character. (from lesson 3)\n9. Roads: the main road between the districts and one smaller track, following the contours. Check: where contours bunch, your road zigzags. (from lesson 4)\n10. The launch pad and the scenic route: a loop of about 2 km with arrows and three named landmarks. Check: the measured total is 1800 to 2500 m and the loop passes through both red boxes. (from lesson 4)\n11. Write map_notes.md: the longest axis, the summit height, each district's use and why it sits there, the corners of both boxes, the launch pad position and the route length. Check: every position is written as X and Y in metres from the centre. (from lesson 3)\n12. Hide the guide layer, export island_map.png (File > Export) and record a 60-second screen clip panning slowly across the map at 100 % zoom (Win+Alt+R). Save today's clip as clip_day22.mp4. Check: island_map.png opens at 2000 x 2000 px, and the clip shows both red boxes and the route. (from lesson 1)\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Vitaliy\nDay 22: Your island on paper: a map to scale. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

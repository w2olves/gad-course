<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 21</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

ng goes into Unreal today. Everything is saved in your Work folder for today (Day21), with the photos in a subfolder called references.", "uk": "Твоє реальне місце: сучасний невеликий острів або прибережне містечко завширшки від 0,5 до 3 км (або 1-кілометрова ділянка довшого узбережжя) з гаванню чи причалом і принаймні одним із цього: село на схилі пагорба, мис із маяком або долина з фермами. Сьогодні в Unreal нічого не потрапляє. Усе зберігається в твоїй теці Work на сьогодні (Day21), а фото лежать у підтеці references."}, "spec": [{"en": "references.md, part 1, 'The place': its name and country, its longest axis in metres (the longest straight line you can draw across the land), its highest point in metres, why it fits (the waterfront and the second character it offers) and three things you'll borrow from it (for example the harbour's shape, white houses climbing a hill, a lighthouse on a rocky point).", "uk": "references.md, частина 1, «Місце»: назва і країна, найдовша вісь у метрах (найдовша пряма лінія, яку можна провести через сушу), найвища точка в метрах, чому місце підходить (набережна і другий характер, який воно пропонує) і три речі, які ти з нього візьмеш (наприклад, форму гавані, білі будинки, що піднімаються схилом, маяк на скелястому мисі)."}, {"en": "osm_view.png: an OpenStreetMap image of the whole place with some sea round it, and four lengths in metres written in references.md: the longest axis, the harbour mouth, the row of buildings facing the water, and the shore to the highest point.", "uk": "osm_view.png: зображення OpenStreetMap усього місця з частиною моря навколо і чотири довжини в метрах, записані в references.md: найдовша вісь, вхід у гавань, ряд будівель уздовж води і відстань від берега до найвищої точки."}, {"en": "15 or more photos in Day21/references, named by number and subject (01_aerial_harbour.jpg, 02_quay.jpg ...): at least 2 aerial or high views (taken from the air or a hilltop), 5 of the waterfront (quay, building fronts, boats, paving), 4 of the second character, 2 of coast or cliffs, 1 of plants and 1 that shows the water's colour.", "uk": "15 або більше фото в Day21/references, названих за номером і сюжетом (01_aerial_harbour.jpg, 02_quay.jpg ...): щонайменше 2 види з повітря або згори (знято з повітря чи з вершини пагорба), 5 набережної (причал, фасади будівель, човни, бруківка), 4 другого характеру, 2 узбережжя чи скель, 1 рослин і 1, що показує колір води."}, {"en": "references.md, part 2, 'The photos': one row per photo with its file name, what it shows, a tag (district 1, district 2, coast, plants, water or colour) and one scale clue (a door, a person, a car, a storey).", "uk": "references.md, частина 2, «Фото»: один рядок на кожне фото з назвою файлу, тим, що на ньому видно, тегом (район 1, район 2, узбережжя, рослини, вода або колір) і однією підказкою масштабу (двері, людина, автомобіль, поверх)."}, {"en": "credits.md: one line per photo (title, author, licence, link) and one line for the map. Only public domain, CC0, CC BY or CC BY-SA photos.", "uk": "credits.md: один рядок на кожне фото (назва, автор, ліцензія, посилання) і один рядок для мапи. Лише фото в суспільному надбанні або з ліцензіями CC0, CC BY чи CC BY-SA."}, {"en": "Hero photos marked in references.md: 5 for the waterfront and 3 or 4 for the second character, each with the camera height you think it was taken from. Your final screenshots will stand beside these.", "uk": "Ключові фото позначені в references.md: 5 для набережної і 3 або 4 для другого характеру, для кожного вказано, з якої висоти, на твою думку, його знято. Твої фінальні скриншоти стоятимуть поруч із ними."}], "piece1": "the place check and the OpenStreetMap measurements (shared with the lessons)", "piece2": {"en": "The 15 photos, credited, tagged and with hero photos marked, on your own", "uk": "15 фото з авторством, тегами й позначеними ключовими фото, самостійно"}, "steps": [{"text": {"en": "Check your Day 16 candidates against the four rules (size, a present-day waterfront, a second character, 30 or more photos on Commons) and choose one place. Check: one place is chosen, and you can say its longest axis in metres.", "uk": "Перевір своїх кандидатів із Дня 16 за чотирма правилами (розмір, сучасна набережна, другий характер, 30 або більше фото на Commons) і вибери одне місце. Перевірка: одне місце вибрано, і ти можеш назвати його найдовшу вісь у метрах."}, "lesson": 1}, {"text": {"en": "Write part 1 of references.md, 'The place': name and country, longest axis, why it fits, and three things you'll borrow. Check: every size in it is a number in metres, never 'big' or 'small'.", "uk": "Напиши частину 1 файлу references.md, «Місце»: назва і країна, найдовша вісь, чому воно підходить і три речі, які ти візьмеш. Перевірка: кожен розмір там записано числом у метрах, а не словами «великий» чи «малий»."}, "lesson": 1}, {"text": {"en": "In osm_measure.kra, measure the scale bar, then the harbour mouth, the waterfront row and the shore to the highest point; find the highest point's height. Write them all in references.md. Check: metres per pixel written down, then four lengths and one height, each in metres.", "uk": "У osm_measure.kra виміряй масштабну лінійку, потім вхід у гавань, ряд будівель на набережній і відстань від берега до найвищої точки; знайди висоту найвищої точки. Запиши все в references.md. Перевірка: записано, скільки метрів в одному пікселі, а також чотири довжини й одну висоту, кожну в метрах."}, "lesson": 2}, {"text": {"en": "Export osm_view.png with Share > Image and add its credit line to credits.md. Check: the whole place and some sea are in the image, and credits.md has the OpenStreetMap line.", "uk": "Експортуй osm_view.png через Share > Image і додай його рядок авторства в credits.md. Перевірка: на зображенні все місце і трохи моря, а в credits.md є рядок для OpenStreetMap."}, "lesson": 2}, {"text": {"en": "Collect your first 7 photos: 2 aerial or high views and 5 of the waterfront (quay, building fronts, boats, paving). Write each credit line the moment you save the photo. Check: 7 files named by number and subject, and 7 lines in credits.md.", "uk": "Збери перші 7 фото: 2 види з повітря або згори і 5 набережної (причал, фасади будівель, човни, бруківка). Записуй рядок авторства щоразу, щойно зберігаєш фото. Перевірка: 7 файлів, названих за номером і сюжетом, і 7 рядків у credits.md."}, "lesson": 3}, {"text": {"en": "Collect 8 more: 4 of your second character, 2 of coast or cliffs, 1 of plants and 1 that shows the water's colour. Check: 15 files or more, and every group in the mix has its number.", "uk": "Збери ще 8: 4 твого другого характеру, 2 узбережжя чи скель, 1 рослин і 1, що показує колір води. Перевірка: 15 файлів або більше, і кожна група в наборі має свою кількість."}, "lesson": 3}, {"text": {"en": "Licence pass: read down credits.md. Delete any photo marked NC, ND, 'all rights reserved' or with no licence, and replace it. Check: every line has an author, one of the four allowed licences and a link.", "uk": "Перевірка ліцензій: прочитай credits.md згори донизу. Видали кожне фото з позначкою NC, ND, «all rights reserved» або без ліцензії і заміни його. Перевірка: у кожному рядку є автор, одна з чотирьох дозволених ліцензій і посилання."}, "lesson": 3}, {"text": {"en": "Write part 2 of references.md, the photo table: file, what it shows, tag and one scale clue per photo. Check: 15 rows or more, each with a tag.", "uk": "Напиши частину 2 файлу references.md, таблицю фото: файл, що на ньому видно, тег і одна підказка масштабу для кожного фото. Перевірка: 15 рядків або більше, у кожному є тег."}, "lesson": 4}, {"text": {"en": "Mark your hero photos with a star: 5 for the waterfront and 3 or 4 for the second character, each with its guessed camera height. Check: at least 8 stars, and at least one hero photo taken from high up.", "uk": "Познач ключові фото зірочкою: 5 для набережної і 3 або 4 для другого характеру, для кожного вкажи приблизну висоту камери. Перевірка: щонайменше 8 зірочок і принаймні одне ключове фото, зняте згори."}, "lesson": 4}, {"text": {"en": "Compare your Day 16 palette with two hero photos and write 'palette kept' or the swatches you will change. Check: one line about the palette at the end of references.md.", "uk": "Порівняй свою палітру з Дня 16 із двома ключовими фото і напиши «палітра без змін» або які зразки кольору ти зміниш. Перевірка: один рядок про палітру в кінці references.md."}, "lesson": 4}, {"text": {"en": "Record a 60-second screen clip (Win+Alt+R to start and stop) scrolling through osm_view.png and your photos, opened in Krita or the Photos app (the recorder films one app window, not File Explorer), while you say what each one is for. Save today's clip as clip_day21.mp4. Check: the clip plays for about 60 seconds and shows the map and at least 10 photos.", "uk": "Запиши 60-секундний відеозапис екрана (Win+Alt+R, щоб почати і зупинити), гортаючи osm_view.png і свої фото, відкриті в Krita або в застосунку Photos (запис знімає одне вікно застосунку, а не File Explorer), і розповідай, для чого кожне з них. Збережи сьогоднішній запис як clip_day21.mp4. Перевірка: запис триває близько 60 секунд і показує мапу та щонайменше 10 фото."}, "lesson": 4}], "assets": ["island12/credits-template.md"]}, "lessons": [{"title": {"en": "Choosing your real place", "uk": "Вибір твого реального місця"}, "minutes": 40, "goals": [{"en": "Explain why a world built on a real place looks believable: real places give true sizes, shapes and reasons.", "uk": "Пояснити, чому світ, побудований на реальному місці, виглядає правдоподібно: реальні місця дають справжні розміри, форми і причини."}, {"en": "Check each candidate from Day 16 against four rules: its size, a present-day waterfront, a second character, and enough free photos.", "uk": "Перевірити кожного кандидата з Дня 16 за чотирма правилами: розмір, сучасна набережна, другий характер і достатньо безкоштовних фото."}, {"en": "Estimate a length on OpenStreetMap with its scale bar (the ruler at the bottom left of the map that shows how long a stretch of map is in metres).", "uk": "Оцінити довжину на OpenStreetMap за масштабною лінійкою (лінійка внизу ліворуч на мапі, яка показує, скільки метрів у відрізку мапи)."}], "doalong": [{"en": "Open openstreetmap.org in your browser. OpenStreetMap is a free world map made by volunteers; anyone may use it if they credit it. Type your first Day 16 candidate in the Search box at the top left and press Enter. You should see the map move to the place, with results listed on the left.", "uk": "Відкрий openstreetmap.org у браузері. OpenStreetMap — це безкоштовна мапа світу, яку створюють волонтери; будь-хто може нею користуватися, якщо вказує джерело. Введи свого першого кандидата з Дня 16 у поле Search угорі ліворуч і натисни Enter. Ти маєш побачити, як мапа переміщується до цього місця, а ліворуч з'являється список результатів."}, {"en": "Zoom with the mouse wheel until the whole place fills the screen. Find the scale bar at the bottom left of the map: its top line shows a length in metres, for example 300 m. Count how many bar lengths fit along the longest stretch of land and multiply. You should have a rough longest axis, for example 'about 4 bars of 300 m, so about 1.2 km'.", "uk": "Масштабуй коліщатком миші, доки все місце не заповнить екран. Знайди масштабну лінійку внизу ліворуч на мапі: її верхня лінія показує довжину в метрах, наприклад 300 m. Порахуй, скільки довжин лінійки вміщається вздовж найдовшої смуги суші, і перемнож. У тебе має вийти приблизна найдовша вісь, наприклад «близько 4 лінійок по 300 м, тобто близько 1,2 км»."}, {"en": "Rule 1, size: keep places 0.5 to 3 km across. If the land is bigger (a big town or a long coast), choose a 1 km stretch of it that has a harbour. You should have one size in metres per candidate in your notes.", "uk": "Правило 1, розмір: залишай місця завширшки від 0,5 до 3 км. Якщо суша більша (велике місто або довге узбережжя), вибери 1-кілометрову ділянку з гаванню. У нотатках має бути один розмір у метрах для кожного кандидата."}, {"en": "Rules 2 and 3: find a harbour or quay (a straight stone edge on the water, often with boats) and a second character: a village on a slope, a lighthouse on a point (zoom in for a small lighthouse symbol) or a valley of fields. You should be able to point at both on the map.", "uk": "Правила 2 і 3: знайди гавань або причал (рівний кам'яний край над водою, часто з човнами) і другий характер: село на схилі, маяк на мисі (наблизь, щоб побачити маленький значок маяка) або долину з полями. Ти маєш змогу показати обидва на мапі."}, {"en": "Rule 4, photos: open commons.wikimedia.org (Wikimedia Commons, a free library of photos, each with a licence) and search the place's name. You should see photo tiles; a link starting 'Category:' that holds 30 or more photos is a pass.", "uk": "Правило 4, фото: відкрий commons.wikimedia.org (Wikimedia Commons, безкоштовна бібліотека фото, кожне з ліцензією) і пошукай назву місця. Ти маєш побачити плитки фото; посилання, що починається з «Category:» і містить 30 або більше фото, означає, що правило виконано."}, {"en": "Choose the candidate that passes all four rules; if two pass, keep the one with more photos. Write its name and country at the top of a new file, references.md. You should see your island's real place named.", "uk": "Вибери кандидата, який проходить усі чотири правила; якщо проходять два, залиш той, у якого більше фото. Запиши його назву і країну на початку нового файлу references.md. Тепер реальне місце твого острова має назву."}], "play": {"en": "Place pitch: I pitch my chosen place to the tutor in 60 seconds. The tutor asks three hard questions (too big? enough photos? where is the second district?) and I answer each with a number or a fact from the map.", "uk": "Презентація місця: я презентую тьютору своє обране місце за 60 секунд. Тьютор ставить три складні запитання (чи не завелике? чи достатньо фото? де другий район?), і я відповідаю на кожне числом або фактом із мапи."}, "video": {"search": "openstreetmap beginner guide how to use the map"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Choosing your real place (Day 21, lesson 1 of 4).\nToday's build: The reference set for your island: one confirmed real coastal place, osm_view.png with four measurements, 15 or more credited photos, references.md and credits.md.\n\nBy the end of this lesson I can:\n1. Explain why a world built on a real place looks believable: real places give true sizes, shapes and reasons.\n2. Check each candidate from Day 16 against four rules: its size, a present-day waterfront, a second character, and enough free photos.\n3. Estimate a length on OpenStreetMap with its scale bar (the ruler at the bottom left of the map that shows how long a stretch of map is in metres).\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (In four weeks you have built a harbour kit, textured and weathered it, and lit a 30 x 30 m harbour corner made entirely from your own work.), what I will learn today (You confirm one real coastal place for your island, measure it on OpenStreetMap, and collect 15 or more credited photos.), encourage me (Every great world begins with research, and today you work exactly the way professional world builders do before they build.), and share today's quote: \"Research is formalized curiosity. It is poking and prying with a purpose.\" (Zora Neale Hurston).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 18: why is a salt-line decal cheaper than painting the salt line into every wall texture? | Day 16: why is a sunlit white wall's base colour not pure white?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Place pitch: I pitch my chosen place to the tutor in 60 seconds. The tutor asks three hard questions (too big? enough photos? where is the second district?) and I answer each with a number or a fact from the map.\n6. Do-along on today's build (the place check and the OpenStreetMap measurements (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Open openstreetmap.org in your browser. OpenStreetMap is a free world map made by volunteers; anyone may use it if they credit it. Type your first Day 16 candidate in the Search box at the top left and press Enter. You should see the map move to the place, with results listed on the left.\n   - Zoom with the mouse wheel until the whole place fills the screen. Find the scale bar at the bottom left of the map: its top line shows a length in metres, for example 300 m. Count how many bar lengths fit along the longest stretch of land and multiply. You should have a rough longest axis, for example 'about 4 bars of 300 m, so about 1.2 km'.\n   - Rule 1, size: keep places 0.5 to 3 km across. If the land is bigger (a big town or a long coast), choose a 1 km stretch of it that has a harbour. You should have one size in metres per candidate in your notes.\n   - Rules 2 and 3: find a harbour or quay (a straight stone edge on the water, often with boats) and a second character: a village on a slope, a lighthouse on a point (zoom in for a small lighthouse symbol) or a valley of fields. You should be able to point at both on the map.\n   - Rule 4, photos: open commons.wikimedia.org (Wikimedia Commons, a free library of photos, each with a licence) and search the place's name. You should see photo tiles; a link starting 'Category:' that holds 30 or more photos is a pass.\n   - Choose the candidate that passes all four rules; if two pass, keep the one with more photos. Write its name and country at the top of a new file, references.md. You should see your island's real place named.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Reading your place on OpenStreetMap", "uk": "Читаємо твоє місце на OpenStreetMap"}, "minutes": 40, "goals": [{"en": "Measure the lengths a world builder needs (the longest axis, the harbour mouth, the waterfront row and the shore to the highest point) with the map's scale bar and Krita's Measure tool.", "uk": "Виміряти довжини, потрібні будівнику світу (найдовша вісь, вхід у гавань, ряд будівель на набережній і відстань від берега до найвищої точки), за масштабною лінійкою мапи та інструментом Measure у Krita."}, {"en": "Read the map's colours and lines: woods, grass, beaches, built-up land and road patterns.", "uk": "Читати кольори й лінії мапи: ліси, трава, пляжі, забудова і візерунки доріг."}, {"en": "Find the highest point's height and export a credited map image, osm_view.png.", "uk": "Знайти висоту найвищої точки й експортувати зображення мапи із зазначеним джерелом, osm_view.png."}], "doalong": [{"en": "Zoom the map so your whole place and some sea fill it, with the scale bar showing at the bottom left. Press Win+Shift+S and drag a box over the map, scale bar included. In Krita choose Edit > Paste into New Image and save it in Day21 as osm_measure.kra. You should see the map and its scale bar in Krita.", "uk": "Масштабуй мапу так, щоб усе твоє місце і трохи моря заповнили її, а масштабна лінійка була видна внизу ліворуч. Натисни Win+Shift+S і обведи рамкою мапу разом із масштабною лінійкою. У Krita вибери Edit > Paste into New Image і збережи файл у Day21 як osm_measure.kra. Ти маєш побачити мапу з масштабною лінійкою в Krita."}, {"en": "Pick Krita's Measure tool (in the toolbox; hover over the icons to read their names) and set its unit to Pixels in Tool Options. Drag along the scale bar's top line and read its length. Metres per pixel = the bar's metres ÷ its pixels. You should have one number, for example 300 m ÷ 150 px = 2 m per pixel.", "uk": "Візьми інструмент Measure у Krita (він на панелі інструментів; наведи курсор на значки, щоб прочитати їхні назви) і встанови одиниці Pixels у Tool Options. Проведи вздовж верхньої лінії масштабної лінійки і прочитай її довжину. Метрів на піксель = метри лінійки ÷ її пікселі. У тебе має бути одне число, наприклад 300 м ÷ 150 px = 2 м на піксель."}, {"en": "Drag the Measure tool along the longest axis, the harbour mouth (the gap where boats come in), the row of buildings that faces the water, and the straight line from the shore to the highest point. Multiply each by your metres per pixel and write the four lengths in references.md. You should see tens of metres for a small harbour mouth.", "uk": "Проведи інструментом Measure вздовж найдовшої осі, входу в гавань (проміжку, яким заходять човни), ряду будівель, що дивляться на воду, і прямої лінії від берега до найвищої точки. Помнож кожну довжину на кількість метрів на піксель і запиши чотири довжини в references.md. Для невеликого входу в гавань ти маєш побачити десятки метрів."}, {"en": "Read the colours on the standard map: dark green is woods, pale green is grass or scrub, yellow is beach sand, and grey or beige is built-up land. Write one line for each one your place has. You should see where the town ends and nature starts.", "uk": "Прочитай кольори на стандартній мапі: темно-зелений — це ліс, блідо-зелений — трава або чагарник, жовтий — піщаний пляж, а сірий чи бежевий — забудова. Напиши по одному рядку для кожного з них, який є у твоєму місці. Ти маєш побачити, де закінчується містечко і починається природа."}, {"en": "Find the height: zoom in on the highest point, where a small brown triangle marks a peak, often with its height in metres. If there's none, open opentopomap.org, the same map data drawn with contour lines (lines that join points of the same height), and read the highest line. You should have one height to write down.", "uk": "Знайди висоту: наблизь найвищу точку, де маленький коричневий трикутник позначає вершину, часто з висотою в метрах. Якщо його немає, відкрий opentopomap.org — ті самі дані мапи, намальовані з горизонталями (лініями, що з'єднують точки однакової висоти), — і прочитай найвищу лінію. У тебе має бути одна висота, яку можна записати."}, {"en": "Back in OpenStreetMap, check the map layer is Standard (the Layers button on the right; only some layers export as an image). Click the Share button in the strip of buttons on the right of the map. Under Image, tick Set custom dimensions, drag the box round the whole place plus some sea, choose PNG in Format and click Download. You should get a PNG file; rename it osm_view.png and move it into Day21.", "uk": "Повернись в OpenStreetMap і перевір, що шар мапи — Standard (кнопка Layers праворуч; лише деякі шари експортуються як зображення). Натисни кнопку Share у смузі кнопок праворуч від мапи. У розділі Image постав позначку Set custom dimensions, протягни рамку навколо всього місця разом із частиною моря, вибери PNG у Format і натисни Download. Ти маєш отримати файл PNG; перейменуй його на osm_view.png і перемісти в Day21."}, {"en": "Copy credits-template.md from today's assets into your Work folder as credits.md (if you already keep one, add to it) and write: 'osm_view.png: map data and image © OpenStreetMap contributors, https://www.openstreetmap.org/copyright'. You should see your first credit line.", "uk": "Скопіюй credits-template.md із сьогоднішніх матеріалів у свою теку Work як credits.md (якщо такий файл уже є, доповни його) і напиши: 'osm_view.png: map data and image © OpenStreetMap contributors, https://www.openstreetmap.org/copyright'. Ти маєш побачити свій перший рядок авторства."}], "play": {"en": "Scale guess: the tutor names five features of my place (the harbour mouth, the main street, the beach, the distance to the summit, the pier). I guess each length in metres, then measure it in Krita with my scale bar. Within 20 % scores a point.", "uk": "Вгадай масштаб: тьютор називає п'ять об'єктів мого місця (вхід у гавань, головна вулиця, пляж, відстань до вершини, пірс). Я вгадую довжину кожного в метрах, а потім вимірюю її в Krita за своєю масштабною лінійкою. Похибка до 20 % приносить бал."}, "video": {"search": "openstreetmap share export map image png"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Reading your place on OpenStreetMap (Day 21, lesson 2 of 4).\nToday's build: The reference set for your island: one confirmed real coastal place, osm_view.png with four measurements, 15 or more credited photos, references.md and credits.md.\nEarlier today I already did: lesson 1 (Choosing your real place). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Measure the lengths a world builder needs (the longest axis, the harbour mouth, the waterfront row and the shore to the highest point) with the map's scale bar and Krita's Measure tool.\n2. Read the map's colours and lines: woods, grass, beaches, built-up land and road patterns.\n3. Find the highest point's height and export a credited map image, osm_view.png.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Scale guess: the tutor names five features of my place (the harbour mouth, the main street, the beach, the distance to the summit, the pier). I guess each length in metres, then measure it in Krita with my scale bar. Within 20 % scores a point.\n4. Do-along on today's build (the place check and the OpenStreetMap measurements (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Zoom the map so your whole place and some sea fill it, with the scale bar showing at the bottom left. Press Win+Shift+S and drag a box over the map, scale bar included. In Krita choose Edit > Paste into New Image and save it in Day21 as osm_measure.kra. You should see the map and its scale bar in Krita.\n   - Pick Krita's Measure tool (in the toolbox; hover over the icons to read their names) and set its unit to Pixels in Tool Options. Drag along the scale bar's top line and read its length. Metres per pixel = the bar's metres ÷ its pixels. You should have one number, for example 300 m ÷ 150 px = 2 m per pixel.\n   - Drag the Measure tool along the longest axis, the harbour mouth (the gap where boats come in), the row of buildings that faces the water, and the straight line from the shore to the highest point. Multiply each by your metres per pixel and write the four lengths in references.md. You should see tens of metres for a small harbour mouth.\n   - Read the colours on the standard map: dark green is woods, pale green is grass or scrub, yellow is beach sand, and grey or beige is built-up land. Write one line for each one your place has. You should see where the town ends and nature starts.\n   - Find the height: zoom in on the highest point, where a small brown triangle marks a peak, often with its height in metres. If there's none, open opentopomap.org, the same map data drawn with contour lines (lines that join points of the same height), and read the highest line. You should have one height to write down.\n   - Back in OpenStreetMap, check the map layer is Standard (the Layers button on the right; only some layers export as an image). Click the Share button in the strip of buttons on the right of the map. Under Image, tick Set custom dimensions, drag the box round the whole place plus some sea, choose PNG in Format and click Download. You should get a PNG file; rename it osm_view.png and move it into Day21.\n   - Copy credits-template.md from today's assets into your Work folder as credits.md (if you already keep one, add to it) and write: 'osm_view.png: map data and image © OpenStreetMap contributors, https://www.openstreetmap.org/copyright'. You should see your first credit line.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Reference photos you may use, and how to credit them", "uk": "Референсні фото, які можна використовувати, і як вказувати їхнє авторство"}, "minutes": 40, "goals": [{"en": "Explain a licence: the rules an author sets for using their photo. Use public domain, CC0, CC BY and CC BY-SA; skip NC (non-commercial only), ND (no changes allowed) and 'all rights reserved'.", "uk": "Пояснити, що таке ліцензія: правила, які автор встановлює для використання свого фото. Використовувати суспільне надбання, CC0, CC BY і CC BY-SA; пропускати NC (лише некомерційне використання), ND (змінювати не можна) і «all rights reserved»."}, {"en": "Find photos on Wikimedia Commons through a place's Category page and its subcategories.", "uk": "Знаходити фото на Wikimedia Commons через сторінку Category місця та її підкатегорії."}, {"en": "Credit every photo once in credits.md: its title, its author (the person who made it, not just the uploader), its licence and its link.", "uk": "Вказувати авторство кожного фото один раз у credits.md: назва, автор (людина, яка його зробила, а не просто та, що завантажила), ліцензія і посилання."}], "doalong": [{"en": "On commons.wikimedia.org search your place's name and open its Category page. You should see subcategories at the top (for example 'Aerial photographs of ...', 'Harbours of ...', 'Lighthouses of ...') and photo tiles below.", "uk": "На commons.wikimedia.org пошукай назву свого місця і відкрий його сторінку Category. Угорі ти маєш побачити підкатегорії (наприклад, 'Aerial photographs of ...', 'Harbours of ...', 'Lighthouses of ...'), а під ними плитки фото."}, {"en": "Click one photo. On its file page scroll down to the Summary and Licensing boxes. You should see the Author and a licence name such as 'CC BY-SA 4.0' or 'public domain'.", "uk": "Натисни на одне фото. На сторінці файлу прокрути вниз до блоків Summary і Licensing. Ти маєш побачити Author і назву ліцензії, наприклад 'CC BY-SA 4.0' або 'public domain'."}, {"en": "If the licence is one of the four allowed, copy the title, author, licence and the page's link into credits.md in the template's format. You should see one full credit line.", "uk": "Якщо ліцензія — одна з чотирьох дозволених, скопіюй назву, автора, ліцензію і посилання на сторінку в credits.md у форматі шаблону. Ти маєш побачити один повний рядок авторства."}, {"en": "Click Download above the photo and choose a large size (about 1920 px wide or more). Save it into Day21/references as 01_aerial_harbour.jpg. You should see the file with a clear name.", "uk": "Натисни Download над фото і вибери великий розмір (близько 1920 px завширшки або більше). Збережи його в Day21/references як 01_aerial_harbour.jpg. Ти маєш побачити файл із зрозумілою назвою."}, {"en": "Read 'Checks before you hand in' at the end of credits-template.md. You should know that 'from Google' is never a source.", "uk": "Прочитай розділ 'Checks before you hand in' у кінці credits-template.md. Тепер ти знаєш, що «з Google» ніколи не буває джерелом."}], "play": {"en": "Licence referee: the tutor reads me six made-up photo licences (CC BY, CC BY-NC, 'all rights reserved', public domain, CC BY-SA, none given). I say 'use' or 'skip' for each within 5 seconds, with the reason.", "uk": "Суддя ліцензій: тьютор зачитує мені шість вигаданих ліцензій на фото (CC BY, CC BY-NC, «all rights reserved», суспільне надбання, CC BY-SA, ліцензію не вказано). Я кажу «беру» або «пропускаю» для кожної за 5 секунд і пояснюю чому."}, "video": {"search": "how to credit wikimedia commons images attribution"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Reference photos you may use, and how to credit them (Day 21, lesson 3 of 4).\nToday's build: The reference set for your island: one confirmed real coastal place, osm_view.png with four measurements, 15 or more credited photos, references.md and credits.md.\nEarlier today I already did: lesson 1 (Choosing your real place); lesson 2 (Reading your place on OpenStreetMap). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Explain a licence: the rules an author sets for using their photo. Use public domain, CC0, CC BY and CC BY-SA; skip NC (non-commercial only), ND (no changes allowed) and 'all rights reserved'.\n2. Find photos on Wikimedia Commons through a place's Category page and its subcategories.\n3. Credit every photo once in credits.md: its title, its author (the person who made it, not just the uploader), its licence and its link.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Licence referee: the tutor reads me six made-up photo licences (CC BY, CC BY-NC, 'all rights reserved', public domain, CC BY-SA, none given). I say 'use' or 'skip' for each within 5 seconds, with the reason.\n4. Do-along on today's build (the place check and the OpenStreetMap measurements (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - On commons.wikimedia.org search your place's name and open its Category page. You should see subcategories at the top (for example 'Aerial photographs of ...', 'Harbours of ...', 'Lighthouses of ...') and photo tiles below.\n   - Click one photo. On its file page scroll down to the Summary and Licensing boxes. You should see the Author and a licence name such as 'CC BY-SA 4.0' or 'public domain'.\n   - If the licence is one of the four allowed, copy the title, author, licence and the page's link into credits.md in the template's format. You should see one full credit line.\n   - Click Download above the photo and choose a large size (about 1920 px wide or more). Save it into Day21/references as 01_aerial_harbour.jpg. You should see the file with a clear name.\n   - Read 'Checks before you hand in' at the end of credits-template.md. You should know that 'from Google' is never a source.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Reading photos like a world builder", "uk": "Читаємо фото, як будівник світу"}, "minutes": 40, "goals": [{"en": "Find scale clues in a photo (a door is about 2.1 m tall, a person about 1.7 m, a car about 4.5 m long, a storey about 3 m) and estimate sizes from them.", "uk": "Знаходити на фото підказки масштабу (двері заввишки близько 2,1 м, людина близько 1,7 м, автомобіль завдовжки близько 4,5 м, поверх близько 3 м) і оцінювати за ними розміри."}, {"en": "Tag each photo with what it teaches you: layout, materials, colour, plants or water.", "uk": "Позначати кожне фото тегом того, чого воно вчить: планування, матеріали, колір, рослини чи вода."}, {"en": "Choose hero photos: the views your final screenshots will stand beside on Days 45 and 55, and guess each one's camera height.", "uk": "Вибирати ключові фото — види, поруч з якими стоятимуть твої фінальні скриншоти в Дні 45 і 55, — і вгадувати висоту камери для кожного."}], "doalong": [{"en": "Open one waterfront photo. Count the storeys of one building and multiply by 3 m. You should have a height in metres, for example 4 storeys, about 12 m.", "uk": "Відкрий одне фото набережної. Порахуй поверхи однієї будівлі й помнож на 3 м. У тебе має вийти висота в метрах, наприклад 4 поверхи, близько 12 м."}, {"en": "Find a person near the quay edge: is the quay top at their knee, their waist or above their head? Write the quay height in metres. You should see how much one person tells you about scale.", "uk": "Знайди людину біля краю причалу: верх причалу їй до коліна, до пояса чи вище голови? Запиши висоту причалу в метрах. Ти побачиш, як багато одна людина розповідає про масштаб."}, {"en": "In references.md start the photo table with the columns file, shows, tag and scale clue, and fill the first three rows. You should see each photo given one job.", "uk": "У references.md почни таблицю фото зі стовпцями «файл», «що видно», «тег» і «підказка масштабу» і заповни перші три рядки. Ти маєш побачити, що кожне фото отримало одне завдання."}, {"en": "Pick the 5 best waterfront views and mark them with a star. For each, write a guessed camera height: eye level (1.7 m), a balcony (about 6 m) or a drone (30 m or more). You should see a mix of heights.", "uk": "Вибери 5 найкращих видів набережної і познач їх зірочкою. Для кожного запиши приблизну висоту камери: рівень очей (1,7 м), балкон (близько 6 м) або дрон (30 м і вище). Ти маєш побачити різні висоти."}, {"en": "Open one hero photo beside your Day 16 palette sheet in Krita. Are the colours still right for this place? Write 'palette kept' or the swatch you will change. You should end with one line about the palette.", "uk": "Відкрий одне ключове фото поруч зі своїм аркушем палітри з Дня 16 у Krita. Чи досі кольори підходять цьому місцю? Напиши «палітра без змін» або який зразок кольору ти зміниш. Наприкінці має бути один рядок про палітру."}], "play": {"en": "Photo detective: the tutor names an item (a mooring bollard, a café awning, a quay ladder, a lighthouse door). I find it in my photos within 15 seconds, say which photo and where in it, and guess its size.", "uk": "Фотодетектив: тьютор називає предмет (швартовний стовпчик, маркізу кафе, драбину на причалі, двері маяка). Я знаходжу його на своїх фото за 15 секунд, кажу, на якому фото і де саме, і вгадую його розмір."}, "video": {"search": "using reference photos for environment art"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Reading photos like a world builder (Day 21, lesson 4 of 4).\nToday's build: The reference set for your island: one confirmed real coastal place, osm_view.png with four measurements, 15 or more credited photos, references.md and credits.md.\nEarlier today I already did: lesson 1 (Choosing your real place); lesson 2 (Reading your place on OpenStreetMap); lesson 3 (Reference photos you may use, and how to credit them). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Find scale clues in a photo (a door is about 2.1 m tall, a person about 1.7 m, a car about 4.5 m long, a storey about 3 m) and estimate sizes from them.\n2. Tag each photo with what it teaches you: layout, materials, colour, plants or water.\n3. Choose hero photos: the views your final screenshots will stand beside on Days 45 and 55, and guess each one's camera height.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Photo detective: the tutor names an item (a mooring bollard, a café awning, a quay ladder, a lighthouse door). I find it in my photos within 15 seconds, say which photo and where in it, and guess its size.\n4. Do-along on today's build (the place check and the OpenStreetMap measurements (shared with the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Open one waterfront photo. Count the storeys of one building and multiply by 3 m. You should have a height in metres, for example 4 storeys, about 12 m.\n   - Find a person near the quay edge: is the quay top at their knee, their waist or above their head? Write the quay height in metres. You should see how much one person tells you about scale.\n   - In references.md start the photo table with the columns file, shows, tag and scale clue, and fill the first three rows. You should see each photo given one job.\n   - Pick the 5 best waterfront views and mark them with a star. For each, write a guessed camera height: eye level (1.7 m), a balcony (about 6 m) or a drone (30 m or more). You should see a mix of heights.\n   - Open one hero photo beside your Day 16 palette sheet in Krita. Are the colours still right for this place? Write 'palette kept' or the swatch you will change. You should end with one line about the palette.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "references.md (the place, four measurements, the photo table and the hero photos)", "uk": "references.md (місце, чотири виміри, таблиця фото і ключові фото)"}, {"en": "credits.md (every photo and the map)", "uk": "credits.md (кожне фото і мапа)"}, {"en": "osm_view.png", "uk": "osm_view.png"}, {"en": "osm_measure.kra (the map screenshot with your scale-bar measurements)", "uk": "osm_measure.kra (скриншот мапи з твоїми вимірами за масштабною лінійкою)"}, {"en": "references/ (15 or more photos)", "uk": "references/ (15 або більше фото)"}, {"en": "clip_day21.mp4 (60 seconds through your map and photos)", "uk": "clip_day21.mp4 (60 секунд про твою мапу і фото)"}, {"en": "summary.md", "uk": "summary.md"}], "goal": {"en": "By the end of today you have one confirmed real coastal place, measured on OpenStreetMap, with 15 or more credited photos listed in references.md and credits.md.", "uk": "До кінця сьогоднішнього дня в тебе є одне підтверджене реальне прибережне місце, виміряне на OpenStreetMap, і 15 або більше фото із зазначеним авторством у references.md і credits.md."}, "uses": [{"en": "Day 16: your shortlist of two or three candidate coastal places, and the palette sheet from your favourite", "uk": "День 16: твій короткий список із двох-трьох прибережних місць-кандидатів і аркуш палітри з того, що подобається найбільше"}, {"en": "Day 20: your harbour corner, which shows you what a real waterfront needs", "uk": "День 20: твій куточок гавані, який показує, чого потребує справжня набережна"}], "quiz": [{"q": {"en": "Your favourite place from Day 16 is a coastal city 12 km long. What do you do?", "uk": "Твоє улюблене місце з Дня 16 — прибережне місто завдовжки 12 км. Що ти робиш?"}, "options": [{"en": "Drop it at once.", "uk": "Одразу відкидаю його."}, {"en": "Shrink the whole city to 1 km on your map.", "uk": "Зменшую все місто до 1 км на мапі."}, {"en": "Pick a 1 km stretch of its coast that has a harbour and a second character.", "uk": "Вибираю 1-кілометрову ділянку його узбережжя, де є гавань і другий характер."}, {"en": "Use the whole city: bigger is better.", "uk": "Беру все місто: що більше, то краще."}], "answer": 2, "explain": {"en": "The island is 0.9 to 1.2 km across, so a 1 km stretch keeps real sizes. Shrinking a whole city makes its streets and houses far too small.", "uk": "Острів має від 0,9 до 1,2 км завширшки, тож 1-кілометрова ділянка зберігає реальні розміри. Якщо зменшити все місто, його вулиці й будинки стануть надто малими."}}, {"q": {"en": "Which of these photo licences can you NOT use in this course?", "uk": "Яку з цих ліцензій на фото НЕ можна використовувати в цьому курсі?"}, "options": [{"en": "CC BY-SA 4.0", "uk": "CC BY-SA 4.0"}, {"en": "Public domain", "uk": "Суспільне надбання"}, {"en": "CC BY-NC 2.0", "uk": "CC BY-NC 2.0"}, {"en": "CC BY 3.0", "uk": "CC BY 3.0"}], "answer": 2, "explain": {"en": "NC means non-commercial only. Your portfolio is professional work, so the course skips NC photos.", "uk": "NC означає лише некомерційне використання. Твоє портфоліо — це професійна робота, тому курс пропускає фото з NC."}}, {"q": {"en": "A photo's page says 'Uploaded by MapFan22' and 'Author: Ana Kovač'. Whose name goes in credits.md?", "uk": "На сторінці фото написано 'Uploaded by MapFan22' і 'Author: Ana Kovač'. Чиє ім'я йде в credits.md?"}, "options": [{"en": "Ana Kovač, the author.", "uk": "Ana Kovač, авторка."}, {"en": "MapFan22, the uploader.", "uk": "MapFan22, той, хто завантажив."}, {"en": "Nobody: Commons photos are free.", "uk": "Нічиє: фото з Commons безкоштовні."}, {"en": "Wikimedia Commons.", "uk": "Wikimedia Commons."}], "answer": 0, "explain": {"en": "You credit the person who made the photo. The uploader only put it online.", "uk": "Ти вказуєш людину, яка зробила фото. Той, хто завантажив, лише виклав його в мережу."}}, {"q": {"en": "In one of your photos a harbour building has 4 storeys. About how tall is it?", "uk": "На одному з твоїх фото будівля в гавані має 4 поверхи. Яка її приблизна висота?"}, "options": [{"en": "About 6 m", "uk": "Близько 6 м"}, {"en": "About 12 m", "uk": "Близько 12 м"}, {"en": "About 25 m", "uk": "Близько 25 м"}, {"en": "About 40 m", "uk": "Близько 40 м"}], "answer": 1, "explain": {"en": "A storey is about 3 m, so 4 storeys are about 12 m. Storeys, doors and people are your scale clues.", "uk": "Поверх — це близько 3 м, тож 4 поверхи — близько 12 м. Поверхи, двері й люди — твої підказки масштабу."}}, {"q": {"en": "Why do you mark hero photos today, weeks before you build the districts?", "uk": "Навіщо позначати ключові фото сьогодні, за кілька тижнів до того, як ти будуєш райони?"}, "options": [{"en": "They are the only photos you may use.", "uk": "Тільки їх і можна використовувати."}, {"en": "They decide the island's size.", "uk": "Вони визначають розмір острова."}, {"en": "The tutor grades only hero photos.", "uk": "Тьютор оцінює лише ключові фото."}, {"en": "Your final screenshots will stand beside them, so you plan those views from the start.", "uk": "Твої фінальні скриншоти стоятимуть поруч із ними, тож ці види плануються з самого початку."}], "answer": 3, "explain": {"en": "The finish line puts five screenshots per district beside matching real photos. Knowing them now shapes your plans and cameras.", "uk": "На фініші по п'ять скриншотів кожного району стоять поруч із відповідними реальними фото. Якщо знати їх уже зараз, вони формують твої плани й камери."}}], "weekInfo": {"week": 5, "title": {"en": "Your real place and your island on paper", "uk": "Твоє реальне місце і твій острів на папері"}, "goal": {"en": "By Friday you have a complete planning pack: one real coastal place with 15 credited photos, island_map.png to scale with two red 200 x 200 m districts and the scenic route, two counted plot plans, two needs lists, reviewed free packs, and the Electric Dreams download under way.", "uk": "До п'ятниці в тебе є повний пакет планування: одне реальне прибережне місце з 15 фото із зазначеним авторством, island_map.png у масштабі з двома червоними районами 200 x 200 м і мальовничим маршрутом, два плани ділянок із підрахованими об'єктами, два списки потреб, переглянуті безкоштовні паки, а завантаження Electric Dreams уже триває."}, "skills": [{"en": "Reference research and image licensing (Creative Commons) for production art", "uk": "Пошук референсів і ліцензування зображень (Creative Commons) для продакшн-арту"}, {"en": "Scaled world maps from OpenStreetMap data, with districts, roads and flight routes", "uk": "Мапи світу в масштабі за даними OpenStreetMap: райони, дороги й маршрути польотів"}, {"en": "Plot plans with item counts, camera positions and drone lanes for level layout", "uk": "Плани ділянок із підрахунком об'єктів, позиціями камер і коридорами для дрона для планування рівня"}, {"en": "Asset sourcing: needs lists, Fab licence checks and best-pieces reviews", "uk": "Пошук асетів: списки потреб, перевірка ліцензій на Fab і огляд найкращих частин"}, {"en": "Pre-production review: consistency checks and a one-page planning board", "uk": "Огляд препродакшну: перевірка узгодженості й дошка планування на одну сторінку"}]}, "morning": {"sofar": {"en": "In four weeks you have built a harbour kit, textured and weathered it, and lit a 30 x 30 m harbour corner made entirely from your own work.", "uk": "Чотири тижні — і в тебе є портовий набір, текстурований і зістарений, та освітлений портовий куточок 30 x 30 м, повністю створений твоєю працею."}, "today": {"en": "You confirm one real coastal place for your island, measure it on OpenStreetMap, and collect 15 or more credited photos.", "uk": "Сьогодні ти затверджуєш одне справжнє приморське місце для свого острова, вимірюєш його в OpenStreetMap і збираєш 15 або більше фото із зазначеними авторами."}, "cheer": {"en": "Every great world begins with research, and today you work exactly the way professional world builders do before they build.", "uk": "Кожен великий світ починається з дослідження, і сьогодні ти працюєш саме так, як професійні творці світів працюють перед будівництвом."}, "quote": {"text": {"en": "Research is formalized curiosity. It is poking and prying with a purpose.", "uk": "Дослідження — це впорядкована цікавість. Це допитливе нишпорення з певною метою."}, "author": {"en": "Zora Neale Hurston", "uk": "Зора Ніл Герстон"}, "source": "https://en.wikiquote.org/wiki/Zora_Neale_Hurston"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-21-real-place-references", "mapHref": "../../COURSE.html", "prevHref": "../Day-20-boss-harbour-corner/START-HERE.html", "nextHref": "../Day-22-island-map-to-scale/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in A web browser (OpenStreetMap and Wikimedia Commons) and Krita. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me and don't write code. Keep me moving and make it feel like a game.\n\nToday I build on my own: The 15 photos, credited, tagged and with hero photos marked, on your own.\nIt's part of: The reference set for your island: one confirmed real coastal place, osm_view.png with four measurements, 15 or more credited photos, references.md and credits.md (Your real place: a present-day small island or coastal town, 0.5 to 3 km across (or a 1 km stretch of a longer coast), with a harbour or quay and at least one of these: a hillside village, a lighthouse headland or a farm valley. Nothing goes into Unreal today. Everything is saved in your Work folder for today (Day21), with the photos in a subfolder called references.).\n\nSpec:\n- references.md, part 1, 'The place': its name and country, its longest axis in metres (the longest straight line you can draw across the land), its highest point in metres, why it fits (the waterfront and the second character it offers) and three things you'll borrow from it (for example the harbour's shape, white houses climbing a hill, a lighthouse on a rocky point).\n- osm_view.png: an OpenStreetMap image of the whole place with some sea round it, and four lengths in metres written in references.md: the longest axis, the harbour mouth, the row of buildings facing the water, and the shore to the highest point.\n- 15 or more photos in Day21/references, named by number and subject (01_aerial_harbour.jpg, 02_quay.jpg ...): at least 2 aerial or high views (taken from the air or a hilltop), 5 of the waterfront (quay, building fronts, boats, paving), 4 of the second character, 2 of coast or cliffs, 1 of plants and 1 that shows the water's colour.\n- references.md, part 2, 'The photos': one row per photo with its file name, what it shows, a tag (district 1, district 2, coast, plants, water or colour) and one scale clue (a door, a person, a car, a storey).\n- credits.md: one line per photo (title, author, licence, link) and one line for the map. Only public domain, CC0, CC BY or CC BY-SA photos.\n- Hero photos marked in references.md: 5 for the waterfront and 3 or 4 for the second character, each with the camera height you think it was taken from. Your final screenshots will stand beside these.\n\nMy checklist:\n1. Check your Day 16 candidates against the four rules (size, a present-day waterfront, a second character, 30 or more photos on Commons) and choose one place. Check: one place is chosen, and you can say its longest axis in metres. (from lesson 1)\n2. Write part 1 of references.md, 'The place': name and country, longest axis, why it fits, and three things you'll borrow. Check: every size in it is a number in metres, never 'big' or 'small'. (from lesson 1)\n3. In osm_measure.kra, measure the scale bar, then the harbour mouth, the waterfront row and the shore to the highest point; find the highest point's height. Write them all in references.md. Check: metres per pixel written down, then four lengths and one height, each in metres. (from lesson 2)\n4. Export osm_view.png with Share > Image and add its credit line to credits.md. Check: the whole place and some sea are in the image, and credits.md has the OpenStreetMap line. (from lesson 2)\n5. Collect your first 7 photos: 2 aerial or high views and 5 of the waterfront (quay, building fronts, boats, paving). Write each credit line the moment you save the photo. Check: 7 files named by number and subject, and 7 lines in credits.md. (from lesson 3)\n6. Collect 8 more: 4 of your second character, 2 of coast or cliffs, 1 of plants and 1 that shows the water's colour. Check: 15 files or more, and every group in the mix has its number. (from lesson 3)\n7. Licence pass: read down credits.md. Delete any photo marked NC, ND, 'all rights reserved' or with no licence, and replace it. Check: every line has an author, one of the four allowed licences and a link. (from lesson 3)\n8. Write part 2 of references.md, the photo table: file, what it shows, tag and one scale clue per photo. Check: 15 rows or more, each with a tag. (from lesson 4)\n9. Mark your hero photos with a star: 5 for the waterfront and 3 or 4 for the second character, each with its guessed camera height. Check: at least 8 stars, and at least one hero photo taken from high up. (from lesson 4)\n10. Compare your Day 16 palette with two hero photos and write 'palette kept' or the swatches you will change. Check: one line about the palette at the end of references.md. (from lesson 4)\n11. Record a 60-second screen clip (Win+Alt+R to start and stop) scrolling through osm_view.png and your photos, opened in Krita or the Photos app (the recorder films one app window, not File Explorer), while you say what each one is for. Save today's clip as clip_day21.mp4. Check: the clip plays for about 60 seconds and shows the map and at least 10 photos. (from lesson 4)\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Vitaliy\nDay 21: Your real place: map, photos and credits. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

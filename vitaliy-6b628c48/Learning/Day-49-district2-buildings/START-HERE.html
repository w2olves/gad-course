<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 49</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.b{background:linear-gradient(145deg,#ff8cc4,#d6337e);box-shadow:0 10px 24px -8px rgba(255,95,168,.6),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.s{background:linear-gradient(145deg,#5fe39a,#16a34a);box-shadow:0 10px 24px -8px rgba(74,222,128,.55),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.ghost{color:var(--ink);background:var(--card);box-shadow:var(--raiseS)}
.btn.ghost:hover{color:var(--accT)}
/* the Done switch */
.sw{display:inline-flex;align-items:center;gap:12px;border:0;background:transparent;cursor:pointer;font:600 14px/1 var(--head);color:var(--muted);min-height:50px;padding:0 6px}
.sw .tr{position:relative;width:58px;height:32px;border-radius:999px;background:var(--well);box-shadow:var(--press);transition:background .25s}
.sw .tr::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .25s}
.sw[aria-pressed=true]{color:var(--ok)}
.sw[aria-pressed=true] .tr{background:linear-gradient(145deg,#5fe39a,#16a34a);box-shadow:0 0 14px rgba(74,222,128,.55)}
.sw[aria-pressed=true] .tr::after{left:30px;background:#fff}
details{margin-top:22px;border-radius:20px;background:var(--well);box-shadow:var(--press);padding:0 18px}
summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;min-height:52px;font:600 13px/1.3 var(--head);letter-spacing:.04em;color:var(--ink)}

summary .chev{margin-left:auto;transition:transform .25s;color:var(--faint)}
details[open] summary .chev{transform:rotate(180deg)}
details[open]{padding-bottom:16px}
.steps{list-style:none;padding:0;counter-reset:s;margin:4px 0 0}
.steps li{counter-increment:s;position:relative;padding:0 0 0 44px;margin:12px 0}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 12.5px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.vid{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;margin-top:20px;font-size:15px;padding:16px 18px;border-radius:20px}
.vid .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--badL)}
.vid b{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* build */
.build.bossday{border-color:rgba(255,95,168,.35)}
.build.bossday::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(60% 45% at 100% 0%,rgba(255,95,168,.28),transparent 70%);z-index:-1;pointer-events:none}
.tiers{list-style:none;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:0}
.tiers li{margin:0;padding:16px 18px;border-radius:20px;font-size:14.5px;line-height:1.55;color:var(--muted);background:var(--card);box-shadow:var(--raiseS)}
.medal{display:flex;align-items:center;gap:10px;margin:0 0 8px;font:700 11.5px/1 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
.medal i{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 2px 2px rgba(255,255,255,.6),0 0 10px var(--mg)}
.m0{--mg:rgba(205,127,50,.6)}.m0 i{background:linear-gradient(135deg,#e7a46d,#9a5a2b)}
.m1{--mg:rgba(190,200,215,.7)}.m1 i{background:linear-gradient(135deg,#f3f6fa,#9aa5b3)}
.m2{--mg:rgba(245,195,91,.75)}.m2 i{background:linear-gradient(135deg,#ffe08a,#c99412)}
.ccount{display:flex;align-items:center;gap:16px;margin:28px 0 10px}
.ccount .slider{flex:1}
.check{list-style:none;padding:0;margin:0}
.check li{margin:0}
.check label{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:start;padding:14px 4px;cursor:pointer;border-bottom:1px solid var(--line)}
.check li:last-child label{border-bottom:0}
.check input{appearance:none;-webkit-appearance:none;width:26px;height:26px;margin:1px 0 0;border-radius:9px;background:var(--well);box-shadow:var(--press);display:grid;place-items:center;cursor:pointer;transition:background .2s,box-shadow .2s}
.check input::after{content:"";width:10px;height:5px;border:solid #fff;border-width:0 0 2.2px 2.2px;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.check input:checked{background:linear-gradient(145deg,#5fe39a,#16a34a);box-shadow:0 0 12px rgba(74,222,128,.55)}
.check input:checked::after{opacity:1}
.check li.on .tx{color:var(--faint)}
.check .ln{font:600 10.5px/1.3 var(--head);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);white-space:nowrap;margin-top:5px;padding:4px 9px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
/* quiz */
.pips{display:flex;gap:8px;margin:0 0 4px;padding:10px 14px;border-radius:999px;width:max-content;max-width:100%;flex-wrap:wrap}
.pips i{width:9px;height:9px;border-radius:50%;background:var(--line2)}
.pips i.r{background:var(--okL);box-shadow:0 0 8px var(--okL)}.pips i.w{background:var(--badL);box-shadow:0 0 8px var(--badL)}
.qz{margin:28px 0 0;padding:28px 0 0;border-top:1px solid var(--line)}
.qz:first-of-type{border-top:0;padding-top:10px;margin-top:10px}
.qq{display:grid;grid-template-columns:40px 1fr;gap:10px;font:600 17.5px/1.45 var(--head);letter-spacing:-.005em;margin:0 0 14px}
.qq .qn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 13px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.opt{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;width:calc(100% - 50px);margin:12px 0 12px 50px;text-align:left;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid transparent;border-radius:18px;padding:11px 16px;cursor:pointer;box-shadow:var(--raiseS);transition:box-shadow .2s,transform .15s}

.opt:hover:not([disabled]){transform:translateY(-1px);color:var(--accT)}
.opt.right{box-shadow:var(--press);background:var(--okBg);border-color:rgba(74,222,128,.45)}.opt.right .lt{background:var(--okL);color:#fff;box-shadow:0 0 10px var(--okL)}.opt.right .mk{color:var(--ok)}
.opt.wrong{box-shadow:var(--press);background:var(--badBg);border-color:rgba(255,93,93,.45)}.opt.wrong .lt{background:var(--badL);color:#fff;box-shadow:0 0 10px var(--badL)}.opt.wrong .mk{color:var(--bad)}
.opt[disabled]{cursor:default}
.opt[disabled]:not(.right):not(.wrong){opacity:.55;box-shadow:none}
.exp{margin:10px 0 0 50px;font-size:15.5px;color:var(--muted)}
.exp b{font:700 11.5px/1 var(--head);letter-spacing:.14em;text-transform:uppercase;margin-right:10px}
.exp.r b{color:var(--ok)}.exp.w b{color:var(--bad)}
.score{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:32px;padding:18px 20px;border-radius:24px}

.clip{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}

.nav{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:34px}

.nav a:hover{color:var(--accT)}
.nav a.nx{justify-content:flex-end;text-align:right;grid-column:2}
#toast{position:fixed;left:50%;bottom:28px;z-index:9;transform:translateX(-50%) translateY(16px);background:rgba(30,33,46,.82);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:#f4f5fa;border:1px solid rgba(255,255,255,.14);padding:13px 24px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none;font:600 14px/1.4 var(--head);max-width:min(92vw,560px);text-align:center;box-shadow:0 20px 40px -14px rgba(0,0,0,.5),0 0 24px var(--glow)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:860px){.how{grid-template-columns:repeat(2,minmax(0,1fr))}.tiers{grid-template-columns:1fr}}

 body{font-size:16.5px}

 as on Day 33.", "uk": "Один орієнтир, SM_Landmark: орієнтир району 2 з landmarks.md (вежа маяка, вежа каплиці чи церкви, або великий амбар чи силос), просто змодельований у Blender у справжньому розмірі, щонайменше вдвічі-втричі вищий за будинки, видимий з 300 м чи більше вздовж дороги або узбережжя. Він замінює твій блокаут із Дня 32, лежить на DL_Landmarks, а його HLOD Layer встановлено на HLOD_Merged, як на Дні 33."}, {"en": "Pack buildings credited in credits.md; everything else on DL_District2.", "uk": "Будівлі з паків записано в credits.md; усе інше на DL_District2."}], "piece1": "the first three houses from the library", "piece2": {"en": "Every other building and the landmark, on your own", "uk": "Усі інші будівлі й орієнтир, самостійно"}, "steps": [{"text": {"en": "Screenshot D2_C4 for your before picture. List every grey box in placement_d2.md with what replaces it (Level Instance type, kit building or pack building). Check: one line per box.", "uk": "Зроби скриншот D2_C4 — це твоє фото «до». Перелічи кожен сірий бокс у placement_d2.md і чим його замінено (тип Level Instance, будівля з модульного набору чи будівля з паку). Перевірка: по одному рядку на бокс."}, "lesson": 1}, {"text": {"en": "Shelves: Flatten each footprint plus 2 m, then Smooth the edges. Check: no vertical landscape face from 10 m.", "uk": "Уступи: Flatten для кожного обрису плюс 2 м, потім Smooth по краях. Перевірка: з 10 м жодної вертикальної стіни ландшафту."}, "lesson": 2}, {"text": {"en": "Replace the first five boxes with library copies at the same coordinates; delete each box. Check: every corner touches its shelf.", "uk": "Заміни перші п'ять боксів копіями з бібліотеки на тих самих координатах; видали кожен бокс. Перевірка: кожен кут торкається свого уступу."}, "lesson": 1}, {"text": {"en": "Replace the rest; turn the types to the plan and vary the outside details. Check: from 30 m no two neighbours look like twins.", "uk": "Заміни решту; поверни типи як на плані й урізноманітни зовнішні деталі. Перевірка: з 30 м жодні двоє сусідів не схожі на близнюків."}, "lesson": 1}, {"text": {"en": "Pack buildings where the plan names them; write each pack in credits.md. Check: credits.md has a line for every pack.", "uk": "Будівлі з паків там, де їх називає план; запиши кожен пак у credits.md. Перевірка: у credits.md є рядок для кожного паку."}, "lesson": 1}, {"text": {"en": "Slopes: sink each building and add SM_Steps or a plinth where a door stands high. Check: every door has a way in from a path.", "uk": "Схили: занур кожну будівлю й додай SM_Steps або цоколь там, де двері стоять високо. Перевірка: до кожних дверей є вхід із доріжки."}, "lesson": 2}, {"text": {"en": "Colour: spread three or more wall or roof colours across the house types and the pack buildings (a pack building takes its own colour instance in Details > Materials). Check: from 30 m the colours sit with your Day 16 palette.", "uk": "Колір: розподіли три чи більше кольори стін або дахів між типами будинків і будівлями з паків (будівля з паку отримує власний інстанс кольору в Details > Materials). Перевірка: з 30 м кольори пасують до твоєї палітри з Дня 16."}, "lesson": 4}, {"text": {"en": "SM_ShopFront_A on any shop, inn or café, its back against the wall, in its own Plaster colour instance. Check: no gap or flicker from 2 m.", "uk": "SM_ShopFront_A на кожній крамниці, корчмі чи кав'ярні, спиною до стіни, у власному інстансі кольору Plaster. Перевірка: з 2 м немає щілин чи мерехтіння."}, "lesson": "D42.4"}, {"text": {"en": "Landmark, part 1: block it in Blender at real size from landmarks.md (a 15 to 25 m tower, or a long barn). Check: Dimensions match the size in your reference photo.", "uk": "Орієнтир, частина 1: виклади його блокаутом у Blender у справжньому розмірі за landmarks.md (вежа 15-25 м або довгий амбар). Перевірка: Dimensions збігаються з розміром на твоєму референсному фото."}, "lesson": 3}, {"text": {"en": "Landmark, part 2: add the top (a lantern room or a roof), windows and a door (inset faces or thin dark boxes); Smart UV Project, your M_Master instances, the origin at the base, UCX boxes; export SM_Landmark.fbx and put it where the Day 32 blockout stood (delete the blockout). Put it on DL_Landmarks and set HLOD Layer to HLOD_Merged. Check: from 300 m along the road you can pick it out.", "uk": "Орієнтир, частина 2: додай верх (ліхтарне приміщення маяка чи дах), вікна й двері (втоплені грані або тонкі темні бокси); Smart UV Project, твої інстанси M_Master, опорна точка внизу, бокси UCX; експортуй SM_Landmark.fbx і постав його там, де стояв блокаут із Дня 32 (блокаут видали). Поклади його на DL_Landmarks і встанови HLOD Layer на HLOD_Merged. Перевірка: з 300 м уздовж дороги його можна виокремити."}, "lesson": 3}, {"text": {"en": "Overlay: a Top view HighResShot laid over plot_plan_d2.png; fix anything more than 0.5 m off. Check: every footprint sits on its box.", "uk": "Накладання: HighResShot у вигляді Top, покладений поверх plot_plan_d2.png; виправ усе, що зміщене більш ніж на 0,5 м. Перевірка: кожен обрис стоїть на своєму квадраті."}, "lesson": "D42.1"}, {"text": {"en": "Capture: D2_C4 before and after (before_after_day49.png), and a 60-second flight toward the landmark and through the district. Save today's clip as flythrough_day49.mp4 and check that you also have landmark.blend, landmark_300m.png, district2_60m.png and overlay_day49.png (each is described in today's hand-in list; take any you are missing now). Check: both files are in today's Work folder.", "uk": "Запис: D2_C4 до і після (before_after_day49.png) і 60-секундний проліт у бік орієнтира й через район. Збережи сьогоднішнє відео як flythrough_day49.mp4 і перевір, що в тебе також є landmark.blend, landmark_300m.png, district2_60m.png і overlay_day49.png (кожен описано в сьогоднішньому списку «Здати роботу»; яких бракує — зніми зараз). Перевірка: обидва файли в сьогоднішній папці Work."}, "lesson": 4}], "assets": ["island12/free-packs-list.md", "island12/credits-template.md"]}, "lessons": [{"title": {"en": "From blockout to buildings: the swap", "uk": "Від блокауту до будівель: заміна"}, "minutes": 40, "goals": [{"en": "Replace each grey box with its building at the same coordinates, then delete the box.", "uk": "Замінювати кожен сірий бокс його будівлею на тих самих координатах, а потім видаляти бокс."}, {"en": "Make a few house types look like many: turns, outside details and different neighbours.", "uk": "Робити так, щоб кілька типів будинків виглядали як багато: повороти, зовнішні деталі й різні сусіди."}, {"en": "Keep placement_d2.md and the plan in step as you go.", "uk": "Тримати placement_d2.md і план узгодженими по ходу роботи."}], "doalong": [{"en": "Select a grey box, right-click the Location row in Details > Copy. You should see nothing change yet: the numbers are on the clipboard.", "uk": "Виділи сірий бокс, правий клік по рядку Location у Details > Copy. Поки що нічого не змінюється: числа в буфері обміну."}, {"en": "Drag LI_Cottage_A from your Library folder into the level, right-click its Location row > Paste, and type its Rotation Z from the plan. You should see the cottage inside the box.", "uk": "Перетягни LI_Cottage_A з папки Library на рівень, правий клік по його рядку Location > Paste і введи його Rotation Z з плану. Ти маєш побачити котедж усередині бокса."}, {"en": "Delete the box and press End on the cottage. You should see it sit on the ground. If it sits off to one side, the box's pivot and the cottage's pivot differ: line up the footprints in a Top view.", "uk": "Видали бокс і натисни End на котеджі. Ти маєш побачити, що він стоїть на землі. Якщо він зсунутий убік, опорні точки бокса й котеджу різні: вирівняй обриси у вигляді Top."}, {"en": "Add one outside detail to this copy: a PLA_FenceRun_8m, a gate, or a lean-to from two kit walls. You should see it no longer look like its twin.", "uk": "Додай цій копії одну зовнішню деталь: PLA_FenceRun_8m, хвіртку чи прибудову з двох стін модульного набору. Ти маєш побачити, що вона вже не схожа на свого близнюка."}, {"en": "Tick the row in placement_d2.md. You should see the list of open rows shrink.", "uk": "Познач рядок у placement_d2.md. Ти маєш побачити, що список відкритих рядків коротшає."}], "play": {"en": "Twin hunt: I describe a street of six houses made from two types. The tutor tries to spot the twins; every pair it can't find scores me a point.", "uk": "Полювання на близнюків: я описую вулицю з шести будинків, зроблених із двох типів. Тьютор пробує знайти близнюків; кожна пара, яку він не знаходить, — бал мені."}, "video": {"url": "https://www.youtube.com/watch?v=tnaXNCaBQ4M", "title": "06 - Snapping, Pivot Points, and Duplication - Unreal Engine Stage Design Course", "channel": "SuperStage", "length": "7:21", "search": "unreal engine snapping pivot duplicate"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: From blockout to buildings: the swap (Day 49, lesson 1 of 4).\nToday's build: District 2's buildings placed from the blockout: library copies with variations, pack buildings where they fit, SM_ShopFront_A on any shop, every building on a shelf with a way in, and one landmark you can see from far away.\n\nBy the end of this lesson I can:\n1. Replace each grey box with its building at the same coordinates, then delete the box.\n2. Make a few house types look like many: turns, outside details and different neighbours.\n3. Keep placement_d2.md and the plan in step as you go.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (District 2 is blocked out at full size, and your own kit has become a library of Level Instances and Packed Level Actors.), what I will learn today (You swap the grey boxes for buildings from your library and packs, set each one on its shelf, and build a landmark a pilot can see from far away.), encourage me (Your landmark is your signature on the island, so give it the time it deserves.), and share today's quote: \"Lighthouses don't go running all over an island looking for boats to save; they just stand there shining.\" (Anne Lamott).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 46: a note says 'C4: the street trees stand in a row'. Where is its source, and how do you fix it there? | Day 42: how do you seat a building on a slope?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Twin hunt: I describe a street of six houses made from two types. The tutor tries to spot the twins; every pair it can't find scores me a point.\n6. Do-along on today's build (the first three houses from the library): guide me through these steps one at a time, checking a screenshot after each:\n   - Select a grey box, right-click the Location row in Details > Copy. You should see nothing change yet: the numbers are on the clipboard.\n   - Drag LI_Cottage_A from your Library folder into the level, right-click its Location row > Paste, and type its Rotation Z from the plan. You should see the cottage inside the box.\n   - Delete the box and press End on the cottage. You should see it sit on the ground. If it sits off to one side, the box's pivot and the cottage's pivot differ: line up the footprints in a Top view.\n   - Add one outside detail to this copy: a PLA_FenceRun_8m, a gate, or a lean-to from two kit walls. You should see it no longer look like its twin.\n   - Tick the row in placement_d2.md. You should see the list of open rows shrink.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"06 - Snapping, Pivot Points, and Duplication - Unreal Engine Stage Design Course\" by SuperStage: https://www.youtube.com/watch?v=tnaXNCaBQ4M\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Buildings on a hillside: shelves, plinths and steps", "uk": "Будівлі на схилі: уступи, цоколі й сходи"}, "minutes": 40, "goals": [{"en": "Cut a shelf per footprint and keep the slope behind it soft or held by a low wall, never a vertical landscape face.", "uk": "Вирізати уступ під кожен обрис і тримати схил позаду м'яким або підпертим низькою стіною, ніколи не вертикальною стіною ландшафту."}, {"en": "Sink a building until its low side touches; add a plinth or steps where a door stands high.", "uk": "Занурювати будівлю, доки нижчий бік не торкнеться землі; додавати цоколь чи сходи там, де двері стоять високо."}, {"en": "Give every door a way in from a path: under 8 % for walking, or steps where it is steeper.", "uk": "Давати кожним дверям вхід із доріжки: менше 8 % для ходьби, або сходи там, де крутіше."}], "doalong": [{"en": "Choose Landscape from the mode menu, then Sculpt > Flatten, and paint one footprint plus 2 m. You should see a level shelf.", "uk": "Вибери Landscape у меню режимів, потім Sculpt > Flatten, і зафарбуй один обрис плюс 2 м. Ти маєш побачити рівний уступ."}, {"en": "On the uphill side, Smooth the cut into a slope, or place a low wall from SM_Cube with your stone instance. You should see a terrace like the ones in your photos.", "uk": "З боку підйому згладь зріз до схилу інструментом Smooth або постав низьку стіну з SM_Cube з твоїм інстансом каменю. Ти маєш побачити терасу, як на твоїх фото."}, {"en": "Back in Selection mode, place the house, press End and lower it until the low side touches. You should see no gap at any corner.", "uk": "Повернувшись у режим Selection, постав будинок, натисни End і опускай, доки нижчий бік не торкнеться землі. Ти маєш побачити, що під жодним кутом немає щілини."}, {"en": "Add SM_Steps from the path to a door that stands high. You should see each step meet the ground.", "uk": "Додай SM_Steps від доріжки до дверей, що стоять високо. Ти маєш побачити, що кожна сходинка сходиться з землею."}, {"en": "Press End to drop a small cube at each end of a steep path and read their Location Z: the difference is the rise. Measure the path's length with the ruler in a Top view (hold the middle mouse button and drag). You should see rise divided by length under 0.08, or else add steps.", "uk": "Клавішею End опусти маленький куб на кожному кінці крутої доріжки й прочитай їхні Location Z: різниця — це підйом. Виміряй довжину доріжки лінійкою у вигляді Top (утримуй середню кнопку миші й тягни). Ти маєш побачити, що підйом, поділений на довжину, менший за 0,08; інакше додай сходи."}], "play": {"en": "Shelf check: the tutor names four building spots on my plan. I say how each meets the slope, and it flags any that would leave a cliff face.", "uk": "Перевірка уступів: тьютор називає чотири місця будівель на моєму плані. Я кажу, як кожне сходиться зі схилом, а він позначає ті, що лишили б урвище."}, "video": {"search": "building houses on a slope terraces retaining walls"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Buildings on a hillside: shelves, plinths and steps (Day 49, lesson 2 of 4).\nToday's build: District 2's buildings placed from the blockout: library copies with variations, pack buildings where they fit, SM_ShopFront_A on any shop, every building on a shelf with a way in, and one landmark you can see from far away.\n\nBy the end of this lesson I can:\n1. Cut a shelf per footprint and keep the slope behind it soft or held by a low wall, never a vertical landscape face.\n2. Sink a building until its low side touches; add a plinth or steps where a door stands high.\n3. Give every door a way in from a path: under 8 % for walking, or steps where it is steeper.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Shelf check: the tutor names four building spots on my plan. I say how each meets the slope, and it flags any that would leave a cliff face.\n4. Do-along on today's build (the first three houses from the library): guide me through these steps one at a time, checking a screenshot after each:\n   - Choose Landscape from the mode menu, then Sculpt > Flatten, and paint one footprint plus 2 m. You should see a level shelf.\n   - On the uphill side, Smooth the cut into a slope, or place a low wall from SM_Cube with your stone instance. You should see a terrace like the ones in your photos.\n   - Back in Selection mode, place the house, press End and lower it until the low side touches. You should see no gap at any corner.\n   - Add SM_Steps from the path to a door that stands high. You should see each step meet the ground.\n   - Press End to drop a small cube at each end of a steep path and read their Location Z: the difference is the rise. Measure the path's length with the ruler in a Top view (hold the middle mouse button and drag). You should see rise divided by length under 0.08, or else add steps.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "A landmark you can see from across the island", "uk": "Орієнтир, який видно через увесь острів"}, "minutes": 40, "goals": [{"en": "Explain what a landmark does: it gives pilots a point to fly toward and makes the district easy to remember.", "uk": "Пояснювати, що робить орієнтир: дає пілотам точку, до якої летіти, і робить район легким для запам'ятовування."}, {"en": "Model your Day 32 landmark blockout properly in Blender, at real size, from a cylinder or your kit, with tools you know.", "uk": "Моделювати як слід свій блокаут орієнтира з Дня 32 у Blender, у справжньому розмірі, з циліндра чи модульного набору, знайомими інструментами."}, {"en": "Check it from far away: it must stand out by height, shape or colour.", "uk": "Перевіряти його здалеку: він мусить вирізнятися висотою, формою чи кольором."}], "doalong": [{"en": "Open landmarks.md (Day 32) and take district 2's landmark (a lighthouse, a chapel tower, or a big barn or silo); check its height against your reference photos. You should see one number, often 15 to 25 m.", "uk": "Відкрий landmarks.md (День 32) і візьми орієнтир району 2 (маяк, вежа каплиці або великий амбар чи силос); звір його висоту з референсними фото. Ти маєш побачити одне число, часто 15-25 м."}, {"en": "In Blender add a cylinder with 16 vertices (Shift+A > Mesh > Cylinder, then set Vertices in the panel at the bottom left), scale it to the base width and height in the N panel, and apply the scale (Ctrl+A > Scale). You should see Dimensions that match your number. For a barn, start from a cube and your kit's roof pieces instead.", "uk": "У Blender додай циліндр із 16 вершинами (Shift+A > Mesh > Cylinder, потім встанови Vertices на панелі внизу ліворуч), змасштабуй його до ширини основи й висоти на панелі N і застосуй масштаб (Ctrl+A > Scale). Ти маєш побачити Dimensions, що збігаються з твоїм числом. Для амбара натомість почни з куба й деталей даху з модульного набору."}, {"en": "In Edit Mode, select the top ring of vertices (Alt+click an edge of it) and scale it in by 20 % (S, 0.8). You should see a gently tapering tower.", "uk": "В Edit Mode виділи верхнє кільце вершин (Alt+клік по його ребру) і зменш його на 20 % (S, 0.8). Ти маєш побачити вежу, що плавно звужується."}, {"en": "Add the top: a shorter cylinder for a lantern room with your glass instance, or a pointed roof from a cone. You should see the outline from your photo.", "uk": "Додай верх: коротший циліндр для ліхтарного приміщення з твоїм інстансом скла або гостроверхий дах із конуса. Ти маєш побачити силует із твого фото."}, {"en": "Set the origin at the base, add UCX boxes, export SM_Landmark.fbx and import it into Content/Island/District2. Place it where your Day 32 blockout stands, then delete the blockout shapes. You should see it from 300 m along the road.", "uk": "Постав опорну точку внизу, додай бокси UCX, експортуй SM_Landmark.fbx й імпортуй його в Content/Island/District2. Постав його там, де стоїть твій блокаут із Дня 32, потім видали форми блокауту. Ти маєш побачити його з 300 м уздовж дороги."}], "play": {"en": "Silhouette test: I describe my landmark's outline in one sentence. The tutor guesses which landmark it is; a right guess means the shape reads.", "uk": "Тест силуету: я описую обрис свого орієнтира одним реченням. Тьютор вгадує, що це за орієнтир; правильна здогадка означає, що форма читається."}, "video": {"url": "https://www.youtube.com/watch?v=10cbOga7V_M", "title": "Landmarks 🇬🇧 [~LEVEL DESIGN #21]", "channel": "Mina Pêcheux", "length": "5:32", "search": "level design landmarks sightlines"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: A landmark you can see from across the island (Day 49, lesson 3 of 4).\nToday's build: District 2's buildings placed from the blockout: library copies with variations, pack buildings where they fit, SM_ShopFront_A on any shop, every building on a shelf with a way in, and one landmark you can see from far away.\n\nBy the end of this lesson I can:\n1. Explain what a landmark does: it gives pilots a point to fly toward and makes the district easy to remember.\n2. Model your Day 32 landmark blockout properly in Blender, at real size, from a cylinder or your kit, with tools you know.\n3. Check it from far away: it must stand out by height, shape or colour.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Silhouette test: I describe my landmark's outline in one sentence. The tutor guesses which landmark it is; a right guess means the shape reads.\n4. Do-along on today's build (the first three houses from the library): guide me through these steps one at a time, checking a screenshot after each:\n   - Open landmarks.md (Day 32) and take district 2's landmark (a lighthouse, a chapel tower, or a big barn or silo); check its height against your reference photos. You should see one number, often 15 to 25 m.\n   - In Blender add a cylinder with 16 vertices (Shift+A > Mesh > Cylinder, then set Vertices in the panel at the bottom left), scale it to the base width and height in the N panel, and apply the scale (Ctrl+A > Scale). You should see Dimensions that match your number. For a barn, start from a cube and your kit's roof pieces instead.\n   - In Edit Mode, select the top ring of vertices (Alt+click an edge of it) and scale it in by 20 % (S, 0.8). You should see a gently tapering tower.\n   - Add the top: a shorter cylinder for a lantern room with your glass instance, or a pointed roof from a cone. You should see the outline from your photo.\n   - Set the origin at the base, add UCX boxes, export SM_Landmark.fbx and import it into Content/Island/District2. Place it where your Day 32 blockout stands, then delete the blockout shapes. You should see it from 300 m along the road.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Landmarks 🇬🇧 [~LEVEL DESIGN #21]\" by Mina Pêcheux: https://www.youtube.com/watch?v=10cbOga7V_M\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Reading a group of buildings from the air", "uk": "Як читається група будівель із повітря"}, "minutes": 40, "goals": [{"en": "Read a group at 30 and 60 m: the roofscape (all the roofs seen together), the colours and the spaces between buildings.", "uk": "Читати групу з 30 і 60 м: дахи (усі дахи, які видно разом), кольори й простір між будівлями."}, {"en": "Spread colours so the district sits with your palette and no two neighbours match.", "uk": "Розподіляти кольори так, щоб район пасував до твоєї палітри і жодні двоє сусідів не збігалися."}, {"en": "Fix the group, not single houses: turns, gaps and heights.", "uk": "Виправляти групу, а не окремі будинки: повороти, проміжки й висоти."}], "doalong": [{"en": "Fly to 60 m above the district and screenshot. You should see the roofs as one pattern.", "uk": "Підлети на 60 м над районом і зроби скриншот. Ти маєш побачити дахи як один візерунок."}, {"en": "Squint: do the roofs look like one shape stamped again and again? You should see where the repeats show.", "uk": "Примруж очі: чи дахи схожі на одну форму, проштамповану знову й знову? Ти маєш побачити, де видно повтори."}, {"en": "Turn two copies, or swap them for the other house type. You should see the pattern break.", "uk": "Поверни дві копії або заміни їх іншим типом будинку. Ти маєш побачити, як візерунок ламається."}, {"en": "In Krita, put your Day 16 palette beside the 30 m screenshot. You should see whether the colours belong.", "uk": "У Krita постав свою палітру з Дня 16 поруч зі скриншотом із 30 м. Ти маєш побачити, чи кольори пасують."}, {"en": "Change one wall or roof colour that doesn't belong (on a house type: Level > Edit, then Commit; on a pack building: Details > Materials). You should see the district sit with the palette.", "uk": "Зміни один колір стіни чи даху, який не пасує (на типі будинку: Level > Edit, потім Commit; на будівлі з паку: Details > Materials). Ти маєш побачити, що район пасує до палітри."}], "play": {"en": "Copy-paste detector: the tutor gets my 60 m screenshot and names every repeat it finds. I fix each and resend.", "uk": "Детектор копіпасту: тьютор отримує мій скриншот із 60 м і називає кожен повтор, який знаходить. Я виправляю кожен і надсилаю знову."}, "video": {"search": "village layout game environment roofscape variation"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Reading a group of buildings from the air (Day 49, lesson 4 of 4).\nToday's build: District 2's buildings placed from the blockout: library copies with variations, pack buildings where they fit, SM_ShopFront_A on any shop, every building on a shelf with a way in, and one landmark you can see from far away.\n\nBy the end of this lesson I can:\n1. Read a group at 30 and 60 m: the roofscape (all the roofs seen together), the colours and the spaces between buildings.\n2. Spread colours so the district sits with your palette and no two neighbours match.\n3. Fix the group, not single houses: turns, gaps and heights.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Copy-paste detector: the tutor gets my 60 m screenshot and names every repeat it finds. I fix each and resend.\n4. Do-along on today's build (the first three houses from the library): guide me through these steps one at a time, checking a screenshot after each:\n   - Fly to 60 m above the district and screenshot. You should see the roofs as one pattern.\n   - Squint: do the roofs look like one shape stamped again and again? You should see where the repeats show.\n   - Turn two copies, or swap them for the other house type. You should see the pattern break.\n   - In Krita, put your Day 16 palette beside the 30 m screenshot. You should see whether the colours belong.\n   - Change one wall or roof colour that doesn't belong (on a house type: Level > Edit, then Commit; on a pack building: Details > Materials). You should see the district sit with the palette.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "placement_d2.md (every box ticked with what replaced it)", "uk": "placement_d2.md (кожен бокс позначено, з тим, що його замінило)"}, {"en": "SM_Landmark.fbx and landmark.blend", "uk": "SM_Landmark.fbx і landmark.blend"}, {"en": "landmark_300m.png (the landmark seen from 300 m or more)", "uk": "landmark_300m.png (орієнтир, видимий з 300 м чи більше)"}, {"en": "district2_60m.png and overlay_day49.png", "uk": "district2_60m.png і overlay_day49.png"}, {"en": "credits.md (updated)", "uk": "credits.md (оновлений)"}, {"en": "before_after_day49.png (D2_C4 before and after)", "uk": "before_after_day49.png (D2_C4 до і після)"}, {"en": "flythrough_day49.mp4 (60 seconds toward the landmark and through district 2)", "uk": "flythrough_day49.mp4 (60 секунд у бік орієнтира й через район 2)"}, {"en": "summary.md", "uk": "звіт дня (summary.md)"}], "goal": {"en": "By the end of today you have every building of district 2 standing at its plan place, from your library, your shop front and pack buildings, with a landmark a pilot can see from far across the island.", "uk": "Наприкінці дня кожна будівля району 2 стоїть на своєму місці за планом — з твоєї бібліотеки, з твоїм фасадом крамниці та з будівлями з паків, — а пілот бачить орієнтир здалеку, через весь острів."}, "uses": [{"en": "Day 48: the blockout, the corner markers, DL_District2, D2_C1 to D2_C5 and your building library", "uk": "День 48: блокаут, кутові маркери, DL_District2, D2_C1-D2_C5 і твоя бібліотека будівель"}, {"en": "Day 42: shelves, seating on slopes, steps, paving and colour instances", "uk": "День 42: уступи, посадка на схилах, сходи, мощення й інстанси кольорів"}, {"en": "Day 13: SM_ShopFront_A", "uk": "День 13: SM_ShopFront_A"}, {"en": "Day 16: your colour palette", "uk": "День 16: твоя палітра кольорів"}, {"en": "Day 24: your district 2 needs list and building packs", "uk": "День 24: твій список потреб для району 2 і паки будівель"}, {"en": "Days 32 and 33: landmarks.md, district 2's landmark blocked out at true size, DL_Landmarks and HLOD_Merged", "uk": "Дні 32 і 33: landmarks.md, орієнтир району 2, викладений блокаутом у справжньому розмірі, DL_Landmarks і HLOD_Merged"}], "quiz": [{"q": {"en": "You paste a grey box's Location onto a cottage, but the cottage stands 3 m to one side of where the box was. What is the likely cause?", "uk": "Ти вставляєш Location сірого бокса в котедж, але котедж стоїть на 3 м убік від того місця, де був бокс. Яка ймовірна причина?"}, "options": [{"en": "Unreal moved it", "uk": "Unreal його пересунув"}, {"en": "The Data Layer is wrong", "uk": "Неправильний Data Layer"}, {"en": "The cottage's pivot and the box's pivot are in different places; line up the footprints in a Top view", "uk": "Опорні точки котеджу й бокса в різних місцях; вирівняй обриси у вигляді Top"}, {"en": "The plan is wrong", "uk": "План неправильний"}], "answer": 2, "explain": {"en": "Location places an object's pivot. If the two pivots sit in different spots (a corner and a centre), the footprints don't match.", "uk": "Location ставить опорну точку об'єкта. Якщо дві опорні точки в різних місцях (кут і центр), обриси не збігаються."}}, {"q": {"en": "What makes a landmark work for a pilot?", "uk": "Що робить орієнтир корисним для пілота?"}, "options": [{"en": "It is the most detailed model in the district", "uk": "Це найдеталізованіша модель у районі"}, {"en": "It stands out from far away by height, shape or colour, and gives a point to fly toward", "uk": "Він вирізняється здалеку висотою, формою чи кольором і дає точку, до якої летіти"}, {"en": "It has the most triangles", "uk": "У нього найбільше трикутників"}, {"en": "It is hidden until you are close", "uk": "Його не видно, доки не наблизишся"}], "answer": 1, "explain": {"en": "A landmark is about being seen and remembered from a distance, not about detail.", "uk": "Орієнтир — це про те, щоб його бачили й пам'ятали здалеку, а не про деталі."}}, {"q": {"en": "A path climbs 3 m over 20 m to a door. What do you do?", "uk": "Доріжка піднімається на 3 м на 20 м до дверей. Що ти робиш?"}, "options": [{"en": "Nothing, because it is under 8 %", "uk": "Нічого, бо це менше 8 %"}, {"en": "Lower the door", "uk": "Опускаю двері"}, {"en": "Nothing, because a drone flies anyway", "uk": "Нічого, бо дрон однаково летить"}, {"en": "It is 15 %, too steep to walk: add steps or make the path longer and winding", "uk": "Це 15 %, надто круто для ходьби: додаю сходи або роблю доріжку довшою і звивистою"}], "answer": 3, "explain": {"en": "3 divided by 20 is 0.15, so 15 %. Walking paths stay under about 8 %, or use steps.", "uk": "3, поділене на 20, — це 0,15, тобто 15 %. Пішохідні доріжки лишаються в межах приблизно 8 %, інакше потрібні сходи."}}, {"q": {"en": "How do you make six houses from two Level Instance types look different?", "uk": "Як зробити, щоб шість будинків із двох типів Level Instance виглядали по-різному?"}, "options": [{"en": "Give each a different Data Layer", "uk": "Дати кожному інший Data Layer"}, {"en": "Scale each to a different size", "uk": "Змасштабувати кожен до іншого розміру"}, {"en": "Turn them, add different outside details, and mix the types along the street", "uk": "Повертати їх, додавати різні зовнішні деталі й чергувати типи вздовж вулиці"}], "answer": 2, "explain": {"en": "Turns, outside details and mixed neighbours hide the repeats without new models.", "uk": "Повороти, зовнішні деталі й різні сусіди ховають повтори без нових моделей."}}, {"q": {"en": "From 60 m the roofs look like one stamp repeated in a grid. What do you do?", "uk": "З 60 м дахи виглядають як один штамп, повторений сіткою. Що ти робиш?"}, "options": [{"en": "Add more triangles to the roofs", "uk": "Додаю дахам більше трикутників"}, {"en": "Turn copies, vary the gaps and swap types so the pattern breaks", "uk": "Повертаю копії, змінюю проміжки й міняю типи, щоб візерунок зламався"}, {"en": "Add fog", "uk": "Додаю туман"}, {"en": "Only check from 10 m", "uk": "Перевіряю лише з 10 м"}], "answer": 1, "explain": {"en": "The eye finds repeats from above first. Breaking the rhythm of turns, gaps and types fixes it.", "uk": "Згори око насамперед знаходить повтори. Порушення ритму поворотів, проміжків і типів це виправляє."}}], "weekInfo": {"week": 10, "title": {"en": "District 1 finished, district 2 built", "uk": "Район 1 завершено, район 2 збудовано"}, "goal": {"en": "By Friday you have district 1 finished with before and after proof, and district 2 standing: its buildings, landmark and roads in place, read from the drone and inside your budget.", "uk": "До п'ятниці в тебе є завершений район 1 із доказами «до і після» та район 2, що вже стоїть: його будівлі, орієнтир і дороги на місці, вони добре читаються з дрона й вкладаються в бюджет."}, "skills": [{"en": "Iterating an environment from review notes, with before and after evidence", "uk": "Доопрацювання оточення за нотатками рев'ю, з доказами «до і після»"}, {"en": "Composition, landmarks and sightlines for aerial and drone cameras", "uk": "Композиція, орієнтири й лінії огляду для повітряних камер і камер дрона"}, {"en": "Edge blending between hand-built areas and procedural landscapes", "uk": "Плавні переходи між зробленими вручну ділянками та процедурним ландшафтом"}, {"en": "Greybox blockout to final placement with a reusable building library", "uk": "Від грейбокс-блокауту до фінального розміщення з бібліотекою будівель для повторного використання"}, {"en": "Landscape spline roads and paths that follow real terrain", "uk": "Дороги й стежки на сплайнах ландшафту (Landscape Splines), що йдуть за справжнім рельєфом"}]}, "morning": {"sofar": {"en": "District 2 is blocked out at full size, and your own kit has become a library of Level Instances and Packed Level Actors.", "uk": "Район 2 має блокаут у повному розмірі, а твій власний набір став бібліотекою Level Instances і Packed Level Actors."}, "today": {"en": "You swap the grey boxes for buildings from your library and packs, set each one on its shelf, and build a landmark a pilot can see from far away.", "uk": "Сьогодні ти замінюєш сірі коробки будівлями з бібліотеки та паків, ставиш кожну на її уступ і будуєш орієнтир, який пілот бачить здалеку."}, "cheer": {"en": "Your landmark is your signature on the island, so give it the time it deserves.", "uk": "Твій орієнтир — це твій підпис на острові, тож приділи йому стільки часу, скільки він заслуговує."}, "quote": {"text": {"en": "Lighthouses don't go running all over an island looking for boats to save; they just stand there shining.", "uk": "Маяки не бігають по всьому острову в пошуках човнів, які треба рятувати; вони просто стоять і світять."}, "author": {"en": "Anne Lamott", "uk": "Енн Ламотт"}, "source": "https://en.wikiquote.org/wiki/Anne_Lamott"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-49-district2-buildings", "mapHref": "../../COURSE.html", "prevHref": "../Day-48-district2-plan-check-and-blockout/START-HERE.html", "nextHref": "../Day-50-boss-district2-built/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Blender and Unreal Engine 5.8. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me and don't write code. Keep me moving and make it feel like a game.\n\nToday I build on my own: Every other building and the landmark, on your own.\nIt's part of: District 2's buildings placed from the blockout: library copies with variations, pack buildings where they fit, SM_ShopFront_A on any shop, every building on a shelf with a way in, and one landmark you can see from far away (District 2: every grey box from Day 48, and the landmark's spot on plot_plan_d2.png.).\n\nSpec:\n- Every grey box replaced by a library copy, a kit building or a pack building at the same coordinates, within 0.5 m; each box deleted when it is replaced.\n- Variation without new models: house types turned, given different outside details (fences, gates, steps, a lean-to from kit walls), and at least three wall or roof colours across the district: your house types plus pack buildings, which can take their own colour instance per copy in Details > Materials because they are single actors, not Level Instances.\n- A shelf for every footprint; on slopes, buildings sunk and given SM_Steps or a plinth (a low base wall), never a vertical landscape face. Walking paths under 8 % (8 m up for every 100 m along) or with steps.\n- SM_ShopFront_A on any shop, inn or café the plan names, in its own colour instance.\n- One landmark, SM_Landmark: district 2's landmark from landmarks.md (a lighthouse tower, a chapel or church tower, or a big barn or silo), modelled simply in Blender at real size, at least two or three times the height of the houses, visible from 300 m or more along a road or the coast. It replaces your Day 32 blockout, on DL_Landmarks with its HLOD Layer set to HLOD_Merged, as on Day 33.\n- Pack buildings credited in credits.md; everything else on DL_District2.\n\nMy checklist:\n1. Screenshot D2_C4 for your before picture. List every grey box in placement_d2.md with what replaces it (Level Instance type, kit building or pack building). Check: one line per box. (from lesson 1)\n2. Shelves: Flatten each footprint plus 2 m, then Smooth the edges. Check: no vertical landscape face from 10 m. (from lesson 2)\n3. Replace the first five boxes with library copies at the same coordinates; delete each box. Check: every corner touches its shelf. (from lesson 1)\n4. Replace the rest; turn the types to the plan and vary the outside details. Check: from 30 m no two neighbours look like twins. (from lesson 1)\n5. Pack buildings where the plan names them; write each pack in credits.md. Check: credits.md has a line for every pack. (from lesson 1)\n6. Slopes: sink each building and add SM_Steps or a plinth where a door stands high. Check: every door has a way in from a path. (from lesson 2)\n7. Colour: spread three or more wall or roof colours across the house types and the pack buildings (a pack building takes its own colour instance in Details > Materials). Check: from 30 m the colours sit with your Day 16 palette. (from lesson 4)\n8. SM_ShopFront_A on any shop, inn or café, its back against the wall, in its own Plaster colour instance. Check: no gap or flicker from 2 m. (from day 42, lesson 4)\n9. Landmark, part 1: block it in Blender at real size from landmarks.md (a 15 to 25 m tower, or a long barn). Check: Dimensions match the size in your reference photo. (from lesson 3)\n10. Landmark, part 2: add the top (a lantern room or a roof), windows and a door (inset faces or thin dark boxes); Smart UV Project, your M_Master instances, the origin at the base, UCX boxes; export SM_Landmark.fbx and put it where the Day 32 blockout stood (delete the blockout). Put it on DL_Landmarks and set HLOD Layer to HLOD_Merged. Check: from 300 m along the road you can pick it out. (from lesson 3)\n11. Overlay: a Top view HighResShot laid over plot_plan_d2.png; fix anything more than 0.5 m off. Check: every footprint sits on its box. (from day 42, lesson 1)\n12. Capture: D2_C4 before and after (before_after_day49.png), and a 60-second flight toward the landmark and through the district. Save today's clip as flythrough_day49.mp4 and check that you also have landmark.blend, landmark_300m.png, district2_60m.png and overlay_day49.png (each is described in today's hand-in list; take any you are missing now). Check: both files are in today's Work folder. (from lesson 4)\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Vitaliy\nDay 49: District 2 buildings: the library placed, the landmark built. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

function seg(str,cls){str=String(str);const W=15,H=26,t=2.8,g=.9,P={a:[[g+t/2,0],[W-g-t/2,0],[W-g-t,t],[g+t,t]],d:[[g+t,H-t],[W-g-t,H-t],[W-g-t/2,H],[g+t/2,H]],g:[[g+t,H/2-t/2],[W-g-t,H/2-t/2],[W-g-t/2,H/2],[W-g-t,H/2+t/2],[g+t,H/2+t/2],[g+t/2,H/2]],f:[[0,g+t/2],[t,g+t],[t,H/2-g-t/2],[t/2,H/2-g],[0,H/2-g-t/2]],b:[[W,g+t/2],[W,H/2-g-t/2],[W-t/2,H/2-g],[W-t,H/2-g-t/2],[W-t,g+t]],e:[[0,H/2+g+t/2],[t/2,H/2+g],[t,H/2+g+t/2],[t,H-g-t],[0,H-g-t/2]],c:[[W,H/2+g+t/2],[W,H-g-t/2],[W-t,H-g-t],[W-t,H/2+g+t/2],[W-t/2,H/2+g]]};
 let x=0,o='';for(const ch of str){if(ch===' '){x+=8;continue}if(ch==='/'){o+='<path class="on" d="M'+(x+9)+' 2L'+(x+2)+' '+(H-2)+'L'+(x+4.5)+' '+(H-2)+'L'+(x+11.5)+' 2Z"/>';x+=15;continue}const on=SEG[ch]||'';
  for(const k of 'abcdefg')o+='<polygon class="'+(on.includes(k)?'on':'gh')+'" points="'+P[k].map(p=>(p[0]+x).toFixed(1)+','+p[1].toFixed(1)).join(' ')+'"/>';x+=W+5}
 return '<svg class="seg7'+(cls?' '+cls:'')+'" viewBox="-1 -1 '+(x-3)+' '+(H+2)+'" aria-hidden="true" focusable="false"><g transform="skewX(-6) translate(2 0)">'+o+'</g></svg>'}

function island(state,pct,label){
 const cx=300,cy=205,R=172,TAU=Math.PI*2;

 const pt=(t,s,k)=>{const r=rad(t,s,k||0);return [cx+r*Math.cos(t),cy+r*Math.sin(t)*.78]};
 const f=n=>n.toFixed(1);
 const smooth=(P,closed)=>{let d='M'+f(P[0][0])+' '+f(P[0][1]);const n=P.length,g=i=>P[closed?(i+n)%n:Math.max(0,Math.min(n-1,i))];
  for(let i=0;i<(closed?n:n-1);i++){const p0=g(i-1),p1=g(i),p2=g(i+1),p3=g(i+2);d+='C'+f(p1[0]+(p2[0]-p0[0])/6)+' '+f(p1[1]+(p2[1]-p0[1])/6)+' '+f(p2[0]-(p3[0]-p1[0])/6)+' '+f(p2[1]-(p3[1]-p1[1])/6)+' '+f(p2[0])+' '+f(p2[1])}return d+(closed?'Z':'')};
 const ring=(s,k)=>{const P=[];for(let i=0;i<64;i++)P.push(pt(i/64*TAU,s,k));return smooth(P,true)};
 let o='<path class="c0" d="'+ring(1,0)+'"/>';
 [.84,.69,.55,.42,.3,.19,.1].forEach((s,k)=>o+='<path class="c" d="'+ring(s,k+1)+'"/>');
 const t0=-2.2,turns=1.55,wp=w=>{const t=(w-1)/11;return {a:t0+t*turns*TAU,s:1.1-t*.98}};
 const P=[],D=[];let last=0;for(let w=1;w<=12;w++)if(state(w)!=='p')last=w;
 for(let i=0;i<=110;i++){const t=i/110,a=t0+t*turns*TAU,s=1.1-t*.98,q=pt(a,s,0);P.push(q);if(last&&t<=(last-1)/11+1e-9)D.push(q)}
 o+='<path class="rt" d="'+smooth(P,false)+'"/>';
 if(D.length>1)o+='<path class="rtd" d="'+smooth(D,false)+'"/>';
 for(let w=1;w<=12;w++){const c=state(w),{a,s}=wp(w),q=pt(a,s,0),lx=q[0]+(Math.cos(a)>=0?15:-15),an=Math.cos(a)>=0?'start':'end';
  o+='<g class="w '+c+'">'+(c==='n'?'<circle class="halo" cx="'+f(q[0])+'" cy="'+f(q[1])+'" r="12"/>':'')+'<circle class="dot" cx="'+f(q[0])+'" cy="'+f(q[1])+'" r="'+(c==='p'?4.5:c==='n'?8:6)+'"/><text x="'+f(lx)+'" y="'+f(q[1]+5.5)+'" text-anchor="'+an+'">'+String(w).padStart(2,'0')+'</text></g>'}

 s+='<circle class="face" cx="200" cy="200" r="168"/><circle class="track" cx="200" cy="200" r="176"/>';
 s+='<circle class="arc" cx="200" cy="200" r="176" stroke="url(#'+id+'g)" stroke-dasharray="'+(C*p).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 200 200)"/>';
 if(p>0){const A=-Math.PI/2+p*TAU;s+='<circle class="knob'+(p<1?' go':'')+'" cx="'+(200+176*Math.cos(A)).toFixed(1)+'" cy="'+(200+176*Math.sin(A)).toFixed(1)+'" r="7"/>'}
 if(label)s+='<text class="rimt"><textPath href="#'+id+'" startOffset="25%" text-anchor="middle">'+label+'</textPath></text>';
 s+='<svg class="topo" x="40" y="62" width="320" height="276" viewBox="40 20 520 370">'+o+'</svg>';
 return s+'</svg>'}

<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 51</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

<script id="data" type="application/json">{"learner": "ib-vitaliy-6b628c48", "learnerName": {"en": "Vitaliy", "uk": "Віталій"}, "day": 51, "week": 11, "total": 60, "title": {"en": "District 2: props and furniture that tell its story", "uk": "Район 2: пропси й меблі, що розповідають його історію"}, "theme": {"en": "Week 11: District 2 finished", "uk": "Тиждень 11: район 2 завершено"}, "build": {"item": {"en": "District 2's props and furniture: fences or walls along the land, street furniture placed by use, repeated sets as Packed Level Actors, and three small stories", "uk": "Пропси й меблі району 2: паркани або мури вздовж рельєфу, вуличні меблі за призначенням, повторювані набори як Packed Level Actors і три маленькі історії"}, "why": {"en": "Props make a place feel lived in, and they tell a visitor where they are: a farm valley has field gates and hay bales, a hillside village has garden walls and benches on the steps, a headland has a rope fence along the cliff path. Props are also where a scene gets slow, because there are hundreds of them. Studios place props by use and repeat them as instances, so a district reads as real from 10 m and still runs fast.", "uk": "Пропси роблять місце живим і підказують відвідувачам, куди вони потрапили: у фермерській долині є польові ворота й тюки сіна, у селі на схилі — садові мури й лавки на сходах, на мисі — мотузяна огорожа вздовж стежки над урвищем. Саме через пропси сцена найчастіше й гальмує, бо їх сотні. Студії розставляють пропси за призначенням і повторюють їх як інстанси, тож район виглядає справжнім з 10 м і все одно працює швидко."}, "where": {"en": "L_Island, district 2 (about 200 x 200 m): its streets, paths, field edges or cliff path, its square or viewpoint, and its parking area.", "uk": "L_Island, район 2 (близько 200 x 200 м): його вулиці, стежки, краї полів або стежка над урвищем, площа чи оглядовий майданчик і парковка."}, "spec": [{"en": "props_list_d2.md: every prop from plot_plan_d2.png with its count, its source (your Week 1 set, your kit, a free pack or a new model) and its spot.", "uk": "props_list_d2.md: кожен пропс із plot_plan_d2.png з кількістю, джерелом (твій набір з Тижня 1, твій модульний набір, безкоштовний пак чи нова модель) і місцем."}, {"en": "One new character prop modelled in Blender at real size, in 30 minutes at most. Choose one: a wooden fence panel (2.5 m long, 1.2 m high), a stone wall piece (2 m long, 1.2 m high, 0.6 m thick) or a rope-and-post fence piece (2.5 m long, posts 1 m high). Origin at the bottom centre, UCX collision (UCX_SM_<Name>_00), named SM_<Name>.", "uk": "Один новий характерний пропс, змодельований у Blender у реальному розмірі, щонайбільше за 30 хвилин. Обери один: дерев'яна секція паркану (2,5 м завдовжки, 1,2 м заввишки), секція кам'яного муру (2 м завдовжки, 1,2 м заввишки, 0,6 м завтовшки) або секція огорожі з мотузки й стовпчиків (2,5 м завдовжки, стовпчики 1 м заввишки). Початок координат (origin) внизу по центру, колізія UCX (UCX_SM_<Name>_00), назва SM_<Name>."}, {"en": "PCG_FenceAlongSpline: a PCG graph that places your fence or wall piece along a spline, with at least three runs that follow the land (no floating posts, none sunk more than 5 cm).", "uk": "PCG_FenceAlongSpline: PCG-граф, який розставляє твою секцію паркану чи муру вздовж сплайна, і щонайменше три лінії, що йдуть за рельєфом (жодного стовпчика в повітрі, жоден не втоплений глибше ніж на 5 см)."}, {"en": "Your Week 1 benches, lamp posts, bins and bollards (and free-pack props) placed by use: benches face a view, bins stand beside benches and doors, lamps line the paths with their heads out of the drone lanes.", "uk": "Твої лавки, ліхтарні стовпи, урни й стовпчики з Тижня 1 (і пропси з безкоштовних паків), розставлені за призначенням: лавки дивляться на краєвид, урни стоять біля лавок і дверей, ліхтарі тягнуться вздовж стежок, а їхні верхівки не заходять у льотні коридори дрона."}, {"en": "At least one repeated set (a picnic table with benches, a café set or a group of hay bales) made into a Packed Level Actor and placed 4 or more times.", "uk": "Щонайменше один повторюваний набір (столик для пікніка з лавками, набір для кав'ярні чи група тюків сіна), перетворений на Packed Level Actor і розміщений 4 або більше разів."}, {"en": "Everything on a new Data Layer asset, DL_D2_Props (made the Day 33 way); stat unit from D2_C4 with the layer shown and hidden, and the props adding no more than about 10 % to the GPU time.", "uk": "Усе на новому асеті Data Layer, DL_D2_Props (створеному так, як у День 33); stat unit з D2_C4 з показаним і прихованим шаром, і пропси додають не більше ніж приблизно 10 % до часу GPU."}], "piece1": "the props list and your first fence run", "piece2": {"en": "All of district 2's props and furniture, on your own", "uk": "Усі пропси й меблі району 2 — самостійно"}, "steps": [{"text": {"en": "Load district 2 and take your 'before' shot: pilot D2_C4, press G and type HighResShot 1920x1080. Check: a clean 1920 x 1080 picture of the unfurnished district is in IslandCourse/Saved/Screenshots/WindowsEditor.", "uk": "Завантаж район 2 і зроби кадр «до»: увійди в камеру D2_C4 через Pilot, натисни G і введи HighResShot 1920x1080. Перевірка: чистий кадр 1920 x 1080 ще не облаштованого району лежить у IslandCourse/Saved/Screenshots/WindowsEditor."}, "lesson": 1}, {"text": {"en": "Write props_list_d2.md from plot_plan_d2.png and your needs list: each prop, its count, its source and its spot. Check: no prop is missing a count, a source or a spot.", "uk": "Напиши props_list_d2.md за plot_plan_d2.png і своїм списком потреб: кожен пропс, його кількість, джерело й місце. Перевірка: у жодного пропса не бракує кількості, джерела чи місця."}, "lesson": 1}, {"text": {"en": "Make the Data Layer asset DL_D2_Props (type Editor), add it to the Data Layer Outliner and make it current. Check: a test cube you place now shows DL_D2_Props in its Details panel; then delete the cube.", "uk": "Створи асет Data Layer DL_D2_Props (тип Editor), додай його в Data Layer Outliner і зроби поточним. Перевірка: тестовий куб, який ти зараз ставиш, показує DL_D2_Props у панелі Details; потім видали куб."}, "lesson": 1}, {"text": {"en": "Model your character prop in Blender (30 minutes at most), add its UCX box (UCX_SM_<Name>_00), export SM_<Name>.fbx and import it into Content/Island/District2/Props. Check: beside the mannequin it has the right height, and its base sits on the ground.", "uk": "Змоделюй свій характерний пропс у Blender (щонайбільше 30 хвилин), додай йому бокс UCX (UCX_SM_<Name>_00), експортуй SM_<Name>.fbx та імпортуй у Content/Island/District2/Props. Перевірка: поруч із манекеном він має правильну висоту, а його основа стоїть на землі."}, "lesson": 2}, {"text": {"en": "Build PCG_FenceAlongSpline and place the first run along one field edge, garden or path. Check: the pieces follow the spline from end to end with no gaps.", "uk": "Збери PCG_FenceAlongSpline і постав першу лінію вздовж краю поля, саду чи стежки. Перевірка: секції йдуть за сплайном від початку до кінця без проміжків."}, "lesson": 2}, {"text": {"en": "Add two or more runs from the plan, and drop every spline point onto the ground (select it and press End, or drag it down with the blue arrow). Check: flying at 2 m along each run, no post floats and none sinks more than 5 cm.", "uk": "Додай із плану ще дві або більше лінії й опусти кожну точку сплайна на землю (виділи її й натисни End або потягни вниз синьою стрілкою). Перевірка: коли летиш на висоті 2 м уздовж кожної лінії, жоден стовпчик не висить у повітрі й жоден не втоплений глибше ніж на 5 см."}, "lesson": 2}, {"text": {"en": "Place your Week 1 benches, bins and lamp posts by use at the square or viewpoint and along the paths. Check: every bench faces something worth seeing, and every bin is within 3 m of a bench or a door.", "uk": "Розстав свої лавки, урни й ліхтарні стовпи з Тижня 1 за призначенням на площі чи оглядовому майданчику та вздовж стежок. Перевірка: кожна лавка дивиться на щось варте уваги, а кожна урна стоїть не далі ніж за 3 м від лавки чи дверей."}, "lesson": 3}, {"text": {"en": "Check each free-pack prop before you place it (size, origin, triangles), then place it from your list. Check: its Approx Size matches a real one in your photos within about 10 %.", "uk": "Перевір кожен пропс із безкоштовного паку, перш ніж ставити його (розмір, origin, трикутники), потім розстав його за списком. Перевірка: його Approx Size збігається зі справжнім предметом на твоїх фото з точністю близько 10 %."}, "lesson": 3}, {"text": {"en": "Build one repeated set, make it a Packed Level Actor, and place it 4 or more times, each copy turned a little. Check: the Outliner shows the copies as PLA_ actors, not loose meshes.", "uk": "Збери один повторюваний набір, зроби з нього Packed Level Actor і постав 4 або більше разів, кожну копію трохи повернувши. Перевірка: Outliner показує копії як актори PLA_, а не як окремі меші."}, "lesson": 4}, {"text": {"en": "Place three small stories, for example a gate left open with a bucket beside it, a bike by a door, crates by a shop. Check: from a 10 m screenshot and your description, the tutor can find all three.", "uk": "Розмісти три маленькі історії, наприклад відчинені ворота з відром поруч, велосипед біля дверей, ящики біля крамниці. Перевірка: за скриншотом з 10 м і твоїм описом тьютор знаходить усі три."}, "lesson": 3}, {"text": {"en": "Slide LaneGauge along every drone lane on plot_plan_d2.png at its height. Check: no lamp head, parasol or fence post touches the cube.", "uk": "Проведи LaneGauge уздовж кожного льотного коридору з plot_plan_d2.png на його висоті. Перевірка: жодна верхівка ліхтаря, парасолька чи стовпчик паркану не торкається куба."}, "lesson": 3}, {"text": {"en": "Measure the cost: stat unit from D2_C4 with DL_D2_Props shown, then hidden. Check: the props add no more than about 10 % to the GPU time, and both numbers are in budget.md.", "uk": "Виміряй ціну: stat unit з D2_C4 з показаним, а потім прихованим DL_D2_Props. Перевірка: пропси додають не більше ніж приблизно 10 % до часу GPU, і обидва числа записано в budget.md."}, "lesson": 4}, {"text": {"en": "Take the 'after' shot from D2_C4 and put it beside the 'before' as before_after_day51.png; record a 60-second flight over the district at 10 to 20 m. Save today's clip as flythrough_day51.mp4 and check that you also have pcg_fence_graph.png, fence_run_2m.png and stories_10m.png (each is described in today's hand-in list; take any you are missing now). Check: both shots come from the same camera, and the clip runs about 60 seconds.", "uk": "Зроби кадр «після» з D2_C4 і постав його поруч із кадром «до» як before_after_day51.png; запиши 60-секундний проліт над районом на висоті 10–20 м. Збережи сьогоднішній кліп як flythrough_day51.mp4 і перевір, що в тебе є також pcg_fence_graph.png, fence_run_2m.png і stories_10m.png (кожен описано в сьогоднішньому списку «Що здати»; зроби зараз ті, яких бракує). Перевірка: обидва кадри зроблено з однієї камери, а кліп триває близько 60 секунд."}, "lesson": 1}], "assets": ["island12/free-packs-list.md", "island12/credits-template.md"]}, "lessons": [{"title": {"en": "Props that say where you are (micro-lesson)", "uk": "Пропси, які кажуть, де ти (мікроурок)"}, "minutes": 40, "goals": [{"en": "Explain character props: the few props that tell a visitor what kind of place this is (field gates on a farm, garden walls in a village, a rope fence on a headland).", "uk": "Пояснити, що таке характерні пропси: ті кілька предметів, які підказують відвідувачам, що це за місце (польові ворота на фермі, садові мури в селі, мотузяна огорожа на мисі)."}, {"en": "Turn the plan's counts into a props list with a source for every prop.", "uk": "Перетворити кількості з плану на список пропсів із джерелом для кожного."}, {"en": "Keep district 2's props on their own Data Layer asset, DL_D2_Props, so you can show, hide and measure them in one click.", "uk": "Тримати пропси району 2 на окремому асеті Data Layer, DL_D2_Props, щоб показувати, ховати й вимірювати їх одним клацанням."}], "doalong": [{"en": "Open L_Island. Open Window > World Partition > World Partition Editor, drag a box over district 2, right-click inside it and choose Load Region from Selection. You should see district 2's buildings appear in the viewport.", "uk": "Відкрий L_Island. Відкрий Window > World Partition > World Partition Editor, виділи рамкою район 2, клацни всередині правою кнопкою й обери Load Region from Selection. Ти бачиш, як у в'юпорті з'являються будівлі району 2."}, {"en": "Type D2_ in the Outliner's search box. You should see district 2's five cameras, D2_C1 to D2_C5, from Day 48; clear the search box afterwards.", "uk": "Введи D2_ у поле пошуку Outliner. Ти бачиш п'ять камер району 2, від D2_C1 до D2_C5, з Дня 48; потім очисти поле пошуку."}, {"en": "Right-click D2_C4 in the Outliner and choose Pilot 'D2_C4'. Press G for game view, press the key left of 1 to open the console and type HighResShot 1920x1080. You should see a message with the saved file's path.", "uk": "Клацни правою кнопкою D2_C4 в Outliner і обери Pilot 'D2_C4'. Натисни G, щоб увімкнути ігровий вигляд, натисни клавішу ліворуч від 1, щоб відкрити консоль, і введи HighResShot 1920x1080. Ти бачиш повідомлення зі шляхом до збереженого файлу."}, {"en": "Start props_list_d2.md with the three props the plan uses most: count, source and spot for each. You should see a table with three full rows.", "uk": "Почни props_list_d2.md з трьох пропсів, яких у плані найбільше: кількість, джерело й місце для кожного. Ти бачиш таблицю з трьома заповненими рядками."}, {"en": "In the Content Browser open /Game/Island/DataLayers, right-click > Miscellaneous > Data Layer and name it DL_D2_Props; double-click it and set Data Layer Type to Editor (as on Day 33). You should see the new DL_ asset saved.", "uk": "У Content Browser відкрий /Game/Island/DataLayers, клацни правою кнопкою > Miscellaneous > Data Layer і назви асет DL_D2_Props; двічі клацни його й постав Data Layer Type на Editor (як у День 33). Ти бачиш, що новий асет DL_ збережено."}, {"en": "Open Window > World Partition > Data Layer Outliner and drag DL_D2_Props into it; then right-click it > Make Current Data Layer. You should see it marked as current: new actors now go onto it.", "uk": "Відкрий Window > World Partition > Data Layer Outliner і перетягни туди DL_D2_Props; потім клацни його правою кнопкою > Make Current Data Layer. Ти бачиш, що його позначено як поточний: нові актори тепер потрапляють на нього."}], "play": {"en": "Where am I: the tutor names five props one at a time; after each I guess whether we're in a village, a farm valley or on a headland, and say which prop would make it certain.", "uk": "Де я: тьютор по одному називає п'ять пропсів; після кожного я вгадую, де ми — у селі, у фермерській долині чи на мисі, — і кажу, який пропс зробив би це очевидним."}, "video": {"url": "https://www.youtube.com/watch?v=_OlAs-fvICc", "title": "Unreal Engine 5 Tutorial - Data Layers", "channel": "Ryan Laley", "length": "10:01", "search": "unreal engine 5 data layers"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Props that say where you are (micro-lesson) (Day 51, lesson 1 of 4).\nToday's build: District 2's props and furniture: fences or walls along the land, street furniture placed by use, repeated sets as Packed Level Actors, and three small stories.\n\nBy the end of this lesson I can:\n1. Explain character props: the few props that tell a visitor what kind of place this is (field gates on a farm, garden walls in a village, a rope fence on a headland).\n2. Turn the plan's counts into a props list with a source for every prop.\n3. Keep district 2's props on their own Data Layer asset, DL_D2_Props, so you can show, hide and measure them in one click.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (Ten weeks in, your island has two districts: a finished waterfront and a second district with roads and paths to every door.), what I will learn today (You furnish district 2 with fences or walls that follow the land, props placed by use, instanced sets and three small stories.), encourage me (Props tell a visitor where they are, so let your district's character guide every choice you make.), and share today's quote: \"Instructions for living a life: Pay attention. Be astonished. Tell about it.\" (Mary Oliver).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 48: what is the difference between a Level Instance and a Packed Level Actor, and when do you use each? | Day 43: why do 40 copies of one chair cost less as instances than as 40 separate actors?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Where am I: the tutor names five props one at a time; after each I guess whether we're in a village, a farm valley or on a headland, and say which prop would make it certain.\n6. Do-along on today's build (the props list and your first fence run): guide me through these steps one at a time, checking a screenshot after each:\n   - Open L_Island. Open Window > World Partition > World Partition Editor, drag a box over district 2, right-click inside it and choose Load Region from Selection. You should see district 2's buildings appear in the viewport.\n   - Type D2_ in the Outliner's search box. You should see district 2's five cameras, D2_C1 to D2_C5, from Day 48; clear the search box afterwards.\n   - Right-click D2_C4 in the Outliner and choose Pilot 'D2_C4'. Press G for game view, press the key left of 1 to open the console and type HighResShot 1920x1080. You should see a message with the saved file's path.\n   - Start props_list_d2.md with the three props the plan uses most: count, source and spot for each. You should see a table with three full rows.\n   - In the Content Browser open /Game/Island/DataLayers, right-click > Miscellaneous > Data Layer and name it DL_D2_Props; double-click it and set Data Layer Type to Editor (as on Day 33). You should see the new DL_ asset saved.\n   - Open Window > World Partition > Data Layer Outliner and drag DL_D2_Props into it; then right-click it > Make Current Data Layer. You should see it marked as current: new actors now go onto it.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Unreal Engine 5 Tutorial - Data Layers\" by Ryan Laley: https://www.youtube.com/watch?v=_OlAs-fvICc\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Fences and walls along a spline with PCG", "uk": "Паркани й мури вздовж сплайна з PCG"}, "minutes": 40, "goals": [{"en": "Model a piece that repeats: real size, origin at the bottom centre, long side along the X axis, the same length every time.", "uk": "Змоделювати деталь, що повторюється: реальний розмір, origin внизу по центру, довга сторона вздовж осі X, щоразу однакова довжина."}, {"en": "Explain a spline (a line through points that you can bend) and the Spline Sampler node (it puts a point every few metres along the spline, turned to face along it).", "uk": "Пояснити, що таке сплайн (лінія через точки, яку можна вигинати) і вузол Spline Sampler (він ставить точку через кожні кілька метрів уздовж сплайна й повертає її за напрямком лінії)."}, {"en": "Build PCG_FenceAlongSpline from three nodes: Get Spline Data, Spline Sampler and Static Mesh Spawner.", "uk": "Зібрати PCG_FenceAlongSpline з трьох вузлів: Get Spline Data, Spline Sampler і Static Mesh Spawner."}, {"en": "Make a run follow the land: spline points dropped onto the ground, and an extra point wherever the ground bends.", "uk": "Зробити так, щоб лінія йшла за рельєфом: точки сплайна опущено на землю, а там, де земля згинається, додано ще одну точку."}], "doalong": [{"en": "In Blender, make your piece from cubes: for a fence panel, one post 0.1 x 0.1 x 1.2 m at one end only (as on SM_Railing_2m on Day 8, so neighbouring pieces never put two posts in one spot) and two planks 2.5 x 0.03 x 0.15 m, long side along X; join them (Ctrl+J) and set the origin to the bottom centre (as on Day 4). You should see 2.5 m as the X size in the N panel's Dimensions.", "uk": "У Blender зроби деталь із кубів: для секції паркану — один стовпчик 0,1 x 0,1 x 1,2 м лише з одного боку (як у SM_Railing_2m у День 8, щоб сусідні секції ніколи не ставили два стовпчики в одне місце) і дві дошки 2,5 x 0,03 x 0,15 м довгою стороною вздовж X; об'єднай їх (Ctrl+J) і постав origin внизу по центру (як у День 4). Ти бачиш 2,5 м як розмір по X у Dimensions на панелі N."}, {"en": "Add a UCX box round the piece (name it UCX_SM_FencePanel_00), export SM_FencePanel.fbx, and import it into Content/Island/District2/Props. You should see it in the Content Browser with a thumbnail.", "uk": "Додай навколо деталі бокс UCX (назви його UCX_SM_FencePanel_00), експортуй SM_FencePanel.fbx та імпортуй у Content/Island/District2/Props. Ти бачиш її в Content Browser з мініатюрою."}, {"en": "In the Content Browser, open Content/Island/PCG, right-click an empty spot > PCG > PCG Graph, name it PCG_FenceAlongSpline and double-click it. You should see an empty graph with an Input node and an Output node.", "uk": "У Content Browser відкрий Content/Island/PCG, клацни правою кнопкою на порожньому місці > PCG > PCG Graph, назви граф PCG_FenceAlongSpline і двічі клацни його. Ти бачиш порожній граф із вузлами Input і Output."}, {"en": "Right-click in the graph and add Get Spline Data (leave its Actor Filter on Self, so it reads the spline on its own actor; Day 38's tag search is not needed here), then Spline Sampler (in its Details set Mode to Distance and Distance Increment to 250), then Static Mesh Spawner with your fence mesh in its first Mesh Entry. Drag wires to join them in that order and into Output. You should see a chain of nodes from left to right.", "uk": "Клацни правою кнопкою в графі й додай Get Spline Data (залиш його Actor Filter на Self, щоб він читав сплайн на власному акторі; пошук за тегом з Дня 38 тут не потрібен), потім Spline Sampler (у його Details постав Mode на Distance, а Distance Increment на 250), потім Static Mesh Spawner зі своїм мешем паркану в першому Mesh Entry. Протягни дроти, щоб з'єднати їх у такому порядку й завести в Output. Ти бачиш ланцюжок вузлів зліва направо."}, {"en": "Click the Add button > Basic > Empty Actor, name it FenceRun_01, then in Details click + Add and add a Spline component and a PCG component; set the PCG component's Graph to PCG_FenceAlongSpline. Select the spline's end point, Alt+drag to add points, then click Generate. You should see fence pieces along the line.", "uk": "Натисни кнопку Add > Basic > Empty Actor, назви актор FenceRun_01, потім у Details натисни + Add і додай компоненти Spline і PCG; у компоненті PCG постав Graph на PCG_FenceAlongSpline. Виділи кінцеву точку сплайна, тягни з Alt, щоб додавати точки, потім натисни Generate. Ти бачиш секції паркану вздовж лінії."}, {"en": "Click one spline point and press End to drop it onto the ground; do the same for every point. If a point doesn't move, drag it down with the blue Z arrow until it touches the ground. You should see the run hug the ground; add a point (Alt+drag) wherever it still crosses a dip.", "uk": "Клацни одну точку сплайна й натисни End, щоб опустити її на землю; зроби так із кожною точкою. Якщо точка не рухається, потягни її вниз синьою стрілкою Z, доки вона не торкнеться землі. Ти бачиш, як лінія тісно лягає на землю; додай точку (тягни з Alt) там, де вона ще перетинає западину."}], "play": {"en": "Fence inspector: I describe my first run's ends, corners and steepest stretch; the tutor asks where a post might float or a piece might cut into the slope, and I check each place.", "uk": "Інспектор парканів: я описую кінці, кути й найкрутішу ділянку своєї першої лінії; тьютор питає, де стовпчик може висіти в повітрі або секція врізатися в схил, і я перевіряю кожне місце."}, "video": {"search": "unreal engine 5 pcg spline sampler fence along spline"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Fences and walls along a spline with PCG (Day 51, lesson 2 of 4).\nToday's build: District 2's props and furniture: fences or walls along the land, street furniture placed by use, repeated sets as Packed Level Actors, and three small stories.\n\nBy the end of this lesson I can:\n1. Model a piece that repeats: real size, origin at the bottom centre, long side along the X axis, the same length every time.\n2. Explain a spline (a line through points that you can bend) and the Spline Sampler node (it puts a point every few metres along the spline, turned to face along it).\n3. Build PCG_FenceAlongSpline from three nodes: Get Spline Data, Spline Sampler and Static Mesh Spawner.\n4. Make a run follow the land: spline points dropped onto the ground, and an extra point wherever the ground bends.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Fence inspector: I describe my first run's ends, corners and steepest stretch; the tutor asks where a post might float or a piece might cut into the slope, and I check each place.\n4. Do-along on today's build (the props list and your first fence run): guide me through these steps one at a time, checking a screenshot after each:\n   - In Blender, make your piece from cubes: for a fence panel, one post 0.1 x 0.1 x 1.2 m at one end only (as on SM_Railing_2m on Day 8, so neighbouring pieces never put two posts in one spot) and two planks 2.5 x 0.03 x 0.15 m, long side along X; join them (Ctrl+J) and set the origin to the bottom centre (as on Day 4). You should see 2.5 m as the X size in the N panel's Dimensions.\n   - Add a UCX box round the piece (name it UCX_SM_FencePanel_00), export SM_FencePanel.fbx, and import it into Content/Island/District2/Props. You should see it in the Content Browser with a thumbnail.\n   - In the Content Browser, open Content/Island/PCG, right-click an empty spot > PCG > PCG Graph, name it PCG_FenceAlongSpline and double-click it. You should see an empty graph with an Input node and an Output node.\n   - Right-click in the graph and add Get Spline Data (leave its Actor Filter on Self, so it reads the spline on its own actor; Day 38's tag search is not needed here), then Spline Sampler (in its Details set Mode to Distance and Distance Increment to 250), then Static Mesh Spawner with your fence mesh in its first Mesh Entry. Drag wires to join them in that order and into Output. You should see a chain of nodes from left to right.\n   - Click the Add button > Basic > Empty Actor, name it FenceRun_01, then in Details click + Add and add a Spline component and a PCG component; set the PCG component's Graph to PCG_FenceAlongSpline. Select the spline's end point, Alt+drag to add points, then click Generate. You should see fence pieces along the line.\n   - Click one spline point and press End to drop it onto the ground; do the same for every point. If a point doesn't move, drag it down with the blue Z arrow until it touches the ground. You should see the run hug the ground; add a point (Alt+drag) wherever it still crosses a dip.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Set dressing by use (micro-lesson)", "uk": "Розстановка за призначенням (мікроурок)"}, "minutes": 40, "goals": [{"en": "Place props the way people use them: benches face a view, bins stand by benches and doors, lamps follow paths, chairs are pulled out unevenly.", "uk": "Розставляти пропси так, як ними користуються люди: лавки дивляться на краєвид, урни стоять біля лавок і дверей, ліхтарі йдуть уздовж стежок, стільці відсунуті нерівно."}, {"en": "Check a free-pack prop before you place it: size, origin and triangle count in the Static Mesh editor.", "uk": "Перевіряти пропс із безкоштовного паку перед тим, як ставити: розмір, origin і кількість трикутників у Static Mesh editor."}, {"en": "Add one small story per area (a group of objects that shows something just happened), and keep every drone lane clear.", "uk": "Додати одну маленьку історію на кожну зону (групу предметів, яка показує, що тут щойно щось відбувалося) і тримати кожен льотний коридор вільним."}], "doalong": [{"en": "At the square or viewpoint, drag two SM_Bench into the level facing the best view and press End to drop each to the ground. You should see both benches sitting on the ground, facing the view.", "uk": "На площі чи оглядовому майданчику перетягни в рівень дві SM_Bench так, щоб вони дивилися на найкращий краєвид, і натисни End, щоб опустити кожну на землю. Ти бачиш обидві лавки на землі, повернуті до краєвиду."}, {"en": "Add a bin beside the first bench and a lamp post where the path turns. You should see a small group that looks used, not lined up.", "uk": "Додай урну біля першої лавки й ліхтарний стовп там, де стежка повертає. Ти бачиш невелику групу, яка виглядає вживаною, а не вишикуваною в ряд."}, {"en": "Double-click one free-pack prop in the Content Browser to open the Static Mesh editor; read Triangles and Approx Size at the top left of its viewport. You should see its size in centimetres; compare it with a real one in your photos.", "uk": "Двічі клацни один пропс із безкоштовного паку в Content Browser, щоб відкрити Static Mesh editor; прочитай Triangles і Approx Size угорі ліворуч у його в'юпорті. Ти бачиш його розмір у сантиметрах; порівняй його зі справжнім предметом на своїх фото."}, {"en": "Place one small story: a crate and a bucket by a gate or a door. You should see a detail that says someone was just here.", "uk": "Розмісти одну маленьку історію: ящик і відро біля воріт чи дверей. Ти бачиш деталь, яка каже, що тут щойно хтось був."}, {"en": "Slide LaneGauge along the nearest drone lane at its height. You should see it pass without touching anything you placed.", "uk": "Проведи LaneGauge уздовж найближчого льотного коридору на його висоті. Ти бачиш, що він проходить, нічого з розставленого не зачіпаючи."}], "play": {"en": "Story spotting: I describe three stories I placed; the tutor must find them from my description of a 10 m screenshot. A story it can't find needs a clearer prop.", "uk": "Знайди історію: я описую три розміщені історії; тьютор має знайти їх за моїм описом скриншота з 10 м. Історії, яку він не знаходить, потрібен виразніший пропс."}, "video": {"url": "https://www.youtube.com/watch?v=YZ4gSKZh6do", "title": "How I Quickly Create 3D Environments in Unreal Engine 5 / FULL WORKFLOW", "channel": "pwnisher", "length": "22:30", "search": "unreal engine 5 set dressing environment"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Set dressing by use (micro-lesson) (Day 51, lesson 3 of 4).\nToday's build: District 2's props and furniture: fences or walls along the land, street furniture placed by use, repeated sets as Packed Level Actors, and three small stories.\n\nBy the end of this lesson I can:\n1. Place props the way people use them: benches face a view, bins stand by benches and doors, lamps follow paths, chairs are pulled out unevenly.\n2. Check a free-pack prop before you place it: size, origin and triangle count in the Static Mesh editor.\n3. Add one small story per area (a group of objects that shows something just happened), and keep every drone lane clear.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Story spotting: I describe three stories I placed; the tutor must find them from my description of a 10 m screenshot. A story it can't find needs a clearer prop.\n4. Do-along on today's build (the props list and your first fence run): guide me through these steps one at a time, checking a screenshot after each:\n   - At the square or viewpoint, drag two SM_Bench into the level facing the best view and press End to drop each to the ground. You should see both benches sitting on the ground, facing the view.\n   - Add a bin beside the first bench and a lamp post where the path turns. You should see a small group that looks used, not lined up.\n   - Double-click one free-pack prop in the Content Browser to open the Static Mesh editor; read Triangles and Approx Size at the top left of its viewport. You should see its size in centimetres; compare it with a real one in your photos.\n   - Place one small story: a crate and a bucket by a gate or a door. You should see a detail that says someone was just here.\n   - Slide LaneGauge along the nearest drone lane at its height. You should see it pass without touching anything you placed.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"How I Quickly Create 3D Environments in Unreal Engine 5 / FULL WORKFLOW\" by pwnisher: https://www.youtube.com/watch?v=YZ4gSKZh6do\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Instancing and the cost of props (micro-lesson)", "uk": "Інстансинг і ціна пропсів (мікроурок)"}, "minutes": 40, "goals": [{"en": "Explain instancing again: Unreal draws many copies of one mesh in one go, so 50 copies cost little more than one.", "uk": "Ще раз пояснити інстансинг: Unreal малює багато копій одного меша за один раз, тож 50 копій коштують ненабагато більше, ніж одна."}, {"en": "Make a Packed Level Actor (a group of meshes saved as one actor that draws its repeats as instances) from a repeated set.", "uk": "Зробити з повторюваного набору Packed Level Actor (групу мешів, збережену як один актор, який малює свої повтори як інстанси)."}, {"en": "Measure what a Data Layer costs with stat unit: once shown, once hidden, from the same camera.", "uk": "Виміряти, скільки коштує Data Layer, за допомогою stat unit: один раз із показаним шаром, один раз із прихованим, з тієї самої камери."}], "doalong": [{"en": "Build one set on the ground: a picnic table and two benches, a café table and four chairs, or three hay bales (cylinders 1.5 m across and 1.2 m wide, laid on their side). You should see the set standing on the land.", "uk": "Збери на землі один набір: столик для пікніка й дві лавки, столик кав'ярні й чотири стільці або три тюки сіна (циліндри 1,5 м у діаметрі й 1,2 м завширшки, покладені на бік). Ти бачиш, що набір стоїть на землі."}, {"en": "Select the set's meshes, right-click > Level > Create Packed Level Actor; accept the pivot settings, name it PLA_PicnicSet and save it in Content/Island/District2/Props. You should see one PLA_PicnicSet in the Outliner instead of loose meshes.", "uk": "Виділи меші набору, клацни правою кнопкою > Level > Create Packed Level Actor; прийми налаштування pivot, назви його PLA_PicnicSet і збережи в Content/Island/District2/Props. Ти бачиш в Outliner один PLA_PicnicSet замість окремих мешів."}, {"en": "Place four copies, each turned a little, none in a drone lane. You should see the sets spread through the district.", "uk": "Постав чотири копії, кожну трохи повернувши, жодної в льотному коридорі. Ти бачиш набори, розкидані по району."}, {"en": "Pilot D2_C4, open the console and type stat unit; write down Frame and GPU. You should see the numbers at the top right of the viewport.", "uk": "Увійди в D2_C4 через Pilot, відкрий консоль і введи stat unit; запиши Frame і GPU. Ти бачиш числа вгорі праворуч у в'юпорті."}, {"en": "In the Data Layer Outliner click the eye icon next to DL_D2_Props to hide it, and read GPU again; write both numbers in budget.md. You should see the props vanish and the GPU time drop.", "uk": "У Data Layer Outliner клацни іконку ока біля DL_D2_Props, щоб сховати шар, і знову прочитай GPU; запиши обидва числа в budget.md. Ти бачиш, як пропси зникають, а час GPU падає."}], "play": {"en": "Cost challenge: 40 chairs for less than 1 ms more GPU time than none; the tutor checks my stat unit numbers.", "uk": "Виклик на ціну: 40 стільців, які додають менше ніж 1 мс часу GPU порівняно з порожньою сценою; тьютор перевіряє мої числа stat unit."}, "video": {"url": "https://www.youtube.com/watch?v=pWgVa_8885U", "title": "Unreal Engine 5 Tutorial - Level Design Tools - Packed Level Actors", "channel": "JBarlowTraining", "length": "6:47", "search": "unreal engine 5 packed level actors"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Instancing and the cost of props (micro-lesson) (Day 51, lesson 4 of 4).\nToday's build: District 2's props and furniture: fences or walls along the land, street furniture placed by use, repeated sets as Packed Level Actors, and three small stories.\n\nBy the end of this lesson I can:\n1. Explain instancing again: Unreal draws many copies of one mesh in one go, so 50 copies cost little more than one.\n2. Make a Packed Level Actor (a group of meshes saved as one actor that draws its repeats as instances) from a repeated set.\n3. Measure what a Data Layer costs with stat unit: once shown, once hidden, from the same camera.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Cost challenge: 40 chairs for less than 1 ms more GPU time than none; the tutor checks my stat unit numbers.\n4. Do-along on today's build (the props list and your first fence run): guide me through these steps one at a time, checking a screenshot after each:\n   - Build one set on the ground: a picnic table and two benches, a café table and four chairs, or three hay bales (cylinders 1.5 m across and 1.2 m wide, laid on their side). You should see the set standing on the land.\n   - Select the set's meshes, right-click > Level > Create Packed Level Actor; accept the pivot settings, name it PLA_PicnicSet and save it in Content/Island/District2/Props. You should see one PLA_PicnicSet in the Outliner instead of loose meshes.\n   - Place four copies, each turned a little, none in a drone lane. You should see the sets spread through the district.\n   - Pilot D2_C4, open the console and type stat unit; write down Frame and GPU. You should see the numbers at the top right of the viewport.\n   - In the Data Layer Outliner click the eye icon next to DL_D2_Props to hide it, and read GPU again; write both numbers in budget.md. You should see the props vanish and the GPU time drop.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Unreal Engine 5 Tutorial - Level Design Tools - Packed Level Actors\" by JBarlowTraining: https://www.youtube.com/watch?v=pWgVa_8885U\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "props_list_d2.md (every prop with its count, source and spot)", "uk": "props_list_d2.md (кожен пропс із кількістю, джерелом і місцем)"}, {"en": "SM_<Name>.blend and SM_<Name>.fbx (your character prop)", "uk": "SM_<Name>.blend і SM_<Name>.fbx (твій характерний пропс)"}, {"en": "pcg_fence_graph.png (a screenshot of PCG_FenceAlongSpline) and fence_run_2m.png (a run seen from 2 m)", "uk": "pcg_fence_graph.png (скриншот PCG_FenceAlongSpline) і fence_run_2m.png (лінія паркану з висоти 2 м)"}, {"en": "stories_10m.png (your three small stories from 10 m)", "uk": "stories_10m.png (твої три маленькі історії з 10 м)"}, {"en": "budget.md (stat unit from D2_C4 with DL_D2_Props shown and hidden)", "uk": "budget.md (stat unit з D2_C4 з показаним і прихованим DL_D2_Props)"}, {"en": "before_after_day51.png and flythrough_day51.mp4 (60 seconds over district 2)", "uk": "before_after_day51.png і flythrough_day51.mp4 (60 секунд над районом 2)"}, {"en": "summary.md", "uk": "summary.md"}], "goal": {"en": "By the end of today you have district 2 furnished: fences or walls that follow the land, benches, lamps and bins placed by use, repeated sets packed as instances, and three small stories you can read from 10 m.", "uk": "До кінця дня ти маєш облаштований район 2: паркани або мури, що йдуть за рельєфом, лавки, ліхтарі й урни, розставлені за призначенням, повторювані набори, запаковані як інстанси, і три маленькі історії, які читаються з 10 м."}, "uses": [{"en": "Day 50: district 2 built in L_Island, with its buildings and roads in place", "uk": "День 50: район 2 збудовано в L_Island, будівлі й дороги на місці"}, {"en": "Day 23: plot_plan_d2.png (counts, spots and drone lanes)", "uk": "День 23: plot_plan_d2.png (кількості, місця й льотні коридори дрона)"}, {"en": "Day 24: your needs list and free-pack picks for district 2", "uk": "День 24: твій список потреб і вибрані безкоштовні паки для району 2"}, {"en": "Day 5: your street-prop set (SM_Bollard, SM_Bench, SM_LampPost, SM_Bin)", "uk": "День 5: твій набір вуличних пропсів (SM_Bollard, SM_Bench, SM_LampPost, SM_Bin)"}, {"en": "Day 43: Packed Level Actors, set dressing by use, and LaneGauge (your 4 x 4 x 4 m gauge cube from Day 38)", "uk": "День 43: Packed Level Actors, розстановка за призначенням і LaneGauge (твій куб-шаблон 4 x 4 x 4 м з Дня 38)"}, {"en": "Day 48: district 2's five locked cameras D2_C1 to D2_C5, and DL_District2", "uk": "День 48: п'ять зафіксованих камер району 2, від D2_C1 до D2_C5, і DL_District2"}, {"en": "Day 38: spline actors (an Empty Actor with a Spline) and the Spline Sampler", "uk": "День 38: сплайн-актори (Empty Actor зі Spline) і Spline Sampler"}, {"en": "Day 33: Data Layer assets and the Data Layer Outliner", "uk": "День 33: асети Data Layer і Data Layer Outliner"}], "quiz": [{"q": {"en": "Your fence posts float 20 cm above a dip between two spline points. What is the most likely cause?", "uk": "Стовпчики твого паркану висять на 20 см над западиною між двома точками сплайна. Яка найімовірніша причина?"}, "options": [{"en": "The Spline Sampler's Distance Increment is too small", "uk": "Distance Increment у Spline Sampler замалий"}, {"en": "The spline points aren't snapped to the ground, so the line crosses the dip in a straight line", "uk": "Точки сплайна не опущено на землю, тож лінія перетинає западину навпростець"}, {"en": "The fence mesh has no UCX collision", "uk": "У меша паркану немає колізії UCX"}, {"en": "The PCG graph has no Output node", "uk": "У PCG-графі немає вузла Output"}], "answer": 1, "explain": {"en": "The pieces follow the spline, not the land. Snap the points to the floor and add a point where the ground bends.", "uk": "Секції йдуть за сплайном, а не за рельєфом. Опусти точки на землю й додай точку там, де земля згинається."}}, {"q": {"en": "Which group of props says 'farm valley' most clearly from 30 m?", "uk": "Яка група пропсів найчіткіше каже «фермерська долина» з 30 м?"}, "options": [{"en": "Café tables, parasols and a bus shelter", "uk": "Столики кав'ярні, парасольки й автобусна зупинка"}, {"en": "A rope fence, an information panel and a viewpoint bench", "uk": "Мотузяна огорожа, інформаційний стенд і лавка на оглядовому майданчику"}, {"en": "Field gates, wooden fences and round hay bales", "uk": "Польові ворота, дерев'яні паркани й круглі тюки сіна"}, {"en": "Garden walls, steps and window boxes", "uk": "Садові мури, сходи й квіткові ящики на вікнах"}], "answer": 2, "explain": {"en": "Character props tell a visitor what kind of place this is. Gates, field fences and bales belong to farmland.", "uk": "Характерні пропси підказують відвідувачам, що це за місце. Ворота, польові паркани й тюки сіна належать до сільськогосподарських угідь."}}, {"q": {"en": "What does a Packed Level Actor do?", "uk": "Що робить Packed Level Actor?"}, "options": [{"en": "It saves a group of meshes as one actor and draws the repeated meshes as instances", "uk": "Зберігає групу мешів як один актор і малює повторювані меші як інстанси"}, {"en": "It hides a group from the drone", "uk": "Ховає групу від дрона"}, {"en": "It merges the group's textures into one texture", "uk": "Зливає текстури групи в одну текстуру"}], "answer": 0, "explain": {"en": "Packing a set makes every copy cheap to draw, because repeated meshes are drawn together as instances.", "uk": "Запакований набір робить кожну копію дешевою для малювання, бо повторювані меші малюються разом як інстанси."}}, {"q": {"en": "With DL_D2_Props shown, GPU time is 13.2 ms; hidden, it's 11.0 ms. Does that meet today's 10 % rule?", "uk": "З показаним DL_D2_Props час GPU становить 13,2 мс; із прихованим — 11,0 мс. Чи виконано сьогоднішнє правило 10 %?"}, "options": [{"en": "Yes: it adds only 2.2 ms", "uk": "Так: додається лише 2,2 мс"}, {"en": "Yes: hiding a layer always saves about 2 ms", "uk": "Так: приховування шару завжди економить близько 2 мс"}, {"en": "No: delete every prop", "uk": "Ні: видали всі пропси"}, {"en": "No: it adds 20 %, so pack more repeats and remove props no camera or flight ever sees", "uk": "Ні: додається 20 %, тож запакуй більше повторів і прибери пропси, яких не бачить жодна камера чи проліт"}], "answer": 3, "explain": {"en": "2.2 ms on top of 11.0 ms is 20 %. Pack repeats into Packed Level Actors and remove props nobody can see.", "uk": "2,2 мс понад 11,0 мс — це 20 %. Запакуй повтори в Packed Level Actors і прибери пропси, яких ніхто не бачить."}}, {"q": {"en": "A bench stands in the middle of a lawn, facing a blank wall. What's wrong with it?", "uk": "Лавка стоїть посеред газону, повернута до глухої стіни. Що з нею не так?"}, "options": [{"en": "Nothing: benches can stand anywhere", "uk": "Нічого: лавки можуть стояти де завгодно"}, {"en": "It's placed without a use: a bench should face a view or a path where people sit and watch, with a bin nearby", "uk": "Її поставлено без призначення: лавка має дивитися на краєвид чи стежку, де люди сидять і спостерігають, а поруч має бути урна"}, {"en": "It should be a Packed Level Actor", "uk": "Вона має бути Packed Level Actor"}], "answer": 1, "explain": {"en": "Set dressing by use places props the way people really use them. A bench facing a wall tells no story.", "uk": "Розстановка за призначенням ставить пропси так, як ними справді користуються люди. Лавка, повернута до стіни, не розповідає жодної історії."}}], "weekInfo": {"week": 11, "title": {"en": "District 2 finished", "uk": "Район 2 завершено"}, "goal": {"en": "By Friday you have district 2 finished: furnished, planted and weathered, joined to the island by its road, its edges and the scenic route, and five final shots for each district beside their real photos.", "uk": "До п'ятниці ти маєш завершений район 2: облаштований, засаджений і зі слідами часу, з'єднаний з островом дорогою, межами й мальовничим маршрутом, а також по п'ять фінальних кадрів кожного району поруч із їхніми справжніми фото."}, "skills": [{"en": "Set dressing and prop placement by use for open-world districts", "uk": "Наповнення сцени (set dressing) і розстановка пропсів за призначенням для районів відкритого світу"}, {"en": "Spline-based PCG for fences, walls and hedgerows in Unreal Engine 5", "uk": "PCG на сплайнах для парканів, мурів і живоплотів в Unreal Engine 5"}, {"en": "Foliage and decal passes that age a scene believably", "uk": "Проходи з рослинністю й декалями, які правдоподібно старять сцену"}, {"en": "Lighting recipes and exposure control across a whole open world", "uk": "Рецепти освітлення й контроль експозиції для всього відкритого світу"}, {"en": "Art review against photo reference in r1/r2 rounds", "uk": "Арт-рев'ю за фотореференсами в раундах r1/r2"}]}, "morning": {"sofar": {"en": "Ten weeks in, your island has two districts: a finished waterfront and a second district with roads and paths to every door.", "uk": "Десять тижнів позаду, і на твоєму острові два райони: завершена набережна й другий район із дорогами та стежками до кожних дверей."}, "today": {"en": "You furnish district 2 with fences or walls that follow the land, props placed by use, instanced sets and three small stories.", "uk": "Сьогодні ти облаштовуєш район 2: огорожі чи стіни, що йдуть за рельєфом, пропси, розставлені за призначенням, групи інстансів і три маленькі історії."}, "cheer": {"en": "Props tell a visitor where they are, so let your district's character guide every choice you make.", "uk": "Пропси розповідають відвідувачам, де вони опинилися, тож нехай характер твого району веде кожен твій вибір."}, "quote": {"text": {"en": "Instructions for living a life: Pay attention. Be astonished. Tell about it.", "uk": "Інструкція, як прожити життя: звертай увагу. Дивуйся. Розповідай про це."}, "author": {"en": "Mary Oliver", "uk": "Мері Олівер"}, "source": "https://en.wikiquote.org/wiki/Mary_Oliver"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-51-district2-props-and-furniture", "mapHref": "../../COURSE.html", "prevHref": "../Day-50-boss-district2-built/START-HERE.html", "nextHref": "../Day-52-district2-planting-grime-light/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Blender and Unreal Engine 5.8. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me and don't write code. Keep me moving and make it feel like a game.\n\nToday I build on my own: All of district 2's props and furniture, on your own.\nIt's part of: District 2's props and furniture: fences or walls along the land, street furniture placed by use, repeated sets as Packed Level Actors, and three small stories (L_Island, district 2 (about 200 x 200 m): its streets, paths, field edges or cliff path, its square or viewpoint, and its parking area.).\n\nSpec:\n- props_list_d2.md: every prop from plot_plan_d2.png with its count, its source (your Week 1 set, your kit, a free pack or a new model) and its spot.\n- One new character prop modelled in Blender at real size, in 30 minutes at most. Choose one: a wooden fence panel (2.5 m long, 1.2 m high), a stone wall piece (2 m long, 1.2 m high, 0.6 m thick) or a rope-and-post fence piece (2.5 m long, posts 1 m high). Origin at the bottom centre, UCX collision (UCX_SM_<Name>_00), named SM_<Name>.\n- PCG_FenceAlongSpline: a PCG graph that places your fence or wall piece along a spline, with at least three runs that follow the land (no floating posts, none sunk more than 5 cm).\n- Your Week 1 benches, lamp posts, bins and bollards (and free-pack props) placed by use: benches face a view, bins stand beside benches and doors, lamps line the paths with their heads out of the drone lanes.\n- At least one repeated set (a picnic table with benches, a café set or a group of hay bales) made into a Packed Level Actor and placed 4 or more times.\n- Everything on a new Data Layer asset, DL_D2_Props (made the Day 33 way); stat unit from D2_C4 with the layer shown and hidden, and the props adding no more than about 10 % to the GPU time.\n\nMy checklist:\n1. Load district 2 and take your 'before' shot: pilot D2_C4, press G and type HighResShot 1920x1080. Check: a clean 1920 x 1080 picture of the unfurnished district is in IslandCourse/Saved/Screenshots/WindowsEditor. (from lesson 1)\n2. Write props_list_d2.md from plot_plan_d2.png and your needs list: each prop, its count, its source and its spot. Check: no prop is missing a count, a source or a spot. (from lesson 1)\n3. Make the Data Layer asset DL_D2_Props (type Editor), add it to the Data Layer Outliner and make it current. Check: a test cube you place now shows DL_D2_Props in its Details panel; then delete the cube. (from lesson 1)\n4. Model your character prop in Blender (30 minutes at most), add its UCX box (UCX_SM_<Name>_00), export SM_<Name>.fbx and import it into Content/Island/District2/Props. Check: beside the mannequin it has the right height, and its base sits on the ground. (from lesson 2)\n5. Build PCG_FenceAlongSpline and place the first run along one field edge, garden or path. Check: the pieces follow the spline from end to end with no gaps. (from lesson 2)\n6. Add two or more runs from the plan, and drop every spline point onto the ground (select it and press End, or drag it down with the blue arrow). Check: flying at 2 m along each run, no post floats and none sinks more than 5 cm. (from lesson 2)\n7. Place your Week 1 benches, bins and lamp posts by use at the square or viewpoint and along the paths. Check: every bench faces something worth seeing, and every bin is within 3 m of a bench or a door. (from lesson 3)\n8. Check each free-pack prop before you place it (size, origin, triangles), then place it from your list. Check: its Approx Size matches a real one in your photos within about 10 %. (from lesson 3)\n9. Build one repeated set, make it a Packed Level Actor, and place it 4 or more times, each copy turned a little. Check: the Outliner shows the copies as PLA_ actors, not loose meshes. (from lesson 4)\n10. Place three small stories, for example a gate left open with a bucket beside it, a bike by a door, crates by a shop. Check: from a 10 m screenshot and your description, the tutor can find all three. (from lesson 3)\n11. Slide LaneGauge along every drone lane on plot_plan_d2.png at its height. Check: no lamp head, parasol or fence post touches the cube. (from lesson 3)\n12. Measure the cost: stat unit from D2_C4 with DL_D2_Props shown, then hidden. Check: the props add no more than about 10 % to the GPU time, and both numbers are in budget.md. (from lesson 4)\n13. Take the 'after' shot from D2_C4 and put it beside the 'before' as before_after_day51.png; record a 60-second flight over the district at 10 to 20 m. Save today's clip as flythrough_day51.mp4 and check that you also have pcg_fence_graph.png, fence_run_2m.png and stories_10m.png (each is described in today's hand-in list; take any you are missing now). Check: both shots come from the same camera, and the clip runs about 60 seconds. (from lesson 1)\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Vitaliy\nDay 51: District 2: props and furniture that tell its story. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

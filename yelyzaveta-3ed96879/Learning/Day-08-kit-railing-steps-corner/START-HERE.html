<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 8</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

<script id="data" type="application/json">{"learner": "ib-yelyzaveta-3ed96879", "learnerName": {"en": "Yelyzaveta", "uk": "Єлизавета"}, "day": 8, "week": 2, "total": 60, "title": {"en": "More kit pieces: railing, steps and a corner, and Nanite versus LODs", "uk": "Нові деталі набору: поруччя, сходи й кут, а також Nanite чи LOD"}, "theme": {"en": "Week 2: Modular kits", "uk": "Тиждень 2: Модульні набори"}, "build": {"item": {"en": "Your harbour kit, part 2: SM_Railing_2m, SM_RailingPost, SM_Steps and SM_QuayCorner_Out", "uk": "Твій набір для гавані, частина 2: SM_Railing_2m, SM_RailingPost, SM_Steps і SM_QuayCorner_Out"}, "why": {"en": "Railings, steps and corners turn straight pieces into a real place, and each must follow the same grid and pivot rules. Studios also decide early how Unreal draws each piece: Nanite (cheap detail for solid meshes at any distance) or LODs (lighter copies for far away). Deciding this early keeps a big island running smoothly.", "uk": "Поруччя, сходи й кути роблять із прямих деталей справжнє місце, і всі вони дотримуються тих самих правил сітки та origin. Студії також рано вирішують, як Unreal малює кожну деталь. Nanite — система Unreal, що дешево малює детальні суцільні меші на будь-якій відстані. LOD (рівні деталізації) — простіші копії меша, які Unreal підставляє здалеку. Виріши це рано, і великий острів працюватиме плавно."}, "next": {"en": "These pieces finish the harbour at Friday's Boss. Your Nanite or LOD lines decide whether your island runs smoothly on Day 56, when you measure the whole flight.", "uk": "Ці деталі завершують гавань у п'ятницю, у День боса. Твої рядки «Nanite чи LOD» вирішать, чи плавно працюватиме острів у День 56, коли ти вимірюєш увесь проліт."}, "where": {"en": "Your island's waterfront (district 1): railings along the pier, steps down to a boat landing, and a corner where the quay turns. Today in Course/Day08.", "uk": "Набережна твого острова (район 1): поруччя вздовж пірса, сходи вниз до майданчика для човнів і кут, де причал повертає. Сьогодні — у Course/Day08."}, "spec": [{"en": "kit_rules.md updated: the naming pattern, the new pieces, and one line per piece: Nanite or LODs, and why.", "uk": "Оновлений kit_rules.md: шаблон назв, нові деталі й по рядку на кожну деталь — Nanite чи LOD і чому."}, {"en": "SM_Railing_2m: from your Day 3 railing, exactly 2 m long, with one post at its start only, so railings chain without double posts; pivot at the bottom centre of the start post (Z = 0 on the deck).", "uk": "SM_Railing_2m: з твого поруччя з Дня 3, рівно 2 м завдовжки, зі стійкою лише на початку. Так поруччя з'єднуються в ланцюжок без подвійних стійок. Origin унизу по центру початкової стійки (Z = 0 на настилі)."}, {"en": "SM_RailingPost: the single post, to finish a run.", "uk": "SM_RailingPost: окрема стійка, щоб завершити ряд."}, {"en": "SM_Steps: 2 m wide, 5 steps going down 0.8 m to a boat landing over 2 m (treads 0.4 m, risers 0.16 m), built against the quay's water face; pivot at the top corner at the start, on the wall line.", "uk": "SM_Steps: 2 м завширшки, 5 сходинок, що спускаються на 0,8 м до майданчика для човнів на відстані 2 м (проступи 0,4 м, підступенки 0,16 м). Сходи стоять біля стіни причалу з боку води. Origin у верхньому куті на початку, на лінії стіни."}, {"en": "SM_QuayCorner_Out: a 2 x 2 m outer corner, 3 m deep, with coping along its two water sides, matching SM_QuayEdge_4m exactly.", "uk": "SM_QuayCorner_Out: зовнішній кут 2 × 2 м, 3 м завглибшки, з бровкою вздовж обох боків до води, точно під SM_QuayEdge_4m."}, {"en": "Every piece exported from the world origin with UCX boxes and M_Stone or M_Timber; triangles under 2,000 each.", "uk": "Кожну деталь експортовано з центру світу з блоками UCX і M_Stone або M_Timber; менше 2 000 трикутників на кожну."}, {"en": "In Unreal (Course/Day08, level L_Day08): Nanite on for the steps, the corner, the quay and the deck (Unreal 5.8 turns it on at import); Nanite off and 3 LODs on SM_Railing_2m; the new pieces snapped to your Day 7 quay and pier with no gaps. On older Unreal (4.27): 3 LODs on every piece instead of Nanite.", "uk": "В Unreal (Course/Day08, рівень L_Day08): Nanite увімкнено для сходів, кута, причалу й настилу (Unreal 5.8 вмикає його під час імпорту). На SM_Railing_2m Nanite вимкнено і є 3 LOD. Нові деталі з'єднано з причалом і пірсом з Дня 7 без щілин. У старішому Unreal (4.27) замість Nanite — 3 LOD на кожній деталі."}], "piece1": "SM_Railing_2m, SM_RailingPost and the first SM_Steps (in the lessons)", "piece2": {"en": "SM_Steps finished, SM_QuayCorner_Out, and the pieces placed with Nanite and LODs, on your own", "uk": "Завершені SM_Steps, SM_QuayCorner_Out і деталі, розставлені з Nanite та LOD, самостійно"}, "steps": [{"text": {"en": "Check: the files from today's lessons are in the day work folder (railing_day8.blend, quaykit_day8.blend with your five step blocks, SM_Railing_2m.fbx and SM_RailingPost.fbx), and Unreal has the level L_Day08. Missing one? Do that lesson's do-along now (about 25 minutes); the build needs it. Weak PC? See Weak PC on ACCOUNTS-AND-INSTALLS.html.", "uk": "Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: railing_day8.blend, quaykit_day8.blend із п'ятьма брусками сходинок, SM_Railing_2m.fbx і SM_RailingPost.fbx, а в Unreal є рівень L_Day08. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Слабкий ПК? Див. розділ «Слабкий ПК» на сторінці ACCOUNTS-AND-INSTALLS.html."}, "lesson": 2}, {"text": {"en": "SM_Steps: origin on the pivot (Cursor to World Origin, Origin to 3D Cursor), name it SM_Steps, and give it M_Stone and five UCX boxes, one per step (from its tread down to Z -1.0), named UCX_SM_Steps_00 to _04. Press Ctrl+S. Check: the orange dot sits on the wall line at Z 0, and the boxes follow the steps.", "uk": "SM_Steps: постав origin за правилом (Cursor to World Origin, Origin to 3D Cursor) і назви об'єкт SM_Steps. Дай йому M_Stone і п'ять блоків UCX, по одному на сходинку (від проступу донизу до Z -1.0), з назвами від UCX_SM_Steps_00 до _04. Натисни Ctrl+S. Перевірка: помаранчева точка стоїть на лінії стіни на Z 0, а блоки йдуть сходинками."}, "lesson": "D4.3"}, {"text": {"en": "SM_QuayCorner_Out: hide the other pieces, add a cube 2 x 2 x 3 m with the scale applied, and move it with G X 1, G Y -1, G Z -1.5. Check: the block runs from X 0 to 2 and Y 0 to -2, hanging 3 m down from Z 0.", "uk": "SM_QuayCorner_Out: сховай інші деталі, додай куб із Dimensions X 2, Y 2, Z 3, застосуй масштаб і перемісти його: G X 1, G Y -1, G Z -1.5. Перевірка: брусок іде від X 0 до 2 і від Y 0 до -2 і звисає на 3 м донизу від Z 0."}, "lesson": 2}, {"text": {"en": "Corner coping, both at Z 0: a cube 2.05 x 0.45 x 0.2 m at X 1.025, Y -1.825 (front water side), and a cube 0.45 x 1.6 x 0.2 m at X 1.825, Y -0.8 (right water side). Check: from above (Numpad 7, or the ` pie), the coping makes an L with a 5 cm overhang.", "uk": "Бровка кута, обидві частини на Z 0. Перша — куб X 2.05, Y 0.45, Z 0.2 на X 1.025, Y -1.825 (передній бік до води). Друга — куб X 0.45, Y 1.6, Z 0.2 на X 1.825, Y -0.8 (правий бік до води). Перевірка: згори (Numpad 7 або кругле меню `) бровка утворює літеру L, що нависає на 5 см."}, "lesson": 2}, {"text": {"en": "Bevel the coping (Amount 0.01 m, Segments 2) and apply it; add 5 loop cuts on the wall for stone rows, as on SM_QuayEdge_4m. Check: the stone rows line up in height with the straight piece's rows.", "uk": "Зроби фаску на бровці (Bevel: Amount 0.01 м, Segments 2) і застосуй її. Додай на стіні 5 петлевих розрізів для рядів каміння, як на SM_QuayEdge_4m. Перевірка: ряди каміння за висотою збігаються з рядами прямої деталі."}, "lesson": "D7.3"}, {"text": {"en": "Join the coping into the block, name it SM_QuayCorner_Out, put the origin on the pivot, give it M_Stone and add three UCX boxes (the block and the two coping strips). Press Ctrl+S. Check: Location 0, 0, 0 and three names starting with UCX_SM_QuayCorner_Out_.", "uk": "Об'єднай бровку з бруском, назви об'єкт SM_QuayCorner_Out і постав origin за правилом. Дай йому M_Stone і три блоки UCX: брусок і дві смуги бровки. Натисни Ctrl+S. Перевірка: Location 0, 0, 0, і є три назви, що починаються з UCX_SM_QuayCorner_Out_."}, "lesson": "D4.3"}, {"text": {"en": "Check each new piece sits at the world origin with fewer than 2,000 triangles, then export SM_Steps.fbx and SM_QuayCorner_Out.fbx with their UCX boxes. Check: each file is 10 KB or more in File Explorer (4 KB means nothing was selected).", "uk": "Перевір, чи кожна нова деталь стоїть у центрі світу й має менше 2 000 трикутників. Потім експортуй SM_Steps.fbx і SM_QuayCorner_Out.fbx з їхніми блоками UCX. Перевірка: у Провіднику кожен файл має 10 КБ або більше (4 КБ означає, що нічого не було виділено)."}, "lesson": "D4.4"}, {"text": {"en": "Import both into Course/Day08 with your checklist. Unreal 5.8 turns Nanite on at import: in each Static Mesh Editor check Enable Nanite Support (tick it, Apply Changes). Check: Nanite Visualization > Overview shows quay, deck, steps and corner in colour. Older Unreal (4.27) or weak PC: no Nanite on 4.27; set Number of LODs to 3 on each piece instead.", "uk": "Імпортуй обидва в Course/Day08 за чек-листом. Unreal 5.8 вмикає Nanite під час імпорту: у Static Mesh Editor кожного перевір Enable Nanite Support (увімкни прапорець, Apply Changes). Перевірка: у Nanite Visualization > Overview причал, настил, сходи й кут кольорові. Старіший Unreal (4.27) або слабкий ПК: у 4.27 немає Nanite; натомість постав Number of LODs на 3 для кожної деталі."}, "lesson": 3}, {"text": {"en": "In L_Day08, place the corner at the end of the quay run and the steps against the quay's water face beside the pier, joining them with vertex snap. Check: the corner's coping continues the quay's coping, and the top step sits just below the deck.", "uk": "У L_Day08 постав кут у кінці ряду причалу, а сходи — біля стіни причалу з боку води поруч із пірсом. З'єднай їх прив'язкою до вершин. Перевірка: бровка кута продовжує бровку причалу, а верхня сходинка лежить трохи нижче за причал."}, "lesson": "D7.4"}, {"text": {"en": "Railings: run SM_Railing_2m along both sides of the pier with vertex snap (six per side) and finish each run with SM_RailingPost. Press Ctrl+S. Check: posts every 2 m, no double posts, and a post at each end.", "uk": "Поруччя: постав SM_Railing_2m уздовж обох боків пірса прив'язкою до вершин, по шість на бік, і заверши кожен ряд стійкою SM_RailingPost. Натисни Ctrl+S. Перевірка: стійки кожні 2 м, без подвійних стійок, і стійка на кожному кінці."}, "lesson": 1}, {"text": {"en": "Fly slowly along a railing in View Mode > Level of Detail Coloration > Mesh LODs and take lod_coloration.png. Then write one line per kit piece in kit_rules.md: Nanite or LODs, and why. Check: the colours change with distance, you can't see the swap in Lit view, and in Nanite Visualization > Overview the railing stays dark, and kit_rules.md has six lines.", "uk": "Повільно пролети вздовж поруччя в режимі View Mode > Level of Detail Coloration > Mesh LODs і збережи скриншот lod_coloration.png. Потім запиши в kit_rules.md по рядку на кожну деталь набору: Nanite чи LOD і чому. Перевірка: колір змінюється з відстанню, у режимі Lit заміни не видно, а в Nanite Visualization > Overview поруччя лишається темним, а в kit_rules.md шість рядків."}, "lesson": 4}, {"text": {"en": "Save check: close Blender and reopen quaykit_day8.blend. Report and hand-in: click Copy the day report at the bottom of the page, paste it into a new chat and answer. Open summary.md in Notepad, press Ctrl+End, paste the answer and press Ctrl+S. Then drag the files on the Hand in list into your hand-in folder. Check: SM_Steps and SM_QuayCorner_Out are in the Outliner, and every name shows in the folder, each with a size.", "uk": "Перевір збереження: закрий Blender і знову відкрий quaykit_day8.blend. Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: SM_Steps і SM_QuayCorner_Out є в Outliner, а кожна назва зі списку є в папці, у кожної є розмір."}, "lesson": 3}]}, "lessons": [{"title": {"en": "Kit names, and SM_Railing_2m from your Day 3 railing", "uk": "Назви деталей набору і SM_Railing_2m із твого поруччя з Дня 3"}, "minutes": 40, "goals": [{"en": "Name kit pieces with one pattern: SM_ + what it is + its size or type (SM_Railing_2m, SM_QuayCorner_Out).", "uk": "Називати деталі набору за одним шаблоном: SM_ + що це + розмір або тип (SM_Railing_2m, SM_QuayCorner_Out)."}, {"en": "Explain why a chaining piece has a post at one end only, and why a run needs an end piece (SM_RailingPost).", "uk": "Пояснювати, чому деталь для ланцюжка має стійку лише з одного кінця і чому ряду потрібна кінцева деталь (SM_RailingPost)."}, {"en": "Move a piece's origin to the kit pivot and test that two copies chain exactly.", "uk": "Переносити origin деталі в точку за правилом набору й перевіряти, чи дві копії точно з'єднуються в ланцюжок."}], "doalong": [{"en": "Open railing_day3.blend, Save As railing_day8.blend and delete any Day 6 UCX boxes. Select SM_RailingSection, Tab, hover the right-hand post and press L, then P > Selection: the post becomes its own object. Tab out and name them SM_RailingPost and SM_Railing_2m.", "uk": "Відкрий railing_day3.blend, збережи як railing_day8.blend (Save As) і видали блоки UCX із Дня 6, якщо є. Виділи SM_RailingSection, натисни Tab, наведи мишу на праву стійку й натисни L, потім P > Selection: стійка стає окремим об'єктом. Вийди з Edit Mode (Tab) і назви їх SM_RailingPost і SM_Railing_2m."}, {"en": "Put the railing's pivot at the bottom of its left post: Tab, press 3, click the post's bottom face, Shift+S > Cursor to Selected, Tab out, then Object > Set Origin > Origin to 3D Cursor. Press Alt+G: the railing moves so its pivot sits on the world origin.", "uk": "Постав origin поруччя внизу його лівої стійки. Tab, натисни 3, клацни нижню грань стійки, потім Shift+S > Cursor to Selected. Вийди з Edit Mode (Tab) і вибери Object > Set Origin > Origin to 3D Cursor. Натисни Alt+G: поруччя переміщується так, що його origin стає в центр світу."}, {"en": "Test the chain: with snapping on, Shift+D and type X 2 Enter. The copy's post sits exactly where the first railing's rails end. Delete the copy.", "uk": "Перевір ланцюжок: з увімкненою прив'язкою натисни Shift+D і введи X 2 Enter. Стійка копії стоїть точно там, де закінчуються поручні першого поруччя. Видали копію."}, {"en": "Do the same for SM_RailingPost: its origin at its bottom centre, then Alt+G. Hide it.", "uk": "Зроби те саме для SM_RailingPost: origin унизу по центру, потім Alt+G. Сховай стійку."}, {"en": "Add UCX boxes: UCX_SM_Railing_2m_00 (the post) and _01 (the rails and bars), and UCX_SM_RailingPost_00, each with its own piece's origin. Export SM_Railing_2m.fbx and SM_RailingPost.fbx, one at a time, each with its boxes. Check: each file is 10 KB or more.", "uk": "Додай блоки UCX: UCX_SM_Railing_2m_00 (стійка) і _01 (поручні з балясинами), а також UCX_SM_RailingPost_00. Кожен блок має origin своєї деталі. Експортуй SM_Railing_2m.fbx і SM_RailingPost.fbx по одному, кожен зі своїми блоками. Перевірка: кожен файл має 10 КБ або більше."}], "play": {"en": "Name police: the tutor reads ten piece names from an imaginary kit (Railing2, sm_steps, SM_Quay_Corner_outside_v3, wall final...); I rewrite each one with the course pattern in 3 minutes.", "uk": "Поліція назв: тьютор читає десять назв деталей з уявного набору (Railing2, sm_steps, SM_Quay_Corner_outside_v3, wall final…). За 3 хвилини я переписую кожну за шаблоном курсу."}, "video": {"search": "modular kit naming convention unreal engine"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your 2nd message at the latest.\n- Never jump ahead to a later step, or to a tool I haven't learned yet.\n- Never ask about my gender and never use gendered forms about me: ask «Чи доводилося тобі…», never «Ти вже робив(-ла)…».\n\nLesson: Назви деталей набору і SM_Railing_2m із твого поруччя з Дня 3 (Day 8, lesson 1 of 4). Today's build: Твій набір для гавані, частина 2: SM_Railing_2m, SM_RailingPost, SM_Steps і SM_QuayCorner_Out.\nWhat I already know: День 7: SM_QuayEdge_4m, SM_PierDeck_4m, kit_rules.md і L_Day07; День 6: SM_RailingSection (твоє поруччя з Дня 3 з блоками UCX) і твій чек-лист імпорту; День 2: грані в Edit Mode і введені рухи — для сходів.\n\nBy the end of this lesson I can:\n1. Називати деталі набору за одним шаблоном: SM_ + що це + розмір або тип (SM_Railing_2m, SM_QuayCorner_Out).\n2. Пояснювати, чому деталь для ланцюжка має стійку лише з одного кінця і чому ряду потрібна кінцева деталь (SM_RailingPost).\n3. Переносити origin деталі в точку за правилом набору й перевіряти, чи дві копії точно з'єднуються в ланцюжок.\n\nRun the lesson in this order; it should take 40 to 50 minutes:\n1. Your first message, at most 7 short lines: a 2-line welcome (what I have achieved so far: Твій набір для гавані вже почався: кам'яний край причалу й дерев'яний настил пірса стикуються на метричній сітці. Today: Сьогодні ти додаєш до набору поруччя, стійку, сходи й зовнішній кут і для кожної деталі вирішуєш: Nanite чи LOD. One encouraging line: До вибору між Nanite і LOD ти ще не раз повернешся, тож сьогодні запиши свої найкращі міркування, а згодом уточниш їх.); 2 lines on why today matters and where it comes back, in plain words (from this: Поруччя, сходи й кути роблять із прямих деталей справжнє місце, і всі вони дотримуються тих самих правил сітки та origin. Студії також рано вирішують, як Unreal малює кожну деталь. Nanite — система Unreal, що дешево малює детальні суцільні меші на будь-якій відстані. LOD (рівні деталізації) — простіші копії меша, які Unreal підставляє здалеку. Виріши це рано, і великий острів працюватиме плавно. It comes back: Ці деталі завершують гавань у п'ятницю, у День боса. Твої рядки «Nanite чи LOD» вирішать, чи плавно працюватиме острів у День 56, коли ти вимірюєш увесь проліт.); then ask exactly: «Чи доводилося тобі вже це робити (цілі уроку вище)? А) ніколи Б) трохи В) так». If I answer В, keep your explanations shorter; don't test me now.\n2. Check where I am, one message each: first, today's day work folder (робоча папка дня) GAD\\Day-08-kit-railing-steps-corner exists (GAD is on the drive I chose on Day 0, for example D:\\GAD); if it doesn't, guide me to make it in File Explorer, as on Day 0. Then ask which program and which file are open (the name shows at the top of the window). If it's the wrong file, help me open or make the right one, and never let me change a file from an earlier day.\n3. Do-along on today's build (SM_Railing_2m, SM_RailingPost і перша версія SM_Steps (на уроках)). My steps are the lesson: give them one per message, in order, with one sentence on why, the exact clicks and what I should see. When a step uses one of the goals above for the first time, explain that goal in at most 2 sentences right there, not before. Ask for a screenshot (Win+Shift+S, then Ctrl+V here) only at the steps marked [screenshot]; at the others, ask me to answer in a few words.\n   1. Відкрий railing_day3.blend, збережи як railing_day8.blend (Save As) і видали блоки UCX із Дня 6, якщо є. Ви  a mesh that Unreal swaps in as it gets smaller on screen.", "uk": "Пояснювати, що таке LOD (рівні деталізації): легші копії меша, які Unreal підставляє, коли меш стає меншим на екрані."}, {"en": "Make automatic LODs in the Static Mesh Editor (LOD Settings > Number of LODs, Apply Changes) and look at each one.", "uk": "Робити автоматичні LOD у Static Mesh Editor (LOD Settings > Number of LODs, Apply Changes) і роздивлятися кожен."}, {"en": "Set screen sizes so the swap happens where nobody notices, and check it with LOD coloration.", "uk": "Задавати Screen Size так, щоб заміну ніхто не помічав, і перевіряти це режимом LOD Coloration."}], "doalong": [{"en": "Import SM_Railing_2m.fbx and SM_RailingPost.fbx into Course/Day08 with your import checklist (Build Nanite unticked for railings and posts). Double-click SM_Railing_2m.", "uk": "Імпортуй SM_Railing_2m.fbx і SM_RailingPost.fbx у Course/Day08 за своїм чек-листом імпорту: для поруччя й стійок прапорець Build Nanite знято. Двічі клацни SM_Railing_2m."}, {"en": "First make sure Nanite is off for the railing: Details > Nanite Settings > untick Enable Nanite Support > Apply Changes. Then in LOD Settings set Number of LODs to 3 and click Apply Changes. Check: the LOD menu in the toolbar now lists LOD0 to LOD2.", "uk": "Спершу переконайся, що Nanite для поруччя вимкнено: Details > Nanite Settings > зніми прапорець Enable Nanite Support > Apply Changes. Потім у LOD Settings постав Number of LODs на 3 і клацни Apply Changes. Перевірка: меню LOD на панелі інструментів тепер показує LOD0, LOD1 і LOD2."}, {"en": "Use the LOD menu in the Static Mesh Editor's toolbar to view LOD0, LOD1 and LOD2. Note the triangles of each at the top left: each one is lighter. All three live inside the one asset SM_Railing_2m: that is why your asset names carry no LOD number.", "uk": "Меню LOD на панелі інструментів Static Mesh Editor перемикає LOD0, LOD1 і LOD2. Угорі ліворуч подивися кількість трикутників кожного: кожен наступний легший. Усі три живуть усередині одного асета SM_Railing_2m — тому в назвах асетів немає номера LOD."}, {"en": "Untick Auto Compute LOD Distances. Screen Size is how much of the screen the mesh fills (1 is the whole screen). Set the Screen Size of LOD1 to 0.3 and of LOD2 to 0.1. Click Apply Changes.", "uk": "Зніми прапорець Auto Compute LOD Distances. Screen Size — частка екрана, яку займає меш (1 — увесь екран). Постав Screen Size для LOD1 на 0.3, а для LOD2 на 0.1. Клацни Apply Changes."}, {"en": "In the level, place two railings on the pier edge with vertex snap. Switch View Mode to Level of Detail Coloration > Mesh LODs and fly slowly towards them: the colour changes as you get closer.", "uk": "У рівні постав два поруччя на край пірса прив'язкою до вершин. Перемкни View Mode на Level of Detail Coloration > Mesh LODs і повільно лети до них: колір змінюється, коли ти наближаєшся."}], "play": {"en": "Spot the swap: I record a 10-second slow approach to the railing in Lit view; the tutor asks at which second the LOD changed, and I check my answer with LOD coloration.", "uk": "Спіймай заміну: я записую 10-секундне повільне наближення до поруччя в режимі Lit. Тьютор питає, на якій секунді змінився LOD, а я перевіряю відповідь режимом LOD Coloration."}, "video": {"search": "unreal engine 5 static mesh LOD settings screen size"}, "prompt": "You are my tutor for one 40-minute lesson. I am a beginner. Speak simple, natural Ukrainian with me (not a word-for-word translation); keep menu, tool, panel and key names in English, and use the Ukrainian words exactly as my steps below write them. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps.\n\nHow to write every message (the most important rules):\n- ONE action per message, in at most 5 short lines (7 when the message also explains a goal). No headings, tables or long lists.\n- End with one short question about what I see, then wait for my answer.\n- My first real action comes in your ля LOD2 на 0.1. Клацни Apply Changes.\n   5. У рівні постав два поруччя на край пірса прив'язкою до вершин. Перемкни View Mode на Level of Detail Coloration > Mesh LODs і повільно лети до них: колір змінюється, коли ти наближаєшся. [screenshot]\n4. If a goal above wasn't covered by a step, teach it now in at most 2 sentences and a 1-minute task.\n5. Bonus, only if we're under about 35 minutes and I want it (5 minutes at most): Спіймай заміну: я записую 10-секундне повільне наближення до поруччя в режимі Lit. Тьютор питає, на якій секунді змінився LOD, а я перевіряю відповідь режимом LOD Coloration. Otherwise skip it.\n6. Finish with 1 multiple-choice question that checks the hardest goal, then tell me the right answer and why.\n7. Then write my lesson summary as two short lines in Ukrainian that I can copy: «Засвоєно: …» and «Було важко: …». Tell me to paste them into the box under this lesson on my course page.\n\nIf I'm stuck, split the step into smaller ones; after two tries, give me the exact keys or the menu path. If a shortcut does nothing (a laptop with no numpad, the Home key, an overlay such as NVIDIA's on Alt+Z), give me the menu path instead. If my screen differs from what you expect, ask for a screenshot and tell me what to look for. If you're not sure about a detail of my versions, say so instead of guessing. My steps and their numbers are checked for my versions: follow them.\nIf I write \"пауза\", write two lines saying where we stopped, so I can paste them into a new chat later.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets y / waterfront / pier = гавань / причал / набережна / пірс; bollard / bench / slat / litter bin / lamp post = стовпчик / лавка / планка / урна / ліхтарний стовп; shop front / shop window = фасад крамниці / вітрина; vista / blockout / landmark = панорама / блокаут / орієнтир; set (of textures, decals, lights) = комплект; day work folder (on your PC) = робоча папка дня; build (the afternoon work on your own) = самостійна робота; proof (picture) = доказ.\n\nStart now with step 1.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). Never ask about my gender."}], "handin": [{"en": "summary.md", "uk": "summary.md (звіт дня)"}, {"en": "quaykit_day8.blend and railing_day8.blend: your harbour kit, which gets UVs on Day 11 (→ Day 11)", "uk": "quaykit_day8.blend і railing_day8.blend: твій набір для гавані, який у День 11 отримає UV (→ День 11)"}, {"en": "lod_coloration.png: your LOD railing in Unreal (proof)", "uk": "lod_coloration.png (твоє поруччя з LOD в Unreal) (доказ)"}], "goal": {"en": "By the end of today you have SM_Railing_2m, SM_RailingPost, SM_Steps and SM_QuayCorner_Out on your kit grid, each with a written Nanite or LOD decision, snapped to your quay and pier in Unreal.", "uk": "До кінця дня в тебе є SM_Railing_2m, SM_RailingPost, SM_Steps і SM_QuayCorner_Out на сітці твого набору. Для кожної деталі записано рішення «Nanite чи LOD», і всі вони з'єднані з твоїм причалом і пірсом в Unreal."}, "uses": [{"en": "Day 7: SM_QuayEdge_4m, SM_PierDeck_4m, kit_rules.md and L_Day07", "uk": "День 7: SM_QuayEdge_4m, SM_PierDeck_4m, kit_rules.md і L_Day07"}, {"en": "Day 6: SM_RailingSection (your Day 3 railing with UCX boxes) and your import checklist", "uk": "День 6: SM_RailingSection (твоє поруччя з Дня 3 з блоками UCX) і твій чек-лист імпорту"}, {"en": "Day 2: Edit Mode faces and typed moves, for the steps", "uk": "День 2: грані в Edit Mode і введені рухи — для сходів"}], "quiz": [{"q": {"en": "Why does SM_Railing_2m have a post at one end only?", "uk": "Чому SM_Railing_2m має стійку лише з одного кінця?"}, "options": [{"en": "To save triangles only", "uk": "Лише щоб заощадити трикутники"}, {"en": "So railings chain without two posts in the same spot; SM_RailingPost finishes a run", "uk": "Щоб поруччя з'єднувалися в ланцюжок без двох стійок в одному місці; SM_RailingPost завершує ряд"}, {"en": "Unreal can't import two posts in one mesh", "uk": "Unreal не може імпортувати дві стійки в одному меші"}], "answer": 1, "explain": {"en": "Two posts in exactly the same place would overlap and flicker. One post per piece plus an end post gives a clean run.", "uk": "Дві стійки точно в одному місці накладалися б і мерехтіли. Одна стійка на деталь плюс кінцева стійка дають чистий ряд."}}, {"q": {"en": "Which of these keeps Nanite off under the course rule?", "uk": "Для чого з цього списку за правилом курсу Nanite вимикають?"}, "options": [{"en": "SM_QuayEdge_4m", "uk": "SM_QuayEdge_4m"}, {"en": "SM_PierDeck_4m", "uk": "SM_PierDeck_4m"}, {"en": "A glass shop window", "uk": "Скляна вітрина"}, {"en": "SM_Steps", "uk": "SM_Steps"}], "answer": 2, "explain": {"en": "Nanite draws solid meshes. See-through glass is drawn another way, so glass pieces stay out of Nanite.", "uk": "Nanite малює суцільні меші. Прозоре скло малюється інакше, тож скляні деталі лишаються без Nanite."}}, {"q": {"en": "Your railings visibly 'jump' to a simpler shape when you fly towards them. What do you change?", "uk": "Коли ти летиш до поруччя, воно помітно «стрибає» до простішої форми. Що змінити?"}, "options": [{"en": "The LOD screen sizes, so the swap happens when the railing is smaller on screen", "uk": "Screen Size для LOD, щоб заміна відбувалася, коли поруччя менше на екрані"}, {"en": "The railing's material", "uk": "Матеріал поруччя"}, {"en": "The grid snap", "uk": "Прив'язку до сітки"}], "answer": 0, "explain": {"en": "The lower the Screen Size, the further away each LOD swap happens, where nobody can see it.", "uk": "Що менше Screen Size, то далі від камери Unreal перемикає LOD. Здалеку таку заміну не видно."}}, {"q": {"en": "A flight of steps in a photo has 25 cm risers and 20 cm treads. What will walking them feel like?", "uk": "На фото сходовий марш має підступенки 25 см і проступи 20 см. Як по ньому ходити?"}, "options": [{"en": "Comfortable", "uk": "Зручно"}, {"en": "Steep and awkward: the risers are too high and the treads too short", "uk": "Круто й незграбно: підступенки зависокі, а проступи закороткі"}, {"en": "Too flat", "uk": "Надто полого"}], "answer": 1, "explain": {"en": "Comfortable outdoor steps have risers of about 15 to 17 cm and treads of about 30 to 40 cm.", "uk": "Зручні вуличні сходи мають підступенки близько 15–17 см і проступи близько 30–40 см."}}, {"q": {"en": "You turn SM_QuayCorner_Out to fit the end of your quay, but its coping faces the land. What happened?", "uk": "Ти повертаєш SM_QuayCorner_Out до кінця причалу, але його бровка дивиться на суходіл. Що сталося?"}, "options": [{"en": "Its triangles are too high", "uk": "У нього забагато трикутників"}, {"en": "Nanite is off", "uk": "Nanite вимкнено"}, {"en": "It needs another 90 or 180 degrees, so its water sides face the water", "uk": "Його треба повернути ще на 90 або 180 градусів, щоб боки до води дивилися на воду"}], "answer": 2, "explain": {"en": "Every kit piece has its water sides set by the rule; turn it until those sides face the water, then snap it.", "uk": "У кожної деталі набору боки до води задано правилом. Повертай деталь, доки ці боки не дивитимуться на воду, а потім з'єднуй."}}], "weekInfo": {"week": 2, "title": {"en": "Modular kits", "uk": "Модульні набори"}, "goal": {"en": "By Friday you have your own harbour and building kit on a metric grid, and L_KitTest: a quay, a pier and a harbour house built from it in Unreal, with the house saved as a Level Instance.", "uk": "До п'ятниці в тебе є власний набір для гавані й будівель на метричній сітці. Із нього в Unreal зібрано рівень L_KitTest: причал, пірс і будинок біля гавані, а будинок збережено як Level Instance."}, "skills": [{"en": "Modular kit design on a metric grid with consistent pivots", "uk": "Дизайн модульного набору на метричній сітці з однаковими origin"}, {"en": "Unreal Engine 5 level assembly: import pipeline, exact placement and snapping", "uk": "Збирання рівня в Unreal Engine 5: імпорт, точне розміщення та прив'язка (snapping)"}, {"en": "Nanite versus LOD decisions for real-time performance", "uk": "Вибір між Nanite і LOD заради продуктивності в реальному часі"}, {"en": "Level Instances for reusable building sets", "uk": "Level Instance для будівель, які ставлять багато разів"}, {"en": "Content Browser organisation and industry naming conventions (SM_, M_, MI_, T_, L_)", "uk": "Порядок у Content Browser і галузеві правила назв (SM_, M_, MI_, T_, L_)"}]}, "morning": {"sofar": {"en": "Your harbour kit has begun: a stone quay edge and a timber pier deck that snap together on a metric grid.", "uk": "Твій набір для гавані вже почався: кам'яний край причалу й дерев'яний настил пірса стикуються на метричній сітці."}, "today": {"en": "You add a railing, a railing post, steps and an outer corner to the kit, and decide for each piece whether it uses Nanite or LODs.", "uk": "Сьогодні ти додаєш до набору поруччя, стійку, сходи й зовнішній кут і для кожної деталі вирішуєш: Nanite чи LOD."}, "cheer": {"en": "Nanite and LODs are choices you will keep growing into, so write down your best reasoning today and refine it later.", "uk": "До вибору між Nanite і LOD ти ще не раз повернешся, тож сьогодні запиши свої найкращі міркування, а згодом уточниш їх."}, "quote": {"text": {"en": "It's not just what it looks like and feels like. Design is how it works.", "uk": "Дизайн — це не лише те, як річ виглядає і які відчуття викликає. Дизайн — це те, як вона працює."}, "author": {"en": "Steve Jobs", "uk": "Стів Джобс"}, "source": "https://en.wikiquote.org/wiki/Steve_Jobs"}}, "hasAssets": false, "workPath": "Work\\Assignment\\Day-08-kit-railing-steps-corner", "mapHref": "../../COURSE.html", "prevHref": "../Day-07-harbour-kit-quay-and-pier/START-HERE.html", "nextHref": "../Day-09-building-kit/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Blender and Unreal Engine 5.8. I am a beginner on Day 8. Speak simple, natural Ukrainian with me; keep menu, tool and key names in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't do the work for me and don't write code.\nEvery message: ONE step, at most 5 short lines, ending with one question. Then wait for my answer. Never ask about my gender and never use gendered forms about me.\n\nToday I build on my own: Завершені SM_Steps, SM_QuayCorner_Out і деталі, розставлені з Nanite та LOD, самостійно.\nIt's part of: Твій набір для гавані, частина 2: SM_Railing_2m, SM_RailingPost, SM_Steps і SM_QuayCorner_Out (Набережна твого острова (район 1): поруччя вздовж пірса, сходи вниз до майданчика для човнів і кут, де причал повертає. Сьогодні — у Course/Day08.).\nWhy it matters: Поруччя, сходи й кути роблять із прямих деталей справжнє місце, і всі вони дотримуються тих самих правил сітки та origin. Студії також рано вирішують, як Unreal малює кожну деталь. Nanite — система Unreal, що дешево малює детальні суцільні меші на будь-якій відстані. LOD (рівні деталізації) — простіші копії меша, які Unreal підставляє здалеку. Виріши це рано, і великий острів працюватиме плавно. It comes back: Ці деталі завершують гавань у п'ятницю, у День боса. Твої рядки «Nanite чи LOD» вирішать, чи плавно працюватиме острів у День 56, коли ти вимірюєш увесь проліт.\nMy files for today live in today's day work folder (робоча папка дня): GAD\\Day-08-kit-railing-steps-corner (on the drive I chose on Day 0).\nWhat I already know: День 7: SM_QuayEdge_4m, SM_PierDeck_4m, kit_rules.md і L_Day07; День 6: SM_RailingSection (твоє поруччя з Дня 3 з блоками UCX) і твій чек-лист імпорту; День 2: грані в Edit Mode і введені рухи — для сходів; today's lessons: Назви деталей набору і SM_Railing_2m із твого поруччя з Дня 3; Кути й сходи на сітці; Nanite: коли допомагає, а коли ні; LOD для деталей без Nanite. Use only tools from these; if a part needs a tool I haven't learned, say so first.\n\nMy design comes from MY references:\n- Keep my reference photo or sketch and my sizes in mind all session.\n- The numbers in my checklist are examples. Where my measured sizes differ, my sizes win.\n- Never simplify my design to save time. Every part that changes the outline seen from 5 metres stays. If a part needs a tool I don't know yet, say so, offer the closest way with the tools I know, and let me choose. Write each detail we leave out on a \"Later:\" line in my notes.\n- A triangle or size budget is a limit, not a target. Only if I go over it, show me where to lower it.\n\nSpec:\n- Оновлений kit_rules.md: шаблон назв, нові деталі й по рядку на кожну деталь — Nanite чи LOD і чому.\n- SM_Railing_2m: з твого поруччя з Дня 3, рівно 2 м завдовжки, зі стійкою лише на початку. Так поруччя з'єднуються в ланцюжок без подвійних стійок. Origin унизу по центру початкової стійки (Z = 0 на настилі).\n- SM_RailingPost: окрема стійка, щоб завершити ряд.\n- SM_Steps: 2 м завширшки, 5 сходинок, що спускаються на 0,8 м до майданчика для човнів на відстані 2 м (проступи 0,4 м, підступенки 0,16 м). Сходи стоять біля стіни причалу з боку води. Origin у верхньому куті на початку, на лінії стіни.\n- SM_QuayCorner_Out: зовнішній кут 2 × 2 м, 3 м завглибшки, з бровкою вздовж обох боків до води, точно під SM_QuayEdge_4m.\n- Кожну деталь експортовано з центру світу з блоками UCX і M_Stone або M_Timber; менше 2 000 трикутників на кожну.\n- В Unreal (Course/Day08, рівень L_Day08): Nanite увімкнено для сходів, кута, причалу й настилу (Unreal 5.8 вмикає його під час імпорту). На SM_Railing_2m Nanite вимкнено і є 3 LOD. Нові деталі з'єднано з причалом і пірсом з Дня 7 без щілин. У старішому Unreal (4.27) замість Nanite — 3 LOD на кожній деталі.\n\nMy checklist (the same numbers show on my course page):\n1. Спершу переконайся, що файли з сьогоднішніх уроків лежать у робочій папці дня: railing_day8.blend, quaykit_day8.blend із п'ятьма брусками сходинок, SM_Railing_2m.fbx і SM_RailingPost.fbx, а в Unreal є рівень L_Day08. Чогось бракує? Пройди зараз кроки «Разом із тьютором» з того уроку (близько 25 хв): без них самостійна робота не вийде. Слабкий ПК? Див. розділ «Слабкий ПК» на сторінці ACCOUNTS-AND-INSTALLS.html. (from lesson 2)\n2. SM_Steps: постав origin за правилом (Cursor to World Origin, Origin to 3D Cursor) і назви об'єкт SM_Steps. Дай йому M_Stone і п'ять блоків UCX, по одному на сходинку (від проступу донизу до Z -1.0), з назвами від UCX_SM_Steps_00 до _04. Натисни Ctrl+S. Перевірка: помаранчева точка стоїть на лінії стіни на Z 0, а блоки йдуть сходинками. (from day 4, lesson 3)\n3. SM_QuayCorner_Out: сховай інші деталі, додай куб із Dimensions X 2, Y 2, Z 3, застосуй масштаб і перемісти його: G X 1, G Y -1, G Z -1.5. Перевірка: брусок іде від X 0 до 2 і від Y 0 до -2 і звисає на 3 м донизу від Z 0. (from lesson 2)\n4. Бровка кута, обидві частини на Z 0. Перша — куб X 2.05, Y 0.45, Z 0.2 на X 1.025, Y -1.825 (передній бік до води). Друга — куб X 0.45, Y 1.6, Z 0.2 на X 1.825, Y -0.8 (правий бік до води). Перевірка: згори (Numpad 7 або кругле меню `) бровка утворює літеру L, що нависає на 5 см. (from lesson 2)\n5. Зроби фаску на бровці (Bevel: Amount 0.01 м, Segments 2) і застосуй її. Додай на стіні 5 петлевих розрізів для рядів каміння, як на SM_QuayEdge_4m. Перевірка: ряди каміння за висотою збігаються з рядами прямої деталі. (from day 7, lesson 3)\n6. Об'єднай бровку з бруском, назви об'єкт SM_QuayCorner_Out і постав origin за правилом. Дай йому M_Stone і три блоки UCX: брусок і дві смуги бровки. Натисни Ctrl+S. Перевірка: Location 0, 0, 0, і є три назви, що починаються з UCX_SM_QuayCorner_Out_. (from day 4, lesson 3)\n7. Перевір, чи кожна нова деталь стоїть у центрі світу й має менше 2 000 трикутників. Потім експортуй SM_Steps.fbx і SM_QuayCorner_Out.fbx з їхніми блоками UCX. Перевірка: у Провіднику кожен файл має 10 КБ або більше (4 КБ означає, що нічого не було виділено). (from day 4, lesson 4)\n8. Імпортуй обидва в Course/Day08 за чек-листом. Unreal 5.8 вмикає Nanite під час імпорту: у Static Mesh Editor кожного перевір Enable Nanite Support (увімкни прапорець, Apply Changes). Перевірка: у Nanite Visualization > Overview причал, настил, сходи й кут кольорові. Старіший Unreal (4.27) або слабкий ПК: у 4.27 немає Nanite; натомість постав Number of LODs на 3 для кожної деталі. (from lesson 3)\n9. У L_Day08 постав кут у кінці ряду причалу, а сходи — біля стіни причалу з боку води поруч із пірсом. З'єднай їх прив'язкою до вершин. Перевірка: бровка кута продовжує бровку причалу, а верхня сходинка лежить трохи нижче за причал. (from day 7, lesson 4)\n10. Поруччя: постав SM_Railing_2m уздовж обох боків пірса прив'язкою до вершин, по шість на бік, і заверши кожен ряд стійкою SM_RailingPost. Натисни Ctrl+S. Перевірка: стійки кожні 2 м, без подвійних стійок, і стійка на кожному кінці. (from lesson 1)\n11. Повільно пролети вздовж поруччя в режимі View Mode > Level of Detail Coloration > Mesh LODs і збережи скриншот lod_coloration.png. Потім запиши в kit_rules.md по рядку на кожну деталь набору: Nanite чи LOD і чому. Перевірка: колір змінюється з відстанню, у режимі Lit заміни не видно, а в Nanite Visualization > Overview поруччя лишається темним, а в kit_rules.md шість рядків. (from lesson 4)\n12. Перевір збереження: закрий Blender і знову відкрий quaykit_day8.blend. Звіт і здача. Натисни «Копіювати звіт дня» внизу сторінки, встав у новий чат і відповідай. Відкрий summary.md у Блокноті, натисни Ctrl+End, встав відповідь і натисни Ctrl+S. Потім перетягни файли зі списку «Що здати» в папку здачі. Перевірка: SM_Steps і SM_QuayCorner_Out є в Outliner, а кожна назва зі списку є в папці, у кожної є розмір. (from lesson 3)\n\nHow to help: ask which step number I'm on, then give me only the next step: the exact clicks and what I should see. When I send a screenshot, compare it with my reference, my sizes and the spec, and name one thing to fix at a time.\nCheck every save and export by reopening it before we move on:\n- a .blend: close Blender, double-click the file in today's day work folder (GAD\\Day-08-kit-railing-steps-corner), and the model is there (an empty grid means the wrong file was saved)\n- a .md or .txt: open it with Notepad; the text is there, and the name doesn't end in .md.txt\nWhen I write \"готово\", and in any case before the day ends, check with me one item at a time (yes/no): each spec point, then each file on my hand-in list, ready in my day work folder (skip summary.md: the day report writes it next):\n1. quaykit_day8.blend і railing_day8.blend: твій набір для гавані, який у День 11 отримає UV (→ День 11)\n2. lod_coloration.png (твоє поруччя з LOD в Unreal) (доказ)\nFinish with a short list of anything missing, and one line on where this work comes back and what it will look like there. Then tell me the order for the end of the day: first the day report (the Copy the day report button at the bottom of my course page) into summary.md, and only then hand in all the files on the list, summary.md too.\n\nUkrainian style for this chat:\n- Write plain, natural Ukrainian, not a word-for-word translation. 1) Short sentences; give me ONE action per message, then wait for my screenshot or answer; put a definition in its own short sentence, not in brackets. 2) Address me as «ти» and never use gendered forms about me (no «ти зробив/зробила», «готовий/готова»); for past work say «твій стовпчик з Дня 1», «як у День 4». 3) Keep menu, button, setting, shortcut and file names in English exactly as on screen; say everything else in Ukrainian, using exactly the words in this list, and never two words for one thing. 4) Numbers: in text use a decimal comma and Cyrillic units («1,8 м», «16 ГБ»); a value I must type keeps the point («в  const pips='<div class="pips well" aria-hidden="true">'+D.quiz.map((q,i)=>'<i class="'+(a[i]==null?'':a[i]===q.answer?'r':'w')+'"></i>').join('')+'</div>';
 const qs=D.quiz.map((q,i)=>{const c=a[i];if(c===q.answer)ok++;return '<div class="qz"><p class="qq"><span class="qn">'+(i+1)+'</span><span>'+lk(x(q.q))+'</span></p>'+q.options.map((o,k)=>{let cls='opt',mk='<span></span>';if(c!=null){if(k===q.answer){cls+=' right';mk=ic('check','mk')}else if(k===c){cls+=' wrong';mk=ic('x','mk')}}return '<button class="'+cls+'" id="o'+i+'_'+k+'"'+(c!=null?' disabled':'')+' onclick="pick('+i+','+k+')"><span class="lt">'+(L[k]||k+1)+'</span><span>'+esc(x(o))+'</span>'+mk+'</button>'}).join('')+(c!=null?'<p class="exp '+(c===q.answer?'r':'w')+'" id="e'+i+'" tabindex="-1"><b>'+(c===q.answer?u('right'):u('wrong'))+'</b>'+lk(x(q.explain))+'</p>':'')+'</div>'}).join('');
 return '<section class="card glass quiz">'+lab(u('quiz'),'gold')+'<p class="muted" style="margin:-6px 0 14px">'+u('quizSub')+'</p>'+pips+qs+(qDone()?'<div class="score well" role="status"><span class="eyebrow">'+u('score')+'</span><span class="lcd" aria-label="'+ok+' / '+D.quiz.length+'">'+seg(ok+'/'+D.quiz.length)+'</span>'+(st.qs1?'<span class="muted">'+u('first')+': '+st.qs1[0]+'/'+st.qs1[1]+'</span>':'')+'<div class="row"><button class="btn ghost" id="retry" onclick="retry()">'+u('retry')+'</button></div></div>':'')+'</section>'}
function vid(v){if(!v)return '';const link=v.url?'<a href="'+esc(v.url)+'" target="_blank" rel="noopener">'+esc(x(v.title)||v.url)+'</a>'+(v.channel?' <span class="muted">· '+esc(v.channel)+(v.length?' · '+esc(v.length):'')+'</span>':''):'';const s=v.search?'<a href="https://www.youtube.com/results?search_query='+encodeURIComponent(v.search)+'" target="_blank" rel="noopener">'+u('noVid')+': '+esc(v.search)+'</a>':'';const alt=v.alt&&v.alt.url?'<br><span class="eyebrow">UA</span> <a href="'+esc(v.alt.url)+'" target="_blank" rel="noopener">'+esc(v.alt.title||v.alt.url)+'</a>'+(v.alt.channel?' <span class="muted">· '+esc(v.alt.channel)+'</span>':''):'';return '<div class="vid well">'+kn('play')+'<div><b>'+u('more')+'?</b><br>'+(link||s)+alt+(link&&s?'<br><span class="muted" style="font-size:14px">'+s+'</span>':'')+'</div></div>'}
function morning(){const m=D.morning;if(!m)return '';const q=m.quote||{};
 let shelf='';if(D.day>0){shelf='<div class="shelf" aria-hidden="true">';let g='';for(let d=0;d<D.day;d++){let p=0;try{p=(JSON.parse(localStorage.getItem('devteam:'+D.learner+':'+d))||{}).pct||0}catch(e){}g+='<i class="'+(p>=1?'d':'')+(d>0&&d%5===0?' bs':'')+'"></i>';if(d%5===0||d===D.day-1){shelf+='<span class="wkg">'+g+'</span>';g=''}}shelf+='</div>'}
 const qt=lang==='uk'&&q.original?q.original:x(q.text);
 return '<section class="card glass morning"><div class="mgrid">'+(m.sofar?'<div>'+lab(u('sofar'),'gold')+shelf+'<p class="mtxt">'+lk(x(m.sofar))+'</p></div>':'')+(m.today?'<div>'+lab(u('todayL'))+'<p class="mtxt">'+lk(x(m.today))+'</p></div>':'')+'</div>'+(m.cheer?'<p class="cheer">'+esc(x(m.cheer))+'</p>':'')+(qt?'<figure class="quote well">'+kn('quote')+'<blockquote>'+esc(qt)+'</blockquote>'+(q.author?'<figcaption>'+esc(x(q.author))+'</figcaption>':'')+'</figure>':'')+'</section>'}
function setLang(l){lang=l;try{localStorage.setItem('devteam:lang',lang)}catch(e){};render()}
function toggleLang(){setLang(lang==='uk'?'en':'uk')}
/* keep open sections and keyboard focus across re-renders */
const openD=new Set();
function tg(e){if(e.open)openD.add(e.id);else openD.delete(e.id)}
const op=id=>openD.has(id)?' open':'';
function render(){const ae=document.activeElement,fid=ae&&(ae.id||(ae.getAttribute('data-th')?'th-'+ae.getAttribute('data-th'):ae.getAttribute('lang')&&ae.closest('.seg')?'lg-'+ae.getAttribute('lang'):''));
 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);
 const b=D.build,P=Math.round(prog()*100);
 document.getElementById('top').innerHTML='<div class="topin glass"><a class="maplink" href="'+esc(D.mapHref)+'">'+kn('map')+u('map')+'</a><div class="crumb"><b>'+esc(x(D.learnerName))+'</b><span>'+u('week')+' '+D.week+'</span><span>'+u('day')+' '+D.day+' '+u('of')+' '+D.total+'</span></div>'+controls(lang,'setLang')+'</div><div class="tline"><i style="width:'+P+'%"></i></div>';
 const state=w=>w<D.week?'b':w===D.week?'n':'p';
 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 let wk='';if(D.weekInfo){const w=D.weekInfo;wk='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}
 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p>'+(b.next?'<div class="back well">'+kn('arrow')+'<div><b>'+u('comes')+'</b><br>'+lk(x(b.next))+'</div></div>':'')+'<div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.assetFiles&&D.assetFiles.length?'<p class="files">'+ic('folder')+'<span>'+u('filesL')+' '+D.assetFiles.map(f=>'<a href="assets/'+encodeURIComponent(f)+'" target="_blank" rel="noopener">'+esc(f)+'</a>').join(', ')+'</span></p>':D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+=handinCard();h+=beforeCard();
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div><label class="rcpt" for="r'+i+'"><span class="eyebrow">'+u('rcpt')+'</span><textarea id="r'+i+'" rows="2" placeholder="'+esc(u('rcptPh'))+'" oninput="st.r'+i+'=this.value;save()">'+esc(st['r'+i]||'')+'</textarea></label>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+hList()+chkList()+(hasClip?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<h3>1 · '+u('copyR')+'</h3><p class="muted">'+u('report')+'</p><div class="row"><button class="btn ghost" onclick="cp(reportText())">'+ic('copy')+u('copyR')+'</button></div><h3>2 · '+u('ship')+'</h3>'+hf()+'<p class="muted" style="margin:12px 0 0">'+u('hNote')+'</p></section>';
 h+=qCard();h+=wk;
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();
</script>
</body>
</html>

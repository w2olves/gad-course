, повернута під кутом із плану, на DL_District1."}, {"en": "Shelves: the ground under each footprint flattened (plus about 2 m round it), with a soft slope or steps on the uphill side, never a vertical wall of landscape. A shelf is a flat step cut into a slope for a building.", "uk": "Уступи: земля під кожним обрисом вирівняна (плюс близько 2 м навколо), з м'яким схилом чи сходами з боку підйому, ніколи не вертикальна стіна ландшафту. Уступ — це рівна сходинка, вирізана в схилі під будівлю."}, {"en": "Buildings from three sources: your kit (SM_Wall_2m, SM_Wall_Window, SM_Wall_Door, SM_Wall_Corner and the roof pieces) snapped on the grid; Level Instances for repeated types; pack buildings from your Day 24 picks where they fit. Every pack goes in credits.md.", "uk": "Будівлі з трьох джерел: твій модульний набір (SM_Wall_2m, SM_Wall_Window, SM_Wall_Door, SM_Wall_Corner і деталі даху), прив'язаний до сітки; Level Instances для типів, що повторюються; будівлі з паків, вибраних на Дні 24, там, де вони пасують. Кожен пак записано в credits.md."}, {"en": "At least two house types saved as Level Instances (LI_HarbourHouse_A and LI_HarbourHouse_B), each placed several times. Type B has its own wall colour: a child instance of MI_Plaster with another Tint, set in Details > Materials on its wall pieces (on SM_Wall_Door, a child of MI_Plaster_WallDoor, so the wear mask stays). A Level Instance is a group of actors saved as one reusable piece: edit it once and every copy changes. Everything inside it is the same in every copy, so colour variety comes from the types, the pack buildings and the fronts outside them.", "uk": "Принаймні два типи будинків, збережені як Level Instances (LI_HarbourHouse_A і LI_HarbourHouse_B), кожен розміщений кілька разів. Тип B має власний колір стін: дочірній інстанс MI_Plaster з іншим Tint, призначений у Details > Materials його деталям стін (на SM_Wall_Door — дочірній від MI_Plaster_WallDoor, щоб маска зношеності лишилася). Level Instance — це група акторів, збережена як одна деталь для повторного використання: зміни її один раз — і зміниться кожна копія. Усе всередині однакове в кожній копії, тож різноманіття кольорів дають типи, будівлі з паків і фасади поза ними."}, {"en": "SM_ShopFront_A on the ground floor of every shop the plan names, turned in 90-degree steps to face the street, its back against the wall (up to 1 cm out): no gaps, no flicker. Each has its own colour on its Plaster slot (a child of MI_Plaster, for example MI_ShopFront_Blue); the trim and its stone plinth stay as they are. Fronts stay outside the Level Instances, so each copy can have its own.", "uk": "SM_ShopFront_A на першому поверсі кожної крамниці, яку називає план, повернутий кроками по 90 градусів лицем до вулиці, спиною до стіни (відступ до 1 см): без щілин, без мерехтіння. Кожен має власний колір у слоті Plaster (дочірній від MI_Plaster, наприклад MI_ShopFront_Blue); трим-шит і кам'яний цоколь лишаються як є. Фасади стоять поза Level Instances, тож кожна копія може мати свій."}, {"en": "Paving from your Day 17 paving texture on 2 x 2 m squares (a Plane at Scale 2, 2, 1 with MI_Paving_2m, Tiling 1), laid edge to edge, so every door meets a path.", "uk": "Мощення з твоєї текстури мощення з Дня 17 на квадратах 2 x 2 м (Plane зі Scale 2, 2, 1 і MI_Paving_2m, Tiling 1), покладених край до краю, щоб кожні двері виходили на доріжку."}, {"en": "A check from C1 to C5 and a pass along the fronts at 30 m: the street reads as one place.", "uk": "Перевірка з C1-C5 і проліт уздовж фасадів на 30 м: вулиця читається як одне місце."}], "piece1": "the first house type, made with the tutor", "piece2": {"en": "Every other building and front, on your own", "uk": "Усі інші будівлі й фасади, самостійно"}, "steps": [{"text": {"en": "Make placement_d1.md from plot_plan_d1.png: every building, its plan x and y, its angle and its type (kit, Level Instance or pack). Check: the number of lines matches the buildings on the plan.", "uk": "Склади placement_d1.md за plot_plan_d1.png: кожна будівля, її x і y з плану, кут і тип (модульний набір, Level Instance чи пак). Перевірка: кількість рядків збігається з кількістю будівель на плані."}, "lesson": 1}, {"text": {"en": "Screenshot the empty district from C4 for your before picture. Cut shelves: Flatten each footprint plus 2 m, then Smooth the edges. Check: from 10 m no shelf leaves a vertical landscape wall.", "uk": "Зроби скриншот порожнього району з C4 — це твоє фото «до». Виріж уступи: Flatten для кожного обрису плюс 2 м, потім Smooth по краях. Перевірка: з 10 м жоден уступ не лишає вертикальної стіни ландшафту."}, "lesson": 2}, {"text": {"en": "House type A: a 4 x 6 m house from your kit on the grid with SM_Wall_Window, SM_Wall_Door, corner posts and the roof, saved as the Level Instance LI_HarbourHouse_A. Check: from 2 m there are no gaps at the corners or along the roof line.", "uk": "Тип будинку A: будинок 4 x 6 м із твого модульного набору на сітці, з SM_Wall_Window, SM_Wall_Door, кутовими стійками й дахом, збережений як Level Instance LI_HarbourHouse_A. Перевірка: з 2 м немає щілин на кутах і вздовж лінії даху."}, "lesson": 3}, {"text": {"en": "House type B: a different length (for example 4 x 8 m) or a second storey from the same kit, its walls in a child instance of MI_Plaster with another Tint (a child of MI_Plaster_WallDoor on door walls), saved as LI_HarbourHouse_B. Check: A and B side by side look like neighbours, not twins.", "uk": "Тип будинку B: інша довжина (наприклад 4 x 8 м) або другий поверх із того самого набору, стіни в дочірньому інстансі MI_Plaster з іншим Tint (на стінах із дверима — дочірній від MI_Plaster_WallDoor), збережений як LI_HarbourHouse_B. Перевірка: A і B поруч схожі на сусідів, а не на близнюків."}, "lesson": 3}, {"text": {"en": "Place every Level Instance copy at its plan coordinates (island metres x 100), turned to the plan, dropped with End. Check: all four corners touch the shelf.", "uk": "Постав кожну копію Level Instance на її координати з плану (острівні метри x 100), поверни як на плані, опусти клавішею End. Перевірка: усі чотири кути торкаються уступу."}, "lesson": 1}, {"text": {"en": "Pack buildings at their footprints where your plan names one; write each pack in credits.md. Check: credits.md has a line for every pack you used.", "uk": "Будівлі з паків на їхніх обрисах там, де план їх називає; запиши кожен пак у credits.md. Перевірка: у credits.md є рядок для кожного використаного паку."}, "lesson": 3}, {"text": {"en": "Paving: 2 x 2 m squares with MI_Paving_2m from every door to the street, edge to edge on grid snap 200, the top 2 cm above the ground. Check: every door meets paving, the pattern is not stretched, and no step is taller than 20 cm.", "uk": "Мощення: квадрати 2 x 2 м з MI_Paving_2m від кожних дверей до вулиці, край до краю з прив'язкою до сітки 200, верх на 2 см над землею. Перевірка: кожні двері виходять на мощення, візерунок не розтягнутий, і жодна сходинка не вища за 20 см."}, "lesson": 2}, {"text": {"en": "Doors that stand above the ground: add your Day 8 SM_Steps. Check: each step meets the ground and the door.", "uk": "Двері, що стоять над землею: додай свої SM_Steps з Дня 8. Перевірка: кожна сходинка сходиться і з землею, і з дверима."}, "lesson": 2}, {"text": {"en": "Shop fronts: SM_ShopFront_A on the ground floor of every shop, turned in 90-degree steps to face the street and moved until its back touches the wall, each with its own Plaster colour instance. Check: from 2 m there's no gap and no flicker at any edge.", "uk": "Фасади крамниць: SM_ShopFront_A на першому поверсі кожної крамниці, повернутий кроками по 90 градусів лицем до вулиці й посунутий, доки спина не торкнеться стіни, кожен із власним інстансом кольору Plaster. Перевірка: з 2 м ні на якому краї немає щілини чи мерехтіння."}, "lesson": 4}, {"text": {"en": "Read the fronts at 2, 10 and 30 m; strengthen one thing that doesn't read. Check: at 30 m you can still tell which ground floors are shops.", "uk": "Подивись на фасади з 2, 10 і 30 м; підсиль одну річ, яка не читається. Перевірка: з 30 м ще видно, які перші поверхи — крамниці."}, "lesson": 4}, {"text": {"en": "Overlay: a Top view HighResShot laid over plot_plan_d1.png in Krita; fix anything more than 0.5 m off. Then hide DL_District1 to find any of today's work on the wrong layer. Check: every footprint sits on its box, and with the layer hidden none of today's placed actors show (the shelves belong to the landscape and stay).", "uk": "Накладання: HighResShot у вигляді Top, покладений поверх plot_plan_d1.png у Krita; виправ усе, що зміщене більш ніж на 0,5 м. Потім сховай DL_District1, щоб знайти сьогоднішню роботу на неправильному шарі. Перевірка: кожен обрис стоїть на своєму квадраті, а з прихованим шаром не видно жодного розміщеного сьогодні актора (уступи належать ландшафту й лишаються)."}, "lesson": 1}, {"text": {"en": "Capture: C4 before and after today's buildings (before_after_day42.png), and a 60-second flight along the fronts at 8 to 10 m in game view. Save today's clip as flythrough_day42.mp4 and check that you also have overlay_day42.png, fronts_2m.png, fronts_10m.png and fronts_30m.png (each is described in today's hand-in list; take any you are missing now). Check: both files are in today's Work folder.", "uk": "Запис: C4 до і після сьогоднішніх будівель (before_after_day42.png) і 60-секундний проліт уздовж фасадів на висоті 8-10 м у Game View. Збережи сьогоднішнє відео як flythrough_day42.mp4 і перевір, що в тебе також є overlay_day42.png, fronts_2m.png, fronts_10m.png і fronts_30m.png (кожен описано в сьогоднішньому списку «Здати роботу»; яких бракує — зніми зараз). Перевірка: обидва файли в сьогоднішній папці Work."}, "lesson": 4}], "assets": ["island12/free-packs-list.md", "island12/credits-template.md"]}, "lessons": [{"title": {"en": "Placing a street by numbers", "uk": "Розміщуємо вулицю за числами"}, "minutes": 40, "goals": [{"en": "Make a placement list from the plan: position, angle and type for every building.", "uk": "Складати список розміщення за планом: позиція, кут і тип для кожної будівлі."}, {"en": "Place each building with typed numbers (island metres x 100), then check it three ways: the Details numbers, a 2 m look at each corner, and a top-view overlay on the plan.", "uk": "Розміщувати кожну будівлю введеними числами (острівні метри x 100), а потім перевіряти трьома способами: числа в Details, погляд на кожен кут із 2 м і накладання вигляду згори на план."}, {"en": "Keep every new actor on DL_District1.", "uk": "Тримати кожного нового актора на DL_District1."}], "doalong": [{"en": "Copy every building on plot_plan_d1.png into placement_d1.md: name, x, y, angle, type. You should see one line per building.", "uk": "Перепиши кожну будівлю з plot_plan_d1.png у placement_d1.md: назва, x, y, кут, тип. Ти маєш побачити по одному рядку на будівлю."}, {"en": "Check DL_District1 is still the current layer in the Data Layer Outliner (Window > World Partition > Data Layer Outliner). You should see it marked as current.", "uk": "Перевір, що DL_District1 досі поточний шар у Data Layer Outliner (Window > World Partition > Data Layer Outliner). Ти маєш побачити, що його позначено поточним."}, {"en": "Select a building and type its island X and Y x 100 and its Rotation Z in Details > Transform. You should see it move onto its footprint.", "uk": "Виділи будівлю і введи її острівні X і Y x 100 та Rotation Z у Details > Transform. Ти маєш побачити, як вона стає на свій обрис."}, {"en": "Press End, then fly to each corner and look from 2 m. You should see every corner touching the ground.", "uk": "Натисни End, потім підлети до кожного кута й подивись із 2 м. Ти маєш побачити, що кожен кут торкається землі."}, {"en": "Switch the viewport to Top (viewport menu Perspective > Top) and Unlit (the Lit menu > Unlit: flat colours with no light or shadow), then run HighResShot 1920x1080 in the console. You should see a flat, map-like picture in IslandCourse/Saved/Screenshots/WindowsEditor.", "uk": "Перемкни в'юпорт на Top (меню в'юпорту Perspective > Top) і Unlit (меню Lit > Unlit: пласкі кольори без світла й тіней), потім виконай HighResShot 1920x1080 у консолі. Ти маєш побачити пласку картинку, схожу на мапу, в IslandCourse/Saved/Screenshots/WindowsEditor."}, {"en": "In Krita, put the shot on a layer over plot_plan_d1.png at 50 % opacity and scale it until the four Day 41 corner markers sit on the sample corners. You should see each footprint sitting on its box.", "uk": "У Krita поклади знімок на шар над plot_plan_d1.png із непрозорістю 50 % і масштабуй його, доки чотири кутові маркери з Дня 41 не стануть на кути пробної ділянки. Ти маєш побачити, що кожен обрис лежить на своєму квадраті."}], "play": {"en": "Overlay duel: I send the tutor my overlay picture. It checks every footprint, and each one more than 0.5 m off is a point to it.", "uk": "Дуель накладань: я надсилаю тьютору свою картинку накладання. Він перевіряє кожен обрис, і кожен, зміщений більш ніж на 0,5 м, — це бал йому."}, "video": {"url": "https://www.youtube.com/watch?v=tnaXNCaBQ4M", "title": "06 - Snapping, Pivot Points, and Duplication - Unreal Engine Stage Design Course", "channel": "SuperStage", "length": "7:21", "search": "unreal engine snapping pivot duplicate"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Placing a street by numbers (Day 42, lesson 1 of 4).\nToday's build: Every building and shop front of district 1, placed from plot_plan_d1.png: kit buildings, pack buildings and Level Instance copies, on shelves cut into the terrain, with paving to every door.\n\nBy the end of this lesson I can:\n1. Make a placement list from the plan: position, angle and type for every building.\n2. Place each building with typed numbers (island metres x 100), then check it three ways: the Details numbers, a 2 m look at each corner, and a top-view overlay on the plan.\n3. Keep every new actor on DL_District1.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (Your waterfront has a tested sample plot and budget.md, which shows in milliseconds what it costs.), what I will learn today (You place every building of district 1 at its plan place on a level shelf, with your shop fronts on the ground floors and paving to every door.), encourage me (Placing by numbers is steady work, so take one building at a time and watch your street rise.), and share today's quote: \"No house should ever be on a hill or on anything. It should be of the hill.\" (Frank Lloyd Wright).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 39: why do rocks and ground cover along the shore make an island read as real from the air? | Day 32: what is a landmark for, when a pilot flies over the island?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Overlay duel: I send the tutor my overlay picture. It checks every footprint, and each one more than 0.5 m off is a point to it.\n6. Do-along on today's build (the first house type, made with the tutor): guide me through these steps one at a time, checking a screenshot after each:\n   - Copy every building on plot_plan_d1.png into placement_d1.md: name, x, y, angle, type. You should see one line per building.\n   - Check DL_District1 is still the current layer in the Data Layer Outliner (Window > World Partition > Data Layer Outliner). You should see it marked as current.\n   - Select a building and type its island X and Y x 100 and its Rotation Z in Details > Transform. You should see it move onto its footprint.\n   - Press End, then fly to each corner and look from 2 m. You should see every corner touching the ground.\n   - Switch the viewport to Top (viewport menu Perspective > Top) and Unlit (the Lit menu > Unlit: flat colours with no light or shadow), then run HighResShot 1920x1080 in the console. You should see a flat, map-like picture in IslandCourse/Saved/Screenshots/WindowsEditor.\n   - In Krita, put the shot on a layer over plot_plan_d1.png at 50 % opacity and scale it until the four Day 41 corner markers sit on the sample corners. You should see each footprint sitting on its box.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"06 - Snapping, Pivot Points, and Duplication - Unreal Engine Stage Design Course\" by SuperStage: https://www.youtube.com/watch?v=tnaXNCaBQ4M\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Shelves and paving: buildings that sit on the land", "uk": "Уступи й мощення: будівлі, що стоять на землі"}, "minutes": 40, "goals": [{"en": "Cut a level shelf for each footprint with the Flatten tool, leaving a soft slope or steps behind, never a vertical wall of landscape.", "uk": "Вирізати рівний уступ під кожен обрис інструментом Flatten, лишаючи позаду м'який схил чи сходи, ніколи не вертикальну стіну ландшафту."}, {"en": "Sink a building on a slope until its low side touches, and add steps where a door stands too high.", "uk": "Занурювати будівлю на схилі, доки нижчий бік не торкнеться землі, і додавати сходи там, де двері стоять зависоко."}, {"en": "Lay 2 x 2 m paving squares so every door meets a path.", "uk": "Класти квадрати мощення 2 x 2 м так, щоб кожні двері виходили на доріжку."}], "doalong": [{"en": "Choose Landscape from the mode menu at the top left of the main toolbar, then Sculpt > Flatten. Click the middle of a footprint and paint over it plus 2 m. You should see a flat shelf with the hillside behind it. Your Day 27 flats did most of this work; shelves only fix each footprint.", "uk": "Вибери Landscape у меню режимів угорі ліворуч на головній панелі інструментів, потім Sculpt > Flatten. Клацни посередині обрису і зафарбуй його плюс 2 м. Ти маєш побачити рівний уступ зі схилом пагорба позаду. Твої рівні майданчики з Дня 27 уже зробили більшу частину роботи; уступи лише доводять кожен обрис."}, {"en": "Switch to Smooth and brush the shelf's edges. You should see a soft slope instead of a sharp step. Go back to Selection mode (the same mode menu) when you're done.", "uk": "Перемкнися на Smooth і пройдися пензлем по краях уступу. Ти маєш побачити м'який схил замість різкої сходинки. Коли закінчиш, повернися в режим Selection (те саме меню режимів)."}, {"en": "Place a building on a sloping test spot, press End, then lower its Z until the low side touches. You should see a little wall buried on the uphill side and no gap downhill.", "uk": "Постав будівлю на похилому тестовому місці, натисни End, потім зменшуй її Z, доки нижчий бік не торкнеться землі. Ти маєш побачити трохи закопану стіну з боку підйому і жодної щілини внизу схилу."}, {"en": "Put your Day 8 SM_Steps under a door that stands above the ground. You should see the steps meet both the door and the ground.", "uk": "Постав свої SM_Steps з Дня 8 під двері, що стоять над землею. Ти маєш побачити, що сходи сходяться і з дверима, і з землею."}, {"en": "Drag a Plane from Place Actors > Shapes and set its Scale to 2, 2, 1: a 2 x 2 m paving square. Right-click MI_Paving (Day 17) > Create Material Instance, name it MI_Paving_2m, set Tiling to 1 (one texture covers 2 m) and give it to the square. Lay squares edge to edge with grid snap 200, 2 cm above the ground. You should see paving with its pattern at real size, with no stretching.", "uk": "Перетягни Plane з Place Actors > Shapes і встанови Scale 2, 2, 1: це квадрат мощення 2 x 2 м. Правий клік по MI_Paving (День 17) > Create Material Instance, назви його MI_Paving_2m, встанови Tiling на 1 (одна текстура покриває 2 м) і признач його квадрату. Клади квадрати край до краю з прив'язкою до сітки 200, на 2 см над землею. Ти маєш побачити мощення з візерунком у справжньому розмірі, без розтягування."}], "play": {"en": "Shelf check: the tutor names four building spots on my plan. I say how each meets the slope, and it flags any that would leave a cliff face.", "uk": "Перевірка уступів: тьютор називає чотири місця будівель на моєму плані. Я кажу, як кожне сходиться зі схилом, а він позначає ті, що лишили б урвище."}, "video": {"search": "building houses on a slope terraces retaining walls"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Shelves and paving: buildings that sit on the land (Day 42, lesson 2 of 4).\nToday's build: Every building and shop front of district 1, placed from plot_plan_d1.png: kit buildings, pack buildings and Level Instance copies, on shelves cut into the terrain, with paving to every door.\nEarlier today I already did: lesson 1 (Placing a street by numbers). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Cut a level shelf for each footprint with the Flatten tool, leaving a soft slope or steps behind, never a vertical wall of landscape.\n2. Sink a building on a slope until its low side touches, and add steps where a door stands too high.\n3. Lay 2 x 2 m paving squares so every door meets a path.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Shelf check: the tutor names four building spots on my plan. I say how each meets the slope, and it flags any that would leave a cliff face.\n4. Do-along on today's build (the first house type, made with the tutor): guide me through these steps one at a time, checking a screenshot after each:\n   - Choose Landscape from the mode menu at the top left of the main toolbar, then Sculpt > Flatten. Click the middle of a footprint and paint over it plus 2 m. You should see a flat shelf with the hillside behind it. Your Day 27 flats did most of this work; shelves only fix each footprint.\n   - Switch to Smooth and brush the shelf's edges. You should see a soft slope instead of a sharp step. Go back to Selection mode (the same mode menu) when you're done.\n   - Place a building on a sloping test spot, press End, then lower its Z until the low side touches. You should see a little wall buried on the uphill side and no gap downhill.\n   - Put your Day 8 SM_Steps under a door that stands above the ground. You should see the steps meet both the door and the ground.\n   - Drag a Plane from Place Actors > Shapes and set its Scale to 2, 2, 1: a 2 x 2 m paving square. Right-click MI_Paving (Day 17) > Create Material Instance, name it MI_Paving_2m, set Tiling to 1 (one texture covers 2 m) and give it to the square. Lay squares edge to edge with grid snap 200, 2 cm above the ground. You should see paving with its pattern at real size, with no stretching.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "House types from your kit, and Level Instances", "uk": "Типи будинків із твого модульного набору і Level Instances"}, "minutes": 40, "goals": [{"en": "Assemble a 4 x 6 m house from your kit on the grid, as on Day 10: walls, window and door pieces, corner posts and a roof (your roof pieces fit a 4 m wide house).", "uk": "Збирати будинок 4 x 6 м із модульного набору на сітці, як на Дні 10: стіни, деталі з вікном і дверима, кутові стійки й дах (твої деталі даху пасують до будинку завширшки 4 м)."}, {"en": "Save it as a Level Instance and repeat it; edit it once and every copy changes.", "uk": "Зберігати його як Level Instance і повторювати; зміни його один раз — і зміниться кожна копія."}, {"en": "Mix sources: your kit, pack buildings that fit, and a credits line for each pack.", "uk": "Поєднувати джерела: твій модульний набір, будівлі з паків, які пасують, і рядок у credits.md для кожного паку."}], "doalong": [{"en": "Drag SM_Wall_2m onto a free spot. In the viewport toolbar set the grid snap to 100 (grid snap makes moves jump in fixed steps; whole metres keep 2 m pieces on the grid). Hold Alt and drag a move arrow twice: Alt+drag makes a copy. You should see a 6 m wall of three pieces with no gaps.", "uk": "Перетягни SM_Wall_2m на вільне місце. На панелі інструментів в'юпорту встанови прив'язку до сітки на 100 (прив'язка до сітки змушує переміщення стрибати фіксованими кроками; цілі метри тримають деталі по 2 м на сітці). Утримуй Alt і двічі потягни стрілку переміщення: Alt+перетягування робить копію. Ти маєш побачити стіну 6 м із трьох деталей без щілин."}, {"en": "Select the middle piece and in Details > Static Mesh choose SM_Wall_Window; change one end to SM_Wall_Door. You should see a front with a window and a door.", "uk": "Виділи середню деталь і в Details > Static Mesh вибери SM_Wall_Window; один край заміни на SM_Wall_Door. Ти маєш побачити фасад із вікном і дверима."}, {"en": "Build the two 4 m side walls and the 6 m back wall the same way, and put SM_Wall_Corner on each corner. You should see a closed box with no open corners.", "uk": "Так само збудуй дві бічні стіни по 4 м і задню стіну 6 м, а на кожен кут постав SM_Wall_Corner. Ти маєш побачити замкнену коробку без відкритих кутів."}, {"en": "Add the roof: SM_Roof_2m panels on both slopes, SM_Roof_Ridge_2m along the top and SM_Roof_Gable_4m at each end. You should see an unbroken roof line from 10 m.", "uk": "Додай дах: панелі SM_Roof_2m на обох схилах, SM_Roof_Ridge_2m уздовж гребеня і SM_Roof_Gable_4m з кожного торця. Ти маєш побачити суцільну лінію даху з 10 м."}, {"en": "Select every piece, right-click > Level > Create Level Instance, set Pivot Type to Center Min Z (the pivot sits at the bottom centre) and tick External Actors if it is not ticked (the pieces then stream with the island's World Partition grid). Save it as LI_HarbourHouse_A in Content/Island/District1. You should see one actor in the Outliner instead of many.", "uk": "Виділи всі деталі, правий клік > Level > Create Level Instance, встанови Pivot Type на Center Min Z (опорна точка внизу по центру) і постав позначку External Actors, якщо її немає (тоді деталі підвантажуються разом із сіткою World Partition острова). Збережи як LI_HarbourHouse_A у Content/Island/District1. Ти маєш побачити в Outliner один актор замість багатьох."}, {"en": "Alt+drag a copy. Right-click one > Level > Edit, change one window piece, then click Commit (in the bar at the top of the viewport, or Commit Changes in the Details panel). You should see both copies change.", "uk": "Alt+перетягуванням зроби копію. Правий клік по одній > Level > Edit, зміни одну деталь із вікном, потім натисни Commit (на панелі вгорі в'юпорту або Commit Changes на панелі Details). Ти маєш побачити, що змінилися обидві копії."}], "play": {"en": "Modular sprint: I build a two-storey house type in 10 minutes. The tutor checks corners and gaps from my screenshots.", "uk": "Модульний спринт: я будую двоповерховий тип будинку за 10 хвилин. Тьютор перевіряє кути й щілини за моїми скриншотами."}, "video": {"url": "https://www.youtube.com/watch?v=Nlj3hN35CE4", "title": "Modular assets: a simple time-saving technique for game developers", "channel": "Boars In Rome", "length": "10:01", "search": "modular building kit unreal engine"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: House types from your kit, and Level Instances (Day 42, lesson 3 of 4).\nToday's build: Every building and shop front of district 1, placed from plot_plan_d1.png: kit buildings, pack buildings and Level Instance copies, on shelves cut into the terrain, with paving to every door.\nEarlier today I already did: lesson 1 (Placing a street by numbers); lesson 2 (Shelves and paving: buildings that sit on the land). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Assemble a 4 x 6 m house from your kit on the grid, as on Day 10: walls, window and door pieces, corner posts and a roof (your roof pieces fit a 4 m wide house).\n2. Save it as a Level Instance and repeat it; edit it once and every copy changes.\n3. Mix sources: your kit, pack buildings that fit, and a credits line for each pack.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Modular sprint: I build a two-storey house type in 10 minutes. The tutor checks corners and gaps from my screenshots.\n4. Do-along on today's build (the first house type, made with the tutor): guide me through these steps one at a time, checking a screenshot after each:\n   - Drag SM_Wall_2m onto a free spot. In the viewport toolbar set the grid snap to 100 (grid snap makes moves jump in fixed steps; whole metres keep 2 m pieces on the grid). Hold Alt and drag a move arrow twice: Alt+drag makes a copy. You should see a 6 m wall of three pieces with no gaps.\n   - Select the middle piece and in Details > Static Mesh choose SM_Wall_Window; change one end to SM_Wall_Door. You should see a front with a window and a door.\n   - Build the two 4 m side walls and the 6 m back wall the same way, and put SM_Wall_Corner on each corner. You should see a closed box with no open corners.\n   - Add the roof: SM_Roof_2m panels on both slopes, SM_Roof_Ridge_2m along the top and SM_Roof_Gable_4m at each end. You should see an unbroken roof line from 10 m.\n   - Select every piece, right-click > Level > Create Level Instance, set Pivot Type to Center Min Z (the pivot sits at the bottom centre) and tick External Actors if it is not ticked (the pieces then stream with the island's World Partition grid). Save it as LI_HarbourHouse_A in Content/Island/District1. You should see one actor in the Outliner instead of many.\n   - Alt+drag a copy. Right-click one > Level > Edit, change one window piece, then click Commit (in the bar at the top of the viewport, or Commit Changes in the Details panel). You should see both copies change.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Modular assets: a simple time-saving technique for game developers\" by Boars In Rome: https://www.youtube.com/watch?v=Nlj3hN35CE4\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Shop fronts that read from the drone", "uk": "Фасади крамниць, які читаються з дрона"}, "minutes": 40, "goals": [{"en": "Seat SM_ShopFront_A against a wall: turn it in 90-degree steps until it faces the street, then move it until its back, where its pivot is (Day 13), touches the wall.", "uk": "Притуляти SM_ShopFront_A до стіни: повертати його кроками по 90 градусів, доки він не стане лицем до вулиці, а потім посувати, доки його спина, де стоїть опорна точка (День 13), не торкнеться стіни."}, {"en": "Give each shop its own colour on the front's Plaster slot (a child of MI_Plaster with its own Tint), on fronts kept outside the Level Instances, so each copy can differ; the trim, with its stone plinth and wear mask, stays as it is.", "uk": "Давати кожній крамниці власний колір у слоті Plaster фасаду (дочірній від MI_Plaster зі своїм Tint) на фасадах поза Level Instances, щоб кожна копія могла відрізнятися; трим-шит із кам'яним цоколем і маскою зношеності лишається як є."}, {"en": "Check a front at 2, 10 and 30 m: at 30 m it must still read as a shop.", "uk": "Перевіряти фасад із 2, 10 і 30 м: з 30 м він мусить і далі читатися як крамниця."}], "doalong": [{"en": "Drag SM_ShopFront_A from the Content Browser next to a ground-floor wall. Set its Rotation Z to the house's Rotation Z, then add 90 at a time until its front faces the street. You should see it standing parallel to the wall, facing out.", "uk": "Перетягни SM_ShopFront_A з Content Browser до стіни першого поверху. Встанови його Rotation Z таким, як Rotation Z будинку, потім додавай по 90, доки фасад не стане лицем до вулиці. Ти маєш побачити, що він стоїть паралельно до стіни й дивиться назовні."}, {"en": "In a Top view, zoom in close. Switch the move gizmo to Local (the globe icon in the viewport toolbar) and set grid snap to 1. Drag the arrow that points at the wall until the front's back edge touches the wall's outside line, then one step back, and press End. You should see no gap and nothing of the front inside the wall. (Surface Snapping can tip the front over, so don't use it here; the 1 cm stops flicker, the z-fighting from Day 7.)", "uk": "У вигляді Top наблизься впритул. Перемкни гізмо переміщення на Local (значок глобуса на панелі інструментів в'юпорту) і встанови прив'язку до сітки на 1. Тягни стрілку, що вказує на стіну, доки задній край фасаду не торкнеться зовнішньої лінії стіни, потім на крок назад, і натисни End. Ти маєш побачити, що щілини немає і жодна частина фасаду не заходить у стіну. (Surface Snapping може перекинути фасад, тож тут його не вмикай; 1 см зупиняє мерехтіння, той самий z-fighting із Дня 7.)"}, {"en": "In the Content Browser, right-click MI_Plaster > Create Material Instance and name it MI_ShopFront_Blue. Open it, tick Tint and pick a blue from your Day 16 palette. Select the placed front and in Details > Materials set its Plaster slot to MI_ShopFront_Blue. You should see one blue front, with its trim and stone plinth unchanged.", "uk": "У Content Browser правий клік по MI_Plaster > Create Material Instance і назви його MI_ShopFront_Blue. Відкрий його, постав позначку Tint і вибери синій зі своєї палітри з Дня 16. Виділи розміщений фасад і в Details > Materials признач його слоту Plaster MI_ShopFront_Blue. Ти маєш побачити один синій фасад, а його трим-шит і кам'яний цоколь без змін."}, {"en": "Fly in front of one shop and save bookmarks at 2, 10 and 30 m (Ctrl+1, Ctrl+2, Ctrl+3; press 1, 2 or 3 to jump back). Screenshot each. You should see the same front at three distances.", "uk": "Підлети до однієї крамниці й збережи закладки на 2, 10 і 30 м (Ctrl+1, Ctrl+2, Ctrl+3; натисни 1, 2 або 3, щоб повернутися). Зроби скриншот кожної. Ти маєш побачити той самий фасад із трьох відстаней."}, {"en": "Squint at the 30 m shot and strengthen one thing, such as the front's colour against its wall. You should see the shop stand out from its neighbours.", "uk": "Примруж очі на знімку з 30 м і підсиль одну річ, наприклад колір фасаду на тлі його стіни. Ти маєш побачити, що крамниця вирізняється серед сусідів."}], "play": {"en": "Three-second test: I describe my 30 m shot in one sentence and the tutor guesses which buildings are shops. If it's right, I score.", "uk": "Тест трьох секунд: я описую свій знімок із 30 м одним реченням, а тьютор вгадує, які будівлі — крамниці. Якщо вгадує правильно, бал мені."}, "video": {"url": "https://www.youtube.com/watch?v=syBNq0wumkQ", "title": "The Ultimate Guide to SNAPPING in Unreal Engine! (Place Objects Quickly and Accurately)", "channel": "The RealTime Essentials", "length": "11:41", "search": "unreal engine 5 snapping local gizmo"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Shop fronts that read from the drone (Day 42, lesson 4 of 4).\nToday's build: Every building and shop front of district 1, placed from plot_plan_d1.png: kit buildings, pack buildings and Level Instance copies, on shelves cut into the terrain, with paving to every door.\nEarlier today I already did: lesson 1 (Placing a street by numbers); lesson 2 (Shelves and paving: buildings that sit on the land); lesson 3 (House types from your kit, and Level Instances). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Seat SM_ShopFront_A against a wall: turn it in 90-degree steps until it faces the street, then move it until its back, where its pivot is (Day 13), touches the wall.\n2. Give each shop its own colour on the front's Plaster slot (a child of MI_Plaster with its own Tint), on fronts kept outside the Level Instances, so each copy can differ; the trim, with its stone plinth and wear mask, stays as it is.\n3. Check a front at 2, 10 and 30 m: at 30 m it must still read as a shop.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Three-second test: I describe my 30 m shot in one sentence and the tutor guesses which buildings are shops. If it's right, I score.\n4. Do-along on today's build (the first house type, made with the tutor): guide me through these steps one at a time, checking a screenshot after each:\n   - Drag SM_ShopFront_A from the Content Browser next to a ground-floor wall. Set its Rotation Z to the house's Rotation Z, then add 90 at a time until its front faces the street. You should see it standing parallel to the wall, facing out.\n   - In a Top view, zoom in close. Switch the move gizmo to Local (the globe icon in the viewport toolbar) and set grid snap to 1. Drag the arrow that points at the wall until the front's back edge touches the wall's outside line, then one step back, and press End. You should see no gap and nothing of the front inside the wall. (Surface Snapping can tip the front over, so don't use it here; the 1 cm stops flicker, the z-fighting from Day 7.)\n   - In the Content Browser, right-click MI_Plaster > Create Material Instance and name it MI_ShopFront_Blue. Open it, tick Tint and pick a blue from your Day 16 palette. Select the placed front and in Details > Materials set its Plaster slot to MI_ShopFront_Blue. You should see one blue front, with its trim and stone plinth unchanged.\n   - Fly in front of one shop and save bookmarks at 2, 10 and 30 m (Ctrl+1, Ctrl+2, Ctrl+3; press 1, 2 or 3 to jump back). Screenshot each. You should see the same front at three distances.\n   - Squint at the 30 m shot and strengthen one thing, such as the front's colour against its wall. You should see the shop stand out from its neighbours.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"The Ultimate Guide to SNAPPING in Unreal Engine! (Place Objects Quickly and Accurately)\" by The RealTime Essentials: https://www.youtube.com/watch?v=syBNq0wumkQ\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "placement_d1.md (every building ticked)", "uk": "placement_d1.md (кожна будівля позначена)"}, {"en": "overlay_day42.png (the top view laid over plot_plan_d1.png)", "uk": "overlay_day42.png (вигляд згори, покладений поверх plot_plan_d1.png)"}, {"en": "fronts_2m.png, fronts_10m.png and fronts_30m.png", "uk": "fronts_2m.png, fronts_10m.png і fronts_30m.png"}, {"en": "credits.md (updated with every pack)", "uk": "credits.md (оновлений, із кожним паком)"}, {"en": "before_after_day42.png (C4 before and after)", "uk": "before_after_day42.png (C4 до і після)"}, {"en": "flythrough_day42.mp4 (60 seconds along the fronts)", "uk": "flythrough_day42.mp4 (60 секунд уздовж фасадів)"}, {"en": "summary.md", "uk": "звіт дня (summary.md)"}], "goal": {"en": "By the end of today you have every building of district 1 standing at its plan place on a level shelf, with your shop fronts on the ground floors and paving that leads to every door.", "uk": "Наприкінці дня кожна будівля району 1 стоїть на своєму місці за планом, на рівному уступі, з фасадами крамниць на перших поверхах і мощенням, яке веде до кожних дверей."}, "uses": [{"en": "Day 41: the sample, its corner markers, DL_District1 and the five cameras", "uk": "День 41: пробна ділянка, її кутові маркери, DL_District1 і п'ять камер"}, {"en": "Day 23: plot_plan_d1.png (the building footprints, in island metres)", "uk": "День 23: plot_plan_d1.png (обриси будівель в острівних метрах)"}, {"en": "Days 9 and 10: SM_Wall_2m, SM_Wall_Window, SM_Wall_Door, SM_Wall_Corner, your roof pieces (SM_Roof_2m, SM_Roof_Ridge_2m, SM_Roof_Gable_4m) and LI_HarbourHouse", "uk": "Дні 9 і 10: SM_Wall_2m, SM_Wall_Window, SM_Wall_Door, SM_Wall_Corner, твої деталі даху (SM_Roof_2m, SM_Roof_Ridge_2m, SM_Roof_Gable_4m) і LI_HarbourHouse"}, {"en": "Days 13 and 14: SM_ShopFront_A on T_Trim_Harbour, with its wear-masked instance MI_Trim_ShopFront_A", "uk": "Дні 13 і 14: SM_ShopFront_A на T_Trim_Harbour з інстансом MI_Trim_ShopFront_A, що має маску зношеності"}, {"en": "Day 17: your seamless paving texture and MI_Paving", "uk": "День 17: твоя безшовна текстура мощення і MI_Paving"}, {"en": "Day 24: the building packs you picked", "uk": "День 24: вибрані тобою паки будівель"}], "quiz": [{"q": {"en": "Your shop front flickers where it meets the wall when the camera moves. What is the likely cause and fix?", "uk": "Фасад крамниці мерехтить там, де сходиться зі стіною, коли рухається камера. Яка ймовірна причина і як це виправити?"}, "options": [{"en": "The texture is too small; import a bigger one", "uk": "Текстура замала; імпортуй більшу"}, {"en": "Two surfaces sit in the same place; move the front 1 cm out", "uk": "Дві поверхні стоять в одному місці; відсунь фасад на 1 см"}, {"en": "Lumen is off; turn it on", "uk": "Lumen вимкнено; увімкни його"}, {"en": "The front has no collision; add a UCX box", "uk": "Фасад не має колізії; додай бокс UCX"}], "answer": 1, "explain": {"en": "Flicker (z-fighting) comes from two surfaces in the same place. A 1 cm gap is invisible from the drone and stops it.", "uk": "Мерехтіння (z-fighting) виникає через дві поверхні в одному місці. Відступ 1 см з дрона не видно, а мерехтіння він зупиняє."}}, {"q": {"en": "Why save a house type as a Level Instance?", "uk": "Навіщо зберігати тип будинку як Level Instance?"}, "options": [{"en": "You edit it once and every copy changes", "uk": "Змінюєш його один раз — і змінюється кожна копія"}, {"en": "It makes the house cast no shadows", "uk": "Тоді будинок не відкидає тіней"}, {"en": "It stops the house from loading", "uk": "Тоді будинок не завантажується"}, {"en": "It turns the house into landscape", "uk": "Він перетворює будинок на ландшафт"}], "answer": 0, "explain": {"en": "A Level Instance is one reusable group. Fix a window inside it once and all copies on the street update.", "uk": "Level Instance — це одна група для повторного використання. Виправ у ній вікно один раз — і оновляться всі копії на вулиці."}}, {"q": {"en": "A building on a slope stands on its high corner, and its low side hangs 40 cm in the air. What do you do?", "uk": "Будівля на схилі стоїть на високому куті, а її нижчий бік висить на 40 см у повітрі. Що ти робиш?"}, "options": [{"en": "Scale it up until it touches", "uk": "Збільшую її масштаб, доки не торкнеться"}, {"en": "Raise the landscape under the whole district", "uk": "Піднімаю ландшафт під усім районом"}, {"en": "Sink it until the low side touches, then add steps where a door stands too high", "uk": "Занурюю її, доки нижчий бік не торкнеться землі, а потім додаю сходи там, де двері стоять зависоко"}, {"en": "Leave it, because nobody sees the base from a drone", "uk": "Лишаю так, бо з дрона основу ніхто не бачить"}], "answer": 2, "explain": {"en": "Sinking hides the gap; steps or a plinth give the door a way in. Floating bases show from low drone passes.", "uk": "Занурення ховає щілину; сходи чи цоколь дають вхід до дверей. Основи, що висять у повітрі, видно під час низьких прольотів дрона."}}, {"q": {"en": "What does a top-view overlay on the plan check?", "uk": "Що перевіряє накладання вигляду згори на план?"}, "options": [{"en": "That the colours match the photos", "uk": "Що кольори збігаються з фото"}, {"en": "That the frame time is under budget", "uk": "Що час кадру вкладається в бюджет"}, {"en": "That every building has collision", "uk": "Що кожна будівля має колізію"}, {"en": "That every footprint is within about 0.5 m of its plan place", "uk": "Що кожен обрис лежить не далі ніж приблизно 0,5 м від свого місця на плані"}], "answer": 3, "explain": {"en": "Laying a Top view over the plan shows at once any building that drifted from its footprint.", "uk": "Вигляд Top, покладений на план, одразу показує кожну будівлю, що з'їхала зі свого обрису."}}, {"q": {"en": "You hide DL_District1, and one bench and two walls you placed today still stand in the district. What does that mean?", "uk": "Ти ховаєш DL_District1, а одна лавка й дві стіни, розміщені сьогодні, досі стоять у районі. Що це означає?"}, "options": [{"en": "They are on no layer or the wrong layer; assign them to DL_District1", "uk": "Вони не на жодному шарі або на неправильному; признач їх до DL_District1"}, {"en": "They are Nanite meshes", "uk": "Це сітки Nanite"}, {"en": "The layer is broken; delete it", "uk": "Шар зламаний; видали його"}, {"en": "They are HLODs", "uk": "Це HLOD"}], "answer": 0, "explain": {"en": "Anything that stays visible when its district's layer is hidden is on the wrong layer. Assign it so the district hides and loads as one.", "uk": "Усе, що лишається видимим, коли шар його району приховано, стоїть на неправильному шарі. Признач його, щоб район ховався й завантажувався як одне ціле."}}], "weekInfo": {"week": 9, "title": {"en": "District 1: the waterfront", "uk": "Район 1: набережна"}, "goal": {"en": "By Friday you have district 1, your waterfront, built from your plan with your own kit, props, boats, plants and decals, measured against a frame budget, and five screenshots that stand beside your reference photos.", "uk": "До п'ятниці в тебе є район 1, твоя набережна, збудований за твоїм планом із твого власного модульного набору, пропсів, човнів, рослин і декалей, перевірений бюджетом кадру, та п'ять скриншотів, які витримують порівняння з твоїми референсними фото."}, "skills": [{"en": "Set dressing a 200 x 200 m district from a counted plot plan in Unreal Engine 5", "uk": "Наповнення сцени (set dressing) району 200 x 200 м за планом розміщення з підрахунками в Unreal Engine 5"}, {"en": "Performance budgeting with stat unit, stat gpu and CSV profiling", "uk": "Бюджет продуктивності зі stat unit, stat gpu і CSV-профілюванням"}, {"en": "Modular building assembly with Level Instances and Packed Level Actors", "uk": "Збирання модульних будівель за допомогою Level Instances і Packed Level Actors"}, {"en": "Decal and material-wear storytelling for realistic environments", "uk": "Розповідь через декалі та зношеність матеріалів для реалістичного оточення"}, {"en": "Art review against reference photographs with located see-why-fix notes", "uk": "Арт-рев'ю за референсними фото з прив'язаними до місця нотатками «що бачу, чому, як виправити»"}]}, "morning": {"sofar": {"en": "Your waterfront has a tested sample plot and budget.md, which shows in milliseconds what it costs.", "uk": "Твоя набережна має протестовану зразкову ділянку й budget.md, який показує в мілісекундах, скільки вона коштує."}, "today": {"en": "You place every building of district 1 at its plan place on a level shelf, with your shop fronts on the ground floors and paving to every door.", "uk": "Сьогодні ти ставиш кожну будівлю району 1 на її місце з плану, на рівний уступ, з вітринами на перших поверхах і бруківкою до кожних дверей."}, "cheer": {"en": "Placing by numbers is steady work, so take one building at a time and watch your street rise.", "uk": "Розставляти за числами — розмірена робота, тож бери по одній будівлі й дивись, як росте твоя вулиця."}, "quote": {"text": {"en": "No house should ever be on a hill or on anything. It should be of the hill.", "uk": "Жоден будинок не повинен стояти на пагорбі чи на будь-чому. Він має бути частиною пагорба."}, "author": {"en": "Frank Lloyd Wright", "uk": "Френк Ллойд Райт"}, "source": "https://en.wikiquote.org/wiki/Frank_Lloyd_Wright"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-42-district1-buildings-and-fronts", "mapHref": "../../COURSE.html", "prevHref": "../Day-41-district1-sample-and-budget/START-HERE.html", "nextHref": "../Day-43-district1-street-furniture-and-boats/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8 and Krita. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me and don't write code. Keep me moving and make it feel like a game.\n\nToday I build on my own: Every other building and front, on your own.\nIt's part of: Every building and shop front of district 1, placed from plot_plan_d1.png: kit buildings, pack buildings and Level Instance copies, on shelves cut into the terrain, with paving to every door (District 1: every building footprint on plot_plan_d1.png, round the sample you built on Day 41.).\n\nSpec:\n- Every building on plot_plan_d1.png placed within 0.5 m of its footprint (checked with a top-view overlay), turned to the plan's angle, on DL_District1.\n- Shelves: the ground under each footprint flattened (plus about 2 m round it), with a soft slope or steps on the uphill side, never a vertical wall of landscape. A shelf is a flat step cut into a slope for a building.\n- Buildings from three sources: your kit (SM_Wall_2m, SM_Wall_Window, SM_Wall_Door, SM_Wall_Corner and the roof pieces) snapped on the grid; Level Instances for repeated types; pack buildings from your Day 24 picks where they fit. Every pack goes in credits.md.\n- At least two house types saved as Level Instances (LI_HarbourHouse_A and LI_HarbourHouse_B), each placed several times. Type B has its own wall colour: a child instance of MI_Plaster with another Tint, set in Details > Materials on its wall pieces (on SM_Wall_Door, a child of MI_Plaster_WallDoor, so the wear mask stays). A Level Instance is a group of actors saved as one reusable piece: edit it once and every copy changes. Everything inside it is the same in every copy, so colour variety comes from the types, the pack buildings and the fronts outside them.\n- SM_ShopFront_A on the ground floor of every shop the plan names, turned in 90-degree steps to face the street, its back against the wall (up to 1 cm out): no gaps, no flicker. Each has its own colour on its Plaster slot (a child of MI_Plaster, for example MI_ShopFront_Blue); the trim and its stone plinth stay as they are. Fronts stay outside the Level Instances, so each copy can have its own.\n- Paving from your Day 17 paving texture on 2 x 2 m squares (a Plane at Scale 2, 2, 1 with MI_Paving_2m, Tiling 1), laid edge to edge, so every door meets a path.\n- A check from C1 to C5 and a pass along the fronts at 30 m: the street reads as one place.\n\nMy checklist:\n1. Make placement_d1.md from plot_plan_d1.png: every building, its plan x and y, its angle and its type (kit, Level Instance or pack). Check: the number of lines matches the buildings on the plan. (from lesson 1)\n2. Screenshot the empty district from C4 for your before picture. Cut shelves: Flatten each footprint plus 2 m, then Smooth the edges. Check: from 10 m no shelf leaves a vertical landscape wall. (from lesson 2)\n3. House type A: a 4 x 6 m house from your kit on the grid with SM_Wall_Window, SM_Wall_Door, corner posts and the roof, saved as the Level Instance LI_HarbourHouse_A. Check: from 2 m there are no gaps at the corners or along the roof line. (from lesson 3)\n4. House type B: a different length (for example 4 x 8 m) or a second storey from the same kit, its walls in a child instance of MI_Plaster with another Tint (a child of MI_Plaster_WallDoor on door walls), saved as LI_HarbourHouse_B. Check: A and B side by side look like neighbours, not twins. (from lesson 3)\n5. Place every Level Instance copy at its plan coordinates (island metres x 100), turned to the plan, dropped with End. Check: all four corners touch the shelf. (from lesson 1)\n6. Pack buildings at their footprints where your plan names one; write each pack in credits.md. Check: credits.md has a line for every pack you used. (from lesson 3)\n7. Paving: 2 x 2 m squares with MI_Paving_2m from every door to the street, edge to edge on grid snap 200, the top 2 cm above the ground. Check: every door meets paving, the pattern is not stretched, and no step is taller than 20 cm. (from lesson 2)\n8. Doors that stand above the ground: add your Day 8 SM_Steps. Check: each step meets the ground and the door. (from lesson 2)\n9. Shop fronts: SM_ShopFront_A on the ground floor of every shop, turned in 90-degree steps to face the street and moved until its back touches the wall, each with its own Plaster colour instance. Check: from 2 m there's no gap and no flicker at any edge. (from lesson 4)\n10. Read the fronts at 2, 10 and 30 m; strengthen one thing that doesn't read. Check: at 30 m you can still tell which ground floors are shops. (from lesson 4)\n11. Overlay: a Top view HighResShot laid over plot_plan_d1.png in Krita; fix anything more than 0.5 m off. Then hide DL_District1 to find any of today's work on the wrong layer. Check: every footprint sits on its box, and with the layer hidden none of today's placed actors show (the shelves belong to the landscape and stay). (from lesson 1)\n12. Capture: C4 before and after today's buildings (before_after_day42.png), and a 60-second flight along the fronts at 8 to 10 m in game view. Save today's clip as flythrough_day42.mp4 and check that you also have overlay_day42.png, fronts_2m.png, fronts_10m.png and fronts_30m.png (each is described in today's hand-in list; take any you are missing now). Check: both files are in today's Work folder. (from lesson 4)\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Anna\nDay 42: District 1 buildings and shop fronts, placed from the plan. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

const lk=s=>esc(s).replace(/https?:\/\/[^\s<']*[^\s<.,;:)']/g,m=>'<a href="'+m+'" target="_blank" rel="noopener">'+m+'</a>');
function list(a,tag,cls){return '<'+tag+(cls?' class="'+cls+'"':'')+'>'+(a||[]).map(i=>'<li>'+lk(x(i))+'</li>').join('')+'</'+tag+'>'}
const lab=(t,k)=>'<div class="lab'+(k?' k-'+k:'')+'"><span class="dotc"></span>'+t+'</div>';
const kn=n=>'<span class="kn">'+ic(n)+'</span>';
const slider=p=>'<div class="slider"><i style="width:calc('+p+'% - 6px)"></i><b style="left:clamp(13px,'+p+'%,calc(100% - 13px))"></b></div>';
function quiz(){if(!D.quiz||!D.quiz.length)return '';const a=st.qa||{};let ok=0;const L=u('letters');
 const pips='<div class="pips well" aria-hidden="true">'+D.quiz.map((q,i)=>'<i class="'+(a[i]==null?'':a[i]===q.answer?'r':'w')+'"></i>').join('')+'</div>';
 const qs=D.quiz.map((q,i)=>{const c=a[i];if(c===q.answer)ok++;return '<div class="qz"><p class="qq"><span class="qn">'+(i+1)+'</span><span>'+lk(x(q.q))+'</span></p>'+q.options.map((o,k)=>{let cls='opt',mk='<span></span>';if(c!=null){if(k===q.answer){cls+=' right';mk=ic('check','mk')}else if(k===c){cls+=' wrong';mk=ic('x','mk')}}return '<button class="'+cls+'" id="o'+i+'_'+k+'"'+(c!=null?' disabled':'')+' onclick="pick('+i+','+k+')"><span class="lt">'+(L[k]||k+1)+'</span><span>'+esc(x(o))+'</span>'+mk+'</button>'}).join('')+(c!=null?'<p class="exp '+(c===q.answer?'r':'w')+'" id="e'+i+'" tabindex="-1"><b>'+(c===q.answer?u('right'):u('wrong'))+'</b>'+lk(x(q.explain))+'</p>':'')+'</div>'}).join('');
 return '<section class="card glass quiz">'+lab(u('quiz'),'gold')+'<p class="muted" style="margin:-6px 0 14px">'+u('quizSub')+'</p>'+pips+qs+(qDone()?'<div class="score well" role="status"><span class="eyebrow">'+u('score')+'</span><span class="lcd" aria-label="'+ok+' / '+D.quiz.length+'">'+seg(ok+'/'+D.quiz.length)+'</span><div class="row"><button class="btn ghost" id="retry" onclick="retry()">'+u('retry')+'</button></div></div>':'')+'</section>'}
function vid(v){if(!v)return '';const link=v.url?'<a href="'+esc(v.url)+'" target="_blank" rel="noopener">'+esc(x(v.title)||v.url)+'</a>'+(v.channel?' <span class="muted">· '+esc(v.channel)+(v.length?' · '+esc(v.length):'')+'</span>':''):'';const s=v.search?'<a href="https://www.youtube.com/results?search_query='+encodeURIComponent(v.search)+'" target="_blank" rel="noopener">'+u('noVid')+': '+esc(v.search)+'</a>':'';const alt=v.alt&&v.alt.url?'<br><span class="eyebrow">UA</span> <a href="'+esc(v.alt.url)+'" target="_blank" rel="noopener">'+esc(v.alt.title||v.alt.url)+'</a>'+(v.alt.channel?' <span class="muted">· '+esc(v.alt.channel)+'</span>':''):'';return '<div class="vid well">'+kn('play')+'<div><b>'+u('more')+'?</b><br>'+(link||s)+alt+(link&&s?'<br><span class="muted" style="font-size:14px">'+s+'</span>':'')+'</div></div>'}
function morning(){const m=D.morning;if(!m)return '';const q=m.quote||{};
 let shelf='';if(D.day>0){shelf='<div class="shelf" aria-hidden="true">';let g='';for(let d=0;d<D.day;d++){let p=0;try{p=(JSON.parse(localStorage.getItem('devteam:'+D.learner+':'+d))||{}).pct||0}catch(e){}g+='<i class="'+(p>=1?'d':'')+(d>0&&d%5===0?' bs':'')+'"></i>';if(d%5===0||d===D.day-1){shelf+='<span class="wkg">'+g+'</span>';g=''}}shelf+='</div>'}
 const qt=lang==='uk'&&q.original?q.original:x(q.text);
 return '<section class="card glass morning"><div class="mgrid">'+(m.sofar?'<div>'+lab(u('sofar'),'gold')+shelf+'<p class="mtxt">'+lk(x(m.sofar))+'</p></div>':'')+(m.today?'<div>'+lab(u('todayL'))+'<p class="mtxt">'+lk(x(m.today))+'</p></div>':'')+'</div>'+(m.cheer?'<p class="cheer">'+esc(x(m.cheer))+'</p>':'')+(qt?'<figure class="quote well">'+kn('quote')+'<blockquote>'+esc(qt)+'</blockquote>'+(q.author?'<figcaption>'+esc(x(q.author))+'</figcaption>':'')+'</figure>':'')+'</section>'}
function setLang(l){lang=l;try{localStorage.setItem('devteam:lang',lang)}catch(e){};render()}
function toggleLang(){setLang(lang==='uk'?'en':'uk')}
/* keep open sections and keyboard focus across re-renders */
const openD=new Set();
function tg(e){if(e.open)openD.add(e.id);else openD.delete(e.id)}
const op=id=>openD.has(id)?' open':'';
function render(){const ae=document.activeElement,fid=ae&&(ae.id||(ae.getAttribute('data-th')?'th-'+ae.getAttribute('data-th'):ae.getAttribute('lang')&&ae.closest('.seg')?'lg-'+ae.getAttribute('lang'):''));
 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);
 const b=D.build,P=Math.round(prog()*100);
 document.getElementById('top').innerHTML='<div class="topin glass"><a class="maplink" href="'+esc(D.mapHref)+'">'+kn('map')+u('map')+'</a><div class="crumb"><b>'+esc(x(D.learnerName))+'</b><span>'+u('week')+' '+D.week+'</span><span>'+u('day')+' '+D.day+' '+u('of')+' '+D.total+'</span></div>'+controls(lang,'setLang')+'</div><div class="tline"><i style="width:'+P+'%"></i></div>';
 const state=w=>w<D.week?'b':w===D.week?'n':'p';
 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 if(D.weekInfo){const w=D.weekInfo;h+='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}
 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p><div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+list(D.handin,'ul','ticks')+'<p class="path">'+ic('folder')+'<span>'+u('shipTo')+' <code>'+esc(D.workPath)+'</code></span></p>'+(D.lessons.length?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<p class="muted">'+u('report')+'</p><div class="row"><button class="btn s" onclick="cp(D.reportPrompt)">'+ic('copy')+u('copyR')+'</button></div></section>';
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();
</script>

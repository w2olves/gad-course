<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 4</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

#toast{position:fixed;left:50%;bottom:28px;z-index:9;transform:translateX(-50%) translateY(16px);background:rgba(30,33,46,.82);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:#f4f5fa;border:1px solid rgba(255,255,255,.14);padding:13px 24px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none;font:600 14px/1.4 var(--head);max-width:min(92vw,560px);text-align:center;box-shadow:0 20px 40px -14px rgba(0,0,0,.5),0 0 24px var(--glow)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

 body{font-size:16.5px}

<script id="data" type="application/json">{"learner": "ib-anna-66f40e67", "learnerName": {"en": "Anna", "uk": "Анна"}, "day": 4, "week": 1, "total": 60, "title": {"en": "Measured drawings and the clean game export: the litter bin", "uk": "Обмірні креслення і чистий експорт для гри: вулична урна"}, "theme": {"en": "Week 1: Blender from zero", "uk": "Тиждень 1: Blender з нуля"}, "build": {"item": {"en": "SM_Bin: a street litter bin, drawn to measure in Krita, then exported clean for Unreal with collision", "uk": "SM_Bin: вулична урна для сміття, накреслена за розмірами в Krita, а потім чисто експортована для Unreal із колізією"}, "why": {"en": "Studios rarely model from one photo. An artist first draws a measured elevation (a flat, to-scale drawing of one side), so every size is decided before modelling starts. Then the model leaves Blender clean: real size, origin on the ground, transforms applied and simple collision (an invisible shape the game uses so players and cameras bump into the object instead of passing through it), saved as an FBX file (the file type studios use to move models into game engines). A clean export means nobody has to fix your prop later, and studios check exactly this in art tests.", "uk": "Студії рідко моделюють за одним фото. Спершу художник креслить обмірний вид (elevation — пласке креслення одного боку в масштабі), тож кожен розмір вирішено ще до початку моделювання. Потім модель виходить із Blender чистою: реальний розмір, origin на землі, застосовані трансформації та проста колізія (невидима форма, яку гра використовує, щоб гравці й камери натикалися на об'єкт, а не проходили крізь нього), збережена у файлі FBX (форматі, яким студії переносять моделі в ігрові рушії). Чистий експорт означає, що нікому не доведеться згодом виправляти твій пропс, і студії перевіряють саме це в арт-тестах."}, "where": {"en": "Beside benches and at corners of your island's waterfront (district 1). Today it stands in Course/Day04 beside the bollard and the mannequin.", "uk": "Біля лавок і на рогах набережної твого острова (район 1). Сьогодні урна стоїть у Course/Day04 поруч зі стовпчиком і манекеном."}, "spec": [{"en": "bin_front.png and bin_front.kra: a front elevation drawn in Krita at 1 px = 1 mm on a 100 px grid, with a ground line and dimension lines in millimetres on their own layer.", "uk": "bin_front.png і bin_front.kra: вид спереду, накреслений у Krita в масштабі 1 px = 1 мм на сітці 100 px, з лінією землі й розмірними лініями в міліметрах на окремому шарі."}, {"en": "Real size from your photos: many street bins are about 0.8 to 1.0 m tall and 0.4 to 0.6 m wide; the sizes are in bin_sizes.md.", "uk": "Реальний розмір за твоїми фото: багато вуличних урн мають приблизно від 0.8 до 1.0 м заввишки і від 0.4 до 0.6 м завширшки; розміри записано в bin_sizes.md."}, {"en": "Modelled over the drawing, used as a reference image at exact scale: a body, an opening at the top (inset and extrude), a rim or lid, and a post or base.", "uk": "Змодельована поверх креслення, яке використано як референсне зображення в точному масштабі: корпус, отвір угорі (inset і extrude), обідок або кришка, і стійка або основа."}, {"en": "One object SM_Bin, origin at the base centre on Z = 0, all transforms applied, 3,000 triangles or fewer.", "uk": "Один об'єкт SM_Bin, origin у центрі основи на Z = 0, усі трансформації застосовано, 3 000 трикутників або менше."}, {"en": "Collision: one to three simple boxes, each a separate object named UCX_SM_Bin_00, _01 and so on, with the bin's origin.", "uk": "Колізія: від одного до трьох простих блоків, кожен — окремий об'єкт із назвою UCX_SM_Bin_00, _01 і так далі, з тим самим origin, що й в урни."}, {"en": "SM_Bin.fbx exported with the course's FBX settings; in Unreal (Course/Day04), imported with Fallback Collision Type set to None (so Unreal adds no collision shape of its own), standing on the floor at the right size, with the collision visible in Player Collision view.", "uk": "SM_Bin.fbx експортовано з налаштуваннями FBX цього курсу; в Unreal (Course/Day04) імпортовано з Fallback Collision Type = None (щоб Unreal не додавав власної форми колізії), урна стоїть на підлозі в правильному розмірі, а колізію видно в режимі Player Collision."}, {"en": "The bollard exported the same way: SM_Bollard.fbx with its UCX box.", "uk": "Стовпчик експортовано так само: SM_Bollard.fbx із його блоком UCX."}], "piece1": "the bin: the drawing and the first model (in the lessons)", "piece2": {"en": "SM_Bin finished and exported clean, plus the bollard's clean FBX, on your own", "uk": "SM_Bin, завершена й чисто експортована, плюс чистий FBX стовпчика, самостійно"}, "steps": [{"text": {"en": "Find three Commons photos of a present-day street litter bin; save them in refs and credit them in credits.md. Check: three photos, each with a line in credits.md.", "uk": "Знайди на Commons три фото сучасної вуличної урни; збережи їх у refs і вкажи в credits.md. Перевірка: три фото, і в кожного є рядок у credits.md."}, "lesson": "D1.2"}, {"text": {"en": "Work out the bin's height, width, opening and post or base sizes from a known size in the photos, and write them in bin_sizes.md. Check: at least four sizes, each with its photo.", "uk": "Визнач висоту й ширину урни, розміри отвору та стійки або основи за відомим розміром на фото й запиши їх у bin_sizes.md. Перевірка: щонайменше чотири розміри, кожен зі своїм фото."}, "lesson": "D1.2"}, {"text": {"en": "Finish bin_front.kra in Krita: ground line, body, rim or lid, opening and post or base, all to size on the grid, with every main size on the dims layer. Export bin_front.png. Check: the drawn height in grid squares matches bin_sizes.md (one square = 10 cm).", "uk": "Заверши bin_front.kra у Krita: лінія землі, корпус, обідок або кришка, отвір і стійка або основа — усе за розмірами на сітці, а кожен головний розмір — на шарі dims. Експортуй bin_front.png. Перевірка: накреслена висота в клітинках сітки збігається з bin_sizes.md (одна клітинка = 10 см)."}, "lesson": 1}, {"text": {"en": "In bin_day4.blend, place bin_front.png as a reference image: Size 1.2 m and the ground line on Z = 0. Check: the Measure tool from the drawn ground line to the drawn top reads your height.", "uk": "У bin_day4.blend додай bin_front.png як референсне зображення: Size 1.2 м, а лінія землі на Z = 0. Перевірка: інструмент Measure від накресленої лінії землі до накресленого верху показує твою висоту."}, "lesson": 2}, {"text": {"en": "Body and opening: a cylinder (Vertices 24) sized to the drawing, sat on Z = 0; inset the top face and extrude the inner face down to make the opening. Check: from above (Numpad 7) you see a rim and a hole going down.", "uk": "Корпус і отвір: циліндр (Vertices 24) за розміром креслення, поставлений на Z = 0; зроби inset верхньої грані й видави внутрішню грань донизу, щоб вийшов отвір. Перевірка: згори (Numpad 7) видно обідок і отвір, що йде вглиб."}, "lesson": 2}, {"text": {"en": "Rim or lid: extrude the rim's border out a little or add a slightly wider flat cylinder on top, as your drawing shows. Add a Bevel modifier (about 0.005 m, 2 segments) to the hard edges. Check: the rim's outline matches the drawing in the front view.", "uk": "Обідок або кришка: трохи видави назовні край обідка або додай зверху трохи ширший плаский циліндр, як показує твоє креслення. Додай модифікатор Bevel (близько 0.005 м, 2 сегменти) на тверді краї. Перевірка: на виді спереду контур обідка збігається з кресленням."}, "lesson": "D3.3"}, {"text": {"en": "Post or base: add it from simple shapes at the drawn sizes. Check: no gap between the post or base and the body from the front or the side.", "uk": "Стійка або основа: додай її з простих форм за накресленими розмірами. Перевірка: між стійкою або основою і корпусом немає щілини ні спереду, ні збоку."}, "lesson": "D1.3"}, {"text": {"en": "Apply all modifiers, join the parts (Ctrl+J), name the object SM_Bin, set the origin at the base centre on Z = 0 and apply all transforms. Check: Location 0, 0, 0, Rotation 0, Scale 1, and 3,000 triangles or fewer.", "uk": "Застосуй усі модифікатори, об'єднай частини (Ctrl+J), назви об'єкт SM_Bin, постав origin у центр основи на Z = 0 і застосуй усі трансформації. Перевірка: Location 0, 0, 0, Rotation 0, Scale 1 і 3 000 трикутників або менше."}, "lesson": "D1.4"}, {"text": {"en": "Collision: one box around the body and one around the post or base, named UCX_SM_Bin_00 and _01, each with the bin's origin and its transforms applied. Check: in X-ray, each box wraps its part closely and both names start with UCX_SM_Bin_.", "uk": "Колізія: один блок навколо корпусу й один навколо стійки або основи, з назвами UCX_SM_Bin_00 і _01, кожен з origin урни й застосованими трансформаціями. Перевірка: у X-ray кожен блок щільно обгортає свою частину, а обидві назви починаються з UCX_SM_Bin_."}, "lesson": 3}, {"text": {"en": "Export SM_Bin.fbx with the bin and its UCX boxes selected, using the course's FBX settings. Check: the file is in today's Work folder.", "uk": "Експортуй SM_Bin.fbx, виділивши урну та її блоки UCX, з налаштуваннями FBX цього курсу. Перевірка: файл лежить у сьогоднішній папці Work."}, "lesson": 4}, {"text": {"en": "Open bollard_day1.blend: add one box UCX_SM_Bollard_00 around the body, give it the bollard's origin, and export SM_Bollard.fbx the same way. Check: the export window showed Selected Objects ticked and only Mesh chosen.", "uk": "Відкрий bollard_day1.blend: додай один блок UCX_SM_Bollard_00 навколо корпусу, дай йому origin стовпчика й експортуй SM_Bollard.fbx так само. Перевірка: у вікні експорту було позначено Selected Objects і вибрано тільки Mesh."}, "lesson": 4}, {"text": {"en": "Import both FBX files into Course/Day04 with the collision settings from lesson 4 (Fallback Collision Type: None). Open each in the Static Mesh Editor: read Triangles and Approx Size, and turn on Show > Simple Collision. Check: Approx Size matches your sizes in centimetres (a 0.9 m bin reads about 90), and the boxes show as green lines.", "uk": "Імпортуй обидва файли FBX у Course/Day04 з налаштуваннями колізії з уроку 4 (Fallback Collision Type: None). Відкрий кожен у Static Mesh Editor: прочитай Triangles і Approx Size та ввімкни Show > Simple Collision. Перевірка: Approx Size збігається з твоїми розмірами в сантиметрах (урна 0.9 м показує близько 90), а блоки видно як зелені лінії."}, "lesson": 4}, {"text": {"en": "Place both in the level beside the mannequin with End and take unreal_collision.png in View Mode > Player Collision. Check: you see simple boxes, not the full shapes.", "uk": "Постав обидва в рівень поруч із манекеном через End і зроби unreal_collision.png у View Mode > Player Collision. Перевірка: ти бачиш прості блоки, а не повні форми."}, "lesson": 4}, {"text": {"en": "Captures. First before_after_day4.png: open bin_front.png, press Win+Left, click Blender (front orthographic view, reference image hidden) and press Win+Right, then press Win+Shift+S and capture the whole screen. Then clip_day4.mp4, about 60 seconds: orbit the bin in Blender, then walk the mannequin into it in Unreal (it should stop, not pass through). Win+Alt+R records only one program window, so for a clip that moves between Blender and Unreal open Snipping Tool, click Record and drag a box over the whole screen. Rename the clip clip_day4.mp4. Check: both files are in today's Work folder.", "uk": "Знімки й запис. Спершу before_after_day4.png: відкрий bin_front.png, натисни Win+Left, клацни на Blender (ортографічний вид спереду, референсне зображення сховане) і натисни Win+Right, тоді натисни Win+Shift+S і зніми весь екран. Потім clip_day4.mp4, близько 60 секунд: обертай вид навколо урни в Blender, а тоді заведи манекен прямо на неї в Unreal (він має зупинитися, а не пройти крізь). Win+Alt+R записує лише одне вікно програми, тож для кліпу, який переходить між Blender і Unreal, відкрий Snipping Tool, натисни Record і обведи рамкою весь екран. Перейменуй кліп на clip_day4.mp4. Перевірка: обидва файли лежать у сьогоднішній папці Work."}, "lesson": "D0.1"}]}, "lessons": [{"title": {"en": "Measured drawings in Krita: an elevation at 1 px = 1 mm", "uk": "Обмірні креслення в Krita: вид спереду в масштабі 1 px = 1 мм"}, "minutes": 40, "goals": [{"en": "Explain an elevation: a flat, to-scale drawing of one side of an object, with no perspective.", "uk": "Пояснювати, що таке обмірний вид (elevation): пласке креслення одного боку об'єкта в масштабі, без перспективи."}, {"en": "Set up a Krita canvas at 1 px = 1 mm with a 100 px grid, and draw lines and rectangles to exact sizes.", "uk": "Налаштовувати полотно Krita в масштабі 1 px = 1 мм із сіткою 100 px і креслити лінії та прямокутники точних розмірів."}, {"en": "Put dimension lines (lines with the size written beside them) on their own layer, and save and export the drawing.", "uk": "Розміщувати розмірні лінії (лінії з написаним поруч розміром) на окремому шарі, зберігати й експортувати креслення."}], "doalong": [{"en": "Open Krita. File > New > Custom Document: Width 1200 px, Height 1200 px (1.2 x 1.2 m at 1 px = 1 mm). Click Create: a white canvas opens.", "uk": "Відкрий Krita. File > New > Custom Document: Width 1200 px, Height 1200 px (1.2 x 1.2 м при 1 px = 1 мм). Натисни Create: відкривається біле полотно."}, {"en": "Open Settings > Dockers > Grid and Guides. On its Grid tab, tick Show Grid and Snap to Grid, and set X spacing and Y spacing to 100 px. Every grid square is now 10 cm, and the lines you draw land on the grid lines. (Shift+S opens a snap menu where Grids does the same.)", "uk": "Відкрий Settings > Dockers > Grid and Guides. На його вкладці Grid познач Show Grid і Snap to Grid та встанови X spacing і Y spacing на 100 px. Тепер кожна клітинка сітки — 10 см, а лінії, які ти креслиш, лягають на лінії сітки. (Shift+S відкриває меню прив'язки, де пункт Grids робить те саме.)"}, {"en": "Pick the Line tool in the toolbox on the left and draw the ground line one square (100 px) above the bottom edge; hold Shift to keep it straight. Pick the Rectangle tool and draw the bin's body standing on the ground line: for a 500 mm wide, 900 mm tall bin, 5 squares wide and 9 squares tall.", "uk": "Вибери інструмент Line на панелі інструментів ліворуч і накресли лінію землі на одну клітинку (100 px) вище нижнього краю; утримуй Shift, щоб лінія була рівною. Вибери інструмент Rectangle і накресли корпус урни, що стоїть на лінії землі: для урни 500 мм завширшки і 900 мм заввишки це 5 клітинок завширшки і 9 клітинок заввишки."}, {"en": "In the Layers docker (bottom right), click + to add a new layer and double-click its name to call it dims. On it, draw a line under the body and write 500 with the Text tool (the T icon: drag a small box beside the line and type; in some Krita versions a small text window opens: type there, then close it); draw a line up the side and write 900.", "uk": "У докері Layers (унизу праворуч) натисни +, щоб додати новий шар, і двічі клацни на його назві, щоб назвати його dims. На цьому шарі накресли лінію під корпусом і напиши 500 інструментом Text (значок T: протягни маленьку рамку біля лінії й надрукуй; у деяких версіях Krita відкривається маленьке вікно тексту: надрукуй там, а тоді закрий його); накресли лінію вздовж боку й напиши 900."}, {"en": "Back on the first layer, add the rim or lid, the opening and the post or base from your photos, each counted in grid squares.", "uk": "Повернись на перший шар і додай обідок або кришку, отвір і стійку або основу за своїми фото, рахуючи кожну частину в клітинках сітки."}, {"en": "File > Save As bin_front.kra (Krita's own file, which keeps the layers), then File > Export > bin_front.png. Both go in today's Work folder.", "uk": "File > Save As bin_front.kra (власний формат Krita, який зберігає шари), потім File > Export > bin_front.png. Обидва файли — у сьогоднішню папку Work."}], "play": {"en": "Spot the wrong drawing: the tutor describes a bin drawing with three mistakes (no ground line, a bin 1.5 m tall, one size in centimetres and the others in millimetres); I find all three before it tells me.", "uk": "Знайди неправильне креслення: тьютор описує креслення урни з трьома помилками (немає лінії землі, урна заввишки 1.5 м, один розмір у сантиметрах, а решта в міліметрах); я знаходжу всі три, перш ніж він підкаже."}, "video": {"search": "krita grid and guides docker beginner technical drawing"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Measured drawings in Krita: an elevation at 1 px = 1 mm (Day 4, lesson 1 of 4).\nToday's build: SM_Bin: a street litter bin, drawn to measure in Krita, then exported clean for Unreal with collision.\n\nBy the end of this lesson I can:\n1. Explain an elevation: a flat, to-scale drawing of one side of an object, with no perspective.\n2. Set up a Krita canvas at 1 px = 1 mm with a 100 px grid, and draw lines and rectangles to exact sizes.\n3. Put dimension lines (lines with the size written beside them) on their own layer, and save and export the drawing.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (You own three real-size props now, the bollard, the bench and the lamp post, plus a railing built with modifiers.), what I will learn today (You draw a litter bin to measure in Krita, model SM_Bin over the drawing, and export it as a clean FBX with collision boxes.), encourage me (A clean export is the first thing a studio checks, and you are building that habit in week one; follow the checklist calmly, line by line.), and share today's quote: \"In the elder days of Art, builders wrought with greatest care each minute and unseen part.\" (Henry Wadsworth Longfellow).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 1: In Unreal your bollard turns around a point half a metre above its base. What did you forget in Blender, and how do you fix it? | Day 0: You change an object's Location X in Unreal from 0 to 250. How many metres did it move?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Spot the wrong drawing: the tutor describes a bin drawing with three mistakes (no ground line, a bin 1.5 m tall, one size in centimetres and the others in millimetres); I find all three before it tells me.\n6. Do-along on today's build (the bin: the drawing and the first model (in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Open Krita. File > New > Custom Document: Width 1200 px, Height 1200 px (1.2 x 1.2 m at 1 px = 1 mm). Click Create: a white canvas opens.\n   - Open Settings > Dockers > Grid and Guides. On its Grid tab, tick Show Grid and Snap to Grid, and set X spacing and Y spacing to 100 px. Every grid square is now 10 cm, and the lines you draw land on the grid lines. (Shift+S opens a snap menu where Grids does the same.)\n   - Pick the Line tool in the toolbox on the left and draw the ground line one square (100 px) above the bottom edge; hold Shift to keep it straight. Pick the Rectangle tool and draw the bin's body standing on the ground line: for a 500 mm wide, 900 mm tall bin, 5 squares wide and 9 squares tall.\n   - In the Layers docker (bottom right), click + to add a new layer and double-click its name to call it dims. On it, draw a line under the body and write 500 with the Text tool (the T icon: drag a small box beside the line and type; in some Krita versions a small text window opens: type there, then close it); draw a line up the side and write 900.\n   - Back on the first layer, add the rim or lid, the opening and the post or base from your photos, each counted in grid squares.\n   - File > Save As bin_front.kra (Krita's own file, which keeps the layers), then File > Export > bin_front.png. Both go in today's Work folder.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Your drawing in Blender: a reference image at exact scale", "uk": "Твоє креслення в Blender: референсне зображення в точному масштабі"}, "minutes": 40, "goals": [{"en": "Add a drawing to Blender as a reference image in the front orthographic view.", "uk": "Додавати креслення в Blender як референсне зображення в ортографічному виді спереду."}, {"en": "Scale and move it so 1200 px = 1.2 m and its drawn ground line sits on Z = 0.", "uk": "Масштабувати й переміщати його так, щоб 1200 px = 1.2 м, а накреслена лінія землі лежала на Z = 0."}, {"en": "Model the bin's body over the drawing, with inset and extrude for the opening.", "uk": "Моделювати корпус урни поверх креслення, з inset і extrude для отвору."}], "doalong": [{"en": "New General file, delete the cube, check Units (Metric, 1.0) and save bin_day4.blend. Press Numpad 1 for the front view; the top left of the viewport should say Front Orthographic (press Numpad 5 if it says Perspective).", "uk": "Новий файл General, видали куб, перевір Units (Metric, 1.0) і збережи bin_day4.blend. Натисни Numpad 1 для виду спереду; угорі ліворуч у в'юпорті має бути напис Front Orthographic (натисни Numpad 5, якщо там Perspective)."}, {"en": "Add > Image > Reference, and pick bin_front.png: the drawing appears facing you. In the Properties editor, click the image's Object Data tab (a small picture icon) and set Size to 1.2 m.", "uk": "Add > Image > Reference і вибери bin_front.png: креслення з'являється обличчям до тебе. У Properties editor клацни вкладку Object Data зображення (маленький значок картинки) і встанови Size на 1.2 м."}, {"en": "The image is centred on its origin, so its bottom edge is at -0.6 m and your drawn ground line (0.1 m above the edge) is at -0.5 m. Set the image's Location Z to 0.5 m: the drawn ground line now sits on Z = 0.", "uk": "Зображення центроване на своєму origin, тож його нижній край на -0.6 м, а твоя накреслена лінія землі (на 0.1 м вище краю) — на -0.5 м. Встанови Location Z зображення на 0.5 м: тепер накреслена лінія землі лежить на Z = 0."}, {"en": "Check one size: with the Measure tool, drag from the drawn ground line to the top of the drawn body. It reads your height, for example 0.9 m. Then click the Select tool again.", "uk": "Перевір один розмір: інструментом Measure протягни від накресленої лінії землі до верху накресленого корпусу. Він показує твою висоту, наприклад 0.9 м. Потім знову клацни інструмент Select."}, {"en": "Add a cylinder (Vertices 24), type the drawn body's width and height into Dimensions, apply the scale and sit it on Z = 0. It covers the drawn body exactly.", "uk": "Додай циліндр (Vertices 24), введи ширину й висоту накресленого корпусу в Dimensions, застосуй масштаб і постав його на Z = 0. Він точно накриває накреслений корпус."}, {"en": "Tab, press 3, select the top face, press I and type 0.02, then press E and type -0.3: the top now has a 2 cm rim and an opening 30 cm deep. Tab out and save. Click the eye beside the image in the Outliner to hide it when you want a clean look.", "uk": "Tab, натисни 3, виділи верхню грань, натисни I і введи 0.02, потім натисни E і введи -0.3: тепер угорі обідок 2 см і отвір глибиною 30 см. Вийди з Edit Mode (Tab) і збережи. Клацни на значок ока біля зображення в Outliner, щоб сховати його, коли хочеш чистий вигляд."}], "play": {"en": "Trace race: the tutor times me while I match three parts of my drawing (body, rim, post) with shapes; every part within 1 cm of the drawing scores a point.", "uk": "Перегони з кресленням: тьютор засікає час, поки я підганяю формами три частини свого креслення (корпус, обідок, стійку); кожна частина з точністю до 1 см від креслення приносить бал."}, "video": {"url": "https://www.youtube.com/watch?v=0UwSFtMi5ew", "title": "How to setup reference images in Blender 3.4", "channel": "Plockis", "length": "6:24", "search": "blender reference images blueprint setup"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Your drawing in Blender: a reference image at exact scale (Day 4, lesson 2 of 4).\nToday's build: SM_Bin: a street litter bin, drawn to measure in Krita, then exported clean for Unreal with collision.\n\nBy the end of this lesson I can:\n1. Add a drawing to Blender as a reference image in the front orthographic view.\n2. Scale and move it so 1200 px = 1.2 m and its drawn ground line sits on Z = 0.\n3. Model the bin's body over the drawing, with inset and extrude for the opening.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Trace race: the tutor times me while I match three parts of my drawing (body, rim, post) with shapes; every part within 1 cm of the drawing scores a point.\n4. Do-along on today's build (the bin: the drawing and the first model (in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - New General file, delete the cube, check Units (Metric, 1.0) and save bin_day4.blend. Press Numpad 1 for the front view; the top left of the viewport should say Front Orthographic (press Numpad 5 if it says Perspective).\n   - Add > Image > Reference, and pick bin_front.png: the drawing appears facing you. In the Properties editor, click the image's Object Data tab (a small picture icon) and set Size to 1.2 m.\n   - The image is centred on its origin, so its bottom edge is at -0.6 m and your drawn ground line (0.1 m above the edge) is at -0.5 m. Set the image's Location Z to 0.5 m: the drawn ground line now sits on Z = 0.\n   - Check one size: with the Measure tool, drag from the drawn ground line to the top of the drawn body. It reads your height, for example 0.9 m. Then click the Select tool again.\n   - Add a cylinder (Vertices 24), type the drawn body's width and height into Dimensions, apply the scale and sit it on Z = 0. It covers the drawn body exactly.\n   - Tab, press 3, select the top face, press I and type 0.02, then press E and type -0.3: the top now has a 2 cm rim and an opening 30 cm deep. Tab out and save. Click the eye beside the image in the Outliner to hide it when you want a clean look.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"How to setup reference images in Blender 3.4\" by Plockis: https://www.youtube.com/watch?v=0UwSFtMi5ew\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Collision boxes: the invisible shape the game uses", "uk": "Блоки колізії: невидима форма, яку використовує гра"}, "minutes": 40, "goals": [{"en": "Explain collision: a simple invisible shape the game uses to stop players, cameras and objects passing through a model.", "uk": "Пояснювати, що таке колізія: проста невидима форма, яку гра використовує, щоб гравці, камери й об'єкти не проходили крізь модель."}, {"en": "Make collision boxes from cubes, tight to the solid parts, and convex (no dents or holes).", "uk": "Робити блоки колізії з кубів, щільно навколо твердих частин, і опуклими (convex — без вм'ятин і дірок)."}, {"en": "Name each box UCX_<MeshName>_00, _01 and so on, exactly after the visible object, with the same origin.", "uk": "Називати кожен блок UCX_<Назва>_00, _01 і так далі, точно за назвою видимого об'єкта, з тим самим origin."}], "doalong": [{"en": "Name the bin object SM_Bin (double-click it in the Outliner). Add a cube (Shift+A > Mesh > Cube); its colour doesn't matter.", "uk": "Назви об'єкт урни SM_Bin (двічі клацни на ньому в Outliner). Додай куб (Shift+A > Mesh > Cube); його колір не важливий."}, {"en": "In the sidebar, type the body's width, depth and height into the cube's Dimensions, apply the scale and move it up by half its height so it wraps the body. Press Alt+Z to see through it. A square box around a round bin is fine: collision only needs to be close.", "uk": "На бічній панелі введи ширину, глибину й висоту корпусу в Dimensions куба, застосуй масштаб і підніми його на половину висоти, щоб він обгортав корпус. Натисни Alt+Z, щоб бачити крізь нього. Квадратний блок навколо круглої урни — це нормально: колізії достатньо бути близькою за формою."}, {"en": "Name the cube UCX_SM_Bin_00. UCX_ tells Unreal: this is collision, don't draw it. The rest of the name must match the visible object's name exactly, or Unreal shows the box as a grey block.", "uk": "Назви куб UCX_SM_Bin_00. UCX_ каже Unreal: це колізія, не малюй її. Решта назви має точно збігатися з назвою видимого об'єкта, інакше Unreal покаже блок як сірий брусок."}, {"en": "If the bin has a post, add a second box around it and name it UCX_SM_Bin_01.", "uk": "Якщо в урни є стійка, додай другий блок навколо неї й назви його UCX_SM_Bin_01."}, {"en": "Give the boxes the bin's origin: Shift+S > Cursor to World Origin, select both boxes, Object > Set Origin > Origin to 3D Cursor, then Ctrl+A > All Transforms. Save.", "uk": "Дай блокам origin урни: Shift+S > Cursor to World Origin, виділи обидва блоки, Object > Set Origin > Origin to 3D Cursor, потім Ctrl+A > All Transforms. Збережи."}], "play": {"en": "Box it: the tutor names five objects (a bench, a lamp post, a bin on a post, a bollard, a railing); I say how many collision boxes each needs and where, and why fewer is better.", "uk": "Запакуй у блоки: тьютор називає п'ять об'єктів (лавка, ліхтарний стовп, урна на стійці, стовпчик, поруччя); я кажу, скільки блоків колізії потрібно кожному і де, і чому менше — краще."}, "video": {"url": "https://www.youtube.com/watch?v=b0LwwNNgZUo", "title": "Create custom collision for Unreal in Blender (Tutorial) by #SyntyStudios", "channel": "Synty Studios", "length": "3:24", "search": "blender ucx collision unreal"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Collision boxes: the invisible shape the game uses (Day 4, lesson 3 of 4).\nToday's build: SM_Bin: a street litter bin, drawn to measure in Krita, then exported clean for Unreal with collision.\n\nBy the end of this lesson I can:\n1. Explain collision: a simple invisible shape the game uses to stop players, cameras and objects passing through a model.\n2. Make collision boxes from cubes, tight to the solid parts, and convex (no dents or holes).\n3. Name each box UCX_<MeshName>_00, _01 and so on, exactly after the visible object, with the same origin.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Box it: the tutor names five objects (a bench, a lamp post, a bin on a post, a bollard, a railing); I say how many collision boxes each needs and where, and why fewer is better.\n4. Do-along on today's build (the bin: the drawing and the first model (in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Name the bin object SM_Bin (double-click it in the Outliner). Add a cube (Shift+A > Mesh > Cube); its colour doesn't matter.\n   - In the sidebar, type the body's width, depth and height into the cube's Dimensions, apply the scale and move it up by half its height so it wraps the body. Press Alt+Z to see through it. A square box around a round bin is fine: collision only needs to be close.\n   - Name the cube UCX_SM_Bin_00. UCX_ tells Unreal: this is collision, don't draw it. The rest of the name must match the visible object's name exactly, or Unreal shows the box as a grey block.\n   - If the bin has a post, add a second box around it and name it UCX_SM_Bin_01.\n   - Give the boxes the bin's origin: Shift+S > Cursor to World Origin, select both boxes, Object > Set Origin > Origin to 3D Cursor, then Ctrl+A > All Transforms. Save.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Create custom collision for Unreal in Blender (Tutorial) by #SyntyStudios\" by Synty Studios: https://www.youtube.com/watch?v=b0LwwNNgZUo\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "The clean FBX export and the check in Unreal", "uk": "Чистий експорт FBX і перевірка в Unreal"}, "minutes": 40, "goals": [{"en": "Export an FBX (the file type studios use to move models into game engines) with the course settings, named SM_<Thing>.fbx.", "uk": "Експортувати FBX (формат, яким студії переносять моделі в ігрові рушії) з налаштуваннями курсу, з назвою SM_<Назва>.fbx."}, {"en": "Import an FBX into Unreal with your UCX boxes and no extra collision (Fallback Collision Type: None), and read its triangles and size in the Static Mesh Editor.", "uk": "Імпортувати FBX в Unreal з твоїми блоками UCX і без зайвої колізії (Fallback Collision Type: None) та читати його трикутники й розмір у Static Mesh Editor."}, {"en": "See collision in the Static Mesh Editor (Show > Simple Collision) and in the level (View Mode > Player Collision).", "uk": "Бачити колізію в Static Mesh Editor (Show > Simple Collision) і в рівні (View Mode > Player Collision)."}], "doalong": [{"en": "In bin_day4.blend, click SM_Bin and Shift+click its UCX boxes. File > Export > FBX (.fbx).", "uk": "У bin_day4.blend клацни SM_Bin і через Shift+клацання додай до виділення його блоки UCX. File > Export > FBX (.fbx)."}, {"en": "In the export window: under Include, tick Limit to > Selected Objects and pick only Mesh in Object Types; under Transform, set Apply Scalings to FBX All; under Geometry, tick Apply Modifiers and set Smoothing to Face; set Path Mode to Copy and turn on Embed Textures (the small button beside it). Name the file SM_Bin.fbx and export it to today's Work folder.", "uk": "У вікні експорту: у розділі Include познач Limit to > Selected Objects і вибери тільки Mesh в Object Types; у розділі Transform встанови Apply Scalings на FBX All; у розділі Geometry познач Apply Modifiers і встанови Smoothing на Face; встанови Path Mode на Copy і ввімкни Embed Textures (маленька кнопка поруч). Назви файл SM_Bin.fbx і експортуй його в сьогоднішню папку Work."}, {"en": "In IslandCourse, make the folder Course/Day04 and drag SM_Bin.fbx into it. The import window opens. Type collision in its search box: keep Collision and Import Collision According To Mesh Name ticked (they read your UCX boxes), and set Fallback Collision Type to None, so Unreal adds no shape of its own. (Older versions show one tick box called Generate Missing Collision instead: untick it.) If your window looks different, send the tutor a screenshot. Click Import.", "uk": "В IslandCourse створи папку Course/Day04 і перетягни в неї SM_Bin.fbx. Відкривається вікно імпорту. Введи collision у його поле пошуку: залиш позначеними Collision і Import Collision According To Mesh Name (вони зчитують твої блоки UCX) і встанови Fallback Collision Type на None, щоб Unreal не додавав власної форми. (У старіших версіях замість цього є один прапорець Generate Missing Collision: зніми його.) Якщо твоє вікно виглядає інакше, надішли тьютору скриншот. Натисни Import."}, {"en": "Double-click the bin mesh: the Static Mesh Editor (a window that shows one mesh and its settings) opens. Read Triangles and Approx Size (in centimetres) at the top left of its viewport. Click Show > Simple Collision: your boxes appear as green lines.", "uk": "Двічі клацни на асеті урни: відкривається Static Mesh Editor (вікно, яке показує одну сітку та її налаштування). Прочитай Triangles і Approx Size (у сантиметрах) угорі ліворуч у його в'юпорті. Натисни Show > Simple Collision: твої блоки з'являються як зелені лінії."}, {"en": "If grey boxes show as visible parts instead, a name is wrong: fix it in Blender and export again with the same file name.", "uk": "Якщо натомість сірі блоки видно як частини моделі, якась назва неправильна: виправ її в Blender і експортуй ще раз із тією самою назвою файлу."}, {"en": "Drag the bin into the level beside the mannequin and press End. Click the View Mode button at the top of the level viewport (it says Lit) and choose Player Collision (it may sit under Collision). Take a screenshot, then switch back to Lit.", "uk": "Перетягни урну в рівень поруч із манекеном і натисни End. Клацни кнопку View Mode угорі в'юпорта рівня (на ній написано Lit) і вибери Player Collision (він може бути в підменю Collision). Зроби скриншот, а тоді повернись до Lit."}], "play": {"en": "Break it, fix it: the tutor tells me one export setting it has secretly 'broken'; I guess which from a description of the result, then fix it.", "uk": "Зламай і полагодь: тьютор каже, що потай «зламав» одне налаштування експорту; я вгадую, яке саме, з опису результату, а тоді виправляю його."}, "video": {"url": "https://www.youtube.com/watch?v=2iZIAlqnGEw", "title": "The Perfect Blender to Game Engine Export Workflow (4 QA Checks)", "channel": "GPolygon Design", "length": "3:37", "search": "blender game engine export workflow scale origin"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: The clean FBX export and the check in Unreal (Day 4, lesson 4 of 4).\nToday's build: SM_Bin: a street litter bin, drawn to measure in Krita, then exported clean for Unreal with collision.\n\nBy the end of this lesson I can:\n1. Export an FBX (the file type studios use to move models into game engines) with the course settings, named SM_<Thing>.fbx.\n2. Import an FBX into Unreal with your UCX boxes and no extra collision (Fallback Collision Type: None), and read its triangles and size in the Static Mesh Editor.\n3. See collision in the Static Mesh Editor (Show > Simple Collision) and in the level (View Mode > Player Collision).\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Break it, fix it: the tutor tells me one export setting it has secretly 'broken'; I guess which from a description of the result, then fix it.\n4. Do-along on today's build (the bin: the drawing and the first model (in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - In bin_day4.blend, click SM_Bin and Shift+click its UCX boxes. File > Export > FBX (.fbx).\n   - In the export window: under Include, tick Limit to > Selected Objects and pick only Mesh in Object Types; under Transform, set Apply Scalings to FBX All; under Geometry, tick Apply Modifiers and set Smoothing to Face; set Path Mode to Copy and turn on Embed Textures (the small button beside it). Name the file SM_Bin.fbx and export it to today's Work folder.\n   - In IslandCourse, make the folder Course/Day04 and drag SM_Bin.fbx into it. The import window opens. Type collision in its search box: keep Collision and Import Collision According To Mesh Name ticked (they read your UCX boxes), and set Fallback Collision Type to None, so Unreal adds no shape of its own. (Older versions show one tick box called Generate Missing Collision instead: untick it.) If your window looks different, send the tutor a screenshot. Click Import.\n   - Double-click the bin mesh: the Static Mesh Editor (a window that shows one mesh and its settings) opens. Read Triangles and Approx Size (in centimetres) at the top left of its viewport. Click Show > Simple Collision: your boxes appear as green lines.\n   - If grey boxes show as visible parts instead, a name is wrong: fix it in Blender and export again with the same file name.\n   - Drag the bin into the level beside the mannequin and press End. Click the View Mode button at the top of the level viewport (it says Lit) and choose Player Collision (it may sit under Collision). Take a screenshot, then switch back to Lit.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"The Perfect Blender to Game Engine Export Workflow (4 QA Checks)\" by GPolygon Design: https://www.youtube.com/watch?v=2iZIAlqnGEw\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "bin_front.kra and bin_front.png (your measured elevation)", "uk": "bin_front.kra і bin_front.png (твій обмірний вид спереду)"}, {"en": "bin_sizes.md (sizes, triangles and sources)", "uk": "bin_sizes.md (розміри, трикутники й джерела)"}, {"en": "bin_day4.blend (your working file)", "uk": "bin_day4.blend (твій робочий файл)"}, {"en": "SM_Bin.fbx and SM_Bollard.fbx (with their UCX boxes)", "uk": "SM_Bin.fbx і SM_Bollard.fbx (з їхніми блоками UCX)"}, {"en": "unreal_collision.png (both props in View Mode > Player Collision)", "uk": "unreal_collision.png (обидва пропси у View Mode > Player Collision)"}, {"en": "before_after_day4.png (your drawing beside the same front view of the model)", "uk": "before_after_day4.png (твоє креслення поруч із тим самим видом моделі спереду)"}, {"en": "clip_day4.mp4 (60 seconds)", "uk": "clip_day4.mp4 (60 секунд)"}, {"en": "summary.md", "uk": "summary.md"}], "goal": {"en": "By the end of today you have a measured drawing of a litter bin in Krita, SM_Bin modelled over it, and a clean FBX with collision boxes that stands at the right size in Unreal.", "uk": "До кінця дня в тебе є обмірне креслення урни в Krita, змодельована за ним SM_Bin і чистий FBX із блоками колізії, який стоїть у правильному розмірі в Unreal."}, "uses": [{"en": "Day 3: modifiers (Bevel and Solidify) and applying a stack", "uk": "День 3: модифікатори (Bevel і Solidify) і застосування стеку"}, {"en": "Day 2: loop cuts, extrude and inset", "uk": "День 2: петлеві розрізи, extrude та inset"}, {"en": "Day 1: SM_Bollard, real size, the origin at the base and applied transforms", "uk": "День 1: SM_Bollard, реальний розмір, origin в основі та застосовані трансформації"}, {"en": "Day 0: Krita installed, and importing into IslandCourse", "uk": "День 0: встановлена Krita та імпорт в IslandCourse"}], "quiz": [{"q": {"en": "After import, grey boxes show around your bin in the level as if they were part of it. What is the likely cause?", "uk": "Після імпорту навколо твоєї урни в рівні видно сірі блоки, ніби вони її частина. Яка ймовірна причина?"}, "options": [{"en": "A UCX box's name doesn't match the bin's object name exactly", "uk": "Назва блока UCX не збігається точно з назвою об'єкта урни"}, {"en": "The bin has too few triangles", "uk": "В урни замало трикутників"}, {"en": "Fallback Collision Type was set to None", "uk": "Fallback Collision Type встановлено на None"}, {"en": "The origin is at the base", "uk": "Origin в основі"}], "answer": 0, "explain": {"en": "Unreal turns a box into collision only when its name is UCX_ plus the exact visible mesh name. Otherwise it is drawn like any other part.", "uk": "Unreal перетворює блок на колізію лише тоді, коли його назва — це UCX_ плюс точна назва видимої сітки. Інакше він малюється як звичайна частина."}}, {"q": {"en": "Your Krita canvas is 1200 x 1200 px at 1 px = 1 mm. How big is it in real life?", "uk": "Твоє полотно в Krita — 1200 x 1200 px при 1 px = 1 мм. Який його розмір у реальному житті?"}, "options": [{"en": "12 x 12 cm", "uk": "12 x 12 см"}, {"en": "1.2 x 1.2 m", "uk": "1.2 x 1.2 м"}, {"en": "12 x 12 m", "uk": "12 x 12 м"}], "answer": 1, "explain": {"en": "1200 px at 1 mm each is 1200 mm, which is 1.2 m.", "uk": "1200 px по 1 мм кожен — це 1200 мм, тобто 1.2 м."}}, {"q": {"en": "Your reference image's drawn ground line sits 0.5 m below Blender's grid. What do you change?", "uk": "Накреслена лінія землі на твоєму референсному зображенні лежить на 0.5 м нижче сітки Blender. Що змінити?"}, "options": [{"en": "The image's Size", "uk": "Size зображення"}, {"en": "The Unit Scale", "uk": "Unit Scale"}, {"en": "The image's Location Z, up by 0.5 m", "uk": "Location Z зображення: підняти на 0.5 м"}], "answer": 2, "explain": {"en": "The Size sets how big the drawing is; the Location moves it. Move it up until the ground line is on Z = 0.", "uk": "Size задає, наскільки велике креслення; Location переміщує його. Піднімай зображення, доки лінія землі не опиниться на Z = 0."}}, {"q": {"en": "Why is collision a few simple boxes instead of the full detailed model?", "uk": "Чому колізія — це кілька простих блоків, а не повна детальна модель?"}, "options": [{"en": "Boxes look better", "uk": "Блоки виглядають краще"}, {"en": "Unreal can't import round shapes", "uk": "Unreal не може імпортувати круглі форми"}, {"en": "The game checks simple shapes much faster, and nobody sees collision", "uk": "Гра перевіряє прості форми набагато швидше, а колізію ніхто не бачить"}], "answer": 2, "explain": {"en": "Collision is invisible and checked every frame, so simple convex shapes keep the game fast.", "uk": "Колізія невидима й перевіряється щокадру, тож прості опуклі форми зберігають гру швидкою."}}, {"q": {"en": "In the Static Mesh Editor your bin's Approx Size reads 50 x 50 x 9000. What went wrong?", "uk": "У Static Mesh Editor Approx Size твоєї урни показує 50 x 50 x 9000. Що пішло не так?"}, "options": [{"en": "The bin has no material", "uk": "В урни немає матеріалу"}, {"en": "The scale was not applied in Blender, or Apply Scalings was not FBX All", "uk": "У Blender не застосовано масштаб, або Apply Scalings не було встановлено на FBX All"}, {"en": "The UCX boxes are too small", "uk": "Блоки UCX замалі"}], "answer": 1, "explain": {"en": "9000 cm is 90 m. A size that is far too big or small points to scale: apply the scale and check the export settings.", "uk": "9000 см — це 90 м. Розмір, набагато більший або менший, ніж треба, вказує на масштаб: застосуй масштаб і перевір налаштування експорту."}}], "weekInfo": {"week": 1, "title": {"en": "Blender from zero: props at real size", "uk": "Blender з нуля: пропси в реальному розмірі"}, "goal": {"en": "By Friday you have a street-prop set (bollard, bench, lamp post and bin) that you modelled yourself from real photos, exported clean with collision and simple materials, standing at real scale in Unreal.", "uk": "До п'ятниці в тебе є набір вуличних пропсів (стовпчик, лавка, ліхтарний стовп і урна), змодельований власноруч за справжніми фото, чисто експортований із колізією та простими матеріалами, і він стоїть в Unreal у реальному масштабі."}, "skills": [{"en": "3D modelling in Blender from measured photos and drawings", "uk": "3D-моделювання в Blender за обмірними фото й кресленнями"}, {"en": "Hard-surface modelling with Edit Mode tools and modifiers (extrude, inset, loop cut, Array, Mirror, Bevel, Solidify)", "uk": "Hard-surface моделювання (тверді поверхні) інструментами Edit Mode і модифікаторами (extrude, inset, loop cut, Array, Mirror, Bevel, Solidify)"}, {"en": "Game-ready export: real-world scale, pivots, applied transforms, UCX collision and FBX", "uk": "Експорт, готовий до гри: реальний масштаб, півоти, застосовані трансформації, колізія UCX і FBX"}, {"en": "Measured elevation drawings in Krita", "uk": "Обмірні креслення (вид спереду й збоку) у Krita"}, {"en": "Props to a triangle budget with industry naming (SM_, M_, UCX_)", "uk": "Пропси в межах бюджету трикутників і з галузевими назвами (SM_, M_, UCX_)"}]}, "morning": {"sofar": {"en": "You own three real-size props now, the bollard, the bench and the lamp post, plus a railing built with modifiers.", "uk": "Тепер у тебе три пропси справжнього розміру — стовпчик, лава й ліхтарний стовп, — а ще поруччя, зібране модифікаторами."}, "today": {"en": "You draw a litter bin to measure in Krita, model SM_Bin over the drawing, and export it as a clean FBX with collision boxes.", "uk": "Сьогодні ти малюєш урну з розмірами в Krita, моделюєш SM_Bin поверх малюнка й експортуєш її як чистий FBX із колізійними боксами."}, "cheer": {"en": "A clean export is the first thing a studio checks, and you are building that habit in week one; follow the checklist calmly, line by line.", "uk": "Чистий експорт — перше, що перевіряє студія, і ти виробляєш цю звичку вже на першому тижні; іди за чеклистом спокійно, рядок за рядком."}, "quote": {"text": {"en": "In the elder days of Art, builders wrought with greatest care each minute and unseen part.", "uk": "У давні дні Мистецтва будівничі з найбільшою дбайливістю творили кожну дрібну й невидиму частину."}, "author": {"en": "Henry Wadsworth Longfellow", "uk": "Генрі Водсворт Лонгфелло"}, "source": "https://en.wikiquote.org/wiki/Henry_Wadsworth_Longfellow"}}, "hasAssets": false, "workPath": "Work\\Assignment\\Day-04-drawings-and-bin", "mapHref": "../../COURSE.html", "prevHref": "../Day-03-railing-and-lamp-post/START-HERE.html", "nextHref": "../Day-05-boss-street-props/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Krita, Blender and Unreal Engine 5.8. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me and don't write code. Keep me moving and make it feel like a game.\n\nToday I build on my own: SM_Bin finished and exported clean, plus the bollard's clean FBX, on your own.\nIt's part of: SM_Bin: a street litter bin, drawn to measure in Krita, then exported clean for Unreal with collision (Beside benches and at corners of your island's waterfront (district 1). Today it stands in Course/Day04 beside the bollard and the mannequin.).\n\nSpec:\n- bin_front.png and bin_front.kra: a front elevation drawn in Krita at 1 px = 1 mm on a 100 px grid, with a ground line and dimension lines in millimetres on their own layer.\n- Real size from your photos: many street bins are about 0.8 to 1.0 m tall and 0.4 to 0.6 m wide; the sizes are in bin_sizes.md.\n- Modelled over the drawing, used as a reference image at exact scale: a body, an opening at the top (inset and extrude), a rim or lid, and a post or base.\n- One object SM_Bin, origin at the base centre on Z = 0, all transforms applied, 3,000 triangles or fewer.\n- Collision: one to three simple boxes, each a separate object named UCX_SM_Bin_00, _01 and so on, with the bin's origin.\n- SM_Bin.fbx exported with the course's FBX settings; in Unreal (Course/Day04), imported with Fallback Collision Type set to None (so Unreal adds no collision shape of its own), standing on the floor at the right size, with the collision visible in Player Collision view.\n- The bollard exported the same way: SM_Bollard.fbx with its UCX box.\n\nMy checklist:\n1. Find three Commons photos of a present-day street litter bin; save them in refs and credit them in credits.md. Check: three photos, each with a line in credits.md. (from day 1, lesson 2)\n2. Work out the bin's height, width, opening and post or base sizes from a known size in the photos, and write them in bin_sizes.md. Check: at least four sizes, each with its photo. (from day 1, lesson 2)\n3. Finish bin_front.kra in Krita: ground line, body, rim or lid, opening and post or base, all to size on the grid, with every main size on the dims layer. Export bin_front.png. Check: the drawn height in grid squares matches bin_sizes.md (one square = 10 cm). (from lesson 1)\n4. In bin_day4.blend, place bin_front.png as a reference image: Size 1.2 m and the ground line on Z = 0. Check: the Measure tool from the drawn ground line to the drawn top reads your height. (from lesson 2)\n5. Body and opening: a cylinder (Vertices 24) sized to the drawing, sat on Z = 0; inset the top face and extrude the inner face down to make the opening. Check: from above (Numpad 7) you see a rim and a hole going down. (from lesson 2)\n6. Rim or lid: extrude the rim's border out a little or add a slightly wider flat cylinder on top, as your drawing shows. Add a Bevel modifier (about 0.005 m, 2 segments) to the hard edges. Check: the rim's outline matches the drawing in the front view. (from day 3, lesson 3)\n7. Post or base: add it from simple shapes at the drawn sizes. Check: no gap between the post or base and the body from the front or the side. (from day 1, lesson 3)\n8. Apply all modifiers, join the parts (Ctrl+J), name the object SM_Bin, set the origin at the base centre on Z = 0 and apply all transforms. Check: Location 0, 0, 0, Rotation 0, Scale 1, and 3,000 triangles or fewer. (from day 1, lesson 4)\n9. Collision: one box around the body and one around the post or base, named UCX_SM_Bin_00 and _01, each with the bin's origin and its transforms applied. Check: in X-ray, each box wraps its part closely and both names start with UCX_SM_Bin_. (from lesson 3)\n10. Export SM_Bin.fbx with the bin and its UCX boxes selected, using the course's FBX settings. Check: the file is in today's Work folder. (from lesson 4)\n11. Open bollard_day1.blend: add one box UCX_SM_Bollard_00 around the body, give it the bollard's origin, and export SM_Bollard.fbx the same way. Check: the export window showed Selected Objects ticked and only Mesh chosen. (from lesson 4)\n12. Import both FBX files into Course/Day04 with the collision settings from lesson 4 (Fallback Collision Type: None). Open each in the Static Mesh Editor: read Triangles and Approx Size, and turn on Show > Simple Collision. Check: Approx Size matches your sizes in centimetres (a 0.9 m bin reads about 90), and the boxes show as green lines. (from lesson 4)\n13. Place both in the level beside the mannequin with End and take unreal_collision.png in View Mode > Player Collision. Check: you see simple boxes, not the full shapes. (from lesson 4)\n14. Captures. First before_after_day4.png: open bin_front.png, press Win+Left, click Blender (front orthographic view, reference image hidden) and press Win+Right, then press Win+Shift+S and capture the whole screen. Then clip_day4.mp4, about 60 seconds: orbit the bin in Blender, then walk the mannequin into it in Unreal (it should stop, not pass through). Win+Alt+R records only one program window, so for a clip that moves between Blender and Unreal open Snipping Tool, click Record and drag a box over the whole screen. Rename the clip clip_day4.mp4. Check: both files are in today's Work folder. (from day 0, lesson 1)\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Anna\nDay 4: Measured drawings and the clean game export: the litter bin. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

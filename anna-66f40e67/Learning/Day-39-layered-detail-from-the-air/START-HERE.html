<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 39</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}

/* the Done switch */
.sw{display:inline-flex;align-items:center;gap:12px;border:0;background:transparent;cursor:pointer;font:600 14px/1 var(--head);color:var(--muted);min-height:50px;padding:0 6px}

details{margin-top:22px;border-radius:20px;background:var(--well);box-shadow:var(--press);padding:0 18px}

.m1{--mg:rgba(190,200,215,.7)}.m1 i{background:linear-gradient(135deg,#f3f6fa,#9aa5b3)}
.m2{--mg:rgba(245,195,91,.75)}.m2 i{background:linear-gradient(135deg,#ffe08a,#c99412)}

.check input::after{content:"";width:10px;height:5px;border:solid #fff;border-width:0 0 2.2px 2.2px;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.check input:checked{background:linear-gradient(145deg,#5fe39a,#16a34a);box-shadow:0 0 12px rgba(74,222,128,.55)}

.check .ln{font:600 10.5px/1.3 var(--head);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);white-space:nowrap;margin-top:5px;padding:4px 9px;border-radius:999px;background:var(--well);box-shadow:var(--press)}

.opt.right{box-shadow:var(--press);background:var(--okBg);border-color:rgba(74,222,128,.45)}.opt.right .lt{background:var(--okL);color:#fff;box-shadow:0 0 10px var(--okL)}.opt.right .mk{color:var(--ok)}

.opt[disabled]{cursor:default}
.opt[disabled]:not(.right):not(.wrong){opacity:.55;box-shadow:none}
.exp{margin:10px 0 0 50px;font-size:15.5px;color:var(--muted)}

.score{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:32px;padding:18px 20px;border-radius:24px}

.score .row{margin:0 0 0 auto}
/* ship */
.path{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;margin:22px 0 12px}

.clip{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}

#toast{position:fixed;left:50%;bottom:28px;z-index:9;transform:translateX(-50%) translateY(16px);background:rgba(30,33,46,.82);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:#f4f5fa;border:1px solid rgba(255,255,255,.14);padding:13px 24px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none;font:600 14px/1.4 var(--head);max-width:min(92vw,560px);text-align:center;box-shadow:0 20px 40px -14px rgba(0,0,0,.5),0 0 24px var(--glow)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

 body{font-size:16.5px}

<script id="data" type="application/json">{"learner": "ib-anna-66f40e67", "learnerName": {"en": "Anna", "uk": "Анна"}, "day": 39, "week": 8, "total": 60, "title": {"en": "Layered detail: rocks, ground cover and the shoreline, read from the air", "uk": "Шари деталей: каміння, ґрунтовий покрив і берегова лінія, прочитані з повітря"}, "theme": {"en": "Week 8: PCG nature for the whole island", "uk": "Тиждень 8: PCG-природа для всього острова"}, "build": {"item": {"en": "Three detail layers by PCG: rocks on slopes, ground cover that fades with distance, and a shoreline scatter that runs round the whole island in a partitioned volume; each read from 100 m, 30 m and 5 m", "uk": "Три шари деталей через PCG: каміння на схилах, ґрунтовий покрив, що зникає з відстанню, і розкидання вздовж берегової лінії довкола всього острова у volume з розбиттям на комірки; кожен шар прочитаний зі 100 м, 30 м і 5 м"}, "why": {"en": "Real land is layered: tree tops, shrubs, ground cover, rocks and debris, and each layer is read from a different distance. Detail placed where the eye goes (along routes, at vistas, on the coast) makes a world feel rich, and detail that fades with distance keeps it running on a 16 GB PC. The shoreline is the island's outline from the air: a ragged line of stones at the water's edge is what makes a coast read as real.", "uk": "Справжня земля складається з шарів: верхівки дерев, кущі, ґрунтовий покрив, каміння й дрібні рештки, і кожен шар читається з іншої відстані. Деталі там, куди йде погляд (уздовж маршрутів, на панорамах, на узбережжі), роблять світ багатим, а деталі, що зникають з відстанню, дають йому працювати на ПК з 16 ГБ. Берегова лінія — це контур острова з повітря: рвана лінія каміння біля краю води — саме те, що робить берег справжнім."}, "where": {"en": "L_Island: the transect for rocks and ground cover; the whole coastline for the shoreline scatter.", "uk": "L_Island: трансекта — для каміння й ґрунтового покриву; уся берегова лінія — для берегового розкидання."}, "spec": [{"en": "detail_plan.md: the five layers (canopy, shrubs, ground cover, rocks, debris), what you can see of each from 100 m, 30 m and 5 m, and where detail goes first (the scenic route, your vistas, the coast, district edges).", "uk": "detail_plan.md: п'ять шарів (верхній ярус, кущі, ґрунтовий покрив, каміння, дрібні рештки), що видно з кожного зі 100 м, 30 м і 5 м і куди деталі йдуть насамперед (мальовничий маршрут, твої панорами, узбережжя, краї районів)."}, {"en": "PCG_Rocks: rocks on slopes of about 15 to 40 degrees, in clusters (noise), spaced with Self Pruning, sunk 20 to 40 % of their height and tilted a little; plus a rare boulder chain on gentle ground.", "uk": "PCG_Rocks: каміння на схилах приблизно 15–40 градусів, групами (шум), з відстанню через Self Pruning, заглиблене на 20–40 % своєї висоти й трохи нахилене; плюс рідкісний ланцюжок валунів на пологому ґрунті."}, {"en": "Ground cover: a chain in each biome graph with grasses and small plants in the gaps between the shrub clumps (about 0.3 points per m², its clumps filter flipped to Lower Bound 0.1 and Upper Bound 0.6), each mesh entry with an Instance End Cull Distance of 6000 to 8000 (60 to 80 m).", "uk": "Ґрунтовий покрив: ланцюжок у кожному графі біому з травами й дрібними рослинами в прогалинах між куртинами кущів (близько 0.3 точки на м², його фільтр куртин перевернутий на Lower Bound 0.1 і Upper Bound 0.6), кожен запис меша з Instance End Cull Distance від 6000 до 8000 (60–80 м)."}, {"en": "PCG_Shoreline: points in a band from 50 cm below to 200 cm above sea level; pebbles and small rocks on gentle shore, boulders on steep shore; one PCG Volume over the whole island with Is Partitioned ticked.", "uk": "PCG_Shoreline: точки в смузі від 50 см нижче до 200 см вище рівня моря; галька й дрібне каміння на пологому березі, валуни на крутому березі; один PCG Volume над усім островом з увімкненим Is Partitioned."}, {"en": "Every new layer keeps the Day 38 keep-outs and grounding; pebbles and small rocks also fade out at 50 to 80 m; everything on DL_Detail.", "uk": "Кожен новий шар зберігає зони-винятки й посадку на ґрунт з Дня 38; галька й дрібне каміння теж зникають на 50–80 м; усе на DL_Detail."}, {"en": "stat unit before and after the detail at the transect's 100 m bookmark; memory under about 14 GB in Task Manager.", "uk": "stat unit до й після деталей на закладці 100 м над трансектою; пам'ять у Task Manager нижче приблизно 14 ГБ."}], "piece1": "the rock layer on the transect", "piece2": {"en": "Ground cover and the island-wide shoreline, on your own", "uk": "Ґрунтовий покрив і берегова лінія на весь острів, самостійно"}, "steps": [{"text": {"en": "Write detail_plan.md: the five layers, what reads from each height, and where detail goes first. Check: one table and three priority places.", "uk": "Напиши detail_plan.md: п'ять шарів, що читається з кожної висоти й куди деталі йдуть насамперед. Перевірка: одна таблиця й три пріоритетні місця."}, "lesson": 1}, {"text": {"en": "At the transect's 100 m bookmark take a 'before' screenshot and read stat unit. Check: the 'before' GPU number is in detail_plan.md.", "uk": "На закладці 100 м над трансектою зроби скріншот «до» й зчитай stat unit. Перевірка: число GPU «до» є в detail_plan.md."}, "lesson": "D32.2"}, {"text": {"en": "Build PCG_Rocks: slope band, noise clusters, Self Pruning and a spawner with 3 rock meshes, in a volume over the transect. Check: rocks gather in groups on slopes, with none on flat beaches.", "uk": "Збудуй PCG_Rocks: смуга схилів, групи через шум, Self Pruning і спавнер із 3 мешами каменів, у volume над трансектою. Перевірка: каміння збирається групами на схилах, і жодного каменя немає на рівних пляжах."}, "lesson": 2}, {"text": {"en": "Sink and tilt the rocks and add the rare boulder chain. Check: from 5 m every rock looks settled, with a third or more of it buried.", "uk": "Заглиб і нахили каміння й додай рідкісний ланцюжок валунів. Перевірка: з 5 м кожен камінь виглядає стійко, закопаний на третину або більше."}, "lesson": 2}, {"text": {"en": "Check that PCG_Rocks kept the three keep-out branches it copied from your biome graph, wire them into the boulder chain's Difference too, and put its volume on DL_Detail. Check: no rock sits on a road, in a district or in the corridor.", "uk": "Перевір, що PCG_Rocks зберіг три гілки зон-винятків, скопійовані з графа біому, з'єднай їх і з Difference ланцюжка валунів і постав його volume на DL_Detail. Перевірка: жоден камінь не лежить на дорозі, у районі чи в коридорі."}, "lesson": "D38.1"}, {"text": {"en": "First bookmark a low view of that 200 m of coast (Ctrl+5) and take coast_before.png. Then build PCG_Shoreline: the waterline band, a gentle chain (pebbles, small rocks) and a steep chain (boulders), first in a test volume over 200 m of coast. Check: a ragged line of stones follows the water's edge.", "uk": "Спершу збережи закладку низького виду на ці 200 м берега (Ctrl+5) і зроби coast_before.png. Потім збудуй PCG_Shoreline: смуга біля лінії води, пологий ланцюжок (галька, дрібне каміння) і крутий ланцюжок (валуни), спершу в тестовому volume над 200 м берега. Перевірка: рвана лінія каміння йде вздовж краю води."}, "lesson": 3}, {"text": {"en": "Add a ground-cover chain to each biome graph with grasses and small plants. Check: from 5 m the ground between shrubs is covered, with some bare patches.", "uk": "Додай до кожного графа біому ланцюжок ґрунтового покриву з травами й дрібними рослинами. Перевірка: з 5 м ґрунт між кущами вкритий, з кількома голими плямами."}, "lesson": 4}, {"text": {"en": "Set Instance End Cull Distance on the ground cover, the pebbles and the small rocks. Check: flying up from 5 m, small things fade out by about 80 m with no hard line.", "uk": "Встанови Instance End Cull Distance для ґрунтового покриву, гальки й дрібного каміння. Перевірка: коли піднімаєшся з 5 м, дрібні речі зникають приблизно до 80 м без різкої лінії."}, "lesson": 4}, {"text": {"en": "Load the whole island, place one PCG Volume over all of it for PCG_Shoreline, tick Is Partitioned and Generate (if memory passes about 14 GB, close other programs and Generate again). Check: the whole coast has a stone line, and memory stays under about 14 GB.", "uk": "Завантаж увесь острів, постав один PCG Volume над ним усім для PCG_Shoreline, увімкни Is Partitioned і запусти Generate (якщо пам'ять перевищує приблизно 14 ГБ, закрий інші програми й знову запусти Generate). Перевірка: уздовж усього берега є лінія каміння, а пам'ять лишається нижче приблизно 14 ГБ."}, "lesson": 4}, {"text": {"en": "The three-height read: 100 m, 30 m and 5 m on the transect and on two stretches of coast; fix the worst fault at each height. Check: detail_read.png shows the three heights.", "uk": "Читання з трьох висот: 100 м, 30 м і 5 м на трансекті й на двох ділянках узбережжя; виправ найгіршу ваду на кожній висоті. Перевірка: detail_read.png показує три висоти."}, "lesson": 1}, {"text": {"en": "Footprint test on the new layers (rocks, boulders, shoreline). Check: each is under 1 in 20 floating in footprint_test.md.", "uk": "Тест опори для нових шарів (каміння, валуни, берегова лінія). Перевірка: у footprint_test.md кожен має менше 1 з 20 висячих."}, "lesson": "D38.4"}, {"text": {"en": "Read stat unit again at the same bookmark. Check: both numbers are written; if GPU rose more than 3 ms, you thinned the ground cover and noted it.", "uk": "Знову зчитай stat unit на тій самій закладці. Перевірка: обидва числа записані; якщо GPU зріс більше ніж на 3 мс, ґрунтовий покрив проріджено й це записано."}, "lesson": "D32.2"}, {"text": {"en": "Before/after capture: coast_before.png beside the same bookmark (press 5) after the shoreline scatter; then a 60-second clip along the coast in Play. Check that you also have pcg_rocks.png, pcg_shoreline.png and shoreline_whole.png (each is described in today's hand-in list; take any you are missing now). Check: before_after_day39.png and flythrough_day39.mp4 are saved.", "uk": "Знімок до/після: coast_before.png поруч із видом з тієї самої закладки (натисни 5) після берегового розкидання; потім 60-секундне відео вздовж узбережжя в Play. Перевір, що в тебе також є pcg_rocks.png, pcg_shoreline.png і shoreline_whole.png (кожен описаний у сьогоднішньому списку «Здати роботу»; зроби зараз ті, яких бракує). Перевірка: before_after_day39.png і flythrough_day39.mp4 збережені."}, "lesson": "D33.2"}], "assets": ["island12/free-packs-list.md"]}, "lessons": [{"title": {"en": "Layers of nature and the distance they are read from", "uk": "Шари природи й відстань, з якої їх читають"}, "minutes": 40, "goals": [{"en": "Name the five layers of natural ground: canopy (tree tops), shrubs, ground cover (grasses and small plants), rocks, and debris (fallen wood, pebbles).", "uk": "Назвати п'ять шарів природного ґрунту: верхній ярус (верхівки дерев), кущі, ґрунтовий покрив (трави й дрібні рослини), каміння й дрібні рештки (повалена деревина, галька)."}, {"en": "Explain read distance: from 100 m you see canopy, colour and the coastline; from 30 m shrubs and rocks; from 5 m the ground itself. So from far away, the landscape material carries the ground cover, not meshes.", "uk": "Пояснити відстань читання: зі 100 м видно верхній ярус, колір і берегову лінію; з 30 м — кущі й каміння; з 5 м — сам ґрунт. Тож здалеку ґрунтовий покрив передає матеріал ландшафту, а не меші."}, {"en": "Plan detail where the eye goes: the scenic route, the vistas, the coast and the edges of the districts.", "uk": "Планувати деталі там, куди йде погляд: мальовничий маршрут, панорами, узбережжя й краї районів."}], "doalong": [{"en": "Open one reference photo of wild ground from your place in Krita; on a new layer, outline the five layers in five colours. You see which layers cover most of the picture.", "uk": "Відкрий у Krita одне референсне фото дикої місцевості твого місця; на новому шарі обведи п'ять шарів п'ятьма кольорами. Ти бачиш, які шари займають більшу частину картинки."}, {"en": "Fly to your 100 m transect bookmark, then 30 m, then 5 m; at each height write what you can really see. You see a short list for each height.", "uk": "Підлети до закладки 100 м над трансектою, потім на 30 м, потім на 5 м; на кожній висоті запиши, що справді видно. Ти бачиш короткий список для кожної висоти."}, {"en": "On biome_map.png mark where detail matters first: the scenic route, your three vistas, the coast and the district edges. You see three priority places.", "uk": "На biome_map.png познач, де деталі важливі насамперед: мальовничий маршрут, три твої панорами, узбережжя й краї районів. Ти бачиш три пріоритетні місця."}, {"en": "Write detail_plan.md: a table of layers against heights, and the priority places. You see one finished plan.", "uk": "Напиши detail_plan.md: таблиця шарів проти висот і пріоритетні місця. Ти бачиш один готовий план."}], "play": {"en": "Height guess: the tutor names ten things (a pebble, a pine crown, a fern, a boulder, a driftwood log...); I give the height from which a viewer first notices each.", "uk": "Вгадай висоту: тьютор називає десять речей (камінчик, крона сосни, папороть, валун, колода, викинута морем...); я називаю висоту, з якої глядач уперше помічає кожну."}, "video": {"url": "https://www.youtube.com/watch?v=YZ4gSKZh6do", "title": "How I Quickly Create 3D Environments in Unreal Engine 5 / FULL WORKFLOW", "channel": "pwnisher", "length": "22:30", "search": "unreal engine 5 set dressing environment"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Layers of nature and the distance they are read from (Day 39, lesson 1 of 4).\nToday's build: Three detail layers by PCG: rocks on slopes, ground cover that fades with distance, and a shoreline scatter that runs round the whole island in a partitioned volume; each read from 100 m, 30 m and 5 m.\n\nBy the end of this lesson I can:\n1. Name the five layers of natural ground: canopy (tree tops), shrubs, ground cover (grasses and small plants), rocks, and debris (fallen wood, pebbles).\n2. Explain read distance: from 100 m you see canopy, colour and the coastline; from 30 m shrubs and rocks; from 5 m the ground itself. So from far away, the landscape material carries the ground cover, not meshes.\n3. Plan detail where the eye goes: the scenic route, the vistas, the coast and the edges of the districts.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (Your biomes stay off roads, water, districts and the flight corridor, and your footprint test shows nothing floating.), what I will learn today (You add rocks, ground cover and a shoreline scatter by PCG, and check every layer from 100 m, 30 m and 5 m.), encourage me (Layers build up quietly, so add one, look from three heights, and watch your island get richer each time.), and share today's quote: \"There are some enterprises in which a careful disorderliness is the true method.\" (Herman Melville).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 36: which two nodes together make clumps and gaps? | Day 32: what does haze tell a viewer about distance?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Height guess: the tutor names ten things (a pebble, a pine crown, a fern, a boulder, a driftwood log...); I give the height from which a viewer first notices each.\n6. Do-along on today's build (the rock layer on the transect): guide me through these steps one at a time, checking a screenshot after each:\n   - Open one reference photo of wild ground from your place in Krita; on a new layer, outline the five layers in five colours. You see which layers cover most of the picture.\n   - Fly to your 100 m transect bookmark, then 30 m, then 5 m; at each height write what you can really see. You see a short list for each height.\n   - On biome_map.png mark where detail matters first: the scenic route, your three vistas, the coast and the district edges. You see three priority places.\n   - Write detail_plan.md: a table of layers against heights, and the priority places. You see one finished plan.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"How I Quickly Create 3D Environments in Unreal Engine 5 / FULL WORKFLOW\" by pwnisher: https://www.youtube.com/watch?v=YZ4gSKZh6do\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Rocks by rule", "uk": "Каміння за правилами"}, "minutes": 40, "goals": [{"en": "Place rocks as nature does: in groups on slopes and at the foot of steep ground, half-buried, never sitting on flat beaches or in rows.", "uk": "Розставляти каміння, як це робить природа: групами на схилах і біля підніжжя крутого ґрунту, напівзакопане, ніколи не на рівних пляжах і не рядами."}, {"en": "Use a slope band: keep points between two slopes with a Density Filter's Lower Bound and Upper Bound (0.77 to 0.97 is about 15 to 40 degrees).", "uk": "Використовувати смугу схилів: залишати точки між двома схилами через Lower Bound і Upper Bound у Density Filter (0.77–0.97 — це приблизно 15–40 градусів)."}, {"en": "Settle rocks: sink them 20 to 40 % of their height and tilt them a little at random.", "uk": "Додати камінню стійкості: заглибити його на 20–40 % висоти й трохи випадково нахилити."}], "doalong": [{"en": "Duplicate your first biome graph and name it PCG_Rocks; delete any tree chain, and set the spawner's Mesh Entries to 3 rock meshes (your migrated rocks or a free rock pack). You see a graph that spawns rocks.", "uk": "Продублюй свій перший граф біому й назви його PCG_Rocks; видали ланцюжок дерев, якщо він є, і задай у Mesh Entries спавнера 3 меші каменів (перенесене каміння або безкоштовний пак каміння). Ти бачиш граф, який ставить каміння."}, {"en": "Set the slope Density Filter to Lower Bound 0.77 and Upper Bound 0.97, and the height band from 100 cm to your summit. You see the points only on slopes.", "uk": "Встанови для Density Filter схилу Lower Bound 0.77 і Upper Bound 0.97, а смугу висот — від 100 см до вершини. Ти бачиш точки лише на схилах."}, {"en": "Set the Surface Sampler to Points Per Squared Meter 0.02 and Point Extents 150; keep the Spatial Noise for groups; drag a volume over the transect and Generate. You see rocks in clusters with open ground between.", "uk": "Встанови для Surface Sampler Points Per Squared Meter 0.02 і Point Extents 150; залиш Spatial Noise для груп; перетягни volume на трансекту й запусти Generate. Ти бачиш каміння групами з відкритим ґрунтом між ними."}, {"en": "In Transform Points leave Absolute Rotation unticked (rocks follow the slope), set Rotation Min X and Y to -10 and Max X and Y to 10, Rotation Max Z 360, Offset Min Z -60 and Offset Max Z -30. You see rocks tilted a little and sunk.", "uk": "У Transform Points залиш Absolute Rotation вимкненим (каміння йде за схилом), встанови Rotation Min X і Y на -10, Max X і Y на 10, Rotation Max Z 360, Offset Min Z -60 і Offset Max Z -30. Ти бачиш трохи нахилене й заглиблене каміння."}, {"en": "Copy the chain from its Surface Sampler to its spawner for rare boulders, and wire Get Landscape Data into the copy, the three keep-out Bounds Modifiers into the copy's Difference and the copy's spawner into Output. Set Points Per Squared Meter 0.001, slope Lower Bound 0.94 and Upper Bound 1 (gentle ground), one big rock, Scale 1.5 to 2.5. Generate. You see a few lone boulders in the grass.", "uk": "Скопіюй ланцюжок від його Surface Sampler до спавнера для рідкісних валунів і з'єднай Get Landscape Data з копією, три Bounds Modifier зон-винятків — з Difference копії, а спавнер копії — з Output. Встанови Points Per Squared Meter 0.001, Lower Bound схилу 0.94 і Upper Bound 1 (пологий ґрунт), один великий камінь, Scale від 1.5 до 2.5. Запусти Generate. Ти бачиш кілька самотніх валунів у траві."}], "play": {"en": "Rock referee: I describe my rock groups from 30 m; the tutor hunts for floating rocks, repeated neighbours and straight lines, and each find costs a point until I fix it.", "uk": "Суддя каміння: я описую свої групи каміння з 30 м; тьютор шукає камені, що висять, однакових сусідів і прямі лінії, і кожна знахідка коштує бал, поки я її не виправлю."}, "video": {"search": "unreal engine pcg rocks scatter slope"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Rocks by rule (Day 39, lesson 2 of 4).\nToday's build: Three detail layers by PCG: rocks on slopes, ground cover that fades with distance, and a shoreline scatter that runs round the whole island in a partitioned volume; each read from 100 m, 30 m and 5 m.\nEarlier today I already did: lesson 1 (Layers of nature and the distance they are read from). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Place rocks as nature does: in groups on slopes and at the foot of steep ground, half-buried, never sitting on flat beaches or in rows.\n2. Use a slope band: keep points between two slopes with a Density Filter's Lower Bound and Upper Bound (0.77 to 0.97 is about 15 to 40 degrees).\n3. Settle rocks: sink them 20 to 40 % of their height and tilt them a little at random.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Rock referee: I describe my rock groups from 30 m; the tutor hunts for floating rocks, repeated neighbours and straight lines, and each find costs a point until I fix it.\n4. Do-along on today's build (the rock layer on the transect): guide me through these steps one at a time, checking a screenshot after each:\n   - Duplicate your first biome graph and name it PCG_Rocks; delete any tree chain, and set the spawner's Mesh Entries to 3 rock meshes (your migrated rocks or a free rock pack). You see a graph that spawns rocks.\n   - Set the slope Density Filter to Lower Bound 0.77 and Upper Bound 0.97, and the height band from 100 cm to your summit. You see the points only on slopes.\n   - Set the Surface Sampler to Points Per Squared Meter 0.02 and Point Extents 150; keep the Spatial Noise for groups; drag a volume over the transect and Generate. You see rocks in clusters with open ground between.\n   - In Transform Points leave Absolute Rotation unticked (rocks follow the slope), set Rotation Min X and Y to -10 and Max X and Y to 10, Rotation Max Z 360, Offset Min Z -60 and Offset Max Z -30. You see rocks tilted a little and sunk.\n   - Copy the chain from its Surface Sampler to its spawner for rare boulders, and wire Get Landscape Data into the copy, the three keep-out Bounds Modifiers into the copy's Difference and the copy's spawner into Output. Set Points Per Squared Meter 0.001, slope Lower Bound 0.94 and Upper Bound 1 (gentle ground), one big rock, Scale 1.5 to 2.5. Generate. You see a few lone boulders in the grass.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "The shoreline: the island's outline from the air", "uk": "Берегова лінія: контур острова з повітря"}, "minutes": 40, "goals": [{"en": "Read a real shoreline: pebbles and small rocks on gentle beaches, boulders on ity Filter set to Lower Bound 0.1 and Upper Bound 0.6 (so it fills the gaps between your shrub clumps), grasses and small plants as Mesh Entries. Generate. You see the ground between shrubs filled, with some bare patches.\n   - In each ground-cover Mesh Entry open Descriptor and set Instance End Cull Distance to 7000 (70 m); use 5000 for pebbles and 8000 for small rocks. Fly up from 5 m to 100 m. You see small things fade out as you rise.\n   - In the World Partition editor select the whole island and choose Load Region From Selection: the graph can only read the landscape where it is loaded. You see the whole island loaded; if Task Manager passes about 14 GB, close the browser and other programs.\n   - Drag a PCG Volume over the whole island, taller than the summit, and set its Graph to PCG_Shoreline; on its PCG component tick Is Partitioned (on a volume that has already generated, click Cleanup first). You see the setting ticked.\n   - Click Generate and watch Task Manager. You see the stone line appear round the whole coast, cell by cell, with memory under about 14 GB; put the volume on DL_Detail and save.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"How To Load And Unload Foliage In Unreal Engine 5 | Foliage Culling Tutorial\" by Matt Aspland: https://www.youtube.com/watch?v=ut2_prCEg1c\n\nStart now with the first step.\n\nUkrainian grammar: афту"}, {"en": "Day 33: DL_Detail and the World Partition editor", "uk": "День 33: DL_Detail і редактор World Partition"}], "quiz": [{"q": {"en": "From 100 m, what mostly carries the look of the ground cover?", "uk": "Що здебільшого передає вигляд ґрунтового покриву зі 100 м?"}, "options": [{"en": "Millions of grass meshes", "uk": "Мільйони мешів трави"}, {"en": "The landscape material's colours", "uk": "Кольори матеріалу ландшафту"}, {"en": "Decals", "uk": "Декалі"}, {"en": "Fog", "uk": "Туман"}], "answer": 1, "explain": {"en": "From that far, single grasses are smaller than a pixel. The landscape's colours do the work, so meshes can fade out.", "uk": "З такої відстані окремі травинки менші за піксель. Роботу роблять кольори ландшафту, тож меші можуть зникати."}}, {"q": {"en": "Rocks sit on top of a flat beach like dropped eggs. Which fix helps most?", "uk": "Каміння лежить на рівному пляжі, як розкидані яйця. Яке виправлення допоможе найбільше?"}, "options": [{"en": "Sink them 20 to 40 % and keep them on slopes with a slope band", "uk": "Заглибити його на 20–40 % і тримати на схилах через смугу схилів"}, {"en": "Make them bigger and brighter", "uk": "Зробити його більшим і яскравішим"}, {"en": "Turn off Self Pruning", "uk": "Вимкнути Self Pruning"}, {"en": "Turn on Lumen", "uk": "Увімкнути Lumen"}], "answer": 0, "explain": {"en": "Real rocks are partly buried and gather where the ground is steep. Sinking and a slope band settle them.", "uk": "Справжнє каміння частково закопане й збирається там, де ґрунт крутий. Заглиблення й смуга схилів додають йому стійкості."}}, {"q": {"en": "Your shoreline graph places pebbles 30 m up on the cliffs. What is wrong?", "uk": "Твій граф берегової лінії ставить гальку на скелях на висоті 30 м. Що не так?"}, "options": [{"en": "The cull distance is too short", "uk": "Дистанція відсікання закоротка"}, {"en": "Is Partitioned is ticked", "uk": "Увімкнено Is Partitioned"}, {"en": "The height band on $Position.Z is missing or too wide", "uk": "Смуги висот на $Position.Z немає або вона заширока"}, {"en": "The Seed is wrong", "uk": "Неправильний Seed"}], "answer": 2, "explain": {"en": "The shoreline lives in a thin band round sea level, from -50 to 200 cm. Without that band, points spread up the land.", "uk": "Берегова лінія живе в тонкій смузі довкола рівня моря, від -50 до 200 см. Без цієї смуги точки розповзаються вгору по суші."}}, {"q": {"en": "What does Is Partitioned do on a big PCG Volume?", "uk": "Що робить Is Partitioned на великому PCG Volume?"}, "options": [{"en": "Deletes the points outside the volume", "uk": "Видаляє точки поза volume"}, {"en": "Turns the volume into a landscape", "uk": "Перетворює volume на ландшафт"}, {"en": "Doubles the density", "uk": "Подвоює густину"}, {"en": "Splits the work into grid cells that generate and stream like World Partition cells", "uk": "Ділить роботу на комірки сітки, які генеруються й стримляться, як комірки World Partition"}], "answer": 3, "explain": {"en": "Partitioning lets one island-wide volume work in pieces, so memory stays low and far cells can unload.", "uk": "Розбиття на комірки дає одному volume на весь острів працювати частинами, тож пам'ять лишається низькою, а далекі комірки можуть вивантажуватися."}}, {"q": {"en": "Flying up, all your grass vanishes at once in a hard line at 70 m. How do you soften it?", "uk": "Коли ти піднімаєшся, уся трава зникає одночасно різкою лінією на 70 м. Як це пом'якшити?"}, "options": [{"en": "Remove the cull distance", "uk": "Прибрати дистанцію відсікання"}, {"en": "Give each grass mesh a slightly different cull distance, and keep the landscape colour close to the grass colour", "uk": "Дати кожному мешу трави трохи іншу дистанцію відсікання й тримати колір ландшафту близьким до кольору трави"}, {"en": "Turn off the fog", "uk": "Вимкнути туман"}], "answer": 1, "explain": {"en": "Varied distances blur the edge, and a matching ground colour hides the change from grass to bare landscape.", "uk": "Різні відстані розмивають край, а схожий колір ґрунту ховає перехід від трави до голого ландшафту."}}], "weekInfo": {"week": 8, "title": {"en": "PCG nature for the whole island", "uk": "PCG-природа для всього острова"}, "goal": {"en": "By Friday you have your whole island dressed by your own PCG biome rules, layered, with natural transitions, clear keep-outs and nothing floating, reading beautifully from the air.", "uk": "До п'ятниці весь твій острів заповнений природою за твоїми власними правилами біомів PCG: шарами, з природними переходами, чіткими зонами-винятками й без жодного об'єкта в повітрі, і він гарно читається з висоти."}, "skills": [{"en": "PCG biome rules in Unreal Engine 5 (slope, height, noise and spacing)", "uk": "Правила біомів PCG в Unreal Engine 5 (схил, висота, шум і відстань між об'єктами)"}, {"en": "Procedural keep-outs and grounding checks for playable spaces", "uk": "Процедурні зони-винятки й перевірки посадки на ґрунт для ігрових просторів"}, {"en": "Layered foliage and scatter design, read at every distance", "uk": "Шарова рослинність і розкидання об'єктів, що читаються на будь-якій відстані"}, {"en": "Island-scale partitioned PCG generation within a 16 GB memory budget", "uk": "Генерація PCG на весь острів із розбиттям на комірки, у межах бюджету пам'яті 16 ГБ"}]}, "morning": {"sofar": {"en": "Your biomes stay off roads, water, districts and the flight corridor, and your footprint test shows nothing floating.", "uk": "Твої біоми оминають дороги, воду, райони й коридор польоту, а тест опори показує, що ніщо не висить у повітрі."}, "today": {"en": "You add rocks, ground cover and a shoreline scatter by PCG, and check every layer from 100 m, 30 m and 5 m.", "uk": "Сьогодні ти додаєш через PCG каміння, ґрунтовий покрив і розсип уздовж берегової лінії та перевіряєш кожен шар зі 100 м, 30 м і 5 м."}, "cheer": {"en": "Layers build up quietly, so add one, look from three heights, and watch your island get richer each time.", "uk": "Шари накопичуються непомітно, тож додай один, подивись із трьох висот і спостерігай, як твій острів щоразу стає багатшим."}, "quote": {"text": {"en": "There are some enterprises in which a careful disorderliness is the true method.", "uk": "Є справи, у яких справжній метод — це ретельний безлад."}, "author": {"en": "Herman Melville", "uk": "Герман Мелвілл"}, "source": "https://en.wikiquote.org/wiki/Moby-Dick"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-39-layered-detail-from-the-air", "mapHref": "../../COURSE.html", "prevHref": "../Day-38-keep-outs-and-grounding/START-HERE.html", "nextHref": "../Day-40-boss-whole-island-pcg/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8 and Krita. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me and don't write code. Keep me moving and make it feel like a game.\n\nToday I build on my own: Ground cover and the island-wide shoreline, on your own.\nIt's part of: Three detail layers by PCG: rocks on slopes, ground cover that fades with distance, and a shoreline scatter that runs round the whole island in a partitioned volume; each read from 100 m, 30 m and 5 m (L_Island: the transect for rocks and ground cover; the whole coastline for the shoreline scatter.).\n\nSpec:\n- detail_plan.md: the five layers (canopy, shrubs, ground cover, rocks, debris), what you can see of each from 100 m, 30 m and 5 m, and where detail goes first (the scenic route, your vistas, the coast, district edges).\n- PCG_Rocks: rocks on slopes of about 15 to 40 degrees, in clusters (noise), spaced with Self Pruning, sunk 20 to 40 % of their height and tilted a little; plus a rare boulder chain on gentle ground.\n- Ground cover: a chain in each biome graph with grasses and small plants in the gaps between the shrub clumps (about 0.3 points per m², its clumps filter flipped to Lower Bound 0.1 and Upper Bound 0.6), each mesh entry with an Instance End Cull Distance of 6000 to 8000 (60 to 80 m).\n- PCG_Shoreline: points in a band from 50 cm below to 200 cm above sea level; pebbles and small rocks on gentle shore, boulders on steep shore; one PCG Volume over the whole island with Is Partitioned ticked.\n- Every new layer keeps the Day 38 keep-outs and grounding; pebbles and small rocks also fade out at 50 to 80 m; everything on DL_Detail.\n- stat unit before and after the detail at the transect's 100 m bookmark; memory under about 14 GB in Task Manager.\n\nMy checklist:\n1. Write detail_plan.md: the five layers, what reads from each height, and where detail goes first. Check: one table and three priority places. (from lesson 1)\n2. At the transect's 100 m bookmark take a 'before' screenshot and read stat unit. Check: the 'before' GPU number is in detail_plan.md. (from day 32, lesson 2)\n3. Build PCG_Rocks: slope band, noise clusters, Self Pruning and a spawner with 3 rock meshes, in a volume over the transect. Check: rocks gather in groups on slopes, with none on flat beaches. (from lesson 2)\n4. Sink and tilt the rocks and add the rare boulder chain. Check: from 5 m every rock looks settled, with a third or more of it buried. (from lesson 2)\n5. Check that PCG_Rocks kept the three keep-out branches it copied from your biome graph, wire them into the boulder chain's Difference too, and put its volume on DL_Detail. Check: no rock sits on a road, in a district or in the corridor. (from day 38, lesson 1)\n6. First bookmark a low view of that 200 m of coast (Ctrl+5) and take coast_before.png. Then build PCG_Shoreline: the waterline band, a gentle chain (pebbles, small rocks) and a steep chain (boulders), first in a test volume over 200 m of coast. Check: a ragged line of stones follows the water's edge. (from lesson 3)\n7. Add a ground-cover chain to each biome graph with grasses and small plants. Check: from 5 m the ground between shrubs is covered, with some bare patches. (from lesson 4)\n8. Set Instance End Cull Distance on the ground cover, the pebbles and the small rocks. Check: flying up from 5 m, small things fade out by about 80 m with no hard line. (from lesson 4)\n9. Load the whole island, place one PCG Volume over all of it for PCG_Shoreline, tick Is Partitioned and Generate (if memory passes about 14 GB, close other programs and Generate again). Check: the whole coast has a stone line, and memory stays under about 14 GB. (from lesson 4)\n10. The three-height read: 100 m, 30 m and 5 m on the transect and on two stretches of coast; fix the worst fault at each height. Check: detail_read.png shows the three heights. (from lesson 1)\n11. Footprint test on the new layers (rocks, boulders, shoreline). Check: each is under 1 in 20 floating in footprint_test.md. (from day 38, lesson 4)\n12. Read stat unit again at the same bookmark. Check: both numbers are written; if GPU rose more than 3 ms, you thinned the ground cover and noted it. (from day 32, lesson 2)\n13. Before/after capture: coast_before.png beside the same bookmark (press 5) after the shoreline scatter; then a 60-second clip along the coast in Play. Check that you also have pcg_rocks.png, pcg_shoreline.png and shoreline_whole.png (each is described in today's hand-in list; take any you are missing now). Check: before_after_day39.png and flythrough_day39.mp4 are saved. (from day 33, lesson 2)\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Anna\nDay 39: Layered detail: rocks, ground cover and the shoreline, read from the air. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p><div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+list(D.handin,'ul','ticks')+'<p class="path">'+ic('folder')+'<span>'+u('shipTo')+' <code>'+esc(D.workPath)+'</code></span></p>'+(D.lessons.length?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<p class="muted">'+u('report')+'</p><div class="row"><button class="btn s" onclick="cp(D.reportPrompt)">'+ic('copy')+u('copyR')+'</button></div></section>';
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();

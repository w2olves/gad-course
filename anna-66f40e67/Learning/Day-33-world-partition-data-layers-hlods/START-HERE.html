<!doctype html>
<html lang="uk">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Game Asset Development: Day 33</title>
<script>try{var t=localStorage.getItem('devteam:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Course look: soft UI. Light is frosted glass on soft extruded surfaces; dark is liquid glass on deep slate. */
:root{
--bg:#e6e7ec;--solid:#eef0f4;
--card:rgba(255,255,255,.34);--cardB:rgba(255,255,255,.75);
--raise:-10px -10px 26px rgba(255,255,255,.9),12px 14px 30px rgba(146,154,176,.42);
--raiseS:-5px -5px 12px rgba(255,255,255,.95),6px 6px 14px rgba(146,154,176,.45);
--press:inset 4px 4px 9px rgba(146,154,176,.45),inset -4px -4px 9px rgba(255,255,255,.95);
--well:rgba(214,217,226,.55);
--spec:rgba(255,255,255,.95);--sheen:rgba(255,255,255,.55);
--ink:#262a38;--muted:#5d6273;--faint:#7f8495;--line:rgba(38,42,56,.09);--line2:rgba(38,42,56,.16);
--acc:#5b50e6;--acc2:#8f86ff;--accT:#4b40d4;--accBg:rgba(91,80,230,.10);--glow:rgba(108,96,255,.45);
--ok:#1f8a4c;--okL:#2fbf6a;--okBg:rgba(47,191,106,.12);--bad:#c9353b;--badL:#ef4d55;--badBg:rgba(239,77,85,.10);
--boss:#c0307a;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.12);--gold:#9a6a06;--goldL:#f2b632;--goldBg:rgba(242,182,50,.16);
--lcd:#c4c8ba;--lcdOn:#262a23;--lcdGh:rgba(38,42,35,.07);--lcdSh:inset 3px 3px 7px rgba(110,116,100,.45),inset -3px -3px 7px rgba(255,255,255,.7);
--dsHi:rgba(255,255,255,.95);--dsLo:rgba(146,154,176,.5);
--o1:#cdc6ff;--o2:#ffd3e6;--o3:#c4ece0;--o4:#cfe0ff;
--topo:rgba(38,42,56,.28);--topo2:rgba(38,42,56,.12);--land:rgba(91,80,230,.06);--face:#e9eaef;
--blur:blur(22px) saturate(170%);
--head:"Montserrat","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--sans:"Jost","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html:not([data-theme=light]){color-scheme:dark}html:not([data-theme=light]) body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html:not([data-theme=light]) body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}}
:root[data-theme=dark]{--bg:#2a2e3d;--solid:#353a4b;
--card:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.13);
--raise:0 24px 50px -22px rgba(6,8,16,.75),0 2px 6px rgba(6,8,16,.3);
--raiseS:0 6px 14px rgba(6,8,16,.45),inset 0 1px 0 rgba(255,255,255,.18);
--press:inset 3px 3px 8px rgba(6,8,16,.55),inset -2px -2px 6px rgba(255,255,255,.05);
--well:rgba(10,12,22,.28);
--spec:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.07);
--ink:#f1f2f7;--muted:#b2b7c6;--faint:#8b90a2;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--acc:#8b7dff;--acc2:#c4bcff;--accT:#b8afff;--accBg:rgba(139,125,255,.16);--glow:rgba(139,125,255,.7);
--ok:#5fe39a;--okL:#4ade80;--okBg:rgba(74,222,128,.13);--bad:#ff8b8b;--badL:#ff5d5d;--badBg:rgba(255,93,93,.13);
--boss:#ff8cc4;--bossL:#ff5fa8;--bossBg:rgba(255,95,168,.14);--gold:#f6cd6e;--goldL:#f5c35b;--goldBg:rgba(245,195,91,.13);
--lcd:rgba(8,10,18,.35);--lcdOn:#f4f5ff;--lcdGh:rgba(255,255,255,.06);--lcdSh:inset 3px 3px 9px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.06);
--o1:#5b3fd6;--o2:#c2367f;--o3:#147a74;--o4:#2a4fb8;
--topo:rgba(241,242,247,.30);--topo2:rgba(241,242,247,.10);--land:rgba(139,125,255,.08);--face:rgba(255,255,255,.055);
--dsHi:rgba(255,255,255,.06);--dsLo:rgba(0,0,0,.55);}html[data-theme=dark]{color-scheme:dark}html[data-theme=dark] body.boss .sea{--o1:#8a2a62;--o4:#4b2d9a}html[data-theme=dark] body.fin .sea{--o1:#7a5410;--o2:#7a3a1c}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:var(--solid)}}
@media (prefers-reduced-transparency:reduce){:root{--card:var(--solid);--blur:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:light}
body{margin:0;font:400 17px/1.68 var(--sans);color:var(--ink);background:transparent;overflow-wrap:break-word;min-height:100vh;-webkit-font-smoothing:antialiased}
/* the room behind the glass: soft coloured light, painted once */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(34% 30% at 10% 12%,var(--o1) 0,transparent 70%),
 radial-gradient(30% 28% at 92% 22%,var(--o2) 0,transparent 70%),
 radial-gradient(36% 32% at 84% 88%,var(--o4) 0,transparent 72%),
 radial-gradient(32% 30% at 6% 86%,var(--o3) 0,transparent 70%),
 var(--bg)}
body.boss .sea{--o1:#ffc9e3;--o4:#e2d2ff}
body.fin .sea{--o1:#ffe3a6;--o2:#ffd6b0}
a{color:var(--accT);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
::selection{background:var(--accBg)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* surfaces: frosted glass, lifted off the page with a soft double shadow */
.glass{position:relative;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--cardB);box-shadow:var(--raise),inset 1px 1px 0 var(--spec);isolation:isolate}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(150deg,var(--sheen),transparent 38%)}
.well{background:var(--well);box-shadow:var(--press);border-radius:16px}
.lab{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lab .dotc{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow)}
.lab.k-gold .dotc{background:var(--goldL);box-shadow:0 0 10px var(--goldL)}.lab.k-ok .dotc{background:var(--okL);box-shadow:0 0 10px var(--okL)}.lab.k-boss .dotc{background:var(--bossL);box-shadow:0 0 10px var(--bossL)}
.eyebrow{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* segmented controls: theme and language */
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.seg button{font:600 12px/1 var(--head);letter-spacing:.08em;min-width:40px;min-height:34px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,background .2s,box-shadow .2s}
.seg button .ic{width:17px;height:17px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--raiseS)}
/* LCD panel */
.lcd{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--lcd);box-shadow:var(--lcdSh);color:var(--lcdOn);font:600 12px/1 var(--head);letter-spacing:.06em}
.seg7{height:28px;width:auto;display:block;overflow:visible}
.seg7 .on{fill:var(--lcdOn)}.seg7 .gh{fill:var(--lcdGh)}
.lcd.sm .seg7{height:24px}
/* knob slider used as a progress bar */
.slider{position:relative;height:14px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
.slider>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 12px var(--glow);min-width:8px;transition:width .5s}
.slider>b{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--solid);box-shadow:var(--raiseS);transition:left .5s}
.slider>b::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
/* dial and island chart */
.dial{display:block;width:100%;height:auto;overflow:visible}
.dial .face{fill:var(--face);stroke:var(--cardB);stroke-width:1;filter:drop-shadow(-10px -10px 18px var(--dsHi)) drop-shadow(12px 14px 22px var(--dsLo))}
.dial .track{fill:none;stroke:var(--line2);stroke-width:6}
.dial .arc{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow))}
.dial .knob{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 8px var(--glow))}
.dial .knob.go{animation:knobGo 2.6s ease-in-out infinite}@keyframes knobGo{0%,100%{r:7;stroke-width:3}50%{r:9.5;stroke-width:4}}

.dial .rimt{font:600 12px var(--head);letter-spacing:.32em;text-transform:uppercase;fill:var(--faint)}
.topo .c{fill:none;stroke:var(--topo);stroke-width:1}
.topo .c0{fill:var(--land);stroke:var(--topo);stroke-width:1.4}
.topo .rt{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:1 7;stroke-linecap:round;opacity:.7}
.topo .rtd{fill:none;stroke:var(--acc);stroke-width:2.4;filter:drop-shadow(0 0 4px var(--glow))}
.topo .w .dot{fill:var(--face);stroke:var(--faint);stroke-width:1.4}
.topo .w.b .dot{fill:var(--acc);stroke:var(--acc)}
.topo .w.n .dot{fill:var(--solid);stroke:var(--acc);stroke-width:3;filter:drop-shadow(0 0 6px var(--glow))}
.topo .w text{font:600 17px var(--head);fill:var(--faint)}
.topo .w.b text{fill:var(--muted)}.topo .w.n text{fill:var(--accT)}
.topo .w .halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto!important}}

html{scroll-padding-top:90px}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;padding:12px 0 0}
.topin{max-width:920px;margin:0 auto;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;border-radius:999px;width:calc(100% - 28px)}
.maplink{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--head);letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:0 18px 0 6px;border-radius:999px;min-height:44px;background:var(--card);box-shadow:var(--raiseS)}
.maplink .kn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}
.maplink:hover{color:var(--accT)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.crumb b{font:600 15px/1.2 var(--head)}
.crumb span{font:600 11px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tline{max-width:920px;width:calc(100% - 80px);margin:8px auto 0;height:3px;border-radius:3px;background:var(--line)}
.tline i{display:block;height:100%;border-radius:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow);transition:width .6s}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px 40px;align-items:center;padding:44px 0 36px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--raiseS);color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.chip.bo{color:var(--boss)}.chip.bo i{background:var(--bossL);box-shadow:0 0 8px var(--bossL)}
.chip.fi{color:var(--gold)}.chip.fi i{background:var(--goldL);box-shadow:0 0 8px var(--goldL)}
h1{font:700 clamp(30px,4.6vw,46px)/1.12 var(--head);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sub{font:500 17px/1.5 var(--sans);color:var(--muted);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:16px}
.meter .slider{flex:1}
.chart{position:relative;max-width:380px;width:100%;justify-self:center}
.seal{position:absolute;right:4%;top:4%;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okL);color:#fff;box-shadow:0 0 0 6px var(--card),0 0 24px var(--okL);animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.seal .ic{width:30px;height:30px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* cards */
.card{border-radius:30px;padding:30px 34px;margin-bottom:26px}
h2{font:700 25px/1.25 var(--head);letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
h3{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
p{margin:0 0 12px}
ul,ol{margin:6px 0 0;padding-left:22px}
li{margin:6px 0}
.ticks{list-style:none;padding:0}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--acc)}
.lead{font:500 20px/1.5 var(--sans);margin:0;text-wrap:pretty}
.weekt{font:600 14px/1.4 var(--head);color:var(--accT);margin:-6px 0 12px}
.daygoal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin:0 0 24px;padding:18px 20px}
.daygoal .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--gold)}
.uses{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;font-size:14.5px}
.uses .eyebrow{margin-right:4px}
.uses .u{background:var(--card);box-shadow:var(--raiseS);border-radius:12px;padding:6px 12px;color:var(--muted)}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:4px 36px}
.files{display:flex;gap:10px;align-items:center;color:var(--muted);margin:22px 0 0;font-size:15.5px}
img.pic{max-width:100%;border-radius:18px;margin-top:14px}
code{font-family:var(--mono);background:var(--well);box-shadow:var(--press);padding:2px 8px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
/* morning */
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px 34px}
.mtxt{font:500 18.5px/1.55 var(--sans);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--well);box-shadow:var(--press)}
.shelf .wkg{display:flex;gap:4px;align-items:flex-end}
.shelf i{display:block;width:7px;height:16px;border-radius:4px;background:var(--line2)}
.shelf i.d{background:linear-gradient(180deg,#ffe08a,var(--goldL));box-shadow:0 0 8px rgba(245,195,91,.6)}
.shelf i.bs{height:24px}
.cheer{font:600 18px/1.5 var(--head);color:var(--accT);margin:26px 0 0}
.quote{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;padding:18px 22px;border-radius:20px}
.quote .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--accT)}
.quote blockquote{margin:0;font:500 italic 19px/1.5 var(--sans)}
.quote figcaption{grid-column:2;font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* how today works */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{margin:0;counter-increment:h;font-size:15px;line-height:1.55;color:var(--muted);padding:16px;border-radius:20px}
.how li::before{content:counter(h);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 0 12px;font:700 14px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.tip{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin:20px 0 0}
.tip .ic{color:var(--gold);margin-top:4px}
/* lessons */
.quest{display:grid;grid-template-columns:76px 1fr;gap:0 18px}
.qnum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS);position:relative}
.qnum::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:var(--press)}
.quest.done .qnum{color:#fff;background:linear-gradient(145deg,#4ade80,#16a34a);box-shadow:0 0 22px rgba(74,222,128,.55)}
.quest.done .qnum::before{display:none}
.quest.done .qnum .ic{width:28px;height:28px;stroke-width:2.4}
.qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn{font:600 14.5px/1.2 var(--head);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(145deg,var(--acc2),var(--acc));box-shadow:0 10px 24px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.b{background:linear-gradient(145deg,#ff8cc4,#d6337e);box-shadow:0 10px 24px -8px rgba(255,95,168,.6),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.s{background:linear-gradient(145deg,#5fe39a,#16a34a);box-shadow:0 10px 24px -8px rgba(74,222,128,.55),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.ghost{color:var(--ink);background:var(--card);box-shadow:var(--raiseS)}

/* the Done switch */
.sw{display:inline-flex;align-items:center;gap:12px;border:0;background:transparent;cursor:pointer;font:600 14px/1 var(--head);color:var(--muted);min-height:50px;padding:0 6px}
.sw .tr{position:relative;width:58px;height:32px;border-radius:999px;background:var(--well);box-shadow:var(--press);transition:background .25s}

.sw[aria-pressed=true] .tr::after{left:30px;background:#fff}
details{margin-top:22px;border-radius:20px;background:var(--well);box-shadow:var(--press);padding:0 18px}
summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;min-height:52px;font:600 13px/1.3 var(--head);letter-spacing:.04em;color:var(--ink)}

summary .chev{margin-left:auto;transition:transform .25s;color:var(--faint)}
details[open] summary .chev{transform:rotate(180deg)}
details[open]{padding-bottom:16px}
.steps{list-style:none;padding:0;counter-reset:s;margin:4px 0 0}
.steps li{counter-increment:s;position:relative;padding:0 0 0 44px;margin:12px 0}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 12.5px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.vid{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;margin-top:20px;font-size:15px;padding:16px 18px;border-radius:20px}
.vid .kn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--raiseS);color:var(--badL)}
.vid b{font:600 11.5px/1.3 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
/* build */
.build.bossday{border-color:rgba(255,95,168,.35)}
.build.bossday::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(60% 45% at 100% 0%,rgba(255,95,168,.28),transparent 70%);z-index:-1;pointer-events:none}
.tiers{list-style:none;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:0}
.tiers li{margin:0;padding:16px 18px;border-radius:20px;font-size:14.5px;line-height:1.55;color:var(--muted);background:var(--card);box-shadow:var(--raiseS)}
.medal{display:flex;align-items:center;gap:10px;margin:0 0 8px;font:700 11.5px/1 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
.medal i{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 2px 2px rgba(255,255,255,.6),0 0 10px var(--mg)}
.m0{--mg:rgba(205,127,50,.6)}.m0 i{background:linear-gradient(135deg,#e7a46d,#9a5a2b)}
.m1{--mg:rgba(190,200,215,.7)}.m1 i{background:linear-gradient(135deg,#f3f6fa,#9aa5b3)}
.m2{--mg:rgba(245,195,91,.75)}.m2 i{background:linear-gradient(135deg,#ffe08a,#c99412)}
.ccount{display:flex;align-items:center;gap:16px;margin:28px 0 10px}
.ccount .slider{flex:1}
.check{list-style:none;padding:0;margin:0}
.check li{margin:0}
.check label{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:start;padding:14px 4px;cursor:pointer;border-bottom:1px solid var(--line)}
.check li:last-child label{border-bottom:0}
.check input{appearance:none;-webkit-appearance:none;width:26px;height:26px;margin:1px 0 0;border-radius:9px;background:var(--well);box-shadow:var(--press);display:grid;place-items:center;cursor:pointer;transition:background .2s,box-shadow .2s}
.check input::after{content:"";width:10px;height:5px;border:solid #fff;border-width:0 0 2.2px 2.2px;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.check input:checked{background:linear-gradient(145deg,#5fe39a,#16a34a);box-shadow:0 0 12px rgba(74,222,128,.55)}
.check input:checked::after{opacity:1}
.check li.on .tx{color:var(--faint)}
.check .ln{font:600 10.5px/1.3 var(--head);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);white-space:nowrap;margin-top:5px;padding:4px 9px;border-radius:999px;background:var(--well);box-shadow:var(--press)}
/* quiz */
.pips{display:flex;gap:8px;margin:0 0 4px;padding:10px 14px;border-radius:999px;width:max-content;max-width:100%;flex-wrap:wrap}
.pips i{width:9px;height:9px;border-radius:50%;background:var(--line2)}
.pips i.r{background:var(--okL);box-shadow:0 0 8px var(--okL)}.pips i.w{background:var(--badL);box-shadow:0 0 8px var(--badL)}
.qz{margin:28px 0 0;padding:28px 0 0;border-top:1px solid var(--line)}
.qz:first-of-type{border-top:0;padding-top:10px;margin-top:10px}
.qq{display:grid;grid-template-columns:40px 1fr;gap:10px;font:600 17.5px/1.45 var(--head);letter-spacing:-.005em;margin:0 0 14px}
.qq .qn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 13px/1 var(--head);color:var(--accT);background:var(--card);box-shadow:var(--raiseS)}
.opt{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;width:calc(100% - 50px);margin:12px 0 12px 50px;text-align:left;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid transparent;border-radius:18px;padding:11px 16px;cursor:pointer;box-shadow:var(--raiseS);transition:box-shadow .2s,transform .15s}
.opt .lt{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 12.5px/1 var(--head);color:var(--faint);background:var(--well);box-shadow:var(--press)}
.opt:hover:not([disabled]){transform:translateY(-1px);color:var(--accT)}
.opt.right{box-shadow:var(--press);background:var(--okBg);border-color:rgba(74,222,128,.45)}.opt.right .lt{background:var(--okL);color:#fff;box-shadow:0 0 10px var(--okL)}.opt.right .mk{color:var(--ok)}
.opt.wrong{box-shadow:var(--press);background:var(--badBg);border-color:rgba(255,93,93,.45)}.opt.wrong .lt{background:var(--badL);color:#fff;box-shadow:0 0 10px var(--badL)}.opt.wrong .mk{color:var(--bad)}
.opt[disabled]{cursor:default}
.opt[disabled]:not(.right):not(.wrong){opacity:.55;box-shadow:none}
.exp{margin:10px 0 0 50px;font-size:15.5px;color:var(--muted)}
.exp b{font:700 11.5px/1 var(--head);letter-spacing:.14em;text-transform:uppercase;margin-right:10px}
.exp.r b{color:var(--ok)}.exp.w b{color:var(--bad)}
.score{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:32px;padding:18px 20px;border-radius:24px}
.score .lcd .seg7{height:34px}
.score .row{margin:0 0 0 auto}
/* ship */
.path{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;margin:22px 0 12px}

.clip{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}

.nav{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:34px}
.nav a{display:flex;align-items:center;gap:14px;border-radius:24px;padding:16px 20px;font:600 15px/1.3 var(--head);text-decoration:none;color:var(--ink);min-height:72px}
.nav a .kn{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--well);box-shadow:var(--press);color:var(--accT)}

.nav a.nx{justify-content:flex-end;text-align:right;grid-column:2}
#toast{position:fixed;left:50%;bottom:28px;z-index:9;transform:translateX(-50%) translateY(16px);background:rgba(30,33,46,.82);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:#f4f5fa;border:1px solid rgba(255,255,255,.14);padding:13px 24px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none;font:600 14px/1.4 var(--head);max-width:min(92vw,560px);text-align:center;box-shadow:0 20px 40px -14px rgba(0,0,0,.5),0 0 24px var(--glow)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

 body{font-size:16.5px}

}

me/Island/HLOD, listed in the last row of the HLOD Partitions and set on the three landmarks; the farthest HLOD row reaching 2 km (204800); HLODs built with no errors.", "uk": "HLOD: Default HLOD Layer рівня (рушій задав його, коли створювався L_Island, наприклад HLODLayer_Instanced, тип Instancing) і його батьківський шар прочитані й записані у world_notes.md; HLOD_Merged (Merged Mesh) створений у /Game/Island/HLOD, доданий в останній рядок HLOD Partitions і призначений трьом орієнтирам; найдальший рядок HLOD сягає 2 км (204800); HLOD побудовані без помилок."}, {"en": "Play flies: GameMode Override set to GameModeBase for this level and a Player Start 30 m above your harbour; the island and its landmarks still show from 800 m out at sea.", "uk": "У Play можна літати: GameMode Override для цього рівня встановлений на GameModeBase, а Player Start стоїть на 30 м над твоєю гаванню; острів і його орієнтири досі видно з моря за 800 м."}], "piece1": "the grid, the minimap and the always-loaded actors", "piece2": {"en": "The flying Play test, the Data Layers and the HLODs, on your own", "uk": "Тест польоту в Play, Data Layers і HLOD, самостійно"}, "steps": [{"text": {"en": "In World Settings open World Partition Setup > Runtime Hash > Runtime Partitions > the first partition > Main Partition; write down the default Cell Size and Loading Range, then set 12800 and 51200. Check: world_notes.md has both pairs of numbers.", "uk": "У World Settings відкрий World Partition Setup > Runtime Hash > Runtime Partitions > перший розділ > Main Partition; запиши Cell Size і Loading Range за замовчуванням, потім встанови 12800 і 51200. Перевірка: у world_notes.md є обидві пари чисел."}, "lesson": 1}, {"text": {"en": "Open the World Partition editor, take a screenshot of it as your 'before', then choose Build > Build World Partition Editor Minimap in the main menu bar. Check: a top view of your island fills the World Partition editor.", "uk": "Відкрий редактор World Partition, зроби його скріншот як «до», потім вибери Build > Build World Partition Editor Minimap у головному меню. Перевірка: вигляд твого острова згори заповнює редактор World Partition."}, "lesson": 1}, {"text": {"en": "Load only the region round your harbour; note memory in Task Manager before and after. Check: the rest of the island shows as unloaded, and memory dropped.", "uk": "Завантаж лише ділянку довкола гавані; запиши пам'ять у Task Manager до й після. Перевірка: решта острова показана як незавантажена, а пам'ять зменшилася."}, "lesson": 1}, {"text": {"en": "Untick Is Spatially Loaded on the sun, Sky Light, Sky Atmosphere, Height Fog, clouds, Post Process Volume, ocean and Water Zone. Check: they stay in the viewport when you unload every region.", "uk": "Вимкни Is Spatially Loaded на сонці, Sky Light, Sky Atmosphere, Height Fog, хмарах, Post Process Volume, океані й Water Zone. Перевірка: вони лишаються у в'юпорті, коли вивантажуєш усі ділянки."}, "lesson": 1}, {"text": {"en": "Set up flying in Play: GameMode Override GameModeBase and a Player Start 30 m above the harbour. If your road surface is missing in Play, choose Build > Build Landscape Spline Meshes and Play again. Check: Play puts you in the air and the keys fly you.", "uk": "Налаштуй політ у Play: GameMode Override GameModeBase і Player Start на 30 м над гаванню. Якщо в Play немає дорожнього покриття, вибери Build > Build Landscape Spline Meshes і знову запусти Play. Перевірка: Play ставить тебе в повітря, і клавіші керують польотом."}, "lesson": 2}, {"text": {"en": "In Play, show the loading cells with wp.Runtime.ToggleDrawRuntimeHash2D and fly 1 km out and back; write what you saw. Check: the cell map shows cells loading round you, and world_notes.md describes any pop-in.", "uk": "У Play покажи комірки завантаження командою wp.Runtime.ToggleDrawRuntimeHash2D, відлети на 1 км і повернися; запиши, що побачено. Перевірка: на мапі комірок видно, як довкола тебе завантажуються комірки, а у world_notes.md описані всі випадки раптової появи об'єктів (pop-in)."}, "lesson": 2}, {"text": {"en": "Make the eight Data Layer assets and set each to Editor. Check: eight DL_ assets sit in /Game/Island/DataLayers.", "uk": "Створи вісім асетів Data Layer і встанови кожному тип Editor. Перевірка: вісім асетів DL_ лежать у /Game/Island/DataLayers."}, "lesson": 3}, {"text": {"en": "Add them to the Data Layer Outliner; put the river and lake on DL_Water and the landmarks on DL_Landmarks. Check: hiding DL_Water hides the river and lake but not the ocean.", "uk": "Додай їх у Data Layer Outliner; постав річку й озеро на DL_Water, а орієнтири на DL_Landmarks. Перевірка: якщо сховати DL_Water, зникають річка й озеро, але не океан."}, "lesson": 3}, {"text": {"en": "Read the Default HLOD Layer (open it: Layer Type and Parent Layer). Make HLOD_Merged (Merged Mesh) in /Game/Island/HLOD, add it to the last row of HLOD Partitions, set the Loading Ranges (last row 204800, first row 102400 if there are two) and set HLOD_Merged on the three landmarks. Check: world_notes.md names each HLOD layer, its type and range, and each landmark's Details shows HLOD_Merged.", "uk": "Прочитай Default HLOD Layer (відкрий його: Layer Type і Parent Layer). Створи HLOD_Merged (Merged Mesh) у /Game/Island/HLOD, додай його в останній рядок HLOD Partitions, задай Loading Ranges (останній рядок 204800, перший 102400, якщо рядків два) і признач HLOD_Merged трьом орієнтирам. Перевірка: у world_notes.md названо кожен шар HLOD, його тип і дальність, а в Details кожного орієнтира видно HLOD_Merged."}, "lesson": 4}, {"text": {"en": "Build the HLODs (Build > Build HLODs). Check: the build finishes with no errors in the Message Log.", "uk": "Побудуй HLOD (Build > Build HLODs). Перевірка: побудова завершується без помилок у Message Log."}, "lesson": 4}, {"text": {"en": "Play, fly 800 m out to sea and turn round. Check: the island and its landmarks still show on the horizon; hlod_far.png is saved.", "uk": "Запусти Play, відлети на 800 м у море й розвернися. Перевірка: острів і його орієнтири досі видно на обрії; hlod_far.png збережено."}, "lesson": 4}, {"text": {"en": "Before/after capture: the World Partition editor before and after the minimap; then a 60-second clip flying round the coast in Play. Check that you also have wp_editor.png and datalayers.png (each is described in today's hand-in list; take any you are missing now). Check: before_after_day33.png and flythrough_day33.mp4 are saved.", "uk": "Знімок до/після: редактор World Partition до й після мінімапи; потім 60-секундне відео польоту довкола берега в Play. Перевір, що в тебе також є wp_editor.png і datalayers.png (кожен описаний у сьогоднішньому списку «Здати роботу»; зроби зараз ті, яких бракує). Перевірка: before_after_day33.png і flythrough_day33.mp4 збережені."}, "lesson": 2}], "assets": []}, "lessons": [{"title": {"en": "World Partition: cells, loading range and regions", "uk": "World Partition: комірки, дальність завантаження й ділянки"}, "minutes": 40, "goals": [{"en": "Explain World Partition: the world is cut into square grid cells, and only the cells within the Loading Range of the viewer are loaded; loading and unloading cells as you move is called streaming.", "uk": "Пояснити World Partition: світ розрізаний на квадратні комірки сітки, і завантажуються лише ті, що в межах Loading Range від глядача; завантаження й вивантаження комірок під час руху називається стримінгом."}, {"en": "Set the grid in World Settings (Unreal 5.8 calls it a runtime partition) and build a minimap (a top-view picture of the world) for the World Partition editor.", "uk": "Задати сітку у World Settings (Unreal 5.8 називає її runtime partition) і побудувати мінімапу (вигляд світу згори) для редактора World Partition."}, {"en": "Load only the region you work in, and keep always-needed actors out of streaming with Is Spatially Loaded.", "uk": "Завантажувати лише ділянку, де працюєш, і виключати завжди потрібних акторів зі стримінгу через Is Spatially Loaded."}], "doalong": [{"en": "Open Window > World Settings. Find World Partition Setup > Runtime Hash > Runtime Partitions and open the first entry (named MainPartition or MainGrid), then Main Partition. You see Cell Size and Loading Range; write the default values in world_notes.md. If your panel looks different, send the tutor a screenshot.", "uk": "Відкрий Window > World Settings. Знайди World Partition Setup > Runtime Hash > Runtime Partitions і розгорни перший запис (з назвою MainPartition або MainGrid), потім Main Partition. Ти бачиш Cell Size і Loading Range; запиши значення за замовчуванням у world_notes.md. Якщо твоя панель виглядає інакше, надішли тьюторові скріншот."}, {"en": "Set Cell Size to 12800 and Loading Range to 51200 (Unreal counts in centimetres). You see the new values: 128 m cells and a 512 m loading range.", "uk": "Встанови Cell Size на 12800 і Loading Range на 51200 (Unreal рахує в сантиметрах). Ти бачиш нові значення: комірки 128 м і дальність завантаження 512 м."}, {"en": "Open Window > World Partition > World Partition Editor. Then, in the main menu bar, choose Build > Build World Partition Editor Minimap. You see a top view of your island appear in the World Partition editor's grid.", "uk": "Відкрий Window > World Partition > World Partition Editor. Потім у головному меню вибери Build > Build World Partition Editor Minimap. Ти бачиш, як у сітці редактора World Partition з'являється вигляд твого острова згори."}, {"en": "In the World Partition editor drag a box over your harbour, right-click and choose Load Region From Selection; unload the other regions. You see only that area in the viewport.", "uk": "У редакторі World Partition обведи рамкою свою гавань, клікни правою кнопкою й вибери Load Region From Selection; вивантаж інші ділянки. Ти бачиш у в'юпорті лише цю ділянку."}, {"en": "Select the sun, Sky Light, fog and ocean in the Outliner; in Details > World Partition untick Is Spatially Loaded. You see them stay when the regions unload.", "uk": "Виділи сонце, Sky Light, туман і океан в Outliner; у Details > World Partition вимкни Is Spatially Loaded. Ти бачиш, що вони лишаються, коли ділянки вивантажуються."}], "play": {"en": "Loading guess: the tutor names a flying speed (10, 20 or 30 m/s); I say how many seconds it takes to cross my 512 m loading range (512 m at 20 m/s is about 26 seconds).", "uk": "Вгадай завантаження: тьютор називає швидкість польоту (10, 20 чи 30 м/с); я кажу, за скільки секунд можна перетнути мою дальність завантаження 512 м (512 м на швидкості 20 м/с — це близько 26 секунд)."}, "video": {"url": "https://www.youtube.com/watch?v=fDgKV3SjDTI", "title": "UE5 World Partition Part 1 Concepts", "channel": "Demenzun Media", "length": "14:49", "search": "unreal engine 5 world partition concepts"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: World Partition: cells, loading range and regions (Day 33, lesson 1 of 4).\nToday's build: L_Island organised as a big world: its World Partition grid set and tested in Play, eight Data Layers, the always-needed actors kept out of streaming, and HLODs set to reach across the island and built, so the far island still shows.\n\nBy the end of this lesson I can:\n1. Explain World Partition: the world is cut into square grid cells, and only the cells within the Loading Range of the viewer are loaded; loading and unloading cells as you move is called streaming.\n2. Set the grid in World Settings (Unreal 5.8 calls it a runtime partition) and build a minimap (a top-view picture of the world) for the World Partition editor.\n3. Load only the region you work in, and keep always-needed actors out of streaming with Is Spatially Loaded.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (Your island has land, water, roads, one light recipe, three landmarks and three vista cameras.), what I will learn today (You set up L_Island as a big world, with a World Partition grid, eight Data Layers, and HLODs that show the whole island from far out at sea.), encourage me (This is one of the most technical days of the course, so go step by step and lean on your tutor as much as you like.), and share today's quote: \"Optimism is the faith that leads to achievement; nothing can be done without hope.\" (Helen Keller).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 30: which two faults does a high drone shot of terrain show first? | Day 26: why is L_Island an Open World level and not a Basic one?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: Loading guess: the tutor names a flying speed (10, 20 or 30 m/s); I say how many seconds it takes to cross my 512 m loading range (512 m at 20 m/s is about 26 seconds).\n6. Do-along on today's build (the grid, the minimap and the always-loaded actors): guide me through these steps one at a time, checking a screenshot after each:\n   - Open Window > World Settings. Find World Partition Setup > Runtime Hash > Runtime Partitions and open the first entry (named MainPartition or MainGrid), then Main Partition. You see Cell Size and Loading Range; write the default values in world_notes.md. If your panel looks different, send the tutor a screenshot.\n   - Set Cell Size to 12800 and Loading Range to 51200 (Unreal counts in centimetres). You see the new values: 128 m cells and a 512 m loading range.\n   - Open Window > World Partition > World Partition Editor. Then, in the main menu bar, choose Build > Build World Partition Editor Minimap. You see a top view of your island appear in the World Partition editor's grid.\n   - In the World Partition editor drag a box over your harbour, right-click and choose Load Region From Selection; unload the other regions. You see only that area in the viewport.\n   - Select the sun, Sky Light, fog and ocean in the Outliner; in Details > World Partition untick Is Spatially Loaded. You see them stay when the regions unload.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"UE5 World Partition Part 1 Concepts\" by Demenzun Media: https://www.youtube.com/watch?v=fDgKV3SjDTI\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Flying a streaming world in Play", "uk": "Політ у стримінговому світі в Play"}, "minutes": 40, "goals": [{"en": "Explain a pawn and a game mode: the pawn is what you control in Play; the game mode chooses it. The Third Person template's game mode gives you a walking character.", "uk": "Пояснити pawn і game mode: pawn — те, чим ти керуєш у Play; game mode вибирає його. Game mode шаблону Third Person дає персонажа, що ходить."}, {"en": "Set a flying Play for L_Island only: GameMode Override GameModeBase, whose built-in pawn flies, so World Partition streams cells round you.", "uk": "Налаштувати політ у Play лише для L_Island: GameMode Override GameModeBase, вбудований pawn якого літає, тож World Partition підвантажує комірки довкола тебе."}, {"en": "Watch streaming happen with the cell view and Task Manager, and record a clip in Play.", "uk": "Спостерігати стримінг через вигляд комірок і Task Manager і записати відео в Play."}], "doalong": [{"en": "In World Settings find GameMode Override and choose GameModeBase. You see the setting change; it applies to this level only, and your other levels keep the walking character.", "uk": "У World Settings знайди GameMode Override і вибери GameModeBase. Ти бачиш, що налаштування змінилося; воно діє лише на цей рівень, а інші рівні зберігають персонажа, що ходить."}, {"en": "In Place Actors open Basic and drag in a Player Start; move it 30 m above your harbour. You see a small flag icon in the air.", "uk": "У Place Actors відкрий Basic і перетягни Player Start; підніми його на 30 м над гаванню. Ти бачиш маленьку іконку прапорця в повітрі."}, {"en": "Press Play (Alt+P). Fly with W, A, S and D and the mouse; E or Space to rise, Q or C to sink. You see yourself flying over the harbour; press Esc to stop.", "uk": "Натисни Play (Alt+P). Літай за допомогою W, A, S, D і миші; E або Space — угору, Q або C — униз. Ти бачиш, що летиш над гаванню; натисни Esc, щоб зупинити."}, {"en": "Press Play again, open the console (`) and type wp.Runtime.ToggleDrawRuntimeHash2D. You see a small map of the cells; loaded cells change as you fly.", "uk": "Знову натисни Play, відкрий консоль (`) і введи wp.Runtime.ToggleDrawRuntimeHash2D. Ти бачиш маленьку мапу комірок; завантажені комірки змінюються під час польоту."}, {"en": "Open Task Manager (Ctrl+Shift+Esc) beside the editor and fly across the island. You see memory rise and fall as cells load and unload. Then record 60 seconds round the coast with Win+Alt+R.", "uk": "Відкрий Task Manager (Ctrl+Shift+Esc) поруч із редактором і пролети через острів. Ти бачиш, як пам'ять зростає й падає, коли комірки завантажуються й вивантажуються. Потім запиши 60 секунд довкола берега через Win+Alt+R."}], "play": {"en": "Pop-in hunt: I fly the coast and call out everything that suddenly pops into view; the tutor asks what my loading range was and whether a bigger range or HLODs would fix it.", "uk": "Полювання на pop-in: я лечу вздовж берега й називаю все, що раптово з'являється в кадрі; тьютор питає, якою була моя дальність завантаження і чи виправили б це більша дальність або HLOD."}, "video": {"url": "https://www.youtube.com/watch?v=lkjlP0Y4zvc", "title": "World Partition And Data Layers - Unreal Engine 5 Tutorial", "channel": "Pitchfork Academy", "length": "26:33", "search": "unreal engine 5 world partition data layers tutorial"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Flying a streaming world in Play (Day 33, lesson 2 of 4).\nToday's build: L_Island organised as a big world: its World Partition grid set and tested in Play, eight Data Layers, the always-needed actors kept out of streaming, and HLODs set to reach across the island and built, so the far island still shows.\n\nBy the end of this lesson I can:\n1. Explain a pawn and a game mode: the pawn is what you control in Play; the game mode chooses it. The Third Person template's game mode gives you a walking character.\n2. Set a flying Play for L_Island only: GameMode Override GameModeBase, whose built-in pawn flies, so World Partition streams cells round you.\n3. Watch streaming happen with the cell view and Task Manager, and record a clip in Play.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Pop-in hunt: I fly the coast and call out everything that suddenly pops into view; the tutor asks what my loading range was and whether a bigger range or HLODs would fix it.\n4. Do-along on today's build (the grid, the minimap and the always-loaded actors): guide me through these steps one at a time, checking a screenshot after each:\n   - In World Settings find GameMode Override and choose GameModeBase. You see the setting change; it applies to this level only, and your other levels keep the walking character.\n   - In Place Actors open Basic and drag in a Player Start; move it 30 m above your harbour. You see a small flag icon in the air.\n   - Press Play (Alt+P). Fly with W, A, S and D and the mouse; E or Space to rise, Q or C to sink. You see yourself flying over the harbour; press Esc to stop.\n   - Press Play again, open the console (`) and type wp.Runtime.ToggleDrawRuntimeHash2D. You see a small map of the cells; loaded cells change as you fly.\n   - Open Task Manager (Ctrl+Shift+Esc) beside the editor and fly across the island. You see memory rise and fall as cells load and unload. Then record 60 seconds round the coast with Win+Alt+R.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"World Partition And Data Layers - Unreal Engine 5 Tutorial\" by Pitchfork Academy: https://www.youtube.com/watch?v=lkjlP0Y4zvc\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Data Layers: sorting the whole island", "uk": "Data Layers: як розсортувати весь острів"}, "minutes": 40, "goals": [{"en": "Explain a Data Layer: a named group of actors across the whole world that you can show, hide, load or unload together.", "uk": "Пояснити Data Layer: іменована група акторів у всьому світі, яку можна разом показати, сховати, завантажити чи вивантажити."}, {"en": "Make Data Layer assets and add them to the Data Layer Outliner as Editor layers (layers for working; the finished game still loads everything).", "uk": "Створювати асети Data Layer і додавати їх у Data Layer Outliner як шари Editor (шари для роботи; готова гра однаково завантажує все)."}, {"en": "Sort actors as you place them, with the same names everywhere.", "uk": "Сортувати акторів одразу, коли ставиш їх, з однаковими назвами всюди."}], "doalong": [{"en": "In the Content Browser make the folder /Game/Island/DataLayers; right-click inside it > Miscellaneous > Data Layer and name it DL_Water. Double-click it and set Data Layer Type to Editor. You see the asset saved as an Editor layer.", "uk": "У Content Browser створи теку /Game/Island/DataLayers; клікни правою кнопкою всередині > Miscellaneous > Data Layer і назви його DL_Water. Двічі клікни його й встанови Data Layer Type на Editor. Ти бачиш, що асет збережено як шар Editor."}, {"en": "Make the other seven the same way: DL_Landmarks, DL_Forest, DL_Biomes, DL_Detail, DL_KeepOuts, DL_District1 and DL_District2. You see eight DL_ assets.", "uk": "Так само створи інші сім: DL_Landmarks, DL_Forest, DL_Biomes, DL_Detail, DL_KeepOuts, DL_District1 і DL_District2. Ти бачиш вісім асетів DL_."}, {"en": "Open Window > World Partition > Data Layer Outliner and drag each asset into it. You see eight layers, each with an eye box for showing and hiding.", "uk": "Відкрий Window > World Partition > Data Layer Outliner і перетягни туди кожен асет. Ти бачиш вісім шарів, кожен з іконкою ока, щоб показувати й ховати."}, {"en": "Select the river and the lake in the Outliner. In the Data Layer Outliner click DL_Water, then right-click it > Add Selected Actors to Selected Data Layers. Do the same for the landmarks with DL_Landmarks. You see the actors listed under each layer.", "uk": "Виділи річку й озеро в Outliner. У Data Layer Outliner клікни DL_Water, потім клікни його правою кнопкою > Add Selected Actors to Selected Data Layers. Зроби те саме для орієнтирів із DL_Landmarks. Ти бачиш акторів у списку під кожним шаром."}, {"en": "Click DL_Water's eye. You see the river and lake vanish while the ocean stays; click it again to show them.", "uk": "Клікни око DL_Water. Ти бачиш, як річка й озеро зникають, а океан лишається; клікни ще раз, щоб їх показати."}], "play": {"en": "Sort it: the tutor lists 12 island things (a lighthouse, a pine, a pebble, a road keep-out, a café in district 1...); I name the Data Layer for each within 5 seconds.", "uk": "Розсортуй: тьютор перелічує 12 острівних речей (маяк, сосна, камінець, зона-виняток вздовж дороги, кафе в районі 1...); я називаю Data Layer для кожної за 5 секунд."}, "video": {"url": "https://www.youtube.com/watch?v=_OlAs-fvICc", "title": "Unreal Engine 5 Tutorial - Data Layers", "channel": "Ryan Laley", "length": "10:01", "search": "unreal engine 5 data layers tutorial"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Data Layers: sorting the whole island (Day 33, lesson 3 of 4).\nToday's build: L_Island organised as a big world: its World Partition grid set and tested in Play, eight Data Layers, the always-needed actors kept out of streaming, and HLODs set to reach across the island and built, so the far island still shows.\n\nBy the end of this lesson I can:\n1. Explain a Data Layer: a named group of actors across the whole world that you can show, hide, load or unload together.\n2. Make Data Layer assets and add them to the Data Layer Outliner as Editor layers (layers for working; the finished game still loads everything).\n3. Sort actors as you place them, with the same names everywhere.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Sort it: the tutor lists 12 island things (a lighthouse, a pine, a pebble, a road keep-out, a café in district 1...); I name the Data Layer for each within 5 seconds.\n4. Do-along on today's build (the grid, the minimap and the always-loaded actors): guide me through these steps one at a time, checking a screenshot after each:\n   - In the Content Browser make the folder /Game/Island/DataLayers; at replaces cells that are not loaded, so the far island still shows.", "uk": "Пояснити HLOD (Hierarchical Level of Detail): дешевий меш-замінник, який підміняє незавантажені комірки, тож далекий острів досі видно."}, {"en": "Make HLOD layers of the right type: Instancing for many small things like plants and rocks (the engine's default layer), Merged Mesh for big solid things like landmarks and buildings (your HLOD_Merged).", "uk": "Створювати шари HLOD правильного типу: Instancing для багатьох дрібних речей, як-от рослини й каміння (шар рушія за замовчуванням), Merged Mesh для великих суцільних речей, як-от орієнтири й будівлі (твій HLOD_Merged)."}, {"en": "Give the stand-ins enough reach, build the HLODs and check them by flying away in Play.", "uk": "Дати замінникам достатню дальність, побудувати HLOD і перевірити їх, відлітаючи в Play."}], "doalong": [{"en": "Open World Settings > World Partition Setup and find Default HLOD Layer: the engine set it when you made L_Island (for example HLODLayer_Instanced). Double-click it. You see its Layer Type (Instancing) and maybe a Parent Layer, the next, cheaper level of stand-ins; write the names and types in world_notes.md.", "uk": "Відкрий World Settings > World Partition Setup і знайди Default HLOD Layer: рушій задав його, коли створювався L_Island (наприклад, HLODLayer_Instanced). Двічі клікни його. Ти бачиш його Layer Type (Instancing) і, можливо, Parent Layer — наступний, дешевший рівень замінників; запиши назви й типи у world_notes.md."}, {"en": "Make the folder /Game/Island/HLOD; right-click inside it > Miscellaneous > HLOD Layer; name it HLOD_Merged, open it and set Layer Type to Merged Mesh. You see the asset saved.", "uk": "Створи теку /Game/Island/HLOD; клікни правою кнопкою всередині > Miscellaneous > HLOD Layer; назви його HLOD_Merged, відкрий і встанови Layer Type на Merged Mesh. Ти бачиш, що асет збережено."}, {"en": "In World Settings open Runtime Hash > Runtime Partitions > your first partition > HLOD Partitions. You see one row per HLOD level. In the last row (a row called Non-Spatially Loaded HLODs, if you have one, is always loaded and counts as last), under HLOD Layers To Include click + and choose HLOD_Merged: Unreal 5.8 only streams HLOD layers listed here. If that row has a Loading Range, set it to 204800 (2 km), and an earlier row's to 102400. If your panel looks different, send the tutor a screenshot.", "uk": "У World Settings відкрий Runtime Hash > Runtime Partitions > свій перший розділ > HLOD Partitions. Ти бачиш по рядку на кожен рівень HLOD. В останньому рядку (рядок Non-Spatially Loaded HLODs, якщо він у тебе є, завантажений завжди й вважається останнім) у HLOD Layers To Include клікни + і вибери HLOD_Merged: Unreal 5.8 стримить лише шари HLOD, перелічені тут. Якщо в цьому рядку є Loading Range, встанови його на 204800 (2 км), а в попередньому рядку — на 102400. Якщо твоя панель виглядає інакше, надішли тьюторові скріншот."}, {"en": "Select your three landmarks; in Details search HLOD and set HLOD Layer to HLOD_Merged. You see HLOD_Merged on each.", "uk": "Виділи три свої орієнтири; у Details знайди пошуком HLOD і встанови HLOD Layer на HLOD_Merged. Ти бачиш HLOD_Merged на кожному."}, {"en": "In the main menu bar choose Build > Build HLODs and wait. You see a progress bar, then a finished message; if it reports errors, open Window > Message Log.", "uk": "У головному меню вибери Build > Build HLODs і зачекай. Ти бачиш смугу прогресу, а потім повідомлення про завершення; якщо є помилки, відкрий Window > Message Log."}, {"en": "Press Play, fly 800 m out to sea and turn round. You see the island and its landmarks still standing on the horizon.", "uk": "Натисни Play, відлети на 800 м у море й розвернися. Ти бачиш, що острів і його орієнтири досі стоять на обрії."}], "play": {"en": "Far test: three times I fly away and come back; every pop the tutor finds in my description costs a point, and I fix it with an HLOD layer or the loading range.", "uk": "Тест здалеку: тричі я відлітаю й повертаюся; кожна раптова поява, яку тьютор знаходить у моєму описі, коштує бал, і я виправляю її шаром HLOD або дальністю завантаження."}, "video": {"url": "https://www.youtube.com/watch?v=BCeTWfmUC9U", "title": "Unreal Engine 5 | HLODS and World Partition", "channel": "pheel", "length": "6:04", "search": "unreal engine 5 hlod world partition"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: HLODs: the whole island from far away (Day 33, lesson 4 of 4).\nToday's build: L_Island organised as a big world: its World Partition grid set and tested in Play, eight Data Layers, the always-needed actors kept out of streaming, and HLODs set to reach across the island and built, so the far island still shows.\n\nBy the end of this lesson I can:\n1. Explain an HLOD (Hierarchical Level of Detail): a cheap stand-in mesh that replaces cells that are not loaded, so the far island still shows.\n2. Make HLOD layers of the right type: Instancing for many small things like plants and rocks (the engine's default layer), Merged Mesh for big solid things like landmarks and buildings (your HLOD_Merged).\n3. Give the stand-ins enough reach, build the HLODs and check them by flying away in Play.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Far test: three times I fly away and come back; every pop the tutor finds in my description costs a point, and I fix it with an HLOD layer or the loading range.\n4. Do-along on today's build (the grid, the minimap and the always-loaded actors): guide me through these steps one at a time, checking a screenshot after each:\n   - Open World Settings > World Partition Setup and find Default HLOD Layer: the engine set it when you made L_Island (for example HLODLayer_Instanced). Double-click it. You see its Layer Type (Instancing) and maybe a Parent Layer, the next, cheaper level of stand-ins; write the names and types in world_notes.md.\n   - Make the folder /Game/Island/HLOD; right-click inside it > Miscellaneous > HLOD Layer; name it HLOD_Merged, open it and set Layer Type to Merged Mesh. You see the asset saved.\n   - In World Settings open Runtime Hash > Runtime Partitions > your first partition > HLOD Partitions. You see one row per HLOD level. In the last row (a row called Non-Spatially Loaded HLODs, if you have one, is always loaded and counts as last), under HLOD Layers To Include click + and choose HLOD_Merged: Unreal 5.8 only streams HLOD layers listed here. If that row has a Loading Range, set it to 204800 (2 km), and an earlier row's to 102400. If your panel looks different, send the tutor a screenshot.\n   - Select your three landmarks; in Details search HLOD and set HLOD Layer to HLOD_Merged. You see HLOD_Merged on each.\n   - In the main menu bar choose Build > Build HLODs and wait. You see a progress bar, then a finished message; if it reports errors, open Window > Message Log.\n   - Press Play, fly 800 m out to sea and turn round. You see the island and its landmarks still standing on the horizon.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Unreal Engine 5 | HLODS and World Partition\" by pheel: https://www.youtube.com/watch?v=BCeTWfmUC9U\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "world_notes.md (default and new grid values, memory before and after, pop-in notes, HLOD layers, types and ranges)", "uk": "world_notes.md (значення сітки за замовчуванням і нові, пам'ять до й після, нотатки про pop-in, шари HLOD, їхні типи й дальності)"}, {"en": "wp_editor.png (the World Partition editor with the minimap) and datalayers.png (the Data Layer Outliner)", "uk": "wp_editor.png (редактор World Partition з мінімапою) і datalayers.png (Data Layer Outliner)"}, {"en": "hlod_far.png (the island from 800 m out at sea in Play)", "uk": "hlod_far.png (острів з моря за 800 м у Play)"}, {"en": "before_after_day33.png and flythrough_day33.mp4 (60 seconds round the coast in Play)", "uk": "before_after_day33.png і flythrough_day33.mp4 (60 секунд довкола берега в Play)"}, {"en": "summary.md", "uk": "звіт дня (summary.md)"}], "goal": {"en": "By the end of today you have L_Island set up as a big world: a World Partition grid tested in Play, eight Data Layers, the sky and sea always loaded, and built HLODs that show the whole island from far out at sea.", "uk": "До кінця дня L_Island налаштований як великий світ: сітка World Partition, перевірена в Play, вісім Data Layers, небо й море завжди завантажені, а побудовані HLOD показують увесь острів далеко з моря."}, "uses": [{"en": "Day 26: L_Island, your Open World (World Partition) level", "uk": "День 26: L_Island, твій рівень Open World (World Partition)"}, {"en": "Day 29: the ocean, the river and the lake", "uk": "День 29: океан, річка й озеро"}, {"en": "Day 32: the light actors and the three landmarks", "uk": "День 32: актори світла й три орієнтири"}], "quiz": [{"q": {"en": "What does the Loading Range of a World Partition grid decide?", "uk": "Що визначає Loading Range сітки World Partition?"}, "options": [{"en": "How far the sun shines", "uk": "Як далеко світить сонце"}, {"en": "How far from the viewer cells are loaded", "uk": "На якій відстані від глядача завантажуються комірки"}, {"en": "How big the landscape is", "uk": "Наскільки великий ландшафт"}], "answer": 1, "explain": {"en": "Cells inside the Loading Range of the viewer load; cells outside stay unloaded and show only as HLODs.", "uk": "Комірки в межах Loading Range від глядача завантажуються; комірки поза ним лишаються незавантаженими й видно лише їхні HLOD."}}, {"q": {"en": "You unload every region and your sun and fog vanish too. What did you forget?", "uk": "Ти вивантажуєш усі ділянки, і разом із ними зникають сонце й туман. Що лишилося незробленим?"}, "options": [{"en": "To build HLODs", "uk": "Побудувати HLOD"}, {"en": "To add them to DL_Forest", "uk": "Додати їх у DL_Forest"}, {"en": "To untick Is Spatially Loaded on them", "uk": "Вимкнути на них Is Spatially Loaded"}, {"en": "To lock exposure", "uk": "Зафіксувати експозицію"}], "answer": 2, "explain": {"en": "Actors with Is Spatially Loaded ticked load and unload with their cell. Light and sky actors must always be there.", "uk": "Актори з увімкненим Is Spatially Loaded завантажуються й вивантажуються разом зі своєю коміркою. Актори світла й неба мають бути на місці завжди."}}, {"q": {"en": "From 800 m out at sea in Play, the far half of your island is missing. What is the likely cause?", "uk": "У Play з моря за 800 м не видно далекої половини острова. Яка ймовірна причина?"}, "options": [{"en": "The HLODs are not built, so unloaded cells show nothing", "uk": "HLOD не побудовані, тож незавантажені комірки нічого не показують"}, {"en": "The Data Layers are Editor layers", "uk": "Data Layers — це шари Editor"}, {"en": "The fog is off", "uk": "Туман вимкнений"}], "answer": 0, "explain": {"en": "Beyond the Loading Range, only HLOD stand-ins can draw the island. Build them after big changes, and give the farthest HLOD level a long Loading Range.", "uk": "За межами Loading Range острів можуть малювати лише замінники HLOD. Перебудовуй їх після великих змін і давай найдальшому рівню HLOD велику Loading Range."}}, {"q": {"en": "Which HLOD layer type suits thousands of plants and small rocks?", "uk": "Який тип шару HLOD пасує тисячам рослин і дрібного каміння?"}, "options": [{"en": "Merged Mesh", "uk": "Merged Mesh"}, {"en": "None: plants never need HLODs", "uk": "Жоден: рослинам HLOD ніколи не потрібні"}, {"en": "Simplified Mesh", "uk": "Simplified Mesh"}, {"en": "Instancing", "uk": "Instancing"}], "answer": 3, "explain": {"en": "Instancing draws many copies of the same mesh cheaply. Merged Mesh suits big solid things like buildings and landmarks.", "uk": "Instancing дешево малює багато копій того самого меша. Merged Mesh пасує великим суцільним речам, як-от будівлі й орієнтири."}}, {"q": {"en": "You press Play in L_Island and find yourself walking on the beach. How do you fly instead?", "uk": "Ти натискаєш Play в L_Island і опиняєшся на пляжі пішки. Як натомість літати?"}, "options": [{"en": "Turn off World Partition", "uk": "Вимкнути World Partition"}, {"en": "Set World Settings > GameMode Override to GameModeBase, whose built-in pawn flies", "uk": "Встановити World Settings > GameMode Override на GameModeBase, вбудований pawn якого літає"}, {"en": "Delete the Player Start", "uk": "Видалити Player Start"}, {"en": "Hide DL_Water", "uk": "Сховати DL_Water"}], "answer": 1, "explain": {"en": "The game mode chooses the pawn. GameModeBase's default pawn flies, and the override changes this level only.", "uk": "Game mode вибирає pawn. Pawn за замовчуванням у GameModeBase літає, а override змінює лише цей рівень."}}], "weekInfo": {"week": 7, "title": {"en": "Roads, the big world and a first forest", "uk": "Дороги, великий світ і перший ліс"}, "goal": {"en": "By Friday you have roads that follow the land, island-scale light with landmarks and vistas, L_Island organised with World Partition, Data Layers and HLODs, and a first PCG forest filling one valley.", "uk": "До п'ятниці в тебе є дороги, що йдуть за рельєфом, світло в масштабі острова з орієнтирами й панорамами, L_Island, упорядкований за допомогою World Partition, Data Layers і HLOD, і перший PCG-ліс, що заповнює одну долину."}, "skills": [{"en": "Landscape spline roads built to real grades in Unreal Engine 5", "uk": "Дороги зі сплайнів ландшафту зі справжніми ухилами в Unreal Engine 5"}, {"en": "World Partition, Data Layer and HLOD set-up for large open worlds", "uk": "Налаштування World Partition, Data Layers і HLOD для великих відкритих світів"}, {"en": "Atmosphere, light, landmarks and vistas for open-world composition", "uk": "Атмосфера, світло, орієнтири й панорами в композиції відкритого світу"}, {"en": "Reading production PCG graphs and migrating assets between Unreal projects", "uk": "Читання продакшн-графів PCG і перенесення асетів між проєктами Unreal"}]}, "morning": {"sofar": {"en": "Your island has land, water, roads, one light recipe, three landmarks and three vista cameras.", "uk": "На твоєму острові є земля, вода, дороги, один рецепт світла, три орієнтири й три камери на краєвиди."}, "today": {"en": "You set up L_Island as a big world, with a World Partition grid, eight Data Layers, and HLODs that show the whole island from far out at sea.", "uk": "Сьогодні ти налаштовуєш L_Island як великий світ: сітка World Partition, вісім Data Layers і HLOD, що показують увесь острів здалеку, з моря."}, "cheer": {"en": "This is one of the most technical days of the course, so go step by step and lean on your tutor as much as you like.", "uk": "Це один із найтехнічніших днів курсу, тож іди крок за кроком і спирайся на тьютора скільки завгодно."}, "quote": {"text": {"en": "Optimism is the faith that leads to achievement; nothing can be done without hope.", "uk": "Оптимізм — це віра, що веде до звершень; без надії нічого не можна зробити."}, "author": {"en": "Helen Keller", "uk": "Гелен Келлер"}, "source": "https://en.wikiquote.org/wiki/Helen_Keller"}}, "hasAssets": false, "workPath": "Work\\Assignment\\Day-33-world-partition-data-layers-hlods", "mapHref": "../../COURSE.html", "prevHref": "../Day-32-island-light-landmarks-vistas/START-HERE.html", "nextHref": "../Day-34-electric-dreams-pcg-forest/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Unreal Engine 5.8. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me and don't write code. Keep me moving and make it feel like a game.\n\nToday I build on my own: The flying Play test, the Data Layers and the HLODs, on your own.\nIt's part of: L_Island organised as a big world: its World Partition grid set and tested in Play, eight Data Layers, the always-needed actors kept out of streaming, and HLODs set to reach across the island and built, so the far island still shows (L_Island, the whole island.).\n\nSpec:\n- World Settings > World Partition Setup > Runtime Hash > Runtime Partitions: the first partition's (named MainPartition or MainGrid) Cell Size 12800 (128 m) and Loading Range 51200 (512 m); the defaults you found, and what you saw in Play, written in world_notes.md.\n- The World Partition editor showing a minimap built with Build > Build World Partition Editor Minimap; you work with only the region you need loaded (Load Region From Selection), and memory before and after is noted.\n- Is Spatially Loaded unticked on the sun, Sky Light, Sky Atmosphere, Height Fog, Volumetric Cloud, Post Process Volume, ocean and Water Zone, so they are always there.\n- Eight Data Layer assets in /Game/Island/DataLayers, type Editor: DL_Water, DL_Landmarks, DL_Forest, DL_Biomes, DL_Detail, DL_KeepOuts, DL_District1 and DL_District2; the river and lake on DL_Water and the landmarks on DL_Landmarks; the ocean on no layer.\n- HLODs: the level's Default HLOD Layer (set by the engine when L_Island was made, for example HLODLayer_Instanced, type Instancing) and its parent read and written in world_notes.md; HLOD_Merged (Merged Mesh) made in /Game/Island/HLOD, listed in the last row of the HLOD Partitions and set on the three landmarks; the farthest HLOD row reaching 2 km (204800); HLODs built with no errors.\n- Play flies: GameMode Override set to GameModeBase for this level and a Player Start 30 m above your harbour; the island and its landmarks still show from 800 m out at sea.\n\nMy checklist:\n1. In World Settings open World Partition Setup > Runtime Hash > Runtime Partitions > the first partition > Main Partition; write down the default Cell Size and Loading Range, then set 12800 and 51200. Check: world_notes.md has both pairs of numbers. (from lesson 1)\n2. Open the World Partition editor, take a screenshot of it as your 'before', then choose Build > Build World Partition Editor Minimap in the main menu bar. Check: a top view of your island fills the World Partition editor. (from lesson 1)\n3. Load only the region round your harbour; note memory in Task Manager before and after. Check: the rest of the island shows as unloaded, and memory dropped. (from lesson 1)\n4. Untick Is Spatially Loaded on the sun, Sky Light, Sky Atmosphere, Height Fog, clouds, Post Process Volume, ocean and Water Zone. Check: they stay in the viewport when you unload every region. (from lesson 1)\n5. Set up flying in Play: GameMode Override GameModeBase and a Player Start 30 m above the harbour. If your road surface is missing in Play, choose Build > Build Landscape Spline Meshes and Play again. Check: Play puts you in the air and the keys fly you. (from lesson 2)\n6. In Play, show the loading cells with wp.Runtime.ToggleDrawRuntimeHash2D and fly 1 km out and back; write what you saw. Check: the cell map shows cells loading round you, and world_notes.md describes any pop-in. (from lesson 2)\n7. Make the eight Data Layer assets and set each to Editor. Check: eight DL_ assets sit in /Game/Island/DataLayers. (from lesson 3)\n8. Add them to the Data Layer Outliner; put the river and lake on DL_Water and the landmarks on DL_Landmarks. Check: hiding DL_Water hides the river and lake but not the ocean. (from lesson 3)\n9. Read the Default HLOD Layer (open it: Layer Type and Parent Layer). Make HLOD_Merged (Merged Mesh) in /Game/Island/HLOD, add it to the last row of HLOD Partitions, set the Loading Ranges (last row 204800, first row 102400 if there are two) and set HLOD_Merged on the three landmarks. Check: world_notes.md names each HLOD layer, its type and range, and each landmark's Details shows HLOD_Merged. (from lesson 4)\n10. Build the HLODs (Build > Build HLODs). Check: the build finishes with no errors in the Message Log. (from lesson 4)\n11. Play, fly 800 m out to sea and turn round. Check: the island and its landmarks still show on the horizon; hlod_far.png is saved. (from lesson 4)\n12. Before/after capture: the World Partition editor before and after the minimap; then a 60-second clip flying round the coast in Play. Check that you also have wp_editor.png and datalayers.png (each is described in today's hand-in list; take any you are missing now). Check: before_after_day33.png and flythrough_day33.mp4 are saved. (from lesson 2)\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Anna\nDay 33: The big world: World Partition, Data Layers and HLODs. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; quiz: <score> of 5\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

 let x=0,o='';for(const ch of str){if(ch===' '){x+=8;continue}if(ch==='/'){o+='<path class="on" d="M'+(x+9)+' 2L'+(x+2)+' '+(H-2)+'L'+(x+4.5)+' '+(H-2)+'L'+(x+11.5)+' 2Z"/>';x+=15;continue}const on=SEG[ch]||'';
  for(const k of 'abcdefg')o+='<polygon class="'+(on.includes(k)?'on':'gh')+'" points="'+P[k].map(p=>(p[0]+x).toFixed(1)+','+p[1].toFixed(1)).join(' ')+'"/>';x+=W+5}
 return '<svg class="seg7'+(cls?' '+cls:'')+'" viewBox="-1 -1 '+(x-3)+' '+(H+2)+'" aria-hidden="true" focusable="false"><g transform="skewX(-6) translate(2 0)">'+o+'</g></svg>'}

 const smooth=(P,closed)=>{let d='M'+f(P[0][0])+' '+f(P[0][1]);const n=P.length,g=i=>P[closed?(i+n)%n:Math.max(0,Math.min(n-1,i))];

 const ring=(s,k)=>{const P=[];for(let i=0;i<64;i++)P.push(pt(i/64*TAU,s,k));return smooth(P,true)};
 let o='<path class="c0" d="'+ring(1,0)+'"/>';
 [.84,.69,.55,.42,.3,.19,.1].forEach((s,k)=>o+='<path class="c" d="'+ring(s,k+1)+'"/>');
 const t0=-2.2,turns=1.55,wp=w=>{const t=(w-1)/11;return {a:t0+t*turns*TAU,s:1.1-t*.98}};
 const P=[],D=[];let last=0;for(let w=1;w<=12;w++)if(state(w)!=='p')last=w;
 for(let i=0;i<=110;i++){const t=i/110,a=t0+t*turns*TAU,s=1.1-t*.98,q=pt(a,s,0);P.push(q);if(last&&t<=(last-1)/11+1e-9)D.push(q)}

 for(let w=1;w<=12;w++){const c=state(w),{a,s}=wp(w),q=pt(a,s,0),lx=q[0]+(Math.cos(a)>=0?15:-15),an=Math.cos(a)>=0?'start':'end';

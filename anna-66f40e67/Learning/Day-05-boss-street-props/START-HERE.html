<script id="data" type="application/json">{"learner": "ib-anna-66f40e67", "learnerName": {"en": "Anna", "uk": "Анна"}, "day": 5, "week": 1, "total": 60, "title": {"en": "Boss: your street-prop set in Unreal, at real scale", "uk": "День боса: твій набір вуличних пропсів в Unreal у реальному масштабі"}, "theme": {"en": "Week 1: Blender from zero", "uk": "Тиждень 1: Blender з нуля"}, "build": {"item": {"en": "Your street-prop set: bollard, bench, lamp post and bin, clean and at real scale in Unreal", "uk": "Твій набір вуличних пропсів: стовпчик, лавка, ліхтарний стовп і урна, чисті й у реальному масштабі в Unreal"}, "why": {"en": "A prop set is a group of models that belong together and share one style and one scale. Art directors judge a set by putting it beside real photos: if the bench looks big next to the bin, the whole street feels like a toy. Today you finish all four to the same standard, against the clock, the way studios run art tests. These props come back on Day 43 to furnish your island's waterfront.", "uk": "Набір пропсів — це група моделей, які пасують одна до одної й мають спільний стиль і масштаб. Арт-директори оцінюють набір, ставлячи його поруч зі справжніми фото: якщо лавка виглядає завеликою поруч з урною, уся вулиця здається іграшковою. Сьогодні ти доводиш усі чотири пропси до одного рівня, на час, так, як студії проводять арт-тести. Ці пропси повернуться в День 43, щоб облаштувати набережну твого острова."}, "where": {"en": "A practice street corner in Course/Day05; later, the waterfront promenade of your island (district 1).", "uk": "Тренувальний куточок вулиці в Course/Day05; згодом — прогулянкова набережна твого острова (район 1)."}, "spec": [{"en": "All four props as FBX with UCX collision: SM_Bollard, SM_Bench, SM_LampPost and SM_Bin, each at real size, with its origin at the base centre, transforms applied and triangles within budget.", "uk": "Усі чотири пропси у FBX з колізією UCX: SM_Bollard, SM_Bench, SM_LampPost і SM_Bin, кожен у реальному розмірі, з origin у центрі основи, застосованими трансформаціями й трикутниками в межах бюджету."}, {"en": "Simple materials from the photos on each prop (Base Color, Roughness and Metallic), named with M_, for example M_Bench_Iron and M_Bench_Timber.", "uk": "Прості матеріали за фото на кожному пропсі (Base Color, Roughness і Metallic) з назвами на M_, наприклад M_Bench_Iron і M_Bench_Timber."}, {"en": "In Unreal (Course/Day05): all four on the floor beside the mannequin, nothing floating or sunk, placed like a real street corner: three bollards about 1.5 m apart in a line, the bench behind them facing out, the bin beside the bench and the lamp post behind.", "uk": "В Unreal (Course/Day05): усі чотири на підлозі поруч із манекеном, нічого не висить у повітрі й не провалюється, розставлені як справжній куточок вулиці: три стовпчики в ряд приблизно через 1.5 м, лавка позаду них обличчям назовні, урна поруч із лавкою, а ліхтарний стовп позаду."}, {"en": "corner_eye.png and corner_5m.png: the corner from eye height and from about 5 m up.", "uk": "corner_eye.png і corner_5m.png: куточок із висоти очей і приблизно з 5 м угорі."}, {"en": "compare_day5.png: a Krita sheet with each prop's Unreal screenshot beside its real photo (Gold).", "uk": "compare_day5.png: аркуш у Krita, де скриншот кожного пропса з Unreal стоїть поруч із його справжнім фото (Золото)."}, {"en": "rubric_day5.md: ten yes or no lines, checked with the tutor.", "uk": "rubric_day5.md: десять рядків «так» чи «ні», перевірених разом із тьютором."}], "piece1": "the bench: materials, collision and a clean FBX (in the lessons)", "piece2": {"en": "The whole street-prop set, finished and placed, on your own and timed (start a 4-hour timer)", "uk": "Увесь набір вуличних пропсів, завершений і розставлений, самостійно і на час (запусти таймер на 4 години)"}, "steps": [{"text": {"en": "Start a 4-hour timer. Open plan_day5.md from lesson 1 and check your minute plan: Bronze by hour 2, Silver by hour 3, Gold in hour 4. Check: the plan names every job and its minutes.", "uk": "Запусти таймер на 4 години. Відкрий plan_day5.md з уроку 1 і перевір свій поминутний план: Бронза до кінця 2-ї години, Срібло до кінця 3-ї, Золото — на 4-й годині. Перевірка: у плані названо кожну задачу та її хвилини."}, "lesson": 1}, {"text": {"en": "Lamp post: Save As lamp_day5_v01.blend, add UCX boxes (pole, base, and one for the arm and lantern), named UCX_SM_LampPost_00 and up, and export SM_LampPost.fbx. Check: three or four boxes, all with the lamp's origin.", "uk": "Ліхтарний стовп: Save As lamp_day5_v01.blend, додай блоки UCX (стовп, основа і один на кронштейн із плафоном) з назвами UCX_SM_LampPost_00 і далі та експортуй SM_LampPost.fbx. Перевірка: три або чотири блоки, усі з origin ліхтаря."}, "lesson": "D4.3"}, {"text": {"en": "Bench: if you didn't finish it in lesson 2, add UCX boxes (one for the seat and back, one per side frame) and export SM_Bench.fbx. Check: the boxes leave the space under the seat open.", "uk": "Лавка: якщо на уроці 2 її не завершено, додай блоки UCX (один на сидіння й спинку, по одному на кожну боковину) й експортуй SM_Bench.fbx. Перевірка: блоки лишають простір під сидінням відкритим."}, "lesson": "D4.4"}, {"text": {"en": "Import the lamp post and the bench into Course/Day05, then import SM_Bollard.fbx and SM_Bin.fbx from Day 4 there too. Open each in the Static Mesh Editor and compare Approx Size with your sizes files. Check: every size is within 10 % of your notes.", "uk": "Імпортуй ліхтарний стовп і лавку в Course/Day05, а тоді імпортуй туди ж SM_Bollard.fbx і SM_Bin.fbx з Дня 4. Відкрий кожен у Static Mesh Editor і порівняй Approx Size зі своїми файлами розмірів. Перевірка: кожен розмір у межах 10 % від твоїх нотаток."}, "lesson": "D4.4"}, {"text": {"en": "Place all four beside the mannequin with End and walk past them in Play. Bronze check: save L_Day05 (Ctrl+S) and take bronze.png. Check: nothing floats, nothing sinks, and each prop looks the right size next to the mannequin.", "uk": "Постав усі чотири поруч із манекеном через End і пройди повз них у Play. Перевірка Бронзи: збережи L_Day05 (Ctrl+S) і зроби bronze.png. Перевірка: нічого не висить, нічого не провалюється, і кожен пропс поруч із манекеном виглядає правильного розміру."}, "lesson": 3}, {"text": {"en": "Materials: give the bollard, the lamp post and the bin simple materials from their photos (for example dark painted iron, Roughness 0.5, Metallic 0; galvanised steel, Roughness 0.4, Metallic 1). Save each file as _v02. Check: in Material Preview, each prop looks like its photo in colour and shine.", "uk": "Матеріали: дай стовпчику, ліхтарному стовпу й урні прості матеріали за їхніми фото (наприклад, темне фарбоване залізо: Roughness 0.5, Metallic 0; оцинкована сталь: Roughness 0.4, Metallic 1). Збережи кожен файл як _v02. Перевірка: у Material Preview кожен пропс за кольором і блиском схожий на своє фото."}, "lesson": 2}, {"text": {"en": "Export each prop again with the same file name and right-click each mesh in Unreal > Reimport. Check: the props in the level show their new colours.", "uk": "Експортуй кожен пропс ще раз із тією самою назвою файлу і в Unreal клацни правою кнопкою на кожній сітці > Reimport. Перевірка: пропси в рівні показують нові кольори."}, "lesson": 2}, {"text": {"en": "Arrange the street corner: three bollards 1.5 m apart (Location X 0, 150, 300), the bench behind them facing out, the bin 0.5 m beside the bench and the lamp post about 1 m behind. Check: from above it reads as a tidy pavement corner.", "uk": "Розстав куточок вулиці: три стовпчики через 1.5 м (Location X 0, 150, 300), лавка позаду них обличчям назовні, урна за 0.5 м від лавки, а ліхтарний стовп приблизно на 1 м позаду. Перевірка: згори це читається як охайний куточок тротуару."}, "lesson": 3}, {"text": {"en": "Silver check: take corner_eye.png from about 1.7 m high and corner_5m.png from about 5 m up. Check: both screenshots show all four props clearly.", "uk": "Перевірка Срібла: зроби corner_eye.png з висоти приблизно 1.7 м і corner_5m.png приблизно з 5 м угорі. Перевірка: на обох скриншотах чітко видно всі чотири пропси."}, "lesson": 3}, {"text": {"en": "Gold: make compare_day5.png in Krita: for each prop, your best photo beside your Unreal screenshot, both the same height. Write one line under each pair. Check: four pairs, and in each pair the proportions match.", "uk": "Золото: зроби compare_day5.png у Krita: для кожного пропса — твоє найкраще фото поруч зі скриншотом з Unreal, обидва однакової висоти. Напиши по рядку під кожною парою. Перевірка: чотири пари, і в кожній пропорції збігаються."}, "lesson": 3}, {"text": {"en": "Gold: make the railing section clean too: rename it SM_RailingSection, add UCX boxes (one per post, one for the rails and bars) and a material, export SM_RailingSection.fbx, import it and place it along the back of the corner. Check: it stands on the floor and reaches about the mannequin's waist.", "uk": "Золото: зроби чистою й секцію поруччя: перейменуй її на SM_RailingSection, додай блоки UCX (по одному на кожну стійку, один на поручні й балясини) і матеріал, експортуй SM_RailingSection.fbx, імпортуй і постав її вздовж задньої сторони куточка. Перевірка: вона стоїть на підлозі й сягає приблизно пояса манекена."}, "lesson": "D4.4"}, {"text": {"en": "Self-review: fill in rubric_day5.md line by line with the tutor and fix the worst 'no' first. Check: every line has a yes or a no, and the worst fault is fixed.", "uk": "Самоперевірка: заповни rubric_day5.md рядок за рядком разом із тьютором і спершу виправ найгірше «ні». Перевірка: у кожному рядку стоїть «так» або «ні», а найгіршу помилку виправлено."}, "lesson": 4}, {"text": {"en": "Captures: before_after_day5.png (your Day 1 bollard in Blender beside the finished corner in Unreal) and a 60-second clip walking the mannequin round the corner. Save today's clip as clip_day5.mp4. Check: both files are in today's Work folder.", "uk": "Знімки й запис: before_after_day5.png (твій стовпчик з Дня 1 у Blender поруч із готовим куточком в Unreal) і 60-секундний кліп, де манекен обходить куточок. Збережи сьогоднішній кліп як clip_day5.mp4. Перевірка: обидва файли лежать у сьогоднішній папці Work."}, "lesson": "D0.1"}], "boss": [{"en": "Bronze: all four props exported as FBX with UCX boxes, imported into Course/Day05, each within 10 % of its real size and standing on the floor beside the mannequin.", "uk": "Бронза: усі чотири пропси експортовано у FBX із блоками UCX та імпортовано в Course/Day05, кожен у межах 10 % від свого реального розміру, і всі стоять на підлозі поруч із манекеном."}, {"en": "Silver: Bronze, plus simple materials from photos on every prop, the props placed as a believable street corner, and the two corner screenshots.", "uk": "Срібло: Бронза плюс прості матеріали за фото на кожному пропсі, пропси розставлено як правдоподібний куточок вулиці, і є два скриншоти куточка."}, {"en": "Gold: Silver, plus compare_day5.png (each prop beside its real photo), the railing section clean and placed, and every rubric line a yes, all within 4 hours.", "uk": "Золото: Срібло плюс compare_day5.png (кожен пропс поруч зі своїм справжнім фото), чиста й розставлена секція поруччя, і кожен рядок рубрики — «так», усе за 4 години."}], "assets": ["island12/art-director-notes.md"]}, "lessons": [{"title": {"en": "Planning a timed build: tiers, minutes and numbered saves", "uk": "Плануємо роботу на час: рівні, хвилини й нумеровані збереження"}, "minutes": 40, "goals": [{"en": "Plan a timed build so you have something to hand in after every tier: Bronze first, then Silver, then Gold.", "uk": "Планувати роботу на час так, щоб після кожного рівня було що здати: спершу Бронза, потім Срібло, потім Золото."}, {"en": "Give each job a minute budget and check the clock every 30 minutes.", "uk": "Давати кожній задачі бюджет у хвилинах і звіряти годинник кожні 30 хвилин."}, {"en": "Save numbered versions (File > Save As: name_v01, name_v02 ...) so one bad step never costs the afternoon.", "uk": "Зберігати нумеровані версії (File > Save As: name_v01, name_v02 ...), щоб один невдалий крок ніколи не коштував тобі всього пообіддя."}], "doalong": [{"en": "Read the three tiers of today's Boss and write them in your own words in plan_day5.md.", "uk": "Прочитай три рівні сьогоднішнього Дня боса і запиши їх своїми словами в plan_day5.md."}, {"en": "List every job for Bronze (collision and FBX for the lamp post, import, place) and give each a minute budget. Do the same for Silver and Gold. Leave 30 minutes spare.", "uk": "Перелічи всі задачі для Бронзи (колізія і FBX для ліхтарного стовпа, імпорт, розміщення) і дай кожній бюджет у хвилинах. Те саме зроби для Срібла й Золота. Залиш 30 хвилин у запасі."}, {"en": "Open bench_day2.blend and use File > Save As to save bench_day5_v01.blend in today's Work folder. The title bar now shows the new name: you will keep the old file safe whatever happens.", "uk": "Відкрий bench_day2.blend і через File > Save As збережи bench_day5_v01.blend у сьогоднішній папці Work. Тепер у заголовку вікна нова назва: старий файл лишиться в безпеці, хоч би що сталося."}, {"en": "Set a timer to ring every 30 minutes for a progress screenshot (the Windows Clock app > Timer, or your phone).", "uk": "Постав таймер, що дзвонить кожні 30 хвилин, для скриншота прогресу (застосунок Windows Clock > Timer або телефон)."}, {"en": "Write one rule for when you are stuck for more than 10 minutes, for example: send the tutor a screenshot, or move on to the next job and come back.", "uk": "Запиши одне правило на випадок, коли застрягаєш довше ніж на 10 хвилин, наприклад: надіслати тьютору скриншот або перейти до наступної задачі й повернутися пізніше."}], "play": {"en": "What first? The tutor fires eight pairs of jobs at me ('materials or collision?', 'the Gold railing or the Bronze import?'); I pick the one that comes first in a timed Boss, in 5 seconds each.", "uk": "Що спершу? Тьютор кидає мені вісім пар задач («матеріали чи колізія?», «поруччя на Золото чи імпорт на Бронзу?»); я вибираю ту, що в Дні боса на час іде першою, по 5 секунд на кожну пару."}, "video": {"search": "how to plan a timed 3d art test"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Planning a timed build: tiers, minutes and numbered saves (Day 5, lesson 1 of 4).\nToday's build: Your street-prop set: bollard, bench, lamp post and bin, clean and at real scale in Unreal.\n\nBy the end of this lesson I can:\n1. Plan a timed build so you have something to hand in after every tier: Bronze first, then Silver, then Gold.\n2. Give each job a minute budget and check the clock every 30 minutes.\n3. Save numbered versions (File > Save As: name_v01, name_v02 ...) so one bad step never costs the afternoon.\n\nHow to run the lesson:\n1. Morning welcome (short and warm, in 4 lines): tell me what I have achieved so far (In four days you have modelled four street props to real measurements and learned the clean game export with collision.), what I will learn today (It is Boss day: your bollard, bench, lamp post and bin become a small street corner in Unreal, with simple materials and a sheet beside real photos.), encourage me (Bronze is built to be within your reach, so lock it in first and climb towards Silver or Gold with whatever time is left.), and share today's quote: \"Genius is one percent inspiration, ninety-nine percent perspiration.\" (Thomas Edison).\n2. Warm-up: ask me these review questions one at a time and correct me kindly: Day 2: Your bench seat is 0.6 m high. What will players feel, and what is a usual seat height? | Day 0: What is the difference between Object Mode and Edit Mode?\n3. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n4. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n5. Game for this lesson: What first? The tutor fires eight pairs of jobs at me ('materials or collision?', 'the Gold railing or the Bronze import?'); I pick the one that comes first in a timed Boss, in 5 seconds each.\n6. Do-along on today's build (the bench: materials, collision and a clean FBX (in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Read the three tiers of today's Boss and write them in your own words in plan_day5.md.\n   - List every job for Bronze (collision and FBX for the lamp post, import, place) and give each a minute budget. Do the same for Silver and Gold. Leave 30 minutes spare.\n   - Open bench_day2.blend and use File > Save As to save bench_day5_v01.blend in today's Work folder. The title bar now shows the new name: you will keep the old file safe whatever happens.\n   - Set a timer to ring every 30 minutes for a progress screenshot (the Windows Clock app > Timer, or your phone).\n   - Write one rule for when you are stuck for more than 10 minutes, for example: send the tutor a screenshot, or move on to the next job and come back.\n7. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n8. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Simple materials: colour, roughness and metal from a photo", "uk": "Прості матеріали: колір, шорсткість і метал за фото"}, "minutes": 40, "goals": [{"en": "Explain a material: the settings that tell the computer what a surface looks like (its colour, how shiny it is, whether it is metal).", "uk": "Пояснювати, що таке матеріал: налаштування, які кажуть комп'ютеру, як виглядає поверхня (її колір, наскільки вона блищить, чи це метал)."}, {"en": "Give an object a material in Material Properties and set the Principled BSDF's Base Color, Roughness and Metallic.", "uk": "Давати об'єкту матеріал у Material Properties і задавати Base Color, Roughness і Metallic у Principled BSDF."}, {"en": "Give one object two materials with material slots and Assign in Edit Mode.", "uk": "Давати одному об'єкту два матеріали через слоти матеріалів і Assign в Edit Mode."}, {"en": "Re-export with the same name and update the mesh in Unreal with right-click > Reimport.", "uk": "Повторно експортувати з тією самою назвою й оновлювати сітку в Unreal через правий клік > Reimport."}], "doalong": [{"en": "In bench_day5_v01.blend, select the bench. In the Properties editor, click the red sphere icon (Material Properties) and click New. A Principled BSDF panel appears: Blender's standard material. Press Z > Material Preview to see materials in the viewport.", "uk": "У bench_day5_v01.blend виділи лавку. У Properties editor клацни значок червоної сфери (Material Properties) і натисни New. З'являється панель Principled BSDF — стандартний матеріал Blender. Натисни Z > Material Preview, щоб бачити матеріали у в'юпорті."}, {"en": "Name the material M_Bench_Iron (M_ is the studio prefix for materials). Base Color is the surface colour: pick dark green or black for painted iron. Roughness is how matt it is (0 is a mirror, 1 is chalk): set 0.5. Metallic stays 0, because you see the paint, not the metal.", "uk": "Назви матеріал M_Bench_Iron (M_ — студійний префікс для матеріалів). Base Color — це колір поверхні: для фарбованого заліза вибери темно-зелений або чорний. Roughness — наскільки поверхня матова (0 — дзеркало, 1 — крейда): встанови 0.5. Metallic лишається 0, бо ти бачиш фарбу, а не метал."}, {"en": "Click the + beside the material list to add a second slot, click New and name it M_Bench_Timber: a warm brown, Roughness 0.8, Metallic 0.", "uk": "Натисни + біля списку матеріалів, щоб додати другий слот, натисни New і назви його M_Bench_Timber: теплий коричневий, Roughness 0.8, Metallic 0."}, {"en": "Tab into Edit Mode, hover over a slat and press L: every face of that slat is selected. Add the other slats the same way with L. Click M_Bench_Timber in the list and click Assign. Tab out: the slats are timber and the frames are iron.", "uk": "Перейди в Edit Mode (Tab), наведи мишу на планку й натисни L: виділяються всі грані цієї планки. Так само через L додай інші планки. Клацни M_Bench_Timber у списку й натисни Assign. Вийди з Edit Mode (Tab): планки дерев'яні, а боковини залізні."}, {"en": "Add the bench's UCX boxes as on Day 4 (one for the seat and back, one per side frame), export SM_Bench.fbx and import it into a new folder Course/Day05. The import brings the two materials with it. Unreal shows their colours; the shine (Roughness and Metallic) may look different until Day 12, when you build materials inside Unreal.", "uk": "Додай блоки UCX лавки, як у День 4 (один на сидіння й спинку, по одному на кожну боковину), експортуй SM_Bench.fbx та імпортуй у нову папку Course/Day05. Імпорт приносить із собою обидва матеріали. Unreal показує їхні кольори; блиск (Roughness і Metallic) може виглядати інакше аж до Дня 12, коли ти будуватимеш матеріали всередині Unreal."}, {"en": "Make the timber a little lighter in Blender, export again with the same name, then in Unreal right-click the bench mesh in the Content Browser > Reimport. The bench in the level updates.", "uk": "Зроби дерево трохи світлішим у Blender, експортуй ще раз із тією самою назвою, а тоді в Unreal клацни правою кнопкою на сітці лавки в Content Browser > Reimport. Лавка в рівні оновлюється."}], "play": {"en": "Material guess: the tutor names six surfaces (wet stone, dry timber, a painted iron bench, a stainless steel bin, a rubber tyre, a glass lamp); I give each a Roughness and a Metallic value, and score a point for each within 0.2 of the tutor's.", "uk": "Вгадай матеріал: тьютор називає шість поверхонь (мокрий камінь, сухе дерево, фарбована залізна лавка, урна з нержавійки, гумова шина, скляний ліхтар); я даю кожній значення Roughness і Metallic і отримую бал за кожне, що відрізняється від тьюторового не більше ніж на 0.2."}, "video": {"url": "https://www.youtube.com/watch?v=53Rdzthjuu0", "title": "Video Game Textures Explained! (Blender 4.0+ Tutorial)", "channel": "Vertex Arcade", "length": "5:29", "search": "blender pbr textures roughness metallic normal", "alt": {"url": "https://www.youtube.com/watch?v=JtQyLrz-EZs", "title": "Як працювати з PBR текстурами та робити UV розгортку", "channel": "Sabina Frolova"}}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Simple materials: colour, roughness and metal from a photo (Day 5, lesson 2 of 4).\nToday's build: Your street-prop set: bollard, bench, lamp post and bin, clean and at real scale in Unreal.\nEarlier today I already did: lesson 1 (Planning a timed build: tiers, minutes and numbered saves). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Explain a material: the settings that tell the computer what a surface looks like (its colour, how shiny it is, whether it is metal).\n2. Give an object a material in Material Properties and set the Principled BSDF's Base Color, Roughness and Metallic.\n3. Give one object two materials with material slots and Assign in Edit Mode.\n4. Re-export with the same name and update the mesh in Unreal with right-click > Reimport.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Material guess: the tutor names six surfaces (wet stone, dry timber, a painted iron bench, a stainless steel bin, a rubber tyre, a glass lamp); I give each a Roughness and a Metallic value, and score a point for each within 0.2 of the tutor's.\n4. Do-along on today's build (the bench: materials, collision and a clean FBX (in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - In bench_day5_v01.blend, select the bench. In the Properties editor, click the red sphere icon (Material Properties) and click New. A Principled BSDF panel appears: Blender's standard material. Press Z > Material Preview to see materials in the viewport.\n   - Name the material M_Bench_Iron (M_ is the studio prefix for materials). Base Color is the surface colour: pick dark green or black for painted iron. Roughness is how matt it is (0 is a mirror, 1 is chalk): set 0.5. Metallic stays 0, because you see the paint, not the metal.\n   - Click the + beside the material list to add a second slot, click New and name it M_Bench_Timber: a warm brown, Roughness 0.8, Metallic 0.\n   - Tab into Edit Mode, hover over a slat and press L: every face of that slat is selected. Add the other slats the same way with L. Click M_Bench_Timber in the list and click Assign. Tab out: the slats are timber and the frames are iron.\n   - Add the bench's UCX boxes as on Day 4 (one for the seat and back, one per side frame), export SM_Bench.fbx and import it into a new folder Course/Day05. The import brings the two materials with it. Unreal shows their colours; the shine (Roughness and Metallic) may look different until Day 12, when you build materials inside Unreal.\n   - Make the timber a little lighter in Blender, export again with the same name, then in Unreal right-click the bench mesh in the Content Browser > Reimport. The bench in the level updates.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"Video Game Textures Explained! (Blender 4.0+ Tutorial)\" by Vertex Arcade: https://www.youtube.com/watch?v=53Rdzthjuu0\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "A street corner at real scale, and a photo comparison sheet", "uk": "Куточок вулиці в реальному масштабі й аркуш порівняння з фото"}, "minutes": 40, "goals": [{"en": "Place props like a real street: spacing, facing and distance, checked against the mannequin.", "uk": "Розставляти пропси як на справжній вулиці: інтервали, напрям і відстані, перевірені поруч із манекеном."}, {"en": "Take two screenshots that show the set clearly: one at eye height, one from about 5 m up.", "uk": "Робити два скриншоти, на яких набір добре видно: один із висоти очей, другий приблизно з 5 м угорі."}, {"en": "Make a comparison sheet in Krita: a prop's screenshot beside its real photo.", "uk": "Робити аркуш порівняння в Krita: скриншот пропса поруч із його справжнім фото."}], "doalong": [{"en": "In the template level, click File > Save Current Level As, open Course/Day05 and name it L_Day05: a level is one map in Unreal, and now you have your own copy to work in. Drag the bench in near the mannequin and press End, then drag in the bollard from Course/Day04 too.", "uk": "У рівні шаблону натисни File > Save Current Level As, відкрий Course/Day05 і назви рівень L_Day05: рівень — це одна мапа в Unreal, і тепер у тебе є власна копія для роботи. Перетягни лавку ближче до манекена й натисни End, а тоді перетягни й стовпчик із Course/Day04."}, {"en": "Put three bollards in a line about 1.5 m apart: select one and type Location X values 150 cm apart in the Details panel (for example 0, 150 and 300), pressing End after each.", "uk": "Постав три стовпчики в ряд приблизно через 1.5 м: виділи один і вводь у панелі Details значення Location X із кроком 150 см (наприклад, 0, 150 і 300), натискаючи End після кожного."}, {"en": "Turn the bench with Rotation Z in the Details panel (try 90 or 180) until it faces the bollards, and set it about 1.5 m behind them.", "uk": "Поверни лавку через Rotation Z у панелі Details (спробуй 90 або 180), доки вона не стане обличчям до стовпчиків, і постав її приблизно на 1.5 м позаду них."}, {"en": "Hold the right mouse button and fly with W, A, S and D to about eye height (1.7 m). Press Win+Shift+S and save the picture in today's Work folder as practice_eye.png.", "uk": "Утримуй праву кнопку миші й літай клавішами W, A, S і D приблизно на висоті очей (1.7 м). Натисни Win+Shift+S і збережи зображення в сьогоднішній папці Work як practice_eye.png."}, {"en": "In Krita: File > New, 2400 x 1200 px. Drag your bench photo onto the canvas and choose Insert as New Layer, then drag your screenshot in beside it. Press Ctrl+T (Transform) to make both the same height, then press Enter to finish. Export compare_bench.png.", "uk": "У Krita: File > New, 2400 x 1200 px. Перетягни фото лавки на полотно й вибери Insert as New Layer, а тоді перетягни поруч свій скриншот. Натисни Ctrl+T (Transform), щоб зробити обидва однакової висоти, а тоді Enter, щоб завершити. Експортуй compare_bench.png."}, {"en": "Look at the pair: are the proportions the same? Write one line about what you would change.", "uk": "Подивися на пару: чи однакові пропорції? Напиши один рядок про те, що варто змінити."}], "play": {"en": "Scale detective: from my practice_eye.png the tutor guesses the length of my bench and the height of the bollards; then I give the real numbers, and the tutor checks that the mannequin, the bench and the bollards agree.", "uk": "Детектив масштабу: за моїм practice_eye.png тьютор вгадує довжину моєї лавки й висоту стовпчиків; потім я називаю справжні числа, а тьютор перевіряє, чи узгоджуються між собою манекен, лавка і стовпчики."}, "video": {"url": "https://www.youtube.com/watch?v=tnaXNCaBQ4M", "title": "06 - Snapping, Pivot Points, and Duplication - Unreal Engine Stage Design Course", "channel": "SuperStage", "length": "7:21", "search": "unreal engine snapping pivot duplicate"}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: A street corner at real scale, and a photo comparison sheet (Day 5, lesson 3 of 4).\nToday's build: Your street-prop set: bollard, bench, lamp post and bin, clean and at real scale in Unreal.\nEarlier today I already did: lesson 1 (Planning a timed build: tiers, minutes and numbered saves); lesson 2 (Simple materials: colour, roughness and metal from a photo). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Place props like a real street: spacing, facing and distance, checked against the mannequin.\n2. Take two screenshots that show the set clearly: one at eye height, one from about 5 m up.\n3. Make a comparison sheet in Krita: a prop's screenshot beside its real photo.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Scale detective: from my practice_eye.png the tutor guesses the length of my bench and the height of the bollards; then I give the real numbers, and the tutor checks that the mannequin, the bench and the bollards agree.\n4. Do-along on today's build (the bench: materials, collision and a clean FBX (in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - In the template level, click File > Save Current Level As, open Course/Day05 and name it L_Day05: a level is one map in Unreal, and now you have your own copy to work in. Drag the bench in near the mannequin and press End, then drag in the bollard from Course/Day04 too.\n   - Put three bollards in a line about 1.5 m apart: select one and type Location X values 150 cm apart in the Details panel (for example 0, 150 and 300), pressing End after each.\n   - Turn the bench with Rotation Z in the Details panel (try 90 or 180) until it faces the bollards, and set it about 1.5 m behind them.\n   - Hold the right mouse button and fly with W, A, S and D to about eye height (1.7 m). Press Win+Shift+S and save the picture in today's Work folder as practice_eye.png.\n   - In Krita: File > New, 2400 x 1200 px. Drag your bench photo onto the canvas and choose Insert as New Layer, then drag your screenshot in beside it. Press Ctrl+T (Transform) to make both the same height, then press Enter to finish. Export compare_bench.png.\n   - Look at the pair: are the proportions the same? Write one line about what you would change.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"06 - Snapping, Pivot Points, and Duplication - Unreal Engine Stage Design Course\" by SuperStage: https://www.youtube.com/watch?v=tnaXNCaBQ4M\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}, {"title": {"en": "Self-review against a rubric", "uk": "Самоперевірка за рубрикою"}, "minutes": 40, "goals": [{"en": "Explain a rubric: a list of yes or no checks that says what 'done' means.", "uk": "Пояснювати, що таке рубрика: список перевірок «так» чи «ні», який визначає, що означає «готово»."}, {"en": "Check your own props line by line, honestly, before anyone else does.", "uk": "Перевіряти свої пропси рядок за рядком, чесно, раніше за будь-кого іншого."}, {"en": "Fix the worst fault first, and stop when the work is good enough to hand in.", "uk": "Спершу виправляти найгіршу помилку й зупинятися, коли робота досить добра, щоб її здати."}], "doalong": [{"en": "Write rubric_day5.md with ten yes or no lines: real size, origin at the base, transforms applied, triangles in budget, no gaps between parts, UCX boxes named right, FBX names right, materials from photos, standing on the floor, placed like a real street.", "uk": "Напиши rubric_day5.md з десятьма рядками «так» чи «ні»: реальний розмір, origin в основі, застосовані трансформації, трикутники в межах бюджету, немає щілин між частинами, блоки UCX названо правильно, назви FBX правильні, матеріали за фото, стоїть на підлозі, розставлено як на справжній вулиці."}, {"en": "Check the bench line by line and mark each line yes or no.", "uk": "Перевір лавку рядок за рядком і познач кожен рядок «так» або «ні»."}, {"en": "Pick the 'no' a player would notice first, and fix it.", "uk": "Вибери «ні», яке гравець помітить першим, і виправ його."}, {"en": "Export again, Reimport in Unreal, and check that line again.", "uk": "Експортуй ще раз, зроби Reimport в Unreal і знову перевір цей рядок."}, {"en": "Read your lines to the tutor. For each 'yes', the tutor asks one question; if you can't back it up, it becomes a 'no'.", "uk": "Прочитай свої рядки тьютору. На кожне «так» тьютор ставить одне запитання; якщо ти не можеш підтвердити відповідь, «так» стає «ні»."}], "play": {"en": "Cross-check: the tutor reads my rubric scores and asks one hard question per 'yes'; if I can't back a yes up with a screenshot or a number, it becomes a no.", "uk": "Перехресна перевірка: тьютор читає мої оцінки за рубрикою і ставить одне складне запитання на кожне «так»; якщо я не можу підтвердити «так» скриншотом чи числом, воно стає «ні»."}, "video": {"url": "https://www.youtube.com/watch?v=gf5yQQF-d0I", "title": "What Does Game-Ready Really Mean? / Game Asset Tips for 3D Artists", "channel": "Ali Cgi", "length": "5:24", "search": "what does game ready mean 3d asset checklist", "alt": {"url": "https://www.youtube.com/watch?v=li0AMSd8_C4", "title": "НАВІГАЦІЯ в Blender Українською", "channel": "Stanisslayer"}}, "prompt": "You are my hands-on tutor for one 40-minute lesson. Speak Ukrainian with me; keep menu names, tool names, panel names and keyboard shortcuts in English. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Don't write code, web pages or apps. Keep it lively and practical: one step per message, at most three instructions at a time, then wait for me.\n\nLesson: Self-review against a rubric (Day 5, lesson 4 of 4).\nToday's build: Your street-prop set: bollard, bench, lamp post and bin, clean and at real scale in Unreal.\nEarlier today I already did: lesson 1 (Planning a timed build: tiers, minutes and numbered saves); lesson 2 (Simple materials: colour, roughness and metal from a photo); lesson 3 (A street corner at real scale, and a photo comparison sheet). Things made there exist on my PC.\n\nBy the end of this lesson I can:\n1. Explain a rubric: a list of yes or no checks that says what 'done' means.\n2. Check your own props line by line, honestly, before anyone else does.\n3. Fix the worst fault first, and stop when the work is good enough to hand in.\n\nHow to run the lesson:\n1. Quick check: ask me 3 short multiple-choice questions on the goals, one at a time, always all 3. If I get all 3 right, say \"You know this: straight to the do-along\" and skip to the do-along; if I miss any, teach the goals.\n2. Teach each goal in turn: a short explanation, the exact clicks and shortcuts, then a 2-minute task for me to do. Ask me for a screenshot (Win+Shift+S, then paste it here) or a description of what I see, and check it before moving on.\n3. Game for this lesson: Cross-check: the tutor reads my rubric scores and asks one hard question per 'yes'; if I can't back a yes up with a screenshot or a number, it becomes a no.\n4. Do-along on today's build (the bench: materials, collision and a clean FBX (in the lessons)): guide me through these steps one at a time, checking a screenshot after each:\n   - Write rubric_day5.md with ten yes or no lines: real size, origin at the base, transforms applied, triangles in budget, no gaps between parts, UCX boxes named right, FBX names right, materials from photos, standing on the floor, placed like a real street.\n   - Check the bench line by line and mark each line yes or no.\n   - Pick the 'no' a player would notice first, and fix it.\n   - Export again, Reimport in Unreal, and check that line again.\n   - Read your lines to the tutor. For each 'yes', the tutor asks one question; if you can't back it up, it becomes a 'no'.\n5. Finish with 3 multiple-choice questions, one at a time, and tell me my score.\n6. Then write my lesson receipt as two short lines I can copy: \"Learned: ...\" and \"Hard: ...\".\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nRules: if my screen looks different from what you expect, say so and help me find it. If you're not sure about a detail, say so instead of guessing. My do-along steps are correct for my set-up, so follow them.\nIf I want to go deeper, recommend this free video: \"What Does Game-Ready Really Mean? / Game Asset Tips for 3D Artists\" by Ali Cgi: https://www.youtube.com/watch?v=gf5yQQF-d0I\n\nStart now with the first step.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once."}], "handin": [{"en": "SM_Bollard.fbx, SM_Bench.fbx, SM_LampPost.fbx and SM_Bin.fbx (with their UCX boxes)", "uk": "SM_Bollard.fbx, SM_Bench.fbx, SM_LampPost.fbx і SM_Bin.fbx (з їхніми блоками UCX)"}, {"en": "plan_day5.md (your tiers and minute plan, with the real times)", "uk": "plan_day5.md (твої рівні й поминутний план, із реальним часом)"}, {"en": "rubric_day5.md (your ten lines, checked)", "uk": "rubric_day5.md (твої десять рядків, перевірені)"}, {"en": "bronze.png, corner_eye.png and corner_5m.png (Boss evidence)", "uk": "bronze.png, corner_eye.png і corner_5m.png (докази для Дня боса)"}, {"en": "compare_day5.png (each prop beside its real photo; Gold)", "uk": "compare_day5.png (кожен пропс поруч зі своїм справжнім фото; Золото)"}, {"en": "before_after_day5.png", "uk": "before_after_day5.png"}, {"en": "clip_day5.mp4 (60 seconds walking the mannequin round the corner)", "uk": "clip_day5.mp4 (60 секунд: манекен обходить куточок)"}, {"en": "summary.md", "uk": "summary.md"}], "goal": {"en": "By the end of today you have your bollard, bench, lamp post and bin as clean FBX files with collision and simple materials, standing as a small street corner beside the mannequin in Unreal, with a sheet that shows each one beside its real photo.", "uk": "До кінця дня твої стовпчик, лавка, ліхтарний стовп і урна — це чисті файли FBX із колізією та простими матеріалами; вони стоять як маленький куточок вулиці поруч із манекеном в Unreal, а аркуш порівняння показує кожен пропс поруч із його справжнім фото."}, "uses": [{"en": "Day 1: SM_Bollard", "uk": "День 1: SM_Bollard"}, {"en": "Day 2: SM_Bench", "uk": "День 2: SM_Bench"}, {"en": "Day 3: SM_LampPost and the railing section", "uk": "День 3: SM_LampPost і секція поруччя"}, {"en": "Day 4: SM_Bin, Krita, UCX boxes and the clean FBX export", "uk": "День 4: SM_Bin, Krita, блоки UCX і чистий експорт FBX"}], "quiz": [{"q": {"en": "You place your bench at Location Z = 0 on a flat floor at Z = 0, and it floats 3 cm up. What is the likely cause?", "uk": "Ти ставиш лавку на Location Z = 0 на пласку підлогу на Z = 0, а вона висить на 3 см вище. Яка ймовірна причина?"}, "options": [{"en": "The origin sits 3 cm below the bottom of the legs, not at the base", "uk": "Origin на 3 см нижче низу ніжок, а не в основі"}, {"en": "The bench has too many triangles", "uk": "У лавки забагато трикутників"}, {"en": "The material is too rough", "uk": "Матеріал занадто шорсткий"}, {"en": "The bench has no UCX boxes", "uk": "У лавки немає блоків UCX"}], "answer": 0, "explain": {"en": "Unreal puts the origin at the Location you type. If the origin is below the legs, the bench floats by that much.", "uk": "Unreal ставить origin у ту Location, яку ти вводиш. Якщо origin нижче ніжок, лавка висить рівно на цю відстань."}}, {"q": {"en": "Which Edit Mode tool pulls a new leg out of a selected face?", "uk": "Який інструмент Edit Mode витягує нову ніжку з виділеної грані?"}, "options": [{"en": "Inset (I)", "uk": "Inset (I)"}, {"en": "Extrude (E)", "uk": "Extrude (E)"}, {"en": "Loop Cut (Ctrl+R)", "uk": "Loop Cut (Ctrl+R)"}], "answer": 1, "explain": {"en": "Extrude pulls new geometry out of the selected faces. Loop cuts make the faces; inset makes borders.", "uk": "Extrude витягує нову геометрію з виділених граней. Петлеві розрізи створюють грані, а inset робить рамки."}}, {"q": {"en": "You need 20 identical bars in a railing, and the number may change later. What do you use?", "uk": "Тобі потрібно 20 однакових прутів у поруччі, і їхня кількість згодом може змінитися. Що використати?"}, "options": [{"en": "Shift+D twenty times", "uk": "Двадцять разів Shift+D"}, {"en": "The Solidify modifier", "uk": "Модифікатор Solidify"}, {"en": "The Bevel modifier", "uk": "Модифікатор Bevel"}, {"en": "The Array modifier", "uk": "Модифікатор Array"}], "answer": 3, "explain": {"en": "Array repeats a part at a spacing you set, and you can change the Count until you apply it.", "uk": "Array повторює частину з кроком, який ти задаєш, і Count можна змінювати, доки ти не застосуєш модифікатор."}}, {"q": {"en": "What does the name UCX_SM_Bin_00 tell Unreal?", "uk": "Що назва UCX_SM_Bin_00 каже Unreal?"}, "options": [{"en": "It is the bin's lighter version", "uk": "Це легша версія урни"}, {"en": "It is collision for SM_Bin, not a visible part", "uk": "Це колізія для SM_Bin, а не видима частина"}, {"en": "It is a material for the bin", "uk": "Це матеріал для урни"}], "answer": 1, "explain": {"en": "UCX_ marks collision. The rest of the name must match the visible mesh exactly.", "uk": "UCX_ позначає колізію. Решта назви має точно збігатися з назвою видимої сітки."}}, {"q": {"en": "Your lamp's second arm appears 2 m to the side when you add Mirror. Why?", "uk": "Коли ти додаєш Mirror, другий кронштейн твого ліхтаря з'являється за 2 м збоку. Чому?"}, "options": [{"en": "Bevel is above Mirror", "uk": "Bevel стоїть над Mirror"}, {"en": "Mirror always copies 2 m away", "uk": "Mirror завжди копіює на 2 м убік"}, {"en": "The arm's origin is not on the pole's centre line", "uk": "Origin кронштейна не на центральній лінії стовпа"}], "answer": 2, "explain": {"en": "Mirror reflects across the object's origin. With the origin on the pole's centre line, the copy lands on the other side of the pole.", "uk": "Mirror віддзеркалює відносно origin об'єкта. Коли origin на центральній лінії стовпа, копія опиняється з іншого боку стовпа."}}, {"q": {"en": "Which Metallic value fits a painted iron bench frame?", "uk": "Яке значення Metallic пасує фарбованій залізній боковині лавки?"}, "options": [{"en": "1, because iron is a metal", "uk": "1, бо залізо — метал"}, {"en": "0, because you see the paint, not the metal", "uk": "0, бо ти бачиш фарбу, а не метал"}, {"en": "0.5, because it is half metal", "uk": "0.5, бо це наполовину метал"}], "answer": 1, "explain": {"en": "Metallic describes the surface you see. Paint is not metal, so Metallic stays 0.", "uk": "Metallic описує поверхню, яку ти бачиш. Фарба — не метал, тож Metallic лишається 0."}}, {"q": {"en": "Halfway through the Boss an extrude breaks your lamp post, and Ctrl+Z won't go back far enough. What saves you?", "uk": "Посеред Дня боса extrude ламає твій ліхтарний стовп, а Ctrl+Z не повертає досить далеко. Що тебе врятує?"}, "options": [{"en": "Your numbered save, lamp_day5_v01.blend", "uk": "Твоє нумероване збереження lamp_day5_v01.blend"}, {"en": "Exporting to FBX", "uk": "Експорт у FBX"}, {"en": "Turning off Material Preview", "uk": "Вимкнення Material Preview"}], "answer": 0, "explain": {"en": "Numbered saves keep every earlier state. Open the last good version and redo only the last step.", "uk": "Нумеровані збереження зберігають кожен попередній стан. Відкрий останню вдалу версію й повтори лише останній крок."}}, {"q": {"en": "What do you do first in a 4-hour timed Boss?", "uk": "Що робити спершу в Дні боса на 4 години?"}, "options": [{"en": "Start on the Gold details", "uk": "Братися за деталі Золота"}, {"en": "Make the materials perfect", "uk": "Доводити матеріали до ідеалу"}, {"en": "Write a plan with the tiers and a minute budget for each job", "uk": "Написати план із рівнями та бюджетом у хвилинах для кожної задачі"}, {"en": "Take the screenshots", "uk": "Робити скриншоти"}], "answer": 2, "explain": {"en": "A plan makes sure Bronze is safe before you spend time on Silver and Gold.", "uk": "План гарантує, що Бронза в безпеці, перш ніж ти витрачаєш час на Срібло й Золото."}}], "weekInfo": {"week": 1, "title": {"en": "Blender from zero: props at real size", "uk": "Blender з нуля: пропси в реальному розмірі"}, "goal": {"en": "By Friday you have a street-prop set (bollard, bench, lamp post and bin) that you modelled yourself from real photos, exported clean with collision and simple materials, standing at real scale in Unreal.", "uk": "До п'ятниці в тебе є набір вуличних пропсів (стовпчик, лавка, ліхтарний стовп і урна), змодельований власноруч за справжніми фото, чисто експортований із колізією та простими матеріалами, і він стоїть в Unreal у реальному масштабі."}, "skills": [{"en": "3D modelling in Blender from measured photos and drawings", "uk": "3D-моделювання в Blender за обмірними фото й кресленнями"}, {"en": "Hard-surface modelling with Edit Mode tools and modifiers (extrude, inset, loop cut, Array, Mirror, Bevel, Solidify)", "uk": "Hard-surface моделювання (тверді поверхні) інструментами Edit Mode і модифікаторами (extrude, inset, loop cut, Array, Mirror, Bevel, Solidify)"}, {"en": "Game-ready export: real-world scale, pivots, applied transforms, UCX collision and FBX", "uk": "Експорт, готовий до гри: реальний масштаб, півоти, застосовані трансформації, колізія UCX і FBX"}, {"en": "Measured elevation drawings in Krita", "uk": "Обмірні креслення (вид спереду й збоку) у Krita"}, {"en": "Props to a triangle budget with industry naming (SM_, M_, UCX_)", "uk": "Пропси в межах бюджету трикутників і з галузевими назвами (SM_, M_, UCX_)"}]}, "morning": {"sofar": {"en": "In four days you have modelled four street props to real measurements and learned the clean game export with collision.", "uk": "Лише чотири дні — і в тебе вже чотири вуличні пропси за справжніми вимірами та навичка чистого ігрового експорту з колізією."}, "today": {"en": "It is Boss day: your bollard, bench, lamp post and bin become a small street corner in Unreal, with simple materials and a sheet beside real photos.", "uk": "Сьогодні День боса: твої стовпчик, лава, ліхтарний стовп і урна стають невеликим вуличним куточком в Unreal, із простими матеріалами й дошкою порівняння поруч зі справжніми фото."}, "cheer": {"en": "Bronze is built to be within your reach, so lock it in first and climb towards Silver or Gold with whatever time is left.", "uk": "Бронза задумана так, щоб бути тобі під силу, тож спершу здобудь її, а потім піднімайся до Срібла чи Золота, скільки дозволить час."}, "quote": {"text": {"en": "Genius is one percent inspiration, ninety-nine percent perspiration.", "uk": "Геній — це один відсоток натхнення і дев'яносто дев'ять відсотків поту."}, "author": {"en": "Thomas Edison", "uk": "Томас Едісон"}, "source": "https://en.wikiquote.org/wiki/Thomas_Edison"}}, "hasAssets": true, "workPath": "Work\\Assignment\\Day-05-boss-street-props", "mapHref": "../../COURSE.html", "prevHref": "../Day-04-drawings-and-bin/START-HERE.html", "nextHref": "../Day-06-unreal-first-steps/START-HERE.html", "buildPrompt": "You are my build coach for this afternoon in Blender, Krita and Unreal Engine 5.8. I use Blender 5.x (latest stable) and Unreal Engine 5.8 on Windows. Speak Ukrainian with me; keep menu names, tool names and shortcuts in English. Don't do the work for me and don't write code. Keep me moving and make it feel like a game.\n\nToday I build on my own: The whole street-prop set, finished and placed, on your own and timed (start a 4-hour timer).\nIt's part of: Your street-prop set: bollard, bench, lamp post and bin, clean and at real scale in Unreal (A practice street corner in Course/Day05; later, the waterfront promenade of your island (district 1).).\n\nSpec:\n- All four props as FBX with UCX collision: SM_Bollard, SM_Bench, SM_LampPost and SM_Bin, each at real size, with its origin at the base centre, transforms applied and triangles within budget.\n- Simple materials from the photos on each prop (Base Color, Roughness and Metallic), named with M_, for example M_Bench_Iron and M_Bench_Timber.\n- In Unreal (Course/Day05): all four on the floor beside the mannequin, nothing floating or sunk, placed like a real street corner: three bollards about 1.5 m apart in a line, the bench behind them facing out, the bin beside the bench and the lamp post behind.\n- corner_eye.png and corner_5m.png: the corner from eye height and from about 5 m up.\n- compare_day5.png: a Krita sheet with each prop's Unreal screenshot beside its real photo (Gold).\n- rubric_day5.md: ten yes or no lines, checked with the tutor.\n\nMy checklist:\n1. Start a 4-hour timer. Open plan_day5.md from lesson 1 and check your minute plan: Bronze by hour 2, Silver by hour 3, Gold in hour 4. Check: the plan names every job and its minutes. (from lesson 1)\n2. Lamp post: Save As lamp_day5_v01.blend, add UCX boxes (pole, base, and one for the arm and lantern), named UCX_SM_LampPost_00 and up, and export SM_LampPost.fbx. Check: three or four boxes, all with the lamp's origin. (from day 4, lesson 3)\n3. Bench: if you didn't finish it in lesson 2, add UCX boxes (one for the seat and back, one per side frame) and export SM_Bench.fbx. Check: the boxes leave the space under the seat open. (from day 4, lesson 4)\n4. Import the lamp post and the bench into Course/Day05, then import SM_Bollard.fbx and SM_Bin.fbx from Day 4 there too. Open each in the Static Mesh Editor and compare Approx Size with your sizes files. Check: every size is within 10 % of your notes. (from day 4, lesson 4)\n5. Place all four beside the mannequin with End and walk past them in Play. Bronze check: save L_Day05 (Ctrl+S) and take bronze.png. Check: nothing floats, nothing sinks, and each prop looks the right size next to the mannequin. (from lesson 3)\n6. Materials: give the bollard, the lamp post and the bin simple materials from their photos (for example dark painted iron, Roughness 0.5, Metallic 0; galvanised steel, Roughness 0.4, Metallic 1). Save each file as _v02. Check: in Material Preview, each prop looks like its photo in colour and shine. (from lesson 2)\n7. Export each prop again with the same file name and right-click each mesh in Unreal > Reimport. Check: the props in the level show their new colours. (from lesson 2)\n8. Arrange the street corner: three bollards 1.5 m apart (Location X 0, 150, 300), the bench behind them facing out, the bin 0.5 m beside the bench and the lamp post about 1 m behind. Check: from above it reads as a tidy pavement corner. (from lesson 3)\n9. Silver check: take corner_eye.png from about 1.7 m high and corner_5m.png from about 5 m up. Check: both screenshots show all four props clearly. (from lesson 3)\n10. Gold: make compare_day5.png in Krita: for each prop, your best photo beside your Unreal screenshot, both the same height. Write one line under each pair. Check: four pairs, and in each pair the proportions match. (from lesson 3)\n11. Gold: make the railing section clean too: rename it SM_RailingSection, add UCX boxes (one per post, one for the rails and bars) and a material, export SM_RailingSection.fbx, import it and place it along the back of the corner. Check: it stands on the floor and reaches about the mannequin's waist. (from day 4, lesson 4)\n12. Self-review: fill in rubric_day5.md line by line with the tutor and fix the worst 'no' first. Check: every line has a yes or a no, and the worst fault is fixed. (from lesson 4)\n13. Captures: before_after_day5.png (your Day 1 bollard in Blender beside the finished corner in Unreal) and a 60-second clip walking the mannequin round the corner. Save today's clip as clip_day5.mp4. Check: both files are in today's Work folder. (from day 0, lesson 1)\n\nToday is a BOSS build: help me keep time against the tiers below. Tiers:\n- Bronze: all four props exported as FBX with UCX boxes, imported into Course/Day05, each within 10 % of its real size and standing on the floor beside the mannequin.\n- Silver: Bronze, plus simple materials from photos on every prop, the props placed as a believable street corner, and the two corner screenshots.\n- Gold: Silver, plus compare_day5.png (each prop beside its real photo), the railing section clean and placed, and every rubric line a yes, all within 4 hours.\n\nHow to help: first ask which checklist step I'm on. When I'm stuck or send a screenshot, compare it with the spec and the checklist and give me only the next step. Every hour, ask how far I've got. At the end, go through every spec point with me and tell me which tier I reached.\n\nStart by asking which step I'm on.\n\nTone: treat me as a respected junior game developer. Celebrate what I get right, and never call anything a failure. If I struggle, split the step into smaller ones until I succeed; unfinished work simply carries on tomorrow.\n\nUkrainian grammar: use forms that fit anyone (imperatives and the present tense). If a sentence really needs my gender, ask me once.", "reportPrompt": "Help me write today's summary.md. Talk to me in Ukrainian, but write the summary itself in English, exactly in the format below.\nAsk me, one at a time: my lesson receipts (I'll paste them), which lessons I skipped, how far the build got, my score in the page's Check yourself quiz, the files I made, what Thalia should look at, any question for Thalia, and my hours.\nThen give me the finished summary in one block I can copy:\n\nTeam summary, <date>, Anna\nDay 5: Boss: your street-prop set in Unreal, at real scale. Lessons done: <numbers>; skipped: <numbers>. Build: <done / partly / blocked>; boss tier: <bronze / silver / gold / none>; quiz: <score> of 8\nMade: <file names>\nTo look at: <screenshots, the before/after capture, the fly-through clip>\nQuestion for Thalia: <one line, or \"none\">\nHours: <about N>\nTo revisit: <the \"Hard\" lines from my receipts>"}</script>

const lk=s=>esc(s).replace(/https?:\/\/[^\s<']*[^\s<.,;:)']/g,m=>'<a href="'+m+'" target="_blank" rel="noopener">'+m+'</a>');
function list(a,tag,cls){return '<'+tag+(cls?' class="'+cls+'"':'')+'>'+(a||[]).map(i=>'<li>'+lk(x(i))+'</li>').join('')+'</'+tag+'>'}
const lab=(t,k)=>'<div class="lab'+(k?' k-'+k:'')+'"><span class="dotc"></span>'+t+'</div>';
const kn=n=>'<span class="kn">'+ic(n)+'</span>';
const slider=p=>'<div class="slider"><i style="width:calc('+p+'% - 6px)"></i><b style="left:clamp(13px,'+p+'%,calc(100% - 13px))"></b></div>';
function quiz(){if(!D.quiz||!D.quiz.length)return '';const a=st.qa||{};let ok=0;const L=u('letters');
 const pips='<div class="pips well" aria-hidden="true">'+D.quiz.map((q,i)=>'<i class="'+(a[i]==null?'':a[i]===q.answer?'r':'w')+'"></i>').join('')+'</div>';
 const qs=D.quiz.map((q,i)=>{const c=a[i];if(c===q.answer)ok++;return '<div class="qz"><p class="qq"><span class="qn">'+(i+1)+'</span><span>'+lk(x(q.q))+'</span></p>'+q.options.map((o,k)=>{let cls='opt',mk='<span></span>';if(c!=null){if(k===q.answer){cls+=' right';mk=ic('check','mk')}else if(k===c){cls+=' wrong';mk=ic('x','mk')}}return '<button class="'+cls+'" id="o'+i+'_'+k+'"'+(c!=null?' disabled':'')+' onclick="pick('+i+','+k+')"><span class="lt">'+(L[k]||k+1)+'</span><span>'+esc(x(o))+'</span>'+mk+'</button>'}).join('')+(c!=null?'<p class="exp '+(c===q.answer?'r':'w')+'" id="e'+i+'" tabindex="-1"><b>'+(c===q.answer?u('right'):u('wrong'))+'</b>'+lk(x(q.explain))+'</p>':'')+'</div>'}).join('');
 return '<section class="card glass quiz">'+lab(u('quiz'),'gold')+'<p class="muted" style="margin:-6px 0 14px">'+u('quizSub')+'</p>'+pips+qs+(qDone()?'<div class="score well" role="status"><span class="eyebrow">'+u('score')+'</span><span class="lcd" aria-label="'+ok+' / '+D.quiz.length+'">'+seg(ok+'/'+D.quiz.length)+'</span><div class="row"><button class="btn ghost" id="retry" onclick="retry()">'+u('retry')+'</button></div></div>':'')+'</section>'}
function vid(v){if(!v)return '';const link=v.url?'<a href="'+esc(v.url)+'" target="_blank" rel="noopener">'+esc(x(v.title)||v.url)+'</a>'+(v.channel?' <span class="muted">· '+esc(v.channel)+(v.length?' · '+esc(v.length):'')+'</span>':''):'';const s=v.search?'<a href="https://www.youtube.com/results?search_query='+encodeURIComponent(v.search)+'" target="_blank" rel="noopener">'+u('noVid')+': '+esc(v.search)+'</a>':'';const alt=v.alt&&v.alt.url?'<br><span class="eyebrow">UA</span> <a href="'+esc(v.alt.url)+'" target="_blank" rel="noopener">'+esc(v.alt.title||v.alt.url)+'</a>'+(v.alt.channel?' <span class="muted">· '+esc(v.alt.channel)+'</span>':''):'';return '<div class="vid well">'+kn('play')+'<div><b>'+u('more')+'?</b><br>'+(link||s)+alt+(link&&s?'<br><span class="muted" style="font-size:14px">'+s+'</span>':'')+'</div></div>'}
function morning(){const m=D.morning;if(!m)return '';const q=m.quote||{};
 let shelf='';if(D.day>0){shelf='<div class="shelf" aria-hidden="true">';let g='';for(let d=0;d<D.day;d++){let p=0;try{p=(JSON.parse(localStorage.getItem('devteam:'+D.learner+':'+d))||{}).pct||0}catch(e){}g+='<i class="'+(p>=1?'d':'')+(d>0&&d%5===0?' bs':'')+'"></i>';if(d%5===0||d===D.day-1){shelf+='<span class="wkg">'+g+'</span>';g=''}}shelf+='</div>'}
 const qt=lang==='uk'&&q.original?q.original:x(q.text);
 return '<section class="card glass morning"><div class="mgrid">'+(m.sofar?'<div>'+lab(u('sofar'),'gold')+shelf+'<p class="mtxt">'+lk(x(m.sofar))+'</p></div>':'')+(m.today?'<div>'+lab(u('todayL'))+'<p class="mtxt">'+lk(x(m.today))+'</p></div>':'')+'</div>'+(m.cheer?'<p class="cheer">'+esc(x(m.cheer))+'</p>':'')+(qt?'<figure class="quote well">'+kn('quote')+'<blockquote>'+esc(qt)+'</blockquote>'+(q.author?'<figcaption>'+esc(x(q.author))+'</figcaption>':'')+'</figure>':'')+'</section>'}
function setLang(l){lang=l;try{localStorage.setItem('devteam:lang',lang)}catch(e){};render()}
function toggleLang(){setLang(lang==='uk'?'en':'uk')}
/* keep open sections and keyboard focus across re-renders */
const openD=new Set();
function tg(e){if(e.open)openD.add(e.id);else openD.delete(e.id)}
const op=id=>openD.has(id)?' open':'';
function render(){const ae=document.activeElement,fid=ae&&(ae.id||(ae.getAttribute('data-th')?'th-'+ae.getAttribute('data-th'):ae.getAttribute('lang')&&ae.closest('.seg')?'lg-'+ae.getAttribute('lang'):''));
 st.pct=prog();save();document.documentElement.lang=lang==='uk'?'uk':'en';document.title=u('day')+' '+D.day+' · '+x(D.title);
 const b=D.build,P=Math.round(prog()*100);
 document.getElementById('top').innerHTML='<div class="topin glass"><a class="maplink" href="'+esc(D.mapHref)+'">'+kn('map')+u('map')+'</a><div class="crumb"><b>'+esc(x(D.learnerName))+'</b><span>'+u('week')+' '+D.week+'</span><span>'+u('day')+' '+D.day+' '+u('of')+' '+D.total+'</span></div>'+controls(lang,'setLang')+'</div><div class="tline"><i style="width:'+P+'%"></i></div>';
 const state=w=>w<D.week?'b':w===D.week?'n':'p';
 let h='<section class="hero"><div><div class="chips"><span class="chip"><i></i>'+u('week')+' '+D.week+'</span><span class="chip">'+u('day')+' '+D.day+' / '+D.total+'</span>'+(isFin?'<span class="chip fi"><i></i>'+u('finale')+'</span>':isBoss?'<span class="chip bo"><i></i>'+u('bossDay')+'</span>':'')+'</div>';
 h+='<h1>'+esc(x(D.title))+'</h1><p class="sub">'+esc(x(D.theme))+'</p><div class="meter"><div style="flex:1" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+P+'" aria-label="'+P+'%">'+slider(P)+'</div><span class="lcd sm">'+seg(P)+'%</span></div></div><div class="chart">'+island(state,P/100,enc(P/100,'encDay'))+(P>=100?'<div class="seal" aria-hidden="true">'+ic('check')+'</div>':'')+'</div></section>';
 h+=fbCard();h+=morning();
 if(D.weekInfo){const w=D.weekInfo;h+='<section class="card glass week">'+lab(u('weekGoal')+' · '+u('week')+' '+D.week)+(w.title?'<p class="weekt">'+esc(x(w.title))+'</p>':'')+'<p class="lead">'+lk(x(w.goal))+'</p>'+(w.skills&&w.skills.length?'<details id="d-sk" ontoggle="tg(this)"'+op('d-sk')+'><summary>'+u('skills')+ic('chev','chev')+'</summary>'+list(w.skills,'ul','ticks')+'</details>':'')+'</section>'}
 h+='<section class="card glass mission">'+lab(u('mission'),'gold')+(D.goal?'<div class="daygoal well">'+kn('flag')+'<p class="lead">'+lk(x(D.goal))+'</p></div>':'')+(D.uses&&D.uses.length?'<div class="uses"><span class="eyebrow">'+u('uses')+'</span>'+D.uses.map(v=>'<span class="u">'+lk(x(v))+'</span>').join('')+'</div>':'')+'<h2>'+lk(x(b.item))+'</h2><p>'+lk(x(b.why))+'</p><div class="split"><div><h3>'+u('where')+'</h3><p>'+lk(x(b.where))+'</p></div><div><h3>'+u('spec')+'</h3>'+list(b.spec,'ul','ticks')+'</div></div>'+(b.picture?'<img class="pic" src="'+esc(b.picture)+'" alt="">':'')+(D.hasAssets?'<p class="files">'+ic('folder')+u('files')+'</p>':'')+'</section>';
 h+='<section class="card glass">'+lab(u('how'))+'<ol class="how"><li class="well">'+u('how1')+'</li><li class="well">'+u('how2')+'</li><li class="well">'+u('how3')+'</li><li class="well">'+u('how4')+'</li></ol><p class="tip">'+ic('spark')+'<span>'+u('tip')+'</span></p></section>';
 D.lessons.forEach((l,i)=>{const done=!!st['q'+i];h+='<section class="card glass quest'+(done?' done':'')+'"><div><div class="qnum" aria-hidden="true">'+(done?ic('check'):String(i+1).padStart(2,'0'))+'</div></div><div><div class="qmeta"><span class="eyebrow">'+u('quest')+' '+(i+1)+' · '+l.minutes+' '+u('min')+'</span></div><h2>'+esc(x(l.title))+'</h2><h3>'+u('goals')+'</h3>'+list(l.goals,'ul','ticks')+'<div class="row"><button class="btn" onclick="cp(D.lessons['+i+'].prompt)">'+ic('copy')+u('copyL')+'</button><button class="sw" id="L'+i+'" aria-pressed="'+done+'" onclick="st.q'+i+'=!st.q'+i+';save();render()"><span class="tr"></span>'+u('done')+'</button></div>'+(l.doalong&&l.doalong.length?'<details id="d-do'+i+'" ontoggle="tg(this)"'+op('d-do'+i)+'><summary>'+ic('users')+u('doalong')+ic('chev','chev')+'</summary>'+list(l.doalong,'ol','steps')+'</details>':'')+vid(l.video)+'</div></section>'});
 const C=b.steps.length,cn=b.steps.filter((s,i)=>st['c'+i]).length,M=['m0','m1','m2'];
 h+='<section class="card glass build'+(isBoss?' bossday':'')+'">'+lab(u('boss')+(isBoss?' · '+u('bossDay'):''),isBoss?'boss':'')+'<h2>'+esc(x(b.piece2))+'</h2><p class="muted">'+u('bossSub')+'</p>'+(isBoss?'<h3>'+u('tiers')+'</h3><ul class="tiers">'+b.boss.map((t,i)=>{const m=x(t).match(/^([^:]{2,24}):\s*(.*)$/);return '<li><div class="medal '+M[Math.min(i,2)]+'"><i></i>'+(m?esc(m[1]):'')+'</div>'+lk(m?m[2]:x(t))+'</li>'}).join('')+'</ul>':'')+'<div class="ccount">'+slider(C?Math.round(cn/C*100):0)+'<span class="lcd sm">'+seg(cn+'/'+C)+'</span></div><ul class="check">'+b.steps.map((s,i)=>'<li'+(st['c'+i]?' class="on"':'')+'><label><input type="checkbox" id="c'+i+'" '+(st['c'+i]?'checked':'')+' onchange="st.c'+i+'=this.checked;save();render()"><span class="tx">'+lk(x(s.text))+'</span>'+(s.lesson?'<span class="ln">'+tagTxt(s.lesson)+'</span>':'')+'</label></li>').join('')+'</ul><div class="row"><button class="btn b" onclick="cp(D.buildPrompt)">'+ic('copy')+u('copyB')+'</button></div></section>';
 h+=quiz();
 h+='<section class="card glass ship">'+lab(u('ship'),'ok')+'<h3 style="margin-top:0">'+u('handin')+'</h3>'+list(D.handin,'ul','ticks')+'<p class="path">'+ic('folder')+'<span>'+u('shipTo')+' <code>'+esc(D.workPath)+'</code></span></p>'+(D.lessons.length?'<p class="clip">'+ic('film')+'<span>'+u('clip')+'</span></p>':'')+'<p class="muted">'+u('report')+'</p><div class="row"><button class="btn s" onclick="cp(D.reportPrompt)">'+ic('copy')+u('copyR')+'</button></div></section>';
 h+='<nav class="nav">'+(D.prevHref?'<a class="glass" href="'+esc(D.prevHref)+'">'+kn('left')+u('prev').replace(/^←\s*/,'')+'</a>':'')+(D.nextHref?'<a class="glass nx" href="'+esc(D.nextHref)+'">'+u('next').replace(/\s*→$/,'')+kn('right')+'</a>':'')+'</nav>';
 document.getElementById('app').innerHTML=h;
 if(fid){let e=document.getElementById(fid);if(!e&&fid.startsWith('th-'))e=document.querySelector('[data-th="'+fid.slice(3)+'"]');if(!e&&fid.startsWith('lg-'))e=document.querySelector('.seg [lang="'+fid.slice(3)+'"]');if(e&&!e.disabled)e.focus({preventScroll:true})}}
render();
</script>
